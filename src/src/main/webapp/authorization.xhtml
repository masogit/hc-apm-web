<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="ActiveDlg" widgetVar="ActiveDlg" width="650" height="480" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.WelcomeToAPMManagementPlatform}" closable="false">
        <h:form id = "ActiveForm">
            <p:fieldset id="changePassword" legend="#{msg.FirstUserLoginActivation}" >
                <p:scrollPanel style="width:580px;height:300px" mode="native">
                    <p>为明确双方的权利和义务， 用户启用本服务前，须仔细阅读本协议服务条款。</p>
                    <p>#{msg.Lisence1}</p>
                    <p>#{msg.Lisence2}</p>
                    <p>#{msg.Lisence11}</p>
                    <p>#{msg.Lisence12}</p>
                    <p>#{msg.Lisence13}</p>
                    <p>#{msg.Lisence14}</p>
                    <p>#{msg.Lisence15}</p>
                </p:scrollPanel>
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <p:selectManyCheckbox id="basic" value="#{userAccountController.items}">
                        <p:ajax update="ActiveForm" listener="#{userAccountController.updateAgree()}"/>
                        <f:selectItem itemLabel="#{msg.AgreementAndConfirmToActivateTheAccountNotice}" itemValue="1" />
                    </p:selectManyCheckbox>
                </p:panelGrid>
            </p:fieldset>
            <p:commandButton value="#{msg.Activate}" actionListener="#{userAccountController.confirmActivation()}" icon="ui-icon-home"
                             oncomplete="handleSubmit(args, 'ActiveDlg');" disabled="#{!userAccountController.agree}"/>
            <p:commandButton value="#{msg.Logout}" actionListener="#{userAccountController.logout()}" icon="ui-icon-power-settings-new"/>
        </h:form>
    </p:dialog>

    <script>
        activeFunction = function () {
            var isActive = "#{userContextService.isActive()}";
            if(isActive == '1'){
                PF('ActiveDlg').show();
            }
        }
    </script>
</ui:composition>
</html>
