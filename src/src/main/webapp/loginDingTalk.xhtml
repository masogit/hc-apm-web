<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<f:view xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        contentType="text/html"
        encoding="UTF-8"
        transient="true">
    <html lang="en">

    <h:head>
        <meta charset="UTF-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>auto login</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }

            iframe {
                border: none;
            }

        </style>
    </h:head>

    <h:body>
        <div style="width:100%;height:100vh;overflow: hidden;">
        </div>
        <script src="./portal/js/axios.min.js"></script>
        <script>
            window.onload = function () {
                    let origin = location.origin;
                    let search = location.search;
                    let params = new URLSearchParams(search)
                    let state = params.get('state');
                    let code = params.get('code')
                    let url =origin+"/geapm/web/dingTalk/ssoLogin";
                    axios.post(url, {
                        code: code
                    }).then(res=>{
                    console.log(res);
                    let jsessionid = res.headers.jsessionid
                    document.cookie = "JSESSIONID="+jsessionid;
                    let page="";
                    if(state==1){
                          page="/geapm/portal/homeNurse1.xhtml";
                    }else{
                          page=state;
                    }
                    window.location.href=origin+page;
                    });
            }
        </script>
    </h:body>
    </html>
</f:view>
