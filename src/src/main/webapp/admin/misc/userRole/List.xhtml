<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">

                <p align="center">
                    <b>#{msg.UserRole}</b>
                </p>
            <h:form id="UserRoleListForm">
                <p:dataTable id="datalist" value="#{userRoleCrudController.lazyModel}" var="item" widgetVar="varDataList"
                    selectionMode="single" selection="#{userRoleCrudController.selected}"
                    lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                    rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                    paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                    currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                    rows="20" emptyMessage="#{msg.noRecordFound}"
                    rowsPerPageTemplate="20,50,100,500">

                    <p:ajax event="rowSelect" update="createButton editButton viewButton deleteButton"/>
                    <p:ajax event="filter" listener="#{userRoleCrudController.onFilter}" update="createButton editButton viewButton deleteButton"/>
                    
                    <p:column headerText="#{msg.id}" sortBy="#{item.id}" filterBy="#{item.id}" filterMatchMode="EQ">
                        <h:outputText value="#{item.id}"/>
                    </p:column>
                    <p:column headerText="#{msg.userId}" sortBy="#{item.userId}" filterBy="#{item.userId}" filterMatchMode="EQ">
                        <h:outputText value="#{item.userId}"/>
                    </p:column>
                    <p:column headerText="#{msg.roleId}" sortBy="#{item.roleId}" filterBy="#{item.roleId}" filterMatchMode="EQ">
                        <h:outputText value="#{item.roleId}"/>
                    </p:column>
                    <f:facet name="{Toolbar}">
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-file-download" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist" fileName="UserRole_export"/>
                        </p:commandButton>
                        <p:commandButton id="createButton" icon="ui-icon-plus" title="#{msg.Create}" actionListener="#{userRoleCrudController.prepareCreate}" update=":UserRoleEditDlg" oncomplete="PF('UserRoleEditDialog').show()"/>
                        <p:commandButton id="viewButton" icon="ui-icon-search" title="#{msg.View}" actionListener="#{userRoleCrudController.prepareView}" update=":UserRoleViewDlg" oncomplete="PF('UserRoleViewDialog').show()" disabled="#{empty userRoleCrudController.selected}"/>
                        <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{userRoleCrudController.prepareEdit}" update=":UserRoleEditDlg" oncomplete="PF('UserRoleEditDialog').show()" disabled="#{empty userRoleCrudController.selected}"/>
                        <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{userRoleCrudController.delete}" update="datalist" disabled="#{empty userRoleCrudController.selected}">
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>

            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>

            </div>
        </div>

        
    </ui:define>

</ui:composition>
