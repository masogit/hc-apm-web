<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Import Asset Group Secondary</ui:define>

    <ui:define name="content">
        <h:form id="searchForm">
            <h:panelGrid id="searchPanel" columns="10">
                <p:selectOneMenu value="#{tenantPasswordController.tenantUid}">
                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                    <f:selectItems value="#{assetGroupSecondaryImportController.tenantInfos}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
<!--                    <p:ajax listener="#{tenantPasswordController.onSelectTenant()}"-->
<!--                            event="change" update="datalist" process="@this"/>-->
                </p:selectOneMenu>


            </h:panelGrid>
            <p:fileUpload  id="fileUpload" fileUploadListener="#{assetGroupSecondaryImportController.uploadDataFile}" value="#{AssetGroupSecondaryImportController.file}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                           multiple="false" sizeLimit="10000000" update="" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(xls|xlsx)$/" label="导入" rendered="#{empty AssetGroupSecondaryImportController.file}" />

        </h:form>


    </ui:define>

</ui:composition>
