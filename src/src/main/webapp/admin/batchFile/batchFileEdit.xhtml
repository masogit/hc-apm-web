<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <h:form id="BatchFileImportEditForm">
            <p:fieldset  id="editSet" legend="#{msg.add}" style="margin-bottom:20px" rendered="#{empty batchFileController.selected.id}" >
                
                <h:panelGroup >
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                        <h:panelGroup>
                            <label class="label">#{msg.fileType}*</label>
                            <p:selectOneMenu id="fileType" value="#{batchFileController.fileType}"  required="true" requiredMessage="#{msg.fileType} #{msg.ValidationRequire}">
                                <p:ajax process="@this"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('batchFileType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <p:panel id="uploadPanel" styleClass="ui-panelgrid-blank" style=" border: 0">
                            <h:panelGroup>
                                <p:fileUpload fileUploadListener="#{batchFileController.uploadDataFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this fileType"
                                              multiple="true" sizeLimit="10000000" update="uploadedList" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  label="#{msg.Add}"  />
                                <!--<p:growl id="messages" showDetail="true" />-->
                            </h:panelGroup>
                            <p:dataList id="uploadedList" value="#{batchFileController.fileList}" var="item" varStatus="itemIndex" rowIndexVar="idx" emptyMessage="#{msg.noRecordFound}">

                                #{fieldMsg.fieldValue('batchFileType', item._1().fileType)}/#{item._1().fileName}
                                <p:commandLink value="#{msg.delete}"  actionListener="#{batchFileController.removeFile(idx)}" update="uploadedList"/>
                            </p:dataList>

                        </p:panel>
                    </p:panelGrid>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{batchFileController.saveFiles}" value="#{msg.Save}" update=":BatchFileImportForm:datalist, :growl :BatchFileImportEditForm" icon="ui-icon-check" />
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{batchFileController.cancel}" update=":BatchFileImportEditForm fileType :growl"/>
                    </h:panelGroup>

                </h:panelGroup>
            </p:fieldset>
            <p:fieldset  id="viewSet" legend="#{msg.view}" style="margin-bottom:20px" rendered="#{not empty batchFileController.selected.id}">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                    <h:panelGroup>
                        <label class="label">#{msg.BatchFileName}*</label>
                        <h:outputText value="#{batchFileController.selected.fileName}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.BatchfileType}*</label>
                        <h:outputText value="#{fieldMsg.fieldValue('batchFileType', batchFileController.selected.fileType)}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.BatchfileUploadedTime}*</label>
                        <h:outputText value="#{batchFileController.selected.uploadedTime}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                        </h:outputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.BatchfileCreatorUID}*</label>
                        <h:outputText value="#{batchFileController.getUserName(batchFileController.selected.creatorUID)}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.BatchfileStatus}*</label>
                        <h:outputText value="#{fieldMsg.fieldValue('batchFileProcessStatus',batchFileController.selected.status)}"/>
                        <p:commandLink value="重试"  actionListener="#{batchFileController.restartBatchJob()}"  rendered="#{batchFileController.selected.status ne 'STARTING' }" 
                                       update=":BatchFileImportForm:datalist, :growl :BatchFileImportEditForm" immediate="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.BatchfileProcessStartTime}*</label>
                        <h:outputText value="#{batchFileController.selected.processStartTime}" >
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                        </h:outputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.BatchfileProcessEndTime}*</label>
                        <h:outputText value="#{batchFileController.selected.processEndTime}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                        </h:outputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:commandButton  value="刷新" immediate="true"  actionListener="#{batchFileController.refreshData()}" update=":BatchFileImportForm:datalist, :growl :BatchFileImportEditForm"/>
                    </h:panelGroup>

                </p:panelGrid>
                <p:panelGrid columns="1" styleClass="ui-panelgrid-blank form-group">
                    
                        <!--<label class="label">#{msg.logs}*</label>-->
                    <p:inputTextarea label="#{msg.logs}*" value="#{batchFileController.selected.logs}" readonly="true"  cols="100"/>
                </p:panelGrid>
            </p:fieldset>
        </h:form>

    </ui:composition>
</html>
