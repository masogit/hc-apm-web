<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Setup Tenant Initial Password</ui:define>

    <ui:define name="content">
        <h:form id="searchForm">
            <h:panelGrid id="searchPanel" columns="10">
                <p:selectOneMenu value="#{tenantPasswordController.selected.uid}" onchange="tenantPasswordController.changeTenant()">
                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                    <f:selectItems value="#{tenantPasswordController.tenantInfos}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                </p:selectOneMenu>

                <p:commandButton value="Execute" update=":listForm :growl" actionListener="#{tenantPasswordController.updateUserAccountPasswordWithTenantPassword}"/>
            </h:panelGrid>

        </h:form>

        <h:form id="listForm">
            <p:dataTable id="datalist" value="#{tenantPasswordController.userAccountListBySelectedTenant}" var="item" widgetVar="varDataList"
                         selectionMode="single"
                         lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                         rowKey="#{item.hashCode()}" sortMode="single" sortOrder="descending"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rows="20" emptyMessage="#{msg.noRecordFound}" scrollable="true" scrollWidth="1000" resizableColumns="false"
                         rowsPerPageTemplate="20,50,100,500">

                <p:column headerText="登录名" >
                    <h:outputText value="#{item.loginName}"/>
                </p:column>

            </p:dataTable>

        </h:form>
    </ui:define>

</ui:composition>
