<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition>
        <h:form id="BatchFileImportEditForm">
            <p:fieldset  id="editSet" legend="#{msg.add}" style="margin-bottom:20px" rendered="#{empty coilOpportunityImageEditController.selected.id}" >
                <h:panelGroup >
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.fileType}*</label>
                            <p:selectOneMenu id="fileType" value="#{coilOpportunityImageEditController.gamePlanFileType}"  required="true" requiredMessage="#{msg.fileType} #{msg.ValidationRequire}">
                                <p:ajax process="@this"/>
                                <f:selectItems value="#{coilOpportunityImageEditController.gamePlanBatchFileType}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <p:panel id="uploadPanel" styleClass="ui-panelgrid-blank" style=" border: 0">
                            <h:panelGroup>
                                <p:fileUpload allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{coilOpportunityImageEditController.uploadGamePlanDataFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this fileType"
                                              multiple="true" sizeLimit="20000000" update="uploadedList" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}20M"  label="#{msg.Add}"  />
                            </h:panelGroup>
                            <p:dataList id="uploadedList" value="#{coilOpportunityImageEditController.fileList}" var="item" varStatus="itemIndex" rowIndexVar="idx" emptyMessage="#{msg.noRecordFound}">
                                #{fieldMsg.fieldValue('gamePlanBatchFileType', item._1().fileType)}/#{item._1().fileName}
                                <p:commandLink value="#{msg.delete}"  actionListener="#{coilOpportunityImageEditController.removeFile(idx)}" update="uploadedList"/>
                            </p:dataList>
                        </p:panel>
                    </p:panelGrid>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{coilOpportunityImageEditController.saveFiles}" value="#{msg.Save}" update=":BatchFileImportForm:datalist, :growl :BatchFileImportEditForm" icon="ui-icon-check" />
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{coilOpportunityImageEditController.cancel}" update=":BatchFileImportEditForm fileType :growl"/>
                    </h:panelGroup>
                </h:panelGroup>
            </p:fieldset>
        </h:form>
    </ui:composition>
</html>
