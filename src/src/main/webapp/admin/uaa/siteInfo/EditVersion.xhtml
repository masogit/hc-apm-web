<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>

	<p:dialog id="SiteInfoEditVersionDlg" widgetVar="SiteInfoEditVersionDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="修改版本信息"
		width="700px" height="600px;">
		<p:ajax event="close" update=":SiteInfoListForm:datalist" />
		<h:form id="SiteInfoEditVersionForm" rendered="#{tenantInfoController.selected != null}">
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
				<h:panelGroup>
					<label class="label">版本</label>
					<p:selectOneMenu value="#{tenantInfoController.tenantConfig.edition}">
						<p:ajax update=":SiteInfoEditVersionForm"></p:ajax>
						<f:selectItems value="#{fieldMsg.getFieldValueList('tenantVersion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
					</p:selectOneMenu>
				</h:panelGroup>
			</p:panelGrid>
			<p:scrollPanel style="height: 500px; border: 0;" mode="native">
				<p:tree id="tenantConfigTreeTable" class="tree" value="#{tenantInfoController.tenantConfig.root}" var="item" dynamic="true" cache="false" selectionMode="checkbox" highlight="true">
					<p:ajax event="select" listener="#{tenantInfoController.tenantConfig.onSelectTenantConfig}" />
                    <p:ajax event="unselect" listener="#{tenantInfoController.tenantConfig.onUnSelectTenantConfig}" />
					<p:treeNode type="tenantConfigTree">
                        <h:outputText value="#{item.label}"/>
                    </p:treeNode>
				</p:tree>
			</p:scrollPanel>
			
			<br />
			<p:commandButton validateClient="true" actionListener="#{tenantInfoController.save}" value="#{msg.Save}" update=":growl" icon="ui-icon-check"
				oncomplete="handleSubmit(args, 'SiteInfoEditVersionDialog');" />
                   &nbsp;&nbsp;
                   <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" type="button" icon="ui-icon-cancel"
				onclick="PF('SiteInfoEditVersionDialog').hide()" />
		</h:form>
	</p:dialog>

</ui:composition>
</html>
