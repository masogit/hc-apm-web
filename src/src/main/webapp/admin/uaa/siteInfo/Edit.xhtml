<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
<!--新增 医联体/租户信息-->
        <p:dialog id="SiteInfoEditDlg" widgetVar="SiteInfoEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{tenantInfoController.CRUDActionName} #{msg.SiteInfo}" width="780" >
            <p:ajax event="close" update=":SiteInfoListForm:datalist" />
            <h:form id="SiteInfoEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{tenantInfoController.selected != null}">
                        <h:panelGroup>
                            <label class="label">#{msg.name}*</label>
                            <p:inputText id="name" value="#{tenantInfoController.selected.name}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.nameEn}</label>
                            <p:inputText id="nameEn" value="#{tenantInfoController.selected.nameEn}" />
                        </h:panelGroup>
                        <h:panelGroup rendered="false">
                            <label class="label">#{msg.aliasName}</label>
                            <p:inputText id="aliasName" value="#{tenantInfoController.selected.aliasName}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.siteDescription}</label>
                            <p:inputText id="description" value="#{tenantInfoController.selected.description}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.contactPerson}</label>
                            <p:inputText id="contactPerson" value="#{tenantInfoController.selected.contactPerson}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.contactPhone}</label>
                            <p:inputText id="contactPhone" value="#{tenantInfoController.selected.contactPhone}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.contactEmail}</label>
                            <p:inputText id="contactEmail" value="#{tenantInfoController.selected.contactEmail}" validatorMessage="#{msg.invalidEmail}"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">合同号</label>
                            <p:inputText id="contractNo" value="#{tenantInfoController.selected.contractNo}" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.location}</label>
                            <p:inputText id="location" value="#{tenantInfoController.selected.location}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.defaultLang}</label>
                            <p:selectOneMenu value="#{tenantInfoController.selected.defaultLang}">
                                <f:selectItem itemLabel="zh" itemValue="zh"/>
                                <f:selectItem itemLabel="en" itemValue="en"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.tenantType}</label>
                            <p:selectOneMenu value="#{tenantInfoController.selected.type}">
                                <f:selectItems value="#{fieldMsg.getFieldValueList('tenantType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">版本</label>
                            <p:selectOneMenu value="#{tenantInfoController.tenantConfigService.edition}" disabled="#{tenantInfoController.type ne 'create'}">
                                <p:ajax listener="#{tenantInfoController.onVersionChange}" update="idCreateTemplateBt"></p:ajax>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('tenantVersion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                            <p:commandLink id="idCreateTemplateBt" styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default"  disabled="#{tenantInfoController.disableCreateTemplateBt}" rendered="#{tenantInfoController.createOrEdit()}" actionListener="#{tenantInfoController.addTemplateFile()}" value="添加模版" update="SiteInfoEditForm :growl" icon="ui-icon-check" oncomplete="handleAddTemplateFiles(xhr, status, args);"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">&nbsp;</label>
                            <p:selectBooleanCheckbox itemLabel="#{msg.isEnabled}" value="#{tenantInfoController.selected.isEnabled}"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{tenantInfoController.showTestTenant}">
                            <label class="label">&nbsp;</label>
                            <p:selectBooleanCheckbox itemLabel="运营管理租户" value="#{tenantInfoController.testTenant}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">&nbsp;</label>
                            <p:selectBooleanCheckbox itemLabel="是否有IB版设备" value="#{tenantInfoController.selected.haveIbDevice}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">&nbsp;</label>
                            <p:selectBooleanCheckbox itemLabel="是否开启不良事件上报" value="#{tenantInfoController.selected.isEnablesAdverseEvents}"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">注销方式</label>
                            <p:selectOneMenu value="#{tenantInfoController.selected.activeType}" disabled="#{tenantInfoController.selected.activeType eq 3}" >
                                <f:selectItem itemLabel="无" itemValue="1" />
                                <f:selectItem itemLabel="准备注销" itemValue="2" />
                                <f:selectItem itemLabel="已注销" itemValue="3" itemDisabled="true" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="enablesNewMenu">
                            <p:selectBooleanCheckbox itemLabel="是否使用新版菜单角色" value="#{tenantInfoController.selected.enablesNewMenu}"/>
                        </h:panelGroup>
                        <h:panelGroup id="activePerson" rendered="#{'edit'.equals(tenantInfoController.type)}">
                            <label class="label"> 激活人选择 </label>
                            <p:selectCheckboxMenu
                                    value="#{tenantInfoController.activePersons}"
                                    panelStyle="width:280px" style="width:100%"
                                    converter="userAccountConverter" multiple="true" filter="true"
                                    filterMatchMode="contains" >
                                <f:selectItems value="#{tenantInfoController.userAccounts}" var="item"
                                               itemLabel="#{tenantInfoController.getNameWithOrgName(item)}" itemValue="#{item}"/>
                                <p:ajax process="@this"/>
                            </p:selectCheckboxMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <p:fieldset legend="#{msg.WorkOrderConfig}" rendered="false">
                        <h:panelGrid columns="6" rendered="#{tenantInfoController.selected != null}">
                            <p:selectBooleanCheckbox itemLabel="#{msg.wfAutoStep2}" value="#{tenantInfoController.selected.wfAutoStep2}"/>
                            <p:selectBooleanCheckbox itemLabel="#{msg.wfAutoStep3}" value="#{tenantInfoController.selected.wfAutoStep3}"/>
                            <p:selectBooleanCheckbox itemLabel="#{msg.wfAutoStep4}" value="#{tenantInfoController.selected.wfAutoStep4}"/>
                            <p:selectBooleanCheckbox itemLabel="#{msg.wfAutoStep5}" value="#{tenantInfoController.selected.wfAutoStep5}" rendered="false"/>
                            <p:selectBooleanCheckbox itemLabel="#{msg.wfAutoStep6}" value="#{tenantInfoController.selected.wfAutoStep6}" rendered="false"/>
                        </h:panelGrid>
                    </p:fieldset>
                    <br/>
<!--                    <p:commandButton id="savebutton" validateClient="true"    actionListener="#{tenantInfoController.save()}"  value="#{msg.Save}" update=":growl" icon="ui-icon-check" oncomplete="handleTenantInfo(xhr, status, args);" >-->
<!--                        <p:confirm   disabled="#{tenantInfoController.checkNameChange()}"  header="保存" message="租户名称目前是某些租户定制化业务逻辑的启用标志，改动后可能会导致相关逻辑被停用。是否确认修改租户名称？" icon="pi pi-exclamation-triangle" />-->
<!--                    </p:commandButton>-->
                    <p:commandButton id="submit" style="display:none"   actionListener="#{tenantInfoController.save()}"  value="#{msg.Save}" update=":growl" icon="ui-icon-check" oncomplete="handleTenantInfo(xhr, status, args);" ></p:commandButton>

                    <!-- 保存按钮 -->
                    <p:commandButton   validateClient="true"  update=":growl" icon="ui-icon-check"   value="#{msg.Save}"  onclick="checkFieldModified(event)"/>

                    <p:confirmDialog header="保存" global="true" showEffect="fade" hideEffect="fade" widgetVar="confirmDialog" message="租户名称目前是某些租户定制化业务逻辑的启用标志，改动后可能会导致相关逻辑被停用。是否确认修改租户名称？">

                        <p:commandButton value="确认保存" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"  validateClient="true"  update=":SiteInfoEditForm :growl"  actionListener="#{tenantInfoController.save()}" onclick="doSave()"/>
                        <p:commandButton value="取消保存" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times"
                                         onclick="cancelSave()" />
                    </p:confirmDialog>

                    <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" type="button" icon="ui-icon-cancel" onclick="PF('SiteInfoEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <script type="text/javascript">
            function handleTenantInfo(xhr, status, args) {
                var valid = true;
                if (args.tenantEstablished) {
                    valid = false;
                }
                if (valid) {
                    handleSubmit(args, 'SiteInfoEditDialog');
                }
            }

            function handleAddTemplateFiles(xhr, status, args){
            }

            var fieldOriginalValue ;

            // 点击保存按钮时检查字段是否修改
            function checkFieldModified(event) {
                var currentValue = document.getElementById('SiteInfoEditForm:name').value;
                if (currentValue != fieldOriginalValue) {
                    PF('savelog').show();
                }else{
                    doSave(); // 如果字段未修改直接执行保存操作
                }
            }

            function doSave() {
                // 在这里执行保存操作的逻辑
                var button= document.getElementById('SiteInfoEditForm:submit');
                button.click();
            }

            function saveButton() {
                fieldOriginalValue = document.getElementById('SiteInfoEditForm:name').value;

            }
        </script>


        <p:dialog widgetVar="savelog" modal="true" class="savelog" draggable="false" closable="false" resizable="false" showHeader="false">
            <p:fieldset legend="租户名称目前是某些租户定制化业务逻辑的启用标志，改动后可能会导致相关逻辑被停用。是否确认修改租户名称？">
                <p:commandButton id="submitButton" validateClient="true" actionListener="#{tenantInfoController.save()}" value="确认" update=":SiteInfoEditForm :growl" icon="ui-icon-check"
                                  oncomplete="handleTenantInfo(xhr, status, args); PF('savelog').hide()"/>
                <p:commandButton immediate="true" value="取消" icon="ui-icon-arrow-back" oncomplete="PF('savelog').hide()"  update=":growl"/>
            </p:fieldset>
        </p:dialog>
    </ui:composition>
</html>
