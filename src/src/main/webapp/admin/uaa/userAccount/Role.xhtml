<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="RoleEditDlg" widgetVar="RoleEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.AssignRole}">
            <h:form id="UserRoleEditForm">
                <h:panelGroup id="display">
                    <p:tabView class="ui-g-12" id="tabview"   dynamic="false"   cache="false">
                        <p:tab title="#{msg.AssignRole}" class="ui-g-12" >
                            <p:panelGrid columns="2" rendered="#{userAccountController.selected != null}">
                                <p:outputLabel value="#{msg.login_name}"/>
                                <p:outputLabel value="#{userAccountController.selected.loginName}"/>
                                <p:outputLabel value="#{msg.userName}"/>
                                <p:outputLabel value="#{userAccountController.selected.name}"/>

                                <p:outputLabel value="#{msg.AssignRole}" for="roleNames" />
                                <p:selectManyCheckbox id="roleNames" value="#{userAccountController.assignedRoles}" layout="pageDirection" valueChangeListener="#{userAccountController.roleChangeListener}">
                                    <p:ajax update="@this"/>
                                    <f:selectItems value="#{userAccountController.allRoles}" />
                                </p:selectManyCheckbox>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="访问权限" class="ui-g-12" >
                            <p:scrollPanel style="height: 300px; border: 0;" mode="native">
                                <p:tree id="orgTree" class="tree" style="border:0;height:362px" value="#{userAccountController.accessOrgTree}" selection="#{userAccountController.selectedAccessOrgNodes}"  var="node"  dynamic="true"  cache="false" selectionMode="checkbox" highlight="true">
                                        <p:ajax event="select" listener="#{userAccountController.onSelectAccessTreeNode}" />
                                        <p:ajax event="unselect" listener="#{userAccountController.onUnselectAccessTreeNode}" />
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node.name}"/>
                                    </p:treeNode>
                                </p:tree>
                            </p:scrollPanel>
                        </p:tab>
                    </p:tabView>


                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{userAccountController.saveRoles}" value="#{msg.Save}" update="display,:RoleEditDlg, :UserAccountListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'RoleEditDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" type="button" onclick="PF('RoleEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
