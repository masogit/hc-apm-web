<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

<ui:composition>
   <p:dialog id="detailEditDialog" widgetVar="detailEditDialog" modal="true"  resizable="false" draggable="true" width="60%" height="650" appendTo="@(body)"  header="子课程" >
      <h:form id="detailEditForm">
         <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
               <label class="label">培训课程子名称*</label>
               <p:inputText value="#{trainInSiteController.selectedTrainDetail.name}" required="true" requiredMessage="培训课程子名称 不能为空！" disabled="#{trainInSiteController.selectedTrainDetail.status != 'Planned'}"/>
            </h:panelGroup>
            <h:panelGroup>
               <label class="label">计划培训日期*</label>
               <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd" value="#{trainInSiteController.selectedTrainDetail.planTrainDate}" required="true" requiredMessage="计划培训日期 #{msg.ValidationRequire}" showOn="button" Input="false" showButtonPanel="true" navigator="true" mask="true" disabled="#{trainInSiteController.selectedTrainDetail.status != 'Planned'}"/>
            </h:panelGroup>
            <h:panelGroup>
               <label class="label">计划培训开始时间*</label>
               <p:calendar timeZone="GMT+8" pattern="HH:mm" timeOnly="true" value="#{trainInSiteController.selectedTrainDetail.startTime}" required="true" requiredMessage="计划培训开始时间 #{msg.ValidationRequire}" showOn="button" Input="false" showButtonPanel="true" navigator="true" mask="true" disabled="#{trainInSiteController.selectedTrainDetail.status != 'Planned'}"/>
            </h:panelGroup>
            <h:panelGroup>
               <label class="label">计划培训结束时间*</label>
               <p:calendar timeZone="GMT+8" pattern="HH:mm" timeOnly="true" value="#{trainInSiteController.selectedTrainDetail.endTime}" required="true" requiredMessage="计划培训结束时间 #{msg.ValidationRequire}" showOn="button" Input="false" showButtonPanel="true" navigator="true" mask="true" disabled="#{trainInSiteController.selectedTrainDetail.status != 'Planned'}"/>
            </h:panelGroup>
            <h:panelGroup>
               <label class="label">内部授课人</label>
               <p:inputText value="#{trainInSiteController.selectedTrainDetail.internalInstructors}" disabled="#{trainInSiteController.selectedTrainDetail.status != 'Planned'}" />
            </h:panelGroup>
            <h:panelGroup>
               <label class="label">外部授课人</label>
               <p:inputText value="#{trainInSiteController.selectedTrainDetail.externalInstructors}" disabled="#{trainInSiteController.selectedTrainDetail.status != 'Planned'}" />
            </h:panelGroup>
            <h:panelGroup>
               <label class="label">外部授课公司</label>
               <p:inputText value="#{trainInSiteController.selectedTrainDetail.externalInstructorsCompany}" disabled="#{trainInSiteController.selectedTrainDetail.status != 'Planned'}" />
            </h:panelGroup>
            <h:panelGroup>
               <label class="label">培训地点*</label>
               <p:inputText value="#{trainInSiteController.selectedTrainDetail.trainLocation}" required="true" requiredMessage="培训地点不能为空！" disabled="#{trainInSiteController.selectedTrainDetail.status != 'Planned'}"/>
            </h:panelGroup>
         </p:panelGrid>
         <h:panelGroup >
            <p:dataList id="uploadList" value="#{trainInSiteController.blobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}" >
               <f:facet name="header">附件</f:facet>
               <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
               <p:commandButton actionListener="#{trainInSiteController.removeFile(fileitem)}" update="uploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this" rendered="#{trainInSiteController.selectedTrainDetail.status == 'Planned'}">
                  <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
               </p:commandButton>
            </p:dataList>
            <p:fileUpload allowTypes="/(\.|\/)(jpeg|jpg|png|xls|xlsx|doc|docx|pdf|JPEG|JPG|PNG|XLS|XLSX|DOC|DOCX|PDF)$/" fileUploadListener="#{trainInSiteController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                          multiple="true"  sizeLimit="31000000"  update="uploadList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}3M" label="#{msg.Add}" rendered="#{trainInSiteController.selectedTrainDetail.status == 'Planned'}"/>
         </h:panelGroup>
         <!--<p:fieldset legend="签到信息" rendered="#{not empty trainInSiteController.selectedTrainDetail.id}">-->
         <p:fieldset legend="签到信息" rendered="#{not empty trainInSiteController.selectedTrainDetail.id}">
            <p:dataTable id="signDatalist" value="#{trainInSiteController.trainDetailSignList}" var="item"
                         widgetVar="signDatalist" selectionMode="single" selection="#{trainInSiteController.selectedTrainDetailSign}"
                         lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.signDate}"
                         paginatorTemplate="{Toolbar}" rows="200" emptyMessage="#{msg.noRecordFound}" >

               <p:ajax event="rowSelect" update="deleteSignlButton"/>
             <!--  <p:column headerText="" style="width: 30px;">
                  <h:outputText value="#{item.signOrder}"/>
               </p:column>
               <p:column headerText="所属科室">
                  <h:outputText value="#{item.signDeptName}"/>
               </p:column>-->
               <p:column headerText="所属科室">
                  <h:outputText value="#{item.signDeptName}"/>
               </p:column>
               <p:column headerText="签到人">
                  <h:outputText value="#{item.signerName}"/>
               </p:column>
               <p:column headerText="签到时间">
                  <h:outputText value="#{item.signDate}">
                     <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                  </h:outputText>
               </p:column>
               <f:facet name="{Toolbar}">
                  <p:commandButton immediate="false" process="@this" id="createSignButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{trainInSiteController.prepareSignCreate}" update=":growl trainTab:signDlg" oncomplete="PF('signDlg').show()"  rendered="#{trainInSiteController.canEdit and trainInSiteController.selectedTrainDetail.status eq 'Planned'}"/>
                  <p:commandButton immediate="false" process="@this"  id="deleteSignlButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{trainInSiteController.deleteSign}" update=":growl trainTab:detailEditForm:signDatalist " disabled="#{empty trainInSiteController.selectedTrainDetailSign}" rendered="#{trainInSiteController.canEdit and trainInSiteController.selectedTrainDetail.status eq 'Planned'}">
                     <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                  </p:commandButton>
               </f:facet>
            </p:dataTable>
         </p:fieldset>
         <p:fieldset legend="完成信息" rendered="#{not empty trainInSiteController.trainDetailSignList}">
            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
               <h:panelGroup>
                  <label class="label">实际培训完成日期*</label>
                  <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd" value="#{trainInSiteController.selectedTrainDetail.actualTrainDate}" required="true" requiredMessage="计划培训日期 #{msg.ValidationRequire}" showOn="button" Input="false" showButtonPanel="true" navigator="true" mask="true" />
               </h:panelGroup>
               <h:panelGroup>
                  <label class="label">记录者*</label>
                  <p:inputText value="#{trainInSiteController.selectedTrainDetail.completeRecorder}" disabled="true"/>
               </h:panelGroup>
               <h:panelGroup>
                  <label class="label">视频链接</label>
                  <p:inputText value="#{trainInSiteController.selectedTrainDetail.vedioUrl}" />
               </h:panelGroup>
            </p:panelGrid>
            <h:panelGroup >
               <p:dataList id="uploadCompleteList" value="#{trainInSiteController.resultBlobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}" >
                  <f:facet name="header">附件</f:facet>
                  <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                  <p:commandButton actionListener="#{trainInSiteController.removeResultFile(fileitem)}" update="uploadCompleteList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this" rendered="#{trainInSiteController.selectedTrainDetail.status == 'Planned'}">
                     <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                  </p:commandButton>
                  <p:commandButton actionListener="#{trainInSiteController.prepareEditFile(fileitem)}" update="trainTab:modifyFileDlg" oncomplete="PF('modifyFileDlg').show()" icon="ui-icon-pencil" title="修改文件名称" class="popupIconButton" process="@this" rendered="#{trainInSiteController.selectedTrainDetail.status == 'Planned'}">

                  </p:commandButton>
               </p:dataList>
               <p:fileUpload allowTypes="/(\.|\/)(jpeg|jpg|png|xls|xlsx|doc|docx|pdf|mp4|avi|pptx|PPTX|AVI|JPEG|JPG|PNG|XLS|XLSX|DOC|DOCX|PDF|MP4)$/" fileUploadListener="#{trainInSiteController.handleResultFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                             multiple="true"  sizeLimit="11000000"  update="uploadCompleteList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}" rendered="#{trainInSiteController.selectedTrainDetail.status == 'Planned'}"/>
            </h:panelGroup>
         </p:fieldset>
         <br/>
         <p:commandButton validateClient="true" value="#{msg.Confirm}" action="#{trainInSiteController.saveDetail}" oncomplete="PF('detailEditDialog').hide()" update=":growl trainTab:editForm:detailDatalist trainTab:editForm:trainQty" icon="ui-icon-check" rendered="#{empty trainInSiteController.selectedTrainDetail.status or trainInSiteController.selectedTrainDetail.status eq 'Planned'}"/>
         <p:commandButton validateClient="true" value="完成" action="#{trainInSiteController.completeDetail}" oncomplete="PF('detailEditDialog').hide()" update=":growl trainTab:editForm:detailDatalist trainTab:editForm:trainQty" icon="ui-icon-check" rendered="#{not empty trainInSiteController.selectedTrainDetail.id and trainInSiteController.selectedTrainDetail.status eq 'Planned'}" />
         <p:commandButton validateClient="true" value="#{msg.Cancel}" icon="ui-icon-cancel" oncomplete="PF('cancelDlg').show();" update="trainTab:cancelForm  trainTab:editForm:detailDatalist" rendered="#{not empty trainInSiteController.selectedTrainDetail.id and trainInSiteController.selectedTrainDetail.status eq 'Planned'}"/>
         <p:commandButton immediate="true" process="@this" value="返回" icon="ui-icon-arrow-back" action="#{trainInSiteController.backDetail}" oncomplete="PF('detailEditDialog').hide()"  update=" trainTab:editForm:detailDatalist"/>
      </h:form>
   </p:dialog>
   <p:dialog id="modifyFileDlg" widgetVar="modifyFileDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="附件名称修改" width="600" height="200">
      <h:form id="modifyFileForm">
         <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
            <h:panelGroup>
               <label class="label">附件名称*</label>
            </h:panelGroup>
            <h:panelGroup>
               <p:inputText value="#{trainInSiteController.fileName}" required="true" requiredMessage="附件名称不能为空"/>
            </h:panelGroup>
            <h:panelGroup>
               <p:inputText value="#{trainInSiteController.fileType}" disabled="true"/>
            </h:panelGroup>
         </p:panelGrid>
         <p:commandButton validateClient="true" value="#{msg.Confirm}" action="#{trainInSiteController.saveModifyFileName}" oncomplete="PF('modifyFileDlg').hide()" update=":growl trainTab:detailEditForm:uploadCompleteList " icon="ui-icon-check" rendered="#{empty trainInSiteController.selectedTrainDetail.status or trainInSiteController.selectedTrainDetail.status eq 'Planned'}"/>
         <p:commandButton immediate="true" process="@this" value="返回" icon="ui-icon-arrow-back"  oncomplete="PF('modifyFileDlg').hide()"  update=" "/>


      </h:form>
   </p:dialog>

   <p:dialog id="cancelDlg" widgetVar="cancelDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="取消原因" height="300">

      <h:form id="cancelForm">
         <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
            <h:panelGroup>
               <label class="label">原因</label>
               <p:inputTextarea rows="10" cols="50" value="#{trainInSiteController.selectedTrainDetail.cancelReason}" required="true" requiredMessage="原因不能为空">
               </p:inputTextarea>
            </h:panelGroup>
         </p:panelGrid>
         <br/>
         <p:commandButton validateClient="true" value="#{msg.Confirm}" actionListener="#{trainInSiteController.cancelDetail()}" oncomplete="PF('cancelDlg').hide();PF('detailEditDialog').hide();" update=":growl trainTab:editForm:detailDatalist" icon="ui-icon-check" />
         <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('cancelDlg').hide()"/>
      </h:form>
   </p:dialog>

   <p:dialog id="signDlg" widgetVar="signDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" width="300" header="签到信息" height="350">
      <h:form id="signForm">
         <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
            <h:panelGroup>
               <label class="label">科室</label>
               <p:selectOneMenu value="#{trainInSiteController.selectedTrainDetailSign.signDeptUid}" required="true" requiredMessage="培训科室不能为空！"  >
                  <p:ajax listener="#{trainInSiteController.signDeptUidValueChage()}"/>
                  <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                  <f:selectItems value="#{trainInSiteController.orgInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
               </p:selectOneMenu>
            </h:panelGroup>
            <h:panelGroup>
               <label class="label">签到人</label>
               <p:inputText value="#{trainInSiteController.selectedTrainDetailSign.signerName}" required="true" requiredMessage="签到人 不能为空！" disabled="#{trainInSiteController.selectedTrainDetail.status != 'Planned'}"/>
               <!--<p:autoComplete value="#{trainInSiteController.filterSigner}" converter="userAccountConverter" dropdown="true"
                               forceSelection="true" var="t" required="true" requiredMessage="签到人 #{msg.ValidationRequire}"
                               itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{trainInSiteController.completeClinicalOwnerList}" class="SiteUIDChange clinicalDeptNameChange">
                  <p:ajax event="itemSelect" listener="#{trainInSiteController.onSignerFilterChange}" process="@this"   />

                  <p:column>
                     <h:outputText value="#{t.name}"/>
                  </p:column>
                  <p:column>
                     <h:outputText value="#{t.telephone}"/>
                  </p:column>
               </p:autoComplete>-->
            </h:panelGroup>
            <h:panelGroup rendered="false">
               <label class="label">签到时间</label>
               <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd hh:mm:ss" value="#{trainInSiteController.selectedTrainDetailSign.signDate}" required="true" requiredMessage="计划培训日期 #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
            </h:panelGroup>
         </p:panelGrid>
         <p:commandButton validateClient="true" value="#{msg.Confirm}" actionListener="#{trainInSiteController.saveSign()}" oncomplete="PF('signDlg').hide();" update=":growl trainTab:detailEditForm:signDatalist" icon="ui-icon-check" />
         <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('signDlg').hide()"/>
      </h:form>
   </p:dialog>
</ui:composition>
</html>
