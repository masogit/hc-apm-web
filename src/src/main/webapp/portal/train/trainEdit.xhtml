<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

<ui:composition>
    <p:dialog id="createDialog" widgetVar="createDialog" modal="true"  resizable="false" draggable="true" width="80%" height="600" appendTo="@(body)"  header="#{trainInSiteController.actionName eq 'Create' ? '新增' : '编辑'}  培训计划" >
        <h:form id="editForm">
            <p:fieldset legend="基本信息" >
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                    <h:panelGroup>
                        <label class="label">课程号</label>
                        <p:inputText value="#{trainInSiteController.selected.courseNo}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">创建时间</label>
                        <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" value="#{trainInSiteController.selected.createdDate}"  showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">培训类型*</label>
                        <p:selectOneMenu value="#{trainInSiteController.selected.trainType}" disabled="#{!trainInSiteController.canEdit}">
                            <f:selectItems value="#{fieldMsg.getFieldValueList('trainType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">课程名称*</label>
                        <p:inputText value="#{trainInSiteController.selected.courseName}" required="true" requiredMessage="课程名称不能为空！" disabled="#{!trainInSiteController.canEdit}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">培训方式*</label>
                        <p:selectOneMenu value="#{trainInSiteController.selected.trainMode}" disabled="#{!trainInSiteController.canEdit}">
                            <f:selectItems value="#{fieldMsg.getFieldValueList('trainMode')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">课程内容*</label>
                        <p:inputText value="#{trainInSiteController.selected.courseContent}" required="true" requiredMessage="课程内容不能为空！" disabled="#{!trainInSiteController.canEdit}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">课程目的*</label>
                        <p:inputText value="#{trainInSiteController.selected.courseObjective}" required="true" requiredMessage="课程目的不能为空！" disabled="#{!trainInSiteController.canEdit}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">培训次数*</label>
                        <p:inputText id="trainQty" value="#{trainInSiteController.selected.trainQty}" disabled="true" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">受培训科室*</label>
                        <p:selectCheckboxMenu disabled="#{!trainInSiteController.canEdit}"
                                value="#{trainInSiteController.selectedOrgUid}"
                                panelStyle="width:280px" style="width:100%" required="true" requiredMessage="受培训科室不能为空！"
                                multiple="true" filter="true" updateLabel="true"
                                filterMatchMode="contains">
                            <f:selectItems value="#{trainInSiteController.orgsForSelected}" var="item"
                                           itemLabel="#{item.orgName}" itemValue="#{item.uid}"/>
                            <p:ajax process="@this" event="change" listener="#{trainInSiteController.roleChange}" update="trainTab:editForm:trainingPeopleCount"/>
                        </p:selectCheckboxMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">受培训角色*</label>
                        <p:selectCheckboxMenu disabled="#{!trainInSiteController.canEdit}"
                                value="#{trainInSiteController.selectedRoleId}"
                                panelStyle="width:280px" style="width:100%" required="true" requiredMessage="受培训角色不能为空！"
                                multiple="true" filter="true" updateLabel="true"
                                filterMatchMode="contains">
                            <f:selectItems value="#{trainInSiteController.rolesForSelected}" var="item"
                                           itemLabel="#{item.roleName}" itemValue="#{item.id}"/>
                            <p:ajax process="@this" event="change" listener="#{trainInSiteController.roleChange}" update="trainTab:editForm:trainingPeopleCount"/>
                        </p:selectCheckboxMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">预估培训人数</label>
                        <p:inputText id="trainingPeopleCount" value="#{trainInSiteController.selected.trainingPeopleCount}" disabled="#{!trainInSiteController.canEdit}"/>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
            <h:panelGroup rendered="#{not empty trainInSiteController.selected.id}">
                <p:dataTable id="detailDatalist" value="#{trainInSiteController.trainDetailList}" var="item"
                             widgetVar="detailDatalist" selectionMode="single" selection="#{trainInSiteController.selectedTrainDetail}"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.createdDate}"
                             paginatorTemplate="{Toolbar}" rows="200" emptyMessage="#{msg.noRecordFound}" >

                    <p:ajax event="rowSelect" update="editDetailButton deleteDetailButton qrCodeButton"/>
                    <p:column headerText="培训课程子名称" width="150">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column headerText="计划培训日期" width="120">
                        <h:outputText value="#{item.planTrainDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="开始时间" width="90">
                        <h:outputText value="#{item.startTime}">
                            <f:convertDateTime timeZone="GMT+8" pattern="HH:mm" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="结束时间" width="90">
                        <h:outputText value="#{item.endTime}">
                            <f:convertDateTime timeZone="GMT+8" pattern="HH:mm" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="内部授课人" width="110">
                        <h:outputText value="#{item.internalInstructors}"/>
                    </p:column>
                    <p:column headerText="外部授课人" width="110">
                        <h:outputText value="#{item.externalInstructors}"/>
                    </p:column>
                    <p:column headerText="外部授课人公司" width="150">
                        <h:outputText value="#{item.externalInstructorsCompany}"/>
                    </p:column>
                    <p:column headerText="培训地点">
                        <h:outputText value="#{item.trainLocation}"/>
                    </p:column>
                    <p:column headerText="课程进度">
                        <h:outputText value="#{fieldMsg.fieldValue('trainStatus', item.status)}"/>
                    </p:column>
                    <p:column headerText="附件">
                        <ui:repeat value="#{trainInSiteController.queryFileByDetailId(item.id)}" var="f" varStatus="status">
                            <!--<ui:repeat value="#{item.blobObjectList}" var="f" varStatus="status">-->
                            <p:commandLink value="#{f.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(f.objectStorageId)}" styleClass="p-mr-2"/><br/>
                        </ui:repeat>
                    </p:column>

                    <f:facet name="{Toolbar}">
                        <p:commandButton immediate="false" process="@this" id="createDetailButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{trainInSiteController.prepareItemCreate}" update=":growl trainTab:detailEditDialog" oncomplete="PF('detailEditDialog').show()"  rendered="#{trainInSiteController.canEdit}"/>
                        <p:commandButton immediate="false" process="@this" id="editDetailButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{trainInSiteController.prepareItemEdit}" update=":growl trainTab:detailEditDialog"  oncomplete="PF('detailEditDialog').show()" disabled="#{empty trainInSiteController.selectedTrainDetail}" rendered="#{trainInSiteController.canEdit}"/>
                        <p:commandButton immediate="false" process="@this"  id="deleteDetailButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{trainInSiteController.deleteItem}" update=":growl trainTab:editForm:detailDatalist trainTab:editForm:trainQty" disabled="#{empty trainInSiteController.selectedTrainDetail}" rendered="#{trainInSiteController.canEdit}">
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                        </p:commandButton>

                        <p:commandButton id="qrCodeButton" immediate="false" process="@this"  icon="ui-icon-remove-red-eye" title="签到二维码" actionListener="#{trainInSiteController.generateQrCode()}" update="trainTab:qrCodeDlg" oncomplete="PF('qrCodeDlg').show()"  disabled="#{empty trainInSiteController.selectedTrainDetail or trainInSiteController.selectedTrainDetail.status ne 'Planned'}" rendered="#{trainInSiteController.canEdit}"/>

                    </f:facet>
                </p:dataTable>
            </h:panelGroup>

            <p:fieldset legend="合同信息" >
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">合同号</label>
                            <p:inputText value="#{trainInSiteController.selected.contractNo}" disabled="#{!trainInSiteController.canEdit}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">设备分类</label>
                            <p:selectOneMenu  id="assetGroup" value="#{trainInSiteController.selected.assetGroup}" disabled="#{!trainInSiteController.canEdit}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">合同内容</label>
                            <p:inputText value="#{trainInSiteController.selected.contractContent}" disabled="#{!trainInSiteController.canEdit}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>

            <p:commandButton validateClient="true" value="#{msg.Confirm}" action="#{trainInSiteController.saveData}" oncomplete="PF('createDialog').hide()" update=":growl trainTab:trainInsiteListForm:datalist" icon="ui-icon-check" rendered="#{trainInSiteController.canEdit}"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('createDialog').hide()"/>
        </h:form>
    </p:dialog>
    <ui:include src="trainDetailEdit.xhtml"/>

    <p:dialog id="qrCodeDlg" widgetVar="qrCodeDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" width="410" header="签到二维码" height="430">
        <h:outputLabel style="color: red" value="请使用微信进行扫码签到"></h:outputLabel>

        <img  style="border: 1px;border-color: grey;border-style: solid" src="#{trainInSiteController.qrCodeView()}"  width="400px" height="400px" alt=""/>
    </p:dialog>
</ui:composition>
</html>
