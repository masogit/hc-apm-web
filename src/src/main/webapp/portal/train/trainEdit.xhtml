<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{trianInSiteEditController.actionName eq 'Create' ? '新增' : '编辑'} 培训计划"/>
            </div>
            <div class="ui-g-12 card ">
                <p:fieldset legend="主课程信息" >
                    <h:form id="editForm">
                        <p:fieldset legend="基本信息" >
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <h:panelGroup>
                                    <label class="label">课程号</label>
                                    <p:inputText value="#{trianInSiteEditController.selected.courseNo}" disabled="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">创建时间</label>
                                    <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" value="#{trianInSiteEditController.selected.createdDate}"  showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" readonly="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">培训类型*</label>
                                    <p:selectOneMenu value="#{trianInSiteEditController.selected.trainType}" disabled="#{!trianInSiteEditController.canEdit}">
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('trainType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">课程名称*</label>
                                    <p:inputText value="#{trianInSiteEditController.selected.courseName}" required="true" requiredMessage="课程名称不能为空！" disabled="#{!trianInSiteEditController.canEdit}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">培训方式*</label>
                                    <p:selectOneMenu value="#{trianInSiteEditController.selected.trainMode}" disabled="#{!trianInSiteEditController.canEdit}">
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('trainMode')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">课程内容*</label>
                                    <p:inputText value="#{trianInSiteEditController.selected.courseContent}" required="true" requiredMessage="课程内容不能为空！" disabled="#{!trianInSiteEditController.canEdit}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">课程目的*</label>
                                    <p:inputText value="#{trianInSiteEditController.selected.courseObjective}" required="true" requiredMessage="课程目的不能为空！" disabled="#{!trianInSiteEditController.canEdit}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">培训次数*</label>
                                    <p:inputText id="trainQty" value="#{trianInSiteEditController.selected.trainQty}" disabled="true" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">受培训科室*</label>
                                    <p:selectCheckboxMenu disabled="#{!trianInSiteEditController.canEdit}"
                                                          value="#{trianInSiteEditController.selectedOrgUid}"
                                                          panelStyle="width:280px" style="width:100%" required="true" requiredMessage="受培训科室不能为空！"
                                                          multiple="true" filter="true" updateLabel="true"
                                                          filterMatchMode="contains">
                                        <f:selectItems value="#{trianInSiteEditController.orgsForSelected}" var="item"
                                                       itemLabel="#{item.orgName}" itemValue="#{item.uid}"/>
                                        <p:ajax process="@this" event="change" listener="#{trianInSiteEditController.roleChange}" update="editForm:trainingPeopleCount"/>
                                    </p:selectCheckboxMenu>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">受培训角色*</label>
                                    <p:selectCheckboxMenu disabled="#{!trianInSiteEditController.canEdit}"
                                                          value="#{trianInSiteEditController.selectedRoleId}"
                                                          panelStyle="width:280px" style="width:100%" required="true" requiredMessage="受培训角色不能为空！"
                                                          multiple="true" filter="true" updateLabel="true"
                                                          filterMatchMode="contains">
                                        <f:selectItems value="#{trianInSiteEditController.rolesForSelected}" var="item"
                                                       itemLabel="#{item.roleName}" itemValue="#{item.id}"/>
                                        <p:ajax process="@this" event="change" listener="#{trianInSiteEditController.roleChange}" update="editForm:trainingPeopleCount"/>
                                    </p:selectCheckboxMenu>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">预估培训人数</label>
                                    <p:inputText id="trainingPeopleCount" value="#{trianInSiteEditController.selected.trainingPeopleCount}" disabled="#{!trianInSiteEditController.canEdit}"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:fieldset>
                        <p:fieldset legend="合同信息" >
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">合同号</label>
                                    <p:inputText value="#{trianInSiteEditController.selected.contractNo}" disabled="#{!trianInSiteEditController.canEdit}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">设备分类</label>
                                    <p:selectOneMenu  id="assetGroup" value="#{trianInSiteEditController.selected.assetGroup}" disabled="#{!trianInSiteEditController.canEdit}">
                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">合同内容</label>
                                    <p:inputText value="#{trianInSiteEditController.selected.contractContent}" disabled="#{!trianInSiteEditController.canEdit}"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:fieldset>
                        <p:commandButton validateClient="true" value="#{msg.save}" action="#{trianInSiteEditController.saveData}"   icon="ui-icon-check" rendered="#{trianInSiteEditController.canEdit}"/>
                        <p:commandButton immediate="true" process="@this" value="#{msg.Return}" icon="ui-icon-cancel" action="#{trianInSiteEditController.backList}" />
                    </h:form>
                </p:fieldset>
            </div>
            <div class="ui-g-12 card " >
                <p:fieldset legend="子课程信息" id="editDataListField" rendered="#{not empty trianInSiteEditController.selected.id}">
                    <h:form id="editDataListForm">
                        <h:panelGroup rendered="#{not empty trianInSiteEditController.selected.id}">
                            <p:dataTable id="detailDatalist" value="#{trianInSiteEditController.trainDetailList}" var="item"
                                         widgetVar="detailDatalist" selectionMode="single" selection="#{trianInSiteEditController.selectedTrainDetail}"
                                         lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.createdDate}"
                                         paginatorTemplate="{Toolbar}" rows="200" emptyMessage="#{msg.noRecordFound}" >

                                <p:ajax event="rowSelect" update="qrCodeButton :detailEditForm" listener="#{trianInSiteEditController.prepareItemEdit}"/>
                                <p:column headerText="培训课程子名称" width="150">
                                    <h:outputText value="#{item.name}"/>
                                </p:column>
                                <p:column headerText="计划培训日期" width="120">
                                    <h:outputText value="#{item.planTrainDate}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="开始时间" width="90">
                                    <h:outputText value="#{item.startTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="结束时间" width="90">
                                    <h:outputText value="#{item.endTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="内部授课人" width="110">
                                    <h:outputText value="#{item.internalInstructors}"/>
                                </p:column>
                                <p:column headerText="外部授课人" width="110">
                                    <h:outputText value="#{item.externalInstructors}"/>
                                </p:column>
                                <p:column headerText="外部授课人公司" width="150">
                                    <h:outputText value="#{item.externalInstructorsCompany}"/>
                                </p:column>
                                <p:column headerText="培训地点">
                                    <h:outputText value="#{item.trainLocation}"/>
                                </p:column>
                                <p:column headerText="课程进度">
                                    <h:outputText value="#{fieldMsg.fieldValue('trainStatus', item.status)}"/>
                                </p:column>
                                <p:column headerText="附件">
                                    <ui:repeat value="#{trianInSiteEditController.queryFileByDetailId(item.id)}" var="f" varStatus="status">
                                        <!--<ui:repeat value="#{item.blobObjectList}" var="f" varStatus="status">-->
                                        <p:commandLink value="#{f.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(f.objectStorageId)}" styleClass="p-mr-2"/><br/>
                                    </ui:repeat>
                                </p:column>

                                <f:facet name="{Toolbar}">
                                    <p:commandButton immediate="false" process="@this" id="createDetailButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{trianInSiteEditController.prepareItemCreate}" update=":growl :detailEditForm" />
                                   <!-- <p:commandButton immediate="false" process="@this" id="editDetailButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{trianInSiteEditController.prepareItemEdit}" update=":growl :detailEditForm"  disabled="#{empty trianInSiteEditController.selectedTrainDetail}" rendered="#{trianInSiteEditController.canEdit}"/>
                                    <p:commandButton immediate="false" process="@this"  id="deleteDetailButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{trianInSiteEditController.deleteItem}" update=":growl :editDataListForm:detailDatalist editForm:trainQty" disabled="#{empty trianInSiteEditController.selectedTrainDetail}" rendered="#{trianInSiteEditController.canEdit}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{trianInSiteEditController.getDeleteConformation()}" icon="ui-icon-alert"/>
                                    </p:commandButton>-->

                                    <p:commandButton id="qrCodeButton" immediate="false" process="@this"  icon="ui-icon-remove-red-eye" title="签到二维码" actionListener="#{trianInSiteEditController.generateQrCode()}" update=":qrCodeDlg" oncomplete="PF('qrCodeDlg').show()"  disabled="#{empty trianInSiteEditController.selectedTrainDetail}" />

                                </f:facet>
                            </p:dataTable>
                        </h:panelGroup>
                    </h:form>
                    <ui:include src="trainDetailEdit.xhtml"/>
                </p:fieldset>
            </div>
        </div>
        <p:dialog id="qrCodeDlg" widgetVar="qrCodeDlg" modal="true" resizable="false" draggable="true" appendTo="@(body)" width="480" header="签到二维码" height="600">
            <h:form id="printForm">
                <div class="ui-g clearfix">
                    <div class="ui-g-12 card cardTitle" style="height: 35px !important;">
                        <p:outputLabel value="#{trianInSiteEditController.selectedTrainDetail.name}"
                                       style="display: block; text-align: center; font-weight: bold; font-size: 2em;"/>
                    </div>
                    <div class="ui-g-12 card">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                     style="float: left; width: 100%;">
                            <h:panelGroup>
                                <label>培训时间：</label>
                                <p:outputLabel value="#{trianInSiteEditController.getPrintSignDate()}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label>培训地点：</label>
                                <p:outputLabel value="#{trianInSiteEditController.selectedTrainDetail.trainLocation}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label>培训授课人：</label>
                                <p:outputLabel value="#{trianInSiteEditController.getTrainInstructors()}"></p:outputLabel>
                            </h:panelGroup>
                        </p:panelGrid>
                        <img style="border: 1px;border-color: grey;border-style: solid;display: block;margin: 0 auto;"
                             src="#{trianInSiteEditController.qrCodeView()}" width="250px" height="250px" alt=""/>
                        <p style="text-align: center;">请使用微信扫描上方二维码进行签到。</p>
                        <p style="text-align: center;">签到成功后自动记录您的签到时间。</p>

                    </div>


                </div>
            </h:form>
            <div style="text-align: center;">
<!--                <p:commandButton validateClient="false" value="刷新二维码" style="background: #0e77ca"/>-->
                <p:commandButton validateClient="false" value="打印二维码" style="background: #0e77ca">
                    <p:printer target="printForm" />
                </p:commandButton>
            </div>

        </p:dialog>
    </ui:define>
</ui:composition>
