<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	  xmlns:h="http://xmlns.jcp.org/jsf/html"
	  xmlns:f="http://xmlns.jcp.org/jsf/core"
	  xmlns:p="http://primefaces.org/ui"
	  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
	<ui:composition name="content">
		<div class="ui-g">
			<div class="ui-g-12 card ">
				<h:form id="mvsWoMgrListForm">
					<p:dataTable id="datalist" value="#{trainMvsController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single"
						selection="#{trainMvsController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
						rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
						paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
						currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">

						<p:ajax event="filter" listener="#{trainMvsController.onFilter}" />
						<p:column headerText="课程号" sortBy="#{item.srNum}" filterMatchMode="GTE">
							<h:outputText value="#{item.srNum}" />
						</p:column>
						<p:column headerText="培训类型" filterBy="#{item.typeKey}" filterMatchMode="EQ">
							<f:facet name="filter">
						        <p:selectOneMenu onchange="PF('varDataList').filter()">
						        	<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
									<f:selectItems value="#{fieldMsg.getFieldValueList('trainMvsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
								</p:selectOneMenu>
						    </f:facet>
							<h:outputText value="#{fieldMsg.fieldValue('trainMvsType', item.typeKey)}"/>
						</p:column>
						<p:column headerText="课程名称" filterBy="#{item.srContext}" filterMatchMode="LIKE">
							<h:outputText value="#{item.courseName}"/>
						</p:column>
						<p:column headerText="外部授课人" filterBy="#{item.woContext}" filterMatchMode="LIKE">
							<h:outputText value="#{item.engineer}" />
						</p:column>
						<p:column headerText="实际培训结束日期" filterBy="#{item.closeTime}" filterMatchMode="GTE">
							<f:facet name="filter">
								<p:inputText id="filterCloseTimeDate" widgetVar="varFilterCloseTimeDate" />
							</f:facet>
							<h:outputText value="#{item.closeTime}" >
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss" />
							</h:outputText>
						</p:column>
						<p:column headerText="培训进度" filterBy="#{item.status}" filterMatchMode="EQ">
							<f:facet name="filter">
								<p:selectOneMenu onchange="PF('varDataList').filter()">
									<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
									<f:selectItems value="#{fieldMsg.getFieldValueList('trainMvsStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
								</p:selectOneMenu>
							</f:facet>
							<h:outputText value="#{fieldMsg.fieldValue('trainMvsStatus', item.status)}"/>
						</p:column>
					</p:dataTable>
				</h:form>

				<p:overlayPanel  widgetVar="panelFilterCloseTimeDate" for="trainTab:mvsWoMgrListForm:datalist:filterCloseTimeDate" dismissable="false">
					<h:panelGrid columns="2">
						<p:outputLabel for="cal1" />
						<p:calendar id="cal1" widgetVar="varCloseTimeDateFrom" effect="fold"
									pattern="yyyy/MM/dd" showOn="button" showButtonPanel="true" navigator="true" placeholder="开始时间"/>
						<p:outputLabel for="cal2"/>
						<p:calendar id="cal2" widgetVar="varCloseTimeDateTo" effect="fold"
									pattern="yyyy/MM/dd" showOn="button" showButtonPanel="true" navigator="true" placeholder="结束时间"/>
					</h:panelGrid>
					<p:commandButton onclick="PF('panelFilterCloseTimeDate').hide();setDateFilter('varDataList', 'varFilterCloseTimeDate', 'varCloseTimeDateFrom', 'varCloseTimeDateTo'); " title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
					<p:commandButton onclick="PF('panelFilterCloseTimeDate').hide()" title="#{msg.Close}" icon="ui-icon-close" style="zoom: 0.8;"/>
				</p:overlayPanel>
			</div>
		</div>
	</ui:composition>
</html>
