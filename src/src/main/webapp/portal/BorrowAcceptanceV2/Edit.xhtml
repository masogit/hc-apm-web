<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">
    <ui:define name="head">
        <h:outputStylesheet name="css/inspection.css"/>
    </ui:define>

    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="借用受理"/>
            </div>
            <div class="ui-g-12 card">
            
            <h:form id="IouEditForm">
                  
                <p:fieldset legend="借用申请信息" style="margin-bottom:20px">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{sharedAssetRequestV2Controller.selected != null}">
                        <h:panelGroup>
                            <label class='label'>申请人</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.getNameByLoginName2()}"></h:outputText>
                            <!--<h:outputText value="#{sharedAssetRequestV2Controller.selected.applicant}" />-->
                            <!--<p:inputText id="applicant" readonly="true" value="#{sharedAssetRequestV2Controller.selected.applicant}" />-->
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>申请科室</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.selected.clinicalDeptName}" />
                            <!--<p:inputText id="clinicalDeptName" readonly="true" value="#{sharedAssetRequestV2Controller.selected.clinicalDeptName}" />-->
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>科室位置</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.getOrgLocation()}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>虚拟网电话</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.selected.applicantPhone}" />
                            <!--<p:inputText id="applicantPhone" readonly="true" value="#{sharedAssetRequestV2Controller.selected.applicantPhone}" />-->
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>申请日期</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.selected.applyTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                            <!--<p:inputText id="applyTime" readonly="true" value="#{sharedAssetRequestV2Controller.selected.applyTime}" />-->
                            <!--<p:calendar id="applyTime"  pattern="yyyy/MM/dd HH:mm" value="#{sharedAssetRequestV2Controller.selected.applyTime}" mindate="#{sharedAssetRequestV2Controller.selected.applyTime}"-->
                                        <!--maxdate="#{sharedAssetRequestV2Controller.selected.applyTime}" timeOnly="true" readonlyInput="true" showButtonPanel="false"/>-->
                        </h:panelGroup>
                        <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(sharedAssetRequestV2Controller.currentUserOrgInfo, 'rentReason').rendered}">
                            <label class='label'>
                                #{msg.RentReason}
                                <span style="color: red;">
                                    #{systemConfigItemController.getFieldColumn(sharedAssetRequestV2Controller.currentUserOrgInfo, 'rentReason').required ? '*' : ''}
                                </span>
                            </label>
                            <p:inputTextarea id="rentReason" rows="1"  cols="100" readonly="true" queryDelay="750" minQueryLength="4"
                                             value="#{sharedAssetRequestV2Controller.selected.rentReason}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>备注</label>
                            <p:inputTextarea id="remark" readonly="true" rows="1"  cols="100"  queryDelay="750" minQueryLength="4" value="#{sharedAssetRequestV2Controller.selected.remark}" />
                        </h:panelGroup>        
                    </p:panelGrid>  
                </p:fieldset>
                 
                <p:fieldset legend="借用申请明细" style="margin-bottom:20px">
                    <p:dataTable id="datalistDetail" value="#{sharedAssetRequestV2Controller.selected.sartList}" var="item" widgetVar="varDataListDetail"
                        selectionMode="single" selection="#{sharedAssetRequestV2Controller.selectedSart}"
                        lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                        rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                        currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                        rows="20" emptyMessage="#{msg.noRecordFound}"
                        rowsPerPageTemplate="20,50,100,500" editable="true" >   
                    
                    <p:ajax event="rowEdit" listener="#{sharedAssetRequestV2Controller.onRowEditSart}" />

                    <p:column headerText="#{msg.AdjustmentEquipmentName}" sortBy="#{item.expectDate}" >
                        <h:outputText value="#{item.swapName}"/>
                    </p:column>
                    <p:column headerText="申请借用数" sortBy="#{item.applyQty}" >
                        <h:outputText value="#{item.applyQty}"/>
                    </p:column>
                    <p:column headerText="预计借用数" sortBy="#{item.exceptQty}">
                        <!--<p:cellEditor>-->
                            <!--<f:facet name="output"><h:outputText value="#{item.exceptQty}" /></f:facet>-->
                            <!--<f:facet name="input"><p:inputNumber value="#{item.exceptQty}" decimalPlaces="0" minValue="0" maxValue="#{item.applyQty}"/></f:facet>-->
                            <!--&lt;!&ndash;<f:facet name="input"><p:inputText value="#{item.exceptQty}" style="width:96%" label="Year"/></f:facet>&ndash;&gt;-->
                        <!--</p:cellEditor>-->
                        <p:inputNumber value="#{item.exceptQty}" decimalPlaces="0" required="true" emptyValue="0"
                                       requiredMessage="预计借用数不能为空！" minValue="0" maxValue="#{item.applyQty}">
                            <p:ajax update=":IouEditForm:confirmBtn"/>
                        </p:inputNumber>
                    </p:column>
                    <p:column headerText="预计归还时间" sortBy="#{item.expectDate}" >
                        <h:outputText value="#{item.expectDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="病人号" rendered="#{sharedAssetRequestV2Controller.isLogPatientInfoEnabled()}">
                        <h:outputText value="#{item.patientNum}"/>
                    </p:column>
                    <p:column headerText="床号" rendered="#{sharedAssetRequestV2Controller.isLogPatientInfoEnabled()}">
                        <h:outputText value="#{item.patientBedNum}"/>
                    </p:column>
                    <p:column headerText="备注" sortBy="#{item.remark}">
                        <h:outputText value="#{item.remark}"/>
                    </p:column>
                    <!--<p:column headerText="编辑" style="width: 120px">-->
                        <!--<p:rowEditor style="float: left;margin-left: 30px;" cancelTitle="取消" saveTitle="保存" editTitle="编辑" />-->
                    <!--</p:column>-->
                </p:dataTable>
                </p:fieldset>
                            
                <p:fieldset  legend="借用设备" style="margin-bottom:20px"  rendered="#{sharedAssetRequestV2Controller.selected.state  eq 2}" >
                    <p:dataTable id="datalistOperation" value="#{sharedAssetReqDetailV2Controller.lazyModel}" var="item" widgetVar="varDataListdetail"
                    selectionMode="single" selection="#{sharedAssetReqDetailV2Controller.selected}"
                    lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                    rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                    paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"

                    currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                    rows="20" emptyMessage="#{msg.noRecordFound}"
                    rowsPerPageTemplate="20,50,100,500">

                        <p:column headerText="设备名称" sortBy="#{item.assetName}" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                        <p:column headerText="设备编号" sortBy="#{item.assetNumber}" filterBy="#{item.assetNumber}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetNumber}"/>
                        </p:column>
                        <p:column headerText="状态" sortBy="#{item.state}" filterBy="#{item.state}" filterMatchMode="LIKE">
                            <h:outputText value="借用中" rendered="#{item.state eq '0'}"></h:outputText>
                            <h:outputText value="已归还" rendered="#{item.state eq '1'}"></h:outputText>
                        </p:column>
                        <p:column headerText="计费开始时间" sortBy="#{item.chargingBeginTime}" filterBy="#{item.chargingBeginTime}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.chargingBeginTime}" />
                        </p:column>
                      <f:facet name="{Toolbar}">
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist" fileName="IouApplyDetail_export"/>
                        </p:commandButton>
                    </f:facet>
                    </p:dataTable>
                </p:fieldset>
                <p:fieldset legend="附件上传" style="margin-bottom:20px">
                    <h:panelGroup id="uploadPanelGroup">
                        <p:dataTable id="contractListData" widgetVar="varDataList" value="#{sharedAssetRequestV2Controller.selected.attachments}" var="fileitem"  emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="名称" >
                                <h:outputText value="#{fileitem.objectName}"/>
                            </p:column>
                            <p:column headerText="图片"  >
                                <p:graphicImage  url="#{fileDownloadService.getImgUrl(fileitem.objectStorageId)}" alt="不支持预览" style="width: 10%" />
                            </p:column>
                            <p:column headerText="操作"  >
                                <p:commandButton  icon="ui-icon-cloud-download" title="下载" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                <p:commandButton  actionListener="#{sharedAssetRequestV2Controller.setViewImageStr(fileitem.objectStorageId)}" title="预览" update="viewImage" icon="ui-icon-search" oncomplete="PF('viewImageDialog').show();"/>
                                <p:commandButton rendered="#{sharedAssetRequestV2Controller.selected.state != 6}"  actionListener="#{sharedAssetRequestV2Controller.removeAttachmentById(fileitem.id)}"  update="IouEditForm:uploadPanelGroup" icon="ui-icon-delete" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>
                        <p:fileUpload rendered="#{sharedAssetRequestV2Controller.selected.state != 6}" disabled="#{sharedAssetRequestV2Controller.selected.attachments.size() >= 5}" id="File" allowTypes="/(\.|\/)(jpeg|jpg|png|txt|ps|JPEG|JPG|PNG|TXT|PS)$/"
                                      mode="advanced" dragDropSupport="false" style="width:100%" fileUploadListener="#{sharedAssetRequestV2Controller.handleFileUpload}"
                                      multiple="true"  sizeLimit="500000000"  update="uploadPanelGroup" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}500M" label="#{msg.Add}"/>

                    </h:panelGroup>
                </p:fieldset>
                <h:panelGroup id="display">
                    <br/>
                    <p:commandButton id="confirmBtn"  validateClient="true" disabled="#{sharedAssetRequestV2Controller.validateAllExpectedQty() or sharedAssetRequestV2Controller.selected.approvalStatus eq 0}" actionListener="#{sharedAssetRequestV2Controller.Accept}" update="IouEditForm" oncomplete="openSwapTypeViewWindow3(xhr, status, args)" value="确认受理" icon="ui-icon-check" />
                    <p:commandButton id="refuseBtn" validateClient="true" disabled="#{sharedAssetRequestV2Controller.selected.approvalStatus eq 0}" action="#{sharedAssetRequestV2Controller.editDialogTitle(1)}"  update="rejectApplyDialog" oncomplete="PF('rejectApplyDialog').show()" value="拒绝申请" icon="ui-icon-cancel" rendered="#{sharedAssetRequestV2Controller.selected.state  eq 1}"/>
                    <p:commandButton validateClient="true" disabled="#{sharedAssetRequestV2Controller.selected.approvalStatus eq 0}" action="#{sharedAssetRequestV2Controller.editDialogTitle(2)}" update="rejectApplyDialog" oncomplete="PF('rejectApplyDialog').show()" value="搁置受理" icon="ui-icon-cancel" rendered="#{sharedAssetRequestV2Controller.selected.state  eq 1}"/>
                    <p:commandButton value="#{msg.Return}"  action="List?faces-redirect=true"  icon="ui-icon-arrow-back"/>
                    <p:commandButton value="#{msg.transfer}" disabled="#{sharedAssetRequestV2Controller.selected.approvalStatus eq 0}" actionListener="#{sharedAssetRequestV2Controller.prepareTransferRequest()}" oncomplete="PF('transferOrderDialog').show()" rendered="true"/>
                    <script>
                        function openSwapTypeViewWindow3(xhr, status, args) {
                        	if(args.validationFailed) {
                        		
                        	} else {
                        		var url = args.url;
                                if (url == "norespond") {

                                } else {
                                    this.location.href = url;
                                }
                        	}
                        }

                    </script>
                </h:panelGroup>
            </h:form>

                <p:dialog id="transferOrderDialog" widgetVar="transferOrderDialog" modal="true" width="300"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.TransferOrder}">
                    <h:form id="transferOrderDialogForm" >
                        <h:panelGroup id="display1">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">可选人员</label>
                                    <p:selectOneMenu  value="#{sharedAssetRequestV2Controller.selectedAssignee.uid}" required="true" requiredMessage="可选人员#{msg.ValidationRequire}">
                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                        <f:selectItems value="#{sharedAssetRequestV2Controller.getAvailableAssignees()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </p:panelGrid>
                            <br/>
                        </h:panelGroup>
                         <h:panelGroup>
                            <p:commandButton validateClient="true" actionListener="#{sharedAssetRequestV2Controller.transferRequest()}" oncomplete="postTransferRequest(xhr, status, args)" value="#{msg.TransferOrder}" icon="ui-icon-check" />
                            <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{sharedAssetRequestV2Controller.prepareTransferRequest()}" icon="ui-icon-cancel" onclick="PF('transferOrderDialog').hide()"/>
                            <script>
                                function postTransferRequest(xhr, status, args) {
                                	if (args.validationFailed) {
                                        PF('transferOrderDialog').show();
                                    } else {
                                        PF('transferOrderDialog').hide();
                                        var url = args.url;
                                        if (url == "norespond") {
                                        } else {
                                            this.location.href = url;
                                        }
                                    }
                                }
                            </script>                            
                        </h:panelGroup>
                    </h:form>
                </p:dialog>
                <ui:include src="/portal/asset/selectAssetDialog.xhtml"/>
                <ui:include src="RejectApply.xhtml"/>
                <p:dialog  id="viewImage" widgetVar="viewImageDialog" modal="true" height="500" width="500"  resizable="true" draggable="true" appendTo="@(body)" >
                    <p:graphicImage  url="#{fileDownloadService.getImgUrl(sharedAssetRequestV2Controller.getViewImageStr())}" alt="不支持预览" style="width: 100%" />
                </p:dialog>
         </div>

        </div> 
    </ui:define>  
</ui:composition>
