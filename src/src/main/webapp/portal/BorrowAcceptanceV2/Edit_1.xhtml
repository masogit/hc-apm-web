<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="head">
        <h:outputStylesheet name="css/inspection.css"/>
    </ui:define>

    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="借用交付"/>
            </div>
            <div class="ui-g-12 card">
            
            <h:form id="IouEditForm">
                <p:fieldset legend="借用申请信息" style="margin-bottom:20px">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{sharedAssetRequestV2Controller.selected != null}">
                        <h:panelGroup>
                            <label class='label'>申请人</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.getNameByLoginName2()}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>申请科室</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.selected.clinicalDeptName}" />
                            <!--<p:inputText id="clinicalDeptName" readonly="true" value="#{sharedAssetRequestV2Controller.selected.clinicalDeptName}" />-->
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>科室位置</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.getOrgLocation()}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>虚拟网电话</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.selected.applicantPhone}" />
                            <!--<p:inputText id="applicantPhone" readonly="true" value="#{sharedAssetRequestV2Controller.selected.applicantPhone}" />-->
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>申请日期</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.selected.applyTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(sharedAssetRequestV2Controller.currentUserOrgInfo, 'rentReason').rendered}">
                            <label class='label'>
                                #{systemConfigItemController.getFieldColumn(sharedAssetRequestV2Controller.currentUserOrgInfo, 'rentReason').label}
                                <span style="color: red;">
                                    #{systemConfigItemController.getFieldColumn(sharedAssetRequestV2Controller.currentUserOrgInfo, 'rentReason').required ? '*' : ''}
                                </span>
                            </label>
                            <p:inputTextarea id="rentReason" rows="1"  cols="100" readonly="true" queryDelay="750" minQueryLength="4"
                                             value="#{sharedAssetRequestV2Controller.selected.rentReason}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>备注</label>
                            <p:inputTextarea id="remark" readonly="true" rows="1"  cols="100"  queryDelay="750" minQueryLength="4" value="#{sharedAssetRequestV2Controller.selected.remark}" />
                        </h:panelGroup>  
                    </p:panelGrid>
                </p:fieldset>

                <p:fieldset id="borrowDetails" legend="借用申请明细" style="margin-bottom:20px">
                    <p:dataTable id="datalistDetail" value="#{sharedAssetRequestV2Controller.selected.sartList}" 
                                 var="item" widgetVar="varDataListDetail1"
                        selectionMode="single" selection="#{sharedAssetRequestV2Controller.selectedSart}"
                        paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                        lazy="true" rowKey="#{item.id}"
                        sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                        paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                        currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                        rows="20" emptyMessage="#{msg.noRecordFound}"
                        rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="editButton"/>

                        <p:column headerText="#{msg.AdjustmentEquipmentName}" sortBy="#{item.swapName}">
                            <h:outputText value="#{item.swapName}"/>
                        </p:column>
                        <p:column headerText="申请借用数" sortBy="#{item.applyQty}" >
                            <h:outputText value="#{item.applyQty}"/>
                        </p:column>
                        <p:column headerText="预计借用数" sortBy="#{item.exceptQty}" >
                            <h:outputText value="#{item.exceptQty}"/>
                        </p:column>
                        <p:column headerText="实际借用数" sortBy="#{item.actualQty}" >
                            <h:outputText value="#{item.actualQty}"/>
                        </p:column>
                        <p:column headerText="预计归还时间" sortBy="#{item.expectDate}" >
                            <h:outputText value="#{item.expectDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="病人号" rendered="#{sharedAssetRequestV2Controller.isLogPatientInfoEnabled()}">
                            <h:outputText value="#{item.patientNum}"/>
                        </p:column>
                        <p:column headerText="床号" rendered="#{sharedAssetRequestV2Controller.isLogPatientInfoEnabled()}">
                            <h:outputText value="#{item.patientBedNum}"/>
                        </p:column>
                        <p:column headerText="备注" sortBy="#{item.remark}" >
                            <h:outputText value="#{item.remark}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <!--<p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{sharedAssetRequestV2Controller.prepareCreateSart}" update=":SharedAssetReqTypeEditDlg, datalistDetail" oncomplete="PF('SharedAssetReqTypeEditDialog').show()" />-->
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" actionListener="#{sharedAssetRequestV2Controller.prepareEditSart}" update=":SharedAssetReqTypeEditDlg, datalistDetail" oncomplete="PF('SharedAssetReqTypeEditDialog').show()" disabled="#{empty sharedAssetRequestV2Controller.selectedSart}" />
                            <!--<p:commandButton id="deleteButton" process="@this" icon="ui-icon-close"  class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{sharedAssetRequestV2Controller.deleteSart}" update="datalistDetail" disabled="#{empty sharedAssetRequestV2Controller.selectedSart}" >
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert" />
                            </p:commandButton>-->
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>

                <p:fieldset id="fSet1" legend="录入借用设备" style="margin-bottom:20px">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{sharedAssetRequestV2Controller.selected.state eq 2}" >
                        <h:panelGroup >
                            <label class='label'>批量输入</label>
                            <h:outputText value="计费开始时间："/>
                            <p:calendar  pattern="yyyy/MM/dd HH:mm" value="#{sharedAssetRequestV2Controller.selected.msgBeginTime}" readonlyInput="true" showOn="button" showButtonPanel="true" navigator="true"/>
                            <h:outputText value="设备接收人："/>
                            <p:inputText value="#{sharedAssetRequestV2Controller.selected.accepter}" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{sharedAssetRequestV2Controller.currentWorkflowConfig.enableLeaseManHour}">
                            <h:outputText value="工时"/>
                            <p:inputText value="#{sharedAssetRequestV2Controller.selected.effort}"/>
                        </h:panelGroup>
                        <h:panelGroup id="patientInfo" rendered="#{sharedAssetRequestV2Controller.isLogPatientInfoEnabled()}">
                            <h:outputText value="病人号"/>
                            <p:selectOneMenu value="#{sharedAssetRequestV2Controller.selectedSartId}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{sharedAssetRequestV2Controller.selected.sartList}" var="sart" itemLabel="#{sart.swapName} - #{sart.patientNum} - #{sart.patientBedNum}"  itemValue="#{sart.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <p:messages id="messages" closable="true" style="width: 900px" />
                            <p:inputText id="applyAssetInfo" placeholder="资产编号/设备编号/二维码" maxlength="100" style="width: 200px" value="#{sharedAssetRequestV2Controller.selected.applyAssetInfo}" />
                            <p:commandButton icon="ui-icon-search"  class="btn btn-sm btn-gray" update="datalistDetail datalistOperation, messages" action="#{sharedAssetRequestV2Controller.getAssetInfo(sharedAssetRequestV2Controller.selected.msgBeginTime,sharedAssetRequestV2Controller.selected.accepter)}" />
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:dataTable id="datalistOperation" value="#{sharedAssetRequestV2Controller.selected.sardList}"
                                 var="item" widgetVar="varDataListdetail"
                        selectionMode="single" selection="#{sharedAssetRequestV2Controller.selectedSard}"
                        lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                        rowKey="#{item.id}" 
                        sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                        paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                        currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                        rows="20" emptyMessage="#{msg.noRecordFound}"
                        rowsPerPageTemplate="20,50,100,500">   
                             
                    <p:ajax event="rowSelect" listener="#{sharedAssetRequestV2Controller.prepareEditSard}" update=":EditDlg" oncomplete="PF('EditDialog').show()" />
<!--                    <p:ajax event="filter" listener="#{sharedAssetReqDetailV2Controller.onFilter}" update=""  />  -->
                        <p:column headerText="设备名称" sortBy="#{item.assetName}" >
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                    <p:column headerText="设备编号" sortBy="#{item.assetNumber}">
                            <h:outputText value="#{item.assetNumber}"/>
                        </p:column>
                        <p:column headerText="计费开始时间" sortBy="#{item.chargingBeginTime}" >
                            <f:facet name="filter">
                                <p:inputMask mask="9999-99-99 #{msg.filterTo} 9999-99-99" onkeyup="filterByDateField(event, this, 'varDataList', ' #{msg.filterTo} ');" onblur="filterByDateFieldOnBlur(this, ' #{msg.filterTo} ');"/>
                            </f:facet>
                            <h:outputText value="#{item.chargingBeginTime}">
                                <f:convertDateTime pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="设备接收人" sortBy="#{item.accepter}" >
                            <h:outputText value="#{item.accepter}"/>
                        </p:column>
                        <p:column headerText="病人号" rendered="#{sharedAssetRequestV2Controller.isLogPatientInfoEnabled()}" >
                            <h:outputText value="#{item.patientNum}"/>
                        </p:column>
                        <p:column headerText="床号" rendered="#{sharedAssetRequestV2Controller.isLogPatientInfoEnabled()}" >
                            <h:outputText value="#{item.patientBedNum}"/>
                        </p:column>
                        <p:column headerText="备注" sortBy="#{item.remark}" >
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <p:column headerText="删除">
                            <p:commandButton id="deleteButton"  icon="ui-icon-trash"  actionListener="#{sharedAssetRequestV2Controller.deleteBy(item.id)}"  update=":IouEditForm:datalistDetail,datalistOperation">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalistOperation" fileName="IouApplyDetail_export"/>
                            </p:commandButton>
                        </f:facet>  
                    </p:dataTable>
                </p:fieldset>
                <p:fieldset legend="附件上传" style="margin-bottom:20px">
                    <h:panelGroup id="uploadPanelGroup">
                        <p:dataTable id="contractListData" widgetVar="varDataList" value="#{sharedAssetRequestV2Controller.selected.attachments}" var="fileitem"  emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="名称" >
                                <h:outputText value="#{fileitem.objectName}"/>
                            </p:column>
                            <p:column headerText="图片"  >
                                <p:graphicImage  url="#{fileDownloadService.getImgUrl(fileitem.objectStorageId)}" alt="不支持预览" style="width: 10%" />
                            </p:column>
                            <p:column headerText="操作"  >
                                <p:commandButton  icon="ui-icon-cloud-download" title="下载" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                <p:commandButton  actionListener="#{sharedAssetRequestV2Controller.setViewImageStr(fileitem.objectStorageId)}" title="预览" update="viewImage" icon="ui-icon-search" oncomplete="PF('viewImageDialog').show();"/>
                                <p:commandButton rendered="#{sharedAssetRequestV2Controller.selected.state != 6}"  actionListener="#{sharedAssetRequestV2Controller.removeAttachmentById(fileitem.id)}"  update="IouEditForm:uploadPanelGroup" icon="ui-icon-delete" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>
                        <p:fileUpload rendered="#{sharedAssetRequestV2Controller.selected.state != 6}" disabled="#{sharedAssetRequestV2Controller.selected.attachments.size() >= 5}" id="File" allowTypes="/(\.|\/)(jpeg|jpg|png|txt|ps|JPEG|JPG|PNG|TXT|PS)$/"
                                      mode="advanced" dragDropSupport="false" style="width:100%" fileUploadListener="#{sharedAssetRequestV2Controller.handleFileUpload}"
                                      multiple="true"  sizeLimit="500000000"  update="uploadPanelGroup" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}500M" label="#{msg.Add}"/>

                    </h:panelGroup>
                </p:fieldset>
                <h:panelGroup id="display">
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{sharedAssetRequestV2Controller.deliver}" oncomplete="openSwapTypeViewWindow(xhr, status, args)" 
                                     update="datalistDetail, datalistOperation, messages ,display , fSet1" value="完成交付" icon="ui-icon-check" rendered="#{sharedAssetRequestV2Controller.selected.state  eq 2}"/>
                    <p:commandButton validateClient="true" actionListener="#{sharedAssetRequestV2Controller.refers}" action="List?faces-redirect=true" value="取消借用" icon="ui-icon-cancel" rendered="#{sharedAssetRequestV2Controller.selected.state  eq 1 or sharedAssetRequestV2Controller.selected.state  eq 2 or sharedAssetRequestV2Controller.selected.state  eq 5 }" >
                        <p:confirm header="取消借用确认" message="您确定要取消借用么?" icon="ui-icon-alert"/>
                    </p:commandButton>
                    <p:commandButton value="#{msg.Return}" action="List?faces-redirect=true" immediate="true"  icon="ui-icon-arrow-back"/>

                </h:panelGroup>
            </h:form>
                <ui:include src="EditDetail.xhtml"/>
                <ui:include src="Detail_Edit.xhtml"/>
                <ui:include src="/portal/asset/selectAssetDialog.xhtml"/>
                <p:dialog  id="viewImage" widgetVar="viewImageDialog" modal="true" height="500" width="500"  resizable="true" draggable="true" appendTo="@(body)" >
                    <p:graphicImage  url="#{fileDownloadService.getImgUrl(sharedAssetRequestV2Controller.getViewImageStr())}" alt="不支持预览" style="width: 100%" />
                </p:dialog>
         </div>
        </div>
        <script>
            function openSwapTypeViewWindow(xhr, status, args) {
                var url = args.url;
                if (url == "norespond") {

                } else {
                    this.location.href = url;
                }
            }

        </script>

    </ui:define>  
</ui:composition>
