<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

  <p:dialog id="patientInfoDlg" widgetVar="PatientInfoDialog" modal="true" resizable="true" draggable="true"  appendTo="@(body)" header="患者信息" >
    <h:form id="AttributeEditForm">
      <h:panelGroup id="display">

        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" style="min-width: 500px;">
          <h:panelGroup>
            <label class="label">病人号*: </label>
            <p:inputText id="loginName" value="#{sharedAssetRequestV2Controller.selectedPatient.patientNum}" required="true" requiredMessage="病人号 #{msg.ValidationRequire}"/>
          </h:panelGroup>
          <h:panelGroup>
            <label class="label">床号*: </label>
            <p:inputText id="name" value="#{sharedAssetRequestV2Controller.selectedPatient.patientBedNum}" required="true" requiredMessage="床号 #{msg.ValidationRequire}"/>
          </h:panelGroup>
        </p:panelGrid>
        <br/>
        <p:commandButton validateClient="false" actionListener="#{sharedAssetRequestV2Controller.savePatientInfo()}" value="#{msg.Save}" update="IouEditForm:patientInfoList" icon="ui-icon-check" oncomplete="handleSubmit(args, 'PatientInfoDialog');"/>
        <p:commandButton immediate="true" value="#{msg.Cancel}" type="button" icon="ui-icon-cancel" onclick="PF('PatientInfoDialog').hide()"/>
      </h:panelGroup>
    </h:form>
  </p:dialog>

</ui:composition>
</html>
