<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:pu="http://primefaces.org/ultima"
xmlns:svg="http://www.w3.org/2000/svg">
	<p:commandButton id="basic" value="#{empty userContextService.selectSite? msg.AllHospitals:userContextService.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
	<p:overlayPanel widgetVar="varPanelOrg" for="basic" hideEffect="fade" style="width:350px">
		<p:scrollPanel style="height:300px;border: 0" mode="native">
			<p:tree id="docs"  class="tree" style="width:98%;border:0;" value="#{userContextService.hospitalTree}" var="node" selectionMode="single"
					selection="#{tenantTreeController.selectedTenantOrgNode}" dynamic="true">
				<p:ajax process="@this" event="select" listener="#{userContextService.onSelectSiteTreeNode}" update="IouListForm" oncomplete="PF('varPanelOrg').hide();"/>
				<p:treeNode type="org">
					<h:outputText value="#{node.name}"/>
				</p:treeNode>
			</p:tree>
		</p:scrollPanel>
	</p:overlayPanel>
</ui:composition>
