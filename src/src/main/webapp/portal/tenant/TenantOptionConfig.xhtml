<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="租户选项配置"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="basic">

                    <h:panelGrid columns="2">
                        <p:outputLabel for="currentTenant" value="选择配置租户: " />
                        <p:autoComplete id="currentTenant" dropdown="true" value="#{tenantOptionConfigController.selectedTenant}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{tenantOptionConfigController.autoCompleteTenant}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="tenantInfoUidConverter" update="@all">
                            <p:ajax event="itemSelect" listener="#{tenantOptionConfigController.onTenantChange}" process="@this" update="@form"/>
                            <p:ajax listener="#{tenantOptionConfigController.onTenantChange}" process="@this" update="@form"/>
                        </p:autoComplete>
<!--                        <p:autoComplete id="currentTenant" forceSelection="true" value="#{tenantOptionConfigController.selectedTenant}" completeMethod="#{tenantOptionConfigController.autoCompleteTenant}" />-->
                    </h:panelGrid>

                    <!--<p:fieldset legend="台账排序配置">

                        <h:panelGrid columns="6" style="margin-bottom:10px" cellpadding="20">
                            <p:selectBooleanCheckbox value="#{tenantOptionConfigController.selected.orderByCreateTimeByDefault}" itemLabel="设备台账默认以创建时间降序排序" />
                        </h:panelGrid>
                    </p:fieldset>-->

                    <p:fieldset legend="资产批量修改配置">

                        <h:panelGrid columns="6" style="margin-bottom:10px" cellpadding="20">
                            <p:selectBooleanCheckbox value="#{tenantOptionConfigController.selected.allowAssetBatchUpdate}" itemLabel="允许资产批量修改" />
                        </h:panelGrid>
                    </p:fieldset>

                    <p:fieldset legend="微信端资产编辑配置">

                        <h:panelGrid columns="6" style="margin-bottom:10px" cellpadding="20">
                            <p:selectBooleanCheckbox value="#{tenantOptionConfigController.selectedTenant.qrCodeEditable}" itemLabel="二维码是否可编辑" />
                        </h:panelGrid>
                    </p:fieldset>

<!--                    <p:fieldset legend="供应商激活权限配置">-->
<!--                        <h:panelGrid columns="6" style="margin-bottom:10px" cellpadding="20">-->
<!--                            <p:selectBooleanCheckbox value="#{tenantOptionConfigController.selected.activeSupplier}" itemLabel="允许激活供应商" />-->
<!--                        </h:panelGrid>-->
<!--                    </p:fieldset>-->

                    <p:fieldset legend="设备列表配置">
                        <h:panelGrid columns="6" style="margin-bottom:10px" cellpadding="20">
                            <p:selectBooleanCheckbox value="#{tenantOptionConfigController.selected.showIsPm}" itemLabel="台账列表是否显示”是否已配置保养规则“列" />
                        </h:panelGrid>
                    </p:fieldset>

                    <p:commandButton value="保存" actionListener="#{tenantOptionConfigController.save()}"   update="basic" icon="pi pi-check"/>

                </h:form>

            </div>
        </div>
    </ui:define>
</ui:composition>
