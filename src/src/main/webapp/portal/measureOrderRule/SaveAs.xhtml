<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

		<style>
			table.checkboxGroup tr td:nth-child(2)  {
				text-align: left;
			}
		</style>

        <p:dialog id="SaveAsDlg" widgetVar="SaveAsDialog"  width="1000" height="480" modal="true" resizable="true" draggable="true" appendTo="@this" header="#{msg.MeasureOrderRule} 另存为">
            <h:form id="MeasureOrderRuleSaveAsForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{measureOrderRuleController.selected != null}">
                        <h:panelGroup>
                            <label class="label">#{msg.hospitalId}*</label>
                            <p:inputText id="selectedUserOrgName" value="#{measureOrderRuleController.getOrgFullName(measureOrderRuleController.selectedUserOrg)}" readonly="true" required="true" requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
                            <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                            <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;" value="#{measureOrderRuleController.orgTree}" selection="#{measureOrderRuleController.selectedNode}" var="node" selectionMode="single">
                                        <p:ajax process="@this" event="select" update=":MeasureOrderRuleSaveAsForm" listener="#{measureOrderRuleController.onSelectOrgForUser}" oncomplete="PF('varPanelOrg4User').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
										<p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.assetName} *</label>
                            <p:inputText id="assetName" value="#{measureOrderRuleController.selected.assetName}" required="true" requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.assetGroup}</label>
                            <p:selectOneMenu value="#{measureOrderRuleController.selected.assetGroup}" disabled="false" required="false" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}">
                                <p:ajax  update="report" />
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.manufacture}</label>
                            <p:autoComplete id="manufacture" value="#{measureOrderRuleController.selected.manufacture}" dropdown="true" scrollHeight="300"
                                            forceSelection="true" required="false" requiredMessage="" completeMethod="#{measureOrderRuleController.getSupplier}"
                                            var="t" itemLabel="#{t}" itemValue="#{t}">
                                <p:ajax process="@this" event="itemSelect" listener="#{measureOrderRuleController.setNothing()}"/>
                                <p:ajax process="@this" listener="#{measureOrderRuleController.setNothing()}"/>
                            </p:autoComplete>
                           <!-- <p:selectOneMenu value="#{measureOrderRuleController.selected.manufacture}" disabled="false" required="false" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}" style="max-width: 200px">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{measureOrderRuleController.getSupplier()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.name}"/>
                            </p:selectOneMenu>-->
                            <!--<p:inputText id="manufacture" value="#{measureOrderRuleController.selected.manufacture}" required="false" requiredMessage="#{msg.manufacture} #{msg.ValidationRequire}"/>-->
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.functionType}</label>
                            <p:inputText id="functionType" value="#{measureOrderRuleController.selected.functionType}" required="false" requiredMessage="#{msg.functionType} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.period}(月)</label>
                            <p:inputNumber id="period" value="#{measureOrderRuleController.selected.period}" minValue="1" maxValue="120" decimalPlaces="0" 
                            required="false" requiredMessage="超出范围（只能是1到120）！"  />
                            <!-- <p:inputText id="period"  value="#{measureOrderRuleController.selected.period}" required="false" requiredMessage="#{msg.period} #{msg.ValidationRequire}"/> -->
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.feedbackComment}</label>
                            <p:inputText id="remark" value="#{measureOrderRuleController.selected.remark}" required="false" requiredMessage="#{msg.manufacture} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
<!--                        <h:panelGroup >
                            <label class ="label">#{msg.ruleLevel}*</label>
                            <p:selectOneMenu value="#{measureOrderRuleController.selected.level}" disabled="false" required="true" requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>-->
                    </p:panelGrid>
                    
                    <p:panelGrid id="report" columns="1"  styleClass="ui-panelgrid-blank form-group" layout="grid" >
                    
                    	<h:panelGroup>
	                    	 <label class ="label" >#{msg.safetyReport}</label>
		                   <p:selectOneMenu value="#{measureOrderRuleController.selected.safetyReport}"  >
		                   			<p:ajax  update="report" />
	                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
	                                <f:selectItems value="#{measureOrderRuleController.getTableDefinitionForES()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.baseId}"/>
	                       </p:selectOneMenu>
                                 <h:outputText style="display:none" id="safetyReport" value="#{measureOrderRuleController.getJsonValueById(measureOrderRuleController.selected.safetyReport)}" />
	                        &nbsp;&nbsp;
	                   <p:commandButton rendered="#{not empty measureOrderRuleController.selected.safetyReport}"  immediate="true" value="预览" onclick="preparePreview(1,'MeasureOrderRuleSaveAsForm');" oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                       </h:panelGroup>
                       
                       <h:panelGroup>
	                		<label class ="label">#{msg.performanceReport}</label>
	                     <p:selectOneMenu  value="#{measureOrderRuleController.selected.performanceReport}"  >
	                     		<p:ajax   update="report" />
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{measureOrderRuleController.getTableDefinition()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.baseId}"/>
                       	</p:selectOneMenu>
                                        <h:outputText style="display:none" id="performanceReport" value="#{measureOrderRuleController.getJsonValueById(measureOrderRuleController.selected.performanceReport)}"  />
                       	 &nbsp;&nbsp;
                     	<p:commandButton rendered="#{not empty measureOrderRuleController.selected.performanceReport}"  immediate="true" value="预览" onclick="preparePreview(2,'MeasureOrderRuleSaveAsForm');"  oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                     </h:panelGroup>

                    <h:panelGroup rendered="#{userContextService.hasRole('AssetHead')}">
                        <!-- hide while creation -->
                        <label class="label">保养模版</label>
                        <p:commandLink value="下载模版示例" actionListener="#{measureOrderRuleController.generateReportTemplateFile()}" ajax="false" immediate="true">
                            <p:fileDownload value="#{measureOrderRuleController.reportTemplateFile}"/>
                        </p:commandLink><br/>
                        <h:panelGroup id="importReportTemplate">
                            <p:commandButton value="导入模版" process="@this" update="importReportTemplate" oncomplete="PF('uploadSaveAsDialog').show()" rendered="#{empty measureOrderRuleController.selected.reportStorageId}"/>
                            <p:link href="#{fileDownloadService.getFileUrl(measureOrderRuleController.selected.reportStorageId)}" rendered="#{not empty measureOrderRuleController.selected.reportStorageId}">#{measureOrderRuleController.selected.reportTemplateName}</p:link>
                            <p:commandButton icon="ui-icon-close" class="btn btn-sm btn-gray" title="${msg.Delete}" update=":MeasureOrderRuleSaveAsForm:importReportTemplate :uploadSaveAsDialogForm :growl" process="@this" actionListener="#{measureOrderRuleController.removeReportTemplate}" rendered="#{not empty measureOrderRuleController.selected.reportStorageId}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                       
	                  <!-- <h:panelGroup>
	                		<label class ="label">#{msg.performanceReport}</label>
	                     <p:selectOneMenu value="#{measureOrderRuleController.selected.performanceReport}"  >
	                     		<p:ajax  update="report" />
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{measureOrderRuleController.getTableDefinition()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.schema}"/>
                       	</p:selectOneMenu>
                       	 &nbsp;&nbsp;
                       	  <h:inputHidden id="performanceReport" value="#{measureOrderRuleController.selected.performanceReport}" />
                     	<p:commandButton  rendered="#{not empty measureOrderRuleController.selected.performanceReport}" immediate="true" value="预览" onclick="preparePreview(2);"  oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                     </h:panelGroup> -->
                   </p:panelGrid>
					 &nbsp;&nbsp;


                    
                    <!--<p:scrollPanel  style="height:150px">
                        <p:selectManyCheckbox id="grid2" value="#{measureOrderRuleController.ids}" layout="pageDirection" columns="1"  styleClass="checkboxGroup"
                        rendered="#{measureOrderRuleController.getSelectedIds() != null}">
                            <f:selectItems value="#{measureOrderRuleController.getAllItems()}" var="i"  itemLabel="#{i.name}(#{i.period}月)"  itemValue="#{i.id}" />
                        </p:selectManyCheckbox>	
                    </p:scrollPanel>-->

                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">增加检查项</label>
                            <p:dataTable id="addCheckList" class="addCheckList" value="#{measureOrderRuleController.checkItemLists}" var="item" widgetVar="addCheckList" lazy="false" paginator="false"
                                         rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.name}">
                                    <h:outputText value="#{item.name}" />
                                </p:column>
                                <p:column headerText="#{msg.period}">
                                    <h:outputText value="#{item.period}" />
                                </p:column>
                                <!--<p:column headerText="注意事项">
                                    <h:outputText value="#{item.remark}"  style="word-wrap: break-word;"/>
                                </p:column>-->
                                <p:column headerText="项目内容">
                                    <h:outputText value="#{item.remark}"  style="word-wrap: break-word;"/>
                                </p:column>
                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{measureOrderRuleController.prepareEditItemDetail('new')}" update=":MeasureOrderRuleItemSaveAsDlg" oncomplete="PF('MeasureOrderRuleItemSaveAsDlg').show()" rendered="#{item.uid eq '000'}"/>
                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{measureOrderRuleController.prepareEditItemDetail(item.uid)}" update="@(.MeasureOrderRuleItemSaveAsDlg)" oncomplete="PF('MeasureOrderRuleItemSaveAsDlg').show()" rendered="#{item.uid ne '000'}" />
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{measureOrderRuleController.deleteItemDetail(item.uid)}" update="@(.addCheckList)" rendered="#{item.uid ne '000'}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    
<!--                     <p:commandButton validateClient="true" actionListener="#{measureOrderRuleController.applyChange()}" value="#{msg.Save}" 
                    rendered="#{measureOrderRuleController.selected.status != 1 or userContextService.hasRole('AssetHead')}"
                    update="display,:MeasureOrderRuleEditForm, :MeasureOrderRuleListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'MeasureOrderRuleEditDialog');"/>
                    &nbsp;&nbsp; -->
                    <p:commandButton validateClient="true" actionListener="#{measureOrderRuleController.saveAs()}" value="另存为" 
                    update="display,:MeasureOrderRuleSaveAsForm, :MeasureOrderRuleListForm:datalist, :growl" icon="ui-icon-check" 
                    oncomplete="handleSubmit(args, 'SaveAsDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('SaveAsDialog').hide()" update = ":MeasureOrderRuleListForm:datalist"/>
                    &nbsp;&nbsp;
                </h:panelGroup>
            </h:form>
           
        </p:dialog>
        <ui:include src="ItemSaveAs.xhtml"/>
        <p:dialog id="uploadSaveAsDialog" widgetVar="uploadSaveAsDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="上传模版文件">
            <h:form id="uploadSaveAsDialogForm" >
                <h:panelGroup id="display1" >
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <h:outputText   value="#{measureOrderRuleController.uploadedFile.fileName}"  rendered="#{not empty measureOrderRuleController.uploadedFile}"/>
                            <p:fileUpload  fileUploadListener="#{measureOrderRuleController.uploadDataFile}" value="#{measureOrderRuleController.uploadedFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                           multiple="false" sizeLimit="10000000" update=":uploadSaveAsDialogForm" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(docx)$/" label="#{msg.Add}" rendered="#{empty measureOrderRuleController.uploadedFile}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <p>说明</p>
                            <p>上传文件进行导入</p>
                        </h:panelGroup>
                    </p:panelGrid>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{measureOrderRuleController.finishUpload()}" disabled="#{empty measureOrderRuleController.uploadedFile}" value="#{msg.Confirm}"
                                         update=":MeasureOrderRuleSaveAsForm:importReportTemplate :uploadSaveAsDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'uploadSaveAsDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{measureOrderRuleController.cancelUpload()}" icon="ui-icon-cancel" onclick="PF('uploadSaveAsDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
