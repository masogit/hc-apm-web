<ui:composition xmlns="http://www.w3.org/1999/xhtml"

                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
       <div class="ui-g clearfix">
       <div class="ui-g-12 card cardTitle">
           <p:outputLabel class="pageTitle" value="#{msg.RelMeasureRule}"/>
       </div>

       <div class="ui-g-12 card">
    
        <h:form id="BatchCreateForm">
<!--              <p:tabView>
                <p:tab > -->
                   <p:panelGrid id="queryCondition" columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                       <h:panelGroup>
                           <label class="label">#{msg.hospitalId}</label>
                           <p:inputText id="selectedUserOrgName" value="#{relMeasureRuleController.getOrgFullName(relMeasureRuleController.selectedUserOrg)}" readonly="true" required="false" requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
                           <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                           <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                               <p:scrollPanel style="height:300px;border: 0" mode="native">
                                   <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;" value="#{relMeasureRuleController.orgTree}" selection="#{relMeasureRuleController.selectedNode}" var="node" selectionMode="single">
                                       <p:ajax process="@this" event="select" update="BatchCreateForm" listener="#{relMeasureRuleController.onSelectOrgForUser}" oncomplete="PF('varPanelOrg4User').hide();"/>
                                       <p:ajax process="@this" event="expand"/>
                                       <p:ajax process="@this" event="collapse"/>
                                       <p:treeNode type="org">
                                           <h:outputText value="#{node}"/>
                                       </p:treeNode>
									   <p:treeNode type="hidden" rendered="false"/>
                                   </p:tree>
                               </p:scrollPanel>
                           </p:overlayPanel>
                       </h:panelGroup>

                       <h:panelGroup >
                           <label class ="label">#{msg.clinicalDeptName}</label>
                           <p:autoComplete id="clinicalDeptName" value="#{relMeasureRuleController.clinicalOrgInfo}" dropdown="true" scrollHeight="300" style="max-width: 200px"
                                           forceSelection="true" completeMethod="#{relMeasureRuleController.getClinicalDeptList}"
                                           var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" >
                               <p:ajax process="@this" event="itemSelect" listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList"/>
                               <p:ajax process="@this" listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList"/>
                           </p:autoComplete>
                           <!--<p:selectOneMenu value="#{relMeasureRuleController.queryAsset.clinicalDeptId}" disabled="false" >
                                   <p:ajax  listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList" process="@this"/>
                                   <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                   <f:selectItems value="#{assetInfoService.getClinicalDeptList(relMeasureRuleController.siteUid)}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                           </p:selectOneMenu>-->
                       </h:panelGroup>

                       <h:panelGroup >
		                     <label class ="label">#{msg.assetName}</label>
	                         <p:inputText  value="#{relMeasureRuleController.queryAsset.name}"  required="false">
                                    <p:ajax listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList" process="@this"/>
                             </p:inputText>
                       </h:panelGroup>
                       <h:panelGroup >
		                     <label class ="label">#{msg.assetGroup}</label>
		                     <p:selectOneMenu value="#{relMeasureRuleController.queryAsset.assetGroup}" disabled="false" >
		                              <p:ajax  listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList" process="@this"/>
		                              <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
		                             <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
		                      </p:selectOneMenu>
		                 </h:panelGroup>
		                 <h:panelGroup >
		                     <label class ="label">#{msg.manufacture}</label>
                             <p:autoComplete id="manufacture" value="#{relMeasureRuleController.queryAsset.manufacture}" dropdown="true" scrollHeight="300" style="max-width: 200px"
                                             forceSelection="true" required="false" requiredMessage="" completeMethod="#{relMeasureRuleController.getSupplier}"
                                             var="t" itemLabel="#{t}" itemValue="#{t}">
                                 <p:ajax process="@this" event="itemSelect" listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList"/>
                                 <p:ajax process="@this" listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList"/>
                             </p:autoComplete>

                            <!-- <p:autoComplete id="manufacture" value="#{relMeasureRuleController.queryAsset.manufacture}" dropdown="true" scrollHeight="300" style="max-width: 200px"
                                             forceSelection="true" completeMethod="#{relMeasureRuleController.getSupplier}"
                                                 var="t" itemLabel="#{t}" itemValue="#{t.name}">
                                 <p:ajax process="@this" event="itemSelect" listener="#{relMeasureRuleController.addFilter()}"/>
                                 <p:ajax process="@this" listener="#{relMeasureRuleController.addFilter()}"/>
                             </p:autoComplete>-->
                             <!--<p:selectOneMenu value="#{relMeasureRuleController.queryAsset.manufactureId}" style="max-width: 200px">
                                 <p:ajax listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList" process="@this" />
                                 <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                 <f:selectItems value="#{generatePmOrdersController.getSupplier()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.id}"/>
                             </p:selectOneMenu>-->
		                      <!--<p:inputText  value="#{relMeasureRuleController.queryAsset.manufacture}"  required="false">
	                                    <p:ajax  listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList PmOrderRule"  />
	                          </p:inputText>-->
		                 </h:panelGroup>
		                 <h:panelGroup >
		                      <label class ="label">#{msg.functionType}</label>
		                      <p:inputText  value="#{relMeasureRuleController.queryAsset.functionType}"  required="false">
	                                    <p:ajax  listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList" process="@this"/>
	                          </p:inputText>
		                 </h:panelGroup>

                       <h:panelGroup >
                           <label class ="label">#{msg.brand}</label>
                           <p:inputText  value="#{relMeasureRuleController.queryAsset.brand}"  disabled="false">
                               <p:ajax  listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList" process="@this" />
                           </p:inputText>
                       </h:panelGroup>

                      <h:panelGroup >
                            <label class="label">保养规则(该过滤条件不会单独生效，需要配合以上条件)</label>
                            <p:selectOneRadio id="deviceStatus" value="#{relMeasureRuleController.queryAsset.ruleStatus}" >
                                    <p:ajax listener="#{relMeasureRuleController.addFilter()}" update="queryCondition AssetsPickList" process="@this"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ruleStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneRadio>
                      </h:panelGroup>

                       <h:panelGroup id="queryLevel" rendered="#{relMeasureRuleController.queryAsset.ruleStatus != null}">
                           <label class="label">规则等级</label>
                           <p:selectOneMenu value="#{relMeasureRuleController.queryAsset.queryLevel}">
                               <p:ajax  listener="#{relMeasureRuleController.addFilter()}" update="AssetsPickList" process="@this"/>
                               <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                               <f:selectItems value="#{fieldMsg.getFieldValueList('pmOrderRuleLevel')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                           </p:selectOneMenu>
                       </h:panelGroup>
                    </p:panelGrid>
                    
                    <p:pickList id="AssetsPickList" value="#{relMeasureRuleController.availableAssets}" var="item"
                                itemValue="#{item}" itemLabel="#{item.name}" showCheckbox="false" responsive="true"
                                showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter"
                                required="false" requiredMessage="已选设备 #{msg.ValidationRequire}">
                        <f:facet name="sourceCaption">待选设备</f:facet>
                        <f:facet name="targetCaption">已选设备</f:facet>
                        <p:ajax event="transfer" listener="#{relMeasureRuleController.onAssetsTransfer}" />
                        <p:column style="float: left;width:25%;">
                            <h:outputText value="#{item.name}" />
                        </p:column>
                        <p:column style="float: left;width:30%;">
                            <h:outputText value="#{item.departNum}" />
                        </p:column>
<!--                        <p:column style="float: left;width:20%;">
                            <h:outputText value="#{relMeasureRuleController.getStrDate(item.lastPmDate)}" />
                        </p:column> -->
                        <!--<p:column style="float: left;width:20%;">
                            <h:outputText value="#{relMeasureRuleController.getOrgName(item.siteUID)}" />
                        </p:column>-->
                         <p:column style="float: left;width:25%;">
                            <h:outputText value="#{item.clinicalDeptName}" />
                        </p:column>
                        <p:column>
                            <h:outputText value="#{item.functionType}" />
                        </p:column>
                    </p:pickList>
                    <br/> <br/>
                    <p:commandButton id ="hidden1" value="hello1" style="display:none"/>
                    <p:panelGrid id ="PmOrderRule" columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                              <label class="label">#{msg.ruleLevel}*</label>
                              <p:selectOneMenu id="ruleLevel" value="#{relMeasureRuleController.level}" disabled="false" required="true" requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}">
	                            	<p:ajax listener="#{relMeasureRuleController.clearPmOrderRule()}" update="PmOrderRule"/>
	                             <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
	                             <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
		                      </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.RelMeasureRule}*</label>
                            <p:autoComplete id="SelectedPmOrderRule" value="#{relMeasureRuleController.measureOrderRule}" dropdown="true" scrollHeight="300" rendered="#{relMeasureRuleController.level > 0}"
                                            forceSelection="true" required="true" requiredMessage="#{msg.RelMeasureRule}#{msg.ValidationRequire}" completeMethod="#{relMeasureRuleController.getRuleList}"
                                            var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="measureOrderRuleConverter">
                                    <p:ajax process="@this" event="itemSelect" listener="#{relMeasureRuleController.setRuleId()}"/>
                                    <p:ajax process="@this" listener="#{relMeasureRuleController.setRuleId()}"/>
                            </p:autoComplete>
                        </h:panelGroup>

                        <!-- <h:panelGroup >
                              <label class="label">#{msg.PmOrderRule}*</label>
                               <p:selectOneMenu id="measureOrderRule" value="#{relMeasureRuleController.pmOrderRuleUID}"
                               required="true" requiredMessage="#{msg.PmOrderRule}#{msg.ValidationRequire}"  rendered="#{relMeasureRuleController.level > 0}">
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                  &lt;!&ndash;  <f:selectItems value="#{fieldMsg.getFieldValueList('deviceType')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/> &ndash;&gt;
                                   <f:selectItems value="#{relMeasureRuleController.getPmOrderRuleList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                               </p:selectOneMenu>
                        </h:panelGroup>-->

                    </p:panelGrid>
                    <br/> <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{relMeasureRuleController.saveRel()}" value="#{msg.Save}" icon="ui-icon-check" update=":growl" />
                        <p:commandButton id="returnButton" value="#{msg.Return}" icon="ui-icon-arrow-back" action="/portal/measureOrderRule/relMeasureRule/List.xhtml" immediate="true" />
                    </h:panelGroup>

                        <!--<p:commandButton validateClient="true" actionListener="#{relMeasureRuleController.saveRel()}" value="#{msg.Save}" icon="ui-icon-check" update=":growl" />-->

                    <!--</p:panelGrid>-->

            </p:tabView> -->

            icon="ui-icon-check" update="BatchCreateForm,:growl" action = "RelRuleAsset"/> -->
        </h:form>
        </div>
      </div>
        
    </ui:define>
