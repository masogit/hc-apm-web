<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <div class="ui-g clearfix" id="header">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.Create} 计量结果"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="measureCoWorkerDlgForm">
                    <p:fieldset legend="计量报告上传"  >
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <p:fieldset  toggleable="false" rendered="#{not empty measuringCertificateDetailController.streamedContents}">
                                    <p:dataGrid  var="fileitem"  value="#{measuringCertificateDetailController.getStreamedContents()}" columns="5" layout="grid" >
                                        <p:panel  style="text-align:center">
                                            <h:panelGrid columns="2" style="width:100%" >
                                                 <p:ajax disabled="#{!preViewerBean.isPreview(fileitem)}" event="click" update="previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(workOrderMgrController,fileitem)}"/>
                                                <p:graphicImage value="#{measuringCertificateDetailController.getStreamedContentImg(fileitem)}" height="80" width="100" stream="false" >
                                                </p:graphicImage>
                                            </h:panelGrid>
                                            <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.name}" action="#{measuringCertificateDetailController.downloadFile(fileitem)}" ajax="false"  styleClass="p-mr-2"/><br/>
                                            <p:commandButton validateClient="false" actionListener="#{measuringCertificateDetailController.removeAttachment(fileitem)}" update="measureCoWorkerDlgForm"  icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                            </p:commandButton>
                                        </p:panel>
                                    </p:dataGrid>
                                </p:fieldset>
                                <p:fileUpload id="fileUpload" fileUploadListener="#{measuringCertificateDetailController.uploadDataFile}"
                                              disabled="#{not empty measuringCertificateDetailController.streamedContents}"
                                               mode="advanced"
                                              dragDropSupport="false" style="width:100%" process="@this"
                                              multiple="false"
                                              update="measureCoWorkerDlgForm" auto="true" fileLimit="1"
                                              invalidFileMessage="请上传pdf类型计量报告!"
                                              accept="image/*,application/pdf"
                                              allowTypes="#{measuringCertificateDetailController.getAllowTypes()}" label="添加并OCR识别"
                                />
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="#{msg.BasicInfo}"  id="basicInfo">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">证件编号<span style="color:red;">*</span></label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.certificateNo}" required="true" requiredMessage="证件编号 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">器具名称</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.assetName}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">型号</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.assetModel}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">制造厂</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.assetManufacturer}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">设备序列号SN</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.assetSN}">
                                    <p:ajax update="basicInfo" listener="#{measuringCertificateDetailController.handleValueChangeAssetSN()}" process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">资产编号</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.financeNo}" >
                                    <p:ajax update="basicInfo" listener="#{measuringCertificateDetailController.handleValueChangeFinanceNo()}" process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">二维码</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.qrCode}">
                                    <p:ajax update="basicInfo" listener="#{measuringCertificateDetailController.handleValueChangeQrCode()}" process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">设备编号</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.departNum}" >
                                    <p:ajax update="basicInfo" listener="#{measuringCertificateDetailController.handleValueChangeDepartNum()}" process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">检定结论</label>
        <!--                        <p:inputText  value="#{measuringCertificateDetailController.selected.status}" />-->
                                <p:selectOneMenu value="#{measuringCertificateDetailController.selected.status}">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('measuringStatus')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">检定日期<span style="color:red;">*</span></label>
                                <p:calendar timeZone="GMT+8"  id="checkDate" pattern="yyyy/MM/dd" value="#{measuringCertificateDetailController.selected.checkDate}" required="true" requiredMessage="检定日期 #{msg.ValidationRequire}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">有效期至<span style="color:red;">*</span></label>
                                <p:calendar timeZone="GMT+8"  id="validDateTo" pattern="yyyy/MM/dd" value="#{measuringCertificateDetailController.selected.validDateTo}" required="true" requiredMessage="有效期至 #{msg.ValidationRequire}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">检定人员</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.checkPerson}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">项别</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.checkItem}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">种别</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.type}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">备注</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.comments}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">存档记录</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.fileNo}" />
                            </h:panelGroup>
                        </p:panelGrid>
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">检测单位</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.checkCompany}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">送检单位</label>
                                <p:inputText  value="#{measuringCertificateDetailController.selected.department}" />
                            </h:panelGroup>
                        </p:panelGrid>

                    </p:fieldset>
                    <h:panelGroup>
                        <p:commandButton id="saveButton" actionListener="#{measuringCertificateDetailController.save()}" value="保存"  icon="ui-icon-check" class="btn btn-sm btn-gray"  />
                        <p:commandButton   action="#{measuringCertificateDetailController.getListPageLink()}" immediate="true"  value="返回"  icon="ui-icon-arrow-back" class="btn btn-sm btn-gray" />
                    </h:panelGroup>

                </h:form>
                <ui:include src="/portal/preview/view.xhtml" />
            </div>
        </div>
 </ui:define>
</ui:composition>
