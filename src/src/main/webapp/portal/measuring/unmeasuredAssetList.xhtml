<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <div class="ui-g-12 card">
            <h:form id="unmeasuredAssetListForm" rendered="#{unmeasuredAssetListController.customRoleAuth.authSearch}">
                <p:dataTable id="datalist_unmeasuredAsset" value="#{unmeasuredAssetListController.lazyModel}" var="item" widgetVar="varDataList_unmeasuredAsset"
                             selectionMode="single" selection="#{unmeasuredAssetListController.selected}"
                             lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                             rows="20" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="20,50,100,500">

                    <p:ajax event="filter" listener="#{unmeasuredAssetListController.onFilter}"/>
                    <p:column headerText="设备名称" filterBy="#{item.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column headerText="设备序列号" filterBy="#{item.serialNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.serialNum}"/>
                    </p:column>
                    <p:column headerText="资产编号" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.financingNum}"/>
                    </p:column>
                    <p:column headerText="设备型号" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.functionType}"/>
                    </p:column>
                    <p:column headerText="#{msg.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_unmeasuredAsset').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="#{msg.clinicalDeptName}">
                        <f:facet name="header">
                            <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                            <p:inputText id="clinicalDept"  value="#{unmeasuredAssetListController.filterOrg.name}"  readonly="true"/>
                        </f:facet>
                        <h:outputText value="#{item.clinicalDeptName}"/>
                    </p:column>
                    <p:column headerText="计量等级" filterBy="#{item.measureGrade}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('measureGrade',item.measureGrade)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_unmeasuredAsset').filter()">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getMeasureGradeList()}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="计量类别" filterBy="#{item.measuringItemCategory}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('measuringItemCategory',item.measuringItemCategory)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_unmeasuredAsset').filter()">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('measuringItemCategory')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>

                    <f:facet name="{Toolbar}">
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist_unmeasuredAsset" fileName="UnmeasuredAsset_export"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>

            <p:overlayPanel id="idVarPanelDeptOrg1" widgetVar="varPanelDeptOrg1" for=":measuringTab:unmeasuredAssetListForm:datalist_unmeasuredAsset:clinicalDept" dismissable="true" style="text-align: left;">
                <p:scrollPanel style="height:300px;border: 0" mode="native">
                    <p:tree id="orgTree1" class="tree" style="width:98%;border:0;" value="#{orgTreeController.getDeptOrgTree(UserContextService.getCurrentUserAccount().getSiteUID())}"  var="node" selectionMode="single" dynamic="false">
                        <p:ajax process="@this" event="select"  listener="#{unmeasuredAssetListController.onClinicalDeptFilter}" update="measuringTab:unmeasuredAssetListForm:datalist_unmeasuredAsset:clinicalDept measuringTab:idVarPanelDeptOrg1" oncomplete="PF('varDataList_unmeasuredAsset').filter();PF('varPanelDeptOrg1').hide();"/>
                        <p:ajax process="@this" event="expand"/>
                        <p:ajax process="@this" event="collapse"/>
                        <p:treeNode type="org">
                            <h:outputText value="#{node.shortName}"/>
                        </p:treeNode>
                        <p:treeNode type="hidden" rendered="false"/>
                    </p:tree>
                </p:scrollPanel>
            </p:overlayPanel>
        </div>
    </ui:composition>
</html>
