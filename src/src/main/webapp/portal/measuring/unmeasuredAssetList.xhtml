<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <style>
            .measuringExpiredSoon {
                background-color: #fca752!important;
                color: #000000!important;
            }
            .btn+.btn { margin-left: 0 }
            .ui-column-resizer:before {content: none!important;}
            th{font-size: 12px!important;}
            td{font-size: 12px!important;padding: 0px!important;}
            table .ui-chkbox-icon, td img{ zoom: 0.7!important}
        </style>
        <div class="ui-g-12 card">

            <h:form id="unmeasuredAssetListForm" rendered="#{unmeasuredAssetListController.customRoleAuth.authSearch}">
                    <h:panelGrid id="expiredSoon" columns="2" style="float: right" rendered="#{unmeasuredAssetListController.queryIndex eq 2}">
                        <h:panelGroup style="float: right">
                            <span >#{msg.Legend}：</span>
                            <span class="measuringExpiredSoon">计量即将到期</span>
                        </h:panelGroup>
                    </h:panelGrid>
                <h:panelGrid id="buttonSet" columns="3" cellpadding="5">
                    <p:commandButton value="从未计量"  process="@this" update="datalist_unmeasuredAsset buttonSet measuringTab:unmeasuredAssetListForm measuringTab:idVarPanelDeptOrg3" actionListener="#{unmeasuredAssetListController.changeIndex(0)}" disabled="#{unmeasuredAssetListController.queryIndex==0}"/>
                    <p:commandButton value="逾期待计量"  process="@this" update="datalist_unmeasuredAsset buttonSet measuringTab:unmeasuredAssetListForm measuringTab:idVarPanelDeptOrg3 measuringTab:idPanelFilterNextMeteringDate measuringTab:idPanelFilterLastMeteringDate" actionListener="#{unmeasuredAssetListController.changeIndex(1)}" disabled="#{unmeasuredAssetListController.queryIndex==1}"/>
                    <p:commandButton value="未逾期待计量"  process="@this" update="datalist_unmeasuredAsset buttonSet measuringTab:unmeasuredAssetListForm measuringTab:idVarPanelDeptOrg3 measuringTab:idPanelFilterNextMeteringDate measuringTab:idPanelFilterLastMeteringDate" actionListener="#{unmeasuredAssetListController.changeIndex(2)}" disabled="#{unmeasuredAssetListController.queryIndex==2}"/>
                </h:panelGrid>

                <p:dataTable id="datalist_unmeasuredAsset" value="#{unmeasuredAssetListController.lazyModel}" var="item" widgetVar="varDataList_unmeasuredAsset"
                             selectionMode="single" selection="#{unmeasuredAssetListController.selected}"
                             lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                             rowStyleClass="#{unmeasuredAssetListController.queryIndex eq 2 ? item.measuringAlertStatus : ''}"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                             rows="20" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="20,50,100,500">

                    <p:ajax event="filter" listener="#{unmeasuredAssetListController.onFilter}" />
                    <p:column headerText="设备名称" filterBy="#{item.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column headerText="设备序列号" filterBy="#{item.serialNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.serialNum}"/>
                    </p:column>
                    <p:column headerText="资产编号" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.financingNum}"/>
                    </p:column>
                    <p:column headerText="设备型号" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.functionType}"/>
                    </p:column>
                    <p:column headerText="#{msg.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_unmeasuredAsset').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="#{msg.clinicalDeptName}">
                        <f:facet name="header">
                            <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                            <p:inputText id="clinicalDept"  value="#{unmeasuredAssetListController.filterOrg.name}"  readonly="true"/>
                        </f:facet>
                        <h:outputText value="#{item.clinicalDeptName}"/>
                    </p:column>
                    <p:column headerText="计量等级" filterBy="#{item.measureGrade}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('measureGrade',item.measureGrade)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_unmeasuredAsset').filter()">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getMeasureGradeList()}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="计量类别" filterBy="#{item.measuringItemCategory}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('measuringItemCategory',item.measuringItemCategory)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_unmeasuredAsset').filter()">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('measuringItemCategory')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="下次计量日期" sortBy="#{item.nextMeteringDate}" filterBy="#{item.nextMeteringDate}" filterMatchMode="GTE" rendered="#{unmeasuredAssetListController.queryIndex ne 0}">
                        <f:facet name="filter">
                            <p:inputText id="filterNextMeteringDate" widgetVar="varFilterNextMeteringDate" />
                        </f:facet>
                        <h:outputText value="#{item.nextMeteringDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="上次计量日期" sortBy="#{item.lastMeteringDate}" filterBy="#{item.lastMeteringDate}" filterMatchMode="GTE" rendered="#{unmeasuredAssetListController.queryIndex ne 0}">
                        <f:facet name="filter">
                            <p:inputText id="filterLastMeteringDate" widgetVar="varFilterLastMeteringDate" />
                        </f:facet>
                        <h:outputText value="#{item.lastMeteringDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>

                    <f:facet name="{Toolbar}">
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist_unmeasuredAsset" fileName="UnmeasuredAsset_export" postProcessor="#{unmeasuredAssetListController.postProcessorExcel}" />
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>

            <p:overlayPanel id="idVarPanelDeptOrg3" widgetVar="varPanelDeptOrg3" for=":measuringTab:unmeasuredAssetListForm:datalist_unmeasuredAsset:clinicalDept" dismissable="true" style="text-align: left;">
                <p:scrollPanel style="height:300px;border: 0" mode="native">
                    <p:inputText id="treeNodeNameFilter3" value="#{orgTreeController.treeNodeNameFilter}"/>
                    <p:commandButton partialSubmit="true" icon="ui-icon-search" process="measuringTab:treeNodeNameFilter3 @this" update="measuringTab:orgTree1" actionListener="#{orgTreeController.filterDeptOrgTree()}" value="检索"/>
                    <p:tree id="orgTree1" class="tree" style="width:98%;border:0;" value="#{orgTreeController.getDeptOrgTree(UserContextService.getCurrentUserAccount().getSiteUID())}"  var="node" selectionMode="single" dynamic="false">
                        <p:ajax process="@this" event="select"  listener="#{unmeasuredAssetListController.onClinicalDeptFilter}" update="measuringTab:unmeasuredAssetListForm:datalist_unmeasuredAsset:clinicalDept measuringTab:idVarPanelDeptOrg3" oncomplete="PF('varDataList_unmeasuredAsset').filter();PF('varPanelDeptOrg3').hide();"/>
                        <p:ajax process="@this" event="expand"/>
                        <p:ajax process="@this" event="collapse"/>
                        <p:treeNode type="org">
                            <h:outputText value="#{node.shortName}"/>
                        </p:treeNode>
                        <p:treeNode type="hidden" rendered="false"/>
                    </p:tree>
                </p:scrollPanel>
            </p:overlayPanel>

            <p:overlayPanel  id="idPanelFilterNextMeteringDate" widgetVar="panelFilterNextMeteringDate" for=":measuringTab:unmeasuredAssetListForm:datalist_unmeasuredAsset:filterNextMeteringDate" dismissable="false">
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_NextMeteringDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_NextMeteringDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList_unmeasuredAsset','varFilterNextMeteringDate','varStartTimeFrom_NextMeteringDate','varStartTimeTo_NextMeteringDate'); PF('panelFilterNextMeteringDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterNextMeteringDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>

            <p:overlayPanel id="idPanelFilterLastMeteringDate" widgetVar="panelFilterLastMeteringDate" for=":measuringTab:unmeasuredAssetListForm:datalist_unmeasuredAsset:filterLastMeteringDate" dismissable="false">
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_LastMeteringDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_LastMeteringDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList_unmeasuredAsset','varFilterLastMeteringDate','varStartTimeFrom_LastMeteringDate','varStartTimeTo_LastMeteringDate'); PF('panelFilterLastMeteringDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterLastMeteringDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>
        </div>
    </ui:composition>
</html>
