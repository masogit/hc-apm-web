<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <h:outputStylesheet>
            .warning-row {
                background-color: #fff3cd !important;
            }
            .warning-row:hover {
                background-color: #ffeeba !important;
            }
        </h:outputStylesheet>
        <div class="ui-g-12 card">
            <h:form id="measuringAssetListForm" rendered="#{measureAssetListController.customRoleAuth.authSearch}">

                <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                    <p:commandButton value="全部匹配台账结果"     process="@this" update="measuringTab "  disabled="#{measureAssetListController.matchType==9}"  actionListener="#{measureAssetListController.initMatchResult(9)}" />
                    <p:commandButton value="匹配台账检定结果"     process="@this" update="measuringTab "  disabled="#{measureAssetListController.matchType==1}"  actionListener="#{measureAssetListController.initMatchResult(1)}" />
                    <p:commandButton value="匹配台账校准结果"     process="@this" update="measuringTab"  disabled="#{measureAssetListController.matchType==2}"  actionListener="#{measureAssetListController.initMatchResult(2)}" />
                    <p:commandButton value="未匹配台账结果"   process="@this" update="measuringTab"  disabled="#{measureAssetListController.matchType==3}"  actionListener="#{measureAssetListController.initMatchResult(3)}" />
                    <p:commandButton value="刷新匹配" process="@this" update="measuringTab:measuringAssetListForm :growl"
                                     rendered="#{measureAssetListController.matchType==3}"
                                     actionListener="#{measureAssetListController.refreshMatchBySN}"
                                     onstart="PF('refreshMatchDlg').show()" oncomplete="PF('refreshMatchDlg').hide()"/>
                </h:panelGrid>

                <h:outputLabel class="label" style="color: black!important;font-size: 16px!important;" rendered="#{userContextService.hasCurrentTenantName('')}">计量日期到期提醒：本月&nbsp;<span style="color:orange;">#{measureAssetListController.currentMonthCount}</span>&nbsp;台，下月&nbsp;<span style="color: orange;">#{measureAssetListController.nextMonthCount}</span>&nbsp;台</h:outputLabel>
                <p:dataTable id="datalist_measuringAsset" value="#{measureAssetListController.lazyModel}" var="item" widgetVar="varDataList_measuringAsset"
                             selectionMode="single" selection="#{measureAssetListController.selected}"
                             lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.check_date}"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                             rows="20" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="20,50,100,500">
<!--                             rowStyleClass="#{measureAssetListController.measuringDateWarningEnabled and item.hasDateWarning ? 'warning-row' : ''}">-->

                    <p:ajax event="rowSelect" listener="#{measureAssetListController.onSelectMeasureAsset}" onstart="prepareAssetViewWindow1();" oncomplete="openAssetViewWindow1(xhr, status, args)" />
                    <p:ajax event="filter" listener="#{measureAssetListController.onFilter}" oncomplete="updateSelectAllCheckBox();"/>
                    <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                    <p:column width="36"  id="checkBoxColumn" exportable="false">
                        <p:selectBooleanCheckbox value="#{measureAssetListController.selectedMap[item.boUuid]}"  class="selectCheckBox">
                            <p:ajax  process="@this" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                        </p:selectBooleanCheckbox>
                        <f:facet name="header"  >
                            <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                <p:ajax listener="#{measureAssetListController.onSelectAllOfPage()}" update="@(.selectCheckBox)" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                        </f:facet>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType!=3}" headerText="设备名称" filterBy="#{item.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType!=3}"  headerText="设备序列号" filterBy="#{item.serialNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.serialNum}"/>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType!=3}" headerText="资产编号" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.financingNum}"/>
                    </p:column>
                    <p:column headerText="#{msg.QRCode}" width="150" sortBy="#{item.qrCode}"
                              filterBy="#{item.qrCode}" filterMatchMode="LIKE" rendered="#{measureAssetListController.isYunNanFuWai() and  measureAssetListController.matchType==1}">
                        <h:outputText value="#{item.qrCode}"/>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType!=3}"   headerText="设备型号" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.functionType}"/>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType!=3}"   headerText="#{msg.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType!=3}"   headerText="#{msg.clinicalDeptName}">
                        <f:facet name="header">
                            <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                            <p:inputText id="clinicalDept"  value="#{measureAssetListController.filterOrg.name}"  readonly="true"/>
                        </f:facet>
                        <h:outputText value="#{item.clinicalDeptName}"/>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType!=3 and userContextService.enableDisplayByKey('measuringAssetDeptFilter')}"   headerText="#{msg.assetDeptName}">
                        <f:facet name="header">
                            <h:outputText value="#{msg.assetDeptName}"/><br/>
                            <p:inputText id="assetDept"  value="#{measureAssetListController.filterAssetDeptOrg.name}"  readonly="true"/>
                        </f:facet>
                        <h:outputText value="#{measureAssetListController.getOrgInfoByUid(item.assetDeptUID).name}"/>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType!=3}"   headerText="计量等级" filterBy="#{item.measureGrade}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('measureGrade',item.measureGrade)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getMeasureGradeList()}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType!=3}"   headerText="计量类别" filterBy="#{item.measuringItemCategory}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('measuringItemCategory',item.measuringItemCategory)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('measuringItemCategory')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType!=3 and measureAssetListController.displayMeasureCycle}" headerText="计量周期(月)" filterBy="#{item.measureCycle}" filterMatchMode="EQ">
                        <f:facet name="filter">
                            <p:inputText type="number" onkeyup="PF('varDataList_measuringAsset').filter()"/>
                        </f:facet>
                        <h:outputText value="#{item.measureCycle}"/>
                    </p:column>
                 
                    <p:column headerText="计量证书编号" filterBy="#{item.meteringNO}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.meteringNO}"/>
                    </p:column>


                    <p:column rendered="#{measureAssetListController.matchType==3}" headerText="器具名称" filterBy="#{item.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType==3}" headerText="型号" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.functionType}"/>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType==3}" headerText="制造厂" filterBy="#{item.manufacture}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.manufacture}"/>
                    </p:column>

                    <p:column rendered="#{measureAssetListController.matchType==3}" headerText="设备序列号SN" filterBy="#{item.serialNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.serialNum}"/>
                    </p:column>



                    <p:column headerText="检定结论" filterBy="#{item.verificationConclusion}" filterMatchMode="EQ" rendered="#{measureAssetListController.matchType==1 or measureAssetListController.matchType==9}">
                     <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()" autoWidth="false" style="max-width: 150px;">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('measuringStatus')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{fieldMsg.fieldValue('measuringStatus', item.verificationConclusion)}"/>
                    </p:column>
                    <p:column rendered="#{measureAssetListController.matchType==1 or measureAssetListController.matchType==9}"    headerText="计量种别" filterBy="#{item.measuringType}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.measuringType}"/>
                    </p:column>
                    <p:column headerText="检测单位" filterBy="#{item.lastCheckCompany}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.lastCheckCompany}"/>
                    </p:column>

                    <p:column headerText="送检单位" filterBy="#{item.department}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.department}"/>
                    </p:column>


                    <p:column headerText="检测人" filterBy="#{item.checkPerson}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.checkPerson}"/>
                    </p:column>
                    <p:column headerText="上传人" filterBy="#{item.uploadUserName}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.uploadUserName}"/>
                    </p:column>
                    <p:column headerText="计量日期" sortBy="#{item.checkDate}" filterBy="#{item.checkDate}" filterMatchMode="GTE">
                        <f:facet name="filter">
                            <p:inputText id="filterCheckDate" widgetVar="varFilterCheckDate" />
                        </f:facet>
                        <h:outputText value="#{item.checkDate}" title="#{item.dateWarningMessage}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="有效期（月）" rendered="#{measureAssetListController.matchType==2}"  sortBy="#{item.validityMonths}" filterBy="#{item.validityMonths}" filterMatchMode="EQ">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()" autoWidth="false" style="max-width: 150px;" value="#{measureAssetListController.validityMonths}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('validityMonths')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{fieldMsg.fieldValue('validityMonths',item.validityMonths)}"/>
                    </p:column>
                    <p:column headerText="#{measureAssetListController.matchType==1?'下次计量日期':measureAssetListController.matchType==3?'有效期至':measureAssetListController.matchType==2?'建议下次计量日期':''}" rendered="#{measureAssetListController.matchType==1 or measureAssetListController.matchType==3 or measureAssetListController.matchType==2}" sortBy="#{item.nextMeteringDate}" filterBy="#{item.nextMeteringDate}" filterMatchMode="GTE">
                        <f:facet name="filter">
                            <p:inputText id="filterNextMeteringDate1" widgetVar="varFilterNextMeteringDate1" />
                        </f:facet>
                        <h:outputText value="#{item.nextMeteringDate}" title="#{item.dateWarningMessage}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.certificateType}" rendered="#{measureAssetListController.matchType != 1 and measureAssetListController.matchType!= 2}"  filterBy="#{item.certificateType}" filterMatchMode="EQ" >
                        <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()" autoWidth="false" style="max-width: 150px;">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('certificateType')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{fieldMsg.fieldValue('certificateType', item.certificateType)}"/>
                    </p:column>
                    <p:column headerText="#{msg.certificateType}"  rendered="#{measureAssetListController.matchType== 1 or measureAssetListController.matchType== 2}" >
                        <h:outputText value="#{fieldMsg.fieldValue('certificateType', item.certificateType)}"/>
                    </p:column>
                    <p:column width="110" headerText="是否上传附件" exportable="false"  filterBy="#{item.existFileFlag}" filterMatchMode="GTE" >
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()" autoWidth="false" style="max-width: 150px;">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItem itemLabel="是" itemValue="0" noSelectionOption="true" />
                                <f:selectItem itemLabel="否" itemValue="1" noSelectionOption="true" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{item.existFileFlag}"/>
                    </p:column>
                    <p:column width="110" rendered="#{measureAssetListController.matchType==3}" headerText="#{msg.Actions}" exportable="false">
                        <p:commandButton  value="关联设备" process="@this"  actionListener="#{measureAssetListController.matchAsset(item.uid)}"  oncomplete="PF('AssetSelectDlg').show()" update="measuringTab:assetSelectForm  measuringTab:assetSearchForm"/>
                    </p:column>


                    <f:facet name="{Toolbar}">
                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" action="#{measuringCertificateDetailController.createAction()}" title="#{msg.Create}" />
                        <p:commandButton id="batchToRelRule" oncomplete="PF('BatchRepairDialog').show()" update="measuringTab:BatchRepairDlg" actionListener="#{measureAssetListController.setSelectedAssetsUuids()}" icon="fa fa-wrench" class="btn btn-sm btn-gray batch-terminated"  title="批量报修" rendered="#{measureAssetListController.judgeMeasurementRepair()}"/>
                        <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}"  actionListener="#{measureAssetListController.delete()}" update="measuringTab:measuringAssetListForm"  >
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                        </p:commandButton>
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false"  rendered="#{measureAssetListController.matchType!=3}" >
                            <p:dataExporter type="xls" target="datalist_measuringAsset" fileName="MeasuringAsset_export" postProcessor="#{measureAssetListController.postProcessorExcel}" />
                        </p:commandButton>

                        <p:commandButton  rendered="#{measureAssetListController.matchType==3}"  title="导出无台账计量数据" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" actionListener="#{measureAssetListController.exportExcel}" update=":growl"
                                         onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false" >
                            <p:fileDownload value="#{measureAssetListController.excelFile}" />
                        </p:commandButton>

                        <p:commandButton id="downloadAllId" title="#{msg.DownloadFile}" icon="ui-icon-file-download" class="btn btn-sm btn-gray" ajax="false"
                                         actionListener="#{measureAssetListController.downloadSelectedFile()}" update=":growl">
                            <p:fileDownload value="#{measureAssetListController.exportFile}" />
                        </p:commandButton>
                        <p:commandButton id="batchToValidPeriodMonths" oncomplete="PF('batchValidPeriodMonthsDialog').show()" update="measuringTab:batchValidPeriodMonthsDlg" actionListener="#{measureAssetListController.setSelectedAssetsAndMeasuring()}" icon="ui-icon-pencil" class="btn btn-sm btn-gray batch-terminated"  title="批量修改有效期（月）" disabled="#{measureAssetListController.matchType!=2}" />
                    </f:facet>
                </p:dataTable>
            </h:form>
<!--            <ui:include src="measuringResultList.xhtml"/>-->

            <ui:include src="AssetSelect.xhtml" />
            <p:dialog id="batchValidPeriodMonthsDlg" widgetVar="batchValidPeriodMonthsDialog" modal="true" resizable="true" draggable="true" width="1050"
                      height="600" header="批量修改有效期（月）">
                <h:form id="BatchValidPeriodMonthsForm">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">有效期（月）<span style="color:red;">*</span></label>
                            <p:selectOneMenu required="true" value="#{measureAssetListController.validityMonths}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('validityMonths')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:dataTable id="validPeriodMonthsInfoList" value="#{measureAssetListController.bathRepairAsset}" var="item"
                                 lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                                 emptyMessage="#{msg.noRecordFound}">

                        <p:column headerText="设备的名称">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="设备编号">
                            <h:outputText value="#{item.financingNum}"/>
                        </p:column>
                        <p:column headerText="设备序列号">
                            <h:outputText value="#{item.serialNum}"/>
                        </p:column>
                        <p:column headerText="计量证书编号">
                            <h:outputText value="#{item.meteringNO}"/>
                        </p:column>
                    </p:dataTable>

                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{measureAssetListController.updateValidityMonths()}"
                                     value="确认" update="measuringTab:measuringAssetListForm:datalist_measuringAsset" icon="ui-icon-check"
                                      onclick="PF('batchValidPeriodMonthsDialog').hide()"/>

                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                     onclick="PF('batchValidPeriodMonthsDialog').hide()"/>
                </h:form>
            </p:dialog>
            <p:dialog id="BatchRepairDlg" widgetVar="BatchRepairDialog" modal="true" resizable="true" draggable="true" width="1050"
                      height="600" header="批量报修设备">
                <h:form id="BatchRepairForm">
                    <p:dataTable id="nodeInfoList" value="#{measureAssetListController.bathRepairAsset}" var="item"
                                     lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                                     emptyMessage="#{msg.noRecordFound}">

                            <p:column headerText="设备的名称">
                                <h:outputText value="#{item.name}"/>
                            </p:column>
                            <p:column headerText="设备编号">
                                <h:outputText value="#{item.financingNum}"/>
                            </p:column>
                            <p:column headerText="设备序列号">
                                <h:outputText value="#{item.serialNum}"/>
                            </p:column>
                            <p:column headerText="设备型号">
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                        </p:dataTable>

                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.createBatchServiceRequest()}" disabled="#{!measureAssetListController.flag}"
                                     value="确认" update="measuringTab:ServiceRequestCreateForm" icon="ui-icon-check"
                                     oncomplete="PF('createSRDialog').show()" onclick="PF('BatchRepairDialog').hide()"/>

                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                     onclick="PF('BatchRepairDialog').hide()"/>
                </h:form>
            </p:dialog>
            <ui:include src="BatchSrCreate.xhtml"/>
            <p:overlayPanel id="idPanelFilterCheckDate" widgetVar="panelFilterCheckDate" for=":measuringTab:measuringAssetListForm:datalist_measuringAsset:filterCheckDate" dismissable="false">
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_CheckDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_CheckDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList_measuringAsset','varFilterCheckDate','varStartTimeFrom_CheckDate','varStartTimeTo_CheckDate'); PF('panelFilterCheckDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterCheckDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>

            <p:overlayPanel id="idPanelFilterNextMeteringDate1" widgetVar="panelFilterNextMeteringDate1" for=":measuringTab:measuringAssetListForm:datalist_measuringAsset:filterNextMeteringDate1" dismissable="false">
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_NextMeteringDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_NextMeteringDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList_measuringAsset','varFilterNextMeteringDate1','varStartTimeFrom_NextMeteringDate','varStartTimeTo_NextMeteringDate'); PF('panelFilterNextMeteringDate1').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterNextMeteringDate1').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>

            <p:overlayPanel id="idVarPanelDeptOrg" widgetVar="varPanelDeptOrg" for=":measuringTab:measuringAssetListForm:datalist_measuringAsset:clinicalDept" dismissable="true" style="text-align: left;">
                <p:scrollPanel style="height:300px;border: 0" mode="native">
                    <p:inputText id="treeNodeNameFilter2" value="#{orgTreeController.treeNodeNameFilter}"/>
                    <p:commandButton partialSubmit="true" icon="ui-icon-search" process="measuringTab:treeNodeNameFilter2 @this" update="measuringTab:orgTree" actionListener="#{orgTreeController.filterDeptOrgTree()}" value="检索"/>
