<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <div class="ui-g-12 card">
            <h:form id="measuringAssetListForm">
                <p:dataTable id="datalist_measuringAsset" value="#{measureAssetListController.lazyModel}" var="item" widgetVar="varDataList_measuringAsset"
                             selectionMode="single" selection="#{measureAssetListController.selected}"
                             lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                             rows="10" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="10,20,40">

                    <p:ajax event="rowSelect" listener="#{measureAssetListController.onSelectMeasureAsset}" update="measuringTab:measuringResultForm"/>
                    <p:ajax event="filter" listener="#{measureAssetListController.onFilter}"/>

                    <p:column headerText="设备名称" filterBy="#{item.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column headerText="设备序列号" filterBy="#{item.serialNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.serialNum}"/>
                    </p:column>
                    <p:column headerText="资产编号" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.financingNum}"/>
                    </p:column>
                    <p:column headerText="设备型号" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.functionType}"/>
                    </p:column>
                    <p:column headerText="#{msg.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="#{msg.clinicalDeptName}">
                        <f:facet name="header">
                            <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                            <p:inputText id="clinicalDept"  value="#{measureAssetListController.fileterOrg.name}"  readonly="true"/>
                        </f:facet>
                        <h:outputText value="#{item.clinicalDeptName}"/>
                    </p:column>
                    <p:column headerText="计量等级" filterBy="#{item.measureGrade}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('measureGrade',item.measureGrade)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('measureGrade')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="计量类别" filterBy="#{item.measuringItemCategory}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('measuringItemCategory',item.measuringItemCategory)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('measuringItemCategory')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="最后计量日期" sortBy="#{item.lastMeteringDate}" filterBy="#{item.lastMeteringDate}" filterMatchMode="GTE">
                        <f:facet name="filter">
                            <p:inputText id="filterLastMeteringDate" widgetVar="varFilterLastMeteringDate" />
                        </f:facet>
                        <h:outputText value="#{item.lastMeteringDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="下次计量日期" sortBy="#{item.nextMeteringDate}" filterBy="#{item.nextMeteringDate}" filterMatchMode="GTE">
                        <f:facet name="filter">
                            <p:inputText id="filterNextMeteringDate" widgetVar="varFilterNextMeteringDate" />
                        </f:facet>
                        <h:outputText value="#{item.nextMeteringDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>

                    <f:facet name="{Toolbar}">
                        <!--<p:commandButton id="uploadButton" icon="ui-icon-file-upload" class="btn btn-sm btn-gray" title="上传附件" disabled="#{empty measureAssetListController.selected}" update="measuringTab:measuringUploadDlg" oncomplete="PF('measuringUploadDialog').show()"/>-->
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist_measuringAsset" fileName="MeasuringAsset_export"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>
            <ui:include src="measuringResultList.xhtml"/>

            <p:overlayPanel widgetVar="panelFilterLastMeteringDate" for=":measuringTab:measuringAssetListForm:datalist_measuringAsset:filterLastMeteringDate" dismissable="false">
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_LastMeteringDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_LastMeteringDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList_measuringAsset','varFilterLastMeteringDate','varStartTimeFrom_LastMeteringDate','varStartTimeTo_LastMeteringDate'); PF('panelFilterLastMeteringDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterLastMeteringDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>

            <p:overlayPanel widgetVar="panelFilterNextMeteringDate" for=":measuringTab:measuringAssetListForm:datalist_measuringAsset:filterNextMeteringDate" dismissable="false">
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_NextMeteringDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_NextMeteringDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList_measuringAsset','varFilterNextMeteringDate','varStartTimeFrom_NextMeteringDate','varStartTimeTo_NextMeteringDate'); PF('panelFilterNextMeteringDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterNextMeteringDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>

            <p:overlayPanel id="idVarPanelDeptOrg" widgetVar="varPanelDeptOrg" for=":measuringTab:measuringAssetListForm:datalist_measuringAsset:clinicalDept" dismissable="true" style="text-align: left;">
                <p:scrollPanel style="height:300px;border: 0" mode="native">
                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.getDeptOrgTree(UserContextService.getCurrentUserAccount().getSiteUID())}"  var="node" selectionMode="single" dynamic="false">
                        <p:ajax process="@this" event="select"  listener="#{measureAssetListController.onClinicalDeptFilter}" update="measuringTab:measuringAssetListForm:datalist_measuringAsset measuringTab:idVarPanelDeptOrg" oncomplete="PF('varPanelDeptOrg').hide();"/>
                        <p:ajax process="@this" event="expand"/>
                        <p:ajax process="@this" event="collapse"/>
                        <p:treeNode type="org">
                            <h:outputText value="#{node.name}"/>
                        </p:treeNode>
                    </p:tree>
                </p:scrollPanel>
            </p:overlayPanel>
        </div>
    </ui:composition>
</html>
