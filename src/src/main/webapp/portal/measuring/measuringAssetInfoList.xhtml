                        <p:column headerText="#{msg.id}" sortBy="#{item.id}" filterBy="#{item.id}" filterMatchMode="EQ" visible="false">

                        </p:column>
                        <p:column headerText="#{msg.serialNum}"  exportable="true" visible="false">
                            <h:outputText value="#{item.serialNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.financingNum}"  exportable="true" visible="false" sortBy="#{item.financingNum}" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.financingNum}" title="#{item.financingNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.barcode}"  exportable="true" visible="false">
                            <h:outputText value="#{item.barcode}"/>
                        </p:column>
                        <p:column headerText="#{msg.modalityId}"  exportable="true" visible="false">

                        </p:column>
                        <p:column headerText="#{msg.locationCode}"  exportable="true" visible="false">
                            <h:outputText value="#{item.locationCode}"/>
                        </p:column>
                        <p:column headerText="#{msg.locationName}"  exportable="true" visible="false">
                            <h:outputText value="#{item.locationName}"/>
                        </p:column>
                        <p:column headerText="#{msg.registrationNo}"  exportable="true" visible="false">
                            <h:outputText value="#{item.registrationNo}"/>
                        </p:column>
                        <p:column headerText="#{msg.deviceStatus}"  exportable="true" visible="false">
                            <h:outputText value=" #{fieldMsg.fieldValue('deviceStatus',item.deviceStatus)}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="discardButton" class="btn btn-sm btn-gray" title="报废" actionListener="#{assetInfoController.discard(assetInfoController.selected)}" update=":searchForm :growl" />
                            <p:commandButton id="readyForDiscardButton" class="btn btn-sm btn-gray" title="待报废" actionListener="#{assetInfoController.readyForDiscard(assetInfoController.selected)}" />
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <h:form enctype="multipart/form-data">

        <script>
            afterPageLoad = function(){
                $("#searchForm\\:searchText").keypress(function(e){
                    if(e.keyCode==13){
                        e.preventDefault();
                    }
                });
            }

            var newWin;
            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }

            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }
