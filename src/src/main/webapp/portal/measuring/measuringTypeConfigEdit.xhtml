    <ui:composition>

                    <h:panelGroup>

                        <p:autoComplete dropdown="true" value="#{measuringTypeConfigController.i18nMessage}"  scrollHeight="300" forceSelection="true" required="true" disabled="#{not empty measuringTypeConfigController.selected.id}"

                        </p:autoComplete>

                    <h:panelGroup>

                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>

                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{measuringTypeConfigController.measuringItemCategoryList}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup >
                        <label class="label">计量等级*</label>
                        <p:selectOneMenu id="assetTag" value="#{measuringTypeConfigController.selected.measureGrade}" required="true" requiredMessage="计量等级不能为空">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>

                        </p:selectOneMenu>

                        <label class="label">最后计量日期</label>

                        <p:calendar timeZone="GMT+8"  id="nextMeteringDate" pattern="yyyy/MM/dd" value="#{measuringTypeConfigController.selected.nextMeteringDate}" required="false" requiredMessage="下次计量日期 #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
