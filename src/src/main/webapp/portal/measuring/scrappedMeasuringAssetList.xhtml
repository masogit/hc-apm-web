<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <div class="ui-g-12 card">
            <h:form id="scrappedMeasuringAssetListForm" rendered="#{measureAssetListController.customRoleAuth.authSearch}">
                <p:dataTable id="datalist_measuringAsset" value="#{measureAssetListController.lazyModel}" var="item" widgetVar="varDataList_measuringAsset"
                             selectionMode="single" selection="#{measureAssetListController.selected}"
                             lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                             rows="20" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="20,50,100,500">

                    <p:ajax event="rowSelect" listener="#{measureAssetListController.onSelectMeasureAsset}" update="measuringTab:scrappedMeasuringResultForm"/>
                    <p:ajax event="filter" listener="#{measureAssetListController.onFilter}" oncomplete="updateSelectAllCheckBox();"/>
                    <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                    <p:column width="36"  id="checkBoxColumn" exportable="false">
                        <p:selectBooleanCheckbox value="#{measureAssetListController.selectedMap[item.uid]}"  class="selectCheckBox">
                            <p:ajax process="@this" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                        </p:selectBooleanCheckbox>
                        <f:facet name="header"  >
                            <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                <p:ajax listener="#{measureAssetListController.onSelectAllOfPage()}" update="@(.selectCheckBox) measuringTab:scrappedMeasuringAssetListForm:datalist_measuringAsset " oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                        </f:facet>
                    </p:column>
                    <p:column headerText="设备名称" filterBy="#{item.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column headerText="设备序列号" filterBy="#{item.serialNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.serialNum}"/>
                    </p:column>
                    <p:column headerText="资产编号" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.financingNum}"/>
                    </p:column>
                    <p:column headerText="#{msg.QRCode}" width="150" sortBy="#{item.qrCode}"
                              filterBy="#{item.qrCode}" filterMatchMode="LIKE" rendered="#{measureAssetListController.isYunNanFuWai()}">
                        <h:outputText value="#{item.qrCode}"/>
                    </p:column>
                    <p:column headerText="设备型号" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.functionType}"/>
                    </p:column>
                    <p:column headerText="#{msg.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="#{msg.clinicalDeptName}">
                        <f:facet name="header">
                            <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                            <p:inputText id="clinicalDept"  value="#{measureAssetListController.filterOrg.name}"  readonly="true"/>
                        </f:facet>
                        <h:outputText value="#{item.clinicalDeptName}"/>
                    </p:column>
                    <p:column headerText="计量等级" filterBy="#{item.measureGrade}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('measureGrade',item.measureGrade)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getMeasureGradeList()}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="计量类别" filterBy="#{item.measuringItemCategory}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('measuringItemCategory',item.measuringItemCategory)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('measuringItemCategory')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="计量证书编号" filterBy="#{item.meteringNO}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.meteringNO}"/>
                    </p:column>
                    <p:column headerText="检定结论" filterBy="#{item.verificationConclusion}" filterMatchMode="EQ">
                     <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_measuringAsset').filter()" autoWidth="false" style="max-width: 150px;">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('measuringStatus')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{fieldMsg.fieldValue('measuringStatus', item.verificationConclusion)}"/>
                    </p:column>
                    <p:column headerText="计量种别" filterBy="#{item.measuringType}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.measuringType}"/>
                    </p:column>
                    <p:column headerText="检测单位" filterBy="#{item.lastCheckCompany}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.lastCheckCompany}"/>
                    </p:column>
                    <p:column headerText="检测人" filterBy="#{item.checkPerson}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.checkPerson}"/>
                    </p:column>
                    <p:column headerText="计量日期" sortBy="#{item.checkDate}" filterBy="#{item.checkDate}" filterMatchMode="GTE">
                        <f:facet name="filter">
                            <p:inputText id="filterCheckDate" widgetVar="varFilterCheckDate" />
                        </f:facet>
                        <h:outputText value="#{item.checkDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>

                    <f:facet name="{Toolbar}">
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist_measuringAsset" fileName="MeasuringAsset_export"/>
                        </p:commandButton>
                        <p:commandButton id="downloadAllId" title="#{msg.DownloadFile}" icon="ui-icon-file-download" ajax="false"
                                         actionListener="#{measureAssetListController.downloadSelectedFile()}" update=":growl">
                            <p:fileDownload value="#{measureAssetListController.exportFile}" />
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>
            <ui:include src="scrappedMeasuringResultList.xhtml"/>
            <p:overlayPanel id="idPanelFilterCheckDate2" widgetVar="panelFilterCheckDate" for=":measuringTab:scrappedMeasuringAssetListForm:datalist_measuringAsset:filterCheckDate" dismissable="false">
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_CheckDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_CheckDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList_measuringAsset','varFilterCheckDate','varStartTimeFrom_CheckDate','varStartTimeTo_CheckDate'); PF('panelFilterCheckDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterCheckDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>

            <p:overlayPanel id="idVarPanelDeptOrg2" widgetVar="varPanelDeptOrg" for=":measuringTab:scrappedMeasuringAssetListForm:datalist_measuringAsset:clinicalDept" dismissable="true" style="text-align: left;">
                <p:scrollPanel style="height:300px;border: 0" mode="native">
                    <p:tree id="orgTree2" class="tree" style="width:98%;border:0;" value="#{orgTreeController.getDeptOrgTree(UserContextService.getCurrentUserAccount().getSiteUID())}"  var="node" selectionMode="single" dynamic="false">
                        <p:ajax process="@this" event="select"  listener="#{measureAssetListController.onClinicalDeptFilter}" update="measuringTab:scrappedMeasuringAssetListForm:datalist_measuringAsset:clinicalDept measuringTab:idVarPanelDeptOrg" oncomplete="PF('varDataList_measuringAsset').filter();PF('varPanelDeptOrg').hide();"/>
                        <p:ajax process="@this" event="expand"/>
                        <p:ajax process="@this" event="collapse"/>
                        <p:treeNode type="org">
                            <h:outputText value="#{node.shortName}"/>
                        </p:treeNode>
						<p:treeNode type="hidden" rendered="false"/>
                    </p:tree>
                </p:scrollPanel>
            </p:overlayPanel>
        </div>
    </ui:composition>
</html>
