<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:composition>
        <div class="ui-g-12 card">
            <h:form id="measuringResultForm">
                <p:fieldset legend="计量结果" rendered="#{not empty measureAssetListController.selected}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.assetName}</label>
                            <p:outputLabel value="#{measureAssetListController.selected.name}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">设备序列号</label>
                            <p:outputLabel value="#{measureAssetListController.selected.serialNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">资产编号</label>
                            <p:outputLabel value="#{measureAssetListController.selected.financingNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">设备型号</label>
                            <p:outputLabel value="#{measureAssetListController.selected.functionType}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.assetGroup}</label>
                            <p:outputLabel value="#{fieldMsg.fieldValue('assetGroup',measureAssetListController.selected.assetGroup)}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.clinicalDeptName}</label>
                            <p:outputLabel value="#{measureAssetListController.selected.clinicalDeptName}" />
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:dataTable id="datalist_measuringResult" rendered="#{not empty measureAssetListController.measuringCertificateList}" value="#{measureAssetListController.measuringCertificateList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="5" emptyMessage="#{msg.noRecordFound}">


                        <p:column headerText="证书编号">
                            <h:outputText value="#{item.certificateNo}"/>
                        </p:column>
                        <p:column headerText="制造厂">
                            <h:outputText value="#{item.assetManufacturer}"/>
                        </p:column>
                        <p:column headerText="检定结论">
                            <h:outputText value="#{fieldMsg.fieldValue('measuringStatus', item.status)}"/>
                        </p:column>
                        <p:column headerText="检定日期">
                            <h:outputText value="#{item.checkDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="有效期至">
                            <h:outputText value="#{item.validDateTo}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="送检单位">
                            <h:outputText value="#{item.department}"/>
                        </p:column>
                        <p:column headerText="检测单位">
                            <h:outputText value="#{item.checkCompany}"/>
                        </p:column>
                        <p:column headerText="存档记录">
                            <h:outputText value="#{item.fileNo}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist_measuringResult" fileName="MeasuringResultList_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>

                    <h:panelGroup>
                        <p:dataList id="measuringUploadList" value="#{measureAssetListController.getAttachList()}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                            <f:facet name="header">附件列表</f:facet>
                            <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>&nbsp;&nbsp;
                            <p:commandButton actionListener="#{measureAssetListController.removeAttachmentById(fileitem.id)}" update="measuringUploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </p:dataList>
                        <p:fileUpload id="measuringUploadFile" fileUploadListener="#{measureAssetListController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                      multiple="true"  sizeLimit="100000000"  update="measuringUploadList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                    </h:panelGroup>
                </p:fieldset>
            </h:form>
        </div>
    </ui:composition>
</html>
