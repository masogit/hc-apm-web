
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/template.xhtml">
<ui:define name="content">
        <div class="ui-g-12 card">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="计量信息"/>
            </div>
            <h:form id="measuringResultForm">
                <p:fieldset legend="计量结果" rendered="#{not empty measureAssetListController.selected}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.assetName}</label>
                            <p:outputLabel value="#{measureAssetListController.selected.name}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">设备序列号</label>
                            <p:outputLabel value="#{measureAssetListController.selected.serialNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">资产编号</label>
                            <p:outputLabel value="#{measureAssetListController.selected.financingNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">设备型号</label>
                            <p:outputLabel value="#{measureAssetListController.selected.functionType}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.assetGroup}</label>
                            <p:outputLabel value="#{fieldMsg.fieldValue('assetGroup',measureAssetListController.selected.assetGroup)}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.clinicalDeptName}</label>
                            <p:outputLabel value="#{measureAssetListController.selected.clinicalDeptName}" />
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:dataTable id="datalist_measuringResult" rendered="#{not empty measureAssetListController.measuringCertificateList}" value="#{measureAssetListController.measuringCertificateList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="5" emptyMessage="#{msg.noRecordFound}">
                        <p:column headerText="证书编号">
                            <h:outputText value="#{item.certificateNo}"/>
                        </p:column>
                        <p:column headerText="制造厂">
                            <h:outputText value="#{item.assetManufacturer}"/>
                        </p:column>
                        <p:column headerText="检定结论">
                            <h:outputText value="#{fieldMsg.fieldValue('measuringStatus', item.status)}"/>
                        </p:column>
                        <p:column headerText="检定日期">
                            <h:outputText value="#{item.checkDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="有效期至">
                            <h:outputText value="#{item.validDateTo}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="送检单位">
                            <h:outputText value="#{item.department}"/>
                        </p:column>
                        <p:column headerText="检测单位">
                            <h:outputText value="#{item.checkCompany}"/>
                        </p:column>
                        <p:column headerText="种别">
                            <h:outputText value="#{item.type}"/>
                        </p:column>
                        <p:column headerText="备注">
                            <h:outputText value="#{item.comments}"/>
                        </p:column>
                        <p:column headerText="存档记录">
                            <h:outputText value="#{item.fileNo}"/>
                        </p:column>
                        <p:column headerText="上传文件" style="width: 140px">
                            <p:fileUpload id="measuringResultUploadFile" value="#{item.id}" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{measureAssetListController.uploadMeasuringFile}" mode="advanced" dragDropSupport="false" style="width:100%"
                                          multiple="true" sizeLimit="100000000" update="measuringResultForm:datalist_measuringFileResult" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist_measuringResult" fileName="MeasuringResultList_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>

                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 100%">
                        <p:column>
                            <p:dataTable id="datalist_measuringFileResult" value="#{measureAssetListController.getMeasuringResult()}" var="measuringResultItem" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="5" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="证书编号">
                                    <h:outputText value="#{measuringResultItem.certificateNo}"/>
                                </p:column>
                                <p:column headerText="检定结论">
                                    <h:outputText value="#{fieldMsg.fieldValue('measuringStatus', measuringResultItem.status)}"/>
                                </p:column>
                                <p:column headerText="检定日期">
                                    <h:outputText value="#{measuringResultItem.checkDate}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="附件列表" style="width: 400px">
                                    <p:dataList id="measuringFileList" value="#{measureAssetListController.getMeasuringAttachList(measuringResultItem.id)}" var="measuringFileItem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                        <p:commandLink value="#{measuringFileItem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(measuringFileItem.objectStorageId)}" styleClass="p-mr-2"/>
                                        <p:commandButton icon="ui-icon-remove-red-eye" title="#{msg.preview}" rendered="#{measuringFileItem.showPreview()}" actionListener="#{preViewerBean.onServerEvent('', measuringFileItem.objectStorageId)}" update="previewedDlg" oncomplete="PF('previewedDlg').show()"/>
<!--                                        <h:commandLink target="_blank" value="#{measuringFileItem.objectName}" action="#{measureAssetListController.getFileNewWindowUrl(measuringFileItem.objectStorageId)}" styleClass="p-mr-2" rendered="#{measuringFileItem.showPreview()}"/>&nbsp;&nbsp;-->
                                        <p:commandButton actionListener="#{measureAssetListController.removeAttachmentById(measuringFileItem.id)}" update="measuringFileList" rendered="#{userContextService.accessContainsFunctionMenu('MEASURE_INFO_EDIT')}" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                        </p:commandButton>
                                    </p:dataList>
                                </p:column>
                            </p:dataTable>
                        </p:column>
                    </p:panelGrid>
                </p:fieldset>
            </h:form>
            <ui:include src="/portal/preview/view.xhtml" />
        </div>
</ui:define>
</ui:composition>
