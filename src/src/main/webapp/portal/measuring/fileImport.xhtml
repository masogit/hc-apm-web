<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <div class="ui-g">
        <h:outputStylesheet>
            /* 定义不同进度段的颜色 */
            .customProgressBar  .ui-progressbar-value{ background-color: #008000 !important; }
        </h:outputStylesheet>
        <div class="ui-g-12 card">
            <p:tabView>
                <p:ajax event="tabChange" listener="#{measureFromZipController.onChange}" update=":measuringTab:zipErrListForm" />
                <p:tab title="批量导入计量附件" id="t1">
                    <h:form enctype="multipart/form-data" rendered="#{measureFromZipController.customRoleAuth.authSearch}">
                        <p:fieldset  legend="批量导入计量附件" id="uploaderFile">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <p:fileUpload fileUploadListener="#{measureFromZipController.handleZipFileUpload}" mode="advanced"
                                              dragDropSupport="false" multiple="false" auto="true"
                                              invalidFileMessage="只支持zip格式的文件"
                                              invalidSizeMessage="文件大小不得超过500M"
                                              update=":measuringTab:zipErrListForm, " sizeLimit="524288000" allowTypes="/(\.|\/)(zip)$/"
                                              label="从zip导入" cancelLabel="取消" uploadLabel="确认上传"/>
                                <p:growl id="messages" showDetail="true"/>
                            </p:panelGrid>
                            <h:panelGroup>
                                <p>说明</p>
                                <p>1. 必须为 zip 格式文件</p>
                                <p>2. zip 包内文件名必须为计量证书编号</p>
                                <p>3. 上传文件进行导入</p>
                            </h:panelGroup>
                        </p:fieldset>
                    </h:form>
                </p:tab>
                <p:tab title="批量OCR计量附件" id="t2">
                    <h:form enctype="multipart/form-data" >
                        <p:fieldset  legend="批量OCR计量附件" id="uploaderFileOCR">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <p:fileUpload fileUploadListener="#{measureFromZipController.handleZipFileUploadOCR}" mode="advanced"
                                              dragDropSupport="false" multiple="false" auto="true"
                                              invalidFileMessage="只支持zip格式的文件"
                                              invalidSizeMessage="文件大小不得超过500M"
                                              onstart="PF('progressBarId').start()"
                                              update=":measuringTab:zipErrListForm  " sizeLimit="524288000" allowTypes="/(\.|\/)(zip)$/"
                                              label="从zip导入" />
                                <p:progressBar class="customProgressBar" labelTemplate="{value}%" widgetVar="progressBarId" ajax="true" id="pb" value="#{measureFromZipController.progress}" interval="1000" />
<!--                                <p:poll interval="2" update="pb" />-->
                                <p:growl id="messagesOCR" showDetail="true"/>
<!--                                <p:progressBar id="pb" class="customProgressBar " value="50" displayOnly="true" />-->
                            </p:panelGrid>
                            <h:panelGroup>
                                <p>说明</p>
                                <p>1. 必须为 zip 格式文件</p>
                                <p>2. zip 包内文件类型仅支持<span style="color:red"> PDF </span>格式</p>
                                <p>3. 上传文件进行导入</p>
                            </h:panelGroup>
                        </p:fieldset>
                    </h:form>
                </p:tab>
            </p:tabView>
        </div>

        <div class="ui-g-12 card">
            <h:form id="zipErrListForm">
                <p:fieldset  legend="导入结果">
                    <p:dataTable id="datalist" rendered="#{not empty measureFromZipController.resultList}" value="#{measureFromZipController.resultList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:column headerText="证书编号">
                            <h:outputText value="#{item.certificateNo}" />
                        </p:column>
                        <p:column headerText="导入状态">
                            <h:outputText value="#{item.errorInfo.length() > 0 ? '失败' : '成功'}" />
                        </p:column>
                        <p:column headerText="导入失败信息">
                            <h:outputText value="#{item.errorInfo}" />
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="MeasuringFailed_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>
            </h:form>
        </div>
    </div>
</html>
