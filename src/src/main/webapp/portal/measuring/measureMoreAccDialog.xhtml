<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition><!--备件对话框 保养-->
        <p:dialog class="measureMoreAccDialogDlgCls" id="measureMoreAccDialogDlg" widgetVar="measureMoreAccDialogDlg" modal="true" width="1250"  resizable="true" draggable="true" appendTo="@(body)" header="备件">
            <h:form class="measureMoreAccDialogFormCls"  id="measureMoreAccDialogForm" >
                <h:panelGroup id="display42">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">备件名称*</label>
                            <p:inputText id="parts" value="#{v2MeasureController.itemDetail.parts}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>

                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">备件(数量)*</label>
                            <p:inputNumber  maxValue="999"  decimalPlaces="0"  id="apartsQuantity" value="#{v2MeasureController.itemDetail.apartsQuantity}" required="true" requiredMessage="备件(数量) #{msg.ValidationRequire}">
                            <f:convertNumber pattern="0" type="number"/>
                            </p:inputNumber>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">预估单价(元)*</label>
                            <p:inputNumber  disabled="#{v2MeasureController.nochange}" decimalPlaces="0" maxValue="999999" id="partsPrice"  value="#{v2MeasureController.itemDetail.partsPrice}" required="true" requiredMessage="预估单价(元) #{msg.ValidationRequire}">
                                <p:ajax listener="#{v2MeasureController.partsPriceUpdate()}" update="@(.contractPrice)" >
                                </p:ajax>
                                <f:convertNumber pattern="0" type="number"/>

                            </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">备件类别</label>
                            <p:selectOneMenu value="#{v2MeasureController.itemDetail.partsType}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">发票号</label>
                            <p:inputText value="#{v2MeasureController.itemDetail.invoiceNum}"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">开票时间</label>
                            <p:calendar timeZone="GMT+8" label="预计到达时间" pattern="yyyy/MM/dd" value="#{v2MeasureController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">供应商</label>
                            <p:autoComplete id="vendor" dropdown="true" value="#{v2MeasureController.supplierName}" scrollHeight="300"
                                            forceSelection="false"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}"
                                            completeMethod="#{v2MeasureController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                                <p:ajax event="itemSelect" listener="#{v2MeasureController.onSupplierChange()}"/>
                                <p:ajax listener="#{v2MeasureController.onSupplierChange()}" />
                            </p:autoComplete>
                            <p:commandButton id="createSupplierButton" icon="ui-icon-plus" action="#{assetInfoEditController.prepareCreateSupplier}" title="#{msg.Create}" process="@this" update="@(.SupplierEditDlgCls)" oncomplete="PF('SupplierEditDialog').show()"/>

                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">合同号</label>
                            <p:inputText value="#{v2MeasureController.itemDetail.contractNum}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">合同价格(元)</label>
                            <p:inputNumber  decimalPlaces="0" maxValue="999999" class="contractPrice" id="closedPrice"  value="#{v2MeasureController.itemDetail.closedPrice}">
                                <p:ajax listener="#{v2MeasureController.closePrcieUpdate()}">
                                </p:ajax>
                                <f:convertNumber pattern="0" type="number"/>
                            </p:inputNumber>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">质保期</label>
                            <p:calendar timeZone="GMT+8" label="取物时间" pattern="yyyy/MM/dd" value="#{v2MeasureController.itemDetail.warrantyDate}" showOn="button"
                                        readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">序列号</label>
                            <p:inputText value="#{v2MeasureController.itemDetail.serialNum}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">预计到达时间</label>
                            <p:calendar timeZone="GMT+8" label="预计到达时间" pattern="yyyy/MM/dd HH:mm" value="#{v2MeasureController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间</label>
                            <p:calendar disabled="#{workOrderMgrController.nochange}" timeZone="GMT+8" label="申请时间" pattern="yyyy/MM/dd HH:mm" value="#{v2MeasureController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                        <p:column headerText="到货">
                            <p:selectBooleanButton   value="#{v2MeasureController.itemDetail.arrived}" onLabel="已到货" offLabel="未到货">
                                <p:ajax listener="#{v2MeasureController.arrivalTimeSet}" event="change"></p:ajax>
                            </p:selectBooleanButton>
                            <p:selectBooleanButton   value="#{v2MeasureController.itemDetail.closed}" onLabel="已结单" offLabel="未结单">
                                <p:ajax listener="#{v2MeasureController.orderSet}" event="change"></p:ajax>
                            </p:selectBooleanButton>
                        </p:column>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputTextarea id="area" value="#{v2MeasureController.itemDetail.comment}"/>
                        </h:panelGroup>

                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{v2MeasureController.addAcessItem}" value="#{msg.Save}" update="measureTab:measureRepairCompleteDialogForm:accessList  measureTab:measureRepairCompleteDialogForm:cmd1 :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'measureMoreAccDialogDlg');"/>
                        <p:commandButton immediate="true" actionListener="#{v2MeasureController.cancelWorkdetail}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'measureMoreAccDialogDlg');"/>
                    </h:panelGroup>

                    <p:commandButton validateClient="true" actionListener="#{v2MeasureController.saveAndadd()}" rendered="#{v2MeasureController.switchTmp}" value="保存新增" update="@(.measureMoreAccDialogFormCls) measureTab:measureRepairCompleteDialogForm:accessList  :growl" icon="ui-icon-check"/>

                </h:panelGroup>
            </h:form>
            <ui:include src="../woMgr/createSupplierAcc.xhtml" />

        </p:dialog>

    </ui:composition>
</html>
