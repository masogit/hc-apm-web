<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="计量结果"/>
            </div>
            <div class="ui-g-12 card">
                <h:form enctype="multipart/form-data">
                    <p:fileUpload fileUploadListener="#{measureFromExcelController.handleFileUpload}" mode="advanced"
                                  dragDropSupport="false"
                                  fileLimitMessage="一次最多上传3个文件"
                                  invalidFileMessage="只支持xls或xlsx格式的文件"
                                  invalidSizeMessage="文件大小不得超过5M"
                                  update="messages" sizeLimit="5242880" fileLimit="3" allowTypes="/(\.|\/)(xls|xlsx)$/"
                                  label="从Excel导入" cancelLabel="取消" uploadLabel="确认上传"/>
                    <p:growl id="messages" showDetail="true"/>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
