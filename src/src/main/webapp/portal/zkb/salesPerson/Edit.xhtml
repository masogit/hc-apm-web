<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="salesPersonInfoEditDlg" widgetVar="salesPersonInfoEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="销售人员信息">
            <h:form id="salesPersonInfoEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">姓名*</label>
                            <p:inputText id="name" value="#{zkbSalesPersonInfoController.selected.name}"  required="true" requiredMessage="姓名 #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">电话*</label>
                            <p:inputText id="phone" value="#{zkbSalesPersonInfoController.selected.phone}"  required="true" requiredMessage="电话 #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">邮箱*</label>
                            <p:inputText id="email" value="#{zkbSalesPersonInfoController.selected.email}"  required="true" requiredMessage="邮箱 #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup colspan="2">
                            <label class="label">订单类型*</label>
                             <p:selectBooleanCheckbox  style="margin-bottom: 5px" id="isSparePartsSelection" itemLabel="备件" value="#{zkbSalesPersonInfoController.selected.sparePartsSelection}" />
                             <p:selectBooleanCheckbox   id="isProbeSelection" itemLabel="探头"  value="#{zkbSalesPersonInfoController.selected.probeSelection}" />
                         </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">关联租户</label>
                            <p:selectManyMenu  styleClass="manymenu-advanced"  id="tenant" value="#{zkbSalesPersonInfoController.tenantInfosByUids}"   var="t" converter="tenantInfoConverter" style="width:99%"  filter="true"   filterMatchMode="contains" showCheckbox="true"   >
                                <f:selectItems value="#{zkbSalesPersonInfoController.tenantInfoList}" var="tenantInfo" itemLabel="#{tenantInfo.name}" itemValue="#{tenantInfo}"     />
                                <p:column>
                                    <h:outputText value="#{t.name}" />
                                </p:column>
                            </p:selectManyMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                   <p:commandButton validateClient="true" actionListener="#{zkbSalesPersonInfoController.save}" value="#{msg.Save}" update=":salesPersonInfoListForm:datalist :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'salesPersonInfoEditDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('salesPersonInfoEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
