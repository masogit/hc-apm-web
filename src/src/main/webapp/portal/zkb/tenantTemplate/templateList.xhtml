<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="租户保养模板"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="zkbtemplateListForm">
                    <h:panelGrid id="tenantInfoGrid" columns="4" style="margin-bottom:10px" cellpadding="5" >
                        <p:outputLabel value="#{msg.zkbContact_tenant}*:"/>
                        <p:selectOneMenu style="transform: scale(1.2)"  id="selectionTenantInfo" value="#{zkbTenantTemplateController.queryTenantUID}">
                            <p:ajax  update="datalist"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{zkbTenantTemplateController.tenantInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                        </p:selectOneMenu>
                    </h:panelGrid>
                    <p:dataTable id="datalist" value="#{zkbTenantTemplateController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbTenantTemplateController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="filter" listener="#{zkbTenantTemplateController.onFilter}" />
                        <p:column headerText="#{msg.Name}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>

                        <p:column headerText="#{msg.hospitalId}">
                            <h:outputText value="#{not empty tableDefinitionController.orgInfoMap[item.siteUID] ? tableDefinitionController.orgInfoMap[item.siteUID] : 'NA'}"/>
                        </p:column>
                        <p:column headerText="#{msg.Description}" >
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <c:if test="#{userContextService.zkbAccount}" >
                            <p:column headerText="Modality" >
                                <h:outputText value="#{item.mainDirectory}"/>
                            </p:column>
                            <p:column headerText="Product" >
                                <h:outputText value="#{item.secondDirectory}"/>
                            </p:column>
                        </c:if>
                        <p:column headerText="#{msg.Status}" >
                            <h:outputText value="#{msg.NotEnabled}"  rendered="#{empty item.status or item.status eq 'Draft'}"/>
                            <h:outputText value="#{msg.Released}"  rendered="#{item.status eq 'Released'}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="importButton" ajax="false"   title="批量导入" action="#{zkbTenantTemplateController.importAction}" icon="ui-icon-arrowstop-1-n" oncomplete="openViewWindow(xhr, status, args)">
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>

            </div>
        </div>
        <script>
            function openViewWindow(xhr, status, args) {
                window.document.body.innerHTML = '加载中...';
                window.location.href = args.url;
            }
        </script>
    </ui:define>
</ui:composition>
