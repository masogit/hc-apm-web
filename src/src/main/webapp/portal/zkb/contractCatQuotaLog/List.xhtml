<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="高低端机名额日志管理"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="zkbContractCatQuotaHistoryListForm">
                   <p:dataTable id="datalist" value="#{zkbContractCatQuotaHistoryController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbContractCatQuotaHistoryController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                       <p:ajax event="filter" listener="#{zkbContractCatQuotaHistoryController.onFilter}" />
                       <p:ajax event="rowSelect" listener="#{zkbContractCatQuotaHistoryController.prepareEdit}" update="editButton :zkbContractCatQuotaHistoryListForm"/>

                       <p:column headerText="合同号" filterBy="#{item.contractNo}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.contractNo}"/>
                       </p:column>
                       <p:column headerText="申请单号" filterBy="#{item.partOrderNo}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.partOrderNo}"/>
                       </p:column>
                       <p:column headerText="高低端机"  filterBy="#{item.assetType}" filterMatchMode="LIKE">
                           <h:outputText value="#{zkbContractCatQuotaHistoryController.getFieldNameByType('assetType', item.assetType)}"/>
                           <f:facet name="filter">
                               <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                   <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                   <f:selectItem itemLabel="高端机" itemValue="highMachine"/>
                                   <f:selectItem itemLabel="低端机" itemValue="lowMachine"/>
                               </p:selectOneMenu>
                           </f:facet>
                       </p:column>
                       <p:column headerText="探头名额类型" filterBy="#{item.probeType}" filterMatchMode="LIKE">
                           <h:outputText value="#{zkbContractCatQuotaHistoryController.getFieldNameByType('probeType', item.probeType)}"/>
                           <f:facet name="filter">
                               <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                   <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                   <f:selectItem itemLabel="探头名额" itemValue="OldProbe"/>
                                   <f:selectItem itemLabel="探头任意名额" itemValue="Any"/>
                                   <f:selectItem itemLabel="探头普通名额" itemValue="Normal"/>
                                   <f:selectItem itemLabel="探头特殊名额" itemValue="Special"/>
                               </p:selectOneMenu>
                           </f:facet>
                       </p:column>
                       <p:column headerText="名额数量">
                           <h:outputText value="#{item.qty}"/>
                       </p:column>
                       <p:column headerText="状态" filterBy="#{item.status}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.status}"/>
                           <f:facet name="filter">
                               <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                   <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                   <f:selectItem itemLabel="Y" itemValue="Y"/>
                                   <f:selectItem itemLabel="N" itemValue="N"/>
                               </p:selectOneMenu>
                           </f:facet>
                       </p:column>
                       <p:column headerText="创建时间" filterBy="#{item.createdDate}" filterMatchMode="LIKE">
                           <f:facet name="filter">
                               <p:inputText id="filterCreatedDate" widgetVar="filterCreatedDate" value="#{zkbContractCatQuotaHistoryController.createdDateFormat}"/>
                           </f:facet>
                           <h:outputText value="#{item.createdDate}" >
                               <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                           </h:outputText>
                       </p:column>
                       <p:column headerText="最后更新时间" filterBy="#{item.lastModifiedDate}" filterMatchMode="LIKE">
                           <f:facet name="filter">
                               <p:inputText id="filterLastModifiedDate" widgetVar="filterLastModifiedDate" value="#{zkbContractCatQuotaHistoryController.lastModifiedDateFormat}"/>
                           </f:facet>
                           <h:outputText value="#{item.lastModifiedDate}">
                               <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                           </h:outputText>
                       </p:column>
                       <f:facet name="{Toolbar}">
                           <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbContractCatQuotaHistoryController.prepareEdit}"
                                            update=":contractCatQuotaEditDlg" oncomplete="PF('contractCatQuotaEditDlg').show()"
                                            disabled="#{empty zkbContractCatQuotaHistoryController.selected}" />
                       </f:facet>
                    </p:dataTable>

                    <p:overlayPanel id="createdDateOverlayPanel" widgetVar="createdDateOverlayPanel" for="zkbContractCatQuotaHistoryListForm:datalist:filterCreatedDate" dismissable="false" >
                        <h:panelGrid columns="2">
                            <p:outputLabel value="#{msg.From}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}" pattern="yyyy/MM/dd" widgetVar="varCreatedDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                            <p:outputLabel value="#{msg.To}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}" pattern="yyyy/MM/dd" widgetVar="varCreatedDateTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        </h:panelGrid>
                        <p:commandButton onclick="setDateFilter('varDataList', 'filterCreatedDate', 'varCreatedDateFrom', 'varCreatedDateTo'); PF('createdDateOverlayPanel').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                        <p:commandButton onclick="PF('createdDateOverlayPanel').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                    </p:overlayPanel>

                    <p:overlayPanel id="lastModifiedDateDateOverlayPanel" widgetVar="lastModifiedDateOverlayPanel" for="zkbContractCatQuotaHistoryListForm:datalist:filterLastModifiedDate" dismissable="false" >
                        <h:panelGrid columns="2">
                            <p:outputLabel value="#{msg.From}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}" pattern="yyyy/MM/dd" widgetVar="varLastModifiedFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                            <p:outputLabel value="#{msg.To}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}" pattern="yyyy/MM/dd" widgetVar="varLastModifiedTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        </h:panelGrid>
                        <p:commandButton onclick="setDateFilter('varDataList', 'filterLastModifiedDate', 'varLastModifiedFrom', 'varLastModifiedTo'); PF('lastModifiedDateOverlayPanel').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                        <p:commandButton onclick="PF('lastModifiedDateOverlayPanel').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                    </p:overlayPanel>
                </h:form>
                <p:dialog id="contractCatQuotaEditDlg" width="35%" widgetVar="contractCatQuotaEditDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="销售人员信息">
                    <h:form id="contractCatQuotaEditForm">
                        <h:panelGroup id="display">
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <h:panelGroup>
                                    <label class="label">合同号*</label>
                                    <p:inputText value="#{zkbContractCatQuotaHistoryController.selected.contractNo}" disabled="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">申请单号*</label>
                                    <p:inputText value="#{zkbContractCatQuotaHistoryController.selected.partOrderNo}" disabled="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">高低端机*</label>
                                    <p:selectOneMenu value="#{zkbContractCatQuotaHistoryController.selected.assetType}" disabled="true">
                                        <f:selectItem itemLabel="高端机" itemValue="highMachine"/>
                                        <f:selectItem itemLabel="低端机" itemValue="lowMachine"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">探头名额类型*</label>
                                    <p:selectOneMenu value="#{zkbContractCatQuotaHistoryController.selected.probeType}" disabled="true">
                                        <f:selectItem itemLabel="探头名额" itemValue="OldProbe"/>
                                        <f:selectItem itemLabel="探头任意名额" itemValue="Any"/>
                                        <f:selectItem itemLabel="探头普通名额" itemValue="Normal"/>
                                        <f:selectItem itemLabel="探头特殊名额" itemValue="Special"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">名额数量*</label>
                                    <p:inputText value="#{zkbContractCatQuotaHistoryController.selected.qty}" disabled="true"/>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <label class="label">状态*</label>
                                    <p:selectOneMenu value="#{zkbContractCatQuotaHistoryController.selected.status}" required="true" requiredMessage="状态不能为空！">
                                        <f:selectItem itemLabel="Y" itemValue="Y"/>
                                        <f:selectItem itemLabel="N" itemValue="N"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">创建人*</label>
                                    <p:inputText value="#{zkbContractCatQuotaHistoryController.getUserNameByUid(zkbContractCatQuotaHistoryController.selected.createdBy)}" disabled="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">创建时间*</label>
                                    <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbContractCatQuotaHistoryController.selected.createdDate}" readonly="true" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">最后更新人*</label>
                                    <p:inputText value="#{zkbContractCatQuotaHistoryController.getUserNameByUid(zkbContractCatQuotaHistoryController.selected.lastModifiedBy)}" disabled="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">最后更新时间*</label>
                                    <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbContractCatQuotaHistoryController.selected.lastModifiedDate}" readonly="true" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                                </h:panelGroup>
                            </p:panelGrid>
                            <p:commandButton validateClient="true" actionListener="#{zkbContractCatQuotaHistoryController.updateData()}" value="#{msg.Save}" update=":zkbContractCatQuotaHistoryListForm:datalist :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'contractCatQuotaEditDlg');"/>
                            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('contractCatQuotaEditDlg').hide()"/>
                        </h:panelGroup>
                    </h:form>
                </p:dialog>
            </div>
        </div>
    </ui:define>


</ui:composition>
