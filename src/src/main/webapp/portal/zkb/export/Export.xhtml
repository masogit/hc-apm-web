<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="一键导出"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup rendered="#{userContextService.geAdmin or userContextService.isZkbFeUserConfig('FourHundredsTeam_Probe') or userContextService.isZkbFeUserConfig('FourHundredsTeam')}">
                                <label class="label">#{msg.zkbHistory_agent}</label>
                                <p:selectOneMenu id="agent" value="#{zkbExportController.tenantUid}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{zkbExportController.tenantInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:commandButton id="exportButton" ajax="false" value="一键导出" title="一键导出" actionListener="#{zkbExportController.export}" icon="ui-icon-arrowthick-1-s" >
                                    <p:fileDownload value="#{zkbExportController.exportFile}"/>
                                </p:commandButton>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
