                    <h:panelGroup >
                        <label class="label">#{msg.zkbFePartOrder_orderNoa}*</label>

                            <c:when test="#{zkbFePartOrderProbeController.selected.needLetterFlag eq 't' and 'f' eq zkbFePartOrderProbeController.selected.hasUploadLetter}">

                                </p:commandLink>
                            </c:when>
