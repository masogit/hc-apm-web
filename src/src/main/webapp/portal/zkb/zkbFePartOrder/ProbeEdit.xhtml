<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://java.sun.com/jsp/jstl/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <h:panelGroup id="zkbFePartOrderProbeEditPanelGroup">
        <h:panelGroup rendered="#{zkbFePartOrderDetailController.selected.orderType=='Probe'}">
            <p:messages id="probeMessages" showDetail="true" closable="false" autoUpdate="true" ></p:messages>
            <p:fieldset id="zkbProbeWorkFlowFieldset" legend="工单信息" >
                <h:form id="probeSearchForm">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{zkbFePartOrderProbeController.workFlowInFistStep()}">
                    <h:panelGroup>
                        <label class="label">#{msg.zkbFePartOrder_systemId}</label>
                        <p:inputText  id="probeSystemId" disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}"    />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbFePartOrder_sr}</label>
                        <p:inputText id="probeFatherPartOrderNo" disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}"  />
                    </h:panelGroup>
                    <p:commandButton validateClient="false" disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" process="@this"  actionListener="#{zkbFePartOrderProbeController.getSparePartsZkbFePartOrder(zkbFePartOrderDetailController.selected.notGeAsset,param['probeSearchForm:probeSystemId'],param['probeSearchForm:probeFatherPartOrderNo'])}" value="#{msg.Search}" update="zkbFePartOrderProbeForm:probeZkbFePartOrder probeMessages"/>
                </p:panelGrid>
                </h:form>
                <h:form id="zkbFePartOrderProbeForm">
                <p:dataTable id="probeZkbFePartOrder" value="#{zkbFePartOrderProbeController.sparePartsZkbFePartOrderList}" var="item"
                             widgetVar="probeZkbFePartOrder" selectionMode="single" selection="#{zkbFePartOrderProbeController.selectZkbFePartOrder}"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.reportDate}"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">
                    <p:ajax event="rowSelect"  listener="#{zkbFePartOrderProbeController.selectedWorkFlow(zkbFePartOrderDetailController.selected.notGeAsset)}"  update="zkbFePartOrderProbeEditForm:zkbContractDatalist_probe zkbFePartOrderProbeEditForm probeMessages" />
                    <p:column headerText="报修单号">
                        <h:outputText value="#{item.partOrderNo}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbFePartOrder_sr}">
                        <h:outputText value="#{item.sr}"/>
                    </p:column>
                    <p:column rendered="#{zkbFePartOrderDetailController.selected.notGeAsset eq 't'}" headerText="二维码">
                        <h:outputText value="#{item.qrCode}"/>
                    </p:column>

                    <p:column headerText="主机序列号" rendered="#{zkbFePartOrderDetailController.selected.notGeAsset eq 't'}" >
                        <h:outputText value="#{item.departNum}"/>
                    </p:column>

                    <p:column headerText="#{msg.zkbFePartOrder_functionType}">
                        <h:outputText value="#{item.functionType}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbFePartOrder_phenomenon}">
                        <h:outputText value="#{item.phenomenon}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbFePartOrder_reportUser}">
                        <h:outputText value="#{item.reportUser}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbFePartOrder_hospitalName}">
                        <h:outputText value="#{item.hospitalName}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbFePartOrder_geEngineerName}">
                        <h:outputText value="#{item.geEngineerName}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbFePartOrder_geEngineerPhone}">
                        <h:outputText value="#{item.geEngineerPhone}"/>
                    </p:column>
                    <p:column headerText="创建时间">
                        <h:outputText value="#{item.reportDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss" />
                        </h:outputText>
                    </p:column>
                </p:dataTable>
                </h:form>
            </p:fieldset>
            <h:form id="zkbFePartOrderProbeEditForm">
            <p:fieldset id="zkbContractFieldset" legend="合同信息" >
                <p:dataTable id="zkbContractDatalist_probe" value="#{zkbFePartOrderProbeController.contractList}" var="item"
                             widgetVar="zkbContractDatalist_probe" selectionMode="single" disabledSelection="true"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">
                    <p:column headerText="#{msg.zkbContact_tenant}">
                        <h:outputText value="#{zkbContractController.getTenantInfo(item.tenantUID).name}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractNo}" >
                        <h:outputText value="#{item.contractNo}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_region}">
                        <h:outputText value="#{item.region}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractType}">
                        <h:outputText value="#{item.contractType}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_ibNumber}">
                        <h:outputText value="#{item.ibNumber}"/>
                    </p:column>
                    <p:column headerText="探头任意剩余名额" >
                        <h:outputText value="#{item.probeQuota}"/>
                    </p:column>
                    <p:column headerText="探头普通剩余名额" >
                        <h:outputText value="#{item.probeQuotaNormal}"/>
                    </p:column>
                    <p:column headerText="探头特殊剩余名额" >
                        <h:outputText value="#{item.probeQuotaSpecial}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_startDate}">
                        <h:outputText value="#{item.startDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_endDate}">
                        <h:outputText value="#{item.endDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <f:facet name="{Toolbar}">
                    </f:facet>
                </p:dataTable>
                <p:outputLabel id="tips" rendered="#{zkbFePartOrderProbeController.hasEditRight('Requested') and zkbFePartOrderProbeController.checkContractDate()}" style="color: red;font-weight:bold;margin-left: 30px;font-size: larger"  value="您选择的合同已不在有效期内，请结合业务确认是否继续申请流程！"/>
            </p:fieldset>
            <p:fieldset legend="基本信息" >
                <p:panelGrid columns="3"  layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.zkbFePartOrder_systemId}</label>
                            <p:inputText   disabled="true" value="#{zkbFePartOrderProbeController.selected.systemId}"    />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!zkbFePartOrderProbeController.selected.currentStep.equals('Requested')}">
                            <label class="label">#{msg.zkbFePartOrder_probeOrderNo}</label>
                            <p:inputText disabled="true"  value="#{zkbFePartOrderProbeController.selected.partOrderNo}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbFePartOrder_reportUser}</label>
                            <p:inputText  disabled="true"   value="#{zkbFePartOrderProbeController.selected.reportUser}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbFePartOrder_probeReportDate}</label>
                            <p:calendar disabled="true" timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM-dd HH:mm:ss"  value="#{zkbFePartOrderProbeController.selected.reportDate}"
                                        showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbFePartOrderDetailController.selected.notGeAsset eq 't'}" >
                            <label class="label">设备品牌</label>
                            <p:inputText id="manufacture" readonly="true" disabled="true" value="#{zkbFePartOrderProbeController.selected.manufacture}"  />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{'1'.equals(zkbFePartOrderProbeController.selected.assetGroup)}">
                            <label class="label">#{msg.zkbFePartOrder_assetTypeDi}*</label>
                            <p:selectOneMenu  disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.assetTypeDi}" required="true" requiredMessage="#{msg.zkbFePartOrder_assetTypeDi} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_assetTypeDi')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbFePartOrder_orderAnnotation}*</label>
                            <p:selectOneMenu  disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.orderAnnotation}" required="true" requiredMessage="#{msg.zkbFePartOrder_orderAnnotation} #{msg.ValidationRequire}">
                                <p:ajax update="problemOrderNumberGrid_Probe" listener="#{zkbFePartOrderProbeController.orderAnnotationChange}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_sparePartsOrderAnnotation')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="problemOrderNumberGrid_Probe" >
                            <h:panelGroup rendered="#{!(zkbFePartOrderProbeController.showProblemOrderNumber)}">
                                <label class="label">#{msg.zkbFePartOrder_problemOrderNumber}*</label>
                                <p:inputText disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.problemOrderNumber}"  required="true" requiredMessage="#{msg.zkbPartOrder_problemOrderNumber} #{msg.ValidationRequire}" />
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbFePartOrder_urgentOrder}*</label>
                            <p:selectOneMenu disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.urgentOrder}" required="true" requiredMessage="#{msg.zkbPartOrder_urgentOrder} #{msg.ValidationRequire}">
                                <p:ajax event="change" update="urgencyReasonsGrid" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_emergency')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="urgencyReasonsGrid" columns="1" layout="grid" styleClass="ui-panelgrid-blank" >
                            <h:panelGroup  rendered="#{(zkbFePartOrderProbeController.selected.urgentOrder eq 't')}" style="text-align: left">
                                <label class="label">#{msg.zkbFePartOrder_urgencyReasons}*</label>
                                <p:selectOneMenu disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}"  value="#{zkbFePartOrderProbeController.selected.urgencyReasons}" required="true" requiredMessage="#{msg.zkbFePartOrder_urgencyReasons} #{msg.ValidationRequire}" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbUrgentReasonType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbFePartOrderProbeController.showZkbPoProbeQuotaType}">
                            <label class="label">#{msg.zkbFePartOrder_deductType}*</label>
                            <p:selectOneMenu disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.zkbPoProbeQuotaType}" required="true" requiredMessage="#{msg.zkbFePartOrder_deductType} #{msg.ValidationRequire}">
                                <p:ajax update="valueType valueTypeGroup" listener="#{zkbFePartOrderProbeController.initZknPartCat}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{zkbFePartOrderProbeController.getZkbPoProbeQuotaType(zkbFePartOrderDetailController.selected.notGeAsset)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbFePartOrderProbeController.showZkbhighCatFlag}">
                            <c:choose>
                                <c:when test="#{zkbFePartOrderDetailController.selected.notGeAsset eq 't' }">
                                    <label class="label">是否高值探头*</label>
                                    <p:selectOneMenu disabled="true" value="#{zkbFePartOrderProbeController.selected.highCatFlag}" required="#{zkbFePartOrderProbeController.hasEditRight('Requested')}" requiredMessage="是否高值探头 #{msg.ValidationRequire}">
                                        <p:ajax event="change" update="valueType valueTypeGroup" />
                                        <f:selectItem itemLabel="否" itemValue="f"/>
                                    </p:selectOneMenu>
                                    <p:selectOneMenu style="display: none" value="#{zkbFePartOrderProbeController.selected.highCatFlag}" required="#{zkbFePartOrderProbeController.hasEditRight('Requested')}" requiredMessage="是否高值探头 #{msg.ValidationRequire}">
                                        <f:selectItem itemLabel="否" itemValue="f"/>
                                    </p:selectOneMenu>
                                </c:when>
                                <c:otherwise>
                                    <label class="label">是否高值探头*</label>
                                    <p:selectOneMenu disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.highCatFlag}" required="#{zkbFePartOrderProbeController.hasEditRight('Requested')}" requiredMessage="是否高值探头 #{msg.ValidationRequire}">
                                        <p:ajax event="change" update="valueType valueTypeGroup" />
                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                        <f:selectItem itemLabel="是" itemValue="t"/>
                                        <f:selectItem itemLabel="否" itemValue="f"/>
                                    </p:selectOneMenu>
                                </c:otherwise>
                            </c:choose>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbFePartOrder_phenomenon}</label>
                            <p:inputTextarea   disabled="true"  value="#{zkbFePartOrderProbeController.selected.phenomenon}"  maxlength="100"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbFePartOrder_productNumber}</label>
                            <p:inputText disabled="true" value="#{zkbFePartOrderProbeController.selected.productNumber}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbFePartOrder_remark}</label>
                            <p:inputTextarea disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.remark}" maxlength="255" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!zkbFePartOrderProbeController.selected.currentStep.equals('Requested')}">
                            <label class="label">#{msg.zkbFePartOrder_currentStatus}</label>
                            <p:selectOneMenu  disabled="true" value="#{zkbFePartOrderProbeController.selected.status}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_status')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
            <p:fieldset id="zkbPartOrderProbeFieldset" legend="探头明细" >
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.zkbFePartOrder_catNo}*</label>
                        <p:inputText  disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.catNo}" required="true" requiredMessage="#{msg.zkbFePartOrder_catNo} #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup id="valueType">
                        <c:if test="#{zkbFePartOrderProbeController.checkShowSN()}">
                            <label class="label">SN编号*</label>
                            <p:selectOneMenu disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.contractCatId}" required="true" requiredMessage="SN编号 #{msg.ValidationRequire}" >
                                <p:ajax event="itemSelect" listener="#{zkbFePartOrderProbeController.setContractCatSnNo()}"  process="@parent"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{zkbFePartOrderProbeController.highCatList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                            <label style="color: red">#{zkbFePartOrderProbeController.noHighCatTips}</label>
                        </c:if>
                        <c:if test="#{(!zkbFePartOrderProbeController.checkShowSN()) and (zkbFePartOrderDetailController.selected.notGeAsset eq 'f')}">
                            <label class="label">#{msg.zkbFePartOrder_zkbPartOrderCat}*</label>
                            <p:autoComplete disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" dropdown="true" value="#{zkbFePartOrderProbeController.selected.zkbPartOrderCat}"  scrollHeight="300" forceSelection="true" required="true" requiredMessage="#{msg.zkbFePartOrder_zkbPartOrderCat} #{msg.ValidationRequire}"
                                            completeMethod="#{zkbFePartOrderProbeController.autoCompleteCat}" var="t" itemLabel="#{t.catModel}" itemValue="#{t}" converter="zkbPartOrderCatConverter">
                                <p:ajax event="itemSelect" update="valueTypeGroup"  />
                            </p:autoComplete>
                        </c:if>
                        <c:if test="#{(!zkbFePartOrderProbeController.checkShowSN()) and (zkbFePartOrderDetailController.selected.notGeAsset eq 't')}">
                            <label class="label">#{msg.zkbFePartOrder_zkbPartOrderCat}*</label>
                            <p:inputText disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.catModelNonGe}" required="true" requiredMessage="#{msg.zkbFePartOrder_zkbPartOrderCat} #{msg.ValidationRequire}" />
                        </c:if>
                    </h:panelGroup>
                    <h:panelGroup id="valueTypeGroup" rendered="#{zkbFePartOrderDetailController.selected.notGeAsset eq 'f'}">
                        <c:if test="#{!zkbFePartOrderProbeController.checkShowSN()}">
                        <label class="label">#{msg.zkbFePartOrder_valueType}</label>
                        <p:inputText  value="#{fieldMsg.fieldValue('zkbPoValueType',zkbFePartOrderProbeController.selected.zkbPartOrderCat.valueType)}" disabled="true" />
                        <label style="color: red">#{zkbFePartOrderProbeController.valueTypeTips}</label>
                        </c:if>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbFePartOrder_oldCatSn}*</label>
                        <p:inputText  disabled="#{!zkbFePartOrderProbeController.hasEditRight('Requested')}" value="#{zkbFePartOrderProbeController.selected.oldCatSn}" required="true" requiredMessage="#{msg.zkbFePartOrder_oldCatSn} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbFePartOrder_assetQty}</label>
                        <p:inputText value="#{zkbFePartOrderProbeController.selected.catNum}" disabled="true" />
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
            <p:fieldset  id="managementFieldset" legend="代理商确认信息" rendered="#{zkbFePartOrderProbeController.checkRendered('WaitingAssignment')}">
                <p:fieldset id="uploadContractEvidence" rendered="#{zkbFePartOrderProbeController.selected.provideNewContract eq 't' and zkbFePartOrderProbeController.selected.newCatFlag eq 't' and zkbFePartOrderProbeController.showZkbPoProbeQuotaType}">
                <p:panelGrid>
                    <h:panelGroup>
                        <p:dataList id="contractEvidenceList" value="#{zkbFePartOrderProbeController.v2_blobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                            <f:facet name="header">院方合同证明</f:facet>
                            <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                            <p:commandButton rendered="#{zkbFePartOrderProbeController.selected.currentStep.equals('WaitingAssignment')}" actionListener="#{zkbFePartOrderProbeController.removeFile(fileitem)}" update="contractEvidenceList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </p:dataList>
                        <p:fileUpload rendered="#{zkbFePartOrderProbeController.selected.currentStep.equals('WaitingAssignment')}" allowTypes="/(\.|\/)(pdf|PDF)$/" fileUploadListener="#{zkbFePartOrderProbeController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                      multiple="true"  sizeLimit="35000000"  update="contractEvidenceList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}35M" label="#{msg.Add}"/>
                    </h:panelGroup>
                </p:panelGrid>
                </p:fieldset>
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <h:outputText id="thisDeductionMessage"  style="color: red;font-size: 14px;" value="#{zkbFePartOrderProbeController.thisDeductionMessage}" />
                    </h:panelGroup>
                </p:panelGrid>
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup rendered="#{!zkbFePartOrderProbeController.selected.notGeAsset.equals('t')}">
                        <label class="label">#{msg.zkbFePartOrder_newProbe}*</label>
                        <p:selectOneMenu disabled="#{!zkbFePartOrderProbeController.hasEditRight('WaitingAssignment')}" required="true" requiredMessage="#{msg.zkbFePartOrder_newProbe} #{msg.ValidationRequire}" value="#{zkbFePartOrderProbeController.selected.newCatFlag}" >
                            <p:ajax event="change" listener="#{zkbFePartOrderProbeController.initProvideNewContract()}"  update="managementFieldset confirmMessage thisDeductionMessage " />
                            <f:selectItem  itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_yesOrNo')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup id="provideNewContract_display" rendered="#{zkbFePartOrderProbeController.selected.newCatFlag.equals('t') and !zkbFePartOrderProbeController.selected.notGeAsset.equals('t') and zkbFePartOrderProbeController.showZkbPoProbeQuotaType}">
                        <label class="label">是否可以提供全新合同*</label>
                        <p:selectOneMenu disabled="#{!zkbFePartOrderProbeController.hasEditRight('WaitingAssignment')}" required="true"  value="#{zkbFePartOrderProbeController.selected.provideNewContract}" >
                            <p:ajax event="change" update="managementFieldset confirmMessage thisDeductionMessage" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_yesOrNo')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{!zkbFePartOrderProbeController.selected.currentStep.equals('WaitingAssignment')}">
                        <label class="label">#{msg.zkbFePartOrder_tenantAssignUser}*：</label>
                        <p:inputText  disabled="true"  value="#{zkbFePartOrderProbeController.selected.tenantAssignUser}"  />
                    </h:panelGroup>
                    <h:panelGroup rendered="#{!zkbFePartOrderProbeController.selected.currentStep.equals('WaitingAssignment')}">
                        <label class="label">#{msg.zkbFePartOrder_tenantAssignDate}*：</label>
