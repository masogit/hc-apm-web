<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
                <h:form id="zkbFePartOrderEditForm" >
                    <h:panelGroup rendered="#{zkbFePartOrderDetailController.selected.orderType=='ManMade'}">
                    <p:fieldset id="zkbFiledSet" legend="基本信息" style="margin-bottom:20px" rendered="#{zkbFePartOrderDetailController.selected !=null}">
                        <h:panelGroup>
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">#{msg.zkbFePartOrder_systemId}*</label>
                                    <p:inputText maxlength="20" disabled="#{!zkbFePartOrderDetailController.hasEditRight('Requested')}" id="systemId" value="#{zkbFePartOrderDetailController.selected.systemId}" required="true"  requiredMessage="#{msg.zkbFePartOrder_systemId} #{msg.ValidationRequire}" />
                                    <p:commandButton disabled="#{!zkbFePartOrderDetailController.hasEditRight('Requested')}" id="systemIdButton" actionListener="#{zkbFePartOrderDetailController.fullInfoBySystemId(param['zkbFePartOrderEditForm:systemId'])}" update=":zkbFePartOrderEditForm"  process="@this" value="#{msg.Search}"   />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{!zkbFePartOrderProbeController.selected.currentStep.equals('Requested')}">
                                    <label  class="label">#{msg.zkbFePartOrder_orderNo}</label>
                                    <p:inputText id="orderNo" readonly="true" disabled="true" value="#{zkbFePartOrderDetailController.selected.partOrderNo}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.zkbFePartOrder_reportUser}</label>
                                    <p:inputText id="reportUser" readonly="true" disabled="true"  value="#{zkbFePartOrderDetailController.selected.reportUser}"  />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.zkbFePartOrder_reportDate}</label>
                                    <p:calendar disabled="true" timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM-dd HH:mm:ss"  value="#{zkbFePartOrderDetailController.selected.reportDate}"
                                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.zkbFePartOrder_hospitalName}</label>
                                    <p:inputText id="hospitalName" readonly="true" disabled="true" value="#{zkbFePartOrderDetailController.selected.hospitalName}"  />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.zkbFePartOrder_hospitalClientName}*</label>
                                    <p:inputText maxlength="20" disabled="#{!zkbFePartOrderDetailController.hasEditRight('Requested')}" id="hospitalClientName" required="true" requiredMessage="#{msg.zkbFePartOrder_hospitalClientName} #{msg.ValidationRequire}" value="#{zkbFePartOrderDetailController.selected.hospitalClientName}"   />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.zkbFePartOrder_hospitalClientPhone}*</label>
                                    <p:inputText maxlength="20" disabled="#{!zkbFePartOrderDetailController.hasEditRight('Requested')}" id="hospitalClientPhone" required="true" requiredMessage="#{msg.zkbFePartOrder_hospitalClientPhone} #{msg.ValidationRequire}" value="#{zkbFePartOrderDetailController.selected.hospitalClientPhone}"  />
                                </h:panelGroup>
<!--                                <h:panelGroup>-->
<!--                                    <label class="label">#{msg.zkbFePartOrder_position}</label>-->
<!--                                    <p:inputText maxlength="20" disabled="#{!zkbFePartOrderDetailController.workFlowInFistStep() or !zkbFePartOrderDetailController.hasEditRight()}" id="position" value="#{zkbFePartOrderDetailController.selected.position}" />-->
<!--                                </h:panelGroup>-->
                                <h:panelGroup>
                                    <label class="label">#{msg.zkbFePartOrder_functionType}</label>
                                    <p:inputText id="functionType" readonly="true" disabled="true" value="#{zkbFePartOrderDetailController.selected.functionType}"  />
                                </h:panelGroup>
                                <h:panelGroup >
                                    <label class="label">#{msg.zkbFePartOrder_machineStatus}*</label>
                                    <p:selectOneMenu disabled="#{!zkbFePartOrderDetailController.hasEditRight('Requested')}" id="machineStatus" value="#{zkbFePartOrderDetailController.selected.machineStatus}" required="true"  requiredMessage="#{msg.zkbFePartOrder_machineStatus} #{msg.ValidationRequire}">
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_machineStatus')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <label class="label">#{msg.zkbFePartOrder_urgencyStatus}*</label>
                                    <p:selectOneMenu disabled="#{!zkbFePartOrderDetailController.hasEditRight('Requested')}" id="urgencyStatus" value="#{zkbFePartOrderDetailController.selected.urgencyStatus}"  required="true" requiredMessage="#{msg.zkbFePartOrder_urgencyStatus} #{msg.ValidationRequire}">
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_casePriority')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <label class="label">#{msg.zkbFePartOrder_subtractTotalStatus}*</label>
                                    <p:selectOneMenu disabled="#{!zkbFePartOrderDetailController.hasEditRight('Requested')||'highMachine' eq zkbFePartOrderDetailController.selected.assetType}" id="subtractTotalStatus" value="#{zkbFePartOrderDetailController.selected.subtractTotalStatus}"  required="true" requiredMessage="#{msg.zkbFePartOrder_subtractTotalStatus} #{msg.ValidationRequire}">
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_isSubtractTotalStatus')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
<!--                                <h:panelGroup>-->
<!--                                    <label class="label">#{msg.zkbFePartOrder_location}</label>-->
<!--                                    <p:inputText maxlength="20" disabled="#{!zkbFePartOrderDetailController.workFlowInFistStep() or !zkbFePartOrderDetailController.hasEditRight()}" id="location" value="#{zkbFePartOrderDetailController.selected.location}" />-->
<!--                                </h:panelGroup>-->
                                <h:panelGroup rendered="#{zkbFePartOrderDetailController.checkRendered('WaitingAssignment')}">
                                    <label class="label">#{msg.zkbFePartOrder_currentStatus}</label>
                                    <p:inputText maxlength="20" disabled="true" id="status" value="#{fieldMsg.fieldValue('zkbFePartOrder_status', zkbFePartOrderDetailController.selected.status)}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.zkbFePartOrder_phenomenon}*</label>
                                    <p:inputTextarea  disabled="#{!zkbFePartOrderDetailController.hasEditRight('Requested')}" value="#{zkbFePartOrderDetailController.selected.phenomenon}" required="true"
                                                     requiredMessage="#{msg.zkbFePartOrder_phenomenon} #{msg.ValidationRequire}" maxlength="100"/>
                                </h:panelGroup>
                            </p:panelGrid>
                            <p:fieldset id="zkbContractFieldset" legend="合同信息" >
                                <p:dataTable id="zkbContractDatalist" value="#{zkbFePartOrderDetailController.contractList}" var="item"
                                             widgetVar="zkbContractDatalist" selectionMode="single" disabledSelection="true"
                                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.zkbContact_tenant}">
                                        <h:outputText value="#{zkbContractController.getTenantInfo(item.tenantUID).name}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.zkbContract_contractNo}" >
                                        <h:outputText value="#{item.contractNo}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.zkbContract_region}">
                                        <h:outputText value="#{item.region}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.zkbContract_contractType}">
                                        <h:outputText value="#{item.contractType}"/>
                                    </p:column>

                                    <p:column headerText="#{msg.zkbContract_ibNumber}">
                                        <h:outputText value="#{item.ibNumber}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.zkbContract_spareQuota}">
                                        <h:outputText value="#{item.spareQuota}"/>
                                    </p:column>
<!--                                    <p:column headerText="#{msg.zkbContract_probeQuota}" >-->
<!--                                        <h:outputText value="#{item.probeQuota}"/>-->
<!--                                    </p:column>-->

                                    <p:column headerText="探头任意剩余名额" >
                                        <h:outputText value="#{item.probeQuota}"/>
                                    </p:column>
                                    <p:column headerText="探头普通剩余名额" >
                                        <h:outputText value="#{item.probeQuotaNormal}"/>
                                    </p:column>
                                    <p:column headerText="探头特殊剩余名额" >
                                        <h:outputText value="#{item.probeQuotaSpecial}"/>
                                    </p:column>
                                    <p:column headerText="探头高值剩余名额" >
                                        <h:outputText value="#{item.probeQuotaHigh}"/>
                                    </p:column>

                                    <p:column headerText="#{msg.zkbContract_geArtificialSupportTimes}" >
                                        <h:outputText value="#{item.geArtificialSupportTimes}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.zkbContract_spareArtificail}">
                                        <h:outputText value="#{item.spareArtificail}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.zkbContract_startDate}">
                                        <h:outputText value="#{item.startDate}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.zkbContract_endDate}">
                                        <h:outputText value="#{item.endDate}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                        </h:outputText>
                                    </p:column>
                                    <f:facet name="{Toolbar}">
                                    </f:facet>
                                </p:dataTable>
                            </p:fieldset>
                        </h:panelGroup>
                    </p:fieldset>
                    <p:fieldset id="managementFieldset" legend="代理商确认信息" rendered="#{zkbFePartOrderDetailController.checkRendered('WaitingAssignment')}">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup rendered="#{!zkbFePartOrderDetailController.selected.currentStep.equals('WaitingAssignment')}">
                                <label class="label">#{msg.zkbFePartOrder_tenantAssignUser}*：</label>
                                <p:inputText id="tenantAssignUser" readonly="true" disabled="true" value="#{zkbFePartOrderDetailController.selected.tenantAssignUser}"  />
                            </h:panelGroup>
                            <h:panelGroup rendered="#{!zkbFePartOrderDetailController.selected.currentStep.equals('WaitingAssignment')}">
                                <label class="label">#{msg.zkbFePartOrder_tenantAssignDate}*：</label>
                                <p:calendar disabled="true" timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM-dd HH:mm:ss"  value="#{zkbFePartOrderDetailController.selected.tenantAssignDate}"
                                            showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbFePartOrder_comment}</label>
                                <p:inputTextarea disabled="#{!zkbFePartOrderDetailController.hasEditRight('WaitingAssignment')}" id="comment" required="true" requiredMessage="#{msg.zkbFePartOrder_comment} #{msg.ValidationRequire}" value="#{zkbFePartOrderDetailController.selected.comment}" rows="2" cols="20">
                                </p:inputTextarea>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset id="orderedFieldset" legend="派工信息" rendered="#{zkbFePartOrderDetailController.checkRendered('WaitingApm')}">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup >
                                        <label class="label">#{msg.zkbFePartOrder_sr}*</label>
                                        <p:inputText disabled="#{!zkbFePartOrderDetailController.hasEditRight('WaitingApm')}" value="#{zkbFePartOrderDetailController.selected.sr}"  required="true" requiredMessage="#{msg.zkbFePartOrder_sr} #{msg.ValidationRequire}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">#{msg.zkbFePartOrder_act}*</label>
                                        <p:inputText disabled="#{!zkbFePartOrderDetailController.hasEditRight('WaitingApm')}" value="#{zkbFePartOrderDetailController.selected.act}"  required="true" requiredMessage="#{msg.zkbFePartOrder_act} #{msg.ValidationRequire}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">#{msg.zkbFePartOrder_geEngineerName}*</label>
                                        <p:inputText disabled="#{!zkbFePartOrderDetailController.hasEditRight('WaitingApm')}" value="#{zkbFePartOrderDetailController.selected.geEngineerName}"  required="true" requiredMessage="#{msg.zkbFePartOrder_geEngineerName} #{msg.ValidationRequire}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">#{msg.zkbFePartOrder_geEngineerPhone}*</label>
                                        <p:inputText disabled="#{!zkbFePartOrderDetailController.hasEditRight('WaitingApm')}" value="#{zkbFePartOrderDetailController.selected.geEngineerPhone}"  required="true" requiredMessage="#{msg.zkbFePartOrder_geEngineerPhone} #{msg.ValidationRequire}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">#{msg.zkbFePartOrder_fourHundredComment}</label>
                                        <p:inputTextarea disabled="#{!zkbFePartOrderDetailController.hasEditRight('WaitingApm')}"  value="#{zkbFePartOrderDetailController.selected.remark}"  rows="2" cols="20" >
                                        </p:inputTextarea>
                                    </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:commandButton value="#{msg.submit}" icon="ui-icon-check" rendered="#{zkbFePartOrderDetailController.hasEditRight('Requested')}" disabled="#{zkbFePartOrderDetailController.contractError}" validateClient="true" update=":growl :zkbFePartOrderEditForm" action="#{zkbFePartOrderDetailController.saveAndToListPage}" style="float:left"/>
                    <p:commandButton value="同意派工" icon="ui-icon-check" rendered="#{zkbFePartOrderDetailController.hasEditRight('WaitingAssignment')}" process="@this"  action="#{zkbFePartOrderDetailController.supplierAccept(param['zkbFePartOrderEditForm:comment'])}" style="float:left"/>
                    <p:commandButton value="暂不派工" icon="ui-icon-close" rendered="#{zkbFePartOrderDetailController.hasEditRight('WaitingAssignment')}" update=":growl :zkbFePartOrderEditForm" action="#{zkbFePartOrderDetailController.supplierReject}" style="float:left"/>
                    <p:commandButton value="#{msg.submit}" icon="ui-icon-check" rendered="#{zkbFePartOrderDetailController.hasEditRight('WaitingApm')}" update=":growl :zkbFePartOrderEditForm"  validateClient="true" action="#{zkbFePartOrderDetailController.fullApmInfo}" style="float:left"/>
                    <p:commandButton immediate="false" process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back" action="#{zkbFePartOrderDetailController.backList}" />
                    </h:panelGroup>
                </h:form>
</ui:composition>
</html>
