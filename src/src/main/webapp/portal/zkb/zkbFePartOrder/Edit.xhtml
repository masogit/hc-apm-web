<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{msg.zkbFePartOrder_ZkbFePartOrder}"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbFeHeadForm">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup >
                        <label class="label">GE设备或者非GE设备*</label>
                        <p:selectOneMenu  id="notGeAsset" valueChangeListener="#{zkbFePartOrderDetailController.notGeAssetChangeEditPage}" disabled="#{!zkbFePartOrderDetailController.selected.currentStep.equals('Requested')}" value="#{zkbFePartOrderDetailController.selected.notGeAsset}" requiredMessage="GE设备或者非GE设备 #{msg.ValidationRequire}">
                            <p:ajax event="change" oncomplete="openViewWindow(xhr, status, args)" update="orderType zkbFeHeadForm :zkbFePartOrderEditForm :zkbFePartOrderSparePartsEditpanelGroup :zkbFePartOrderProbeEditPanelGroup" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItem itemLabel="GE" itemValue="f"/>
                            <f:selectItem itemLabel="非GE" itemValue="t"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">#{msg.zkbFePartOrder_orderTypeName}*</label>
                        <p:selectOneMenu id="orderType"  disabled="#{!zkbFePartOrderDetailController.selected.currentStep.equals('Requested')}"  value="#{zkbFePartOrderDetailController.selected.orderType}">
                            <p:ajax event="change"  update="zkbFeHeadForm :zkbFePartOrderEditForm :zkbFePartOrderSparePartsEditpanelGroup :zkbFePartOrderProbeEditPanelGroup" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_orderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <!--<h:panelGroup id="maintainFlagGroup" rendered="#{zkbFePartOrderDetailController.selected.orderType eq 'ManMade'}">-->
                    <h:panelGroup id="maintainFlagGroup" rendered="false">
                        <label class="label">保养申请*</label>
                        <p:selectOneMenu id="maintainFlag" valueChangeListener="#{zkbFePartOrderDetailController.handSubtractStatus}" disabled="#{!zkbFePartOrderDetailController.selected.currentStep.equals('Requested')}" value="#{zkbFePartOrderDetailController.selected.maintainFlag}" requiredMessage="保养申请 #{msg.ValidationRequire}">
                            <p:ajax event="change" update="zkbFeHeadForm zkbFePartOrderEditForm:subtractTotalStatus"   />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItem itemLabel="是" itemValue="t"/>
                            <f:selectItem itemLabel="否" itemValue="f"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>

            </h:form>
        </div>
        <div class="ui-g-12 card">
            <ui:include src="ManMadeEdit.xhtml"/><!-- 人工申请编辑 -->
            <ui:include src="SparePartsEdit.xhtml"/><!-- 备件申请编辑 -->
            <ui:include src="ProbeEdit.xhtml"/><!-- 探头申请编辑 -->
            <ui:include src="partOrderModify.xhtml"/>
            <ui:include src="partOrderReturnModify.xhtml"/>
        </div>
        <script>
            function openViewWindow(xhr, status, args) {
                window.document.body.innerHTML = '加载中...';
                window.location.href = args.url;
            }
        </script>
    </ui:define>
</ui:composition>
