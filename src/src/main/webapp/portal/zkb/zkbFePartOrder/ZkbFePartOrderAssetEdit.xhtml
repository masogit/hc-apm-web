<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="zkbFePartOrderAssetInfoEditDlg" widgetVar="zkbFePartOrderAssetInfoEditDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="备件申请列表"  height="420">
        <h:form id="zkbFePartOrderAssetInfoEditForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label class="label">#{msg.zkbFePartOrder_assetNo}*</label>
                    <p:inputText disabled="#{!zkbFePartOrderSparePartDetailController.hasEditRight('Requested')}"  value="#{zkbFePartOrderSparePartDetailController.selectZkbFePartOrderAssetInfo.assetNo}" required="true" requiredMessage="#{msg.zkbFePartOrder_assetNo} #{msg.ValidationRequire}" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.zkbFePartOrder_assetDescription}*</label>
                    <p:inputText disabled="#{!zkbFePartOrderSparePartDetailController.hasEditRight('Requested')}"  value="#{zkbFePartOrderSparePartDetailController.selectZkbFePartOrderAssetInfo.assetDescription}" required="true" requiredMessage="#{msg.zkbFePartOrder_assetDescription} #{msg.ValidationRequire}" />
                </h:panelGroup>
                <h:panelGroup rendered="#{zkbFePartOrderSparePartDetailController.selected.currentStep.equals('Requested')}" >
                    <label class="label">#{msg.zkbFePartOrder_assetQty}*</label>
                    <p:spinner  value="#{zkbFePartOrderSparePartDetailController.selectZkbFePartOrderAssetInfo.assetQty}" required="true"  min="1" max="1000"  />
                </h:panelGroup>
                <h:panelGroup rendered="#{!zkbFePartOrderSparePartDetailController.selected.currentStep.equals('Requested')}" >
                    <label class="label">#{msg.zkbFePartOrder_assetQty}*</label>
                    <p:spinner  value="#{zkbFePartOrderSparePartDetailController.selectZkbFePartOrderAssetInfo.assetQty}" required="true"  min="0" max="#{zkbFePartOrderSparePartDetailController.maxAssetQty}"  />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">备注</label>
                    <p:inputTextarea disabled="#{!zkbFePartOrderSparePartDetailController.hasEditRight('Requested')}"  value="#{zkbFePartOrderSparePartDetailController.selectZkbFePartOrderAssetInfo.comment}"  maxlength="100"/>
                </h:panelGroup>
                <h:panelGroup rendered="#{!zkbFePartOrderSparePartDetailController.selected.currentStep.equals('Requested')}">
                    <label class="label">修改数量备注*</label>
                    <p:inputText value="#{zkbFePartOrderSparePartDetailController.selectZkbFePartOrderAssetInfo.updateComment}" required="true" requiredMessage="修改数量备注 #{msg.ValidationRequire}" />
                </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{zkbFePartOrderSparePartDetailController.saveZkbFePartOrderAssetInfoTemp()}" update=":growl :zkbFePartOrderSparePartsEditForm:zkbFePartOrderAssetInfoList  zkbFePartOrderSparePartsEditForm:waitingAssignment  zkbFePartOrderSparePartsEditForm:thisDeductionMessage "
                 icon="ui-icon-check" oncomplete="PF('zkbFePartOrderAssetInfoEditDlg').hide()" />
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbFePartOrderAssetInfoEditDlg').hide()"/>
        </h:form>
    </p:dialog>
    
</ui:composition>
</html>
