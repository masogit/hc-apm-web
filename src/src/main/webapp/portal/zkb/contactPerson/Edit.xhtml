<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="zkbContactPersonEditForm">
            <p:fieldset legend="#{msg.zkbContactInfo}" rendered="#{not empty zkbContactPersonController.selected}">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContact_tenant}</label>
                        <p:outputLabel value="#{zkbContactPersonController.getTenantInfo(zkbContactPersonController.selected.tenantUID).name}"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContact_name}*</label>
                        <p:inputText id="name" value="#{zkbContactPersonController.selected.name}" required="true" requiredMessage="#{msg.zkbContact_name} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContact_phone}</label>
                        <p:inputText id="phone" value="#{zkbContactPersonController.selected.phone}" required="false" requiredMessage="#{msg.zkbContact_phone} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContact_email}</label>
                        <p:inputText id="email" value="#{zkbContactPersonController.selected.email}" required="false" requiredMessage="#{msg.zkbContact_email} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContact_position}*(“智康保管理员”为派工、备件订购联系人)</label>
                        <p:selectOneMenu id="position" value="#{zkbContactPersonController.selected.position}" required="true" requiredMessage="#{msg.zkbContact_position} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{fieldMsg.getFieldValueList('zkbContactPosition')}" var="v">
                                <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}"/>
                            </c:forEach>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContact_zipcode}</label>
                        <p:inputText id="zipcode" value="#{zkbContactPersonController.selected.zipcode}" required="false" requiredMessage="#{msg.zkbContact_zipcode} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContact_address}</label>
                        <p:inputText id="address" value="#{zkbContactPersonController.selected.address}" required="false" requiredMessage="#{msg.zkbContact_address} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContact_remark}</label>
                        <p:inputText id="remark" value="#{zkbContactPersonController.selected.remark}" required="false" requiredMessage="#{msg.zkbContact_remark} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                </p:panelGrid>

                <p:commandButton value="#{msg.save}" icon="ui-icon-check" validateClient="true" actionListener="#{zkbContactPersonController.save}" update=":growl :zkbContactPersonListForm :zkbContactPersonEditForm" style="float:left"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{zkbContactPersonController.cancel}" update=":growl :zkbContactPersonListForm :zkbContactPersonEditForm"/>
            </p:fieldset>
        </h:form>
    </div>
</ui:composition>

</html>
