<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="区域(Zone)管理"/><!--#{msg.zkbZoneMgt}-->
            </div>

            <div class="ui-g-12 card">
                <h:form id="zkbZoneListForm">
                    <p:dataTable id="datalist" value="#{zkbZoneController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbZoneController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" listener="#{zkbZoneController.prepareEdit}" update="deleteButton editButton :zkbZoneEditForm"/>
                        <p:ajax event="filter" listener="#{zkbZoneController.onFilter}" />

                        <p:column headerText="区域" filterBy="#{item.region}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.region}"/>
                        </p:column>

                        <p:column headerText="zone" filterBy="#{item.zone}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.zone}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" title="#{msg.Create}" actionListener="#{zkbZoneController.prepareCreate}" update=":zkbZoneEditDlg" oncomplete="PF('zkbZoneEditDialog').show()"/>
                            <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbZoneController.prepareEdit}" update=":zkbZoneEditDlg" oncomplete="PF('zkbZoneEditDialog').show()" disabled="#{empty zkbZoneController.selected.id}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbZoneController.deleteData}" update=":zkbZoneListForm" disabled="#{empty zkbZoneController.selected.id}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                            <p:commandButton id="importButton" ajax="false" title="课程导入" action="Import.xhtml" icon="ui-icon-arrowstop-1-n">

                            </p:commandButton>
                        </f:facet>

                    </p:dataTable>

                </h:form>

                <ui:include src="Edit.xhtml"/>
            </div>
        </div>
    </ui:define>


</ui:composition>
