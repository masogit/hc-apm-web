<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.zkbHistory_orderHistory}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form rendered="#{userContextService.zkbAdmin}">
                    <p:commandButton id="importButton"  value="#{msg.zkbHistory_orderHistoryImport}" title="#{msg.zkbHistory_orderHistoryImport}" action="#{zkbOrderHistoryController.importAction}"/>
                </h:form>
                <h:form id="searchForm">
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup rendered="#{userContextService.zkbAdmin}" >
                                <label class="label">#{msg.zkbHistory_agent}</label>
                                <p:selectOneMenu id="agent" value="#{zkbOrderHistoryController.tenantUid}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{zkbPartOrderController.tenantInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbHistory_dataType}</label>
                                <p:selectOneMenu id="assetGroup" value="#{zkbOrderHistoryController.dataType}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('orderHistoryDataType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbHistory_contractBeginningTime}</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" id="startDate" value="#{zkbOrderHistoryController.contractBeginningTime}"
                                            required="false" requiredMessage="#{msg.contractBeginningTime} #{msg.ValidationRequire}"
                                            showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbHistory_contractEndingTime}</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" id="endDate" value="#{zkbOrderHistoryController.contractEndingTime}"
                                            required="false" requiredMessage="#{msg.contractEndingTime} #{msg.ValidationRequire}"
                                            showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbHistory_region}</label>
                                <p:selectOneMenu id="region" value="#{zkbOrderHistoryController.region}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbHistory_region')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbHistory_contractNo}</label>
                                <p:inputText id="contractNo" value="#{zkbOrderHistoryController.contractNo}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbHistory_contractType}</label>
                                <p:selectOneMenu id="contractType" value="#{zkbOrderHistoryController.contractType}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbHistory_contractType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <p:commandButton value="#{msg.SearchResult}" actionListener="#{zkbOrderHistoryController.loadData}" icon="ui-icon-arrowthick-1-s" validateClient="false" update=":growl :zkbOrderHistoryListForm:datalist">
                            </p:commandButton>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:form>
                <h:form id="zkbOrderHistoryListForm">
                    <p:dataTable id="datalist" value="#{zkbOrderHistoryController.zkbOrderHistoryList}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbOrderHistoryController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:column width="150" headerText="#{msg.zkbHistory_dataType}" >
                            <h:outputText value="#{item.dataType}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_region}" >
                            <h:outputText value="#{item.region}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_agent}" >
                            <h:outputText value="#{item.agent}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_contractNo}" >
                            <h:outputText value="#{item.contractNo}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_contractType}" >
                            <h:outputText value="#{item.contractType}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_contractBeginningTime}" >
                            <h:outputText value="#{item.contractBeginningTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_contractEndingTime}" >
                            <h:outputText value="#{item.contractEndingTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_quantityIb}" >
                            <h:outputText value="#{item.quantityIb}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_labourQuantity}" >
                            <h:outputText value="#{item.labourQuantity}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_partsQuantity}" >
                            <h:outputText value="#{item.partsQuantity}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_probeQuantity}" >
                            <h:outputText value="#{item.probeQuantity}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_applyLimitCount}" >
                            <h:outputText value="#{item.applyLimitCount}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_normalLimitCount}" >
                            <h:outputText value="#{item.normalLimitCount}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_specialLimitCount}" >
                            <h:outputText value="#{item.specialLimitCount}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_highValueLimitCount}" >
                            <h:outputText value="#{item.highValueLimitCount}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_countQuantity}" >
                            <h:outputText value="#{item.countQuantity}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbFePartOrder_remark}" >
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_eventDate}" >
                            <h:outputText value="#{item.eventDate}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_type}" >
                            <h:outputText value="#{item.type}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_systemNo}" >
                            <h:outputText value="#{item.systemNo}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_faultDescription}" >
                            <h:outputText value="#{item.faultDescription}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_hospitalName}" >
                            <h:outputText value="#{item.hospitalName}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_machineType}" >
                            <h:outputText value="#{item.machineType}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_sparePartsNo}" >
                            <h:outputText value="#{item.sparePartsNo}"/>
                        </p:column>
                        <p:column width="150" rendered="#{userContextService.zkbAdmin}" headerText="#{msg.zkbHistory_sparePartsPrice}" >
                            <h:outputText value="#{item.sparePartsPrice}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_description}" >
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_orderNo}" >
                            <h:outputText value="#{item.orderNo}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_RSESup}" >
                            <h:outputText value="#{item.RSESup}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_quantity}" >
                            <h:outputText value="#{item.quantity}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_sr}" >
                            <h:outputText value="#{item.sr}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_act}" >
                            <h:outputText value="#{item.act}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_sparePartsReturn}" >
                            <h:outputText value="#{item.sparePartsReturn}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_comment}" >
                            <h:outputText value="#{item.comment}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_insuranceDescription}" >
                            <h:outputText value="#{item.insuranceDescription}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_probeType}" >
                            <h:outputText value="#{item.probeType}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_useStatus}" >
                            <h:outputText value="#{item.useStatus}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_callNo}" >
                            <h:outputText value="#{item.callNo}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_rowner}" >
                            <h:outputText value="#{item.rowner}"/>
                        </p:column>
                        <p:column width="150" headerText="#{msg.zkbHistory_ownerName}" >
                            <h:outputText value="#{item.ownerName}"/>
                        </p:column>E
                        <p:column width="150" headerText="#{msg.zkbHistory_status}" >
                            <h:outputText value="#{item.status}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="exportButton" ajax="false" title="#{msg.exportToXLS}" actionListener="#{zkbOrderHistoryController.exportAll}" icon="ui-icon-arrowthick-1-s">
                                <p:fileDownload value="#{zkbOrderHistoryController.exportFile}"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
