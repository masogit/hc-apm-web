<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="积分列表"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="zkbIntegralListForm">
                    <p:dataTable id="datalist" value="#{zkbIntegralController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbIntegralController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <c:if test="#{!userContextService.zkbUser}">
                            <p:ajax event="rowSelect" listener="#{zkbIntegralController.prepareEdit}" update="deleteButton :zkbIntegralEditForm"/>
                        </c:if>
                        <p:ajax event="filter" listener="#{zkbIntegralController.onFilter}" />

                        <p:column headerText="#{msg.zkbContact_tenant}" >
                            <h:outputText value="#{zkbIntegralController.getTenantInfo(item.tenantUID).name}"/>
                        </p:column>

                        <p:column headerText="总积分" filterBy="#{item.integralTotal}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.integralTotal}"/>
                        </p:column>

                        <p:column headerText="系数" filterBy="#{item.coefficient}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.coefficient}"/>
                        </p:column>

                        <p:column headerText="有效期" >
                            <h:outputText value="#{item.validityDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="备注" filterBy="#{item.modifyReason}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.modifyReason}"/>
                        </p:column>
                        <p:column headerText="操 作" exportable="false" >
                            <h:panelGroup>
                                <p:commandLink title="查询" update="zkbIntegralRecordQueryDlg" actionListener="#{zkbIntegralController.viewRecord(item.id)}" oncomplete="PF('zkbIntegralRecordQueryDlg').show()" >
                                    <p:graphicImage name="icons/find.png" style="width: 20px; height: 20px;"/>
                                </p:commandLink>
                            </h:panelGroup>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{zkbIntegralController.prepareCreate}" update=":zkbIntegralEditForm" rendered="#{!(userContextService.zkbUser)}"/>
                            <!--<p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbIntegralController.prepareEdit}" update=":zkbIntegralEditForm" disabled="#{empty zkbIntegralController.selected.id}"/>-->
                            <p:commandButton id="deleteButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbIntegralController.delete}" update=":zkbIntegralListForm :zkbIntegralEditForm" disabled="#{empty zkbIntegralController.selected.id}" rendered="#{!(userContextService.zkbUser)}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                            <p:commandButton id="exportButton" ajax="false" title="#{msg.exportToXLS}" actionListener="#{zkbIntegralController.exportAll}" icon="ui-icon-arrowstop-1-s">
                                <p:fileDownload value="#{zkbIntegralController.exportFile}"/>
                            </p:commandButton>
                        </f:facet>

                    </p:dataTable>

                </h:form>
                <ui:include src="Edit.xhtml"/>
                <ui:include src="RecordList.xhtml"/>
            </div>
        </div>
    </ui:define>


</ui:composition>
