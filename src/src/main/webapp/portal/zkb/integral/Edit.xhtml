<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="zkbIntegralEditForm">
            <p:fieldset legend="积分详情" rendered="#{not empty zkbIntegralController.selected}">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContact_tenant}</label>
                        <p:selectOneMenu style="transform: scale(1.2)"  value="#{zkbIntegralController.selected.tenantUID}" required="true" requiredMessage="租户 #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{zkbIntegralController.tenantInfoList}" var="v">
                                <f:selectItem itemLabel="#{v.name}" itemValue="#{v.uid}"/>
                            </c:forEach>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">总积分*</label>
                        <p:spinner id="integralTotal" value="#{zkbIntegralController.selected.integralTotal}" min="-1000" max="10000" required="true" requiredMessage="总积分 #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">系数*</label>
                        <p:spinner id="coefficient" value="#{zkbIntegralController.selected.coefficient}" min="-1000" max="10000" required="true" requiredMessage="系数 #{msg.ValidationRequire}" />

                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">有效期</label>
                        <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd" value="#{zkbIntegralController.selected.validityDate}" showOn="button" Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup  >
                        <label class="label" >修改原因</label>
                        <p:inputTextarea  value="#{zkbIntegralController.selected.modifyReason}"  rows="2"  >
                        </p:inputTextarea>
                    </h:panelGroup>

                </p:panelGrid>

                <p:commandButton value="#{msg.save}" icon="ui-icon-check" validateClient="true" actionListener="#{zkbIntegralController.save}" update=":growl :zkbIntegralListForm :zkbIntegralEditForm" style="float:left"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{zkbIntegralController.cancel}" update=":growl :zkbIntegralListForm :zkbIntegralEditForm"/>
            </p:fieldset>
        </h:form>
    </div>
</ui:composition>

</html>
