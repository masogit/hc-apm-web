<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.zkbContractCourseSchedule_name}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="zkbCourseScheduleListForm">
                    <p:dataTable id="datalist" value="#{zkbCourseScheduleController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbCourseScheduleController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="rowSelect" listener="#{zkbCourseScheduleController.prepareEdit}" update="editButton deleteButton"/>
                        <p:ajax event="filter" listener="#{zkbCourseScheduleController.onFilter}" />
                        <p:column headerText="#{msg.zkbContractCourseSchedule_cid}">
                            <h:outputText value="#{item.cid}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_cname}">
                            <h:outputText value="#{item.cname}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_modality}">
                            <h:outputText value="#{item.modality}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_startDate}">
                            <h:outputText value="#{item.startDate}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_endDate}">
                            <h:outputText value="#{item.endDate}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_trainingDays}">
                            <h:outputText value="#{item.trainingDays}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_instructor}">
                            <h:outputText value="#{item.instructor}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_audience}">
                            <h:outputText value="#{item.audience}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_location}">
                            <h:outputText value="#{item.location}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_studentClass}">
                            <h:outputText value="#{item.studentClass}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_batchNo}">
                            <h:outputText value="#{item.batchNo}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_valid}">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbFePartOrder_yesOrNo',item.valid)}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_deductCount}">
                            <h:outputText value="#{item.deductCount}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContractCourseSchedule_type}">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbContractCourseSchedule_type',item.type)}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" rendered="#{!zkbCourseScheduleController.tenant}"  title="#{msg.Create}" update=":zkbCourseScheduleEditGroup :zkbCourseScheduleEditForm" action="#{zkbCourseScheduleController.prepareCreate}" />
                            <p:commandButton id="editButton" icon="ui-icon-pencil"  title="#{msg.Edit}" update=":zkbCourseScheduleEditGroup" action="#{zkbCourseScheduleController.prepareEdit}" disabled="#{empty zkbCourseScheduleController.selected.id}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close"  rendered="#{!zkbCourseScheduleController.tenant}"  title="#{msg.Delete}" update=":zkbCourseScheduleListForm :zkbCourseScheduleEditGroup" actionListener="#{zkbCourseScheduleController.delete}"  disabled="#{(empty zkbCourseScheduleController.selected.id) or !zkbCourseScheduleController.hasEditRight()}" />
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="Edit.xhtml"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
