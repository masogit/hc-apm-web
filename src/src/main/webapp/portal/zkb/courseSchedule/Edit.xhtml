<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <h:panelGroup id="zkbCourseScheduleEditGroup" >
    <h:form id="zkbCourseScheduleEditForm" rendered="#{zkbCourseScheduleController.selected != null}">
        <p:fieldset id="zkbFiledSet" legend="#{zkbCourseScheduleController.CRUDActionName}" style="margin-bottom:20px">
            <h:panelGroup>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_cid}*</label>
                        <p:selectOneMenu  value="#{zkbCourseScheduleController.selected.zkbCourseId}"  required="true" requiredMessage="#{msg.zkbContractCourseSchedule_cid} #{msg.ValidationRequire}">
                            <p:ajax update="zkbCourseScheduleEditForm" listener="#{zkbCourseScheduleController.changeCid}" event="change" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{zkbCourseScheduleController.allZkbCourse}" var="entry" itemLabel="#{entry.cid}" itemValue="#{entry.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_cname}</label>
                        <p:inputText disabled="true" value="#{zkbCourseScheduleController.selected.cname}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_modality}</label>
                        <p:inputText disabled="true" value="#{zkbCourseScheduleController.selected.modality}"  required="true" requiredMessage="#{msg.zkbContractCourseSchedule_modality} #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_startDate}*</label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM-dd"  value="#{zkbCourseScheduleController.selected.startDate}"
                                    required="true" requiredMessage="#{msg.zkbContractCourseSchedule_startDate} #{msg.ValidationRequire}"
                                    showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_endDate}*</label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM-dd"  value="#{zkbCourseScheduleController.selected.endDate}"
                                    required="true" requiredMessage="#{msg.zkbContractCourseSchedule_endDate} #{msg.ValidationRequire}"
                                    showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_trainStartDate}*</label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM-dd"  value="#{zkbCourseScheduleController.selected.trainStartDate}"
                                    required="true" requiredMessage="#{msg.zkbContractCourseSchedule_trainStartDate} #{msg.ValidationRequire}"
                                    showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_trainEndDate}*</label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM-dd"  value="#{zkbCourseScheduleController.selected.trainEndDate}"
                                    required="true" requiredMessage="#{msg.zkbContractCourseSchedule_trainEndDate} #{msg.ValidationRequire}"
                                    showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_trainingDays}*</label>
                        <p:inputNumber  maxValue="100" minValue="0" decimalPlaces="0" value="#{zkbCourseScheduleController.selected.trainingDays}" required="true" requiredMessage="#{msg.zkbContractCourseSchedule_trainingDays} #{msg.ValidationRequire}">
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_instructor}*</label>
                        <p:inputText  value="#{zkbCourseScheduleController.selected.instructor}"  required="true" requiredMessage="#{msg.zkbContractCourseSchedule_instructor} #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_audience}*</label>
                        <p:inputText  value="#{zkbCourseScheduleController.selected.audience}"  required="true" requiredMessage="#{msg.zkbContractCourseSchedule_audience} #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_location}*</label>
                        <p:inputText  value="#{zkbCourseScheduleController.selected.location}"  required="true" requiredMessage="#{msg.zkbContractCourseSchedule_location} #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_studentClass}*</label>
                        <p:inputNumber  minValue="0" decimalPlaces="1" value="#{zkbCourseScheduleController.selected.studentClass}" required="true" requiredMessage="#{msg.zkbContractCourseSchedule_studentClass} #{msg.ValidationRequire}">
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_batchNo}*</label>
                        <p:inputText   value="#{zkbCourseScheduleController.selected.batchNo}"  required="true" requiredMessage="#{msg.zkbContractCourseSchedule_batchNo}#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup rendered="#{!empty zkbCourseScheduleController.selected.id}">
                        <label class="label">#{msg.zkbContractCourseSchedule_valid}*</label>
                        <p:selectOneMenu  value="#{zkbCourseScheduleController.selected.valid}" required="true" requiredMessage="#{msg.zkbContractCourseSchedule_valid} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_yesOrNo')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_deductCount}*</label>
                        <p:inputNumber  minValue="0" decimalPlaces="1" value="#{zkbCourseScheduleController.selected.deductCount}" required="true" requiredMessage="#{msg.zkbContractCourseSchedule_deductCount} #{msg.ValidationRequire}">
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbContractCourseSchedule_type}*</label>
                        <p:selectOneMenu  value="#{zkbCourseScheduleController.selected.type}" required="true" requiredMessage="#{msg.zkbContractCourseSchedule_type} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractCourseSchedule_type')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
            </h:panelGroup>
        </p:fieldset>
        <h:panelGroup>
            <p:commandButton  validateClient="true" actionListener="#{zkbCourseScheduleController.save}" update=":growl :zkbCourseScheduleListForm :zkbCourseScheduleEditGroup" value="#{msg.Save}" icon="ui-icon-check"/>
            <p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-arrow-back" update=":growl :zkbCourseScheduleEditGroup" actionListener="#{zkbCourseScheduleController.cancel}" />
        </h:panelGroup>
    </h:form>
    </h:panelGroup>
</ui:composition>
</html>
