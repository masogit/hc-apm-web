<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="part_order_user_config"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="zkbPartOrderUserConfigListForm">
                    <p:dataTable id="datalist" value="#{zkbPartOrderUserConfigController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbPartOrderUserConfigController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
<!--                        <p:ajax event="rowSelect" listener="#{zkbFileDirectoryController.prepareEdit}" update="deleteButton editButton"/>-->
                        <p:ajax event="filter" listener="#{zkbPartOrderUserConfigController.onFilter}" />
                        <p:column headerText="账号" filterBy="#{item.loginName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.loginName}"/>
                        </p:column>
                        <p:column headerText="名称" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="邮箱" filterBy="#{item.email}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.email}"/>
                        </p:column>
                        <p:column headerText="电话" filterBy="#{item.phone}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.phone}"/>
                        </p:column>
                        <p:column headerText="用户sso" filterBy="#{item.sso}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.sso}"/>
                        </p:column>
                        <p:column headerText="区域" filterBy="#{item.region}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.region}"/>
                        </p:column>
                        <p:column headerText="类型" filterBy="#{item.configType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.configType}"/>
                        </p:column>
                        <p:column headerText="资产类型" filterBy="#{item.assetType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetType}"/>
                        </p:column>
                        <p:column headerText="subConfigType" filterBy="#{item.subConfigType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.subConfigType}"/>
                        </p:column>
                        <p:column headerText="备注" filterBy="#{item.remark}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <p:column headerText="租户" filterBy="#{item.tenantUID}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.tenantUID}"/>
                        </p:column>
                        <p:column headerText="orderType" filterBy="#{item.orderType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.orderType}"/>
                        </p:column>
                        <p:column headerText="isVacation" filterBy="#{item.isVacation}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.isVacation}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
<!--                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{zkbFileDirectoryController.prepareCreate}" update=":dialogDirectory :dialogDirectoryEditForm" oncomplete="PF('dialogDirectory').show()"/>-->
<!--                            <p:commandButton id="editButton" actionListener="#{zkbFileDirectoryController.prepareEdit}" icon="ui-icon-pencil" title="#{msg.Edit}" update=":dialogDirectory :dialogDirectoryEditForm" oncomplete="PF('dialogDirectory').show()" disabled="#{empty zkbFileDirectoryController.selected.id}"/>-->
<!--                            <p:commandButton id="deleteButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbFileDirectoryController.delete}" update=":zkbFileDirectoryListForm" disabled="#{empty zkbFileDirectoryController.selected.id}">-->
<!--                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>-->
<!--                            </p:commandButton>-->
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
