<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="USER CONFIG配置"/>
            </div>
            <div class="ui-g-12 card">
                <h:form rendered="#{userContextService.zkbAdmin}">
                    <p:commandButton id="importButton" icon="ui-icon-extlink" value="#{msg.zkbKeyUserConfig_userConfigImport}" title="#{msg.zkbKeyUserConfig_userConfigImport}" action="#{zkbPartOrderUserConfigController.importAction}"/>
                </h:form>
                <h:form id="zkbPartOrderUserConfigListForm">
                    <p:dataTable id="datalist" value="#{zkbPartOrderUserConfigController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbPartOrderUserConfigController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="rowSelect" listener="#{zkbPartOrderUserConfigController.prepareEdit}" update="deleteButton editButton"/>
                        <p:ajax event="filter" listener="#{zkbPartOrderUserConfigController.onFilter}" />
                        <p:column headerText="APM用户名" filterBy="#{item.loginName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.loginName}"/>
                        </p:column>
                        <p:column headerText="名称" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="邮箱" filterBy="#{item.email}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.email}"/>
                        </p:column>
                        <p:column headerText="电话" filterBy="#{item.phone}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.phone}"/>
                        </p:column>
                        <p:column headerText="用户sso" filterBy="#{item.sso}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.sso}"/>
                        </p:column>
                        <p:column headerText="区域" filterBy="#{item.region}" filterMatchMode="LIKE">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbContractRegion', item.region)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="类型" filterBy="#{item.configType}" filterMatchMode="LIKE">
                            <h:outputText  value="#{item.configTypeName}" />
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoStepsRole')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="资产类型" filterBy="#{item.assetType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetType}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItem itemLabel="US" itemValue="US"/>
                                    <f:selectItem itemLabel="CT" itemValue="CT"/>
                                    <f:selectItem itemLabel="XR" itemValue="XR"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="UsBackUp" >
                            <h:outputText  value="#{item.usBackUpName}" />
                        </p:column>
                        <p:column headerText="备注" filterBy="#{item.remark}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <p:column headerText="订单类型" filterBy="#{item.orderType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.orderType}"/>
                            <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItem itemLabel="Probe" itemValue="Probe"/>
                            </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="是否休假" filterBy="#{item.isVacation}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.vacationText}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItem itemLabel="是" itemValue="t"/>
                                    <f:selectItem itemLabel="否" itemValue="f"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{zkbPartOrderUserConfigController.prepareCreate}" update=":zkbPartOrderUserConfigEditForm" />
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray batch-terminated" title="#{msg.Edit}" actionListener="#{zkbPartOrderUserConfigController.prepareEdit}"  update=":zkbPartOrderUserConfigEditForm" disabled="#{empty zkbPartOrderUserConfigController.selected.id}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-delete" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchDelete}" actionListener="#{zkbPartOrderUserConfigController.delete}" update=":zkbPartOrderUserConfigListForm :zkbPartOrderUserConfigEditForm :growl" disabled="#{empty zkbPartOrderUserConfigController.selected.id}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.IsConfirmDeleRecord}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="Edit.xhtml"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
