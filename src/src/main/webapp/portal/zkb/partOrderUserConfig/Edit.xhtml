<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>

    <h:form id="zkbPartOrderUserConfigEditForm">
        <p:fieldset id="zkbFiledSet" legend="#{zkbPartOrderUserConfigController.CRUDActionName}" style="margin-bottom:20px" rendered="#{zkbPartOrderUserConfigController.selected != null}">
            <h:panelGroup>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">账号*</label>
                        <p:inputText id="loginName" value="#{zkbPartOrderUserConfigController.selected.loginName}"  required="true" requiredMessage="账号#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">名称</label>
                        <p:inputText id="name" value="#{zkbPartOrderUserConfigController.selected.name}"  required="false" requiredMessage="名称#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">邮箱*</label>
                        <p:inputText id="email" value="#{zkbPartOrderUserConfigController.selected.email}"  required="true" requiredMessage="邮箱#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">电话*</label>
                        <p:inputText id="phone" value="#{zkbPartOrderUserConfigController.selected.phone}"  required="true" requiredMessage="电话#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">用户sso</label>
                        <p:inputText id="sso" value="#{zkbPartOrderUserConfigController.selected.sso}"  required="false" requiredMessage="用户sso#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">区域</label>
                        <p:selectOneMenu id="region" value="#{zkbPartOrderUserConfigController.selected.region}" required="false" requiredMessage="区域#{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">类型*</label>
                        <p:selectOneMenu id="configType" value="#{zkbPartOrderUserConfigController.selected.configType}" required="true" requiredMessage="类型#{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItem itemLabel="OrderCommon" itemValue="OrderCommon"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoSteps')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">资产类型</label>
                        <p:selectOneMenu id="assetType" value="#{zkbPartOrderUserConfigController.selected.assetType}" required="false" requiredMessage="资产类型#{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItem itemLabel="CS" itemValue="CS"/>
                            <f:selectItem itemLabel="CT" itemValue="CT"/>
                            <f:selectItem itemLabel="XR" itemValue="XR"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">subConfigType</label>
                        <p:inputText id="subConfigType" value="#{zkbPartOrderUserConfigController.selected.subConfigType}"  required="false" requiredMessage="subConfigType#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputText id="remark" value="#{zkbPartOrderUserConfigController.selected.remark}"  required="false" requiredMessage="备注#{msg.ValidationRequire}" />
                    </h:panelGroup>
<!--                    <h:panelGroup>-->
<!--                        <label class="label">租户</label>-->
<!--                        <p:inputText id="tenantUID" value="#{zkbPartOrderUserConfigController.selected.tenantUID}"  required="false" requiredMessage="租户#{msg.ValidationRequire}" />-->
<!--                    </h:panelGroup>-->
                    <h:panelGroup>
                        <label class="label">orderType</label>
                        <p:inputText id="orderType" value="#{zkbPartOrderUserConfigController.selected.orderType}"  required="false" requiredMessage="orderType#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">isVacation</label>
                        <p:selectOneMenu id="isVacation" value="#{zkbPartOrderUserConfigController.selected.isVacation}" required="false" requiredMessage="isVacation#{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItem itemLabel="是" itemValue="t"/>
                            <f:selectItem itemLabel="否" itemValue="f"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{zkbPartOrderUserConfigController.save}" update=":zkbPartOrderUserConfigListForm :zkbPartOrderUserConfigEditForm :growl" value="#{msg.Save}" icon="ui-icon-check"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{zkbPartOrderUserConfigController.cancel}" update=":zkbPartOrderUserConfigEditForm :growl"/>
                </h:panelGroup>

            </h:panelGroup>
        </p:fieldset>
    </h:form>

</ui:composition>
</html>
