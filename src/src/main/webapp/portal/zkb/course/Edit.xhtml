<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="zkbCourseEditDlg" widgetVar="zkbCourseEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{zkbCourseController.CRUDActionName} 课程" height="370">
        <h:form id="zkbCourseEditForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{zkbCourseController.selected != null}">

                <h:panelGroup>
                    <label class="label">课程ID*</label>
                    <p:inputText id="cid" value="#{zkbCourseController.selected.cid}" required="true" requiredMessage="#{'课程ID'} #{msg.ValidationRequire}" disabled="#{not empty zkbCourseController.selected.cid}"/>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">课程名称*</label>
                    <p:inputText id="cname" value="#{zkbCourseController.selected.cname}" required="true" requiredMessage="#{'课程名称'} #{msg.ValidationRequire}" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">modality*</label>
                    <p:inputText id="modality" value="#{zkbCourseController.selected.modality}" required="true" requiredMessage="#{'modality'} #{msg.ValidationRequire}" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">课程描述</label>
                    <p:inputText id="description" value="#{zkbCourseController.selected.description}"  />
                </h:panelGroup>

            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" action="#{zkbCourseController.saveCourse}" update=":growl" icon="ui-icon-check" />
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbCourseEditDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
