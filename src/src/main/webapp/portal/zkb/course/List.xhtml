<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="课程管理"/><!--#{msg.ZKBCourseMgt}-->
            </div>

            <div class="ui-g-12 card">
                <h:form id="zkbCourseListForm">


                   <p:dataTable id="datalist" value="#{zkbCourseController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbCourseController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" listener="#{zkbCourseController.prepareEdit}" update="deleteButton editButton :zkbCourseEditForm"/>
                        <p:ajax event="filter" listener="#{zkbCourseController.onFilter}" />

                        <p:column headerText="课程ID" filterBy="#{item.cid}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.cid}"/>
                        </p:column>

                        <p:column headerText="课程名称" filterBy="#{item.cname}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.cname}"/>
                        </p:column>

                       <p:column headerText="modality" filterBy="#{item.modality}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.modality}"/>
                       </p:column>

                       <p:column headerText="课程描述" >
                           <h:outputText value="#{item.description}"/>
                       </p:column>

                       <f:facet name="{Toolbar}">
                           <p:commandButton id="createButton" icon="ui-icon-plus" title="#{msg.Create}" actionListener="#{zkbCourseController.prepareCreate}" update=":zkbCourseEditDlg" oncomplete="PF('zkbCourseEditDialog').show()"/>
                           <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbCourseController.prepareEdit}" update=":zkbCourseEditDlg" oncomplete="PF('zkbCourseEditDialog').show()" disabled="#{empty zkbCourseController.selected.id}"/>
                           <p:commandButton id="deleteButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbCourseController.deleteCourse}" update=":zkbCourseListForm :zkbCourseEditForm" disabled="#{empty zkbCourseController.selected.id}">
                               <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                           </p:commandButton>
                           <p:commandButton id="exportButton" ajax="false" title="#{msg.exportToXLS}" actionListener="#{zkbCourseController.exportAll}" icon="ui-icon-arrowstop-1-s">
                               <p:fileDownload value="#{zkbCourseController.exportFile}"/>
                           </p:commandButton>
                           <p:commandButton id="importButton" ajax="false" title="课程导入" action="Import.xhtml" icon="ui-icon-arrowstop-1-n">

                           </p:commandButton>
                       </f:facet>

                    </p:dataTable>

                </h:form>

                <ui:include src="Edit.xhtml"/>
            </div>
        </div>
    </ui:define>


</ui:composition>
