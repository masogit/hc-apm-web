<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{zkbPartOrderEditController.CRUDActionName} #{msg.zkbPartOrder}"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbHeadEditForm">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">订单类型*</label>
                        <p:selectOneMenu id="orderType" value="#{zkbPartOrderEditController.orderType}" >
                            <p:ajax event="change" update="zkbPartOrderEditForm zkbHeadEditForm" listener="#{zkbPartOrderEditController.orderTypeChange}" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPartOrderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup id="artificialTypeGroup" rendered="#{zkbPartOrderEditController.orderType eq 'Artificial'}">
                        <label class="label">机型*</label>
                        <p:selectOneMenu id="artificialType" value="#{zkbPartOrderEditController.artificialType}" required="true" requiredMessage="#{msg.zkbPartOrder_artificialType} #{msg.ValidationRequire}">
                            <p:ajax event="change" update="zkbPartOrderEditForm zkbHeadEditForm" listener="#{zkbPartOrderEditController.orderTypeChange}"  />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoArtificialType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
            </h:form>
        </div>
        <div class="ui-g-12 card">
            <h:form id="zkbwkEditForm">
                <p:messages id="messages" showDetail="true" closable="false" autoUpdate="true"></p:messages>
                <p:fieldset id="zkbWorkFlowFieldset" legend="工单信息" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">设备sysID</label>
                            <p:inputText id="qrCode" value="#{zkbPartOrderEditController.queryWorkFlow.assetInfo.systemId}" maxlength="100" required="false"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">报修单号</label>
                            <p:inputText id="assetName" value="#{zkbPartOrderEditController.queryWorkFlow.serviceRequest.srNum}" maxlength="100" required="false"/>
                        </h:panelGroup>
                        <p:commandButton validateClient="false"  actionListener="#{zkbPartOrderEditController.getQueryWorkFlowList()}" value="#{msg.Search}" update="zkbwkEditForm"/>
                    </p:panelGrid>
                    <p:dataTable id="zkbWkDatalist" value="#{zkbPartOrderEditController.v2_listHashMap}" var="item"
                                 widgetVar="zkbWkDatalist" selectionMode="single" selection="#{zkbPartOrderEditController.selectedWorkFlow}"
                                 lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                        <p:ajax event="rowSelect"  listener="#{zkbPartOrderEditController.workFlowSelected}" update="zkbContractDatalist zkbPartOrderEditForm zkbwkEditForm"/>

                        <p:column headerText="设备名称">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="sys ID">
                            <h:outputText value="#{item.systemId}"/>
                        </p:column>
                        <p:column headerText="报修单号">
                            <h:outputText value="#{item.srNum}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>

            </h:form>
            <p:fieldset id="zkbContractFieldset" legend="合同信息" >
                <p:dataTable id="zkbContractDatalist" value="#{zkbPartOrderEditController.contractList}" var="item"
                             widgetVar="zkbWkDatalist" selectionMode="single" disabledSelection="true"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                    <!--<p:ajax event="rowSelect" update="" listener="#{zkbPartOrderEditController.workFlowSelected}" />-->

                    <p:column headerText="#{msg.zkbContact_tenant}">
                        <h:outputText value="#{zkbContractController.getTenantInfo(item.tenantUID).name}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractNo}" >
                        <h:outputText value="#{item.contractNo}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_region}">
                        <h:outputText value="#{item.region}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractType}">
                        <h:outputText value="#{item.contractType}"/>
                    </p:column>

                    <p:column headerText="#{msg.zkbContract_ibNumber}">
                        <h:outputText value="#{item.ibNumber}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_spareQuota}">
                        <h:outputText value="#{item.spareQuota}"/>
                    </p:column>
                    <p:column headerText="探头任意剩余名额" >
                        <h:outputText value="#{item.probeQuota}"/>
                    </p:column>
                    <p:column headerText="探头普通剩余名额" >
                        <h:outputText value="#{item.probeQuotaNormal}"/>
                    </p:column>
                    <p:column headerText="探头特殊剩余名额" >
                        <h:outputText value="#{item.probeQuotaSpecial}"/>
                    </p:column>
                    <!--<p:column headerText="探头高值剩余名额" >
                        <h:outputText value="#{item.probeQuotaHigh}"/>
                    </p:column>-->
                    <p:column headerText="#{msg.zkbContract_geArtificialSupportTimes}" >
                        <h:outputText value="#{item.geArtificialSupportTimes}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_spareArtificail}">
                        <h:outputText value="#{item.spareArtificail}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_startDate}">
                        <h:outputText value="#{item.startDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_endDate}">
                        <h:outputText value="#{item.endDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <f:facet name="{Toolbar}">
                    </f:facet>
                </p:dataTable>
            </p:fieldset>
        </div>

        <div class="ui-g-12 card" >
            <h:form id="zkbPartOrderEditForm" >
                <p:fieldset id="zkbPartOrderFieldset" legend="额度信息" rendered="#{zkbPartOrderEditController.showPartOrder}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">申请人*</label>
                            <p:inputText id="requestUser" value="#{zkbPartOrderEditController.selected.requestUser}" disabled="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人电话*</label>
                            <p:inputText id="requestPhone" value="#{zkbPartOrderEditController.selected.requestPhone}" required="true" requiredMessage="#{msg.zkbPartOrder_requestPhone} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间*</label>
                            <p:calendar timeZone="GMT+8"  id="requestDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbPartOrderEditController.selected.requestDate}" required="true" requiredMessage="#{msg.zkbPartOrder_requestDate} #{msg.ValidationRequire}" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>

                       <!-- <h:panelGroup rendered="#{!(zkbPartOrderEditController.orderType eq 'Artificial')}">-->
                        <h:panelGroup>
                            <h:panelGroup rendered="#{zkbPartOrderEditController.orderType eq 'Parts' and zkbPartOrderEditController.assetInfo.assetGroup eq 1}">
                                <label class="label">设备类型（DI）*</label>
                                <p:selectOneMenu id="assetTypeDi" value="#{zkbPartOrderEditController.selected.assetTypeDi}" required="true" requiredMessage="#设备类型（DI） #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItem itemLabel="CT" itemValue="CT"/>
                                    <f:selectItem itemLabel="XR" itemValue="XR"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{zkbPartOrderEditController.orderType eq 'Artificial' and !(zkbPartOrderEditController.artificialType eq '2')}">
                            <label class="label">是否使用积分抵扣*</label>
                            <p:selectOneMenu value="#{zkbPartOrderEditController.selected.scoreFlag}" required="true" requiredMessage="是否使用积分抵扣 #{msg.ValidationRequire}" disabled="#{zkbPartOrderEditController.currentScoreFlag}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="是" itemValue="t"/>
                                <f:selectItem itemLabel="否" itemValue="f"/>
                            </p:selectOneMenu>
                            <p:outputLabel id="cscore" value="#{zkbPartOrderEditController.currentScoreText}" disabled="true"  style="margin-left: 10px;color: red;font-size: larger"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.orderType eq 'Parts' and zkbPartOrderEditController.assetInfo.assetGroup eq 2 }">
                            <label class="label">机型*</label>
                            <p:selectOneMenu value="#{zkbPartOrderEditController.selected.artificialType}" required="true" disabled="true" requiredMessage="#{msg.zkbPartOrder_artificialType} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="超声高端机" itemValue="2"/>
                                <f:selectItem itemLabel="超声低端机" itemValue="3"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.orderType eq 'Probe' and zkbPartOrderEditController.selectedContract.quotaDeductType != null and zkbPartOrderEditController.selectedContract.quotaDeductType eq 'New'}">
                            <label class="label">扣除名额类型*</label>
                            <p:selectOneMenu value="#{zkbPartOrderEditController.selected.probeQuotaType}" required="true" requiredMessage="扣除名额类型 #{msg.ValidationRequire}">
                                <p:ajax event="change" update="catModelGrid valueTypeGroup" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ZkbPoProbeQuotaType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.orderType eq 'Probe' and zkbPartOrderEditController.selectedContract.quotaDeductType != null and zkbPartOrderEditController.selectedContract.quotaDeductType eq 'Old'}">
                            <label class="label">是否高值探头*</label>
                            <p:selectOneMenu value="#{zkbPartOrderEditController.selected.highCatFlag}" required="true" requiredMessage="是否高值探头 #{msg.ValidationRequire}">
                                <p:ajax event="change" update="catModelGrid valueTypeGroup" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="是" itemValue="t"/>
                                <f:selectItem itemLabel="否" itemValue="f"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_region}*</label>
                            <p:selectOneMenu id="region" value="#{zkbPartOrderEditController.selected.region}" required="true" requiredMessage="#{msg.zkbContract_region} #{msg.ValidationRequire}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                       <!-- <h:panelGroup>
                            <label class="label">订单日期*</label>
                            <p:calendar timeZone="GMT+8"  id="startDate" pattern="yyyy/MM/dd" value="#{zkbPartOrderEditController.selected.partOrderDate}" required="true" requiredMessage="#{msg.zkbPartOrder_partOrderDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>-->
                        <h:panelGroup>
                            <label class="label">医院名称*</label>
                            <p:inputTextarea id="hospitalName" value="#{zkbPartOrderEditController.selected.hospitalName}"  required="true" requiredMessage="#{msg.zkbPartOrder_hospitalName} #{msg.ValidationRequire}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人姓名*</label>
                            <p:inputText id="hospitalRepairer" value="#{zkbPartOrderEditController.selected.hospitalRepairer}" required="true" requiredMessage="#{msg.zkbPartOrder_hospitalRepairer} #{msg.ValidationRequire}" disabled="#{!(empty zkbPartOrderEditController.selected.hospitalRepairer)}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人电话*</label>
                            <p:inputText id="hospitalRepairerPhone" value="#{zkbPartOrderEditController.selected.hospitalRepairerPhone}" required="true" requiredMessage="#{msg.zkbPartOrder_hospitalRepairerPhone} #{msg.ValidationRequire}" disabled="#{!(empty zkbPartOrderEditController.selected.hospitalRepairer)}"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderEditController.orderType eq 'Artificial')}">
                            <label class="label">订单标注*</label>
                            <p:selectOneMenu id="orderAnnotation" value="#{zkbPartOrderEditController.selected.orderAnnotation}" required="true" requiredMessage="#{msg.zkbPartOrder_orderAnnotation} #{msg.ValidationRequire}">
                                <p:ajax update="problemOrderNumberGrid" listener="#{zkbPartOrderEditController.orderAnnotationChange}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <!--<f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoOrderAnnotationType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>-->
                                <f:selectItem itemLabel="常规订单" itemValue="NormalOrder"/>
                                <f:selectItem itemLabel="DOA" itemValue="DOA"/>
                                <f:selectItem itemLabel="Wrong Part" itemValue="Wrong Part"/>
                                <f:selectItem itemLabel="Short Life" itemValue="Short Life"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="problemOrderNumberGrid" rendered="#{!(zkbPartOrderEditController.orderType eq 'Artificial')}">
                            <h:panelGroup id="problemOrderNumberGroup" rendered="#{!(zkbPartOrderEditController.showProblemOrderNumber)}" style="text-align: left">
                                <label class="label">发生问题的order number*</label>
                                <p:inputText id="problemOrderNumber" value="#{zkbPartOrderEditController.selected.problemOrderNumber}"  required="true" requiredMessage="#{msg.zkbPartOrder_problemOrderNumber} #{msg.ValidationRequire}" />
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">是否为紧急订单*</label>
                            <p:selectOneMenu id="urgentOrder" value="#{zkbPartOrderEditController.selected.urgentOrder}" required="true" requiredMessage="#{msg.zkbPartOrder_urgentOrder} #{msg.ValidationRequire}">
                                <p:ajax event="change" update="urgencyReasonsGrid" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="紧急" itemValue="t"/>
                                <f:selectItem itemLabel="不紧急" itemValue="f"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="urgencyReasonsGrid" columns="1" layout="grid" styleClass="ui-panelgrid-blank" >
                            <h:panelGroup id="urgencyReasonsGroup" rendered="#{(zkbPartOrderEditController.selected.urgentOrder eq 't')}" style="text-align: left">
                                <label class="label">订单紧急的原因*</label>
                                <p:selectOneMenu id="urgencyReasons" value="#{zkbPartOrderEditController.selected.urgencyReasons}" required="true" requiredMessage="#{msg.zkbPartOrder_urgencyReasons} #{msg.ValidationRequire}" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbUrgentReasonType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup>
                            <c:choose>
                                <c:when test="#{zkbPartOrderEditController.orderType eq 'Probe'}">
                                    <label class="label">订单名额*</label>
                                </c:when>
                                <c:otherwise>
                                    <label class="label">订单数量*</label>
                                </c:otherwise>
                            </c:choose>
                            <p:inputText id="qty" value="#{zkbPartOrderEditController.selected.qty}" required="true"  requiredMessage="#{msg.zkbPartOrder_qty} #{msg.ValidationRequire}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">剩余数量</label>
                            <p:inputText id="remainQty" value="#{zkbPartOrderEditController.selected.remainQty}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderEditController.orderType eq 'Artificial')}">
                            <label class="label">收货人*</label>
                            <p:inputText id="receiver" value="#{zkbPartOrderEditController.selected.receiver}" required="true" requiredMessage="#{msg.zkbPartOrder_receiver} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderEditController.orderType eq 'Artificial')}">
                            <label class="label">收货人电话*</label>
                            <p:inputText id="receiverPhone" value="#{zkbPartOrderEditController.selected.receiverPhone}"  required="true" requiredMessage="#{msg.zkbPartOrder_receiverPhone} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderEditController.orderType eq 'Artificial')}">
                            <label class="label">收货地址*</label>
                            <p:inputTextarea id="receiverAddress" value="#{zkbPartOrderEditController.selected.receiverAddress}" required="true" requiredMessage="#{msg.zkbPartOrder_receiverAddress} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.orderType eq 'Artificial'}">
                            <label class="label">ZKB工程师姓名*</label>
                            <p:inputText id="zkbEngineerName" value="#{zkbPartOrderEditController.selected.zkbEngineerName}" required="true"  requiredMessage="ZKB工程师姓名 #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.orderType eq 'Artificial'}">
                            <label class="label">ZKB工程师电话*</label>
                            <p:inputText id="zkbEngineerPhone" value="#{zkbPartOrderEditController.selected.zkbEngineerPhone}" required="true"  requiredMessage="ZKB工程师电话 #{msg.ValidationRequire}" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputTextarea value="#{zkbPartOrderEditController.selected.remark}" maxlength="255" />
                        </h:panelGroup>
                        <h:panelGroup></h:panelGroup>
                        <h:panelGroup></h:panelGroup>
                        <h:panelGroup>
                            <label class="label">产品型号*</label>
                            <p:inputText id="productNumber" value="#{zkbPartOrderEditController.selected.productNumber}" required="true" requiredMessage="#{msg.zkbPartOrder_productNumber} #{msg.ValidationRequire}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderEditController.orderType eq 'Artificial')}">
                            <label class="label">软件版本*</label>
                            <p:inputText id="softwareVersion" value="#{zkbPartOrderEditController.selected.softwareVersion}" required="true" requiredMessage="#{msg.zkbPartOrder_softwareVersion} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">故障描述*</label>
                            <!--<p:inputText id="faultDescription" value="#{zkbPartOrderEditController.selected.faultDescription}" required="true" requiredMessage="#{msg.zkbPartOrder_faultDescription} #{msg.ValidationRequire}" >
                            </p:inputText>-->
                            <p:inputTextarea value="#{zkbPartOrderEditController.selected.faultDescription}" maxlength="255" required="true" requiredMessage="#{msg.zkbPartOrder_faultDescription} #{msg.ValidationRequire}"/>

                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid  rendered="#{!(zkbPartOrderEditController.orderType eq 'Artificial')}">
                        <h:panelGroup>
                            <p:dataList id="uploadList" value="#{zkbPartOrderEditController.v2_blobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">故障图片上传</f:facet>
                                <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>
                                <p:commandButton actionListener="#{zkbPartOrderEditController.removeFile(fileitem)}" update="uploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:dataList>
                            <p:fileUpload id="uploadFile" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|rar|zip|htm|html|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS|RAR|ZIP|HTM|HTML)$/" fileUploadListener="#{zkbPartOrderEditController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                      multiple="true"  sizeLimit="100000000"  update="uploadList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <h:panelGroup id="proveFile">
                        <h:panelGroup rendered="#{zkbPartOrderEditController.orderType eq 'Probe' and zkbPartOrderEditController.selectedContract.quotaDeductType eq 'New' and zkbPartOrderEditController.selected.tenantNewCatFlag eq 't'}">
                            <p:dataList  id="uploadProveList" value="#{zkbPartOrderEditController.v2_probe_blobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">院方合同证明</f:facet>
                                <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>
                                <p:commandButton actionListener="#{zkbPartOrderEditController.removeFile(fileitem)}" update="uploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:dataList>
                            <p:fileUpload allowTypes="/(\.|\/)(pdf|PDF)$/" fileUploadListener="#{zkbPartOrderEditController.handleProveFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                          multiple="true"  sizeLimit="31000000"  update="uploadProveList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}3M" label="#{msg.Add}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                </p:fieldset>
                <p:fieldset id="zkbPartOrderOnlineFieldset" legend="在线工程师" rendered="#{(zkbPartOrderEditController.orderType eq 'Parts' or zkbPartOrderEditController.orderType eq 'Probe') and zkbPartOrderEditController.assetInfo.assetGroup eq 2 }" >
                    <h:panelGroup>
                        <p:dataTable id="onlineList" value="#{zkbPartOrderEditController.zkbPartOrderUserConfigList}" var="item"
                                     widgetVar="onlineList"  selection="#{zkbPartOrderEditController.selected.onlineEngine}"
                                     lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}">
                            <p:column selectionMode="single" style="width:40px;text-align:center"/>
                            <p:column headerText="名称">
                                <h:outputText value="#{item.name}"/>
                            </p:column>
                            <p:column headerText="产品型号">
                                <h:outputText value="#{item.remark}"/>
                            </p:column>
                            <p:column headerText="状态">
                                <h:outputText value="#{zkbPartOrderEditController.vacationRender(item.isVacation)}"/>
                            </p:column>
                            <p:column headerText="backUp">
                                <h:outputText value="#{item.usBackUpName}"/>
                            </p:column>
                        </p:dataTable>
                    </h:panelGroup>
                </p:fieldset>
                <p:fieldset id="zkbPartOrderDetailFieldset" legend="额度明细*" rendered="#{zkbPartOrderEditController.showPartOrder and (zkbPartOrderEditController.orderType eq 'Parts' or zkbPartOrderEditController.orderType eq 'Tool')}" >
                    <p:dataTable id="zkbDetailDatalist" value="#{zkbPartOrderEditController.selected.zkbPartOrderItems}" var="item"
                                 widgetVar="zkbContractCourseDatalist" selectionMode="single" selection="#{zkbPartOrderEditController.zkbPartOrderItem}"
                                 lazy="false" paginator="true" rowKey="#{item.partNo}" sortMode="single" sortOrder="ascending" sortBy="#{item.index}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}" >

                        <p:ajax event="rowSelect" update=":zkbPartOrderEditForm:zkbDetailDatalist:editDetailButton :zkbPartOrderEditForm:zkbDetailDatalist:deleteDetailButton"/>
                        <c:choose>
                            <c:when test="#{zkbPartOrderEditController.orderType eq 'Parts'}">
                                <p:column headerText="配件号">
                                    <h:outputText value="#{item.partNo}"/>
                                </p:column>
                            </c:when>
                            <c:when test="#{zkbPartOrderEditController.orderType eq 'Tool'}">
                                <p:column headerText="工具号">
                                    <h:outputText value="#{item.partNo}"/>
                                </p:column>
                            </c:when>
                        </c:choose>

                        <p:column headerText="配件名称">
                            <h:outputText value="#{item.partName}"/>
                        </p:column>
                        <p:column headerText="配件数量">
                            <h:outputText value="#{item.prePartQty}"/>
                        </p:column>
                        <p:column headerText="配件SN(序列号)">
                            <h:outputText value="#{item.serialNumber}"/>
                        </p:column>
                        <p:column headerText="备注（说明是否DOA或者Short life）">
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton immediate="false" process="@this" id="createDetailButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{zkbPartOrderEditController.prepareItemCreate}" update=":growl :zkbPartOrderEditDlg" oncomplete="PF('zkbPartOrderEditDlg').show()" />
                            <p:commandButton immediate="false" process="@this" id="editDetailButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbPartOrderEditController.prepareItemEdit}" update=":growl :zkbPartOrderEditDlg"  oncomplete="PF('zkbPartOrderEditDlg').show()"  disabled="#{zkbPartOrderEditController.itemDisabled}"/>
                            <p:commandButton immediate="false" process="@this"  id="deleteDetailButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbPartOrderEditController.deleteItem}" update=":growl :zkbPartOrderEditForm:zkbDetailDatalist  :zkbPartOrderEditForm:qty :zkbPartOrderEditForm:remainQty" disabled="#{zkbPartOrderEditController.itemDisabled}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>
                <p:fieldset id="zkbPartOrderProbeFieldset" legend="探头明细" rendered="#{zkbPartOrderEditController.showPartOrder and zkbPartOrderEditController.orderType eq 'Probe'}" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">探头号*</label>
                            <p:inputText id="catModel" value="#{zkbPartOrderEditController.selected.catNo}" required="true" requiredMessage="探头号 #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup id="catModelGrid" columns="1" layout="grid" styleClass="ui-panelgrid-blank" >
                            <h:panelGroup  style="text-align: left">
                                <c:if test="#{zkbPartOrderEditController.selectedContract.quotaDeductType eq 'New' and zkbPartOrderEditController.selected.probeQuotaType eq 'High'}">
                                    <label class="label">SN编号*</label>
                                    <p:selectOneMenu value="#{zkbPartOrderEditController.selected.contractCatId}" required="true" requiredMessage="无可用高值探头，请确认合同信息或联系客服" >
                                        <p:ajax event="itemSelect" update="qty remainQty" listener="#{zkbPartOrderEditController.zkbPartOrderCatSelect}" />
                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                        <f:selectItems value="#{zkbPartOrderEditController.highCatList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </c:if>
                                <c:if test="#{zkbPartOrderEditController.selectedContract.quotaDeductType eq 'New' and !(zkbPartOrderEditController.selected.probeQuotaType eq 'High')}">
                                    <label class="label">探头型号*</label>
                                    <p:autoComplete dropdown="true" value="#{zkbPartOrderEditController.selected.zkbPartOrderCat}"  scrollHeight="300" forceSelection="true" required="true" requiredMessage="探头型号 #{msg.ValidationRequire}"
                                                    completeMethod="#{zkbPartOrderEditController.autoCompleteCat}" var="t" itemLabel="#{t.catText}" itemValue="#{t}" converter="zkbPartOrderCatConverter">
                                        <p:ajax event="itemSelect" update="valueTypeGroup qty remainQty" listener="#{zkbPartOrderEditController.zkbPartOrderCatSelect}" />
                                    </p:autoComplete>
                                </c:if>
                                <c:if test="#{zkbPartOrderEditController.selectedContract.quotaDeductType eq 'Old' and zkbPartOrderEditController.selected.highCatFlag eq 't'}">
                                    <label class="label">SN编号*</label>
                                    <p:selectOneMenu value="#{zkbPartOrderEditController.selected.contractCatId}" required="true" requiredMessage="无可用高值探头，请确认合同信息或联系客服" >
                                        <p:ajax event="itemSelect" update="qty remainQty" listener="#{zkbPartOrderEditController.zkbPartOrderCatSelect}" />
                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                        <f:selectItems value="#{zkbPartOrderEditController.highCatList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </c:if>
                                <c:if test="#{zkbPartOrderEditController.selectedContract.quotaDeductType eq 'Old' and zkbPartOrderEditController.selected.highCatFlag eq 'f'}">
                                    <label class="label">探头型号*</label>
                                    <p:autoComplete dropdown="true" value="#{zkbPartOrderEditController.selected.zkbPartOrderCat}"  scrollHeight="300" forceSelection="true" required="true" requiredMessage="探头型号 #{msg.ValidationRequire}"
                                                    completeMethod="#{zkbPartOrderEditController.autoCompleteCat}" var="t" itemLabel="#{t.catText}" itemValue="#{t}" converter="zkbPartOrderCatConverter">
                                        <p:ajax event="itemSelect" update="valueTypeGroup qty remainQty" listener="#{zkbPartOrderEditController.zkbPartOrderCatSelect}" />
                                    </p:autoComplete>
                                </c:if>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup id="valueTypeGroup">
                            <c:if test="#{(zkbPartOrderEditController.selectedContract.quotaDeductType eq 'New' and !(zkbPartOrderEditController.selected.probeQuotaType eq 'High')) or (zkbPartOrderEditController.selectedContract.quotaDeductType eq 'Old' and zkbPartOrderEditController.selected.highCatFlag eq 'f')}">
                                <h:panelGroup>
                                    <label class="label">价值类型</label>
                                    <p:inputText id="valueType" value="#{fieldMsg.fieldValue('zkbPoValueType',zkbPartOrderEditController.selected.zkbPartOrderCat.valueType)}" disabled="true" />
                                    <label style="color: red">#{zkbPartOrderEditController.valueTypeTips}</label>
                                </h:panelGroup>
                            </c:if>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.orderType eq 'Probe'}">
                            <label class="label">是否全新探头</label>
                            <p:selectOneMenu id="newCatFlag" value="#{zkbPartOrderEditController.selected.tenantNewCatFlag}"  >
                                <p:ajax event="change" update="proveFile qty remainQty" listener="#{zkbPartOrderEditController.tenantNewCatFlagChange}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="是" itemValue="t"/>
                                <f:selectItem itemLabel="否" itemValue="f"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">旧探头SN编号*</label>
                            <p:inputText id="oldCatSn" value="#{zkbPartOrderEditController.selected.oldCatSn}" required="true" requiredMessage="旧探头SN编号 #{msg.ValidationRequire}"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">数量*</label>
                            <p:inputText id="catNum" value="#{zkbPartOrderEditController.selected.catNum}" disabled="true" />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:outputLabel id="saveTips" style="color: red" value="#{zkbPartOrderEditController.saveTips}"/><br/>
                <p:commandButton validateClient="true" value="#{msg.Submit}" action="#{zkbPartOrderEditController.saveEntity}" update=":growl" icon="ui-icon-check" />
                <p:commandButton immediate="false" process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back" action="#{zkbPartOrderEditController.backList}" />
            </h:form>
            <ui:include src="PartOrderItem.xhtml"/>
        </div>
    </ui:define>
</ui:composition>
