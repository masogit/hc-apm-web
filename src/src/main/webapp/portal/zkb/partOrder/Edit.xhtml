<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="head">
        <style>
            .quota-type-highlight.ui-selectonemenu{background-color:#FFCA28!important;border-color:#E6A800!important;}
            .quota-type-highlight.ui-selectonemenu .ui-selectonemenu-label{background-color:#FFCA28!important;}
            .quota-type-highlight.ui-selectonemenu .ui-selectonemenu-trigger{background-color:#FFCA28!important;border-color:#E6A800!important;}
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{zkbPartOrderEditController.CRUDActionName} #{msg.zkbPartOrder}"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbHeadEditForm">
                <p:panelGrid columns="6" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">GE设备或非GE设备*</label>
                        <p:selectOneMenu id="notGeAsset" value="#{zkbPartOrderEditController.notGeAsset}" valueChangeListener="#{zkbPartOrderEditController.notGeAssetChange}" disabled="#{zkbPartOrderEditController.disableNotGeAsset}">
                            <p:ajax event="change" oncomplete="openViewWindow(xhr, status, args)" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItem itemLabel="GE设备" itemValue="f"/>
                            <f:selectItem itemLabel="非GE设备" itemValue="t"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup id="orderTypeGroup">
                        <label class="label">订单类型*</label>
                        <c:if test="#{zkbPartOrderEditController.notGeAsset eq 'f' or empty zkbPartOrderEditController.notGeAsset }">
                            <p:selectOneMenu id="orderType" value="#{zkbPartOrderEditController.selected.orderType}" valueChangeListener="#{zkbPartOrderEditController.orderTypeChange}" disabled="#{zkbPartOrderEditController.selected.scoreFlag != null and zkbPartOrderEditController.selected.scoreFlag eq 't'}">
                                <p:ajax event="change" update="zkbPartOrderEditForm zkbHeadEditForm zkbwkEditForm zkbContractDatalist " />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPartOrderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </c:if>
                        <c:if test="#{zkbPartOrderEditController.notGeAsset eq 't'}">
                            <p:selectOneMenu id="orderType_non" value="#{zkbPartOrderEditController.selected.orderType}" valueChangeListener="#{zkbPartOrderEditController.orderTypeChange}" disabled="#{zkbPartOrderEditController.selected.scoreFlag != null and zkbPartOrderEditController.selected.scoreFlag eq 't'}">
                                <p:ajax event="change" update="zkbPartOrderEditForm zkbHeadEditForm zkbwkEditForm zkbContractDatalist " />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="备件申请" itemValue="Parts"/>
                                <f:selectItem itemLabel="探头申请" itemValue="Probe"/>
                                <f:selectItem itemLabel="人工申请" itemValue="Artificial"/>
                            </p:selectOneMenu>
                        </c:if>
                    </h:panelGroup>
                    <h:panelGroup id="artificialTypeGroup" rendered="#{zkbPartOrderEditController.selected.orderType eq 'Artificial'}">
                        <label class="label">机型*</label>
                        <p:selectOneMenu id="artificialType" value="#{zkbPartOrderEditController.selected.artificialType}" required="true" requiredMessage="#{msg.zkbPartOrder_artificialType} #{msg.ValidationRequire}">
                            <p:ajax event="change" update="zkbPartOrderEditForm zkbHeadEditForm" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoArtificialType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">是否为补录*</label>
                        <p:selectOneMenu value="#{zkbPartOrderEditController.selected.supplementFlag}" required="true" requiredMessage="是否为补录 #{msg.ValidationRequire}">
                            <p:ajax event="change" update="zkbPartOrderEditForm" listener="#{zkbPartOrderEditController.supplementFlagChange}"  />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{zkbPartOrderEditController.selected.orderType eq 'Parts' or zkbPartOrderEditController.selected.orderType eq 'Probe'}">
                        <label class="label">同一故障需继续订购且有未关闭的SR*</label>
                        <p:selectOneMenu value="#{zkbPartOrderEditController.faultUnClosedSr}" required="true" requiredMessage="同一故障需继续订购且有未关闭的SR #{msg.ValidationRequire}">
                            <p:ajax event="change" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
            </h:form>
        </div>

        <div class="ui-g-12 card">
            <h:form id="zkbwkEditForm">
                <p:messages id="messages" showDetail="true" closable="false" autoUpdate="true"></p:messages>
                <p:fieldset id="zkbWorkFlowFieldset" legend="工单信息" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">设备sysID</label>
                            <p:inputText id="qrCode" value="#{zkbPartOrderEditController.queryWorkFlow.assetInfo.systemId}" maxlength="100" required="false"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.notGeAsset eq 't'}">
                            <label class="label">设备编号（院方）</label>
                            <p:inputText value="#{zkbPartOrderEditController.queryWorkFlow.assetInfo.departNum}" maxlength="100" required="false"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">报修单号</label>
                            <p:inputText id="assetName" value="#{zkbPartOrderEditController.queryWorkFlow.serviceRequest.srNum}" maxlength="100" required="false"/>
                        </h:panelGroup>
                        <p:commandButton validateClient="false"  actionListener="#{zkbPartOrderEditController.getQueryWorkFlowList()}" value="#{msg.Search}" update="zkbwkEditForm zkbContractDatalist zkbPartOrderEditForm"/>
                    </p:panelGrid>
                    <p:dataTable id="zkbWkDatalist" value="#{zkbPartOrderEditController.v2_listHashMap}" var="item"
                                 widgetVar="zkbWkDatalist" selectionMode="single" selection="#{zkbPartOrderEditController.selectedWorkFlow}"
                                 lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                        <p:ajax event="rowSelect"  listener="#{zkbPartOrderEditController.workFlowSelected}" update="zkbHeadEditForm zkbwkEditForm zkbPartOrderEditForm zkbContractDatalist "/>

                        <p:column headerText="设备名称">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="sys ID">
                            <h:outputText value="#{item.systemId}"/>
                        </p:column>
                        <p:column headerText="设备编号（院方）" rendered="#{zkbPartOrderEditController.notGeAsset eq 't'}">
                            <h:outputText value="#{item.departNum}"/>
                        </p:column>
                        <p:column headerText="报修单号">
                            <h:outputText value="#{item.srNum}"/>
                        </p:column>
                        <p:column headerText="二维码">
                            <h:outputText value="#{item.oneQrCode}"/>
                        </p:column>
                        <p:column headerText="品牌">
                            <h:outputText value="#{item.makerShortName}"/>
                        </p:column>
                        <p:column headerText="报修日期">
                            <h:outputText value="#{item.requestTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="故障描述">
                            <h:outputText value="#{item.faultDescription}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>
            </h:form>
            <p:fieldset id="zkbContractFieldset" legend="合同信息" >
                <p:dataTable id="zkbContractDatalist" value="#{zkbPartOrderEditController.contractList}" var="item"
                             widgetVar="zkbContractDatalist" selectionMode="single"
                             rowKey="#{item.id}"  sortBy="#{item.id}"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">
                    <!--<p:ajax event="rowSelect" update="" listener="#{zkbPartOrderEditController.workFlowSelected}" />-->
                    <p:column headerText="#{msg.zkbContact_tenant}">
                        <h:outputText value="#{zkbContractController.getTenantInfo(item.tenantUID).name}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractNo}" >
                        <h:outputText value="#{item.contractNo}"/>
                    </p:column>
                    <!--<p:column headerText="#{msg.zkbContract_region}">
                        <h:outputText value="#{item.region}"/>
                    </p:column>-->
                    <p:column headerText="#{msg.zkbContract_contractType}">
                        <h:outputText value="#{item.contractType}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_ibNumber}">
                        <h:outputText value="#{item.ibNumber}"/>
                    </p:column>
                    <c:choose>
                        <c:when test="#{zkbPartOrderEditController.selected.orderType eq 'Parts'}">
                            <p:column headerText="#{msg.zkbContract_spareQuota}">
                                <h:outputText value="#{item.spareQuota}"/>
                            </p:column>
                            <p:column headerText="#{msg.zkbContract_spareArtificail}">
                                <h:outputText value="#{item.spareArtificail}"/>
                            </p:column>
                            <p:column headerText="高值备件剩余名额">
                                <h:outputText value="#{item.partHighQuota}"/>
                            </p:column>
                        </c:when>
                        <c:when test="#{zkbPartOrderEditController.selected.orderType eq 'Probe'}">
                            <p:column headerText="探头任意剩余名额" >
                                <h:outputText value="#{item.probeQuota}"/>
                            </p:column>
                            <p:column headerText="探头普通剩余名额" >
                                <h:outputText value="#{item.probeQuotaNormal}"/>
                            </p:column>
                            <p:column headerText="探头特殊剩余名额" >
                                <h:outputText value="#{item.probeQuotaSpecial}"/>
                            </p:column>
                        </c:when>
                        <c:when test="#{zkbPartOrderEditController.selected.orderType eq 'Artificial'}">
                            <p:column headerText="#{msg.zkbContract_geArtificialSupportTimes}" >
                                <h:outputText value="#{item.geArtificialSupportTimes}"/>
                            </p:column>
                            <p:column headerText="#{msg.zkbContract_spareArtificail}">
                                <h:outputText value="#{item.spareArtificail}"/>
                            </p:column>
                            <p:column headerText="保养剩余名额">
                                <h:outputText value="#{item.ccsbMaintenanceQuota}"/>
                            </p:column>
                        </c:when>
                        <c:when test="#{zkbPartOrderEditController.selected.orderType eq 'Tool'}">
                            <p:column headerText="#{msg.zkbContract_spareQuota}">
                                <h:outputText value="#{item.spareQuota}"/>
                            </p:column>
                            <p:column headerText="#{msg.zkbContract_spareArtificail}">
                                <h:outputText value="#{item.spareArtificail}"/>
                            </p:column>
                        </c:when>
                    </c:choose>

                    <!--<p:column headerText="探头高值剩余名额" >
                        <h:outputText value="#{item.probeQuotaHigh}"/>
                    </p:column>-->

                    <p:column headerText="#{msg.zkbContract_startDate}">
                        <h:outputText value="#{item.startDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_endDate}">
                        <h:outputText value="#{item.endDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <f:facet name="{Toolbar}">
                    </f:facet>
                </p:dataTable>
            </p:fieldset>
        </div>

        <div class="ui-g-12 card" >
            <h:form id="zkbPartOrderEditForm" >
                <p:fieldset id="zkbPartOrderFieldset" legend="额度信息" rendered="#{zkbPartOrderEditController.showPartOrder}">
                    <p:panelGrid id= "applyInfo" columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">申请人*</label>
                            <p:inputText id="requestUser" value="#{zkbPartOrderEditController.selected.requestUser}" disabled="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人电话*</label>
                            <p:inputText id="requestPhone" value="#{zkbPartOrderEditController.selected.requestPhone}" required="true" requiredMessage="#{msg.zkbPartOrder_requestPhone} #{msg.ValidationRequire}">
                                <p:ajax />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间*</label>
                            <p:calendar timeZone="GMT+8"  id="requestDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbPartOrderEditController.selected.requestDate}" required="true" requiredMessage="#{msg.zkbPartOrder_requestDate} #{msg.ValidationRequire}" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.selected.orderType eq 'Parts' and zkbPartOrderEditController.assetInfo.assetGroup eq 1}">
                            <label class="label">设备类型（DI）*</label>
                            <p:selectOneMenu id="assetTypeDi" value="#{zkbPartOrderEditController.selected.assetTypeDi}" required="true" requiredMessage="#设备类型（DI） #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="CT" itemValue="CT"/>
                                <f:selectItem itemLabel="XR" itemValue="XR"/>
                                <p:ajax event="change" update="zkbPartOrderEditForm:warmMessageCT"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.selected.orderType eq 'Parts'}" layout="block" style="background-color:#FFCA28; padding:8px 12px; border-radius:4px;">
                            <label class="label">名额扣除类型*</label>
                            <p:selectOneMenu  value="#{zkbPartOrderEditController.selected.radiationQuotaType}" disabled="#{zkbPartOrderEditController.spareArtificialFlag}" required="true" requiredMessage="名额扣除类型 #{msg.ValidationRequire}" styleClass="quota-type-highlight">
                                <p:ajax event="change" update="partsHighTypeGroup zkbDetailDatalist remainQty" listener="#{zkbPartOrderEditController.calcRemainQty}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{zkbPartOrderEditController.zkbPoPartQuotaTypeList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup id="partsHighTypeGroup"  rendered="#{zkbPartOrderEditController.radiationQuotaTypeFlag}">
                            <h:panelGroup  rendered="#{zkbPartOrderEditController.selected.radiationQuotaType eq 'PartsHigh'}">
                                <label class="label">备件类型*</label>
                                <p:selectOneMenu value="#{zkbPartOrderEditController.selected.partsHighType}" required="true" requiredMessage="备件类型 #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPartsHighTypeGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{zkbPartOrderEditController.selected.orderType eq 'Artificial' and !(zkbPartOrderEditController.checkPcbMvsTotal()) }">
                            <label class="label">保养申请*</label>
                            <p:selectOneMenu id="maintainFlag" value="#{zkbPartOrderEditController.selected.maintainFlag}" required="true" requiredMessage="保养申请 #{msg.ValidationRequire}">
                                <p:ajax event="change" update="ArtificialGroup scoreFlagGroup exchangeTypeGroup" listener="#{zkbPartOrderEditController.maintainFlagChange}" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup id="ArtificialGroup" rendered="#{zkbPartOrderEditController.selected.orderType eq 'Artificial' and zkbPartOrderEditController.selectedContract.contractType != 'CCSB' and zkbPartOrderEditController.notGeAsset eq 'f'}">
                            <h:panelGroup rendered="#{zkbPartOrderEditController.selected.maintainFlag != 't'}">
                                <c:if test="#{zkbPartOrderEditController.selected.artificialType eq '1'}">
                                    <label class="label" >是否需要SSA Key*</label>
                                </c:if>
                                <c:if test="#{!(zkbPartOrderEditController.selected.artificialType eq '1')}">
                                    <label class="label" >是否需要Dongle*</label>
                                </c:if>
                                <p:selectOneMenu value="#{zkbPartOrderEditController.selected.ssaKeyFlag}" required="true" requiredMessage="是否需要SSA Key #{msg.ValidationRequire}"  >
                                    <p:ajax event="change" update="scoreFlagGroup remainQty exchangeTypeGroup"  listener="#{zkbPartOrderEditController.ssaKeyFlagChange}"/>
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup id="scoreFlagGroup" rendered="#{zkbPartOrderEditController.scoreFlagRender()}">
                            <label class="label">是否使用积分抵扣*</label>
                            <c:if test="#{zkbPartOrderEditController.notGeAsset eq 'f' or empty zkbPartOrderEditController.notGeAsset}">
                                <p:selectOneMenu value="#{zkbPartOrderEditController.selected.scoreFlag}" required="true" requiredMessage="是否使用积分抵扣 #{msg.ValidationRequire}" disabled="#{zkbPartOrderEditController.currentScoreFlag}">
                                    <p:ajax event="change" update="zkbHeadEditForm:orderType exchangeTypeGroup remainQty" listener="#{zkbPartOrderEditController.scoreFlagChange}" />
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </c:if>
                            <c:if test="#{zkbPartOrderEditController.notGeAsset eq 't'}">
                                <p:selectOneMenu value="#{zkbPartOrderEditController.selected.scoreFlag}" required="true" requiredMessage="是否使用积分抵扣 #{msg.ValidationRequire}" disabled="#{zkbPartOrderEditController.currentScoreFlag}">
                                    <p:ajax event="change" update="zkbHeadEditForm:orderType_non exchangeTypeGroup remainQty" listener="#{zkbPartOrderEditController.scoreFlagChange}" />
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </c:if>
                            <p:outputLabel id="cscore" value="#{zkbPartOrderEditController.currentScoreText}" disabled="true"  style="margin-left: 10px;color: red;font-size: larger"/>
                        </h:panelGroup>
                        <h:panelGroup id="exchangeTypeGroup" rendered="false">
                            <h:panelGroup rendered="#{zkbPartOrderEditController.selected.scoreFlag eq 't'}">
                                <label class="label">兑换类型*</label>
                                <p:selectOneMenu value="#{zkbPartOrderEditController.selected.exchangeType}" required="true" requiredMessage="兑换类型 #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{zkbPartOrderEditController.exchangeTypeList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{zkbPartOrderEditController.selected.orderType eq 'Parts' and zkbPartOrderEditController.assetInfo.assetGroup eq 2 }">
                            <label class="label">机型*</label>
                            <p:selectOneMenu value="#{zkbPartOrderEditController.selected.artificialType}" required="true" disabled="true" requiredMessage="#{msg.zkbPartOrder_artificialType} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="超声高端机" itemValue="2"/>
                                <f:selectItem itemLabel="超声低端机" itemValue="3"/>
                                <f:selectItem itemLabel="超声Depot产品" itemValue="depot"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.selected.orderType eq 'Probe' and zkbPartOrderEditController.selectedContract.quotaDeductType != null and zkbPartOrderEditController.selectedContract.quotaDeductType eq 'New'}">
                            <label class="label">扣除名额类型*</label>
                            <p:selectOneMenu value="#{zkbPartOrderEditController.selected.probeQuotaType}" required="true" requiredMessage="扣除名额类型 #{msg.ValidationRequire}">
                                <p:ajax event="change" update="catModelGrid valueTypeGroup qty remainQty" listener="#{zkbPartOrderEditController.zkbPartOrderCatSelect}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{zkbPartOrderEditController.zkbPoProbeQuotaTypeList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{zkbPartOrderEditController.selected.orderType eq 'Artificial' and zkbPartOrderEditController.selectedContract.contractType eq 'CCSB'}">
                            <label class="label">CCSB扣除名额类型*</label>
                            <p:selectOneMenu value="#{zkbPartOrderEditController.selected.ccsbApplyType}" required="true" requiredMessage="扣除名额类型 #{msg.ValidationRequire}">
                                <p:ajax event="change" update="remainQty" listener="#{zkbPartOrderEditController.ccsbApplyTypeSelect}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCCsbQuotaType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{zkbPartOrderEditController.selected.orderType eq 'Probe' and zkbPartOrderEditController.selectedContract.quotaDeductType != null and zkbPartOrderEditController.selectedContract.quotaDeductType eq 'Old'}">
                            <label class="label">是否高值探头*</label>
                            <p:selectOneMenu value="#{zkbPartOrderEditController.selected.highCatFlag}" required="true" requiredMessage="是否高值探头 #{msg.ValidationRequire}" disabled="#{zkbPartOrderEditController.highCatFlagDisabledCheck()}">
                                <p:ajax event="change" update="catModelGrid valueTypeGroup qty remainQty" listener="#{zkbPartOrderEditController.zkbPartOrderCatSelect}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                       <!-- <h:panelGroup>
                            <label class="label">#{msg.zkbContract_region}*</label>
                            <p:selectOneMenu id="region" value="#{zkbPartOrderEditController.selected.region}" required="true" requiredMessage="#{msg.zkbContract_region} #{msg.ValidationRequire}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>

                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.notGeAsset eq 'f'}">
                            <label class="label">是否全新探头</label>
                            <p:selectOneMenu id="newCatFlag" value="#{zkbPartOrderEditController.selected.tenantNewCatFlag}"  >
                                <p:ajax event="change" update="proveFile qty remainQty zkbPartOrderProbeGrid" listener="#{zkbPartOrderEditController.tenantNewCatFlagChange}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.selected.tenantNewCatFlag eq 't' and zkbPartOrderEditController.selectedContract.quotaDeductType eq 'New'}">
                            <label class="label">是否可以提供全新合同</label>
                            <p:selectOneMenu  value="#{zkbPartOrderEditController.selected.provideNewContract}"  >
                                <p:ajax event="change" update="qty remainQty zkbPartOrderProbeGrid" listener="#{zkbPartOrderEditController.provideNewContractChange}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                            <p:outputLabel style="color: red;margin-left: 20px;" value="不能提供全新合同扣减额度翻倍" rendered="#{zkbPartOrderEditController.selected.provideNewContract eq 'f'}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">旧探头SN编号*</label>
                            <p:inputText id="oldCatSn" value="#{zkbPartOrderEditController.selected.oldCatSn}" required="true" requiredMessage="旧探头SN编号 #{msg.ValidationRequire}">
                                <p:ajax />
                            </p:inputText>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">数量*</label>
                            <p:inputText id="catNum" value="#{zkbPartOrderEditController.selected.catNum}" disabled="true" />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:outputLabel id="saveTips" style="color: red" value="#{zkbPartOrderEditController.saveTips}"/><br/>
                <!--<p:commandButton validateClient="true" value="#{msg.Submit}" action="#{zkbPartOrderEditController.saveEntity}" update=":growl" icon="ui-icon-check" />-->
                <p:commandButton value="提交" icon="ui-icon-check" validateClient="true"  update=":growl :zkbConfirmDlg" action="#{zkbPartOrderEditController.preSave}" oncomplete="validShow(args, 'zkbConfirmDlg');"/>

                <p:commandButton immediate="false" process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back" action="#{zkbPartOrderEditController.backList}" />
            </h:form>
            <ui:include src="PartOrderItem.xhtml"/>
            <p:dialog id="zkbConfirmDlg" widgetVar="zkbConfirmDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="确认" height="150">
                <h:form id="zkbConfirmForm">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label style="color: red">#{zkbPartOrderEditController.quotaTips}</label>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <div style="text-align: center">
                        <p:commandButton validateClient="true" value="#{msg.Confirm}" action="#{zkbPartOrderEditController.saveData}" oncomplete="PF('zkbConfirmDlg').hide()" update=":growl" icon="ui-icon-check" />
                        <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbConfirmDlg').hide()" style="margin-left: 30px"/>
                    </div>

                </h:form>

            </p:dialog>
        </div>

        <script>
            function openViewWindow(xhr, status, args) {
                window.document.body.innerHTML = '加载中...';
                window.location.href = args.url;
            }

            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }

            function validShow(args, dialog) {
                debugger;
                var jqDialog = jQuery('#' + dialog);
                if (args.validationFailed) {
                    PF(dialog).hide();
                } else {
                    PF(dialog).show();
                }
            }

        </script>
    </ui:define>
</ui:composition>
