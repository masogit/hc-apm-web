<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{zkbPartOrderEditController.CRUDActionName} #{msg.zkbPartOrder}"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbHeadEditForm">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">订单类型*</label>
                        <p:selectOneMenu id="orderType" value="#{zkbPartOrderEditController.orderType}" >
                            <p:ajax event="change" update="zkbPartOrderEditForm zkbHeadEditForm" listener="#{zkbPartOrderEditController.orderTypeChange}" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPartOrderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup id="artificialTypeGroup" rendered="#{zkbPartOrderEditController.orderType eq 'Artificial'}">
                        <label class="label">机型*</label>
                        <p:selectOneMenu id="artificialType" value="#{zkbPartOrderEditController.artificialType}" required="true" requiredMessage="#{msg.zkbPartOrder_artificialType} #{msg.ValidationRequire}">
                            <p:ajax event="change" update="zkbPartOrderEditForm zkbHeadEditForm" listener="#{zkbPartOrderEditController.orderTypeChange}"  />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoArtificialType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
            </h:form>
        </div>
        <div class="ui-g-12 card">
            <h:form id="zkbwkEditForm">
                <p:messages id="messages" showDetail="true" closable="false" autoUpdate="true"></p:messages>
                <p:fieldset id="zkbWorkFlowFieldset" legend="工单信息" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">设备sysID</label>
                            <p:inputText id="qrCode" value="#{zkbPartOrderEditController.queryWorkFlow.assetInfo.systemId}" maxlength="100" required="false"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">工单编号</label>
                            <p:inputText id="assetName" value="#{zkbPartOrderEditController.queryWorkFlow.serviceRequest.srNum}" maxlength="100" required="false"/>
                        </h:panelGroup>
                        <p:commandButton validateClient="false"  actionListener="#{zkbPartOrderEditController.getQueryWorkFlowList()}" value="#{msg.Search}" update="zkbwkEditForm"/>
                    </p:panelGrid>
                    <p:dataTable id="zkbWkDatalist" value="#{zkbPartOrderEditController.v2_listHashMap}" var="item"
                                 widgetVar="zkbWkDatalist" selectionMode="single" selection="#{zkbPartOrderEditController.selectedWorkFlow}"
                                 lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                        <p:ajax event="rowSelect"  listener="#{zkbPartOrderEditController.workFlowSelected}" update="zkbContractDatalist zkbPartOrderEditForm zkbwkEditForm"/>

                        <p:column headerText="设备名称">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="sys ID">
                            <h:outputText value="#{item.systemId}"/>
                        </p:column>
                        <p:column headerText="工单编号">
                            <h:outputText value="#{item.srNum}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>

            </h:form>
            <p:fieldset id="zkbContractFieldset" legend="合同信息" >
                <p:dataTable id="zkbContractDatalist" value="#{zkbPartOrderEditController.contractList}" var="item"
                             widgetVar="zkbWkDatalist" selectionMode="single" disabledSelection="true"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                    <!--<p:ajax event="rowSelect" update="" listener="#{zkbPartOrderEditController.workFlowSelected}" />-->

                    <p:column headerText="#{msg.zkbContact_tenant}">
                        <h:outputText value="#{zkbContractController.getTenantInfo(item.tenantUID).name}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractNo}" >
                        <h:outputText value="#{item.contractNo}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_region}">
                        <h:outputText value="#{item.region}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractType}">
                        <h:outputText value="#{item.contractType}"/>
                    </p:column>

                    <p:column headerText="#{msg.zkbContract_ibNumber}">
                        <h:outputText value="#{item.ibNumber}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_spareQuota}">
                        <h:outputText value="#{item.spareQuota}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_probeQuota}" >
                        <h:outputText value="#{item.probeQuota}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_geArtificialSupportTimes}" >
                        <h:outputText value="#{item.geArtificialSupportTimes}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_spareArtificail}">
                        <h:outputText value="#{item.spareArtificail}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_startDate}">
                        <h:outputText value="#{item.startDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_endDate}">
                        <h:outputText value="#{item.endDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <f:facet name="{Toolbar}">
                    </f:facet>
                </p:dataTable>
            </p:fieldset>
        </div>

        <div class="ui-g-12 card" >
            <h:form id="zkbPartOrderEditForm" >
                <p:fieldset id="zkbPartOrderFieldset" legend="额度信息" rendered="#{zkbPartOrderEditController.showPartOrder}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_region}*</label>
                            <p:selectOneMenu id="region" value="#{zkbPartOrderEditController.selected.region}" required="true" requiredMessage="#{msg.zkbContract_region} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">订单日期*</label>
                            <p:calendar timeZone="GMT+8"  id="startDate" pattern="yyyy/MM/dd" value="#{zkbPartOrderEditController.selected.partOrderDate}" required="true" requiredMessage="#{msg.zkbContract_startDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">申请人*</label>
                            <p:inputText id="requestUser" value="#{zkbPartOrderEditController.selected.requestUser}" required="true" requiredMessage="#{msg.zkbContract_contractNo} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人电话*</label>
                            <p:inputText id="requestPhone" value="#{zkbPartOrderEditController.selected.requestPhone}" required="true" requiredMessage="#{msg.zkbContract_contractNo} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间*</label>
                            <p:calendar timeZone="GMT+8"  id="requestDate" pattern="yyyy/MM/dd" value="#{zkbPartOrderEditController.selected.requestDate}" required="true" requiredMessage="#{msg.zkbContract_startDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">医院名称</label>
                            <p:inputText id="hospitalName" value="#{zkbPartOrderEditController.selected.hospitalName}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人姓名</label>
                            <p:inputText id="hospitalRepairer" value="#{zkbPartOrderEditController.selected.hospitalRepairer}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人电话</label>
                            <p:inputText id="hospitalRepairerPhone" value="#{zkbPartOrderEditController.selected.hospitalRepairerPhone}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">产品型号</label>
                            <p:inputText id="productNumber" value="#{zkbPartOrderEditController.selected.productNumber}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">软件版本</label>
                            <p:inputText id="softwareVersion" value="#{zkbPartOrderEditController.selected.softwareVersion}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">故障描述</label>
                            <p:inputText id="faultDescription" value="#{zkbPartOrderEditController.selected.faultDescription}"  >
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">订单标注</label>
                            <p:inputText id="orderAnnotation" value="#{zkbPartOrderEditController.selected.orderAnnotation}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">发生问题的order number</label>
                            <p:inputText id="problemOrderNumber" value="#{zkbPartOrderEditController.selected.problemOrderNumber}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">是否为紧急订单</label>
                            <p:selectOneMenu id="urgentOrder" value="#{zkbPartOrderEditController.selected.urgentOrder}" >
                                <p:ajax event="change" update="urgencyReasons" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="紧急" itemValue="t"/>
                                <f:selectItem itemLabel="不紧急" itemValue="f"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">订单紧急的原因</label>
                            <p:selectOneMenu id="urgencyReasons" value="#{zkbPartOrderEditController.selected.urgencyReasons}" disabled="#{!(zkbPartOrderEditController.selected.urgentOrder eq 't')}" >
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbUrgentReasonType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">订单数量</label>
                            <p:inputText id="qty" value="#{zkbPartOrderEditController.selected.qty}" required="true"  requiredMessage="订单数量 #{msg.ValidationRequire}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">剩余数量</label>
                            <p:inputText id="remainQty" value="#{zkbPartOrderEditController.selected.remainQty}" disabled="true" />
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid>
                        <h:panelGroup>
                            <p:dataList id="uploadList" value="#{zkbPartOrderEditController.v2_blobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">附件列表</f:facet>
                                <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>
                                <p:commandButton actionListener="#{zkbPartOrderEditController.removeFile(fileitem)}" update="uploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:dataList>
                            <p:fileUpload id="uploadFile" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{zkbPartOrderEditController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                      multiple="true"  sizeLimit="100000000"  update="uploadList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset id="zkbPartOrderDetailFieldset" legend="额度明细" rendered="#{zkbPartOrderEditController.showPartOrder and zkbPartOrderEditController.orderType eq 'Parts'}" >
                    <p:dataTable id="zkbDetailDatalist" value="#{zkbPartOrderEditController.selected.zkbPartOrderItems}" var="item"
                                 widgetVar="zkbContractCourseDatalist" selectionMode="single" selection="#{zkbPartOrderEditController.zkbPartOrderItem}"
                                 lazy="false" paginator="true" rowKey="#{item.partNo}" sortMode="single" sortOrder="ascending" sortBy="#{item.index}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}" >

                        <p:ajax event="rowSelect" update=":zkbPartOrderEditForm:zkbDetailDatalist:editDetailButton :zkbPartOrderEditForm:zkbDetailDatalist:deleteDetailButton"/>

                        <p:column headerText="配件号">
                            <h:outputText value="#{item.partNo}"/>
                        </p:column>
                        <p:column headerText="配件名称">
                            <h:outputText value="#{item.partName}"/>
                        </p:column>
                        <p:column headerText="配件数量">
                            <h:outputText value="#{item.partQty}"/>
                        </p:column>
                        <p:column headerText="配件SN(序列号)">
                            <h:outputText value="#{item.serialNumber}"/>
                        </p:column>
                        <p:column headerText="备注（说明是否DOA或者Short life）">
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton immediate="false" process="@this" id="createDetailButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{zkbPartOrderEditController.prepareItemCreate}" update=":growl :zkbPartOrderEditDlg" oncomplete="PF('zkbPartOrderEditDlg').show()" />
                            <p:commandButton immediate="false" process="@this" id="editDetailButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbPartOrderEditController.prepareItemEdit}" update=":growl :zkbPartOrderEditDlg"  oncomplete="PF('zkbPartOrderEditDlg').show()"  disabled="#{zkbPartOrderEditController.itemDisabled}"/>
                            <p:commandButton immediate="false" process="@this"  id="deleteDetailButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbPartOrderEditController.deleteItem}" update=":growl :zkbPartOrderEditForm:zkbDetailDatalist" disabled="#{zkbPartOrderEditController.itemDisabled}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>
                <p:fieldset id="zkbPartOrderProbeFieldset" legend="探头明细" rendered="#{zkbPartOrderEditController.showPartOrder and zkbPartOrderEditController.orderType eq 'Probe'}" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">探头</label>
                            <p:autoComplete dropdown="true" value="#{zkbPartOrderEditController.selected.zkbPartOrderCat}"  scrollHeight="300" forceSelection="true" required="true"
                                            completeMethod="#{zkbPartOrderEditController.autoCompleteCat}" var="t" itemLabel="#{t.catNo}" itemValue="#{t}" converter="zkbPartOrderCatConverter">
                                <p:ajax event="itemSelect" update="zkbPartOrderProbeFieldset qty remainQty" listener="#{zkbPartOrderEditController.zkbPartOrderCatSelect}" />
                            </p:autoComplete>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">型号</label>
                            <p:inputText id="catModel" value="#{zkbPartOrderEditController.selected.zkbPartOrderCat.catModel}" disabled="true" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">探头类型</label>
                            <p:inputText id="catType" value="#{zkbPartOrderEditController.selected.zkbPartOrderCat.catType}" disabled="true" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">价值类型</label>
                            <p:inputText id="valueType" value="#{zkbPartOrderEditController.selected.zkbPartOrderCat.valueType}" disabled="true" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">价格</label>
                            <p:inputText id="price" value="#{zkbPartOrderEditController.selected.zkbPartOrderCat.price}" disabled="true" />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" action="#{zkbPartOrderEditController.saveEntity}" update=":growl" icon="ui-icon-check" />
                <p:commandButton immediate="false" process="@this" value="#{msg.Cancel}" icon="ui-icon-arrow-back" action="List?faces-redirect=true" />
            </h:form>
            <ui:include src="PartOrderItem.xhtml"/>
        </div>
    </ui:define>
</ui:composition>
