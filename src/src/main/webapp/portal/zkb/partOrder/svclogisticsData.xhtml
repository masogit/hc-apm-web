<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <p:dialog id="zkbLogisticsDlg" widgetVar="zkbLogisticsDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="物流数据查询" width="70%" height="620">
        <h:form id="zkbLogisticsForm">
            <c:if test="#{zkbPartOrderAuditController.svcEngineLogisticsLineVOList.size() == 0}">
                <p:outputLabel>物流数据为空！</p:outputLabel>
            </c:if>
            <c:forEach var="item" items="#{zkbPartOrderAuditController.svcEngineLogisticsLineVOList}" >
                <p:panel>
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">备件号</label>
                            <p:inputText value="#{item.item}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">数量</label>
                            <p:inputText value="#{item.qty}" disabled="true"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <c:if test="#{item.svcEngineLogisticsList != null}">
                        <p:fieldset legend="订单状态">
                            <p:dataTable id="orderList" value="#{item.svcEngineLogisticsList}" var="it"
                                         widgetVar="svcEngineLogisticsList"
                                         lazy="false" paginator="false" rowKey="#{it.localStatusCode}" sortOrder="ascending" >
                                <p:column headerText="状态">
                                    <h:outputText value="#{it.localStatusName}"/>
                                </p:column>
                                <p:column headerText="时间">
                                    <h:outputText value="#{it.updateTime}"/>
                                </p:column>
                            </p:dataTable>
                        </p:fieldset>
                    </c:if>
                    <c:if test="#{item.svcEngineLogisticsOrderDetails != null}">
                        <p:fieldset legend="运单信息">
                            <p:dataTable id="waybillList" value="#{item.svcEngineLogisticsOrderDetails}" var="it"
                                         widgetVar="geHistoryDataList"
                                         lazy="false" paginator="false" rowKey="#{item.id}" sortOrder="ascending" rows="20" >
                                <p:column headerText="运单号">
                                    <h:outputText value="#{it.awb}"/>
                                </p:column>
                                <p:column headerText="物流公司">
                                    <h:outputText value="#{it.carrierChinese}"/>
                                </p:column>
                                <p:column headerText="查运订单">
                                    <p:link value="#{it.hyperlink}" target="_blank" href="#{it.hyperlink}" />
                                </p:column>
                            </p:dataTable>
                        </p:fieldset>
                    </c:if>
                </p:panel>
            </c:forEach>

        </h:form>
    </p:dialog>
    
</ui:composition>
</html>
