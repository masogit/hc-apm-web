<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">
<ui:composition>

    <p:dialog id="zkbUnrealyDlg" widgetVar="zkbUnrealyDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="不真实数据选择" width="25%" height="320">
    <h:form id="zkbUnrealForm">
        <p:selectManyCheckbox  value="#{zkbPartOrderAuditController.selectedOptions}" widgetVar="blub" columns="1" styleClass="grid-checkbox" layout="grid" style="width: 100%">
            <f:selectItems value="#{zkbPartOrderAuditController.unrealItem}" var="item" itemLabel="#{item.unrealPartName}"
                           itemValue="#{item.partNo}" itemDisabled="#{item.cbStatus eq 'f'}" />
        </p:selectManyCheckbox>
        <style>
            /*.ui-selectmanycheckbox.ui-widget td, .ui-selectoneradio.ui-widget label, .ui-selectoneradio.ui-widget td {
                color: red;
            }*/
            .ui-selectmanycheckbox .ui-chkbox {
                width: 3%!important;
            }
        </style>

        <br/>
        <div style="position: absolute;bottom: 10px;left: 150px;">
            <p:commandButton validateClient="true" value="确定" action="#{zkbPartOrderAuditController.saveUnreal}" oncomplete="handleSubmit(args, 'zkbUnrealyDlg');" update=":growl zkbPartOrderEditForm:zkbDetailDatalist" icon="ui-icon-check" />
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbUnrealyDlg').hide()" style="left: 20px;"/>
        </div>

    </h:form>
    </p:dialog>
</ui:composition>

</html>
