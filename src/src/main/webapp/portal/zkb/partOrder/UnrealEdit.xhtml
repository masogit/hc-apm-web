<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">
<ui:composition>

    <p:dialog id="zkbUnrealyDlg" widgetVar="zkbUnrealyDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="不真实数据选择" width="25%" height="320">
    <h:form id="zkbUnrealForm">
        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup >
                <p:selectManyCheckbox  value="#{zkbPartOrderAuditController.selectedOptions}" widgetVar="blub" columns="1" required="true" requiredMessage="不真实选择#{msg.ValidationRequire}"
                                       styleClass="grid-checkbox" layout="grid" style="width: 100%">
                    <f:selectItems value="#{zkbPartOrderAuditController.unrealItem}" var="item" itemLabel="#{item.unrealPartName}"
                                   itemValue="#{item.itemNo}" itemDisabled="#{item.cbStatus eq 'f'}" />
                </p:selectManyCheckbox>
            </h:panelGroup>
            <h:panelGroup >
                <label class="label">不真实判定原因*</label>
                <p:inputTextarea  value="#{zkbPartOrderAuditController.unrealReason}" required="true" requiredMessage="不真实判定原因#{msg.ValidationRequire}" rows="3" cols="40" style="width: 50%">
                </p:inputTextarea>
            </h:panelGroup>
        </p:panelGrid>

        <style>
            /*.ui-selectmanycheckbox.ui-widget td, .ui-selectoneradio.ui-widget label, .ui-selectoneradio.ui-widget td {
                color: red;
            }*/
            .ui-selectmanycheckbox .ui-chkbox {
                width: 3%!important;
            }
        </style>

        <br/>
        <div style="position: absolute;bottom: 10px;left: 150px;">
            <p:commandButton validateClient="true" value="确定" action="#{zkbPartOrderAuditController.saveUnreal}" oncomplete="handleSubmit(args, 'zkbUnrealyDlg');" update=":growl :zkbPartOrderEditForm:zkbDetailDatalist :zkbPartOrderEditForm:zkbPartOrderProbeFieldset :zkbPartOrderEditForm:techFieldset" icon="ui-icon-check" />
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbUnrealyDlg').hide()" style="left: 20px;"/>
        </div>

    </h:form>
    </p:dialog>
</ui:composition>

</html>
