<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="zkbHistoryQueryDlg" widgetVar="zkbHistoryQueryDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="历史数据查询" width="70%" height="620">
        <h:form id="zkbHistoryQueryForm">
            <p:fieldset legend="查询条件">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">代理商</label>
                        <p:inputText id="tenantUid" value="#{zkbPartOrderAuditController.tenantInfo.name}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">设备sysID</label>
                        <p:inputText id="qrCode" value="#{zkbPartOrderAuditController.conditionMap.sysId}" required="false"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">工单编号</label>
                        <p:inputText id="assetName" value="#{zkbPartOrderAuditController.conditionMap.srNum}" required="false"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">合同编号</label>
                        <p:inputText  value="#{zkbPartOrderAuditController.conditionMap.contractNo}" required="false"/>
                    </h:panelGroup>
                    <p:commandButton validateClient="false"   value="#{msg.Search}" actionListener="#{zkbPartOrderAuditController.queryHistoryData()}" update="zkbHistoryQueryForm"/>
                </p:panelGrid>
            </p:fieldset>
            <p:fieldset legend="智康保历史数据">
                <p:dataTable id="zkbHistoryDataList" value="#{zkbPartOrderAuditController.zkbHistoryDataList}" var="item"
                             widgetVar="zkbHistoryDataList" selectionMode="single" paginatorPosition="both" paginatorAlwaysVisible="true"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rowsPerPageTemplate="20,50,100,500"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" rows="20" emptyMessage="#{msg.noRecordFound}">
                    <p:column headerText="申请单号">
                        <h:outputText value="#{item.partOrderNo}"/>
                    </p:column>
                    <p:column headerText="sys ID">
                        <h:outputText value="#{item.systemId}"/>
                    </p:column>
                    <p:column headerText="工单编号">
                        <h:outputText value="#{item.srNum}"/>
                    </p:column>
                    <!--<p:column headerText="设备名称">
                        <h:outputText value="#{item.name}"/>
                    </p:column>-->
                    <p:column headerText="备件号">
                        <h:outputText value="#{item.partNo}"/>
                    </p:column>
                    <p:column headerText="备件名称">
                        <h:outputText value="#{item.partName}"/>
                    </p:column>
                    <p:column headerText="申请数量">
                        <h:outputText value="#{item.partQty}"/>
                    </p:column>
                    <p:column headerText="备件描述（备注）">
                        <h:outputText value="#{item.partRemark}"/>
                    </p:column>
                    <p:column headerText="当前步骤">
                        <h:outputText value="#{fieldMsg.fieldValue('zkbPoSteps',item.currentStep)}"/>
                    </p:column>
                    <p:column headerText="申请状态">
                        <h:outputText value="#{fieldMsg.fieldValue('zkbPoStatus',item.status)}"/>
                    </p:column>
                </p:dataTable>
            </p:fieldset>
            <p:fieldset legend="Ge历史数据">
                <p:dataTable id="geHistoryDataList" value="#{zkbPartOrderAuditController.geHistoryDataList}" var="item"
                             widgetVar="geHistoryDataList" selectionMode="single" paginatorPosition="both" paginatorAlwaysVisible="true"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rowsPerPageTemplate="20,50,100,500"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" rows="20" emptyMessage="#{msg.noRecordFound}">
                  <!--  <p:column headerText="申请单号">
                        <h:outputText value="#{item.partOrderNo}"/>
                    </p:column>-->
                    <p:column headerText="sys ID">
                        <h:outputText value="#{item.systemId}"/>
                    </p:column>
                    <p:column headerText="工单编号">
                        <h:outputText value="#{item.srNum}"/>
                    </p:column>
                    <!--<p:column headerText="设备名称">
                        <h:outputText value="#{item.name}"/>
                    </p:column>-->

                    <p:column headerText="备件号">
                        <h:outputText value="#{item.partNo}"/>
                    </p:column>
                    <p:column headerText="备件名称">
                        <h:outputText value="#{item.partName}"/>
                    </p:column>
                    <p:column headerText="申请数量">
                        <h:outputText value="#{item.partQty}"/>
                    </p:column>
                    <p:column headerText="备件描述（备注）">
                        <h:outputText value="#{item.partRemark}"/>
                    </p:column>

                </p:dataTable>
            </p:fieldset>
        </h:form>
    </p:dialog>
    
</ui:composition>
</html>
