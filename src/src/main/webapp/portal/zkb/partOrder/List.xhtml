<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="额度申请"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="zkbPartOrderListForm">
                    <h:panelGrid id="tenantInfoGrid" columns="4" style="margin-bottom:10px" cellpadding="5">
                        <p:outputLabel value="#{msg.TenantInfo}*:"/>
                        <p:selectOneMenu style="transform: scale(1.2)"  id="selectionTenantInfo" value="#{zkbPartOrderController.selectionTenantInfo}" disabled="#{userContextService.zkbUser}">
                            <p:ajax listener="#{zkbPartOrderController.tenantInfoSelect}" update="datalist :zkbPartOrderListForm"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{zkbPartOrderController.tenantInfoList}" var="v">
                                <f:selectItem itemLabel="#{v.name}" itemValue="#{v.uid}"/>
                            </c:forEach>
                        </p:selectOneMenu>

                    </h:panelGrid>
                    <p:dataTable id="datalist" value="#{zkbPartOrderController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbPartOrderController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500" >

                        <p:ajax event="rowSelect" listener="#{zkbPartOrderController.prepareEdit}" update="deleteButton :zkbPartOrderListForm"/>
                        <p:ajax event="filter" listener="#{zkbPartOrderController.onFilter}" />

                        <p:column headerText="#{msg.zkbContact_tenant}" sortBy="#{item.tenantUID}">
                            <h:outputText value="#{zkbPartOrderController.getTenantInfo(item.tenantUID).name}"/>
                        </p:column>

                        <p:column headerText="申请编号" filterBy="#{item.partOrderNo}" sortBy="#{item.partOrderNo}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.partOrderNo}"/>
                        </p:column>
                         <p:column headerText="订单类型" filterBy="#{item.orderType}" sortBy="#{item.orderType}" filterMatchMode="LIKE">
                            <h:outputText value="#{zkbPartOrderController.getOrderTypeText(item.orderType)}"/>
                        </p:column>

                        <p:column headerText="区域" filterBy="#{item.region}" sortBy="#{item.region}"  filterMatchMode="EQ">
                            <h:outputText value="#{item.region}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>

                        <p:column headerText="设备名称" filterBy="#{item.assetInfo.name}" sortBy="#{item.assetInfo.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.name}"/>
                        </p:column>

                        <p:column headerText="Sys ID" filterBy="#{item.assetInfo.systemId}" sortBy="#{item.assetInfo.systemId}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.systemId}"/>
                        </p:column>

                        <p:column headerText="派工单号" filterBy="#{item.srNum}" sortBy="#{item.srNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.srNum}"/>
                        </p:column>

                        <p:column headerText="合同号" filterBy="#{item.contractNo}" sortBy="#{item.contractNo}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.contractNo}"/>
                        </p:column>

                        <p:column headerText="申请人" sortBy="#{item.requestUser}">
                            <h:outputText value="#{item.requestUser}"/>
                        </p:column>
                        <p:column headerText="申请时间" sortBy="#{item.requestDate}" filterBy="#{item.requestDate}" filterMatchMode="GTE">
                            <h:outputText value="#{item.requestDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="订单日期" sortBy="#{item.partOrderDate}" filterBy="#{item.partOrderDate}" filterMatchMode="GTE">
                            <h:outputText value="#{item.partOrderDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>


                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" action="#{zkbPartOrderController.createAction}"  disabled="#{empty zkbPartOrderController.selectionTenantInfo}"/>
                            <p:commandButton id="editButton" style="margin-left: 0px" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" action="#{zkbPartOrderController.editAction}" disabled="#{empty zkbPartOrderController.selected.id}"/>
                            <p:commandButton id="deleteButton" style="margin-left: 0px" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{zkbPartOrderController.delete}" update=":zkbPartOrderListForm:datalist, :growl" disabled="#{empty zkbPartOrderController.selected.id}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>


                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>

        </div>
    </ui:define>
</ui:composition>
