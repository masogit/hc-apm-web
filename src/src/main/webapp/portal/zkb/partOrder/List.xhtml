<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="额度申请"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="zkbPartOrderListForm">
                    <h:panelGrid id="tenantInfoGrid" columns="4" style="margin-bottom:10px" cellpadding="5" rendered="#{!userContextService.zkbUser}">
                        <p:outputLabel value="#{msg.TenantInfo}*:"/>
                        <p:selectOneMenu style="transform: scale(1.2)"  id="selectionTenantInfo" value="#{zkbPartOrderController.selectionTenantInfo}" disabled="#{userContextService.zkbUser}">
                            <p:ajax listener="#{zkbPartOrderController.tenantInfoSelect}" update="datalist :zkbPartOrderListForm"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{zkbPartOrderController.tenantInfoList}" var="v">
                                <f:selectItem itemLabel="#{v.name}" itemValue="#{v.uid}"/>
                            </c:forEach>
                        </p:selectOneMenu>
                    </h:panelGrid>

                    <h:panelGrid id="buttonSet" columns="20" cellpadding="5">
                        <p:commandButton value="待办"  process="@this" update="datalist buttonSet" disabled="#{empty zkbPartOrderController.queryStatus}" rendered="true" action="List.xhtml?faces-redirect=true" />
                        <p:commandButton value="已申请"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'Requested'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=Requested" />
                        <p:commandButton value="技术支持审批通过"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'TechnicalAccept'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=TechnicalAccept" />
                        <p:commandButton value="技术支持审批拒绝"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'TechnicalReject'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=TechnicalReject" />
                        <p:commandButton value="经理审批通过"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'ManageAccept'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=ManageAccept" />
                        <p:commandButton value="经理审批拒绝"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'ManageReject'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=ManageReject" />
                        <p:commandButton value="已下单"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'UnOrdered'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=UnOrdered" />
                        <p:commandButton value="400开单拒绝"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'UnOrderReject'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=UnOrderReject" />
                        <p:commandButton value="已下单"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'Ordered'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=Ordered" />
                        <p:commandButton value="400下单拒绝"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'OrderedReject'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=OrderedReject" />
                        <p:commandButton value="已归还"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'Returned'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=Returned" />
                        <p:commandButton value="已关单"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'Closed'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=Closed" />
                        <p:commandButton value="已取消"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'Cleaned'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="List.xhtml?faces-redirect=true&amp;queryStatus=Cleaned" />
                        <p:commandButton value="全部"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'all'}" rendered="true" action="List.xhtml?faces-redirect=true&amp;queryStatus=all" />

                    </h:panelGrid>
                    <p:dataTable id="datalist" value="#{zkbPartOrderController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbPartOrderController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500" >

                        <p:ajax event="rowSelect" listener="#{zkbPartOrderController.prepareEdit}" update="deleteButton editButton"/>
                        <p:ajax event="filter" listener="#{zkbPartOrderController.onFilter}" />

                        <p:column headerText="#{msg.zkbContact_tenant}">
                            <h:outputText value="#{zkbPartOrderController.getTenantInfo(item.tenantUID).name}"/>
                        </p:column>

                        <p:column headerText="申请编号" filterBy="#{item.partOrderNo}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.partOrderNo}"/>
                        </p:column>
                         <p:column headerText="订单类型" filterBy="#{item.orderType}"  filterMatchMode="LIKE">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbPartOrderType',item.orderType)}"/>
                             <f:facet name="filter">
                                 <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                     <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                     <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPartOrderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                 </p:selectOneMenu>
                             </f:facet>
                        </p:column>

                        <p:column headerText="区域" filterBy="#{item.region}"  filterMatchMode="EQ">
                            <h:outputText value="#{item.region}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>

                        <p:column headerText="设备名称" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.assetInfo.name}" />
                        </p:column>

                        <p:column headerText="Sys ID" filterBy="#{item.assetInfo.systemId}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.systemId}"/>
                        </p:column>
                        <p:column headerText="设备类型" filterBy="#{item.assetInfo.assetGroup}"  filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetInfo.assetGroup)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="派工单号" filterBy="#{item.srNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.srNum}"/>
                        </p:column>

                        <p:column headerText="合同号" filterBy="#{item.contractNo}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.contractNo}"/>
                        </p:column>
                        <p:column headerText="产品型号" filterBy="#{item.productNumber}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.productNumber}"/>
                        </p:column>

                        <p:column headerText="申请人" filterBy="#{item.requestUser}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.requestUser}"/>
                        </p:column>
                        <p:column headerText="审批人" filterBy="#{item.onlineEngine.name}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.onlineEngine.name}"/>
                        </p:column>
                        <p:column headerText="当前步骤" filterBy="#{item.currentStep}"  filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbPoSteps',item.currentStep)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoSteps')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="状态" filterBy="#{item.status}"  filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbPoStatus',item.status)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                       <!-- <p:column headerText="申请时间"  filterMatchMode="GTE">
                            <h:outputText value="#{item.requestDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>-->

                        <p:column headerText="申请日期"  filterMatchMode="GTE">
                            <h:outputText value="#{item.requestDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>


                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" action="#{zkbPartOrderController.createAction}"  disabled="#{empty zkbPartOrderController.selectionTenantInfo}"/>
                            <p:commandButton id="editButton" style="margin-left: 0px" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" action="#{zkbPartOrderController.editAction}" disabled="#{empty zkbPartOrderController.selected.id}"/>
                            <p:commandButton id="deleteButton" style="margin-left: 0px" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{zkbPartOrderController.delete}" update=":zkbPartOrderListForm:datalist, :growl" disabled="#{empty zkbPartOrderController.selected.id}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>


                        </f:facet>
                    </p:dataTable>
                </h:form>

            </div>

        </div>
    </ui:define>
</ui:composition>
