<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="额度申请"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="zkbPartOrderListForm">
                    <h:panelGrid id="tenantInfoGrid" columns="4" style="margin-bottom:10px" cellpadding="5" rendered="#{!userContextService.zkbUser}">
                        <p:outputLabel value="#{msg.TenantInfo}*:"/>
                        <p:selectOneMenu style="transform: scale(1.2)"  id="selectionTenantInfo" value="#{zkbPartOrderController.selectionTenantInfo}" disabled="#{userContextService.zkbUser}">
                            <p:ajax listener="#{zkbPartOrderController.tenantInfoSelect}" update="datalist :zkbPartOrderListForm"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{zkbPartOrderController.tenantInfoList}" var="v">
                                <f:selectItem itemLabel="#{v.name}" itemValue="#{v.uid}"/>
                            </c:forEach>
                        </p:selectOneMenu>
                    </h:panelGrid>

                    <h:panelGrid id="buttonSet" columns="20" cellpadding="5">
                        <p:commandButton value="待办"  process="@this" update="datalist buttonSet" disabled="#{empty zkbPartOrderController.queryStatus}" rendered="true" action="#{zkbPartOrderController.queryListByStatus('')}" />
                        <p:commandButton value="待技术支持审批"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'TechnicalPending'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="#{zkbPartOrderController.queryListByStatus('TechnicalPending')}" />
                        <p:commandButton value="待经理审批"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'ManagePending'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="#{zkbPartOrderController.queryListByStatus('ManagePending')}" />
                        <p:commandButton value="待总监审批"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'DirectorPending'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="#{zkbPartOrderController.queryListByStatus('DirectorPending')}" />
                        <p:commandButton value="待开单"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'OrderExtraPending'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="#{zkbPartOrderController.queryListByStatus('OrderExtraPending')}" />
                        <p:commandButton value="待下单"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'OrderPending'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="#{zkbPartOrderController.queryListByStatus('OrderPending')}" />
                        <p:commandButton value="待归还"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'ReturnPending'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="#{zkbPartOrderController.queryListByStatus('ReturnPending')}" />
                        <p:commandButton value="待审核"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'ClosePending'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="#{zkbPartOrderController.queryListByStatus('ClosePending')}" />
                        <p:commandButton value="完成"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'Complete'}" rendered="#{zkbPartOrderController.showStatusBtn}" action="#{zkbPartOrderController.queryListByStatus('Complete')}" />
                        <p:commandButton value="全部"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'all'}" rendered="true" action="#{zkbPartOrderController.queryListByStatus('all')}" />
                        <p:commandButton value="待上传探头说明函"  process="@this" update="datalist buttonSet" disabled="#{zkbPartOrderController.queryStatus eq 'letter'}" style="color: white ;font-weight: bolder;background: #088A29" rendered="#{zkbPartOrderController.showStatusBtn}" action="#{zkbPartOrderController.queryListByStatus('letter')}" />

                        <p:commandLink id="btnRemindLetter" immediate="false" process="@this" style="text-align: right" oncomplete="PF('zkbVacationDlg').show()" rendered="#{zkbPartOrderController.vacationBtn}">
                            <h:outputText value="是否休假" />
                        </p:commandLink>
                    </h:panelGrid>

                    <p:dataTable id="datalist" value="#{zkbPartOrderController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbPartOrderController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500" >

                        <p:ajax event="rowSelect" listener="#{zkbPartOrderController.prepareEdit}" update="deleteButton editButton copyButton"/>
                        <p:ajax event="rowDblselect" listener="#{zkbPartOrderController.doubleClick}" oncomplete="openViewWindow(xhr, status, args)"/>
                        <p:ajax event="filter" listener="#{zkbPartOrderController.onFilter}" />

                        <p:column headerText="#{msg.zkbContact_tenant}">
                            <h:outputText value="#{zkbPartOrderController.getTenantInfo(item.tenantUID).name}"/>
                        </p:column>

                        <p:column headerText="申请编号" filterBy="#{item.partOrderNo}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.partOrderNo}"/>
                        </p:column>
                        <p:column headerText="申请类型" filterBy="#{item.scoreFlag}"  filterMatchMode="LIKE">
                            <h:outputText value="#{zkbPartOrderController.scoreFlagField(item.scoreFlag)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItem itemLabel="积分申请" itemValue="t"/>
                                    <f:selectItem itemLabel="名额申请" itemValue="f"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                         <p:column headerText="订单类型" filterBy="#{item.orderType}"  filterMatchMode="LIKE">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbPartOrderType',item.orderType)}"/>
                             <f:facet name="filter">
                                 <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                     <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                     <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPartOrderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                 </p:selectOneMenu>
                             </f:facet>
                        </p:column>

                        <p:column headerText="区域" filterBy="#{item.region}"  filterMatchMode="EQ">
                            <h:outputText value="#{item.region}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>

                        <p:column headerText="设备名称" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.assetInfo.name}" />
                        </p:column>

                        <p:column headerText="Sys ID" filterBy="#{item.assetInfo.systemId}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.systemId}"/>
                        </p:column>
                        <p:column headerText="设备类型" filterBy="#{item.assetInfo.assetGroup}"  filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetInfo.assetGroup)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="报修单号" filterBy="#{item.srNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.srNum}"/>
                        </p:column>

                        <p:column headerText="合同号" filterBy="#{item.contractNo}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.contractNo}"/>
                        </p:column>
                        <p:column headerText="产品型号" filterBy="#{item.productNumber}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.productNumber}"/>
                        </p:column>

                        <p:column headerText="申请人" filterBy="#{item.requestUser}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.requestUser}"/>
                        </p:column>
                        <p:column headerText="审批人" filterBy="#{item.techAuditer}"  filterMatchMode="LIKE">
                            <h:outputText value="#{zkbPartOrderController.techAuditField(item)}"/>
                        </p:column>
                        <!--rendered="#{!zkbPartOrderController.showStatusBtn}"-->
                        <p:column headerText="当前步骤" filterBy="#{item.currentStep}"  filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbPoSteps',item.currentStep)}"/>
                            <f:facet name="filter">
 0                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoSteps')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="状态" filterBy="#{item.status}"  filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbPoStatus',item.status)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                       <!-- <p:column headerText="申请时间"  filterMatchMode="GTE">
                            <h:outputText value="#{item.requestDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>-->

                        <p:column headerText="申请日期"  filterMatchMode="GTE">
                            <h:outputText value="#{item.requestDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>


                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" action="#{zkbPartOrderController.createAction}"  disabled="#{empty zkbPartOrderController.selectionTenantInfo}" rendered="#{userContextService.zkbUser}"/>
                            <p:commandButton id="editButton" style="margin-left: 0px" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" action="#{zkbPartOrderController.editAction}" disabled="#{empty zkbPartOrderController.selected.id}"/>
                            <p:commandButton id="copyButton" style="margin-left: 0px" icon="ui-icon-content-copy" class="btn btn-sm btn-gray" title="#{msg.copy}" action="#{zkbPartOrderController.copyAction}" disabled="#{(empty zkbPartOrderController.selected.id) or !(zkbPartOrderController.selected.currentStep eq 'Complete')}" rendered="#{userContextService.zkbUser}"/>
                            <p:commandButton id="deleteButton" style="margin-left: 0px" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{zkbPartOrderController.delete}" update=":zkbPartOrderListForm:datalist, :growl" disabled="#{zkbPartOrderController.operateDelete}" rendered="#{!userContextService.zkbUser and zkbPartOrderController.canDelete}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                            <p:commandButton id="exportButton" ajax="false" title="#{msg.exportToXLS}" actionListener="#{zkbPartOrderController.exportAll}" icon="ui-icon-arrowstop-1-s">
                                <p:fileDownload value="#{zkbPartOrderController.exportFile}"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <p:dialog id="zkbVacationDlg" widgetVar="zkbVacationDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="是否休假" height="300">

                    <h:form id="zkbVacationForm">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">是否休假：</label>
                                <p:selectOneMenu id="isVacation" value="#{zkbPartOrderController.isVacation}" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItem itemLabel="是" itemValue="t"/>
                                    <f:selectItem itemLabel="否" itemValue="f"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </p:panelGrid>
                        <br/>
                        <p:commandButton validateClient="true" value="#{msg.Confirm}" action="#{zkbPartOrderController.saveVacation}" oncomplete="PF('zkbVacationDlg').hide()" update=":growl :zkbVacationForm" icon="ui-icon-check" />
                        <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbVacationDlg').hide()"/>
                    </h:form>
                </p:dialog>
            </div>
        </div>
        <script>
            function openViewWindow(xhr, status, args) {
                window.document.body.innerHTML = '加载中...';
                window.location.href = args.url;
            }
        </script>
    </ui:define>
</ui:composition>
