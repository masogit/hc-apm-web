<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{zkbPartOrderAuditController.CRUDActionName} #{msg.zkbPartOrder}"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbHeadEditForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">订单类型*</label>
                        <p:selectOneMenu id="orderType" value="#{zkbPartOrderAuditController.orderType}" required="true" requiredMessage="#{msg.zkbPartOrder_orderType} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItem itemLabel="备件申请" itemValue="Parts" />
                            <f:selectItem itemLabel="探头申请" itemValue="Probe" />
                            <f:selectItem itemLabel="人工申请" itemValue="Artificial" />
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
            </h:form>
        </div>
        <div class="ui-g-12 card">
                <h:form id="zkbwkEditForm">

                    <p:fieldset id="zkbWorkFlowFieldset" legend="工单信息" >
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">工单号</label>
                                <p:inputText id="qrCode" value="#{zkbPartOrderAuditController.selectedWorkFlow.serviceRequest.srNum}" maxlength="100" required="false"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset id="zkbContractFieldset" legend="合同信息" >
                       
                    </p:fieldset>
                </h:form>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbPartOrderEditForm">
                <p:fieldset id="zkbPartOrderFieldset" legend="额度信息" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_region}*</label>
                            <p:selectOneMenu id="region" value="#{zkbPartOrderAuditController.selected.region}" required="true" requiredMessage="#{msg.zkbContract_region} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">订单日期*</label>
                            <p:calendar timeZone="GMT+8"  id="startDate" pattern="yyyy/MM/dd" value="#{zkbPartOrderAuditController.selected.partOrderDate}" required="true" requiredMessage="#{msg.zkbContract_startDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">申请人*</label>
                            <p:inputText id="requestUser" value="#{zkbPartOrderAuditController.selected.requestUser}" required="true" requiredMessage="#{msg.zkbContract_contractNo} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人电话*</label>
                            <p:inputText id="requestPhone" value="#{zkbPartOrderAuditController.selected.requestPhone}" required="true" requiredMessage="#{msg.zkbContract_contractNo} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间*</label>
                            <p:calendar timeZone="GMT+8"  id="requestDate" pattern="yyyy/MM/dd" value="#{zkbPartOrderAuditController.selected.requestDate}" required="true" requiredMessage="#{msg.zkbContract_startDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">医院名称</label>
                            <p:inputText id="hospitalName" value="#{zkbPartOrderAuditController.selected.hospitalName}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人姓名</label>
                            <p:inputText id="hospitalRepairer" value="#{zkbPartOrderAuditController.selected.hospitalRepairer}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">产品型号</label>
                            <p:inputText id="productNumber" value="#{zkbPartOrderAuditController.selected.productNumber}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">软件版本</label>
                            <p:inputText id="softwareVersion" value="#{zkbPartOrderAuditController.selected.softwareVersion}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">故障描述</label>
                            <p:inputText id="faultDescription" value="#{zkbPartOrderAuditController.selected.faultDescription}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">订单标注</label>
                            <p:inputText id="orderAnnotation" value="#{zkbPartOrderAuditController.selected.orderAnnotation}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">发生问题的order number</label>
                            <p:inputText id="problemOrderNumber" value="#{zkbPartOrderAuditController.selected.problemOrderNumber}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">是否为紧急订单</label>
                            <p:selectOneRadio value="#{zkbPartOrderAuditController.selected.urgentOrder}">
                                <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                                <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                            </p:selectOneRadio>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">订单紧急的原因</label>
                            <p:inputText id="urgencyReasons" value="#{zkbPartOrderAuditController.selected.urgencyReasons}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">订单数量</label>
                            <p:inputText id="qty" value="#{zkbPartOrderAuditController.selected.qty}" required="true"  requiredMessage="订单数量 #{msg.ValidationRequire}" disabled="true" />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset id="zkbPartOrderDetailFieldset" legend="额度明细" >
                    <p:dataTable id="zkbDetailDatalist" value="#{zkbPartOrderAuditController.selected.zkbPartOrderItems}" var="item"
                                 widgetVar="zkbContractCourseDatalist" selectionMode="single"
                                 lazy="false" paginator="true" rowKey="#{item.partNo}" sortMode="single" sortOrder="ascending" sortBy="#{item.index}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                        <p:column headerText="配件号">
                            <h:outputText value="#{item.partNo}"/>
                        </p:column>
                        <p:column headerText="配件名称">
                            <h:outputText value="#{item.partName}"/>
                        </p:column>
                        <p:column headerText="配件数量">
                            <h:outputText value="#{item.partQty}"/>
                        </p:column>
                        <p:column headerText="配件SN(序列号)">
                            <h:outputText value="#{item.serialNumber}"/>
                        </p:column>
                        <p:column headerText="备注（说明是否DOA或者Short life）">
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">

                        </f:facet>
                    </p:dataTable>
                </p:fieldset>
                <p:fieldset id="techFieldset" legend="技术支持审批" >
                </p:fieldset>
                <p:fieldset id="managementFieldset" legend="区域经理审批" >
                </p:fieldset>
                <p:fieldset id="orderedFieldset" legend="订货信息" >
                </p:fieldset>
                <p:fieldset id="returnFieldset" legend="归还信息" >
                </p:fieldset>
                <p:fieldset id="closeFieldset" legend="关单信息" >
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" action="#{zkbPartOrderAuditController.save}" update=":growl" icon="ui-icon-check" />
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" action="List?faces-redirect=true" />
            </h:form>
            <ui:include src="PartOrderItem.xhtml"/>
        </div>
    </ui:define>
</ui:composition>
