<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{zkbPartOrderAuditController.CRUDActionName} #{msg.zkbPartOrder}"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbHeadEditForm">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">订单类型*</label>
                        <p:selectOneMenu id="orderType" value="#{zkbPartOrderAuditController.orderType}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_orderType} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPartOrderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{zkbPartOrderEditController.orderType eq 'Artificial'}">
                        <label class="label">机型*</label>
                        <p:selectOneMenu id="artificialType" value="#{zkbPartOrderAuditController.artificialType}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_artificialType} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoArtificialType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">申请号*</label>
                        <p:inputText id="partOrderNo" value="#{ zkbPartOrderAuditController.selected.partOrderNo}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">当前状态</label>
                        <p:inputText id="currentStatus" value="#{fieldMsg.fieldValue('zkbPoStatus', zkbPartOrderAuditController.selected.status)}" disabled="true"/>
                    </h:panelGroup>
                </p:panelGrid>
            </h:form>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbPartOrderEditForm" >
                <p:fieldset id="zkbPartOrderFieldset" legend="额度信息" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                        <h:panelGroup rendered="#{zkbPartOrderAuditController.orderType eq 'Parts' and zkbPartOrderAuditController.selected.assetInfo.assetGroup eq 1}">
                            <label class="label">设备类型（DI）*</label>
                            <p:selectOneMenu id="assetTypeDi" value="#{zkbPartOrderEditController.selected.assetTypeDi}" required="true" requiredMessage="#设备类型（DI） #{msg.ValidationRequire}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="CT" itemValue="CT"/>
                                <f:selectItem itemLabel="XR" itemValue="XR"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_region}*</label>
                            <p:selectOneMenu id="region" value="#{zkbPartOrderAuditController.selected.region}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_region} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                      <!--  <h:panelGroup>
                            <label class="label">订单日期*</label>
                            <p:calendar timeZone="GMT+8"  id="startDate" pattern="yyyy/MM/dd" readonly="true" value="#{zkbPartOrderAuditController.selected.partOrderDate}" required="true" requiredMessage="#{msg.zkbPartOrder_partOrderDate} #{msg.ValidationRequire}" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>-->

                        <h:panelGroup>
                            <label class="label">申请人*</label>
                            <p:inputText id="requestUser" value="#{zkbPartOrderAuditController.selected.requestUser}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_requestUser} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人电话*</label>
                            <p:inputText id="requestPhone" value="#{zkbPartOrderAuditController.selected.requestPhone}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_requestPhone} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间*</label>
                            <p:calendar timeZone="GMT+8"  id="requestDate" pattern="yyyy/MM/dd" value="#{zkbPartOrderAuditController.selected.requestDate}" readonly="true" required="true" requiredMessage="#{msg.zkbPartOrder_requestDate} #{msg.ValidationRequire}" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院名称</label>
                            <p:inputText id="hospitalName" value="#{zkbPartOrderAuditController.selected.hospitalName}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人姓名</label>
                            <p:inputText id="hospitalRepairer" value="#{zkbPartOrderAuditController.selected.hospitalRepairer}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人电话</label>
                            <p:inputText id="hospitalRepairerPhone" value="#{zkbPartOrderAuditController.selected.hospitalRepairerPhone}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">产品型号</label>
                            <p:inputText id="productNumber" value="#{zkbPartOrderAuditController.selected.productNumber}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">软件版本</label>
                            <p:inputText id="softwareVersion" value="#{zkbPartOrderAuditController.selected.softwareVersion}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">故障描述*</label>
                            <p:inputTextarea id="faultDescription"  value="#{zkbPartOrderEditController.selected.faultDescription}" maxlength="255" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">订单标注</label>
                            <p:inputText id="orderAnnotation" value="#{zkbPartOrderAuditController.selected.orderAnnotation}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">发生问题的order number</label>
                            <p:inputText id="problemOrderNumber" value="#{zkbPartOrderAuditController.selected.problemOrderNumber}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">是否为紧急订单</label>
                            <p:selectOneMenu id="urgentOrder" value="#{zkbPartOrderAuditController.selected.urgentOrder}" disabled="true" >
                                <p:ajax event="change" update="urgencyReasons" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="紧急" itemValue="t"/>
                                <f:selectItem itemLabel="不紧急" itemValue="f"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderEditController.selected.urgentOrder eq 't'}">
                            <label class="label">订单紧急的原因</label>
                            <p:selectOneMenu id="urgencyReasons" value="#{zkbPartOrderAuditController.selected.urgencyReasons}" disabled="true" >
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="设备已宕机" itemValue="0"/>
                                <f:selectItem itemLabel="场地维修有其他第三方竞争" itemValue="1"/>
                                <f:selectItem itemLabel="其他特殊原因（需注明在备注栏）" itemValue="2"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">收货人*</label>
                            <p:inputText id="receiver" value="#{zkbPartOrderAuditController.selected.receiver}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">收货人电话*</label>
                            <p:inputText id="receiverPhone" value="#{zkbPartOrderAuditController.selected.receiverPhone}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">收货地址*</label>
                            <p:inputText id="receiverAddress" value="#{zkbPartOrderAuditController.selected.receiverAddress}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial'}">
                            <label class="label">ZKB工程师姓名*</label>
                            <p:inputText id="zkbEngineerName" value="#{zkbPartOrderAuditController.selected.zkbEngineerName}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial'}">
                            <label class="label">ZKB工程师电话*</label>
                            <p:inputText id="zkbEngineerPhone" value="#{zkbPartOrderAuditController.selected.zkbEngineerPhone}" disabled="true"/>
                        </h:panelGroup>
                      <!--  <h:panelGroup>
                            <label class="label">在线工程师*</label>
                            <p:inputText id="onlineEngineer" value="#{zkbPartOrderAuditController.selected.onlineEngine.name}" disabled="true" />
                        </h:panelGroup>-->
                        <h:panelGroup>
                            <label class="label">订单数量</label>
                            <p:inputText id="qty" value="#{zkbPartOrderAuditController.selected.qty}" required="true" readonly="true" requiredMessage="订单数量 #{msg.ValidationRequire}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">剩余数量</label>
                            <p:inputText id="remainQty" value="#{zkbPartOrderAuditController.selected.remainQty}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputText id="remark" value="#{zkbPartOrderAuditController.selected.remark}" disabled="true"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid rendered="#{!(zkbPartOrderEditController.orderType eq 'Artificial')}">
                        <h:panelGroup>
                            <p:dataList id="uploadList" value="#{zkbPartOrderAuditController.v2_blobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">附件列表</f:facet>
                                <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>
                            </p:dataList>

                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset id="zkbPartOrderDetailFieldset" legend="额度明细"  rendered="#{zkbPartOrderAuditController.orderType eq 'Parts' or zkbPartOrderEditController.orderType eq 'Tool'}">
                    <p:dataTable id="zkbDetailDatalist" value="#{zkbPartOrderAuditController.selected.zkbPartOrderItems}" var="item"
                                 widgetVar="zkbContractCourseDatalist" selectionMode="single"
                                 lazy="false" paginator="true" rowKey="#{item.partNo}" sortMode="single" sortOrder="ascending" sortBy="#{item.index}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                        <p:column headerText="配件号">
                            <h:outputText value="#{item.partNo}"/>
                        </p:column>
                        <p:column headerText="配件名称">
                            <h:outputText value="#{item.partName}"/>
                        </p:column>
                        <p:column headerText="配件数量">
                            <h:outputText value="#{item.partQty}"/>
                        </p:column>
                        <p:column headerText="配件SN(序列号)">
                            <h:outputText value="#{item.serialNumber}"/>
                        </p:column>
                        <p:column headerText="备注（说明是否DOA或者Short life）">
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">

                        </f:facet>
                    </p:dataTable>
                </p:fieldset>
                <p:fieldset id="zkbPartOrderProbeFieldset" legend="探头明细" rendered="#{zkbPartOrderAuditController.orderType eq 'Probe'}" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">探头号</label>
                            <p:inputText id="catModel" value="#{zkbPartOrderAuditController.selected.catNo}" disabled="true" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">探头型号</label>
                            <p:autoComplete dropdown="true" value="#{zkbPartOrderAuditController.selected.zkbPartOrderCat}"  scrollHeight="300" forceSelection="true" required="true" disabled="true"
                                            completeMethod="#{zkbPartOrderAuditController.autoCompleteCat}" var="t" itemLabel="#{t.catModel}" itemValue="#{t}" converter="zkbPartOrderCatConverter">
                            </p:autoComplete>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">价值类型</label>
                            <p:inputText id="valueType" value="#{fieldMsg.fieldValue('zkbPoValueType',zkbPartOrderAuditController.selected.zkbPartOrderCat.valueType)}" disabled="true" />
                            <label style="color: red">#{zkbPartOrderAuditController.valueTypeTips}</label>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">旧探头SN号输入框</label>
                            <p:inputText id="oldCatSn" value="#{zkbPartOrderAuditController.selected.oldCatSn}" disabled="true" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">数量</label>
                            <p:inputText id="catNum" value="#{zkbPartOrderAuditController.selected.catNum}" disabled="true" />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset id="techFieldset" legend="技术支持审批" rendered="#{zkbPartOrderAuditController.showTech}">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.currentStep eq 'TechnicalPending')}">
                            <label class="label">技术支持审批时间*</label>
                            <p:calendar timeZone="GMT+8"  id="techAuditDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbPartOrderAuditController.selected.techAuditDate}" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">技术支持审批备注</label>
                            <p:inputTextarea id="techRemark" value="#{zkbPartOrderAuditController.selected.techRemark}" rows="5" cols="30" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'TechnicalPending')}">
                            </p:inputTextarea>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset id="managementFieldset" legend="区域经理审批" rendered="#{zkbPartOrderAuditController.showManage}">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.currentStep eq 'ManagePending')}">
                            <label class="label">区域经理审批时间*</label>
                            <p:calendar timeZone="GMT+8"  id="manageAuditDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbPartOrderAuditController.selected.manageAuditDate}" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">区域经理审批备注</label>
                            <p:inputTextarea id="manageRemark" value="#{zkbPartOrderAuditController.selected.manageRemark}" rows="5" cols="30" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'ManagePending')}">
                            </p:inputTextarea>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset id="orderedFieldset" legend="订货信息" rendered="#{zkbPartOrderAuditController.showOrder}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">SR#*</label>
                            <p:inputText id="srNo" value="#{zkbPartOrderAuditController.selected.srNo}" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}" required="#{!(zkbPartOrderAuditController.selected.orderType eq 'Tool')}" requiredMessage="#{msg.zkbPartOrder_srNo} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">Act#*</label>
                            <p:inputText id="activityNo" value="#{zkbPartOrderAuditController.selected.activityNo}" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_activityNo} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">Order#*</label>
                            <p:inputText id="orderNo" value="#{zkbPartOrderAuditController.selected.orderNo}" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_orderNo} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial'}">
                            <label class="label">GE工程师姓名*</label>
                            <p:inputText id="geEngineerName" value="#{zkbPartOrderAuditController.selected.geEngineerName}" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_geEngineerName} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial'}">
                            <label class="label">GE工程师电话*</label>
                            <p:inputText id="geEngineerPhone" value="#{zkbPartOrderAuditController.selected.geEngineerPhone}" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_geEngineerPhone} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <!--<h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial' and zkbPartOrderAuditController.selected.artificialType eq '1'}">-->
                        <h:panelGroup rendered="false">
                            <label class="label">是否扣除名额</label>
                            <p:selectOneMenu id="whetherDeduct" value="#{zkbPartOrderAuditController.selected.whetherDeduct}" required="true" requiredMessage="#{msg.zkbPartOrder_whetherDeduct} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="是" itemValue="t"/>
                                <f:selectItem itemLabel="否" itemValue="f"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputTextarea id="orderedRemark" value="#{zkbPartOrderAuditController.selected.orderedRemark}"  rows="5" cols="30" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}">
                            </p:inputTextarea>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:dataTable id="zkbOrderDatalist" value="#{zkbPartOrderAuditController.selected.zkbPartOrderItems}" var="item"
                                 widgetVar="zkbContractCourseDatalist" selectionMode="single"
                                 lazy="false" paginator="true" rowKey="#{item.partNo}" sortMode="single" sortOrder="ascending" sortBy="#{item.index}"
                                 paginatorTemplate="" rows="20" emptyMessage="#{msg.noRecordFound}" rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Parts' or zkbPartOrderAuditController.selected.orderType eq 'Tool'}">
                        <p:column headerText="配件号">
                            <p:inputText value="#{item.partNo}" readonly="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}" />
                        </p:column>
                        <p:column headerText="配件名称">
                            <p:inputText value="#{item.partName}" readonly="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}" />
                        </p:column>
                        <p:column headerText="配件数量">
                            <h:outputText value="#{item.partQty}"/>
                        </p:column>
                        <p:column headerText="配件SN(序列号)">
                            <h:outputText value="#{item.serialNumber}"/>
                        </p:column>
                        <p:column headerText="价格">
                            <p:inputNumber value="#{item.price}" readonly="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}" > </p:inputNumber>
                        </p:column>
                        <p:column headerText="备注（说明是否DOA或者Short life）">
                            <p:inputText value="#{item.remark}" readonly="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}" />
                        </p:column>
                    </p:dataTable>
                </p:fieldset>
                <p:fieldset id="orderedCancelFieldset" legend="订货信息" rendered="#{zkbPartOrderAuditController.selected.status eq 'OrderedReject'}">
                    <h:panelGroup>
                        <label class="label">拒绝原因*</label>
                        <p:inputTextarea id="orderedCancelRemark" value="#{zkbPartOrderAuditController.selected.orderedRemark}"  rows="5" cols="30" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag)}">
                        </p:inputTextarea>
                    </h:panelGroup>
                </p:fieldset>
                <p:fieldset id="returnFieldset" legend="归还信息" rendered="#{zkbPartOrderAuditController.showReturn}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Probe'}">
                        <h:panelGroup>
                            <label class="label">归还类型*</label>
                            <p:selectOneMenu id="returnType" value="#{zkbPartOrderAuditController.selected.returnType}" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'ReturnPending' and zkbPartOrderAuditController.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_returnType} #{msg.ValidationRequire}" >
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{zkbPartOrderAuditController.returnTypeList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">归还数量*</label>
                            <p:inputText id="returnQty" value="#{zkbPartOrderAuditController.selected.returnQty}" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'ReturnPending' and zkbPartOrderAuditController.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_returnType} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">运单号*</label>
                            <p:inputText id="waybillNo" value="#{zkbPartOrderAuditController.selected.waybillNo}" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'ReturnPending' and zkbPartOrderAuditController.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_waybillNo} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">归还日期*</label>
                            <p:calendar timeZone="GMT+8"  id="returnDate" pattern="yyyy/MM/dd" value="#{zkbPartOrderAuditController.selected.returnDate}" showOn="button" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'ReturnPending' and zkbPartOrderAuditController.canEditFlag)}" Input="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.zkbPartOrder_returnDate} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">新探头SN编号*</label>
                            <p:inputText id="newCatSn" value="#{zkbPartOrderAuditController.selected.newCatSn}" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'ReturnPending' and zkbPartOrderAuditController.canEditFlag)}" required="true" requiredMessage="新探头SN编号 #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">归还备注</label>
                            <p:inputTextarea id="returnRemark" value="#{zkbPartOrderAuditController.selected.returnRemark}"  rows="5" cols="30" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'ReturnPending' and zkbPartOrderAuditController.canEditFlag)}">
                            </p:inputTextarea>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:dataTable id="zkbReturnDatalist" value="#{zkbPartOrderAuditController.zkbPartOrderReturnList}" var="item" rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Parts' or zkbPartOrderAuditController.selected.orderType eq 'Tool'}"
                                 widgetVar="zkbReturnDatalist" selectionMode="single" selection="#{zkbPartOrderAuditController.zkbPartOrderReturn}"
                                 lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}" >

                        <p:ajax event="rowSelect" update=":zkbPartOrderEditForm:zkbReturnDatalist:editReturnButton :zkbPartOrderEditForm:zkbReturnDatalist:deleteReturnButton"/>

                        <p:column headerText="运单号">
                            <h:outputText value="#{item.waybillNo}"/>
                        </p:column>
                        <p:column headerText="归还日期">
                            <h:outputText value="#{item.returnDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="配件号">
                            <h:outputText value="#{item.partNo}"/>
                        </p:column>
                        <p:column headerText="归还类型">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbPoReturnType',item.returnType)}"/>
                        </p:column>
                        <p:column headerText="Part Serial Number" rendered="#{zkbPartOrderAuditController.orderType eq 'Parts'}">
                            <h:outputText value="#{item.partSerialNumber}"/>
                        </p:column>
                        <p:column headerText="故障描述" rendered="#{zkbPartOrderAuditController.orderType eq 'Parts'}">
                            <h:outputText value="#{item.partQualityIssue}"/>
                        </p:column>
                        <p:column headerText="归还数量">
                            <h:outputText value="#{item.qty}"/>
                        </p:column>
                        <p:column headerText="备注">
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton immediate="false" process="@this" id="createReturnButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{zkbPartOrderAuditController.prepareReturnCreate}" update=":growl :zkbPartOrderReturnEditDlg" oncomplete="PF('zkbPartOrderReturnEditDlg').show()" rendered="#{zkbPartOrderAuditController.selected.currentStep eq 'ReturnPending' and zkbPartOrderAuditController.canEditFlag}" />
                            <p:commandButton immediate="false" process="@this" id="editReturnButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbPartOrderAuditController.prepareReturnEdit}" update=":growl :zkbPartOrderReturnEditDlg"  oncomplete="PF('zkbPartOrderReturnEditDlg').show()"  disabled="#{empty zkbPartOrderAuditController.zkbPartOrderReturn}" rendered="#{zkbPartOrderAuditController.selected.currentStep eq 'ReturnPending' and zkbPartOrderAuditController.canEditFlag}"/>
                            <p:commandButton immediate="false" process="@this"  id="deleteReturnButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbPartOrderAuditController.deleteReturn}" update=":growl :zkbPartOrderEditForm:zkbReturnDatalist" disabled="#{empty zkbPartOrderAuditController.zkbPartOrderReturn}" rendered="#{zkbPartOrderAuditController.selected.currentStep eq 'ReturnPending' and zkbPartOrderAuditController.canEditFlag}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>
                <p:fieldset id="closeFieldset" legend="关单信息" rendered="#{zkbPartOrderAuditController.showClosed}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">关单备注</label>
                            <p:inputTextarea id="closedRemark" value="#{zkbPartOrderAuditController.selected.closedRemark}" rows="5" cols="30" disabled="#{!(zkbPartOrderAuditController.selected.currentStep eq 'ClosePending' and zkbPartOrderAuditController.canEditFlag)}">
                            </p:inputTextarea>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="true" value="保存" action="#{zkbPartOrderAuditController.save}" update=":growl" icon="ui-icon-check" rendered="false" />
                <p:commandButton validateClient="true" value="提交" action="#{zkbPartOrderAuditController.normalNext}" update=":growl" icon="ui-icon-check" rendered="#{zkbPartOrderAuditController.showBtn eq '1' and zkbPartOrderAuditController.canEditFlag}"/>
                <p:commandButton immediate="false" process="@this" value="拒绝" update=":growl :zkbCancelReasonDlg" oncomplete="PF('zkbCancelReasonDlg').show()" icon="ui-icon-check" rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial' and zkbPartOrderAuditController.selected.currentStep eq 'OrderPending' and zkbPartOrderAuditController.canEditFlag}"/>
               <p:commandButton validateClient="true" value="审批通过" action="#{zkbPartOrderAuditController.acceptNext}" update=":growl" icon="ui-icon-check" rendered="#{(zkbPartOrderAuditController.showBtn eq '0') and zkbPartOrderAuditController.canEditFlag}"/>
                <p:commandButton validateClient="true" value="审批不通过" action="#{zkbPartOrderAuditController.rejectNext}" update=":growl" icon="ui-icon-close" rendered="#{zkbPartOrderAuditController.showBtn eq '0' and zkbPartOrderAuditController.canEditFlag}"/>
                <p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-arrow-back" action="List?faces-redirect=true" />

            </h:form>
           <ui:include src="PartOrderReturn.xhtml"/>

            <p:dialog id="zkbCancelReasonDlg" widgetVar="zkbCancelReasonDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="拒绝原因" height="300">

                <h:form id="zkbConfigForm">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">拒绝原因</label>
                            <p:inputTextarea rows="10" cols="50" id="opRemark" value="#{zkbPartOrderAuditController.selected.orderedRemark}" required="true" requiredMessage="原因不能为空">
                            </p:inputTextarea>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="true" value="#{msg.Confirm}" action="#{zkbPartOrderAuditController.orderCancelNext}" oncomplete="PF('zkbConfigDlg').hide()" update=":growl" icon="ui-icon-check" />
                    <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbConfigDlg').hide()"/>
                </h:form>

            </p:dialog>

        </div>

    </ui:define>
</ui:composition>
