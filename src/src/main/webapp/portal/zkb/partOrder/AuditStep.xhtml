<ui:composition xmlns="http://www.w3.org/1999/xhtml"
            xmlns:h="http://java.sun.com/jsf/html"
            xmlns:f="http://java.sun.com/jsf/core"
            xmlns:ui="http://java.sun.com/jsf/facelets"
            xmlns:p="http://primefaces.org/ui"
            xmlns:c="http://java.sun.com/jsp/jstl/core"
            template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{zkbPartOrderAuditController.CRUDActionName} #{msg.zkbPartOrder}"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbHeadEditForm">
                <p:panelGrid columns="6" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">GE设备或非GE设备*</label>
                        <p:selectOneMenu id="notGeAsset" value="#{zkbPartOrderAuditController.selected.notGeAsset}" disabled="true">
                            <f:selectItem itemLabel="GE设备" />
                            <f:selectItem itemLabel="非GE设备" itemValue="t"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">订单类型*</label>
                        <p:selectOneMenu id="orderType" value="#{zkbPartOrderAuditController.orderType}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_orderType} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPartOrderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{zkbPartOrderAuditController.orderType eq 'Artificial'}">
                        <label class="label">机型*</label>
                        <p:selectOneMenu id="artificialType" value="#{zkbPartOrderAuditController.artificialType}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_artificialType} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoArtificialType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup id="maintainFlagGroup" rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial' and !(zkbPartOrderAuditController.zkbContract.contractType eq 'CCSB')}">
                        <label class="label">保养申请*</label>
                        <p:selectOneMenu id="maintainFlag" disabled="true" value="#{zkbPartOrderAuditController.selected.maintainFlag}" required="true" requiredMessage="是否保养 #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">申请号*</label>
                        <p:inputText id="partOrderNo" value="#{ zkbPartOrderAuditController.selected.partOrderNo}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">当前状态</label>
                        <p:inputText id="currentStatus" value="#{fieldMsg.fieldValue('zkbPoStatus', zkbPartOrderAuditController.selected.status)}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">System ID</label>
                        <p:inputText  value="#{zkbPartOrderAuditController.selected.assetInfo.systemId}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">报修单号</label>
                        <p:inputText  value="#{zkbPartOrderAuditController.selected.srNum}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">是否为补录*</label>
                        <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.supplementFlag}" disabled="true" >
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
            </h:form>
            <p:fieldset id="zkbWorkFlowFieldset" legend="工单信息" >
                <p:dataTable id="zkbWkDatalist" value="#{zkbPartOrderAuditController.v2_listHashMap}" var="item"
                             widgetVar="zkbWkDatalist" selectionMode="single"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                    <p:column headerText="设备名称">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column headerText="sys ID">
                        <h:outputText value="#{item.systemId}"/>
                    </p:column>
                    <p:column headerText="设备编号（院方）" rendered="#{zkbPartOrderAuditController.selected.notGeAsset eq 't'}">
                        <h:outputText value="#{item.departNum}"/>
                    </p:column>
                    <p:column headerText="报修单号">
                        <h:outputText value="#{item.srNum}"/>
                    </p:column>
                    <p:column headerText="二维码">
                        <h:outputText value="#{item.oneQrCode}"/>
                    </p:column>
                    <p:column headerText="品牌">
                        <h:outputText value="#{item.makerShortName}"/>
                    </p:column>
                    <f:facet name="{Toolbar}">
                    </f:facet>
                </p:dataTable>
            </p:fieldset>
            <p:fieldset id="zkbContractFieldset" legend="合同信息" >
                <p:dataTable id="zkbContractDatalist" value="#{zkbPartOrderAuditController.contractList}" var="item"
                             widgetVar="zkbWkDatalist" selectionMode="single" disabledSelection="true"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">
                    <p:column headerText="#{msg.zkbContact_tenant}">
                        <h:outputText value="#{zkbContractController.getTenantInfo(item.tenantUID).name}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractNo}" >
                        <h:outputText value="#{item.contractNo}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_region}">
                        <h:outputText value="#{item.region}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractType}">
                        <h:outputText value="#{item.contractType}"/>
                    </p:column>

                    <p:column headerText="#{msg.zkbContract_ibNumber}">
                        <h:outputText value="#{item.ibNumber}"/>
                    </p:column>
                    <c:choose>
                        <c:when test="#{zkbPartOrderAuditController.selected.orderType eq 'Parts'}">
                            <p:column headerText="#{msg.zkbContract_spareQuota}">
                                <h:outputText value="#{item.spareQuota}"/>
                            </p:column>
                            <p:column headerText="#{msg.zkbContract_spareArtificail}">
                                <h:outputText value="#{item.spareArtificail}"/>
                            </p:column>
                        </c:when>
                        <c:when test="#{zkbPartOrderAuditController.selected.orderType eq 'Probe'}">
                            <p:column headerText="探头任意剩余名额" >
                                <h:outputText value="#{item.probeQuota}"/>
                            </p:column>
                            <p:column headerText="探头普通剩余名额" >
                                <h:outputText value="#{item.probeQuotaNormal}"/>
                            </p:column>
                            <p:column headerText="探头特殊剩余名额" >
                                <h:outputText value="#{item.probeQuotaSpecial}"/>
                            </p:column>
                        </c:when>
                        <c:when test="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial'}">
                            <p:column headerText="#{msg.zkbContract_geArtificialSupportTimes}" >
                                <h:outputText value="#{item.geArtificialSupportTimes}"/>
                            </p:column>
                            <p:column headerText="#{msg.zkbContract_spareArtificail}">
                                <h:outputText value="#{item.spareArtificail}"/>
                            </p:column>
                            <p:column headerText="保养名额">
                                <h:outputText value="#{item.ccsbMaintenanceQuota}"/>
                            </p:column>
                        </c:when>
                        <c:when test="#{zkbPartOrderAuditController.selected.orderType eq 'Tool'}">
                            <p:column headerText="#{msg.zkbContract_spareQuota}">
                                <h:outputText value="#{item.spareQuota}"/>
                            </p:column>
                            <p:column headerText="#{msg.zkbContract_spareArtificail}">
                                <h:outputText value="#{item.spareArtificail}"/>
                            </p:column>
                        </c:when>
                    </c:choose>
                    <p:column headerText="#{msg.zkbContract_startDate}">
                        <h:outputText value="#{item.startDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_endDate}">
                        <h:outputText value="#{item.endDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <f:facet name="{Toolbar}">
                    </f:facet>
                </p:dataTable>
            </p:fieldset>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbPartOrderEditForm" >
                <p:messages id="messages" showDetail="true" closable="false" autoUpdate="true"></p:messages>
                <p:fieldset id="zkbPartOrderFieldset" legend="额度信息" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">申请人*</label>
                            <p:inputText id="requestUser" value="#{zkbPartOrderAuditController.selected.requestUser}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_requestUser} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人电话*</label>
                            <p:inputText id="requestPhone" value="#{zkbPartOrderAuditController.selected.requestPhone}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_requestPhone} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间*</label>
                            <p:calendar timeZone="GMT+8"  id="requestDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbPartOrderAuditController.selected.requestDate}" readonly="true" required="true" requiredMessage="#{msg.zkbPartOrder_requestDate} #{msg.ValidationRequire}" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.orderType eq 'Artificial')}">
                            <h:panelGroup rendered="#{zkbPartOrderAuditController.orderType eq 'Parts' and zkbPartOrderAuditController.selected.assetInfo.assetGroup eq 1}">
                                <label class="label">设备类型（DI）*</label>
                                <p:selectOneMenu id="assetTypeDi" value="#{zkbPartOrderAuditController.selected.assetTypeDi}" required="true" requiredMessage="#设备类型（DI） #{msg.ValidationRequire}" disabled="true">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItem itemLabel="CT" itemValue="CT"/>
                                    <f:selectItem itemLabel="XR" itemValue="XR"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.orderType eq 'Parts' and zkbPartOrderAuditController.selected.assetInfo.assetGroup eq 1 and (zkbPartOrderAuditController.zkbContract.contractType eq 'DI' or zkbPartOrderAuditController.zkbContract.contractType eq 'PCB')}">
                            <label class="label">放射名额扣除类型*</label>
                            <p:selectOneMenu  value="#{zkbPartOrderAuditController.selected.radiationQuotaType}" requiredMessage="放射名额扣除类型 #{msg.ValidationRequire}"  disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="联合名额" itemValue="SpareArtificial"/>
                                <f:selectItem itemLabel="高值备件名额" itemValue="PartsHigh"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.radiationQuotaType eq 'PartsHigh'}">
                            <label class="label">备件类型*</label>
                            <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.partsHighType}" requiredMessage="备件类型 #{msg.ValidationRequire}"  disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPartsHighTypeGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.orderType eq 'Artificial' and zkbPartOrderAuditController.selected.maintainFlag != 't' and zkbPartOrderAuditController.zkbContract.contractType != 'CCSB' and empty zkbPartOrderAuditController.selected.notGeAsset}">
                            <c:if test="#{zkbPartOrderAuditController.selected.artificialType eq '1'}">
                                <label class="label" >是否需要SSA Key*</label>
                            </c:if>
                            <c:if test="#{!(zkbPartOrderAuditController.selected.artificialType eq '1')}">
                                <label class="label" >是否需要Dongle*</label>
                            </c:if>
                            <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.ssaKeyFlag}" required="true" requiredMessage="是否需要SSA Key #{msg.ValidationRequire}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.scoreFlagRender()}">
                            <label class="label">是否使用积分抵扣*</label>
                            <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.scoreFlag}" required="true" requiredMessage="是否使用积分抵扣 #{msg.ValidationRequire}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup  rendered="#{zkbPartOrderAuditController.orderType eq 'Artificial' }">
                            <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.scoreFlag eq 't'}">
                                <label class="label">兑换类型*</label>
                                <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.exchangeType}" disabled="true">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbExchangeType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Parts' and zkbPartOrderAuditController.selected.assetInfo.assetGroup eq 2 }">
                            <label class="label">机型*</label>
                            <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.artificialType}" required="true" requiredMessage="#{msg.zkbPartOrder_artificialType} #{msg.ValidationRequire}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="超声高端机" itemValue="2"/>
                                <f:selectItem itemLabel="超声低端机" itemValue="3"/>
                                <f:selectItem itemLabel="超声Depot产品" itemValue="depot"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Probe' and !(empty zkbPartOrderAuditController.selected.probeQuotaType)}">
                            <label class="label">扣除名额类型*</label>
                            <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.probeQuotaType}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ZkbPoProbeQuotaType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial' and zkbPartOrderAuditController.zkbContract.contractType eq 'CCSB'}">
                            <label class="label">CCSB扣除名额类型*</label>
                            <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.ccsbApplyType}"  disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCCsbQuotaType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Probe' and (empty zkbPartOrderAuditController.selected.probeQuotaType)}">
                            <label class="label">是否高值探头*</label>
                            <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.highCatFlag}" disabled="true" required="true" requiredMessage="是否高值探头 #{msg.ValidationRequire}">
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_region}*</label>
                            <p:selectOneMenu id="region" value="#{zkbPartOrderAuditController.selected.region}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_region} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                      <!--  <h:panelGroup>
                            <label class="label">订单日期*</label>
                            <p:calendar timeZone="GMT+8"  id="startDate" pattern="yyyy/MM/dd" readonly="true" value="#{zkbPartOrderAuditController.selected.partOrderDate}" required="true" requiredMessage="#{msg.zkbPartOrder_partOrderDate} #{msg.ValidationRequire}" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>-->
                        <h:panelGroup>
                            <label class="label">医院名称*</label>
                            <p:inputTextarea id="hospitalName" value="#{zkbPartOrderAuditController.selected.hospitalName}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人姓名*</label>
                            <p:inputText id="hospitalRepairer" value="#{zkbPartOrderAuditController.selected.hospitalRepairer}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人电话*</label>
                            <p:inputText id="hospitalRepairerPhone" value="#{zkbPartOrderAuditController.selected.hospitalRepairerPhone}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">订单标注*</label>
                            <p:selectOneMenu id="orderAnnotation" value="#{zkbPartOrderAuditController.selected.orderAnnotation}" disabled="true" required="true" requiredMessage="#{msg.zkbPartOrder_orderAnnotation} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoOrderAnnotationType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial') and !(zkbPartOrderAuditController.selected.orderAnnotation eq 'NormalOrder')}">
                            <label class="label">发生问题的order number</label>
                            <p:inputText id="problemOrderNumber" value="#{zkbPartOrderAuditController.selected.problemOrderNumber}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">是否为紧急订单*</label>
                            <p:selectOneMenu id="urgentOrder" value="#{zkbPartOrderAuditController.selected.urgentOrder}" disabled="true" >
                                <p:ajax event="change" update="urgencyReasons" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbUrgentType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="urgencyReasonsGrid" columns="1" layout="grid" styleClass="ui-panelgrid-blank" >
                            <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.urgentOrder eq 't'}">
                                <label class="label">订单紧急的原因*</label>
                                <p:selectOneMenu id="urgencyReasons" value="#{zkbPartOrderAuditController.selected.urgencyReasons}" disabled="true" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbUrgentReasonType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.notGeAsset eq 't' and zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <c:choose>
                                <c:when test="#{zkbPartOrderAuditController.selected.orderType eq 'Probe'}">
                                    <label class="label">订单名额*</label>
                                </c:when>
                                <c:otherwise>
                                    <label class="label">订单数量*</label>
                                </c:otherwise>
                            </c:choose>
                            <p:inputText id="qty" value="#{zkbPartOrderAuditController.selected.qty}" required="true" readonly="true" requiredMessage="订单数量 #{msg.ValidationRequire}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.notGeAsset eq 't' and zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">剩余数量</label>
                            <p:inputText id="remainQty" value="#{zkbPartOrderAuditController.selected.remainQty}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">收货人*</label>
                            <p:inputText id="receiver" value="#{zkbPartOrderAuditController.selected.receiver}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">收货人电话*</label>
                            <p:inputText id="receiverPhone" value="#{zkbPartOrderAuditController.selected.receiverPhone}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbPartOrderAuditController.selected.orderType eq 'Artificial')}">
                            <label class="label">收货地址*</label>
                            <p:inputTextarea id="receiverAddress" value="#{zkbPartOrderAuditController.selected.receiverAddress}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial'}">
                            <label class="label">ZKB工程师姓名*</label>
                            <p:inputText id="zkbEngineerName" value="#{zkbPartOrderAuditController.selected.zkbEngineerName}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Artificial'}">
                            <label class="label">ZKB工程师电话*</label>
                            <p:inputText id="zkbEngineerPhone" value="#{zkbPartOrderAuditController.selected.zkbEngineerPhone}" disabled="true"/>
                        </h:panelGroup>
                      <!--  <h:panelGroup>
                            <label class="label">在线工程师*</label>
                            <p:inputText id="onlineEngineer" value="#{zkbPartOrderAuditController.selected.onlineEngine.name}" disabled="true" />
                        </h:panelGroup>-->

                        <h:panelGroup>
                            <label class="label">备注</label>
