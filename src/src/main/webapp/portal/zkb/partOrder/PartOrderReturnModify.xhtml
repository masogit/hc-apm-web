<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="zkbPartOrderReturnModifyDlg" widgetVar="zkbPartOrderReturnModifyDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="归还明细修改" width="70%" height="620">
        <h:form id="zkbPartOrderReturnModifyForm">

            <p:fieldset rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Parts' or zkbPartOrderAuditController.selected.orderType eq 'Tool'}" style="margin-top: 5px;">
                <p:dataTable id="zkbPoReturnModifyList" value="#{zkbPartOrderAuditController.zkbPartOrderReturnModifyList}" var="item"
                             widgetVar="zkbPoReturnModifyList" selectionMode="single"  selection="#{zkbPartOrderAuditController.zkbPartOrderReturn}"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.returnDate}"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">
                    <p:ajax event="rowSelect" update="editReturnModifyButton deleteReturnModifyButton"/>

                    <p:column headerText="运单号">
                        <h:outputText value="#{item.waybillNo}"/>
                    </p:column>
                    <p:column headerText="归还日期">
                        <h:outputText value="#{item.returnDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="配件号">
                        <h:outputText value="#{item.partNo}"/>
                    </p:column>
                    <p:column headerText="归还类型">
                        <h:outputText value="#{fieldMsg.fieldValue('zkbPoReturnType',item.returnType)}"/>
                    </p:column>
                    <p:column headerText="Part Serial Number">
                        <h:outputText value="#{item.partSerialNumber}"/>
                    </p:column>
                    <p:column headerText="故障描述" >
                        <h:outputText value="#{item.partQualityIssue}"/>
                    </p:column>
                    <p:column headerText="归还数量">
                        <h:outputText value="#{item.qty}"/>
                    </p:column>
                    <p:column headerText="备注">
                        <h:outputText value="#{item.remark}"/>
                    </p:column>
                    <f:facet name="{Toolbar}">
                        <p:commandButton immediate="false" process="@this" id="createReturnModifyButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{zkbPartOrderAuditController.prepareReturnModifyCreate}" update="zkbPartOrderReturnEditDlg"  oncomplete="PF('zkbPartOrderReturnEditDlg').show()" />
                        <p:commandButton immediate="false" process="@this" id="editReturnModifyButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbPartOrderAuditController.prepareReturnModifyEdit}" update="zkbPartOrderReturnEditDlg"  oncomplete="PF('zkbPartOrderReturnEditDlg').show()"  disabled="#{empty zkbPartOrderAuditController.zkbPartOrderReturn }"/>
                        <p:commandButton immediate="false" process="@this"  id="deleteReturnModifyButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbPartOrderAuditController.deleteReturnModify}" update=":growl :zkbPartOrderReturnModifyForm:zkbPoReturnModifyList" disabled="#{empty zkbPartOrderAuditController.zkbPartOrderReturn}" >
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </p:fieldset>
            <p:fieldset rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Probe'}" style="margin-top: 5px;">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Probe'}">
                    <h:panelGroup>
                        <label class="label">归还类型*</label>
                        <p:selectOneMenu  value="#{zkbPartOrderAuditController.selected.returnType}"  required="true" requiredMessage="#{msg.zkbPartOrder_returnType} #{msg.ValidationRequire}" >
                            <p:ajax event="change" update="grid2" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{zkbPartOrderAuditController.returnTypeList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="false">
                        <label class="label">归还数量*</label>
                        <p:inputText id="returnQty" value="#{zkbPartOrderAuditController.selected.returnQty}"  required="true" requiredMessage="#{msg.zkbPartOrder_returnType} #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">运单号*</label>
                        <p:inputText  value="#{zkbPartOrderAuditController.selected.waybillNo}" required="true" requiredMessage="#{msg.zkbPartOrder_waybillNo} #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">归还日期*</label>
                        <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbPartOrderAuditController.selected.returnDate}" showOn="button" Input="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.zkbPartOrder_returnDate} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                </p:panelGrid>
                <p:panelGrid id="grid2" columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Probe'}">
                    <h:panelGroup rendered="#{(zkbPartOrderAuditController.selected.returnType eq 'DOA' or zkbPartOrderAuditController.selected.returnType eq 'damagedShipment')}" style="text-align: left">
                        <label class="label">Part Serial Number*</label>
                        <p:inputText value="#{zkbPartOrderAuditController.selected.partSerialNumber}" required="true" requiredMessage="Part Serial Number #{msg.ValidationRequire}"/>
                        <p:outputLabel  style="color: red" value="#{zkbPartOrderAuditController.getPartSerialNumberTips()}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{(zkbPartOrderAuditController.selected.returnType eq 'DOA' or zkbPartOrderAuditController.selected.returnType eq 'damagedShipment')}">
                        <label class="label">Packaging Status(外部包装)*</label>
                        <p:selectOneMenu value="#{zkbPartOrderAuditController.zkbPartOrderReturn.externalPackaging}" required="true" requiredMessage="外部包装不能为空"  >
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnExternalPackaging')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{(zkbPartOrderAuditController.selected.returnType eq 'DOA' or zkbPartOrderAuditController.selected.returnType eq 'damagedShipment')}">
                        <label class="label">Internal Packaging(内部包装)*</label>
                        <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.internalPackaging}" required="true" requiredMessage="内部包装不能为空" >
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnInternalPackaging')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{(zkbPartOrderAuditController.selected.returnType eq 'DOA' or zkbPartOrderAuditController.selected.returnType eq 'damagedShipment')}">
                        <label class="label">Quality Seal Type(密封标签类型)*</label>
                        <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.qualitySealType}" required="true" requiredMessage="密封标签类型不能为空" >
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnQualitySealType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{(zkbPartOrderAuditController.selected.returnType eq 'DOA' or zkbPartOrderAuditController.selected.returnType eq 'damagedShipment')}">
                        <label class="label">Quality Seal Status(密封标签状态)*</label>
                        <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.qualitySealStatus}" required="true" requiredMessage="密封标签状态不能为空" >
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnQualitySealStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{(zkbPartOrderAuditController.selected.returnType eq 'DOA' or zkbPartOrderAuditController.selected.returnType eq 'damagedShipment')}">
                        <label class="label">Part Quality(备件质量)*</label>
                        <p:selectOneMenu value="#{zkbPartOrderAuditController.selected.partQuality}" required="true" requiredMessage="备件质量不能为空" >
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnPartQuality')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{(zkbPartOrderAuditController.selected.returnType eq 'DOA' or zkbPartOrderAuditController.selected.returnType eq 'damagedShipment')}" style="text-align: left">
                        <label class="label">Part Quality Issue(备件质量问题)*</label>
                        <p:selectOneMenu id="partQualityIssue" value="#{zkbPartOrderAuditController.selected.partQualityIssue}" style="text-align: left" required="true" requiredMessage="备件质量问题 #{msg.ValidationRequire}" >
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnPartQualityIssue')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                    <h:panelGroup>
                        <label class="label">新探头SN编号*</label>
                        <p:inputText id="newCatSn" value="#{zkbPartOrderAuditController.selected.newCatSn}"  required="true" requiredMessage="新探头SN编号 #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">归还备注</label>
                        <p:inputTextarea id="returnRemark" value="#{zkbPartOrderAuditController.selected.returnRemark}"  rows="2" cols="20" >
                        </p:inputTextarea>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>


            <p:commandButton validateClient="true" value="提交" actionListener="#{zkbPartOrderAuditController.submitCloseReturn}" update=":growl :zkbPartOrderEditForm"
                             icon="ui-icon-check" oncomplete="PF('zkbPartOrderReturnModifyDlg').hide()" />
            <p:commandButton immediate="true" process="@this" value="返回" icon="ui-icon-cancel" onclick="PF('zkbPartOrderReturnModifyDlg').hide()"/>
        </h:form>

    </p:dialog>

</ui:composition>
</html>
