<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">
<ui:composition>
    <p:dialog id="zkbPartOrderReturnEditDlg" widgetVar="zkbPartOrderReturnEditDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="归还明细操作" height="450" width="1100">
        <h:form id="zkbItemEditForm">
            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label class="label">运单号*</label>
                    <p:inputText id="waybillNo" ajax="true" value="#{zkbPartOrderAuditController.zkbPartOrderReturn.waybillNo}" required="true" requiredMessage="#{msg.zkbPartOrder_waybillNo} #{msg.ValidationRequire}" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" />

                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">配件号*</label>
                    <p:selectOneMenu id="partNo" value="#{zkbPartOrderAuditController.zkbPartOrderReturn.partNo}" required="true" requiredMessage="配件号不能为空" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" >
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{zkbPartOrderAuditController.partNoList}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">归还日期*</label>
                    <p:calendar timeZone="GMT+8"   id="returnDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbPartOrderAuditController.zkbPartOrderReturn.returnDate}" showOn="button" Input="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.zkbPartOrder_returnDate} #{msg.ValidationRequire}" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" />
                </h:panelGroup>
                <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Parts'}">
                    <label class="label">备件UDI*</label>
                    <p:inputText id="udi" value="#{zkbPartOrderAuditController.zkbPartOrderReturn.udi}" required="true" requiredMessage="udi #{msg.ValidationRequire}" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" />
                    <p:outputLabel style="color: red" value="如果该备件没有UDI，请填写“无UDI“"/><br/>
                </h:panelGroup>
                <c:choose>
                    <c:when test="#{zkbPartOrderAuditController.selected.orderType eq 'Parts'}">
                        <h:panelGroup>
                            <label class="label">归还类型*</label>
                            <p:selectOneMenu id="returnType" value="#{zkbPartOrderAuditController.zkbPartOrderReturn.returnType}" required="true" requiredMessage="归还类型不能为空"  disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}">
                                <p:ajax event="change" update="returnTypeGrid goodReturnAttachment sevenReturnedFlagGroup" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <!--<f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>-->
                                <f:selectItems value="#{zkbPartOrderAuditController.returnTypeList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </c:when>
                    <c:when test="#{zkbPartOrderAuditController.selected.orderType eq 'Tool'}">
                        <h:panelGroup>
                            <label class="label">归还数量*</label>
                            <p:spinner value="#{zkbPartOrderAuditController.zkbPartOrderReturn.qty}" min="1" max="1000"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputText value="#{zkbPartOrderAuditController.zkbPartOrderReturn.remark}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">归还类型*</label>
                            <p:selectOneMenu value="#{zkbPartOrderAuditController.zkbPartOrderReturn.returnType}" required="true" requiredMessage="归还类型不能为空"  disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}">
                                <p:ajax event="change" update="partSerialNumberGroup partQualityIssueGroup goodReturnAttachment sevenReturnedFlagGroup" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <!--<f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>-->
                                <f:selectItems value="#{zkbPartOrderAuditController.returnTypeList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup id="partSerialNumberGroup" >
                            <h:panelGroup rendered="#{zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'DOA'}" >
                                <label class="label">Part Serial Number*</label>
                                <p:inputText value="#{zkbPartOrderAuditController.zkbPartOrderReturn.partSerialNumber}" style="text-align: left" required="true" requiredMessage="Part Serial Number不能为空" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" />
                                <p:outputLabel  style="color: red" value="#{zkbPartOrderAuditController.getPartSerialNumberTips()}"/>
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup id="partQualityIssueGroup">
                            <h:panelGroup rendered="#{zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'DOA'}" >
                                <label class="label">故障描述*</label>
                                <p:selectOneMenu  value="#{zkbPartOrderAuditController.zkbPartOrderReturn.partQualityIssue}" style="text-align: left" required="true" requiredMessage="故障描述不能为空" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnPartQualityIssue')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>

                    </c:when>
                </c:choose>

                <h:panelGroup rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Parts'}">
                    <label class="label">Order#*</label>
                    <p:selectOneMenu id="orderNo" value="#{zkbPartOrderAuditController.zkbPartOrderReturn.orderNo}" required="true" requiredMessage="Order#不能为空"  disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{zkbPartOrderAuditController.orderNoList}" var="item" itemLabel="#{item.text}" itemValue="#{item.value}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
            </p:panelGrid>
            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" id="returnTypeGrid" rendered="#{zkbPartOrderAuditController.selected.orderType eq 'Parts'}">
                <h:panelGroup rendered="#{(zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'DOA' or zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'damagedShipment')}" >
                    <label class="label">Part Serial Number*</label>
                    <p:inputText id="partSerialNumber" value="#{zkbPartOrderAuditController.zkbPartOrderReturn.partSerialNumber}" style="text-align: left" required="true" requiredMessage="Part Serial Number不能为空" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" />
                    <p:outputLabel  style="color: red" value="#{zkbPartOrderAuditController.getPartSerialNumberTips()}"/>
                </h:panelGroup>

                <h:panelGroup rendered="#{(zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'DOA' or zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'damagedShipment')}">
                    <label class="label">Packaging Status(外部包装)*</label>
                    <p:selectOneMenu value="#{zkbPartOrderAuditController.zkbPartOrderReturn.externalPackaging}" required="true" requiredMessage="外部包装不能为空" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" >
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnExternalPackaging')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup rendered="#{(zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'DOA' or zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'damagedShipment')}">
                    <label class="label">Internal Packaging(内部包装)*</label>
                    <p:selectOneMenu value="#{zkbPartOrderAuditController.zkbPartOrderReturn.internalPackaging}" required="true" requiredMessage="内部包装不能为空" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" >
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnInternalPackaging')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup rendered="#{(zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'DOA' or zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'damagedShipment')}">
                    <label class="label">Quality Seal Type(密封标签类型)*</label>
                    <p:selectOneMenu value="#{zkbPartOrderAuditController.zkbPartOrderReturn.qualitySealType}" required="true" requiredMessage="密封标签类型不能为空" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" >
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnQualitySealType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup rendered="#{(zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'DOA' or zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'damagedShipment')}">
                    <label class="label">Quality Seal Status(密封标签状态)*</label>
                    <p:selectOneMenu value="#{zkbPartOrderAuditController.zkbPartOrderReturn.qualitySealStatus}" required="true" requiredMessage="密封标签状态不能为空" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" >
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnQualitySealStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup rendered="#{(zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'DOA' or zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'damagedShipment')}">
                    <label class="label">Part Quality(备件质量)*</label>
                    <p:selectOneMenu value="#{zkbPartOrderAuditController.zkbPartOrderReturn.partQuality}" required="true" requiredMessage="备件质量不能为空" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" >
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnPartQuality')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup rendered="#{(zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'DOA' or zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'damagedShipment')}" >
                    <label class="label">Part Quality Issue(备件质量问题)*</label>
                    <p:selectOneMenu id="partQualityIssue" value="#{zkbPartOrderAuditController.zkbPartOrderReturn.partQualityIssue}" style="text-align: left" required="true" requiredMessage="故障描述不能为空" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" >
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnPartQualityIssue')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">归还数量*</label>
                    <p:spinner id="courseCount" value="#{zkbPartOrderAuditController.zkbPartOrderReturn.qty}" min="1" max="1000" disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" />
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">备注</label>
                    <p:inputText id="remark" value="#{zkbPartOrderAuditController.zkbPartOrderReturn.remark}"  disabled="#{!(zkbPartOrderAuditController.returnFormFlag eq 'edit')}" />
                </h:panelGroup>

                <h:panelGroup rendered="#{zkbPartOrderAuditController.actionReturnName eq 'Audit'}">
                    <label class="label">审批状态*</label>
                    <p:selectOneMenu value="#{zkbPartOrderAuditController.zkbPartOrderReturn.dataStatus}" style="text-align: left" disabled="#{zkbPartOrderAuditController.returnFormFlag eq 'readOnly'}" required="true" requiredMessage="审批状态不能为空！">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoReturnDataStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup id="sevenReturnedFlagGroup">
                    <h:panelGroup rendered="#{zkbPartOrderAuditController.actionReturnName eq 'Audit' and zkbPartOrderAuditController.selected.notGeAsset eq 't' and zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'goodReturn'}">
                        <label class="label">好还时间是否超过七天</label>
                        <p:selectOneMenu value="#{zkbPartOrderAuditController.zkbPartOrderReturn.sevenReturnedFlag}" style="text-align: left" disabled="#{zkbPartOrderAuditController.returnFormFlag eq 'readOnly'}" >
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItem itemLabel="是" itemValue="t"/>
                            <f:selectItem itemLabel="否" itemValue="f"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </h:panelGroup>


                <h:panelGroup rendered="#{zkbPartOrderAuditController.actionReturnName eq 'Audit'}">
                    <label class="label">审批备注</label>
                    <p:inputText  value="#{zkbPartOrderAuditController.zkbPartOrderReturn.closedRemark}" disabled="#{zkbPartOrderAuditController.returnFormFlag eq 'readOnly'}"  />
                </h:panelGroup>
            </p:panelGrid>
            <h:panelGroup id="goodReturnAttachment" rendered="#{zkbPartOrderAuditController.actionReturnName eq 'Audit' or zkbPartOrderAuditController.actionReturnName eq 'Create' or zkbPartOrderAuditController.actionReturnName eq 'Edit'}">
                <h:panelGroup rendered="#{zkbPartOrderAuditController.zkbPartOrderReturn.returnType eq 'goodReturn' and zkbPartOrderAuditController.selected.notGeAsset eq 't'}">
                    <p:dataList id="uploadReturnList" value="#{zkbPartOrderAuditController.goodReturnBlobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}" >
                        <f:facet name="header">图片</f:facet>
                        <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                        <p:commandButton actionListener="#{zkbPartOrderAuditController.removeReturnFile(fileitem)}" update="uploadReturnList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this" rendered="#{!(zkbPartOrderAuditController.returnFormFlag eq 'readOnly') and !(zkbPartOrderAuditController.returnFormFlag eq 'audit')}">
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                        </p:commandButton>
                    </p:dataList>
                    <p:fileUpload allowTypes="/(\.|\/)(jpeg|jpg|png|JPEG|JPG|PNG)$/" fileUploadListener="#{zkbPartOrderAuditController.handleReturnFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                  multiple="true"  sizeLimit="31000000"  update="uploadReturnList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}3M" label="#{msg.Add}" rendered="#{zkbPartOrderAuditController.returnFormFlag eq 'edit'}"/>
                    <label style="color: red">请提供好还的备件照片和寄件时的外包装照片</label>
                </h:panelGroup>
            </h:panelGroup>
            <br/>
            <div style="width: 100%; text-align: center">
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{zkbPartOrderAuditController.saveReturn}" rendered="#{!(zkbPartOrderAuditController.actionReturnName eq 'Audit')}"
                                 update="#{zkbPartOrderAuditController.actionReturnName eq 'Create' or zkbPartOrderAuditController.actionReturnName eq 'Edit' ? ':growl :zkbPartOrderEditForm:zkbReturnDatalist :zkbPartOrderEditForm:saveTips' : ':growl :zkbPartOrderReturnModifyForm'}"
                                 icon="ui-icon-check" oncomplete="handleSubmit(args, 'zkbPartOrderReturnEditDlg');" style="text-align: center"/>
                <p:commandButton validateClient="true" value="提交" action="#{zkbPartOrderAuditController.returnAudit()}" update=":growl :zkbPartOrderEditForm:zkbReturnDatalist :zkbPartOrderEditForm:saveTips" rendered="#{zkbPartOrderAuditController.actionReturnName eq 'Audit' and !(zkbPartOrderAuditController.returnFormFlag eq 'readOnly')}"
                                 icon="ui-icon-check"  oncomplete="handleSubmit(args, 'zkbPartOrderReturnEditDlg');"/>

                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbPartOrderReturnEditDlg').hide()" style="margin-left: 30px;"/>
            </div>

        </h:form>
    </p:dialog>
    
</ui:composition>
</html>
