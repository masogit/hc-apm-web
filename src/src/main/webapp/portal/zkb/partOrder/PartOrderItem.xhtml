<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="zkbPartOrderEditDlg" widgetVar="zkbPartOrderEditDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="额度明细操作"  height="420">
        <h:form id="zkbItemEditForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label class="label">配件号*</label>
                    <p:inputText id="partNo" value="#{zkbPartOrderEditController.zkbPartOrderItem.partNo}" required="true" requiredMessage="配件号不能为空" /><br/>
                    <p:outputLabel id="saveTips" style="color: red;font-size: larger;" value="#{zkbPartOrderEditController.itemSaveTips}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">配件名称*</label>
                    <p:inputText id="partName" value="#{zkbPartOrderEditController.zkbPartOrderItem.partName}" required="true" requiredMessage="配件名称不能为空" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">配件数量*</label>
                    <p:spinner id="courseCount" value="#{zkbPartOrderEditController.zkbPartOrderItem.prePartQty}" min="1" max="1000" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">配件SN(序列号)</label>
                    <p:inputText id="serialNumber" value="#{zkbPartOrderEditController.zkbPartOrderItem.serialNumber}"  />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">备注（说明是否DOA或者Short life）</label>
                    <p:inputText id="remark" value="#{zkbPartOrderEditController.zkbPartOrderItem.remark}"  />
                </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" action="#{zkbPartOrderEditController.saveItem}" update=":growl :zkbItemEditForm :zkbPartOrderEditForm:zkbDetailDatalist :zkbPartOrderEditForm:qty :zkbPartOrderEditForm:remainQty :zkbPartOrderEditForm:saveTips"
                 icon="ui-icon-check" oncomplete="handleSubmit(args, 'zkbPartOrderEditDlg');" />
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbPartOrderEditDlg').hide()"/>
        </h:form>
    </p:dialog>
    
</ui:composition>
</html>
