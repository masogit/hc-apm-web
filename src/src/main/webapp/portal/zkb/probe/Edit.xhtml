<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
    <p:dialog id="probeEditDlg" widgetVar="probeEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)"   height="670" width="500">
        <h:form id="probeEditForm">
            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label>探头号：</label>
                    <p:inputText id="catNo" value="#{zkbProbeController.selected.catNo}" required="true" requiredMessage="请输入探头号"/>
                </h:panelGroup>

                <h:panelGroup>
                    <label>探头型号：</label>
                    <p:inputText id="catModel"   value="#{zkbProbeController.selected.catModel}" required="true" requiredMessage="请输入探头型号" />
                </h:panelGroup>

                <h:panelGroup>
                    <label>探头类型：</label>
                    <p:inputText id="catType"  value="#{zkbProbeController.selected.catType}" required="true" requiredMessage="请输入探头类型" />
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">价值类型：</label>
                    <p:selectOneMenu  id="valueType" autoWidth="false" style="width: 80%" value="#{zkbProbeController.selected.valueType}" required="true" requiredMessage="请输入价值类型" >
                        <f:selectItem itemLabel="请选择..."/>
                        <c:forEach items="#{fieldMsg.getFieldValueList('zkbProbe_valueType')}" var="v">
                            <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}"/>
                        </c:forEach>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">是否有效：</label>
                    <p:selectOneMenu id="vaild" autoWidth="false" style="width: 80%" value="#{zkbProbeController.selected.isVaild}" required="true" requiredMessage="请输入是否有效" >
                        <f:selectItem itemLabel="请选择..."/>
                        <c:forEach items="#{fieldMsg.getFieldValueList('zkbProbe_isVaild')}" var="v">
                            <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}"/>
                        </c:forEach>
                    </p:selectOneMenu>
                </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="保存" actionListener="#{zkbProbeController.save}" icon="ui-icon-check" update=":growl probeListForm:datalist_probe" oncomplete="PF('probeEditDialog').hide()"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('probeEditDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
