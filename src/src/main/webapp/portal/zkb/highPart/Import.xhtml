    <ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="导入"/>
            </div>
        </div>
        <div class="ui-g-12 card">
            <h:form id="importForm">
                <p:fieldset  legend="#{msg.ContractImport}" id="uploaderContainer">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <p:fileUpload  id="fileUpload" fileUploadListener="#{zkbHighPartController.uploadDataFile}" value="#{zkbHighPartController.file}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                           multiple="false" sizeLimit="10000000" auto="true" update=":importForm :errorDataListForm" invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(xls|xlsx)$/" label="#{msg.Add}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <table style="width: 100%;padding:0px;margin: 0px;height: 100%;">
                                <tr>
                                    <td style="text-align:left;">#{msg.Description}:</td>
                                </tr>
                                <tr>
                                    <td style="text-align:left;">
                                        1. <a href="#{zkbHighPartController.getTemplateName()}" title="download">#{msg.downloadTemplateFile}</a>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="text-align:left;">

                                    </td>
                                </tr>

                            </table>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:commandButton value=" #{msg.Return}" icon="ui-icon-arrow-back" action="/portal/zkb/highPart/List?faces-redirect=true" immediate="true" />
            </h:form>
        </div>

        <div class="ui-g-12 card">
            <h:form id="errorDataListForm">
                <p:messages id="messages" showDetail="true" closable="false" autoUpdate="false"></p:messages>
                <p:fieldset  legend="#{msg.ImportFailureData}">
                    <p:dataTable id="errorDatalist" rendered="#{not empty zkbHighPartController.errorContractList}" value="#{zkbHighPartController.errorContractList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:column headerText="#{msg.EXCELRowNumber}">
                            <h:outputText value="#{item.get('zkbHighPartVO').lineNum}" />
                        </p:column>
                        <p:column headerText="备件号">
                            <h:outputText value="#{item.get('zkbHighPartVO').partNo}" />
                        </p:column>
                        <p:column headerText="类别">
                            <h:outputText value="#{item.get('contractInfoVO').partType}" />
                        </p:column>


                        <p:column headerText="#{msg.FailureInformation}" >
                            <!--<h:outputText value="#{fieldMsg.fieldValue('importStatus',item.get('status'))}"/><br/>-->
                            <h:outputText value="#{item.get('errmsg')}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton ajax="false" actionListener="#{zkbHighPartController.downloadImportFailureData}"
                                             icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" update=":growl">
                                <p:fileDownload value="#{zkbHighPartController.exportFailureFile}"/>
                            </p:commandButton>
                        </f:facet>

                    </p:dataTable>
                </p:fieldset>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
