<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>

    <h:form id="zkbHighPartEditForm">
        <p:fieldset id="zkbFiledSet" legend="#{zkbHighPartController.CRUDActionName}" style="margin-bottom:20px" rendered="#{zkbHighPartController.selected != null}">
            <h:panelGroup>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">备件号</label>
                        <p:inputText id="loginName" value="#{zkbHighPartController.selected.partNo}" required="true" requiredMessage="备件号#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">类型</label>
                        <p:selectOneMenu value="#{zkbHighPartController.selected.partType}" required="false" requiredMessage="类型#{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbHighPartType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{zkbHighPartController.save}" update=":zkbHighPartListForm :zkbHighPartEditForm :growl" value="#{msg.Save}" icon="ui-icon-check"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{zkbHighPartController.cancel}" update=":zkbHighPartEditForm :growl"/>
                </h:panelGroup>

            </h:panelGroup>
        </p:fieldset>
    </h:form>

</ui:composition>
</html>
