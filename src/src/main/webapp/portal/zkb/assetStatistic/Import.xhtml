<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
            <div class="ui-g">
                <div class="ui-g-12 card cardTitle">
                        <p:outputLabel class="pageTitle" value="无法贴码信息导入"/>
                </div>
            </div>
            <div class="ui-g-12 card">
                <h:form enctype="multipart/form-data">
                    <p:fieldset  legend="批量更新无法贴码信息" id="statisticImportForm">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <p:fileUpload fileUploadListener="#{zkbAssetStatisticController.handleFileUpload}" mode="advanced"
                                          dragDropSupport="false" multiple="false" auto="true"
                                          invalidFileMessage="只支持xls或xlsx格式的文件"
                                          invalidSizeMessage="文件大小不得超过5M"
                                          sizeLimit="5242880" allowTypes="/(\.|\/)(xls|xlsx)$/"
                                          update=":errorDataListForm"
                                          label="从Excel导入" cancelLabel="取消" uploadLabel="确认上传"/>
                        </p:panelGrid>
                        <h:panelGroup>
                            <p>说明</p>
                            <p>1. <a href="ZKB_STATISTIC_Template.xlsx" title="download">下载模板</a> </p>
                            <p>2. 文件中填入要更新的无法贴码信息数据，其中：代理商，systemID为必填字段，当无法贴码字段为Y时，无法贴码原因和原因归类为必填。</p>
                            <p>3. 上传文件进行导入</p>
                        </h:panelGroup>
                    </p:fieldset>
                    <h:panelGroup>
                        <p:commandButton value="#{msg.Return}"  icon="ui-icon-arrow-back" action="List.xhtml?faces-redirect=true" immediate="true"  update=":growl" style="float:left"/>
                    </h:panelGroup>
                </h:form>
            </div>


            <div class="ui-g-12 card">
                <h:form id="errorDataListForm">
                    <p:messages id="messages" showDetail="true" closable="false" autoUpdate="false"></p:messages>
                    <p:fieldset  legend="导入失败的数据">
                        <p:dataTable id="datalist" rendered="#{not empty zkbAssetStatisticController.errorImportList}" value="#{zkbAssetStatisticController.errorImportList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="数据为空"
                                     rowsPerPageTemplate="20,50,100,500">
                            <p:column headerText="EXCEL行数">
                                <h:outputText value="#{item.excelIdex}" />
                            </p:column>
                            <p:column headerText="代理商"  >
                                <h:outputText value="#{item.tenantName}"/>
                            </p:column>
                            <p:column headerText="systemID"  >
                                <h:outputText value="#{item.systemId}"/>
                            </p:column>
                            <p:column headerText="是否设备无法粘贴二维码"  >
                                <h:outputText value="#{item.canNotPastQrCode}" />
                            </p:column>
                            <p:column headerText="无法粘贴二维码原因"  >
                                <h:outputText value="#{item.reason}" />
                            </p:column>
                            <p:column headerText="无法贴码原因归类"  >
                                <h:outputText value="#{item.reasonCategorize}"/>
                            </p:column>
                            <p:column headerText="错误信息"  >
                                <h:outputText value="#{item.errorInfo}"/>
                            </p:column>

                           <f:facet name="{Toolbar}">
                                <p:commandButton title="导出错误数据" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                    <p:dataExporter type="xls" target="datalist" fileName="statisticFailed_export"/>
                                </p:commandButton>
                            </f:facet>
                        </p:dataTable>
                    </p:fieldset>
                </h:form>
            </div>
    </ui:define>
</ui:composition>
