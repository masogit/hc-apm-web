<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
>

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.zkbAssetStatistic_titile}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup >
                                <label class="label">#{msg.zkbHistory_agent}</label>
                                <p:selectOneMenu id="agent" value="#{zkbAssetStatisticController.tenantUid}" disabled="#{!userContextService.zkbAdmin}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{zkbPartOrderController.tenantInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbAssetStatistic_hospitalName}</label>
                                <p:inputText id="hospitalName" value="#{zkbAssetStatisticController.hospitalName}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbAssetStatistic_functionType}</label>
                                <p:inputText id="functionType" value="#{zkbAssetStatisticController.functionType}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.systemId}</label>
                                <p:inputText id="systemId" value="#{zkbAssetStatisticController.systemId}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbAssetStatistic_contractNo}</label>
                                <p:inputText id="contractNo" value="#{zkbAssetStatisticController.contractNo}" />
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.zkbAssetStatistic_qrCodeOfPaste}</label>
                                <p:selectOneMenu  value="#{zkbAssetStatisticController.qrCodeCountState}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItem itemLabel="Y" itemValue="Y"/>
                                    <f:selectItem itemLabel="N" itemValue="N"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.zkbAssetStatistic_canNotPast}</label>
                                <p:selectOneMenu  value="#{zkbAssetStatisticController.canNotPastQrCode}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItem itemLabel="Y" itemValue="Y"/>
                                    <f:selectItem itemLabel="N" itemValue="N"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:panelGrid columns="5" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <p:commandButton value="#{msg.SearchResult}" icon="ui-icon-search" update=":growl :zkbAssetStatisticListForm:datalist">
                            </p:commandButton>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:commandButton value="二维码统计(重新生成)" action="#{zkbAssetStatisticController.regenerateZkbAssetQrCodeInfo}" validateClient="false" update=":growl :zkbAssetStatisticListForm:datalist" rendered="#{userContextService.zkbAdmin}">
                            </p:commandButton>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:form>
                <h:form id="zkbAssetStatisticListForm">
                    <p:dataTable id="datalist" value="#{zkbAssetStatisticController.lazyModel}" var="item" widgetVar="dataList"
                                 selectionMode="single" selection="#{zkbAssetStatisticController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="rowSelect" update="editButton"/>
                        <p:column headerText="#{msg.zkbHistory_agent}" >
                            <h:outputText value="#{item.tenantName}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbAssetStatistic_hospitalName}" >
                            <h:outputText value="#{item.hospitalName}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbAssetStatistic_functionType}" >
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                        <p:column  headerText="#{msg.systemId}" >
                            <h:outputText value="#{item.systemId}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbAssetStatistic_contractNo}" >
                            <h:outputText value="#{item.contractNo}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbAssetStatistic_qrCodeOfPaste}" >
                            <h:outputText value="#{item.qrCodeCountState}"/>
                        </p:column>
                        <p:column  headerText="是否已贴一机一码" >
                            <h:outputText value="#{item.ibQrCodeState}"/>
                        </p:column>
                        <p:column  headerText="是否已贴旧二维码" >
                            <h:outputText value="#{item.qrCodeState}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbAssetStatistic_canNotPast}" >
                            <h:outputText value="#{item.canNotPastQrCode}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbAssetStatistic_canNotPastReason}" >
                            <h:outputText value="#{item.reason}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="editButton" rendered="#{!userContextService.zkbAdmin}" actionListener="#{zkbAssetStatisticController.prepareEdit}" icon="ui-icon-pencil" title="#{msg.Edit}" update=":zkbAssetQrCodeInfo :zkbAssetQrCodeInfoEditForm" oncomplete="PF('zkbAssetQrCodeInfo').show()" disabled="#{empty zkbAssetStatisticController.selected}"/>
<!--                            <p:commandButton id="exportButton" ajax="false" title="#{msg.exportToXLS}" actionListener="#{zkbAssetStatisticController.exportAll}" icon="ui-icon-arrowthick-1-s">-->
<!--                                <p:fileDownload value="#{zkbAssetStatisticController.exportFile}"/>-->
<!--                            </p:commandButton>-->
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
                                <p:dataExporter type="xlsx" target="datalist" fileName="Asset_Statistic_Template"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="Edit.xhtml"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
