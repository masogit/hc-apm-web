<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.zkbEngineerManagement}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="zkbEngineerListForm">

                    <h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="5">
                        <p:outputLabel value="#{msg.TenantInfo}*:"/>
                        <p:selectOneMenu style="transform: scale(1.2)"  id="selectionTenantInfo" value="#{zkbEngineerController.selectionTenantInfo}" disabled="#{userContextService.zkbUser}">
                            <p:ajax listener="#{zkbEngineerController.tenantInfoSelect}" update="datalist :zkbEngineerEditForm"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{zkbEngineerController.tenantInfoList}" var="v">
                                <f:selectItem itemLabel="#{v.name}" itemValue="#{v.uid}"/>
                            </c:forEach>
                        </p:selectOneMenu>
                    </h:panelGrid>

                    <p:dataTable id="datalist" value="#{zkbEngineerController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbEngineerController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" listener="#{zkbEngineerController.prepareEdit}" update="deleteButton :zkbEngineerEditForm"/>
                        <p:ajax event="filter" listener="#{zkbEngineerController.onFilter}" />

                        <p:column headerText="#{msg.zkbEngineer_tenant}">
                            <h:outputText value="#{zkbEngineerController.getTenantInfo(item.tenantUID).name}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_phone}" filterBy="#{item.phone}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.phone}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_email}" filterBy="#{item.email}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.email}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_status}" filterBy="#{item.status}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.status}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_age}" filterBy="#{item.age}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.age}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_educationalBackground}" filterBy="#{item.educationalBackground}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.educationalBackground}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_graduateSchool}" filterBy="#{item.graduateSchool}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.graduateSchool}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_specialty}" filterBy="#{item.specialty}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.specialty}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" title="#{msg.Create}" actionListener="#{zkbEngineerController.prepareCreate}" update=":zkbEngineerEditForm" disabled="#{empty zkbEngineerController.selectionTenantInfo}"/>
                            <!--<p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbEngineerController.prepareEdit}" update=":zkbContactPersonEditForm" disabled="#{empty zkbEngineerController.selected.id}"/>-->
                            <p:commandButton id="deleteButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbEngineerController.delete}" update=":zkbEngineerListForm :zkbEngineerEditForm" disabled="#{empty zkbEngineerController.selected.id}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                            <!--<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="ZKB_ContactPerson_Export"/>
                            </p:commandButton>-->
                        </f:facet>

                    </p:dataTable>

                </h:form>

                <ui:include src="Edit.xhtml"/>
            </div>
        </div>
    </ui:define>


</ui:composition>
