<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="zkbEngineerEditForm">
            <p:fieldset legend="#{msg.zkbEngineerInfo}" rendered="#{not empty zkbEngineerController.selected}">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">#{msg.zkbEngineer_tenant}</label>
                        <p:outputLabel value="#{zkbEngineerController.getTenantInfo(zkbEngineerController.selected.tenantUID).name}"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbEngineer_name}*</label>
                        <p:inputText id="name" value="#{zkbEngineerController.selected.name}" required="true" requiredMessage="#{msg.zkbEngineer_name} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbEngineer_phone}*</label>
                        <p:inputText id="phone" value="#{zkbEngineerController.selected.phone}" required="true" requiredMessage="#{msg.zkbEngineer_phone} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbEngineer_email}*</label>
                        <p:inputText id="email" value="#{zkbEngineerController.selected.email}" required="true" requiredMessage="#{msg.zkbEngineer_email} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <!--<h:panelGroup>
                        <label class="label">#{msg.zkbEngineer_status}*</label>
                        <p:selectOneMenu id="status" value="#{zkbEngineerController.selected.status}" required="true" requiredMessage="#{msg.zkbEngineer_status} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItem itemLabel="Y" itemValue="Y"/>
                            <f:selectItem itemLabel="N" itemValue="N"/>
                        </p:selectOneMenu>
                    </h:panelGroup>-->

                    <h:panelGroup>
                        <label class="label">#{msg.zkbEngineer_identityNumber}*</label>
                        <p:inputText id="identityNumber" value="#{zkbEngineerController.selected.identityNumber}"
                                       required="true"
                                       requiredMessage="#{msg.zkbEngineer_identityNumber} #{msg.ValidationRequire}"/>
                    </h:panelGroup>

<!--                    <h:panelGroup>-->
<!--                        <label class="label">#{msg.zkbEngineer_age}*</label>-->
<!--                        <p:inputNumber id="age"  decimalPlaces="0" minValue="0" maxValue="999" value="#{zkbEngineerController.selected.age}" required="true" requiredMessage="#{msg.zkbEngineer_age} #{msg.ValidationRequire}">-->
<!--                            <f:convertNumber pattern="0" type="number"/>-->
<!--                        </p:inputNumber>-->
<!--                    </h:panelGroup>-->

                    <h:panelGroup>
                        <label class="label">#{msg.zkbEngineer_educationalBackground}</label>
                        <p:inputText id="educationalBackground" value="#{zkbEngineerController.selected.educationalBackground}" required="true" requiredMessage="#{msg.zkbEngineer_educationalBackground} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbEngineer_graduateSchool}</label>
                        <p:inputText id="graduateSchool" value="#{zkbEngineerController.selected.graduateSchool}" required="false" requiredMessage="#{msg.zkbEngineer_graduateSchool} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.zkbEngineer_specialty}</label>
                        <p:inputText id="specialty" value="#{zkbEngineerController.selected.specialty}" required="false" requiredMessage="#{msg.zkbEngineer_specialty} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">SSO</label>
                        <p:inputText id="sso" disabled="true" value="#{zkbEngineerController.selected.sso}" />
                    </h:panelGroup>
                </p:panelGrid>

                <p:fieldset id="zkbEngineerTrackRecordFieldset" legend="#{msg.zkbEngineerTrackRecord}" rendered="#{zkbEngineerController.actionName eq 'Edit'}">
                    <p:dataTable id="zkbEngineerTrackRecordDatalist" value="#{zkbEngineerController.zkbEngineerTrackRecordList}" var="zkbEngineerTrackRecordItem"
                                 widgetVar="zkbEngineerTrackRecordDataList" selectionMode="single" selection="#{zkbEngineerController.zkbEngineerTrackRecordSelected}"
                                 lazy="false" paginator="true" rowKey="#{zkbEngineerTrackRecordItem.id}" sortMode="single" sortOrder="ascending" sortBy="#{zkbEngineerTrackRecordItem.hireDate}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                        <p:ajax event="rowSelect" update=":zkbEngineerEditForm:zkbEngineerTrackRecordDatalist:editButton :zkbEngineerEditForm:zkbEngineerTrackRecordDatalist:deleteButton"/>

                        <p:column headerText="#{msg.zkbEngineer_companyName}">
                            <h:outputText value="#{zkbEngineerTrackRecordItem.companyName}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_position}">
                            <h:outputText value="#{zkbEngineerTrackRecordItem.position}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_hireDate}">
                            <h:outputText value="#{zkbEngineerTrackRecordItem.hireDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="#{msg.zkbEngineer_workSeniority}">
                            <h:outputText value="#{zkbEngineerTrackRecordItem.workSeniority}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" title="#{msg.Create}" actionListener="#{zkbEngineerController.prepareZkbEngineerTrackRecordCreate}" update=":growl :zkbEngineerTrackRecordEditDlg" oncomplete="PF('zkbEngineerTrackRecordEditDialog').show()"/>
                            <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbEngineerController.prepareZkbEngineerTrackRecordEdit}" update=":growl :zkbEngineerTrackRecordEditDlg" disabled="#{empty zkbEngineerController.zkbEngineerTrackRecordSelected.id}" oncomplete="PF('zkbEngineerTrackRecordEditDialog').show()"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbEngineerController.deleteZkbEngineerTrackRecord}" update=":growl :zkbEngineerEditForm:zkbEngineerTrackRecordDatalist" disabled="#{empty zkbEngineerController.zkbEngineerTrackRecordSelected.id}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </f:facet>

                    </p:dataTable>
                </p:fieldset>
                <p:fieldset id="zkbEngineerTrainRecordFieldset" legend="培训记录" rendered="#{zkbEngineerController.actionName eq 'Edit'}">
                    <p:dataTable id="zkbEngineerTrainRecordDatalist" value="#{zkbEngineerController.zkbTrainAttendanceRecords}" var="record"
                                 widgetVar="zkbEngineerTrainRecordDataList" selectionMode="single"
                                 lazy="false" paginator="true" rowKey="#{record.id}" sortMode="single" sortOrder="ascending" sortBy="#{zkbEngineerTrainRecordItem.createdDate}"
                                 paginatorTemplate="{Toolbar}" rows="100" emptyMessage="#{msg.noRecordFound}">
                        <p:column headerText="课程名称">
                            <h:outputText value="#{record.courseName}"/>
                        </p:column>
                        <p:column headerText="培训开始时间">
                            <h:outputText value="#{record.trainStartDate}"/>
                        </p:column>
                        <p:column headerText="培训结束时间">
                            <h:outputText value="#{record.trainEndDate}"/>
                        </p:column>
                        <p:column headerText="成绩">
                            <h:outputText value="#{record.finalScore}"/>
                        </p:column>
                        <p:column headerText="状态">
                            <h:outputText value="#{record.status}"/>
                        </p:column>
                    </p:dataTable>
                </p:fieldset>
                <p:fieldset id="zkbEngineerAttachFileInfoFieldset" legend="#{msg.zkbEngineerAttachFileInfo}">
                    <p:panelGrid>
                        <h:panelGroup>
                            <p:dataList id="uploadList" value="#{zkbEngineerController.v2_blobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">附件上传</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
<!--                                <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>-->
                                <p:commandButton actionListener="#{zkbEngineerController.removeFile(fileitem)}" update="uploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:dataList>
                            <p:fileUpload  allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|rar|zip|htm|html|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS|RAR|ZIP|HTM|HTML)$/" fileUploadListener="#{zkbEngineerController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                          multiple="true"  sizeLimit="100000000"  update="uploadList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:commandButton value="#{msg.save}" icon="ui-icon-check" validateClient="true" actionListener="#{zkbEngineerController.save}" update=":growl :zkbEngineerListForm :zkbEngineerEditForm" style="float:left"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{zkbEngineerController.cancel}" update=":growl :zkbEngineerListForm :zkbEngineerEditForm"/>
            </p:fieldset>
        </h:form>

        <ui:include src="zkbEngineerTrackRecordEdit.xhtml"/>
    </div>
</ui:composition>

</html>
