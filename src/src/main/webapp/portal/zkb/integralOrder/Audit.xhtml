<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{zkbIntegralOrderAuditController.CRUDActionName} 积分申请"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbHeadEditForm">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">订单类型*</label>
                        <p:selectOneMenu id="orderType" value="#{zkbIntegralOrderAuditController.selected.orderType}" disabled="true" required="true" requiredMessage="订单类型 #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbIntegralOrderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox')}">
                        <label class="label">机型*</label>
                        <p:selectOneMenu id="artificialType" value="#{zkbIntegralOrderAuditController.selected.artificialType}" disabled="true" required="true" requiredMessage="机型 #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoArtificialType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">申请号*</label>
                        <p:inputText id="partOrderNo" value="#{zkbIntegralOrderAuditController.selected.integralOrderNo}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">当前状态</label>
                        <p:inputText id="currentStatus" value="#{fieldMsg.fieldValue('zkbIntegralOrderStatus', zkbIntegralOrderAuditController.selected.status)}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox')}">
                        <label class="label">System ID</label>
                        <p:inputText  value="#{zkbIntegralOrderAuditController.selected.assetInfo.systemId}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox')}">
                        <label class="label">报修单号</label>
                        <p:inputText  value="#{zkbIntegralOrderAuditController.selected.srNum}" disabled="true"/>
                    </h:panelGroup>
                </p:panelGrid>
            </h:form>
            <p:fieldset id="zkbWorkFlowFieldset" legend="工单信息" rendered="#{!(zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox')}">
                <p:dataTable id="zkbWkDatalist" value="#{zkbIntegralOrderAuditController.v2_listHashMap}" var="item"
                             widgetVar="zkbWkDatalist" selectionMode="single"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">
                    <p:column headerText="设备名称">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column headerText="sys ID">
                        <h:outputText value="#{item.systemId}"/>
                    </p:column>
                    <p:column headerText="报修单号">
                        <h:outputText value="#{item.srNum}"/>
                    </p:column>
                    <p:column headerText="二维码">
                        <h:outputText value="#{item.oneQrCode}"/>
                    </p:column>
                    <p:column headerText="品牌">
                        <h:outputText value="#{item.makerShortName}"/>
                    </p:column>
                    <f:facet name="{Toolbar}">
                    </f:facet>
                </p:dataTable>
            </p:fieldset>
            <p:fieldset id="zkbContractFieldset" legend="合同信息" rendered="#{!(zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox')}">
                <p:dataTable id="zkbContractDatalist" value="#{zkbIntegralOrderAuditController.zkbContractList}" var="item"
                             widgetVar="zkbWkDatalist" selectionMode="single" disabledSelection="true"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">
                    <p:column headerText="#{msg.zkbContact_tenant}">
                        <h:outputText value="#{zkbContractController.getTenantInfo(item.tenantUID).name}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractNo}" >
                        <h:outputText value="#{item.contractNo}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_region}">
                        <h:outputText value="#{item.region}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_contractType}">
                        <h:outputText value="#{item.contractType}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_ibNumber}">
                        <h:outputText value="#{item.ibNumber}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_geArtificialSupportTimes}" >
                        <h:outputText value="#{item.geArtificialSupportTimes}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_spareArtificail}">
                        <h:outputText value="#{item.spareArtificail}"/>
                    </p:column>
                    <p:column headerText="保养名额">
                        <h:outputText value="#{item.ccsbMaintenanceQuota}"/>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_startDate}">
                        <h:outputText value="#{item.startDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.zkbContract_endDate}">
                        <h:outputText value="#{item.endDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <f:facet name="{Toolbar}">
                    </f:facet>
                </p:dataTable>
            </p:fieldset>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbIntegralOrderEditForm" >
                <p:messages id="messages" showDetail="true" closable="false" autoUpdate="true" style="font-size: larger"></p:messages>
                <p:fieldset id="zkbIntegralOrderFieldset" legend="申请信息" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{!(zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox')}">
                        <h:panelGroup>
                            <label class="label">申请人*</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.requestUser}" disabled="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人电话*</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.requestPhone}" disabled="true">
                                <p:ajax />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间*</label>
                            <p:calendar timeZone="GMT+8"  id="requestDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbIntegralOrderAuditController.selected.requestDate}" required="true" requiredMessage="申请时间 #{msg.ValidationRequire}" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">zone*</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.zone}"  disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院名称*</label>
                            <p:inputTextarea id="hospitalName" value="#{zkbIntegralOrderAuditController.selected.hospitalName}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人姓名*</label>
                            <p:inputText id="hospitalRepairer" value="#{zkbIntegralOrderAuditController.selected.hospitalRepairer}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人电话*</label>
                            <p:inputText id="hospitalRepairerPhone" value="#{zkbIntegralOrderAuditController.selected.hospitalRepairerPhone}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">是否为紧急订单*</label>
                            <p:selectOneMenu id="urgentOrder" value="#{zkbIntegralOrderAuditController.selected.urgentOrder}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbUrgentType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="urgencyReasonsGroup" rendered="#{(zkbIntegralOrderAuditController.selected.urgentOrder eq 't')}" style="text-align: left">
                            <label class="label">订单紧急的原因*</label>
                            <p:selectOneMenu id="urgencyReasons" value="#{zkbIntegralOrderAuditController.selected.urgencyReasons}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbUrgentReasonType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">订单数量*</label>
                            <p:inputText id="qty" value="#{zkbIntegralOrderAuditController.selected.qty}" required="true" requiredMessage="订单数量 #{msg.ValidationRequire}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">ZKB工程师姓名*</label>
                            <p:inputText id="zkbEngineerName" value="#{zkbIntegralOrderAuditController.selected.zkbEngineerName}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">ZKB工程师电话*</label>
                            <p:inputText id="zkbEngineerPhone" value="#{zkbIntegralOrderAuditController.selected.zkbEngineerPhone}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputTextarea id= "remark" value="#{zkbIntegralOrderAuditController.selected.remark}" maxlength="255" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">产品型号*</label>
                            <p:inputText id="productNumber" value="#{zkbIntegralOrderAuditController.selected.productNumber}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">故障描述*</label>
                            <p:inputTextarea value="#{zkbIntegralOrderAuditController.selected.faultDescription}" maxlength="255" disabled="true"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox'}">
                        <h:panelGroup>
                            <label class="label">租户*</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.tenantName}" disabled="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人*</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.requestUser}" disabled="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人电话*</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.requestPhone}" disabled="true">
                                <p:ajax />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间*</label>
                            <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbIntegralOrderAuditController.selected.requestDate}" required="true" requiredMessage="申请时间 #{msg.ValidationRequire}" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">工具箱号*</label>
                            <p:selectOneMenu value="#{zkbIntegralOrderAuditController.selected.catId}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{zkbIntegralOrderAuditController.zkbPartOrderCatList}" var="item" itemLabel="#{item.catNo}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">合同号*</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.contractNo}"  disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">数量*</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.qty}"  disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">工程师姓名*</label>
                            <p:inputText  value="#{zkbIntegralOrderAuditController.selected.zkbEngineerName}" disabled="true" required="false"  requiredMessage="工程师姓名 #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">工程师电话*</label>
                            <p:inputText  value="#{zkbIntegralOrderAuditController.selected.zkbEngineerPhone}" disabled="true" required="false"  requiredMessage="工程师电话 #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">工程师学员号*</label>
                            <p:inputText  value="#{zkbIntegralOrderAuditController.selected.zkbEngineerPhone}" disabled="true" required="false"  requiredMessage="工程师电话 #{msg.ValidationRequire}" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputTextarea value="#{zkbIntegralOrderAuditController.selected.remark}" maxlength="255" disabled="true"/>
                        </h:panelGroup>
                       <!-- <h:panelGroup>
                            <label class="label">收货信息*</label>
                            <p:inputTextarea value="#{zkbIntegralOrderAuditController.selected.receivingInfo}" rows="4" cols="120" disabled="true" >
                            </p:inputTextarea>
                        </h:panelGroup>-->
                        <h:panelGroup>
                            <label class="label">收货人*</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.receiver}" disabled="true">
                                <p:ajax />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">收货人电话*</label>
                            <p:inputText id="receiverPhone" value="#{zkbIntegralOrderAuditController.selected.receiverPhone}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">收货地址*</label>
                            <p:inputTextarea id="receiverAddress" value="#{zkbIntegralOrderAuditController.selected.receiverAddress}" disabled="true"/>
                        </h:panelGroup>
                    </p:panelGrid>

                    <h:panelGroup rendered="#{(zkbIntegralOrderAuditController.zkbContract.contractType eq 'CCS' or zkbIntegralOrderAuditController.zkbContract.contractType eq 'Biomed') and zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox'}">
                        <p:dataList id="uploadList" value="#{zkbIntegralOrderAuditController.v2_blobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                            <f:facet name="header">合同附件上传</f:facet>
                            <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                        </p:dataList>

                    </h:panelGroup>
                </p:fieldset>
                <p:fieldset legend="工程师资质审批" rendered="#{zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.showEngineer}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">工程师是否有资质*</label>
                            <p:selectOneMenu value="#{zkbIntegralOrderAuditController.selected.engineerQualificationsFlag}" disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'EngineerQualificationPending')}" required="true" requiredMessage="工程师是否有资质 #{msg.ValidationRequire}" >
                                <p:ajax event="change" update="reject accept" listener="#{zkbIntegralOrderAuditController.engineerQualificationsFlagChange}"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'EngineerQualificationPending')}">
                            <label class="label">工程师资质审批人</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.engineerAuditer}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'EngineerQualificationPending')}">
                            <label class="label">工程师资质审批时间*</label>
                            <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbIntegralOrderAuditController.selected.engineerAuditDate}" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">工程师资质审批备注</label>
                            <p:inputTextarea value="#{zkbIntegralOrderAuditController.selected.engineerRemark}" rows="4" cols="60" disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'EngineerQualificationPending')}">
                            </p:inputTextarea>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset id="managementFieldset" legend="区域经理审批" rendered="#{zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.showManage}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'ManagePending')}">
                            <label class="label">区域经理审批人</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.manageAuditer}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'ManagePending')}">
                            <label class="label">区域经理审批时间*</label>
                            <p:calendar timeZone="GMT+8"  id="manageAuditDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbIntegralOrderAuditController.selected.manageAuditDate}" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.haveTrainCourseFlag}">
                            <label class="label">是否上过培训课*</label>
                            <p:selectOneMenu value="#{zkbIntegralOrderAuditController.selected.haveTrainCourseFlag}"  disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'ManagePending')}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">区域经理审批备注</label>
                            <p:inputTextarea id="manageRemark" value="#{zkbIntegralOrderAuditController.selected.manageRemark}" rows="4" cols="60" disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'ManagePending')}">
                            </p:inputTextarea>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset id="CommercialFieldset" legend="Commercial审批" rendered="#{zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.showCommercial}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'CommercialPending')}">
                            <label class="label">Commercial审批人</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.commercialAuditer}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'CommercialPending')}">
                            <label class="label">Commercial审批时间</label>
                            <p:calendar timeZone="GMT+8" id="CommercialAuditDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbIntegralOrderAuditController.selected.commercialAuditDate}" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">Commercial审批备注</label>
                            <p:inputTextarea id="CommercialRemark" value="#{zkbIntegralOrderAuditController.selected.commercialRemark}" rows="2" cols="20" disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'CommercialPending')}">
                            </p:inputTextarea>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset id="orderedFieldset" legend="400派工" rendered="#{zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.showOrder}">
                    <p:outputLabel style="color: red;font-weight:bold;margin-left: 12px;font-size: small" value="#{zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.maintainTips}"/>
                    <p:panelGrid id="orderedGrid" columns="#{zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox' ? 2 :3}" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <c:if test="#{!(zkbIntegralOrderAuditController.selected.status eq 'OrderedReject') and !(zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox')}">
                            <h:panelGroup >
                                <label class="label">SR#*</label>
                                <p:inputText value="#{zkbIntegralOrderAuditController.selected.srNo}" disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'OrderPending' and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag) }" required="true" requiredMessage="#{msg.zkbPartOrder_srNo} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">Act#*</label>
                                <p:inputText value="#{zkbIntegralOrderAuditController.selected.activityNo}" disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'OrderPending' and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_activityNo} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">GE工程师姓名*</label>
                                <p:inputText value="#{zkbIntegralOrderAuditController.selected.geEngineerName}" disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'OrderPending' and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_geEngineerName} #{msg.ValidationRequire}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">GE工程师电话*</label>
                                <p:inputText value="#{zkbIntegralOrderAuditController.selected.geEngineerPhone}" disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'OrderPending' and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_geEngineerPhone} #{msg.ValidationRequire}" />
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">是否扣除积分*</label>
                                <p:selectOneMenu id="whetherDeduct" value="#{zkbIntegralOrderAuditController.selected.whetherDeduct}" disabled="#{zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.whetherDeductEdit or !(zkbIntegralOrderAuditController.selected.currentStep eq 'OrderPending' and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag)}" required="true" requiredMessage="#{msg.zkbPartOrder_whetherDeduct} #{msg.ValidationRequire}" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbCommonYOrN')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </c:if>
                        <c:if test="#{!(zkbIntegralOrderAuditController.selected.status eq 'OrderedReject') and zkbIntegralOrderAuditController.selected.orderType eq 'ToolBox'}">
                            <c:if test="#{(zkbIntegralOrderAuditController.zkbContract.contractType eq 'CCS' or zkbIntegralOrderAuditController.zkbContract.contractType eq 'Biomed') and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag}">
                                <h:panelGroup>
                                    <p:outputLabel style="color: red; " value="请审核上传的附件是否符合订购要求，CCS和Biomed合同要求合同里注明积分兑换活动" />
                                    <p:commandLink validateClient="false" immediate="false" process="@this" value="查看示例" oncomplete="PF('showSampleDlg').show()" />
                                </h:panelGroup>
                                <h:panelGroup></h:panelGroup>
                            </c:if>
                            <h:panelGroup>
                                <label class="label">Order#*</label>
                                <p:inputText value="#{zkbIntegralOrderAuditController.selected.orderNo}" disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'OrderPending' and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag)}" required="true" requiredMessage="订单号 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                        </c:if>

                        <h:panelGroup>
                            <c:if test="#{!(zkbIntegralOrderAuditController.selected.status eq 'OrderedReject')}">
                                <label class="label">备注</label>
                            </c:if>
                            <c:if test="#{zkbIntegralOrderAuditController.selected.status eq 'OrderedReject'}">
                                <label class="label">拒绝原因</label>
                            </c:if>
                            <p:inputTextarea  value="#{zkbIntegralOrderAuditController.selected.orderedRemark}"  rows="2" cols="20" disabled="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'OrderPending' and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag)}">
                            </p:inputTextarea>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'OrderPending')}">
                            <label class="label">下单审批人</label>
                            <p:inputText value="#{zkbIntegralOrderAuditController.selected.orderedAuditer}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(zkbIntegralOrderAuditController.selected.currentStep eq 'OrderPending')}">
                            <label class="label">下单审批时间*</label>
                            <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbIntegralOrderAuditController.selected.orderedDate}" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                    </p:panelGrid>

                </p:fieldset>
                <p:commandButton id="accept" validateClient="true" value="审批通过" action="#{zkbIntegralOrderAuditController.normalNext(true)}" update=":growl" icon="ui-icon-check" rendered="#{(zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.showBtn eq 'Audit') and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag}" disabled="#{!zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.toolBoxAuditBtnFlag}" />
                <p:commandButton id="reject" immediate="false" process="@this" value="审批不通过" action="#{zkbIntegralOrderAuditController.normalNext(false)}" update=":growl" icon="ui-icon-close" rendered="#{zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.showBtn eq 'Audit' and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag}" />
                <p:commandButton validateClient="true" value="提交" action="#{zkbIntegralOrderAuditController.normalNext(true)}" icon="ui-icon-check" rendered="#{zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.showBtn eq 'Submit' and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag}"/>
                <!--<p:commandButton immediate="false" process="@this" value="拒绝" action="#{zkbIntegralOrderAuditController.normalNext(false)}" icon="ui-icon-check" rendered="#{zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.showBtn eq 'Submit' and zkbIntegralOrderAuditController.zkbIntegralOrderStatusVo.canEditFlag}"/>-->
                <p:commandButton immediate="false"  process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back" action="#{zkbIntegralOrderAuditController.backList}" />

            </h:form>
        </div>
        <p:dialog id="showSampleDlg" widgetVar="showSampleDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="查看示例" height="320">
            <p:graphicImage url="image.png" style="width: 800px; height: 300px;"/>

        </p:dialog>

    </ui:define>
</ui:composition>
