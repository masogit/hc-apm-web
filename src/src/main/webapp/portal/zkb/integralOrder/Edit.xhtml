<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{zkbIntegralOrderEditController.CRUDActionName} 积分申请"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="zkbHeadEditForm">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">订单类型*</label>
                        <p:selectOneMenu value="#{zkbIntegralOrderEditController.selected.orderType}"  required="true" >
                            <p:ajax event="change" update="zkbwkEditForm zkbContractForm zkbIntegralOrderEditForm artificialTypeGroup" listener="#{zkbIntegralOrderEditController.orderTypeChange()}"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbIntegralOrderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup id="artificialTypeGroup">
                        <h:panelGroup rendered="#{not empty zkbIntegralOrderEditController.selected.orderType and !(zkbIntegralOrderEditController.selected.orderType eq 'ToolBox')}" >
                            <label class="label">机型*</label>
                            <p:selectOneMenu id="artificialType" value="#{zkbIntegralOrderEditController.selected.artificialType}" required="true" requiredMessage="#{msg.zkbPartOrder_artificialType} #{msg.ValidationRequire}">
                                <p:ajax/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoArtificialType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </h:panelGroup>

                </p:panelGrid>

            </h:form>
            <h:form id="zkbwkEditForm">
                <p:messages id="messages" showDetail="true" closable="false" autoUpdate="true"></p:messages>
                <p:fieldset id="zkbWorkFlowFieldset" legend="工单信息" rendered="#{(not empty zkbIntegralOrderEditController.selected.orderType) and !(zkbIntegralOrderEditController.selected.orderType eq 'ToolBox')}" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">设备sysID</label>
                            <p:inputText id="qrCode" value="#{zkbIntegralOrderEditController.queryWorkFlow.assetInfo.systemId}" maxlength="100" required="false"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">报修单号</label>
                            <p:inputText id="assetName" value="#{zkbIntegralOrderEditController.queryWorkFlow.serviceRequest.srNum}" maxlength="100" required="false"/>
                        </h:panelGroup>
                        <p:commandButton validateClient="false"  actionListener="#{zkbIntegralOrderEditController.queryWorkFlowList()}" value="#{msg.Search}" update="zkbwkEditForm zkbContractForm zkbIntegralOrderEditForm" />
                    </p:panelGrid>
                    <p:dataTable id="zkbWkDatalist" value="#{zkbIntegralOrderEditController.v2_listHashMap}" var="item"
                                 widgetVar="zkbWkDatalist" selectionMode="single" selection="#{zkbIntegralOrderEditController.selectedWorkFlow}"
                                 lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">
                        <p:ajax event="rowSelect"  listener="#{zkbIntegralOrderEditController.workFlowSelected}" update="zkbwkEditForm zkbIntegralOrderEditForm zkbContractForm"/>
                        <p:column headerText="设备名称">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="sys ID">
                            <h:outputText value="#{item.systemId}"/>
                        </p:column>
                        <p:column headerText="报修单号">
                            <h:outputText value="#{item.srNum}"/>
                        </p:column>
                        <p:column headerText="二维码">
                            <h:outputText value="#{item.oneQrCode}"/>
                        </p:column>
                        <p:column headerText="品牌">
                            <h:outputText value="#{item.makerShortName}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>
            </h:form>
            <h:form id="zkbContractForm">
                <p:fieldset id="zkbContractFieldset" legend="合同信息" rendered="#{(not empty zkbIntegralOrderEditController.selected.orderType) and !(zkbIntegralOrderEditController.selected.orderType eq 'ToolBox')}">
                    <p:dataTable id="zkbContractDatalist" value="#{zkbIntegralOrderEditController.contractList}" var="item"
                                 widgetVar="zkbContractDatalist" selectionMode="single"
                                 rowKey="#{item.id}"  sortBy="#{item.id}"
                                 paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}" >
                        <p:column headerText="#{msg.zkbContact_tenant}">
                            <h:outputText value="#{zkbContractController.getTenantInfo(item.tenantUID).name}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContract_contractNo}" >
                            <h:outputText value="#{item.contractNo}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContract_region}">
                            <h:outputText value="#{item.region}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContract_contractType}">
                            <h:outputText value="#{item.contractType}"/>
                        </p:column>

                        <p:column headerText="#{msg.zkbContract_ibNumber}">
                            <h:outputText value="#{item.ibNumber}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContract_geArtificialSupportTimes}" >
                            <h:outputText value="#{item.geArtificialSupportTimes}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContract_spareArtificail}">
                            <h:outputText value="#{item.spareArtificail}"/>
                        </p:column>
                        <p:column headerText="保养剩余名额">
                            <h:outputText value="#{item.ccsbMaintenanceQuota}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContract_startDate}">
                            <h:outputText value="#{item.startDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.zkbContract_endDate}">
                            <h:outputText value="#{item.endDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <f:facet name="{Toolbar}">
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>
            </h:form>
            <h:form id="zkbIntegralOrderEditForm" >
                <p:fieldset id="notToolApply" legend="申请信息" rendered="#{zkbIntegralOrderEditController.showBodyForm() eq '2'}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">申请人*</label>
                            <p:inputText value="#{zkbIntegralOrderEditController.selected.requestUser}" disabled="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人电话*</label>
                            <p:inputText value="#{zkbIntegralOrderEditController.selected.requestPhone}" required="true" requiredMessage="#{msg.zkbPartOrder_requestPhone} #{msg.ValidationRequire}" >
                                <p:ajax />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间*</label>
                            <p:calendar timeZone="GMT+8"  id="requestDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbIntegralOrderEditController.selected.requestDate}" required="true" requiredMessage="#{msg.zkbPartOrder_requestDate} #{msg.ValidationRequire}" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">zone*</label>
                            <p:inputText value="#{zkbIntegralOrderEditController.selected.zone}" required="true" requiredMessage="#{msg.zkbPartOrder_hospitalRepairer} #{msg.ValidationRequire}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院名称*</label>
                            <p:inputTextarea id="hospitalName" value="#{zkbIntegralOrderEditController.selected.hospitalName}"  required="true" requiredMessage="#{msg.zkbPartOrder_hospitalName} #{msg.ValidationRequire}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人姓名*</label>
                            <p:inputText id="hospitalRepairer" value="#{zkbIntegralOrderEditController.selected.hospitalRepairer}" required="true" requiredMessage="#{msg.zkbPartOrder_hospitalRepairer} #{msg.ValidationRequire}" disabled="#{!(empty zkbIntegralOrderEditController.selected.hospitalRepairer) or !zkbIntegralOrderEditController.zkbIntegralOrderStatusVo.canEditFlag}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院报修人电话*</label>
                            <p:inputText id="hospitalRepairerPhone" value="#{zkbIntegralOrderEditController.selected.hospitalRepairerPhone}" required="true" requiredMessage="#{msg.zkbPartOrder_hospitalRepairerPhone} #{msg.ValidationRequire}" disabled="#{!(empty zkbIntegralOrderEditController.selected.hospitalRepairer) or !zkbIntegralOrderEditController.zkbIntegralOrderStatusVo.canEditFlag}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">是否为紧急订单*</label>
                            <p:selectOneMenu id="urgentOrder" value="#{zkbIntegralOrderEditController.selected.urgentOrder}" required="false" requiredMessage="#{msg.zkbPartOrder_urgentOrder} #{msg.ValidationRequire}" >
                                <p:ajax event="change" update="urgencyReasonsGrid" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbUrgentType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="urgencyReasonsGrid" columns="1" layout="grid" styleClass="ui-panelgrid-blank" >
                            <h:panelGroup id="urgencyReasonsGroup" rendered="#{(zkbIntegralOrderEditController.selected.urgentOrder eq 't')}" style="text-align: left">
                                <label class="label">订单紧急的原因*</label>
                                <p:selectOneMenu id="urgencyReasons" value="#{zkbIntegralOrderEditController.selected.urgencyReasons}" required="false" requiredMessage="#{msg.zkbPartOrder_urgencyReasons} #{msg.ValidationRequire}" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbUrgentReasonType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">订单数量*</label>
                            <p:inputText id="qty" value="#{zkbIntegralOrderEditController.selected.qty}" required="true" requiredMessage="#{msg.zkbPartOrder_qty} #{msg.ValidationRequire}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">ZKB工程师姓名*</label>
                            <p:inputText id="zkbEngineerName" value="#{zkbIntegralOrderEditController.selected.zkbEngineerName}" required="false"  requiredMessage="ZKB工程师姓名 #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">ZKB工程师电话*</label>
                            <p:inputText id="zkbEngineerPhone" value="#{zkbIntegralOrderEditController.selected.zkbEngineerPhone}" required="false"  requiredMessage="ZKB工程师电话 #{msg.ValidationRequire}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputTextarea id= "remark" value="#{zkbIntegralOrderEditController.selected.remark}" maxlength="255" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">产品型号*</label>
                            <p:inputText id="productNumber" value="#{zkbIntegralOrderEditController.selected.productNumber}" required="false" requiredMessage="#{msg.zkbPartOrder_productNumber} #{msg.ValidationRequire}" disabled="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">故障描述*</label>
                            <p:inputTextarea value="#{zkbIntegralOrderEditController.selected.faultDescription}" maxlength="255" required="true" requiredMessage="#{msg.zkbPartOrder_faultDescription} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset id="toolApply" legend="申请信息" rendered="#{zkbIntegralOrderEditController.showBodyForm() eq '1'}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">租户*</label>
                            <p:inputText value="#{zkbIntegralOrderEditController.selected.tenantName}" disabled="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人*</label>
                            <p:inputText value="#{zkbIntegralOrderEditController.selected.requestUser}" disabled="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人电话*</label>
                            <p:inputText value="#{zkbIntegralOrderEditController.selected.requestPhone}" required="true" requiredMessage="#{msg.zkbPartOrder_requestPhone} #{msg.ValidationRequire}" >
                                <p:ajax />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间*</label>
                            <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" value="#{zkbIntegralOrderEditController.selected.requestDate}" required="true" requiredMessage="#{msg.zkbPartOrder_requestDate} #{msg.ValidationRequire}" showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">合同号*</label>
                            <p:selectOneMenu value="#{zkbIntegralOrderEditController.selected.contractId}" required="false" requiredMessage="合同号不能为空！" valueChangeListener="#{zkbIntegralOrderEditController.contractChange}" >
                                <p:ajax event="change" update="uploadGrip save submit"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{zkbIntegralOrderEditController.contractList}" var="item" itemLabel="#{item.contractNo}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">工具箱号*</label>
                            <p:selectOneMenu value="#{zkbIntegralOrderEditController.selected.catId}" required="false" requiredMessage="工具箱号不能为空！" >
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{zkbIntegralOrderEditController.zkbPartOrderCatList}" var="item" itemLabel="#{item.catNo}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                            <p:outputLabel id="xxx" style="color: red" value="为符合GE医疗合规要求，代理商应确保工具的完好，自行补充损坏的工具，按时自行通过社会计量机构校验万用表" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">数量*</label>
                            <p:inputText value="#{zkbIntegralOrderEditController.selected.qty}" required="false" requiredMessage="#{msg.zkbPartOrder_qty} #{msg.ValidationRequire}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">工程师姓名*</label>
                            <p:inputText  value="#{zkbIntegralOrderEditController.selected.zkbEngineerName}" required="false"  requiredMessage="工程师姓名 #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">工程师电话*</label>
                            <p:inputText  value="#{zkbIntegralOrderEditController.selected.zkbEngineerPhone}" required="false"  requiredMessage="工程师电话 #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">工程师学员号*</label>
                            <p:inputText  value="#{zkbIntegralOrderEditController.selected.engineerNo}" required="false"  requiredMessage="工程师学员号 #{msg.ValidationRequire}" />
                            <p:outputLabel style="color: red; margin-left: 5px;" value="ZKB+6位数字" />
                        </h:panelGroup>

                       <!-- <h:panelGroup>
                            <label class="label">收货信息*</label>
                            <p:inputTextarea value="#{zkbIntegralOrderEditController.selected.receivingInfo}" rows="4" cols="120" required="false" requiredMessage="收货信息不能为空！" >
                            </p:inputTextarea>
                        </h:panelGroup>-->
                        <h:panelGroup>
                            <label class="label">收货人*</label>
                            <p:inputText value="#{zkbIntegralOrderEditController.selected.receiver}" required="false" requiredMessage="#{msg.zkbPartOrder_receiver} #{msg.ValidationRequire}" >
                                <p:ajax />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">收货人电话*</label>
                            <p:inputText id="receiverPhone" value="#{zkbIntegralOrderEditController.selected.receiverPhone}"  required="false" requiredMessage="#{msg.zkbPartOrder_receiverPhone} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">收货地址*</label>
                            <p:inputTextarea id="receiverAddress" value="#{zkbIntegralOrderEditController.selected.receiverAddress}" required="false" requiredMessage="#{msg.zkbPartOrder_receiverAddress} #{msg.ValidationRequire}" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputTextarea value="#{zkbIntegralOrderEditController.selected.remark}" maxlength="255" />
                        </h:panelGroup>
                    </p:panelGrid>

                    <h:panelGroup id="uploadGrip">
                        <!--<h:panelGroup rendered="#{(zkbIntegralOrderEditController.selectedContract.contractType eq 'CCS' or zkbIntegralOrderEditController.selectedContract.contractType eq 'Biomed') and zkbIntegralOrderEditController.selected.orderType eq 'ToolBox'}">-->
                        <h:panelGroup rendered="#{false and zkbIntegralOrderEditController.selected.orderType eq 'ToolBox'}">
                            <p:dataList id="uploadList" value="#{zkbIntegralOrderEditController.v2_blobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">合同附件上传</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                <p:commandButton actionListener="#{zkbIntegralOrderEditController.removeFile(fileitem)}" update="uploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this" >
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:dataList>
                            <p:fileUpload id="uploadFile" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|rar|zip|htm|html|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS|RAR|ZIP|HTM|HTML)$/" fileUploadListener="#{zkbIntegralOrderEditController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                          multiple="true"  sizeLimit="100000000"  update="uploadList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}" />
                            <p:panel id="warmMessageCT">
                                <p:outputLabel style="color: red; margin-left: 5px;" value="请确保上传的合同里显示有积分兑换" />
                                <p:commandLink validateClient="false" immediate="false" process="@this" value="查看示例" oncomplete="PF('showSampleDlg').show()" />
                            </p:panel>
                        </h:panelGroup>
                    </h:panelGroup>
                </p:fieldset>
                <p:fieldset id="regionalManagerFieldset" legend="区域经理信息" rendered="#{zkbIntegralOrderEditController.showBodyForm() and zkbIntegralOrderEditController.showRegionalManager}" >
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">姓名</label>
                            <p:inputText id="regionalManagerName" value="#{zkbIntegralOrderEditController.selected.regionalManagerName}" disabled="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">邮箱</label>
                            <p:inputText id="regionalManagerEmail" value="#{zkbIntegralOrderEditController.selected.regionalManagerEmail}" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">电话</label>
                            <p:calendar id="regionalManagerPhone" value="#{zkbIntegralOrderEditController.selected.regionalManagerPhone}" disabled="true"  />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:commandButton id="save" value="保存" icon="ui-icon-save" validateClient="false"  update=":growl :zkbIntegralOrderEditForm" action="#{zkbIntegralOrderEditController.tempSave()}" disabled="#{!(zkbIntegralOrderEditController.zkbIntegralOrderStatusVo.scoreCanApply)}" rendered="#{!(zkbIntegralOrderEditController.showBodyForm() eq '0')}"/>
                <p:commandButton id="submit" value="提交" icon="ui-icon-check" validateClient="true"  update=":growl :saveTipDlg" action="#{zkbIntegralOrderEditController.preSave}" oncomplete="validShow(args, 'saveTipDlg');" disabled="#{!(zkbIntegralOrderEditController.zkbIntegralOrderStatusVo.scoreCanApply)}" rendered="#{!(zkbIntegralOrderEditController.showBodyForm() eq '0')}"/>
                <p:commandButton immediate="false" process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back" action="#{zkbIntegralOrderEditController.backList}" />
            </h:form>

            <p:dialog id="saveTipDlg" widgetVar="saveTipDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="确认" height="150">
                <h:form id="saveTipForm">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label style="color: red">#{zkbIntegralOrderEditController.zkbIntegralOrderStatusVo.quotaTips}</label>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <div style="text-align: center">
                        <p:commandButton validateClient="true" value="#{msg.Confirm}" action="#{zkbIntegralOrderEditController.saveData}" oncomplete="PF('saveTipDlg').hide()" update=":growl" icon="ui-icon-check" />
                        <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('saveTipDlg').hide()" style="margin-left: 30px"/>
                    </div>

                </h:form>

            </p:dialog>

            <p:dialog id="showSampleDlg" widgetVar="showSampleDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="查看示例" height="320">
                <p:graphicImage url="image.png" style="width: 800px; height: 300px;"/>

            </p:dialog>

            <script type="text/javascript">
                function validShow(args, dialog) {
                    debugger;
                    var jqDialog = jQuery('#' + dialog);
                    if (args.validationFailed) {
                        PF(dialog).hide();
                    } else {
                        PF(dialog).show();
                    }
                }

            </script>
        </div>
        <div style="position:absolute;top:6rem;right:1rem;font-size:1.2rem">
            当前积分：<label style="color: red; font-size: xx-large">#{zkbIntegralOrderEditController.zkbIntegralOrderStatusVo.currentScore}</label>
        </div>
    </ui:define>
</ui:composition>
