<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="zkbContractCourseEditDlg" widgetVar="zkbContractCourseEditDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="课程操作"   height="430">

        <h:form id="zkbContractCourseEditForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label class="label">课程*</label>
                    <p:autoComplete dropdown="true" value="#{zkbContractEditController.zkbContractCourseSelected.zkbCourse}"  scrollHeight="300" forceSelection="true" required="true"
                                    completeMethod="#{zkbContractEditController.autoCompleteCourse}" var="t" itemLabel="#{t.cname}" itemValue="#{t}" converter="zkbCourseConverter">
                    </p:autoComplete>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">培训合同号*</label>
                    <p:inputText required="true" requiredMessage="培训合同号 不能为空" value="#{zkbContractEditController.zkbContractCourseSelected.courseContractNo}" />
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">课程总额度*</label>
<!--                    <p:spinner id="courseCountTotal" value="#{zkbContractEditController.zkbContractCourseSelected.mainCourseCountTotal}" min="1" max="1000" />-->
                    <p:inputNumber required="true" requiredMessage="课程总额度 不能为空"  id="courseCountTotal"  minValue="0" decimalPlaces="1" value="#{zkbContractEditController.zkbContractCourseSelected.mainCourseCountTotal}">
                    </p:inputNumber>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">课程剩余额度*</label>
<!--                    <p:spinner id="courseCount" value="#{zkbContractEditController.zkbContractCourseSelected.mainCourseCount}" min="0" max="1000" />-->
                    <p:inputNumber required="true" requiredMessage="课程剩余额度 不能为空" id="courseCount"  minValue="0" decimalPlaces="1" value="#{zkbContractEditController.zkbContractCourseSelected.mainCourseCount}">
                    </p:inputNumber>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">课程申请额度*</label>
<!--                    <p:spinner id="courseCountApply" value="#{zkbContractEditController.zkbContractCourseSelected.mainCourseCountApply}" min="0" max="1000" />-->
                    <p:inputNumber required="true" requiredMessage="课程申请额度 不能为空" id="courseCountApply"  minValue="0" decimalPlaces="1" value="#{zkbContractEditController.zkbContractCourseSelected.mainCourseCountApply}">
                    </p:inputNumber>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">课程已使用额度*</label>
<!--                    <p:spinner id="courseCountUse" value="#{zkbContractEditController.zkbContractCourseSelected.mainCourseCountUse}" min="0" max="1000" />-->
                    <p:inputNumber required="true" requiredMessage="课程已使用额度 不能为空" id="courseCountUse"  minValue="0" decimalPlaces="1"  value="#{zkbContractEditController.zkbContractCourseSelected.mainCourseCountUse}">
                    </p:inputNumber>
                </h:panelGroup>
                <h:panelGroup rendered="#{zkbContractEditController.actionDetailName eq 'Edit'}">
                    <label class="label">操作原因*</label>
                    <p:inputTextarea rows="5" cols="30" id="opRemark" value="#{zkbContractEditController.reason}" required="true" requiredMessage="原因不能为空">
                    </p:inputTextarea>
                </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{zkbContractEditController.saveDetail}" update=":growl :zkbContractEditForm:zkbContractCourseDatalist"
                 icon="ui-icon-check" oncomplete="PF('zkbContractCourseEditDlg').hide()" />
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbContractCourseEditDlg').hide()"/>
        </h:form>
    </p:dialog>
    
</ui:composition>
</html>
