<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="zkbContractCourseEditDlg" widgetVar="zkbContractCourseEditDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="合同详情" height="300">

        <h:form id="zkbContractCourseEditForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label class="label">课程*</label>
                    <p:autoComplete dropdown="true" value="#{zkbContractEditController.zkbContractCourseSelected.zkbCourse}"  scrollHeight="300" forceSelection="true" required="true"
                                    completeMethod="#{zkbContractEditController.autoCompleteCourse}" var="t" itemLabel="#{t.cname}" itemValue="#{t}" converter="zkbCourseConverter">
                    </p:autoComplete>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">数量</label>
                    <p:inputText id="remark" value="#{zkbContractEditController.zkbContractCourseSelected.courseCount}" />
                </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{zkbContractEditController.saveDetail}" update=":growl :zkbContractEditForm:zkbContractCourseDatalist" icon="ui-icon-check" />
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbContractCourseEditDlg').hide()"/>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
