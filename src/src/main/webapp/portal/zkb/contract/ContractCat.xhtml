<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="zkbContractCatEditDlg" widgetVar="zkbContractCatEditDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="高值探头操作"  width="450" height="500">
        <h:form id="zkbContractCatEditForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label class="label">sn编号*</label>
                    <p:panelGrid columns="2" layout="grid">
                        <h:panelGroup >
                            <p:inputText id="snNo" disabled="#{zkbContractEditController.fourInOneFlag}"  required="true" requiredMessage="sn编号不能为空" value="#{zkbContractEditController.zkbContractCatSelected.snNo}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:selectBooleanCheckbox value="#{zkbContractEditController.fourInOneFlag}" itemLabel="是否选择四合一" style="float: left">
                                <p:ajax update="snNo" listener="#{zkbContractEditController.fourInOneFlagChange}"/>
                            </p:selectBooleanCheckbox>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:outputLabel style="color: red;font-weight:bold;margin-left: 15px;" value="四合一请勾选单选框"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">状态*</label>
                    <p:selectOneMenu id="orderType" value="#{zkbContractEditController.zkbContractCatSelected.enabled}" required="true" requiredMessage="状态 #{msg.ValidationRequire}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractCatEnabled')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup rendered="#{zkbContractEditController.actionCatName eq 'Edit'}">
                    <label class="label">操作原因*</label>
                    <p:inputTextarea rows="5" cols="30" id="opRemark" value="#{zkbContractEditController.reason}" required="true" requiredMessage="原因不能为空">
                    </p:inputTextarea>
                </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{zkbContractEditController.saveCat}" update=":growl :zkbContractEditForm:zkbContractCatDatalist :zkbContractCatEditDlg"
                 icon="ui-icon-check" oncomplete="PF('zkbContractCatEditDlg').hide()" />
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbContractCatEditDlg').hide()"  />
        </h:form>
    </p:dialog>
    
</ui:composition>
</html>
