<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="zkbContractAssetModifyDlg" widgetVar="zkbContractAssetModifyDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="设备编辑操作" width="40%"  height="520">

        <h:form id="zkbContractAssetModifyForm">
            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 100%;" >
                <h:panelGroup>
                    <label class="label">二维码</label>
                    <p:inputText value="#{zkbContractEditController.zkbContractAssetSelected.assetInfo.qrCode}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">设备名称</label>
                    <p:inputText value="#{zkbContractEditController.zkbContractAssetSelected.assetInfo.name}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">设备编号</label>
                    <p:inputText value="#{zkbContractEditController.zkbContractAssetSelected.assetInfo.departNum}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">所属科室</label>
                    <p:inputText value="#{zkbContractEditController.zkbContractAssetSelected.assetInfo.clinicalDeptName}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">设备型号</label>
                    <p:inputText value="#{zkbContractEditController.zkbContractAssetSelected.assetInfo.functionType}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">Sys ID</label>
                    <p:inputText value="#{zkbContractEditController.zkbContractAssetSelected.assetInfo.systemId}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">维修类型</label>
                    <p:selectOneMenu id="repairForm" value="#{zkbContractEditController.zkbContractAssetSelected.assetInfo.repairForm}" required="true" requiredMessage="维修类型 #{msg.ValidationRequire}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('repairForm')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">是否超声高低机*</label>
                    <p:selectOneMenu id="status" value="#{zkbContractEditController.zkbContractAssetSelected.assetType}" required="true" requiredMessage="是否超声高低机 #{msg.ValidationRequire}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractAssetType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">是否代理商自身原因未完成培训*</label>
                    <p:selectOneMenu value="#{zkbContractEditController.zkbContractAssetSelected.trainReasonFlag}" required="true" requiredMessage="是否代理商自身原因未完成培训 #{msg.ValidationRequire}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('zkbPoAssetTrainReasonFlag')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">是否由GE FE提供年度1次现场保养*</label>
                    <p:selectOneMenu value="#{zkbContractEditController.zkbContractAssetSelected.supportMaintainFlag}" required="true" requiredMessage="是否由GE FE提供年度1次现场保养 #{msg.ValidationRequire}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItem itemLabel="是" itemValue="t"/>
                        <f:selectItem itemLabel="否" itemValue="f"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">zone*</label>
                    <p:selectOneMenu value="#{zkbContractEditController.zkbContractAssetSelected.zone}" required="true" requiredMessage="是否代理商自身原因未完成培训 #{msg.ValidationRequire}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{zkbContractEditController.queryZoneByRegion()}" var="item" itemLabel="#{item.zone}" itemValue="#{item.zone}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
              <!--  <h:panelGroup>
                    <label class="label">开始日期*</label>
                    <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd" value="#{zkbContractEditController.zkbContractAssetSelected.maintainStartDate}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">结束日期*</label>
                    <p:calendar timeZone="GMT+8"   pattern="yyyy/MM/dd" value="#{zkbContractEditController.zkbContractAssetSelected.maintainEndDate}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>-->
                <h:panelGroup rendered="#{zkbContractEditController.actionAssetName eq 'Edit'}">
                    <label class="label">操作原因*</label>
                    <p:inputTextarea rows="5" cols="30" id="opRemark" value="#{zkbContractEditController.reason}" required="true" requiredMessage="原因不能为空">
                    </p:inputTextarea>
                </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{zkbContractEditController.saveAssetEdit}" update=":growl :zkbContractEditForm:zkbContractAssetDatalist"
                 icon="ui-icon-check" oncomplete="PF('zkbContractAssetModifyDlg').hide()" />
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbContractAssetModifyDlg').hide()"/>
        </h:form>
    </p:dialog>
    
</ui:composition>
</html>
