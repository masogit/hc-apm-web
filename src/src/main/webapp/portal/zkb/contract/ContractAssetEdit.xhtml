<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="zkbContractAssetModifyDlg" widgetVar="zkbContractAssetModifyDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="课程操作"   height="380">

        <h:form id="zkbContractAssetModifyForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label class="label">二维码</label>
                    <p:inputText value="#{zkbContractEditController.selectedZkbContractAsset.assetInfo.qrCode}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">设备名称</label>
                    <p:inputText value="#{zkbContractEditController.selectedZkbContractAsset.assetInfo.name}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">设备编号</label>
                    <p:inputText value="#{zkbContractEditController.selectedZkbContractAsset.assetInfo.departNum}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">所属科室</label>
                    <p:inputText value="#{zkbContractEditController.selectedZkbContractAsset.assetInfo.clinicalDeptName}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">设备型号</label>
                    <p:inputText value="#{zkbContractEditController.selectedZkbContractAsset.assetInfo.functionType}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">Sys ID</label>
                    <p:inputText value="#{zkbContractEditController.selectedZkbContractAsset.assetInfo.systemId}" disabled="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">维修类型</label>
                    <p:inputText value="#{zkbContractEditController.getRepairForm(zkbContractEditController.selectedZkbContractAsset.assetInfo.repairForm)}" disabled="true" />
                </h:panelGroup>
                
                <h:panelGroup rendered="#{zkbContractEditController.actionDetailName eq 'Edit'}">
                    <label class="label">操作原因*</label>
                    <p:inputTextarea rows="5" cols="30" id="opRemark" value="#{zkbContractEditController.reason}" required="true" requiredMessage="原因不能为空">
                    </p:inputTextarea>
                </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{zkbContractEditController.saveDetail}" update=":growl :zkbContractEditForm:zkbContractCourseDatalist"
                 icon="ui-icon-check" oncomplete="PF('zkbContractAssetModifyDlg').hide()" />
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbContractAssetModifyDlg').hide()"/>
        </h:form>
    </p:dialog>
    
</ui:composition>
</html>
