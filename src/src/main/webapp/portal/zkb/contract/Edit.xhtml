<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{zkbContractEditController.CRUDActionName} #{msg.ContractInfo}"/>
        </div>
        <div class="ui-g-12 card">
            <h:form id="zkbContractEditForm">
                <p:fieldset legend="合同详情" rendered="#{not empty zkbContractEditController.selected}">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContact_tenant}</label>
                            <!--<p:outputLabel value="#{zkbContractEditController.getTenantInfo(zkbContractEditController.selected.tenantUID).name}"/>-->
                            <p:selectOneMenu style="transform: scale(1.2)"  id="selectionTenantInfo" value="#{zkbContractEditController.selected.tenantUID}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <c:forEach items="#{zkbContractController.tenantInfoList}" var="v">
                                    <f:selectItem itemLabel="#{v.name}" itemValue="#{v.uid}"/>
                                </c:forEach>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_contractNo}*</label>
                            <p:inputText id="contractNo" value="#{zkbContractEditController.selected.contractNo}" required="true" requiredMessage="#{msg.zkbContract_contractNo} #{msg.ValidationRequire}" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_region}*</label>
                            <p:selectOneMenu id="region" value="#{zkbContractEditController.selected.region}" required="true" requiredMessage="#{msg.zkbContract_region} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_contractType}*</label>
                            <p:selectOneMenu id="status" value="#{zkbContractEditController.selected.contractType}" required="true" requiredMessage="#{msg.zkbContract_contractType} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_startDate}*</label>
                            <p:calendar timeZone="GMT+8"  id="startDate" pattern="yyyy/MM/dd" value="#{zkbContractEditController.selected.startDate}" required="true" requiredMessage="#{msg.zkbContract_startDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_endDate}*
                            </label>
                            <p:calendar timeZone="GMT+8"  id="endDate" pattern="yyyy/MM/dd" value="#{zkbContractEditController.selected.endDate}" required="true" requiredMessage="#{msg.zkbContract_endDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_ibNumber}</label>
                            <p:spinner id="ibNumber" value="#{zkbContractEditController.selected.ibNumber}" min="0" max="1000" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_spareQuota_total}</label>
                            <p:spinner id="spareQuotaTotal" value="#{zkbContractEditController.selected.spareQuotaTotal}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_spareQuota}</label>
                            <p:spinner id="spareQuota" value="#{zkbContractEditController.selected.spareQuota}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_spareQuota_apply}</label>
                            <p:spinner id="spareQuotaApply" value="#{zkbContractEditController.selected.spareQuotaApply}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_spareQuota_use}</label>
                            <p:spinner id="spareQuotaUse" value="#{zkbContractEditController.selected.spareQuotaUse}" min="0" max="1000"  />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_probeQuota_total}</label>
                            <p:spinner id="probeQuotaTotal" value="#{zkbContractEditController.selected.probeQuotaTotal}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">探头任意剩余名额</label>
                            <p:spinner id="probeQuota" value="#{zkbContractEditController.selected.probeQuota}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">探头普通剩余名额</label>
                            <p:spinner id="probeQuotaNormal" value="#{zkbContractEditController.selected.probeQuotaNormal}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">探头特殊剩余名额</label>
                            <p:spinner id="probeQuotaSpecial" value="#{zkbContractEditController.selected.probeQuotaSpecial}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">探头高值剩余名额</label>
                            <p:spinner id="probeQuotaHigh" value="#{zkbContractEditController.selected.probeQuotaHigh}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_probeQuota_apply}</label>
                            <p:spinner id="probeQuotaApply" value="#{zkbContractEditController.selected.probeQuotaApply}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_probeQuota_use}</label>
                            <p:spinner id="probeQuotaUse" value="#{zkbContractEditController.selected.probeQuotaUse}" min="0" max="1000"  />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_geArtificialSupportTimes_total}</label>
                            <p:spinner id="geArtificialSupportTimesTotal" value="#{zkbContractEditController.selected.geArtificialSupportTimesTotal}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_geArtificialSupportTimes}</label>
                            <p:spinner id="geArtificialSupportTimes" value="#{zkbContractEditController.selected.geArtificialSupportTimes}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_geArtificialSupportTimes_apply}</label>
                            <p:spinner id="geArtificialSupportTimesApply" value="#{zkbContractEditController.selected.geArtificialSupportTimesApply}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_geArtificialSupportTimes_use}</label>
                            <p:spinner id="geArtificialSupportTimesUse" value="#{zkbContractEditController.selected.geArtificialSupportTimesUse}" min="0" max="1000"  />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_spareArtificail_total}</label>
                            <p:spinner id="spareArtificailTotal" value="#{zkbContractEditController.selected.spareArtificailTotal}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_spareArtificail}</label>
                            <p:spinner id="maintenanceQuota" value="#{zkbContractEditController.selected.spareArtificail}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_spareArtificail_apply}</label>
                            <p:spinner id="maintenanceQuota_apply" value="#{zkbContractEditController.selected.spareArtificailApply}" min="0" max="1000"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_spareArtificail_use}</label>
                            <p:spinner id="spareArtificailUse" value="#{zkbContractEditController.selected.spareArtificailUse}" min="0" max="1000"  />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_principal}</label>
                            <p:inputText id="principal" value="#{zkbContractEditController.selected.principal}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_principalPhone}</label>
                            <p:inputText id="principalPhone" value="#{zkbContractEditController.selected.principalPhone}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_principalEmail}</label>
                            <p:inputText id="principalEmail" value="#{zkbContractEditController.selected.principalEmail}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_admin}</label>
                            <p:inputText id="adminer" value="#{zkbContractEditController.selected.admin}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_adminPhone}</label>
                            <p:inputText id="adminPhone" value="#{zkbContractEditController.selected.adminPhone}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_adminEmail}</label>
                            <p:inputText id="adminEmail" value="#{zkbContractEditController.selected.adminEmail}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_adminAddress}</label>
                            <p:inputText id="address" value="#{zkbContractEditController.selected.adminAddress}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_remark}</label>
                            <p:inputText id="remark" value="#{zkbContractEditController.selected.remark}" />
                        </h:panelGroup>

                    </p:panelGrid>


                    <p:fieldset id="zkbContractCourseFieldset" legend="相关课程" rendered="#{not empty zkbContractEditController.selected.id}">
                        <p:dataTable id="zkbContractCourseDatalist" value="#{zkbContractEditController.contractCourseList}" var="zkbContractCourseItem"
                                     widgetVar="zkbContractCourseDatalist" selectionMode="single" selection="#{zkbContractEditController.zkbContractCourseSelected}"
                                     lazy="false" paginator="true" rowKey="#{zkbContractCourseItem.zkbCourse.cname}" sortMode="single" sortOrder="ascending" sortBy="#{zkbContractCourseItem.contractId}"
                                     paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                            <p:ajax event="rowSelect" update=":zkbContractEditForm:zkbContractCourseDatalist:editDetailButton :zkbContractEditForm:zkbContractCourseDatalist:deleteDetailButton"/>

                            <p:column headerText="课程名称">
                                <h:outputText value="#{zkbContractCourseItem.zkbCourse.cname}"/>
                            </p:column>
                            <p:column headerText="课程总额">
                                <h:outputText value="#{zkbContractCourseItem.courseCountTotal}"/>
                            </p:column>
                            <p:column headerText="课程剩余额度">
                                <h:outputText value="#{zkbContractCourseItem.courseCount}"/>
                            </p:column>
                            <p:column headerText="课程申请额度">
                                <h:outputText value="#{zkbContractCourseItem.courseCountApply}"/>
                            </p:column>
                            <p:column headerText="课程已使用额度">
                                <h:outputText value="#{zkbContractCourseItem.courseCountUse}"/>
                            </p:column>
                           <f:facet name="{Toolbar}">
                                <p:commandButton immediate="false"  process="@this" id="createDetailButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{zkbContractEditController.prepareDetailCreate}" update=":growl :zkbContractCourseEditDlg" oncomplete="PF('zkbContractCourseEditDlg').show()" disabled="#{userContextService.zkbUser}" rendered="#{zkbContractEditController.operateFlag}"/>
                                <p:commandButton id="editDetailButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbContractEditController.prepareDetailEdit}" update=":growl :zkbContractCourseEditDlg" disabled="#{zkbContractEditController.courseCanOperate}" oncomplete="PF('zkbContractCourseEditDlg').show()" rendered="#{zkbContractEditController.operateFlag}"/>
                               <!-- <p:commandButton id="deleteDetailButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbContractEditController.deleteDetail}" update=":growl :zkbContractEditForm:zkbContractCourseDatalist" disabled="#{empty zkbContractEditController.zkbContractCourseSelected.zkbCourse.cname}">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                </p:commandButton>-->
                               <p:commandButton id="deleteDetailButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbContractEditController.preForLog('CourseDelete')}" update=":growl :zkbConfigDlg" disabled="#{zkbContractEditController.courseCanOperate}" oncomplete="PF('zkbConfigDlg').show()" rendered="#{zkbContractEditController.operateFlag}">
                                   <!--<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>-->
                               </p:commandButton>
                            </f:facet>

                        </p:dataTable>
                    </p:fieldset>


                    <p:fieldset id="zkbContractAssetFieldset" legend="相关设备" rendered="#{not empty zkbContractEditController.selected.id}">
                        <p:dataTable id="zkbContractAssetDatalist" value="#{zkbContractEditController.zkbContractAssetList}" var="zkbContractAssetItem"
                                     widgetVar="zkbContractAssetDatalist" selectionMode="single" selection="#{zkbContractEditController.zkbContractAssetSelected}"
                                     lazy="false" paginator="true" rowKey="#{zkbContractAssetItem.id}" sortMode="single" sortOrder="ascending" sortBy="#{zkbContractAssetItem.id}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}"
                                     paginatorPosition="both" paginatorAlwaysVisible="true"
                                     rowsPerPageTemplate="20,50,100,500">

                            <p:ajax event="rowSelect" update=":zkbContractEditForm:zkbContractAssetDatalist:deleteAssetButton :zkbContractEditForm:zkbContractAssetDatalist:editAssetButton"/>
                            <p:column headerText="二维码">
                                <h:outputText value="#{zkbContractAssetItem.assetInfo.qrCode}"/>
                            </p:column>
                            <p:column headerText="设备名称">
                                <h:outputText value="#{zkbContractAssetItem.assetInfo.name}"/>
                            </p:column>

                            <p:column headerText="设备编号" >
                                <h:outputText value="#{zkbContractAssetItem.assetInfo.departNum}" />
                            </p:column>

                            <p:column headerText="所属科室" >
                                <h:outputText value="#{zkbContractAssetItem.assetInfo.clinicalDeptName}" />
                            </p:column>

                            <p:column headerText="设备型号" >
                                <h:outputText value="#{zkbContractAssetItem.assetInfo.functionType}" />
                            </p:column>
                            <p:column headerText="Sys ID" >
                                <h:outputText value="#{zkbContractAssetItem.assetInfo.systemId}" />
                            </p:column>
                            <p:column headerText="维修类型" >
                                <h:outputText value="#{zkbContractEditController.getRepairForm(zkbContractAssetItem.assetInfo.repairForm)}" />
                            </p:column>
                            <p:column headerText="品牌" >
                                <h:outputText value="#{zkbContractAssetItem.assetInfo.makerShortName}" />
                            </p:column>
                            <p:column headerText="是否超声高低机" >
                                <h:outputText value="#{fieldMsg.fieldValue('zkbContractAssetType',zkbContractAssetItem.assetType)}" />
                            </p:column>
                            <f:facet name="{Toolbar}">
                                <p:commandButton immediate="false"  process="@this" id="createAssetButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{zkbContractEditController.prepareAssetCreate}" update=":growl :zkbContractAssetEditDlg" oncomplete="PF('zkbContractAssetEditDlg').show()" disabled="#{userContextService.zkbUser}" rendered="#{zkbContractEditController.operateFlag}"/>
                                <p:commandButton id="editAssetButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbContractEditController.prepareAssetEdit}" update=":growl :zkbContractAssetModifyDlg" disabled="#{zkbContractEditController.assetDeleteCanOperate}" oncomplete="PF('zkbContractAssetModifyDlg').show()" rendered="#{zkbContractEditController.operateFlag}"/>
                                <p:commandButton id="deleteAssetButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbContractEditController.preForLog('assetDelete')}" update=":growl :zkbConfigDlg" disabled="#{zkbContractEditController.assetDeleteCanOperate}" oncomplete="PF('zkbConfigDlg').show()" rendered="#{zkbContractEditController.operateFlag}">
                                    <!--<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>-->
                                </p:commandButton>
                            </f:facet>

                        </p:dataTable>
                    </p:fieldset>

                    <p:commandButton value="#{msg.save}" icon="ui-icon-check" validateClient="true" action="#{zkbContractEditController.createContract}" update=":zkbContractEditForm :growl " style="float:left" rendered="#{zkbContractEditController.createHide}"/>
                    <p:commandButton value="#{msg.save}" icon="ui-icon-check" validateClient="true" actionListener="#{zkbContractEditController.preForLog('contractUpdate')}" update=":growl :zkbConfigDlg" oncomplete="PF('zkbConfigDlg').show()" rendered="#{zkbContractEditController.editHide}"/>
                    <p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-arrow-back" action="List?faces-redirect=true" />

                </p:fieldset>
            </h:form>
            <ui:include src="ContractCourse.xhtml"/>
            <ui:include src="ContractAsset.xhtml"/>
            <ui:include src="ContractAssetEdit.xhtml"/>
            <p:dialog id="zkbConfigDlg" widgetVar="zkbConfigDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="操作原因" height="300">

                <h:form id="zkbConfigForm">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">原因</label>
                            <p:inputTextarea rows="10" cols="50" id="opRemark" value="#{zkbContractEditController.reason}" required="true" requiredMessage="原因不能为空">
                            </p:inputTextarea>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="true" value="#{msg.Confirm}" actionListener="#{zkbContractEditController.operateByLogType}" oncomplete="PF('zkbConfigDlg').hide()" update=":zkbContractEditForm :zkbConfigForm :growl" icon="ui-icon-check" />
                    <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbConfigDlg').hide()"/>
                </h:form>

            </p:dialog>

        </div>
    </ui:define>
</ui:composition>
