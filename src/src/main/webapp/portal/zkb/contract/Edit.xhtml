<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{zkbContractEditController.CRUDActionName} #{msg.ContractInfo}"/>
        </div>
        <div class="ui-g-12 card">
            <h:form id="zkbContractEditForm">
                <p:fieldset legend="合同详情" rendered="#{not empty zkbContractEditController.selected}">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContact_tenant}</label>
                            <!--<p:outputLabel value="#{zkbContractEditController.getTenantInfo(zkbContractEditController.selected.tenantUID).name}"/>-->
                            <p:selectOneMenu style="transform: scale(1.2)"  id="selectionTenantInfo" value="#{zkbContractEditController.selected.tenantUID}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <c:forEach items="#{zkbContractController.tenantInfoList}" var="v">
                                    <f:selectItem itemLabel="#{v.name}" itemValue="#{v.uid}"/>
                                </c:forEach>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_contractNo}*</label>
                            <p:inputText id="contractNo" value="#{zkbContractEditController.selected.contractNo}" required="true" requiredMessage="#{msg.zkbContract_contractNo} #{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <h:panelGroup>
                                <label class="label">公司编码</label>
                                <p:inputText id="companyCode" value="#{zkbContractEditController.selected.companyCode}"  />
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_region}*</label>
                            <p:selectOneMenu id="region" value="#{zkbContractEditController.selected.region}" required="true" requiredMessage="#{msg.zkbContract_region} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractRegion')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_contractType}*</label>
                            <p:selectOneMenu id="status" value="#{zkbContractEditController.selected.contractType}" required="true" requiredMessage="#{msg.zkbContract_contractType} #{msg.ValidationRequire}">
                                <p:ajax event="itemSelect" update="panelGrid2 quotaDeductType" listener="#{zkbContractEditController.contractTypeSelect}" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_startDate}*</label>
                            <p:calendar timeZone="GMT+8"  id="startDate" pattern="yyyy/MM/dd" value="#{zkbContractEditController.selected.startDate}" required="true" requiredMessage="#{msg.zkbContract_startDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_endDate}*
                            </label>
                            <p:calendar timeZone="GMT+8"  id="endDate" pattern="yyyy/MM/dd" value="#{zkbContractEditController.selected.endDate}" required="true" requiredMessage="#{msg.zkbContract_endDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{!(empty zkbContractEditController.selected.id)}">
                            <label class="label">修改类型*</label>
                            <p:selectOneMenu id="modifyType" value="#{zkbContractEditController.selected.modifyType}" required="true" requiredMessage="修改类型 #{msg.ValidationRequire}" >
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbContractModifyType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">名额扣除类型*</label>
                            <p:selectOneMenu id="quotaDeductType" value="#{zkbContractEditController.selected.quotaDeductType}" required="true" requiredMessage="名额扣除类型 #{msg.ValidationRequire}">
                                <p:ajax event="itemSelect" update="panelGrid2" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{zkbContractEditController.quotaDeductTypeList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">2022年起探头高低端名额分类*</label>
                            <p:selectOneMenu  value="#{zkbContractEditController.selected.assetQuotaType}" required="true" requiredMessage="2022年起探头高低端名额分类 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemValue="t" itemLabel="是"/>
                                <f:selectItem itemValue="f" itemLabel="否"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">合同金额*</label>
                            <p:selectOneMenu id="contractAmount" value="#{zkbContractEditController.selected.contractAmount}" required="true" requiredMessage="合同金额 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('zkbcontractAmount')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">是否ZKB 599方案*</label>
                            <p:selectOneMenu  value="#{zkbContractEditController.selected.fiveNineNineFlag}" required="true" requiredMessage="是否ZKB 599合同 #{msg.ValidationRequire}">
                                <p:ajax event="change" update="firstYearFlagGroup linkContractNoGroup"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemValue="Y" itemLabel="是"/>
                                <f:selectItem itemValue="N" itemLabel="否"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="firstYearFlagGroup">
                            <h:panelGroup rendered="#{zkbContractEditController.selected.fiveNineNineFlag eq 'Y'}">
                                <label class="label">599合同年份*</label>
                                <p:selectOneMenu value="#{zkbContractEditController.selected.firstYearFlag}" required="true" requiredMessage="是否599方案第一年 #{msg.ValidationRequire}" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItem itemLabel="599合同第一年" itemValue="t"/>
                                    <f:selectItem itemLabel="599合同第2和3年" itemValue="f"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </h:panelGroup>
                       <!-- <h:panelGroup rendered="#{empty zkbContractEditController.selected.id}">
                        </h:panelGroup>-->
                    </p:panelGrid>
                    <p:panelGrid id="panelGrid2" columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Spare')}">
                            <label class="label">#{msg.zkbContract_spareQuota_total}</label>
                            <p:spinner id="spareQuotaTotal" value="#{zkbContractEditController.selected.spareQuotaTotal}" min="0" max="1000"  >
                                <p:ajax />
                            </p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Spare')}">
                            <label class="label">#{msg.zkbContract_spareQuota}</label>
                            <p:spinner id="spareQuota" value="#{zkbContractEditController.selected.spareQuota}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Spare')}">
                            <label class="label">#{msg.zkbContract_spareQuota_apply}</label>
                            <p:spinner id="spareQuotaApply" value="#{zkbContractEditController.selected.spareQuotaApply}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Spare')}">
                            <label class="label">#{msg.zkbContract_spareQuota_use}</label>
                            <p:spinner id="spareQuotaUse" value="#{zkbContractEditController.selected.spareQuotaUse}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <c:if test="#{!(zkbContractEditController.selected.quotaDeductType eq 'New')}">
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">#{msg.zkbContract_probeQuota_total}</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaTotal}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">#{msg.zkbContract_probeQuota}</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuota}" min="0" max="1000"><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">#{msg.zkbContract_probeQuota_apply}</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaApply}" min="0" max="1000"><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">#{msg.zkbContract_probeQuota_use}</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaUse}" min="0" max="1000"  ><p:ajax /></p:spinner>
                            </h:panelGroup>
                        </c:if>
                        <c:if test="#{zkbContractEditController.selected.quotaDeductType eq 'New'}">
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头任意总名额</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaTotal}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头任意剩余名额</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuota}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头任意申请名额</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaApply}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头任意已使用名额</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaUse}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头普通总名额</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaNormalTotal}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头普通剩余名额</label>
                                <p:spinner id="probeQuotaNormal" value="#{zkbContractEditController.selected.probeQuotaNormal}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头普通申请名额</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaNormalApply}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头普通已使用名额</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaNormalUse}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头特殊总名额</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaSpecialTotal}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头特殊剩余名额</label>
                                <p:spinner id="probeQuotaSpecial" value="#{zkbContractEditController.selected.probeQuotaSpecial}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头特殊申请名额</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaSpecialApply}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Probe')}">
                                <label class="label">探头特殊已使用名额</label>
                                <p:spinner value="#{zkbContractEditController.selected.probeQuotaSpecialUse}" min="0" max="1000" ><p:ajax /></p:spinner>
                            </h:panelGroup>
                        </c:if>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Artificial')}">
                            <label class="label">#{msg.zkbContract_geArtificialSupportTimes_total}</label>
                            <p:spinner id="geArtificialSupportTimesTotal" value="#{zkbContractEditController.selected.geArtificialSupportTimesTotal}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Artificial')}">
                            <label class="label">#{msg.zkbContract_geArtificialSupportTimes}</label>
                            <p:spinner id="geArtificialSupportTimes" value="#{zkbContractEditController.selected.geArtificialSupportTimes}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Artificial')}">
                            <label class="label">#{msg.zkbContract_geArtificialSupportTimes_apply}</label>
                            <p:spinner id="geArtificialSupportTimesApply" value="#{zkbContractEditController.selected.geArtificialSupportTimesApply}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('Artificial')}">
                            <label class="label">#{msg.zkbContract_geArtificialSupportTimes_use}</label>
                            <p:spinner id="geArtificialSupportTimesUse" value="#{zkbContractEditController.selected.geArtificialSupportTimesUse}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('SpareArtificial')}">
                            <label class="label">#{msg.zkbContract_spareArtificail_total}</label>
                            <p:spinner id="spareArtificailTotal" value="#{zkbContractEditController.selected.spareArtificailTotal}" min="0" max="10000000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('SpareArtificial')}">
                            <label class="label">#{msg.zkbContract_spareArtificail}</label>
                            <p:spinner  value="#{zkbContractEditController.selected.spareArtificail}" min="0" max="10000000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('SpareArtificial')}">
                            <label class="label">#{msg.zkbContract_spareArtificail_apply}</label>
                            <p:spinner  value="#{zkbContractEditController.selected.spareArtificailApply}" min="0" max="10000000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('SpareArtificial')}">
                            <label class="label">#{msg.zkbContract_spareArtificail_use}</label>
                            <p:spinner value="#{zkbContractEditController.selected.spareArtificailUse}" min="0" max="10000000" ><p:ajax /></p:spinner>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('PartsHigh')}">
                            <label class="label">备件高值总额</label>
                            <p:spinner  value="#{zkbContractEditController.selected.partHighQuotaTotal}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('PartsHigh')}">
                            <label class="label">备件高值剩余名额</label>
                            <p:spinner  value="#{zkbContractEditController.selected.partHighQuota}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('PartsHigh')}">
                            <label class="label">备件高值申请中名额</label>
                            <p:spinner  value="#{zkbContractEditController.selected.partHighQuotaApply}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('PartsHigh')}">
                            <label class="label">备件高值已使用名额</label>
                            <p:spinner value="#{zkbContractEditController.selected.partHighQuotaUse}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('CssbMaintenance')}">
                            <label class="label">保养总额</label>
                            <p:spinner value="#{zkbContractEditController.selected.ccsbMaintenanceQuotaTotal}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('CssbMaintenance')}">
                            <label class="label">保养剩余名额</label>
                            <p:spinner  value="#{zkbContractEditController.selected.ccsbMaintenanceQuota}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('CssbMaintenance')}">
                            <label class="label">保养申请中名额</label>
                            <p:spinner  value="#{zkbContractEditController.selected.ccsbMaintenanceQuotaApply}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{zkbContractEditController.qtyRender('CssbMaintenance')}">
                            <label class="label">保养已使用名额</label>
                            <p:spinner value="#{zkbContractEditController.selected.ccsbMaintenanceQuotaUse}" min="0" max="1000" ><p:ajax /></p:spinner>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_ibNumber}</label>
                            <p:spinner id="ibNumber" value="#{zkbContractEditController.selected.ibNumber}" min="0" max="1000" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_principal}</label>
                            <p:inputText id="principal" value="#{zkbContractEditController.selected.principal}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_principalPhone}</label>
                            <p:inputText id="principalPhone" value="#{zkbContractEditController.selected.principalPhone}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_principalEmail}</label>
                            <p:inputText id="principalEmail" value="#{zkbContractEditController.selected.principalEmail}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_admin}</label>
                            <p:inputText id="adminer" value="#{zkbContractEditController.selected.admin}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_adminPhone}</label>
                            <p:inputText id="adminPhone" value="#{zkbContractEditController.selected.adminPhone}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_adminEmail}</label>
                            <p:inputText id="adminEmail" value="#{zkbContractEditController.selected.adminEmail}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_adminAddress}</label>
                            <p:inputText id="address" value="#{zkbContractEditController.selected.adminAddress}" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.zkbContract_remark}</label>
                            <p:inputText id="remark" value="#{zkbContractEditController.selected.remark}" />
                        </h:panelGroup>

                        <h:panelGroup id="linkContractNoGroup">
                            <h:panelGroup rendered="#{zkbContractEditController.selected.fiveNineNineFlag eq 'Y'}">
                                <label class="label">关联合同号</label>
                                <p:inputText id="linkContractNo" value="#{zkbContractEditController.selected.linkContractNo}" />
                            </h:panelGroup>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:fieldset id="zkbContractCourseFieldset" legend="相关课程" rendered="#{not empty zkbContractEditController.selected.id}">
                        <p:dataTable id="zkbContractCourseDatalist" value="#{zkbContractEditController.contractCourseList}" var="zkbContractCourseItem"
                                     widgetVar="zkbContractCourseDatalist" selectionMode="single" sortOrder="descending" sortBy="#{zkbContractCourseItem.zkbCourse.createdDate}" selection="#{zkbContractEditController.zkbContractCourseSelected}"
                                     lazy="false" paginator="true" rowKey="#{zkbContractCourseItem.zkbCourse.cname}" sortMode="single"
                                     paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">

                            <p:ajax event="rowSelect" update=":zkbContractEditForm:zkbContractCourseDatalist:editDetailButton :zkbContractEditForm:zkbContractCourseDatalist:deleteDetailButton"/>
                            <p:column headerText="培训合同号">
                                <h:outputText value="#{zkbContractCourseItem.courseContractNo}"/>
                            </p:column>
                            <p:column headerText="课程名称">
                                <h:outputText value="#{zkbContractCourseItem.zkbCourse.cname}"/>
                            </p:column>
                            <p:column headerText="modality">
                                <h:outputText value="#{zkbContractCourseItem.zkbCourse.modality}"/>
                            </p:column>
                            <p:column headerText="课程总额">
                                <h:outputText value="#{zkbContractCourseItem.mainCourseCountTotal}"/>
                            </p:column>
                            <p:column headerText="课程剩余额度">
                                <h:outputText value="#{zkbContractCourseItem.mainCourseCount}"/>
                            </p:column>
                            <p:column headerText="课程申请额度">
                                <h:outputText value="#{zkbContractCourseItem.mainCourseCountApply}"/>
                            </p:column>
                            <p:column headerText="课程已使用额度">
                                <h:outputText value="#{zkbContractCourseItem.mainCourseCountUse}"/>
                            </p:column>
                           <f:facet name="{Toolbar}">
                                <p:commandButton immediate="false" process="@this" id="createDetailButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{zkbContractEditController.prepareDetailCreate}" update=":growl :zkbContractCourseEditDlg" oncomplete="PF('zkbContractCourseEditDlg').show()" disabled="#{userContextService.zkbUser}" rendered="#{zkbContractEditController.operateFlag}"/>
