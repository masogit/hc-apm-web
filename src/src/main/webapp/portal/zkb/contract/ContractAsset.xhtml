<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">
<ui:composition>
    <p:dialog id="zkbContractAssetEditDlg" widgetVar="zkbContractAssetEditDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="设备操作" width="70%" height="600">
        <h:form id="FileSearchForm">
            <p:fieldset legend="相关设备查询条件最少要填写或选择一个)">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                   <!-- <h:panelGroup>
                        <label class="label">#{msg.TenantInfo}</label>
                        &lt;!&ndash;<p:selectOneMenu style="transform: scale(1.2)"  id="selectionTenantInfo" value="#{zkbContractEditController.queryAsset.tenantUID}" disabled="#{userContextService.zkbUser}">
                            <p:ajax listener="#{zkbContractController.tenantInfoSelect}" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{zkbContractController.tenantInfoList}" var="v">
                                <f:selectItem itemLabel="#{v.name}" itemValue="#{v.uid}"/>
                            </c:forEach>
                        </p:selectOneMenu>&ndash;&gt;
                        <p:outputLabel value="#{zkbContractEditController.getTenantInfo(zkbContractEditController.queryAsset.tenantUID).name}"/>
                    </h:panelGroup>-->
                    <h:panelGroup>
                        <label class="label">#{msg.assetGroup}</label>
                        <p:selectOneMenu id="assetGroup" value="#{zkbContractEditController.queryAsset.assetGroup}">
                            <!--<p:ajax  listener="#{zkbContractEditController.getQueryAssetsList()}" update="AssetsPickList"/>-->
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.functionType}</label>
                        <p:inputText id="functionType" value="#{zkbContractEditController.queryAsset.functionType}" maxlength="100"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.assetName}</label>
                        <p:inputText id="assetName" value="#{zkbContractEditController.assetName}" maxlength="100" required="false"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.qrCode}</label>
                        <p:inputText id="qrCode" value="#{zkbContractEditController.queryAsset.qrCode}" maxlength="100" required="false"/>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
            <h:panelGroup>
                <p:commandButton validateClient="false" actionListener="#{zkbContractEditController.getQueryAssetsList()}" value="#{msg.Search}" update=":FileAssetForm:AssetsPickList"/>
            </h:panelGroup>
        </h:form>
        <h:form id="FileAssetForm">
            <p:fieldset legend="#{msg.relationAsset}">
                <p:pickList id="AssetsPickList" value="#{zkbContractEditController.availableAssets}" var="item"
                            itemValue="#{item}" itemLabel="#{item.name}#{item.functionType}" showCheckbox="false" responsive="true" immediate="true"
                            showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter">
                    <f:facet name="sourceCaption">#{msg.EquipmentToBeSelected}</f:facet>
                    <f:facet name="targetCaption">#{msg.SelectedEquipment}</f:facet>
                    <p:ajax event="transfer" listener="#{zkbContractEditController.onAssetsTransfer}" />
                    <p:column style="float: left;width:40%;">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column style="float: left;width:30%;">
                        <h:outputText value="#{item.departNum}" />
                    </p:column>
                    <p:column style="float: left;width:30%;">
                        <h:outputText value="#{item.functionType}" />
                    </p:column>
                </p:pickList>
            </p:fieldset>
            <h:panelGroup>
                <p:commandButton validateClient="true" actionListener="#{zkbContractEditController.saveAsset()}" value="#{msg.Save}" update=":zkbContractEditForm :growl" icon="ui-icon-check" oncomplete="PF('zkbContractAssetEditDlg').hide()"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbContractAssetEditDlg').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
