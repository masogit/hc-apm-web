<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui" xmlns:f="http://java.sun.com/jsf/core"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
    <p:dialog id="zkbCourseQuotaEditDlg" widgetVar="zkbCourseQuotaEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{zkbTrainCourseQuotaController.CRUDActionName} 课程名额" width="800" height="570">
        <h:form id="editForm">
            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{zkbTrainCourseQuotaController.selected != null}">
                <h:panelGroup>
                    <label class="label">#{msg.TenantInfo}*</label>
                    <p:selectOneMenu style="width: 80%" id="selectionTenantInfo" value="#{zkbTrainCourseQuotaController.selected.tenantUid}" required="true" requiredMessage="#{msg.TenantInfo} 不能为空！">
                        <p:ajax  />
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{zkbTrainCourseQuotaController.getSourceTenantInfoList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">合同号*</label>
                    <p:inputText  value="#{zkbTrainCourseQuotaController.selected.contractNo}"  required="true" requiredMessage="合同号 不能为空！"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">开始日期*</label>
                    <p:calendar timeZone="GMT+8"  id="startDate" pattern="yyyy/MM/dd" value="#{zkbTrainCourseQuotaController.selected.startDate}" required="true" requiredMessage="#{msg.zkbContract_startDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">结束日期*</label>
                    <p:calendar timeZone="GMT+8"  id="endDate" pattern="yyyy/MM/dd" value="#{zkbTrainCourseQuotaController.selected.endDate}" required="true" requiredMessage="#{msg.zkbContract_endDate} #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">Modality*</label>
                    <p:inputText  value="#{zkbTrainCourseQuotaController.selected.modality}"  required="true" requiredMessage="Modality 不能为空！" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">课程CatNo*</label>
                    <p:autoComplete dropdown="true" value="#{zkbTrainCourseQuotaController.selectedCourse}"  scrollHeight="300" forceSelection="true" required="true" requiredMessage="课程 #{msg.ValidationRequire}"
                                    completeMethod="#{zkbTrainCourseQuotaController.autoCompleteCourse}" var="t" itemLabel="#{t.catNo}" itemValue="#{t}" converter="zkbTrainCourseConverter">
                        <p:ajax event="itemSelect" update="name courseType" listener="#{zkbTrainCourseQuotaController.courseSelect}" />
                    </p:autoComplete>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">课程名称*</label>
                    <p:inputText  id="name" value="#{zkbTrainCourseQuotaController.selected.zkbTrainCourse.name}" disabled="true"  />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">课程类型*</label>
                    <p:inputText  id="courseType" value="#{fieldMsg.fieldValue('ZkbTrainCourseType',zkbTrainCourseQuotaController.selected.zkbTrainCourse.courseType)}" disabled="true"  />
                </h:panelGroup>
                <h:panelGroup >
                    <label class="label">总额*</label>
                    <p:spinner id="totalQuota" value="#{zkbTrainCourseQuotaController.selected.totalQuota}" min="0" max="10000000"  required="true" requiredMessage="总额 不能为空！"><p:ajax /></p:spinner>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">剩余名额*</label>
                    <p:spinner id="quota" value="#{zkbTrainCourseQuotaController.selected.quota}" min="0" max="10000000"  required="true" requiredMessage="剩余名额 不能为空！"><p:ajax /></p:spinner>
                </h:panelGroup>
            </p:panelGrid>
            <p:fieldset id="detailFieldset" legend="名额详情" rendered="#{!userContextService.zkbUser}">
                <p:dataTable id="detailDatalist" value="#{zkbTrainCourseQuotaController.zkbTrainCourseQuotaDetails}" var="item"
                             widgetVar="detailDatalist" selectionMode="single" sortOrder="descending" sortBy="#{item.uniqueID}" selection="#{zkbTrainCourseQuotaController.selectedCourseQuotaDetail}"
                             lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single"
                             paginatorTemplate="{Toolbar}" rows="20" emptyMessage="#{msg.noRecordFound}">
                    <p:ajax event="rowSelect" update=":editForm:detailDatalist:editDetailButton :editForm:detailDatalist:deleteDetailButton"/>
                    <p:column headerText="UniqueID">
                        <h:outputText value="#{item.uniqueID}"/>
                    </p:column>
                    <p:column headerText="总额">
                        <h:outputText value="#{item.totalQuota}"/>
                    </p:column>
                    <p:column headerText="剩余名额">
                        <h:outputText value="#{item.quota}"/>
                    </p:column>

                    <f:facet name="{Toolbar}">
                        <p:commandButton immediate="false" process="@this" id="createDetailButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{zkbTrainCourseQuotaController.prepareDetailCreate}" update=":growl :zkbQuotaDetailDlg" oncomplete="PF('zkbQuotaDetailDialog').show()" disabled="#{userContextService.zkbUser}" />
                        <p:commandButton immediate="false" process="@this" id="editDetailButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{zkbTrainCourseQuotaController.prepareDetailEdit}" update=":growl :zkbQuotaDetailDlg"  oncomplete="PF('zkbQuotaDetailDialog').show()" disabled="#{empty zkbTrainCourseQuotaController.selectedCourseQuotaDetail}" />
                        <p:commandButton immediate="false" process="@this" id="deleteDetailButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{zkbTrainCourseQuotaController.deleteDetail()}" update=":growl :editForm:detailDatalist" disabled="#{empty zkbTrainCourseQuotaController.selectedCourseQuotaDetail}">
                            <!--<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>-->
                        </p:commandButton>
                    </f:facet>

                </p:dataTable>
            </p:fieldset>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" action="#{zkbTrainCourseQuotaController.saveData}" update=":growl :listForm:datalist " icon="ui-icon-check" oncomplete="PF('zkbCourseQuotaEditDialog').hide()"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('zkbCourseQuotaEditDialog').hide()"/>
        </h:form>
    </p:dialog>

    <ui:include src="Detail.xhtml"></ui:include>
</ui:composition>

</html>
