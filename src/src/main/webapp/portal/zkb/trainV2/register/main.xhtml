<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
    	<h:outputScript name="js/commonUtils.js"/>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.trainManage}"/>
            </div>

            <div class="ui-g-12 ">
                <p:tabView class="ui-g-12" id="tab" dynamic="true" cache="false" activeIndex="0" >
                    <p:ajax event="tabChange" listener="#{v2PmOrderController.onTabChange}"/>
                    <p:tab class="ui-g-12" title="未报名" id="insite" >
                        <ui:include src="UnRegisterList.xhtml"/>
                    </p:tab>
                    <p:tab class="ui-g-12" title="已报名" id="mvsWorkOrder" >
                        <ui:include src="RegisteredList.xhtml"/>
                    </p:tab>
                </p:tabView>
            </div>
        </div>
        <ui:include src="RegisterEdit.xhtml"/>
    </ui:define>

</ui:composition>
