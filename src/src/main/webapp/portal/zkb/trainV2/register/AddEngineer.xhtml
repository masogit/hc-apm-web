<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui" xmlns:f="http://java.sun.com/jsf/core"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
    <p:dialog id="registerEngineerEditDlg" widgetVar="registerEngineerEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(this)" header="工程师信息详情" width="600" height="370">
        <h:form id="engineerEditForm" >
            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">#{msg.zkbEngineer_name}*</label>

                    <p:autoComplete id="engineerName" value="#{zkbTrainRegisterMainController.selectedEngineer}" converter="zkbEngineerConverter" dropdown="true"
                                    forceSelection="true" required="true" requiredMessage="#{msg.assetOwnerName} #{msg.ValidationRequire}"
                                    var="t" itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{zkbTrainRegisterMainController.autoCompleteEngineer}">
                        <p:ajax event="itemSelect" listener="#{zkbTrainRegisterMainController.engineerChange()}" process="@this" update="@(.engineerNameChange)" />
                        <p:ajax listener="#{zkbTrainRegisterMainController.engineerChange()}" process="@this" update="@(.engineerNameChange)" />
                        <p:column>
                            <h:outputText value="#{t.name}"/>
                        </p:column>
                        <p:column>
                            <h:outputText value="#{t.sso}"/>
                        </p:column>
                    </p:autoComplete>

                    <!--<p:commandButton  icon="ui-icon-plus" title="#{msg.Create}" process="@this" actionListener="#{budgetController.prepareCreateAsset}" update="AssetSelectDlg" oncomplete="PF('AssetSelectDialog').show()"/>-->

                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.zkbEngineer_phone}</label>
                    <p:inputText id="phone" value="#{zkbTrainRegisterMainController.selectedDetail.engineerPhone}" required="false" requiredMessage="#{msg.zkbEngineer_phone} #{msg.ValidationRequire}" class="engineerNameChange">
                        <p:ajax />
                    </p:inputText>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.zkbEngineer_email}</label>
                    <p:inputText id="email" value="#{zkbTrainRegisterMainController.selectedDetail.engineerEmail}" required="false" requiredMessage="#{msg.zkbEngineer_email} #{msg.ValidationRequire}" class="engineerNameChange">
                    <p:ajax />
                    </p:inputText>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.zkbEngineer_age}*</label>
                    <p:inputNumber id="age"  decimalPlaces="0" minValue="0" maxValue="999" value="#{zkbTrainRegisterMainController.selectedDetail.engineerAge}" required="true" requiredMessage="#{msg.zkbEngineer_age} #{msg.ValidationRequire}" class="engineerNameChange">
                        <f:convertNumber pattern="0" type="number"/>
                        <p:ajax />
                    </p:inputNumber>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">SSO</label>
                    <p:inputText id="sso" disabled="true" value="#{zkbTrainRegisterMainController.selectedDetail.engineerSso}" class="engineerNameChange">
                        <p:ajax />
                    </p:inputText>
                </h:panelGroup>
            </p:panelGrid>

            <p:panelGrid>
                <h:panelGroup>
                    <p:dataList id="uploadList" value="#{zkbTrainRegisterMainController.v2_blobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                        <f:facet name="header">附件上传</f:facet>
                        <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                        <!--                                <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>-->
                        <p:commandButton actionListener="#{zkbTrainRegisterMainController.removeFile(fileitem)}" update="uploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                        </p:commandButton>
                    </p:dataList>
                    <p:fileUpload  allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|rar|zip|htm|html|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS|RAR|ZIP|HTM|HTML)$/" fileUploadListener="#{zkbTrainRegisterMainController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                   multiple="true"  sizeLimit="100000000"  update="uploadList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                </h:panelGroup>
            </p:panelGrid>
        </h:form>
        <p:commandButton validateClient="true" value="#{msg.Save}" action="#{zkbTrainRegisterMainController.saveEngineer}" update=":engineerListForm:detailDatalist " icon="ui-icon-check" oncomplete="PF('registerEngineerEditDialog').hide()"/>
        <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('registerEngineerEditDialog').hide()"/>
    </p:dialog>

</ui:composition>

</html>
