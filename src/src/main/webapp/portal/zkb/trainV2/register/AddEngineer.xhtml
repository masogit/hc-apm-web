<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>

    <!-- 单一对话框，包含两个视图：编辑视图 和 新建视图 -->
    <p:dialog id="registerEngineerEditDlg" widgetVar="registerEngineerEditDlg" modal="true" resizable="true"
              draggable="true" appendTo="@(this)" header="工程师信息" width="700" height="550"
              close="zkbTrainRegisterMainController.cancelCreateEngineer()">

        <p:outputPanel id="engineerFormPanel" layout="block">

            <!-- 视图1：编辑工程师信息 -->
            <ui:fragment rendered="#{zkbTrainRegisterMainController.engineerFormView == 'edit'}">
                <div id="editEngineerView">
                    <h:form id="engineerEditForm">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                     style="width:100%">
                            <h:panelGroup rendered="#{zkbTrainRegisterMainController.actionName != 'View'}">
                                <label class="label">#{msg.zkbEngineer_name}*</label>
                                <p:autoComplete id="engineerName"
                                                value="#{zkbTrainRegisterMainController.selectedEngineer}"
                                                converter="zkbEngineerConverter" dropdown="true"
                                                forceSelection="true" required="true"
                                                requiredMessage="#{msg.zkbEngineer_name} #{msg.ValidationRequire}"
                                                var="t" itemLabel="#{t.name}" itemValue="#{t}"
                                                completeMethod="#{zkbTrainRegisterMainController.autoCompleteEngineer}">
                                    <p:ajax event="itemSelect"
                                            listener="#{zkbTrainRegisterMainController.engineerChange}"
                                            process="@this" update="@(.engineerNameChange)"/>
                                    <p:column>
                                        <h:outputText value="#{t.name}"/>
                                    </p:column>
                                    <p:column>
                                        <h:outputText value="#{t.sso}"/>
                                    </p:column>
                                </p:autoComplete>
                                <!-- 新增按钮：切换到新建视图 -->
                                <p:commandButton value="新增"
                                                 actionListener="#{zkbTrainRegisterMainController.prepareCreateEngineer}"
                                                 update=":engineerFormPanel" process="@this"
                                                 style="margin-left: 2px;position: relative;top: -8px;"/>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{zkbTrainRegisterMainController.actionName == 'View'}">
                                <label class="label">#{msg.zkbEngineer_name}*</label>
                                <p:inputText value="#{zkbTrainRegisterMainController.editingDetail.engineerName}"
                                             disabled="true" style="font-weight:bold;"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.zkbEngineer_phone}*</label>
                                <p:inputText id="phone"
                                             value="#{zkbTrainRegisterMainController.editingDetail.engineerPhone}"
                                             required="true"
                                             requiredMessage="#{msg.zkbEngineer_phone} #{msg.ValidationRequire}"
                                             class="engineerNameChange"
                                             disabled="#{zkbTrainRegisterMainController.actionName == 'View'}">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.zkbEngineer_email}*</label>
                                <p:inputText id="email"
                                             value="#{zkbTrainRegisterMainController.editingDetail.engineerEmail}"
                                             required="true"
                                             requiredMessage="#{msg.zkbEngineer_email} #{msg.ValidationRequire}"
                                             class="engineerNameChange"
                                             disabled="#{zkbTrainRegisterMainController.actionName == 'View'}">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.zkbEngineer_age}*</label>
                                <p:inputNumber id="age" decimalPlaces="0" minValue="0" maxValue="999"
                                               value="#{zkbTrainRegisterMainController.editingDetail.engineerAge}"
                                               required="true"
                                               requiredMessage="#{msg.zkbEngineer_age} #{msg.ValidationRequire}"
                                               class="engineerNameChange"
                                               disabled="#{zkbTrainRegisterMainController.actionName == 'View'}">
                                    <p:ajax/>
                                    <f:convertNumber pattern="0" type="number"/>
                                </p:inputNumber>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">SSO</label>
                                <p:inputText id="sso" disabled="true"
                                             value="#{zkbTrainRegisterMainController.editingDetail.engineerSso}"
                                             class="engineerNameChange">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                        </p:panelGrid>

                        <!-- 附件上传区域 -->
                        <p:panelGrid style="width:100%">
                            <f:facet name="header">附件上传 <span style="color:red">*</span></f:facet>
                            <p:dataList id="uploadList"
                                        value="#{zkbTrainRegisterMainController.v2_blobObjectList}"
                                        var="fileitem"
                                        type="definition"
                                        emptyMessage="#{msg.noRecordFound}" class="engineerNameChange"
                                        rendered="#{zkbTrainRegisterMainController.actionName != 'View'}">
                                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                                    <!-- 类型标签 -->
                                    <h:outputText value="放射体检"
                                                  style="background:#e91e63; color:white; padding:2px 6px; border-radius:3px; font-size:0.8em;"
                                                  rendered="#{fileitem.boSubType == 'PHYSICAL_EXAM'}"/>
                                    <h:outputText value="安全证书"
                                                  style="background:#2196f3; color:white; padding:2px 6px; border-radius:3px; font-size:0.8em;"
                                                  rendered="#{fileitem.boSubType == 'SAFETY_CERT'}"/>
                                    <h:outputText value="推荐函"
                                                  style="background:#4caf50; color:white; padding:2px 6px; border-radius:3px; font-size:0.8em;"
                                                  rendered="#{fileitem.boSubType == 'RECOMMENDATION'}"/>
                                    <!-- 文件链接 -->
                                    <p:commandLink value="#{fileitem.objectName}"
                                                   ajax="false"
                                                   actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}"
                                                   styleClass="p-mr-2"/>
                                </div>

                                <!-- 删除按钮 -->
                                <p:commandButton actionListener="#{zkbTrainRegisterMainController.removeFile(fileitem)}"
                                                 update="uploadList"
                                                 icon="ui-icon-clear"
                                                 title="#{msg.Delete}"
                                                 class="popupIconButton"
                                                 process="@this"
                                                 rendered="#{zkbTrainRegisterMainController.actionName != 'View'}">
                                    <p:confirm header="#{msg.DeleteConformation}"
                                               message="#{msg.DeleteFileConformationMsg}"
                                               icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:dataList>

                            <p:dataList id="uploadAttachList"
                                        value="#{zkbTrainRegisterMainController.editingDetail.v2_blobObjectList}"
                                        var="fileitem"
                                        type="definition"
                                        emptyMessage="#{msg.noRecordFound}" class="engineerNameChange"
                                        rendered="#{zkbTrainRegisterMainController.actionName == 'View'}">
                                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                                    <!-- 类型标签 -->
                                    <h:outputText value="放射体检"
                                                  style="background:#e91e63; color:white; padding:2px 6px; border-radius:3px; font-size:0.8em;"
                                                  rendered="#{fileitem.boSubType == 'PHYSICAL_EXAM'}"/>
                                    <h:outputText value="安全证书"
                                                  style="background:#2196f3; color:white; padding:2px 6px; border-radius:3px; font-size:0.8em;"
                                                  rendered="#{fileitem.boSubType == 'SAFETY_CERT'}"/>
                                    <h:outputText value="推荐函"
                                                  style="background:#4caf50; color:white; padding:2px 6px; border-radius:3px; font-size:0.8em;"
                                                  rendered="#{fileitem.boSubType == 'RECOMMENDATION'}"/>
                                    <p:commandLink value="#{fileitem.objectName}"
                                                   ajax="false"
                                                   actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}"
                                                   styleClass="p-mr-2"/>
                                </div>
                            </p:dataList>

                            <!-- 上传按钮：仅非查看模式显示 -->
                            <p:fileUpload mode="advanced" label="上传放射体检" auto="true" multiple="false"
                                          fileUploadListener="#{zkbTrainRegisterMainController.handlePhysicalExamUpload}"
                                          update="uploadList :engineerEditForm" allowTypes="/(\.|\/)(pdf|doc|docx|jpg|png)$/i"
                                          sizeLimit="100000000" dragDropSupport="false"
                                          rendered="#{zkbTrainRegisterMainController.actionName != 'View'}"/>
                            <p:fileUpload mode="advanced" label="上传安全证书" auto="true" multiple="false"
                                          fileUploadListener="#{zkbTrainRegisterMainController.handleSafetyCertificateUpload}"
                                          update="uploadList :engineerEditForm" allowTypes="/(\.|\/)(pdf|doc|docx|jpg|png)$/i"
                                          sizeLimit="100000000" dragDropSupport="false"
                                          rendered="#{zkbTrainRegisterMainController.actionName != 'View'}"/>
                            <p:fileUpload mode="advanced" label="上传推荐函" auto="true" multiple="false"
                                          fileUploadListener="#{zkbTrainRegisterMainController.handleRecommendationUpload}"
                                          update="uploadList :engineerEditForm" allowTypes="/(\.|\/)(pdf|doc|docx|jpg|png)$/i"
                                          sizeLimit="100000000" dragDropSupport="false"
                                          rendered="#{zkbTrainRegisterMainController.actionName != 'View'}"/>

                            <p:commandButton value="推荐函模板下载" icon="ui-icon-download"
                                             styleClass="ui-button-success"
                                             actionListener="#{zkbTrainRegisterMainController.downLoadTemplate}"
                                             ajax="false"
                                             rendered="#{zkbTrainRegisterMainController.actionName != 'View'}">
                                <p:fileDownload value="#{zkbTrainRegisterMainController.exportFile}"/>
                            </p:commandButton>
                        </p:panelGrid>

                        <!-- 在上传按钮之后、保存按钮之前插入 -->
                        <div style="margin: 10px 0; padding: 8px; background-color: #fef6e6; border: 1px solid #f8c87c; border-radius: 4px;">
                            <strong>附件上传状态：</strong>
                            <ul style="margin: 5px 0; list-style: none; padding-left: 0;">
                                <li style="color: #{empty zkbTrainRegisterMainController.physicalExamFile ? 'red' : 'green'}">
                                    🔹 放射体检：#{empty zkbTrainRegisterMainController.physicalExamFile ? '未上传' : '已上传'}
                                </li>
                                <li style="color: #{empty zkbTrainRegisterMainController.safetyCertificateFile ? 'red' : 'green'}">
                                    🔹 安全证书：#{empty zkbTrainRegisterMainController.safetyCertificateFile ? '未上传' : '已上传'}
                                </li>
                                <li style="color: #{empty zkbTrainRegisterMainController.recommendationFile ? 'red' : 'green'}">
                                    🔹 推荐函：#{empty zkbTrainRegisterMainController.recommendationFile ? '未上传' : '已上传'}
                                </li>
                            </ul>
                        </div>

                        <h:panelGroup>
                            <h:outputText value="physicalExamFile: #{zkbTrainRegisterMainController.physicalExamFile}"/>
                            <br/>
                            <h:outputText value="safetyCertificateFile: #{zkbTrainRegisterMainController.safetyCertificateFile}"/>
                            <br/>
                            <h:outputText value="recommendationFile: #{zkbTrainRegisterMainController.recommendationFile}"/>
                        </h:panelGroup>

                        <!-- 按钮：仅非查看模式显示 -->
                        <p:commandButton value="#{msg.Save}" icon="ui-icon-check" validateClient="true"
                                         action="#{zkbTrainRegisterMainController.saveEngineer}"
                                         update=":engineerListForm:detailDatalist"
                                         oncomplete="PF('registerEngineerEditDlg').hide()"
                                         rendered="#{zkbTrainRegisterMainController.actionName != 'View'}"/>
<!--                                         disabled="#{empty zkbTrainRegisterMainController.physicalExamFile-->
<!--                            or empty zkbTrainRegisterMainController.safetyCertificateFile-->
<!--                            or empty zkbTrainRegisterMainController.recommendationFile}"-->
<!--                                         title="请上传放射体检、安全证书和推荐函后才能保存"/>-->

                        <p:commandButton value="#{msg.Cancel}" icon="ui-icon-cancel"
                                         onclick="PF('registerEngineerEditDlg').hide()" process="@this"
                                         rendered="#{zkbTrainRegisterMainController.actionName != 'View'}"/>
                    </h:form>
                </div>
            </ui:fragment>

            <!-- 视图2：新建工程师（仅在非查看模式可用） -->
            <ui:fragment rendered="#{zkbTrainRegisterMainController.engineerFormView == 'create'}">
                <div id="createEngineerView" style="padding:2px;">
                    <h:form id="engineerCreateForm">
                        <p:fieldset legend="新增工程师信息">
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                         style="width:100%">
                                <h:panelGroup>
                                    <label class="label">所属租户</label>
                                    <p:outputLabel
                                            value="#{zkbTrainRegisterMainController.getTenantInfo(zkbTrainRegisterMainController.selectionTenantInfo).name}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">姓名 *</label>
                                    <p:inputText value="#{zkbTrainRegisterMainController.newEngineer.name}"
                                                 required="true"
                                                 requiredMessage="#{msg.zkbEngineer_name} #{msg.ValidationRequire}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">电话*</label>
                                    <p:inputText value="#{zkbTrainRegisterMainController.newEngineer.phone}"
                                                 required="true"
                                                 requiredMessage="#{msg.zkbEngineer_phone} #{msg.ValidationRequire}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">邮箱*</label>
                                    <p:inputText value="#{zkbTrainRegisterMainController.newEngineer.email}"
                                                 required="true"
                                                 requiredMessage="#{msg.zkbEngineer_email} #{msg.ValidationRequire}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">年龄*</label>
                                    <p:inputNumber value="#{zkbTrainRegisterMainController.newEngineer.age}"
                                                   decimalPlaces="0" minValue="0" maxValue="999" required="true"
                                                   requiredMessage="#{msg.zkbEngineer_age} #{msg.ValidationRequire}"/>
                                </h:panelGroup>
                            </p:panelGrid>

                            <!-- 附件上传 -->
                            <p:panelGrid style="width:100%">
                                <f:facet name="header">附件上传</f:facet>
                                <p:dataList id="newEngineerUploadList"
                                            value="#{zkbTrainRegisterMainController.newEngineerV2BlobObjectList}"
                                            var="fileitem" emptyMessage="#{msg.noRecordFound}">
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false"
                                                   actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}"/>
                                    <p:commandButton
                                            actionListener="#{zkbTrainRegisterMainController.removeNewEngineerFile(fileitem)}"
                                            update="newEngineerUploadList" icon="ui-icon-clear"
                                            title="删除" process="@this">
                                        <p:confirm header="确认删除" message="确定要删除该文件吗？"/>
                                    </p:commandButton>
                                </p:dataList>
                                <p:fileUpload mode="advanced" multiple="true" auto="true" label="上传"
                                              fileUploadListener="#{zkbTrainRegisterMainController.handleNewEngineerFileUpload}"
                                              update="newEngineerUploadList" sizeLimit="100000000"
                                              allowTypes="/(\.|\/)(pdf|doc|docx|jpg|png|zip)$/i"/>
                            </p:panelGrid>

                            <!-- 按钮 -->
                            <p:commandButton value="#{msg.Save}" icon="ui-icon-check" validateClient="true"
                                             actionListener="#{zkbTrainRegisterMainController.createEngineer}"
                                             update=":engineerFormPanel :growl"
                                             oncomplete="if(args.validationFailed){}"/>
                            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                             actionListener="#{zkbTrainRegisterMainController.cancelCreateEngineer}"
                                             update=":engineerFormPanel" process="@this"/>
                        </p:fieldset>
                    </h:form>
                </div>
            </ui:fragment>

        </p:outputPanel>
    </p:dialog>

</ui:composition>

</html>
