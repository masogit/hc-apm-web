<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui" xmlns:f="http://java.sun.com/jsf/core">

<ui:composition>
    <p:dialog id="editDlg" widgetVar="editDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{zkbTrainPublishController.CRUDActionName} 课程" width="600" height="400">
        <h:form id="zkbCourseEditForm">
            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{zkbTrainPublishController.selected != null}">
                <h:panelGroup>
                    <label class="label">课程CatNo*</label>
                    <p:autoComplete dropdown="true" value="#{zkbTrainPublishController.selectedCourse}"  scrollHeight="300" forceSelection="true" required="true" requiredMessage="课程 #{msg.ValidationRequire}"
                                    completeMethod="#{zkbTrainPublishController.autoCompleteCourse}" var="t" itemLabel="#{t.catNo}" itemValue="#{t}" converter="zkbTrainCourseConverter">
                        <p:ajax event="itemSelect" update="name courseType" listener="#{zkbTrainPublishController.courseSelect}" />

                    </p:autoComplete>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">课程名称*</label>
                    <p:inputText id="name" value="#{zkbTrainPublishController.selected.zkbTrainCourse.name}" disabled="true"  />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">课程类型*</label>
                    <p:inputText id="courseType" value="#{fieldMsg.fieldValue('ZkbTrainCourseType',zkbTrainPublishController.selected.zkbTrainCourse.courseType)}" disabled="true"  />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">培训方式*</label>
                    <p:selectOneMenu  autoWidth="false" style="width: 80%" value="#{zkbTrainPublishController.selected.trainMode}" required="true" requiredMessage="培训方式 #{msg.ValidationRequire}" >
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('trainMode')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">培训老师</label>
                    <p:inputText  value="#{zkbTrainPublishController.selected.trainPeople}"  />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">培训地点</label>
                    <p:inputText  value="#{zkbTrainPublishController.selected.location}"  />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">培训容量</label>
                    <p:spinner  value="#{zkbTrainPublishController.selected.trainCount}"  min="0" max="10000000" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">培训开始时间*</label>
                    <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd" value="#{zkbTrainPublishController.selected.trainStartDate}" required="true" requiredMessage="培训开始时间 #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">培训结束时间*</label>
                    <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd" value="#{zkbTrainPublishController.selected.trainEndDate}" required="true" requiredMessage="培训结束时间 #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">报名截止日期*</label>
                    <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd" value="#{zkbTrainPublishController.selected.signDeadline}" required="true" requiredMessage="报名截止日期 #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" action="#{zkbTrainPublishController.saveData}" update=":growl :listForm:datalist " icon="ui-icon-check" oncomplete="PF('editDialog').hide()"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('editDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
