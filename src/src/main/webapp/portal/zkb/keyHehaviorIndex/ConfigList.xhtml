<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.zkbKeyBehaviorIndex_totalFullScoreConfig}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="zkbKeyBehaviorIndexConfigListForm">
                    <p:dataTable id="datalist" value="#{zkbKeyBehaviorIndexConfigController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbKeyBehaviorIndexConfigController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="rowSelect" listener="#{zkbKeyBehaviorIndexConfigController.prepareEdit}" update="deleteButton editButton"/>
                        <p:ajax event="filter" listener="#{zkbKeyBehaviorIndexConfigController.onFilter}" />
                        <p:column headerText="#{msg.zkbKeyBehaviorIndex_tenant}">
                            <h:outputText value="#{tenantInfoController.getNameByUid(item.tenantUID)}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbKeyBehaviorIndex_partReturnFullScore}" filterBy="#{item.partReturnFullScore}" filterMatchMode="EQ">
                            <h:outputText value="#{item.partReturnFullScore}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbKeyBehaviorIndex_pasteQuickResponseRateFullScore}" filterBy="#{item.pasteQuickResponseRateFullScore}" filterMatchMode="EQ">
                            <h:outputText value="#{item.pasteQuickResponseRateFullScore}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbKeyBehaviorIndex_apmBillingRateFullScore}" filterBy="#{item.apmBillingRateFullScore}" filterMatchMode="EQ">
                            <h:outputText value="#{item.apmBillingRateFullScore}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbKeyBehaviorIndex_satisfactoryDegreeFullScore}" filterBy="#{item.satisfactoryDegreeFullScore}" filterMatchMode="EQ">
                            <h:outputText value="#{item.satisfactoryDegreeFullScore}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbKeyBehaviorIndex_complianceFullScore}" filterBy="#{item.complianceFullScore}" filterMatchMode="EQ">
                            <h:outputText value="#{item.complianceFullScore}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbKeyBehaviorIndex_engineerFullScore}" filterBy="#{item.engineerFullScore}" filterMatchMode="EQ">
                            <h:outputText value="#{item.engineerFullScore}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbKeyBehaviorIndex_totalFullScore}">
                            <h:outputText value="#{item.totalFullStore}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{zkbKeyBehaviorIndexConfigController.prepareCreate}" update=":zkbKeyBehaviorIndexConfigEditForm" />
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray batch-terminated" title="#{msg.Edit}" actionListener="#{zkbKeyBehaviorIndexConfigController.prepareEdit}"  update=":zkbKeyBehaviorIndexConfigEditForm" disabled="#{empty zkbKeyBehaviorIndexConfigController.selected.id or zkbKeyBehaviorIndexConfigController.selected.defaultConfig==1}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-delete" class="btn btn-sm btn-gray batch-terminated" title="#{msg.Delete}" actionListener="#{zkbKeyBehaviorIndexConfigController.delete}" update=":zkbKeyBehaviorIndexConfigListForm :zkbKeyBehaviorIndexConfigEditForm :growl" disabled="#{empty zkbKeyBehaviorIndexConfigController.selected.id or zkbKeyBehaviorIndexConfigController.selected.defaultConfig==1}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.IsConfirmDeleRecord}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="ConfigEdit.xhtml"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
