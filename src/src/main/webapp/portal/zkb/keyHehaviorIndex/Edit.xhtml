<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
    <h:form id="zkbKeyBehaviorIndexEditForm">
        <p:fieldset id="zkbFiledSet" legend="#{zkbKeyBehaviorIndexController.CRUDActionName}" style="margin-bottom:20px" rendered="#{zkbKeyBehaviorIndexController.selected != null}">
            <h:panelGroup>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_tenant}</label>
                        <p:inputText disabled="true" value="#{zkbKeyBehaviorIndexController.selected.tenantName}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_tenant}#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_kbiDate}</label>
                        <p:calendar disabled="true" timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM"  value="#{zkbKeyBehaviorIndexController.selected.kbiDate}"
                                    required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_BeginningTime} #{msg.ValidationRequire}"
                                    showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_totalScore}</label>
                        <p:inputNumber  disabled="true"  minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.totalScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_totalScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_partReturnFullScore}</label>
                        <p:inputNumber disabled="#{!userContextService.zkbAdmin}" id="partReturnFullScore"  maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.partReturnFullScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_partReturnFullScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm" listener="#{zkbKeyBehaviorIndexController.calculateScore}"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_intactPartReturnRateFullScore}</label>
                        <p:inputNumber disabled="#{!userContextService.zkbAdmin}" maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.intactPartReturnRateFullScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_intactPartReturnRateFullScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm" listener="#{zkbKeyBehaviorIndexController.calculateScore}"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_pasteQuickResponseRateFullScore}</label>
                        <p:inputNumber disabled="#{!userContextService.zkbAdmin}"   maxValue="100" minValue="0" decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.pasteQuickResponseRateFullScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_pasteQuickResponseRateFullScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm" listener="#{zkbKeyBehaviorIndexController.calculateScore}"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_apmBillingRateFullScore}</label>
                        <p:inputNumber disabled="#{!userContextService.zkbAdmin}"  maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.apmBillingRateFullScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_apmBillingRateFullScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm" listener="#{zkbKeyBehaviorIndexController.calculateScore}"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_satisfactoryDegreeFullScore}</label>
                        <p:inputNumber disabled="#{!userContextService.zkbAdmin}"  maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.satisfactoryDegreeFullScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_satisfactoryDegreeFullScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_complianceFullScore}</label>
                        <p:inputNumber disabled="#{!userContextService.zkbAdmin}"  maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.complianceFullScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_complianceFullScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_engineerFullScore}</label>
                        <p:inputNumber disabled="#{!userContextService.zkbAdmin}"  maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.engineerFullScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_engineerFullScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_totalFullScore}</label>
                        <p:inputNumber  disabled="true"   minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.totalFullScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_totalFullScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_partReturnScore}</label>
                        <p:inputNumber disabled="true" maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.partReturnScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_partReturnScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_intactPartReturnRateScore}</label>
                        <p:inputNumber disabled="true"  maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.intactPartReturnRateScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_intactPartReturnRateScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_pasteQuickResponseRateScore}</label>
                        <p:inputNumber disabled="true"  maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.pasteQuickResponseRateScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_pasteQuickResponseRateScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_apmBillingRateScore}</label>
                        <p:inputNumber disabled="true"  maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.apmBillingRateScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_apmBillingRateScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_satisfactoryDegreeScore}</label>
                        <p:inputNumber disabled="#{!userContextService.zkbAdmin}" maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.satisfactoryDegreeScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_satisfactoryDegreeScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_complianceScore}</label>
                        <p:inputNumber disabled="#{!userContextService.zkbAdmin}"  maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.complianceScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_complianceScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zkbKeyBehaviorIndex_engineerScore}</label>
                        <p:inputNumber disabled="#{!userContextService.zkbAdmin}"  maxValue="100" minValue="0"  decimalPlaces="0" value="#{zkbKeyBehaviorIndexController.selected.engineerScore}"  required="true" requiredMessage="#{msg.zkbKeyBehaviorIndex_engineerScore}#{msg.ValidationRequire}">
                            <p:ajax update="zkbKeyBehaviorIndexEditForm"/>
                        </p:inputNumber>
                    </h:panelGroup>

                </p:panelGrid>
                <h:panelGroup >
                    <p:dataTable id="zkbContractList"  value="#{zkbKeyBehaviorIndexController.getZkbContractList()}" var="item"
                                 rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rowsPerPageTemplate="20,50,100,500"  rows="20" emptyMessage="#{msg.noRecordFound}">
                        <p:ajax event="rowSelect" />
                        <p:column headerText="#{msg.zkbContract_contractNo}">
                            <h:outputText value="#{item.contractNo}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContract_contractType}">
                            <h:outputText value="#{item.contractType}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbContract_ibNumber}">
                            <h:outputText value="#{item.ibNumber}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbContract_startDate}" >
                            <h:outputText value="#{item.startDate}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column  headerText="#{msg.zkbContract_endDate}" >
                            <h:outputText value="#{item.endDate}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column  headerText="#{msg.zkbKeyBehaviorIndex_remainDaysContract}" >
                            <h:outputText value="#{item.remainDaysContract}"/>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{zkbKeyBehaviorIndexController.save}" rendered="#{userContextService.zkbAdmin}"  update=":zkbKeyBehaviorIndexForm :zkbKeyBehaviorIndexEditForm :growl"  value="#{msg.Save}" icon="ui-icon-check"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" rendered="#{userContextService.zkbAdmin}" actionListener="#{zkbKeyBehaviorIndexController.cancel}"  update=":zkbKeyBehaviorIndexEditForm :growl"/>
                </h:panelGroup>
            </h:panelGroup>
        </p:fieldset>
    </h:form>

</ui:composition>
</html>
