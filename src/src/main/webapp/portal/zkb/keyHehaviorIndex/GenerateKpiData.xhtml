<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="KPI数据生成"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <p:fieldset id="zkbTenantFieldset"  legend="生成条件" >
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                            <h:panelGroup>
                                <label class="label">生成月份</label>
                                <p:calendar id="kpiDate" timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}" pattern="yyyy-MM" value="#{zkbKeyBehaviorIndexController.kpiDate}" requiredMessage="生成月份#{msg.ValidationRequire}"
                                            showOn="button" showButtonPanel="true" navigator="true" mask="true"  >
                                 </p:calendar>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:commandButton id="batchCreateButton" value="选择供应商" title="选择供应商"   update=":growl :selectTenantBatchDlg"     action="#{zkbKeyBehaviorIndexController.updateTenantInfoList}"   oncomplete="openForceLeaseDialog(xhr, status, args)">
                                </p:commandButton>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:commandButton value="生成" update=":growl :searchForm" action="#{zkbKeyBehaviorIndexController.generateKpiData}"></p:commandButton>
                            </h:panelGroup>
                        </p:panelGrid>
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <p:outputLabel id="tips" style="color: red;font-weight:bold;margin-left: 30px;font-size: larger"  value="#{zkbKeyBehaviorIndexController.getTenantName()}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                </h:form>
                <div class="ui-g-12 card"><br/><br/>
                    <h:form enctype="multipart/form-data">
                        <p:fieldset legend="批量生成" id="uploaderContainer">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <p:fileUpload fileUploadListener="#{zkbKeyBehaviorIndexController.handleFileUpload}" mode="advanced" dragDropSupport="false" multiple="false" auto="true"
                                              invalidFileMessage="只支持xls或xlsx格式的文件" invalidSizeMessage="文件大小不得超过5M"
                                              update=":dataListForm" sizeLimit="5242880"
                                              allowTypes="/(\.|\/)(xls|xlsx)$/" label="从Excel导入" cancelLabel="取消" uploadLabel="确认上传" />
                                <p:growl id="messages" showDetail="true" />
                            </p:panelGrid>
                            <h:panelGroup>
                                <p>说明</p>
                                <p>
                                    1.导出代理商信息<p:commandButton id="exportButton" ajax="false" title="#{msg.exportToXLS}" actionListener="#{zkbKeyBehaviorIndexController.exportTenantInfo}" icon="ui-icon-arrowstop-1-s">
                                    <p:fileDownload value="#{zkbKeyBehaviorIndexController.exportFile}"/>
                                </p:commandButton>
                                </p>
                                <p>
                                    2.填写excel信息，无需重新生成的代理商信息需删除
                                </p>
                                <p>3.上传文件进行批量生成</p>
                            </h:panelGroup>
                        </p:fieldset>
                    </h:form>
                    <h:panelGroup>
                        <p:commandButton value="#{msg.Return}"  icon="ui-icon-arrow-back" action="List.xhtml?faces-redirect=true" immediate="true"  update=":growl" style="float:left"/>
                    </h:panelGroup>
                </div>
                <div class="ui-g-12 card">
                    <h:form id="dataListForm">
                        <p:fieldset legend="错误的数据">
                            <p:dataTable id="datalist" rendered="#{not empty zkbKeyBehaviorIndexController.errorKbiList}"
                                         value="#{zkbKeyBehaviorIndexController.errorKbiList}" var="item" lazy="false" paginator="true" paginatorPosition="both"
                                         paginatorAlwaysVisible="true"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">
                                <p:column headerText="EXCEL行数">
                                    <h:outputText value="#{item.get('tenantInfoVO').lineNum}" />
                                </p:column>
                                <p:column headerText="ID">
                                    <h:outputText value="#{item.get('tenantInfoVO').uid}" />
                                </p:column>
                                <p:column headerText="代理商名称">
                                    <h:outputText value="#{item.get('tenantInfoVO').name}" />
                                </p:column>
                                <p:column headerText="年">
                                    <h:outputText value="#{item.get('tenantInfoVO').year}" />
                                </p:column>
                                <p:column headerText="月">
                                    <h:outputText value="#{item.get('tenantInfoVO').month}" />
                                </p:column>
                                <p:column headerText="#{msg.FailureInformation}" >
                                    <h:outputText value="#{item.get('errmsg')}"/>
                                </p:column>
                            </p:dataTable>
                        </p:fieldset>
                    </h:form>
                </div>
                <ui:include src="selectTenant.xhtml"/>
            </div>
        </div>
        <script>
            function openForceLeaseDialog(xhr, status, args) {
                console.log("openForceLeaseDialog: " + args.validationFailed);
                if (args.validationFailed) {
                    console.log(args.validationFailed);
                } else {
                    PF('selectTenantBatchDialog').show()
                }
            }

        </script>
    </ui:define>
</ui:composition>
