<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="KPI数据生成"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <p:fieldset legend="生成条件">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup >
                                <label class="label">#{msg.zkbKeyBehaviorIndex_tenant}</label>
                                <p:selectOneMenu value="#{zkbKeyBehaviorIndexController.kpiTenantUID}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{zkbPartOrderController.tenantInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">KPI时间</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM" value="#{zkbKeyBehaviorIndexController.kpiDate}"
                                            required="true" requiredMessage="KPI时间 #{msg.ValidationRequire}"
                                            showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">是否生成非公式字段*</label>
                                <p:selectOneMenu value="#{zkbKeyBehaviorIndexController.replaceAll}"  required="true" requiredMessage="是否生成非公式字段 #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="否" itemValue="f"/>
                                    <f:selectItem itemLabel="是" itemValue="t"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:commandButton value="生成" actionListener="#{zkbKeyBehaviorIndexController.generateKpiData}">
                                </p:commandButton>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
