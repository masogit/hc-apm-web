<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.zkbKeyBehaviorIndex_kbi}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup >
                                <label class="label">#{msg.zkbKeyBehaviorIndex_tenant}</label>
                                <p:selectOneMenu  id="agent" value="#{zkbKeyBehaviorIndexController.tenantUID}" disabled="#{!userContextService.zkbAdmin}">
                                    <p:ajax event="change" update="searchForm"/>
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{zkbPartOrderController.tenantInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbKeyBehaviorIndex_beginningTime}</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM" id="beginningTime" value="#{zkbKeyBehaviorIndexController.beginningTime}"
                                            required="false" requiredMessage="#{msg.zkbKeyBehaviorIndex_BeginningTime} #{msg.ValidationRequire}"
                                            showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zkbKeyBehaviorIndex_endingTime}</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy-MM" id="endingTime" value="#{zkbKeyBehaviorIndexController.endingTime}"
                                            required="false" requiredMessage="#{msg.zkbKeyBehaviorIndex_endingTime} #{msg.ValidationRequire}"
                                            showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:commandButton value="#{msg.zkbKeyBehaviorIndex_quiry}" actionListener="#{zkbKeyBehaviorIndexController.loadData}"   update=":growl :zkbKeyBehaviorIndexForm:datalist">
                                </p:commandButton>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:commandButton value="#{msg.zkbKeyBehaviorIndex_charts}" actionListener="#{zkbKeyBehaviorIndexController.generateCharts}" disabled="#{zkbKeyBehaviorIndexController.tenantUID==null}" update=":dialogCharts :charts"  oncomplete="PF('dialogCharts').show()">
                                </p:commandButton>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:commandButton value="重新生成"  rendered="#{userContextService.zkbAdmin}" action="#{zkbKeyBehaviorIndexController.reGenerateDate}">
                                </p:commandButton>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:commandButton value="生效"  rendered="#{userContextService.zkbAdmin}" actionListener="#{zkbKeyBehaviorIndexController.effect}"  update=":growl :zkbKeyBehaviorIndexForm:datalist">
                                </p:commandButton>
                            </h:panelGroup>
                            <h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{userContextService.zkbAdmin}">
                                <label style="color: red">1.未选择租户时,给所有租户生效KPI<br/>2.开始时间为空时,生效上月KPI<br/>
                                </label>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                </h:form>
                <h:form id="zkbKeyBehaviorIndexForm">
                    <p:dataTable id="datalist" value="#{zkbKeyBehaviorIndexController.zkbKeyBehaviorIndexList}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbKeyBehaviorIndexController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="rowSelect" listener="#{zkbKeyBehaviorIndexController.prepareEdit}" update="editButton"/>
                        <p:column  headerText="#{msg.zkbKeyBehaviorIndex_tenant}" >
                            <h:outputText value="#{item.tenantName}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbKeyBehaviorIndex_kbiDate}" >
                            <h:outputText value="#{item.kbiDate}">
                                <f:convertDateTime pattern="yyyy-MM" />
                            </h:outputText>
                        </p:column>
                        <p:column   headerText="总#{msg.zkbKeyBehaviorIndex_rank}" >
                            <h:outputText value="#{item.rank}"/>
                        </p:column>
                        <p:column   headerText="DI#{msg.zkbKeyBehaviorIndex_rank}" >
                            <h:outputText value="#{item.diRank}"/>
                        </p:column>
                        <p:column   headerText="CCS#{msg.zkbKeyBehaviorIndex_rank}" >
                            <h:outputText value="#{item.ccsRank}"/>
                        </p:column>
                        <p:column   headerText="PCB#{msg.zkbKeyBehaviorIndex_rank}" >
                            <h:outputText value="#{item.pcbRank}"/>
                        </p:column>
                        <p:column   headerText="是否生效" >
                            <h:outputText value="#{item.effect}"/>
                        </p:column>
                        <p:column  style="color: red" headerText="#{msg.zkbKeyBehaviorIndex_totalScore}" >
                            <h:outputText value="#{item.totalScore}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbKeyBehaviorIndex_partReturnFullScore}" >
                            <h:outputText value="#{item.partReturnFullScore}"/>
                        </p:column>
                        <p:column  style="color: red" headerText="#{msg.zkbKeyBehaviorIndex_partReturnScore}" >
                            <h:outputText value="#{item.partReturnScore}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbKeyBehaviorIndex_satisfactoryDegreeFullScore}" >
                            <h:outputText value="#{item.satisfactoryDegreeFullScore}"/>
                        </p:column>
                        <p:column  style="color: red" headerText="#{msg.zkbKeyBehaviorIndex_satisfactoryDegreeScore}" >
                            <h:outputText value="#{item.satisfactoryDegreeScore}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbKeyBehaviorIndex_apmBillingRateFullScore}" >
                            <h:outputText value="#{item.apmBillingRateFullScore}"/>
                        </p:column>
                        <p:column  style="color: red" headerText="#{msg.zkbKeyBehaviorIndex_apmBillingRateScore}" >
                            <h:outputText value="#{item.apmBillingRateScore}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbKeyBehaviorIndex_pasteQuickResponseRateFullScore}" >
                            <h:outputText value="#{item.pasteQuickResponseRateFullScore}"/>
                        </p:column>
                        <p:column  style="color: red" headerText="#{msg.zkbKeyBehaviorIndex_pasteQuickResponseRateScore}" >
                            <h:outputText value="#{item.pasteQuickResponseRateScore}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbKeyBehaviorIndex_complianceFullScore}" >
                            <h:outputText value="#{item.complianceFullScore}"/>
                        </p:column>
                        <p:column  style="color: red" headerText="#{msg.zkbKeyBehaviorIndex_complianceScore}" >
                            <h:outputText value="#{item.complianceScore}"/>
                        </p:column>
                        <p:column  headerText="#{msg.zkbKeyBehaviorIndex_engineerFullScore}" >
                            <h:outputText value="#{item.engineerFullScore}"/>
                        </p:column>
                        <p:column style="color: red" headerText="#{msg.zkbKeyBehaviorIndex_engineerScore}" >
                            <h:outputText value="#{item.engineerScore}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="editButton"  icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" update=":zkbKeyBehaviorIndexEditForm" action="#{zkbKeyBehaviorIndexController.prepareEdit}"  disabled="#{empty zkbKeyBehaviorIndexController.selected.id}"/>
                            <p:commandButton id="exportButton" ajax="false" title="#{msg.exportToXLS}" actionListener="#{zkbKeyBehaviorIndexController.exportAll}" oncomplete="PF('dialogKeyBehaviorIndex').show()" icon="ui-icon-arrowstop-1-s">
                                <p:fileDownload value="#{zkbKeyBehaviorIndexController.exportFile}"/>
                            </p:commandButton>
                            <p:commandButton title="#{msg.Import}" icon="ui-icon-arrowstop-1-n" class="btn btn-sm btn-gray" rendered="#{userContextService.zkbAdmin}" action="#{zkbKeyBehaviorIndexController.importAction}"></p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="Edit.xhtml"/>
                <ui:include src="Charts.xhtml"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
