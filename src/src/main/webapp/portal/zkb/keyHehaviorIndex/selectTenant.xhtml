<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition>
        <p:dialog id="selectTenantBatchDlg" widgetVar="selectTenantBatchDialog" modal="true" resizable="true" draggable="true" closable="false" appendTo="@(body)" header="选择代理商">
            <h:form id="workScheduleBatchForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">代理商</label>
                        <p:selectManyMenu scrollHeight="300"  value="#{zkbKeyBehaviorIndexController.selectTenantInfoList}" var="t" converter="tenantInfoConverter" filter="true" filterMatchMode="contains" showCheckbox="true">
                            <f:selectItems value="#{zkbKeyBehaviorIndexController.tenantInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
                            <p:column>
                                <h:outputText value="#{t.name}" />
                            </p:column>
                        </p:selectManyMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <br/>
                <p:commandButton validateClient="true" value="确定" update=":searchForm" icon="ui-icon-check" oncomplete="PF('selectTenantBatchDialog').hide()"/>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
