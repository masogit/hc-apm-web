<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>

    <h:form id="zkbFePartOrderUserConfigEditForm">
        <p:fieldset id="zkbFiledSet" legend="#{zkbFePartOrderUserConfigController.CRUDActionName}" style="margin-bottom:20px" rendered="#{zkbFePartOrderUserConfigController.selected != null}">
            <h:panelGroup>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">APM用户名</label>
                        <p:inputText id="loginName" value="#{zkbFePartOrderUserConfigController.selected.loginName}" maxlength="40" required="true" requiredMessage="APM用户名#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">姓名</label>
                        <p:inputText id="name" value="#{zkbFePartOrderUserConfigController.selected.name}" maxlength="40" required="true" requiredMessage="姓名#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">邮箱</label>
                        <p:inputText id="email" value="#{zkbFePartOrderUserConfigController.selected.email}" maxlength="40" required="true" requiredMessage="邮箱#{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">电话</label>
                        <p:inputText id="phone" value="#{zkbFePartOrderUserConfigController.selected.phone}" maxlength="40" required="true" requiredMessage="电话#{msg.ValidationRequire}" />
                    </h:panelGroup>
<!--                    <h:panelGroup>-->
<!--                        <label class="label">用户SSO</label>-->
<!--                        <p:inputText id="sso" value="#{zkbFePartOrderUserConfigController.selected.sso}" maxlength="40" required="false" requiredMessage="用户sso#{msg.ValidationRequire}" />-->
<!--                    </h:panelGroup>-->
                    <h:panelGroup>
                        <label class="label">角色</label>
                        <p:selectOneMenu id="configType" disabled="#{!userContextService.zkbAdmin}" value="#{zkbFePartOrderUserConfigController.selected.configType}"  required="true" requiredMessage="角色#{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_configType')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputText id="remark" value="#{zkbFePartOrderUserConfigController.selected.remark}" maxlength="40" required="false" requiredMessage="备注#{msg.ValidationRequire}" />
                    </h:panelGroup>
                </p:panelGrid>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{zkbFePartOrderUserConfigController.save}" update=":zkbFePartOrderUserConfigListForm :zkbFePartOrderUserConfigEditForm :growl" value="#{msg.Save}" icon="ui-icon-check"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{zkbFePartOrderUserConfigController.cancel}" update=":zkbFePartOrderUserConfigEditForm :growl"/>
                </h:panelGroup>

            </h:panelGroup>
        </p:fieldset>
    </h:form>

</ui:composition>
</html>
