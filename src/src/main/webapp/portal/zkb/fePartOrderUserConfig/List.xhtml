<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="FE USER CONFIG配置"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="zkbFePartOrderUserConfigListForm">
                    <p:fieldset legend="#{msg.FilterCondition}" rendered="#{userContextService.zkbAdmin}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup >
                                <label class="label">#{msg.zkbHistory_agent}</label>
                                <p:selectOneMenu id="agent" value="#{zkbFePartOrderUserConfigController.tenantUID}">
                                    <p:ajax listener="#{zkbContractController.tenantInfoSelect}" update="datalist"/>
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{zkbPartOrderController.tenantInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
<!--                </h:form>-->

                    <p:dataTable id="datalist" value="#{zkbFePartOrderUserConfigController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbFePartOrderUserConfigController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="rowSelect" listener="#{zkbFePartOrderUserConfigController.prepareEdit}" update="deleteButton editButton"/>
                        <p:ajax event="filter" listener="#{zkbFePartOrderUserConfigController.onFilter}" />
                        <p:column headerText="#{msg.zkbContact_tenant}">
                            <h:outputText value="#{zkbContractController.getTenantInfo(item.tenantUid).name}"/>
                        </p:column>
                        <p:column headerText="APM用户名" filterBy="#{item.loginName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.loginName}"/>
                        </p:column>
                        <p:column headerText="姓名" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="邮箱" filterBy="#{item.email}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.email}"/>
                        </p:column>
                        <p:column headerText="电话" filterBy="#{item.phone}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.phone}"/>
                        </p:column>
<!--                        <p:column headerText="用户SSO" filterBy="#{item.sso}" filterMatchMode="LIKE">-->
<!--                            <h:outputText value="#{item.sso}"/>-->
<!--                        </p:column>-->
                        <p:column headerText="角色" filterBy="#{item.configType}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbFePartOrder_configType', item.configType)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbFePartOrder_configType')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="备注" filterBy="#{item.remark}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{zkbFePartOrderUserConfigController.prepareCreate}" update=":zkbFePartOrderUserConfigEditForm" />
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray batch-terminated" title="#{msg.Edit}" actionListener="#{zkbFePartOrderUserConfigController.prepareEdit}"  update=":zkbFePartOrderUserConfigEditForm" disabled="#{empty zkbFePartOrderUserConfigController.selected.id}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-delete" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchDelete}" actionListener="#{zkbFePartOrderUserConfigController.delete}" update=":zkbFePartOrderUserConfigListForm :zkbFePartOrderUserConfigEditForm :growl" disabled="#{empty zkbFePartOrderUserConfigController.selected.id}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.IsConfirmDeleRecord}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="Edit.xhtml"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
