<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="日志管理"/><!--#{msg.ZKBCourseMgt}-->
            </div>

            <div class="ui-g-12 card">
                <h:form id="zkbCourseListForm">
                   <p:dataTable id="datalist" value="#{zkbContractLogController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbContractLogController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="filter" listener="#{zkbContractLogController.onFilter}" />

                       <p:column headerText="合同号" filterBy="#{item.contractNo}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.contractNo}"/>
                       </p:column>
                       <p:column headerText="类型"  filterBy="#{item.logType}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.logType}"/>
                       </p:column>
                       <p:column headerText="课程信息" filterBy="#{item.courseData}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.courseData}"/>
                       </p:column>
                       <p:column headerText="设备信息" filterBy="#{item.assetData}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.assetData}"/>
                       </p:column>
                       <p:column headerText="探头信息" filterBy="#{item.catData}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.catData}"/>
                       </p:column>
                       <p:column headerText="原因" filterBy="#{item.reason}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.reason}"/>
                       </p:column>
                       <p:column headerText="名额信息" filterBy="#{item.jsonData}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.jsonData}"/>
                       </p:column>
                       <p:column headerText="操作人" filterBy="#{item.loginUserName}" filterMatchMode="LIKE">
                           <h:outputText value="#{item.loginUserName}"/>
                       </p:column>
                       <p:column headerText="操作时间" >
                           <h:outputText value="#{item.createdDate}">
                               <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                           </h:outputText>
                       </p:column>

                    </p:dataTable>

                </h:form>

            </div>
        </div>
    </ui:define>


</ui:composition>
