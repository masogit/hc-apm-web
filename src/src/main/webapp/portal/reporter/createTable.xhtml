<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:tie="http://tiefaces.org/tiefaces"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="创建模版"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="CreateTemplateForm">
                    <p:tabView  id="tabView">
                        <p:tab title="模版编辑">

                            <div class="ui-g-12 card cardTitle">
                                <p:inputText id="pageTitle1" class="pageTitle" value="#{tableCreateController.table.title}"  required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}" >
                                    <p:ajax update=":CreateTemplateForm:tabView:pageTitle2 :CreateTemplateForm:tabView:pageTitle3"  listener="#{tableCreateController.onTitleChange}"/>
                                </p:inputText>
                            </div>
                            <c:forEach  items="#{tableCreateController.table.groups}" var="groupItem" varStatus="groupIndex">
                                <p:fieldset  legend="#{groupItem.title}" >
                                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                        <c:forEach  items="#{groupItem.items}" var="fieldItem">

                                            <h:panelGroup>
                                                <label class="label">#{fieldItem.label}</label>
                                                <c:if test="#{empty fieldItem.component or fieldItem.component eq 'Text'}" >
                                                    <p:inputText value="#{tableCreateController.tableValue[fieldItem.key]}" placeholder="#{fieldItem.ref}"/>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'Number'}" >
                                                    <p:inputNumber value="#{tableCreateController.tableValue[fieldItem.key]}" placeholder="#{fieldItem.ref}"/>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'Select'}" >
                                                    <p:selectOneMenu value="#{tableCreateController.tableValue[fieldItem.key]}">
                                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                                        <f:selectItems value="#{fieldItem.options}" var="option" itemLabel="#{option.key}" itemValue="#{option.value}"/>
                                                    </p:selectOneMenu>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'Switch'}" >
                                                    <p:selectBooleanButton onLabel="是" offLabel="否"  value="#{tableCreateController.tableValue[fieldItem.key]}"/>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'TextArea'}" >
                                                    <p:inputTextarea value="#{tableCreateController.tableValue[fieldItem.key]}"  placeholder="#{fieldItem.ref}"/>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'Date'}" >
                                                    <p:calendar value="#{tableCreateController.tableValue[fieldItem.key]}"  placeholder="#{fieldItem.ref}"/>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'Label'}" >
                                                    <h:outputText value="#{tableCreateController.tableValue[fieldItem.resKey]}"  />
                                                </c:if>
                                                <br/>
                                                <p:commandLink actionListener="#{tableCreateController.prepareEditItem(groupItem,fieldItem)}" value="修改"  update=":editItemDialogForm" oncomplete="PF('editItemDialog').show()" />
                                                <p:commandLink actionListener="#{tableCreateController.moveItem(groupItem,fieldItem,'up')}" value="上移"  update=":CreateTemplateForm"   />
                                                <p:commandLink actionListener="#{tableCreateController.moveItem(groupItem,fieldItem,'down')}" value="下移"  update=":CreateTemplateForm"  />
                                                <p:commandLink actionListener="#{tableCreateController.removeItem(groupItem,fieldItem)}" value="删除"  update=":CreateTemplateForm"  />
                                            </h:panelGroup>
                                        </c:forEach>
                                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                            <h:panelGroup>
                                                <p:commandLink actionListener="#{tableCreateController.prepareAddItem(groupItem)}" value="添加"  update=":editItemDialogForm" oncomplete="PF('editItemDialog').show()" process="@this"/>
                                            </h:panelGroup>
                                        </p:panelGrid>
                                    </p:panelGrid>

                                    <h:panelGroup style="float:right">
                                        <p:commandLink  actionListener="#{tableCreateController.prepareEditGroup(groupItem)}" value="修改"  update=":editGroupDialogForm" oncomplete="PF('editGroupDialog').show()"/>
                                        <p:commandLink  actionListener="#{tableCreateController.moveGroup(groupItem,'up')}" value="上移"  update=":CreateTemplateForm" />
                                        <p:commandLink  actionListener="#{tableCreateController.moveGroup(groupItem,'down')}" value="下移"  update=":CreateTemplateForm" />
                                        <p:commandLink  actionListener="#{tableCreateController.removeGroup(groupItem)}" value="删除"  update=":CreateTemplateForm" />
                                    </h:panelGroup>
                                </p:fieldset>


                            </c:forEach>
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                                <h:panelGroup>

                                    <p:commandLink process="@this" actionListener="#{tableCreateController.prepareAddGroup}" value="添加Group"  update=":editGroupDialogForm" oncomplete="PF('editGroupDialog').show()" />
                                    <br/>
                                    <p:commandLink immediate="true" value="手机预览" onclick="preparePreview();"  oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                                </h:panelGroup>
                            </p:panelGrid>



                        </p:tab>
                        <p:tab title="文本查看">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup >
                                    <label class="label">#{msg.name}</label>
                                    <p:inputText id="pageTitle2" value="#{tableCreateController.table.title}" required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}"  readonly="true"/>
                                </h:panelGroup>
                                <h:panelGroup id="jsonString">
                                    <label class="label">#{msg.jsonString}</label>
                                    <p:inputTextarea id="jsonStringText"  value="#{tableCreateController.tableString}" cols="100"  readonly="#{!tableCreateController.isStringEditable}" />
                                    <p:commandButton  value="编辑" actionListener="#{tableCreateController.onStringEdit()}" process="jsonString" update="jsonString :growl" rendered="#{!tableCreateController.isStringEditable}"/>
                                    <p:commandButton  value="保存" actionListener="#{tableCreateController.onStringSave()}" process="jsonString" update=":CreateTemplateForm jsonString :growl" rendered="#{tableCreateController.isStringEditable}"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="Excel查看">
                            <div class="ui-g-12 card cardTitle">
                                <p:inputText id="pageTitle3" class="pageTitle" value="#{tableCreateController.table.title}"  required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}" >
                                    <p:ajax update=":CreateTemplateForm:tabView:pageTitle2 :CreateTemplateForm:tabView:pageTitle1"  listener="#{tableCreateController.onTitleChange}"/>
                                </p:inputText>
                            </div>
                            <h:panelGroup id="importExcel">
                                <p:commandButton value="导入模版"  process="@this" update="importExcel" oncomplete="PF('uploadDialog').show()" rendered="#{empty tableCreateController.selectedTableDefinition.excelStorageId}"/>
                                <h:outputText value="#{tableCreateController.uploadedFile.fileName}" />
                                <p:link href="#{fileDownloadService.getFileUrl(tableCreateController.selectedTableDefinition.excelStorageId)}" rendered="#{not empty tableCreateController.selectedTableDefinition.excelStorageId and empty tableCreateController.uploadedFile}">#{tableCreateController.selectedTableDefinition.name}</p:link>
                                <p:commandButton icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" process="@this" actionListener="#{tableCreateController.removeExcelTemplate}" update="importExcel :uploadDialogForm preview" rendered="#{not empty tableCreateController.selectedTableDefinition.excelStorageId}"/>
                            </h:panelGroup>
                            <p:fieldset legend="预览" id="preview">
                                    <tie:websheet id="sheet1" webSheetBean="#{tableCreateController}"  maxRowsPerPage="30" rendered="#{not empty tableCreateController.uploadedFile or not empty tableCreateController.selectedTableDefinition.excelStorageId}"/>
                                    <p:panel rendered="#{not empty tableCreateController.uploadedFile or not empty tableCreateController.selectedTableDefinition.excelStorageId }">
                                        <p:commandButton value="测试"  update="preview" actionListener="#{tableCreateController.testSubmit()}" />
                                        <h:outputText value="#{tableCreateController.tableFields}" />
                                    </p:panel>
                            </p:fieldset>
                        </p:tab>
                    </p:tabView>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                        <h:panelGroup >
                            <label class="label">备注</label>
                            <p:inputTextarea value="#{tableCreateController.selectedTableDefinition.description}" cols="50"  />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.assetGroup}</label>
                            <p:selectOneMenu id="assetGroup" value="#{tableCreateController.selectedTableDefinition.assetGroup}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                    </p:panelGrid>
                    <h:panelGroup>
                        <!--<p:commandButton icon="ui-icon-remove-red-eye" immediate="true" value="手机预览" onclick="preparePreview();"  oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>-->
                        <p:commandButton icon="ui-icon-check" actionListener="#{tableCreateController.saveTemplate}" value="保存" style="float:left" validateClient="true" update=":CreateTemplateForm :growl" />
                        <!--<p:remoteCommand name="saveExcel" actionListener="#{excelTableCreateController.saveTemplate}" update=":CreateTemplateForm :growl" />-->
                        <p:commandButton value="#{msg.Return}"  icon="ui-icon-arrow-back" action="schemaList.xhtml?faces-redirect=true" immediate="true"  update=":growl" style="float:left"/>
                    </h:panelGroup>
                </h:form>

            </div>

        </div>
        <p:dialog id="editGroupDialog" widgetVar="editGroupDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="编辑组">
            <h:form id="editGroupDialogForm" >
                <h:panelGroup id="display" rendered="#{not empty tableCreateController.editGroup}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">#{msg.name}</label>
                            <p:inputText value="#{tableCreateController.editGroup.title}" required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}" />
                        </h:panelGroup>

                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{tableCreateController.editGroup()}" value="#{msg.Confirm}" update=":CreateTemplateForm :editGroupDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'editGroupDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('editGroupDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <p:dialog id="editItemDialog" widgetVar="editItemDialog" modal="true" width="800" height="450"  resizable="true" draggable="true" appendTo="@(body)" header="字段编辑">
            <h:form id="editItemDialogForm" >
                <h:panelGroup id="display" rendered="#{not empty tableCreateController.editTableItem}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">#{msg.fieldLabel}</label>
                            <p:inputText value="#{tableCreateController.editTableItem.label}" required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.fieldType}</label>
                            <p:selectOneMenu value="#{tableCreateController.editTableItem.component}">
                                <p:ajax  listener="#{tableCreateController.onOptionChange}"  update="optionsTable ruleSelect advanceSetting"  />
                                <f:selectItem itemLabel="#{msg.ComponentTypeInputText}" itemValue="#{'Text'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeNumber}" itemValue="#{'Number'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeSwitch}" itemValue="#{'Switch'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeSelect}" itemValue="#{'Select'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeTextArea}" itemValue="#{'TextArea'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeDate}" itemValue="#{'Date'}"/>
                                <f:selectItem itemLabel="结果输出" itemValue="#{'Label'}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.fieldKey}</label>
                            <p:inputText value="#{tableCreateController.editTableItem.key}" required="true" requiredMessage="#{msg.fieldKey}#{msg.ValidationRequire}" >
                                <p:ajax process="@this" />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">字段说明</label>
                            <p:inputText value="#{tableCreateController.editTableItem.ref}" />
                        </h:panelGroup>
                        <h:panelGroup id="ruleSelect">
                            <label class="label">计算规则</label>
                            <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['rule']}" >
                                <p:ajax listener="#{tableCreateController.onRuleChange}" update="advanceSetting"  />
                                <f:selectItem itemLabel="无"  />
                                <f:selectItem itemLabel="上下限" itemValue="#{'RangeRule'}" itemDisabled="#{tableCreateController.editTableItem.component ne 'Number'}"/>
                                <f:selectItem itemLabel="范围上下限" itemValue="#{'ScopeRule'}" itemDisabled="#{tableCreateController.editTableItem.component ne 'Number'}"/>
                                <f:selectItem itemLabel="设定值校验" itemValue="#{'VerifyRule'}" itemDisabled="#{tableCreateController.editTableItem.component ne 'Label'}"/>
                                <f:selectItem itemLabel="偏差校验" itemValue="#{'DeltaRule'}" itemDisabled="#{tableCreateController.editTableItem.component ne 'Label'}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                    </p:panelGrid>
                    <h:panelGroup id="advanceSetting">
                        <p:fieldset legend="上下限设置"  rendered="#{'RangeRule' eq tableCreateController.editTableItem.exp['rule']}" >
                            <h:outputText id="RangeRuleComments" value="合格: 下限#{tableCreateController.editTableItem.exp['minCompare'] eq 'GT'? '&lt;':'≤'}测量值#{tableCreateController.editTableItem.exp['maxCompare'] eq 'LT'? '&lt;':'≤'}上限" />
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup  >
                                    <label class="label ">计算结果Key*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.resKey}" required="true" requiredMessage="计算结果Key#{msg.ValidationRequire}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">上限</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['maxCompare']}" >
                                        <p:ajax update="RangeRuleComments" process="@this"/>
                                        <f:selectItem itemLabel="小于等于" itemValue="#{'LE'}"/>
                                        <f:selectItem itemLabel="小于" itemValue="#{'LT'}"/>
                                    </p:selectOneMenu>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['max']}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">下限</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['minCompare']}" >
                                        <p:ajax update="RangeRuleComments" process="@this"/>
                                        <f:selectItem itemLabel="大于等于" itemValue="#{'GE'}"/>
                                        <f:selectItem itemLabel="大于" itemValue="#{'GT'}"/>
                                    </p:selectOneMenu>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['min']}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">结果标识</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['resIdentify']}" >
                                        <f:selectItem itemLabel="合格/不合格" itemValue="#{'resIdentify_1'}"/>
                                        <f:selectItem itemLabel="合格/过高/过低" itemValue="#{'resIdentify_2'}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup> 

                            </p:panelGrid>
                        </p:fieldset>
                        <p:fieldset legend="范围上下限"  rendered="#{'ScopeRule' eq tableCreateController.editTableItem.exp['rule']}" >
                            <h:outputText id="ScopeRuleComments" value="合格: (1-下限范围)*标准值#{tableCreateController.editTableItem.exp['minCompare'] eq 'GT'? '&lt;':'≤'}测量值#{tableCreateController.editTableItem.exp['maxCompare'] eq 'LT'? '&lt;':'≤'}(1+上限范围)*标准值" />
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup  >
                                    <label class="label">计算结果Key*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.resKey}" required="true" requiredMessage="计算结果Key#{msg.ValidationRequire}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">标准值</label>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['norm']}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">上限范围</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['maxCompare']}" >
                                        <p:ajax update="ScopeRuleComments" process="@this"/>
                                        <f:selectItem itemLabel="小于等于" itemValue="#{'LE'}"/>
                                        <f:selectItem itemLabel="小于" itemValue="#{'LT'}"/>
                                    </p:selectOneMenu>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['max']}" minValue="0" />或
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['maxPercent']}" symbol="%" symbolPosition="s" minValue="0"/>
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">下限范围</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['minCompare']}" >
                                        <p:ajax update="ScopeRuleComments" process="@this"/>
                                        <f:selectItem itemLabel="大于等于" itemValue="#{'GE'}"/>
                                        <f:selectItem itemLabel="大于" itemValue="#{'GT'}"/>
                                    </p:selectOneMenu>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['min']}" maxValue="0" />或
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['minPercent']}" symbol="%" symbolPosition="s" maxValue="0"/>
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">结果标识</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['resIdentify']}" >
                                        <f:selectItem itemLabel="合格/不合格" itemValue="#{'resIdentify_1'}"/>
                                        <f:selectItem itemLabel="合格/过高/过低" itemValue="#{'resIdentify_2'}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup> 

                            </p:panelGrid>
                        </p:fieldset>
                        <p:fieldset legend="设定值校验"  rendered="#{'VerifyRule' eq tableCreateController.editTableItem.exp['rule']}" >
                            <p class="label"> 合格: 偏差下限范围≤|Y-X|/X≤偏差上限范围 ; 误差下限范围≤|Y-Z|/Z≤误差上限范围</p>
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup  >
                                    <label class="label">计算结果Key*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.resKey}" required="true" requiredMessage="计算结果Key#{msg.ValidationRequire}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">设定值(X)*</label>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['norm']}" required="true" requiredMessage="设定值(X)#{msg.ValidationRequire}" />
                                </h:panelGroup>
                                <!--                                <h:panelGroup >
                                                                    <label class="label">量程(FS)*</label>
                                                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['FS']}" required="true" requiredMessage="量程(FS)#{msg.ValidationRequire}" />
                                                                </h:panelGroup>-->
                                <h:panelGroup  >
                                    <label class="label">设备显示值Key(Y)*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.exp['Y_Key']}" required="true" requiredMessage="设备显示值Key(Y)#{msg.ValidationRequire}" />
                                </h:panelGroup>
                                <h:panelGroup  >
                                    <label class="label">仪表显示值Key(Z)*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.exp['Z_Key']}" required="true" requiredMessage="仪表显示值Key(Z)#{msg.ValidationRequire}" />
                                </h:panelGroup>
                                <h:panelGroup >
                                    <label class="label">偏差上限范围</label>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['deltaMaxPercent']}" symbol="%" symbolPosition="s" minValue="0"/>
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">偏差下限范围</label>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['deltaMinPercent']}" symbol="%" symbolPosition="s" maxValue="0"/>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <label class="label">误差上限范围</label>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['MuMaxPercent']}" symbol="%" symbolPosition="s" minValue="0"/>
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">误差下限范围</label>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['MuMinPercent']}" symbol="%" symbolPosition="s" maxValue="0"/>
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">结果标识</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['resIdentify']}" >
                                        <f:selectItem itemLabel="合格/不合格" itemValue="#{'resIdentify_1'}"/>
                                        <f:selectItem itemLabel="合格/误差超限/偏差超限" itemValue="#{'resIdentify_3'}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup> 

                            </p:panelGrid>
                        </p:fieldset>
                        <p:fieldset legend="偏差校验"  rendered="#{'DeltaRule' eq tableCreateController.editTableItem.exp['rule']}" >
                            <p class="label">合格: |Y-Z|≤最大偏差 </p>
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup  >
                                    <label class="label">计算结果Key*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.resKey}" required="true" requiredMessage="计算结果Key#{msg.ValidationRequire}" />
                                </h:panelGroup> 
                                <h:panelGroup  >
                                    <label class="label">设备显示值Key(Y)*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.exp['Y_Key']}" required="true" requiredMessage="设备显示值Key(Y)#{msg.ValidationRequire}" />
                                </h:panelGroup>
                                <h:panelGroup  >
                                    <label class="label">仪表显示值Key(Z)*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.exp['Z_Key']}" required="true" requiredMessage="仪表显示值Key(Z)#{msg.ValidationRequire}" />
                                </h:panelGroup>
                                <h:panelGroup >
                                    <label class="label">最大偏差</label>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['deltaMax']}"  minValue="0"/>
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">结果标识</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['resIdentify']}" >
                                        <f:selectItem itemLabel="合格/不合格" itemValue="#{'resIdentify_1'}"/>
                                        <f:selectItem itemLabel="合格/误差超限/偏差超限" itemValue="#{'resIdentify_3'}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup> 

                            </p:panelGrid>
                        </p:fieldset>
                    </h:panelGroup>

                    <h:panelGroup id="optionsTable"  >
                        <p:dataTable value="#{tableCreateController.editTableItem.options}" var="optionItem" rendered="#{tableCreateController.editTableItem.component eq 'Select'}" emptyMessage="#{msg.noRecordFound}" >

                            <f:facet name="header">
                                <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}"  actionListener="#{tableCreateController.prepareAddOption()}" process="@this" update=":editOptionDialogForm" oncomplete="PF('editOptionDialog').show()" />
                            </f:facet>
                            <p:column headerText="选项标识" >
                                <h:outputText value="#{optionItem.key}"/>
                            </p:column>
                            <p:column headerText="选项显示值" >
                                <h:outputText value="#{optionItem.value}"/>
                            </p:column>
                            <p:column headerText="操作" width="64" >
                                <p:commandLink actionListener="#{tableCreateController.prepareEditOption(optionItem)}" process="@this" update=":editOptionDialogForm" oncomplete="PF('editOptionDialog').show()" rendered="#{not empty optionItem.key}"><span class="ui-icon ui-icon-pencil" /></p:commandLink>
                                <p:commandLink actionListener="#{tableCreateController.removeOption(optionItem)}" process="@this" update=":editItemDialogForm:optionsTable" rendered="#{not empty optionItem.key}"><span class="ui-icon ui-icon-trash" /></p:commandLink>
                            </p:column>
                        </p:dataTable>

                    </h:panelGroup>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{tableCreateController.editItem()}" value="#{msg.Confirm}" update=":CreateTemplateForm :editItemDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'editItemDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{tableCreateController.cancel()}" icon="ui-icon-cancel" onclick="PF('editItemDialog').hide()" update=":CreateTemplateForm :growl"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <p:dialog id="editOptionDialog" widgetVar="editOptionDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="编辑选项">
            <h:form id="editOptionDialogForm" >
                <h:panelGroup id="display" rendered="#{not empty tableCreateController.selectedOption}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">#{msg.key}</label>
                            <p:inputText value="#{tableCreateController.selectedOption.key}" required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.value}</label>
                            <p:inputText value="#{tableCreateController.selectedOption.value}" required="true" requiredMessage="#{msg.value}#{msg.ValidationRequire}" />
                        </h:panelGroup>

                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{tableCreateController.saveOption()}" value="#{msg.Confirm}" update=":editItemDialogForm:optionsTable :editOptionDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'editOptionDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}"  icon="ui-icon-cancel" onclick="PF('editOptionDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <p:dialog id="PmOrderPreviewDlg" widgetVar="PmOrderPreviewDlg" height="500" width="400" modal="true" resizable="false" draggable="true" appendTo="@(body)" header="预览">
            <h:form id="PmOrderPreviewForm" >
                <iframe src="/wx/form/preview/"  width="100%"  height="490"/>
            </h:form>

        </p:dialog>
        <p:dialog id="uploadDialog" widgetVar="uploadDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="上传模版文件">
            <h:form id="uploadDialogForm" >
                <h:panelGroup id="display" >
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <h:outputText   value="#{tableCreateController.uploadedFile.fileName}"  rendered="#{not empty tableCreateController.uploadedFile}"/>
                            <p:fileUpload  fileUploadListener="#{tableCreateController.uploadDataFile}" value="#{tableCreateController.uploadedFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                           multiple="false" sizeLimit="10000000" update=":uploadDialogForm" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(xls|xlsx)$/" label="#{msg.Add}" rendered="#{empty tableCreateController.uploadedFile}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <p>说明</p>
                            <p>上传文件进行导入</p>
                        </h:panelGroup>
                    </p:panelGrid>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{tableCreateController.finishUpload()}" disabled="#{empty tableCreateController.uploadedFile}" value="#{msg.Confirm}" 
                                         update=":CreateTemplateForm:tabView:importExcel :uploadDialogForm :growl :CreateTemplateForm:tabView:pageTitle1 :CreateTemplateForm:tabView:pageTitle2 :CreateTemplateForm:tabView:pageTitle3 :CreateTemplateForm:tabView:preview" icon="ui-icon-check" oncomplete="handleSubmit(args, 'uploadDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{tableCreateController.cancelUpload()}" icon="ui-icon-cancel" onclick="PF('rateDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <script>
            function preparePreview() {
                var $jasonText;
                $jasonText = $("#CreateTemplateForm\\:tabView\\:jsonStringText")[0];
                if ('localStorage' in window) {
                    localStorage.setItem("hc-apm-form-preview", $jasonText.innerText || ''); // # for test/dev perpose
                    localStorage.setItem("hc-apm-token-expireAt", Date.now() + 8640000)
                }

            }

        </script>
    </ui:define>


</ui:composition>
