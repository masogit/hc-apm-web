<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:tie="http://tiefaces.org/tiefaces"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.CreateTemplate}"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="CreateTemplateForm">
                    <p:tabView  id="tabView">
                        <p:tab title="#{msg.TemplateEdit}">

                            <div class="ui-g-12 card cardTitle">
                                <p:inputText id="pageTitle1" class="pageTitle" value="#{tableCreateController.table.title}" >
                                    <p:ajax update=":CreateTemplateForm:tabView:pageTitle2 :CreateTemplateForm:tabView:pageTitle3"  listener="#{tableCreateController.onTitleChange}"/>
                                </p:inputText>
                            </div>
                            <c:forEach  items="#{tableCreateController.table.groups}" var="groupItem" varStatus="groupIndex">
                                <p:fieldset  legend="#{groupItem.title}" >
                                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                        <c:forEach  items="#{groupItem.items}" var="fieldItem">

                                            <h:panelGroup>
                                                <label class="label">#{fieldItem.label}</label>
                                                <c:if test="#{empty fieldItem.component or fieldItem.component eq 'Text'}" >
                                                    <p:inputText value="#{tableCreateController.tableValue[fieldItem.key]}" placeholder="#{fieldItem.ref}"/>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'Number'}" >
                                                    <p:inputNumber value="#{tableCreateController.tableValue[fieldItem.key]}" placeholder="#{fieldItem.ref}" decimalPlaces="#{fieldItem.decimalLength}" />
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'Select'}" >
                                                    <p:selectOneMenu value="#{tableCreateController.tableValue[fieldItem.key]}">
                                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                                        <f:selectItems value="#{fieldItem.options}" var="option" itemLabel="#{option.value}" itemValue="#{option.key}"/>
                                                    </p:selectOneMenu>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'Switch'}" >
                                                    <p:selectBooleanButton onLabel="#{msg.True2Yes}" offLabel="#{msg.False2No}"  value="#{tableCreateController.tableValue[fieldItem.key]}"/>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'TextArea'}" >
                                                    <p:inputTextarea value="#{tableCreateController.tableValue[fieldItem.key]}"  placeholder="#{fieldItem.ref}"/>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'Date'}" >
                                                    <p:calendar value="#{tableCreateController.tableValue[fieldItem.key]}"  placeholder="#{fieldItem.ref}"/>
                                                </c:if>
                                                <c:if test="#{fieldItem.component eq 'Label'}" >
                                                    <h:outputText value="#{tableCreateController.tableValue[fieldItem.resKey]}"  />
                                                </c:if>
                                                <br/>
                                                <p:commandLink actionListener="#{tableCreateController.prepareEditItem(groupItem,fieldItem)}" value="#{msg.Update}" update=":editItemDialogForm" oncomplete="PF('editItemDialog').show()"/>
                                                <p:commandLink actionListener="#{tableCreateController.moveItem(groupItem,fieldItem,'up')}" value="#{msg.ShiftUp}"  update=":CreateTemplateForm"   disabled="#{tableCreateController.isReadOnly}"/>
                                                <p:commandLink actionListener="#{tableCreateController.moveItem(groupItem,fieldItem,'down')}" value="#{msg.ShiftDown}"  update=":CreateTemplateForm"  disabled="#{tableCreateController.isReadOnly}"/>
                                                <p:commandLink actionListener="#{tableCreateController.removeItem(groupItem,fieldItem)}" value="#{msg.Delete}"  update=":CreateTemplateForm"  disabled="#{tableCreateController.isReadOnly}"/>
                                            </h:panelGroup>
                                        </c:forEach>
                                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                            <h:panelGroup>
                                                <p:commandLink actionListener="#{tableCreateController.prepareAddItem(groupItem)}" value="#{msg.Add}"  update=":editItemDialogForm" oncomplete="PF('editItemDialog').show()" process="@this" disabled="#{tableCreateController.isReadOnly}"/>
                                            </h:panelGroup>
                                        </p:panelGrid>
                                    </p:panelGrid>

                                    <h:panelGroup style="float:right">
                                        <p:commandLink  actionListener="#{tableCreateController.prepareEditGroup(groupItem)}" value="#{msg.Update}"  update=":editGroupDialogForm" oncomplete="PF('editGroupDialog').show()" disabled="#{tableCreateController.isReadOnly}"/>
                                        <p:commandLink  actionListener="#{tableCreateController.moveGroup(groupItem,'up')}" value="#{msg.ShiftUp}"  update=":CreateTemplateForm" disabled="#{tableCreateController.isReadOnly}"/>
                                        <p:commandLink  actionListener="#{tableCreateController.moveGroup(groupItem,'down')}" value="#{msg.ShiftDown}"  update=":CreateTemplateForm" disabled="#{tableCreateController.isReadOnly}"/>
                                        <p:commandLink  actionListener="#{tableCreateController.removeGroup(groupItem)}" value="#{msg.Delete}"  update=":CreateTemplateForm" disabled="#{tableCreateController.isReadOnly}"/>
                                    </h:panelGroup>
                                </p:fieldset>


                            </c:forEach>
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                                <h:panelGroup>

                                    <p:commandLink process="@this" actionListener="#{tableCreateController.prepareAddGroup}" value="#{msg.AddGroup}"  update=":editGroupDialogForm" oncomplete="PF('editGroupDialog').show()" disabled="#{tableCreateController.isReadOnly}"/>
                                    <br/>
                                    <p:commandLink immediate="true" value="#{msg.MobilePreview}" onclick="preparePreview();"  oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                                    <br />
                                    <p:commandLink value="#{msg.DownloadTemplate}" actionListener="#{tableCreateController.generateExcelTemplateFile()}" ajax="false" rendered="#{not empty tableCreateController.table.title}">
                                        <p:fileDownload value="#{tableCreateController.exportedFile}"/>
                                    </p:commandLink>
                                </h:panelGroup>
                            </p:panelGrid>



                        </p:tab>
                        <p:tab title="#{msg.TextView}">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup >
                                    <label class="label">#{msg.name}</label>
                                    <p:inputText id="pageTitle2" value="#{tableCreateController.table.title}" readonly="true"/>
                                </h:panelGroup>
                                <h:panelGroup id="jsonString">
                                    <label class="label">#{msg.jsonString}</label>
                                    <p:inputTextarea id="jsonStringText"  value="#{tableCreateController.tableString}" cols="100"  readonly="#{!tableCreateController.isStringEditable}" />
                                    <p:commandButton  value="#{msg.modify}" actionListener="#{tableCreateController.onStringEdit()}" process="jsonString" update="jsonString :growl" rendered="#{!tableCreateController.isStringEditable}" disabled="#{tableCreateController.isReadOnly}"/>
                                    <p:commandButton  value="#{msg.Save}" actionListener="#{tableCreateController.onStringSave()}" process="jsonString" update=":CreateTemplateForm jsonString :growl" rendered="#{tableCreateController.isStringEditable}" disabled="#{tableCreateController.isReadOnly}"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="#{msg.ViewExcel}">
                            <div class="ui-g-12 card cardTitle">
                                <p:inputText id="pageTitle3" class="pageTitle" value="#{tableCreateController.table.title}" >
                                    <p:ajax update=":CreateTemplateForm:tabView:pageTitle2 :CreateTemplateForm:tabView:pageTitle1"  listener="#{tableCreateController.onTitleChange}"/>
                                </p:inputText>
                            </div>
                            <h:panelGroup id="importExcel">
                                <p:commandButton value="#{msg.ImportTemplate}"  process="@this" update="importExcel" oncomplete="PF('uploadDialog').show()" rendered="#{empty tableCreateController.selectedTableDefinition.excelStorageId}" disabled="#{tableCreateController.isReadOnly}"/>
                                <h:outputText value="#{tableCreateController.uploadedFile.fileName}" />
                                <p:link href="#{fileDownloadService.getFileUrl(tableCreateController.selectedTableDefinition.excelStorageId)}" rendered="#{not empty tableCreateController.selectedTableDefinition.excelStorageId and empty tableCreateController.uploadedFile}">#{tableCreateController.selectedTableDefinition.name}</p:link>
                                <p:commandButton icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" process="@this" actionListener="#{tableCreateController.removeExcelTemplate}" update="importExcel :uploadDialogForm preview" rendered="#{not empty tableCreateController.selectedTableDefinition.excelStorageId}" disabled="#{tableCreateController.isReadOnly}"/>
                            </h:panelGroup>
                            <p:fieldset legend="#{msg.preview}" id="preview">
                                <tie:websheet id="sheet1" webSheetBean="#{tableCreateController}"  maxRowsPerPage="30" rendered="#{not empty tableCreateController.uploadedFile or not empty tableCreateController.selectedTableDefinition.excelStorageId}" showLineNumber="false" />
                                <p:panel rendered="#{not empty tableCreateController.uploadedFile or not empty tableCreateController.selectedTableDefinition.excelStorageId }">
                                    <p:commandButton value="#{msg.Test}"  update="preview" actionListener="#{tableCreateController.testSubmit()}" />
                                    <h:outputText value="#{tableCreateController.tableFields}" />
                                </p:panel>
                            </p:fieldset>
                        </p:tab>
                        <p:tab title="#{msg.InstrumentDataImportConfiguration}">
                            <div class="ui-g-12 card">
                            </div>
                            <h:panelGrid columns="6" id="instrumentDataImportConfig">
                                <label class="label">#{msg.TemplateLabel}</label>
                                <p:selectOneMenu value="#{tableCreateController.templateLabel}" id="idTemplateLabel">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                    <f:selectItems value="#{tableCreateController.templateLabels}" var="item" itemLabel="#{item}" itemValue="#{item}" />
                                </p:selectOneMenu>
                                <label class="label">#{msg.InstrumentDataField}</label>
                                <p:selectOneMenu value="#{tableCreateController.instrumentDataLabel}" id="idInstrumentLabel">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                    <f:selectItems value="#{tableCreateController.instrumentDataLabels}" var="item" itemLabel="#{item}" itemValue="#{item}" />
                                </p:selectOneMenu>
                                <p:commandButton value="#{msg.BindKeyValuePairs}" update="idInstrumentDataBind" actionListener="#{tableCreateController.bindInstrumentData()}" />
                            </h:panelGrid>
                            <p:panelGrid id="idInstrumentDataBind" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            	<h:panelGroup>
                            		<p:pickList value="#{tableCreateController.listInstrumentMppingLabels}" var="item" itemLabel="#{item}" itemValue="#{item}" style="width:auto;" escape="false">
	                                    <f:facet name="sourceCaption">#{msg.KeyValuePairsToBeBound}</f:facet>
	                                    <f:facet name="targetCaption">#{msg.KeyValuePairsBound}</f:facet>
										                  <p:column style="float: left;width:100%;text-align:left;">
											                  <h:outputText value="#{item}" />
										                  </p:column>
									              </p:pickList>
                            	</h:panelGroup>
                            </p:panelGrid>
                        </p:tab>
                    </p:tabView>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                        <h:panelGroup>
                            <label class="label">#{msg.hospitalId}</label>
                            <p:selectOneMenu id="hospitalIdSelect_list" value="#{tableCreateController.selectedOrg}"  autoWidth="false" converter="orgInfoConverter" style="max-width: 150px;"  disabled="#{tableCreateController.selectedTableDefinition.status ne 'Draft' or tableCreateController.isReadOnly}">
                                <p:ajax  listener="#{tableCreateController.onSiteChange}" process="@this"/>
                                <f:selectItems value="#{tableCreateController.selectedOrgList}" var="item" itemLabel="#{item.name}" itemValue="#{item}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.Remark}</label>
                            <p:inputTextarea value="#{tableCreateController.selectedTableDefinition.description}" cols="50"  readonly="#{tableCreateController.isReadOnly}"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.assetGroup}</label>
                            <p:selectOneMenu id="assetGroup" value="#{tableCreateController.selectedTableDefinition.assetGroup}" disabled="#{tableCreateController.isReadOnly}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <!--<h:panelGroup>
                            <label class="label">模块类型*</label>
                            <p:selectOneMenu id="type" value="#{tableCreateController.selectedTableDefinition.type}" disabled="#{tableCreateController.isReadOnly}"
                                             required="true" requiredMessage="模块类型#{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('reportType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>-->

                    </p:panelGrid>
                    <h:panelGroup>
                        <!--<p:commandButton icon="ui-icon-remove-red-eye" immediate="true" value="手机预览" onclick="preparePreview();"  oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>-->
                        <p:commandButton icon="ui-icon-check" actionListener="#{tableCreateController.saveTemplate}" value="#{msg.Save}" style="float:left" validateClient="true" update=":CreateTemplateForm :growl" disabled="#{tableCreateController.isReadOnly}"/>
                        <!--<p:remoteCommand name="saveExcel" actionListener="#{excelTableCreateController.saveTemplate}" update=":CreateTemplateForm :growl" />-->
                        <p:commandButton value="#{msg.Return}"  icon="ui-icon-arrow-back" action="schemaList.xhtml?faces-redirect=true" immediate="true"  update=":growl" style="float:left"/>
                    </h:panelGroup>
                </h:form>

            </div>

        </div>
        <p:dialog id="editGroupDialog" widgetVar="editGroupDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.EditGroup}">
            <h:form id="editGroupDialogForm" >
                <h:panelGroup id="display" rendered="#{not empty tableCreateController.editGroup}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">#{msg.name}</label>
                            <p:inputText value="#{tableCreateController.editGroup.title}" required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}" />
                        </h:panelGroup>

                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{tableCreateController.editGroup()}" value="#{msg.Confirm}" update=":CreateTemplateForm :editGroupDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'editGroupDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('editGroupDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <p:dialog id="editItemDialog" widgetVar="editItemDialog" modal="true" width="800" height="450"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.FieldEdit}">
            <h:form id="editItemDialogForm" >
                <h:panelGroup id="display" rendered="#{not empty tableCreateController.editTableItem}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">#{msg.fieldLabel}</label>
                            <p:inputText value="#{tableCreateController.editTableItem.label}" required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.fieldType}</label>
                            <p:selectOneMenu value="#{tableCreateController.editTableItem.component}">
                                <p:ajax  listener="#{tableCreateController.onOptionChange}"  update="optionsTable ruleSelect advanceSetting"  />
                                <f:selectItem itemLabel="#{msg.ComponentTypeInputText}" itemValue="#{'Text'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeNumber}" itemValue="#{'Number'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeSwitch}" itemValue="#{'Switch'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeSelect}" itemValue="#{'Select'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeTextArea}" itemValue="#{'TextArea'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeDate}" itemValue="#{'Date'}"/>
                                <f:selectItem itemLabel="#{msg.ResultOutput}" itemValue="#{'Label'}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.fieldKey}</label>
                            <p:inputText value="#{tableCreateController.editTableItem.key}" required="true"   requiredMessage="#{msg.fieldKey}#{msg.ValidationRequire}" >
                                <!--<f:validateRegex pattern="[A-Za-z0-9_]+"   />-->
                                <p:ajax process="@this" listener="#{tableCreateController.fieldKeyChange}" update="@this :growl" />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.FieldDescription}</label>
                            <p:inputText value="#{tableCreateController.editTableItem.ref}" />
                        </h:panelGroup>
                        <h:panelGroup id="ruleSelect">
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup >
                            <label class="label">#{msg.CalculationRule}</label>
                            <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['rule']}" >
                                <p:ajax listener="#{tableCreateController.onRuleChange}" update="advanceSetting"  />
                                <f:selectItem itemLabel="#{msg.None}"  />
                                <f:selectItem itemLabel="#{msg.UpperAndLowerLimits}" itemValue="#{'RangeRule'}" itemDisabled="#{tableCreateController.editTableItem.component ne 'Number'}"/>
                                <f:selectItem itemLabel="#{msg.UpperAndLowerRangeLimits}" itemValue="#{'ScopeRule'}" itemDisabled="#{tableCreateController.editTableItem.component ne 'Number'}"/>
                                <f:selectItem itemLabel="#{msg.SetValueVerification}" itemValue="#{'VerifyRule'}" itemDisabled="#{tableCreateController.editTableItem.component ne 'Label'}"/>
                                <f:selectItem itemLabel="#{msg.DeviationVerification}" itemValue="#{'DeltaRule'}" itemDisabled="#{tableCreateController.editTableItem.component ne 'Label'}"/>
                            </p:selectOneMenu>
                            </h:panelGroup >
                            <h:panelGroup  rendered="#{tableCreateController.editTableItem.component eq 'Number'}">
                                <label class="label">#{msg.DecimalPlaces}</label>
                                <p:spinner value="#{tableCreateController.editTableItem.decimalLength}" max="4"  min="0"/>
                            </h:panelGroup>
                            </p:panelGrid>
                        </h:panelGroup>

                    </p:panelGrid>
                    <h:panelGroup id="advanceSetting">
                        <p:fieldset legend="#{msg.UpperAndLowerLimitSettings}"  rendered="#{'RangeRule' eq tableCreateController.editTableItem.exp['rule']}" >
                            <h:outputText id="RangeRuleComments" value="#{msg.NormalLowerLimit}#{tableCreateController.editTableItem.exp['minCompare'] eq 'GT'? '&lt;':'≤'}#{msg.Measurement}#{tableCreateController.editTableItem.exp['maxCompare'] eq 'LT'? '&lt;':'≤'}#{msg.UpperLimit}" />
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup  >
                                    <label class="label ">#{msg.CalculationKey}*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.resKey}" required="true" requiredMessage="#{msg.CalculationKey}#{msg.ValidationRequire}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">#{msg.UpperLimit}</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['maxCompare']}" >
                                        <p:ajax update="RangeRuleComments" process="@this"/>
                                        <f:selectItem itemLabel="#{msg.LessThanOrEqualTo}" itemValue="#{'LE'}"/>
                                        <f:selectItem itemLabel="#{msg.LessThan}" itemValue="#{'LT'}"/>
                                    </p:selectOneMenu>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['max']}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">#{msg.LowerLimit}</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['minCompare']}" >
                                        <p:ajax update="RangeRuleComments" process="@this"/>
                                        <f:selectItem itemLabel="#{msg.GreaterThanOrEqualTo}" itemValue="#{'GE'}"/>
                                        <f:selectItem itemLabel="#{msg.GreaterThan}" itemValue="#{'GT'}"/>
                                    </p:selectOneMenu>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['min']}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">#{msg.ResultIdentifier}</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['resIdentify']}" >
                                        <f:selectItem itemLabel="#{msg.NormalOrAbnormal}" itemValue="#{'resIdentify_1'}"/>
                                        <f:selectItem itemLabel="#{msg.NormalOrTooHighOrTooLow}" itemValue="#{'resIdentify_2'}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup> 

                            </p:panelGrid>
                        </p:fieldset>
                        <p:fieldset legend="#{msg.UpperAndLowerRangeLimits}"  rendered="#{'ScopeRule' eq tableCreateController.editTableItem.exp['rule']}" >
                            <h:outputText id="ScopeRuleComments" value="#{msg.NormalLowerLimitRange}*#{msg.StandardValue}#{tableCreateController.editTableItem.exp['minCompare'] eq 'GT'? '&lt;':'≤'}#{msg.Measurement}#{tableCreateController.editTableItem.exp['maxCompare'] eq 'LT'? '&lt;':'≤'}#{msg.UpperLimitRangeStandardValue}" />
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup  >
                                    <label class="label">#{msg.CalculationKey}*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.resKey}" required="true" requiredMessage="#{msg.CalculationKey}#{msg.ValidationRequire}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">#{msg.StandardValue}</label>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['norm']}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">#{msg.UpperLimitRange}</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['maxCompare']}" >
                                        <p:ajax update="ScopeRuleComments" process="@this"/>
                                        <f:selectItem itemLabel="#{msg.LessThanOrEqualTo}" itemValue="#{'LE'}"/>
                                        <f:selectItem itemLabel="#{msg.LessThan}" itemValue="#{'LT'}"/>
                                    </p:selectOneMenu>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['max']}" minValue="0" />#{msg.Or}
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['maxPercent']}" symbol="%" symbolPosition="s" minValue="0"/>
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">#{msg.LowerLimitRange}</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['minCompare']}" >
                                        <p:ajax update="ScopeRuleComments" process="@this"/>
                                        <f:selectItem itemLabel="#{msg.GreaterThanOrEqualTo}" itemValue="#{'GE'}"/>
                                        <f:selectItem itemLabel="#{msg.GreaterThanOrEqualTo}" itemValue="#{'GT'}"/>
                                    </p:selectOneMenu>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['min']}" maxValue="0" />#{msg.Or}
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['minPercent']}" symbol="%" symbolPosition="s" maxValue="0"/>
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">#{msg.ResultIdentifier}</label>
                                    <p:selectOneMenu  value="#{tableCreateController.editTableItem.exp['resIdentify']}" >
                                        <f:selectItem itemLabel="#{msg.NormalOrAbnormal}" itemValue="#{'resIdentify_1'}"/>
                                        <f:selectItem itemLabel="#{msg.NormalOrTooHighOrTooLow}" itemValue="#{'resIdentify_2'}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup> 

                            </p:panelGrid>
                        </p:fieldset>
                        <p:fieldset legend="#{msg.SetValueVerification}"  rendered="#{'VerifyRule' eq tableCreateController.editTableItem.exp['rule']}" >
                            <p class="label"> #{msg.ConfirmRangeNor}</p>
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup  >
                                    <label class="label">#{msg.CalculationKey}*</label>
                                    <p:inputText   value="#{tableCreateController.editTableItem.resKey}" required="true" requiredMessage="#{msg.CalculationKey}#{msg.ValidationRequire}" />
                                </h:panelGroup> 
                                <h:panelGroup >
                                    <label class="label">#{msg.SetValueX}*</label>
                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['norm']}" required="true" requiredMessage="#{msg.SetValueX}#{msg.ValidationRequire}" />
                                </h:panelGroup>
                                <!--                                <h:panelGroup >
                                                                    <label class="label">量程(FS)*</label>
                                                                    <p:inputNumber   value="#{tableCreateController.editTableItem.exp['FS']}" required="true" requiredMessage="量程(FS)#{msg.ValidationRequire}" />
                                                                </h:panelGroup>-->
                                <h:panelGroup  >

                        <h:panelGroup >
                            <label class="label">#{msg.value}</label>

                    <br/>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{tableCreateController.saveOption()}" value="#{msg.Confirm}" update=":editItemDialogForm:optionsTable :editOptionDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'editOptionDialog');"/>

                </h:panelGroup>

                <h:panelGroup id="display" >
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <h:outputText   value="#{tableCreateController.uploadedFile.fileName}"  rendered="#{not empty tableCreateController.uploadedFile}"/>
                            <p:fileUpload  fileUploadListener="#{tableCreateController.uploadDataFile}" value="#{tableCreateController.uploadedFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                           multiple="false" sizeLimit="10000000" update=":uploadDialogForm" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(xls|xlsx)$/" label="#{msg.Add}" rendered="#{empty tableCreateController.uploadedFile}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <p>#{msg.Description}</p>
                            <p>#{msg.UpFileImport}</p>

                    <h:panelGroup>

                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{tableCreateController.cancelUpload()}" icon="ui-icon-cancel" onclick="PF('uploadDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
