<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:tie="http://tiefaces.org/tiefaces"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="创建模版"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="importExcelForm">
                    <h:panelGroup >
                        <p:commandButton value="导入模版"  process="@this" update=":importExcelForm" oncomplete="PF('uploadDialog').show()" rendered="#{empty excelTableCreateController.uploadedFile}"/>
                        <h:outputText value="#{excelTableCreateController.uploadedFile.fileName}" />
                        <p:commandButton icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{excelTableCreateController.cancelUpload}" update=":importExcelForm :uploadDialogForm :previewForm" rendered="#{not empty excelTableCreateController.uploadedFile}"/>
                        <p:link href="#{fileDownloadService.getFileUrl(excelTableCreateController.selectedTableDefinition.schema)}" rendered="#{not empty excelTableCreateController.savedFile and empty excelTableCreateController.uploadedFile}">#{excelTableCreateController.savedFile.name}</p:link>
                    </h:panelGroup>
                </h:form>

                <p:fieldset legend="预览">
                    <h:form id="previewForm">
                        <tie:websheet id="sheet1" webSheetBean="#{excelTableCreateController}"  maxRowsPerPage="30" rendered="#{not empty excelTableCreateController.uploadedFile or not empty excelTableCreateController.savedFile}"/>
                        <p:panel rendered="#{not empty excelTableCreateController.uploadedFile or not empty excelTableCreateController.savedFile}">
                            <p:commandButton value="测试"  update="previewForm" actionListener="#{excelTableCreateController.testSubmit()}" />
                            <h:outputText value="#{excelTableCreateController.tableFields}" />
                        </p:panel>
                    </h:form>
                </p:fieldset>
                
                <p:fieldset legend="模版">
                    <h:form id="createTableForm">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                            <h:panelGroup>
                                <label class="label">模版名称</label>
                                <p:inputText value="#{excelTableCreateController.selectedTableDefinition.name}"/>
                            </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.assetGroup}</label>
                            <p:selectOneMenu id="assetGroup" value="#{excelTableCreateController.selectedTableDefinition.assetGroup}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                             
                        <h:panelGroup >
                            <label class="label">备注</label>
                            <p:inputTextarea value="#{excelTableCreateController.selectedTableDefinition.description}" cols="50"  />
                        </h:panelGroup>

                    </p:panelGrid>
                    <h:panelGroup>
                        <p:commandButton icon="ui-icon-check" actionListener="#{excelTableCreateController.saveTemplate}" value="保存" style="float:left" validateClient="true" update=":createTableForm :growl"/>
                        <p:commandButton value="#{msg.Return}"  icon="ui-icon-arrow-back" action="schemaList.xhtml?faces-redirect=true" immediate="true"  update=":growl" style="float:left"/>
                    </h:panelGroup>
                    </h:form>
                </p:fieldset>
                
               
            </div>
        </div>

        <p:dialog id="uploadDialog" widgetVar="uploadDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="上传模版文件">
            <h:form id="uploadDialogForm" >
                <h:panelGroup id="display" >
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <h:outputText   value="#{excelTableCreateController.uploadedFile.fileName}"  rendered="#{not empty excelTableCreateController.uploadedFile}"/>
                            <p:fileUpload  fileUploadListener="#{excelTableCreateController.uploadDataFile}" value="#{excelTableCreateController.uploadedFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                           multiple="false" sizeLimit="10000000" update=":uploadDialogForm" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(xls|xlsx)$/" label="#{msg.Add}" rendered="#{empty excelTableCreateController.uploadedFile}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <p>说明</p>
                            <p>上传文件进行导入</p>
                        </h:panelGroup>
                    </p:panelGrid>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{excelTableCreateController.finishUpload()}" disabled="#{empty excelTableCreateController.uploadedFile}" value="#{msg.Confirm}" update=":importExcelForm :uploadDialogForm :createTableForm :previewForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'uploadDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{excelTableCreateController.cancelUpload()}" icon="ui-icon-cancel" onclick="PF('rateDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:define>


</ui:composition>
