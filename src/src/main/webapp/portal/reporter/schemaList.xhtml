<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="报告模版管理"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="SchemaListForm">
                    <p:dataTable id="datalist" value="#{tableDefinitionController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{tableDefinitionController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,40,60,90">

                        <p:ajax event="rowSelect" listener="#{tableDefinitionController.onSchemaSelected}" update="createButton deleteButton editButton"/>
                        <p:ajax event="filter" listener="#{tableDefinitionController.onFilter}" update="createButton deleteButton editButton" />
                        <p:column headerText="#{msg.Name}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="说明" >
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <p:column headerText="状态" >
                            <h:outputText value="未启用"  rendered="#{empty item.status or item.status eq 'Draft'}"/>
                            <h:outputText value="已发布"  rendered="#{item.status eq 'Released'}"/>
                        </p:column>
                        <p:column headerText="" exportable="false">
                            <p:commandButton icon="ui-icon-play-arrow" style="zoom:0.7" title="#{msg.setToUsing}" actionListener="#{tableDefinitionController.setToUsing(item.id,false)}" update=":SchemaListForm:datalist"  rendered="#{empty item.status or item.status eq 'Draft'}" disabled="#{tableDefinitionController.getIsReadOnly(item)}"/>
                            <p:commandButton icon="ui-icon-close" style="zoom:0.7" title="停止使用" actionListener="#{tableDefinitionController.setToUsing(item.id,true)}" update=":SchemaListForm:datalist"  rendered="#{item.status eq 'Released'}" disabled="#{tableDefinitionController.getIsReadOnly(item)}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" action="createTable.xhtml?faces-redirect=true" />
                            <!--<p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}"  oncomplete="PF('createDialog').show()"/>-->
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" action="#{tableDefinitionController.getEditUrl()}"  disabled="#{empty tableDefinitionController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{tableDefinitionController.deleteTemplate}" update="datalist, :growl" disabled="#{empty tableDefinitionController.selected or tableDefinitionController.getIsReadOnly(tableDefinitionController.selected)}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                            
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="AssetContract_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
        <p:dialog id="createDialog" widgetVar="createDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="选择类型">
            <h:form id="createForm" >
                <h:panelGroup id="display" >
                    <!--action="createTable.xhtml?faces-redirect=true"-->
                    <label class="label">类型</label>
                                <p:selectOneRadio id="type" value="#{tableDefinitionController.createType}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="JSON模版" itemValue="JSON"/>
                                    <f:selectItem itemLabel="Excel模版" itemValue="Excel"/>
                                </p:selectOneRadio>
                </h:panelGroup>
                <p:commandButton  value="确定" action="#{tableDefinitionController.getCreateUrl()}"/>
                <p:commandButton  immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('createDialog').hide()" />
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
