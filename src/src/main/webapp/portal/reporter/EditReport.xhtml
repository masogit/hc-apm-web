<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{editReportController.table.title}"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="EditReportForm">
                    <c:forEach  items="#{editReportController.table.groups}" var="groupItem">
                        <p:fieldset  legend="#{groupItem.title}" >
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <c:forEach  items="#{groupItem.items}" var="fieldItem">

                                    <c:if test="#{empty fieldItem.component or fieldItem.component eq 'Text'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:inputText value="#{editReportController.tableValue[fieldItem.key]}" placeholder="#{fieldItem.ref}"
                                                         valueChangeListener="#{editReportController.computeFormula}" update="@(.computeOutput)"/>
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Number'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:inputNumber value="#{editReportController.tableValue[fieldItem.key]}"
                                                          valueChangeListener="#{editReportController.computeFormula}" decimalPlaces="#{fieldItem.decimalLength}" placeholder="#{fieldItem.ref}">
                                                <p:ajax update="@this @(.computeOutput)" listener="#{editReportController.computeFormula}"  />
                                            </p:inputNumber>
                                            <p:outputLabel class="computeOutput" value="#{fieldMsg.fieldValue('TableReportResult',editReportController.tableValue[fieldItem.resKey])}" style="#{editReportController.tableValue[fieldItem.resKey] eq 'Normal'?'':'color:red'}" />
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Select'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:selectOneMenu value="#{editReportController.tableValue[fieldItem.key]}">
                                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                                <f:selectItems value="#{fieldItem.options}" var="option" itemLabel="#{option.value}" itemValue="#{option.key}"/>
                                            </p:selectOneMenu>
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Switch'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:selectBooleanButton onLabel="#{msg.True2Yes}" offLabel="#{msg.False2No}"  value="#{editReportController.tableValue[fieldItem.key]}"/>
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'TextArea'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:inputTextarea value="#{editReportController.tableValue[fieldItem.key]}" placeholder="#{fieldItem.ref}" />
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Date'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:calendar value="#{editReportController.tableValue[fieldItem.key]}" pattern="yyyy-MM-dd" converter="date2StringConverter" placeholder="#{fieldItem.ref}" />
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Label'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <h:outputText value="#{fieldMsg.fieldValue('TableReportResult',editReportController.tableValue[fieldItem.resKey])}" style="#{editReportController.tableValue[fieldItem.resKey] eq 'Normal'?'':'color:red'}" />
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Compute'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:outputLabel class="computeOutput" value="#{editReportController.tableValue[fieldItem.key]}"  />
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Picture'}" >
                                        <h:panelGroup id="picture_#{fieldItem.key}">
                                            <label class="label">#{fieldItem.label}</label>
                                            <h:panelGrid columns="1" style="width:100%" rendered="#{null != editReportController.tableValue[fieldItem.key] and not empty editReportController.tableValue[fieldItem.key]}">
                                                <p:graphicImage id="g_#{fieldItem.key}" value="#{fileDownloadService.getFile(editReportController.tableValue[fieldItem.key])}" height="80" width="100" stream="false"/>
                                                <p:commandButton actionListener="#{editReportController.removeAttachmentByIdAndKey(editReportController.tableValue[fieldItem.key], fieldItem.key)}" update="picture_#{fieldItem.key}" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                                </p:commandButton>
                                            </h:panelGrid>
                                            <p:fileUpload id="file_#{fieldItem.key}" allowTypes="/(\.|\/)(jpeg|jpg|png)$/" fileUploadListener="#{editReportController.handleFileUploadBefore}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false"  sizeLimit="10000000"  update="picture_#{fieldItem.key}" auto="true" invalidFileMessage="图片类型应该为png,jpeg,jpg" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>
                                        </h:panelGroup>
                                    </c:if>
                                </c:forEach>

                            </p:panelGrid>

                        </p:fieldset>

                    </c:forEach>


                    <p:commandButton actionListener="#{editReportController.save}" value="#{msg.save}" update=":EditReportForm"  disabled="#{editReportController.report.status eq 'Archived'}"/>
                    <c:if test="#{editReportController.maintainanceReport}">
                        <p:commandButton actionListener="#{editReportController.importElectricSafetyData}" value="#{msg.TesterDataImport}" update=":EditReportForm"  disabled="#{editReportController.hasElectricSafetyData==false}"/>
                    </c:if>
                    <!--<p:commandButton actionListener="#{editReportController.submit}" value="#{msg.submit}" update=":EditReportForm" disabled="#{editReportController.report.status eq 'Archived'}"/>-->
                </h:form>
            </div>

        </div>

    </ui:define>


</ui:composition>
