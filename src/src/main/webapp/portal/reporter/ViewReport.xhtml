<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{editReportController.table.title}"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form>
                    <c:forEach  items="#{editReportController.table.groups}" var="groupItem">
                        <p:fieldset  legend="#{groupItem.title}" >
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <c:forEach  items="#{groupItem.items}" var="fieldItem">

                                    <c:if test="#{empty fieldItem.component or fieldItem.component eq 'Text'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:inputText value="#{editReportController.tableValue[fieldItem.key]}" readonly="true" />
                                            <h:outputText value="#{editReportController.tableValue[fieldItem.resKey]}" />
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Number'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:inputNumber value="#{editReportController.tableValue[fieldItem.key]}" decimalPlaces="3" readonly="true" />
                                            <h:outputText value="#{fieldMsg.fieldValue('TableReportResult',editReportController.tableValue[fieldItem.resKey])}" />
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Select'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <h:outputText value="#{editReportController.getOptionValue(fieldItem)}" />
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Switch'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:selectBooleanButton onLabel="是" offLabel="否"  value="#{editReportController.tableValue[fieldItem.key]}"  />
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'TextArea'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <p:inputTextarea value="#{editReportController.tableValue[fieldItem.key]}"  readonly="true"/>
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Date'}" >
                                        <p:calendar value="#{editReportController.tableValue[fieldItem.key]}"  />
                                    </c:if>
                                    <c:if test="#{fieldItem.component eq 'Label'}" >
                                        <h:panelGroup>
                                            <label class="label">#{fieldItem.label}</label>
                                            <h:outputText value="#{fieldMsg.fieldValue('TableReportResult',editReportController.tableValue[fieldItem.resKey])}" style="#{editReportController.tableValue[fieldItem.resKey] eq 'Normal'?'':'color:red'}" />
                                        </h:panelGroup>
                                    </c:if>
                                </c:forEach>

                            </p:panelGrid>

                        </p:fieldset>

                    </c:forEach>

                </h:form>
            </div>

        </div>

    </ui:define>


</ui:composition>
