<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="iotDeviceBindEditDlg" widgetVar="iotDeviceBindEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.IotDeviceBind}" height="200" width="400">
            <h:form id="iotDeviceBindEditForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.name}*</label>
                        <p:inputText id="mark" value="#{iotDeviceBindController.selected.name}" disabled="true" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.selectAssetChoose}*</label>
                        <p:selectOneMenu value="#{iotDeviceBindController.assetUid}" filter="true" filterMatchMode="contains" required="true" requiredMessage="#{msg.Equipment} #{msg.ValidationRequire}" autoWidth="false" style="width: 95%;">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{iotDeviceBindController.assetList}" var="item" itemLabel="#{item.name} - #{item.departNum}" itemValue="#{item.uid}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{iotDeviceBindController.updateIotAsset()}" oncomplete="handleSubmit(args, 'iotDeviceBindEditDialog');" update=":growl @(.datalist)" icon="ui-icon-check"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('iotDeviceBindEditDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
