<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
    <p:dialog id="systemClientInfoEditDlg" widgetVar="systemClientInfoEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.SystemClientInfo}" height="400" width="450">
        <h:form id="systemClientInfoEditForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">#{msg.ClientName}*</label>
                    <p:inputText value="#{systemClientController.selected.clientName}" required="true" requiredMessage="#{msg.ClientName} #{msg.ValidationRequire}" autocomplete="off" style="width: 95%;"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.tenant}*</label>
                    <p:selectOneMenu value="#{systemClientController.selectTenant.uid}" filter="true" filterMatchMode="contains" required="true" requiredMessage="#{msg.tenant} #{msg.ValidationRequire}" autoWidth="false" style="width: 95%;">
                        <p:ajax event="change" listener="#{systemClientController.resetOrgTree}" update="orgSelect"/>
                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{systemClientController.tenantInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup id="orgSelect">
                    <label class="label">#{msg.BindOrgInfo}*</label>
                    <p:inputText id="btnOrg" value="#{systemClientController.selectSite.name}" readonly="true" style="width: 95%;"/>
                    <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false">
                        <p:scrollPanel style="height:300px;border: 0;min-width: 300px" mode="native">
                            <p:tree id="orgTree2" class="tree" style="width:98%;border:0;" value="#{systemClientController.tenantOrgTree}" selection="#{systemClientController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
                                <p:ajax process="@this" event="select" listener="#{systemClientController.onSelectSiteTreeNode}" update="systemClientInfoEditForm:orgSelect" oncomplete="PF('varPanelOrg').hide();"/>
                                <p:ajax process="@this" event="expand"/>
                                <p:ajax process="@this" event="collapse"/>
                                <p:treeNode type="org">
                                    <h:outputText value="#{node.name}"/>
                                </p:treeNode>
                                <p:treeNode type="hidden" rendered="false"/>
                            </p:tree>
                        </p:scrollPanel>
                    </p:overlayPanel>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.ClientType}*</label>
                    <p:selectOneMenu value="#{systemClientController.selected.clientType}" required="true" requiredMessage="#{msg.ClientType} #{msg.ValidationRequire}" autoWidth="false" style="width: 95%;">
                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{fieldMsg.getFieldValueList('clientType')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.password}<c:if test="#{null eq systemClientController.selected.uid}">*</c:if></label>
                    <p:password id="password" value="#{systemClientController.selected.plainPassword}"  autocomplete="new-password"
                        required="#{null eq systemClientController.selected.uid}" requiredMessage="#{msg.password} #{msg.ValidationRequire}" style="width: 95%;" />
                </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" actionListener="#{systemClientController.saveClientInfo()}" value="#{msg.Save}" update=":growl @(.datalist)" icon="ui-icon-check" oncomplete="handleSubmit(args, 'systemClientInfoEditDialog');"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('systemClientInfoEditDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
