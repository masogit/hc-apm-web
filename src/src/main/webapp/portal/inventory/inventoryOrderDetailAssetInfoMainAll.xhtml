<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
	<ui:define name="content">


		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="#{msg.InventoryDetails}" />
			</div>
            <h:panelGrid id="buttonSet" columns="12" cellpadding="5" rendered="true">
                <p:commandButton value="工单视图" rendered="#{userContextService.hasCurrentTenantName('')}"  action="#{inventoryOrderDetailAssetInfoAllController.changePage(true)}"/>
                <p:commandButton value="全院视图" rendered="#{userContextService.hasCurrentTenantName('')}" action="#{inventoryOrderDetailAssetInfoAllController.changePage(false)}" disabled="true"/>
            </h:panelGrid>
			<div class="ui-g-12 card ">
				<p:tabView id="inventoryOrderDetailAssetInfoTab" activeIndex="0" dynamic="true" cache="true">
					<p:ajax event="tabChange"/>
					<p:tab title="#{msg.WholeHospitalView}" id="tab4">
						<ui:include src="inventoryOrderDetailAssetInfoAll.xhtml" />
					</p:tab>
					<p:tab title="#{msg.NoWorkOrder}" id="tab5">
						<ui:include src="inventoryOrderDetailAssetInfoNoWorkOrder.xhtml" />
					</p:tab>
					<p:tab title="#{msg.NonInventory}" id="tab0">
						<ui:include src="inventoryOrderDetailAssetInfo.xhtml" />
					</p:tab>
					<p:tab title="#{msg.Inventorized}" id="tab1">
						<ui:include src="inventoryOrderDetailAssetInfo2.xhtml" />
					</p:tab>
					<p:tab title="#{msg.NonLedger}" id="tab2">
						<ui:include src="inventoryOrderDetailAssetInfo3.xhtml" />
					</p:tab>
					<p:tab title="#{msg.HasIssue}" id="tab3">
						<ui:include src="inventoryOrderDetailAssetInfoIssue.xhtml" />
					</p:tab>
				</p:tabView>
			</div>
		</div>
	</ui:define>
</ui:composition>
