<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<h:form id="inventoryOrderDetailAssetInfoIssueListForm">
	<p:dataTable id="datalist4" value="#{inventoryOrderDetailAssetInfoIssueController.lazyModel}" var="item" widgetVar="varDataList4" selectionMode="single"
		selection="#{inventoryOrderDetailAssetInfoIssueController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
		rowKey="#{item.assetInfo.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
		paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
		currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">
		<p:ajax event="filter" listener="#{inventoryOrderDetailAssetInfoIssueController.onFilter}" />
		<p:column headerText="设备名" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE" exportable="false" sortBy="#{item.assetInfo.namePyCode}">
			<a href="inventoryAssetInfo.xhtml?assetInfoID=#{item.assetInfo.id}" target="_Blank"><h:outputText value="#{item.assetInfo.name}" /></a>
		</p:column>
		<p:column headerText="设备名" exportable="true" visible="false">
			<h:outputText value="#{item.assetInfo.name}" />
		</p:column>
		<p:column headerText="#{msg.clinicalDeptName}" filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="EQ" sortBy="#{item.assetInfo.clinicalDeptNamePyCode}">
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList4').filter()" autoWidth="false" style="max-width: 150px;">
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItems value="#{inventoryOrderDetailAssetInfoIssueController.listClinicalDeptName}" />
				</p:selectOneMenu>
			</f:facet>
			<h:outputText value="#{item.assetInfo.clinicalDeptName}" />
		</p:column>
		<p:column headerText="设备二维码" filterBy="#{item.assetInfo.qrCode}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.qrCode}">
			<h:outputText value="#{item.assetInfo.qrCode}" />
		</p:column>
		<p:column headerText="设备编号" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.departNum}">
			<h:outputText value="#{item.assetInfo.departNum}" />
		</p:column>
		<p:column headerText="设备型号" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.functionType}">
			<h:outputText value="#{item.assetInfo.functionType}" />
		</p:column>
		<p:column headerText="设备财产号" filterBy="#{item.assetInfo.financingNum}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.financingNum}">
			<h:outputText value="#{item.assetInfo.financingNum}" />
		</p:column>
		<p:column headerText="资产状态" filterBy="#{item.assetInfo.status}" filterMatchMode="EQ">
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList4').filter()" autoWidth="false" style="max-width: 150px;">
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItem itemLabel="正常" itemValue="1" />
					<f:selectItem itemLabel="停机" itemValue="2" />
					<f:selectItem itemLabel="限制功能使用" itemValue="3" />
					<f:selectItem itemLabel="待报废" itemValue="4" />
					<f:selectItem itemLabel="停用" itemValue="5" />
				</p:selectOneMenu>
			</f:facet>
			<h:outputText value="#{item.assetInfo.status==1?'正常':item.assetInfo.status==2?'停机':item.assetInfo.status==3?'限制功能使用':item.assetInfo.status==4?'待报废':'停用'}" />
		</p:column>
		<p:column headerText="安装位置" filterBy="#{item.assetInfo.locationName}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.locationName}">
			<h:outputText value="#{item.assetInfo.locationName}" />
		</p:column>
		<p:column headerText="问题描述" sortBy="#{item.comment}">
			<h:outputText value="#{item.comment}" />
		</p:column>
		<p:column headerText="未通过项" sortBy="#{item.inventoryCheckListItems}">
			<h:outputText value="#{item.inventoryCheckListItems}" />
		</p:column>
		<p:column headerText="已解决" filterBy="#{item.isSolved}" filterMatchMode="EQ">
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList4').filter()" autoWidth="false" style="max-width: 150px;">
					<f:converter converterId="javax.faces.Boolean" />
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItem itemLabel="是" itemValue="true" />
					<f:selectItem itemLabel="否" itemValue="false" />
				</p:selectOneMenu>
			</f:facet>
			<h:outputText value="#{item.isSolved?'是':'否'}" />
		</p:column>
		<f:facet name="{Toolbar}">
			<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
				<p:dataExporter type="xls" target="datalist4" fileName="InventoryOrderDetailAssetInfoIssue_export" />
			</p:commandButton>
		</f:facet>
	</p:dataTable>
</h:form>
</html>
