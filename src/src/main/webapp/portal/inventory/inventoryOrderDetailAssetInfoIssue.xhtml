<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<h:form id="inventoryOrderDetailAssetInfoIssueListForm">
	<p:dataTable id="datalist4" value="#{inventoryOrderDetailAssetInfoIssueController.lazyModel}" var="item" widgetVar="varDataList4" selectionMode="single"
		selection="#{inventoryOrderDetailAssetInfoIssueController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
		rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
		paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
		currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">
		<p:ajax event="filter" listener="#{inventoryOrderDetailAssetInfoIssueController.onFilter}" />
		<p:ajax event="rowSelect" update="editButton updateButton"/>
		<p:column headerText="#{msg.EquipmentName}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE" exportable="false" sortBy="#{item.assetInfo.namePyCode}">
			<a href="../asset/info/AssetDetail.xhtml?str=#{item.assetInfo.encodeAssetDetailStr}" target="_Blank"><h:outputText value="#{item.assetInfo.name}" /></a>
		</p:column>
		<p:column headerText="#{msg.EquipmentName}" exportable="true" visible="false">
			<h:outputText value="#{item.assetInfo.name}" />
		</p:column>
		<p:column headerText="#{msg.clinicalDeptName}" filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="EQ">
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList4').filter()" autoWidth="false" style="max-width: 150px;" filter="true" filterMatchMode="contains">
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItems value="#{inventoryOrderDetailAssetInfoIssueController.listClinicalDeptName}" />
				</p:selectOneMenu>
			</f:facet>
			<h:outputText value="#{userContextService.hasCurrentTenantName('') ? item.clinicalDept.name : item.assetInfo.clinicalDeptName}" />
		</p:column>
		<p:column headerText="#{msg.assetDeptName}" filterBy="#{item.assetInfo.assetDeptUID}" filterMatchMode="EQ" rendered="#{inventoryOrderDetailAssetInfoIssueController.inventoryDisplayAssetDept}">
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList4').filter()" autoWidth="false" style="max-width: 150px;" filter="true" filterMatchMode="contains">
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItems value="#{inventoryOrderDetailAssetInfoIssueController.deptList}" var="org" itemLabel="#{org.name}" itemValue="#{org.uid}"/>
				</p:selectOneMenu>
			</f:facet>
			<h:outputText value="#{inventoryOrderDetailAssetInfoIssueController.getOrgName(item.assetInfo.assetDeptUID)}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentQRCode}" filterBy="#{item.assetInfo.qrCode}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.qrCode}">
			<h:outputText value="#{item.assetInfo.qrCode}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentID}" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.departNum}">
			<h:outputText value="#{item.assetInfo.departNum}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentModel}" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.functionType}">
			<h:outputText value="#{item.assetInfo.functionType}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentPropertyNumber}" filterBy="#{item.assetInfo.financingNum}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.financingNum}">
			<h:outputText value="#{item.assetInfo.financingNum}" />
		</p:column>
		<p:column headerText="#{msg.AssetStatus}" filterBy="#{item.assetInfo.status}" filterMatchMode="EQ">
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList4').filter()" autoWidth="false" style="max-width: 150px;">
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItem itemLabel="#{msg.Normal}" itemValue="1" />
					<f:selectItem itemLabel="#{msg.Stopped}" itemValue="2" />
					<f:selectItem itemLabel="#{msg.PartialFunction}" itemValue="3" />
					<f:selectItem itemLabel="#{msg.ToBeTerminated}" itemValue="4" />
					<f:selectItem itemLabel="#{msg.terminated}" itemValue="5" />
				</p:selectOneMenu>
			</f:facet>
			<h:outputText value="#{item.assetInfo.status==1?msg.Normal:item.assetInfo.status==2?msg.Stopped:item.assetInfo.status==3?msg.PartialFunction:item.assetInfo.status==4?msg.ToBeTerminated:msg.terminated}" />
		</p:column>
		<p:column headerText="#{msg.InstallationLocation}" filterBy="#{item.assetInfo.locationName}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.locationName}">
			<h:outputText value="#{item.assetInfo.locationName}" />
		</p:column>
		<p:column headerText="#{msg.ProblemDescription}">
			<h:outputText value="#{item.comment}" />
		</p:column>
		<p:column headerText="#{msg.FailedItems}">
			<h:outputText value="#{item.inventoryCheckListItems}" />
		</p:column>
		<p:column headerText="#{msg.Solved}" filterBy="#{item.isSolved}" filterMatchMode="EQ">
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList4').filter()" autoWidth="false" style="max-width: 150px;">
					<f:converter converterId="javax.faces.Boolean" />
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true" />
					<f:selectItem itemLabel="#{msg.False2No}" itemValue="false" />
				</p:selectOneMenu>
			</f:facet>
			<h:outputText value="#{item.isSolved?msg.True2Yes:msg.False2No}" />
		</p:column>
		<p:column headerText="#{msg.InventoryChecker}" filterBy="#{item.assetInfo.lastModifiedBy}" filterMatchMode="LIKE">
			<h:outputText value="#{inventoryOrderDetailAssetInfoAllController.getUserName(item.lastModifiedBy)}"/>
		</p:column>
		<p:column headerText="#{msg.InvnetoryTime}" filterBy="#{item.lastModifiedDate}" filterMatchMode="GTE">
			<f:facet name="filter">
				<p:inputText id="filterLastModifiedDateIssue" widgetVar="varFilterLastModifiedDateIssue" />
			</f:facet>
			<h:outputText value="#{item.lastModifiedDate}">
				<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
			</h:outputText>
		</p:column>
		<p:column headerText="#{msg.inventoryMethod}" filterBy="#{item.inventoryMethod}" filterMatchMode="EQ" rendered="#{inventoryOrderDetailAssetInfoIssueController.enableInventoryMethod}">
			<h:outputText value="#{fieldMsg.fieldValue('inventoryMethod', item.inventoryMethod)}"/>
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList4').filter()" >
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItems value="#{fieldMsg.getFieldValueList('inventoryMethod')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
				</p:selectOneMenu>
			</f:facet>
		</p:column>
		<p:column headerText="#{msg.assetOwnerName}" filterBy="#{item.assetInfo.assetOwnerName}" filterMatchMode="LIKE" rendered="#{inventoryOrderDetailAssetInfoIssueController.inventoryDisplayRepairOwner}">
			<h:outputText value="#{item.assetInfo.assetOwnerName}" />
		</p:column>
		<p:column headerText="#{msg.Actions}" style="width: 130px" rendered="#{!inventoryOrderDetailAssetInfoController.finished}" exportable="false">
			<p:commandButton id="updateButton" value="转入已盘点" actionListener="#{inventoryOrderDetailAssetInfoIssueController.transferInventorized(item)}"
							 update=":inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfoIssueListForm :inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfo2ListForm"
							 process="@this" disabled="#{item.isSolved eq false}">
				<p:confirm header="转入已盘点确认" message="您确定要将本台设备转入已盘点么？" icon="ui-icon-warning"/>
			</p:commandButton>
			<br/>
			<p:commandButton id="deleteButton" value="删除" actionListener="#{inventoryOrderDetailAssetInfoIssueController.delete(item)}"
							 update=":inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfoIssueListForm :inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfo2ListForm"
							 process="@this">
				<p:confirm header="删除确认" message="您确定要删除么？" icon="ui-icon-warning"/>
			</p:commandButton>
		</p:column>
		<f:facet name="{Toolbar}">
			<p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" rendered="#{!inventoryOrderDetailAssetInfoController.finished}" actionListener="#{inventoryOrderDetailAssetInfoIssueController.prepareEdit}" update=":inventoryOrderDetailAssetInfoTab:OrderIssueEditDlg" process="@this" oncomplete="PF('OrderIssueEditDlg').show()" disabled="#{empty inventoryOrderDetailAssetInfoIssueController.selected}"/>
			<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
				<p:dataExporter type="xls" target="datalist4" fileName="InventoryOrderDetailAssetInfoIssue_export" />
			</p:commandButton>
		</f:facet>
	</p:dataTable>
</h:form>
<p:dialog id="OrderIssueEditDlg" widgetVar="OrderIssueEditDlg" modal="true" resizable="true" draggable="true"  appendTo="@(body)" header="#{inventoryOrderDetailAssetInfoIssueController.CRUDActionName}" >
	<h:form id="OrderIssueEditForm">
		<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" style="min-width: 500px;">
			<h:panelGroup>
				<label class="label">#{msg.locationName}</label>
				<p:inputText id="locationName" value="#{inventoryOrderDetailAssetInfoIssueController.selected.assetInfo.locationName}" autocomplete="new-password"/>
			</h:panelGroup>
			<h:panelGroup>
				<label class="label">#{msg.ProblemDescription}</label>
				<p:inputText id="comment" value="#{inventoryOrderDetailAssetInfoIssueController.selected.comment}" autocomplete="new-password"/>
			</h:panelGroup>
			<h:panelGroup>
				<label class="label">#{msg.Solved}</label>
				<p:selectOneRadio value="#{inventoryOrderDetailAssetInfoIssueController.selected.isSolved}" disabled="false">
					<f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
					<f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
				</p:selectOneRadio>
			</h:panelGroup>
		</p:panelGrid>
		<p:commandButton validateClient="true" actionListener="#{inventoryOrderDetailAssetInfoIssueController.save}" value="#{msg.Save}" update="@(.datalist4) :growl,
		inventoryOrderDetailAssetInfoTab:OrderIssueEditDlg,
		inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfoIssueListForm" oncomplete="handleSubmit(args, 'OrderIssueEditDlg');"
						 icon="ui-icon-check" />
		<p:commandButton immediate="true" value="#{msg.Cancel}" type="button" icon="ui-icon-cancel" onclick="PF('OrderIssueEditDlg').hide()"/>
	</h:form>
</p:dialog>
<p:overlayPanel widgetVar="panelFilterLastModifiedDateIssue" for=":inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfoIssueListForm:datalist4:filterLastModifiedDateIssue" dismissable="false">
	<h:panelGrid columns="2">
		<p:outputLabel value="#{msg.From}" />
		<p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_LastModifiedDateIssue" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
					mask="true" size="12" locale="zh" />
		<p:outputLabel value="#{msg.To}" />
		<p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_LastModifiedDateIssue" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
					mask="true" size="12" locale="zh" />
	</h:panelGrid>
	<p:commandButton
			onclick="setDateFilter('varDataList4','varFilterLastModifiedDateIssue','varStartTimeFrom_LastModifiedDateIssue','varStartTimeTo_LastModifiedDateIssue'); PF('panelFilterLastModifiedDateIssue').hide();"
			title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
	<p:commandButton onclick="PF('panelFilterLastModifiedDateIssue').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;" />
</p:overlayPanel>
</html>
