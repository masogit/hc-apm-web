<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<h:form id="inventoryOrderDetailAssetInfo3ListForm">
	<p:dataTable id="datalist3" value="#{inventoryOrderDetailAssetInfoController3.lazyModel}" var="item" widgetVar="varDataList3"
        selection="#{inventoryOrderDetailAssetInfoController3.selectedItems}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
		rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
		paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
		currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">
		<p:ajax event="filter" listener="#{inventoryOrderDetailAssetInfoController3.onFilter}" />
        <p:column selectionMode="multiple" style="width:50px;text-align:center"/>
        <p:column headerText="#{msg.EquipmentQRCode}" filterBy="#{item.qrCode}" filterMatchMode="LIKE" sortBy="#{item.qrCode}">
            <h:outputText value="#{item.qrCode}" />
        </p:column>
        <p:column headerText="#{msg.clinicalDeptName}" filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="EQ">
            <f:facet name="filter">
                <p:selectOneMenu onchange="PF('varDataList3').filter()" autoWidth="false" style="max-width: 150px;" filter="true" filterMatchMode="contains">
                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                    <f:selectItems value="#{inventoryOrderDetailAssetInfoController3.listClinicalDeptName}" />
                </p:selectOneMenu>
            </f:facet>
            <h:outputText value="#{item.orgName}" />
        </p:column>
        <p:column headerText="#{msg.feedbackComment}" filterBy="#{item.comment}" filterMatchMode="LIKE">
            <h:outputText value="#{item.comment}" />
        </p:column>
        <p:column headerText="#{msg.InventoryChecker}" filterBy="#{item.lastModifiedBy}" filterMatchMode="LIKE">
            <h:outputText value="#{inventoryOrderDetailAssetInfoController3.getUserName(item.lastModifiedBy)}"/>
        </p:column>
        <p:column headerText="#{msg.InvnetoryTime}" filterBy="#{item.lastModifiedDate}" filterMatchMode="GTE" sortBy="#{item.lastModifiedDate}">
            <f:facet name="filter">
                <p:inputText id="filterLastModifiedDate3" widgetVar="varFilterLastModifiedDate3" />
            </f:facet>
            <h:outputText value="#{item.lastModifiedDate}">
                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
            </h:outputText>
        </p:column>
        <p:column headerText="#{msg.inventoryMethod}" filterBy="#{item.inventoryMethod}" filterMatchMode="EQ" rendered="#{inventoryOrderDetailAssetInfoController3.enableInventoryMethod}">
            <h:outputText value="#{fieldMsg.fieldValue('inventoryMethod', item.inventoryMethod)}"/>
            <f:facet name="filter">
                <p:selectOneMenu onchange="PF('varDataList3').filter()" >
                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                    <f:selectItems value="#{fieldMsg.getFieldValueList('inventoryMethod')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                </p:selectOneMenu>
            </f:facet>
        </p:column>
        <p:column headerText="#{msg.Actions}" style="width: 130px" exportable="false" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_INVENTORY_NO_LEDGER_DELETE')}">
            <p:commandButton id="deleteButton" value="删除" actionListener="#{inventoryOrderDetailAssetInfoController3.delete(item)}" disabled="#{not empty inventoryOrderDetailAssetInfoController3.inventoryOrder and inventoryOrderDetailAssetInfoController3.inventoryOrder.isFinished}"
                             update=":inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfo3ListForm"
                             process="@this">
                <p:confirm header="删除确认" message="您确定要删除么？" icon="ui-icon-warning"/>
            </p:commandButton>
        </p:column>
		<f:facet name="{Toolbar}">
            <p:commandButton id="bathDeleteButton" icon="ui-icon-delete" class="btnEdit" title="#{msg.BatchDelete}" update=":growl :inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfo3ListForm:datalist3"
                             rendered="#{userContextService.accessContainsFunctionMenu('ASSET_INVENTORY_NO_LEDGER_DELETE')}" disabled="#{not empty inventoryOrderDetailAssetInfoController3.inventoryOrder and inventoryOrderDetailAssetInfoController3.inventoryOrder.isFinished}" validateClient="true" actionListener="#{inventoryOrderDetailAssetInfoController3.bathDelete()}">
                <p:confirm header="#{msg.DeleteConfirmation}" message="#{msg.IsConfirmDeleRecord}" icon="ui-icon-warning"/>
            </p:commandButton>
			<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
				<p:dataExporter type="xls" target="datalist3" fileName="InventoryOrderDetailAssetInfo3_export" />
			</p:commandButton>
		</f:facet>
	</p:dataTable>
</h:form>
<p:overlayPanel widgetVar="panelFilterLastModifiedDate3" for=":inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfo3ListForm:datalist3:filterLastModifiedDate3" dismissable="false">
	<h:panelGrid columns="2">
		<p:outputLabel value="#{msg.From}" />
		<p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_LastModifiedDate3" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
			mask="true" size="12" locale="zh" />
		<p:outputLabel value="#{msg.To}" />
		<p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_LastModifiedDate3" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
			mask="true" size="12" locale="zh" />
	</h:panelGrid>
	<p:commandButton
		onclick="setDateFilter('varDataList3','varFilterLastModifiedDate3','varStartTimeFrom_LastModifiedDate3','varStartTimeTo_LastModifiedDate3'); PF('panelFilterLastModifiedDate3').hide();"
		title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
	<p:commandButton onclick="PF('panelFilterLastModifiedDate3').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;" />
</p:overlayPanel>
</html>
