<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<h:form id="searchForm" class="searchForm">
	<h:panelGroup rendered="#{!userContextService.hasAnyRoleByApmRoles('MVSAdmin','MVSFE')}">
		<p:commandButton id="btnOrg" value="#{empty inventoryOrderDetailAssetInfoAllController.selectSite? msg.AllHospitals:inventoryOrderDetailAssetInfoAllController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
		<p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false">
			<p:inputText id="treeNodeNameFilter" class="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
			<p:commandButton partialSubmit="true" icon="ui-icon-search" process="@(.treeNodeNameFilter) @this" update="@(.orgTree)" actionListener="#{orgTreeController.filterTreeNodeByName()}" value="#{msg.Search}"/>
			<p:scrollPanel style="height:300px;border: 0" mode="native">
				<p:tree id="orgTree" class="orgTree" style="width:98%;border:0;" value="#{orgTreeController.siteOrgTree}" selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
					<p:ajax process="@this" event="select" listener="#{inventoryOrderDetailAssetInfoAllController.onSelectSiteTreeNode}" update="inventoryOrderDetailAssetInfoTab" oncomplete="PF('varPanelOrg').hide();"/>
					<p:ajax process="@this" event="expand"/>
					<p:ajax process="@this" event="collapse"/>
					<p:treeNode type="org">
						<h:outputText value="#{node.name}"/>
					</p:treeNode>
					<p:treeNode type="hidden" rendered="false"/>
				</p:tree>
			</p:scrollPanel>
		</p:overlayPanel>
	</h:panelGroup>
</h:form>
<h:form id="inventoryOrderDetailAssetInfoAllListForm">
	<p:dataTable id="datalistAll" value="#{inventoryOrderDetailAssetInfoAllController.lazyModel}" var="item" widgetVar="varDataListAll" selectionMode="single"
		selection="#{inventoryOrderDetailAssetInfoAllController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
		rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
		paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
		currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">
		<p:ajax event="filter" listener="#{inventoryOrderDetailAssetInfoAllController.onFilter}" />
		<p:column headerText="#{msg.EquipmentName}" filterBy="#{item.name}" filterMatchMode="LIKE" exportable="false">
			<a href="../asset/info/AssetDetail.xhtml?str=#{item.encodeAssetDetailStr}" target="_Blank"><h:outputText value="#{item.name}" /></a>
		</p:column>
		<p:column headerText="#{msg.EquipmentName}" exportable="true" visible="false">
			<h:outputText value="#{item.name}" />
		</p:column>
		<p:column headerText="#{msg.clinicalDeptName}">
			<f:facet name="header">
				<h:outputText value="#{msg.clinicalDeptName}"/><br/>
				<p:autoComplete dropdown="true" value="#{inventoryOrderDetailAssetInfoAllController.filterClinicalDeptOrg}" appendTo="@(Body)"
								scrollHeight="300"  forceSelection="true" completeMethod="#{inventoryOrderDetailAssetInfoAllController.autoCompleteDeptName}" size="5">
					<p:ajax event="itemSelect" listener="#{inventoryOrderDetailAssetInfoAllController.onClinicalDeptNameFilterChange}" process="@this"  update=":inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfoAllListForm:datalistAll"/>
					<p:ajax process="@this" listener="#{inventoryOrderDetailAssetInfoAllController.onClinicalDeptNameFilterChange}" update=":inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfoAllListForm:datalistAll"/>
				</p:autoComplete>
			</f:facet>
			<h:outputText value="#{item.clinicalDeptName}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentQRCode}" filterBy="#{item.qrCode}" filterMatchMode="LIKE">
			<h:outputText value="#{item.qrCode}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentID}" filterBy="#{item.departNum}" filterMatchMode="LIKE">
			<h:outputText value="#{item.departNum}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentModel}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
			<h:outputText value="#{item.functionType}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentPropertyNumber}" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
			<h:outputText value="#{item.financingNum}" />
		</p:column>
		<p:column headerText="#{msg.AssetStatus}" filterBy="#{item.assetStatus}" filterMatchMode="EQ">
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataListAll').filter()" autoWidth="false" style="max-width: 150px;">
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItem itemLabel="#{msg.Normal}" itemValue="1" />
					<f:selectItem itemLabel="#{msg.Stopped}" itemValue="2" />
					<f:selectItem itemLabel="#{msg.PartialFunction}" itemValue="3" />
					<f:selectItem itemLabel="#{msg.ToBeTerminated}" itemValue="4" />
					<f:selectItem itemLabel="#{msg.terminated}" itemValue="5" />
				</p:selectOneMenu>
			</f:facet>
			<h:outputText value="#{item.assetStatus==1?msg.Normal:item.assetStatus==2?msg.Stopped:item.assetStatus==3?msg.PartialFunction:item.assetStatus==4?msg.ToBeTerminated:item.assetStatus==5?msg.terminated:item.assetStatus}" />
		</p:column>
		<p:column headerText="#{msg.InstallationLocation}" filterBy="#{item.locationName}" filterMatchMode="LIKE">
			<h:outputText value="#{item.locationName}" />
		</p:column>
        <p:column headerText="#{msg.ProblemDescription}">
            <h:outputText value="#{item.comment}" />
        </p:column>
        <p:column headerText="#{msg.FailedItems}">
            <h:outputText value="#{item.inventoryCheckListItems}" />
        </p:column>
        <p:column headerText="#{msg.Solved}" filterBy="#{item.isSolved}" filterMatchMode="EQ">
            <f:facet name="filter">
                <p:selectOneMenu onchange="PF('varDataListAll').filter()" autoWidth="false" style="max-width: 150px;">
                    <f:converter converterId="javax.faces.Boolean" />
                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true" />
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false" />
                </p:selectOneMenu>
            </f:facet>
            <h:outputText value="#{item.isSolved}"/>
        </p:column>
        <p:column headerText="#{msg.InventoryChecker}" filterBy="#{item.lastModifiedBy}" filterMatchMode="LIKE">
            <h:outputText value="#{item.status == 0 ? '' : inventoryOrderDetailAssetInfoAllController.getUserName(item.lastModifiedBy)}"/>
        </p:column>
        <p:column headerText="#{msg.InvnetoryTime}" filterBy="#{item.lastModifiedDate}" filterMatchMode="GTE">
            <f:facet name="filter">
                <p:inputText id="filterLastModifiedDateAll" widgetVar="varFilterLastModifiedDateAll" />
            </f:facet>
            <h:outputText value="#{item.status == 0 ? '' : item.lastModifiedDate}">
                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
            </h:outputText>
        </p:column>
        <p:column headerText="#{msg.inventoryStatus}" filterBy="#{item.status}" filterMatchMode="EQ">
            <f:facet name="filter">
                <p:selectOneMenu onchange="PF('varDataListAll').filter()" autoWidth="false" style="max-width: 150px;">
                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                    <f:selectItem itemLabel="#{msg.NonInventory}" itemValue="0" />
                    <f:selectItem itemLabel="#{msg.Inventorized}" itemValue="1" />
<!--                    <f:selectItem itemLabel="#{msg.NonLedger}" itemValue="2" />-->
                    <f:selectItem itemLabel="#{msg.HasIssue}" itemValue="3" />
                    <f:selectItem itemLabel="#{msg.NoWorkOrder}" itemValue="4" />
                </p:selectOneMenu>
            </f:facet>
            <h:outputText value="#{item.status==0?msg.NonInventory:item.status==1?msg.Inventorized:item.status==2?msg.NonLedger:item.status==3?msg.HasIssue:item.status==4?msg.NoWorkOrder:item.status}" />
        </p:column>
		<f:facet name="{Toolbar}">
<!--			<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">-->
<!--				<p:dataExporter type="xls" target="datalistAll" fileName="InventoryOrderDetailAssetInfo_export" />-->
<!--			</p:commandButton>-->

			<p:commandButton title="导出" icon="ui-icon-arrow-1-s" class="btn btn-sm btn-gray" actionListener="#{inventoryOrderDetailAssetInfoAllController.exportExcel}" update=":growl"
							 onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false" >
				<p:fileDownload value="#{inventoryOrderDetailAssetInfoAllController.excelFile}" />
			</p:commandButton>
		</f:facet>
	</p:dataTable>
</h:form>
<p:overlayPanel widgetVar="panelFilterLastModifiedDateAll" for=":inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfoAllListForm:datalistAll:filterLastModifiedDateAll" dismissable="false">
    <h:panelGrid columns="2">
        <p:outputLabel value="#{msg.From}" />
        <p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_LastModifiedDateAll" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
                    mask="true" size="12" locale="zh" />
        <p:outputLabel value="#{msg.To}" />
        <p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_LastModifiedDateAll" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
                    mask="true" size="12" locale="zh" />
    </h:panelGrid>
    <p:commandButton
            onclick="setDateFilter('varDataListAll','varFilterLastModifiedDateAll','varStartTimeFrom_LastModifiedDateAll','varStartTimeTo_LastModifiedDateAll'); PF('panelFilterLastModifiedDateAll').hide();"
            title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
    <p:commandButton onclick="PF('panelFilterLastModifiedDateAll').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;" />
</p:overlayPanel>
</html>
