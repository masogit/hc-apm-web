<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<h:form id="inventoryOrderDetailAssetInfo2ListForm">
	<p:dataTable id="datalist2" value="#{inventoryOrderDetailAssetInfoController2.lazyModel}" var="item" widgetVar="varDataList2" selectionMode="single"
		selection="#{inventoryOrderDetailAssetInfoController2.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
		rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
		paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
		currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">
		<p:ajax event="filter" listener="#{inventoryOrderDetailAssetInfoController2.onFilter}" />
		<p:column headerText="#{msg.EquipmentName}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE" exportable="false" sortBy="#{item.assetInfo.namePyCode}">
			<a href="../asset/info/AssetDetail.xhtml?str=#{item.assetInfo.encodeAssetDetailStr}" target="_Blank"><h:outputText value="#{item.assetInfo.name}" /></a>
		</p:column>
		<p:column headerText="#{msg.EquipmentName}" exportable="true" visible="false">
			<h:outputText value="#{item.assetInfo.name}" />
		</p:column>
		<p:column headerText="#{msg.clinicalDeptName}" filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="EQ">
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList2').filter()" autoWidth="false" style="max-width: 150px;" filter="true" filterMatchMode="contains">
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItems value="#{inventoryOrderDetailAssetInfoController2.listClinicalDeptName}" />
				</p:selectOneMenu>
			</f:facet>
			<h:outputText value="#{userContextService.hasCurrentTenantName('') ? item.clinicalDeptName : item.assetInfo.clinicalDeptName}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentQRCode}" filterBy="#{item.assetInfo.qrCode}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.qrCode}">
			<h:outputText value="#{item.assetInfo.qrCode}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentID}" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.departNum}">
			<h:outputText value="#{item.assetInfo.departNum}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentModel}" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.functionType}">
			<h:outputText value="#{item.assetInfo.functionType}" />
		</p:column>
		<p:column headerText="#{msg.EquipmentPropertyNumber}" filterBy="#{item.assetInfo.financingNum}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.financingNum}">
			<h:outputText value="#{item.assetInfo.financingNum}" />
		</p:column>
		<p:column headerText="#{msg.AssetStatus}" filterBy="#{item.assetInfo.status}" filterMatchMode="EQ">
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList2').filter()" autoWidth="false" style="max-width: 150px;">
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItem itemLabel="#{msg.Normal}" itemValue="1" />
					<f:selectItem itemLabel="#{msg.Stopped}" itemValue="2" />
					<f:selectItem itemLabel="#{msg.PartialFunction}" itemValue="3" />
					<f:selectItem itemLabel="#{msg.ToBeTerminated}" itemValue="4" />
					<f:selectItem itemLabel="#{msg.terminated}" itemValue="5" />
				</p:selectOneMenu>
			</f:facet>
			<h:outputText value="#{item.assetInfo.status==1?msg.Normal:item.assetInfo.status==2?msg.Stopped:item.assetInfo.status==3?msg.PartialFunction:item.assetInfo.status==4?msg.ToBeTerminated:item.assetInfo.status==5?msg.terminated:item.assetInfo.status}" />
		</p:column>
		<p:column headerText="#{msg.InstallationLocation}" filterBy="#{item.assetInfo.locationName}" filterMatchMode="LIKE" sortBy="#{item.assetInfo.locationName}">
			<h:outputText value="#{item.assetInfo.locationName}" />
		</p:column>
		<p:column headerText="#{msg.InventoryChecker}" filterBy="#{item.assetInfo.lastModifiedBy}" filterMatchMode="LIKE" >
            <h:outputText value="#{inventoryOrderDetailAssetInfoController2.getUserName(item.lastModifiedBy)}"/>
		</p:column>
		<p:column headerText="#{msg.InvnetoryTime}" filterBy="#{item.lastModifiedDate}" filterMatchMode="GTE" sortBy="#{item.lastModifiedDate}">
			<f:facet name="filter">
				<p:inputText id="filterLastModifiedDate2" widgetVar="varFilterLastModifiedDate2" />
			</f:facet>
			<h:outputText value="#{item.lastModifiedDate}">
				<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
			</h:outputText>
		</p:column>
		<p:column headerText="#{msg.inventoryMethod}" filterBy="#{item.inventoryMethod}" filterMatchMode="EQ" rendered="#{inventoryOrderDetailAssetInfoController2.enableInventoryMethod}">
			<h:outputText value="#{fieldMsg.fieldValue('inventoryMethod', item.inventoryMethod)}"/>
			<f:facet name="filter">
				<p:selectOneMenu onchange="PF('varDataList2').filter()" >
					<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItems value="#{fieldMsg.getFieldValueList('inventoryMethod')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
				</p:selectOneMenu>
			</f:facet>
		</p:column>
		<p:column headerText="#{msg.Actions}" style="width: 130px" rendered="#{!inventoryOrderDetailAssetInfoController.finished}" exportable="false">
			<p:commandButton id="updateButton" value="转入未盘点" actionListener="#{inventoryOrderDetailAssetInfoController2.transferNonInventory(item)}"
							 update=":inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfo2ListForm :inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfoListForm"
							 process="@this" disabled="#{item.isSolved eq false}">
				<p:confirm header="转入未盘点确认" message="您确定要将本台设备转入未盘点么？" icon="ui-icon-warning"/>
			</p:commandButton>
		</p:column>
		<f:facet name="{Toolbar}">
			<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
				<p:dataExporter type="xls" target="datalist2" fileName="InventoryOrderDetailAssetInfo2_export" />
			</p:commandButton>
		</f:facet>
	</p:dataTable>
</h:form>
<p:overlayPanel widgetVar="panelFilterLastModifiedDate2" for=":inventoryOrderDetailAssetInfoTab:inventoryOrderDetailAssetInfo2ListForm:datalist2:filterLastModifiedDate2" dismissable="false">
	<h:panelGrid columns="2">
		<p:outputLabel value="#{msg.From}" />
		<p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_LastModifiedDate2" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
			mask="true" size="12" locale="zh" />
		<p:outputLabel value="#{msg.To}" />
		<p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_LastModifiedDate2" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
			mask="true" size="12" locale="zh" />
	</h:panelGrid>
	<p:commandButton
		onclick="setDateFilter('varDataList2','varFilterLastModifiedDate2','varStartTimeFrom_LastModifiedDate2','varStartTimeTo_LastModifiedDate2'); PF('panelFilterLastModifiedDate2').hide();"
		title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
	<p:commandButton onclick="PF('panelFilterLastModifiedDate2').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;" />
</p:overlayPanel>
</html>
