<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="SupplierRelationDlg" width="1000" height="600" class="modiSupplyRelationDlg" widgetVar="SupplierRelationDialog" modal="true" resizable="false" draggable="true" appendTo="@this" header="#{msg.Relate} #{msg.Supplier}" >
        <h:form id="SupplierRelationForm">
            <p:fieldset legend="#{msg.SupplierBasicInfo}">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{venderCompanyController.selected != null}">
                    <h:panelGroup>
                        <label class="label">#{msg.name}*</label>
                        <p:inputText id="name" value="#{venderCompanyController.selected.name}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.city}</label>
                        <p:inputText id="city" value="#{venderCompanyController.selected.city}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.address}</label>
                        <p:inputText id="address" value="#{venderCompanyController.selected.address}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.zipcode}</label>
                        <p:inputText id="zipcode" value="#{venderCompanyController.selected.zipcode}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.contactor}</label>
                        <p:inputText id="contactor" value="#{venderCompanyController.selected.contactor}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.tel}</label>
                        <p:inputText id="tel" value="#{venderCompanyController.selected.tel}" readonly="true"/>
                    </h:panelGroup>
                </p:panelGrid>
                <p:panelGrid columns="6" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.type}*</label>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:selectBooleanCheckbox id="wxs" label="#{msg.maintainer}" value="#{venderCompanyController.selected.maintainerT}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:selectBooleanCheckbox label="#{msg.manufacturer}" value="#{venderCompanyController.selected.manufacturerT}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:selectBooleanCheckbox label="#{msg.vendor}" value="#{venderCompanyController.selected.supplierT}"/>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
            <p:commandButton validateClient="true" actionListener="#{venderCompanyController.relation}" value="#{msg.Save}" update="supplierTab:VenderCompanyForm:datalist1  supplierTab:SupplierListForm:datalist :growl" icon="ui-icon-check" oncomplete="PF('SupplierRelationDialog').hide()"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('SupplierRelationDialog').hide()"/>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
