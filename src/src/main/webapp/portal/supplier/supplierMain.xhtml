<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.SupplierMgmt}"/>
            </div>
            <div class="ui-g-12">
                <p:tabView id="supplierTab" class="ui-g-12" activeIndex="0" dynamic="true" cache="true">
                    <p:ajax event="tabChange" oncomplete="openAssetViewWindow(xhr, status, args)"/>
                    <p:tab title="#{msg.Supplier}" id="supplierList" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_SUPPLIER_VIEW')}">
                        <ui:include src="List.xhtml"/>
                    </p:tab>
                    <p:tab title="#{msg.SupplierImport}" id="supplierImport" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_SUPPLIER_VIEW')}">
                        <ui:include src="import.xhtml"/>
                    </p:tab>
                    <p:tab title="#{msg.SupplierRelation}" id="supplierRelation" rendered="#{userContextService.canRender('ASSET_VENDER') and userContextService.accessContainsFunctionMenu('ASSET_VENDER')}">
                        <ui:include src="relation.xhtml"/>
                    </p:tab>
                    <p:tab title="#{msg.SupplierNotice}" id="supplierNotice" rendered="#{userContextService.canRender('ASSET_VENDER') and userContextService.accessContainsFunctionMenu('ASSET_VENDER')}">
                        <ui:include src="notice.xhtml"/>
                    </p:tab>
                </p:tabView>
                <ui:include src="/portal/preview/view.xhtml" />
            </div>
        </div>
        <script>
            //<![CDATA[
            function openAssetViewWindow(xhr, status, args) {
                if(args.url != null){
                    window.location.href = args.url;
                }
            }

            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#SupplierListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }

            function copyText() {
                let pwd = document.getElementById("VenderCompanyLoginUrl").innerText;
                let input = document.createElement("input");
                input.setAttribute('id', 'copyInput');
                input.setAttribute('value', pwd);
                document.getElementsByTagName('body')[0].appendChild(input);
                document.getElementById('copyInput').select();
                document.execCommand("copy");
                document.getElementById('copyInput').remove();
            }
            //]]>
        </script>
    </ui:define>
</ui:composition>
