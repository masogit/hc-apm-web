<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <script type="text/javascript" src="#{wechatUtilService.getContextPath()}/resources/js/jquery.jplayer.min.js"/>
        <script type="text/javascript" src="https://unpkg.com/viewerjs@1.9.0/dist/viewer.min.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/viewerjs@1.9.0/dist/viewer.min.css"/>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.Supplier}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form rendered="#{supplierController.activeSupplier()}">
                    <p:commandButton id="supplierQrCodeButton" actionListener="#{supplierController.onShowQrCode}" value="邀请二维码" title="邀请二维码" update=":supplierQrCodeDlg" oncomplete="PF('supplierQrCodeDialog').show()"/>
                </h:form>

                <h:form id="SupplierListForm">
                    <p:dataTable id="datalist" value="#{supplierController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{supplierController.selected}" stickyHeader=""
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="createButton editButton editSupplierUserButton"/>
                        <p:ajax event="filter" listener="#{supplierController.onFilter}" oncomplete="rc();"/>
                        <p:column width="36" id="checkBox">
                            <p:selectBooleanCheckbox value="#{supplierController.selectedMap[item.id]}" class="selectCheckBox">
                                <p:ajax update=" @(.selectCheckBoxHeader) SupplierListForm:datalist" listener="#{supplierController.onItemSelected}"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header"  >
                                <p:selectBooleanCheckbox class="selectCheckBoxHeader" value="#{supplierController.isSelectedCurrentPage}">
                                    <p:ajax listener="#{supplierController.onSelectAllOfPage}" update="@(.selectCheckBox) deleteButton"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.name}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.city}" sortBy="#{item.city}" filterBy="#{item.city}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.city}"/>
                        </p:column>
                        <p:column headerText="#{msg.address}" sortBy="#{item.address}" filterBy="#{item.address}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.address}"/>
                        </p:column>
                        <p:column headerText="#{msg.zipcode}" sortBy="#{item.zipcode}" filterBy="#{item.zipcode}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.zipcode}"/>
                        </p:column>
                        <p:column headerText="#{msg.contactor}" sortBy="#{item.contactor}" filterBy="#{item.contactor}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.contactor}"/>
                        </p:column>
                        <p:column headerText="#{msg.tel}" sortBy="#{item.tel}" filterBy="#{item.tel}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.tel}"/>
                        </p:column>
                        <p:column headerText="#{msg.type}" sortBy="#{item.supplierType}" filterBy="#{item.supplierType}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu value="#{supplierController.supplierType}" onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}"  noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('supplierType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{supplierController.getGongyingshangLeixing(item)}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" title="#{msg.Create}" actionListener="#{supplierController.prepareCreate}" update=":SupplierEditDlg" oncomplete="PF('SupplierEditDialog').show()" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_SUPPLIER_EDIT')}"/>
                            <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{supplierController.prepareEdit}" update=":SupplierEditDlg @(.modiSupplyDlg)" oncomplete="PF('SupplierEditDialog').show()" disabled="#{empty supplierController.selected}" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_SUPPLIER_EDIT')}"/>
                            <p:commandButton id="editSupplierUserButton" icon="ui-icon-people" title="#{msg.Edit}" actionListener="#{supplierController.initSupplierUser}" update=":supplierUserDlg" oncomplete="PF('supplierUserDialog').show()" rendered="#{supplierController.activeSupplier()}"/>
                            <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="批量删除" actionListener="#{supplierController.batchDeleteSupplier}" update="datalist" disabled="#{not supplierController.isChecked()}" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_SUPPLIER_DELETE')}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-file-download" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="Supplier_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                    <p:remoteCommand name="rc" update="datalist:createButton datalist:editButton datalist:editSupplierUserButton datalist:deleteButton" immediate="true"/>
                </h:form>

                <ui:include src="Edit.xhtml"/>
                <ui:include src="supplierUser.xhtml"/>
                <ui:include src="supplierQrCode.xhtml"/>
            </div>
        </div>

        <script>
            //<![CDATA[
            function updateSelectAllCheckBoxPending() {
                var checkboxlist = $(".selectCheckBoxPending");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#pendingApprovalSupplierUserForm\\:datalist\\:selectCheckBoxHeaderPending_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeaderPending")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeaderPending")[0].children[1].classList.remove("ui-state-active");
                }
            }

            function updateSelectAllCheckBoxApproved() {
                var checkboxlist = $(".selectCheckBoxApproved");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#approvedSupplierUserForm\\:datalist\\:selectCheckBoxHeaderApproved_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeaderApproved")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeaderApproved")[0].children[1].classList.remove("ui-state-active");
                }
            }
            //]]>
        </script>

    </ui:define>

</ui:composition>
