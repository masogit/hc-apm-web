<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="supplierUserDlg" widgetVar="supplierUserDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="管理供应商相关责任人" height="600" width="1000">
        <label class="label">供应商名称</label>
        <p:outputLabel value="#{supplierController.selected.name}" />

        <h:form id="pendingApprovalSupplierUserForm">
            <p:fieldset legend="待审批供应商责任人">
                <p:dataTable id="datalist_pendingSupplierUser" value="#{supplierController.pendingApprovalUserList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             paginatorTemplate="{CurrentPageReport} {Toolbar}" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="5" emptyMessage="#{msg.noRecordFound}">

                    <p:column headerText="用户名">
                        <h:outputText value="#{item.userAccount.name}"/>
                    </p:column>
                    <p:column headerText="手机号">
                        <h:outputText value="#{item.userAccount.telephone}"/>
                    </p:column>
                    <p:column headerText="邮箱">
                        <h:outputText value="#{item.userAccount.email}"/>
                    </p:column>
                    <!--<p:column headerText="审批状态">
                        <h:outputText value="#{fieldMsg.fieldValue('supplierUserStatus',item.status)}"/>
                    </p:column>-->
                    <p:column width="140"  headerText="操作" exportable="false">
                        <p:commandButton value="通过" actionListener="#{supplierController.onApprove(item)}" update=":approvedSupplierUserForm :pendingApprovalSupplierUserForm"></p:commandButton>
                        <p:commandButton validateClient="false" value="拒绝" actionListener="#{supplierController.onRefuse(item)}" update=":approvedSupplierUserForm :pendingApprovalSupplierUserForm"></p:commandButton>
                    </p:column>

                </p:dataTable>
            </p:fieldset>
        </h:form>

        <h:form id="approvedSupplierUserForm">
            <p:fieldset legend="已审批供应商责任人">
                <p:dataTable id="datalist_approvedSupplierUser" value="#{supplierController.approvedUserList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             paginatorTemplate="{CurrentPageReport} {Toolbar}" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="5" emptyMessage="#{msg.noRecordFound}">

                    <p:column headerText="用户名">
                        <h:outputText value="#{item.userAccount.name}"/>
                    </p:column>
                    <p:column headerText="手机号">
                        <h:outputText value="#{item.userAccount.telephone}"/>
                    </p:column>
                    <p:column headerText="邮箱">
                        <h:outputText value="#{item.userAccount.email}"/>
                    </p:column>
                    <p:column width="140"  headerText="操作" exportable="false">
                        <p:commandButton validateClient="false" value="删除" actionListener="#{supplierController.onRefuse(item)}" update=":approvedSupplierUserForm :pendingApprovalSupplierUserForm"></p:commandButton>
                    </p:column>

                </p:dataTable>
            </p:fieldset>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
