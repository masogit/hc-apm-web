<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="supplierUserDlg" widgetVar="supplierUserDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="供应商相关责任人" height="600" width="1000">
        <h:form id="approvedSupplierUserForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">责任人列表*</label>
                    <p:selectManyMenu id="supplierUserList" value="#{supplierController.approvedUserList}" var="t" converter="userAccountConverter" required="false" filter="true" filterMatchMode="contains" showCheckbox="true" requiredMessage="#{msg.TenantInfo} #{msg.ValidationRequire}" style="width:70%">
                        <f:selectItems value="#{supplierController.tempStaffList}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
                        <p:column>
                            <h:outputText value="#{t.name}" />
                        </p:column>
                    </p:selectManyMenu>
                </h:panelGroup>
            </p:panelGrid>
            <p:commandButton validateClient="false" value="#{msg.Save}" actionListener="#{supplierController.saveSupplierUserList}" icon="ui-icon-check" oncomplete="handleSubmit(args, 'supplierUserDialog');"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('supplierUserDialog').hide()"/>
        </h:form>
        <h:form id="pendingApprovalSupplierUserForm">
            <p:fieldset legend="待审批供应商责任人">
                <p:dataTable id="datalist_pendingSupplierUser" value="#{supplierController.pendingApprovalUserList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             paginatorTemplate="{CurrentPageReport} {Toolbar}" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="5" emptyMessage="#{msg.noRecordFound}">

                    <p:column headerText="用户名">
                        <h:outputText value="#{item.userAccount.name}"/>
                    </p:column>
                    <p:column headerText="手机号">
                        <h:outputText value="#{item.userAccount.telephone}"/>
                    </p:column>
                    <p:column headerText="邮箱">
                        <h:outputText value="#{item.userAccount.email}"/>
                    </p:column>
                    <p:column width="140"  headerText="操作" exportable="false">
                        <p:commandButton value="通过" actionListener="#{supplierController.onApprove(item)}" update=":approvedSupplierUserForm :pendingApprovalSupplierUserForm"></p:commandButton>
                        <p:commandButton validateClient="false" value="拒绝" actionListener="#{supplierController.onRefuse(item)}" update=":approvedSupplierUserForm :pendingApprovalSupplierUserForm"></p:commandButton>
                    </p:column>

                </p:dataTable>
            </p:fieldset>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
