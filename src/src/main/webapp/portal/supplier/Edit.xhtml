        <script>
            //在list主页面加载时会初始化，但打开p:dialog会失效，不能直接在这初始化
            // var supplierViewer = new Viewer(document.getElementById('SupplierEditForm'),{
            //     // url:'data-original',
            //     show: function() {
            //         supplierViewer.update();
            //     }
            // });
            var supplierViewer;
            function previewImg(){
                if(supplierViewer){
                    supplierViewer.update();
                }else{//这里进行初始化
                    supplierViewer = new Viewer(document.getElementById('SupplierEditForm'),{
                        // url:'data-original',
                        show: function() {
                            supplierViewer.update();
                        }
                    });
                }
            }
            function updatePreviewImg(){//新增和删除图片后，必须重新初始化
                // new Viewer(document.getElementById('SupplierEditForm:'+id));
                if(supplierViewer){
                    supplierViewer.update();
                }else{//这里进行初始化
                    supplierViewer = new Viewer(document.getElementById('SupplierEditForm'),{
                        // url:'data-original',
                        show: function() {
                            supplierViewer.update();
                        }
                    });
                }
            }
            function  handleToSubmit(xhr,status,args) {
                if(args.spType){
                    $('#SupplierEditForm\\:wxs').addClass("ui-state-error");
                }else{
                   // handleSubmit(args, 'SupplierEditDlg');
                    PF('SupplierEditDialog').hide();
                }
