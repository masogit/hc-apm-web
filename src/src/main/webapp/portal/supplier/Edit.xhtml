<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <!--设备档案  修改 供应商信息-->
        <p:dialog id="SupplierEditDlg" width="1000" height="600" class="modiSupplyDlg" widgetVar="SupplierEditDialog" modal="true" resizable="false" draggable="true" appendTo="@this" header="#{supplierController.CRUDActionName} #{msg.Supplier}" >
            <h:form id="SupplierEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{supplierController.selected != null}">
                        <h:panelGroup>
                            <label class="label">#{msg.name}*</label>
                            <p:inputText id="name" value="#{supplierController.selected.name}"  required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.city}</label>
                            <p:inputText id="city" value="#{supplierController.selected.city}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.address}</label>
                            <p:inputText id="address" value="#{supplierController.selected.address}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zipcode}</label>
                            <p:inputText id="zipcode" value="#{supplierController.selected.zipcode}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.contactor}</label>
                            <p:inputText id="contactor" value="#{supplierController.selected.contactor}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.tel}</label>
                            <p:inputText id="tel" value="#{supplierController.selected.tel}" />
                        </h:panelGroup>
                        <h:panelGroup class="test1">
                            <label  class="label">#{msg.type}*</label>
                                <h:panelGrid columns="3">
                                        <h:panelGrid columns="3">
                                        <h:panelGroup>
                                            <h:panelGrid columns="2">
                                                <p:selectBooleanCheckbox id="wxs" value="#{supplierController.maintainerT}"/>
                                                <p:outputLabel  value="#{msg.maitanance} " />
                                            </h:panelGrid>
                                        </h:panelGroup>
                                    <h:panelGroup>
                                        <h:panelGrid columns="2">
                                            <p:selectBooleanCheckbox   value="#{supplierController.manufacturerT}"/>
                                            <p:outputLabel value="#{msg.manufacture} " />
                                        </h:panelGrid>
                                    </h:panelGroup>
                                            <h:panelGroup >
                                                <h:panelGrid columns="2">
                                                    <p:selectBooleanCheckbox  value="#{supplierController.supplierT}"/>
                                                    <p:outputLabel value="#{msg.vendor} " />
                                                </h:panelGrid>
                                            </h:panelGroup>
                                        </h:panelGrid>
                                </h:panelGrid>
                        </h:panelGroup>

                    </p:panelGrid>
                    <h:panelGroup>

                        <p:fieldset legend="附件上传"><!--供应商的附件上传-->
                            <h:panelGroup >
                                <p:dataList id="pictureList" class="pictureListCls" value="#{supplierController.attachements}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                    <f:facet name="header">#{fieldMsg.fieldValue('attachmentType', 10)}</f:facet>
                                    <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>
                                    <p:commandButton actionListener="#{supplierController.removeAttachmentById(fileitem.id)}" update="@(.pictureListCls)" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>
                                </p:dataList>
                                <p:fileUpload id="type1" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{supplierController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                              multiple="true"  sizeLimit="100000000"  update="pictureList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                            </h:panelGroup>


                        </p:fieldset>
                    </h:panelGroup>
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{supplierController.saveSubmit}" value="#{msg.Save}" update=":SupplierListForm:datalist :growl" icon="ui-icon-check" oncomplete="handleToSubmit(xhr, status, args)"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('SupplierEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <script>
function  handleToSubmit(xhr,status,args) {
    if(args.spType){
        $('#SupplierEditForm\\:wxs').addClass("ui-state-error");
    }else{
       // handleSubmit(args, 'SupplierEditDlg');
        PF('SupplierEditDialog').hide();
    }
}

        </script>
    </ui:composition>
</html>
