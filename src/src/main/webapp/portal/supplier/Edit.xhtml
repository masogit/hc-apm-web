            <p:commandButton validateClient="true" actionListener="#{supplierController.saveSubmit}" value="#{msg.Save}" update="supplierTab:SupplierListForm:datalist :growl" icon="ui-icon-check" oncomplete="handleToSubmit(xhr, status, args)"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('SupplierEditDialog').hide()"/>
        </h:form>
        <p:dialog id="addContactPersonDlg" widgetVar="addContactPersonDlg" modal="true" width="800"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.Add}#{msg.vendor}#{msg.contactPerson}">
            <h:form id="addContactPersonForm" >
                <h:panelGroup id="display">
                    <p:panelGrid columns="6" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.type}*</label>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{supplierController.selected.maintainerT}">
                            <p:selectBooleanCheckbox label="#{msg.maintainer}" value="#{supplierController.supplierContactPerson.maintainerT}"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{supplierController.selected.manufacturerT}">
                            <p:selectBooleanCheckbox label="#{msg.manufacturer}" value="#{supplierController.supplierContactPerson.manufacturerT}"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{supplierController.selected.supplierT}">
                            <p:selectBooleanCheckbox label="#{msg.supplier}" value="#{supplierController.supplierContactPerson.supplierT}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.contactor}</label>
                            <p:inputText value="#{supplierController.supplierContactPerson.name}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.contactInformation}</label>
                            <p:inputText value="#{supplierController.supplierContactPerson.tel}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.city}</label>
                            <p:inputText value="#{supplierController.supplierContactPerson.city}" />
                        </h:panelGroup>
                    </p:panelGrid>
                    <h:panelGroup>
                        <p:commandButton id="saveButton" immediate="false" validateClient="true" actionListener="#{supplierController.saveContactPerson()}" value="#{msg.Save}"
                                         update="supplierTab:SupplierEditForm:contactorList :growl" icon="ui-icon-check" oncomplete="handleContactPersonToSubmit(xhr, status, args)"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('addContactPersonDlg').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </p:dialog>
    <script>
        var supplierViewer;
        function previewImg(){
            if(supplierViewer){
                supplierViewer.update();
            }else{
                supplierViewer = new Viewer(document.getElementById('SupplierEditForm'),{
                    show: function() {
                        supplierViewer.update();
                    }
                });
            }
        }
        function updatePreviewImg(){
            if(supplierViewer){
                supplierViewer.update();
            }else{
                supplierViewer = new Viewer(document.getElementById('SupplierEditForm'),{
                    show: function() {
                        supplierViewer.update();
                    }
                });
            }
        }
        function  handleToSubmit(xhr,status,args) {
            if(args.spType){
                $('#SupplierEditForm\\:wxs').addClass("ui-state-error");
            }else{
                PF('SupplierEditDialog').hide();
            }
        }
        function  handleContactPersonToSubmit(xhr,status,args) {
            if(args.spType){
                $('#SupplierEditForm\\:wxs').addClass("ui-state-error");
            }else{
                PF('addContactPersonDlg').hide();
            }
        }
    </script>
</ui:composition>
