<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="SupplierEvaluationEditDlg" width="1000" height="600" class="modiSupplyDlg" widgetVar="SupplierEvaluationEditDialog" modal="true" resizable="false" draggable="true" appendTo="@this" header="#{msg.SupplierEvaluation}" >
            <h:form id="SupplierEvaluationEditForm">
                <p:fieldset legend="供应商评价基本信息">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{supplierEvaluationController.selected != null}">
                        <h:panelGroup>
                            <label class="label">#{msg.SupplierName}*</label>
                            <p:inputText id="name" value="#{supplierEvaluationController.selected.name}"  required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.zkbHistory_type}</label>
                            <p:inputText id="city" value="#{supplierEvaluationController.selected.supplierType}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class ="label">#{msg.assetGroup}</label>
                            <p:selectOneMenu value="#{supplierEvaluationController.selected.assetGroup}"  required="false" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.ContractNumber_xlsx}</label>
                            <p:inputText id="zipcode" value="#{supplierEvaluationController.selected.contractNo}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.feedback}</label>
                            <p:inputText id="contactor" value="#{supplierEvaluationController.selected.evaluation}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.ConfigItemDesc}</label>
                            <p:inputText id="tel" value="#{supplierEvaluationController.selected.remark}" />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:commandButton validateClient="true" actionListener="#{supplierEvaluationController.save}" value="#{msg.Save}" update=":SupplierEvaluationListForm:datalist :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'SupplierEvaluationEditDialog');"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('SupplierEvaluationEditDialog').hide()"/>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
