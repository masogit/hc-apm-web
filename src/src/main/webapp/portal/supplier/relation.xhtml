<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <div class="ui-g-12 card">
        <h:form>
            <p:commandButton id="VenderCompanyLoginButton" actionListener="#{supplierController.onShowQrCode}" value="供应商注册" title="供应商注册" update=":growl supplierTab:VenderCompanyLoginUrlDlg" oncomplete="PF('VenderCompanyLoginUrlDialog').show()"/>
        </h:form>
        <h:form id="VenderCompanyForm">
            <p:dataTable id="datalist1" value="#{venderCompanyController.lazyModel}" var="item" widgetVar="varDataList1"
                         selectionMode="single" selection="#{venderCompanyController.selected}" stickyHeader=""
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500">
                <p:ajax event="rowSelect" update="supplierTab:VenderCompanyDetailForm"/>
                <p:ajax event="filter" listener="#{venderCompanyController.onFilter}" oncomplete="rc();"/>
                <p:column headerText="#{msg.name}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.name}"/>
                </p:column>
                <p:column headerText="法人" sortBy="#{item.corporate}" filterBy="#{item.corporate}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.corporate}"/>
                </p:column>
                <p:column headerText="负责人姓名" sortBy="#{item.projectDockerName}" filterBy="#{item.projectDockerName}"
                          filterMatchMode="LIKE">
                    <h:outputText value="#{item.projectDockerName}"/>
                </p:column>
                <p:column headerText="#{msg.type}" sortBy="#{item.supplierType}" filterBy="#{item.supplierType}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu value="#{venderCompanyController.supplierType}" onchange="PF('varDataList1').filter()" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}"  noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('supplierType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{venderCompanyController.getType(item)}"/>
                </p:column>
                <p:column headerText="#{msg.city}" sortBy="#{item.city}" filterBy="#{item.city}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.city}"/>
                </p:column>
                <p:column headerText="状态" filterBy="#{item.relation}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu value="#{venderCompanyController.relation}" onchange="PF('varDataList1').filter()" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}"  noSelectionOption="true" />
                            <f:selectItem itemLabel="未关联" itemValue="false" />
                            <f:selectItem itemLabel="已关联" itemValue="true" />
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{item.relation ? '已关联' : '未关联'}"/>
                </p:column>
<!--                <f:facet name="{Toolbar}">-->
<!--                    <p:commandButton id="createButton" icon="ui-icon-plus" title="加入供应商" actionListener="#{venderCompanyController.prepareEdit}" update="supplierTab:SupplierRelationDlg" oncomplete="PF('SupplierRelationDialog').show()" disabled="#{empty venderCompanyController.selected}" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_SUPPLIER_EDIT')}"/>-->
<!--                </f:facet>-->
            </p:dataTable>
        </h:form>
        <ui:include src="relationSupplier.xhtml"/>
        <ui:include src="VenderCompanyDetail.xhtml"/>
        <p:dialog id="VenderCompanyLoginUrlDlg" widgetVar="VenderCompanyLoginUrlDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="供应商登录地址" >
            <h:form id="viewUrlForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                    <h:panelGroup>
                        <span class="label" id="VenderCompanyLoginUrl">#{venderCompanyController.getVenderCompanyLoginUrl()}</span>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton value="一键复制" onclick="copyText()" oncomplete="PF('VenderCompanyLoginUrlDialog').hide()"/>
            </h:form>
        </p:dialog>
    </div>
</ui:composition>
</html>
