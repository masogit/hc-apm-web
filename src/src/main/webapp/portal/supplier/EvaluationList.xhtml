<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <script type="text/javascript" src="#{wechatUtilService.getContextPath()}/resources/js/jquery.jplayer.min.js"/>
        <script type="text/javascript" src="https://unpkg.com/viewerjs@1.9.0/dist/viewer.min.js"></script>
        <script type="text/javascript">
            function handleAssetGroupChange(selection) {
                var ct = document.getElementById('AssetAchievementsForm:datalist:assetGroupSeconday_input');
                if (ct) {
                    ct.value = '';
                }
                PF('varDataList').filter();
            }
        </script>
        <link rel="stylesheet" href="https://unpkg.com/viewerjs@1.9.0/dist/viewer.min.css"/>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.SupplierEvaluation}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="SupplierEvaluationListForm">
                    <p:dataTable id="datalist" value="#{supplierEvaluationController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{supplierEvaluationController.selected}" stickyHeader=""
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="createButton editButton deleteButton"/>
                        <p:ajax event="filter" listener="#{supplierEvaluationController.onFilter}" oncomplete="rc();"/>

                        <p:column headerText="#{msg.SupplierRealName}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbHistory_type}" sortBy="#{item.supplierType}" filterBy="#{item.supplierType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.supplierType}"/>
                        </p:column>
                        <p:column  headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup', item.assetGroup)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="handleAssetGroupChange()"  autoWidth="false" style="max-width: 150px;" height="300" value="#{supplierEvaluationController.assetGroup}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    <p:ajax update="@(.assetGroupChange)" />
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.ContractNumber_xlsx}" sortBy="#{item.contractNo}" filterBy="#{item.contractNo}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.contractNo}"/>
                        </p:column>
                        <p:column headerText="#{msg.feedback}" sortBy="#{item.evaluation}" filterBy="#{item.evaluation}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.evaluation}"/>
                        </p:column>
                        <p:column headerText="#{msg.ConfigItemDesc}" sortBy="#{item.remark}" filterBy="#{item.remark}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" title="#{msg.Create}" actionListener="#{supplierEvaluationController.prepareCreate}" update=":SupplierEvaluationEditDlg" oncomplete="PF('SupplierEvaluationEditDialog').show()"/>
                            <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{supplierEvaluationController.prepareEdit}" update=":SupplierEvaluationEditDlg @(.modiSupplyDlg)" oncomplete="PF('SupplierEvaluationEditDialog').show()" disabled="#{empty supplierEvaluationController.selected}"/>
                            <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{supplierEvaluationController.delete()}" update="datalist" disabled="#{empty supplierEvaluationController.selected}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                    <p:remoteCommand name="rc" update="datalist:createButton datalist:editButton datalist:deleteButton" immediate="true"/>
                </h:form>

                <ui:include src="EvaluationEdit.xhtml"/>
            </div>
        </div>

        <script>
            //<![CDATA[
            function updateSelectAllCheckBoxPending() {
                var checkboxlist = $(".selectCheckBoxPending");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#pendingApprovalSupplierUserForm\\:datalist\\:selectCheckBoxHeaderPending_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeaderPending")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeaderPending")[0].children[1].classList.remove("ui-state-active");
                }
            }

            function updateSelectAllCheckBoxApproved() {
                var checkboxlist = $(".selectCheckBoxApproved");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#approvedSupplierUserForm\\:datalist\\:selectCheckBoxHeaderApproved_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeaderApproved")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeaderApproved")[0].children[1].classList.remove("ui-state-active");
                }
            }
            //]]>
        </script>

    </ui:define>

</ui:composition>
