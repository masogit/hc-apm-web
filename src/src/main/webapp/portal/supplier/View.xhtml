<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="供应商详细信息"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="SupplierDetilForm" rendered="#{supplierController.selected != null}">
                    <p:fieldset legend="供应商基本信息">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{supplierController.selected != null}">
                            <h:panelGroup>
                                <label class="label">#{msg.name}*</label>
                                <p:inputText readonly="true" id="name" value="#{supplierController.selected.name}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.city}</label>
                                <p:inputText readonly="true" id="city" value="#{supplierController.selected.city}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.address}</label>
                                <p:inputText readonly="true" id="address" value="#{supplierController.selected.address}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.zipcode}</label>
                                <p:inputText readonly="true" id="zipcode" value="#{supplierController.selected.zipcode}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.contactor}</label>
                                <p:inputText readonly="true" id="contactor" value="#{supplierController.selected.contactor}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.contactInformation}</label>
                                <p:inputText readonly="true" id="tel" value="#{supplierController.selected.tel}" />
                            </h:panelGroup>
                            <h:panelGroup rendered="#{supplierController.activeSupplierCertificateManage()}">
                                <label class="label">#{msg.ProductionLicenseExpireDate}</label>
                                <p:inputText id="productionLicenseExpireDate" value="#{supplierController.selected.productionLicenseExpireDate}" readonly="true">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{supplierController.activeSupplierCertificateManage()}">
                                <label class="label">#{msg.BusinessLicenseExpireDate}</label>
                                <p:inputText id="businessLicenseExpireDate" value="#{supplierController.selected.businessLicenseExpireDate}" readonly="true">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{supplierController.activeSupplierCertificateManage()}">
                                <label class="label">#{msg.RegistrationCertificateExpireDate}</label>
                                <p:inputText id="registrationCertificateExpireDate" value="#{supplierController.selected.registrationCertificateExpireDate}" readonly="true">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{supplierController.activeSupplierCertificateManage()}">
                                <label class="label">#{msg.PowerOfAttorneyExpireDate}</label>
                                <p:inputText id="powerOfAttorneyExpireDate" value="#{supplierController.selected.powerOfAttorneyExpireDate}" readonly="true">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </p:inputText>
                            </h:panelGroup>
                        </p:panelGrid>
                        <p:panelGrid columns="6" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.type}*</label>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:selectBooleanCheckbox id="wxs" label="#{msg.maitanance}" value="#{supplierController.selected.maintainerT}" disabled="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:selectBooleanCheckbox label="#{msg.manufacture}" value="#{supplierController.selected.manufacturerT}" disabled="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:selectBooleanCheckbox label="#{msg.vendor}" value="#{supplierController.selected.supplierT}" disabled="true"/>
                            </h:panelGroup>
                        </p:panelGrid>
                        <h:panelGroup >
                            <p:dataTable id="contactorList" var="item" value="#{supplierController.contactPersonList}" emptyMessage="#{msg.noRecordFound}"
                                         paginator="true" paginatorPosition="top" rows="5" widgetVar="varPmOrderListgl"
                                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}">
                                <p:ajax event="rowSelect" />
                                <p:column headerText="#{msg.type}">
                                    <h:outputText value="#{item.type}"/>
                                </p:column>
                                <p:column headerText="#{msg.contactor}">
                                    <h:outputText value="#{item.name}"/>
                                </p:column>
                                <p:column headerText="#{msg.contactInformation}">
                                    <h:outputText value="#{item.tel}"/>
                                </p:column>
                                <p:column headerText="#{msg.city}">
                                    <h:outputText value="#{item.city}"/>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                        <h:panelGroup >
                            <p:dataList id="pictureList" value="#{supplierController.getAttachList('1')}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">#{msg.AttachmentUpload}</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                <p:commandLink rendered="#{fileitem.showPreview()}" actionListener="#{supplierController.preViewed(fileitem.objectStorageId)}" update="previewedDlg" oncomplete="PF('previewedDlg').show()">
                                    <img src="#{not empty fileitem.compressObjectId ? fileDownloadService.getImgBase64(fileitem.compressObjectId) : ''}"
                                         style="width:60px; height:40px;margin: 0px 5px 0px 5px;"/>
                                </p:commandLink>
                            </p:dataList>
                        </h:panelGroup>
                    </p:fieldset>
                    <p:fieldset legend="供应商基本信息">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{supplierController.selected != null}">
                            <h:panelGroup>
                                <label class="label">供应商编码</label>
                                <p:inputText readonly="true" value="#{supplierController.selected.supplierCode}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">供应商名称缩写</label>
                                <p:inputText readonly="true" value="#{supplierController.selected.supplierAbbreviation}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">企业法人</label>
                                <p:inputText readonly="true" value="#{supplierController.selected.corporate}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">统一社会信用编码</label>
                                <p:inputText readonly="true" value="#{supplierController.selected.creditCode}" />
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="营业执照信息">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{supplierController.selected != null}">
                            <h:panelGroup>
                                <label class="label">营业执照编码</label>
                                <p:inputText readonly="true" value="#{supplierController.selected.licenseCode}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">营业执照截止日期</label>
                                <p:calendar timeZone="GMT+8" id="licenseEndDate" pattern="yyyy/MM/dd" value="#{supplierController.selected.licenseEndDate}" required="false" requiredMessage="营业执照截止日期 #{msg.ValidationRequire}" showOn="button" disabled="false" Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">业务范围</label>
                                <p:inputText readonly="true" value="#{supplierController.selected.licenseScope}" />
                            </h:panelGroup>
                        </p:panelGrid>
                        <h:panelGroup >
                            <p:dataList id="licenseAttachements" value="#{supplierController.getAttachList('License')}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">营业执照附件</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                <p:commandLink rendered="#{fileitem.showPreview()}" actionListener="#{supplierController.preViewed(fileitem.objectStorageId)}" update="previewedDlg" oncomplete="PF('previewedDlg').show()">
                                    <img src="#{not empty fileitem.compressObjectId ? fileDownloadService.getImgBase64(fileitem.compressObjectId) : ''}"
                                         style="width:60px; height:40px;margin: 0px 5px 0px 5px;"/>
                                </p:commandLink>
                            </p:dataList>
                        </h:panelGroup>
                    </p:fieldset>
                    <p:fieldset legend="医疗器械经营许可证/医疗器械经营备案凭证信息">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{supplierController.selected != null}">
                            <h:panelGroup>
                                <label class="label">许可证编码</label>
                                <p:inputText readonly="true" value="#{supplierController.selected.permitCode}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">许可证截止日期</label>
                                <p:calendar timeZone="GMT+8" id="permitEndDate" pattern="yyyy/MM/dd" value="#{supplierController.selected.permitEndDate}" required="false" requiredMessage="营业许可证截止日期 #{msg.ValidationRequire}" showOn="button" disabled="false" Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                        </p:panelGrid>
                        <h:panelGroup >
                            <p:dataList id="permitAttachements" value="#{supplierController.getAttachList('Permit')}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">许可证附件</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                <p:commandLink rendered="#{fileitem.showPreview()}" actionListener="#{supplierController.preViewed(fileitem.objectStorageId)}" update="previewedDlg" oncomplete="PF('previewedDlg').show()">
                                    <img src="#{not empty fileitem.compressObjectId ? fileDownloadService.getImgBase64(fileitem.compressObjectId) : ''}"
                                         style="width:60px; height:40px;margin: 0px 5px 0px 5px;"/>
                                </p:commandLink>
                            </p:dataList>
                        </h:panelGroup>
                        <br/>
                        <h:panelGroup >
                            <p:dataList id="afterServiceAttachements" value="#{supplierController.getAttachList('AfterService')}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">售后服务承诺附件</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                <p:commandLink rendered="#{fileitem.showPreview()}" actionListener="#{supplierController.preViewed(fileitem.objectStorageId)}" update="previewedDlg" oncomplete="PF('previewedDlg').show()">
                                    <img src="#{not empty fileitem.compressObjectId ? fileDownloadService.getImgBase64(fileitem.compressObjectId) : ''}"
                                         style="width:60px; height:40px;margin: 0px 5px 0px 5px;"/>
                                </p:commandLink>
                            </p:dataList>
                        </h:panelGroup>
                        <br/>
                        <h:panelGroup >
                            <p:dataList id="authorizationAttachements" value="#{supplierController.getAttachList('Authorization')}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}" >
                                <f:facet name="header">授权书附件</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                <p:commandLink rendered="#{fileitem.showPreview()}" actionListener="#{supplierController.preViewed(fileitem.objectStorageId)}" update="previewedDlg" oncomplete="PF('previewedDlg').show()">
                                    <img src="#{not empty fileitem.compressObjectId ? fileDownloadService.getImgBase64(fileitem.compressObjectId) : ''}"
                                         style="width:60px; height:40px;margin: 0px 5px 0px 5px;"/>
                                </p:commandLink>
                            </p:dataList>
                        </h:panelGroup>
                    </p:fieldset>
                    <!--                <p:fieldset legend="生产许可证信息" rendered="#{supplierController.activeSupplier()}">-->
                    <p:fieldset legend="生产许可证信息">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{supplierController.selected != null}">
                            <h:panelGroup>
                                <label class="label">生产许可证编码</label>
                                <p:inputText readonly="true" value="#{supplierController.selected.manufacturingPermitCode}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">生产许可证截止日期</label>
                                <p:calendar timeZone="GMT+8" id="manufacturingPermitEndDate" pattern="yyyy/MM/dd" value="#{supplierController.selected.manufacturingPermitEndDate}" required="false" requiredMessage="生产许可证截止日期 #{msg.ValidationRequire}" showOn="button" disabled="false" Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                        </p:panelGrid>
                        <h:panelGroup >
                            <p:dataList id="manufacturingPermitAttachements" value="#{supplierController.getAttachList('ManufacturingPermit')}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">生产许可证附件</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                <p:commandLink rendered="#{fileitem.showPreview()}" actionListener="#{supplierController.preViewed(fileitem.objectStorageId)}" update="previewedDlg" oncomplete="PF('previewedDlg').show()">
                                    <img src="#{not empty fileitem.compressObjectId ? fileDownloadService.getImgBase64(fileitem.compressObjectId) : ''}"
                                         style="width:60px; height:40px;margin: 0px 5px 0px 5px;"/>
                                </p:commandLink>
                            </p:dataList>
                        </h:panelGroup>
                    </p:fieldset>
                    <!--                <p:fieldset legend="产品注册证信息" rendered="#{supplierController.activeSupplier()}">-->
                    <p:fieldset legend="产品注册证信息">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{supplierController.selected != null}">
                            <h:panelGroup>
                                <label class="label">产品注册证编号</label>
                                <p:inputText readonly="true" value="#{supplierController.selected.productRegistrationCode}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">产品注册证开始日期</label>
                                <p:calendar timeZone="GMT+8" id="productRegistrationStartDate" pattern="yyyy/MM/dd" value="#{supplierController.selected.productRegistrationStartDate}" required="false" requiredMessage="产品注册证开始日期 #{msg.ValidationRequire}" showOn="button" disabled="false" Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">产品注册证结束日期</label>
                                <p:calendar timeZone="GMT+8" id="productRegistrationEndDate" pattern="yyyy/MM/dd" value="#{supplierController.selected.productRegistrationEndDate}" required="false" requiredMessage="产品注册证结束日期 #{msg.ValidationRequire}" showOn="button" disabled="false" Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                        </p:panelGrid>
                        <h:panelGroup >
                            <p:dataList id="productRegistrationAttachements" value="#{supplierController.getAttachList('ProductRegistration')}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">产品注册证附件</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                <p:commandLink rendered="#{fileitem.showPreview()}" actionListener="#{supplierController.preViewed(fileitem.objectStorageId)}" update="previewedDlg" oncomplete="PF('previewedDlg').show()">
                                    <img src="#{not empty fileitem.compressObjectId ? fileDownloadService.getImgBase64(fileitem.compressObjectId) : ''}"
                                         style="width:60px; height:40px;margin: 0px 5px 0px 5px;"/>
                                </p:commandLink>
                            </p:dataList>
                        </h:panelGroup>
                    </p:fieldset>
                    <ui:include src="/portal/preview/view.xhtml" />
                </h:form>

                <ui:include src="VenderCompanyDetail.xhtml" />
            </div>
        </div>
    </ui:define>
</ui:composition>
