<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<div class="ui-g">
    <div class="ui-g-12 card">
        <h:form enctype="multipart/form-data">
            <p:fieldset legend="#{msg.BatchImportSupplierData}" id="uploaderContainer">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                    <p:fileUpload fileUploadListener="#{supplierController.handleExcelUpload}" mode="advanced"
                                  dragDropSupport="false" multiple="false" auto="true"
                                  invalidFileMessage="#{msg.OnlyXlsXlsxSupported}"
                                  invalidSizeMessage="#{msg.FileSizeLimit5MB}"
                                  sizeLimit="5242880" allowTypes="/(\.|\/)(xls|xlsx)$/"
                                  update="supplierTab:dataListForm supplierTab:SupplierListForm"
                                  label="#{msg.ImportFromExcel}" cancelLabel="#{msg.Cancel}" uploadLabel="#{msg.ConfirmUpload}"/>
                    <p:growl id="messages" showDetail="true"/>
                </p:panelGrid>
                <h:panelGroup>
                    <p>#{msg.Instructions}</p>
                    <p>1. <p:commandLink value="#{msg.downloadTemplateFile}" ajax="false" actionListener="#{fileDownloadService.exportTemplateFile('SUPPLIER')}" styleClass="p-mr-2"/> </p>
                    <p>2. #{msg.FillInSupplierData}</p>
                    <p>3. #{msg.UploadFileToImport}</p>
                </h:panelGroup>
            </p:fieldset>
        </h:form>
    </div>

    <div class="ui-g-12 card">
        <h:form id="dataListForm">
            <p:fieldset legend="#{msg.FailedImportData}">
                <p:dataTable id="datalist" rendered="#{not empty supplierController.noFoundList}" value="#{supplierController.noFoundList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="20,50,100,500">
                    <p:column headerText="#{msg.ExcelRowNumber}">
                        <h:outputText value="#{item.excelIndex}" />
                    </p:column>
                    <p:column headerText="#{msg.Name}">
                        <h:outputText value="#极简风格{item.name}" />
                    </p:column>
                    <p:column headerText="#{msg.City}">
                        <h:outputText value="#{item.city}" />
                    </p:column>
                    <p:column headerText="#{msg.Address}">
                        <h:outputText value="#{item.address}" />
                    </p:column>
                    <p:column headerText="#{msg.Zipcode}">
                        <h:outputText value="#{item.zipcode}" />
                    </p:column>
                    <p:column headerText="#{msg.contactor}">
                        <h:outputText value="#{item.contactor}" />
                    </p:column>
                    <p:column headerText="#{msg.ContactInfo}">
                        <h:outputText value="#{item.tel}">
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.Type}">
                        <h:outputText value="#{supplierController.getGongyingshangLeixing(item)}">
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.ImportErrorInfo}">
                        <h:outputText value="#{item.errorInfo}" />
                    </p:column>
                    <f:facet name="{Toolbar}">
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xlsx" target="datalist" fileName="Supplier_export"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </p:fieldset>
        </h:form>
    </div>
</div>
</html>
