<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <div class="ui-g">
        <div class="ui-g-12 card">
            <h:form enctype="multipart/form-data" rendered="#{measureFromExcelController.customRoleAuth.authSearch}">
                <p:fieldset  legend="批量导入供应商数据" id="uploaderContainer">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <p:fileUpload fileUploadListener="#{supplierController.handleExcelUpload}" mode="advanced"
                                      dragDropSupport="false" multiple="false" auto="true"
                                      invalidFileMessage="只支持xls或xlsx格式的文件"
                                      invalidSizeMessage="文件大小不得超过5M"
                                      sizeLimit="5242880" allowTypes="/(\.|\/)(xls|xlsx)$/"
                                      update="supplierTab:SupplierListForm"
                                      label="从Excel导入" cancelLabel="取消" uploadLabel="确认上传"/>
                        <p:growl id="messages" showDetail="true"/>
                    </p:panelGrid>
                    <h:panelGroup>
                        <p>说明</p>
                        <p>1. 请先导出数据</p>
                        <p>2. 文件中填入要导入的供应商数据</p>
                        <p>3. 上传文件进行导入</p>
                    </h:panelGroup>
                </p:fieldset>
            </h:form>
        </div>
    </div>
</html>
