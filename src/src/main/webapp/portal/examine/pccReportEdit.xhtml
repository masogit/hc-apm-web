
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">
	<ui:define name="content">
		<div class="ui-g clearfix">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="PCC 探头检测报告编辑" />
			</div>
			<div class="ui-g-12 card">
				<h:form id="idFormPcc">
					<p:accordionPanel multiple="true" id="panelPcc" rendered="#{pccExamineReportEditController.selected!=null}">
						<p:tab title="首页">
							<ui:include src="/portal/asset/searchDiv.xhtml"></ui:include>
						</p:tab>
						<p:tab title="内容">
							<h:panelGrid columns="1" cellpadding="10">
								<h:panelGroup>
									<p:dataGrid id="pictureList" value="#{pccExamineReportEditController.listStreamedContent}" var="fileitem" columns="4"
										emptyMessage="#{msg.noRecordFound}">
										<p:column headerText="#{fileitem.name}">
											<p:graphicImage value="#{fileitem}" width="120" height="80" stream="false" />
										</p:column>
										<!-- <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link> -->
										<!-- <p:commandButton actionListener="#{pccExamineReportEditController.removeAttachmentById(fileitem.id)}" update="pictureList" icon="ui-icon-clear"
                                    title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning" />
                                </p:commandButton> -->
									</p:dataGrid>
									<p:fileUpload id="idPictureUpload" fileUploadListener="#{pccExamineReportEditController.handleFileUpload}" dragDropSupport="false" style="width:100%"
										multiple="true" sizeLimit="100000000" update="@parent:pictureList" auto="false" invalidFileMessage="#{msg.InvalidPictureFileType}"
										invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="上传图片" />
								</h:panelGroup>
							</h:panelGrid>
							<h:panelGrid columns="4" cellpadding="10">
								<h:panelGroup>
									<label>报告名称</label>
									<p:inputText value="#{pccExamineReportEditController.selected.name}"></p:inputText>
								</h:panelGroup>
								<h:panelGroup>
									<label>探头型号</label>
									<p:inputText value="#{pccExamineReportEditController.selected.functionType}"></p:inputText>
								</h:panelGroup>
								<h:panelGroup>
									<label>探头序列号</label>
									<p:inputText value="#{pccExamineReportEditController.selected.num}"></p:inputText>
								</h:panelGroup>
								<h:panelGroup>
									<label>探头生产日期</label>
									<p:calendar timeZone="GMT+8" id="endTime" value="#{pccExamineReportEditController.selected.manufactDate}" pattern="yyyy/MM/dd" required="false"
										requiredMessage="生产日期 #{msg.ValidationRequire}" showOn="button" showButtonPanel="true" navigator="true" mask="true" />
								</h:panelGroup>
							</h:panelGrid>
							<p:panel header="外观检查及漏电流测试" style="margin-bottom:20px">
								<h:panelGrid columns="4" cellpadding="10">
									<h:panelGroup>
										<label>线缆</label>
										<p:selectManyMenu value="#{pccExamineReportEditController.selectLineStatus}" var="t" required="false" showCheckbox="true"
											converter="apmDropDownConverter" requiredMessage="线缆 #{msg.ValidationRequire}">
											<f:selectItems value="#{pccExamineReportEditController.fetchLineStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}" />
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectManyMenu>
									</h:panelGroup>
									<h:panelGroup>
										<label>透镜</label>
										<p:selectManyMenu value="#{pccExamineReportEditController.selectMirrorStatus}" var="t" required="false" showCheckbox="true"
											converter="apmDropDownConverter" requiredMessage="透镜 #{msg.ValidationRequire}">
											<f:selectItems value="#{pccExamineReportEditController.fetchMirrorStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}" />
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectManyMenu>
									</h:panelGroup>
									<h:panelGroup>
										<label>外壳</label>
										<p:selectManyMenu value="#{pccExamineReportEditController.selectShellStatus}" var="t" required="false" showCheckbox="true"
											converter="apmDropDownConverter" requiredMessage="外壳 #{msg.ValidationRequire}">
											<f:selectItems value="#{pccExamineReportEditController.fetchShellStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}" />
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectManyMenu>
									</h:panelGroup>
									<h:panelGroup>
										<label>连接器</label>
										<p:selectManyMenu value="#{pccExamineReportEditController.selectLinkerStatus}" var="t" required="false" showCheckbox="true"
											converter="apmDropDownConverter" requiredMessage="连接器 #{msg.ValidationRequire}">
											<f:selectItems value="#{pccExamineReportEditController.fetchLinkerStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}" />
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectManyMenu>
									</h:panelGroup>
									<h:panelGroup>
										<label>油囊</label>
										<p:selectManyMenu value="#{pccExamineReportEditController.selectOilStatus}" var="t" required="false" showCheckbox="true"
											converter="apmDropDownConverter" requiredMessage="油囊 #{msg.ValidationRequire}">
											<f:selectItems value="#{pccExamineReportEditController.fetchOilStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}" />
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectManyMenu>
									</h:panelGroup>
									<h:panelGroup>
										<label>提示</label>
										<p:selectOneMenu value="#{pccExamineReportEditController.selectTipStatus}" var="t" required="false" converter="apmDropDownConverter"
											requiredMessage="提示 #{msg.ValidationRequire}">
											<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
											<f:selectItems value="#{pccExamineReportEditController.fetchTipStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}">

											</f:selectItems>
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectOneMenu>
									</h:panelGroup>
									<h:panelGroup>
										<label>探头漏电流检测结果</label>
										<p:selectOneMenu value="#{pccExamineReportEditController.selectElectricLeakageStatus}" var="t" required="false" converter="apmDropDownConverter"
											requiredMessage="探头漏电流检测结果 #{msg.ValidationRequire}">
											<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
											<f:selectItems value="#{pccExamineReportEditController.fetchElectricLeakageStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}">

											</f:selectItems>
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectOneMenu>
									</h:panelGroup>
								</h:panelGrid>
							</p:panel>
							<p:panel header="FIRST CALL检测" style="margin-bottom:20px">
								<h:panelGrid columns="2" cellpadding="10">
									<h:panelGroup>
										<label>所见</label>
										<p:selectManyMenu value="#{pccExamineReportEditController.selectFirstSeenStatus}" var="t" required="false" showCheckbox="true"
											converter="apmDropDownConverter" requiredMessage="所见 #{msg.ValidationRequire}">
											<f:selectItems value="#{pccExamineReportEditController.fetchFirstSeenStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}" />
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectManyMenu>
									</h:panelGroup>
									<h:panelGroup>
										<label>提示</label>
										<p:selectOneMenu value="#{pccExamineReportEditController.selectFirstTipStatus}" var="t" required="false" converter="apmDropDownConverter"
											requiredMessage="提示 #{msg.ValidationRequire}">
											<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
											<f:selectItems value="#{pccExamineReportEditController.fetchFirstTipStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}">

											</f:selectItems>
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectOneMenu>
									</h:panelGroup>
								</h:panelGrid>
							</p:panel>
							<p:panel header="检测结果及建议" style="margin-bottom:20px">
								<h:panelGrid columns="3" cellpadding="10">
									<h:panelGroup>
										<label>检测结果</label>
										<p:selectManyMenu value="#{pccExamineReportEditController.selectResultStatus}" var="t" required="false" showCheckbox="true"
											converter="apmDropDownConverter" requiredMessage="检测结果 #{msg.ValidationRequire}">
											<f:selectItems value="#{pccExamineReportEditController.fetchResultStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}" />
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectManyMenu>
									</h:panelGroup>
									<h:panelGroup>
										<label>建议</label>
										<p:selectOneMenu value="#{pccExamineReportEditController.selectRecommandStatus}" var="t" required="false" converter="apmDropDownConverter"
											requiredMessage="建议 #{msg.ValidationRequire}">
											<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
											<f:selectItems value="#{pccExamineReportEditController.fetchRecommandStatus()}" var="item" itemLabel="#{item.label}" itemValue="#{item}">

											</f:selectItems>
											<p:column>
												<h:outputText value="#{t.label}" />
											</p:column>
										</p:selectOneMenu>
									</h:panelGroup>
									<h:panelGroup>
										<label> 备注： </label>
										<p:inputTextarea value="#{pccExamineReportEditController.selected.comment}"></p:inputTextarea>
									</h:panelGroup>
								</h:panelGrid>
							</p:panel>
						</p:tab>
						<!-- <p:tab title="尾页">
                    <h:form id="formPccEidtTail">
                        <h:panelGrid columns="1" cellpadding="10">
                            <p:graphicImage value="#{pccExamineReportEditController.tailAttach}" width="120" height="80" stream="false"
                                rendered="#{not empty pccExamineReportEditController.tailAttach}" />
                            <p:fileUpload id="idTailUpload" fileUploadListener="#{pccExamineReportEditController.handleTailUpload}" dragDropSupport="false" style="width:100%"
                                multiple="true" sizeLimit="100000000" update="@parent" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}"
                                invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="上传图片" />
                        </h:panelGrid>
                    </h:form>
                </p:tab> -->
					</p:accordionPanel>
					<p:commandButton id="saveButtonId" validateClient="true" partialSubmit=":panelPcc" value="#{msg.Save}" process="@parent" update=":growl,generateButtonId"
						icon="ui-icon-check" actionListener="#{pccExamineReportEditController.save}" />
					<p:commandButton id="generateButtonId" validateClient="true" partialSubmit=":panelPcc" value="生成报告" process="@parent" update=":growl,downloadButtonId"
						icon="ui-icon-check" actionListener="#{pccExamineReportEditController.generateReport}" disabled="#{empty pccExamineReportEditController.selected.id}" />
					<p:commandButton id="downloadButtonId" validateClient="true" value="下载报告" update=":growl" icon="ui-icon-check" ajax="false"
						disabled="#{empty pccExamineReportEditController.selected.reportStorageId}">
						<p:fileDownload value="#{pccExamineReportEditController.reportFile}" />
					</p:commandButton>
					<p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-cancel" action="pccReportList.xhtml?faces-redirect=true" />
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
