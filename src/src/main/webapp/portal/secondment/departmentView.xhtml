<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:composition >


        <h:form id="departmentDetailForm"   >
            <h:panelGroup rendered="#{not empty departmentSecondmentController.selected}">
                <div class="card">
                    <p:dataTable var="node" value="#{departmentSecondmentController.process}">
                        <p:column headerText="节点名称">
                            <h:outputText value="#{node.nodeName}" />
                        </p:column>

                        <p:column headerText="确认人">
                            <h:outputText value="#{node.operator}" />
                        </p:column>

                        <p:column headerText="时间">
                            <h:outputText value="#{node.operatorTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:panelGroup>
        </h:form>
    </ui:composition>
</html>
