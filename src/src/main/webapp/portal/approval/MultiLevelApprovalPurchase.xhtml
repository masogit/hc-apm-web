<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition >
    <p:dialog  class="MultiLevelApprovalClaimPurDialog" id="MultiLevelApprovalClaimPurDialog"
              widgetVar="MultiLevelApprovalClaimPurDialog" modal="true" height="600"
              width="1200"  resizable="false" draggable="true" appendTo="@(body)" header="审批" >
        <h:form id="approvalDialogPurForm" class="tform" rendered="#{multiLevelApprovalController.businessTypeFlag eq 17 }">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <!--节点详情-->
                <h:panelGroup>
                    <label class="label">审批节点记录</label>
                    <p:dataTable id="accessList" class="accessList" value="#{multiLevelApprovalController.multiLevelApprovals}" var="item" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                        <p:column headerText="审批单号">
                            <h:outputText value="#{item.approvalNumber}"/>
                        </p:column>
                        <p:column headerText="业务单号">
                            <h:outputText value="#{item.businessNumber}"/>
                        </p:column>
                        <p:column headerText="业务类型" >
                            <h:outputText value="#{multiLevelApprovalGlobalController.getBusinessType(item)}"/>
                        </p:column>
                        <p:column headerText="实际审批人">
                            <h:outputText value="#{item.actualApproverName}"/>
                        </p:column>
                        <p:column headerText="审批级别">
                            <h:outputText value="#{item.approvalLevel}级审批人"/>
                        </p:column>
                        <p:column headerText="审批状态">
                            <h:outputText value="#{multiLevelApprovalGlobalController.getApprovalStatus(item.approvalStatus)}"/>
                        </p:column>
                        <p:column headerText="审批节点状态">
                            <h:outputText value="#{multiLevelApprovalGlobalController.getApprovalNodeStatus(item.approvalNodeStatus)}"/>
                        </p:column>
                        <p:column headerText="审批时间"  >
                            <h:outputText value="#{item.actualApproverDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>
                <p:fieldset legend="采购单详情" >
                    <p:panelGrid id="editPanel" columns="4" layout="grid"
                                 styleClass="ui-panelgrid-blank form-group"
                                 rendered="#{multiLevelApprovalController.purchaseOrderInfo != null}">
                        <h:panelGroup>
                            <p:outputLabel class="label">采购编号</p:outputLabel>
                            <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.purchaseNum}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel class="label">采购数量</p:outputLabel>
                            <h:outputText id="purchaseQuantity" value="#{multiLevelApprovalController.purchaseOrderInfo.purchaseQuantity}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel class="label">采购金额</p:outputLabel>
                            <h:outputText id="totalPrice"  value="#{multiLevelApprovalController.purchaseOrderInfo.totalPrice}">
                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                            </h:outputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel class="label">操作人</p:outputLabel>
                            <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.operator.name}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel class="label">采购开始时间</p:outputLabel>
                            <p:calendar mode="popup" showOn="button" disabled="true"
                                        value="#{multiLevelApprovalController.purchaseOrderInfo.startDate}"
                                        timeZone="#{userContextService.getTimeZone()}"
                                        pattern="#{userContextService.timeFormat()}"
                                        locale="#{userContextService.getCalendarLocale()}"
                                        showButtonPanel="true" required="true"  requiredMessage="采购开始时间 #{msg.ValidationRequire}"
                                        navigator="true" mask="true">
                                <p:ajax event="dateSelect" update="@this"/>
                            </p:calendar>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel class="label">采购截止时间</p:outputLabel>
                            <p:calendar mode="popup" showOn="button" disabled="true"
                                        value="#{multiLevelApprovalController.purchaseOrderInfo.endDate}"
                                        timeZone="#{userContextService.getTimeZone()}"
                                        pattern="#{userContextService.timeFormat()}"
                                        locale="#{userContextService.getCalendarLocale()}"
                                        showButtonPanel="true" required="true" requiredMessage="采购截止时间 #{msg.ValidationRequire}"
                                        navigator="true" mask="true">
                                <p:ajax event="dateSelect" update="@this"/>
                            </p:calendar>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:fieldset legend="申购单信息" id="applicationDetail"  rendered="#{multiLevelApprovalController.approvaLevelPurchase() ne 3 }">
                        <p:dataTable id="budgetApplicationlist" value="#{multiLevelApprovalController.applicationDetailConfirm()}"
                                     var="item" widgetVar="varbudgetAssetDatalist" lazy="true" paginator="true"
                                     selectionMode="single" disabledSelection="true"
                                     paginatorPosition="top" paginatorAlwaysVisible="true" rowKey="#{item.id}"
                                     sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5">
                            <p:ajax event="rowSelect" />
                            <p:column headerText="申请科室">
                                <h:outputText value="#{item.budgetApplication.applicationDept.name}"/>
                            </p:column>
                            <p:column headerText="申请编号">
                                <h:outputText value="#{item.applicationNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.EquipmentName}">
                                <h:outputText value="#{item.applicationAssetName}"/>
                            </p:column>
                            <p:column headerText="推荐品牌">
                                <h:outputText value="#{item.recommendedBrand}"/>
                            </p:column>
                            <p:column headerText="规格">
                                <h:outputText value="#{item.standards}"/>
                            </p:column>
                            <p:column headerText="型号">
                                <h:outputText value="#{item.model}"/>
                            </p:column>
                            <p:column headerText="设备品类">
                                <h:outputText value="#{item.applicationAssetCategory}"/>
                            </p:column>
                            <p:column headerText="数量">
                                <h:outputText value="#{item.applicationQuantity}"/>
                            </p:column>
                            <p:column headerText="单位">
                                <h:outputText value="#{item.unit}"/>
                            </p:column>
                            <p:column headerText="预算单价">
                                <h:outputText value="#{item.applicationPrice}"/>
                            </p:column>
                            <p:column headerText="预算总价">
                                <h:outputText value="#{item.applicationAmount}"/>
                            </p:column>
                        </p:dataTable>
                    </p:fieldset>
                    <br/>
                    <p:fieldset legend="申购单信息确认" id="applicationDetailConfirm"  rendered="#{multiLevelApprovalController.approvaLevelPurchase() eq 1 or multiLevelApprovalController.approvaLevelPurchase() eq 2}">
                        <p:dataTable id="budgetApplicationConfirmlist" value="#{multiLevelApprovalController.applicationDetailConfirm()}"
                                     var="item" widgetVar="varbudgetAssetDatalist" lazy="true" paginator="true"
                                     selectionMode="single" disabledSelection="true"
                                     paginatorPosition="top" paginatorAlwaysVisible="true" rowKey="#{item.id}"
                                     sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5">
                            <p:ajax event="rowSelect" />
                            <p:column headerText="申请科室">
                                <h:outputText value="#{item.budgetApplication.applicationDept.name}"/>
                            </p:column>
                            <p:column headerText="申请编号">
                                <h:outputText value="#{item.applicationNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.EquipmentName}">
                                <h:outputText value="#{item.applicationAssetName}"/>
                            </p:column>
                            <p:column headerText="使用科室">
                                <h:outputText value="#{item.confirmApplicationDeptName}"/>
                            </p:column>
                            <p:column headerText="设备品目">
                                <h:outputText value="#{item.confirmEquipmentCategory}"/>
                            </p:column>
                            <p:column headerText="数量（台）">
                                <h:outputText value="#{item.confirmQuantity}"/>
                            </p:column>
                            <p:column headerText="预算（万元）">
                                <h:outputText value="#{item.confirmPrice}"/>
                            </p:column>
                            <p:column headerText="国产占比（国家财政部）">
                                <h:outputText value="#{item.confirmNationalFinance}"/>
                            </p:column>
                            <p:column headerText="国产占比（省财政部）">
                                <h:outputText value="#{item.confirmProvincialFinance}"/>
                            </p:column>
                            <p:column headerText="科室意见（是否进口）" >
                                <h:outputText value="#{fieldMsg.fieldValue('budgetApplicationT_F', item.confirmImport)}"/>
                            </p:column>
                            <p:column headerText="公告及信息收集情况">
                                <h:outputText value="#{item.confirmNotice}"/>
                            </p:column>
                            <p:column headerText="主要功能和配置">
                                <h:outputText value="#{item.confirmMajorFunction}"/>
                            </p:column>
                            <p:column headerText="主要参数和要求">
                                <h:outputText value="#{item.confirmParameters}"/>
                            </p:column>
                            <p:column headerText="意向品牌">
                                <h:outputText value="#{item.confirmBrand}"/>
                            </p:column>
                            <p:column headerText="拦标价（万元）">
                                <h:outputText value="#{item.confirmMaximumPrice}"/>
                            </p:column>
                            <p:column headerText="备注">
                                <h:outputText value="#{item.confirmRemark}"/>
                            </p:column>
                            <p:column headerText="#{msg.Operation}" style="width: 150px" exportable="false" rendered="#{multiLevelApprovalController.approvaLevelPurchase() eq 1}">
                                <p:commandButton value="信息确认"   oncomplete="PF('BudgetApplicationDialogConfirm').show()" process="@this" update="BudgetApplicationDialogConfirm"
                                                 actionListener="#{multiLevelApprovalController.prepareConfirm(item.id)}"/>
                            </p:column>
                        </p:dataTable>
                    </p:fieldset>
                    <p:fieldset legend="过会信息" id="purchaseInfoMeeting" rendered="#{multiLevelApprovalController.approvaLevelPurchase() eq 2}" >
                        <p:panelGrid id="meetingPanel" columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">专业工程师意见<span style="color: red">*</span></label>
                                <p:inputText  value="#{multiLevelApprovalController.purchaseOrderInfo.meetingEngineerOpinion}" required="true" requiredMessage="专业工程师意见 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">医院现有品牌<span style="color: red">*</span></label>
                                <p:inputText  value="#{multiLevelApprovalController.purchaseOrderInfo.meetingExistingBrands}" required="true" requiredMessage="医院现有品牌 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">收费项目<span style="color: red">*</span></label>
                                <p:inputText  value="#{multiLevelApprovalController.purchaseOrderInfo.meetingFeeItems}" required="true" requiredMessage="收费项目 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">耗材或试剂说明<span style="color: red">*</span></label>
                                <p:inputText  value="#{multiLevelApprovalController.purchaseOrderInfo.meetingConsumableDescription}" required="true" requiredMessage="耗材或试剂说明 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">器械科审核意见<span style="color: red">*</span></label>
                                <p:inputText  value="#{multiLevelApprovalController.purchaseOrderInfo.meetingEquipmentDeptOpin}" required="true" requiredMessage="器械科审核意见 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">拦标价（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber  inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2"  required="true" requiredMessage="拦标价（万元） #{msg.ValidationRequire}"
                                                value="#{multiLevelApprovalController.purchaseOrderInfo.meetingMaximumPrice}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">是否采购进口产品<span style="color: red">*</span></label>
                                <p:selectOneMenu value="#{multiLevelApprovalController.purchaseOrderInfo.meetingPurchasingImports}"  required="true" requiredMessage="是否采购进口产品 #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('budgetApplicationT_F')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">过会日期</p:outputLabel>
                                <p:calendar mode="popup" showOn="button"
                                            value="#{multiLevelApprovalController.purchaseOrderInfo.meetingDate}"
                                            timeZone="#{userContextService.getTimeZone()}"
                                            pattern="#{userContextService.timeFormat()}"
                                            locale="#{userContextService.getCalendarLocale()}"
                                            showButtonPanel="true" required="true"  requiredMessage="过会日期 #{msg.ValidationRequire}"
                                            navigator="true" mask="true">
                                    <p:ajax event="dateSelect" update="@this"/>
                                </p:calendar>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">备注<span style="color: red">*</span></label>
                                <p:inputText  value="#{multiLevelApprovalController.purchaseOrderInfo.meetingRemarks}" required="true" requiredMessage="备注 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <ui:include src="budget/ProcurementOffice.xhtml"/>
                </p:fieldset>
            </p:panelGrid>
            <!-- 采购管理 -->
            <h:panelGroup>
                <p:commandButton validateClient="true" actionListener="#{multiLevelApprovalController.purchaseInfoSubmit()}"
                                 value="提交" id="saveButton" style="width: 80px"
                                 update=":approvalList :ItemDetailViewForm :growl"
                                 oncomplete="handleSubmit(args, 'MultiLevelApprovalClaimPurDialog');"/>
                <p:commandButton value="取消"   style="width: 80px" immediate="true" icon="ui-icon-arrow-back" oncomplete="handleSubmit(args, 'MultiLevelApprovalClaimPurDialog');" />
            </h:panelGroup>
        </h:form>
    </p:dialog>
    <!--确认信息弹窗-->
    <div class="ui-g-12 card">
        <ui:include src="budget/ConfirmField.xhtml"/>
    </div>
</ui:composition>
</html>
