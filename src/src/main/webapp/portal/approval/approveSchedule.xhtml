<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <style>
            div.ui-panelgrid-cell > label + div.ui-selectonemenu {
                min-width: 75px !important;
                max-width: 90%;
            }
        </style>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="核心组审核进度查看"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="UserAccountListForm">
                    <p:dataTable id="approvalList" value="#{approveScheduleController.lazyModel}"
                                 var="item"
                                 widgetVar="approvalList"
                                 lazy="true" paginator="true" paginatorPosition="both"
                                 paginatorAlwaysVisible="true"
                                 selectionMode="single" selection="#{approveScheduleController.selected}"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending"
                                 sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">


                        <p:ajax event="filter" listener="#{approveScheduleController.onFilter}" update=":ItemDetailViewForm" />
                        <p:ajax event="rowSelect" listener="#{approveScheduleController.onRowSelect}" update=":ItemDetailViewForm"/>

                        <p:column headerText="工单号" sortBy="#{item.srNum}" filterBy="#{item.srNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.srNum}"/>
                        </p:column>
                        <p:column headerText="备件提交人" sortBy="#{item.partsBy}" filterBy="#{item.partsBy}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.partsBy}"/>
                        </p:column>
                        <p:column headerText="备件总金额" sortBy="#{item.partsPrice}">
                            <h:outputText value="#{item.partsPrice}"/>
                        </p:column>
                        <p:column headerText="总审批进度" sortBy="#{item.approveStatus}">
                            <h:outputText  value="#{approveScheduleController.getApproveStatusName(item.approveStatus)}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="approveScheduleDetail.xhtml"/>

            </div>
        </div>
    </ui:define>
</ui:composition>
