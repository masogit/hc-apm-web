<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <h:panelGroup rendered="#{multiLevelApprovalController.businessTypeFlag == 13}">
        <label class="label">不良事件</label>
        <p:dataTable id="adverseEventsList" value="#{multiLevelApprovalController.primaryApprovalData}"
                     var="item"
                     widgetVar="varDataList"
                     lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">

            <p:column headerText="#{msg.workOrderNum}" >
                <h:outputText value="#{item.workOrderNum}"/>
            </p:column>
            <p:column headerText="#{msg.reporterName}" >
                <h:outputText value="#{item.reporterName}"/>
            </p:column>
            <p:column headerText="#{msg.reportDate}" >
                <h:outputText value="#{item.reportDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.department}" >
                <h:outputText value="#{adverseEventManagementController.reporterList(item.department)}"/>
            </p:column>

            <p:column headerText="#{msg.occurredPlace}" >
                <h:outputText value="#{item.occurredPlace}"/>
            </p:column>

            <p:column headerText="#{msg.assetName}" >
                <h:outputText value="#{item.assetName}"/>
            </p:column>
            <p:column headerText="#{msg.deviceNum}" >
                <h:outputText value="#{item.deviceNum}"/>
            </p:column>
            <p:column headerText="#{msg.productName}" >
                <h:outputText value="#{item.productName}"/>
            </p:column>
        </p:dataTable>
    </h:panelGroup>

</ui:composition>
</html>
