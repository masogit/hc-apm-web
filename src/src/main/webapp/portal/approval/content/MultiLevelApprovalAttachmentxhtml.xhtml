<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <h:outputStylesheet>
        .ui-accordion-header{
            background-color: #cacaca!important;
        }
        .ui-state-active{
            background-color: #5180ce!important;
        }
    </h:outputStylesheet>
<h:panelGroup>
     <label class="label">附件</label>
        <p:accordionPanel id="accordion" activeIndex="false" multiple="false" var="o" value="#{multiLevelApprovalController.multiLevelApprovals}">
            <p:tab title="#{o.approvalLevel}级审批" >
                <p:dataGrid id="contractListData" var="fileitem" value="#{o.attachments}" columns="5" layout="grid">
                    <f:facet name="header">#{msg.Attachment}信息</f:facet>
                    <p:panel  style="text-align:center">
                        <h:panelGrid columns="1" style="width:100%" >
                            <p:ajax  event="click" update="previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(multiLevelApprovalController,fileitem.objectStorageId)}"/>
                            <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>

                        </h:panelGrid>
                        <p:commandLink validateClient="false" immediate="true" process="@this"
                                       value="#{fileitem.objectName}"
                                       action="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                    </p:panel>
                </p:dataGrid>
            </p:tab>
        </p:accordionPanel>
    </h:panelGroup>
    <h:panelGroup rendered="#{!multiLevelApprovalListController.display}">
                <p:dataList id="contractList" value="#{multiLevelApprovalController.getAttachList()}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                    <f:facet name="header">#{msg.Attachment}</f:facet>
                    <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                    <p:commandButton actionListener="#{multiLevelApprovalController.removeAttachmentById(fileitem.id)}" update="contractList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                    </p:commandButton>
                </p:dataList>
                <p:fileUpload id="File" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/"
                              mode="advanced" dragDropSupport="false" style="width:100%" fileUploadListener="#{multiLevelApprovalController.handleFileUpload}"
                              multiple="true"  sizeLimit="500000000"  update="contractList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}500M" label="#{msg.Add}"/>

    </h:panelGroup>
</ui:composition>
</html>
