<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <h:panelGroup rendered="#{multiLevelApprovalController.businessTypeFlag == 8}">
        <!--<label class="label">审批内容</label>
        <br/>-->
        <label class="label">工单</label>
        <p:dataTable id="pmOrderLists" value="#{multiLevelApprovalController.primaryApprovalData}"
                     var="item"
                     widgetVar="varDataList"
                     lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">

            <p:column headerText="#{msg.hospitalId}">
                <h:outputText value="#{v2PmOrderController.getSiteOrgName(item.siteUID)}"/>
            </p:column>

            <p:column headerText="#{msg.assetName}" >
                <h:outputText value="#{item.assetInfo.name}"/>
            </p:column>

            <p:column headerText="#{msg.ManufacturerSerialNumber}" >
                <h:outputText value="#{item.assetInfo.serialNum}"/>
            </p:column>
            <p:column headerText="#{msg.EquipmentIDHospital}" >
                <h:outputText value="#{item.assetInfo.departNum}"/>
            </p:column>
            <p:column headerText="#{msg.MeasurementGrade}" >
                <h:outputText value="#{item.ruleLevel}"/>
            </p:column>
            <p:column headerText="#{msg.MaintenanceType}" >
                <h:outputText value="#{fieldMsg.fieldValue('pmType',item.pmType)}"/>
            </p:column>
            <!--所属科室-->
            <p:column headerText="#{msg.clinicalDeptName}"  width="100">
                <h:outputText value="#{v2PmOrderController.getOrgInfoByUid(item.clinicalDeptId).name}"/>
            </p:column>
            <!--<p:column headerText="保养周期">
                <h:outputText value="#{v2PmOrderController.getRulePm(item).period}"/>
            </p:column>-->

            <p:column headerText="#{msg.Creator}">
                <h:outputText value="#{item.creatorName}"/>
            </p:column>

            <p:column headerText="#{msg.Owner}" >
                <h:outputText value="#{item.getOwnerName()}"/>
            </p:column>


            <p:column headerText="保养编号">
                <h:outputText value="#{item.pmNum}"/>
            </p:column>
            <p:column headerText="#{msg.CurrentProcessingStep}" >
                <h:outputText value="#{item.currentStepName}"/>
            </p:column>
            <p:column headerText="#{msg.intExtType}">
                <h:outputText value="#{fieldMsg.fieldValue('intExtType',item.intExtType)}"/>
            </p:column>
            <p:column headerText="#{msg.PlannedCompletionTime}" >
                <h:outputText value="#{item.planTime}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd"/>
                </h:outputText>
            </p:column>
        </p:dataTable>
        <br/>
        <label class="label">备件</label>
        <p:dataTable id="pmOrderDetailList" value="#{multiLevelApprovalController.secondaryApprovalData}"
                     var="detailItem"
                     widgetVar="varDataList"
                     lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
            <p:column headerText="#{msg.PartName}">
                <h:outputText value="#{detailItem.parts}"/>
            </p:column>

            <p:column headerText="#{msg.accessoryQuantity}">
                <h:outputText value="#{detailItem.apartsQuantity}"/>
            </p:column>
            <p:column headerText="#{msg.EstimatedUnitPriceRMB}">
                <h:outputText value="#{detailItem.partsPrice}">
                    <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.ContractPriceRMB}">
                <h:outputText value="#{detailItem.closedPrice}">
                    <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                </h:outputText>

            </p:column>
            <p:column headerText="#{msg.ApprovalStatus}">
                <h:outputText value="#{empty detailItem.approved? msg.Unapproved: detailItem.approved? msg.Pass:msg.Fail}" />
            </p:column>
            <p:column headerText="#{msg.PartType}">
                <h:outputText value="#{fieldMsg.fieldValue('partsType', detailItem.partsType)}" />
            </p:column>
            <p:column headerText="#{msg.InvoiceNumber}">
                <h:outputText value="#{detailItem.invoiceNum}" />
            </p:column>
            <p:column headerText="#{msg.SerialNumber}">
                <h:outputText value="#{detailItem.serialNum}" />
            </p:column>
            <p:column headerText="#{msg.WarrantyDate}">
                <h:outputText value="#{detailItem.warrantyDate}">
                    <f:convertDateTime pattern="yyyy-MM-dd"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.ApplyTime}">
                <h:outputText value="#{detailItem.applyTime}">
                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.EstimatedArrivalTime}">
                <h:outputText value="#{detailItem.estimatedArriveTime}">
                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.ArrivalConfirmationTime}">
                <h:outputText value="#{detailItem.arrivedTime}">
                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.Arrival}">
                <h:outputText value="#{detailItem.arrived?msg.Arrived:msg.NonArrived}" rendered="#{detailItem.id ne '000'}"/>
            </p:column>
        </p:dataTable>
    </h:panelGroup>

</ui:composition>
</html>
