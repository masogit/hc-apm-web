<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>

    <h:panelGroup rendered="#{multiLevelApprovalController.businessTypeFlag == 7}">
        <!--<label class="label">审批内容</label>
        <br/>-->
        <h:panelGroup>
            <label class="label">工单</label>
            <p:dataTable id="workOrderLists" value="#{multiLevelApprovalController.primaryApprovalData}"
                         var="item"
                         widgetVar="varDataList"
                         lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">

                <p:column width="70" styleClass="textCenter"  headerText="#{msg.casePriority}" >
                    <h:outputText value="#{item.serviceRequest.casePriority}" class="priorityItem priorityItem#{item.serviceRequest.casePriority}"/>
                </p:column>

                <p:column headerText="#{msg.assetName}" >
                    <p:link ajax="false"  outcome="#{urlEncryptController.encodeUrlParam('/portal/asset/info/AssetDetail.xhtml?faces-redirect=true&amp;actionName=View&amp;terminate=true&amp;selectedid='.concat(item.assetInfo.uid))}" styleClass="p-mr-2"   target="_blank"   >
                         <h:outputText value="#{item.assetInfo.name}"/>
                    </p:link>
                </p:column>
                <p:column headerText="#{msg.ManufacturerSerialNumber}" >
                    <h:outputText value="#{item.assetInfo.serialNum}"/>
                </p:column>
                <p:column headerText="#{msg.departNum}" >
                    <h:outputText value="#{item.assetInfo.departNum}"/>
                </p:column>
                <p:column headerText="#{msg.functionType}" >
                    <h:outputText value="#{item.assetInfo.functionType}"/>
                </p:column>

                <p:column headerText="#{msg.clinicalDeptName}" >
                    <h:outputText value="#{workOrderMgrController.getOrgInfoByUid(item.serviceRequest.fromDeptUID).name}"/>
                </p:column>

                <p:column headerText="#{msg.srNum}" >
                    <p:link ajax="false"  outcome="#{urlEncryptController.encodeUrlParam('/portal/woMgr/workOrderList?faces-redirect=true&amp;queryIndex=12&amp;actionName=View&amp;selectedid='.concat(item.id))}" styleClass="p-mr-2"   target="_blank"   >
                        <h:outputText value="#{item.serviceRequest.srNum}"/>
                    </p:link>
                </p:column>
                <p:column headerText="#{msg.requestorName}" >
                    <h:outputText value="#{item.serviceRequest.requestorName}"/>
                </p:column>
                <p:column headerText="#{msg.requestTime}" >
                    <h:outputText value="#{item.serviceRequest.requestTime}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}"/>
                    </h:outputText>
                </p:column>

                <p:column width="90" headerText="#{msg.intExtType}">
                    <h:outputText value="#{fieldMsg.fieldValue('intExtType',item.intExtType)}"/>
                </p:column>
                <p:column headerText="#{msg.requestReason}">
                    <h:outputText value="#{workOrderMgrController.getRequestReasonInShort(item.serviceRequest.requestReason)}"/>
                </p:column>
                <p:column headerText="#{msg.patProblems}">
                    <h:outputText value="#{item.patProblems}"/>
                </p:column>
                <p:column headerText="#{msg.patActions}">
                    <h:outputText value="#{item.patActions}"/>
                </p:column>
            </p:dataTable>
        </h:panelGroup>
        <br/>
        <h:panelGroup>
            <label class="label">备件</label>
            <p:dataTable id="detailist"
                         value="#{multiLevelApprovalController.secondaryApprovalData}"
                         var="detailItem"
                         widgetVar="varDataList"
                         lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">

                <p:column headerText="#{msg.accessory}#{msg.Name}">
                    <h:outputText value="#{detailItem.parts}" />
                </p:column>
                <p:column headerText="#{msg.accessoryQuantity}">
                    <h:outputText value="#{detailItem.apartsQuantity}" />
                </p:column>
                <p:column headerText="#{msg.EstimatedUnitPriceRMB}">
                    <h:outputText value="#{detailItem.partsPrice}">
                        <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.ContractPriceRMB}">
                    <h:outputText value="#{detailItem.closedPrice}">
                        <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.ApprovalStatus}">
                    <h:outputText value="#{detailItem.approvalStatusName}" />
                </p:column>
                <p:column headerText="#{msg.PartType}">
                    <h:outputText value="#{fieldMsg.fieldValue('partsType', detailItem.partsType)}" />
                </p:column>
                <p:column headerText="#{msg.assetsDashboardclm2}">
                    <h:outputText value="#{detailItem.serialNum}" />
                </p:column>
                <p:column headerText="#{msg.invoiceNum}">
                    <h:outputText value="#{detailItem.invoiceNum}" />
                </p:column>
                <p:column headerText="#{msg.qualityexpirdate}">
                    <h:outputText value="#{detailItem.warrantyDate}">
                        <f:convertDateTime pattern="yyyy-MM-dd"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.ApplyTime}">
                    <h:outputText value="#{detailItem.applyTime}">
                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.EstimatedArrivalTime}">
                    <h:outputText value="#{detailItem.estimatedArriveTime}">
                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.ArrivalConfirmationTime}">
                    <h:outputText value="#{detailItem.arrivedTime}">
                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.arrival}">
                    <h:outputText value="#{detailItem.arrived?msg.Arrived:msg.NonArrived}" />
                </p:column>
            </p:dataTable>
        </h:panelGroup>
        <c:forEach var="item" items="#{multiLevelApprovalController.workParts}">
            <h:panelGroup >
                <p:dataGrid id="pictureListWorkParts" var="fileitem" value="#{item.get(item.keySet().toArray()[0])}" columns="5" layout="grid">
                    <f:facet name="header">#{item.keySet().toArray()[0]}--#{msg.Attachment}信息</f:facet>
                    <p:panel  style="text-align:center">
                        <h:panelGrid columns="1" style="width:100%" >
                            <p:ajax disabled="#{!preViewerBean.isPreview(fileitem)}"  event="click" update="previewedDlg" oncomplete="PF('previewedDlg').show()"  listener="#{preViewerBean.onServerEvent(multiLevelApprovalController,fileitem.objectStorageId)}"/>
<!--                            <p:graphicImage value="#{fileitem.objectType.toLowerCase().contains('image')?fileDownloadService.getFile(fileitem.objectStorageId):(fileitem.getObjectName().toLowerCase().contains('pdf')?'/images/icons/pdf.png':fileitem.getObjectName().toLowerCase().contains('docx')?'/images/icons/word.png':'/images/icons/file.png')}"  height="80" width="100" stream="false"/>-->
                            <img src="#{fileDownloadService.getImgBase64(fileitem.objectStorageId)}" style="width:100px; height:80px;margin: 0px 5px 0px 5px;"/>
                        </h:panelGrid>
                        <p:commandLink validateClient="false" immediate="true" process="@this"
                                       value="#{fileitem.objectName}"
                                       action="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                    </p:panel>
                </p:dataGrid>
            </h:panelGroup>
        </c:forEach>
    </h:panelGroup>

</ui:composition>
</html>
