<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <h:panelGroup rendered="#{multiLevelApprovalController.businessTypeFlag == 16 or multiLevelApprovalController.businessTypeFlag == 19}">
        <label class="label">设备转科审核内容</label>
        <p:dataTable id="assetDepartmentConvertList" value="#{multiLevelApprovalController.primaryApprovalData}"
                     var="item"
                     widgetVar="varDataList"
                     lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">

            <p:column headerText="设备名称" >
                <h:outputText value="#{item.assetName}"/>
            </p:column>
            <p:column headerText="设备型号" >
                <h:outputText value="#{item.functionType}"/>
            </p:column>
            <p:column headerText="设备编号" >
                <h:outputText value="#{item.assetDeptNum}"/>
            </p:column>
            <p:column headerText="资产编号" >
                <h:outputText value="#{item.financingNum}"/>
            </p:column>

            <p:column headerText="制造商序列号" >
                <h:outputText value="#{item.assetSerialNum}"/>
            </p:column>

<!--            <p:column headerText="所属科室" >-->
<!--                <h:outputText value="#{item.clinicalDeptName}"/>-->
<!--            </p:column>-->
            <p:column headerText="二维码">
                <h:outputText value="#{item.assetQrCode}"/>
            </p:column>
            <p:column headerText="转出科室">
                <h:outputText value="#{item.outDeptName}"/>
            </p:column>
            <p:column headerText="转出人">
                <h:outputText value="#{item.transferOutName}"/>
            </p:column>
            <p:column headerText="转入科室">
                <h:outputText value="#{item.inDeptName}"/>
            </p:column>
            <p:column headerText="转入人">
                <h:outputText value="#{item.transferInName}"/>
            </p:column>

            <p:column headerText="转出时间">
                <h:outputText value="#{item.transferOutAt}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd  HH:mm:ss"/>
                </h:outputText>
            </p:column>

            <p:column headerText="转入时间">
                <h:outputText value="#{item.transferInAt}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd  HH:mm:ss"/>
                </h:outputText>
            </p:column>
        </p:dataTable>
    </h:panelGroup>

</ui:composition>
</html>
