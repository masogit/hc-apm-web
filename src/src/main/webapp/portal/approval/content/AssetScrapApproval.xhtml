<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <h:panelGroup rendered="#{multiLevelApprovalController.businessTypeFlag == 15}">
        <label class="label">报废审核内容</label>
        <p:dataTable id="assetScrapList" value="#{multiLevelApprovalController.primaryApprovalData}"
                     var="item"
                     widgetVar="varDataList"
                     lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">

            <p:column headerText="设备名称" >
                <h:outputText value="#{item.assetInfo.name}"/>
            </p:column>
            <p:column headerText="设备型号" >
                <h:outputText value="#{item.assetInfo.functionType}"/>
            </p:column>
            <p:column headerText="设备编号" >
                <h:outputText value="#{item.assetInfo.departNum}"/>
            </p:column>
            <p:column headerText="资产编号" >
                <h:outputText value="#{item.assetInfo.financingNum}"/>
            </p:column>

            <p:column headerText="制造商序列号" >
                <h:outputText value="#{item.assetInfo.serialNum}"/>
            </p:column>

            <p:column headerText="所属科室" >
                <h:outputText value="#{item.assetInfo.clinicalDeptName}"/>
            </p:column>
            <p:column headerText="当前状态" >
                <h:outputText value="#{fieldMsg.fieldValue('assetStatus',item.assetInfo.status)}"/>
            </p:column>
            <p:column headerText="采购价格" >
                <h:outputText value="#{item.assetInfo.purchasePrice}"/>
            </p:column>
            <p:column headerText="出厂日期" >
                <h:outputText value="#{item.assetInfo.manufactDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd"/>
                </h:outputText>
            </p:column>
            <p:column headerText="使用年限" >
                <h:outputText value="#{item.assetInfo.lifecycle}"/>
            </p:column>
            <p:column headerText="启用日期" >
                <h:outputText value="#{item.assetInfo.installDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd"/>
                </h:outputText>
            </p:column>
            <p:column headerText="报废单号" >
                <h:outputText value="#{item.businessNumber}"/>
            </p:column>
            <p:column headerText="报废申请人" >
                <h:outputText value="#{item.createdBy}"/>
            </p:column>
            <p:column headerText="报废申请时间" >
                <h:outputText value="#{item.createdDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd"/>
                </h:outputText>
            </p:column>
            <p:column headerText="报废理由" >
                <h:outputText value="#{item.applyReason}"/>
            </p:column>
            <p:column headerText="鉴定意见" >
                <h:outputText value="#{item.approvalReason}"/>
            </p:column>
        </p:dataTable>
    </h:panelGroup>

</ui:composition>
</html>
