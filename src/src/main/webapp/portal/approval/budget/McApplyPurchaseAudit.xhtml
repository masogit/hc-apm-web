<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:fieldset legend="保养设备详情" rendered="#{multiLevelApprovalController.approvaLevelPurchase() eq 1 }">
        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">技术分析讨论*</label>
                <p:inputTextarea rows="6" cols="50" value="#{multiLevelApprovalController.applyPurchaseVo.techAnalysisDiscussion}" required="true"/>
            </h:panelGroup>
            <h:panelGroup >
                <label class="label">审批意见</label>
                <p:inputText  placeholder="审批意见" value="#{multiLevelApprovalController.approvalOpinion}"/>
            </h:panelGroup>
        </p:panelGrid>
    </p:fieldset>
    <p:fieldset legend="论证情况结果" rendered="#{multiLevelApprovalController.approvaLevelPurchase() eq 2 }">
        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">审批时间*</label>
                <p:calendar mode="popup" showOn="button" value="#{multiLevelApprovalController.applyPurchaseVo.meetAuditDate}"
                                timeZone="#{userContextService.getTimeZone()}"
                                pattern="#{userContextService.timeFormat14()}"
                                locale="#{userContextService.getCalendarLocale()}"
                                showButtonPanel="true"
                                navigator="true" mask="true">
                    <p:ajax event="dateSelect" update="@this"></p:ajax>
                </p:calendar>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">审批意见*</label>
                <p:inputText value="#{multiLevelApprovalController.applyPurchaseVo.meetAuditComment}" required="true" requiredMessage="审批意见不能为空！" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">论证情况结果*</label>
                <p:inputText value="#{multiLevelApprovalController.applyPurchaseVo.meetReasoningResult}" required="true" requiredMessage="论证情况结果不能为空！" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">记录人*</label>
                <p:inputText value="#{multiLevelApprovalController.applyPurchaseVo.recordPersonName}" required="true" requiredMessage="记录人不能为空！" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">备注</label>
                <p:inputText value="#{multiLevelApprovalController.applyPurchaseVo.meetAuditRemark}" required="false" requiredMessage="备注不能为空！" />
            </h:panelGroup>
        </p:panelGrid>
    </p:fieldset>
    <p:fieldset legend="采购信息确认" rendered="#{multiLevelApprovalController.approvaLevelPurchase() eq 3 }">
        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup >
                <label class="label">审批意见</label>
                <p:inputText  placeholder="审批意见" value="#{multiLevelApprovalController.approvalOpinion}"/>
            </h:panelGroup>
        </p:panelGrid>
    </p:fieldset>
</ui:composition>
</html>
