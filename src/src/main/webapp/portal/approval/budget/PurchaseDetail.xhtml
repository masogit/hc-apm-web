<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:fieldset legend="采购单详情" rendered="#{multiLevelApprovalController.businessTypeFlag eq 17 }">
        <p:panelGrid id="editPanel" columns="4" layout="grid"
                     styleClass="ui-panelgrid-blank form-group"
                     rendered="#{multiLevelApprovalController.purchaseOrderInfo != null}">
            <h:panelGroup>
                <p:outputLabel class="label">采购编号</p:outputLabel>
                <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.purchaseNum}"/>
            </h:panelGroup>
            <h:panelGroup>
                <p:outputLabel class="label">采购数量</p:outputLabel>
                <h:outputText id="purchaseQuantity" value="#{multiLevelApprovalController.purchaseOrderInfo.purchaseQuantity}"/>
            </h:panelGroup>
            <h:panelGroup>
                <p:outputLabel class="label">采购金额</p:outputLabel>
                <h:outputText id="totalPrice"  value="#{multiLevelApprovalController.purchaseOrderInfo.totalPrice}">
                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                </h:outputText>
            </h:panelGroup>
            <h:panelGroup>
                <p:outputLabel class="label">操作人</p:outputLabel>
                <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.operator.name}"/>
            </h:panelGroup>
            <h:panelGroup>
                <p:outputLabel class="label">采购开始时间<span style="color: red">*</span></p:outputLabel>
                <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.startDate}">
                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                       locale="#{userContextService.getCalendarLocale()}"
                                       pattern="#{userContextService.timeFormat()}"/>
                </h:outputText>
            </h:panelGroup>
            <h:panelGroup>
                <p:outputLabel class="label">采购截止时间<span style="color: red">*</span></p:outputLabel>
                <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.endDate}">
                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                       locale="#{userContextService.getCalendarLocale()}"
                                       pattern="#{userContextService.timeFormat()}"/>
                </h:outputText>
            </h:panelGroup>

        </p:panelGrid>
        <p:fieldset legend="申购单信息" id="applicationDetail" rendered="#{(multiLevelApprovalController.approvaLevelPurchase() ne 3) }">
            <p:dataTable id="budgetApplicationlist" value="#{multiLevelApprovalController.applicationDetailConfirm()}"
                         var="item" widgetVar="varbudgetAssetDatalist" lazy="true" paginator="true"
                         selectionMode="single" disabledSelection="true"
                         paginatorPosition="top" paginatorAlwaysVisible="true" rowKey="#{item.id}"
                         sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5">
                <p:ajax event="rowSelect" />
                <p:column headerText="申请科室">
                    <h:outputText value="#{item.budgetApplication.applicationDept.name}"/>
                </p:column>
                <p:column headerText="申请编号">
                    <h:outputText value="#{item.applicationNum}"/>
                </p:column>
                <p:column headerText="#{msg.EquipmentName}">
                    <h:outputText value="#{item.applicationAssetName}"/>
                </p:column>
                <p:column headerText="推荐品牌">
                    <h:outputText value="#{item.recommendedBrand}"/>
                </p:column>
                <p:column headerText="规格">
                    <h:outputText value="#{item.standards}"/>
                </p:column>
                <p:column headerText="型号">
                    <h:outputText value="#{item.model}"/>
                </p:column>
                <p:column headerText="设备品类">
                    <h:outputText value="#{item.applicationAssetCategory}"/>
                </p:column>
                <p:column headerText="数量">
                    <h:outputText value="#{item.applicationQuantity}"/>
                </p:column>
                <p:column headerText="单位">
                    <h:outputText value="#{item.unit}"/>
                </p:column>
                <p:column headerText="预算单价">
                    <h:outputText value="#{item.applicationPrice}"/>
                </p:column>
                <p:column headerText="预算总价">
                    <h:outputText value="#{item.applicationAmount}"/>
                </p:column>
                <p:column headerText="审批数量">
                    <h:outputText value="#{item.offlineApplicationQuantity}"/>
                </p:column>
                <p:column headerText="审批单价">
                    <h:outputText value="#{item.offlineApplicationPrice}"/>
                </p:column>
                <p:column headerText="审批总价">
                    <h:outputText value="#{item.offlineApplicationAmount}"/>
                </p:column>
            </p:dataTable>
        </p:fieldset>
        <br/>
        <!--<p:fieldset legend="申购单信息确认" id="applicationDetailConfirm"  rendered="#{(multiLevelApprovalController.approvaLevelPurchase() eq 1
        or multiLevelApprovalController.approvaLevelPurchase() eq 2) and userContextService.hasAnyRole('DeptHead,ClinicalStaff')}">-->
        <p:fieldset legend="申购单信息确认" id="applicationDetailConfirm"  rendered="#{(multiLevelApprovalController.approvaLevelPurchase() le 2) }">
             <p:dataTable id="budgetApplicationConfirmlist" value="#{multiLevelApprovalController.applicationDetailConfirm()}"
                          var="item" widgetVar="varbudgetAssetDatalist" lazy="true" paginator="true"
                          selectionMode="single" disabledSelection="true"
                          paginatorPosition="top" paginatorAlwaysVisible="true" rowKey="#{item.id}"
                          sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                          paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                          currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                          rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5">
                 <p:ajax event="rowSelect" />
                 <p:column headerText="申请科室">
                     <h:outputText value="#{item.budgetApplication.applicationDept.name}"/>
                 </p:column>
                 <p:column headerText="申请编号">
                     <h:outputText value="#{item.applicationNum}"/>
                 </p:column>
                 <p:column headerText="#{msg.EquipmentName}">
                     <h:outputText value="#{item.applicationAssetName}"/>
                 </p:column>
                 <p:column headerText="使用科室">
                     <h:outputText value="#{item.confirmApplicationDeptName}"/>
                 </p:column>
                 <p:column headerText="设备品目">
                     <h:outputText value="#{item.confirmEquipmentCategory}"/>
                 </p:column>

                 <p:column headerText="国产占比（国家财政部）">
                     <h:outputText value="#{item.confirmNationalFinance}"/>
                 </p:column>
                 <p:column headerText="国产占比（省财政部）">
                     <h:outputText value="#{item.confirmProvincialFinance}"/>
                 </p:column>
                 <p:column headerText="公告及信息收集情况">
                     <h:outputText value="#{item.confirmNotice}"/>
                 </p:column>
                 <p:column headerText="科室意见（是否进口）" >
                     <h:outputText value="#{fieldMsg.fieldValue('budgetApplicationT_F', item.confirmImport)}"/>
                 </p:column>
                 <p:column headerText="主要功能和配置">
                     <h:outputText value="#{item.confirmMajorFunction}"/>
                 </p:column>
                 <p:column headerText="主要参数和要求">
                     <h:outputText value="#{item.confirmParameters}"/>
                 </p:column>
                 <p:column headerText="意向品牌">
                     <h:outputText value="#{item.confirmBrand}"/>
                 </p:column>
                <!-- <p:column headerText="确认数量（台）">
                     <h:outputText value="#{item.confirmQuantity}"/>
                 </p:column>
                 <p:column headerText="确认预算价价">
                     <h:outputText value="#{item.confirmPrice}"/>
                 </p:column>
                 <p:column headerText="拦标价价">
                     <h:outputText value="#{item.confirmMaximumPrice}"/>
                 </p:column>-->
                 <p:column headerText="备注">
                     <h:outputText value="#{item.confirmRemark}"/>
                 </p:column>
             </p:dataTable>
         </p:fieldset>
         <br/>
          <!--<p:fieldset legend="过会信息" id="purchaseInfoMeeting" rendered="#{multiLevelApprovalController.approvaLevelPurchase() eq 2
          and userContextService.hasAnyRole('AssetStaff,AssetHead')}" >-->
<!--
        第二个条件审批通过之后才回显
-->
        <p:fieldset legend="过会信息" id="purchaseInfoMeeting" rendered="#{multiLevelApprovalController.approvaLevelPurchase() le 2 and multiLevelApprovalController.purchaseOrderInfo.meetingDate ne null}" >
             <p:fieldset legend="设备科意见">
                 <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                     <h:panelGroup>
                         <label class="label">专业工程师意见<span style="color: red">*</span></label>
                         <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.meetingEngineerOpinion}"/>
                     </h:panelGroup>
                     <h:panelGroup>
                         <label class="label">医院现有品牌<span style="color: red">*</span></label>
                         <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.meetingExistingBrands}"/>
                     </h:panelGroup>
                     <h:panelGroup>
                         <label class="label">收费项目<span style="color: red">*</span></label>
                         <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.meetingFeeItems}"/>
                     </h:panelGroup>
                     <h:panelGroup>
                         <label class="label">耗材或试剂说明<span style="color: red">*</span></label>
                         <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.meetingConsumableDescription}"/>
                     </h:panelGroup>
                     <h:panelGroup>
                         <label class="label">器械科审核意见<span style="color: red">*</span></label>
                         <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.meetingEquipmentDeptOpin}"/>
                     </h:panelGroup>
                     <h:panelGroup>
                         <label class="label">审核时间<span style="color: red">*</span></label>
                         <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.meetingApproveDate}">
                             <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                locale="#{userContextService.getCalendarLocale()}"
                                                pattern="#{userContextService.timeFormat14()}"/>
                         </h:outputText>
                     </h:panelGroup>
                     <h:panelGroup>
                         <label class="label">备注<span style="color: red">*</span></label>
                         <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.meetingRemarks}"/>
                     </h:panelGroup>
                 </p:panelGrid>

             </p:fieldset>
            <p:panelGrid id="meetingPanel" columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                <!--<h:panelGroup>
                     <p:outputLabel class="label">拦标价<span style="color: red">*</span></p:outputLabel>
                     <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.meetingMaximumPrice}">
                         <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                     </h:outputText>
                 </h:panelGroup>-->
                 <h:panelGroup>
                     <label class="label">是否采购进口产品<span style="color: red">*</span></label>
                     <h:outputText value="#{fieldMsg.fieldValue('budgetApplicationT_F', multiLevelApprovalController.purchaseOrderInfo.meetingPurchasingImports)}"/>
                 </h:panelGroup>
                 <h:panelGroup>
                     <label class="label">过会日期<span style="color: red">*</span></label>
                     <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.meetingDate}">
                         <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                            locale="#{userContextService.getCalendarLocale()}"
                                            pattern="#{userContextService.timeFormat14()}"/>
                     </h:outputText>
                 </h:panelGroup>
             </p:panelGrid>
         </p:fieldset>
        <!--
        第二个条件审批通过之后才回显
        -->
        <p:fieldset legend="采购办确认信息" id="procurementOffice" rendered="#{multiLevelApprovalController.approvaLevelPurchase() eq 3 and multiLevelApprovalController.purchaseOrderInfo.purchaseType ne null}" >
            <!--采购办确认信息可以查看的信息-->
            <p:fieldset legend="申购单信息" id="purchaseOffice"  >
                <p:dataTable id="purchaseOfficelist" value="#{multiLevelApprovalController.applicationDetailConfirm()}"
                             var="item" widgetVar="varbudgetAssetDatalist" lazy="true" paginator="true"
                             selectionMode="single" disabledSelection="true"
                             paginatorPosition="top" paginatorAlwaysVisible="true" rowKey="#{item.id}"
                             sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                             rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5">
                    <p:ajax event="rowSelect" />
                    <p:column headerText="#{msg.EquipmentName}">
                        <h:outputText value="#{item.applicationAssetName}"/>
                    </p:column>
                    <p:column headerText="数量（台）">
                        <h:outputText value="#{item.confirmQuantity}"/>
                    </p:column>
                    <p:column headerText="预算价">
                        <h:outputText value="#{item.confirmPrice}"/>
                    </p:column>
                    <p:column headerText="拦标价">
                        <h:outputText value="#{item.confirmMaximumPrice}"/>
                    </p:column>
                    <p:column headerText="设备品目">
                        <h:outputText value="#{item.confirmEquipmentCategory}"/>
                    </p:column>
                    <p:column headerText="科室意见（是否进口）" >
                        <h:outputText value="#{fieldMsg.fieldValue('budgetApplicationT_F', item.confirmImport)}"/>
                    </p:column>
                    <p:column headerText="主要功能和配置">
                        <h:outputText value="#{item.confirmMajorFunction}"/>
                    </p:column>
                    <p:column headerText="主要参数和要求">
                        <h:outputText value="#{item.confirmParameters}"/>
                    </p:column>
                    <p:column headerText="意向品牌">
                        <h:outputText value="#{item.confirmBrand}"/>
                    </p:column>
                    <p:column headerText="使用科室">
                        <h:outputText value="#{item.confirmApplicationDeptName}"/>
                    </p:column>
                </p:dataTable>
            </p:fieldset>
            <!--采购办确认信息可以查看的信息-->
            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup >
                    <label class="label">采购类型<span style="color: red">*</span></label>
                    <h:outputText value="#{fieldMsg.fieldValue('purchaseType', multiLevelApprovalController.purchaseOrderInfo.purchaseType)}"/>
                </h:panelGroup>

                <h:panelGroup >
                    <label class="label">合同开始时间</label>
                    <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.contractStartDate}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                           locale="#{userContextService.getCalendarLocale()}"
                                           pattern="#{userContextService.timeFormat()}"/>
                    </h:outputText>
                </h:panelGroup>

                <h:panelGroup >
                    <label class="label">合同结束时间</label>
                    <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.contractEndDate}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                           locale="#{userContextService.getCalendarLocale()}"
                                           pattern="#{userContextService.timeFormat()}"/>
                    </h:outputText>
                </h:panelGroup>
                <h:panelGroup >
                    <label class="label">过会日期<span style="color: red">*</span></label>
                    <h:outputText value="#{multiLevelApprovalController.purchaseOrderInfo.meetingDate}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                           locale="#{userContextService.getCalendarLocale()}"
                                           pattern="#{userContextService.timeFormat()}"/>
                    </h:outputText>
                </h:panelGroup>
            </p:panelGrid>
            <p:fieldset legend="预供应商" id="purchaseVender"  >
                <p:selectOneRadio id="purchaseVenderConfirm" value="#{multiLevelApprovalController.venderInfoConfirm}" disabled="true" converter="venderConverter"
                                  required="true" requiredMessage="预供应商 #{msg.ValidationRequire}" layout="responsive" columns="4" styleClass="grid-radio">
                    <f:selectItems value="#{multiLevelApprovalController.venderInfos}" var="item" itemLabel="#{item.venderName}" itemValue="#{item}"/>
                </p:selectOneRadio>
            </p:fieldset>
            <p:fieldset legend="招标公司" id="purchaseCompany"  >
                <p:selectOneRadio id="purchaseCompanyConfirm" value="#{multiLevelApprovalController.companyInfoConfirm}" disabled="true" converter="venderConverter"
                                  required="true" requiredMessage="招标公司 #{msg.ValidationRequire}" layout="responsive" columns="4" styleClass="grid-radio">
                    <f:selectItems value="#{multiLevelApprovalController.companyInfos}" var="item" itemLabel="#{item.companyName}" itemValue="#{item}"/>
                </p:selectOneRadio>
            </p:fieldset>
        </p:fieldset>
        <br/>
    </p:fieldset>
</ui:composition>
</html>
