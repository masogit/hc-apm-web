<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

<html xmlns="http://www.w3.org/1999/xhtml"

      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
<p:fieldset legend="#{msg.BudgetInfo}" rendered="#{multiLevelApprovalController.businessTypeFlag eq 14 }">
    <h:panelGroup rendered="#{multiLevelApprovalController.primaryApprovalData.orderType eq 'BAY'}">
        <p:dataTable id="budgetAssetlistOneBAY" value="#{multiLevelApprovalController.secondaryApprovalData}"
                     var="item" widgetVar="varbudgetAssetDatalist"
                     lazy="true" rowKey="#{item.id}" sortOrder="descending"
                     sortBy="#{item.createdDate}" emptyMessage="#{msg.noRecordFound}">222242842485274
            <p:column headerText="#{msg.ApplicationNum}">
                <h:outputText value="#{item.applicationNum}"/>
            </p:column>
            <p:column headerText="#{msg.Applicant}">
                <h:outputText value="#{item.applicantName}"/>
            </p:column>
            <p:column headerText="#{msg.ApplicationDept}">
                <h:outputText value="#{item.applicationDeptName}"/>
            </p:column>
            <p:column headerText="#{msg.ApplicationDate}">
                <h:outputText value="#{item.applicationDate}">
                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                       locale="#{userContextService.getCalendarLocale()}"
                                       pattern="#{userContextService.timeFormat14()}"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.EquipmentName}">
                <h:outputText value="#{item.applicationAssetName}"/>
            </p:column>
            <p:column headerText="设备品类">
                <h:outputText value="#{item.applicationAssetCategory}"/>
            </p:column>
            <p:column headerText="推荐设备品牌">
                <h:outputText value="#{item.recommendedBrand}"/>
            </p:column>
            <p:column headerText="设备规格">
                <h:outputText value="#{item.standards}"/>
            </p:column>

        </p:dataTable>
        <p:dataTable id="budgetAssetlistSecBAY" value="#{multiLevelApprovalController.secondaryApprovalData}"
                     var="item" widgetVar="varbudgetAssetDatalist"
                     lazy="true" rowKey="#{item.id}" sortOrder="descending"
                     sortBy="#{item.createdDate}" emptyMessage="#{msg.noRecordFound}">
            <p:column headerText="#{msg.EquipmentModel}">
                <h:outputText value="#{item.model}"/>
            </p:column>
            <p:column headerText="#{msg.ApplicationQuantity}">
                <h:outputText converter="javax.faces.Number" value="#{item.applicationQuantity}"/>
            </p:column>
            <p:column headerText="预算单价">
                <h:outputText value="#{item.applicationPrice}">
                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                </h:outputText>
            </p:column>
            <p:column headerText="预算总价">
                <h:outputText value="#{item.applicationAmount}">
                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.Unit}">
                <h:outputText value="#{item.unit}"/>
            </p:column>
            <p:column headerText="经费来源">
                <p:selectOneMenu  value="#{item.sourceFunding}" disabled="true">
                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                    <f:selectItems value="#{fieldMsg.getFieldValueList('sourceFunding')}" var="t"
                                   itemLabel="#{t.value}" itemValue="#{t.msgKey}"/>
                </p:selectOneMenu>
            </p:column>
            <p:column headerText="拟购设备的用途">
                <h:outputText value="#{item.equipmentUsage}"/>
            </p:column>
            <p:column headerText="情况说明">
                <h:outputText value="#{item.description}"/>
            </p:column>
            <p:column headerText="申请理由">
                <h:outputText value="#{item.applicationReason}"/>
            </p:column>
        </p:dataTable>
    </h:panelGroup>

            </p:column>
            <p:column headerText="#{msg.Unit}">
                <h:outputText value="#{item.unit}"/>
            </p:column>
            <p:column headerText="经费来源">

                    <f:selectItems value="#{fieldMsg.getFieldValueList('sourceFunding')}" var="t"

            </p:column>
        </p:dataTable>

                     sortBy="#{item.createdDate}" emptyMessage="#{msg.noRecordFound}">

            <p:column headerText="是否采购进口产品">
                 <p:selectOneMenu  value="#{item.importedOr}" disabled="true">
                     <f:selectItems value="#{fieldMsg.getFieldValueList('budgetApplicationT_F')}" var="t"
                                    itemLabel="#{t.value}" itemValue="#{t.msgKey}"/>
                 </p:selectOneMenu>
             </p:column>

                 <h:outputText value="#{item.majorFunction}">

                 <h:outputText value="#{item.deviceConfiguration}">
                 </h:outputText>
             </p:column>

                 <h:outputText value="#{item.serviceLife}">
                 </h:outputText>
             </p:column>
        </p:dataTable>

                     var="item" widgetVar="varbudgetAssetDatalist"
                     lazy="true" rowKey="#{item.id}" sortOrder="descending"
                     sortBy="#{item.createdDate}" emptyMessage="#{msg.noRecordFound}">
            <p:column headerText="收费标准">
                 <h:outputText value="#{item.chargingStandards}">
                     <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>

             <p:column headerText="年预估收入">
                 <h:outputText value="#{item.yearIncome}">

                                    itemLabel="#{t.value}" itemValue="#{t.msgKey}"/>
                 </p:selectOneMenu>
             </p:column>
             <p:column headerText="是否需要连接外网">
                 <p:selectOneMenu  value="#{item.connectNetwork}" disabled="true">
                     <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                     <f:selectItems value="#{fieldMsg.getFieldValueList('budgetApplicationT_F')}" var="t"
                                    itemLabel="#{t.value}" itemValue="#{t.msgKey}"/>
                 </p:selectOneMenu>

             <p:column headerText="情况说明">
                 <h:outputText value="#{item.description}">

             </p:column>

        <p:fieldset legend="附件信息"  >
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <p:dataList id="attachList"
                                value="#{multiLevelApprovalController.attachList}"
                                var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}"
                                paginator="true" paginatorPosition="top" paginatorAlwaysVisible="false" rows="5">
                        <f:facet name="header">附件详情</f:facet>
                        <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                    </p:dataList>
                </h:panelGroup>
            </p:panelGrid>
        </p:fieldset>
    </h:panelGroup>
</p:fieldset>
</ui:composition>
