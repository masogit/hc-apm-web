<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition >
    <p:fieldset legend="采购办确认信息" id="procurementOffice" rendered="#{multiLevelApprovalController.approvaLevelPurchase() eq 3}" >
        <!--采购办确认信息可以查看的信息-->
        <p:fieldset legend="申购单信息" id="purchaseOffice"  >
            <p:dataTable id="purchaseOfficelist" value="#{multiLevelApprovalController.applicationDetailConfirm()}"
                         var="item" widgetVar="varbudgetAssetDatalist" lazy="true" paginator="true"
                         selectionMode="single" disabledSelection="true"
                         paginatorPosition="top" paginatorAlwaysVisible="true" rowKey="#{item.id}"
                         sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5">
                <p:ajax event="rowSelect" />
                <p:column headerText="#{msg.EquipmentName}">
                    <h:outputText value="#{item.applicationAssetName}"/>
                </p:column>
                <p:column headerText="数量（台）">
                    <h:outputText value="#{item.confirmQuantity}"/>
                </p:column>
                <p:column headerText="预算（万元）">
                    <h:outputText value="#{item.confirmPrice}"/>
                </p:column>
                <p:column headerText="拦标价（万元）">
                    <h:outputText value="#{item.confirmMaximumPrice}"/>
                </p:column>
                <p:column headerText="设备品目">
                    <h:outputText value="#{item.confirmEquipmentCategory}"/>
                </p:column>
                <p:column headerText="科室意见（是否进口）" >
                    <h:outputText value="#{fieldMsg.fieldValue('budgetApplicationT_F', item.confirmImport)}"/>
                </p:column>
                <p:column headerText="主要功能和配置">
                    <h:outputText value="#{item.confirmMajorFunction}"/>
                </p:column>
                <p:column headerText="主要参数和要求">
                    <h:outputText value="#{item.confirmParameters}"/>
                </p:column>
                <p:column headerText="意向品牌">
                    <h:outputText value="#{item.confirmBrand}"/>
                </p:column>
                <p:column headerText="使用科室">
                    <h:outputText value="#{item.confirmApplicationDeptName}"/>
                </p:column>
            </p:dataTable>
        </p:fieldset>
        <!--采购办确认信息可以查看的信息-->
        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup >
                <label class="label">采购类型<span style="color: red">*</span></label>
                <p:selectOneMenu value="#{multiLevelApprovalController.purchaseOrderInfo.purchaseType}"  required="true" requiredMessage="采购类型 #{msg.ValidationRequire}" >
                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                    <f:selectItems value="#{fieldMsg.getFieldValueList('purchaseType')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                </p:selectOneMenu>
            </h:panelGroup>
            <h:panelGroup >
                <p:outputLabel class="label">过会日期</p:outputLabel>
                <p:calendar mode="popup" showOn="button" disabled="true"
                            value="#{multiLevelApprovalController.purchaseOrderInfo.meetingDate}"
                            timeZone="#{userContextService.getTimeZone()}"
                            pattern="#{userContextService.timeFormat()}"
                            locale="#{userContextService.getCalendarLocale()}"
                            showButtonPanel="true"
                            navigator="true" mask="true">
                    <p:ajax event="dateSelect" update="@this"/>
                </p:calendar>
            </h:panelGroup>
        </p:panelGrid>
        <p:fieldset legend="预供应商" id="purchaseVender"  >
            <p:selectOneRadio id="purchaseVenderConfirm" value="#{multiLevelApprovalController.venderInfoConfirm}" converter="venderConverter"
                              required="true" requiredMessage="预供应商 #{msg.ValidationRequire}" layout="responsive" columns="4" styleClass="grid-radio">
                <f:selectItems value="#{multiLevelApprovalController.venderInfos}" var="item" itemLabel="#{item.venderName}" itemValue="#{item}"/>
            </p:selectOneRadio>
        </p:fieldset>
        <p:fieldset legend="招标公司" id="purchaseCompany"  >
            <p:selectOneRadio id="purchaseCompanyConfirm" value="#{multiLevelApprovalController.companyInfoConfirm}" converter="venderConverter"
                              required="true" requiredMessage="招标公司 #{msg.ValidationRequire}" layout="responsive" columns="4" styleClass="grid-radio">
                <f:selectItems value="#{multiLevelApprovalController.companyInfos}" var="item" itemLabel="#{item.companyName}" itemValue="#{item}"/>
            </p:selectOneRadio>
        </p:fieldset>
    </p:fieldset>
</ui:composition>
</html>
