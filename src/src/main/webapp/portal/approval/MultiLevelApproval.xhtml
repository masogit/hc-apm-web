<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            div.ui-panelgrid-cell > label + div.ui-selectonemenu {
                min-width: 75px !important;
                max-width: 90%;
            }
        </style>
        <style>
            .ui-chkbox{
                width: 18px !IMPORTANT;
            }
        </style>

        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.audit}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="approvalForm">
                <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                    <p:commandButton value="#{msg.MyRequests}"   process="@this" update="approvalList ItemDetailViewForm buttonSet" disabled="#{multiLevelApprovalListController.initiatedByMe}" actionListener="#{multiLevelApprovalListController.initiateApprovalByMe}" />
                    <p:commandButton value="待审批"     process="@this" update="approvalList ItemDetailViewForm buttonSet" disabled="#{multiLevelApprovalListController.pendingApprovalByMe}" actionListener="#{multiLevelApprovalListController.pendingApprovalByMe}"   rendered="#{userContextService.accessContainsFunctionMenu('MULTILEVEL_APPROVE_APPROVE')}"/>
                    <p:commandButton value="我审批的"   process="@this" update="approvalList ItemDetailViewForm buttonSet"  disabled="#{multiLevelApprovalListController.approvedByMe}" actionListener="#{multiLevelApprovalListController.approvedApprovalByMe}"  rendered="#{userContextService.accessContainsFunctionMenu('MULTILEVEL_APPROVE_APPROVE')}"/>
                </h:panelGrid>

                <p:dataTable id="approvalList" value="#{multiLevelApprovalListController.lazyModel}" var="item"
                             widgetVar="approvalList"  liveResize="true" resizeMode="fit"
                             selectionMode="single" scrollable="false"
                             selection="#{multiLevelApprovalListController.selected}"
                             lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             rowKey="#{item.id}" sortMode="single" sortBy="#{item.createdDate}"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.JumpTo} {JumpToPageDropdown} #{msg.Page} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rowIndexVar="idx"
                             rows="20" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="20,50,100,500">
                    <p:ajax event="rowSelect" listener="#{multiLevelApprovalListController.onRowSelect}" update="ItemDetailViewForm"/>
                    <p:ajax event="filter" listener="#{multiLevelApprovalListController.onFilter}"/>

                    <p:column headerText="#{msg.ApprovalNumber}"   filterBy="#{item.approvalNumber}" filterMatchMode="LIKE" >
                        <h:outputText value="#{item.approvalNumber}"/>
                    </p:column>
                    <p:column headerText="#{msg.BusinessNumber}" filterBy="#{item.businessNumber}" filterMatchMode="LIKE" >
                        <h:outputText value="#{item.businessNumber}"/>
                    </p:column>
                    <p:column headerText="#{msg.BusinessType}"  filterBy="#{item.businessType}" filterMatchMode="EQ" >
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('approvalList').filter()" value="#{multiLevelApprovalListController.filterBusinessType}" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{multiLevelApprovalConfigController.businessTypeList}" var="item"
                                               itemLabel="#{item.valueZh}" itemValue="#{multiLevelApprovalGlobalController.getBusinessType(item.msgKey)}"/>                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{multiLevelApprovalGlobalController.getBusinessType(item)}"/>
                    </p:column>
                    <p:column headerText="#{msg.clinicalDeptName}" filterBy="#{item.applicationDepartment}" filterMatchMode="LIKE"  >
<!--                        <c:if test="#{item.applyUser.org.orgType eq 4}">-->
                            <h:outputText value="#{item.applicationDepartment}"/>
<!--                        </c:if>-->
                    </p:column>
                    <p:column headerText="#{msg.RequestedBy}" filterBy="#{item.applyUser.name}" filterMatchMode="LIKE"  >
                        <h:outputText value="#{item.applyUser.name}"/>
                    </p:column>
                    <p:column headerText="#{msg.ApprovalStatus}" filterBy="#{item.approvalStatus}" filterMatchMode="EQ" >

                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('approvalList').filter()"  value="#{multiLevelApprovalListController.status}" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItem itemLabel="#{msg.Approved3}" itemValue="2"  />
                                <f:selectItem itemLabel="#{msg.NotApproved}" itemValue="3" />
                                <f:selectItem itemLabel="#{msg.UnderReview}" itemValue="1" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{multiLevelApprovalGlobalController.swapLevelName(item.approvalLevelNow)}"/>
                    </p:column>
                    <p:column headerText="#{msg.ApprovalTime}" sortBy="#{item.actualApproverDate}" rendered="#{!multiLevelApprovalListController.pendingApprovalByMe}">
                        <h:outputText value="#{item.actualApproverDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.Actions}" rendered="#{multiLevelApprovalListController.pendingApprovalByMe}">
                        <!--17 为采购-->
                        <p:commandButton value="#{msg.audit}" rendered="#{item.businessType eq 17}"
                                         action="#{multiLevelApprovalListController.promptApproval(item)}"
                                         update="MultiLevelApprovalClaimPurDialog"
                                         oncomplete="PF('MultiLevelApprovalClaimPurDialog').show()"  />
                        <!--17 为采购-->
                        <p:commandButton value="#{msg.audit}" rendered="#{item.businessType ne 17}"
                                         action="#{multiLevelApprovalListController.promptApproval(item)}"
                                         update="MultiLevelApprovalClaimDialog"
                                         oncomplete="PF('MultiLevelApprovalClaimDialog').show()"  />
                    </p:column>

                    <f:facet name="{Toolbar}">
                    </f:facet>
                </p:dataTable>
                </h:form>

                <ui:include src="MultiLeveApprovalDetail.xhtml"/>
                <ui:include src="MultiLevelApprovalClaimDialog.xhtml"/>

            </div>
            <!--采购使用-->
            <div class="ui-g-12 card">
                <ui:include src="MultiLevelApprovalPurchase.xhtml"/>
            </div>
            <!--采购使用-->
            <ui:include src="/portal/preview/view.xhtml"/>
        </div>

    <p:dialog id="signatureDlg" widgetVar="signatureDlg" header="签名" modal="true">
        <h:form id="signatureForm">
            <h:panelGrid columnClasses="value" columns="1">
                <h:panelGroup>
                    <p:signature id="signatureContent" style="width:400px;height:200px" widgetVar="sigPanel" base64Value="#{multiLevelApprovalController.signatureContent}"
                                 guideline="false" rendered="#{multiLevelApprovalController.signatureContentStream==null}" />
                    <p:graphicImage value="#{multiLevelApprovalController.signatureContentStream}" stream="false" rendered="#{multiLevelApprovalController.signatureContentStream!=null}"></p:graphicImage>
                </h:panelGroup>
            </h:panelGrid>
            <p:commandButton value="确认" actionListener="#{multiLevelApprovalController.saveSignatureAndSubmitApprove()}" update=":approvalForm:approvalList ItemDetailViewForm" oncomplete="handleApproveSuccess(xhr, status, args);"/>
            <p:commandButton immediate="true" process="@this" value="重写" actionListener="#{multiLevelApprovalController.resetSignature()}" update="signatureForm" oncomplete="PF('sigPanel').clear()"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" onclick="PF('signatureDlg').hide()"/>
        </h:form>
        <script>
            function handleComplete(xhr, status, args) {
                if(xhr.status===205){
                    document.getElementById('approvalDialogForm:openSignature').click();
                }else{
                    PF('returnWorkDlg').hide();
                    PF('MultiLevelApprovalClaimDialog').hide();
                }
            }
            function handleComplete2(xhr, status, args) {
                if(xhr.status===205){
                    document.getElementById('approvalDialogForm:openSignature2').click();
                }else{
                    PF('MultiLevelApprovalClaimDialog').hide();
                    PF('returnDlg').hide();
                }
            }
            function handleApproveSuccess(xhr, status, args) {
                if(xhr.status!==206){
                    PF('signatureDlg').hide();
                    PF('MultiLevelApprovalClaimDialog').hide();
                    PF('returnDlg').hide();
                    PF('returnWorkDlg').hide();
                }
            }
        </script>
    </p:dialog>

    <p:dialog id="returnDlg" widgetVar="returnDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)"   height="300" width="500" >
        <h:form id="nodeForm">
            <h:panelGroup>
                <label class="label">审批节点</label>
                <p:selectOneMenu value="#{multiLevelApprovalController.nodeName}"  autoWidth="false" style="max-width: 300px;" height="600" >
                    <f:selectItem itemLabel="请选择退回节点" itemValue="#{null}" noSelectionOption="true" />

                    <f:selectItems value="#{multiLevelApprovalController.getNodes()}" var="item" itemLabel="#{item.nodeName}" itemValue="#{item.nodeName}" />
                </p:selectOneMenu>

            </h:panelGroup>
            <br/>

            <p:commandButton  validateClient="true" immediate="false" actionListener="#{multiLevelApprovalController.preApproveCheck(3)}" value="确定" update=":approvalForm:approvalList ItemDetailViewForm" icon="ui-icon-check" oncomplete="handleComplete2(xhr, status, args)"/>
            <p:commandButton   immediate="true"  value="取消" update=":approvalForm:approvalList ItemDetailViewForm" icon="ui-icon-check" oncomplete="PF('returnDlg').hide()"/>
            <!--                    <p:commandButton style="display: none" id="openSignature2" actionListener="#{multiLevelApprovalController.getSignature()}" value="查看签名" update="signatureDlg" oncomplete="PF('signatureDlg').show();" />-->
        </h:form>

    </p:dialog>

    <p:dialog id="returnWorkDlg" widgetVar="returnWorkDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)"   height="300" width="500" >
        <h:form id="nodeForm2">
            <h:panelGroup>
                <label class="label">审批节点</label>
                <p:selectOneMenu value="#{multiLevelApprovalController.nodeName}"  autoWidth="false" style="max-width: 300px;" height="600" >
                    <f:selectItem itemLabel="请选择退回节点" itemValue="#{null}" noSelectionOption="true" />

                    <f:selectItems value="#{multiLevelApprovalController.getNodes()}" var="item" itemLabel="#{item.nodeName}" itemValue="#{item.nodeName}" />
                </p:selectOneMenu>

            </h:panelGroup>
            <br/>

            <p:commandButton  validateClient="true" immediate="false" actionListener="#{multiLevelApprovalController.preApproveCheck(3)}" value="确定" update=":approvalForm:approvalList ItemDetailViewForm" icon="ui-icon-check" oncomplete="handleComplete(xhr, status, args)"/>
            <p:commandButton  validateClient="true" immediate="false"  value="取消" update=":approvalForm:approvalList ItemDetailViewForm" icon="ui-icon-check" oncomplete="PF('returnWorkDlg').hide()"/>
            <!--                    <p:commandButton style="display: none" id="openSignature2" actionListener="#{multiLevelApprovalController.getSignature()}" value="查看签名" update="signatureDlg" oncomplete="PF('signatureDlg').show();" />-->

        </h:form>
    </p:dialog>
    </ui:define>
</ui:composition>
