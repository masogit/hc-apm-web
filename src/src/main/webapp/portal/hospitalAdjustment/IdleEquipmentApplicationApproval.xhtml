<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="新增闲置设备入库申请详情"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="adjustmentApplicationForm" >

                    <!-- 1. 申报单位信息 -->
                    <p:fieldset legend="申报单位信息" id="assetList">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">单位名称</label>
                                <p:inputText value="#{adjustmentApplicationDetailController.selected.companyName}"
                                             readonly="true"
                                >
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">医共体所属类别</label>
                                <p:selectOneRadio id="status"
                                                  value="#{adjustmentApplicationDetailController.selected.medicalConsortiumType}"
                                                  required="true"
                                                  requiredMessage="医共体所属类别 #{msg.ValidationRequire}"
                                                  disabled="true">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('MedicalConsortiumType')}"
                                                   var="item"
                                                   itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    <p:ajax event="change" process="@this"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">联系人</label>
                                <p:inputText value="#{adjustmentApplicationDetailController.selected.contactPerson}"
                                             readonly="true"
                                             >
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">联系电话</label>
                                <p:inputText value="#{adjustmentApplicationDetailController.selected.contactNumber}"
                                             readonly="true"
                                           >
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">申报日期</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                            locale="#{userContextService.getCalendarLocale()}" id="installDate"
                                            pattern="#{userContextService.timeFormat()}"
                                            value="#{adjustmentApplicationDetailController.selected.applicationDate}"
                                            showOn="button" readonlyInput="false" showButtonPanel="true"
                                            navigator="true" mask="true" style="width: 95%" disabled="true">
                                    <p:ajax event="dateSelect"/>
                                </p:calendar>
                            </h:panelGroup>
                            <h:outputText/>
                        </p:panelGrid>
                    </p:fieldset>

                    <!-- 2. 闲置设备基本信息 -->
                    <p:fieldset legend="闲置设备基本信息" style="margin-bottom:20px">

                        <!-- Row 1: 基础信息 -->
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                            <h:panelGroup>
                                <label class="label">#{msg.assetName}*</label>
                                <p:inputText id="assetName" readonly="true"
                                             value="#{adjustmentApplicationDetailController.selectedAsset.name}"
                                             placeholder="#{msg.noAssetSelected}" required="true"
                                             requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>
                                <p:commandButton class="popupIconButton" disabled="true"
                                                 actionListener="#{selectAssetController.prepareDialogCallback(adjustmentApplicationDetailController, 'adjustmentApplicationForm')}"
                                                 process="@this" icon="ui-icon-arrow-drop-down"
                                                 update="  adjustmentApplicationForm:assetName"
                                />
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">设备型号/规格</label>
                                <p:inputText id="modelSpec" readonly="true"
                                             value="#{adjustmentApplicationDetailController.selectedAsset.functionType}"
                                       >
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.manufacture}</label>
                                <p:inputText id="manufacture" readonly="true"
                                             value="#{adjustmentApplicationDetailController.selectedAsset.manufacture}"
                                           >
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.purchaseDate}</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                            locale="#{userContextService.getCalendarLocale()}" id="purchaseDate"
                                            pattern="#{userContextService.timeFormat()}"
                                            value="#{adjustmentApplicationDetailController.selectedAsset.purchaseDate}"
                                            showOn="button" readonlyInput="false" showButtonPanel="true"
                                            navigator="true" mask="true" style="width: 95%" disabled="true">
                                    <p:ajax event="dateSelect"/>
                                </p:calendar>
                            </h:panelGroup>
                        </p:panelGrid>

                        <!-- Row 2: 价格与年限 -->
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.purchasePrice} (元)</label>
                                <p:inputNumber minValue="0" decimalPlaces="2" id="purchasePrice" readonly="true"
                                               value="#{adjustmentApplicationDetailController.selectedAsset.purchasePrice}"
                                               >
                                    <p:ajax/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">累计使用年限</label>
                                <div style="display: flex; align-items: center;">
                                    <p:inputNumber id="usedYears" minValue="0" decimalPlaces="0" readonly="true"
                                                   value="#{adjustmentApplicationDetailController.selected.usedYears}"
                                                   style="width: 50px; margin-right: 5px;">
                                        <p:ajax/>
                                    </p:inputNumber>
                                    <span style="margin-right: 10px;">年</span>
                                    <!--                                    <p:inputNumber id="usedMonths" minValue="0" max="11" decimalPlaces="0"-->
                                    <!--                                                   value="#{adjustmentApplicationDetailController.selected.usedMonths}"-->
                                    <!--                                                   style="width: 50px;">-->
                                    <!--                                        <p:ajax/>-->
                                    <!--                                    </p:inputNumber>-->
                                    <!--                                    <span>月</span>-->
                                </div>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">折旧期限 (规定)</label>
                                <p:inputNumber minValue="0" maxValue="99" decimalPlaces="1" readonly="true"
                                               value="#{adjustmentApplicationDetailController.selected.depreciationPeriodYears}"
                                               requiredMessage="折旧期限 #{msg.ValidationRequire}" style="width: 95%">
                                    <p:ajax/>
                                </p:inputNumber>
                                <span style="margin-right: 10px;">年</span>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">是否超折旧期限</label>
                                <p:selectOneRadio
                                        value="#{adjustmentApplicationDetailController.selected.overDepreciation}"
                                        disabled="true">
                                    <f:selectItem itemLabel="是" itemValue="true"/>
                                    <f:selectItem itemLabel="否" itemValue="false"/>
                                    <p:ajax event="change" process="@this" update="@form"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{adjustmentApplicationDetailController.selected.overDepreciation == true}">
                            <h:panelGroup>
                                <label class="label">超期仍具备使用价值依据</label>
                                <p:inputText readonly="true"
                                             value="#{adjustmentApplicationDetailController.selected.overDepreciationReason}"
                                             style="width: 95%;">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">设备现状</label>
                                <p:selectOneRadio value="#{adjustmentApplicationDetailController.selected.deviceStatus}"
                                                  disabled="true"
                                >
                                    <f:selectItem itemLabel="性能完好" itemValue="PERFECT"/>
                                    <f:selectItem itemLabel="可修复后正常使用" itemValue="REPAIRABLE"/>
                                    <f:selectItem itemLabel="超期仍具备使用价值" itemValue="STILL_USABLE"/>
                                    <p:ajax event="change" process="@this"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">维修记录摘要 (近2年)</label>
                                <p:inputTextarea
                                        value="#{adjustmentApplicationDetailController.selected.maintenanceSummary}"
                                        readonly="true"
                                        >
                                    <p:ajax/>
                                </p:inputTextarea>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">购置凭证编号</label>
                                <p:inputText value="#{adjustmentApplicationDetailController.selected.purchaseVoucherNo}"
                                             readonly="true"
                                             >
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">设备产权性质</label>
                                <div style="display:flex; align-items:center; flex-wrap:wrap;">
                                    <p:selectOneRadio
                                            value="#{adjustmentApplicationDetailController.selected.propertyNature}"
                                            disabled="true"
                                    >
                                        <f:selectItem itemLabel="国有资产" itemValue="STATE_OWNED"/>
                                        <f:selectItem itemLabel="其他" itemValue="OTHER"/>
                                        <p:ajax event="change" process="@this" update="@form"/>
                                    </p:selectOneRadio>
                                    <p:inputText readonly="true"
                                                 rendered="#{adjustmentApplicationDetailController.selected.propertyNature == 'OTHER'}"
                                                 value="#{adjustmentApplicationDetailController.selected.propertyNatureDesc}"
                                                 placeholder="请说明" style="width: 100px; margin-left: 5px;">
                                        <p:ajax/>
                                    </p:inputText>
                                </div>
                            </h:panelGroup>
                            <h:panelGroup colspan="2">
                                <label class="label">是否存在权利瑕疵</label>
                                <div style="display:flex; align-items:center; flex-wrap:wrap;">
                                    <p:selectOneRadio disabled="true"
                                                      value="#{adjustmentApplicationDetailController.selected.hasRightsDefect}">
                                        <f:selectItem itemLabel="无" itemValue="false"/>
                                        <f:selectItem itemLabel="有" itemValue="true"/>
                                        <p:ajax event="change" process="@this" update="@form"/>
                                    </p:selectOneRadio>
                                    <p:inputText readonly="true"
                                                 rendered="#{adjustmentApplicationDetailController.selected.hasRightsDefect == true}"
                                                 value="#{adjustmentApplicationDetailController.selected.rightsDefectDescription}"
                                                 placeholder="注明抵押、查封等" style="width: 120px; margin-left: 5px;">
                                        <p:ajax/>
                                    </p:inputText>
                                </div>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>


                    <p:fieldset legend="设置闲置原因" style="margin-bottom:20px">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup colspan="4">
                                <label class="label">闲置原因</label>
                                <p:selectOneRadio disabled="true"
                                                  value="#{adjustmentApplicationDetailController.selected.idleReasons}"
                                                  required="true"
                                                  requiredMessage="医共体所属类别 #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="业务调整" itemValue="BUSINESS_ADJUSTMENT"/>
                                    <f:selectItem itemLabel="更新换代" itemValue="UPDATE_REPLACEMENT"/>
                                    <f:selectItem itemLabel="科室撤并" itemValue="DEPARTMENT_MERGE"/>
                                    <f:selectItem itemLabel="其他" itemValue="OTHER"/>
                                    <p:ajax event="change" process="@this" update="@form"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                        </p:panelGrid>


                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{adjustmentApplicationDetailController.selected.idleReasons != null and adjustmentApplicationDetailController.selected.idleReasons.contains('OTHER')}">
                            <h:panelGroup>
                                <label class="label">其他原因详细说明</label>
                                <p:inputText readonly="true"
                                             value="#{adjustmentApplicationDetailController.selected.otherReasonDescription}"
                                             style="width: 95%;" required="true"
                                             requiredMessage="请选择'其他'时需填写详细说明">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">预计闲置期限</label>
                                <div style="display: flex; align-items: center;">
                                    <p:inputNumber id="expectedIdleYears" minValue="0" decimalPlaces="0" readonly="true"
                                                   value="#{adjustmentApplicationDetailController.selected.expectedIdleYears}"
                                                   style="width: 60px; margin-right: 5px;">
                                        <p:ajax/>
                                    </p:inputNumber>
                                    <span style="margin-right: 10px;">年</span>
                                    <p:inputNumber id="expectedIdleMonths" minValue="0" max="11" decimalPlaces="0"
                                                   readonly="true"
                                                   value="#{adjustmentApplicationDetailController.selected.expectedIdleMonths}"
                                                   style="width: 60px;">
                                        <p:ajax/>
                                    </p:inputNumber>
                                    <span>月</span>
                                </div>
                            </h:panelGroup>
                            <h:outputText colspan="3"/>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:fieldset legend="附件材料清单" style="margin-bottom:20px">

                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup >
                                <p:selectManyCheckbox  value="#{adjustmentApplicationDetailController.attachments}" style="width: 700px"    disabled="true" >

                                    <f:selectItems value="#{fieldMsg.getFieldValueList('HospitalAdjustmentAttachmentType')}"
                                                   var="item"
                                                   itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    <p:ajax event="change" process="@this" update="@form"/>
                                </p:selectManyCheckbox>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="1" layout="grid"  styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{adjustmentApplicationDetailController.attachments.contains('other')}">
                            <h:panelGroup>
                                <label class="label">附件材料其他描述</label>
                                <p:inputText
                                        value="#{adjustmentApplicationDetailController.selected.attachmentsOtherDescription}"
                                        style="width: 95%;" required="true"
                                        requiredMessage="请选择'其他'时需填写详细说明">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                        </p:panelGrid>




                        <h:panelGroup>
                            <!--                        <p:commandButton value="批量删除文件" class="bathDeleteAttach" update=":adjustmentApplicationForm:AttachList @(.selectCheckBox) @(.selectCheckBoxHeader) @(.bathDeleteAttach) @(.bathDownloadAttach)" actionListener="#{adjustmentApplicationDetailController.bathDeleteAttach}" disabled="#{!adjustmentApplicationDetailController.isChecked()}">-->
                            <!--                            <p:confirm header="批量删除文件" message="您确认要删除选中的文件吗？" icon="ui-icon-warning"/>-->
                            <!--                        </p:commandButton>-->
                            <!--                        <p:commandButton value="批量下载文件" class="bathDownloadAttach" actionListener="#{adjustmentApplicationDetailController.bathDownloadAttach}" disabled="#{!adjustmentApplicationDetailController.isChecked()}" onclick="PrimeFaces.monitorDownload(start, stop);">-->
                            <!--                            <p:fileDownload value="#{contractInfoEditController.attachListFile}"/>-->
                            <!--                        </p:commandButton>-->
                            <p:dataList id="AttachList" value="#{adjustmentApplicationDetailController.attachements}"
                                        var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}"
                                        style="text-align:left">
                                <f:facet name="header">
                                    <div class="ui-g" style="text-align:left">
                                        <!--                                    <div class="ui-g-1">-->
                                        <!--                                        <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">-->
                                        <!--                                            <p:ajax listener="#{adjustmentApplicationDetailController.onSelectAllOfPage}" update="@(.selectCheckBox) @(.selectCheckBoxHeader) @(.bathDeleteAttach) @(.bathDownloadAttach)" oncomplete="updateSelectAllCheckBox();" />-->
                                        <!--                                        </p:selectBooleanCheckbox>-->
                                        <!--                                    </div>-->
                                        <!--                                    <p:commandLink value="↑↓" actionListener="#{adjustmentApplicationDetailController.attachSort()}" update="AttachList"/>-->
                                        <h:outputText value="#{msg.AttachmentType}" class="ui-g-2"/>
                                        <h:outputText value="#{msg.FileName}" class="ui-g-3"/>
                                        <h:outputText value="#{msg.UploadTime}" class="ui-g-2"/>
                                        <h:outputText value="#{msg.Uploader}" class="ui-g-2"/>
                                        <!--                                    <p:commandLink value="#{msg.Add}#{msg.attachment}" immediate="true"  oncomplete="PF('uploadDialog').show()" class="ui-g-1" />-->
                                    </div>
                                </f:facet>

                                <div class="ui-g">
                                    <!--                                <div class="ui-g-1">-->
                                    <!--&lt;!&ndash;                                    <p:selectBooleanCheckbox value="#{adjustmentApplicationDetailController.blobObjectSelectedMap[fileitem.id]}" id="selectCheckBox" class="selectCheckBoxHeader">&ndash;&gt;-->
                                    <!--&lt;!&ndash;                                        <p:ajax process="@this" listener="#{adjustmentApplicationDetailController.pick(fileitem.id)}" update="@(.selectCheckBox) @(.selectCheckBox) @(.bathDeleteAttach) @(.bathDownloadAttach)" oncomplete="updateSelectAllCheckBox();" />&ndash;&gt;-->
                                    <!--&lt;!&ndash;                                    </p:selectBooleanCheckbox>&ndash;&gt;-->
                                    <!--                                </div>-->
                                    <h:outputText value="#{fileitem.boSubTypeValue}" class="ui-g-2"/>
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false"
                                                   actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}"
                                                   styleClass="ui-g-3"/>
                                    <!--                                    <p:link href="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" class="ui-g-3" >#{fileitem.objectName}</p:link>-->
                                    <h:outputText value="#{fileitem.createdDate}" class="ui-g-2">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm"/>
                                    </h:outputText>
                                    <h:outputText
                                            value="#{adjustmentApplicationDetailController.getUserNameByUid(fileitem.createdBy)}"
                                            class="ui-g-2"/>
                                    <p:commandLink value="#{msg.preview}" style="margin-right: 5px;"
                                                   update="previewedDlg" rendered="#{fileitem.showPreview()}"
                                                   process="@this"
                                                   actionListener="#{preViewerBean.onServerEvent('', fileitem.objectStorageId)}"
                                                   oncomplete="PF('previewedDlg').show()"/>
                                    <!--                                <p:commandLink value="#{msg.Delete}" style="margin-right: 5px;" update="AttachList" actionListener="#{adjustmentApplicationDetailController.removeAttachmentById(fileitem.id)}" process="@this" >-->
                                    <!--                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>-->
                                    <!--                                </p:commandLink>-->
                                    <!--                                <p:commandLink value="#{msg.approveAttactments}" style="margin-right: 5px;"  update="AttachList" process="@this" actionListener="#{adjustmentApplicationDetailController.approveAttachmentById(fileitem.id)}" />-->
                                    <!--                                <p:commandLink value="#{msg.attactmentsApproved}" style="margin-right: 5px;"  process="@this"  rendered="#{!adjustmentApplicationDetailController.canApprove(fileitem.id)}" disabled="true"/>-->
                                </div>
                            </p:dataList>

                        </h:panelGroup>
                    </p:fieldset>


                    <p:fieldset legend="局药管中心审核意见" style="margin-bottom:20px"
                                rendered="#{adjustmentApplicationDetailController.selected.status==2}">


                        <p:panelGrid columns="2" styleClass="ui-panelgrid-blank form-group" layout="grid"
                                     columnClasses="left-col, right-col">

                            <h:panelGroup>
                                <label class="label">审核结果<span style="color:red">*</span></label>
                                <div style="display:flex; align-items:center; flex-wrap:wrap; gap: 10px;">


                                    <p:selectOneRadio value="#{adjustmentApplicationDetailController.selected.auditResult}" required="true" requiredMessage="审核结果必填" >
                                        <f:selectItem itemLabel="符合条件" itemValue="true" />
                                        <f:selectItem itemLabel="不符合条件" itemValue="false" />

                                        <p:ajax event="change" process="@this" update="@form"/>
                                    </p:selectOneRadio>


                                    <p:inputText value="#{adjustmentApplicationDetailController.selected.registrationNumber}"
                                                 placeholder="登记编号"  required="true" requiredMessage="登记编号必填"
                                                 style="width:150px;"
                                                 rendered="#{adjustmentApplicationDetailController.selected.auditResult == true}"/>

                                    <p:inputText value="#{adjustmentApplicationDetailController.selected.auditResultReason}"
                                                 placeholder="说明理由"  required="true" requiredMessage="说明理由必填"
                                                 style="width:200px;"
                                                 rendered="#{adjustmentApplicationDetailController.selected.auditResult == false}"/>
                                </div>
                            </h:panelGroup>
                            <h:panelGroup>

                                <span class="label" style="display:block; margin-bottom:5px;">审核日期</span>
                                <p:calendar value="#{adjustmentApplicationDetailController.selected.auditDate}"
                                            pattern="yyyy-MM-dd"
                                            showOn="button"
                                            style="width:160px;"
                                            readonlyInput="true"/>

                            </h:panelGroup>


                            <h:panelGroup>

                                <label class="label">审核人签字</label>
                                    <p:graphicImage rendered="#{adjustmentApplicationDetailController.signatureId !=null}" value="#{fileDownloadService.getFile(adjustmentApplicationDetailController.signatureId)}" height="80" width="100" stream="false" >
                                    </p:graphicImage>
                                <p:commandButton  immediate="true"   id="openSignature2" actionListener="#{adjustmentApplicationDetailController.getSignature()}" value="添加签名" update="signatureDlg" oncomplete="PF('signatureDlg').show();" />

                            </h:panelGroup>

                        </p:panelGrid>
                    </p:fieldset>
                    <p:commandButton  icon="ui-icon-check" rendered="#{adjustmentApplicationDetailController.selected.status==2 and   userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ACCEPTANCE')}"   actionListener="#{adjustmentApplicationDetailController.approval()}" value="审批同意" update="adjustmentApplicationForm"  />
                    <p:commandButton  value="退回"  rendered="#{adjustmentApplicationDetailController.selected.status==2 and   userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ACCEPTANCE')}"  icon="ui-icon-cancel" update="adjustmentApplicationForm"
                                     actionListener="#{adjustmentApplicationDetailController.refuse}"

                                     style="margin-left: 10px;"/>
                    <p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-arrow-back"
                                     action="IdleEquipmentApplication?faces-redirect=true"
                                     style="margin-left: 10px;"/>

                </h:form>
                <p:dialog id="signatureDlg" widgetVar="signatureDlg" header="签名" modal="true">
                    <h:form id="signatureForm">
                        <h:panelGrid columnClasses="value" columns="1">
                            <h:panelGroup>
                                <p:signature id="signatureContent" style="width:400px;height:200px" widgetVar="sigPanel" base64Value="#{adjustmentApplicationDetailController.signatureContent}"
                                             guideline="false" rendered="#{adjustmentApplicationDetailController.signatureContentStream==null}" />
                                <p:graphicImage value="#{adjustmentApplicationDetailController.signatureContentStream}" stream="false" rendered="#{adjustmentApplicationDetailController.signatureContentStream!=null}"></p:graphicImage>
                            </h:panelGroup>
                        </h:panelGrid>
                        <p:commandButton value="确认" actionListener="#{adjustmentApplicationDetailController.saveSignatureAndSubmitApprove()}" update=":adjustmentApplicationForm" oncomplete="handleApproveSuccess(xhr, status, args);"/>
                        <p:commandButton immediate="true" process="@this" value="重写" actionListener="#{adjustmentApplicationDetailController.resetSignature()}" update="signatureForm" oncomplete="PF('sigPanel').clear()"/>
                        <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" onclick="PF('signatureDlg').hide()"/>
                    </h:form>
                    <script>
                        function handleApproveSuccess(xhr, status, args) {
                            if(xhr.status!==206){
                                PF('signatureDlg').hide();
                            }
                        }
                    </script>
                </p:dialog>
            </div>
        </div>
        <ui:include src="/portal/preview/view.xhtml" />


        <script>
