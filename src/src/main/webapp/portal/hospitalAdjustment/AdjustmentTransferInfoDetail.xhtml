<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
                <p:panelGrid columns="5" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">工单号</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.applicationNumber}" readonly="true"
                                    >
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">申请人</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.userAccount.name}" readonly="true"
                                     >
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>

                    <h:panelGroup >
                        <label class="label">申请时间</label>
                        <p:inputText id="createdDate" value="#{adjustmentTransferApplicationDetailController.selected.createTime}" readonly="true" >
                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">当前状态</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.statusName(adjustmentTransferApplicationDetailController.selected.status)}" readonly="true"
                                     >
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">当前处理人</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.getUserNameByUid(adjustmentTransferApplicationDetailController.selected.getUpdatedBy())}" readonly="true"
                                    >
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>



                </p:panelGrid>

        <p:panelGrid columns="5" layout="grid" styleClass="ui-panelgrid-blank form-group">

            <h:panelGroup >
                <div class="card">
                    <p:dataTable var="node" value="#{adjustmentTransferApplicationDetailController.process}">
                        <p:column headerText="步骤名称">
                            <h:outputText value="#{node.nodeName}" />
                        </p:column>

                        <p:column headerText="责任人">
                            <h:outputText value="#{node.operator}" />
                        </p:column>

                        <p:column headerText="时间">
                            <h:outputText value="#{node.operatorTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:panelGroup>
        </p:panelGrid>
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <!--                    <h:panelGroup>-->
                    <!--                        <label class="label">申请科室</label>-->
                    <!--                        <p:inputText value="#{adjustmentTransferApplicationDetailController.application.department}"-->
                    <!--                                     style="width:95%">-->
                    <!--                            <p:ajax/>-->
                    <!--                        </p:inputText>-->
                    <!--                    </h:panelGroup>-->

                    <h:panelGroup>
                        <label class="label">#{msg.clinicalDeptName}<span style="color:red">*</span></label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.filterDeptOrg.name}" readonly="true"
                                     style="width:95%">
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">联系人</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.contactPerson}" readonly="true">
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">联系电话</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.contactPhone}" readonly="true">
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">申报日期</label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" disabled="true"
                                    locale="#{userContextService.getCalendarLocale()}" id="installDate"
                                    pattern="#{userContextService.timeFormat()}"
                                    value="#{adjustmentTransferApplicationDetailController.selected.applicationDate}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true"
                                    navigator="true" mask="true" style="width: 95%">
                            <p:ajax event="dateSelect"/>
                        </p:calendar>
                    </h:panelGroup>
                    <h:outputText/>
                </p:panelGrid>

    </ui:composition>
</html>
