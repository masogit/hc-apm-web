<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="调剂设备详情"/>
            </div>

            <div class="ui-g-12 card">
                #{idleEquipmentStockDetailController.initStock()}


                <ui:include src="AdjustmentEquipmentDetail.xhtml"/>
                <h:form id="stockDetailForm">


                    <h:panelGroup>
                        <p:commandButton immediate="true" value="申请借用" icon="ui-icon-check"
                                         rendered="#{userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_APPLICATION')  and  !idleEquipmentStockDetailController.isBorrowing()  and  idleEquipmentStockDetailController.selected.status==1 }"
                                         update="adjustmentBorrowingDlg"
                                         oncomplete="PF('adjustmentBorrowingDlg').show();"
                                         actionListener="#{idleEquipmentStockDetailController.initBorrowing()}"
                                         style="margin-left: 10px;"/>

                        <p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-arrow-back"
                                         action="IdleEquipmentStock?faces-redirect=true"
                                         style="margin-left: 10px;"/>
                    </h:panelGroup>

                </h:form>


            </div>

        </div>

        <ui:include src="AdjustmentBorrowingApplication.xhtml"/>

        <ui:include src="/portal/preview/view.xhtml" />

        <script>
            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked;
                });
                $("#AssetContractEditForm\\:AttachList\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }

        </script>
    </ui:define>
</ui:composition>
