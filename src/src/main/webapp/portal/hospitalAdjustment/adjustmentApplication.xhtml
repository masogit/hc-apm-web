<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="新增闲置设备入库申请"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="adjustmentApplicationForm">

                    <!-- 1. 申报单位信息 -->
                    <p:fieldset legend="申报单位信息" id="assetList">
                        <p:panelGrid columns="2"  layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">单位名称</label>
                                <p:inputText value="#{adjustmentApplicationCreateController.selected.companyName}"
                                >
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">医共体所属类别</label>
                                <p:selectOneRadio id="status"
                                                  value="#{adjustmentApplicationCreateController.selected.medicalConsortiumType}"
                                                  required="true"
                                                  requiredMessage="医共体所属类别 #{msg.ValidationRequire}">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('MedicalConsortiumType')}"
                                                   var="item"
                                                   itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    <p:ajax event="change" process="@this"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">联系人</label>
                                <p:inputText value="#{adjustmentApplicationCreateController.selected.contactPerson}"
                                             style="width: 95%">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">联系电话</label>
                                <p:inputText value="#{adjustmentApplicationCreateController.selected.contactNumber}"
                                             style="width: 95%">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">申报日期</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                            locale="#{userContextService.getCalendarLocale()}" id="installDate"
                                            pattern="#{userContextService.timeFormat()}"
                                            value="#{adjustmentApplicationCreateController.selected.applicationDate}"
                                            showOn="button" readonlyInput="false" showButtonPanel="true"
                                            navigator="true" mask="true" style="width: 95%">
                                    <p:ajax event="dateSelect"/>
                                </p:calendar>
                            </h:panelGroup>
                            <h:outputText/>
                        </p:panelGrid>
                    </p:fieldset>

                    <!-- 2. 闲置设备基本信息 -->
                    <p:fieldset legend="闲置设备基本信息" style="margin-bottom:20px">

                        <!-- Row 1: 基础信息 -->
                        <p:panelGrid columns="4" layout="grid"  styleClass="ui-panelgrid-blank form-group">

                            <h:panelGroup>
                                <label class="label">#{msg.assetName}*</label>
                                <p:inputText id="assetName" readonly="true"
                                             value="#{adjustmentApplicationCreateController.selectedAsset.name}"
                                             placeholder="#{msg.noAssetSelected}" required="true"
                                             requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>
                                <p:commandButton class="popupIconButton"
                                                 actionListener="#{selectAssetController.prepareDialogCallback(adjustmentApplicationCreateController, 'adjustmentApplicationForm')}"
                                                 process="@this" icon="ui-icon-arrow-drop-down"
                                                 update="selectAssetDlgAdjust  adjustmentApplicationForm:assetName"
                                                 oncomplete="PF('varSelectAssetDlgAdjust').show();"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">设备型号/规格</label>
                                <p:inputText id="modelSpec" readonly="true"
                                             value="#{adjustmentApplicationCreateController.selectedAsset.functionType}"
                                             style="width: 95%">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.manufacture}</label>
                                <p:inputText id="manufacture" readonly="true"
                                             value="#{adjustmentApplicationCreateController.selectedAsset.manufacture}"
                                             style="width: 95%">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.purchaseDate}</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" disabled="true"
                                            locale="#{userContextService.getCalendarLocale()}" id="purchaseDate"
                                            pattern="#{userContextService.timeFormat()}"
                                            value="#{adjustmentApplicationCreateController.selectedAsset.purchaseDate}"
                                            showOn="button" readonlyInput="false" showButtonPanel="true"
                                            navigator="true" mask="true" style="width: 95%">
                                    <p:ajax event="dateSelect"/>
                                </p:calendar>
                            </h:panelGroup>
                        </p:panelGrid>

                        <!-- Row 2: 价格与年限 -->
                        <p:panelGrid columns="4" layout="grid"  styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.purchasePrice} (元)</label>
                                <p:inputNumber minValue="0" decimalPlaces="2" id="purchasePrice"  readonly="true"
                                               value="#{adjustmentApplicationCreateController.selectedAsset.purchasePrice}"
                                               style="width: 95%">
                                    <p:ajax/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">累计使用年限</label>
                                <div style="display: flex; align-items: center;">
                                    <p:inputNumber id="usedYears" minValue="0" decimalPlaces="0" maxValue="999"
                                                   value="#{adjustmentApplicationCreateController.selected.usedYears}" validatorMessage="累计使用年限必须在 0 到 999 之间"
                                                 >
                                        <p:ajax/>
                                        <f:validateLongRange minimum="0" maximum="999" />
                                    </p:inputNumber>
                                    <span style="margin-right: 10px;">年</span>

                                </div>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">折旧期限 (规定)</label>
                                <p:inputNumber minValue="0" maxValue="99" decimalPlaces="1"
                                               value="#{adjustmentApplicationCreateController.selected.depreciationPeriodYears}"
                                               requiredMessage="折旧期限 #{msg.ValidationRequire}" style="width: 95%">
                                    <p:ajax/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">是否超折旧期限</label>
                                <p:selectOneRadio
                                        value="#{adjustmentApplicationCreateController.selected.overDepreciation}">
                                    <f:selectItem itemLabel="是" itemValue="true"/>
                                    <f:selectItem itemLabel="否" itemValue="false"/>
                                    <p:ajax event="change" process="@this" update="@form"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="1" layout="grid"  styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{adjustmentApplicationCreateController.selected.overDepreciation == true}">
                            <h:panelGroup>
                                <label class="label">超期仍具备使用价值依据</label>
                                <p:inputText
                                        value="#{adjustmentApplicationCreateController.selected.overDepreciationReason}"
                                        style="width: 95%;">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="2" layout="grid"  styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">设备现状</label>
                                <p:selectOneRadio value="#{adjustmentApplicationCreateController.selected.deviceStatus}"
                                >
                                    <f:selectItem itemLabel="性能完好" itemValue="PERFECT"/>
                                    <f:selectItem itemLabel="可修复后正常使用" itemValue="REPAIRABLE"/>
                                    <f:selectItem itemLabel="超期仍具备使用价值" itemValue="STILL_USABLE"/>
                                    <p:ajax event="change" process="@this"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">维修记录摘要 (近2年)</label>
                                <p:inputText
                                        value="#{adjustmentApplicationCreateController.selected.maintenanceSummary}"
                                        style="width: 95%;">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">购置凭证编号</label>
                                <p:inputText value="#{adjustmentApplicationCreateController.selected.purchaseVoucherNo}"
                                             style="width: 95%;">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">设备产权性质</label>
                                <div style="display:flex; align-items:center; flex-wrap:wrap;">
                                    <p:selectOneRadio
                                            value="#{adjustmentApplicationCreateController.selected.propertyNature}"
                                    >
                                        <f:selectItem itemLabel="国有资产" itemValue="STATE_OWNED"/>
                                        <f:selectItem itemLabel="其他" itemValue="OTHER"/>
                                        <p:ajax event="change" process="@this" update="@form"/>
                                    </p:selectOneRadio>
                                    <p:inputText
                                            rendered="#{adjustmentApplicationCreateController.selected.propertyNature == 'OTHER'}"
                                            value="#{adjustmentApplicationCreateController.selected.propertyNatureDesc}"
                                            placeholder="请说明" style="width: 100px; margin-left: 5px;">
                                        <p:ajax/>
                                    </p:inputText>
                                </div>
                            </h:panelGroup>
                            <h:panelGroup colspan="2">
                                <label class="label">是否存在权利瑕疵</label>
                                <div style="display:flex; align-items:center; flex-wrap:wrap;">
                                    <p:selectOneRadio
                                            value="#{adjustmentApplicationCreateController.selected.hasRightsDefect}">
                                        <f:selectItem itemLabel="无" itemValue="false"/>
                                        <f:selectItem itemLabel="有" itemValue="true"/>
                                        <p:ajax event="change" process="@this" update="@form"/>
                                    </p:selectOneRadio>
                                    <p:inputText
                                            rendered="#{adjustmentApplicationCreateController.selected.hasRightsDefect == true}"
                                            value="#{adjustmentApplicationCreateController.selected.rightsDefectDescription}"
                                            placeholder="注明抵押、查封等" style="width: 120px; margin-left: 5px;">
                                        <p:ajax/>
                                    </p:inputText>
                                </div>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>


                    <p:fieldset legend="设置闲置原因" style="margin-bottom:20px">
                        <p:panelGrid columns="4" layout="grid"  styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup colspan="4">
                                <label class="label">闲置原因</label>
                                <p:selectOneRadio
                                                  value="#{adjustmentApplicationCreateController.selected.idleReasons}"
                                                  required="true"
                                                  requiredMessage="闲置原因 #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="业务调整" itemValue="BUSINESS_ADJUSTMENT"/>
                                    <f:selectItem itemLabel="更新换代" itemValue="UPDATE_REPLACEMENT"/>
                                    <f:selectItem itemLabel="科室撤并" itemValue="DEPARTMENT_MERGE"/>
                                    <f:selectItem itemLabel="其他" itemValue="OTHER"/>
                                    <p:ajax event="change" process="@this" update="@form"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                        </p:panelGrid>


                        <p:panelGrid columns="1" layout="grid"  styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{adjustmentApplicationCreateController.selected.idleReasons != null and adjustmentApplicationCreateController.selected.idleReasons.contains('OTHER')}">
                            <h:panelGroup>
                                <label class="label">其他原因详细说明</label>
                                <p:inputText
                                        value="#{adjustmentApplicationCreateController.selected.otherReasonDescription}"
                                        style="width: 95%;" required="true"
                                        requiredMessage="请选择'其他'时需填写详细说明">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="4"  layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">预计闲置期限</label>
                                <div style="display: flex; align-items: center;">
                                    <p:inputNumber id="expectedIdleYears" minValue="0" decimalPlaces="0" maxValue="999"
                                                   value="#{adjustmentApplicationCreateController.selected.expectedIdleYears}"  validatorMessage="闲置年数必须在 0 到 999 之间">
                                        <p:ajax/>
                                        <f:validateLongRange minimum="0" maximum="999" />
                                    </p:inputNumber>
                                    年
                                    <p:inputNumber id="expectedIdleMonths" minValue="0" max="11" decimalPlaces="0"
                                                   value="#{adjustmentApplicationCreateController.selected.expectedIdleMonths}"  validatorMessage="闲置月数必须在 0 到 11 之间"
                                                >
                                        <p:ajax/>
                                        <f:validateLongRange minimum="0" maximum="11"  />
                                    </p:inputNumber>
                                    月
                                </div>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:fieldset legend="附件材料清单" style="margin-bottom:20px">
                    <h:panelGroup>
                        <p:commandButton  value="批量删除文件"  validateClient="false" immediate="true" class="bathDeleteAttach" update=":adjustmentApplicationForm:AttachList @(.selectCheckBox) @(.selectCheckBoxHeader) @(.bathDeleteAttach) @(.bathDownloadAttach)" actionListener="#{adjustmentApplicationCreateController.bathDeleteAttach}" disabled="#{!adjustmentApplicationCreateController.isChecked()}">
                            <p:confirm header="批量删除文件"  message="您确认要删除选中的文件吗？" icon="ui-icon-warning"/>
                        </p:commandButton>
                        <p:commandButton value="批量下载文件" validateClient="false"  immediate="true" class="bathDownloadAttach" actionListener="#{adjustmentApplicationCreateController.bathDownloadAttach}" disabled="#{!adjustmentApplicationCreateController.isChecked()}" onclick="PrimeFaces.monitorDownload(start, stop);"  >
                            <p:fileDownload value="#{adjustmentApplicationCreateController.attachListFile}"/>
                        </p:commandButton>
                        <p:dataList id="AttachList" value="#{adjustmentApplicationCreateController.attachements}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}" style="text-align:left">
                            <f:facet name="header">
                                <div class="ui-g" style="text-align:left">
                                    <div class="ui-g-1">
                                        <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                            <p:ajax listener="#{adjustmentApplicationCreateController.onSelectAllOfPage}" update="@(.selectCheckBox) @(.selectCheckBoxHeader) @(.bathDeleteAttach) @(.bathDownloadAttach)" oncomplete="updateSelectAllCheckBox();" />
                                        </p:selectBooleanCheckbox>
                                    </div>
                                    <p:commandLink value="↑↓" actionListener="#{adjustmentApplicationCreateController.attachSort()}" update="AttachList"/>
                                    <h:outputText value="#{msg.AttachmentType}" class="ui-g-2"/>
                                    <h:outputText value="#{msg.FileName}" class="ui-g-3"/>
                                    <h:outputText value="#{msg.UploadTime}" class="ui-g-2" />
                                    <h:outputText value="#{msg.Uploader}" class="ui-g-2" />
                                    <p:commandLink value="#{msg.Add}#{msg.attachment}" immediate="true"  oncomplete="PF('uploadDialog').show()" class="ui-g-1" />
                                </div>
                            </f:facet>

                            <div class="ui-g">
                                <div class="ui-g-1">
                                    <p:selectBooleanCheckbox value="#{adjustmentApplicationCreateController.blobObjectSelectedMap[fileitem.id]}" id="selectCheckBox" class="selectCheckBoxHeader">
                                        <p:ajax process="@this" listener="#{adjustmentApplicationCreateController.pick(fileitem.id)}" update="@(.selectCheckBox) @(.selectCheckBox) @(.bathDeleteAttach) @(.bathDownloadAttach)" oncomplete="updateSelectAllCheckBox();" />
                                    </p:selectBooleanCheckbox>
                                </div>
                                <h:outputText value="#{fileitem.boSubTypeValue}" class="ui-g-2"/>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="ui-g-3"/>
                                <!--                                    <p:link href="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" class="ui-g-3" >#{fileitem.objectName}</p:link>-->
                                <h:outputText value="#{fileitem.createdDate}" class="ui-g-2">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                                </h:outputText>
                                <h:outputText value="#{adjustmentApplicationCreateController.getUserNameByUid(fileitem.createdBy)}" class="ui-g-2" />
<!--                                <p:commandLink value="#{msg.preview}" style="margin-right: 5px;" update="previewedDlg" rendered="#{fileitem.showPreview()}" process="@this" actionListener="#{preViewerBean.onServerEvent('', fileitem.objectStorageId)}" oncomplete="PF('previewedDlg').show()"/>-->
                                <p:commandLink value="#{msg.Delete}" style="margin-right: 5px;" update="AttachList" actionListener="#{adjustmentApplicationCreateController.removeAttachmentById(fileitem.id)}" process="@this" >
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandLink>
<!--                                <p:commandLink value="#{msg.approveAttactments}" style="margin-right: 5px;"  update="AttachList" process="@this" actionListener="#{adjustmentApplicationCreateController.approveAttachmentById(fileitem.id)}" />-->
<!--                                <p:commandLink value="#{msg.attactmentsApproved}" style="margin-right: 5px;"  process="@this"  rendered="#{!adjustmentApplicationCreateController.canApprove(fileitem.id)}" disabled="true"/>-->
                            </div>
                        </p:dataList>

                    </h:panelGroup>
                    </p:fieldset>
                    <div >

                        <p:commandButton action="#{adjustmentApplicationCreateController.temporarily}" immediate="true" validateClient="false"
                                         value="暂存"
                                         icon="ui-icon-check"
                                         update="@form"
                                         style="margin-left: 10px;"
                                        />
                        <p:commandButton action="#{adjustmentApplicationCreateController.submit}"
                                         value="提交"
                                         icon="ui-icon-check"
                                         update="@form"
                                         style="margin-left: 10px;"
                                        />

                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                         action="IdleEquipmentApplication?faces-redirect=true"
                                         style="margin-left: 10px;"/>
                    </div>

                </h:form>
            </div>
        </div>

        <ui:include src="selectAssetDialogAdjustment.xhtml"/>

<!--        <p:dialog header="提示" widgetVar="successMsg" modal="true" showEffect="fade" hideEffect="fade"-->
<!--                  resizable="false">-->
<!--            <p:outputLabel value="保存成功！"/>-->
<!--            <p:commandButton value="确定" type="button" onclick="PF('successMsg').hide();"/>-->
<!--        </p:dialog>-->


        <p:dialog id="uploadDialog" widgetVar="uploadDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.UploadFile}">
            <h:form id="uploadDialogForm" >
                <h:panelGroup id="display" >
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <p:selectOneMenu id="functionGroup" value="#{adjustmentApplicationCreateController.attachmentType}" autoWidth="false" style="width: 100%">
                                <p:ajax process="@this" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{adjustmentApplicationCreateController.getContractAttachmentTypeList()}" var="item" itemLabel="#{item.valueZh}" itemValue="#{item.msgKey}" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <p:dataList id="AttachUploadList" value="#{adjustmentApplicationCreateController.uploadedFileObjects}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">#{msg.attachment}</f:facet>
                                #{fileitem.objectName}
                                <p:commandButton actionListener="#{adjustmentApplicationCreateController.removeUploadedFileObjects(fileitem.id)}" update="AttachUploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:dataList>
                            <p:fileUpload allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/" fileUploadListener="#{adjustmentApplicationCreateController.uploadDataFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                          multiple="true" sizeLimit="209715200" update=":uploadDialogForm:AttachUploadList saveButton" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}200M"  label="#{msg.Add}" />
                        </h:panelGroup>


                    </p:panelGrid>
                    <h:panelGroup>
                        <p:commandButton id="saveButton" immediate="false" validateClient="true" actionListener="#{adjustmentApplicationCreateController.finishUpload()}" disabled="#{empty adjustmentApplicationCreateController.uploadedFileObjects}" value="#{msg.Confirm}"
                                         update=":adjustmentApplicationForm:AttachList :uploadDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'uploadDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{contractInfoEditController.cancelUpload()}" icon="ui-icon-cancel" onclick="PF('uploadDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <script>
            //<![CDATA[
            var newWin;
            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }
            function handleValidFields(xhr, status, args) {
                var valid = true;
                if (args.confirmedUpDate) {
                    $('#woTab\\:repairCompleteDialogForm\\:confirmedUpDate_input').addClass("ui-state-error");
                    valid = false;
                }
                if (args.caseType) {
                    $('#woTab\\:repairCompleteDialogForm\\:caseType').addClass("ui-state-error");
                    valid = false;
                }
                if (args.repairResult) {
                    $('#woTab\\:repairCompleteDialogForm\\:repairResult').addClass("ui-state-error");
                    valid = false;
                }
                if (args.manHours) {
                    $('#woTab\\:repairCompleteDialogForm\\:manHours_input').addClass("ui-state-error");
                    valid = false;
                }
                if (valid) {
                    handleSubmit(args, 'repairCompleteDialog');
                }
            }

            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#AssetContractEditForm\\:AttachList\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
            //]]>
        </script>
    </ui:define>
</ui:composition>
