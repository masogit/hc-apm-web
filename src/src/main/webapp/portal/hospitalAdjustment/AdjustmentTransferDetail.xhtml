<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <h:form id="transferForm">
            <p:fieldset legend="调入单位信息">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">单位名称</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.unitName}" readonly="true"
                                     style="width:95%">
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">医共体所属类别</label>

                        <p:selectOneRadio id="status" disabled="true"
                                          value="#{adjustmentTransferApplicationDetailController.selected.medicalCommunityType}"
                                          required="true"
                                          requiredMessage="医共体所属类别 #{msg.ValidationRequire}">
                            <f:selectItems value="#{fieldMsg.getFieldValueList('MedicalConsortiumType')}"
                                           var="item"
                                           itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            <p:ajax event="change" process="@this"/>
                        </p:selectOneRadio>
                    </h:panelGroup>
                </p:panelGrid>
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <!--                    <h:panelGroup>-->
                    <!--                        <label class="label">申请科室</label>-->
                    <!--                        <p:inputText value="#{adjustmentTransferApplicationDetailController.application.department}"-->
                    <!--                                     style="width:95%">-->
                    <!--                            <p:ajax/>-->
                    <!--                        </p:inputText>-->
                    <!--                    </h:panelGroup>-->

                    <h:panelGroup>
                        <label class="label">#{msg.clinicalDeptName}<span style="color:red">*</span></label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.filterDeptOrg.name}" readonly="true"
                                     style="width:95%">
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">联系人</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.contactPerson}" readonly="true">
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">联系电话</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.contactPhone}" readonly="true">
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">申报日期</label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" disabled="true"
                                    locale="#{userContextService.getCalendarLocale()}" id="installDate"
                                    pattern="#{userContextService.timeFormat()}"
                                    value="#{adjustmentTransferApplicationDetailController.selected.applicationDate}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true"
                                    navigator="true" mask="true" style="width: 95%">
                            <p:ajax event="dateSelect"/>
                        </p:calendar>
                    </h:panelGroup>
                    <h:outputText/>
                </p:panelGrid>
            </p:fieldset>


            <p:fieldset legend="需求设备基本要求">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">设备类型</label>

                        <p:selectOneRadio value="#{adjustmentTransferApplicationDetailController.selected.deviceType}" disabled="true">
                            <f:selectItem itemLabel="诊断设备" itemValue="DIAGNOSTIC_EQUIPMENT"/>
                            <f:selectItem itemLabel="治疗设备" itemValue="THERAPEUTIC_EQUIPMENT"/>
                            <f:selectItem itemLabel="辅助医疗设备" itemValue="AUXILIARY_MEDICAL_EQUIPMENT"/>
                            <f:selectItem itemLabel="通用医疗设备" itemValue="GENERAL_MEDICAL_EQUIPMENT"/>
                            <f:selectItem itemLabel="其他" itemValue="OTHER"/>
                            <p:ajax event="change" process="@this" update="@form"/>
                        </p:selectOneRadio>

                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.otherDeviceTypeNote}"
                                     placeholder="请注明"  readonly="true"
                                     rendered="#{adjustmentTransferApplicationDetailController.selected.deviceType == 'OTHER'}"
                                     style="margin-left: 10px;">
                            <p:ajax event="change" update="@form"/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">具体设备名称</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.specificDeviceName}" readonly="true">
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">核心技术参数 (必填)</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.coreTechnicalParams}" readonly="true">
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">次要技术参数 (可选)：</label>
                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.secondaryTechnicalParams}" readonly="true">
                            <p:ajax/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">预计使用时限：</label>
                        <p:inputNumber value="#{adjustmentTransferApplicationDetailController.selected.estimatedUsageYears}" readonly="true">
                            <p:ajax/>
                        </p:inputNumber>
                        <h:outputText value=" 年"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">用途说明</label>

                        <p:selectOneRadio value="#{adjustmentTransferApplicationDetailController.selected.descriptionOfUse}"  disabled="true">
                            <f:selectItem itemLabel="急救保障" itemValue="EMERGENCY"/>
                            <f:selectItem itemLabel="重点专科建设" itemValue="SPECIALTY"/>
                            <f:selectItem itemLabel="日常诊疗" itemValue="ROUTINE"/>
                            <f:selectItem itemLabel="应急救治" itemValue="RESCUE"/>
                            <f:selectItem itemLabel="其他" itemValue="OTHER"/>
                            <p:ajax event="change" process="@this" update="@form"/>
                        </p:selectOneRadio>

                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.otherDescriptionOfUseNote}"
                                     placeholder="请注明"  readonly="true"
                                     rendered="#{adjustmentTransferApplicationDetailController.selected.descriptionOfUse == 'OTHER'}"
                                     style="margin-left: 10px;">
                            <p:ajax event="change" update="@form"/>
                        </p:inputText>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>


            <p:fieldset legend="配套条件说明">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">场地条件：</label>

                        <p:selectOneRadio value="#{adjustmentTransferApplicationDetailController.selected.siteConditionStatus}" disabled="true">
                            <f:selectItem itemLabel="已具备" itemValue="READY"/>
                            <f:selectItem itemLabel="需改造" itemValue="NEEDS_RENOVATION"/>
                            <p:ajax event="change" update="@form"/>
                        </p:selectOneRadio>

                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.siteRenovationPlan}" readonly="true"
                                     placeholder="说明改造计划"
                                     rendered="#{adjustmentTransferApplicationDetailController.selected.siteConditionStatus == 'NEEDS_RENOVATION'}"
                                     style="margin-top:5px; width:95%">
                            <p:ajax event="change" update="@form"/>
                        </p:inputText>
                    </h:panelGroup>


                    <h:panelGroup>
                        <label class="label">电力保障：</label>

                        <p:selectOneRadio value="#{adjustmentTransferApplicationDetailController.selected.powerSupplyStatus}" disabled="true">
                            <f:selectItem itemLabel="已满足" itemValue="SATISFIED"/>
                            <f:selectItem itemLabel="需增容" itemValue="NEEDS_CAPACITY_INCREASE"/>
                            <p:ajax event="change" update="@form"/>
                        </p:selectOneRadio>

                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.powerCapacityDemand}" readonly="true"
                                     placeholder="说明增容需求"
                                     rendered="#{adjustmentTransferApplicationDetailController.selected.powerSupplyStatus == 'NEEDS_CAPACITY_INCREASE'}"
                                     style="margin-top:5px; width:95%">
                            <p:ajax event="change" update="@form"/>
                        </p:inputText>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">操作人员：</label>

                        <p:selectOneRadio value="#{adjustmentTransferApplicationDetailController.selected.operatorStatus}" disabled="true">
                            <f:selectItem itemLabel="已配备" itemValue="STAFFED"/>
                            <f:selectItem itemLabel="需培训" itemValue="NEEDS_TRAINING"/>
                            <p:ajax event="change" update="@form"/>
                        </p:selectOneRadio>


                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.operatorQualificationNote}" readonly="true"
                                     placeholder="注明资质"
                                     rendered="#{adjustmentTransferApplicationDetailController.selected.operatorStatus == 'STAFFED'}"
                                     style="margin-top:5px; width:95%">
                            <p:ajax event="change" update="@form"/>
                        </p:inputText>

                        <p:inputText value="#{adjustmentTransferApplicationDetailController.selected.operatorTrainingPlan}" readonly="true"
                                     placeholder="说明培训计划"
                                     rendered="#{adjustmentTransferApplicationDetailController.selected.operatorStatus == 'NEEDS_TRAINING'}"
                                     style="margin-top:5px; width:95%">
                            <p:ajax event="change" update="@form"/>
                        </p:inputText>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">维护能力：</label>
                        <p:selectOneRadio disabled="true"
                                value="#{adjustmentTransferApplicationDetailController.selected.maintenanceCapability}">
                            <f:selectItem itemLabel="自主维护" itemValue="SELF_MAINTENANCE"/>
                            <f:selectItem itemLabel="需医共体技术支持" itemValue="NEEDS_TECH_SUPPORT"/>
                            <p:ajax event="change"/>
                        </p:selectOneRadio>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>

            <p:fieldset legend="附件材料清单" style="margin-bottom:20px">
                <h:panelGroup>
                    <!--                        <p:commandButton value="批量删除文件" class="bathDeleteAttach" update=":adjustmentApplicationForm:AttachList @(.selectCheckBox) @(.selectCheckBoxHeader) @(.bathDeleteAttach) @(.bathDownloadAttach)" actionListener="#{adjustmentApplicationDetailController.bathDeleteAttach}" disabled="#{!adjustmentApplicationDetailController.isChecked()}">-->
                    <!--                            <p:confirm header="批量删除文件" message="您确认要删除选中的文件吗？" icon="ui-icon-warning"/>-->
                    <!--                        </p:commandButton>-->
                    <!--                        <p:commandButton value="批量下载文件" class="bathDownloadAttach" actionListener="#{adjustmentApplicationDetailController.bathDownloadAttach}" disabled="#{!adjustmentApplicationDetailController.isChecked()}" onclick="PrimeFaces.monitorDownload(start, stop);">-->
                    <!--                            <p:fileDownload value="#{contractInfoEditController.attachListFile}"/>-->
                    <!--                        </p:commandButton>-->
                    <p:dataList id="AttachList" value="#{adjustmentApplicationDetailController.attachements}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}" style="text-align:left">
                        <f:facet name="header">
                            <div class="ui-g" style="text-align:left">
                                <!--                                    <div class="ui-g-1">-->
                                <!--                                        <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">-->
                                <!--                                            <p:ajax listener="#{adjustmentApplicationDetailController.onSelectAllOfPage}" update="@(.selectCheckBox) @(.selectCheckBoxHeader) @(.bathDeleteAttach) @(.bathDownloadAttach)" oncomplete="updateSelectAllCheckBox();" />-->
                                <!--                                        </p:selectBooleanCheckbox>-->
                                <!--                                    </div>-->
                                <!--                                    <p:commandLink value="↑↓" actionListener="#{adjustmentApplicationDetailController.attachSort()}" update="AttachList"/>-->
                                <h:outputText value="#{msg.AttachmentType}" class="ui-g-2"/>
                                <h:outputText value="#{msg.FileName}" class="ui-g-3"/>
                                <h:outputText value="#{msg.UploadTime}" class="ui-g-2" />
                                <h:outputText value="#{msg.Uploader}" class="ui-g-2" />
                                <!--                                    <p:commandLink value="#{msg.Add}#{msg.attachment}" immediate="true"  oncomplete="PF('uploadDialog').show()" class="ui-g-1" />-->
                            </div>
                        </f:facet>

                        <div class="ui-g">
                            <!--                                <div class="ui-g-1">-->
                            <!--&lt;!&ndash;                                    <p:selectBooleanCheckbox value="#{adjustmentApplicationDetailController.blobObjectSelectedMap[fileitem.id]}" id="selectCheckBox" class="selectCheckBoxHeader">&ndash;&gt;-->
                            <!--&lt;!&ndash;                                        <p:ajax process="@this" listener="#{adjustmentApplicationDetailController.pick(fileitem.id)}" update="@(.selectCheckBox) @(.selectCheckBox) @(.bathDeleteAttach) @(.bathDownloadAttach)" oncomplete="updateSelectAllCheckBox();" />&ndash;&gt;-->
                            <!--&lt;!&ndash;                                    </p:selectBooleanCheckbox>&ndash;&gt;-->
                            <!--                                </div>-->
                            <h:outputText value="#{fileitem.boSubTypeValue}" class="ui-g-2"/>
                            <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="ui-g-3"/>
                            <!--                                    <p:link href="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" class="ui-g-3" >#{fileitem.objectName}</p:link>-->
                            <h:outputText value="#{fileitem.createdDate}" class="ui-g-2">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                            <h:outputText value="#{adjustmentApplicationDetailController.getUserNameByUid(fileitem.createdBy)}" class="ui-g-2" />
                            <p:commandLink value="#{msg.preview}" style="margin-right: 5px;" update="previewedDlg" rendered="#{fileitem.showPreview()}" process="@this" actionListener="#{preViewerBean.onServerEvent('', fileitem.objectStorageId)}" oncomplete="PF('previewedDlg').show()"/>
                            <!--                                <p:commandLink value="#{msg.Delete}" style="margin-right: 5px;" update="AttachList" actionListener="#{adjustmentApplicationDetailController.removeAttachmentById(fileitem.id)}" process="@this" >-->
                            <!--                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>-->
                            <!--                                </p:commandLink>-->
                            <!--                                <p:commandLink value="#{msg.approveAttactments}" style="margin-right: 5px;"  update="AttachList" process="@this" actionListener="#{adjustmentApplicationDetailController.approveAttachmentById(fileitem.id)}" />-->
                            <!--                                <p:commandLink value="#{msg.attactmentsApproved}" style="margin-right: 5px;"  process="@this"  rendered="#{!adjustmentApplicationDetailController.canApprove(fileitem.id)}" disabled="true"/>-->
                        </div>
                    </p:dataList>

                </h:panelGroup>
            </p:fieldset>
        </h:form>

    </ui:composition>
</html>
