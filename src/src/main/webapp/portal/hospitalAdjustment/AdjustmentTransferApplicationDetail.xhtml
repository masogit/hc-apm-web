<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            .ui-fileupload,
            .ui-fileupload .ui-fileupload-buttonbar,
            .ui-fileupload .ui-fileupload-content,
            .ui-fileupload .ui-fileupload-content .ui-fileupload-cancel,
            .ui-fileupload .ui-fileupload-content .ui-fileupload-files {
                width: 100% !important;
                box-sizing: border-box;
            }
            .ui-fileupload .ui-fileupload-content {
                min-height: 28px;
            }
            .ui-fileupload .ui-fileupload-buttonbar .ui-button {
                width: auto !important;
            }
            .tab-button-bar {
                margin-top: 15px;
                padding-top: 10px;
                border-top: 1px solid #ddd;
            }
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="调剂工单详情"/>
            </div>

            <div class="ui-g-12 card">

                #{adjustmentTransferApplicationDetailController.initIdleEquipmentApplication()}

                <p:tabView id="detailTabView" dynamic="false">

                    <!-- ==================== Tab1: 调剂设备详情 ==================== -->
                    <p:tab title="调剂设备详情">
                        <p:fieldset legend="调剂设备详情">
                            <ui:include src="AdjustmentEquipmentDetail.xhtml"/>
                        </p:fieldset>
                        <h:form id="tab1ButtonForm">
                            <div class="tab-button-bar">
                                <p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-arrow-back"
                                                 action="AdjustmentTransferApplication?faces-redirect=true"
                                                 style="margin-left: 10px;"/>
                                <p:commandButton value="下载文件"
                                                 actionListener="#{adjustmentTransferApplicationDetailController.download}"
                                                 style="margin-left: 10px;" update=":growl" ajax="false">
                                    <p:fileDownload value="#{adjustmentTransferApplicationDetailController.exportFile}"/>
                                </p:commandButton>
                            </div>
                        </h:form>
                    </p:tab>

                    <!-- ==================== Tab2: 调剂申请详情 ==================== -->
                    <p:tab title="调剂申请详情">
                        <p:fieldset legend="调剂详情">
                            <ui:include src="AdjustmentTransferDetail.xhtml"/>
                        </p:fieldset>
                        <h:form id="tab2ButtonForm">
                            <div class="tab-button-bar">
                                <p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-arrow-back"
                                                 action="AdjustmentTransferApplication?faces-redirect=true"
                                                 style="margin-left: 10px;"/>
                                <p:commandButton value="下载文件"
                                                 actionListener="#{adjustmentTransferApplicationDetailController.download}"
                                                 style="margin-left: 10px;" update=":growl" ajax="false">
                                    <p:fileDownload value="#{adjustmentTransferApplicationDetailController.exportFile}"/>
                                </p:commandButton>
                            </div>
                        </h:form>
                    </p:tab>

                    <!-- ==================== Tab3: 调剂过程详情 ==================== -->
                    <p:tab title="调剂过程详情">
                        <h:panelGroup id="workOrderInfoPanel">
                        <p:fieldset legend="工单信息">
                            <ui:include src="AdjustmentTransferInfoDetail.xhtml"/>
                        </p:fieldset>
                        </h:panelGroup>

                        <h:form id="transferDetailForm" enctype="multipart/form-data">
                    <p:fieldset legend="调剂中心处理意见"
                                rendered="#{!(adjustmentTransferApplicationDetailController.selected.status==1 and ! userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ADJUSTMENT_ACCEPTANCE'))  and adjustmentTransferApplicationDetailController.selected.status!=3  }">


                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                            <h:panelGroup>
                                <label class="label">初步筛选结果<span style="color:red">*</span></label>

                                <p:selectOneRadio id="screeningPanel"
                                                  disabled="#{ !(adjustmentTransferApplicationDetailController.selected.status==1  and     userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ADJUSTMENT_ACCEPTANCE'))}"
                                                  value="#{adjustmentTransferApplicationDetailController.selected.initialScreeningResult}" required="true" requiredMessage="初步筛选结果必填">

                                    <f:selectItem itemValue="matched" itemLabel="已匹配闲置设备"/>
                                    <f:selectItem itemValue="unmatched" itemLabel="无匹配设备"/>

                                    <p:ajax event="change" process="@this" update="transferDetailForm"/>
                                </p:selectOneRadio>

                                <h:panelGroup id="reasonInput"
                                              rendered="#{adjustmentTransferApplicationDetailController.selected.initialScreeningResult == 'unmatched'}">
                                    <h:outputLabel value="（说明原因）："/>
                                    <p:inputText  required="true" requiredMessage="说明原因必填"
                                            readonly="#{ !(adjustmentTransferApplicationDetailController.selected.status==1  and     userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ADJUSTMENT_ACCEPTANCE'))}"
                                            value="#{adjustmentTransferApplicationDetailController.selected.screeningReason}">
                                        <p:ajax/>
                                    </p:inputText>
                                </h:panelGroup>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">技术评估安排<span style="color:red">*</span></label>

                                <p:selectOneRadio id="assessmentPanel"
                                                  disabled="#{ !(adjustmentTransferApplicationDetailController.selected.status==1  and     userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ADJUSTMENT_ACCEPTANCE'))}"
                                                  value="#{adjustmentTransferApplicationDetailController.selected.technicalAssessment}"  required="true" requiredMessage="技术评估安排必填"
                                >

                                    <f:selectItem itemValue="none" itemLabel="无需现场评估"/>
                                    <f:selectItem itemValue="needed" itemLabel="需组织专家评估"/>

                                    <p:ajax event="change" process="@this" update="transferDetailForm"/>
                                </p:selectOneRadio>

                                <!-- 评估时间输入框，仅在选中“需组织专家评估”时显示 -->
                                <h:panelGroup id="datePicker" layout="block"
                                              rendered="#{adjustmentTransferApplicationDetailController.selected.technicalAssessment == 'needed'}">
                                    <h:outputLabel value="（评估时间：）"/>
                                    <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                                disabled="#{ !(adjustmentTransferApplicationDetailController.selected.status==1  and     userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ADJUSTMENT_ACCEPTANCE'))}"
                                                locale="#{userContextService.getCalendarLocale()}"
                                                pattern="#{userContextService.timeFormat()}"
                                                value="#{adjustmentTransferApplicationDetailController.selected.assessmentTime}"
                                                showOn="button" readonlyInput="false" showButtonPanel="true"
                                                navigator="true" mask="true" style="width: 95%"   required="true" requiredMessage="评估时间必填">
                                        <p:ajax event="dateSelect"/>
                                    </p:calendar>

                                </h:panelGroup>
                            </h:panelGroup>


                            <h:panelGroup>

                                <label class="label">经办人签字<span style="color:red">*</span></label>
                                <p:graphicImage
                                        rendered="#{adjustmentTransferApplicationDetailController.signatureId !=null}"
                                        value="#{fileDownloadService.getFile(adjustmentTransferApplicationDetailController.signatureId)}"
                                        height="80" width="100" stream="false">
                                </p:graphicImage>
                                <p:commandButton id="openSignature2" validateClient="false" immediate="true"
                                                 rendered="#{ adjustmentTransferApplicationDetailController.selected.status==1  and     userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ADJUSTMENT_ACCEPTANCE')}"
                                                 actionListener="#{adjustmentTransferApplicationDetailController.getSignature()}"
                                                 value="添加签名" update=":signatureDlg"
                                                 oncomplete="PF('signatureDlg').show();"/>

                            </h:panelGroup>

                            <h:panelGroup>

                                <span class="label" style="display:block; margin-bottom:5px;">处理日期</span>
                                <p:calendar
                                        disabled="#{ !(adjustmentTransferApplicationDetailController.selected.status==1  and     userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ADJUSTMENT_ACCEPTANCE'))}"
                                        value="#{adjustmentTransferApplicationDetailController.selected.applicationPendingApprovalDate}"
                                        pattern="yyyy-MM-dd HH:mm:ss"
                                        showOn="button"
                                        style="width:160px;"
                                        readonlyInput="true"/>

                            </h:panelGroup>


                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="到货确认"
                                rendered="#{adjustmentTransferApplicationDetailController.selected.status ge 6 or (adjustmentTransferApplicationDetailController.selected.status == 4 and adjustmentTransferApplicationDetailController.selected.applicationUid == adjustmentTransferApplicationDetailController.currentUserAccount.getUid())}">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                            <h:panelGroup rendered="#{adjustmentTransferApplicationDetailController.selected.status == 4 and adjustmentTransferApplicationDetailController.selected.applicationUid == adjustmentTransferApplicationDetailController.currentUserAccount.getUid()}">
                                <label class="label">确认人</label>
                                <p:inputText
                                        value="#{adjustmentTransferApplicationDetailController.currentUserAccount.name}"
                                        readonly="true"
                                        style="width:160px;">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{adjustmentTransferApplicationDetailController.selected.status == 4 and adjustmentTransferApplicationDetailController.selected.applicationUid == adjustmentTransferApplicationDetailController.currentUserAccount.getUid()}">
                                <label class="label">确认时间</label>
                                <p:calendar disabled="true"
                                            value="#{adjustmentTransferApplicationDetailController.currentTime}"
                                            pattern="yyyy-MM-dd HH:mm:ss"
                                            showOn="button"
                                            style="width:160px;"
                                            readonlyInput="true"/>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{adjustmentTransferApplicationDetailController.selected.status ge 6}">
                                <label class="label">确认人</label>
                                <p:inputText
                                        value="#{adjustmentTransferApplicationDetailController.getUserNameByUid(adjustmentTransferApplicationDetailController.selected.deliveryUid)}"
                                        readonly="true"
                                        style="width:160px;">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{adjustmentTransferApplicationDetailController.selected.status ge 6}">
                                <label class="label">确认时间</label>
                                <p:calendar disabled="true"
                                            value="#{adjustmentTransferApplicationDetailController.selected.deliveryDate}"
                                            pattern="yyyy-MM-dd HH:mm:ss"
                                            showOn="button"
                                            style="width:160px;"
                                            readonlyInput="true"/>
                            </h:panelGroup>

                        </p:panelGrid>

                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">调剂缔结协议<span style="color:red">*</span></label>

                                <h:panelGroup id="agreementFileListPanel" layout="block">
                                    <ui:repeat value="#{adjustmentTransferApplicationDetailController.agreementFiles}" var="agreementFile">
                                        <div style="margin-bottom:5px;">
                                            <p:commandLink
                                                    value="#{agreementFile.objectName}"
                                                    ajax="false"
                                                    actionListener="#{fileDownloadService.downloadFile(agreementFile.objectStorageId)}"/>
                                            <p:commandLink value=" 删除" ajax="true" rendered="#{adjustmentTransferApplicationDetailController.selected.status == 4 and adjustmentTransferApplicationDetailController.selected.applicationUid == adjustmentTransferApplicationDetailController.currentUserAccount.getUid()}"
                                                           actionListener="#{adjustmentTransferApplicationDetailController.deleteAgreementFile(agreementFile)}"
                                                           update=":detailTabView:transferDetailForm:agreementFileListPanel"
                                                           style="color:red; margin-left:10px;"/>
                                        </div>
                                    </ui:repeat>
                                </h:panelGroup>

                                <h:panelGroup id="agreementFileUploadPanel" layout="block"
                                              rendered="#{adjustmentTransferApplicationDetailController.selected.status == 4 and adjustmentTransferApplicationDetailController.selected.applicationUid == adjustmentTransferApplicationDetailController.currentUserAccount.getUid()}">

                                    <p:fileUpload fileUploadListener="#{adjustmentTransferApplicationDetailController.handleAgreementFileUpload}"
                                                 mode="advanced"
                                                  dragDropSupport="false" style="width:500px" process="@this"
                                                  multiple="false" sizeLimit="10000000"  update=":detailTabView:transferDetailForm:agreementFileListPanel"
                                                  auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}10M"
                                                  allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|xslt|XLS|XLSX|DOC|DOCX|PDF|XSLT)$/" label="#{msg.Add}"/>
                                </h:panelGroup>

                                <c:if test="#{adjustmentTransferApplicationDetailController.selected.status == 4 and adjustmentTransferApplicationDetailController.selected.applicationUid == adjustmentTransferApplicationDetailController.currentUserAccount.getUid()}">
                                    <div style="margin-top:10px;">
                                        <div>1. 编辑调剂协议
                                            <p:commandButton value="编辑调剂协议" icon="ui-icon-pencil"
                                                             actionListener="#{adjustmentTransferApplicationDetailController.openEditAgreement}"
                                                             oncomplete="openAgreementEditWindow(xhr, status, args)"
                                                             styleClass="ui-button-warning"/>
                                        </div>
                                        <div style="margin-top:5px;">2. 上传协议文件</div>

                                    </div>
                                </c:if>

                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="退回详情"
                                rendered="#{ adjustmentTransferApplicationDetailController.selected.status>=7 }">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">退回类型</label>
                                <p:inputText
                                        value="#{adjustmentTransferApplicationDetailController.getReturnTypeLabel(adjustmentTransferApplicationDetailController.selected.returnType)}"
                                        readonly="true"
                                >
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">申请人</label>
                                <p:inputText
                                        value="#{adjustmentTransferApplicationDetailController.getUserNameByUid(adjustmentTransferApplicationDetailController.selected.returnUid)}"
                                        readonly="true"
                                >
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>

                            <h:panelGroup>

                                <label class="label">申请时间</label>
                                <p:calendar disabled="true"
                                            value="#{adjustmentTransferApplicationDetailController.selected.returnDate}"
                                            pattern="yyyy-MM-dd HH:mm:ss"
                                            showOn="button"
                                            style="width:160px;"
                                            readonlyInput="true"/>

                            </h:panelGroup>

                            <h:panelGroup>

                                <label class="label">申请原因</label>
                                <p:inputText
                                        readonly="true"
                                        value="#{adjustmentTransferApplicationDetailController.selected.returnReason}">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>

                            <h:panelGroup
                                    rendered="#{ (adjustmentTransferApplicationDetailController.selected.status==8 or adjustmentTransferApplicationDetailController.selected.status==10) }">
                                <label class="label">审批人</label>
                                <p:inputText
                                        value="#{adjustmentTransferApplicationDetailController.getUserNameByUid(adjustmentTransferApplicationDetailController.selected.returnApprovalUid)}"
                                        readonly="true"
                                >
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>

                            <h:panelGroup
                                    rendered="#{ (adjustmentTransferApplicationDetailController.selected.status==8 or adjustmentTransferApplicationDetailController.selected.status==10) }">

                                <label class="label">审批时间</label>
                                <p:calendar disabled="true"
                                            value="#{adjustmentTransferApplicationDetailController.selected.returnApprovalDate}"
                                            pattern="yyyy-MM-dd HH:mm:ss"
                                            showOn="button"
                                            style="width:160px;"
                                            readonlyInput="true"/>

                            </h:panelGroup>

                            <h:panelGroup
                                    rendered="#{ (adjustmentTransferApplicationDetailController.selected.status==8 or adjustmentTransferApplicationDetailController.selected.status==10) }">

                                <label class="label">审批结果</label>
                                <p:inputText
                                        value="#{adjustmentTransferApplicationDetailController.selected.returnApprovalResult==null?'':adjustmentTransferApplicationDetailController.selected.returnApprovalResult==1?'审批通过':'审批拒绝'}"
                                        readonly="true"
                                >
                                    <p:ajax/>
                                </p:inputText>

                            </h:panelGroup>

                        </p:panelGrid>

                        <h:panelGroup layout="block" style="margin:10px 15px;"
                                      rendered="#{not empty adjustmentTransferApplicationDetailController.returnImages}">
                            <label class="label" style="display:block; margin-bottom:5px;">退回图片</label>
                            <ui:repeat value="#{adjustmentTransferApplicationDetailController.returnImages}" var="returnImg">
                                <div style="display:inline-block; margin:5px; text-align:center;">
                                    <p:graphicImage value="#{fileDownloadService.getFile(returnImg.objectStorageId)}"
                                                    width="80" height="80" stream="false"/>
                                </div>
                            </ui:repeat>
                        </h:panelGroup>

                    </p:fieldset>
                    <p:fieldset legend="调剂中止协议"
                                rendered="#{ adjustmentTransferApplicationDetailController.selected.status==10 or adjustmentTransferApplicationDetailController.selected.status==8 }">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">

                            <h:panelGroup>
                                <label class="label">协议文件<span style="color:red">*</span></label>

                                <h:panelGroup id="terminationFileListPanel" layout="block">
                                    <ui:repeat value="#{adjustmentTransferApplicationDetailController.terminationAgreementFiles}" var="terminationFile">
                                        <div style="margin-bottom:5px;">
                                            <p:commandLink
                                                    value="#{terminationFile.objectName}"
                                                    ajax="false"
                                                    actionListener="#{fileDownloadService.downloadFile(terminationFile.objectStorageId)}"/>
                                            <p:commandLink value=" 删除" ajax="true" rendered="#{adjustmentTransferApplicationDetailController.selected.status == 10 and adjustmentTransferApplicationDetailController.selected.applicationUid == adjustmentTransferApplicationDetailController.currentUserAccount.getUid()}"
                                                           actionListener="#{adjustmentTransferApplicationDetailController.deleteTerminationAgreementFile(terminationFile)}"
                                                           update=":detailTabView:transferDetailForm:terminationFileListPanel"
                                                           style="color:red; margin-left:10px;"/>
                                        </div>
                                    </ui:repeat>
                                </h:panelGroup>

                                <h:panelGroup id="terminationFileUploadPanel" layout="block"
                                              rendered="#{adjustmentTransferApplicationDetailController.selected.status == 10 and adjustmentTransferApplicationDetailController.selected.applicationUid == adjustmentTransferApplicationDetailController.currentUserAccount.getUid()}">

                                    <p:fileUpload fileUploadListener="#{adjustmentTransferApplicationDetailController.handleTerminationAgreementFileUpload}"
                                                 mode="advanced"
                                                 dragDropSupport="false" style="width:500px" process="@this"
                                                 multiple="false" sizeLimit="10000000" update=":detailTabView:transferDetailForm:terminationFileListPanel"
                                                 auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}10M"
                                                 allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|xslt|XLS|XLSX|DOC|DOCX|PDF|XSLT)$/" label="#{msg.Add}"/>
                                </h:panelGroup>


                                <div style="margin-top:10px;">
                                    <div>1. 编辑终止协议
                                        <p:commandButton value="编辑终止协议" icon="ui-icon-pencil"
                                                         actionListener="#{adjustmentTransferApplicationDetailController.openEditTerminationAgreement}"
                                                         oncomplete="openAgreementEditWindow(xhr, status, args)"
                                                         styleClass="ui-button-warning"
                                        rendered="#{adjustmentTransferApplicationDetailController.selected.status == 10 and adjustmentTransferApplicationDetailController.selected.applicationUid == adjustmentTransferApplicationDetailController.currentUserAccount.getUid()}"/>
                                    </div>
                                    <div style="margin-top:5px;">2. 上传协议文件</div>

                                </div>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                        <div class="tab-button-bar">
                            <p:commandButton value="同意" icon="ui-icon-check"
                                             rendered="#{ adjustmentTransferApplicationDetailController.selected.status==1  and     userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ADJUSTMENT_ACCEPTANCE')}"
                                             actionListener="#{adjustmentTransferApplicationDetailController.applicationApproval}"
                                             update=":detailTabView:transferDetailForm :detailTabView:workOrderInfoPanel"
                                             style="margin-left: 10px;"/>

                            <p:commandButton value="拒绝" icon="ui-icon-cancel"
                                             rendered="#{ adjustmentTransferApplicationDetailController.selected.status==1  and     userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_IDLE_EQUIPMENT_ADJUSTMENT_ACCEPTANCE')}"
                                             actionListener="#{adjustmentTransferApplicationDetailController.refuse}"
                                             update=":detailTabView:transferDetailForm :detailTabView:workOrderInfoPanel"
                                             style="margin-left: 10px;"/>

                            <p:commandButton immediate="true" value="取消借用" icon="ui-icon-cancel"
                                             rendered="#{ (adjustmentTransferApplicationDetailController.selected.status==1  or   adjustmentTransferApplicationDetailController.selected.status==4  ) and      adjustmentTransferApplicationDetailController.selected.applicationUid==adjustmentTransferApplicationDetailController.currentUserAccount.getUid()}"
                                             actionListener="#{adjustmentTransferApplicationDetailController.cancel}"
                                             update=":detailTabView:transferDetailForm :detailTabView:workOrderInfoPanel"
                                             style="margin-left: 10px;"/>

                            <p:commandButton immediate="true" value="确认到货" icon="ui-icon-check"
                                             rendered="#{ adjustmentTransferApplicationDetailController.selected.status==4  and   adjustmentTransferApplicationDetailController.selected.applicationUid==adjustmentTransferApplicationDetailController.currentUserAccount.getUid()}"
                                             actionListener="#{adjustmentTransferApplicationDetailController.confirmReceipt}"
                                             update=":detailTabView:transferDetailForm :detailTabView:workOrderInfoPanel"
                                             style="margin-left: 10px;"/>

                            <p:commandButton immediate="true" value="设备退回" icon="ui-icon-cancel"
                                             rendered="#{ adjustmentTransferApplicationDetailController.selected.status==6  and   adjustmentTransferApplicationDetailController.selected.applicationUid==adjustmentTransferApplicationDetailController.currentUserAccount.getUid()   }"
                                             actionListener="#{adjustmentTransferApplicationDetailController.beforeReturn}"
                                             update=":returnDlg"
                                             oncomplete="PF('returnDlg').show();"
                                             style="margin-left: 10px;"/>

                            <p:commandButton immediate="true" value="退回确认" icon="ui-icon-check"
                                             rendered="#{ adjustmentTransferApplicationDetailController.selected.status==10 and adjustmentTransferApplicationDetailController.selected.applicationUid==adjustmentTransferApplicationDetailController.currentUserAccount.getUid() }"
                                             actionListener="#{adjustmentTransferApplicationDetailController.returnConfirm}"
                                             update=":detailTabView:transferDetailForm :detailTabView:workOrderInfoPanel"
                                             style="margin-left: 10px;"/>

                            <p:commandButton immediate="true" value="审批通过" icon="ui-icon-check"
                                             rendered="#{ adjustmentTransferApplicationDetailController.selected.status==7    and     adjustmentTransferApplicationDetailController.selected.stockHospitalUid==adjustmentTransferApplicationDetailController.currentUserAccount.hospitalUID   and     userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_WORKBENCH')}"
                                             actionListener="#{adjustmentTransferApplicationDetailController.returnPass}"
                                             update=":detailTabView:transferDetailForm :detailTabView:workOrderInfoPanel"
                                             style="margin-left: 10px;"/>

                            <p:commandButton immediate="true" value="审批拒绝" icon="ui-icon-cancel"
                                             rendered="#{ adjustmentTransferApplicationDetailController.selected.status==7    and     adjustmentTransferApplicationDetailController.selected.stockHospitalUid==adjustmentTransferApplicationDetailController.currentUserAccount.hospitalUID   and     userContextService.accessContainsFunctionMenu('HOSPITAL_ADJUSTMENT_WORKBENCH')}"
                                             actionListener="#{adjustmentTransferApplicationDetailController.returnRefuse}"
                                             update=":detailTabView:transferDetailForm :detailTabView:workOrderInfoPanel"
                                             style="margin-left: 10px;"/>

                            <p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-arrow-back"
                                             action="AdjustmentTransferApplication?faces-redirect=true"
                                             style="margin-left: 10px;"/>

                            <p:commandButton value="下载文件"
                                             actionListener="#{adjustmentTransferApplicationDetailController.download}"
                                             style="margin-left: 10px;" update=":growl" ajax="false">
                                <p:fileDownload value="#{adjustmentTransferApplicationDetailController.exportFile}"/>
                            </p:commandButton>
                        </div>

                        </h:form>
                    </p:tab>

                </p:tabView>

                <ui:include src="/portal/preview/view.xhtml" />

                <p:dialog id="signatureDlg" widgetVar="signatureDlg" header="签名" modal="true">
                    <h:form id="signatureForm">
                        <h:panelGrid columnClasses="value" columns="1">
                            <h:panelGroup>
                                <p:signature id="signatureContent" style="width:400px;height:200px" widgetVar="sigPanel"
                                             base64Value="#{adjustmentTransferApplicationDetailController.signatureContent}"
                                             guideline="false"
                                             rendered="#{adjustmentTransferApplicationDetailController.signatureContentStream==null}"/>
                                <p:graphicImage
                                        value="#{adjustmentTransferApplicationDetailController.signatureContentStream}"
                                        stream="false"
                                        rendered="#{adjustmentTransferApplicationDetailController.signatureContentStream!=null}"></p:graphicImage>
                            </h:panelGroup>
                        </h:panelGrid>
                        <p:commandButton value="确认"
                                         actionListener="#{adjustmentTransferApplicationDetailController.saveSignatureAndSubmitApprove()}"
                                         update=":detailTabView:transferDetailForm"
                                         oncomplete="handleApproveSuccess(xhr, status, args);"/>
                        <p:commandButton immediate="true" process="@this" value="重写"
                                         actionListener="#{adjustmentTransferApplicationDetailController.resetSignature()}"
                                         update="signatureForm" oncomplete="PF('sigPanel').clear()"/>
                        <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}"
                                         onclick="PF('signatureDlg').hide()"/>
                    </h:form>
                    <script>
                        function handleApproveSuccess(xhr, status, args) {
                            if (xhr.status !== 206) {
                                PF('signatureDlg').hide();
                            }
                        }
                    </script>
                </p:dialog>


                <p:dialog id="returnDlg" widgetVar="returnDlg" header="设备退回确认" modal="true" width="600">
                    <h:form id="returnForm" enctype="multipart/form-data">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">退回类型<span style="color:red">*</span></label>
                                <p:selectOneMenu id="returnTypeSelect"
                                                 value="#{adjustmentTransferApplicationDetailController.selected.returnType}"
                                                 required="true" requiredMessage="退回类型必填"
                                                 style="width:95%">
                                    <f:selectItem itemLabel="请选择" itemValue="" noSelectionOption="true"/>
                                    <f:selectItem itemLabel="报废退回" itemValue="scrapReturn"/>
                                    <f:selectItem itemLabel="协议退回" itemValue="agreementReturn"/>
                                    <f:selectItem itemLabel="无使用需求退回" itemValue="noUsageReturn"/>
                                    <p:ajax/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">退回原因<span style="color:red">*</span></label>
                                <p:inputTextarea required="true" requiredMessage="退回原因必填"
                                                 value="#{adjustmentTransferApplicationDetailController.selected.returnReason}"
                                                 rows="4" cols="30"
                                                 style="width:95%"
                                                 autoResize="false">
                                    <p:ajax/>
                                </p:inputTextarea>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">申请人</label>
                                <p:inputText
                                        value="#{adjustmentTransferApplicationDetailController.currentUserAccount.name}"
                                        readonly="true"
                                        style="width:95%">
                                    <p:ajax/>
                                </p:inputText>
                            </h:panelGroup>


                            <h:panelGroup>
                                <label class="label">申请时间</label>
                                <p:calendar disabled="true"
                                            value="#{adjustmentTransferApplicationDetailController.selected.returnDate}"
                                            pattern="yyyy-MM-dd HH:mm:ss"
                                            showOn="button"
                                            style="width:160px;"
                                            readonlyInput="true"/>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:fieldset legend="增加图片（图片数量最多上传5份！）" style="margin-top:10px;">
                            <h:panelGroup id="returnImageListPanel" layout="block">
                                <ui:repeat value="#{adjustmentTransferApplicationDetailController.returnImages}" var="returnImage">
                                    <div style="display:inline-block; margin:5px; text-align:center;">
                                        <p:graphicImage value="#{fileDownloadService.getFile(returnImage.objectStorageId)}"
                                                        width="80" height="80" stream="false"/>
                                        <br/>
                                        <p:commandLink value="删除"
                                                       actionListener="#{adjustmentTransferApplicationDetailController.deleteReturnImage(returnImage)}"
                                                       update=":returnForm:returnImageListPanel :returnForm:returnImageUploadPanel"
                                                       style="color:red;"/>
                                    </div>
                                </ui:repeat>
                            </h:panelGroup>

                            <h:panelGroup id="returnImageUploadPanel" layout="block" style="margin-top:5px;">
                                <p:fileUpload fileUploadListener="#{adjustmentTransferApplicationDetailController.handleReturnImageUpload}"
                                              mode="advanced"
                                              dragDropSupport="false"
                                              process="@this"
                                              multiple="true"
                                              sizeLimit="10000000"
                                              update=":returnForm:returnImageListPanel :returnForm:returnImageUploadPanel"
                                              auto="true"
                                              allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|GIF|JPE?G|PNG|BMP)$/"
                                              label="添加"/>
                            </h:panelGroup>
                        </p:fieldset>

                        <p:commandButton value="确认退回" validateClient="true"
                                         actionListener="#{adjustmentTransferApplicationDetailController.equipmentReturn()}"
                                         update=":detailTabView:transferDetailForm :detailTabView:workOrderInfoPanel"
                                         oncomplete="handleReturnSuccess(xhr, status, args);"/>

                        <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}"
                                         onclick="PF('returnDlg').hide()"/>
                    </h:form>
                    <script>
                        function handleReturnSuccess(xhr, status, args) {
                            if (xhr.status !== 206) {
                                PF('returnDlg').hide();
                            }
                        }
                    </script>
                </p:dialog>
            </div>


        </div>


        <script>
            function openAgreementEditWindow(xhr, status, args) {
                if (args &amp;&amp; args.url) {
                    window.open(args.url, '_blank');
                }
            }
        </script>
    </ui:define>
</ui:composition>
