<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style type="text/css">
            .radiolabelPF {
                margin-left: 7px;
                margin-right: 40px;
            }
        </style>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="功能模块激活"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="activeForm">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">医院</label>
                            <p:inputText value="#{activeFeatureController.selectHospital.name}" readonly="true"></p:inputText>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:fieldset id="featureList" legend="功能列表">
                        <c:forEach items="#{activeFeatureController.findAdminActiveFeatures()}" var="item" varStatus="status" >
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <p:selectBooleanCheckbox disabled="#{activeFeatureController.oldFeatureMap[activeFeatureController.getFeatureName(item)]}"
                                        value="#{activeFeatureController.selectFeatureMap[activeFeatureController.getFeatureName(item)]}"
                                        itemLabel="#{item.featureName}">
                                    <p:ajax update="featureList"
                                            listener="#{activeFeatureController.featureChange(item)}"/>
                                </p:selectBooleanCheckbox>
                                <p:outputLabel value="#{item.featureName}菜单"/>
                                <p:outputLabel></p:outputLabel>
                                <p:outputLabel></p:outputLabel>
                            </p:panelGrid>
                        </c:forEach>
                    </p:fieldset>
                    <p:fieldset id="customFeatureList" legend="自定义功能列表">
                        <c:forEach items="#{activeFeatureController.findAdminActiveCustomFeatures()}" var="item" varStatus="status" >
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <p:selectBooleanCheckbox disabled="#{activeFeatureController.oldCustomFunctionMap[item]}"
                                                         value="#{activeFeatureController.selectCustomFunctionMap[item]}"
                                                         itemLabel="#{item}">
                                    <p:ajax update="customFeatureList"
                                            listener="#{activeFeatureController.featureChange(item)}"/>
                                </p:selectBooleanCheckbox>
                                <p:outputLabel value="#{item}"/>
                                <p:outputLabel></p:outputLabel>
                                <p:outputLabel></p:outputLabel>
                            </p:panelGrid>
                        </c:forEach>
                    </p:fieldset>
                    <br/>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <p:scrollPanel style="width:580px;height:300px" mode="native">
                            <p>为明确双方的权利和义务， 用户启用本服务前，须仔细阅读本协议服务条款。</p>
                            <p>当您勾选选择“已阅读相关用户协议并确认激活功能模块”，即表示您已经达成本协议，承诺并遵守本协议的规定， 确认激活功能模块，同意并接受全部服务条款及条件。</p>
                            <p>#{msg.Lisence2}</p>
                            <p>#{msg.Lisence11}</p>
                            <p>#{msg.Lisence12}</p>
                            <p>#{msg.Lisence13}</p>
                            <p>#{msg.Lisence14}</p>
                            <p>#{msg.Lisence15}</p>
                        </p:scrollPanel>
                        <p:selectBooleanCheckbox value="#{activeFeatureController.confirm}" itemLabel="*我已阅读相关用户协议并确认激活功能模块:" style="color: #bcbec1">
                            <p:ajax update="saveButton"/>
                        </p:selectBooleanCheckbox>
                    </p:panelGrid>
                    <p:commandButton id="saveButton" disabled="#{!activeFeatureController.confirm}" validateClient="true" actionListener="#{activeFeatureController.addHospital}"
                                     value="#{msg.Activate}" update=":activeForm " icon="ui-icon-check"/>
                </h:form>
            </div>
        </div>


    </ui:define>

</ui:composition>
