<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="assetOperationEditDlg" widgetVar="assetOperationEditDialog" modal="true" resizable="true"
              draggable="true" appendTo="@(body)" header="#{msg.assetOperation}" height="600" width="600">
        <h:form id="editOperationForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">#{msg.Year}</label>
                    <p:inputText value="#{keyAssetReportController.assetOperationDetail.month}" style="width: 85%"
                                 autocomplete="off"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.annualNumberOfCheck}</label>
                    <p:inputNumber decimalPlaces="0"
                                   value="#{keyAssetReportController.assetOperationDetail.annualNumberOfCheck}"
                                   inputStyle="width: 85%"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.annualIncome}</label>
                    <p:inputNumber value="#{keyAssetReportController.assetOperationDetail.annualIncome}"
                                   inputStyle="width: 85%"/>
                </h:panelGroup> <h:panelGroup>
                <label class="label">#{msg.depreciation}</label>
                <p:inputNumber value="#{keyAssetReportController.assetOperationDetail.depreciation}"
                               inputStyle="width: 85%"/>
            </h:panelGroup> <h:panelGroup>
                <label class="label">#{msg.annualRepairExpenses}</label>
                <p:inputNumber value="#{keyAssetReportController.assetOperationDetail.annualRepairExpenses}"
                               inputStyle="width: 85%"/>
            </h:panelGroup> <h:panelGroup>
                <label class="label">#{msg.annualMaintenanceExpenses}</label>
                <p:inputNumber value="#{keyAssetReportController.assetOperationDetail.annualMaintenanceExpenses}"
                               inputStyle="width: 85%"/>
            </h:panelGroup> <h:panelGroup>
                <label class="label">#{msg.annualConsumablesExpenses}</label>
                <p:inputNumber value="#{keyAssetReportController.assetOperationDetail.annualConsumablesExpenses}"
                               inputStyle="width: 85%"/>
            </h:panelGroup>
            </p:panelGrid>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" update=":growl editForm:assetOperationForYear"
                             icon="ui-icon-check"
                             actionListener="#{keyAssetReportController.saveAssetOperation}"
                             oncomplete="handleSubmit(args, 'assetOperationEditDialog');"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel"
                             onclick="PF('assetOperationEditDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
