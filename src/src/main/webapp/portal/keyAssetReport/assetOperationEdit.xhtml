<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="assetOperationEditDlg" widgetVar="assetOperationEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.assetOperation}" height="270" width="400">
            <h:form id="editOperationForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.Year}</label>
                        <p:inputText value="#{keyAssetReportController.assetOperationDetail.month}" style="width: 85%" autocomplete="off" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.checkItemNum}</label>
                        <p:inputNumber decimalPlaces="0" value="#{keyAssetReportController.assetOperationDetail.checkPeopleNum}" inputStyle="width: 85%"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.sumIncome}</label>
                        <p:inputNumber value="#{keyAssetReportController.assetOperationDetail.sumIncome}" inputStyle="width: 85%"/>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" update=":growl editForm:assetOperationForYear" icon="ui-icon-check"
                                 actionListener="#{keyAssetReportController.saveAssetOperation}"
                                 oncomplete="handleSubmit(args, 'assetOperationEditDialog');"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('assetOperationEditDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
