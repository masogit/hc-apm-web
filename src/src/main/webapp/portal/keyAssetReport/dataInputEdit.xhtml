<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="keyAssetReportEditDlg" widgetVar="keyAssetReportEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.keyAssetDataInput}" height="650" width="1200">
            <h:form id="editForm">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.reportYear}*</label>
                        <p:inputNumber id="reportYear" decimalPlaces="0" thousandSeparator="" maxValue="9999" value="#{keyAssetReportController.selected.reportYear}" inputStyle="width: 85%" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.reportType}*</label>
                        <p:selectOneMenu style="width: 85%" value="#{keyAssetReportController.selected.reportType}">
                            <p:ajax event="change" update="assetDetailPanel assetOperationaPanel"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('keyAssetReportType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EquipmentName}*</label>
                        <p:inputText value="#{keyAssetReportController.selected.assetName}" immediate="true" style="width: 85%" autocomplete="off" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.formFiller}*</label>
                        <p:inputText value="#{keyAssetReportController.selected.formFiller}" style="width: 85%" autocomplete="off" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.formFillTime}*</label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                    locale="#{userContextService.getCalendarLocale()}"
                                    pattern="#{userContextService.timeFormat()}"
                                    value="#{keyAssetReportController.selected.formFillTime}" inputStyle="width: 85%"
                                    showOn="button" showButtonPanel="true" navigator="true" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.clinicaldepart}*</label>
                        <p:inputText id="dept" style="width: 80%"
                                     value="#{keyAssetReportController.selected.assetDeptName}"/>
<!--                        <p:commandButton id="org" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton"/>-->
<!--                        <p:overlayPanel id="popupPanel" widgetVar="varOrg" for="org" hideEffect="fade" style="position: absolute; left: 0; top: 0; width: 300px;" dynamic="false" modal="false" dismissable="true">-->
<!--                            <p:scrollPanel style="height:300px; border: 0" mode="native">-->
<!--                                <p:tree id="orgTree" value="#{keyAssetReportController.orgTree}" var="node"-->
<!--                                        selectionMode="single" class="tree" style="width:98%; border:0">-->
<!--                                    <p:ajax process="@this" event="select" update="editForm:dept editForm:selectAssetBtn"-->
<!--                                            listener="#{keyAssetReportController.onSelectTreeNode}"-->
<!--                                            oncomplete="PF('varOrg').hide();"/>-->
<!--                                    <p:ajax process="@this" event="expand"/>-->
<!--                                    <p:ajax process="@this" event="collapse"/>-->
<!--                                    <p:treeNode type="org">-->
<!--                                        <h:outputText value="#{node}"/>-->
<!--                                    </p:treeNode>-->
<!--                                </p:tree>-->
<!--                            </p:scrollPanel>-->
<!--                        </p:overlayPanel>-->
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.selectAssetChoose}*</label>
                        <p:commandButton id="selectAssetBtn" value="#{msg.selectAssetChoose}"
                            actionListener="#{keyAssetReportController.resetSelectAssetPage}" update=":keyAssetSelectDlg" oncomplete="PF('keyAssetSelectDialog').show()"/>
                    </h:panelGroup>
                </p:panelGrid>
                <p:fieldset legend="#{msg.assetDetail}" id="assetDetailPanel">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <p:dataTable id="assetDetail" value="#{keyAssetReportController.assetDetail}" var="item" editable="true"
                                     rowKey="#{item}" rows="999" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="#{msg.functionType}">
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.brand}">
                                <h:outputText value="#{item.brand}"/>
                            </p:column>
                            <p:column headerText="#{msg.quantity}">
                                <h:outputText value="#{item.quantity}"/>
                            </p:column>
                            <p:column headerText="#{msg.installDate}">
                                <h:outputText value="#{item.installDate}"/>
                            </p:column>
                            <p:column headerText="#{msg.locationName}">
                                <h:outputText value="#{item.locationName}"/>
                            </p:column>
                            <p:column headerText="#{msg.Price}">
                                <p:cellEditor>
                                    <f:facet name="output">
                                        <h:outputText value="#{item.price}"/>
                                    </f:facet>
                                    <f:facet name="input">
                                        <p:inputNumber value="#{item.price}" inputStyle="max-width: 80%"/>
                                    </f:facet>
                                </p:cellEditor>
                            </p:column>
                            <p:column headerText="#{msg.Operation}" style="width: 70px">
                                <p:rowEditor editTitle="#{msg.Edit}" cancelTitle="#{msg.Cancel}#{msg.Edit}" saveTitle="#{msg.Save}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset legend="#{msg.assetOperation}" id="assetOperationaPanel">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{1 == keyAssetReportController.selected.reportType}">
                        <p:dataTable id="assetOperation" value="#{keyAssetReportController.assetOperation}" var="item" editable="true"
                                     rowKey="#{item}" rows="999" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="#{msg.month}">
                                <h:outputText value="#{item.month}"/>
                            </p:column>
                            <p:column headerText="#{msg.numberOfCheck}">
                                <p:cellEditor>
                                    <f:facet name="output">
                                        <h:outputText value="#{item.numberOfCheck}"/>
                                    </f:facet>
                                    <f:facet name="input">
                                        <p:inputNumber decimalPlaces="0" value="#{item.numberOfCheck}" style="max-width: 80%"/>
                                    </f:facet>
                                </p:cellEditor>
                            </p:column>
                            <p:column headerText="#{msg.income}">
                                <p:cellEditor>
                                    <f:facet name="output">
                                        <h:outputText value="#{item.income}"/>
                                    </f:facet>
                                    <f:facet name="input">
                                        <p:inputNumber value="#{item.income}" inputStyle="max-width: 80%"/>
                                    </f:facet>
                                </p:cellEditor>
                            </p:column>
                            <p:column headerText="#{msg.depreciation}">
                                <p:cellEditor>
                                    <f:facet name="output">
                                        <h:outputText value="#{item.depreciation}"/>
                                    </f:facet>
                                    <f:facet name="input">
                                        <p:inputNumber value="#{item.depreciation}" inputStyle="max-width: 80%"/>
                                    </f:facet>
                                </p:cellEditor>
                            </p:column>
                            <p:column headerText="#{msg.repairSpend}">
                                <p:cellEditor>
                                    <f:facet name="output">
                                        <h:outputText value="#{item.repairSpend}"/>
                                    </f:facet>
                                    <f:facet name="input">
                                        <p:inputNumber value="#{item.repairSpend}" inputStyle="max-width: 80%"/>
                                    </f:facet>
                                </p:cellEditor>
                            </p:column>
                            <p:column headerText="#{msg.maintenanceSpend}">
                                <p:cellEditor>
                                    <f:facet name="output">
                                        <h:outputText value="#{item.maintenanceSpend}"/>
                                    </f:facet>
                                    <f:facet name="input">
                                        <p:inputNumber value="#{item.maintenanceSpend}" inputStyle="max-width: 80%"/>
                                    </f:facet>
                                </p:cellEditor>
                            </p:column> <p:column headerText="#{msg.suppliesSpend}">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{item.suppliesSpend}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber value="#{item.suppliesSpend}" inputStyle="max-width: 80%"/>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                            <p:column headerText="#{msg.netIncome}">
                                <p:cellEditor>
                                    <f:facet name="output">
                                        <h:outputText value="#{item.netIncome}"/>
                                    </f:facet>
                                    <f:facet name="input">
                                        <p:inputNumber value="#{item.netIncome}" inputStyle="max-width: 80%"/>
                                    </f:facet>
                                </p:cellEditor>
                            </p:column>
                            <p:column headerText="#{msg.Operation}" style="width: 70px">
                                <p:rowEditor editTitle="#{msg.Edit}" cancelTitle="#{msg.Cancel}#{msg.Edit}" saveTitle="#{msg.Save}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{2 == keyAssetReportController.selected.reportType}">
                        <p:dataTable id="assetOperationForYear" value="#{keyAssetReportController.assetOperationForYear}" var="item"
                                     selectionMode="single" selection="#{keyAssetReportController.assetOperationDetail}"
                                     paginator="true" paginatorPosition="top"
                                     paginatorTemplate="{Toolbar}" rowKey="#{item}" rows="999" emptyMessage="#{msg.noRecordFound}">
                            <p:ajax event="rowSelect" update="editButton deleteButton"/>
                            <p:column headerText="#{msg.Year}">
                                <h:outputText value="#{item.month}"/>
                            </p:column>
                            <p:column headerText="#{msg.annualNumberOfCheck}">
                                <h:outputText value="#{item.annualNumberOfCheck}"/>
                            </p:column>
                            <p:column headerText="#{msg.annualIncome}">
                                <h:outputText value="#{item.annualIncome}"/>
                            </p:column>
                            <p:column headerText="#{msg.depreciation}">
                                <h:outputText value="#{item.depreciation}"/>
                            </p:column>
                            <p:column headerText="#{msg.annualMaintenanceExpenses}">
                                <h:outputText value="#{item.annualMaintenanceExpenses}"/>
                            </p:column>
                            <p:column headerText="#{msg.annualRepairExpenses}">
                                <h:outputText value="#{item.annualRepairExpenses}"/>
                            </p:column>
                            <p:column headerText="#{msg.annualConsumablesExpenses}">
                                <h:outputText value="#{item.annualConsumablesExpenses}"/>
                            </p:column>
                            <p:column headerText="#{msg.annualNetIncome}">
                                <h:outputText value="#{item.annualNetIncome}"/>
                            </p:column>
                            <f:facet name="{Toolbar}">
                                <h:panelGroup>
                                    <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{keyAssetReportController.preCreateOperation}" update="editForm:assetOperationForYear assetOperationEditDlg" oncomplete="PF('assetOperationEditDialog').show()" />
                                    <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" actionListener="#{keyAssetReportController.preEditOperation}" update="assetOperationEditDlg" oncomplete="PF('assetOperationEditDialog').show()" disabled="#{empty keyAssetReportController.assetOperationDetail}"/>
                                    <p:commandButton id="deleteButton" icon="ui-icon-delete" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{keyAssetReportController.deleteOperation}" update="editForm" disabled="#{empty keyAssetReportController.assetOperationDetail}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </h:panelGroup>
                            </f:facet>
                        </p:dataTable>
                    </p:panelGrid>

                </p:fieldset>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" update=":growl keyAssetReportListForm:datalist reportYear" icon="ui-icon-check"
                                 actionListener="#{keyAssetReportController.saveKeyAssetReport}"
                                 oncomplete="handleSubmit(args, 'keyAssetReportEditDialog');"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('keyAssetReportEditDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
