<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:apm="http://www.ge.com/tags/apm"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="keyAssetSelectDlg" widgetVar="keyAssetSelectDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.selectAssetChoose}" height="600" width="1000">
            <h:form id="selectForm">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.clinicaldepart}*</label>
                        <p:inputText id="queryDept" readonly="true" style="width: 80%"
                                     value="#{keyAssetReportController.dept.name}" required="true" requiredMessage="#{msg.clinicalDeptName} #{msg.ValidationRequire}"/>
                        <p:commandButton id="org" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton"/>
                        <p:overlayPanel id="queryPopupPanel" widgetVar="queryVarOrg" for="org" hideEffect="fade" style="position: absolute; left: 0; top: 0; width: 300px;" dynamic="false" modal="false" dismissable="true">
                            <p:inputText id="searchDeptName" value="#{keyAssetReportController.searchDeptName}"  />
                            <p:commandButton process=":selectForm:searchDeptName @this" partialSubmit="true" icon="ui-icon-search" update="orgTree" actionListener="#{keyAssetReportController.treeSeachCondition()}" value="检索"/>
                            <p:scrollPanel style="height:300px; border: 0" mode="native">
                                <p:tree id="orgTree" value="#{keyAssetReportController.queryOrgTree}" var="node"
                                        selectionMode="single" class="tree" style="width:98%; border:0">
                                    <p:ajax process="@this" event="select" update="selectForm:queryDept"
                                            listener="#{keyAssetReportController.onSelectDeptNode}"
                                            oncomplete="PF('queryVarOrg').hide();"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node.name}"/>
                                    </p:treeNode>
                                    <p:treeNode type="hidden" rendered="false"/>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EquipmentClassification}</label>
                        <p:selectOneMenu value="#{keyAssetReportController.assetGroup}" disabled="false">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EquipmentName}</label>
                        <p:inputText value="#{keyAssetReportController.assetName}" autocomplete="off" required="false"
                                     requiredMessage="#{msg.EquipmentName} #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EquipmentModel}</label>
                        <p:inputText value="#{keyAssetReportController.functionType}" autocomplete="off" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.departNum}</label>
                        <p:inputText id="departNumInput" value="#{keyAssetReportController.departNum}" autocomplete="off" />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">#{msg.medicalApparatusClassification}</label>
                        <apm:selectMedicalInstrumentsClassification
                                disabled="#{!assetInfoEditController.needEdit('medicalApparatusClassification')}"
                                update=""
                        />
                    </h:panelGroup>
                    <p:commandButton validateClient="true" value="查询"
                                     update=":growl selectForm:allAssetList"
                                     actionListener="#{keyAssetReportController.findAssetList}" />
                </p:panelGrid>
                <p:fieldset legend="待选设备">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:dataTable id="allAssetList" value="#{keyAssetReportController.allAssetList}" var="asset"
                                     selectionMode="single"
                                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                     rowKey="#{asset.id}" sortMode="single" sortOrder="descending"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="20" emptyMessage="#{msg.noRecordFound}" filterDelay="1200"
                                     rowsPerPageTemplate="20,50,100,500">
                            <p:column width="40" id="checkBoxCol">
                                <p:selectBooleanCheckbox value="#{keyAssetReportController.selectedAssetUid[asset.uid]}" class="selectCheckBox">
                                    <p:ajax event="change" listener="#{keyAssetReportController.updateSelectedAssetList}" update=""/>
                                    <f:attribute name="assetObj" value="#{asset}"/>
                                </p:selectBooleanCheckbox>
                                <f:facet name="header">
                                    <p:selectBooleanCheckbox value="#{keyAssetReportController.allListSelected}" id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                        <p:ajax event="change" listener="#{keyAssetReportController.addAllAssetsOfCurrentPage}" update="@(.selectCheckBox)"/>
                                    </p:selectBooleanCheckbox>
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.EquipmentName}">
                                <h:outputText value="#{asset.name}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}">
                                <h:outputText value="#{asset.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.makerShortName}">
                                <h:outputText value="#{asset.makerShortName}"/>
                            </p:column>
                            <p:column headerText="#{msg.functionType}">
                                <h:outputText value="#{asset.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.medicalApparatusClassification}">
                                <h:outputText id="medicalApparatusClassification" value="#{keyAssetReportController.getMedicalApparatusClassification(asset.medicalApparatusClassification)}" readonly="true" />
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                </p:fieldset>
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <p:commandButton validateClient="true" value="添加已勾选设备"
                        update="selectForm:allAssetList selectForm:addedAssetList"
                        action="#{keyAssetReportController.addAssetInfo}" />
                </p:panelGrid>
                <p:fieldset legend="已选设备">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:dataTable id="addedAssetList" value="#{keyAssetReportController.addedAssetList}" var="asset"
                                     selectionMode="single"
                                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                     rowKey="#{asset.id}" sortMode="single" sortOrder="descending"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="20" emptyMessage="#{msg.noRecordFound}" filterDelay="1200"
                                     rowsPerPageTemplate="20,50,100,500">
                            <p:column width="40" id="checkedBoxCol">
                                <p:selectBooleanCheckbox value="#{keyAssetReportController.addedAssetUid[asset.uid]}" class="selectCheckBox2">
                                    <p:ajax event="change" listener="#{keyAssetReportController.updateAddedAssetList}" update=""/>
                                    <f:attribute name="assetObj" value="#{asset}"/>
                                </p:selectBooleanCheckbox>
                                <f:facet name="header">
                                    <p:selectBooleanCheckbox value="#{keyAssetReportController.cancelAllSelected}" id="selectedCheckBoxHeader" class="selectedCheckBoxHeader">
                                        <p:ajax event="change" listener="#{keyAssetReportController.addAddedAssetsOfCurrentPage}" update="@(.selectCheckBox2)"/>
                                    </p:selectBooleanCheckbox>
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.EquipmentName}">
                                <h:outputText value="#{asset.name}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}">
                                <h:outputText value="#{asset.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.makerShortName}">
                                <h:outputText value="#{asset.makerShortName}"/>
                            </p:column>
                            <p:column headerText="#{msg.functionType}">
                                <h:outputText value="#{asset.functionType}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                </p:fieldset>

                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <p:commandButton validateClient="true" value="删除已勾选设备"
                                     update="selectForm:allAssetList selectForm:addedAssetList"
                                     action="#{keyAssetReportController.removeAssetInfo}" />
                    <p:commandButton validateClient="true" value="清空"
                                     update="selectForm:allAssetList selectForm:addedAssetList"
                                     action="#{keyAssetReportController.clearAssetInfo}" />
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" action="#{keyAssetReportController.saveAssetList}" update=":growl editForm:assetDetail" icon="ui-icon-check" oncomplete="handleSubmit(args, 'keyAssetSelectDialog');"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" actionListener="#{keyAssetReportController.resetSelectAssetPage}" icon="ui-icon-cancel" onclick="PF('keyAssetSelectDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
