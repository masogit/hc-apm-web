<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">
    <ui:define name="head">
        <h:outputStylesheet name="css/inspection.css"/>
        <script type="text/javascript" src="https://unpkg.com/viewerjs@1.9.0/dist/viewer.min.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/viewerjs@1.9.0/dist/viewer.min.css"/>
    </ui:define>

    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="调剂设备"/>
            </div>
            <div class="ui-g-12 card">

                <h:form id="SwapTypeEditForm">


                    <p:fieldset legend="调剂设备信息" style="margin-bottom:20px">

                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{sharedAssetTypeController.selected != null}">

                            <h:panelGroup>
                                <label class='label'>调剂设备名称*</label>
                                <p:inputText id="swapName" value="#{sharedAssetTypeController.selected.swapName}"
                                             required="true" requiredMessage="调剂设备名称 #{msg.ValidationRequire}"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class='label'>单价*</label>
                                <p:inputNumber id="unitPrice" value="#{sharedAssetTypeController.selected.unitPrice}"
                                               minValue="0" decimalPlaces="2"
                                               required="true" requiredMessage="单价 #{msg.ValidationRequire}"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class='label'>计价方式*</label>
                                <p:selectOneRadio id="chargingType" required="true" onchange="updateSelectAllCheckBox(this)"
                                                  value="#{sharedAssetTypeController.selected.chargingType}"
                                                  requiredMessage="计价方式 #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="小时(整点)" itemValue="5"/>
                                    <f:selectItem itemLabel="小时(半点)" itemValue="2"/>
                                    <f:selectItem itemLabel="自然时间" itemValue="4"/>
                                    <f:selectItem itemLabel="天" itemValue="3"/>
                                    <f:selectItem itemLabel="次" itemValue="1"/>
                                    <p:ajax update="startingPrice startingPeriod"
                                            listener="#{sharedAssetTypeController.onChargingTypeChange}"/>
                                </p:selectOneRadio>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class='label'>起步价</label>
                                <p:inputNumber id="startingPrice"
                                               value="#{sharedAssetTypeController.selected.startingPrice}" minValue="0"
                                               decimalPlaces="2" required="false"
                                               readonly="#{sharedAssetTypeController.disableStartingFields()}"
                                               requiredMessage="起步价 #{msg.ValidationRequire}"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class='label'>起步时长（小时）</label>
                                <p:inputNumber id="startingPeriod"
                                               value="#{sharedAssetTypeController.selected.startingDuration}"
                                               minValue="0"
                                               decimalPlaces="2" required="false"
                                               readonly="#{sharedAssetTypeController.disableStartingFields()}"
                                               requiredMessage="起步时长 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class='label'>创建人</label>
                                <p:inputText id="createBy" value="#{sharedAssetTypeController.selected.createBy}"
                                             required="true" readonly="true"
                                             requiredMessage="创建人 #{msg.ValidationRequire}"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class='label'>创建日期</label>
                                <p:calendar id="createDate" pattern="yyyy/MM/dd"
                                            value="#{sharedAssetTypeController.selected.createDate}"
                                            disabled="true"/>
                            </h:panelGroup>

                            <h:panelGroup class="selectCheckBoxHeader" id="gratisDuration" rendered="#{sharedAssetTypeController.isWhetherToEnableUnattendedAndType()}">
                                <label class='label'>免除计费时长（小时)</label>
                                <p:inputNumber value="#{sharedAssetTypeController.selected.gratisDuration}"
                                             requiredMessage="免除计费时长 #{msg.ValidationRequire}"/>
                            </h:panelGroup>

                        <h:panelGroup rendered="#{!sharedAssetTypeController.isWhetherToEnableUnattendedAndType()}">
                        </h:panelGroup>
                            <h:panelGroup>
                                <label class='label'>设备描述</label>
                                <p:inputTextarea id="deviceDescription" rows="1" cols="66" queryDelay="750" minQueryLength="4"
                                                 value="#{sharedAssetTypeController.selected.deviceDescription}"/>
                            </h:panelGroup>
                            <h:panelGroup class="selectCheckBoxHeader" id="discountPeriod" rendered="#{sharedAssetTypeController.isWhetherToEnableUnattendedAndType()}">
                                <label  class='label'>优惠时段</label>
                                <p:calendar  value="#{sharedAssetTypeController.selected.discountStartDate}"  showTodayButton="false" showMillisec="false" showMinute="false" showSecond="false" timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="HH" timeOnly="true" showOn="button" showButtonPanel="true" navigator="true" mask="true" />
                                -
                                <p:calendar value="#{sharedAssetTypeController.selected.discountEndDate}"  showTodayButton="false" showMillisec="false" showMinute="false" showSecond="false"  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="HH" timeOnly="true" showOn="button" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup class="selectCheckBoxHeader" id="discount" rendered="#{sharedAssetTypeController.isWhetherToEnableUnattendedAndType()}">
                                <label class='label'>优惠折扣</label>
                                <p:inputNumber symbol="%" symbolPosition="s" emptyValue="empty" value="#{sharedAssetTypeController.selected.discount}"
                                              requiredMessage="优惠折扣 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{sharedAssetTypeController.selected != null}">
                            <h:panelGroup>
                                <label class='label'>备注</label>
                                <p:inputTextarea id="remark" rows="1" cols="66" queryDelay="750" minQueryLength="4"
                                                 value="#{sharedAssetTypeController.selected.remark}"/>
                            </h:panelGroup>

                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="图片" style="margin-bottom:20px" id="pict">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <div class="ui-g-6">
                                    <h:panelGroup id="pict2" rendered="#{sharedAssetTypeController.uploadFlag}">
                                    <p:graphicImage url="/portal/uploadPic.png" style="max-width: 320px;height: 260px" rendered="#{sharedAssetTypeController.uploadFlag}"  />
                                    </h:panelGroup>
                                    <h:panelGroup id="pict1" rendered="#{!sharedAssetTypeController.uploadFlag}">
                                        <p:graphicImage url="/portal/uploadPic.png" style="max-width: 320px;height: 260px" rendered="#{sharedAssetTypeController.uploadFlag}"  />
                                        <div class="container-fluid" style="height: 300px; overflow: auto;" >
                                            <div class="row" id="picDiv">
                                                <c:forEach items="#{sharedAssetTypeController.getAttachList(sharedAssetTypeController.selected.id)}" var="attach" >
                                                    <div>
                                                        <img data-original="#{fileDownloadService.getImgBase64(attach.objectStorageId)}"
                                                             src="#{fileDownloadService.getImgBase64(attach.objectStorageId)}"
                                                             style="opacity:0; width:1px; height:1px"/>
                                                    </div>
                                                </c:forEach>
                                            </div>
                                            <script>
                                                new Viewer(document.getElementById('picDiv'), {inline: true});
                                            </script>
                                        </div>
                                    </h:panelGroup>
                                </div>
                            </h:panelGroup>
                        </p:panelGrid>

                        <h:panelGroup >
                            <p:dataList id="pictureList" value="#{sharedAssetTypeController.getAttachList(sharedAssetTypeController.selected.id)}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">#{fieldMsg.fieldValue('attachmentType', 1)}</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
<!--                                <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>-->
                                <p:commandButton actionListener="#{sharedAssetTypeController.removeAttachmentById(fileitem.id)}" update="pictureList SwapTypeEditForm:pict" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:dataList>
                            <p:fileUpload id="type6" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/" fileUploadListener="#{sharedAssetTypeController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                          multiple="true"  sizeLimit="500000000"  update="pictureList SwapTypeEditForm:pict"  auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}500M" label="#{msg.Add}"/>
                        </h:panelGroup>
                    </p:fieldset>
                    <p:fieldset legend="#{msg.AttachedFileInfo}" style="margin-bottom:20px">
                        <p:dataTable id="dataAccessory" value="#{sharedAssetTypeController.selected.accessoryList}"
                                     var="item" widgetVar="varDataAccessory"
                                     rendered="#{sharedAssetTypeController.selected ne null}"
                                     paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                                     paginatorTemplate="{Toolbar}"
                                     selectionMode="single" selection="#{sharedAssetTypeController.selectedAccessory}"
                                     lazy="false" rowKey="#{item.name.hashCode()}" emptyMessage="#{msg.noRecordFound}">

                            <p:ajax event="rowSelect"
                                    update="createAccessoryButton editAccessoryButton deleteAccessoryButton"/>
                            <p:column headerText="#{msg.name}">
                                <h:outputText value="#{item.name}"/>
                            </p:column>
                            <p:column rendered="false">
                                <p:rowEditor/>
                            </p:column>
                            <f:facet name="{Toolbar}">
                                <p:commandButton id="createAccessoryButton" icon="ui-icon-plus"
                                                 class="btn btn-sm btn-gray" title="#{msg.Create}"
                                                 actionListener="#{sharedAssetTypeController.prepareCreateAccessory}"
                                                 update=":SharedAssetTypeAccesssoryEditDlg"
                                                 oncomplete="PF('SharedAssetTypeAccesssoryEditDialog').show()"/>
                                <p:commandButton id="editAccessoryButton" icon="ui-icon-pencil"
                                                 class="btn btn-sm btn-gray" title="#{msg.Edit}"
                                                 actionListener="#{sharedAssetTypeController.prepareEditAccessory}"
                                                 update=":SharedAssetTypeAccesssoryEditDlg"
                                                 oncomplete="PF('SharedAssetTypeAccesssoryEditDialog').show()"
                                                 disabled="#{empty sharedAssetTypeController.selectedAccessory}"/>
                                <p:commandButton id="deleteAccessoryButton" process="@this" icon="ui-icon-close"
                                                 title="#{msg.Delete}"
                                                 actionListener="#{sharedAssetTypeController.deleteAccessory}"
                                                 update="dataAccessory"
                                                 disabled="#{empty sharedAssetTypeController.selectedAccessory}">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                               icon="ui-icon-alert"/>
                                </p:commandButton>
                            </f:facet>
                        </p:dataTable>
                    </p:fieldset>

                    <h:panelGroup id="display">
                        <br/>

                        <p:commandButton validateClient="true" actionListener="#{sharedAssetTypeController.save}"
                                         value="#{msg.Save}" action="List?faces-redirect=true" icon="ui-icon-check"/>
                        <p:commandButton value="#{msg.Return}" action="List?faces-redirect=true" immediate="true"
                                         icon="ui-icon-arrow-back"/>

                    </h:panelGroup>
                </h:form>

                <ui:include src="/portal/asset/selectAssetDialog.xhtml"/>
                <ui:include src="EditAccessory.xhtml"/>
            </div>
        </div>
        <div id="shwoPicDialog" class="ui-dialog ui-widget ui-widget-content ui-corner-all ui-shadow ui-hidden-container" style="max-width: available;max-height:available;min-width:800px;min-height:600px;overflow: hidden">
            <div class="ui-dialog-titlebar ui-widget-header ui-helper-clearfix ui-corner-top">
                <span id="shwoPicDialog_title" class="ui-dialog-title">#{msg.Image}</span>
                <span>
                    <p:commandButton id="spin" value="旋转" styleClass="anticon-plus"/>
                    <p:commandButton id="enlarge" value="放大" onclick ="ImageSuofang(true)"/>
                    <p:commandButton id="shrink" value="缩小" onclick ="ImageSuofang(false)"/>
                </span>
                <a href="#" class="ui-dialog-titlebar-icon ui-dialog-titlebar-close ui-corner-all" aria-label="Close">
                    <span class="ui-icon ui-icon-closethick"></span></a>
                <a href="#" class="ui-dialog-titlebar-icon ui-dialog-titlebar-maximize ui-corner-all"><span class="ui-icon ui-icon-extlink"></span></a>
            </div>
            <div class="ui-dialog-content ui-widget-content"  style="max-width: 1000px;max-height:700px;min-width:800px;min-height:600px;height: available">

                <p style="text-align: center; vertical-align: middle"><image id="shwoPicDialogImg" src="" style="max-width: 1000px; max-height: 700px"></image></p>
            </div>
        </div>
        <style type="text/css">
            .conceal{
                display: none;
            }
        </style>
        <script>
            //<![CDATA[
            function showthis(pic) {
                var s = $('#shwoPicDialogImg')[0]
                s.src = pic.src;
                s.style.transform = 'rotate('+ 0 +'deg)';
                s.width = pic.width * 1.8;
                s.height = pic.height * 1.8;
                PF('shwoPicDialog').show();
                var dia = $("#shwoPicDialog")[0];
                dia.style.top = '5px';
                for (let i = 0; i < 10; i++) {
                    ImageSuofang(true);
                }
            }
            //旋转
            var num = 0;
            $("#spin").click(function () {
                num++;
                // $("#shwoPicDialogImg").style.rotate = num * 90;
                var pic = $("#shwoPicDialogImg")[0];
                pic.style.transform = 'rotate('+num * 90+'deg)';
                if(pic.width > pic.height && num%2 ==1){
                    pic.style.marginTop='140px';
                }else{
                    pic.style.marginTop='5px';
                }
            })
            function ImageSuofang(args) {
                var imgsrc =  $("#shwoPicDialogImg")[0];
                if (args) {
                    if(imgsrc.width * 1.1 > 1000 ||imgsrc.height * 1.1 > 700 ){
                        return;
                    }
                    imgsrc.width = imgsrc.width * 1.1;
                    imgsrc.height = imgsrc.height * 1.1;
                }
                else {
                    imgsrc.width = imgsrc.width / 1.1;
                    imgsrc.height = imgsrc.height / 1.1;
                }
            }
            function updateSelectAllCheckBox(val) {
                var select=val.value;
                var length=$(".selectCheckBoxHeader").length;

                if(length== 0){
                    return ;
                }
                // console.log(typeof selectCheckBoxHeader)
                // console.log(selectCheckBoxHeader)
                console.log(select)
                if (select == '1' || select == '3') {
                    $(".selectCheckBoxHeader")[0].classList.add("selectCheckBoxHeader","conceal");
                    $(".selectCheckBoxHeader")[1].classList.add("selectCheckBoxHeader","conceal");
                    $(".selectCheckBoxHeader")[2].classList.add("selectCheckBoxHeader","conceal");
                } else {
                    $(".selectCheckBoxHeader")[0].classList.remove("conceal");
                    $(".selectCheckBoxHeader")[1].classList.remove("conceal");
                    $(".selectCheckBoxHeader")[2].classList.remove("conceal");
                }
            }
            //]]>
        </script>
    </ui:define>
</ui:composition>
