<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:P="http://java.sun.com/jsf/html"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="调剂名称设置"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="searchForm">
                    <h:panelGrid id="searchPanel" columns="2">
                        <p:inputText id="searchText" value="#{sharedAssetInfoController.oneSearchStr}" placeholder="#{msg.name}/#{msg.departNum}" maxlength="100" style="width: 450px">
                            <p:ajax event="keyup" update=":AssetInfoListForm searchButtons" />
                        </p:inputText>
                        <h:panelGroup id='searchButtons'>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm"  rendered="#{empty sharedAssetInfoController.oneSearchStr}"/>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm" actionListener="#{sharedAssetInfoController.setOneSearchStr('')}" rendered="#{not empty sharedAssetInfoController.oneSearchStr}"/>
                        </h:panelGroup>

                    </h:panelGrid>
                </h:form>
                <h:form id="AssetInfoListForm">

                    <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                        <!--<p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet " actionListener="#{sharedAssetInfoController.searchList(2)}" rendered="true" disabled="#{sharedAssetInfoController.queryIndex == 2}"/>-->
                        <p:commandButton value="已配置调剂名称"  process="@this" update="datalist buttonSet " actionListener="#{sharedAssetInfoController.searchList(1)}"  rendered="true" disabled="#{sharedAssetInfoController.queryIndex == 1}"/>
                        <p:commandButton value="未配置调剂名称"  process="@this" update="datalist buttonSet " actionListener="#{sharedAssetInfoController.searchList(-1)}"  rendered="true" disabled="#{sharedAssetInfoController.queryIndex == -1}"/>
                    </h:panelGrid>

                    <p:dataTable id="datalist" value="#{sharedAssetInfoController.lazyModel}" var="item" widgetVar="varDataList"
                         selectionMode="single" selection="#{sharedAssetInfoController.selected}"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,40,90,200">

                        <!--<p:ajax  event="rowSelect" oncomplete="PF('AssetEditDialog').show()" update="AssetEditDlg"/>-->
                        <p:ajax event="filter" listener="#{sharedAssetInfoController.onFilter}" oncomplete="rc2()"/>
                        <p:ajax event="page" oncomplete="rc2();" />

                        <p:column width="50">
                            <p:selectBooleanCheckbox value="#{sharedAssetInfoController.selectedMap[item.uid]}" rendered="#{!sharedAssetInfoController.isBorrow(item.uid)}"  class="selectCheckBox">
                                <p:ajax listener="#{sharedAssetInfoController.onItemSelected}" update="@this @(.selectCheckBoxHeader) @(.btn-gray)"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header"  >
                                <p:selectBooleanCheckbox id="selectCheckBoxHeader" value="#{sharedAssetInfoController.isSelectedCurrentPage}" class="selectCheckBoxHeader">
                                    <p:ajax  listener="#{sharedAssetInfoController.onSelectAllOfPage}" update="@(.selectCheckBox) editButton"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>

                        <p:column exportable="false" width="50" headerText="编辑">
                            <h:panelGroup>
                                <p:commandButton icon="ui-icon-pencil" class="btn btn-sm btn-gray" style="width: 10px; height: 25px;" disabled="#{sharedAssetInfoController.isBorrow(item.uid)}"
                                                 actionListener="#{sharedAssetInfoController.prepareEditOne(item.uid)}" title="编辑" update=":AssetEditDlg, datalist" oncomplete="PF('AssetEditDialog').show()" />
                            </h:panelGroup>
                        </p:column>

                        <!--<p:column colspan="2" width="100" rendered="#{sharedAssetInfoController.isBorrow(item.uid)}">-->
                            <!--<h:outputText value="在借中" />-->
                        <!--</p:column>-->

                        <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>

                        <p:column headerText="#{msg.departNum}" sortBy="#{item.departNum}" filterBy="#{item.departNum}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.departNum}"/>
                        </p:column>

                        <p:column headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>

                        <p:column headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>

                        <p:column headerText="#{msg.purchasePrice}" sortBy="#{item.purchasePrice}" filterBy="#{item.purchasePrice}" filterMatchMode="GTE">
                            <h:outputText value="#{item.purchasePrice}"/>
                        </p:column>

                        <p:column headerText="调剂设备名称" sortBy="#{item.sharedAssetTypeUid}" filterBy="#{item.sharedAssetTypeUid}" filterMatchMode="LIKE">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{sharedAssetInfoController.filterSatId}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{sharedAssetInfoController.allType()}" var="item" itemLabel="#{item.swapName}" itemValue="#{item.id}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{sharedAssetInfoController.getSwapName(item.sharedAssetTypeUid)}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <!--<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" actionListener="#{assetInfoController.exportExcel}" update=":growl"-->
                                             <!--onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false">-->
                                <!--<p:fileDownload value="#{assetInfoController.excelFile}" />-->
                            <!--</p:commandButton>-->
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="批量编辑" update=":BatchAssetEditDlg" oncomplete="PF('BatchAssetEditDialog').show()" disabled="#{!sharedAssetInfoController.editFlag()}" />

                        </f:facet>

                    </p:dataTable>

                    <p:remoteCommand name="rc2" update=":AssetInfoListForm:datalist"/>
                </h:form>
                <p:dialog id="AssetEditDlg" widgetVar="AssetEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="调剂名称设置">
                <h:form id="AssetEditForm" style="width: 300px">
                    <h:panelGroup id="display2">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" style="margin-bottom: 20px">

                            <h:panelGroup>
                                <label class="label">设备名称</label>
                                <h:outputText value="#{sharedAssetInfoController.selected.name}"></h:outputText>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">设备编号</label>
                                <h:outputText value="#{sharedAssetInfoController.selected.departNum}"></h:outputText>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">调剂设备名称</label>
                                <p:selectOneMenu value="#{sharedAssetInfoController.selected.sharedAssetTypeUid}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{sharedAssetInfoController.allType()}" var="item" itemLabel="#{item.swapName}" itemValue="#{item.id}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

                        </p:panelGrid>
                        <br/>
                        <p:commandButton validateClient="true" actionListener="#{sharedAssetInfoController.saveOne}" value="#{msg.Save}"
                                         update=" :AssetInfoListForm:datalist" icon="ui-icon-check" oncomplete="PF('AssetEditDialog').hide()" />
                        <!--&nbsp;&nbsp;-->
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('AssetEditDialog').hide()"/>
                    </h:panelGroup>
                </h:form>

            </p:dialog>

            <p:dialog id="BatchAssetEditDlg" widgetVar="BatchAssetEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="批量设置调剂名称">
                <h:form id="BatchAssetEditForm" style="width: 250px">
                    <h:panelGroup id="display">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" style="margin-bottom: 20px">

                            <h:panelGroup>
                                <label class="label">调剂设备名称</label>
                                <p:selectOneMenu value="#{sharedAssetInfoController.batchSharedAssetTypeUid}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{sharedAssetInfoController.allType()}" var="item" itemLabel="#{item.swapName}" itemValue="#{item.id}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

                        </p:panelGrid>
                        <br/>
                        <p:commandButton validateClient="true" actionListener="#{sharedAssetInfoController.batchSave}" value="批量保存"
                                         update=" :AssetInfoListForm:datalist" icon="ui-icon-check" oncomplete="PF('BatchAssetEditDialog').hide()" />
                        <!--&nbsp;&nbsp;-->
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('BatchAssetEditDialog').hide()"/>
                    </h:panelGroup>
                </h:form>

            </p:dialog>
            </div>
        </div>
    </ui:define>
</ui:composition>
