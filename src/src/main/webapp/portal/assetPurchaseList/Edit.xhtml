<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="head">
<!--        <h:outputStylesheet name="css/assetUsageAll.css"/>
        <h:outputScript name="js/assetUsageAll.js"/>-->
    </ui:define>
                
<ui:define name="content">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="采购清单-#{msg.Edit}"/>
            </div>
    <h:form>
    <div class="ui-g-12 card ">
        <p:accordionPanel id="accordion" multiple="false" >
            <p:tab title="#{msg.BasicInfo}">
                <div class="ui-g">
                    <div class="ui-g-8 ui-g-nopad">
                        <p:panelGrid columns="4"  layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{assetPurchaseListController.selected != null}">
                            <h:panelGroup>
                             <label class="label">设备类别</label>
                             <p:selectOneMenu id="assetGroup" value="#{assetPurchaseListController.selected.assetType}" >
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                             </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.clinicalDeptName}</label>
                                <p:selectOneMenu id="clinicaleptinname" value="#{assetPurchaseListController.selected.clinicalDeptUid}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{assetInfoService.getOrgDeptList(assetPurchaseListController.selected.siteUID)}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu> 
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">采购数量</label>
                                <p:inputText id="aliasName" value="#{assetPurchaseListController.selected.purchaseQty}" />
                            </h:panelGroup>
<!--                            <h:panelGroup>
                                <label class="label">到货数量</label>
                                <p:inputText id="assetGroup" value="#{assetPurchaseListController.selected.reachQty}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">到货状态</label>
                                <p:inputText id="assetOwnerName" value="#{assetPurchaseListController.selected.reachState}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">是否到货详单</label>
                                <p:inputText id="assetOwnerTel" value="#{assetPurchaseListController.selected.reachDetailState}"/>
                            </h:panelGroup>-->
                            <h:panelGroup>
                                <label class="label">创建日期</label>
                                <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd"  value="#{assetPurchaseListController.selected.createDate}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="创建日期 #{msg.ValidationRequire}"></p:calendar>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">到货数量</label>
                                <p:inputText value="#{assetPurchaseListController.selected.reachQty}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">到货状态</label>
                                <p:selectOneMenu  value="#{assetPurchaseListController.selected.reachState}" required="false" >
                                    <f:selectItem itemLabel="未到货" itemValue="1"/>
                                    <f:selectItem itemLabel="全部到货" itemValue="3"/>
                                    <f:selectItem itemLabel="部分到货" itemValue="2"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

<!--                            <h:panelGroup>
                                <label class="label">到货详单日期</label>
                                 <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd"  value="#{assetPurchaseListController.selected.reachDetailDate}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="到货详单日期 #{msg.ValidationRequire}"></p:calendar>
                            </h:panelGroup>-->
                            
                        </p:panelGrid>
                    </div>
                    
                </div>
            </p:tab>
        </p:accordionPanel>
         
         <p:accordionPanel id="accordion2">
            <p:tab title="#{msg.AssetInfoDetail}">
                <div class="ui-g">
                <div class="ui-g-12 ui-g-nopad">
                <p:panelGrid columns="4"  layout="grid" styleClass="ui-panelgrid-blank">
                    <h:panelGroup>
                        <label class="label">科室联系人</label>
                        <p:inputText id="parentAssetId" value="#{assetPurchaseListController.selected.linkMan}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">联系电话</label>
                        <p:inputText id="deviceName" value="#{assetPurchaseListController.selected.telephone}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">预估单价</label>
                        <p:inputText id="systemId" value="#{assetPurchaseListController.selected.estimatedAmount}"/>
                    </h:panelGroup>
<!--                    <h:panelGroup>
                        <label class="label">申购性质</label>
                        <p:selectOneRadio id="applyfeature" required="true"  value="#{assetPurchaseListController.selected.applyType}" requiredMessage="申请性质 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="新购" itemValue="1" />
                                <f:selectItem itemLabel="更新" itemValue="2" />
                                <f:selectItem itemLabel="补充" itemValue="3" />
                            </p:selectOneRadio>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">资金来源</label>
                        <p:selectOneRadio id="fundingResource" required="true" value="#{assetPurchaseListController.selected.capitalSource}" requiredMessage="资金来源 #{msg.ValidationRequire}">
          
                                <f:selectItem itemLabel="医院自筹" itemValue="1" />
                                <f:selectItem itemLabel="经费/基金" itemValue="2" />
                                <f:selectItem itemLabel="财政资金/上级补助" itemValue="3" />
                                <f:selectItem itemLabel="其它" itemValue="4"   />
                            </p:selectOneRadio>

                    </h:panelGroup>-->
                </p:panelGrid>
                </div>
                </div>
            </p:tab>
        </p:accordionPanel>
        <p:accordionPanel id="accordion3">
            <p:tab title="推荐品牌，规格型号和联系电话">
                <div class="ui-g-2"><p:outputLabel value="(如果有的话)"/></div>
                            <div class="ui-g-10 ui-g-nopad">
                                <div class="ui-g-6">1.<p:inputText size="55" value="#{assetPurchaseListController.selected.recommendInfo1}"/></div>
                                <div class="ui-g-1"><p:outputLabel value="电话"/></div>
                                <div class="ui-g-3"><p:inputText  value="#{assetPurchaseListController.selected.recommendPhone1}"/></div>
                                <div class="ui-g-6">2.<p:inputText size="55" value="#{assetPurchaseListController.selected.recommendInfo2}"/></div>
                                <div class="ui-g-1"><p:outputLabel value="电话"/></div>
                                <div class="ui-g-3"><p:inputText   value="#{assetPurchaseListController.selected.recommendPhone2}"/></div>
                                <div class="ui-g-6">3.<p:inputText size="55" value="#{assetPurchaseListController.selected.recommendInfo3}"/></div>
                                <div class="ui-g-1"><p:outputLabel value="电话"/></div>
                                <div class="ui-g-3"><p:inputText  value="#{assetPurchaseListController.selected.recommendPhone3}"/></div>
                            </div>
            </p:tab>
        </p:accordionPanel>
        <p:accordionPanel id="accordion4">
            <p:tab title="申请理由及用途">
<!--                <div class="ui-g-2">
                                <p:selectManyCheckbox style="height: 200px" id="grid3" value="#{assetPurchaseListController.selected.applyReason}" layout="pageDirection" columns="1">
                                    <f:selectItem itemLabel="临床必备" itemValue="1" />
                                    <f:selectItem itemLabel="学科发展" itemValue="2" />
                                    <f:selectItem itemLabel="教学科研" itemValue="4" />
                                </p:selectManyCheckbox>
                            </div>-->
                            <div class="ui-g-10 ui-g-nopad" >
                                <p:outputLabel value="理由及依据(阐述):"/>
                                <p:inputTextarea rows="3"  cols="70"  queryDelay="750" minQueryLength="4" value="#{assetPurchaseListController.selected.applyReasonContent}"/>
                            </div>
            </p:tab>
        </p:accordionPanel>
        <p:accordionPanel id="accordion5">
            <p:tab title="对产品性能有无特殊要求">
                <div class="ui-g-2">
                              <p:outputLabel value="产品性能特殊要求"/>
                                <br></br>
                                <p:inputTextarea rows="3"  cols="20"  queryDelay="750" minQueryLength="4" value="#{assetPurchaseListController.selected.specialRequest}" />
                </div> 
                <div class="ui-g-2">
                              <p:outputLabel value="备注"/>
                                <br></br>
                                <p:inputTextarea rows="3"  cols="20"  queryDelay="750" minQueryLength="4" value="#{assetPurchaseListController.selected.remark}" />
                </div>      
            </p:tab>
        </p:accordionPanel>
        
        <p:fieldset legend="上传附件">
            <p:panel id="upload" styleClass="ui-panelgrid-blank" style=" border: 0">
             <h:panelGroup >
                                    <p:fileUpload fileUploadListener="#{assetPurchaseListController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                                  multiple="false" sizeLimit="10000000"  auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  label="#{msg.Add}" />
                                    <p:growl id="messages" showDetail="true" />
                                </h:panelGroup>
                                <h:panelGroup id="namepanel" rendered="#{assetPurchaseListController.selected.objectId!=null}">
                                    <label class="label">#{msg.AssetContractAttachment}*</label>
                                    <p:inputText id="name" value="#{assetPurchaseListController.fileName}"  required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}" readonly="true"/>
                                    <p:commandButton actionListener="#{assetPurchaseListController.removeAttachment(assetPurchaseListController.selected.objectId)}" id="iconOnly" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this" rendered="#{assetPurchaseListController.fileName ne null}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>
                                </h:panelGroup>
                </p:panel>
            </p:fieldset>
        <h:panelGroup >
                        <p:commandButton value="#{msg.Save}" icon="ui-icon-check" action="List?faces-redirect=true" actionListener="#{assetPurchaseListController.saved()}" validateClient="true" update=":growl" style="float:left"/>
                       <p:commandButton value="#{msg.Return}" icon="ui-icon-arrow-back" action="List?faces-redirect=true" immediate="true"  update=":growl" style="float:left"/>
                       

         </h:panelGroup>

    </div>
    </h:form>
</ui:define>
</ui:composition>
