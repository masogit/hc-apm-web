<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="V2_WorkflowConfigEditDlg" widgetVar="V2_WorkflowConfigEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{v2_WorkflowConfigController.CRUDActionName} #{msg.V3_WorkFlowConfig}">
            <h:form id="V2_WorkflowConfigEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{v2_WorkflowConfigController.selected != null}">
                      <h:panelGroup >
                      
                       	 <label class="label">集团</label>
                               <p:selectOneMenu id="group" value="#{v2_WorkflowConfigController.selected.institutionUID}" >
                             	<p:ajax update="display" listener="#{v2_WorkflowConfigController.updateHospitalAndSite()}"/>
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                   <f:selectItems value="#{v2_WorkflowConfigController.institutionList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                               </p:selectOneMenu>
                        </h:panelGroup>
                        
                        <h:panelGroup rendered="#{v2_WorkflowConfigController.selected.institutionUID != null}">
                       		<label class="label">医院</label>
                               <p:selectOneMenu id="hospital" value="#{v2_WorkflowConfigController.selected.hospitalUID}" >
                             	<p:ajax update="display" listener="#{v2_WorkflowConfigController.updateSite()}"/>
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                   <f:selectItems value="#{v2_WorkflowConfigController.getIncludeOrgInfo(v2_WorkflowConfigController.selected.institutionUID,2)}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                               </p:selectOneMenu>
                        </h:panelGroup>
                        
                       <h:panelGroup rendered="#{v2_WorkflowConfigController.selected.hospitalUID != null}">
                       		<label class="label">院区</label>
                               <p:selectOneMenu id="site" value="#{v2_WorkflowConfigController.selected.siteUID}" >
                               		<p:ajax update="display" listener="#{v2_WorkflowConfigController.updateDispaters()}"/>
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                   <f:selectItems value="#{v2_WorkflowConfigController.getIncludeOrgInfo(v2_WorkflowConfigController.selected.hospitalUID,3)}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                               </p:selectOneMenu>
                        </h:panelGroup>     
                          
<!--                           <h:panelGroup>
                            <label class = "label">#{msg.dispatchMode}</label>
                            <p:selectOneMenu value="#{v2_WorkflowConfigController.selected.dispatchMode}" disabled="false">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('dispatchMode')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                             </p:selectOneMenu>
                        </h:panelGroup> -->

                        <h:panelGroup >
                            <label class="label">#{msg.dispatchUserName}*</label>
                            <p:selectOneMenu id="dispatchUserId" value="#{v2_WorkflowConfigController.selected.dispatchUserId}" 
                            		 required="false" requiredMessage="#{msg.dispatchUserName} #{msg.ValidationRequire}" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{v2_WorkflowConfigController.dispatchUserList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.dispatchUserName}2</label>
                            <p:selectOneMenu id="dispatchUserId2" value="#{v2_WorkflowConfigController.selected.dispatchUserId2}" 
                            		 required="false" requiredMessage="#{msg.dispatchUserName}2 #{msg.ValidationRequire}" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{v2_WorkflowConfigController.dispatchUserList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.timeoutDispatch}</label>
                            <p:inputText id="timeoutDispatch" value="#{v2_WorkflowConfigController.selected.timeoutDispatch}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.timeoutAccept}</label>
                            <p:inputText id="timeoutAccept" value="#{v2_WorkflowConfigController.selected.timeoutAccept}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.timeoutClose}</label>
                            <p:inputText id="timeoutClose" value="#{v2_WorkflowConfigController.selected.timeoutClose}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.maxMessageCount}</label>
                            <p:inputText id="maxMessageCount" value="#{v2_WorkflowConfigController.selected.maxMessageCount}" />
                        </h:panelGroup> 
                        <h:panelGroup>
                            <label class="label">#{msg.pmReminderTime}</label>
                            <p:inputText id="pmReminderTime" value="#{v2_WorkflowConfigController.selected.pmReminderTime}" />
                        </h:panelGroup> 
                        <h:panelGroup >
                            <label class = "label">工单完工不需要验收?</label>
                            <p:selectBooleanCheckbox value="#{v2_WorkflowConfigController.selected.autoAck}"/>
                        </h:panelGroup >
						<h:panelGroup rendered="true">
                            <label class = "label">是否自动派工?</label>
                            <p:selectBooleanCheckbox value="#{v2_WorkflowConfigController.selected.isAutoEnabled}"/>
                        </h:panelGroup >
                        	<h:panelGroup rendered="true">
                            <label class = "label">是否允许抢单?</label>
                            <p:selectBooleanCheckbox value="#{v2_WorkflowConfigController.selected.isTakeOrderEnabled}"/>
                        </h:panelGroup >
                        	<h:panelGroup rendered="true">
                            <label class = "label">是否人工派工?</label>
                            <p:selectBooleanCheckbox value="#{v2_WorkflowConfigController.selected.isManualEnabled}"/>
                        </h:panelGroup >
                        <!-- <p:spacer/> -->
                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="false" actionListener="#{v2_WorkflowConfigController.applyChange()}" value="#{msg.Save}" update="display,:V2_WorkflowConfigEditDlg, :V2_WorkflowConfigListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'V2_WorkflowConfigEditDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true"  actionListener="#{v2_WorkflowConfigController.clearSelected()}" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('V2_WorkflowConfigEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
