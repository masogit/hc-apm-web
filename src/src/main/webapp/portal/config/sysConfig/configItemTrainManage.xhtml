<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('trainMvsShowFlag').name.concat('(').concat(systemConfigItemController.configItemMap.get('trainMvsShowFlag').key).concat(')')}</label>
                <p:selectOneRadio value="#{systemConfigItemController.configItemMap.get('trainMvsShowFlag').showValue}" style="width: 15%;">
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                </p:selectOneRadio>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('trainMvsShowFlag').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('trainMvsShowFlag'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('trainMvsShowFlag'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('trainMvsShowFlag').configItemValue == null}"/>
            </h:panelGroup>

        </p:panelGrid>
    </ui:composition>

</html>
