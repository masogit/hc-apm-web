<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('ibReportUrl').name.concat('(').concat(systemConfigItemController.configItemMap.get('ibReportUrl').key).concat(')')}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('ibReportUrl').showValue}"
                                 rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" validatorMessage="请输入正确的配置值" requiredMessage="#{msg.ConfigItemValue}#{msg.ValidationRequire}">
                    <f:validateRegex disabled="#{empty systemConfigItemController.configItemMap.get('ibReportUrl').validation}" pattern="#{systemConfigItemController.configItemMap.get('ibReportUrl').validation}"/>
                </p:inputTextarea>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('ibReportUrl').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('ibReportUrl'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('ibReportUrl'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('ibReportUrl').configItemValue == null}"/>
            </h:panelGroup>
        </p:panelGrid>
    </ui:composition>

</html>
