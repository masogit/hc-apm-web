<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('investmentCalculationMethod').name.concat('(').concat(systemConfigItemController.configItemMap.get('investmentCalculationMethod').key).concat(')')}</label>
                <p:selectOneMenu value="#{systemConfigItemController.configItemMap.get('investmentCalculationMethod').showValue}" style="width: 95%;">
                    <f:selectItem itemLabel="请选择" itemValue="#{null}"/>
                    <f:selectItems value="#{systemConfigItemController.configItemMap.get('investmentCalculationMethod').enumList}" var="item" itemLabel="#{item.get('key')}" itemValue="#{item.get('value')}"/>
                </p:selectOneMenu>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('investmentCalculationMethod'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('investmentCalculationMethod'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('investmentCalculationMethod').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('costType').name.concat('(').concat(systemConfigItemController.configItemMap.get('costType').key).concat(')')}</label>
                <p:commandLink value="#{msg.Add}" actionListener="#{systemConfigItemController.costTypeAddBefore()}"  oncomplete="PF('costTypeAddDlg').show()" update="configItemForm"/>
                <p:commandLink value="#{msg.Delete}"   oncomplete="PF('costTypeDeleteDlg').show()" update="configItemForm"  style="padding:10px"/>
                <p:commandLink value="#{msg.Edit}"   oncomplete="PF('costTypeEditDlg').show()" update="configItemForm"  />

                <p:selectManyMenu value="#{systemConfigItemController.multiSelectedMap.costType}" showCheckbox="true" collectionType="java.util.ArrayList" style="width: 95%;">
                    <f:selectItems value="#{systemConfigItemController.configItemMap.get('costType').enumList}" var="item" itemLabel="#{item.get('key')}" itemValue="#{item.get('value')}" itemDisabled="#{item.get('value') eq 'MaintenanceFee'}"/>
                </p:selectManyMenu>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('costType'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('costType'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('costType').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('currentWorkingHours').name.concat('(').concat(systemConfigItemController.configItemMap.get('currentWorkingHours').key).concat(')')}</label>
                <p:inputNumber value="#{systemConfigItemController.configItemMap.get('currentWorkingHours').showValue}" style="width: 95%;"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('currentWorkingHours'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('currentWorkingHours'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('currentWorkingHours').configItemValue == null}"/>
            </h:panelGroup>


            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('maintenanceCostIncludedWorkOrderCost').name.concat('(').concat(systemConfigItemController.configItemMap.get('maintenanceCostIncludedWorkOrderCost').key).concat(')')}</label>
                <p:selectOneRadio value="#{systemConfigItemController.configItemMap.get('maintenanceCostIncludedWorkOrderCost').showValue}" style="width: 15%;">
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                </p:selectOneRadio>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('maintenanceCostIncludedWorkOrderCost'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('maintenanceCostIncludedWorkOrderCost'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('maintenanceCostIncludedWorkOrderCost').configItemValue == null}"/>
            </h:panelGroup>
            <ui:include src="configItemEntryType.xhtml"/>
        </p:panelGrid>
    </ui:composition>

</html>
