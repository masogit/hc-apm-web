<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('batch_upload').name.concat('(').concat(systemConfigItemController.configItemMap.get('batch_upload').key).concat(')')}</label>
                <p:selectOneRadio value="#{systemConfigItemController.configItemMap.get('batch_upload').showValue}" style="width: 15%;">
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                </p:selectOneRadio>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('batch_upload').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('batch_upload'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('batch_upload'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('batch_upload').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('measurementCategory').name.concat('(').concat(systemConfigItemController.configItemMap.get('measurementCategory').key).concat(')')}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('measurementCategory').showValue}"
                                 rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" validatorMessage="请输入正确的配置值" requiredMessage="#{msg.ConfigItemValue}#{msg.ValidationRequire}">
                    <f:validateRegex disabled="#{empty systemConfigItemController.configItemMap.get('measurementCategory').validation}" pattern="#{systemConfigItemController.configItemMap.get('measurementCategory').validation}"/>
                </p:inputTextarea>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('measurementCategory').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('measurementCategory'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('measurementCategory'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('measurementCategory').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('identifyPatterns').name.concat('(').concat(systemConfigItemController.configItemMap.get('identifyPatterns').key).concat(')')}</label>
                <p:selectOneMenu value="#{systemConfigItemController.configItemMap.get('identifyPatterns').showValue}" style="width: 50%;">
                    <f:selectItems value="#{systemConfigItemController.configItemMap.get('identifyPatterns').enumList}" var="item" itemLabel="#{item.get('key')}" itemValue="#{item.get('value')}"/>
                </p:selectOneMenu>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('identifyPatterns').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('identifyPatterns'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('identifyPatterns'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('identifyPatterns').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('measuringRemindDays').name.concat('(').concat(systemConfigItemController.configItemMap.get('measuringRemindDays').key).concat(')')}</label>
                <p:inputNumber value="#{systemConfigItemController.configItemMap.get('measuringRemindDays').showValue}" style="width: 95%;" decimalPlaces="0"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('measuringRemindDays').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('measuringRemindDays'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('measuringRemindDays'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('measuringRemindDays').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('measuringReminderTimes').name.concat('(').concat(systemConfigItemController.configItemMap.get('measuringReminderTimes').key).concat(')')}</label>
                <p:inputNumber value="#{systemConfigItemController.configItemMap.get('measuringReminderTimes').showValue}" style="width: 95%;" decimalPlaces="0"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('measuringReminderTimes').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('measuringReminderTimes'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('measuringReminderTimes'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('measuringReminderTimes').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('identifyPostProcessorRule').name.concat('(').concat(systemConfigItemController.configItemMap.get('identifyPostProcessorRule').key).concat(')')}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('identifyPostProcessorRule').showValue}"
                                 rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" validatorMessage="请输入正确的配置值" requiredMessage="#{msg.ConfigItemValue}#{msg.ValidationRequire}">
                    <f:validateRegex disabled="#{empty systemConfigItemController.configItemMap.get('identifyPostProcessorRule').validation}" pattern="#{systemConfigItemController.configItemMap.get('identifyPostProcessorRule').validation}"/>
                </p:inputTextarea>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('identifyPostProcessorRule').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('identifyPostProcessorRule'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('identifyPostProcessorRule'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('identifyPostProcessorRule').configItemValue == null}"/>
            </h:panelGroup>
        </p:panelGrid>
    </ui:composition>

</html>
