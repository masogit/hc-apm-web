<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="configItemEditDlg" widgetVar="configItemEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.ConfigItemManage}" max-height="600" width="520">
            <h:form id="configItemEditForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemName}*</label>
                        <p:inputText id="configItemName" value="#{systemConfigItemController.selected.name}" disabled="true" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemDesc}*</label>
                        <p:inputText id="configItemDesc" value="#{systemConfigItemController.selected.description}" disabled="true" style="width: 95%;"/>
                    </h:panelGroup>
                    <!--<h:panelGroup>
                        <label class="label">#{msg.ConfigItemUseParent}*</label>
                        <p:selectBooleanCheckbox id="isEnabled" value="#{systemConfigItemController.selected.userParentConfig}" disabled="true" label="启用" style="color: rgb(170, 170, 170)" />
                    </h:panelGroup>-->
                    <h:panelGroup rendered="#{systemConfigItemController.selected.valueType eq 1}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:inputTextarea id="valueStr" value="#{systemConfigItemController.selected.showValue}"
                                         rows="5" cols="50" required="true" style="width: 95%;max-height:300px;overflow:scroll;" validatorMessage="请输入正确的配置值" requiredMessage="#{msg.ConfigItemValue}#{msg.ValidationRequire}">
                            <f:validateRegex disabled="#{empty systemConfigItemController.selected.validation}" pattern="#{systemConfigItemController.selected.validation}"/>
                        </p:inputTextarea>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{systemConfigItemController.selected.valueType eq 2}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:inputNumber id="valueNum" value="#{systemConfigItemController.selected.showValue}"
                                       required="true" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{systemConfigItemController.selected.valueType eq 3 and (systemConfigItemController.selected.key ne 'assetScrap' and systemConfigItemController.selected.key ne 'showAssetScrapNo')}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:selectOneRadio id="valueBool" value="#{systemConfigItemController.selected.showValue}"
                                          required="true" style="width: 15%;">
                            <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                            <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                            <p:ajax event="change" update="configItemEditForm" />
                        </p:selectOneRadio>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{systemConfigItemController.selected.valueType eq 4}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:calendar id="valueDate" required="true" value="#{systemConfigItemController.selected.showValue}"
                                    pattern="yyyy-MM-dd" showOn="button" showButtonPanel="true" navigator="true"
                                    mask="true" defaultHour="23" defaultMinute="59" defaultSecond="59" style="width: 95%;"
                                    timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{systemConfigItemController.selected.valueType eq 5}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:calendar id="valueTime" required="true" value="#{systemConfigItemController.selected.showValue}"
                                    pattern="HH:mm:ss" timeOnly="true" showOn="button" showButtonPanel="true" navigator="true"
                                    mask="true" defaultHour="23" defaultMinute="59" defaultSecond="59" style="width: 95%;"
                                    timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{systemConfigItemController.selected.valueType eq 6}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:calendar id="valueDateTime" required="true" value="#{systemConfigItemController.selected.showValue}"
                                    pattern="yyyy-MM-dd HH:mm:ss" showOn="button" showButtonPanel="true" navigator="true"
                                    mask="true" defaultHour="23" defaultMinute="59" defaultSecond="59" style="width: 95%;"
                                    timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{systemConfigItemController.selected.valueType eq 7}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:selectOneMenu value="#{systemConfigItemController.selected.showValue}" required="true" style="width: 95%;">
                            <f:selectItems value="#{systemConfigItemController.selected.enumList}" var="item" itemLabel="#{item.get('key')}" itemValue="#{item.get('value')}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{systemConfigItemController.selected.valueType eq 8}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:selectManyMenu value="#{systemConfigItemController.multiSelected}" required="true" showCheckbox="true" collectionType="java.util.ArrayList" style="width: 95%;">
                            <f:selectItems value="#{systemConfigItemController.selected.enumList}" var="item" itemLabel="#{item.get('key')}" itemValue="#{item.get('value')}"  itemDisabled="#{item.get('value') eq 'MaintenanceFee'}"/>
                        </p:selectManyMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{systemConfigItemController.selected.valueType eq 9 and systemConfigItemController.selected.key ne 'pmEntryTypeSet' }">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:fieldset>
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">是否显示</label>
                                    <p:selectOneRadio value="#{systemConfigItemController.selected.fieldColumnDto.rendered}" style="width: 30%;">
                                        <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                                        <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                                    </p:selectOneRadio>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">标签名称</label>
                                    <p:inputText value="#{systemConfigItemController.selected.fieldColumnDto.label}" maxlength="200"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">是否必填</label>
                                    <p:selectOneRadio value="#{systemConfigItemController.selected.fieldColumnDto.required}" style="width: 30%;">
                                        <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                                        <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                                    </p:selectOneRadio>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">必填提示</label>
                                    <p:inputText value="#{systemConfigItemController.selected.fieldColumnDto.requiredMessage}" maxlength="300" disabled="#{systemConfigItemController.selected.key eq 'showWorkOrderType'}"/>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{systemConfigItemController.selected.fieldColumnDto.type eq 'date'}">
                                    <label class="label">日期格式</label>
                                    <p:selectOneMenu value="#{systemConfigItemController.selected.fieldColumnDto.datePattern}">
                                        <f:selectItems value="#{systemConfigItemController.datePatternSelect}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:fieldset>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{systemConfigItemController.selected.valueType eq 9 and systemConfigItemController.selected.key eq 'pmEntryTypeSet' }">
                        <h:panelGroup>
                            <label class="label">保养工时设置</label>
                            <p:selectOneRadio value="#{systemConfigItemController.selected.fieldColumnDto.entryType}"  layout="pageDirection" >
                                <p:ajax update="manHoursGroup"/>
                                <f:selectItem itemLabel="工时段" itemValue="1"/>
                                <f:selectItem itemLabel="总工时" itemValue="0"/>
                                <f:selectItem itemLabel="仅工时段" itemValue="3"/>
                                <f:selectItem itemLabel="仅总工时" itemValue="2"/>
                            </p:selectOneRadio>
                        </h:panelGroup>

                        <h:panelGroup id="manHoursGroup" >
                            <h:panelGroup>
                                <label class="label">默认工时(小时)</label>
                                <p:inputNumber id="manHours_input" maxValue="999" value="#{systemConfigItemController.selected.fieldColumnDto.hours}"  >
                                    <p:ajax />
                                </p:inputNumber>
                            </h:panelGroup>
                        </h:panelGroup>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{systemConfigItemController.selected.key eq 'assetScrap' or systemConfigItemController.selected.key eq 'showAssetScrapNo'}">
                        <label class="label">报废流程</label>
                        <p:fieldset>
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">#{systemConfigItemController.configItemMap.get('assetScrap').name.concat('(').concat(systemConfigItemController.configItemMap.get('assetScrap').key).concat(')')}</label>
                                    <p:selectOneRadio id="assetScrap" value="#{systemConfigItemController.configItemMap.get('assetScrap').showValue}" style="width: 15%;">
                                        <p:ajax event="change" listener="#{systemConfigItemController.onAssetScrapChange}" update="showAssetScrapNoGroup" />
                                        <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                                        <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                                    </p:selectOneRadio>
                                </h:panelGroup>
                                <h:panelGroup id="showAssetScrapNoGroup">
                                    <label class="label">#{systemConfigItemController.configItemMap.get('showAssetScrapNo').name.concat('(').concat(systemConfigItemController.configItemMap.get('showAssetScrapNo').key).concat(')')}</label>
                                    <p:selectOneRadio id="showAssetScrapNo" value="#{systemConfigItemController.configItemMap.get('showAssetScrapNo').showValue}"  style="width: 15%;" disabled="#{!systemConfigItemController.configItemMap.get('assetScrap').showValue}">
                                        <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                                        <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                                    </p:selectOneRadio>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:fieldset>
                    </h:panelGroup>
                 </p:panelGrid>
                <br/>
                <p:commandButton rendered="#{systemConfigItemController.selected.key eq 'assetScrap' or systemConfigItemController.selected.key eq 'showAssetScrapNo'}"  validateClient="true" value="#{msg.Save}" actionListener="#{systemConfigItemController.saveConfigScrap(systemConfigItemController.configItemMap.get('assetScrap'),systemConfigItemController.configItemMap.get('showAssetScrapNo'))}"
                                 update=":growl @(.datalist)" icon="ui-icon-check" oncomplete="handleSubmit(args, 'configItemEditDialog');" />
                <p:commandButton rendered="#{systemConfigItemController.selected.key ne 'assetScrap' and systemConfigItemController.selected.key ne 'showAssetScrapNo'}" validateClient="true" value="#{msg.Save}" actionListener="#{systemConfigItemController.saveConfig}" update=":growl @(.datalist)" icon="ui-icon-check" oncomplete="handleSubmit(args, 'configItemEditDialog');" />
                <p:commandButton id="save" validateClient="true" value="#{msg.Save}并处理历史未完成工单" rendered="#{systemConfigItemController.selected.key eq 'enableSimpleDepartmentSecondment' and systemConfigItemController.selected.showValue eq 'true' and systemConfigItemController.selected.valueType ne '10' }" actionListener="#{systemConfigItemController.saveConfigAndUpdateData}" update=":growl @(.datalist)" icon="ui-icon-check" oncomplete="handleSubmit(args, 'configItemEditDialog');" />
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('configItemEditDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
