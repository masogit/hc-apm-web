<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            .ui-selectbooleanbutton{
                background: #3e464c !important;
                color: #fff !important;
                border: none !important;
            }
            body.layout-compact .ui-chkbox{
                width: 18px !important;
            }
            .vertical-radio-aligned .ui-radiobutton {
                display: inline-block;
                vertical-align: top;
                margin-right: 8px;
            }
            .vertical-radio-aligned label {
                display: block;
                margin-bottom: 6px;
                line-height: 1.4;
            }
            .vertical-radio-aligned .ui-radiobutton-box {
                vertical-align: middle;
            }
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.ConfigItemManage}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="configItemForm">
                    <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                        <h:panelGroup>
                            <p:commandButton id="btnOrg" value="#{systemConfigItemController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                            <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false">
                                <p:scrollPanel style="height:300px;border: 0;" mode="native">
                                    <p:tree id="orgTree2" class="tree" style="width:98%;border:0;" value="#{orgTreeController.tenantOrgTree}" selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
                                        <p:ajax process="@this" event="select" listener="#{systemConfigItemController.onSelectSiteTreeNode}" update="configItemForm" oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                    </h:panelGrid>
                    <p:tabView id="tabView" dynamic="true">
                        <p:ajax event="tabChange" listener="#{systemConfigItemController.onTabChange}" oncomplete="openConfigItemWindow(xhr, status, args)"/>
                        <p:tab title="基本信息" id="basicInfo">
                            <p:dataTable id="datalist" class="datalist" value="#{systemConfigItemController.lazyModel}" var="item" widgetVar="varDataList"
                                         selectionMode="single" selection="#{systemConfigItemController.selected}"
                                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                         sortMode="single" sortOrder="descending" sortBy="#{item.uid}"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         rows="20" emptyMessage="#{msg.noRecordFound}"
                                         rowsPerPageTemplate="10,20,30,90">

                                <p:ajax event="rowSelect" update="editButton" />
                                <p:ajax event="filter" listener="#{systemConfigItemController.onFilter}" />

                                <p:column headerText="#{msg.ConfigItemName}" filterBy="#{item.name}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.name}"/>
                                </p:column>
                                <p:column headerText="#{msg.ConfigItemKey}" filterBy="#{item.key}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.key}"/>
                                </p:column>
                                <p:column headerText="#{msg.ConfigItemCategory}" filterBy="#{item.category}" filterMatchMode="EQ">
                                    <h:outputText value="#{systemConfigItemController.categoryMap.get(item.category)}"/>
                                    <f:facet name="filter">
                                        <p:selectOneMenu onchange="PF('varDataList').filter()">
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{systemConfigItemController.categoryMap.entrySet()}" var="item" itemLabel="#{item.getValue()}" itemValue="#{item.getKey()}"/>
                                        </p:selectOneMenu>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="#{msg.ConfigItemDesc}">
                                    <h:outputText value="#{item.description}"/>
                                </p:column>
                                <p:column headerText="#{msg.ConfigItemValue}">
                                    <h:outputText rendered="#{item.valueType == '3'}"
                                                  value="#{item.showValue == 'true' ? '是' : '否'}"/>
                                    <h:outputText rendered="#{item.valueType == '7'}"
                                                  value="#{systemConfigItemController.transferEnum(item.valueType, item.showValue,item.enumList)}"/>
                                    <h:outputText rendered="#{item.valueType == '8'}"
                                                  value="#{systemConfigItemController.transferEnum(item.valueType, item.showValue,item.enumList)}"/>
                                    <h:outputText rendered="#{item.valueType != '3' and item.valueType != '7' and item.valueType != '8'}"
                                                  value="#{item.showValue}" style="overflow: hidden;text-overflow:ellipsis;white-space: nowrap;"/>
                                </p:column>
                                <f:facet name="{Toolbar}">
                                    <p:commandButton id="editButton" actionListener="#{systemConfigItemController.prepareEdit}" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Create}" update=":configItemEditDlg" oncomplete="PF('configItemEditDialog').show()" disabled="#{empty systemConfigItemController.selected}" />
                                </f:facet>
                            </p:dataTable>
                        </p:tab>
                        <p:tab title="#{msg.AssetMDM}" id="id1">
                            <ui:include src="configItemAssetMDM.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.EquipmentSwap}" id="id2">
                            <ui:include src="configItemEquipmentSwap.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.arrivalInstallation}" id="id3">
                            <ui:include src="configItemArrivalInstallation.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.WorkOrderMgmt}" id="id4">
                            <ui:include src="configItemRepair.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.PreventiveMaintainceMgmt}" id="id5">
                            <ui:include src="configItemMaintain.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.BudgetMgr}" id="id6">
                            <ui:include src="configItemBudgetMgr.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.DeviceMetrologyMgmt}" id="id7">
                            <ui:include src="configItemMeasure.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.ClinicalAssistant}" id="id8">
                            <ui:include src="configItemNurse.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.AssetKnowledgeBaseMgmt}" id="id9">
                            <ui:include src="configItemKnowledge.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.DeviceKPIAnalysis}" id="id10">
                            <ui:include src="configItemPerformance.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.review}" id="id11">
                            <ui:include src="configItemReview.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.DeviceQualityControl}" id="id19">
                            <ui:include src="configItemQualityControlManagement.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.InventoryWorkorder}" id="id12">
                            <ui:include src="configItemInventory.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.SysAdmin}" id="id13">
                            <ui:include src="configItemSysAdmin.xhtml"/>
                        </p:tab>
                        <p:tab title="不良事件" id="id14">
                            <ui:include src="configItemAdverseEvents.xhtml"/>
                        </p:tab>
                        <p:tab title="#{msg.trainManage}" id="id15">
                            <ui:include src="configItemTrainManage.xhtml"/>
                        </p:tab>
                        <p:tab title="MVS院级工单" id="id16">
                            <ui:include src="configItemSiteOrderMVS.xhtml"/>
                        </p:tab>
                        <p:tab title="IB报表链接" id="id17">
                            <ui:include src="configItemIbReport.xhtml"/>
                        </p:tab>
                        <p:tab title="列表字段配置" id="id18">
                          <ui:include src="configItemRepairListColumn.xhtml"/>
                        </p:tab>
                        <p:tab title="时间记录配置" id="id20">
                            <ui:include src="configItemSysAdmin.xhtml"/>
                        </p:tab>

                        <!--                        <c:forEach items="#{systemConfigItemController.getCategoryEntrySet()}" var="entryItem">-->
                        <!--                            <p:tab title="#{entryItem.getValue()}" id="#{'id'.concat(entryItem.getKey())}">-->
                        <!--                                <ui:include src="configItemCategory.xhtml"/>-->
                        <!--                            </p:tab>-->
                        <!--                        </c:forEach>-->
                    </p:tabView>

                    <!--                    <h:panelGroup id="actionButtonGroup">-->
                    <!--                        <p:commandButton value="#{msg.Onekey}#{msg.Save}" icon="ui-icon-check" action="#{systemConfigItemController.saveConfigMap()}" validateClient="true" update="configItemForm" rendered="#{not empty systemConfigItemController.configItemList}" style="float:left"/>-->
                    <!--                        <p:commandButton value="#{msg.Onekey}#{msg.Delete}" icon="ui-icon-check" action="#{systemConfigItemController.deleteConfigMap()}" validateClient="true" update="configItemForm" rendered="#{not empty systemConfigItemController.configItemList}" style="float:left"/>-->
                    <!--                    </h:panelGroup>-->

                </h:form>
            </div>
        </div>
        <ui:include src="configItemEdit.xhtml"/>
        <script>
            function openConfigItemWindow(xhr, status, args) {
                if(args.url != null){
                    window.location.href = args.url;
                }

            }
        </script>
    </ui:define>
</ui:composition>
