<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">是否显示</label>
                <p:selectOneRadio value="#{systemConfigItemController.configItemMap.get('contractSigningDate').fieldColumnDto.rendered}" style="width: 30%;">
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                </p:selectOneRadio>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">标签名称</label>
                <p:inputText value="#{systemConfigItemController.configItemMap.get('contractSigningDate').fieldColumnDto.label}" maxlength="200"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">是否必填</label>
                <p:selectOneRadio value="#{systemConfigItemController.configItemMap.get('contractSigningDate').fieldColumnDto.required}" style="width: 30%;">
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                </p:selectOneRadio>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">必填提示</label>
                <p:inputText value="#{systemConfigItemController.configItemMap.get('contractSigningDate').fieldColumnDto.requiredMessage}" maxlength="300"/>
            </h:panelGroup>
        </p:panelGrid>
    </ui:composition>

</html>
