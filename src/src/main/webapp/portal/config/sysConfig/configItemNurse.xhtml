<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('setQueryNumberDays').name.concat('(').concat(systemConfigItemController.configItemMap.get('setQueryNumberDays').key).concat(')')}</label>
                <p:inputNumber value="#{systemConfigItemController.configItemMap.get('setQueryNumberDays').showValue}" decimalPlaces="0" style="width: 95%;"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('setQueryNumberDays').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('setQueryNumberDays'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('setQueryNumberDays'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('setQueryNumberDays').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('disinfectedAfterShutdown').name.concat('(').concat(systemConfigItemController.configItemMap.get('disinfectedAfterShutdown').key).concat(')')}</label>
                <p:selectOneRadio value="#{systemConfigItemController.configItemMap.get('disinfectedAfterShutdown').showValue}" style="width: 15%;">
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                </p:selectOneRadio>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('disinfectedAfterShutdown').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('disinfectedAfterShutdown'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('disinfectedAfterShutdown'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('disinfectedAfterShutdown').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('dailyCheckMessagePush').name.concat('(').concat(systemConfigItemController.configItemMap.get('dailyCheckMessagePush').key).concat(')')}</label>
                <p:selectOneRadio value="#{systemConfigItemController.configItemMap.get('dailyCheckMessagePush').showValue}" style="width: 15%;">
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                </p:selectOneRadio>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('dailyCheckMessagePush').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('dailyCheckMessagePush'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('dailyCheckMessagePush'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('dailyCheckMessagePush').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('repairAffectsDailyInspection').name.concat('(').concat(systemConfigItemController.configItemMap.get('repairAffectsDailyInspection').key).concat(')')}</label>
                <p:selectOneRadio value="#{systemConfigItemController.configItemMap.get('repairAffectsDailyInspection').showValue}" style="width: 15%;">
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                </p:selectOneRadio>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('repairAffectsDailyInspection').description}" rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" readonly="true"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('repairAffectsDailyInspection'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('repairAffectsDailyInspection'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('repairAffectsDailyInspection').configItemValue == null}"/>
            </h:panelGroup>
        </p:panelGrid>
    </ui:composition>

</html>
