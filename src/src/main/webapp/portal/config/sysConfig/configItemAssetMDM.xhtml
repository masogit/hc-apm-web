<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('vendorLoginUrl').name.concat('(').concat(systemConfigItemController.configItemMap.get('vendorLoginUrl').key).concat(')')}</label>
                <p:inputTextarea value="#{systemConfigItemController.configItemMap.get('vendorLoginUrl').showValue}"
                                 rows="1" cols="50" style="width: 50%;max-height:300px;overflow:scroll;" validatorMessage="请输入正确的配置值" requiredMessage="#{msg.ConfigItemValue}#{msg.ValidationRequire}">
                    <f:validateRegex disabled="#{empty systemConfigItemController.configItemMap.get('vendorLoginUrl').validation}" pattern="#{systemConfigItemController.configItemMap.get('vendorLoginUrl').validation}"/>
                </p:inputTextarea>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('vendorLoginUrl'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('vendorLoginUrl'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('vendorLoginUrl').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('enableAssetGroupAssetTypeGroupAssociation').name.concat('(').concat(systemConfigItemController.configItemMap.get('enableAssetGroupAssetTypeGroupAssociation').key).concat(')')}</label>
                <p:selectOneRadio value="#{systemConfigItemController.configItemMap.get('enableAssetGroupAssetTypeGroupAssociation').showValue}" style="width: 15%;">
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                </p:selectOneRadio>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('enableAssetGroupAssetTypeGroupAssociation'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('enableAssetGroupAssetTypeGroupAssociation'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('enableAssetGroupAssetTypeGroupAssociation').configItemValue == null}"/>
            </h:panelGroup>

            <h:panelGroup>
                <label class="label">#{systemConfigItemController.configItemMap.get('enableDeviceReplication').name.concat('(').concat(systemConfigItemController.configItemMap.get('enableDeviceReplication').key).concat(')')}</label>
                <p:selectOneRadio value="#{systemConfigItemController.configItemMap.get('enableDeviceReplication').showValue}" style="width: 15%;">
                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                </p:selectOneRadio>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.Operation}</label>
                <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get('enableDeviceReplication'))}" update="configItemForm" />
                <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get('enableDeviceReplication'))}" update="configItemForm" style="padding:10px"
                               disabled="#{systemConfigItemController.configItemMap.get('enableDeviceReplication').configItemValue == null}"/>
            </h:panelGroup>
        </p:panelGrid>
    </ui:composition>

</html>
