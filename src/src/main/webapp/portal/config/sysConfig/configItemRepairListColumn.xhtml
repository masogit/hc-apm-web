<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">

    <ui:composition>
        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <c:forEach items="#{systemConfigItemController.configItemList}" var="configItem">
                <h:panelGroup>
                    <label class="label">#{configItem.name.concat('(').concat(configItem.key).concat(')')}</label>
                    <p:dataTable id="#{configItem.key}" var='item' value="#{systemConfigItemController.configItemMap.get(configItem.key).fieldColumnDtoList}" draggableRows="true">
                        <p:growl id="msgss" />
                        <p:ajax event="rowReorder" update="#{configItem.key}"/>
                        <p:column headerText="#{msg.DisplayedField}" >
                            <h:outputText value="#{item.label}"  />
                        </p:column>
                        <p:column headerText="是否固定列" >
                            <h:outputText value="#{item.required ? '是' : '否'}"  />
                        </p:column>
                        <p:column headerText="#{msg.Operation}">
                            <h:panelGroup rendered="#{!item.required}">
                                <p:selectBooleanCheckbox value="#{item.rendered}"  >
                                    <p:ajax />
                                </p:selectBooleanCheckbox>
                            </h:panelGroup>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.Operation}</label>
                    <p:commandLink value="#{msg.Update}" actionListener="#{systemConfigItemController.saveConfig(systemConfigItemController.configItemMap.get(configItem.key))}" update="configItemForm" />
                    <p:commandLink value="#{msg.Delete}" actionListener="#{systemConfigItemController.deleteConfig(systemConfigItemController.configItemMap.get(configItem.key))}" update="configItemForm" style="padding:10px"
                                   disabled="#{systemConfigItemController.configItemMap.get(configItem.key).configItemValue == null}"/>
                </h:panelGroup>
            </c:forEach>

        </p:panelGrid>
    </ui:composition>
    <style >
        .ui-state-disabled {
            opacity: 0.5;
            filter: alpha(opacity=50);
            cursor: not-allowed;
        }
    </style>
</html>
