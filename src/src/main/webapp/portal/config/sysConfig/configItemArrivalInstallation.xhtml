<?xml version="1.0" encoding="UTF-8" ?>

                <p:autoComplete id="clinicalDeptName" dropdown="true"
                                value="#{systemConfigItemController.selectedObjectMap['assetOutStockDept']}"

                                completeMethod="#{systemConfigItemController.autoCompleteDept}"
                                var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter"

                    <p:ajax event="itemSelect" listener="#{systemConfigItemController.onDeptChange('assetOutStockDept')}"/>

                </p:autoComplete>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.ConfigItemDesc}</label>

            </h:panelGroup>
