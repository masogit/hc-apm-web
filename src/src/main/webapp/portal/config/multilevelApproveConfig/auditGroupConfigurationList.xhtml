<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:P="http://java.sun.com/jsf/html"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.auditGroupConfiguration}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="auditGroupConfigurationlListForm">
                    <p:dataTable id="datalist" value="#{auditGroupConfigurationController.lazyModel}" var="item"
                                 widgetVar="varDataList"
                                 selectionMode="single" selection="#{auditGroupConfigurationController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="createButton editButton deleteButton" />
                        <p:ajax event="filter" listener="#{auditGroupConfigurationController.onFilter}"
                                update="createButton"/>

                        <p:column headerText="分组名称" width="18%" >
                            <h:outputText value="#{item.groupName}"/>
                        </p:column>

                        <p:column headerText="组员" >
                            <h:outputText value="#{auditGroupConfigurationController.getGroupMember(item.groupMemberItem)}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray"
                                             title="#{msg.Create}"
                                             update="ApproveForm"
                                             actionListener="#{auditGroupConfigurationController.preCreate}"
                                             oncomplete="PF('ApproveDialog').show()"/>
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray"
                                             title="#{msg.Edit}" style="zoom:0.9;"
                                             disabled="#{empty auditGroupConfigurationController.selected}"
                                             update="ApproveForm"
                                             actionListener="#{auditGroupConfigurationController.preEdit}"
                                             oncomplete="PF('ApproveDialog').show()"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray"
                                             title="#{msg.Delete}" update="datalist, :growl"
                                             disabled="#{empty auditGroupConfigurationController.selected}"
                                             actionListener="#{auditGroupConfigurationController.delete}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                           icon="ui-icon-warning"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="auditGroupConfigurationEdit.xhtml"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
