<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

<ui:composition>

    <p:dialog id="ApproveDlg" widgetVar="ApproveDialog" modal="true" resizable="true" draggable="true" width="1050"
              height="600" appendTo="@(body)" header="多级审批配置">
        <h:form id="ApproveForm">
            <p:fieldset id="basic" legend="基本信息">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label" style="font-size: medium; font-weight: bold">#{msg.hospitalId}*</label>
                        <p:inputText id="selectedUserOrgName"
                                     value="#{multiLevelApprovalConfigController.getOrgFullName(multiLevelApprovalConfigController.selected.orgUid)}"
                                     readonly="true" required="true"
                                     requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
                        <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down"
                                         style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                        <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User"
                                        hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel"
                                        style="width:300px;" modal="false">
                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;"
                                        value="#{tenantOrgTreeController.tenantOrgTree}"
                                        var="node" selectionMode="single">
                                    <p:ajax process="@this" event="select" update=":ApproveForm"
                                            listener="#{multiLevelApprovalConfigController.onSelectOrgForUser}"
                                            oncomplete="PF('varPanelOrg4User').hide();"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
                                    <p:treeNode type="hidden" rendered="false"/>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label" style="font-size: medium; font-weight: bold">业务类型</label>
                        <p:selectOneMenu id="busiType"
                                         value="#{multiLevelApprovalConfigController.selected.businessType}"
                                         required="true" requiredMessage="业务类型不能为空">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}"
                                          noSelectionOption="true"/>
                            <f:selectItems value="#{multiLevelApprovalConfigController.businessTypeList}" var="item"
                                           itemLabel="#{item.valueZh}" itemValue="#{item.msgKey}"/>
                            <p:ajax form="ApproveForm"
                                    listener="#{multiLevelApprovalConfigController.onSelectBusiType()}" process="@this"
                                    update="ApproveForm"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label" style="font-size: medium; font-weight: bold">审批流名称</label>
                        <p:inputText id="approvename"
                                     value="#{multiLevelApprovalConfigController.selected.approvalName}" required="true"
                                     requiredMessage="审批流名称不能为空">
                            <p:ajax process="@this"/>
                        </p:inputText>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label" style="font-size: medium; font-weight: bold">是否启用该配置</label>
                        <p:selectOneRadio id="enable" value="#{multiLevelApprovalConfigController.selected.enable}">
                            <p:ajax event="change" process="@this" update="ApproveForm:enable"/>
                            <f:selectItem itemLabel="启用" itemValue="true"/>
                            <f:selectItem itemLabel="停用" itemValue="false"/>
                        </p:selectOneRadio>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>

            <p:fieldset id="config" legend="配置信息"
                        rendered="#{multiLevelApprovalConfigController.configEnable}">

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup >
                        <label class="label">金额区间(不包含左边)</label>
                        <p:inputNumber id="minPrice" decimalPlaces="0" minValue="0" maxValue="999999999"
                                       emptyValue="true"
                                       value="#{multiLevelApprovalConfigController.selected.minAmount}"
                                       required="true" requiredMessage="金额不能为空">
                            <f:convertNumber pattern="0" type="number"/>
                        </p:inputNumber>
                        -&nbsp;&nbsp;
                        <p:inputNumber id="maxPrice" decimalPlaces="0" minValue="0" maxValue="999999999"
                                       emptyValue="true"
                                       value="#{multiLevelApprovalConfigController.selected.maxAmount}"
                                       required="true" requiredMessage="金额不能为空">
                            <f:convertNumber pattern="0" type="number"/>
                        </p:inputNumber>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>

            <p:fieldset id="approver" legend="审批节点">
                <p:dataTable id="nodeInfoList" value="#{multiLevelApprovalConfigController.nodesList}" var="item"
                             lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                             emptyMessage="#{msg.noRecordFound}">

                    <p:column headerText="节点序号">
                        <h:outputText value="#{item.nodeId}"/>
                    </p:column>
                    <p:column headerText="节点名称">
                        <h:outputText value="#{item.nodeName}"/>
                    </p:column>
                    <p:column headerText="操作">
                        <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}"
                                         oncomplete="PF('approverInfoDlg').show()"
                                         disabled="#{'view'.equals(multiLevelApprovalConfigController.operateType)}"
                                         rendered="#{empty item.nodeName}"
                                         actionListener="#{multiLevelApprovalConfigController.onAddNode()}"
                                         update="approverInfoDlg"/>
                        <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}"
                                         actionListener="#{multiLevelApprovalConfigController.onEditNode(item.nodeId)}"
                                         oncomplete="PF('approverInfoDlg').show()"
                                         update="approverInfoDlg" rendered="#{not empty item.nodeName}"/>
                        <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
                                         actionListener="#{multiLevelApprovalConfigController.delNode(item.nodeId)}"
                                         update="nodeInfoList"
                                         rendered="#{not empty item.nodeName}">
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                       icon="ui-icon-alert"/>
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </p:fieldset>

            <br/>
            <p:commandButton validateClient="true" actionListener="#{multiLevelApprovalConfigController.save}"
                             value="#{msg.Save}" update="MultiLevelListForm" icon="ui-icon-check"
                             oncomplete="handleSubmit(args, 'ApproveDialog');"
                             rendered="#{!'view'.equals(multiLevelApprovalConfigController.operateType)}"/>

            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                             onclick="PF('ApproveDialog').hide()"
                             rendered="#{!'view'.equals(multiLevelApprovalConfigController.operateType)}"/>
            <p:commandButton immediate="true" value="确定" icon="ui-icon-check" onclick="PF('ApproveDialog').hide()"
                             rendered="#{'view'.equals(multiLevelApprovalConfigController.operateType)}"/>
        </h:form>
    </p:dialog>

    <p:dialog id="approverInfoDlg" widgetVar="approverInfoDlg" modal="true" resizable="true" draggable="true"
              appendTo="@(body)" header="新增节点" width="350" height="350">

        <h:form id="approverInfoEditForm">
            <h:panelGroup id="displayy">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">节点名称</label>
                        <p:inputText id="msgKey" value="#{multiLevelApprovalConfigController.approvalNode.nodeName}"
                                     required="true" requiredMessage="节点名称不能为空">
                            <p:ajax process="@this"/>
                        </p:inputText>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label" style="font-size: medium">是否通过组织机构筛选</label>
                        <p:selectBooleanCheckbox value="#{multiLevelApprovalConfigController.approvalNode.selectByOrg}"
                                                 disabled="#{'view'.equals(multiLevelApprovalConfigController.operateType)}">
                            <p:ajax process="@this" update="approverInfoEditForm:byOrg approverInfoEditForm:approveuser" listener="#{multiLevelApprovalConfigController.ifSelectbyOrg}"/>
                        </p:selectBooleanCheckbox>
                    </h:panelGroup>
                    <h:panelGroup id="byOrg">
                        <h:panelGroup rendered="#{multiLevelApprovalConfigController.approvalNode.selectByOrg}">
                            <label class="label">组织机构选择</label>
                            <p:inputText id="selectedOrgName" value="#{multiLevelApprovalConfigController.selectedUserOrg==null ? '': multiLevelApprovalConfigController.selectedUserOrg.name}" readonly="true"/>
                            <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                            <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{multiLevelApprovalConfigController.orgTree}" var="node" selectionMode="single">
                                        <p:ajax process="@this" event="select"  update="approverInfoEditForm:selectedOrgName approverInfoEditForm:approveuser" listener="#{multiLevelApprovalConfigController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>

                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                    </h:panelGroup>
                    <h:panelGroup id="approveuser">
                        <label class="label"> 审核人选择 </label>
                        <p:selectCheckboxMenu
                                value="#{multiLevelApprovalConfigController.approvalNode.approveUsers}"
                                panelStyle="width:280px" style="width:100%"
                                converter="userAccountConverter" multiple="true" filter="true"
                                filterMatchMode="contains" required="true" requiredMessage="审核人不能为空"
                                disabled="#{'view'.equals(multiLevelApprovalConfigController.operateType)}">
                            <f:selectItems value="#{multiLevelApprovalConfigController.users4Approval}" var="item"
                                           itemLabel="#{multiLevelApprovalConfigController.getNameWithOrgName(item)}" itemValue="#{item}"/>
                            <p:ajax process="@this"/>
                        </p:selectCheckboxMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" actionListener="#{multiLevelApprovalConfigController.saveNode}"
                                 value="#{msg.Save}" update="ApproveForm:nodeInfoList" icon="ui-icon-check"
                                 oncomplete="handleSubmit(args, 'approverInfoDlg');"
                                 rendered="#{!'view'.equals(multiLevelApprovalConfigController.operateType)}"/>
                &nbsp;&nbsp;
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('approverInfoDlg').hide()"
                                 rendered="#{!'view'.equals(multiLevelApprovalConfigController.operateType)}"/>
                <p:commandButton immediate="true" value="#{msg.OK}" icon="ui-icon-check"
                                 onclick="PF('approverInfoDlg').hide()"
                                 rendered="#{'view'.equals(multiLevelApprovalConfigController.operateType)}"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
