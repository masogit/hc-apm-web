<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:apm="http://www.ge.com/tags/apm">

<ui:composition>

    <p:dialog id="UpdateApproveDlg" widgetVar="UpdateApproveDlg" modal="true" resizable="true" draggable="true"
              width="1050"
              height="600" appendTo="@(body)" header="更换人员配置">
        <h:form id="ApproveForm2">
            <p:fieldset id="basic1" legend="基本信息">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label" style="font-size: medium; font-weight: bold">#{msg.hospitalId}*</label>
                        <p:inputText disabled="true" id="selectedUserOrgName"
                                     value="#{multiLevelApprovalConfigController.getOrgFullName(multiLevelApprovalConfigController.selected.hierOrgUid)}"
                                     readonly="true" required="true"
                                     requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
                        <p:commandButton disabled="true" id="btnOrg4User" process="@this" icon="fa fa-angle-down"
                                         style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                        <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User"
                                        hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel"
                                        style="width:300px;" modal="false">
                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;"
                                        value="#{tenantOrgTreeController.tenantOrgTree}"
                                        var="node" selectionMode="single">
                                    <p:ajax process="@this" event="select" update=":ApproveForm"
                                            listener="#{multiLevelApprovalConfigController.onSelectOrgForUser}"
                                            oncomplete="PF('varPanelOrg4User').hide();"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
                                    <p:treeNode type="hidden" rendered="false"/>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label" style="font-size: medium; font-weight: bold">业务类型</label>
                        <p:selectOneMenu disabled="true" id="busiType"
                                         value="#{multiLevelApprovalConfigController.selected.businessType}"
                                         required="true" requiredMessage="业务类型不能为空">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}"
                                          noSelectionOption="true"/>
                            <f:selectItems value="#{multiLevelApprovalConfigController.businessTypeList}" var="item"
                                           itemLabel="#{item.valueZh}" itemValue="#{item.msgKey}"/>
                            <p:ajax form="ApproveForm"
                                    listener="#{multiLevelApprovalConfigController.onSelectBusiType()}" process="@this"
                                    update="ApproveForm"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label" style="font-size: medium; font-weight: bold">审批流名称</label>
                        <p:inputText disabled="true" id="approvename"
                                     value="#{multiLevelApprovalConfigController.selected.approvalName}" required="true"
                                     requiredMessage="审批流名称不能为空">
                            <p:ajax process="@this"/>
                        </p:inputText>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label" style="font-size: medium; font-weight: bold">是否启用该配置</label>
                        <p:selectOneRadio disabled="true" id="enable"
                                          value="#{multiLevelApprovalConfigController.selected.enable}">
                            <p:ajax event="change" process="@this" update="ApproveForm:enable"/>
                            <f:selectItem itemLabel="启用" itemValue="true"/>
                            <f:selectItem itemLabel="停用" itemValue="false"/>
                        </p:selectOneRadio>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>


            <p:fieldset id="approver" legend="审批节点">
                <p:dataTable id="nodeInfoList2" value="#{multiLevelApprovalConfigController.nodesList}" var="item"
                             lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                             emptyMessage="#{msg.noRecordFound}">

                    <p:column headerText="节点序号">
                        <h:outputText value="#{item.nodeId}"/>
                    </p:column>
                    <p:column headerText="节点名称">
                        <h:outputText value="#{item.nodeName}"/>
                    </p:column>
                    <p:column headerText="操作">
                        <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}"
                                         actionListener="#{multiLevelApprovalConfigController.onEditNode(item.nodeId)}"
                                         oncomplete="PF('approverInfoDlg2').show()"
                                         update="approverInfoDlg2" rendered="#{not empty item.nodeName}"/>
                    </p:column>
                </p:dataTable>
            </p:fieldset>

            <br/>
<!--            <p:commandButton validateClient="true"-->
<!--                             actionListener="#{multiLevelApprovalConfigController.updatePersonnelConfig}"-->
<!--                             value="#{msg.Save}" update="MultiLevelListForm" icon="ui-icon-check"-->
<!--                             oncomplete="handleSubmit(args, 'UpdateApproveDlg');"-->
<!--                             rendered="#{!'view'.equals(multiLevelApprovalConfigController.operateType)}"/>-->

            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                             onclick="PF('UpdateApproveDlg').hide()" update="MultiLevelListForm"
                             rendered="#{!'view'.equals(multiLevelApprovalConfigController.operateType)}"/>
<!--            <p:commandButton immediate="true" value="确定" icon="ui-icon-check" onclick="PF('UpdateApproveDlg').hide()"-->
<!--                             rendered="#{'view'.equals(multiLevelApprovalConfigController.operateType)}"/>-->
        </h:form>
    </p:dialog>

    <p:dialog id="approverInfoDlg2" widgetVar="approverInfoDlg2" modal="true" resizable="true" draggable="true"
              appendTo="@(body)" header="更新节点" width="1000" height="600">

        <h:form id="approverInfoEditForm2">
            <h:panelGroup id="displayy1">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup id="approveuser1">
                        <label class="label"> 审核人选择 </label>
                        <br></br>

                        <h:panelGroup rendered="#{multiLevelApprovalConfigController.approvalConditionEnable}">
                            <p:fieldset legend="审批节点-角色">
                                <p:selectOneMenu disabled="true"
                                                 value="#{multiLevelApprovalConfigController.approvalNode.roleApproveCondition.approveRole}"
                                                 autoWidth="false" style="max-width: 300px;" height="300">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}审批角色" itemValue="#{null}"
                                                  noSelectionOption="true"/>
                                    <f:selectItem itemLabel="临床科室主任" itemValue="DeptHead"/>
                                    <f:selectItem itemLabel="工程师" itemValue="AssetStaff"/>
                                </p:selectOneMenu>
                            </p:fieldset>

                            <p:fieldset legend="审批节点-条件">
                                <p:selectOneMenu disabled="true"
                                                 value="#{multiLevelApprovalConfigController.approvalNode.roleApproveCondition.condition}"
                                                 autoWidth="false" style="max-width: 300px;" height="300">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}条件" itemValue="#{null}"
                                                  noSelectionOption="true"/>
                                    <f:selectItem itemLabel="工单设备所属科室" itemValue="1"/>
                                </p:selectOneMenu>
                            </p:fieldset>
                        </h:panelGroup>
                        <!--                        <p:selectCheckboxMenu-->
                        <!--                                value="#{multiLevelApprovalConfigController.approvalNode.approveUsers}"-->
                        <!--                                panelStyle="width:280px" style="width:100%"-->
                        <!--                                converter="userAccountConverter" multiple="true" filter="true"-->
                        <!--                                filterMatchMode="contains"-->
                        <!--                                disabled="#{'view'.equals(multiLevelApprovalConfigController.operateType) or multiLevelApprovalConfigController.approvalRoleAssetHead}">-->
                        <!--                            <f:selectItems value="#{multiLevelApprovalConfigController.users4Approval}" var="item"-->
                        <!--                                           itemLabel="#{multiLevelApprovalConfigController.getNameWithOrgName(item)}" itemValue="#{item}"/>-->
                        <!--                            <p:ajax process="@this"/>-->
                        <!--                        </p:selectCheckboxMenu>-->

                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                     style="width: 900px">

                            <p:fieldset legend="原始审核人">
                                <p:scrollPanel style="height: 200px;" scrollHeight="auto" mode="native">
                                    <p:selectOneRadio id="selectAssetGrouoUids"
                                                      value="#{multiLevelApprovalConfigController.approvalUserFirst}"
                                                      layout="pageDirection" converter="userAccountConverter" >
                                        <f:selectItems
                                                value="#{multiLevelApprovalConfigController.approvalNode.approveUsers}"
                                                var="item" itemLabel="#{item.loginName}" itemValue="#{item}"/>
                                    </p:selectOneRadio>
                                </p:scrollPanel>
                            </p:fieldset>


                            <p:fieldset legend="替换审核人选项">
                                <p:scrollPanel style="height: 200px;" scrollHeight="auto" mode="native">
                                    <p:selectOneRadio id="selectAssetGrouoUids2"
                                                      value="#{multiLevelApprovalConfigController.approvalUserReplace}"
                                                      layout="pageDirection" converter="userAccountConverter" >
                                        <f:selectItems value="#{multiLevelApprovalConfigController.users4Approval}"
                                                       var="item" itemLabel="#{item.loginName}" itemValue="#{item}"/>
                                    </p:selectOneRadio>
                                </p:scrollPanel>
                            </p:fieldset>
                        </p:panelGrid>

                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" actionListener="#{multiLevelApprovalConfigController.approvalUserUpdate}"
                                 value="#{msg.Save}" update="ApproveForm2:nodeInfoList2" icon="ui-icon-check"
                                 oncomplete="handleSubmit(args, 'approverInfoDlg2');"
                                 />
                &nbsp;&nbsp;
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('approverInfoDlg2').hide()"
                                 rendered="#{!'view'.equals(multiLevelApprovalConfigController.operateType)}"/>
<!--                <p:commandButton immediate="true" value="#{msg.OK}" icon="ui-icon-check"-->
<!--                                 onclick="PF('approverInfoDlg2').hide()"-->
<!--                                 rendered="#{'view'.equals(multiLevelApprovalConfigController.operateType)}"/>-->
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
