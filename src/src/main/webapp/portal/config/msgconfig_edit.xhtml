<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="消息配置项"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id ="MsgConfigForm" style="margin-top: 20px;">
                    <p:tab title="xxxxxxxx" class="ui-g-12" >


                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup >
                                <p:selectBooleanCheckbox itemLabel="#{msgConfigController.msgNameList.get(0)}" value="#{msgConfigController.selectedMsgFields[msgConfigController.msgNameList.get(0)]}"   />
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:selectBooleanCheckbox itemLabel="#{msgConfigController.msgNameList.get(1)}" value="#{msgConfigController.selectedMsgFields[msgConfigController.msgNameList.get(1)]}"   />
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:selectBooleanCheckbox itemLabel="#{msgConfigController.msgNameList.get(2)}" value="#{msgConfigController.selectedMsgFields[msgConfigController.msgNameList.get(2)]}"   />
                            </h:panelGroup>

                            <h:panelGroup >
                                <p:selectBooleanCheckbox itemLabel="#{msgConfigController.msgNameList.get(3)}" value="#{msgConfigController.selectedMsgFields[msgConfigController.msgNameList.get(3)]}"   />
                            </h:panelGroup>

                            <h:panelGroup >
                                <p:selectBooleanCheckbox itemLabel="#{msgConfigController.msgNameList.get(4)}" value="#{msgConfigController.selectedMsgFields[msgConfigController.msgNameList.get(4)]}"   />
                            </h:panelGroup>

                            <h:panelGroup >
                                <p:selectBooleanCheckbox itemLabel="#{msgConfigController.msgNameList.get(5)}" value="#{msgConfigController.selectedMsgFields[msgConfigController.msgNameList.get(5)]}"   />
                            </h:panelGroup>

                            <h:panelGroup >
                                <p:selectBooleanCheckbox itemLabel="#{msgConfigController.msgNameList.get(6)}" value="#{msgConfigController.selectedMsgFields[msgConfigController.msgNameList.get(6)]}"   />
                            </h:panelGroup>

                            <h:panelGroup >
                                <p:selectBooleanCheckbox itemLabel="#{msgConfigController.msgNameList.get(7)}" value="#{msgConfigController.selectedMsgFields[msgConfigController.msgNameList.get(7)]}"   />
                            </h:panelGroup>

                            <h:panelGroup >
                                <p:selectBooleanCheckbox itemLabel="#{msgConfigController.msgNameList.get(8)}" value="#{msgConfigController.selectedMsgFields[msgConfigController.msgNameList.get(8)]}"   />
                            </h:panelGroup>

                            <h:panelGroup >
                                <p:selectBooleanCheckbox itemLabel="#{msgConfigController.msgNameList.get(9)}" value="#{msgConfigController.selectedMsgFields[msgConfigController.msgNameList.get(9)]}"   />
                            </h:panelGroup>


                        </p:panelGrid>
                    </p:tab>
                    <p:commandButton validateClient="true" actionListener="#{msgConfigController.saveMsgTenant}" value="#{msg.Save}" update="MsgConfigForm :growl" icon="ui-icon-check"/>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
