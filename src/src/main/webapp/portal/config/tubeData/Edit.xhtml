<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="TubeDataEditDlg" widgetVar="TubeDataEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{tubeDataController.CRUDActionName} #{msg.TubeData}">
            <h:form id="TubeDataEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{tubeDataController.selected != null}">
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="id" value="#{tubeDataController.selected.id}"  required="true" requiredMessage="#{msg.id} #{msg.ValidationRequire}"/>
                            <label>#{msg.id}*</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="assetUid" value="#{tubeDataController.selected.assetUid}" />
                            <label>#{msg.assetUid}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="seriaNum" value="#{tubeDataController.selected.seriaNum}" />
                            <label>#{msg.seriaNum}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="patientExam" value="#{tubeDataController.selected.patientExam}" />
                            <label>#{msg.patientExam}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="tubeMAS" value="#{tubeDataController.selected.tubeMAS}" />
                            <label>#{msg.tubeMAS}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="tubeScan" value="#{tubeDataController.selected.tubeScan}" />
                            <label>#{msg.tubeScan}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:calendar id="inputDate" pattern="yyyy/MM/dd HH:mm:ss" value="#{tubeDataController.selected.inputDate}" showOn="button" readonlyInput="true" showButtonPanel="true" navigator="true"/>
                            <label>#{msg.inputDate}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="geDeviceType" value="#{tubeDataController.selected.geDeviceType}" />
                            <label>#{msg.geDeviceType}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="tenantUID" value="#{tubeDataController.selected.tenantUID}" />
                            <label>#{msg.tenantUID}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="institutionUID" value="#{tubeDataController.selected.institutionUID}" />
                            <label>#{msg.institutionUID}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="hospitalUID" value="#{tubeDataController.selected.hospitalUID}" />
                            <label>#{msg.hospitalUID}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="siteUID" value="#{tubeDataController.selected.siteUID}" />
                            <label>#{msg.siteUID}</label>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{tubeDataController.save}" value="#{msg.Save}" update="display,:TubeDataEditDlg, :TubeDataListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'TubeDataEditDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('TubeDataEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
