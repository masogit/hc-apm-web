<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="TubeDataViewDlg" widgetVar="TubeDataViewDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{tubeDataController.CRUDActionName} #{msg.TubeData}">
            <h:form id="TubeDataViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{tubeDataController.selected != null}">
                        <h:outputLabel value="#{msg.id}" for="id" />
                        <h:outputText value="#{tubeDataController.selected.id}"/>
                        <h:outputLabel value="#{msg.assetUid}" for="assetUid" />
                        <h:outputText value="#{tubeDataController.selected.assetUid}"/>
                        <h:outputLabel value="#{msg.seriaNum}" for="seriaNum" />
                        <h:outputText value="#{tubeDataController.selected.seriaNum}"/>
                        <h:outputLabel value="#{msg.patientExam}" for="patientExam" />
                        <h:outputText value="#{tubeDataController.selected.patientExam}"/>
                        <h:outputLabel value="#{msg.tubeMAS}" for="tubeMAS" />
                        <h:outputText value="#{tubeDataController.selected.tubeMAS}"/>
                        <h:outputLabel value="#{msg.tubeScan}" for="tubeScan" />
                        <h:outputText value="#{tubeDataController.selected.tubeScan}"/>
                        <h:outputLabel value="#{msg.inputDate}" for="inputDate" />
                        <h:outputText value="#{tubeDataController.selected.inputDate}">
                            <f:convertDateTime pattern="yyyy/MM/dd HH:mm:ss" />
                        </h:outputText>
                        <h:outputLabel value="#{msg.geDeviceType}" for="geDeviceType" />
                        <h:outputText value="#{tubeDataController.selected.geDeviceType}"/>
                        <h:outputLabel value="#{msg.tenantUID}" for="tenantUID" />
                        <h:outputText value="#{tubeDataController.selected.tenantUID}"/>
                        <h:outputLabel value="#{msg.institutionUID}" for="institutionUID" />
                        <h:outputText value="#{tubeDataController.selected.institutionUID}"/>
                        <h:outputLabel value="#{msg.hospitalUID}" for="hospitalUID" />
                        <h:outputText value="#{tubeDataController.selected.hospitalUID}"/>
                        <h:outputLabel value="#{msg.siteUID}" for="siteUID" />
                        <h:outputText value="#{tubeDataController.selected.siteUID}"/>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton rendered="#{tubeDataController.deleteAction}" icon="ui-icon-trash" actionListener="#{tubeDataController.delete}" value="#{msg.Delete}" update="display,:TubeDataViewDlg, :TubeDataListForm:datalist, :growl" oncomplete="handleSubmit(args, 'TubeDataViewDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Close}" icon="glyphicon-off" onclick="PF('TubeDataViewDialog').hide()"/>
                    
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
