<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="reminderRuleSettingDlg" widgetVar="reminderRuleSettingDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.ReminderConfiguration}" >
            <h:form id="reminderRuleSettingForm">
                <h:panelGroup>
                    <p:panelGrid style="width: 550px; overflow: auto;" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup rendered="#{reminderRuleController.selected.ruleParam.noticeType eq msg.noticeTypeRole}">
                            <label class="label">#{msg.noticeSetting}</label>
                            <p:selectCheckboxMenu value="#{reminderRuleController.selected.ruleParam.noticeUser}" filter="true" filterMatchMode="contains" updateLabel="true"
                                                  label="#{msg.SelectOneMessage}#{fieldMsg.fieldValue('noticeType', 'noticeTypeRole')}" dynamic="true" panelStyle="width: 300px" style="width:50%" scrollHeight="250">
                                <f:selectItems value="#{reminderRuleController.roles}" var="roleItem" itemLabel="#{roleItem.roleDesc}" itemValue="#{roleItem.id}"/>
                            </p:selectCheckboxMenu>
                            <br/>
                            <br/>
                            <p:selectCheckboxMenu value="#{reminderRuleController.selected.ruleParam.customRole}" filter="true" filterMatchMode="contains" updateLabel="true"
                                                  label="#{msg.SelectOneMessage}#{msg.CustomRole}" dynamic="true" panelStyle="width: 300px" style="width:50%" scrollHeight="250">
                                <f:selectItems value="#{reminderRuleController.customRoles}" var="customRoleItem" itemLabel="#{customRoleItem.name}" itemValue="#{customRoleItem.id}"/>
                            </p:selectCheckboxMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{reminderRuleController.selected.ruleParam.noticeType eq msg.noticeTypeUser}">
                            <label class="label">#{msg.noticeSetting}</label>
                            <p:selectCheckboxMenu value="#{reminderRuleController.selected.ruleParam.noticeUser}" filter="true" filterMatchMode="contains" updateLabel="true"
                                                  label="#{msg.SelectOneMessage}#{fieldMsg.fieldValue('noticeType', 'noticeTypeUser')}" dynamic="true" panelStyle="width: 300px" style="width:50%" scrollHeight="250">
                                <f:selectItems value="#{reminderRuleController.getUserList()}" var="userItem" itemLabel="#{userItem.name}" itemValue="#{userItem.id}"/>
                            </p:selectCheckboxMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">周期单位<span style="color:red">*</span></label >
                            <p:selectOneMenu value="#{reminderRuleController.selected.pushDateUnit}">
                                <f:selectItems value="#{reminderRuleController.getDateUnitList()}" var="item" itemLabel="#{item.label}" itemValue="#{item.value}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.messageType}<span style="color:red">*</span></label >
                            <p:selectOneMenu value="#{reminderRuleController.selected.ruleParam.messageType}">
                                <p:ajax event="change" update="pushSetting wechatTemplate" listener="#{reminderRuleController.messageTypeChange}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('messageType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="pushSetting">
                            <h:panelGroup rendered="#{reminderRuleController.selected.ruleParam.pushType eq 1}">
                                <label class="label">#{msg.pushSetting.concat(reminderRuleController.getPushSettingComment())}</label>
                                <!--                            <label class="label">#{msg.pushSetting.concat(reminderRuleController.getPushSettingComment())}</label>-->
                                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup>
                                        <label class="label">周期<span style="color:red">*</span></label>
                                        <p:inputNumber id="pushDateValue" value="#{reminderRuleController.selected.ruleParam.pushDateValue}" maxValue="365" minValue="0" decimalPlaces="0" />
                                    </h:panelGroup>
                                </p:panelGrid>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{reminderRuleController.selected.ruleParam.pushType eq 2}">
                                <label class="label">#{msg.pushSetting.concat(reminderRuleController.getPushSettingComment())}</label>
                                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup>
                                        <label class="label">#{msg.pushCycle}<span style="color:red">*</span></label>
                                        <p:inputNumber id="pushCycle" value="#{reminderRuleController.selected.ruleParam.pushCycle}" maxValue="365"  decimalPlaces="0" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">#{msg.pushNum}<span style="color:red">*</span></label>
                                        <p:inputNumber id="pushNum" value="#{reminderRuleController.selected.ruleParam.pushNum}" maxValue="365"  decimalPlaces="0" />
                                    </h:panelGroup>
                                </p:panelGrid>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{reminderRuleController.selected.type eq 'WorkOrder'}">
                            <label class="label">是否急救设备?<span style="color:red">*</span></label>
                            <p:selectOneMenu value="#{reminderRuleController.selected.ruleParam.emergencyEquipment}" required="true"
                                             requiredMessage="#{msg.riskGrade} #{msg.ValidationRequire}" disabled="#{!assetInfoEditController.needEdit('riskGrade')}" >
                                <f:selectItem itemLabel="#{msg.All}" itemValue="0"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('emergencyEquipment')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
<!--                        <h:panelGroup rendered="false">-->
                        <h:panelGroup id="wechatTemplate" rendered="#{reminderRuleController.selected.reminderType eq msg.wechat}">
                            <label class="label">#{msg.wechatTemplateSetting}</label>
                            <p:commandLink value="使用默认微信模板配置" actionListener="#{reminderRuleController.initWechatTemplate()}" update="wechatTemplate" />
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
<!--                                <h:panelGroup>-->
<!--                                    <label class="label">templateId<span style="color:red">*</span></label>-->
<!--                                    <p:inputText id="templateId" value="#{reminderRuleController.selected.wechatParam.templateId}" required="true" style="width: 95%;"/>-->
<!--                                </h:panelGroup>-->
                                <h:panelGroup>
                                    <label class="label">#{msg.workOrderName}<span style="color:red">*</span></label>
                                    <p:inputText id="first" value="#{reminderRuleController.selected.wechatParam.first}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.WorkorderInformation}<span style="color:red">*</span></label>
                                    <p:inputTextarea id="keyword1" rows="1" value="#{reminderRuleController.selected.wechatParam.keyword1}" style="width: 95%;"/>
                                </h:panelGroup>
                                <!--<h:panelGroup>
                                    <label class="label">keyword2</label>
                                    <p:inputTextarea id="keyword2" value="#{reminderRuleController.selected.wechatParam.keyword2}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">keyword3</label>
                                    <p:inputTextarea id="keyword3" value="#{reminderRuleController.selected.wechatParam.keyword3}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">keyword4</label>
                                    <p:inputTextarea id="keyword4" value="#{reminderRuleController.selected.wechatParam.keyword4}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">keyword5</label>
                                    <p:inputTextarea id="keyword5" value="#{reminderRuleController.selected.wechatParam.keyword5}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">remark</label>
                                    <p:inputTextarea id="remark" value="#{reminderRuleController.selected.wechatParam.remark}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">linkUrl</label>
                                    <p:inputTextarea id="linkUrl" value="#{reminderRuleController.selected.wechatParam.linkUrl}" style="width: 95%;"/>
                                </h:panelGroup>-->
                            </p:panelGrid>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{(reminderRuleController.apm and reminderRuleController.selected.universal eq true) or !reminderRuleController.apm}">
                            <label class="label">#{msg.isEnabled}<span style="color:red">*</span></label>
                            <p:selectOneRadio id="valueState" value="#{reminderRuleController.state}" style="width: 15%;" >
                                <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="1"/>
                                <f:selectItem itemLabel="#{msg.False2No}" itemValue="0"/>
                            </p:selectOneRadio>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:panelGroup>
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{reminderRuleController.save('setting')}" update=":reminderRuleSettingDlg,:reminderRuleListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'reminderRuleSettingDialog');" />
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" update=":reminderRuleSettingDlg,:reminderRuleListForm:datalist" icon="ui-icon-cancel" onclick="PF('reminderRuleSettingDialog').hide()"/>
            </h:form>
        </p:dialog>
    </ui:composition>

</html>
