<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="reminderRuleSettingDlg" widgetVar="reminderRuleSettingDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.ReminderConfiguration}" >
            <h:form id="reminderRuleSettingForm">
                <h:panelGroup>
                    <p:panelGrid style="height: 350px; width: 450px; overflow: auto;" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup rendered="#{reminderRuleController.selected.ruleParam.noticeType eq msg.noticeTypeRole}">
                            <label class="label">#{msg.AssignRole}<span style="color:red">*</span></label>
                            <p:selectOneMenu value="#{reminderRuleController.selected.ruleParam.noticeUser}" required="true">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}#{fieldMsg.fieldValue('noticeType', 'noticeTypeRole')}" itemValue="" noSelectionOption="true" />
                                <f:selectItems value="#{reminderRuleController.getRoleList()}" var="roleItem" itemLabel="#{roleItem.roleDesc}" itemValue="#{roleItem.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{reminderRuleController.selected.ruleParam.noticeType eq msg.noticeTypeUser}">
                            <label class="label">#{msg.noticeSetting}<span style="color:red">*</span></label>
                            <p:selectOneMenu value="#{reminderRuleController.selected.ruleParam.noticeUser}" required="true">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}#{fieldMsg.fieldValue('noticeType', 'noticeTypeUser')}" itemValue="" noSelectionOption="true" />
                                <f:selectItems value="#{reminderRuleController.getUserList()}" var="userItem" itemLabel="#{userItem.name}" itemValue="#{userItem.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{reminderRuleController.selected.ruleParam.pushType eq 1}">
                            <label class="label">#{msg.pushSetting}</label>
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">提前天数<span style="color:red">*</span></label>
                                    <p:inputNumber id="pushDateValue" value="#{reminderRuleController.selected.ruleParam.pushDateValue}" required="true" maxValue="365" minValue="1" decimalPlaces="0"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{reminderRuleController.selected.ruleParam.pushType eq 2}">
                            <label class="label">#{msg.pushSetting}</label>
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">#{msg.pushCycle}<span style="color:red">*</span></label>
                                    <p:inputNumber id="pushCycle" value="#{reminderRuleController.selected.ruleParam.pushCycle}" required="true" maxValue="365" minValue="1" decimalPlaces="0"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.pushNum}<span style="color:red">*</span></label>
                                    <p:inputNumber id="pushNum" value="#{reminderRuleController.selected.ruleParam.pushNum}" required="true" maxValue="365" minValue="1" decimalPlaces="0"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </h:panelGroup>
                        <h:panelGroup rendered="false">
<!--                        <h:panelGroup rendered="#{reminderRuleController.selected.reminderType eq msg.wechat}">-->
                            <label class="label">#{msg.wechatTemplateSetting}</label>
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">templateId<span style="color:red">*</span></label>
                                    <p:inputText id="templateId" value="#{reminderRuleController.selected.wechatParam.templateId}" required="true" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">first<span style="color:red">*</span></label>
                                    <p:inputText id="first" value="#{reminderRuleController.selected.wechatParam.first}" required="true" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">keyword1</label>
                                    <p:inputTextarea id="keyword1" value="#{reminderRuleController.selected.wechatParam.keyword1}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">keyword2</label>
                                    <p:inputTextarea id="keyword2" value="#{reminderRuleController.selected.wechatParam.keyword2}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">keyword3</label>
                                    <p:inputTextarea id="keyword3" value="#{reminderRuleController.selected.wechatParam.keyword3}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">keyword4</label>
                                    <p:inputTextarea id="keyword4" value="#{reminderRuleController.selected.wechatParam.keyword4}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">keyword5</label>
                                    <p:inputTextarea id="keyword5" value="#{reminderRuleController.selected.wechatParam.keyword5}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">remark</label>
                                    <p:inputTextarea id="remark" value="#{reminderRuleController.selected.wechatParam.remark}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">linkUrl</label>
                                    <p:inputTextarea id="linkUrl" value="#{reminderRuleController.selected.wechatParam.linkUrl}" style="width: 95%;"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.isEnabled}<span style="color:red">*</span></label>
                            <p:selectOneRadio id="valueState" value="#{reminderRuleController.selected.state}" required="true" style="width: 15%;">
                                <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="1"/>
                                <f:selectItem itemLabel="#{msg.False2No}" itemValue="0"/>
                            </p:selectOneRadio>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:panelGroup>
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{reminderRuleController.save}" update=":reminderRuleSettingDlg,:reminderRuleListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'reminderRuleSettingDialog');" />
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('reminderRuleSettingDialog').hide()"/>
            </h:form>
        </p:dialog>
    </ui:composition>

</html>
