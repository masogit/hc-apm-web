<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="reminderRuleCreateDlg" widgetVar="reminderRuleCreateDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.ReminderConfiguration}" max-height="600" width="520">
            <h:form id="reminderRuleCreateForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.reminderRule}<span style="color:red">*</span></label>
                        <p:selectOneMenu value="#{reminderRuleController.selected.parentUid}" required="true" disabled="#{reminderRuleController.selected.id != null}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{reminderRuleController.apmRuleList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{reminderRuleController.save('base')}" update=":reminderRuleCreateDlg,:reminderRuleListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'reminderRuleCreateDialog');" />
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('reminderRuleCreateDialog').hide()"/>
            </h:form>
        </p:dialog>
    </ui:composition>

</html>
