<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:p="http://primefaces.org/ui"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:ui="http://java.sun.com/jsf/facelets"
				template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="#{msg.reminderEvent}"/>
			</div>
			<div class="ui-g-12 card">
				<h:form id="reminderRuleListForm">
					<p:dataTable id="datalist" value="#{reminderEventController.lazyModel}" var="item" widgetVar="varDataList"
								 selectionMode="single" selection="#{reminderEventController.selected}"
								 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
								 sortMode="single" sortBy="#{item.id}" sortOrder="descending"
								 paginatorTemplate="{CurrentPageReport}  {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {JumpToPageDropdown} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
								 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
								 emptyMessage="#{msg.noRecordFound}" rows="20"
								 rowsPerPageTemplate="20,50,100,500">

						<p:ajax event="rowSelect" update="deleteButton"/>
						<p:ajax event="filter" listener="#{reminderEventController.onFilter}"/>
						<p:column headerText="#{fieldMsg.fieldValue('noticeType', 'noticeTypeUser')}#{msg.name}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
							<h:outputText value="#{item.name}"/>
						</p:column>
						<p:column headerText="#{msg.reminderDate}" sortBy="#{item.reminderDate}" filterBy="#{item.reminderDate}" filterMatchMode="GTE">
							<f:facet name="filter">
								<p:inputText id="filterReminderDate" widgetVar="varFilterReminderDate" />
							</f:facet>
							<h:outputText value="#{item.reminderDate}">
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
							</h:outputText>
						</p:column>
						<p:column headerText="#{msg.status}" sortBy="#{item.status}" filterBy="#{item.status}" filterMatchMode="EQ">
							<h:outputText value="#{item.status eq 'waiting' ? '等待' : item.status eq 'failed' ? '失败' : '完成'}"/>
							<f:facet name="filter">
								<p:selectOneMenu onchange="PF('varDataList').filter()">
									<f:selectItem itemLabel="#{msg.All}" itemValue=""/>
									<f:selectItem itemLabel="等待" itemValue="waiting"/>
									<f:selectItem itemLabel="失败" itemValue="failed"/>
									<f:selectItem itemLabel="完成" itemValue="end"/>
								</p:selectOneMenu>
							</f:facet>
						</p:column>
						<p:column headerText="#{msg.ResultOutput}" sortBy="#{item.resData}" filterBy="#{item.resData}" filterMatchMode="LIKE">
							<h:outputText value="#{item.resData}"/>
						</p:column>
						<f:facet name="{Toolbar}">
							<p:commandButton id="deleteButton" actionListener="#{reminderEventController.delete}" icon="ui-icon-close" title="#{msg.Delete}" update="datalist" disabled="#{empty reminderEventController.selected}">
								<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert" />
							</p:commandButton>
						</f:facet>
					</p:dataTable>
				</h:form>
				<p:overlayPanel widgetVar="panelFilterReminderDate" for=":reminderRuleListForm:datalist:filterReminderDate" dismissable="false">
					<h:panelGrid columns="2">
						<p:outputLabel value="#{msg.From}"/>
						<p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_ReminderDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
						<p:outputLabel value="#{msg.To}"/>
						<p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_ReminderDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
					</h:panelGrid>
					<p:commandButton onclick="setDateFilter('varDataList','varFilterReminderDate','varStartTimeFrom_ReminderDate','varStartTimeTo_ReminderDate'); PF('panelFilterReminderDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
					<p:commandButton onclick="PF('panelFilterReminderDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
				</p:overlayPanel>
			</div>
		</div>
	</ui:define>
</ui:composition>
