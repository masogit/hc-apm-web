<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="reminderRuleEditDlg" widgetVar="reminderRuleEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.ReminderConfiguration}" max-height="600" width="520">
            <h:form id="reminderRuleEditForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.name}<span style="color:red">*</span></label>
                        <p:inputText id="name" value="#{reminderRuleController.selected.name}" required="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.Description2}</label>
                        <p:inputText id="description" value="#{reminderRuleController.selected.description}" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.reminderRule}<span style="color:red">*</span></label>
                        <p:selectOneMenu value="#{reminderRuleController.selected.type}" required="true" disabled="#{reminderRuleController.selected.id != null}">
                            <p:ajax event="change" update="noticeTypeRoleGroup multiplePush"/>
                            <p:ajax event="itemSelect" listener="#{reminderRuleController.selectedRuleType()}" update="saveButton"/>
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('reminderRule')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.reminderType}<span style="color:red">*</span></label >
                        <p:selectOneMenu value="#{reminderRuleController.selected.reminderType}" required="true">
<!--                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="" noSelectionOption="true"/>-->
                            <f:selectItems value="#{fieldMsg.getFieldValueList('reminderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup id="noticeTypeRoleGroup">
                        <h:panelGroup rendered="#{reminderRuleController.selected.type eq 'AdjustmentCenterReturn'}">
                            <label class="label">#{msg.noticeType}<span style="color:red">*</span></label >
                            <p:selectOneMenu value="#{reminderRuleController.selected.ruleParam.noticeType}" required="true">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="" noSelectionOption="true"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('noticeType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{reminderRuleController.selected.type ne 'AdjustmentCenterReturn'}">
                            <label class="label">#{msg.noticeType}<span style="color:red">*</span></label >
                            <p:selectOneMenu value="#{reminderRuleController.selected.ruleParam.noticeType}" required="true">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="" noSelectionOption="true"/>
                                <f:selectItem itemLabel="#{fieldMsg.doGetFieldValue('noticeType','noticeTypeRole')}" itemValue="noticeTypeRole" />
                                <f:selectItem itemLabel="#{fieldMsg.doGetFieldValue('noticeType','noticeTypeUser')}" itemValue="noticeTypeUser" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </h:panelGroup>
                    <h:panelGroup id="multiplePush">
                        <label class="label">#{msg.multiplePush}<span style="color:red">*</span></label>
                        <p:selectOneRadio id="valuePushType" value="#{reminderRuleController.selected.ruleParam.pushType}" required="true" style="width: 15%;" disabled="#{reminderRuleController.selected.type eq 'PmOrderToDoTask'}">
                            <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="2"/>
                            <f:selectItem itemLabel="#{msg.False2No}" itemValue="1"/>
                        </p:selectOneRadio>
                    </h:panelGroup>
<!--                    <h:panelGroup>-->
<!--                        <label class="label">是否通用<span style="color:red">*</span></label>-->
<!--                        <p:selectOneRadio id="valueuniversal" value="#{reminderRuleController.selected.universal}" required="#{reminderRuleController.apm}" style="width: 15%;">-->
<!--                            <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>-->
<!--                            <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>-->
<!--                        </p:selectOneRadio>-->
<!--                    </h:panelGroup>-->
                </p:panelGrid>
                <p:commandButton id="saveButton" validateClient="true" disabled="#{!reminderRuleController.canSave}" value="#{msg.Save}" actionListener="#{reminderRuleController.save('base')}" update=":reminderRuleEditDlg,:reminderRuleListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'reminderRuleEditDialog');" />
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('reminderRuleEditDialog').hide()"/>
            </h:form>
        </p:dialog>
    </ui:composition>

</html>
