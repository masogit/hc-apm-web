<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="configItemEditDlg" widgetVar="configItemEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.ConfigItemManage}" height="420" width="650">
            <h:form id="configItemEditForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemName}*</label>
                        <p:inputText id="configItemName" value="#{superAdminConfigItemController.selected.name}" disabled="true" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemDesc}*</label>
                        <p:inputText id="configItemDesc" value="#{superAdminConfigItemController.selected.description}" disabled="true" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemUseParent}*</label>
                        <p:selectBooleanCheckbox id="isEnabled" value="#{superAdminConfigItemController.selected.userParentConfig}" disabled="true" label="启用" style="color: rgb(170, 170, 170)" />
                    </h:panelGroup>
                    <h:panelGroup rendered="#{superAdminConfigItemController.selected.valueType eq 1}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:inputTextarea id="valueStr" value="#{superAdminConfigItemController.selected.showValue}"
                                         rows="5" cols="50" required="true" style="width: 95%;" validatorMessage="请输入正确的配置值" requiredMessage="#{msg.ConfigItemValue}#{msg.ValidationRequire}">
                            <f:validateRegex disabled="#{empty superAdminConfigItemController.selected.validation}" pattern="#{superAdminConfigItemController.selected.validation}"/>
                        </p:inputTextarea>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{superAdminConfigItemController.selected.valueType eq 2}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:inputNumber id="valueNum" value="#{superAdminConfigItemController.selected.showValue}"
                                       required="true" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{superAdminConfigItemController.selected.valueType eq 3}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:selectOneRadio id="valueBool" value="#{superAdminConfigItemController.selected.showValue}"
                                          required="true" style="width: 15%;">
                            <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                            <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                        </p:selectOneRadio>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{superAdminConfigItemController.selected.valueType eq 4}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:calendar id="valueDate" required="true" value="#{superAdminConfigItemController.selected.showValue}"
                                    pattern="yyyy-MM-dd" showOn="button" showButtonPanel="true" navigator="true"
                                    mask="true" defaultHour="23" defaultMinute="59" defaultSecond="59" style="width: 95%;"
                                    timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{superAdminConfigItemController.selected.valueType eq 5}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:calendar id="valueTime" required="true" value="#{superAdminConfigItemController.selected.showValue}"
                                    pattern="HH:mm:ss" timeOnly="true" showOn="button" showButtonPanel="true" navigator="true"
                                    mask="true" defaultHour="23" defaultMinute="59" defaultSecond="59" style="width: 95%;"
                                    timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{superAdminConfigItemController.selected.valueType eq 6}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:calendar id="valueDateTime" required="true" value="#{superAdminConfigItemController.selected.showValue}"
                                    pattern="yyyy-MM-dd HH:mm:ss" showOn="button" showButtonPanel="true" navigator="true"
                                    mask="true" defaultHour="23" defaultMinute="59" defaultSecond="59" style="width: 95%;"
                                    timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{superAdminConfigItemController.selected.valueType eq 7}">
                        <label class="label">#{msg.ConfigItemValue}</label>
                        <p:selectOneMenu value="#{superAdminConfigItemController.selected.showValue}" required="true" style="width: 95%;">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{superAdminConfigItemController.selected.enumList}" var="item" itemLabel="#{item.get('key')}" itemValue="#{item.get('value')}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{superAdminConfigItemController.saveConfig}" update=":growl @(.datalist)" icon="ui-icon-check" oncomplete="handleSubmit(args, 'configItemEditDialog');" />
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('configItemEditDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
