<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="V2_WorkflowConfigEditDlg" widgetVar="V2_WorkflowConfigEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{v2_WorkflowConfigController.CRUDActionName} #{msg.V2_WorkflowConfig}">
            <h:form id="V2_WorkflowConfigEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{v2_WorkflowConfigController.selected != null}">
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="deviceType" value="#{v2_WorkflowConfigController.selected.deviceType}"  required="true" requiredMessage="#{msg.deviceType} #{msg.ValidationRequire}"/>
                            <label>#{msg.deviceType}*</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="dispatchMode" value="#{v2_WorkflowConfigController.selected.dispatchMode}"  required="true" requiredMessage="#{msg.dispatchMode} #{msg.ValidationRequire}"/>
                            <label>#{msg.dispatchMode}*</label>
                        </h:panelGroup>
<!--                         <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="dispatchUserId" value="#{v2_WorkflowConfigController.selected.dispatchUserId}" />
                            <label>#{msg.dispatchUserId}</label>
                        </h:panelGroup> -->
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="dispatchUserName" value="#{v2_WorkflowConfigController.selected.dispatchUserName}" />
                            <label>#{msg.dispatchUserName}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="timeoutDispatch" value="#{v2_WorkflowConfigController.selected.timeoutDispatch}" />
                            <label>#{msg.timeoutDispatch}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="timeoutAccept" value="#{v2_WorkflowConfigController.selected.timeoutAccept}" />
                            <label>#{msg.timeoutAccept}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="timeoutClose" value="#{v2_WorkflowConfigController.selected.timeoutClose}" />
                            <label>#{msg.timeoutClose}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="maxMessageCount" value="#{v2_WorkflowConfigController.selected.maxMessageCount}" />
                            <label>#{msg.maxMessageCount}</label>
                        </h:panelGroup>
<!--                         <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="dispatchUserId2" value="#{v2_WorkflowConfigController.selected.dispatchUserId2}" />
                            <label>#{msg.dispatchUserId2}</label>
                        </h:panelGroup> -->
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="dispatchUserName2" value="#{v2_WorkflowConfigController.selected.dispatchUserName2}" />
                            <label>#{msg.dispatchUserName2}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:selectBooleanCheckbox id="autoAck" value="#{v2_WorkflowConfigController.selected.autoAck}"/>
                            <label>#{msg.autoAck}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="urgentTimeout" value="#{v2_WorkflowConfigController.selected.urgentTimeout}" />
                            <label>#{msg.urgentTimeout}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="urgentMaxMessageCount" value="#{v2_WorkflowConfigController.selected.urgentMaxMessageCount}" />
                            <label>#{msg.urgentMaxMessageCount}</label>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{v2_WorkflowConfigController.save}" value="#{msg.Save}" update="display,:V2_WorkflowConfigEditDlg, :V2_WorkflowConfigListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'V2_WorkflowConfigEditDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('V2_WorkflowConfigEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
