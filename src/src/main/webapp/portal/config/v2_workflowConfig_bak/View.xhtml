<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="V2_WorkflowConfigViewDlg" widgetVar="V2_WorkflowConfigViewDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{v2_WorkflowConfigController.CRUDActionName} #{msg.V2_WorkflowConfig}">
            <h:form id="V2_WorkflowConfigViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{v2_WorkflowConfigController.selected != null}">
                        <h:outputLabel value="#{msg.deviceType}" for="deviceType" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.deviceType}"/>
                        <h:outputLabel value="#{msg.dispatchMode}" for="dispatchMode" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.dispatchMode}"/>
                        <!-- <h:outputLabel value="#{msg.dispatchUserId}" for="dispatchUserId" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.dispatchUserId}"/> -->
                        <h:outputLabel value="#{msg.dispatchUserName}" for="dispatchUserName" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.dispatchUserName}"/>
                        <h:outputLabel value="#{msg.timeoutDispatch}" for="timeoutDispatch" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.timeoutDispatch}"/>
                        <h:outputLabel value="#{msg.timeoutAccept}" for="timeoutAccept" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.timeoutAccept}"/>
                        <h:outputLabel value="#{msg.timeoutClose}" for="timeoutClose" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.timeoutClose}"/>
                        <h:outputLabel value="#{msg.maxMessageCount}" for="maxMessageCount" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.maxMessageCount}"/>
                        <!-- <h:outputLabel value="#{msg.dispatchUserId2}" for="dispatchUserId2" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.dispatchUserId2}"/> -->
                        <h:outputLabel value="#{msg.dispatchUserName2}" for="dispatchUserName2" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.dispatchUserName2}"/>
                        <h:outputLabel value="#{msg.autoAck}" for="autoAck" />
                        <p:selectBooleanCheckbox id="autoAck" value="#{v2_WorkflowConfigController.selected.autoAck}" disabled="true"/>
                        <h:outputLabel value="#{msg.urgentTimeout}" for="urgentTimeout" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.urgentTimeout}"/>
                        <h:outputLabel value="#{msg.urgentMaxMessageCount}" for="urgentMaxMessageCount" />
                        <h:outputText value="#{v2_WorkflowConfigController.selected.urgentMaxMessageCount}"/>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton rendered="#{v2_WorkflowConfigController.deleteAction}" icon="ui-icon-trash" actionListener="#{v2_WorkflowConfigController.delete}" value="#{msg.Delete}" update="display,:V2_WorkflowConfigViewDlg, :V2_WorkflowConfigListForm:datalist, :growl" oncomplete="handleSubmit(args, 'V2_WorkflowConfigViewDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Close}" icon="glyphicon-off" onclick="PF('V2_WorkflowConfigViewDialog').hide()"/>
                    
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
