<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">

                <p align="center">
                    <b>#{msg.V2_WorkflowConfig}</b>
                </p>
            <h:form id="V2_WorkflowConfigListForm">
                <p:dataTable id="datalist" value="#{v2_WorkflowConfigController.lazyModel}" var="item" widgetVar="varDataList"
                    selectionMode="single" selection="#{v2_WorkflowConfigController.selected}"
                    lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                    rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                    paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                    currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                    rows="20" emptyMessage="#{msg.noRecordFound}"
                    rowsPerPageTemplate="20,50,100,500">

                    <p:ajax event="rowSelect" update="createButton editButton deleteButton"/>
                    <p:ajax event="filter" listener="#{v2_WorkflowConfigController.onFilter}" update="createButton editButton deleteButton"/>
					
                    <p:column headerText="#{msg.deviceType}" sortBy="#{item.deviceType}" filterBy="#{item.deviceType}" filterMatchMode="EQ">
                       <!--  <h:outputText value="#{v2_WorkflowConfigController.getTypeName(item.deviceType)}"/> -->
                       	<h:outputText value="#{fieldMsg.fieldValue('deviceType',item.deviceType)}"/>
                    </p:column>
                    <p:column headerText="#{msg.dispatchMode}" sortBy="#{item.dispatchMode}" filterBy="#{item.dispatchMode}" filterMatchMode="EQ">
                         <h:outputText value="#{fieldMsg.fieldValue('dispatchMode',item.dispatchMode)}"/>
                    </p:column>
                    <p:column headerText="#{msg.dispatchUserName}" sortBy="#{item.dispatchUserName}" filterBy="#{item.dispatchUserName}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.dispatchUserName}"/>
                    </p:column>
                    <p:column headerText="#{msg.timeoutDispatch}" sortBy="#{item.timeoutDispatch}" filterBy="#{item.timeoutDispatch}" filterMatchMode="EQ">
                        <h:outputText value="#{item.timeoutDispatch}"/>
                    </p:column>
                    <p:column headerText="#{msg.timeoutAccept}" sortBy="#{item.timeoutAccept}" filterBy="#{item.timeoutAccept}" filterMatchMode="EQ">
                        <h:outputText value="#{item.timeoutAccept}"/>
                    </p:column>
                    <p:column headerText="#{msg.timeoutClose}" sortBy="#{item.timeoutClose}" filterBy="#{item.timeoutClose}" filterMatchMode="EQ">
                        <h:outputText value="#{item.timeoutClose}"/>
                    </p:column>
                    <p:column headerText="#{msg.maxMessageCount}" sortBy="#{item.maxMessageCount}" filterBy="#{item.maxMessageCount}" filterMatchMode="EQ">
                        <h:outputText value="#{item.maxMessageCount}"/>
                    </p:column>
                    <p:column headerText="#{msg.dispatchUserName}2" sortBy="#{item.dispatchUserName2}" filterBy="#{item.dispatchUserName2}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.dispatchUserName2}"/>
                    </p:column>
                    <p:column headerText="#{msg.autoAck}" sortBy="#{item.autoAck}" filterBy="#{item.autoAck}" filterMatchMode="EQ">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList').filter()">
                                <f:converter converterId="javax.faces.Boolean" />
                                <f:selectItem itemLabel="#{msg.All}" itemValue="" />
                                <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true" />
                                <f:selectItem itemLabel="#{msg.False2No}" itemValue="false" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{item.autoAck? msg.True2Yes : msg.False2No }"/>
                    </p:column>
<!--                     <p:column headerText="#{msg.urgentTimeout}" sortBy="#{item.urgentTimeout}" filterBy="#{item.urgentTimeout}" filterMatchMode="EQ">
                        <h:outputText value="#{item.urgentTimeout}"/>
                    </p:column>
                    <p:column headerText="#{msg.urgentMaxMessageCount}" sortBy="#{item.urgentMaxMessageCount}" filterBy="#{item.urgentMaxMessageCount}" filterMatchMode="EQ">
                        <h:outputText value="#{item.urgentMaxMessageCount}"/>
                    </p:column> -->
                    <f:facet name="{Toolbar}">
                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray"  actionListener="#{v2_WorkflowConfigController.prepareCreate}" update=":V2_WorkflowConfigEditDlg" oncomplete="PF('V2_WorkflowConfigEditDialog').show()"/>
                       <!--  <p:commandButton id="viewButton" icon="ui-icon-search" class="btn btn-sm btn-gray"  actionListener="#{v2_WorkflowConfigController.prepareView}" update=":V2_WorkflowConfigViewDlg" oncomplete="PF('V2_WorkflowConfigViewDialog').show()" disabled="#{empty v2_WorkflowConfigController.selected}"/> -->
                        <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray"  actionListener="#{v2_WorkflowConfigController.prepareEdit}" update=":V2_WorkflowConfigEditDlg" oncomplete="PF('V2_WorkflowConfigEditDialog').show()" disabled="#{empty v2_WorkflowConfigController.selected}"/>
                        <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray"  actionListener="#{v2_WorkflowConfigController.delete}" update=":V2_WorkflowConfigViewDlg,datalist" disabled="#{empty v2_WorkflowConfigController.selected}">
                        	<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>  
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>

           <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/> 

            </div>
        </div>
        
    </ui:define>

</ui:composition>
