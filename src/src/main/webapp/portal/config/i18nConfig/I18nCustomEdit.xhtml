<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">

    <ui:composition>
        <p:dialog id="i18nCustomEditDlg" widgetVar="i18nCustomEditDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.addI18nConfig}" max-height="480" width="400">
            <h:form id="i18nCustomEditCForm">

                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.msgType}</label>
                        <p:outputLabel id="msgType" autocomplete="off" value="#{i18nTypeManageController.selectedI18n.msgType}" required="true" requiredMessage="#{msg.ConfigItemName}-#{msg.Chinese}#{msg.ValidationRequire}" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemKey}*</label>
                        <p:inputText id="msgKey" autocomplete="off" value="#{i18nTypeManageController.selectedI18n.msgKey}" required="true" disabled="#{i18nTypeManageController.selected.type eq -1 || 'Edit'.equals(i18nTypeManageController.getSelectActionName())}" requiredMessage="#{msg.ConfigItemName}-#{msg.Chinese}#{msg.ValidationRequire}" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemName}-#{msg.Chinese}*</label>
                        <p:inputText id="chinese" autocomplete="off" value="#{i18nTypeManageController.selectedI18n.valueZh}" required="true"  requiredMessage="#{msg.ConfigItemName}-#{msg.Chinese}#{msg.ValidationRequire}" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemName}-#{msg.English}</label>
                        <p:inputText id="english" autocomplete="off" value="#{i18nTypeManageController.selectedI18n.valueEn}" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemName}-#{msg.Traditional}</label>
                        <p:inputText id="traditional" autocomplete="off" value="#{i18nTypeManageController.selectedI18n.valueTw}" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">是否启用</label>
                        <p:selectOneRadio id="enabled" value="#{i18nTypeManageController.selectedI18n.enabled}" layout="lineDirection">
                            <f:selectItem itemLabel="是" itemValue="true"/>
                            <f:selectItem itemLabel="否" itemValue="false"/>
                        </p:selectOneRadio>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{i18nTypeManageController.editI18nConfig}" update=":i18nTypeForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'i18nCustomEditDlg');" />
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('i18nCustomEditDlg').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
