<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="configEditDlg" widgetVar="configEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.i18nConfig}" max-height="600" width="560">
            <h:form id="configEditForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemName}*</label>
                        <p:inputText id="configItemName" value="#{i18nConfigController.selected.valueZh}" disabled="true" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ConfigItemValue}*</label>
                        <p:dataTable id="i18nDatalist" class="datalist" value="#{i18nConfigController.i18nList}" var="item" widgetVar="i18nDataList"
                             selectionMode="single" selection="#{i18nConfigController.selectedI18n}"
                             paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                             sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                             paginatorTemplate="{Toolbar}"
                             lazy="true" rowKey="#{item.msgKey}">

                            <p:ajax event="rowSelect" update="editBtn deleteBtn" />
                            <p:ajax event="filter" listener="#{i18nConfigController.onFilter}" />

                            <p:column headerText="#{msg.ConfigItemKey}">
                                <h:outputText value="#{item.msgKey}"/>
                            </p:column>
                            <p:column headerText="#{msg.ConfigItemName}-#{msg.Chinese}">
                                <h:outputText value="#{item.valueZh}"/>
                            </p:column>
                            <p:column headerText="#{msg.ConfigItemName}-#{msg.English}">
                                <h:outputText value="#{item.valueEn}"/>
                            </p:column>
                            <p:column headerText="#{msg.ConfigItemName}-#{msg.Traditional}">
                                <h:outputText value="#{item.valueTw}"/>
                            </p:column>
                            <f:facet name="{Toolbar}">
                                <p:commandButton id="addButton" icon="ui-icon-plus" actionListener="#{i18nConfigController.prepareAddI18n}" class="btn btn-sm btn-gray" title="#{msg.Create}" update=":addCustomI18nDlg" oncomplete="PF('addCustomI18nDialog').show()"/>
                                <p:commandButton id="editBtn" icon="ui-icon-pencil" actionListener="#{i18nConfigController.prepareEditI18n}" class="btn btn-sm btn-gray" title="#{msg.Edit}" update=":addCustomI18nDlg" oncomplete="PF('addCustomI18nDialog').show()" disabled="#{empty i18nConfigController.selectedI18n}" />
                                <p:commandButton id="deleteBtn" icon="ui-icon-close" actionListener="#{i18nConfigController.deleteI18n}" class="btn btn-sm btn-gray" title="#{msg.Delete}" update="i18nDatalist" disabled="#{empty i18nConfigController.selectedI18n}">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                </p:commandButton>
                            </f:facet>
                        </p:dataTable>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{i18nConfigController.saveConfig}" update=":growl @(.datalist)" icon="ui-icon-check" oncomplete="handleSubmit(args, 'configEditDialog');" />
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('configEditDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
