<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            .ui-selectmanycheckbox td{
                width: 80px !important;
            }
            .ui-state-highlight{
                background-color: #5180ce !important;
                color: #ffffff;
            }
            .ui-datatable-tablewrapper{
                /*max-height: 400px !important;*/
                overflow-y: auto;
            }
            .ui-inputnumber input{
                width: 95%;
            }
            .disabled {
                color: #9a9a9a !important;
            }
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.i18nConfig}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="configItemForm">
                    <h:panelGrid id="buttonSet" columns="12" cellpadding="5" rendered="#{userContextService.hasRole('SuperAdmin')}">
                        <h:panelGroup>
                            <p:commandButton id="btnOrg" value="#{i18nTypeManageController.selectTenant.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                            <p:overlayPanel widgetVar="varPanelSite" for="btnOrg" hideEffect="fade" dynamic="false" modal="false" appendTo="@form">
                                <p:selectOneListbox value="#{i18nTypeManageController.selectTenantId}" scrollHeight="500" style="border: none;" filter="true" filterMatchMode="contains">
                                    <p:ajax process="@this" event="click" listener="#{i18nTypeManageController.changeSelectTenant}" update="configItemForm" oncomplete="PF('varPanelSite').hide();"/>
                                    <f:selectItems value="#{tenantInfoController.itemList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                                </p:selectOneListbox>
                            </p:overlayPanel>
                        </h:panelGroup>
                    </h:panelGrid>
                    <p:dataTable id="datalist" class="datalist" value="#{i18nTypeManageController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{i18nTypeManageController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="editButton" />
                        <p:ajax event="filter" listener="#{i18nTypeManageController.onFilter}" />

                        <p:column headerText="#{msg.ConfigItemName}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.msgType}" filterBy="#{item.msg_type}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.msgType}"/>
                        </p:column>
                        <p:column headerText="是否可以新增"  filterBy="#{item.type}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()">
                                    <f:converter converterId="javax.faces.Integer" />
                                    <f:selectItem itemLabel="#{msg.All}" itemValue="" />
                                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="1" />
                                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="-1" />
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{empty item.type?'否':item.type == -1?'否':'是'}"/>
                        </p:column>
                        <p:column headerText="是否管理员编辑" filterable="#{userContextService.hasRole('SuperAdmin')}" filterBy="#{item.admin_edit}" filterMatchMode="EQ" >
                                <f:facet name="filter">
                                    <p:selectOneMenu onchange="PF('varDataList').filter()">
                                        <f:converter converterId="javax.faces.Boolean" />
                                        <f:selectItem itemLabel="#{msg.All}" itemValue="" />
                                        <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true" />
                                        <f:selectItem itemLabel="#{msg.False2No}" itemValue="false" />
                                    </p:selectOneMenu>
                                </f:facet>
                            <h:outputText value="#{empty item.adminEdit or !item.adminEdit?'否':'是'}"/>
                        </p:column>
                        <p:column headerText="#{msg.description}">
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="editButton" icon="ui-icon-pencil" actionListener="#{i18nTypeManageController.prepareEdit}" class="btn btn-sm btn-gray" title="#{msg.Edit}" update=":i18nTypeDlg :i18nTypeForm :i18nTypeForm:i18nDatalist" oncomplete="PF('i18nTypeDlg').show()" disabled="#{empty i18nTypeManageController.selected}" />
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
        <ui:include src="I18nTypeEdit.xhtml"/>
        <ui:include src="I18nCustomEdit.xhtml"/>
    </ui:define>
</ui:composition>
