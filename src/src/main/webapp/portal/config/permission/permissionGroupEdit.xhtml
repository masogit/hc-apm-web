<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="permissionGroupEditDlg" widgetVar="permissionGroupEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.PermissionGroup}" max-height="600" width="520">
            <h:form id="permissionGroupEditForm">
                <h:panelGroup>
                    <p:tabView class="ui-g-12" id="tabview" style="height: 362px; overflow: auto;" dynamic="false" cache="false">
                        <p:tab title="#{msg.PermissionGroupSetting}" class="ui-g-12" >
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">#{msg.name}<span style="color:red">*</span></label>
                                    <p:inputText id="name" value="#{permissionGroupController.selected.name}" style="width: 95%;" required="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.Description}</label>
                                    <p:inputText id="description" value="#{permissionGroupController.selected.description}" style="width: 95%;"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="#{msg.AccessPermission}" class="ui-g-12">
                            <p:scrollPanel style="height: 300px; border: 0;" mode="native">
                                <p:tree id="orgTree" class="tree" style="border:0;height:362px" value="#{permissionGroupController.accessOrgTree}" selection="#{permissionGroupController.selectedAccessOrgNodes}" var="node"  dynamic="false"  cache="false" selectionMode="checkbox" highlight="true" required="true" requiredMessage="#{msg.AccessPermission} #{msg.Required}">
                                    <p:ajax event="select" listener="#{permissionGroupController.onSelectAccessTreeNode}" />
                                    <p:ajax event="unselect" listener="#{permissionGroupController.onUnselectAccessTreeNode}" />
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node.shortName}"/>
                                    </p:treeNode>
                                    <p:treeNode type="hidden" rendered="false"/>
                                </p:tree>
                            </p:scrollPanel>
                        </p:tab>
                    </p:tabView>
                </h:panelGroup>
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{permissionGroupController.save}" update=":permissionGroupEditDlg,:PermissionGroupListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'permissionGroupEditDialog');" />
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('permissionGroupEditDialog').hide()"/>
            </h:form>
        </p:dialog>
    </ui:composition>

</html>
