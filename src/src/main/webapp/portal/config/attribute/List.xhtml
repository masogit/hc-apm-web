<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.AttributeConfiguration}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="attributeListForm">
                    <p:dataTable id="datalist" value="#{attributeListController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{attributeListController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.name}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.JumpTo} {JumpToPageDropdown} #{msg.Page} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500" >

                        <p:ajax event="rowSelect" update="createButton editButton deleteButton" />
                        <p:ajax event="filter" listener="#{attributeListController.onFilter}" update=":attributeListForm:datalist"/>

                        <p:column headerText="#{msg.AttributeName}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>

                        <p:column headerText="#{msg.AttributeDescription}" sortBy="#{item.description}">
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <p:column headerText="#{msg.ModifiedBy}" sortBy="#{item.lastModifiedBy}">
                            <h:outputText value="#{attributeListController.findUserNameByAccountUid(item.lastModifiedBy)}"/>
                        </p:column>

                        <p:column headerText="#{msg.ModifiedOn}">
                            <h:outputText value="#{item.lastModifiedDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="#{msg.ModifiedOn}">
                            <p:commandButton value="#{msg.EditSubattribute}" actionListener="#{attributeListController.editAttrDesc(item)}" oncomplete="openSwapTypeViewWindow(xhr, status, args)" />
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" title="#{msg.Create}" actionListener="#{attributeListController.prepareCreate}" process="@this" update=":AttributeEditDlg" oncomplete="PF('AttributeEditDialog').show()" />
                            <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{attributeListController.prepareEdit}" update=":AttributeEditDlg" process="@this" oncomplete="PF('AttributeEditDialog').show()" disabled="#{empty attributeListController.selected}" />
			                <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{attributeListController.deleteSelectedAttribute}" update=":attributeListForm:datalist" disabled="#{empty attributeListController.selected}">
			                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert" />
			                </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="Edit.xhtml" />
            </div>
        </div>
        <script>
            afterPageLoad = function () {
                $("#searchForm\\:searchText").keypress(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                    }
                });
            }

            function openSwapTypeViewWindow(xhr, status, args) {
                var pageName = args.pageName;
                this.location.href = args.url;

            }
        </script>
    </ui:define>
</ui:composition>
