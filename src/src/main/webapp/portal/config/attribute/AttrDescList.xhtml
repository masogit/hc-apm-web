<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card">
            <h:form id="attrDescListForm">
                <p:fieldset legend="#{attrDescListController.selectedAttribute.name}属性列表">
                    <p:dataTable id="attrDescList" value="#{attrDescListController.lazyModel}" var="attrDesc" widgetVar="attrDescListVar"
                                 selectionMode="single" selection="#{attrDescListController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{attrDesc.id}" sortMode="single" sortOrder="descending" sortBy="#{attrDesc.name}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="10" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="5,10,20,30" >

                        <p:ajax event="rowSelect" update="createButton editButton deleteButton attrDescListForm" />
                        <p:ajax event="filter" listener="#{attributeListController.onFilter}" update="attrDescList"/>

                        <p:column headerText="属性">
                            <h:outputText value="#{attrDescListController.selectedAttribute.name}" />
                        </p:column>
                        <p:column headerText="子属性">
                            <h:outputText value="#{attrDesc.name}" sortBy="#{attrDesc.name}"  filterBy="#{attrDesc.name}" filterMatchMode="LIKE"/>
                        </p:column>
                        <p:column headerText="子属性描述">
                            <h:outputText value="#{attrDesc.description}"/>
                        </p:column>
                        <p:column headerText="是否必须">
                            <h:outputText value="必须" rendered="#{attrDesc.required}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" title="#{msg.Create}" actionListener="#{attrDescListController.prepareCreate}" process="@this" update=":AttrDescEditDlg" oncomplete="PF('AttrDescEditDialog').show()" />
                            <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{attrDescListController.prepareEdit}" update=":AttrDescEditDlg" process="@this" oncomplete="PF('AttrDescEditDialog').show()" disabled="#{empty attrDescListController.selected}" />
                            <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{attrDescListController.deleteSelectedAttrDesc}" update=":attrDescListForm:attrDescList" disabled="#{empty attrDescListController.selected}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert" />
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>
                <h:panelGroup id="display">
                    <br/>
                    <p:commandButton value="#{msg.Return}" action="List?faces-redirect=true"  icon="ui-icon-arrow-back"/>
                </h:panelGroup>
            </h:form>

            <p:dialog id="AttrDescEditDlg" widgetVar="AttrDescEditDialog" modal="true" resizable="true" draggable="true"  appendTo="@(body)" header="#{attrDescListController.CRUDActionName}" >
                <h:form id="AttrDescEditForm">
                    <h:panelGroup id="display" rendered="#{attrDescListController.selected ne null}">

                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" style="min-width: 500px;">
                            <h:panelGroup>
                                <label class="label">属性*</label>
                                <p:inputText id="loginName" value="#{attrDescListController.selected.name}" required="true" requiredMessage="属性名称 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">描述</label>
                                <p:inputText id="name" value="#{attrDescListController.selected.description}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">必须</label>
                                <p:selectBooleanButton id="isRequired" value="#{attrDescListController.selected.required}" onLabel="是" offLabel="否"/>
                            </h:panelGroup>
                        </p:panelGrid>
                        <br/>
                        <p:commandButton validateClient="true" actionListener="#{attrDescListController.save}" value="#{msg.Save}" update=":attrDescListForm:attrDescList" icon="ui-icon-check" oncomplete="handleSubmit(args, 'AttrDescEditDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" type="button" icon="ui-icon-cancel" onclick="PF('AttrDescEditDialog').hide()"/>
                    </h:panelGroup>
                </h:form>
            </p:dialog>
        </div>

    </ui:define>

    </ui:composition>
