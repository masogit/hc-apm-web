<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="head">
    </ui:define>
    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.DeviceTypeGroup}"/>
            </div>
            <div class="ui-g-12 card ">

                <h:form id="SetOwner">
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        
                        <h:panelGroup >
                       		<label class="label">#{msg.deviceType}*</label>
                               <p:selectOneMenu id="deviceType" value="#{v2_DeviceTypeGroupController.deviceTypeId}" 
                             	required="true" requiredMessage="#{msg.deviceType}#{msg.ValidationRequire}" >
                             		<p:ajax  listener="#{v2_DeviceTypeGroupController.getQueryAssetsList()}" update="AssetsPickList" />
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                   <f:selectItems value="#{fieldMsg.getFieldValueList('deviceType')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                   <!-- <f:selectItems value="#{v2_DeviceTypeGroupController.deviceTypeList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/> -->
                                   
                               </p:selectOneMenu>
                        </h:panelGroup>
                        </p:panelGrid>

                    </p:fieldset>
                    <p:fieldset legend="#{msg.ChoosingAssets}">
                        <p:pickList id="AssetsPickList" value="#{v2_DeviceTypeGroupController.availableAssets}" var="item"   
                                    itemValue="#{item}"  showCheckbox="false" responsive="true"
                                    showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="string2IntegerConverter" >
                            <f:facet name="sourceCaption">#{msg.AvailableAssets}</f:facet>
                            <f:facet name="targetCaption">#{msg.ChoseAssets}</f:facet>
                            <p:ajax event="transfer" listener="#{v2_DeviceTypeGroupController.onAssetsTransfer}" />
                            <p:column style="width:40%">
                                <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item)}"/>
                            </p:column>
                        </p:pickList>
						 <h:panelGroup >
                            <p:commandButton value="#{msg.Save}" icon="ui-icon-check" actionListener="#{v2_DeviceTypeGroupController.saveChange()}" validateClient="true" update=":growl AssetsPickList" style="float:left"/>
                        </h:panelGroup>
                    </p:fieldset>
                </h:form>
            </div>
        </div>

    </ui:define>


</ui:composition>
