<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">
                <div class="ui-g-12 card cardTitle">
                    <p:outputLabel class="pageTitle" value="系统模板管理"/>
                </div>
                <h:form id="TemplateListForm">

                    <p:commandButton id="btnSite" rendered="#{userContextService.isSuperAdmin}" value="#{systemTemplateController.selectedTenant.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                    <p:overlayPanel widgetVar="varPanelSite" for="btnSite" hideEffect="fade" dynamic="false" modal="false" appendTo="@form">
                        <p:selectOneListbox scrollHeight="500" style="border: none;" value="#{systemTemplateController.tenantUid}">
                            <p:ajax process="@this" event="click" update=":TemplateListForm" listener="#{systemTemplateController.setTenantInfoValue(systemTemplateController.tenantUid)}" oncomplete="PF('varPanelSite').hide();"/>

                            <f:selectItems value="#{systemTemplateController.getTenantInfoList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                        </p:selectOneListbox>
                    </p:overlayPanel>

                    <p:commandButton id="btnOrg" value="#{systemTemplateController.selectedOrg==null?msg.AllHospitals:systemTemplateController.selectedOrg.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                    <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" style="width:300px" modal="false">
                        <p:scrollPanel style="height:300px;border: 0" mode="native">
                            <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{systemTemplateController.orgTree}"    var="node" selectionMode="single">
                                <p:ajax process="@this" event="select" update=":TemplateListForm" listener="#{systemTemplateController.onSelectSiteTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                <p:ajax process="@this" event="expand"/>
                                <p:ajax process="@this" event="collapse"/>

                                <p:treeNode type="org">
                                    <h:outputText value="#{node}"/>
                                </p:treeNode>
                                <p:treeNode type="hidden" rendered="false"/>
                            </p:tree>
                        </p:scrollPanel>
                    </p:overlayPanel>

<!--                                    </p:tree>-->

<!--                    </h:panelGrid>-->


                    <p:dataTable id="datalist" value="#{systemTemplateController.lazyModel}" var="item"
                                 widgetVar="datalist"
                                 selectionMode="single" selection="#{systemTemplateController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect"
                                update="editButton "/>
                        <p:ajax event="filter" listener="#{systemTemplateController.onFilter}" />
<!--                        <p:column headerText="#{msg.Institution}" sortBy="#{item.institutionUid}" filterBy="#{item.institutionUid}"-->
<!--                                  filterMatchMode="EQ">-->

                        <p:column headerText="业务类型" sortBy="#{item.businessType}" filterBy="#{item.businessType}"
                                  filterMatchMode="EQ">

                            <f:facet name="filter">
                                <p:selectOneMenu  onchange="PF('datalist').filter()"   value="#{systemTemplateController.businessType}" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{systemTemplateController.getBusinessTypes()}" var="item" itemLabel="#{item.name}" itemValue="#{item.code}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{systemTemplateController.getBusinessName(item.businessType)}"/>
                        </p:column>
                        <p:column headerText="模板类型" sortBy="#{item.templateType}" filterBy="#{item.templateType}"
                                  filterMatchMode="EQ">
                            <h:outputText value="#{systemTemplateController.getTemplateName(item.templateType)}"/>
                        </p:column>

                        <p:column headerText="文件类型" sortBy="#{item.fileType}" filterBy="#{item.fileType}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.fileType}"/>
                        </p:column>


                        <p:column headerText="#{msg.TemplateFile}" sortBy="#{item.fileName}" filterBy="#{item.fileName}"
                                  filterMatchMode="EQ">
                            <p:commandLink value="#{item.fileName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(item.storageId)}" styleClass="p-mr-2"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray"
                                             actionListener="#{systemTemplateController.prepareEdit()}"
                                             update=":TemplateEditDlg"
                                             oncomplete="PF('TemplateEditDialog').show()"
                                             disabled="#{empty systemTemplateController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </h:form>

                <ui:include src="Edit.xhtml"/>
            </div>
        </div>

    </ui:define>
