<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <script type="text/javascript">
        function deleteAfter() {
            var failureType=document.getElementById("tabview:orgEditForm:failureType");
            if(failureType != null  ){
                let vl = failureType.value;
                if(vl == null || vl==""){
                    return ;
                }else{
                    PF('failureModal').show();
                }
            }
        }
    </script>
            <div class="ui-g-12">

                <h:form id="orgEditForm">

                    <div class="ui-g-12 ui-lg-4">
                        <div class="card" style="height:400px;">
                            <h:panelGroup rendered="true">
                                <p:inputText id="retrieval" value="#{buildManagementController.retrieval}">
                                    <!--<p:ajax listener="#{buildManagementController.filterNode()}" event="keyup" update="orgTree editPanel :growl"/>-->
                                </p:inputText>
                                <p:commandButton id = "portalMgrSearch" icon="ui-icon-location-searching" actionListener="#{buildManagementController.filterNode()}" update="orgTree editPanel :growl"/>
                                <p:commandButton id = "portalMgrExport" title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" actionListener="#{buildManagementController.exportExcel}" update=":growl"
                                                 onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false" >
                                    <p:fileDownload value="#{buildManagementController.excelFile}" />
                                </p:commandButton>
                            </h:panelGroup>
                            <p:scrollPanel style="height:98%;border: 0" mode="native">
                                <p:tree id="orgTree"  class="tree" style="width:98%;border:0;" value="#{buildManagementController.orgTree}" var="node" selectionMode="single" selection="#{buildManagementController.selectedNode}" highlight="true">
                                    <p:ajax process="@this" event="select" listener="#{buildManagementController.onSelectTreeNode}" update="@form:editPanel"/>

                                    <p:treeNode type="org">
                                        <h:outputText value="#{node.shortName}"/>
                                    </p:treeNode>
                                    <p:treeNode type="hidden" rendered="false"/>
                                </p:tree>
                            </p:scrollPanel>
                        </div>
                    </div>

                    <div class="ui-g-12 ui-lg-8">
                        <div class="card" style="height:400px;">
                            <h:panelGroup id="editPanel">
                                <h:panelGrid columns="8">
                                    <p:commandButton id="createBuild" process="@this" icon="ui-icon-plus" value="#{msg.Create} 楼栋" actionListener="#{buildManagementController.prepareCreate(4)}" update="@form:editPanel"/>
                                    <p:commandButton id="createFloor" process="@this" icon="ui-icon-plus" value="#{msg.Create} 楼层" actionListener="#{buildManagementController.prepareCreate(5)}" update="@form:editPanel"/>
                                    <p:commandButton id="createRoom" process="@this" icon="ui-icon-plus" value="#{msg.Create} 房间" actionListener="#{buildManagementController.prepareCreate(6)}" update="@form:editPanel"/>
                                    <p:commandButton id="deleteButton"  process="@this" icon="ui-icon-close" value="#{msg.Delete}" actionListener="#{buildManagementController.deleteSelectedBuild}" update="@form">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </h:panelGrid>

                                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 70%" rendered="#{buildManagementController.selectBuild ne null}">
                                    <h:panelGroup>
                                        <label class="label">上一级</label>
                                        <p:outputLabel value="#{buildManagementController.selectBuild.parentBuild}" rendered="#{buildManagementController.selectBuild.parentBuild ne null}"/>
                                        <p:outputLabel value="#{buildManagementController.selectSite}" rendered="#{buildManagementController.selectBuild.parentBuild eq null}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">#{msg.type}</label>
                                        <p:outputLabel value="#{buildManagementController.selectBuild.typeName}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">#{msg.ConfigItemName}*</label>
                                        <p:inputText id="bname" value="#{buildManagementController.selectBuild.name}"  required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <label class="label">#{msg.nameEn}</label>
                                        <p:inputText id="bnameEn" value="#{buildManagementController.selectBuild.nameEn}"/>
                                    </h:panelGroup>
                                    <p:commandButton style="width: 90px;" validateClient="true" icon="ui-icon-check" actionListener="#{buildManagementController.saveSelectedOrg}" value="#{msg.Save}" update="orgTree editPanel :growl"/>
                                </p:panelGrid>
                            </h:panelGroup>
                        </div>
                    </div>
                    <p:dialog id="Active" widgetVar="failureModal" width="350" height="100" modal="true" resizable="true" draggable="true" header="删除确认" closable="true">
                        <c:choose>
                            <c:when test="#{buildManagementController.failureType == 1}">
                                <p class="p-m-0" >该组织下有二维码存在,是否要先删除二维码?</p>
                            </c:when>
                            <c:when test="#{buildManagementController.failureType == 2}">
                                <p class="p-m-0" >该组织下有用户权限关联,是否要先解除关联?</p>
                            </c:when>
                            <c:otherwise>
                                <p class="p-m-0" >出错了！</p>
                            </c:otherwise>
                        </c:choose>
                        <h:panelGrid columns="3">
                            <p:commandButton process="@this" icon="ui-icon-close" value="#{buildManagementController.failureType == 1?'删除':'解除'}" actionListener="#{buildManagementController.deleteFailureCode}" update="@form" oncomplete="PF('failureModal').hide()" />
                            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('failureModal').hide()"/>
                        </h:panelGrid>
                    </p:dialog>
                </h:form>
            </div>

</ui:composition>
