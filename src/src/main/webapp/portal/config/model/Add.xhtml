<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="InferenceModelAddDlg" widgetVar="InferenceModelAddDlg"
              width="800" height="550" modal="true"
              resizable="true" draggable="true" appendTo="@(body)"
              header="上传新推理模型">
        <h:form id="AddInferenceModelForm">
            <h:panelGroup id="display">
                <p:fieldset id="basic">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">


                        <h:panelGroup>
                            <label class="label">模型类型*</label>
                            <p:selectOneMenu value="#{inferenceModelController.editingModel.type}" required="true" style="width:100%">
                                <f:selectItem itemLabel="请选择模型类型" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{inferenceModelController.modelTypeOptions}" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <br/>
                        <h:panelGroup>
                            <label class="label">版本</label>
                            <p:inputText value="#{inferenceModelController.editingModel.version}" style="width:100%"/>
                        </h:panelGroup>
                        <br/>
                        <h:panelGroup>
                            <label class="label">描述</label>
                            <p:inputTextarea value="#{inferenceModelController.editingModel.description}" rows="3" style="width:100%"/>
                        </h:panelGroup>
<!--                        <br/>-->
<!--                        <h:panelGroup>-->
<!--                            <label class="label">开启状态</label>-->
<!--                            <p:selectBooleanCheckbox value="#{inferenceModelController.editingModel.enabled}"/>-->
<!--                            <h:outputText value=" 启用"/>-->
<!--                        </h:panelGroup>-->
                        <br/>
                        <h:panelGroup id="addFileName">
                            <label class="label">文件名称</label>
                            <h:outputText value="#{inferenceModelController.file.fileName}" rendered="#{not empty inferenceModelController.file}"/>
                        </h:panelGroup>

                        <br/>
                        <h:panelGroup>
                            <label class="label">上传模型文件*</label>
                            <p:fileUpload fileUploadListener="#{inferenceModelController.uploadModelFile}"
                                          value="#{inferenceModelController.file}" mode="advanced"
                                          dragDropSupport="true" style="width:100%" process="@this"
                                          multiple="false" sizeLimit="500000000"
                                          update=":AddInferenceModelForm:addFileName"
                                          auto="true" invalidSizeMessage="文件大小不能超过500MB"
                                          label="上传"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="true"
                                 actionListener="#{inferenceModelController.saveNewModel()}" value="#{msg.Save}"
                                 update="display,:InferenceModelAddDlg,:InferenceModelListForm:datalist,:growl"
                                 icon="ui-icon-check" oncomplete="handleSubmit(args, 'InferenceModelAddDlg');"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('InferenceModelAddDlg').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
