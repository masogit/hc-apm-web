<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="V2_WorkflowConfigViewDlg" widgetVar="V2_WorkflowConfigViewDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{workflowConfigController.CRUDActionName} #{msg.V2_WorkflowConfig}">
            <h:form id="V2_WorkflowConfigViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{workflowConfigController.selected != null}">
                        <h:outputLabel value="#{msg.id}" for="id" />
                        <h:outputText value="#{workflowConfigController.selected.id}"/>
                        <h:outputLabel value="#{msg.dispatchMode}" for="dispatchMode" />
                        <h:outputText value="#{workflowConfigController.selected.dispatchMode}"/>
                        <h:outputLabel value="#{msg.dispatchUserId}" for="dispatchUserId" />
                        <h:outputText value="#{workflowConfigController.selected.dispatchUserId}"/>
                        <h:outputLabel value="#{msg.dispatchUserName}" for="dispatchUserName" />
                        <h:outputText value="#{workflowConfigController.selected.dispatchUserName}"/>
                        <h:outputLabel value="#{msg.timeoutDispatch}" for="timeoutDispatch" />
                        <h:outputText value="#{workflowConfigController.selected.timeoutDispatch}"/>
                        <h:outputLabel value="#{msg.timeoutAccept}" for="timeoutAccept" />
                        <h:outputText value="#{workflowConfigController.selected.timeoutAccept}"/>
                        <h:outputLabel value="#{msg.timeoutClose}" for="timeoutClose" />
                        <h:outputText value="#{workflowConfigController.selected.timeoutClose}"/>
                        <h:outputLabel value="#{msg.maxMessageCount}" for="maxMessageCount" />
                        <h:outputText value="#{workflowConfigController.selected.maxMessageCount}"/>
                        <h:outputLabel value="#{msg.dispatchUserId2}" for="dispatchUserId2" />
                        <h:outputText value="#{workflowConfigController.selected.dispatchUserId2}"/>
                        <h:outputLabel value="#{msg.dispatchUserName2}" for="dispatchUserName2" />
                        <h:outputText value="#{workflowConfigController.selected.dispatchUserName2}"/>
                        <h:outputLabel value="#{msg.autoAck}" for="autoAck" />
                        <p:selectBooleanCheckbox id="autoAck" value="#{workflowConfigController.selected.autoAck}" disabled="true"/>
                        <h:outputLabel value="#{msg.tenantUID}" for="tenantUID" />
                        <h:outputText value="#{workflowConfigController.selected.tenantUID}"/>
                        <h:outputLabel value="#{msg.institutionUID}" for="institutionUID" />
                        <h:outputText value="#{workflowConfigController.selected.institutionUID}"/>
                        <h:outputLabel value="#{msg.hospitalUID}" for="hospitalUID" />
                        <h:outputText value="#{workflowConfigController.selected.hospitalUID}"/>
                        <h:outputLabel value="#{msg.siteUID}" for="siteUID" />
                        <h:outputText value="#{workflowConfigController.selected.siteUID}"/>
                        <h:outputLabel value="#{msg.levelInstitutionId}" for="levelInstitutionId" />
                        <h:outputText value="#{workflowConfigController.selected.levelInstitutionId}"/>
                        <h:outputLabel value="#{msg.levelHospitalId}" for="levelHospitalId" />
                        <h:outputText value="#{workflowConfigController.selected.levelHospitalId}"/>
                        <h:outputLabel value="#{msg.levelSiteId}" for="levelSiteId" />
                        <h:outputText value="#{workflowConfigController.selected.levelSiteId}"/>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton rendered="#{workflowConfigController.deleteAction}" icon="ui-icon-trash" actionListener="#{workflowConfigController.delete}" value="#{msg.Delete}" update="display,:V2_WorkflowConfigViewDlg, :V2_WorkflowConfigListForm:datalist, :growl" oncomplete="handleSubmit(args, 'V2_WorkflowConfigViewDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Close}" icon="glyphicon-off" onclick="PF('V2_WorkflowConfigViewDialog').hide()"/>
                    
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
