<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.V2_WorkflowConfig}"/>
            </div>

            <div class="ui-g-12 card">
                <p:growl autoUpdate="true" life="3000"/>
                <h:form id="v2_WorkflowConfigEditForm">
                	<h:panelGroup id="display">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{v2_WorkflowConfigController.selected != null}">
                        <h:panelGroup >
                                <label class="label">#{msg.deviceType}*</label>
                                <p:selectOneMenu id="deviceType" value="#{v2_WorkflowConfigController.selected.deviceType}" 
                              	required="true" requiredMessage="#{msg.deviceType}#{msg.ValidationRequire}" >
                                   <!--  <p:ajax  listener="#{assetOwnerSettingController.getQueryAssetsList()}" update="AssetsPickList" /> -->
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{v2_WorkflowConfigController.deviceTypeList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        <h:panelGroup>
                            <label class = "label">#{msg.dispatchMode}*</label>
                            <p:selectOneMenu value="#{v2_WorkflowConfigController.selected.dispatchMode}" disabled="false"
                           		required="true" requiredMessage="#{msg.dispatchMode}#{msg.ValidationRequire}" >
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('dispatchMode')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                             </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.dispatchUserName}*</label>
                            <p:selectOneMenu id="dispatchUserId" value="#{v2_WorkflowConfigController.selected.dispatchUserId}" 
                            		 required="false" requiredMessage="#{msg.dispatchUserName} #{msg.ValidationRequire}" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{v2_WorkflowConfigController.userList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.dispatchUserName}2*</label>
                            <p:selectOneMenu id="dispatchUserId2" value="#{v2_WorkflowConfigController.selected.dispatchUserId2}" 
                            		 required="false" requiredMessage="#{msg.dispatchUserName}2 #{msg.ValidationRequire}" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{v2_WorkflowConfigController.userList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class = "label">工单完工不需要验收?*</label>
                            <p:selectBooleanCheckbox value="#{v2_WorkflowConfigController.selected.autoAck}"/>
                        </h:panelGroup >
                        <p:spacer/>
                        <h:panelGroup>
                            <label class="label">#{msg.timeoutDispatch}*</label>
                            <p:inputText id="timeoutDispatch" value="#{v2_WorkflowConfigController.selected.timeoutDispatch}" 
                            	 required="true" requiredMessage="#{msg.timeoutDispatch}#{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.timeoutAccept}*</label>
                            <p:inputText id="timeoutAccept" value="#{v2_WorkflowConfigController.selected.timeoutAccept}" 
                            required="true" requiredMessage="#{msg.timeoutAccept}#{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.timeoutClose}*</label>
                            <p:inputText id="timeoutClose" value="#{v2_WorkflowConfigController.selected.timeoutClose}" 
                            required="true" requiredMessage="#{msg.timeoutClose}#{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.maxMessageCount}*</label>
                            <p:inputText id="maxMessageCount" value="#{v2_WorkflowConfigController.selected.maxMessageCount}" 
                            required="true" requiredMessage="#{msg.maxMessageCount}#{msg.ValidationRequire}"/>
                        </h:panelGroup>
                         <h:panelGroup>
                            <label class="label">#{msg.urgentTimeout}*</label>
                            <p:inputText id="urgentTimeout" value="#{v2_WorkflowConfigController.selected.urgentTimeout}" 
                            required="true" requiredMessage="#{msg.urgentTimeout}#{msg.ValidationRequire}"/>
                        </h:panelGroup>
                         <h:panelGroup>
                            <label class="label">#{msg.urgentMaxMessageCount}*</label>
                            <p:inputText id="urgentMaxMessageCount" value="#{v2_WorkflowConfigController.selected.urgentMaxMessageCount}" 
                            required="true" requiredMessage="#{msg.urgentMaxMessageCount}#{msg.ValidationRequire} "/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{v2_WorkflowConfigController.save}" value="#{msg.Save}" icon="ui-icon-check" rendered="#{v2_WorkflowConfigController.selected != null}" update=":growl"/>
                </h:panelGroup>
            </h:form>

            </div>
        </div>
    </ui:define>

</ui:composition>
