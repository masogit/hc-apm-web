<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">
				<div class="ui-g-12 card cardTitle">
                	<p:outputLabel class="pageTitle" value="#{msg.SystemConfig}"/>
            	</div>
            <h:form id="V2_WorkflowConfigListForm">
                <p:dataTable id="datalist" value="#{workflowConfigController.lazyModel}" var="item" widgetVar="varDataList"
                    selectionMode="single" selection="#{workflowConfigController.selected}"
                    lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                    rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                    paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                    currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                    rows="20" emptyMessage="#{msg.noRecordFound}"
                    rowsPerPageTemplate="20,50,100,500">

                    <p:ajax event="rowSelect"  listener= "#{workflowConfigController.onSelect()}" update="createButton editButton deleteButton"/>
                    <p:ajax event="filter" listener="#{workflowConfigController.onFilter}" update="createButton editButton deleteButton"/>

                    <p:column headerText="#{msg.TenantInfo}" sortBy="#{item.tenantUID}" filterBy="#{item.tenantUID}" filterMatchMode="EQ">
                        <h:outputText value="#{workflowConfigController.getTenantName(item.tenantUID)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList').filter()" autoWidth="false" style="max-width: 150px;" >
                                <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{workflowConfigController.getHospitalList('0')}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>

                     <p:column headerText="#{msg.Institution}" sortBy="#{item.institutionUID}" filterBy="#{item.institutionUID}" filterMatchMode="EQ">
                         <h:outputText value="#{workflowConfigController.getInsNameByUId(item.institutionUID)}"/>
                         <f:facet name="filter">
                             <p:selectOneMenu onchange="PF('varDataList').filter()" autoWidth="false" style="max-width: 150px;" >
                                 <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                 <f:selectItems value="#{workflowConfigController.getHospitalList('1')}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                             </p:selectOneMenu>
                         </f:facet>
                    </p:column>
                   <p:column headerText="#{msg.Hospital}" sortBy="#{item.hospitalUID}" filterBy="#{item.hospitalUID}" filterMatchMode="EQ">
                       <h:outputText value="#{workflowConfigController.getHospitalNameByUId(item.hospitalUID)}"/>
                       <f:facet name="filter">
                           <p:selectOneMenu onchange="PF('varDataList').filter()" autoWidth="false" style="max-width: 150px;" >
                               <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                               <f:selectItems value="#{workflowConfigController.getHospitalList('2')}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                           </p:selectOneMenu>
                       </f:facet>
                   </p:column>
                   <p:column headerText="#{msg.Site}" sortBy="#{item.siteUID}" filterBy="#{item.siteUID}" filterMatchMode="EQ" >
                       <h:outputText value="#{workflowConfigController.getSiteNameByUId(item.siteUID)}" />
                       <f:facet name="filter">
                           <p:selectOneMenu onchange="PF('varDataList').filter()" autoWidth="false" style="max-width: 150px;" >
                               <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                               <f:selectItems value="#{workflowConfigController.getHospitalList('3')}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                           </p:selectOneMenu>
                       </f:facet>
                   </p:column>
<!--                      <p:column headerText="#{msg.dispatchMode}" sortBy="#{item.dispatchMode}" filterBy="#{item.dispatchMode}" filterMatchMode="EQ">
                    <h:outputText value="#{fieldMsg.fieldValue('dispatchMode',item.dispatchMode)}"/>
               </p:column> -->
                    <p:column headerText="#{msg.repair}维修派工角色" sortBy="#{item.dispatchRoleName}" filterBy="#{item.dispatchRoleName}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.dispatchRoleName}"/>
                    </p:column>
                    <p:column headerText="#{msg.timeoutDispatch}" sortBy="#{item.timeoutDispatch}" filterBy="#{item.timeoutDispatch}" filterMatchMode="EQ">
                        <h:outputText value="#{item.timeoutDispatch}"/>
                    </p:column>
                    <p:column headerText="#{msg.timeoutAccept}" sortBy="#{item.timeoutAccept}" filterBy="#{item.timeoutAccept}" filterMatchMode="EQ">
                        <h:outputText value="#{item.timeoutAccept}"/>
                    </p:column>
                    <p:column headerText="#{msg.timeoutClose}" sortBy="#{item.timeoutClose}" filterBy="#{item.timeoutClose}" filterMatchMode="EQ">
                        <h:outputText value="#{item.timeoutClose}"/>
                    </p:column>
                    <p:column headerText="#{msg.maxMessageCount}" sortBy="#{item.maxMessageCount}" filterBy="#{item.maxMessageCount}" filterMatchMode="EQ">
                        <h:outputText value="#{item.maxMessageCount}"/>
                    </p:column>
                    <p:column headerText="#{msg.pmReminderTime}" sortBy="#{item.pmReminderTime}" filterBy="#{item.pmReminderTime}" filterMatchMode="EQ">
                        <h:outputText value="#{item.pmReminderTime}"/>
                    </p:column>
                   
                    <p:column headerText="#{msg.autoAck}" sortBy="#{item.autoAck}" filterBy="#{item.autoAck}" filterMatchMode="EQ">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList').filter()">
                                <f:converter converterId="javax.faces.Boolean" />
                                <f:selectItem itemLabel="#{msg.All}" itemValue="" />
                                <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true" />
                                <f:selectItem itemLabel="#{msg.False2No}" itemValue="false" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{item.autoAck? msg.True2Yes : msg.False2No }"/>
                    </p:column>

                    <f:facet name="{Toolbar}">
                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" actionListener="#{workflowConfigController.prepareCreate}" update=":V2_WorkflowConfigEditDlg" oncomplete="PF('V2_WorkflowConfigEditDialog').show()"/>
                       <!--  <p:commandButton id="viewButton" icon="ui-icon-search" class="btn btn-sm btn-gray"  actionListener="#{workflowConfigController.prepareView}" update=":V2_WorkflowConfigViewDlg" oncomplete="PF('V2_WorkflowConfigViewDialog').show()" disabled="#{empty workflowConfigController.selected}"/> -->
                        <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray"  actionListener="#{workflowConfigController.prepareEdit()}" update=":V2_WorkflowConfigEditDlg" oncomplete="PF('V2_WorkflowConfigEditDialog').show()" disabled="#{empty workflowConfigController.selected}"/>
                        <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray"  actionListener="#{workflowConfigController.delete}" update=":V2_WorkflowConfigViewDlg,datalist" disabled="#{empty workflowConfigController.selected}">
                       		<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/> 
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>

            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>

            </div>
        </div>
        
    </ui:define>

</ui:composition>
