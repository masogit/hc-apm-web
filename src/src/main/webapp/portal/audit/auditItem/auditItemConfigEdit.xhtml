<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="auditConfigItemEditDlg" widgetVar="auditConfigItemEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.AuditItemConfig}" height="500" width="700">
            <h:form id="auditConfigItemEditForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.type}*</label>

                        <p:selectOneMenu value="#{auditItemConfigController.selected.type}" immediate="true" required="true" requiredMessage="#{msg.type} #{msg.ValidationRequire}"
                                         autoWidth="false" style="width: 95%;">
                            <p:ajax event="change" listener="#{auditItemConfigController.changeType}" update="showPanel"/>
                            <f:selectItem itemLabel="#{msg.Text}" itemValue="1" />
                            <f:selectItem itemLabel="#{msg.Image}" itemValue="2"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ContentType}*</label>
                        <p:selectOneMenu value="#{auditItemConfigController.selected.contentType}" required="true" requiredMessage="#{msg.ContentType} #{msg.ValidationRequire}" autoWidth="false" style="width: 95%;">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('auditItemType')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.Mark}*</label>
                        <p:inputText id="mark" value="#{auditItemConfigController.selected.mark}" required="true" requiredMessage="#{msg.Mark} #{msg.ValidationRequire}" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup id="showPanel">
                        <h:panelGroup rendered="#{auditItemConfigController.selectType eq '1'}">
                            <label class="label">#{msg.Content}*</label>
                            <p:inputTextarea rows="3" cols="50" id="content" value="#{auditItemConfigController.selected.content}" style="width: 95%;"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{auditItemConfigController.selectType eq '2'}">
                            <p:dataGrid id="pictureList" var="fileitem" value="#{auditItemConfigController.getAttachList(auditItemConfigController.selected.uid,'Image')}" style="width: 95%" columns="5" layout="grid">
                                <f:facet name="header">#{msg.Image}</f:facet>
                                <p:panel  style="text-align:center">
                                    <h:panelGrid columns="1" style="width:100%" >
                                    <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>
<!--                                <p:graphicImage url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/> -->
                                        <p:commandButton actionListener="#{auditItemConfigController.removeAttachmentById(fileitem.id)}" update="pictureList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                        </p:commandButton>
                                    </h:panelGrid>
                                </p:panel>
                            </p:dataGrid>
                            <p:fileUpload id="imageUpload" allowTypes="/(\.|\/)(jpeg|jpg|png|JPEG|JPG|PNG)$/" fileUploadListener="#{auditItemConfigController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:95%"
                                          multiple="true"  sizeLimit="20971520"  update="#{auditItemConfigController.CRUDActionName.equals('修改')?'pictureList auditConfigItemEditForm:pict':'pictureList'}"  auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}20M" label="#{msg.Add}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" action="#{auditItemConfigController.saveAuditConfigItem}" update=":growl" icon="ui-icon-check"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('auditConfigItemEditDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
