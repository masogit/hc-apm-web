<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g clearfix" >
            <div class="ui-g-12 card cardTitle" >
                <h:form id="pageTitleName">
                    <p:outputLabel  class="pageTitle" value="#{auditSystemCaseEditController.CRUDActionName}配置" rendered="#{auditSystemCaseEditController.selected.type==null}" />
                    <p:outputLabel  class="pageTitle" value="#{auditSystemCaseEditController.CRUDActionName}质控配置" rendered="#{auditSystemCaseEditController.selected.type==2}" />
                    <p:outputLabel   class="pageTitle" value="#{auditSystemCaseEditController.CRUDActionName}省份版本配置" rendered="#{auditSystemCaseEditController.selected.type==1}" />
                </h:form>
            </div>

            <div class="ui-g-12">
                <h:form id="editForm">
                    <div class="ui-g-18 ui-lg-12">
                        <div class="card" >
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 100%" rendered="true">
                                <h:panelGroup >
                                    <label class="label" >类型</label>
                                    <p:selectOneMenu value="#{auditSystemCaseEditController.selected.type}" style="width: 60%" required="true" disabled="#{auditSystemCaseEditController.selected.type!=null}">
                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('VersionType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        <p:ajax update="editForm targetForm pageTitleName" listener="#{auditSystemCaseEditController.typeChecking()}" />
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selected.type==1}" >
                                    <label class="label">年份</label>
                                    <p:inputText id="version" value="#{auditSystemCaseEditController.selected.version}" style="width: 60%" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selected.type==1}" >
                                    <label class="label">地区</label>
                                    <p:inputText id="zone" value="#{auditSystemCaseEditController.selected.zone}" style="width: 60%"/>
                                </h:panelGroup>
                                <h:panelGroup  rendered="#{auditSystemCaseEditController.selected.type==1}">
                                    <label class="label" >计分方式</label>
                                    <p:selectOneMenu value="#{auditSystemCaseEditController.selected.judgeLogic}" style="width: 60%" >
                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('Scoring')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selected.type==1}" >
                                    <label class="label">评级要求</label>
                                    <p:inputTextarea rows="3" cols="50" id="ratingRequirements" value="#{auditSystemCaseEditController.selected.ratingRequirements}" style="width: 60%;"/>
                                </h:panelGroup>
                            </p:panelGrid>
                            <p:panelGrid>
                                <h:panelGroup >
                                    <p:commandButton validateClient="true" actionListener="#{auditSystemCaseEditController.saveSelectedOrg()}" update="entryForm:adminListSearch entryForm:deleteButton entryForm:createButton targetForm"
                                                     value="#{msg.Save}"/>
                                    <p:commandButton validateClient="true" action="#{auditSystemCaseEditController.listAction(1)}"
                                                     value="存为草稿"/>
                                    <p:commandButton validateClient="true"  action="#{auditSystemCaseEditController.listAction(2)}"
                                                     value="存档"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </div>
                    </div>
                </h:form>
                <h:form id="targetForm"  >
                    <div class="ui-g-18 ui-lg-12">
                        <div class="card"  >
                            <p:dataTable id="targetList" value="#{auditSystemCaseEditController.getTargetTypeList()}" var="item"
                                         lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" rendered="#{auditSystemCaseEditController.selected.type==1}"
                                         emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="目标">
                                    <h:outputText value="#{fieldMsg.fieldValue('targetType',item.target)}"/>
                                </p:column>
                                <p:column headerText="目标分数">
                                    <h:outputText value="#{item.score}"/>
                                </p:column>

                                <p:column headerText="操作">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}"
                                                     oncomplete="PF('auditTargetDlg').show()" rendered="#{empty item.target}"
                                                     actionListener="#{auditSystemCaseEditController.onAuditTarget()}"
                                                     update="auditTargetDlg" disabled="#{empty auditSystemCaseEditController.selected.uid}"/>
                                    <p:commandButton icon="ui-icon-pencil"  style="zoom:0.8;" class="btn btn-sm btn-gray" process="@this" oncomplete="PF('auditTargetDlg').show()"
                                                     title="#{msg.Edit}" actionListener="#{auditSystemCaseEditController.editAuditTarger(item)}"
                                                     rendered="#{not empty item.target}"  update="auditTargetDlg"/>
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
                                                     actionListener="#{auditSystemCaseEditController.deleteAuditTarger(item)}" rendered="#{not empty item.target}"
                                                     update="targetForm">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                                   icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </div>
                    </div>
                    <br/>
                </h:form>
                <h:form id="entryForm">
                    <div class="ui-g-12 ui-lg-4">
                        <div class="card" >
                            <h:panelGroup>
                                <p:inputText id="entryMarkName" value="#{auditSystemCaseEditController.entryMarkName}"/>
                                <p:commandButton id = "adminListSearch" icon="ui-icon-location-searching" style="width: 90px;"   actionListener="#{auditSystemCaseEditController.filterNode()}" value="#{msg.Search2}"  update="entryTree" disabled="#{empty auditSystemCaseEditController.selected.uid}"/>
                                <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray"  title="#{msg.Create}"   update="MarkForm"  actionListener="#{auditSystemCaseEditController.preCreate()}"
                                                 disabled="#{empty auditSystemCaseEditController.selected.uid}" oncomplete="PF('markDlg').show()"/>
                                <p:commandButton  icon="ui-icon-pencil"    class="btn btn-sm btn-gray" process="@this" oncomplete="PF('markDlg').show()" disabled="#{empty auditSystemCaseEditController.selected.uid}"
                                                  title="#{msg.Edit}" actionListener="#{auditSystemCaseEditController.editAuditSystementry()}"
                                                  update="markDlg"/>
                                <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" update="entryTree"  disabled="#{empty auditSystemCaseEditController.selected.uid}"
                                                 actionListener="#{auditSystemCaseEditController.preDelete}"/>
                            </h:panelGroup>

                            <p:scrollPanel style="height:95%;border: 0" mode="native">
                                <p:tree id="entryTree" class="tree" style="width:98%;border:0;"  value="#{auditSystemCaseEditController.orgTree}"  var="node" selectionMode="single" selection="#{auditSystemCaseEditController.selectedNode}" highlight="true">
                                    <p:ajax process="@this" event="select" listener="#{auditSystemCaseEditController.onSelectTreeNode}" update="editContentForm"/>

                                    <p:treeNode type="org" >
                                        <h:outputText value="#{node.mark}__#{node.name}" rendered="#{auditSystemCaseEditController.selected.type==1}"/>
                                        <h:outputText value="#{node.name}" rendered="#{auditSystemCaseEditController.selected.type==2}"/>
                                    </p:treeNode>
                                    <p:treeNode type="hidden" rendered="false"/>
                                </p:tree>
                            </p:scrollPanel>
                        </div>
                    </div>
                </h:form>
                <h:form id="editContentForm">
                    <div class="ui-g-12 ui-lg-8" >
                        <div class="card"  >

                            <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                                <p:commandButton value="条配置"   process="@this" update="editContentForm" disabled="#{auditSystemCaseEditController.getStrip()}" actionListener="#{auditSystemCaseEditController.strip}"
                                                 rendered="#{auditSystemCaseEditController.entryOrderBy eq 1 or auditSystemCaseEditController.entryOrderBy  eq 2 or auditSystemCaseEditController.entryOrderBy eq 3}"/>
                                <p:commandButton value="款配置"     process="@this" update="editContentForm" disabled="#{auditSystemCaseEditController.getPayment()}" actionListener="#{auditSystemCaseEditController.payment}"
                                                 rendered="#{auditSystemCaseEditController.entryOrderBy  eq 2 or (auditSystemCaseEditController.entryOrderBy  eq 3 and auditSystemCaseEditController.orderByFlag)}" />
                                <p:commandButton value="指标配置"   process="@this" update="editContentForm"  disabled="#{auditSystemCaseEditController.getTarget()}" actionListener="#{auditSystemCaseEditController.target}"
                                                 rendered="#{auditSystemCaseEditController.entryOrderBy eq 3}"/>
                            </h:panelGrid>
                            <h:form id="stripForm" rendered="#{auditSystemCaseEditController.getStrip()}">
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selected.type==1}" >
                                    <label style="color:red">原文 :  </label>
                                    <h:outputText value=" #{auditSystemCaseEditController.auditSystemEntry.sourceText}"/>
                                </h:panelGroup>
                                <br/>
                                <br/>
                                <p:dataTable id="stripList" value="#{auditSystemCaseEditController.getStripList()}" var="item"
                                             lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                                             emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.mark}">
                                        <h:outputText value="#{item.mark}"/>
                                    </p:column>
                                    <p:column headerText="类型">
                                        <h:outputText value="#{fieldMsg.fieldValue('auditItemType',item.contentType)}"/>
                                    </p:column>
                                    <p:column headerText="内容">
                                        <h:outputText value="#{item.content}"/>
                                    </p:column>

                                    <p:column headerText="操作">
                                        <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}"
                                                         oncomplete="PF('contentDlg').show()" rendered="#{empty item.mark}"
                                                         actionListener="#{auditSystemCaseEditController.onContent()}"
                                                         update="contentDlg"/>
                                        <p:commandButton  icon="ui-icon-pencil"  style="zoom:0.8;" class="btn btn-sm btn-gray" process="@this" oncomplete="PF('contentDlg').show()"
                                                          title="#{msg.Edit}" actionListener="#{auditSystemCaseEditController.editAuditConfigItem(item)}"
                                                          rendered="#{not empty item.mark}"  update="contentDlg"/>
                                        <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
                                                         actionListener="#{auditSystemCaseEditController.deleteNode(item)}" rendered="#{not empty item.mark}"
                                                         update="stripList">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                                       icon="ui-icon-alert"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>

                                <br/>
                            </h:form>
                            <h:form id="paymentForm" rendered="#{auditSystemCaseEditController.getPayment()}">
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selected.type==1}" >
                                    <label style="color:red">款分值 :  </label>
                                    <h:outputText value="#{auditSystemCaseEditController.paymentScoreStandard}"/>
                                </h:panelGroup>
                                <br/>
                                <br/>
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selected.type==1}" >
                                    <label style="color:red">原文 :  </label>
                                    <h:outputText value=" #{auditSystemCaseEditController.auditSystemEntry.sourceText}"/>
                                </h:panelGroup>
                                <br/>
                                <br/>
                                <p:dataTable id="paymentList" value="#{auditSystemCaseEditController.getPaymentList()}" var="item"
                                             lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                                             emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.mark}">
                                        <h:outputText value="#{item.mark}"/>
                                    </p:column>
                                    <p:column headerText="类型">
                                        <h:outputText value="#{fieldMsg.fieldValue('auditItemType',item.contentType)}"/>
                                    </p:column>
                                    <p:column headerText="内容">
                                        <h:outputText value="#{item.content}"/>
                                    </p:column>

                                    <p:column headerText="操作">
                                        <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}"
                                                         oncomplete="PF('contentDlg').show()"
                                                         actionListener="#{auditSystemCaseEditController.onContent()}" rendered="#{empty item.mark}"
                                                         update="contentDlg"/>
                                        <p:commandButton  icon="ui-icon-pencil"  style="zoom:0.8;" class="btn btn-sm btn-gray" process="@this" oncomplete="PF('contentDlg').show()"
                                                          title="#{msg.Edit}" actionListener="#{auditSystemCaseEditController.editAuditConfigItem(item)}"
                                                          rendered="#{not empty item.mark}"  update="contentDlg"/>
                                        <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
                                                         actionListener="#{auditSystemCaseEditController.deleteNode(item)}" rendered="#{not empty item.mark}"
                                                         update="paymentList">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                                       icon="ui-icon-alert"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>

                                <br/>
                            </h:form>
                            <h:form id="argetForm" rendered="#{auditSystemCaseEditController.getTarget()}">
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selected.type==1}" >
                                    <label style="color:red">指标分值 :  </label>
                                    <h:outputText value="#{auditSystemCaseEditController.targetScoreStandard}"/>
                                </h:panelGroup>
                                <br/>
                                <br/>
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selected.type==1}" >
                                    <label style="color:red">原文 :  </label>
                                    <h:outputText value=" #{auditSystemCaseEditController.auditSystemEntry.sourceText}"/>
                                </h:panelGroup>
                                <br/>
                                <br/>
                                <p:dataTable id="argetList" value="#{auditSystemCaseEditController.getTargetList()}" var="item"
                                             lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                                             emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.mark}">
                                        <h:outputText value="#{item.mark}"/>
                                    </p:column>
                                    <p:column headerText="类型">
                                        <h:outputText value="#{fieldMsg.fieldValue('auditItemType',item.contentType)}"/>
                                    </p:column>
                                    <p:column headerText="内容">
                                        <h:outputText value="#{item.content}"/>
                                    </p:column>

                                    <p:column headerText="操作">
                                        <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}"
                                                         oncomplete="PF('contentDlg').show()" rendered="#{empty item.mark}"
                                                         actionListener="#{auditSystemCaseEditController.onContent()}"
                                                         update="contentDlg"/>
                                        <p:commandButton  icon="ui-icon-pencil"  style="zoom:0.8;" class="btn btn-sm btn-gray" process="@this" oncomplete="PF('contentDlg').show()"
                                                          title="#{msg.Edit}" actionListener="#{auditSystemCaseEditController.editAuditConfigItem(item)}"
                                                          rendered="#{not empty item.mark}"  update="contentDlg"/>
                                        <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
                                                         actionListener="#{auditSystemCaseEditController.deleteNode(item)}" rendered="#{not empty item.mark}"
                                                         update="argetList">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                                       icon="ui-icon-alert"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>

                                <br/>
                            </h:form>
                            <h:form id="auditTemplateFrom" rendered="#{auditSystemCaseEditController.getTarget()}">
                                <p> 模板配置 </p>
                                <p:dataTable id="auditTemplatList" value="#{auditSystemCaseEditController.getAuditTemplateList()}" var="item"
                                             lazy="false" paginator="false" rowKey="#{item.uid}" rows="1000"
                                             emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.TemplateName}" >
                                        <h:outputText value="#{item.name}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.Mark}" >
                                        <h:outputText value="#{item.mark}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.FileName}" >
                                        <h:outputText value="#{item.fileName}"/>
                                    </p:column>

                                    <p:column headerText="操作">
                                        <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}"
                                                         oncomplete="PF('auditTemplateDlg').show()" rendered="#{empty item.mark}"
                                                         actionListener="#{auditSystemCaseEditController.onContent()}"
                                                         update="auditTemplateDlg"/>
                                        <p:commandButton  icon="ui-icon-pencil"  style="zoom:0.8;" class="btn btn-sm btn-gray" process="@this" oncomplete="PF('auditTemplateDlg').show()"
                                                          title="#{msg.Edit}" actionListener="#{auditSystemCaseEditController.editAuditTemplate(item)}"
                                                          rendered="#{not empty item.mark}"  update="auditTemplateDlg"/>
                                        <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" rendered="#{not empty item.mark}"
                                                         actionListener="#{auditSystemCaseEditController.deleteTemplate(item)}"
                                                         update="auditTemplatList">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                                       icon="ui-icon-alert"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>

                                <br/>
                            </h:form>

                        </div>
                    </div>
                </h:form>

                <p:dialog id="markDlg" widgetVar="markDlg" modal="true" resizable="true" draggable="true" width="1050"
                          height="600" appendTo="@(body)" header="新增层级">
                    <h:form id="MarkForm">
                        <p:fieldset id="basic" legend="基本信息">
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                                <h:panelGroup rendered="#{auditSystemCaseEditController.entryFlag and auditSystemCaseEditController.entryScoreFlag and auditSystemCaseEditController.selected.type==1}">
                                    <label class="label" >类型</label>
                                    <p:selectOneMenu value="#{auditSystemCaseEditController.entryType}">
                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('entryType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selected.type==1}">
                                    <label class="label" style="font-size: medium; font-weight: bold">层级编号</label>
                                    <p:inputText id="entryMark"
                                                 value="#{auditSystemCaseEditController.entryMark}" required="true"
                                                 requiredMessage="层级编号不能为空">
                                        <p:ajax process="@this"/>
                                    </p:inputText>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label" style="font-size: medium; font-weight: bold">层级名称</label>
                                    <p:inputText id="entryName"
                                                 value="#{auditSystemCaseEditController.entryName}" required="true"
                                                 requiredMessage="层级名称不能为空">
                                        <p:ajax process="@this"/>
                                    </p:inputText>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{auditSystemCaseEditController.entryScoreFlag and auditSystemCaseEditController.selected.type==1}">
                                    <label class="label">分值</label>
                                    <p:inputText  value="#{auditSystemCaseEditController.entryScoreStandard}" style="width: 60%"/>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selected.type==1}">
                                    <label class="label">原文</label>
                                    <p:inputTextarea rows="3" cols="50" id="sourceText" value="#{auditSystemCaseEditController.sourceText}" style="width: 60%;"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:fieldset>
                        <br/>
                        <p:commandButton validateClient="true" actionListener="#{auditSystemCaseEditController.saveAuditSystemEntry()}"
                                         value="#{msg.Save}" update="entryForm:entryTree" icon="ui-icon-check"
                                         oncomplete="handleSubmit(args, 'markDlg');"/>

                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                         onclick="PF('markDlg').hide()"/>
                    </h:form>
                </p:dialog>
                <p:dialog id="contentDlg" widgetVar="contentDlg" modal="true" resizable="true" draggable="true"
                          header="新增内容" width="600" height="600">
                    <h:form id="contentForm">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 80%" rendered="true">
                            <h:panelGroup>
                                <label class="label">#{msg.ContentType}*</label>
                                <p:selectOneMenu value="#{auditSystemCaseEditController.entryType}"   requiredMessage="#{msg.ContentType} #{msg.ValidationRequire}" autoWidth="false" style="width: 50%;">
                                    <f:selectItem itemLabel="#{auditSystemCaseEditController.auditConfigItemSelected.uid !=null ? fieldMsg.fieldValue('auditItemType',auditSystemCaseEditController.auditConfigItemSelected.contentType) : msg.SelectOneMessage}" itemValue="#{null}"  noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('auditItemType')}"  var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}" />
                                    <p:ajax process="@this" listener="#{auditSystemCaseEditController.auditConfigItemList()}" update="content"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup id="content">
                                <label class="label">#{msg.mark}*</label>
                                <p:selectOneMenu value="#{auditSystemCaseEditController.configItemUid}"   requiredMessage="#{msg.content} #{msg.ValidationRequire}"
                                                 autoWidth="false" style="width: 50%;">
                                    <f:selectItem itemLabel="#{auditSystemCaseEditController.auditConfigItemSelected.uid !=null ? auditSystemCaseEditController.auditConfigItemSelected.mark : msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"  />
                                    <f:selectItems value="#{auditSystemCaseEditController.auditConfigItemList()}" var="entry" itemLabel="#{entry.mark}"  itemValue="#{entry.uid}"/>
                                    <p:ajax process="@this" listener="#{auditSystemCaseEditController.setNothing()}" update="entryContent"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup id="entryContent">
                                <label class="label">内容</label>
                                <p:inputTextarea rows="3" cols="50"  value="#{auditSystemCaseEditController.entryContent}" style="width: 100%;" disabled="true"/>
                            </h:panelGroup>
                        </p:panelGrid>

                        <h:panelGroup  >
                            <br/><br/>
                            <p:commandButton validateClient="true" actionListener="#{auditSystemCaseEditController.saveAuditConfigItem(null)}"
                                             value="选择" update="editContentForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'contentDlg');"/>
                            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                             onclick="PF('contentDlg').hide()"/>
                            <p:commandButton immediate="true" value="新增条目"
                                             actionListener="#{auditSystemCaseEditController.changeContentType()}"
                                             update="auditConfigItemEditForm"  />

                        </h:panelGroup>
                    </h:form>
                    <h:form id="auditConfigItemEditForm" >
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{auditSystemCaseEditController.contentTypeFlag}">
                            <h:panelGroup>
                                <label class="label">#{msg.type}*</label>

                                <p:selectOneMenu value="#{auditSystemCaseEditController.auditConfigItem.type}" immediate="true" required="true" requiredMessage="#{msg.type} #{msg.ValidationRequire}"
                                                 autoWidth="false" style="width: 95%;">
                                    <p:ajax event="change" listener="#{auditSystemCaseEditController.changeType}" update="showPanel"/>
                                    <f:selectItem itemLabel="#{msg.Text}" itemValue="1" />
                                    <f:selectItem itemLabel="#{msg.Image}" itemValue="2"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.Mark}*</label>
                                <p:inputText id="mark" value="#{auditSystemCaseEditController.auditConfigItem.mark}" required="true" requiredMessage="#{msg.Mark} #{msg.ValidationRequire}" style="width: 95%;"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.ContentType}*</label>
                                <p:selectOneMenu value="#{auditSystemCaseEditController.auditConfigItem.contentType}" required="true" requiredMessage="#{msg.ContentType} #{msg.ValidationRequire}" autoWidth="false" style="width: 95%;">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('auditItemType')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup id="showPanel">
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selectType eq '1'}">
                                    <label class="label">#{msg.Content}*</label>
                                    <p:inputTextarea rows="3" cols="50"  value="#{auditSystemCaseEditController.auditConfigItem.content}" style="width: 95%;"/>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{auditSystemCaseEditController.selectType eq '2'}">
                                    <p:dataGrid id="pictureList" var="fileitem" value="#{auditSystemCaseEditController.getAttachList(auditSystemCaseEditController.auditConfigItem.uid,'Image')}" style="width: 95%" columns="5" layout="grid">
                                        <f:facet name="header">#{msg.Image}</f:facet>
                                        <p:panel  style="text-align:center">
                                            <h:panelGrid columns="1" style="width:100%" >
                                                <p:graphicImage url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/>
                                                <p:commandButton actionListener="#{auditSystemCaseEditController.removeAttachmentById(fileitem.id)}" update="pictureList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                                </p:commandButton>
                                            </h:panelGrid>
                                        </p:panel>
                                    </p:dataGrid>
                                    <p:fileUpload id="imageUpload" allowTypes="/(\.|\/)(jpeg|jpg|png|JPEG|JPG|PNG)$/" fileUploadListener="#{auditSystemCaseEditController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:95%"
                                                  multiple="true"  sizeLimit="10000000"  update="#{auditSystemCaseEditController.CRUDActionName.equals('修改')?'pictureList auditConfigItemEditForm:pict':'pictureList'}"  auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>
                                </h:panelGroup>
                            </h:panelGroup>
                        </p:panelGrid>
                        <br/>
                        <h:panelGroup rendered="#{auditSystemCaseEditController.contentTypeFlag}">
                            <p:commandButton validateClient="true" value="#{msg.Save}" action="#{auditSystemCaseEditController.saveNewAuditConfigItem()}" update="editContentForm" icon="ui-icon-check"
                                             oncomplete="handleSubmit(args, 'contentDlg');"/>
                            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('contentDlg').hide()"/>
                        </h:panelGroup>
                    </h:form>
                </p:dialog>

                <p:dialog id="auditTargetDlg" widgetVar="auditTargetDlg" modal="true" resizable="true" draggable="true"
                          header="新增目标" width="500" height="300">
                    <h:form id="auditTargetForm">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 80%" rendered="true">
                            <h:panelGroup>
                                <label class="label">目标*</label>
                                <p:selectOneMenu value="#{auditSystemCaseEditController.auditTargetSelected.target}" required="true"  requiredMessage="目标 #{msg.ValidationRequire}" autoWidth="false" style="width: 50%;">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}"  noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('targetType')}"  var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">分值</label>
                                <p:inputText id="targetScore" value="#{auditSystemCaseEditController.auditTargetSelected.score}" style="width: 60%"
                                             required="true"/>
                            </h:panelGroup>
                        </p:panelGrid>
                        <h:panelGroup  >
                            <br/><br/><br/><br/><br/><br/><br/><br/>
                            <p:commandButton validateClient="true" actionListener="#{auditSystemCaseEditController.saveAuditTarget()}"
                                             value="#{msg.Save}" update="targetForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'auditTargetDlg');"/>
                            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                             onclick="PF('auditTargetDlg').hide()"/>
                        </h:panelGroup>
                    </h:form>
                </p:dialog>
                <p:dialog id="auditTemplateDlg" widgetVar="auditTemplateDlg" modal="true" resizable="true" draggable="true"
                          header="新增模板" width="500" height="300">
                    <h:form id="auditTemplateForm">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 80%" rendered="true">
                            <h:panelGroup id="TemplateName">
                                <label class="label">#{msg.Mark}*</label>
                                <p:selectOneMenu value="#{auditSystemCaseEditController.templateUid}" required="true" requiredMessage="#{msg.content} #{msg.ValidationRequire}"
                                                 autoWidth="false" style="width: 50%;">
                                    <f:selectItem itemLabel="#{auditSystemCaseEditController.auditTemplateSelected.uid !=null ? auditSystemCaseEditController.auditTemplateSelected.mark : msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"  />

                                    <f:selectItems value="#{auditSystemCaseEditController.auditTemplates()}" var="template" itemLabel="#{template.mark}"  itemValue="#{template.uid}"/>
                                    <p:ajax process="@this" event="itemSelect" listener="#{auditSystemCaseEditController.setNothing()}"/>
                                    <p:ajax process="@this" listener="#{auditSystemCaseEditController.setNothing()}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </p:panelGrid>
                        <h:panelGroup  >
                            <br/><br/><br/><br/><br/><br/><br/><br/>
                            <p:commandButton validateClient="true" actionListener="#{auditSystemCaseEditController.saveAuditTemplate()}"
                                             value="#{msg.Save}" update="editContentForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'auditTemplateDlg');"/>
                            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                             onclick="PF('auditTemplateDlg').hide()"/>
                        </h:panelGroup>
                    </h:form>
                </p:dialog>
            </div>
        </div>
    </ui:define>

</ui:composition>
