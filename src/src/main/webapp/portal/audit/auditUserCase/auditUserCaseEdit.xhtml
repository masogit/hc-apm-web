<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition>
        <p:dialog id="auditCaseEditDlg" widgetVar="auditCaseEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.AuditUserCase}" height="320" width="700">
            <h:form id="auditCaseForm">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.tenant}*</label>
                        <p:selectOneMenu value="#{auditUserCaseController.selectedTenantUid}" required="true" requiredMessage="#{msg.Site} #{msg.ValidationRequire}" autoWidth="false" style="width: 95%;">
                            <p:ajax event="change" update="site"/>
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{auditUserCaseController.getAllTenant()}" var="entry" itemLabel="#{entry.name}" itemValue="#{entry.uid}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.Site}</label>
                        <p:selectOneMenu id="site" value="#{auditUserCaseController.selected.siteUid}" required="true" requiredMessage="#{msg.Version} #{msg.ValidationRequire}" autoWidth="false" style="width: 95%;">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{auditUserCaseController.getSiteByTenant()}" var="entry" itemLabel="#{entry.name}" itemValue="#{entry.uid}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.Version}*</label>
                        <p:selectOneMenu value="#{auditUserCaseController.selected.systemCaseUid}" required="true" requiredMessage="#{msg.Version} #{msg.ValidationRequire}" autoWidth="false" style="width: 95%;">
                            <p:ajax event="change" update="target"/>
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{auditUserCaseController.getAllSystemCase()}" var="entry" itemLabel="#{entry.zone} - #{entry.version}" itemValue="#{entry.uid}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.Target}*</label>
                        <p:selectOneMenu id="target" value="#{auditUserCaseController.selected.target}" required="true" requiredMessage="#{msg.Target} #{msg.ValidationRequire}" autoWidth="false" style="width: 95%;">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{auditUserCaseController.getTarget()}" var="entry" itemLabel="#{entry.target} - #{entry.score}" itemValue="#{entry.target}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EnableTime}*</label>
                        <p:calendar timeZone="GMT+8"  id="startTime" pattern="yyyy/MM/dd" value="#{auditUserCaseController.selected.startTime}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"
                                    required="true" requiredMessage="#{msg.EnableTime} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.endTime}*</label>
                        <p:calendar timeZone="GMT+8"  id="endTime" pattern="yyyy/MM/dd" value="#{auditUserCaseController.selected.endTime}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"
                                    required="true" requiredMessage="#{msg.endTime} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" action="#{auditUserCaseController.saveAuditCase}" update=":growl" icon="ui-icon-check"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('auditCaseEditDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
