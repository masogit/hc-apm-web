<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            .ui-confirm-dialog{
                max-width: 320px;
            }
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.AuditUserCase}"/>
            </div>
            <div class="ui-g-12 card cardTitle">
                <h:form id="selectForm" style="float: left">
                    <p:commandButton id="btnTenant" value="#{auditUserCaseController.selectedTenant.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                    <p:overlayPanel widgetVar="varPanelTenant" for="btnTenant" hideEffect="fade" dynamic="false" modal="false" appendTo="@form">
                        <p:selectOneListbox scrollHeight="300" style="border: none;" value="#{auditUserCaseController.selectedTenant.uid}">
                            <p:ajax process="@this" event="click" update="selectForm" listener="#{auditUserCaseController.setSelectTenantInfo()}" oncomplete="PF('varPanelTenant').hide();"/>
                            <f:selectItems value="#{auditUserCaseController.getAllTenant()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                        </p:selectOneListbox>
                    </p:overlayPanel>

                    <p:commandButton id="btnSite" value="#{auditUserCaseController.selectedOrg.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                    <p:overlayPanel widgetVar="varPanelSite" for="btnSite" hideEffect="fade" dynamic="false" modal="false" appendTo="@form">
                        <p:selectOneListbox scrollHeight="300" style="border: none;" value="#{auditUserCaseController.selectedOrg.uid}">
                            <p:ajax process="@this" event="click" update="@(.datalist) selectForm" listener="#{auditUserCaseController.setSelectOrgInfo()}" oncomplete="PF('varPanelSite').hide();"/>
                            <f:selectItems value="#{auditUserCaseController.getSiteByTenantForListPage()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                        </p:selectOneListbox>
                    </p:overlayPanel>
                </h:form>
            </div>

            <div class="ui-g-12 card">
                <h:form id="auditCaseListForm">
                    <p:dataTable id="datalist" class="datalist" value="#{auditUserCaseController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{auditUserCaseController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}" rowIndexVar="rowIndex"
                                 rowsPerPageTemplate="10,20,30,90">

                        <p:ajax event="filter" listener="#{auditUserCaseController.onFilter}" />

                        <p:column headerText="#{msg.mark}">
                            <h:outputText value="#{rowIndex + 1}"/>
                        </p:column>
                        <p:column headerText="省份" filterBy="#{item.auditSystemCase.zone}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.auditSystemCase.zone}"/>
                        </p:column>
                        <p:column headerText="版本编号" filterBy="#{item.auditSystemCase.version}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.auditSystemCase.version}"/>
                        </p:column>
                        <p:column headerText="类型">
                            <h:outputText value="#{fieldMsg.fieldValue('VersionType', item.auditSystemCase.type)}"/>
                        </p:column>
                        <p:column headerText="条数量">
                            <h:outputText value="#{item.auditSystemCase.stripNum}"/>
                        </p:column>
                        <p:column headerText="款数量">
                            <h:outputText value="#{item.auditSystemCase.paymentNum}"/>
                        </p:column>
                        <p:column headerText="指标数量">
                            <h:outputText value="#{item.auditSystemCase.targetNum}"/>
                        </p:column>
                        <p:column headerText="总分值" sortBy="#{item.score}">
                            <h:outputText value="#{item.score}"/>
                        </p:column>
                        <p:column headerText="评分方式">
                            <h:outputText value="#{fieldMsg.fieldValue('Scoring', item.auditSystemCase.judgeLogic)}"/>
                        </p:column>
                        <p:column headerText="启用时间" sortBy="#{item.startTime}">
                            <h:outputText value="#{item.startTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="操作人">
                            <h:outputText value="#{item.updater}"/>
                        </p:column>
                        <p:column headerText="更新时间" sortBy="#{item.updateTime}">
                            <h:outputText value="#{item.updateTime}"/>
                        </p:column>
                        <p:column headerText="#{msg.Operation}" exportable="false" width="120" id="operatorColumn">
                            <h:panelGroup>
                                <p:commandButton value="#{msg.Initialize}" process="@this" actionListener="#{auditUserCaseController.initialize(item.uid)}" update="auditCaseListForm:datalist">
                                    <p:confirm header="#{msg.InitializeConformation}" message="#{msg.InitializeConformationMsg}" icon="ui-icon-warning" />
                                </p:commandButton>
                            </h:panelGroup>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{auditUserCaseController.prepareCreate}" update=":auditCaseEditDlg" oncomplete="PF('auditCaseEditDialog').show()" />
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="auditUserCaseEdit.xhtml"/>
            </div>
        </div>
    </ui:define>


</ui:composition>
