<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            .ui-confirm-dialog{
                max-width: 320px;
            }
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.AuditUserCase}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="auditCaseListForm">
                    <p:dataTable id="datalist" class="datalist" value="#{auditUserCaseController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{auditUserCaseController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 sortMode="single" sortOrder="descending" sortBy="#{item.uid}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}" rowIndexVar="rowIndex"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="filter" listener="#{auditUserCaseController.onFilter}" />

                        <p:column headerText="#{msg.mark}">
                            <h:outputText value="#{rowIndex + 1}"/>
                        </p:column>
                        <p:column headerText="租户" filterBy="#{item.tenantUid}" filterMatchMode="LIKE">
                            <h:outputText value="#{auditUserCaseController.getTenantName(item.tenantUid)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{auditUserCaseController.selectedTenant.uid}" filter="true" filterMatchMode="contains" autoWidth="false" style="max-width: 150px;">
                                    <p:ajax process="@this" event="change" update="siteSelect" listener="#{auditUserCaseController.setSelectTenantInfo()}"/>
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{auditUserCaseController.getAllTenant()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="院区" filterBy="#{item.siteUid}" filterMatchMode="LIKE">
                            <h:outputText value="#{auditUserCaseController.getSiteNameByUId(item.siteUid)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu id="siteSelect" onchange="PF('varDataList').filter()" filter="true" filterMatchMode="contains" autoWidth="false" style="max-width: 150px;" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{auditUserCaseController.getSiteByTenantForListPage()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="版本编号" filterBy="#{item.auditSystemCase.versionNumber}" filterMatchMode="LIKE" sortBy="#{item.auditSystemCase.versionNumber}">
                            <h:outputText value="#{item.auditSystemCase.versionNumber}"/>
                        </p:column>
                        <p:column headerText="省份" filterBy="#{item.auditSystemCase.zone}" filterMatchMode="LIKE" sortBy="#{item.auditSystemCase.zone}">
                            <h:outputText value="#{item.auditSystemCase.zone}"/>
                        </p:column>
                        <p:column headerText="版本号" filterBy="#{item.auditSystemCase.version}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.auditSystemCase.version}"/>
                        </p:column>
                        <p:column headerText="类型">
                            <h:outputText value="#{fieldMsg.fieldValue('VersionType', item.auditSystemCase.type)}"/>
                        </p:column>
                        <p:column headerText="条数量">
                            <h:outputText value="#{item.auditSystemCase.stripNum}"/>
                        </p:column>
                        <p:column headerText="款数量">
                            <h:outputText value="#{item.auditSystemCase.paymentNum}"/>
                        </p:column>
                        <p:column headerText="指标数量">
                            <h:outputText value="#{item.auditSystemCase.targetNum}"/>
                        </p:column>
                        <p:column headerText="总分值">
                            <h:outputText value="#{item.auditSystemCase.scoreNum}"/>
                        </p:column>
                        <p:column headerText="目标">
                            <h:outputText value="#{fieldMsg.fieldValue('targetType', item.targetId)}"/>
                        </p:column>
                        <p:column headerText="目标分值">
                            <h:outputText value="#{item.targetScore}"/>
                        </p:column>
                        <p:column headerText="评分方式" sortBy="#{item.auditSystemCase.judgeLogic}">
                            <h:outputText value="#{fieldMsg.fieldValue('Scoring', item.auditSystemCase.judgeLogic)}"/>
                        </p:column>
                        <p:column headerText="状态">
                            <h:outputText value="#{fieldMsg.fieldValue('auditCaseStatus', item.status)}"/>
                        </p:column>
                        <p:column headerText="是否允许下载模板">
                            <h:outputText value="#{item.allowDownload ? '是' : '否'}"/>
                        </p:column>
                        <p:column headerText="启用时间" sortBy="#{item.startTime}">
                            <h:outputText value="#{item.startTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="操作人" sortBy="#{item.updater}">
                            <h:outputText value="#{item.updater}"/>
                        </p:column>
                        <p:column headerText="更新时间" sortBy="#{item.updateTime}">
                            <h:outputText value="#{item.updateTime}">
                                <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                   locale="#{userContextService.getCalendarLocale()}"
                                                   pattern="#{userContextService.timeFormat14()}"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.Operation}" exportable="false" width="120" id="operatorColumn">
                            <h:panelGroup>
                                <p:commandButton value="#{msg.Initialize}" disabled="#{item.status == 2}" process="@this" actionListener="#{auditUserCaseController.initialize(item.uid)}" update="auditCaseListForm:datalist :growl">
                                    <p:confirm header="#{msg.InitializeConformation}" message="#{msg.InitializeConformationMsg}" icon="ui-icon-warning" />
                                </p:commandButton>
                                <br/><br/>
                                <p:commandButton value="#{msg.expired}" disabled="#{item.status == 2}" process="@this" actionListener="#{auditUserCaseController.expired(item.uid)}" update="auditCaseListForm:datalist :growl">
                                    <p:confirm header="#{msg.AuditCaseExpiredConformation}" message="#{msg.AuditCaseExpiredConformationMsg}" icon="ui-icon-warning" />
                                </p:commandButton>
                                <br/><br/>
                                <p:commandButton value="#{msg.AllowDownload}" rendered="#{!item.allowDownload}" process="@this" actionListener="#{auditUserCaseController.changeAllowDownload(item.uid, true)}" update="auditCaseListForm:datalist :growl" />
                                <p:commandButton value="#{msg.NotAllowDownload}" rendered="#{item.allowDownload}" process="@this" actionListener="#{auditUserCaseController.changeAllowDownload(item.uid, false)}" update="auditCaseListForm:datalist :growl" />
                            </h:panelGroup>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{auditUserCaseController.prepareCreate}" update=":auditCaseEditDlg" oncomplete="PF('auditCaseEditDialog').show()" />
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="省份版本管理导出"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="auditUserCaseEdit.xhtml"/>
            </div>
        </div>
    </ui:define>


</ui:composition>
