<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="auditTemplateEditDlg" widgetVar="auditTemplateEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.AuditItemConfig}" height="320" width="700">
            <h:form id="auditTemplateForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.TemplateName}*</label>
                        <p:inputText id="name" value="#{auditTemplateController.selected.name}" required="true" requiredMessage="#{msg.Mark} #{msg.ValidationRequire}" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.Mark}*</label>
                        <p:inputText id="mark" value="#{auditTemplateController.selected.mark}" required="true" requiredMessage="#{msg.Mark} #{msg.ValidationRequire}" style="width: 95%;"/>
                    </h:panelGroup>
                    <h:panelGroup id="upload" style="padding-left: 0px">
                        <h:panelGroup rendered="#{auditTemplateController.selected.fileName==null}">
                            <p:fileUpload allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|ppt|pptx|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS|PPT|PPTX)$/"
                                          fileUploadListener="#{auditTemplateController.handleFileUpload}"
                                          mode="advanced" dragDropSupport="false" style="width:95%" process="@this"
                                          multiple="false" sizeLimit="20000000"
                                          update=":auditTemplateForm:upload" auto="true"
                                          invalidSizeMessage="#{msg.invalidSizeMessage}20M" label="#{msg.Add}"/>
                        </h:panelGroup>
                        <h:panelGroup id="namepanel"
                                      rendered="#{auditTemplateController.selected.fileName!=null}">
                            <label class="label">#{msg.name}*</label>
                            <p:inputText id="fileName" value="#{auditTemplateController.selected.fileName}" style="width:50%"
                                         required="false" requiredMessage="#{msg.SelectUploadFile}" readonly="true"/>
                            <p:commandButton
                                    actionListener="#{auditTemplateController.removeAttachmentById(auditTemplateController.fileObj.id)}"
                                    id="iconOnly" update=":auditTemplateForm:upload" icon="ui-icon-clear"
                                    title="#{msg.Delete}" class="popupIconButton" process="@this">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}"
                                           icon="ui-icon-warning"/>
                            </p:commandButton>
                        </h:panelGroup>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" action="#{auditTemplateController.saveAuditTemplate}" update=":growl" icon="ui-icon-check"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('auditTemplateEditDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
