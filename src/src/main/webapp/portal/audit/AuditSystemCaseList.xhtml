<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:P="http://java.sun.com/jsf/html"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="省份版本配置列表"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="auditSystemCaseListForm">
                    <p:dataTable id="datalist" value="#{auditSystemCaseListController.lazyModel}" var="item"
                                 widgetVar="varDataList"
                                 selectionMode="single" selection="#{auditSystemCaseListController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                                 rowKey="#{item.uid}" sortMode="single" sortOrder="descending" sortBy="#{item.uid}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="createButton editButton deleteButton" listener="#{auditSystemCaseListController.onSelectAuditSystemCase()}"/>
                        <p:ajax event="filter" listener="#{auditSystemCaseListController.onFilter}" update="createButton"/>
                        <p:column headerText="版本编号"   sortBy="#{item.versionNumber}" filterBy="#{item.versionNumber}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.versionNumber}"/>
                        </p:column>

                        <p:column headerText="省份" sortBy="#{item.zone}" filterBy="#{item.zone}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.zone}"/>
                        </p:column>
                        <p:column headerText="版本号" sortBy="#{item.version}" filterBy="#{item.version}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.version}"/>
                        </p:column>
                        <p:column headerText="条数量">
                            <h:outputText value="#{item.stripNum}"/>
                        </p:column>
                        <p:column headerText="款数量"  >
                            <h:outputText value="#{item.paymentNum}"/>
                        </p:column>
                        <p:column headerText="指标数量">
                            <h:outputText value="#{item.targetNum}"/>
                        </p:column>
                        <p:column headerText="总分值" >
                            <h:outputText value="#{item.scoreNum}"/>
                        </p:column>
                        <p:column headerText="状态" sortBy="#{item.status}" >
                            <h:outputText value="#{auditSystemCaseListController.getStatusName(item.status)}"/>
                        </p:column>
                        <p:column headerText="类型" sortBy="#{item.type}">
                            <h:outputText value="#{fieldMsg.fieldValue('VersionType', item.type)}"/>
                        </p:column>
                        <p:column headerText="操作人" >
                            <h:outputText value="#{item.creator}"/>
                        </p:column>
                        <p:column headerText="更新时间" sortBy="#{item.createTime}" >
                            <h:outputText value="#{item.createTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.Actions}" style="width: 120px" >
                            <p:commandButton  value=" 过  期 "  oncomplete="PF('expiredDlg').show()" actionListener="#{auditSystemCaseListController.onCreateCopy(item)}"
                                              disabled="#{item.status eq 1 or item.status eq 3}" rendered="#{item.type eq 1}"/>
                            <br/> <br/>
                            <p:commandButton  value="创建副本" actionListener="#{auditSystemCaseListController.onCreateCopy(item)}"
                                              rendered="#{item.type eq 1}" oncomplete="PF('createCopyDlg').show()" />

                            <p:commandButton  value="初始化" actionListener="#{auditSystemCaseListController.initializeNewNode(item)}"
                                              rendered="#{item.type eq 2 and item.status eq 2}" >
                                <p:confirm header="初始化确认" message="您确定要初始化选中的数据嘛!!" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{auditSystemCaseListController.prepareCreate}" action="#{urlEncryptController.encodeUrlParam('AuditSystemCaseEdit.xhtml?actionName=Create')}"/>

                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray"
                                             title="#{msg.Edit}" actionListener="#{auditSystemCaseListController.editAction()}" disabled="#{empty auditSystemCaseListController.selected}" />
                            <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray"
                                             title="#{msg.Delete}" update="datalist"
                                             disabled="#{empty auditSystemCaseListController.selected or auditSystemCaseListController.selected.type==2}"
                                             actionListener="#{auditSystemCaseListController.deleteAction()}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                           icon="ui-icon-warning"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
            </h:form>
                <p:dialog id="expiredDlg" widgetVar="expiredDlg" modal="true" resizable="true" draggable="true"
                          header="过期" width="300" height="200">
                    <h:form id="expiredForm">
                        <h:panelGroup  >
                            <br/><br/>
                            <p>确定过期操作吗?</p>
                            <br/><br/><br/><br/>
                            <p:commandButton validateClient="true" actionListener="#{auditSystemCaseListController.listAction()}"
                                             value="过期" update="auditSystemCaseListForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'expiredDlg');"/>
                            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                             onclick="PF('expiredDlg').hide()"/>
                        </h:panelGroup>
                    </h:form>
                </p:dialog>
                <p:dialog id="createCopyDlg" widgetVar="createCopyDlg" modal="true" resizable="true" draggable="true"
                          header="创建副本" width="300" height="200">
                    <h:form id="createCopyForm">
                        <h:panelGroup  >
                            <br/><br/>
                            <p>确定创建副本吗?</p>
                            <br/><br/><br/><br/>
                            <p:commandButton validateClient="true" actionListener="#{auditSystemCaseListController.createCopy()}"
                                             value="创建" update="auditSystemCaseListForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'createCopyDlg');"/>
                            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                             onclick="PF('createCopyDlg').hide()"/>
                        </h:panelGroup>
                    </h:form>
                </p:dialog>
            </div>
        </div>
    </ui:define>
</ui:composition>
