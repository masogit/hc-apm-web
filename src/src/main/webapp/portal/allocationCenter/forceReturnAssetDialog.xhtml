<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="forceReturnAssetDialog" widgetVar="forceReturnAssetDialog" modal="true" width="400"  resizable="true" draggable="true" appendTo="@(body)" header="强制归还">
        <h:form id="forceReturnAssetDialogForm" >
            <h:panelGroup id="display1">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class='label'>请求类型*</label>
                        <p:selectOneRadio id="chargingType" required="true"  value="#{sharedAssetStockController.selected.sharedAssetReqDetail.returnRequest.type}" requiredMessage="#{msg.ValidationRequire}">
                            <f:selectItem itemLabel="维修" itemValue="1" />
                            <f:selectItem itemLabel="补登记" itemValue="2" />
                        </p:selectOneRadio>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">借用科室: </label>
                        <h:outputText value="#{sharedAssetStockController.selected.assetDeptOrg.name}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">计费开始时间*</label>
                        <p:calendar timeZone="GMT+8" id="chargingBeginTime" pattern="yyyy/MM/dd HH:mm:ss"  value="#{sharedAssetStockController.selected.sharedAssetReqDetail.chargingBeginTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="计费开始时间 #{msg.ValidationRequire}">
                            <p:ajax update=":forceReturnAssetDialogForm:chargingEndTime"/>
                        </p:calendar>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">计费结束时间*</label>
                        <p:calendar timeZone="GMT+8" id="chargingEndTime" pattern="yyyy/MM/dd HH:mm:ss"
                                    value="#{sharedAssetStockController.selected.sharedAssetReqDetail.chargingEndTime}"
                                    mindate="#{sharedAssetStockController.selected.sharedAssetReqDetail.chargingBeginTime}"
                                    maxdate="#{sharedAssetStockController.selected.sharedAssetReqDetail.chargingEndTime}"
                                    showOn="button" showButtonPanel="true" navigator="true" readonlyInput="true"
                                    locale= "zh" required="true" requiredMessage="计费结束时间 #{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">设备状态完好</label>
                        <p:selectBooleanCheckbox value="#{sharedAssetStockController.selected.sharedAssetReqDetail.intact}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">赔偿费用</label>
                        <p:inputNumber value="#{sharedAssetStockController.selected.sharedAssetReqDetail.compensationAmount}" decimalPlaces="2" emptyValue="0" minValue="0">
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea rows="3" cols="30" value="#{sharedAssetStockController.selected.sharedAssetReqDetail.reqComment}" />
                    </h:panelGroup>
                </p:panelGrid>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{sharedAssetStockController.forceReturnAsset()}" value="确认" update="sharedAssetListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'forceReturnAssetDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('forceReturnAssetDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
