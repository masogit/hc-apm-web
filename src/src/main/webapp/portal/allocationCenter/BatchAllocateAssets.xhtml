<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="设备批量借还"/>
            </div>
            <div class="ui-g 12 card">
                <p:fieldset legend="借还维护信息" style="margin-bottom:20px">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class='label'>请求类型</label>
                            <p:selectOneRadio id="chargingType" required="true" requiredMessage="#{msg.ValidationRequire}">
                                <f:selectItem itemLabel="补登记" itemValue="2" />
                                <f:selectItem itemLabel="维修借用（不收费）" itemValue="1" />
                            </p:selectOneRadio>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>创建日期</label>
                            <p:calendar id="createDate" pattern="yyyy/MM/dd" showOn="button" readonlyInput="true" showButtonPanel="true" navigator="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>下送</label>
                            <p:selectBooleanCheckbox value="" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>备注</label>
                            <p:inputTextarea id="remark" rows="1" cols="100" queryDelay="750" minQueryLength="4"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
            </div>

            <div class="ui-g 12 card">
                <p:tabView>
                    <p:tab title="批量借入">
                        <p:fieldset legend="借入明细信息" style="margin-bottom:20px">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup >
                                    <label class='label'>批量输入</label>
                                    <p:calendar  pattern="yyyy/MM/dd HH:mm"  stepMinute="30" placeholder="计费开始时间" readonlyInput="true" showOn="button" showButtonPanel="true" navigator="true" required="true"/>
                                    <p:calendar  pattern="yyyy/MM/dd HH:mm"  stepMinute="30" placeholder="计费结束时间" readonlyInput="true" showOn="button" showButtonPanel="true" navigator="true"/>
                                    <p:inputText  style="width: 100px;margin-left:10px " placeholder="设备接收人" value=""/>
                                    <p:selectOneMenu style="margin-left:40px;" id="assetDeptUid" required="true" requiredMessage="#{msg.clinicalDeptUid} #{msg.ValidationRequire}">
                                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                        <f:selectItems value="" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </p:panelGrid>
                            <h:panelGroup >
                                <p:inputText  value="" label="" placeholder="资产编号/设备编号/二维码" maxlength="100" style="width: 175px"/>
                                <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update="datalist"/>
                            </h:panelGroup>

                            <p:dataTable id="datalist" value="#{sharedAssetStockController.lazyModel}" var="asset" widgetVar="varDataList"
                                         selectionMode="single" selection="#{sharedAssetStockController.selected}"
                                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                         rowKey="#{asset.id}" sortMode="single" sortOrder="descending" sortBy="asset_dept_uid"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         rows="20" emptyMessage="#{msg.noRecordFound}"
                                         rowsPerPageTemplate="20,50,100,500" >
                            </p:dataTable>
                        </p:fieldset>
                    </p:tab>

                    <p:tab title="批量归还">
                        <p:fieldset legend="归还明细信息" style="margin-bottom:20px">
                            <p:dataTable id="datalist" value="#{assetInfoController.lazyModel}" var="asset" widgetVar="varDataList"
                                         selectionMode="single" selection="#{sharedAssetStockController.selected}"
                                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                         rowKey="#{id}" sortMode="single" sortOrder="descending" sortBy="id"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         rows="20" emptyMessage="#{msg.noRecordFound}"
                                         rowsPerPageTemplate="20,50,100,500" >
                            </p:dataTable>
                        </p:fieldset>
                    </p:tab>
                </p:tabView>
            </div>
        </div>
    </ui:define>
</ui:composition>
