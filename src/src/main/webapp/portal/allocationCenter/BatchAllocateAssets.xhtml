<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="设备批量借还"/>
            </div>

            <div class="ui-g 12 card">
                <p:tabView>
                    <p:ajax event="tabChange" listener="#{sharedAssetBatchController.onTabChange}" update="#{sharedAssetBatchController.currentTabId}"/>
                    
                    <p:tab title="批量借入" id="batchLease">
                        <p:fieldset legend="借入明细信息"
                                    style="margin-bottom:20px">
                            <h:form id="batchLeaseForm">
                                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup>
                                        <label class='label'>请求类型</label>
                                        <p:selectOneRadio id="chargingType" value="#{sharedAssetBatchController.requestType}" required="true" requiredMessage="#{msg.ValidationRequire}">
                                            <f:selectItem itemLabel="补登记" itemValue="2" />
                                            <f:selectItem itemLabel="维修借用（不收费）" itemValue="1" />
                                        </p:selectOneRadio>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class='label'>下送 </label>
                                        <!-- <p:selectBooleanCheckbox value="" /> -->
                                    </h:panelGroup>
                                    <h:panelGroup >
                                        <label class='label'>批量输入</label>
                                        <p:calendar pattern="yyyy/MM/dd HH:mm"
                                                    value="#{sharedAssetBatchController.batchChargingBeginDate}"
                                                    stepMinute="30"
                                                    placeholder="计费开始时间"
                                                    readonlyInput="true"
                                                    showOn="button"
                                                    showButtonPanel="true"
                                                    navigator="true"
                                                    required="true"/>
                                        <p:calendar pattern="yyyy/MM/dd HH:mm"
                                                    value="#{sharedAssetBatchController.batchChargingEndDate}"
                                                    stepMinute="30"
                                                    placeholder="计费结束时间"
                                                    showOn="button"
                                                    showButtonPanel="true"
                                                    navigator="true"/>
                                        <!-- <p:inputText style="width: 100px;margin-left:10px " placeholder="设备接收人" value=""/>
                                        <p:selectOneMenu style="margin-left:40px;" id="assetDeptUid" required="true" requiredMessage="#{msg.clinicalDeptUid} #{msg.ValidationRequire}">
                                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                            <f:selectItems value="" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                        </p:selectOneMenu>-->
                                    </h:panelGroup>
                                </p:panelGrid>
                                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup >
                                        <p:inputText value="#{sharedAssetBatchController.searchCriteria}"
                                                     placeholder="资产编号/设备编号/二维码"
                                                     required="true"
                                                     maxlength="100"
                                                     style="width: 175px"/>
                                        <p:commandButton style="zoom:0.8"
                                                         icon="ui-icon-search"
                                                         class="btn btn-sm btn-gray"
                                                         update="batchLeaseForm:datalist"
                                                         actionListener="#{sharedAssetBatchController.findAndSelectAsset4Lease}"/>
                                    </h:panelGroup>
                                </p:panelGrid>

                                <p:dataTable id="datalist" value="#{sharedAssetBatchController.lazyModel}" var="asset" widgetVar="varDataList"
                                             selectionMode="single" selection="#{sharedAssetBatchController.selected}"
                                             lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                                             rowKey="#{asset.id}" sortMode="single" sortOrder="descending" sortBy="#{asset.id}"
                                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                             rows="20" emptyMessage="#{msg.noRecordFound}"
                                             rowsPerPageTemplate="20,50,100,500">
                                    <p:column headerText="单据号">
                                        <h:outputText value="#{asset.departNum}"/>
                                    </p:column>
                                    <p:column headerText="设备编号">
                                        <h:outputText value="#{asset.departNum}"/>
                                    </p:column>
                                    <p:column headerText="调剂设备名称">
                                        <h:outputText value="#{asset.sharedAssetType.swapName}"/>
                                    </p:column>
                                    <p:column headerText="计费开始时间">
                                        <h:outputText value="">
                                            <f:convertDateTime pattern="yyyy/MM/dd HH:mm" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="计费结束时间">
                                        <h:outputText value="">
                                            <f:convertDateTime pattern="yyyy/MM/dd HH:mm" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="单价">
                                        <h:outputText value="#{asset.sharedAssetType.unitPrice}"/>
                                    </p:column>
                                    <p:column headerText="计价方式">
                                        <h:outputText value="#{fieldMsg.fieldValue('chargingType',asset.sharedAssetType.chargingType)}"/>
                                    </p:column>
                                </p:dataTable>

                                <p:commandButton id="confirm"
                                                 validateClient="true"
                                                 ajax="true"
                                                 oncomplete="oncomplete(xhr, status, args)"
                                                 actionListener="#{sharedAssetBatchController.batchLeaseAssets}"
                                                 value="确认"
                                                 update="batchLeaseForm:datalist">
                                    <p:confirm header="提交确认" message="您确定要提交吗" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </h:form>
                        </p:fieldset>
                    </p:tab>

                    <p:tab title="批量归还" id="batchReturn">
                        <p:fieldset legend="归还明细信息" style="margin-bottom:20px">
                            <h:form id="batchReturnForm">
                                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup>
                                        <label class='label'>请求类型</label>
                                        <p:selectOneRadio id="chargingType" value="#{sharedAssetBatchController.requestType}">
                                            <f:selectItem itemLabel="补登记" itemValue="2" />
                                            <f:selectItem itemLabel="维修借用（不收费）" itemValue="1" />
                                        </p:selectOneRadio>
                                    </h:panelGroup>
                                    <h:panelGroup >
                                        <label class='label'>批量输入</label>
                                        <p:calendar pattern="yyyy/MM/dd HH:mm"
                                                    value="#{sharedAssetBatchController.batchChargingBeginDate}"
                                                    stepMinute="30"
                                                    placeholder="计费开始时间"
                                                    readonlyInput="true"
                                                    showOn="button"
                                                    showButtonPanel="true"
                                                    navigator="true"
                                                    required="true"/>
                                        <p:calendar pattern="yyyy/MM/dd HH:mm"
                                                    value="#{sharedAssetBatchController.batchChargingEndDate}"
                                                    stepMinute="30"
                                                    placeholder="计费结束时间"
                                                    readonlyInput="true"
                                                    showOn="button"
                                                    showButtonPanel="true"
                                                    navigator="true"/>
                                        <!--<p:inputText style="width: 100px;margin-left:10px " placeholder="设备接收人" value=""/>
                                        <p:selectOneMenu style="margin-left:40px;" id="assetDeptUid" required="true" requiredMessage="#{msg.clinicalDeptUid} #{msg.ValidationRequire}">
                                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                            <f:selectItems value="" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                        </p:selectOneMenu> -->
                                    </h:panelGroup>
                                </p:panelGrid>
                                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup >
                                        <p:inputText value="#{sharedAssetBatchController.searchCriteria}" placeholder="资产编号/设备编号/二维码" maxlength="100" style="width: 175px"/>
                                        <p:commandButton style="zoom:0.8"
                                                         icon="ui-icon-search"
                                                         class="btn btn-sm btn-gray"
                                                         update="batchReturnForm:datalist"
                                                         actionListener="#{sharedAssetBatchController.findAndSelectAsset4Return}"/>
                                    </h:panelGroup>
                                </p:panelGrid>

                                <p:dataTable id="datalist" value="#{sharedAssetBatchController.lazyModel}" var="asset" widgetVar="varDataList"
                                             selectionMode="single" selection="#{sharedAssetBatchController.selected}"
                                             lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                                             rowKey="#{asset.id}" sortMode="single" sortOrder="descending" sortBy="#{asset.id}"
                                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                             rows="20" emptyMessage="#{msg.noRecordFound}"
                                             rowsPerPageTemplate="20,50,100,500">
                                    <p:column headerText="单据号">
                                        <h:outputText value="#{asset.departNum}"/>
                                    </p:column>
                                    <p:column headerText="设备编号">
                                        <h:outputText value="#{asset.departNum}"/>
                                    </p:column>
                                    <p:column headerText="调剂设备名称">
                                        <h:outputText value="#{asset.sharedAssetType.swapName}"/>
                                    </p:column>
                                    <p:column headerText="计费开始时间">
                                        <h:outputText value="">
                                            <f:convertDateTime pattern="yyyy/MM/dd HH:mm" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="计费结束时间">
                                        <h:outputText value="">
                                            <f:convertDateTime pattern="yyyy/MM/dd HH:mm" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="单价">
                                        <h:outputText value="#{asset.sharedAssetType.unitPrice}"/>
                                    </p:column>
                                    <p:column headerText="计价方式">
                                        <h:outputText value="#{fieldMsg.fieldValue('chargingType',asset.sharedAssetType.chargingType)}"/>
                                    </p:column>
                                </p:dataTable>

                                <p:commandButton id="confirm"
                                                 validateClient="true"
                                                 ajax="true"
                                                 oncomplete="oncomplete(xhr, status, args)"
                                                 actionListener="#{sharedAssetBatchController.batchReturnAssets}"
                                                 value="确认"
                                                 update="batchReturnForm:datalist">
                                    <p:confirm header="提交确认" message="您确定要提交吗" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </h:form>
                        </p:fieldset>
                    </p:tab>
                </p:tabView>
            </div>
        </div>

        <script>
            function oncomplete(xhr, status, args) {
                console.log("openForceLeaseDialog: " + args.validationFailed);
                console.log("xhr:" + xhr);
                console.log("args:" + args);
                console.log("status:" + status);
            }
        </script>

    </ui:define>
</ui:composition>
