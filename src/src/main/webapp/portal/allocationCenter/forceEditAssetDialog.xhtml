<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="forceEditAssetDialog" widgetVar="forceEditAssetDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="补录">
            <h:form id="forceEditAssetDialogForm" >
                <h:panelGroup id="display1">
                   <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">借用科室*</label>
                            <p:autoComplete id="leaseDeptName"  dropdown="true" value="#{sharedAssetStockController.leaseDeptName}"
                                            required="true" requiredMessage="借用科室 #{msg.ValidationRequire}"
                                            scrollHeight="300"  forceSelection="true" size="8"
                                            completeMethod="#{sharedAssetStockController.autoCompleteDeptName}">
                                <p:ajax process="@this" listener="#{sharedAssetStockController.onLeaseDeptNameChange}"  event="itemSelect" update="@(.borrowerUserChange)" />
                            </p:autoComplete>
                        </h:panelGroup>
                       <h:panelGroup  rendered="#{userContextService.checkRole('SharedAssetMgmt')}">
                           <label class="label">借用人*</label>
                           <p:autoComplete id="borrowerUser" widgetVar="borrowerUserWidget" dropdown="true" value="#{sharedAssetStockController.borrowerUser}"
                                           required="true" requiredMessage="借用人 #{msg.ValidationRequire}"
                                           scrollHeight="300"  forceSelection="true" size="8" var="t" itemLabel="#{t.name}" itemValue="#{t}" class="borrowerUserChange"
                                           completeMethod="#{sharedAssetStockController.autoCompleteBorrowerName}" converter="userAccountConverter">
                               <p:ajax process="@this"  event="itemSelect" />
                           </p:autoComplete>
                       </h:panelGroup>
                       <h:panelGroup rendered="#{!userContextService.checkRole('SharedAssetMgmt')}">
                           <label class="label">借用人*</label>
                           <p:inputText value="#{sharedAssetStockController.borrowerUser.name}" readonly="true"
                                        required="true" requiredMessage="床号 #{msg.ValidationRequire}"/>
                       </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">计费开始时间*</label>
                            <p:calendar timeZone="GMT+8"
                                        id="chargingBeginTime"
                                        pattern="yyyy/MM/dd HH:mm:ss"
                                        value="#{sharedAssetStockController.selected.sharedAssetReqDetail.chargingBeginTime}"
                                        showOn="button"
                                        showButtonPanel="true"
                                        navigator="true"
                                        eadonlyInput="false"
                                        locale= "zh"
                                        required="true"
                                        requiredMessage="计费开始时间 #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                   </p:panelGrid>
                   <h:panelGroup>
                        <p:commandButton validateClient="true"
                                         actionListener="#{sharedAssetStockController.forceEditAssets()}"
                                         value="确认"
                                         update="sharedAssetListForm:datalist :growl"
                                         icon="ui-icon-check"
                                         oncomplete="handleSubmit(args, 'forceEditAssetDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('forceEditAssetDialog').hide()"/>
                   </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
