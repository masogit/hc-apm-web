<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:p="http://primefaces.org/ui"
				template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12">
				<div class="ui-g-12 card cardTitle">
					<p:outputLabel class="pageTitle" value="报表中心"/>
				</div>
				<h:form id="jmReportForm">
					<p:panelGrid columns="1" layout="grid">
						<h:panelGroup>
							<p:dataTable id="datalist" value="#{jmReportController.lazyModel}" var="item" widgetVar="varDataList"
										 selectionMode="single" selection="#{jmReportController.selected}"
										 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
										 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
										 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
										 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
										 rows="20" emptyMessage="#{msg.noRecordFound}"
										 rowsPerPageTemplate="20,50,100,500">

								<p:ajax event="rowSelect" listener="#{jmReportController.onSelect}" update="addButton editButton deleteButton tenantButton"/>
								<p:ajax event="filter" listener="#{jmReportController.onFilter}" update="addButton editButton deleteButton tenantButton"/>
								<p:column headerText="报表名称" filterBy="#{item.name}" filterMatchMode="LIKE">
									<h:outputText value="#{item.name}"/>
								</p:column>
								<p:column headerText="报表描述">
									<h:outputText value="#{item.description}" />
								</p:column>
								<p:column  headerText="预览/设计" >
									<h:panelGroup>
										<p:commandLink id="viewReportButton" title="预览"   action="#{jmReportController.getViewUrl(item)}" oncomplete="PF('sidebar').show()" update="reportView">
											<p:graphicImage name="icons/find.png" style="width: 30px; height: 30px;"/>
										</p:commandLink>
									</h:panelGroup>
									<h:panelGroup rendered="#{userContextService.authContains('SuperAdmin')}">
										<p:commandLink id="editReportButton" title="设计"   action="#{jmReportController.getViewUrl(item)}" oncomplete="PF('sidebar1').show()" update="reportIndexEdit">
											<p:graphicImage name="icons/pencil.png" style="width: 30px; height: 30px;"/>
										</p:commandLink>
									</h:panelGroup>
								</p:column>
								<f:facet name="{Toolbar}">
									<p:commandButton id="addButton" title="#{msg.Create}"  icon="ui-icon-plus" class="btn btn-sm btn-gray" actionListener="#{jmReportController.prepareCreate}" rendered="#{userContextService.hasRole('SuperAdmin')}" update="@(.updateTrCls) :jmEditDlg" oncomplete="PF('jmEditDialog').show()"/>

									<p:commandButton id="editButton"  title="#{msg.Edit}"  icon="ui-icon-pencil" class="btnEdit" actionListener="#{jmReportController.prepareEdit}" update="@(.updateTrCls) :jmEditDlg" disabled="#{empty jmReportController.selected.id}" rendered="#{userContextService.hasRole('SuperAdmin')}" oncomplete="PF('jmEditDialog').show()"/>

									<p:commandButton id="tenantButton"  title="分配访问租户" icon="ui-icon-person" class="btnEdit" actionListener="#{jmReportController.prepareEdit}" update="@(.updateTrCls) :JmAssignTenantEditDlg" disabled="#{empty jmReportController.selected.id}" rendered="#{userContextService.hasRole('SuperAdmin')}" oncomplete="PF('JmAssignTenantEditDialog').show()"/>

									<p:commandButton id="deleteButton" disabled="#{empty jmReportController.selected.id}" title="#{msg.Delete}" process="@this" actionListener="#{jmReportController.delete}" update=":jmReportForm:datalist, :growl"  icon="ui-icon-close" class="delBtn" rendered="#{userContextService.hasRole('SuperAdmin')}">
										<p:confirm header="#{msg.DeleteConformation}"
												   message="确定删除该报表？"
												   icon="ui-icon-warning"/>
									</p:commandButton>
								</f:facet>
							</p:dataTable>
						</h:panelGroup>
					</p:panelGrid>
				</h:form>
				<p:panelGrid columns="1" layout="grid">
					<h:panelGroup>
						<p:sidebar id="reportView" widgetVar="sidebar" position="right" style="width: 100%;height: 90%;" >
							<h3>#{jmReportController.selected.name}预览</h3>
							<iframe src="#{jmReportController.view(1)}" style="width: 100%;height: 90%;"> </iframe>
						</p:sidebar>
					</h:panelGroup>
					<h:panelGroup>
						<p:sidebar id="reportIndexEdit" widgetVar="sidebar1" position="right" style="width: 100%;height: 90%;">
							<h3>#{jmReportController.selected.name}设计</h3>
							<iframe src="#{jmReportController.view(2)}" style="width: 100%;height: 90%;"> </iframe>
						</p:sidebar>
					</h:panelGroup>
				</p:panelGrid>
				<ui:include src="jmReportEdit.xhtml"/>
				<ui:include src="jmReportRole.xhtml"/>
				<ui:include src="jmReportAssignTenant.xhtml"/>
			</div>
		</div>
	</ui:define>
</ui:composition>
