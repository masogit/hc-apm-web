<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="JmRoleEditDlg" widgetVar="JmRoleEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.AssignRole}">
            <h:form id="UserRoleEditForm">
                <h:panelGroup id="display">
                    <p:tabView class="ui-g-12" id="tabview"  style="height: 362px; overflow: auto;" dynamic="false"   cache="false">
                        <p:tab title="#{msg.AssignRole}" class="ui-g-12" >
                            <p:panelGrid columns="2">
                                <p:outputLabel value="报表名称"/>
                                <p:outputLabel value="#{jmReportController.selected.name}"/>
                                <p:outputLabel value="报表描述"/>
                                <p:outputLabel value="#{jmReportController.selected.description}"/>

                                <p:outputLabel value="#{msg.AssignRole}" for="roleNames" />
                                <p:selectManyCheckbox id="roleNames" value="#{jmReportController.assignedRoles}" layout="pageDirection" valueChangeListener="#{jmReportController.assignRole}">
                                    <p:ajax update="@this"/>
                                    <f:selectItems value="#{jmReportController.roleListVO}" var="roleItem" itemLabel="#{userContextService.isLocale() ? roleItem.roleDesc : roleItem.roleDescEn}" itemValue="#{roleItem.name}" itemDisabled="#{roleItem.disable}" />
                                </p:selectManyCheckbox>
                            </p:panelGrid>
                        </p:tab>
                    </p:tabView>
                    <br/>
                    <p:commandButton validateClient="true" action="#{jmReportController.saveAssignRole()}" value="#{msg.Save}" update="display,:JmRoleEditDlg, :jmReportForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'JmRoleEditDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" type="button" onclick="PF('JmRoleEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
