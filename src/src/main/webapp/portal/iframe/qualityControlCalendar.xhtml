<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value=""/>
            </div>
            <div class="ui-g-12 card">
                <iframe id="chartFrame" src="" width="100%" height="900"></iframe>
            </div>
        </div>
        <script>
            window.onload = function () {
                var token = "#{userContextService.getAccessToken()}";
                localStorage.setItem("hc-apm-token", token || '#'); // # for test/dev perpose
                localStorage.setItem("hc-apm-token-expireAt", Date.now() + 8640000);
            }
            window.setTimeout(function setIframeHeight(){
                try{
                    var iframe = document.getElementById("chartFrame");
                    iframe.src="/reports/qc-calendar";
                    if(iframe.attachEvent){
                        iframe.attachEvent("onload", function(){
                            iframe.height =  iframe.contentWindow.document.documentElement.scrollHeight+200;
                        });
                        return;
                    }else{
                        iframe.onload = function(){
                            iframe.height = iframe.contentDocument.body.scrollHeight+200;
                        };
                        return;
                    }
                }catch(e){
                    throw new Error('setIframeHeight Error');
                }
            },1000);
        </script>

        <script type="text/javascript">
            //<![CDATA[
            // 监听来自 iframe 的 postMessage
            window.addEventListener("message", function (event) {
                // 安全验证：检查消息来源
                // if (event.origin !== 'https://xxxxx.com') {
                //   console.warn(event.origin);
                //   return;
                // }
                console.log("Received message:", event.data);
                // 处理导航消息
                if (event.data && event.data.type === "navigate") {
                    const targetUrl = event.data.payload.url;
                    console.log("Navigate to:", targetUrl);
                    // 在当前窗口中导航
                    window.location.href = targetUrl;
                    // 或者在新窗口中打开
                    // window.open(targetUrl, '_blank');
                }
            });
            //]]>
        </script>
    </ui:define>


</ui:composition>
