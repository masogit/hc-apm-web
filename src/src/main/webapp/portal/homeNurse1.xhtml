<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:jsf="http://xmlns.jcp.org/jsf"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                template="/WEB-INF/template-react.xhtml">

    <ui:define name="post-script">
        <h:outputScript target="body">
            window.location.hash = '/Nurse';
        </h:outputScript>
    </ui:define>
    <ui:define name="content">
        <iframe id="homeNurse" height="915px" width="100%" src=""/>
        <script>
            function init() {
                var token = "#{userContextService.getAccessToken()}";
                localStorage.setItem("hc-apm-token", token || '#'); // # for test/dev perpose
                localStorage.setItem("hc-apm-token-expireAt", Date.now() + 8640000)
                var time = new Date().getTime() + '' + Math.floor(Math.random() * 9999 + 1000);
                document.getElementById("homeNurse").src = "/reports/apm-nurse-home?t=" + time;
            }
            init();
        </script>
        <c:if test="#{userContextService.accessContainsApmFeature('AI_ASSISTANT')}">
            <div style="position: fixed;bottom: 20px;right: 20px;z-index: 9999;">
                <p:commandButton
                        value="帮助"
                        icon="pi pi-question-circle"
                        styleClass="ui-button-raised ui-button-warning"
                        onclick="PF('globalHelpDialog').show(); return false;"
                        style="box-shadow: 0 4px 8px rgba(0,0,0,0.3); border-radius: 50%; width: 56px; height: 56px; padding: 0;"
                        title="点击获取帮助" />
            </div>
        </c:if>
        <p:dialog widgetVar="globalHelpDialog" position="right bottom"  header="帮助中心" modal="false" resizable="true" draggable="true" closable="true" width="400" style="z-index: 10000;">
            <iframe id="aiAssistant" height="915px" width="100%" src="/wx/acctChatbot"/>
        </p:dialog>
    </ui:define>
</ui:composition>
