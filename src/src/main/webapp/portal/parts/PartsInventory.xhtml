<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            .warrantyCeiling {
                background-color: #ec7a06 !important;
                color: #000000!important;
            }
            .warrantyFloor {
                background-color: #f04134!important;
                color: #000000!important;
            }
            .btn+.btn { margin-left: 0 }
            .ui-column-resizer:before {content: none!important;}
            th{font-size: 12px!important;}
            td{font-size: 12px!important;padding: 0px!important;}
            table .ui-chkbox-icon, td img{ zoom: 0.7!important}
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="备件库存"/>
            </div>



            <div class="ui-g-12 card ">
                <h:form >
                    <h:panelGrid id="filterType" >
                        <h:panelGroup>
                            <p:commandButton process="@this" update="sparePartsClaimForm filterType" actionListener="#{simplePartsInventoryController.setQueryType(0)}"  rendered="true" disabled="#{simplePartsInventoryController.queryType == 0}" value="全部" />
                            <p:commandButton process="@this" update="sparePartsClaimForm filterType" actionListener="#{simplePartsInventoryController.setQueryType(1)}"  rendered="true" disabled="#{simplePartsInventoryController.queryType == 1}" value="临界上限" styleClass="warrantyCeiling"/>
                            <p:commandButton process="@this" update="sparePartsClaimForm filterType" actionListener="#{simplePartsInventoryController.setQueryType(2)}"  rendered="true" disabled="#{simplePartsInventoryController.queryType == 2}" value="临界下限" styleClass="warrantyFloor"/>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>

                <br/>
                <p:fieldset legend="备件库存">
                    <h:form id="searchFormSPInfo">
                        <h:panelGrid id="searchPanel" columns="3">
                            <p:inputText id="searchText" value="#{simplePartsInventoryController.oneSearchStr}"
                                         placeholder="备件名称"
                                         maxlength="105" style="width: 360px">
                                <p:ajax event="keyup"
                                        update=":sparePartsClaimForm:datalist1 searchButtons"/>
                            </p:inputText>

                            <h:panelGroup id='searchButtons'>
                                <p:commandButton style="zoom:0.8" icon="ui-icon-search"
                                                 class="btn btn-sm btn-gray"
                                                 update=":sparePartsClaimForm:datalist1"
                                                 rendered="#{empty simplePartsInventoryController.oneSearchStr}"/>
                                <p:commandButton style="zoom:0.8" icon="ui-icon-close"
                                                 class="btn btn-sm btn-gray"
                                                 update=":sparePartsClaimForm:datalist1"
                                                 actionListener="#{simplePartsInventoryController.searchStr}"
                                                 rendered="#{not empty simplePartsInventoryController.oneSearchStr}"/>
                            </h:panelGroup>
                        </h:panelGrid>
                    </h:form>

                    <h:form id="sparePartsClaimForm">
                        <p:dataTable id="datalist1" value="#{simplePartsInventoryController.lazyModel}" var="item"
                                     widgetVar="varDataList"
                                     rowStyleClass="#{item.warningStatus}"
                                     lazy="true" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true"
                                     rowKey="#{item.id}" sortMode="single" sortOrder="descending"
                                     sortBy="#{item.id}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="20" emptyMessage="#{msg.noRecordFound}"
                                     rowsPerPageTemplate="20,50,100,500">
                            <p:column headerText="备件名称">
                                <h:outputText value="#{item.name}"/>
                            </p:column>
                            <p:column headerText="#{msg.PartsItemCode}" rendered="#{userContextService.countyArea}">
                                <h:outputText value="#{simplePartsInventoryController.getPartsItemCode(item)}"/>
                            </p:column>
                            <p:column headerText="备件单价" rendered="#{userContextService.countyArea}">
                                <h:outputText value="#{simplePartsInventoryController.getPartsUnitPrice(item)}">
                                    <f:convertNumber maxFractionDigits="4" maxIntegerDigits="10"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="所属仓库">
                                <h:outputText
                                        value="#{simplePartsInventoryController.findWarehouseNameById(item.partsWarehouseId,null).name}"/>
                            </p:column>

                            <p:column headerText="所在仓位" rendered="#{simplePartsConfigReadController.enableWarehouseLocator}" >
                                <h:outputText
                                        value="#{simplePartsInventoryController.findLocatorName(item.partsLocatorId)}"/>
                            </p:column>

                            <p:column headerText="库存数量">
                                <h:outputText value="#{item.onhandQty}"/>
                            </p:column>
                            <p:column headerText="备件描述" rendered="#{userContextService.countyArea}">
                                <h:outputText value="#{simplePartsInventoryController.getPartsDescription(item)}"/>
                            </p:column>
                            <f:facet name="{Toolbar}">
                                <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-file-download"
                                                 class="btn btn-sm btn-gray"
                                                 ajax="false">
                                    <p:dataExporter type="xls" target="datalist1" fileName="备件库存"/>
                                </p:commandButton>
                            </f:facet>
                        </p:dataTable>
                    </h:form>
                </p:fieldset>
            </div>
        </div>
    </ui:define>
</ui:composition>
