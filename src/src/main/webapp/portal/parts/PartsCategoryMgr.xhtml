<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <div class="ui-g-12">

        <h:form id="partsGroupEditForm">

            <div class="ui-g-12 ui-lg-4">
                <div class="card" style="height:400px;">
                    <h:panelGroup>
                        <p:inputText id="retrieval" value="#{simplePartsCategoryController.retrieval}">
                        </p:inputText>
                        <p:commandButton icon="ui-icon-location-searching" validateClient="true"
                                         actionListener="#{simplePartsCategoryController.filterNode()}"
                                         update="partsGroupTree editPanel :growl"/>
                    </h:panelGroup>
                    <p:scrollPanel style="height:98%;border: 0" mode="native">
                        <p:tree id="partsGroupTree" class="tree" style="width:98%;border:0;"
                                value="#{simplePartsCategoryController.partsGroupingTree}" var="node" selectionMode="single"
                                selection="#{simplePartsCategoryController.selectedPartsGroupNodes}" highlight="true">
                            <p:ajax process="@this" event="select"
                                    listener="#{simplePartsCategoryController.onSelectTreeNode}" update="@form:editPanel"/>

                            <p:treeNode type="partsCategory">
                                <h:outputText value="#{node.name}"/>
                            </p:treeNode>
                            <p:treeNode type="hidden" rendered="false"/>
                        </p:tree>
                    </p:scrollPanel>
                </div>
            </div>

            <div class="ui-g-12 ui-lg-8">
                <div class="card" style="height:400px;">
                    <h:panelGroup id="editPanel">
                        <h:panelGrid columns="8">
                            <p:commandButton id="CreateTopLevelNode" process="@this" icon="ui-icon-plus"
                                             value="#{msg.CreateTopLevelNode}"
                                             actionListener="#{simplePartsCategoryController.prepareCreateTopLevelNode}"
                                             update="@form:editPanel"/>
                            <p:commandButton id="createNextNode" process="@this" icon="ui-icon-plus"
                                             value="#{msg.addChildNode}"
                                             actionListener="#{simplePartsCategoryController.prepareCreateNextNode}"
                                             update="@form:editPanel"/>
                            <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close"
                                             value="#{msg.Delete}"
                                             actionListener="#{simplePartsCategoryController.deleteSelectedPartsCategory}"
                                             update="@form"
                                             disabled="#{empty simplePartsCategoryController.selected or empty simplePartsCategoryController.selected.id}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                           icon="ui-icon-alert"/>
                            </p:commandButton>
                        </h:panelGrid>
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                     style="width: 70%" rendered="#{simplePartsCategoryController.selected ne null}">

                            <h:panelGroup rendered="#{simplePartsCategoryController.createTopLevelNode eq false}">
                                <label class="label" style="width: 300px">#{msg.namePath}</label>
                                <p:inputText id="nameEn" readonly="true" value="#{simplePartsCategoryController.namePath}"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.name}*</label>
                                <p:inputText id="name" value="#{simplePartsCategoryController.selected.name}" required="true"
                                             requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.I18nCode}*</label>

                                <p:inputText id="assetGroup2" readonly="#{simplePartsCategoryController.isReadOnly eq null}" required="true"
                                             value="#{simplePartsCategoryController.selected.encoded}"
                                             requiredMessage="#{msg.I18nCode} #{msg.ValidationRequire}"/>
                            </h:panelGroup>

                            <p:commandButton style="width: 90px;" validateClient="true" icon="ui-icon-check"
                                             actionListener="#{simplePartsCategoryController.saveSelectedPartsCategory}"
                                             value="#{msg.Save}" update="partsGroupTree :growl"/>
                        </p:panelGrid>
                    </h:panelGroup>
                </div>
            </div>
        </h:form>
    </div>

</ui:composition>
