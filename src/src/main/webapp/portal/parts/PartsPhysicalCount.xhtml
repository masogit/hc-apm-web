<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            div.ui-panelgrid-cell > label + div.ui-selectonemenu {
                min-width: 75px !important;
                max-width: 90%;
            }
        </style>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="备件库存盘点"/>
            </div>
            <div class="ui-g-12 card">

                <h:form id="PartsPhysicalCountForm">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">仓库选择</label>
                            <p:selectOneMenu id="FromSparePartsWarehouse" value="#{simplePartsPhysicalCountController.partsWarehouseId}"
                                             required="true" requiredMessage="仓库是必须的">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}"/>
                                <f:selectItems value="#{simplePartsPhysicalCountController.warehouseList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                                <p:ajax event="itemSelect"
                                        listener="#{simplePartsPhysicalCountController.onWarehouseChange()}" update=":PartsInventoryForm"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:form>
                <h:form id="PartsInventoryForm">
                    <p:dataTable id="datalist" value="#{simplePartsPhysicalCountController.getPartsInventoryList()}"
                                 var="item"
                                 lazy="true" paginator="true" paginatorPosition="both"
                                 paginatorAlwaysVisible="true"
                                 selectionMode="single" selection="#{simplePartsPhysicalCountController.selected}"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending"
                                 sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="rowSelect" listener="#{simplePartsPhysicalCountController.onRowSelect}"
                                />
                        <p:column headerText="仓库">
                            <h:outputText value="#{simplePartsPhysicalCountController.getWarehouseName(item.partsWarehouseId)}"/>
                        </p:column>
                        <p:column headerText="仓位" rendered="#{simplePartsConfigReadController.enableWarehouseLocator}">
                            <h:outputText value="#{simplePartsPhysicalCountController.getWarehouseLocatorName(item.partsLocatorId)}"/>
                        </p:column>
                        <p:column headerText="备件名称">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="库存数量">
                            <h:outputText value="#{item.onhandQty}"/>
                        </p:column>
                        <p:column headerText="盘点数量" exportable="false">
                            <h:panelGroup>
                                <p:inputNumber id="sparePartsNumber" value="#{item.physicalCount}" minValue="0" decimalPlaces="0" required="true"/>
                            </h:panelGroup>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-file-download"
                                             class="btn btn-sm btn-gray" ajax="false" process="@form">
                                <p:dataExporter type="xls" target="datalist"
                                                fileName="备件库存盘点"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                    <p:commandButton
                            actionListener="#{simplePartsPhysicalCountController.save()}"
                            value="批量盘点" id="confirmButton" process="@form"
                            icon="ui-icon-check" />

                </h:form>
            </div>
        </div>
    </ui:define>
    <script>
        function handleToSubmit() {
            PF('SparePartsAddDialog').hide();
        }
    </script>

</ui:composition>
