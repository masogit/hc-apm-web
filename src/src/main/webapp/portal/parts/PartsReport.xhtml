<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="备件信息报表"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="statisticsDataForm">
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">*出库开始时间</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  id="startTime_s" value="#{simplePartsReportController.startTime}"  required="true" requiredMessage="#{msg.StartTime} #{msg.ValidationRequire}" showOn="button"  showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">*出库结束时间</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  id="endTime_s" value="#{simplePartsReportController.endTime}"  required="true" requiredMessage="#{msg.EndTime} #{msg.ValidationRequire}" showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <!--<p:commandButton value="#{msg.ViewStatistics}" actionListener="#{workOrderStatisticsController.previewData()}" icon="ui-icon-arrowthick-1-s" validateClient="true" >
                            </p:commandButton>-->
                            <p:commandButton value="查看统计信息" actionListener="#{simplePartsReportController.previewData()}" icon="ui-icon-arrowthick-1-s" validateClient="true"  update=":growl :dataListForm_statistics :dataListForm_statistics:datalist_statistics">
                         </p:commandButton>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:form>

                <h:form id="dataListForm_statistics">
                    <p:dataTable id="datalist_statistics" rendered="#{not empty simplePartsReportController.simplePartsReportVoList}" value="#{simplePartsReportController.simplePartsReportVoList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:column headerText="备件号">
                            <h:outputText value="#{item.partsCode}"/>
                        </p:column>
                        <p:column headerText="备件名称">
                            <h:outputText value="#{item.partsName}"/>
                        </p:column>
                        <p:column headerText="备件描述">
                            <h:outputText value="#{item.partsDescribe}"/>
                        </p:column>
                        <p:column headerText="备件价格">
                            <h:outputText value="#{item.partsPrice}"/>
                        </p:column>
                        <p:column headerText="备件数量">
                            <h:outputText value="#{item.partQuantity}"/>
                        </p:column>
                        <p:column headerText="APM工单号">
                            <h:outputText value="#{item.workOrderNo}"/>
                        </p:column>
                        <p:column headerText="工单状态">
                            <h:outputText value="#{item.workOrderStatus}"/>
                        </p:column>
                        <p:column headerText="出库仓库">
                            <h:outputText value="#{item.outboundWarehouse}"/>
                        </p:column>
                        <p:column headerText="出库仓位">
                            <h:outputText value="#{item.outboundPosition}"/>
                        </p:column>
                        <p:column headerText="出库时间">
                            <h:outputText value="#{item.outboundDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist_statistics" fileName="parts_report_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
