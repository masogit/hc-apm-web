<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>

    <p:dialog class="partsWarehouseUserDlg" id="partsWarehouseUserDlg" widgetVar="partsWarehouseUserDlg" modal="true" width="700" height="280"  resizable="true" draggable="true" appendTo="@(body)" header="编辑仓库管理员">
        <h:form id="partsWarehouseUserForm" >
            <h:panelGroup id="display">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">所属仓库</label>
                        <p:inputText id="partsWarehouseName" class="partsWarehouseName"
                                     value="#{simplePartsWarehouseEditController.selected.name}"
                                     readonly="true" size="50"/>
                    </h:panelGroup>
                </p:panelGrid>

                <p:panelGrid id="addUser" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 80%; height: 100%" >
                       <h:panelGroup  >
                           <label class="label">管理员选择</label>
                           <p:selectCheckboxMenu id="multiple" value="#{simplePartsWarehouseUserController.selectUserAccountList}"
                                                 multiple="true" converter="userAccountConverter" filter="true" filterMatchMode="startsWith" panelStyle="width:150px;" style="width:100%;height:40px" required="true" requiredMessage="管理员不能为空">
                               <f:selectItems value="#{simplePartsWarehouseUserController.userAccountList}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
                               <p:ajax process="@this" update="partsWarehouseUserForm"/>
                           </p:selectCheckboxMenu>
                       </h:panelGroup>
                 </p:panelGrid>
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 80%; align-content: center" >
                   <h:panelGroup style="align-content: center" >
                       <p:commandButton id="okk" style="width: 90px;align-content: center" validateClient="true" value="确定"
                                        actionListener="#{simplePartsWarehouseUserController.savePartsWarehouseUser(simplePartsWarehouseUserController.selected.id)}" onclick="PF('partsWarehouseUserDlg').hide()">
                       </p:commandButton>
                   </h:panelGroup>
                </p:panelGrid>



            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
