<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>

    <p:dialog class="partsWarehouseLocatorDlg" id="partsWarehouseLocatorDlg" widgetVar="partsWarehouseLocatorDlg" modal="true" width="700" height="480"  resizable="true" draggable="true" appendTo="@(body)" header="编辑仓位配置">
        <h:form id="partsWarehouseLocatorForm" >
            <h:panelGroup id="display">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">所属仓库</label>
                        <p:inputText id="partsWarehouseName" class="partsWarehouseName"
                                     value="#{simplePartsWarehouseEditController.selected.name}"
                                     readonly="true" size="50"/>
                    </h:panelGroup>
                </p:panelGrid>

                <p:panelGrid id="orgConfig" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">仓位配置</label>
                        <p:dataTable id="locatorList" class="locatorList" value="#{simplePartsWarehouseLocatorController.getLineLocatorsWithOptionalActionRow()}" var="item" widgetVar="locatorList"
                                     lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}" rowIndexVar="rowIndex">
                            <p:column headerText="仓位名称">
                                <h:outputText value="#{item.name}" />
                            </p:column>

                            <p:column headerText="#{msg.Actions}">
                                <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{simplePartsWarehouseLocatorController.preparePartsWarehouseLocatorAdd()}" update="@(.partsWarehouseLocatorSelectDlg) :partsWarehouseLocatorSelectForm:partsWarehouseLocatorName" oncomplete="PF('partsWarehouseLocatorSelectDlg').show()" rendered="#{simplePartsWarehouseLocatorController.isLastEmptyRowInCreate(rowIndex)}"/>
                                <p:commandButton process="@this" icon="ui-icon-edit" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{simplePartsWarehouseLocatorController.preparePartsWarehouseLocatorEdit(item.id)}" update="@(.partsWarehouseLocatorSelectDlg) :partsWarehouseLocatorSelectForm:partsWarehouseLocatorName" oncomplete="PF('partsWarehouseLocatorSelectDlg').show()" rendered="#{not simplePartsWarehouseLocatorController.isLastEmptyRowInCreate(rowIndex)}"/>
                                <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{simplePartsWarehouseLocatorController.deletPartsWarehouseLocator(item.id)}" update="@(.locatorList)" rendered="#{not simplePartsWarehouseLocatorController.isLastEmptyRowInCreate(rowIndex)}">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                </p:commandButton>
                            </p:column>

                        </p:dataTable>
                    </h:panelGroup>
                </p:panelGrid>

                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 80%; align-content: center" >
                    <h:panelGroup style="align-content: center" >
                        <p:commandButton id="savePartsWarehouseLocator" style="width: 90px;align-content: center" validateClient="true" value="#{msg.Close}"
                                          onclick="PF('partsWarehouseLocatorDlg').hide()">
                        </p:commandButton>
                    </h:panelGroup>
                </p:panelGrid>
            </h:panelGroup>
        </h:form>
    </p:dialog>


    <p:dialog class="partsWarehouseLocatorSelectDlg" id="partsWarehouseLocatorSelectDlg" widgetVar="partsWarehouseLocatorSelectDlg" modal="true" width="300" height="240"  resizable="true" draggable="true" appendTo="@(body)" header="添加仓位名称">
        <h:form id="partsWarehouseLocatorSelectForm" >
            <h:panelGroup>
                <h:panelGroup>
                    <label class="label">仓位名称</label>
                    <p:inputTextarea id="partsWarehouseLocatorName" value="#{simplePartsWarehouseLocatorController.partsWareHouseLocator.name}" rows="2" cols="40" queryDelay="750" minQueryLength="4" maxlength="100"/>
                </h:panelGroup>

                <h:panelGroup>
                    <p:commandButton validateClient="true" value="确定" actionListener="#{simplePartsWarehouseLocatorController.savePartsWarehouseLocator}" process="partsWarehouseLocatorSelectForm" icon="ui-icon-check" update=":partsWarehouseLocatorForm:locatorList :growl" oncomplete="handleSubmit(args, 'partsWarehouseLocatorSelectDlg');"  />
                    <p:commandButton immediate="true" actionListener="#{simplePartsWarehouseLocatorController.cancelPartsWarehouseLocator}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'partsWarehouseLocatorSelectDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
