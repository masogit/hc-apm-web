<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>

    <p:dialog class="partsWarehouseOrgDlg" id="partsWarehouseOrgDlg" widgetVar="partsWarehouseOrgDlg" modal="true" width="700" height="480"  resizable="true" draggable="true" appendTo="@(body)" header="编辑机构配置">
        <h:form id="partsWarehouseOrgForm" >
            <h:panelGroup id="display">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">所属仓库</label>
                        <p:inputText id="partsWarehouseName" class="partsWarehouseName"
                                     value="#{simplePartsWarehouseEditController.selected.name}"
                                     readonly="true" size="50"/>
                    </h:panelGroup>
                </p:panelGrid>


                <p:panelGrid id="orgConfig" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">机构配置</label>
                        <p:dataTable id="orgConfigList" class="orgConfigList" value="#{simplePartsWarehouseOrgController.partsWareHouseOrgList}" var="item" widgetVar="orgConfigList"
                                     lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="机构名称">
                                <h:outputText value="#{item.orgName}" />
                            </p:column>
                            <p:column headerText="#{msg.Actions}">
                                <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{simplePartsWarehouseOrgController.preparePartsWarehouseOrgAdd()}" update="@(.partsWarehouseOrgSelectDlg) :partsWarehouseOrgSelectForm:orgName" oncomplete="PF('partsWarehouseOrgSelectDlg').show()" rendered="#{item.orgUid eq '000'}"/>
                                <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{simplePartsWarehouseOrgController.deletePartsWarehouseOrg(item.id)}" update="@(.orgConfigList)" rendered="#{item.orgUid ne '000'}">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>
                    </h:panelGroup>
                </p:panelGrid>

                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 80%; align-content: center" >
                    <h:panelGroup style="align-content: center" >
                        <p:commandButton id="savePartsWarehouseOrg" style="width: 90px;align-content: center" validateClient="true" value="#{msg.Close}"
                                          onclick="PF('partsWarehouseOrgDlg').hide()">
                        </p:commandButton>
                    </h:panelGroup>
                </p:panelGrid>
            </h:panelGroup>
        </h:form>
    </p:dialog>


    <p:dialog class="partsWarehouseOrgSelectDlg" id="partsWarehouseOrgSelectDlg" widgetVar="partsWarehouseOrgSelectDlg" modal="true" width="300" height="240"  resizable="true" draggable="true" appendTo="@(body)" header="添加医院机构">
        <h:form id="partsWarehouseOrgSelectForm" >
            <h:panelGroup>
                <label class="label">医院机构选择</label>
                <p:inputText id="orgName" value="#{simplePartsWarehouseOrgController.partsWareHouseOrg.orgName}"
                            required="true" readonly="true"/>
                <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down"
                                 class="btn btn-sm popupIconButton"
                                 />
                <p:overlayPanel widgetVar="varOrg" for="btnOrg" hideEffect="fade" dynamic="false"
                                style="width:300px" modal="false">
                    <p:scrollPanel style="height: 300px; border: 0;" mode="native">
                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{simplePartsWarehouseOrgController.accessOrgTree}" var="node" dynamic="true" cache="false" selectionMode="single" highlight="true">
                            <p:ajax process="@this" event="select" update=":partsWarehouseOrgSelectForm:orgName"
                                    listener="#{simplePartsWarehouseOrgController.onSelectOrgTreeNode}"
                                    oncomplete="PF('varOrg').hide();"/>
                            <p:ajax process="@this" event="expand"/>
                            <p:ajax process="@this" event="collapse"/>

                            <p:treeNode type="org" >
                                <h:outputText value="#{node.shortName}"/>
                            </p:treeNode>
                            <p:treeNode type="hidden" rendered="false"/>
                        </p:tree>

                    </p:scrollPanel>
                </p:overlayPanel>
                <br/>

                <h:panelGroup>
                    <p:commandButton validateClient="true" value="确定" actionListener="#{simplePartsWarehouseOrgController.savePartsWarehouseOrg}" process="partsWarehouseOrgSelectForm" icon="ui-icon-check" update=":partsWarehouseOrgForm:orgConfigList @(.orgConfigList) :growl" oncomplete="handleSubmit(args, 'partsWarehouseOrgSelectDlg');"  />
                    <p:commandButton immediate="true" actionListener="#{simplePartsWarehouseOrgController.cancelOrgTreeNode}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'partsWarehouseOrgSelectDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
