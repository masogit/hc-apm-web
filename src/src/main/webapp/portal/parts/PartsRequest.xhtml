<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="preRenderView">
        <f:metadata>
            <f:event type="preRenderView" listener="#{simplePartsRequestListController.preparePartsRequest}" />
        </f:metadata>
    </ui:define>

    <ui:define name="content">
        <style>
            div.ui-panelgrid-cell > label + div.ui-selectonemenu {
                min-width: 75px !important;
                max-width: 90%;
            }
        </style>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="备件申领"/>
            </div>
            <div class="ui-g-12 card">
                <p:fieldset legend="申领单列表">
                    <h:form id="searchFormSPInfo">
                        <h:panelGrid id="searchPanel" columns="3">
                            <p:inputText id="searchText" value="#{simplePartsRequestListController.oneSearchStr}"
                                         placeholder="申领单编号"
                                         maxlength="100" style="width: 360px" rendered="#{!userContextService.countyArea}">
                                <p:ajax event="keyup"
                                        update="sparePartsClaimForm searchButtons "/>
                            </p:inputText>
                            <p:inputText id="searchText2" value="#{simplePartsRequestListController.oneSearchStr}"
                                         placeholder="申领单编号/工单编号"
                                         maxlength="100" style="width: 360px" rendered="#{userContextService.countyArea}">
                                <p:ajax event="keyup"
                                        update="sparePartsClaimForm searchButtons "/>
                            </p:inputText>
                            <h:panelGroup id='searchButtons'>
                                <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray"
                                                 update="sparePartsClaimForm searchFormSPInfo"
                                                 rendered="#{empty simplePartsRequestListController.oneSearchStr}"/>
                                <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray"
                                                 update="sparePartsClaimForm searchFormSPInfo"
                                                 actionListener="#{simplePartsRequestListController.clearSearchCondition()}"
                                                 rendered="#{not empty simplePartsRequestListController.oneSearchStr}"/>
                            </h:panelGroup>
                        </h:panelGrid>
                    </h:form>
                    <h:form id="sparePartsClaimForm">
                        <p:dataTable id="datalist" value="#{simplePartsRequestListController.lazyModel}"
                                     var="item"
                                     selectionMode="single" selection="#{simplePartsRequestListController.selected}"
                                     rowKey="#{item.id}"
                                     lazy="true" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true"
                                     sortMode="single" sortOrder="descending"
                                     sortBy="#{item.createdDate}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="20" emptyMessage="#{msg.noRecordFound}"
                                     rowsPerPageTemplate="5,20,50,100,500">
                            <p:ajax event="rowSelect"
                                    listener="#{simplePartsRequestListController.onRowSelect}"
                                    update="editButton sparePartsDetailsForm deleteButton"/>
                            <p:column headerText="申领人">
                                <h:outputText value="#{simplePartsConversionController.getUserName(item.createdBy)}"/>
                            </p:column>
                            <p:column headerText="申领单编号">
                                <h:outputText value="#{item.requestCode}"/>
                            </p:column>
                            <p:column headerText="仓库" rendered="#{simplePartsConfigReadController.enableWarehouseSelectionInRequest}">
                                <h:outputText value="#{simplePartsConversionController.getWareHouseName(item.partsWarehouseId)}"/>
                            </p:column>
                            <p:column headerText="工单号">
                                <h:outputText value="#{item.maintenanceWorkOrderNumber}"/>
                            </p:column>
                            <p:column headerText="申领数量">
                                <h:outputText value="#{item.requestQty}"/>
                            </p:column>
                            <p:column headerText="申领总价">
                                <h:outputText value="#{item.totalPrice}"/>
                            </p:column>
                            <p:column headerText="申领时间" sortBy="#{item.createdDate}">
                                <f:facet name="filter">
                                    <p:inputText id="filterEndTime" widgetVar="varFilterEndTime"/>
                                </f:facet>
                                <h:outputText value="#{item.createdDate}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="审批状态">
                                <h:outputText
                                        value="#{simplePartsConversionController.partsFormStatus(item.proposerStatus,'approve')}"/>
                            </p:column>
                            <p:column headerText="出库状态">
                                <h:outputText
                                        value="#{simplePartsConversionController.partsFormStatus(item.status,'stockOut')}"/>
                            </p:column>
                            <f:facet name="{Toolbar}">
                                <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray"
                                                 title="#{msg.Create}"
                                                 actionListener="#{simplePartsRequestEditController.createPartsRequest()}"
                                                 oncomplete="PF('SparePartsRequestDialog').show()"
                                                 update="SparePartsTotalForm"/>
                                <p:commandButton id="editButton" class="btn btn-sm btn-gray" icon="ui-icon-edit"
                                                 title="#{msg.Edit}"
                                                 disabled="#{not simplePartsRequestListController.isCurrentPartsRequestEditable()}"
                                                 actionListener="#{simplePartsRequestListController.editPartsRequest()}"
                                                 oncomplete="PF('EditPartsRequestFormDialog').show()"
                                                 update="SparePartsDetailEditForm SparePartsEditForm"/>
                                <p:commandButton id="deleteButton" class="btn btn-sm btn-gray" icon="ui-icon-delete"
                                                 disabled="#{not simplePartsRequestListController.deleteCheck()}"
                                                 actionListener="#{simplePartsRequestListController.deletePartsRequset()}"
                                                 update="sparePartsClaimForm sparePartsDetailsForm :growl">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning" />
                                </p:commandButton>
                                <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-file-download"
                                                 class="btn btn-sm btn-gray"
                                                 ajax="false">
                                    <p:dataExporter type="xls" target="datalist" fileName="备件申领单"/>
                                </p:commandButton>
                            </f:facet>
                        </p:dataTable>
                    </h:form>
                </p:fieldset>
                <!-- 备件明细 start -->
                <p:fieldset legend="备件明细">
                    <h:form id="sparePartsDetailsForm">
                        <p:dataTable id="sparePartsDetailLists"
                                     value="#{simplePartsRequestListController.partsRequestLineItems}"
                                     var="item"
                                     widgetVar="varDataList"
                                     lazy="true" paginator="true" paginatorPosition="bottom"
                                     paginatorAlwaysVisible="true"
                                     rowKey="#{item.id}" sortMode="single" sortOrder="descending"
                                     sortBy="#{item.createdDate}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="20" emptyMessage="#{msg.noRecordFound}"
                                     rowsPerPageTemplate="5,20,50,100,500">

                            <p:column headerText="备件名称">
                                <h:outputText value="#{item.name}"/>
                            </p:column>
                            <p:column headerText="申领单编号">
                                <h:outputText value="#{item.requestCode}"/>
                            </p:column>
                            <p:column headerText="申领数量">
                                <h:outputText value="#{item.requestQty}"/>
                            </p:column>
                            <p:column headerText="申领单价">
                                <h:outputText value="#{item.unitPrice}"/>
                            </p:column>
                            <p:column headerText="申领总价">
                                <h:outputText value="#{item.totalPrice}"/>
                            </p:column>
                            <p:column headerText="申领时间">
                                <f:facet name="filter">
                                    <p:inputText id="filterEndTime2" widgetVar="varFilterEndTime"/>
                                </f:facet>
                                <h:outputText value="#{item.createdDate}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="出库状态">
                                <h:outputText
                                        value="#{simplePartsConversionController.partsFormStatus(item.status,'stockOut')}"/>
                            </p:column>
                            <f:facet name="{Toolbar}">
                                <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-file-download"
                                                 class="btn btn-sm btn-gray"
                                                 ajax="false">
                                    <p:dataExporter type="xls" target="sparePartsDetailLists"
                                                    fileName="申领单明细"/>
                                </p:commandButton>
                            </f:facet>
                        </p:dataTable>
                    </h:form>
                </p:fieldset>
                <!-- 备件明细 end -->
            </div>

            <p:dialog id="SparePartsRequestDialog" widgetVar="SparePartsRequestDialog" modal="true" width="1200"
                      height="600"
                      resizable="true" draggable="true" appendTo="@this" header="申领单">
                <p:fieldset legend="备件申领单信息">
                    <h:form id="SparePartsTotalForm">
                        <h:panelGroup id="SparePartsTotalSum">
                            <p:panelGrid columns="5" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                         rendered="true">
                                <h:panelGroup>
                                    <label class="label">申领单编号</label>
                                    <p:inputText id="sparePartsFromNum" name="sparePartsFromNum" readonly="true"
                                                 value="#{simplePartsRequestEditController.selected.requestCode}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">备件总数量</label>
                                    <p:inputText id="sparePartsSumNumber" name="sparePartsSumNumber" readonly="true"
                                                 value="#{simplePartsRequestEditController.getTotalCount()}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">备件总价格</label>
                                    <p:inputText id="sparePartsTotalPrice" name="sparePartsTotalPrice" readonly="true"
                                                 value="#{simplePartsRequestEditController.getTotalPrice()}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">备件申领人</label>
                                    <p:inputText id="sparePartsRequestPerson" name="sparePartsRequestPerson"
                                                 readonly="true"
                                                 value="#{currentUserAccountController.currentUserAccount.name}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">申领日期</label>
                                    <p:inputText id="sparePartsRequestDate" name="sparePartsRequestDate"
                                                 readonly="true"
                                                 value="#{currentUserAccountController.currentDateTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss"/>
                                    </p:inputText>
                                </h:panelGroup>
                            </p:panelGrid>

                        </h:panelGroup>
                    </h:form>
                </p:fieldset>
                <p:fieldset legend="备件明细">
                    <h:form id="sparePartsRequestForm">
                        <h:panelGroup rendered="#{simplePartsConfigReadController.enableWarehouseSelectionInRequest}">
                            <label class="label">备件仓库<span style="color: red;">*</span></label>
                            <p:selectOneMenu value="#{simplePartsRequestEditController.selected.partsWarehouseId}" required="true" requiredMessage="仓库是必须的" >
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems
                                        value="#{simplePartsRequestEditController.getWarehouseListInRequest()}"
                                        var="sitem" itemLabel="#{sitem.name}" itemValue="#{sitem.id}"/>
                                <p:ajax event="itemSelect" process="@this"
                                        listener="#{simplePartsRequestEditController.onWarehouseChange}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <br/>
                        <p:dataTable id="sparePartsDataList" value="#{simplePartsRequestEditController.lineItemsWithOptionalActionRow}"
                                     var="item" widgetVar="varDataList" lazy="true" paginator="true"
                                     paginatorPosition="bottom"
                                     paginatorAlwaysVisible="true" sortMode="single" sortOrder="descending"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="10" emptyMessage="#{msg.noRecordFound}"
                                     rowsPerPageTemplate="10,20,30,50"
                                     rowIndexVar="rowIndex">

                            <p:column headerText="备件名称">
                                <h:outputText value="#{item.name}"/>
                            </p:column>

                            <p:column headerText="申领数量">
                                <h:outputText value="#{item.requestQty eq 0 ? '' : item.requestQty}"/>
                            </p:column>

                            <p:column headerText="备件单价">
                                <h:outputText value="#{item.unitPrice}"/>
                            </p:column>

                            <p:column headerText="备件总价">
                                <h:outputText value="#{item.totalPrice}"/>
                            </p:column>

                            <p:column headerText="操作">
                                <p:commandButton validateClient="true"
                                                 actionListener="#{simplePartsRequestEditController.deleteCurrentPartsLineItem(item)}"
                                                 value="#{msg.Delete}" rendered="#{not simplePartsRequestEditController.isLastEmptyRowInCreate(rowIndex)}"
                                                 update=":sparePartsRequestForm:sparePartsDataList :SupplierEditForm:remainingStock :SparePartsTotalForm:sparePartsSumNumber :SparePartsTotalForm:sparePartsTotalPrice SupplierEditForm :sparePartsRequestForm:saveButton"/>
                                <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;"
                                                 title="#{msg.Create}"  action="#{simplePartsRequestEditController.initPartsRequestLineItem()}"
                                                 update="@(.selectedPartsDialog)  :SupplierEditForm"
                                                 oncomplete="PF('selectedPartsDialog').show()"
                                                 rendered="#{simplePartsRequestEditController.isLastEmptyRowInCreate(rowIndex)}"/>
                            </p:column>
                        </p:dataTable>
                        <br/>
                        <br/>
                        <p:commandButton action="#{simplePartsRequestEditController.savePartsRequest()}"
                                         validateClient="true" id="saveButton" disabled="#{not simplePartsRequestEditController.requestSubmitable}"
                                         value="#{msg.save}并提交" update=":sparePartsRequestForm:sparePartsDataList :SupplierEditForm :SparePartsTotalForm:sparePartsSumNumber :SparePartsTotalForm:sparePartsTotalPrice"

                                         icon="ui-icon-check" oncomplete="PF('SparePartsAddDialog').hide()"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                         validateClient="true"
                                         onclick="PF('SparePartsAddDialog').hide()"
                                         update=":sparePartsRequestForm:sparePartsDataList :SupplierEditForm:display :SparePartsTotalForm:sparePartsSumNumber :SparePartsTotalForm:sparePartsTotalPrice"
                                         action="#{simplePartsRequestEditController.removeLineItem()}"/>
                    </h:form>
                </p:fieldset>
            </p:dialog>

            <p:dialog id="selectedPartsDialog" widgetVar="selectedPartsDialog" modal="true" width="1200"
                      height="300"
                      resizable="true" draggable="true" appendTo="@this" header="选择申领备件">
                <p:fieldset legend="申领备件">
                    <h:form id="SupplierEditForm">
                        <h:panelGroup id="display">
                            <p:panelGrid columns="6" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                         rendered="true">
                                <h:panelGroup>
                                    <label class="label">备件名称 <span style="color: red;"> *</span></label>
                                    <p:autoComplete id="sparePartName" dropdown="true" inputStyle="width: 160px"
                                                    readonly="false" forceSelection="true"
                                                    onfocus="#{simplePartsConfigReadController.setPartsWarehouseId(simplePartsRequestEditController.selected.partsWarehouseId)}"
                                                    value="#{simplePartsRequestEditController.newLineItem.partsItem}"
                                                    completeMethod="#{simplePartsConfigReadController.getPartsItemListInInventory}"
                                                    var="item" itemLabel="#{item.name}" required="true" requiredMessage="备件选择 #{msg.ValidationRequire}"
                                                    itemValue="#{item}"
                                                    converter="simplePartsItemConverter">
                                        <p:ajax event="itemSelect" process="@this"
                                                listener="#{simplePartsRequestEditController.onPartsItemChange}"
                                                update="@(.sparePartsInfo) unitPrice remainingStock"/>
                                    </p:autoComplete>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">申领数量 <span style="color: red;"> *</span></label>
                                    <p:inputText id="requestQty" name="requestQty" placeholder="申领数量" required="true" requiredMessage="请输入申领数量"
                                                 value="#{simplePartsRequestEditController.newLineItem.requestQty}"
                                                 onkeyup="if(this.value.length==1){this.value=this.value.replace(/[^1-9]/g,'')}else{this.value=this.value.replace(/\D/g,'')}" onafterpaste="if(this.value.length==1){this.value=this.value.replace(/[^1-9]/g,'')}else{this.value=this.value.replace(/\D/g,'')}">
                                        <p:ajax event="blur" update="confirmButton"/>
                                    </p:inputText>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">备件单价</label>
                                    <p:inputNumber id="unitPrice" name="unitPrice" placeholder="备件单价" readonly="true"
                                                 value="#{simplePartsRequestEditController.newLineItem.unitPrice}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">所剩库存</label>
                                    <p:inputText id="remainingStock" name="remainingStock" placeholder="剩余库存"
                                                 readonly="true"
                                                 value="#{simplePartsRequestEditController.newLineItem.partsItemValue.inStockNum}"/>
                                </h:panelGroup>
                            </p:panelGrid>
                            <p:commandButton
                                    actionListener="#{simplePartsRequestEditController.addSelectedPartsToRequest()}"
                                    value="#{msg.Confirm}"
                                    update=":sparePartsRequestForm:sparePartsDataList :SupplierEditForm :SparePartsTotalForm:sparePartsSumNumber :SparePartsTotalForm:sparePartsTotalPrice :SupplierEditForm:sparePartName :sparePartsRequestForm:saveButton"
                                    icon="ui-icon-check" disabled="#{not simplePartsRequestEditController.selectedPartsInputValid}"
                                    id="confirmButton" oncomplete="PF('selectedPartsDialog').hide()" />
                            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                             onclick="PF('selectedPartsDialog').hide()"
                                             update="SupplierEditForm"/>
                        </h:panelGroup>
                    </h:form>
                </p:fieldset>
            </p:dialog>

            <!-- 修改Dialog -->
            <p:dialog id="EditPartsRequestFormDialog" widgetVar="EditPartsRequestFormDialog" modal="true" width="1200"
                      height="600"
                      resizable="true" draggable="true" appendTo="@this" header="修改申领单">
                <p:fieldset legend="申领单信息">
                    <h:form id="SparePartsEditForm">
                        <h:panelGroup id="EditForm">
                            <p:panelGrid columns="5" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                         rendered="true">
                                <h:panelGroup>
                                    <label class="label">申领单编号</label>
                                    <p:inputText id="viewSparePartsFromNum" name="viewSparePartsFromNum" readonly="true"
                                                 value="#{simplePartsRequestEditController.selected.requestCode}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">备件总数量</label>
                                    <p:inputText id="viewSparePartsSumNumber" name="sparePartsSumNumber" readonly="true"
                                                 value="#{simplePartsRequestEditController.getTotalCount()}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">备件总价格</label>
                                    <p:inputText id="viewSparePartsTotalPrice" name="viewSparePartsTotalPrice"
                                                 readonly="true"
                                                 value="#{simplePartsRequestEditController.getTotalPrice()}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">备件申领人</label>
                                    <p:inputText id="viewSparePartsRequestPerson" name="viewSparePartsRequestPerson"
                                                 readonly="true"
                                                 value="#{simplePartsConversionController.getUserName(simplePartsRequestEditController.selected.createdBy)}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">申领日期</label>
                                    <p:inputText id="viewSparePartsRequestDate" name="viewSparePartsRequestDate"
                                                 readonly="true"
                                                 value="#{simplePartsRequestEditController.selected.createdDate}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss"/>
                                    </p:inputText>
                                </h:panelGroup>
                            </p:panelGrid>
                        </h:panelGroup>
                    </h:form>
                </p:fieldset>
                <p:fieldset legend="备件详情修改">
                    <h:form id="SparePartsDetailEditForm">
                        <h:panelGroup rendered="#{simplePartsConfigReadController.enableWarehouseSelectionInRequest}">
                            <label class="label">备件仓库<span style="color: red;">*</span></label>
                            <p:selectOneMenu value="#{simplePartsRequestEditController.selected.partsWarehouseId}" required="true" requiredMessage="仓库是必须的">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems
                                        value="#{simplePartsRequestEditController.getWarehouseListInRequest()}"
                                        var="sitem" itemLabel="#{sitem.name}" itemValue="#{sitem.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <br/>
                        <p:dataTable id="DetailEditForm" var="item"
                                     value="#{simplePartsRequestEditController.lineItemsWithOptionalActionRow}"
                                     editable="true" style="margin-bottom:20px;">

                            <p:ajax event="rowEdit" listener="#{simplePartsRequestEditController.onRowEdit}"
                                    update=":SparePartsDetailEditForm:DetailEditForm SparePartsEditForm :sparePartsClaimForm:datalist :sparePartsDetailsForm:sparePartsDetailLists"/>

                            <p:ajax event="rowEditCancel" listener="#{simplePartsRequestEditController.onRowCancel}"
                                    update=":SparePartsDetailEditForm:DetailEditForm :sparePartsDetailsForm:sparePartsDetailLists"/>

                            <p:column headerText="备件名称">
                                <p:cellEditor>
                                    <f:facet name="output"><h:outputText value="#{item.name}"/></f:facet>
                                    <f:facet name="input"><p:inputText id="name" value="#{item.name}" readonly="true"/></f:facet>
                                </p:cellEditor>
                            </p:column>

                            <p:column headerText="备件申请数量">
                                <p:cellEditor>
                                    <f:facet name="output"><h:outputText value="#{item.getRequestQtyAsObject()}"/></f:facet>
                                    <f:facet name="input">
                                        <p:inputNumber id="partsRequestQty" value="#{item.requestQty}" requiredMessage="备件申请数量不能为空" padControl="false"
                                               required="true" onkeyup="if(this.value.length==1){this.value=this.value.replace(/[^1-9]/g,'')}else{this.value=this.value.replace(/\D/g,'')}" onafterpaste="if(this.value.length==1){this.value=this.value.replace(/[^1-9]/g,'')}else{this.value=this.value.replace(/\D/g,'')}">
                                            <p:ajax event="blur"
                                                    listener="#{simplePartsRequestEditController.validateRequestQty(item.partsItemId,item.requestQty)}"/>
                                        </p:inputNumber>
                                    </f:facet>
                                </p:cellEditor>
                            </p:column>

                            <p:column headerText="备件单价">
                                <p:cellEditor>
                                    <f:facet name="output"><h:outputText value="#{item.unitPrice}"/></f:facet>
                                    <f:facet name="input"><p:inputText id="partsUnitPrice"
                                                                       value="#{item.unitPrice}" readonly="true"/></f:facet>
                                </p:cellEditor>
                            </p:column>

                            <p:column headerText="操作" style="width:60px">
                                <p:rowEditor/>
                            </p:column>
                        </p:dataTable>
                        <p:commandButton
                                validateClient="true"
                                action="#{simplePartsRequestEditController.savePartsRequest()}"
                                value="再次提交" oncomplete="PF('EditPartsRequestFormDialog').hide()"
                                update=":SparePartsDetailEditForm:DetailEditForm SparePartsEditForm :sparePartsClaimForm:datalist :sparePartsDetailsForm:sparePartsDetailLists"
                                icon="ui-icon-check" />
                    </h:form>
                </p:fieldset>
            </p:dialog>
        </div>
    </ui:define>
</ui:composition>
