<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="备件仓库"/>
            </div>
            <div class="ui-g-12 card ">
                <p:fieldset legend="备件仓库">
                    <h:form id="basicListForm">
                        <p:dataTable id="datalist" value="#{simplePartsWarehouseListController.lazyModel}"
                                     var="item" lazy="true" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true"
                                     selectionMode="single" selection="#{simplePartsWarehouseListController.selected}"
                                     rowKey="#{item.id}" sortMode="single" sortOrder="descending"
                                     sortBy="#{item.createdDate}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="20" emptyMessage="#{msg.noRecordFound}"
                                     rowsPerPageTemplate="20,30,50,80">

                            <p:ajax event="rowSelect" update="@(.delBtn) @(.btnEdit)"
                                    listener="#{simplePartsWarehouseListController.onselectItem}"/>

                            <!-- 仓库名称 -->
                            <p:column headerText="仓库名称">
                                <h:outputText value="#{item.name}"/>
                            </p:column>

                            <!-- 所属院区 -->
                            <p:column headerText="所属院区">
                                <h:outputText value="#{orgInfoPathController.getOrgFullPathByOrgUid(item.siteUid)}"/>
                            </p:column>

                            <!-- 仓库状态 -->
                            <p:column headerText="仓库状态">
                                <h:outputText value="#{simplePartsConversionController.getWarehouseStatusName(item.status)}"/>
                            </p:column>

                            <!-- 创建时间 -->
                            <p:column headerText="创建时间">
                                <h:outputText value="#{item.createdDate}"/>
                            </p:column>

                            <!-- 创建人 -->
                            <p:column headerText="仓库创建人">
                                <h:outputText value="#{simplePartsConversionController.getUserName(item.createdBy)}"/>
                            </p:column>

                            <f:facet name="{Toolbar}">
                                <p:commandButton id="createButton" icon="ui-icon-plus"
                                                 class="btn btn-sm btn-gray"
                                                 actionListener="#{simplePartsWarehouseEditController.preparePartsWarehouseAdd()}"
                                                 title="#{msg.Create}"
                                                 oncomplete="PF('partsWarehouseDialog').show()"/>

                                <p:commandButton id="editButton" icon="ui-icon-pencil" class="btnEdit" disabled="#{empty simplePartsWarehouseEditController.selected}"
                                                 title="#{msg.Edit}" actionListener="#{simplePartsWarehouseEditController.preparePartsWarehouseEdit()}" update=":partsWarehouseEditDialog"
                                                 rendered="true" validateClient="true" oncomplete="PF('partsWarehouseEditDialog').show()" />

                                <p:commandButton validateClient="true"
                                                 disabled="#{empty simplePartsWarehouseOrgController.selected}"
                                                 actionListener="#{simplePartsWarehouseOrgController.initPartsWarehouseOrg(simplePartsWarehouseOrgController.selected.id)}"
                                                 title="编辑机构配置"  icon="fa fa-cogs"
                                                 rendered="true"   class="btnEdit"
                                                 update="partsWarehouseOrgForm"
                                                 oncomplete="PF('partsWarehouseOrgDlg').show()"/>

                                <p:commandButton validateClient="true"
                                                 disabled="#{empty simplePartsWarehouseUserController.selected}"
                                                 actionListener="#{simplePartsWarehouseUserController.initAddPartsWarehouseUser(simplePartsWarehouseUserController.selected.id)}"
                                                 title="编辑管理员" icon="fa fa-user-plus" class="btnEdit"
                                                 rendered="true" update="partsWarehouseUserForm"
                                                 oncomplete="PF('partsWarehouseUserDlg').show()"/>

                                <p:commandButton validateClient="true"
                                                 actionListener="#{simplePartsWarehouseLocatorController.initPartsWarehouseLocator(simplePartsWarehouseLocatorController.selected.id)}"
                                                 disabled="#{empty simplePartsWarehouseLocatorController.selected or simplePartsConfigReadController.isEnableWarehouseLocator() == false}"
                                                 title="编辑仓位" icon="fa fa-align-justify"
                                                 class="btnEdit" rendered="true"
                                                 update="partsWarehouseLocatorForm"
                                                 oncomplete="PF('partsWarehouseLocatorDlg').show()"/>

                                <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-file-download"
                                                 class="btn btn-sm btn-gray"
                                                 ajax="false">
                                    <p:dataExporter type="xls" target="datalist" fileName="备件仓库"/>
                                </p:commandButton>
                            </f:facet>

                        </p:dataTable>

                    </h:form>
                </p:fieldset>
            </div>

            <!-- 新增备件仓库 -->
            <p:dialog id="partsWarehouseDialog" widgetVar="partsWarehouseDialog" modal="true" resizable="true"
                      draggable="true" appendTo="@(body)" header="新增备件仓库">
                <h:form id="basicEditForm">
                    <h:panelGroup id="display">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">仓库所属</label>
                                <p:inputText id="selectedUserOrgName" class="selectedUserOrgName"
                                             value="#{orgInfoPathController.getOrgFullPathByOrgInfo(simplePartsWarehouseEditController.selectedUserOrg)}"
                                             readonly="true" required="true" size="50"/>
                                <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down"
                                                 style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                                <p:overlayPanel id="panelOrg4User" my="right top" widgetVar="varPanelOrg4User"
                                                for="btnOrg4User" hideEffect="fade" dynamic="false"
                                                class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                                    <p:inputText id="treeNodeNameFilter2" class="treeNodeNameFilter"
                                                 value="#{simplePartsWarehouseEditController.treeNodeNameFilter}"/>
                                    <p:commandButton partialSubmit="true" icon="ui-icon-search"
                                                     process="@(.treeNodeNameFilter) @this"
                                                     update="@(.orgTree) @(.treeNodeNameFilter)"
                                                     actionListener="#{simplePartsWarehouseEditController.filterTreeNode()}"
                                                     value="#{msg.Search2}"/>
                                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                                        <p:tree id="orgTree4User" class="orgTree" style="width:98%;border:0;"
                                                value="#{simplePartsWarehouseEditController.enableOrgTree}"
                                                selection="#{simplePartsWarehouseEditController.selectedNode}" var="node"
                                                selectionMode="single">
                                            <p:ajax process="@this" event="select" update="@(.selectedUserOrgName)"
                                                    listener="#{simplePartsWarehouseEditController.onSelectOrgForUser}"
                                                    oncomplete="PF('varPanelOrg4User').hide();"/>
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>

                                            <p:treeNode type="org">
                                                <h:outputText value="#{node.shortName}"/>
                                            </p:treeNode>
                                            <p:treeNode type="hidden" rendered="false"/>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                     style="min-width: 500px;">
                            <h:panelGroup>
                                <label class="label">仓库名称 <span style="color: red;">*</span></label>
                                <p:inputText id="warehouseName"
                                             value="#{simplePartsWarehouseEditController.partsWarehouse.name}"
                                             required="true"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <p:outputLabel for="status" value="仓库状态:" />
                                <p:selectOneRadio id="status" value="#{simplePartsWarehouseEditController.partsWarehouse.status}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="启用" itemValue="1"/>
                                    <f:selectItem itemLabel="禁用" itemValue="0" />
                                </p:selectOneRadio>
                            </h:panelGroup>

                        </p:panelGrid>
                        <br/>
                        <p:commandButton validateClient="true"
                                         action="#{simplePartsWarehouseEditController.saveWarehouse()}"
                                         value="#{msg.Save}"
                                         icon="ui-icon-check"
                                         oncomplete="handleSubmit(args, 'partsWarehouseDialog');"/>


                        <p:commandButton immediate="true" value="#{msg.Cancel}" type="button" icon="ui-icon-cancel"
                                         onclick="PF('partsWarehouseDialog').hide()"
                                         update=":basicListForm"/>
                    </h:panelGroup>
                </h:form>
            </p:dialog>
            <ui:include src="PartsWarehouseUser.xhtml"/>
            <ui:include src="PartsWarehouseOrg.xhtml"/>
            <ui:include src="PartsWarehouseLocator.xhtml"/>
            <ui:include src="PartsWarehouseEdit.xhtml"/>

        </div>
    </ui:define>
</ui:composition>
