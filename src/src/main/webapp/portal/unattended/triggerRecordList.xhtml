<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="无人值守-报警记录"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="triggerRecordForm">
                    <p:dataTable id="datalist" class="datalist" value="#{triggerRecordController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{triggerRecordController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="filter" listener="#{triggerRecordController.onFilter}" />

                        <p:column headerText="门ID" filterBy="#{item.doorId}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.doorId}"/>
                        </p:column>
                        <p:column headerText="#{msg.rfId}" filterBy="#{item.rfId}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.rfId}"/>
                        </p:column>
                        <p:column headerText="报警时间" sortBy="#{item.dateTime}" filterBy="#{item.dateTime}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterDateTime" widgetVar="varFilterDateTime" value="#{assetInfoListController.lastInventoryDateFormatTime}"/>
                            </f:facet>
                            <h:outputText value="#{item.dateTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="方向" filterBy="#{item.direction}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()">
                                    <f:selectItem itemLabel="#{msg.All}" itemValue="" />
                                    <f:selectItem itemLabel="出库" itemValue="out" />
                                    <f:selectItem itemLabel="入库" itemValue="in" />
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.direction eq 'in' ?'入库':'出库'}"/>
                        </p:column>
                        <p:column headerText="#{msg.status}"  filterBy="#{item.status}" filterMatchMode="EQ" >
                                <f:facet name="filter">
                                    <p:selectOneMenu onchange="PF('varDataList').filter()">
                                        <f:selectItem itemLabel="#{msg.All}" itemValue="" />
                                        <f:selectItem itemLabel="发送失败" itemValue="0" />
                                        <f:selectItem itemLabel="发送成功" itemValue="1" />
                                        <f:selectItem itemLabel="重新发送" itemValue="2" />
                                    </p:selectOneMenu>
                                </f:facet>
                            <h:outputText value="#{item.status eq 0?'发送失败':item.status eq 1?'发送成功':'重新发送'}"/>
                        </p:column>
                        <p:column headerText="账户">
                            <h:outputText value="#{item.account}"/>
                        </p:column>
                        <p:column headerText="创建时间" sortBy="#{item.createdDate}">
                            <h:outputText value="#{item.createdDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="修改时间" sortBy="#{item.lastModifiedDate}">
                            <h:outputText value="#{item.lastModifiedDate}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                    <p:overlayPanel appendTo="triggerRecordForm" id="idPanelFilterDateTime" widgetVar="panelFilterDateTime" for=":triggerRecordForm:datalist:filterDateTime" dismissable="false" >
                        <h:panelGrid columns="2">
                            <p:outputLabel value="#{msg.From}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varLastInventoryDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                            <p:outputLabel value="#{msg.To}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varLastInventoryDateTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        </h:panelGrid>
                        <p:commandButton onclick="setDateFilter('varDataList', 'varFilterDateTime', 'varLastInventoryDateFrom', 'varLastInventoryDateTo'); PF('panelFilterDateTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                        <p:commandButton onclick="PF('panelFilterDateTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                    </p:overlayPanel>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
