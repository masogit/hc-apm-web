<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="newTransactionDlg" widgetVar="newTransactionDlg" width="600" height="280" modal="true" resizable="true" draggable="true" appendTo="@this" header="事务">
        <h:form id="newDefTranManForm" class="wokao">
            <h:panelGroup class="newTrFormGrNew" id="display" >
                <p:panelGrid  columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup >
                        <label class="label">事务名称*</label>
                        <p:selectOneMenu  value="#{depTranDetailController.tmCategory}"  autoWidth="false" style="max-width: 150px;" height="200">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('transaction')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">开始时间*</label>
                        <p:calendar  timeZone="GMT+8" id="fillDate" pattern="yyyy/MM/dd"  value="#{depTranDetailController.startTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="开始时间#{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class ="label">工时</label>
                        <p:inputText id="hours" value="#{depTranDetailController.hours}" required="true" requiredMessage="工时 #{msg.ValidationRequire}"/>
                    </h:panelGroup>


                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea id="comment" value="#{depTranDetailController.remark}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4" maxlength="100"/>
                    </h:panelGroup>
                </p:panelGrid>
            </h:panelGroup>
           <h:panelGroup >
            <p:commandButton   validateClient="true" actionListener="#{depTranDetailController.createTransaction()}" process="newDefTranManForm" value="创建" update="deptTransactionForm:tranTabView:trDetailFormNew:datalist :growl"  icon="ui-icon-check" oncomplete="handleSubmit(args, 'newTransactionDlg');">
            </p:commandButton>
           </h:panelGroup>
            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('depTranDetailController').hide()">
            </p:commandButton>
        </h:form>

    </p:dialog>

    <!-- 更新科务记录-->
    <p:dialog id="updateTransactionDlg" widgetVar="updateTransactionDlg" width="600" height="280" modal="true" resizable="true" draggable="true" appendTo="@this" header="事务">
        <h:form id="updateDefTranManForm" class="updateTrCls">
            <h:panelGroup class="newTrFormGrNew" id="display2" >
                <p:panelGrid  columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup >
                        <label class="label">事务名称*</label>
                        <p:selectOneMenu  value="#{depTranDetailController.tmCategory}"  autoWidth="false" style="max-width: 150px;" height="200">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('transaction')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">开始时间*</label>
                        <p:calendar  timeZone="GMT+8" id="fillDate2" pattern="yyyy/MM/dd"  value="#{depTranDetailController.startTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="开始时间#{msg.ValidationRequire}"></p:calendar>


                    </h:panelGroup>
                    <h:panelGroup>
                        <label class ="label">工时</label>
                        <p:inputText id="hours2" value="#{depTranDetailController.hours}" required="true" requiredMessage="工时 #{msg.ValidationRequire}"/>
                    </h:panelGroup>


                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea id="comment2" value="#{depTranDetailController.remark}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4" maxlength="100"/>
                    </h:panelGroup>
                </p:panelGrid>
            </h:panelGroup>
            <h:panelGroup >
                <p:commandButton   validateClient="true" actionListener="#{depTranDetailController.locUpdateTransactionbyLink()}" process="updateDefTranManForm" value="保存" update="deptTransactionForm:tranTabView:trDetailFormNew:datalist :growl"  icon="ui-icon-check" oncomplete="handleSubmit(args, 'updateTransactionDlg');">
                </p:commandButton>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('depTranDetailController').hide()">
                </p:commandButton>
            </h:panelGroup>

        </h:form>

    </p:dialog>



</ui:composition>
</html>
