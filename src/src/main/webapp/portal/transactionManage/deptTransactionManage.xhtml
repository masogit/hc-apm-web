<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template-polymer.xhtml">
    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="科务管理"/>
            </div>
            <div class="ui-g-12 card" id="d1">

                <h:form id="deptTransactionForm">
                    <p:fieldset legend="科务汇总" rendered="#{userContextService.hasRole('AssetHead')}">
                    <p:panelGrid columns="3"  layout="grid" styleClass="ui-panelgrid-blank form-group">
                       <!-- <h:panelGroup>
                            <label class="label">开始时间*</label>
                            <p:calendar  timeZone="GMT+8" id="fillDate" pattern="yyyy/MM/dd" value="#{depTranSummaryController.startTime}"  showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh"></p:calendar>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">结束时间*</label>
                            <p:calendar timeZone="GMT+8" id="fillDate1" value="#{depTranSummaryController.endTime}" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh"  requiredMessage="结束时间 #{msg.ValidationRequire}"></p:calendar>
                        </h:panelGroup>
                         <p:commandButton value="查询"  update="datalist" actionListener="#{depTranSummaryController.searchRange()}" />
                        -->
                        <h:panelGroup>
                            <label class="label">月份查询*</label>
                            <p:calendar  timeZone="GMT+8" id="fillDate" pattern="yyyy/MM/dd" value="#{depTranSummaryController.startTime}"  showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh"></p:calendar>
                        </h:panelGroup>
                        <p:commandButton value="查询"  update="@(.dt)" actionListener="#{depTranSummaryController.searchTheMonth()}" />
                    </p:panelGrid>

                    <h:panelGroup rendered="#{userContextService.hasRole('AssetHead')}" >
                        <!-- paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true" sortMode="single" sortOrder="descending"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="20"  emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500"-->
                    <p:dataTable id="datalist"
                                 class="dt"
                                 var="item"
                                 selectionMode="single"  value="#{depTranSummaryController.summaryTraList}"
                                 selection="#{depTranSummaryController.transactionStatis}" rowKey="#{item.authorName}-#{item.hours}-#{item.startYear}-#{item.startMonth}" >
                        <p:ajax event="rowSelect"   listener="#{depTranSummaryController.onSelectSummary(depTranDetailController)}" update=":deptTransactionForm:tranTabView:trDetailFormNew:datalist"/>
                        <p:column headerText="姓名">
                            <h:outputText value="#{item.authorName}"/>
                        </p:column>
                        <p:column headerText="月份">
                            <h:outputText value="#{depTranSummaryController.getCurrentMonth()}"/>
                        </p:column>
                        <p:column headerText="科务工时">
                            <h:outputText value="#{item.hours}">
                                <f:convertNumber pattern="0.0" minFractionDigits="1"></f:convertNumber>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="科室">
                            <h:outputText value="#{item.clinicalDepName}">
                            </h:outputText>
                        </p:column>
                     </p:dataTable>
                    </h:panelGroup>
                    </p:fieldset>

                    <h:panelGroup id="x1id" class="x1" rendered="true">
                        <div class="ui-g-12">
                            <p:tabView rendered="true" class="ui-g-12 x2" id="tranTabView" dynamic="false" cache="false" activeIndex="#{depTranSummaryController.queryTab}" binding="#{depTranSummaryController.tabView}">
                                <p:tab    class="ui-g-12" title="科务详情">
                                    <ui:include src="depTranlogDetailList.xhtml"/>
                                </p:tab>

                            </p:tabView>
                        </div>
                    </h:panelGroup>
                </h:form>

            </div>


        </div>
    </ui:define>
</ui:composition>
