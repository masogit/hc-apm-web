<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <style>
        table.checkboxGroup tr td:nth-child(2)  {
            text-align: left;
        }
    </style>
    <p:dialog id="transactionManageDlg" widgetVar="transactionManageDlg" width="600" height="280" modal="true" resizable="true" draggable="true" appendTo="@this" header="新增事务">
        <h:form id="newTranManForm">
            <h:panelGroup id="display">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                  <!--  <h:panelGroup>
                        <label class ="label">事务名称</label>
                        <p:inputText id="tName" value="#{transactionManageController.selected.name}" required="true" requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>
                    </h:panelGroup>-->
                    <h:panelGroup >
                        <label class="label">事务名称*</label>
                        <p:selectOneMenu value="#{transactionManageController.deptTransactionCategory}" required="false" filter="true" var="t" converter="transactionConverter" requiredMessage="事务#{msg.ValidationRequire}">
                            <p:ajax event="itemSelect" listener="#{transactionManageController.onSelectTM()}"></p:ajax>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{transactionManageController.getTranManList()}" var="item" itemLabel="#{item.name}" itemValue="#{item}"/>
                            <p:column>
                                <h:outputText value="#{t.name}"/>
                            </p:column>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">开始时间*</label>
                        <p:calendar  timeZone="GMT+8" id="fillDate" pattern="yyyy/MM/dd"  value="#{transactionManageController.selected.startTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="开始时间#{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">结束时间*</label>
                        <p:calendar timeZone="GMT+8" id="fillDate1" pattern="yyyy/MM/dd"  value="#{transactionManageController.selected.endTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh"  requiredMessage="结束时间 #{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                </p:panelGrid>
            </h:panelGroup>

            <p:commandButton validateClient="true" actionListener="#{transactionManageController.saveTranMan()}" value="#{msg.Save}" update=":transactionManageForm:datalist,:newTranManForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'transactionManageDlg');"/>
            &nbsp;&nbsp;
            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('transactionManageDlg').hide()"/>
        </h:form>

    </p:dialog>
</ui:composition>
</html>
