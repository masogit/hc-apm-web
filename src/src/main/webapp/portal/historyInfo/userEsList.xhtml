<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">


    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value=" #{msg.userModifyRecord}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="userListForm">

                    <p:dataTable id="datalist"
                                 value="#{userAccountEsHistoryController.lazyModel}"
                                 var="item"
                                 widgetVar="varDataList"
                                 selectionMode="single"
                                 selection="#{userAccountEsHistoryController.selected}"
                                 lazy="true"
                                 paginator="true"
                                 paginatorPosition="both"
                                 paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}"
                                 sortMode="single"
                                 sortOrder="descending"
                                 sortBy="#{item.createdDate}"
                                 paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20"
                                 emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="filter" listener="#{userAccountEsHistoryController.onFilter}"/>

                        <p:column headerText="#{msg.loginName}" filterBy="#{item.loginName}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.loginName}"/>
                        </p:column>

                        <p:column headerText="#{msg.name}" filterBy="#{item.name}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>

                        <p:column headerText="#{msg.orgName}" filterBy="#{item.orgName}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.orgName}"/>
                        </p:column>


                        <p:column headerText="#{msg.telephone}" filterBy="#{item.telephone}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.telephone}"/>
                        </p:column>

                        <p:column headerText="#{msg.email}" filterBy="#{item.email}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.email}"/>
                        </p:column>

                        <p:column headerText="#{msg.operationType}"
                                  filterBy="#{item.operationType}"
                                  filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{userAccountEsHistoryController.historyActionList}" var="action"
                                                   itemLabel="#{action.label}" itemValue="#{action.value}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.operationType}"/>
                        </p:column>

                        <p:column headerText="#{msg.modifiedBy}" filterBy="#{item.createdBy}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.createdBy}"/>
                        </p:column>
                        <p:column headerText="#{msg.modifiedTime}" sortBy="#{item.createdDate}" filterBy="#{item.createdDate}" filterMatchMode="GTE" >
                            <f:facet name="filter">
                                <p:inputText id="filterCreatedDate" widgetVar="varFilterCreatedDate" value="#{userAccountEsHistoryController.filterObject['purchaseDate']}" />
                            </f:facet>
                            <h:outputText value="#{item.createdDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.comment}"
                                  filterBy="#{item.comment}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.comment}"/>
                        </p:column>

                        <p:column headerText="#{msg.isActive}" filterBy="#{item.isActive}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.isActive}"/>
                        </p:column>

                        <p:column headerText="#{msg.isLocked}"
                                  filterBy="#{item.isLocked}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.isLocked}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s"
                                             class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="userHistory_export"/>
                            </p:commandButton>
                        </f:facet>

                    </p:dataTable>
                </h:form>
                <p:overlayPanel id="panelFilterCreatedDate" widgetVar="panelFilterCreatedDate"
                                for=":userListForm:datalist:filterCreatedDate" dismissable="false">
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}" />
                        <p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_CreateDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false"
                                    navigator="true" mask="true" size="12" locale="zh" />
                        <p:outputLabel value="#{msg.To}" />
                        <p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_CreateDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false"
                                    navigator="true" mask="true" size="12" locale="zh" />
                    </h:panelGrid>
                    <p:commandButton
                            onclick="setDateFilter('varDataList','varFilterCreatedDate','varStartTimeFrom_CreateDate','varStartTimeTo_CreateDate'); PF('panelFilterCreatedDate').hide();"
                            title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
                    <p:commandButton onclick="PF('panelFilterCreatedDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button"
                                     style="zoom: 0.8;" />
                </p:overlayPanel>
            </div>
        </div>

    </ui:define>

</ui:composition>
