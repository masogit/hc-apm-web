<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <script type="text/javascript" src="#{wechatUtilService.getContextPath()}/resources/js/jquery.jplayer.min.js"/>
        <script type="text/javascript" src="https://unpkg.com/viewerjs@1.9.0/dist/viewer.min.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/viewerjs@1.9.0/dist/viewer.min.css"/>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="年度申购修改"/>
            </div>

            <div class="ui-g-12 card ">
                <h:form id="PurchaseInfoEditForm">
                    <p:growl id="msgs" showDetail="true" skipDetailIfEqualsSummary="true"/>
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.PurchaseYear}<span style="color:red"></span></label>
                            <p:inputText id="purchaseYear" value="#{yearPurchaseInfoController.selected.purchaseYear}" required="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.functionType}<span style="color:red"></span></label>
                            <p:inputText id="functionType" value="#{yearPurchaseInfoController.selected.functionType}" required="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.preventiveMaintenanceAnalysis_deviceName}<span style="color:red"></span></label>
                            <p:inputText id="productName" value="#{yearPurchaseInfoController.selected.assetName}" required="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.quantity}<span style="color:red"></span></label>
                            <p:inputText id="quantity" value="#{yearPurchaseInfoController.selected.quantity}" requiredMessage="#{msg.ComponentTypeNumber}" required="true">
                                <f:validateDoubleRange minimum="0.01" />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.BudgetAmount}<span style="color:red" ></span></label>
                            <p:inputText id="budgetAmount" value="#{yearPurchaseInfoController.selected.budgetAmount}" requiredMessage="#{msg.ComponentTypeNumber}" required="true">
                                <f:validateDoubleRange minimum="0.01" />
                            </p:inputText>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup id="buttonGroup">
                            <p:commandButton value="#{msg.Save}" icon="ui-icon-check" action="#{yearPurchaseInfoController.save()}" validateClient="true" update=":PurchaseInfoEditForm" style="float:left" />
                            <p:commandButton value="#{msg.Cancel}" icon="ui-icon-cancel"  action="YearList?faces-redirect=true" immediate="true" style="float:left"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
