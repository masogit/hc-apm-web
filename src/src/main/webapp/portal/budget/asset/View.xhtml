<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<ui:composition>

    <p:dialog id="BudgetAssetViewDlg" widgetVar="BudgetAssetViewDialog" modal="true" resizable="true"
              draggable="true" appendTo="@(body)" width="1000"
              header="#{budgetAssetController.CRUDActionName}#{msg.Blank}#{msg.BudgetAsset}">
        <h:form id="BudgetAssetViewForm">
            <h:panelGroup id="display">
                <p:panelGrid id="searchPanel" columns="4" layout="grid"
                             styleClass="ui-panelgrid-blank form-group">
                    <!--<h:panelGroup>
                        <label class="label">#{msg.ProductNumber}</label>
                        <p:outputLabel value="#{budgetAssetController.selected.financingNum}"/>
                    </h:panelGroup>-->

                    <h:panelGroup>
                        <label class="label">#{msg.clinicaldepart}</label>
                        <p:outputLabel value="#{budgetAssetController.selected.dept.name}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EquipmentName}</label>
                        <p:outputLabel value="#{budgetAssetController.selected.name}"/>
                    </h:panelGroup>
                   <!-- <h:panelGroup>
                        <label class="label">#{msg.AssetGroup}</label>
                        <p:outputLabel
                                value="#{fieldMsg.fieldValue('assetGroup', budgetAssetController.selected.assetGroup)}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{budgetAssetController.show('assetGroupSecondary')}">
                        <label class="label">#{msg.AssetGroupSecondary}</label>
                        <p:outputLabel
                                value="#{fieldMsg.fieldValue('assetGroupSecondary_'.concat(budgetAssetController.selected.assetGroup), budgetAssetController.selected.assetGroupSecondary)}"/>
                    </h:panelGroup>-->
                    <h:panelGroup>
                        <label class="label">设备品类</label>
                        <p:outputLabel value="#{budgetAssetController.selected.applicationAssetCategory}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">推荐#{msg.AssetBrand}</label>
                        <p:outputLabel value="#{budgetAssetController.selected.assetBrand}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">型号</label>
                        <p:outputLabel value="#{budgetAssetController.selected.assetModel}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">规格</label>
                        <p:outputLabel value="#{budgetAssetController.selected.standards}"/>
                    </h:panelGroup>
                   <!-- <h:panelGroup>
                        <label class="label">#{msg.Unit}</label>
                        <p:outputLabel value="#{budgetAssetController.selected.unit}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.Price}</label>
                        <h:outputText value="#{budgetAssetController.selected.price}">
                            <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                        </h:outputText>
                    </h:panelGroup>-->
                </p:panelGrid>

                <br/>
                <p:commandButton rendered="#{budgetAssetController.deleteAction}"
                                 actionListener="#{budgetAssetController.delete}" value="#{msg.Delete}"
                                 update="display :BudgetAssetViewDlg assetList :growl"
                                 oncomplete="handleSubmit(args, 'BudgetAssetViewDialog');"/>
                <p:commandButton immediate="true" value="#{msg.Close}"
                                 onclick="PF('BudgetAssetViewDialog').hide()"/>

            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
