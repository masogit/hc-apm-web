<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            .zoom-06 {
                zoom: 0.6;
            }

            .zoom-08 {
                zoom: 0.8;
            }

            .wrap-text {
                word-break: break-word;
                word-wrap: break-word;
                white-space: normal;
            }

            .width-pct-100 {
                min-width: 50% !important;
                max-width: 100% !important;
            }
        </style>

        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.BudgetAsset}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <p:fieldset legend="#{msg.AdvancedSearch}">
                        <p:panelGrid id="searchPanel" columns="4" layout="grid"
                                     styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.clinicaldepart}</label>
                                <p:inputText id="dept" readonly="true"
                                             value="#{budgetAssetController.searchForm.dept}"/>
                                <p:commandButton id="org" process="@this" icon="fa fa-angle-down"
                                                 class="btn btn-sm popupIconButton"/>
                                <p:overlayPanel id="popupPanel" widgetVar="varOrg" for="org" hideEffect="fade"
                                                style="position: absolute; left: 0; top: 0; width: 300px;"
                                                dynamic="false" modal="false" dismissable="true">
                                    <p:scrollPanel style="height:300px; border: 0" mode="native">
                                        <p:tree id="orgTree" value="#{budgetAssetController.orgTree}" var="node"
                                                selectionMode="single" class="tree" style="width:98%; border:0">
                                            <p:ajax process="@this" event="select" update="searchForm:dept"
                                                    listener="#{budgetAssetController.onSearchTreeNode}"
                                                    oncomplete="PF('varOrg').hide();"/>
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>
                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.AssetGroup}</label>
                                <p:selectOneMenu value="#{budgetAssetController.searchForm.assetGroup}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"
                                                   itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    <p:ajax event="change" listener="#{budgetAssetController.onBudgetAssetGroupChange}"
                                            update="@this assetGroupSecondary"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{budgetAssetController.show('assetGroupSecondary')}">
                                <p:outputLabel class="label">#{msg.AssetGroupSecondary}</p:outputLabel>
                                <p:selectOneMenu id="assetGroupSecondary"
                                                 value="#{budgetAssetController.searchForm.assetGroupSecondary}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{budgetAssetController.budgetAssetGroupSecondaryList}"
                                                   var="item"
                                                   itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label" value="#{msg.EquipmentName}"/>
                                <p:inputText value="#{budgetAssetController.searchForm.assetName}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">#{msg.AssetBrand}</p:outputLabel>
                                <p:inputText value="#{budgetAssetController.searchForm.assetBrand}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.EquipmentModel}</label>
                                <p:inputText value="#{budgetAssetController.searchForm.assetModel}"/>
                            </h:panelGroup>
                            <h:panelGroup style="display: flex;">
                                <p:commandButton value="#{msg.Search}"
                                                 actionListener="#{budgetAssetController.search}"
                                                 update="assetList"/>
                                <p:commandButton value="#{msg.Reset}"
                                                 actionListener="#{budgetAssetController.resetSearch}"
                                                 update="searchForm assetList"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                </h:form>

                <h:form id="assetList">
                    <p:dataTable id="datalist" value="#{budgetAssetController.lazyModel}" var="item"
                                 widgetVar="varDataList"
                                 selectionMode="single" selection="#{budgetAssetController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending"
                                 sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="10" pageLinks="5" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="10,20,50">

                        <p:ajax event="rowSelect" update="createButton editButton viewButton deleteButton"/>
                        <p:ajax event="filter" listener="#{budgetAssetController.onFilter}"
                                update="createButton editButton viewButton deleteButton"/>

                        <p:column headerText="#{msg.ProductNumber}">
                            <h:outputText value="#{item.financingNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.EquipmentName}">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.clinicaldepart}">
                            <h:outputText value="#{item.dept.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.AssetGroup}">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup', item.assetGroup)}"/>
                        </p:column>
                        <p:column headerText="#{msg.AssetGroupSecondary}"
                                  rendered="#{budgetAssetController.show('assetGroupSecondary')}">
                            <h:outputText
                                    value="#{fieldMsg.fieldValue('assetGroupSecondary_'.concat(item.assetGroup), item.assetGroupSecondary)}"/>
                        </p:column>
                        <p:column headerText="#{msg.AssetBrand}">
                            <h:outputText value="#{item.assetBrand}"/>
                        </p:column>
                        <p:column headerText="#{msg.EquipmentModel}">
                            <h:outputText value="#{item.assetModel}"/>
                        </p:column>
                        <p:column headerText="#{msg.Unit}">
                            <h:outputText value="#{item.unit}"/>
                        </p:column>
                        <p:column headerText="#{msg.Price}">
                            <h:outputText value="#{item.price}">
                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray"
                                             title="#{msg.Create}"
                                             actionListener="#{budgetAssetController.prepareCreate}"
                                             update=":BudgetAssetEditDlg"
                                             oncomplete="PF('BudgetAssetEditDialog').show()"
                                             disabled="#{userContextService.hasNotAnyRole('AssetHead,DeptHead,ClinicalStaff')}"/>
                            <p:commandButton id="viewButton" icon="ui-icon-search" class="btn btn-sm btn-gray"
                                             title="#{msg.View}"
                                             actionListener="#{budgetAssetController.prepareView}"
                                             update=":BudgetAssetViewDlg"
                                             oncomplete="PF('BudgetAssetViewDialog').show()"
                                             rendered="false"
                                             disabled="#{empty budgetAssetController.selected}"/>
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray"
                                             title="#{msg.Edit}"
                                             actionListener="#{budgetAssetController.prepareEdit}"
                                             update=":BudgetAssetEditDlg"
                                             oncomplete="PF('BudgetAssetEditDialog').show()"
                                             disabled="#{empty budgetAssetController.selected}"/>
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s"
                                             class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="BudgetAsset_export"/>
                            </p:commandButton>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash" class="btn btn-sm btn-gray"
                                             title="#{msg.Delete}"
                                             actionListener="#{budgetAssetController.prepareDelete}"
                                             update=":BudgetAssetViewDlg"
                                             oncomplete="PF('BudgetAssetViewDialog').show()"
                                             disabled="#{empty budgetAssetController.selected}"/>
                        </f:facet>
                    </p:dataTable>

                </h:form>

                <ui:include src="Edit.xhtml"/>
                <ui:include src="View.xhtml"/>
            </div>
        </div>

    </ui:define>

</ui:composition>
