<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="BudgetApplicationSelectDlg" widgetVar="BudgetApplicationSelectDlg" modal="true" resizable="false"
              draggable="true" appendTo="@(body)" width="960" height="560"
              header="选择设备">
       <h:form id="applicationSearchForm">
            <p:fieldset legend="#{msg.searchAsset}">
                <p:panelGrid id="applicationSearchPanel" columns="3" layout="grid"
                             styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.ApplicationDept}</label>
                        <p:inputText id="dept" readonly="true"
                                     value="#{purchaseOrderController.assetSearchForm.dept}"/>
                        <p:commandButton id="org" process="@this" icon="fa fa-angle-down"
                                         class="btn btn-sm popupIconButton"/>
                        <p:overlayPanel id="popupPanel" widgetVar="varOrg" for="org" hideEffect="fade"
                                        style="position: absolute; left: 0; top: 0; width: 300px;"
                                        dynamic="false" modal="false" dismissable="true">
                            <p:scrollPanel style="height:300px; border: 0" mode="native">
                                <p:tree id="orgTree" value="#{purchaseOrderController.orgTree}" var="node"
                                        selectionMode="single" class="tree" style="width:98%; border:0">
                                    <p:ajax process="@this" event="select" update="applicationSearchForm:dept"
                                            listener="#{purchaseOrderController.onSearchTreeNode}"
                                            oncomplete="PF('varOrg').hide();"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label" value="申请编号"/>
                        <p:inputText value="#{purchaseOrderController.assetSearchForm.applicationNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label" value="#{msg.EquipmentName}"/>
                        <p:inputText value="#{purchaseOrderController.assetSearchForm.assetName}"/>
                    </h:panelGroup>
                   <h:panelGroup>
                      <p:outputLabel class="label">推荐品牌</p:outputLabel>
                      <p:inputText value="#{purchaseOrderController.assetSearchForm.assetBrand}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">规格</p:outputLabel>
                        <p:inputText value="#{purchaseOrderController.assetSearchForm.standards}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">型号</p:outputLabel>
                        <p:inputText value="#{purchaseOrderController.assetSearchForm.assetModel}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">设备品类</p:outputLabel>
                        <p:inputText value="#{purchaseOrderController.assetSearchForm.applicationAssetCategory}"/>
                    </h:panelGroup>
                    <h:panelGroup style="display: flex;">
                        <p:commandButton value="#{msg.Search}"
                                         actionListener="#{purchaseOrderController.searchBudgetApplication}"
                                         update="ApplicationSelectForm"/>
                        <p:commandButton value="#{msg.Reset}"
                                         actionListener="#{purchaseOrderController.resetAssetSearch}"
                                         update="ApplicationSelectForm applicationSearchForm"/>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
        </h:form>
        <h:form id="ApplicationSelectForm">
            <p:dataTable id="assetDatalist" value="#{purchaseOrderController.optionalBudgetApplications}" var="item" widgetVar="varAssetDatalist"
                         lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" selection="#{purchaseOrderController.selectApplicationBudgetAssets}"
                         paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5,10,20">
                <p:column selectionMode="multiple">
                </p:column>
                <p:column headerText="申请科室">
                    <h:outputText value="#{item.budgetApplication.applicationDept.name}"/>
                </p:column>
                <p:column headerText="申请编号">
                    <h:outputText value="#{item.applicationNum}"/>
                </p:column>
                <p:column headerText="#{msg.EquipmentName}">
                    <h:outputText value="#{item.applicationAssetName}"/>
                </p:column>
                <p:column headerText="推荐品牌">
                    <h:outputText value="#{item.recommendedBrand}"/>
                </p:column>
                <p:column headerText="规格">
                    <h:outputText value="#{item.standards}"/>
                </p:column>
                <p:column headerText="型号">
                    <h:outputText value="#{item.model}"/>
                </p:column>
                <p:column headerText="设备品类">
                    <h:outputText value="#{item.applicationAssetCategory}"/>
                </p:column>
                <p:column headerText="数量">
                    <h:outputText value="#{item.applicationQuantity}"/>
                </p:column>
                <p:column headerText="单位">
                    <h:outputText value="#{item.unit}"/>
                </p:column>
                <p:column headerText="预算单价">
                    <h:outputText value="#{item.applicationPrice}"/>
                </p:column>
                <p:column headerText="预算总价">
                    <h:outputText value="#{item.applicationAmount}"/>
                </p:column>
            </p:dataTable>
            <br/>
            <p:commandButton validateClient="true" actionListener="#{purchaseOrderController.addBudgetAsset}"
                             value="确定"
                             update=":BudgetApplicationSelectDlg, PurchaseApplicationEditForm, :growl"
                             oncomplete="handleSubmit(args, 'BudgetApplicationSelectDlg');"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}"
                             onclick="PF('BudgetApplicationSelectDlg').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
