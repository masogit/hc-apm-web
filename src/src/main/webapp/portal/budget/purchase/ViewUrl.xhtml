<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="viewUrlDlg" widgetVar="viewUrlDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="采购单Url" >
        <h:form id="viewUrlForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <span class="label" id="purchseUrl">#{purchaseOrderController.getPurchaseUrl()}</span>
                </h:panelGroup>
            </p:panelGrid>
            <br/>
             <p:commandButton value="点此复制" onclick="copyText()" oncomplete="PF('viewUrlDlg').hide()"/>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
