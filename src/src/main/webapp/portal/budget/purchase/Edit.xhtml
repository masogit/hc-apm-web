                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="采购单管理"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="BudgetApplicationEditForm">
                <h:panelGroup id="display">
                    <p:fieldset legend="采购详情">

                                     styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{purchaseOrderController.selected != null}">
                            <h:panelGroup>
                                <p:outputLabel class="label">采购编号</p:outputLabel>
                                <h:outputText value="#{purchaseOrderController.selected.purchaseNum}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">采购数量</p:outputLabel>
                                <h:outputText value="#{purchaseOrderController.selected.purchaseQuantity}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">采购金额</p:outputLabel>
                                <h:outputText value="#{purchaseOrderController.selected.totalPrice}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                                </h:outputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">采购单申请时间</p:outputLabel>
                                <h:outputText value="#{purchaseOrderController.selected.createdDate}">
                                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                       locale="#{userContextService.getCalendarLocale()}"
                                                       pattern="#{userContextService.timeFormat14()}"/>
                                </h:outputText>
                            </h:panelGroup>
                            <!--
                            <h:panelGroup >
                                <label class="label">院区</label>
                                <h:outputText value="#{purchaseOrderController.selected.courtyardArea}"/>
                            </h:panelGroup>-->

                                                selectionMode="single" class="tree" style="width:98%; border:0"  >

                                                    update=":BudgetApplicationEditForm @parent:dept "
                                                    listener="#{purchaseOrderController.onSelectTreeNode}"
                                                    oncomplete="PF('varOrgEdit').hide();" />
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>

                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>-->
                    <!--    <h:panelGroup>
                            <label class="label">病区代码<span style="color: red">*</span></label>

                            <p:inputText disabled="#{purchaseOrderController.curModelDisables() or purchaseOrderController.selected.applicationStep eq 'PendingComplete'}" value="#{purchaseOrderController.selected.wardCode}" required="true" requiredMessage="病区代码 #{msg.ValidationRequire}" />

                            </h:panelGroup>-->
                        <!--    <h:panelGroup>
                                <p:outputLabel class="label">#{msg.Applicant}</p:outputLabel>
                                <h:outputText value="#{purchaseOrderController.selected.applicant.name}"/>
                            </h:panelGroup>-->
                           <!-- <h:panelGroup>
                                <p:outputLabel class="label">#{msg.ApplicationDate}</p:outputLabel>
                                <h:outputText value="#{purchaseOrderController.selected.applicationDate}">
                                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                       locale="#{userContextService.getCalendarLocale()}"
                                                       pattern="#{userContextService.timeFormat14()}"/>
                                </h:outputText>
                            </h:panelGroup>-->
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="申购单信息" id="applicationDetail" >
                        <p:dataTable id="budgetApplicationlist" value="#{purchaseOrderController.curApplicationBudgetAssets}"
                                     var="item" widgetVar="varbudgetAssetDatalist" lazy="true" paginator="true"
                                     selection="#{purchaseOrderController.dataListSelectApplicationAssetBudget}"
                                     selectionMode="single"
                                     paginatorPosition="top" paginatorAlwaysVisible="true" rowKey="#{item.id}"
                                     sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5">
                            <p:ajax event="rowSelect" update="delButton"/>
                            <p:column headerText="申请科室">
                                <h:outputText value="#{item.budgetApplication.applicationDept.name}"/>
                            </p:column>
                            <p:column headerText="申请编号">
                                <h:outputText value="#{item.applicationNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.EquipmentName}">
                                <h:outputText value="#{item.applicationAssetName}"/>
                            </p:column>
                            <p:column headerText="推荐品牌">
                                <h:outputText value="#{item.recommendedBrand}"/>
                            </p:column>
                            <p:column headerText="规格">
                                <h:outputText value="#{item.standards}"/>
                            </p:column>
                            <p:column headerText="型号">
                                <h:outputText value="#{item.model}"/>
                            </p:column>
                            <p:column headerText="设备品类">
                                <h:outputText value="#{item.applicationAssetCategory}"/>
                            </p:column>
                            <p:column headerText="数量">
                                <h:outputText value="#{item.applicationQuantity}"/>
                            </p:column>
                            <p:column headerText="单位">
                                <h:outputText value="#{item.unit}"/>
                            </p:column>
                            <p:column headerText="预算单价">
                                <h:outputText value="#{item.applicationPrice}"/>
                            </p:column>
                            <p:column headerText="预算总价">
                                <h:outputText value="#{item.applicationAmount}"/>
                            </p:column>
                         <f:facet name="{Toolbar}">
                             <p:commandButton title="选择申购单" id="addButton" update="BudgetSelectDlg"
                                              icon="ui-icon-plus" class="btn btn-sm btn-gray zoom-08"
                                              actionListener="#{purchaseOrderController.preAddBudgetApplication()}"
                                              oncomplete="PF('BudgetSelectDialog').show()"/>
                             <p:commandButton title="删除" id="delButton" update="budgetApplicationlist BudgetApplicationEditForm:savePurchase"
                                              disabled="#{empty purchaseOrderController.dataListSelectApplicationAssetBudget}"
                                              icon="ui-icon-close" class="btn btn-sm btn-gray zoom-08"
                                              actionListener="#{purchaseOrderController.delBudgetApplication()}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"  icon="ui-icon-alert"/>
                             </p:commandButton>
                         </f:facet>
                     </p:dataTable>
                    </p:fieldset>
                    <br/>
                    <p:commandButton update=":growl :BudgetApplicationEditForm"
                                     validateClient="true" disabled="#{empty purchaseOrderController.curApplicationBudgetAssets}"
                                     action="#{purchaseOrderController.savePurchase}" value="保存" id="savePurchase" />
                    <p:commandButton update=":growl :BudgetApplicationEditForm" immediate="false" process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back"
                                     action="#{purchaseOrderController.backList}" />
                </h:panelGroup>

            </h:form>
        </div>
        <div class="ui-g-12 card">
            <ui:include src="BudgetSelect.xhtml"/>
        </div>
    </ui:define>
</ui:composition>
