<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <style>
            .zoom-06 {
                zoom: 0.6;
            }

            .zoom-08 {
                zoom: 0.8;
            }

            .wrap-text {
                word-break: break-word;
                word-wrap: break-word;
                white-space: normal;
            }

            .width-pct-100 {
                min-width: 50% !important;
                max-width: 100% !important;
            }
        </style>

        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="采购管理"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <p:fieldset legend="#{msg.AdvancedSearch}">
                        <p:panelGrid id="searchPanel" columns="4" layout="grid"
                                     styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <p:outputLabel class="label" value="采购单编号"/>
                                <p:inputText value="#{purchaseOrderController.searchForm.purchaseNum}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label" value="操作日期(#{msg.From})"/>
                                <p:calendar mode="popup" showOn="button"
                                            value="#{purchaseOrderController.searchForm.dateStart}"
                                            timeZone="#{userContextService.getTimeZone()}"
                                            pattern="#{userContextService.timeFormat()}"
                                            locale="#{userContextService.getCalendarLocale()}"
                                            readonlyInput="true" showButtonPanel="true"
                                            navigator="true" mask="true">
                                    <p:ajax event="dateSelect" update="@this"/>
                                </p:calendar>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label" value="操作日期(#{msg.To})"/>
                                <p:calendar mode="popup" showOn="button"
                                            value="#{purchaseOrderController.searchForm.dateEnd}"
                                            timeZone="#{userContextService.getTimeZone()}"
                                            pattern="#{userContextService.timeFormat()}"
                                            locale="#{userContextService.getCalendarLocale()}"
                                            readonlyInput="true" showButtonPanel="true"
                                            navigator="true" mask="true">
                                    <p:ajax event="dateSelect" update="@this"/>
                                </p:calendar>
                            </h:panelGroup>
                         <h:panelGroup style="display: flex;">
                                <p:commandButton value="#{msg.Search}"
                                                 actionListener="#{purchaseOrderController.search}"
                                                 update="datalist"/>
                                <p:commandButton value="#{msg.Reset}"
                                                 actionListener="#{purchaseOrderController.resetSearch}"
                                                 update="searchForm datalist"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:dataTable id="datalist" value="#{purchaseOrderController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{purchaseOrderController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="10" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="10,20,50">
                        <p:ajax event="rowSelect" update="createButton editButton deleteButton exportZipButton"/>
                        <p:ajax event="rowDblselect" listener="#{purchaseOrderController.doubleClick}" oncomplete="openViewWindow(xhr, status, args)"/>
                        <p:column headerText="采购单号" >
                            <h:outputText value="#{item.purchaseNum}"/>
                        </p:column>
                        <p:column headerText="设备名称" >
                            <h:outputText value="#{item.applicationAssetName}"/>
                        </p:column>
                        <p:column headerText="采购数量" >
                            <h:outputText value="#{item.purchaseQuantity}"/>
                        </p:column>
                        <p:column headerText="采购金额" >
                            <h:outputText value="#{item.totalPrice}">
                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="操作日期" >
                            <h:outputText value="#{item.createdDate}">
                                <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                   locale="#{userContextService.getCalendarLocale()}"
                                                   pattern="#{userContextService.timeFormat14()}"/>
                            </h:outputText>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray"
                                             title="#{msg.Create}"
                                             action="#{purchaseOrderController.intoCreateModel}"/>
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray"
                                             title="#{msg.Edit}"
                                             action="#{purchaseOrderController.intoEditModel}"
                                             disabled="#{empty purchaseOrderController.selected }"/>
                            <p:commandButton  title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray"
                                              ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="Purchase_Export"/>
                            </p:commandButton>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash" class="btn btn-sm btn-gray" update="datalist" title="#{msg.Delete}"
                                             disabled="#{empty purchaseOrderController.selected}" actionListener="#{purchaseOrderController.delete}"  >
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                            <p:commandButton id="exportZipButton" ajax="false" title="下载压缩文件" actionListener="#{purchaseOrderController.exportAll}"
                                             disabled="#{empty purchaseOrderController.selected}"
                                             icon="ui-icon-circle-triangle-s" class="btn btn-sm btn-gray">
                                <p:fileDownload value="#{purchaseOrderController.exportFile}"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>

                </h:form>


            </div>
        </div>
        <script>
            function openViewWindow(xhr, status, args) {
                window.document.body.innerHTML = '加载中...';
                window.location.href = args.url;
            }
        </script>
    </ui:define>

</ui:composition>
