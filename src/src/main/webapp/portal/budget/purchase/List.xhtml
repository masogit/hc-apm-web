<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <style>
            .zoom-06 {
                zoom: 0.6;
            }

            .zoom-08 {
                zoom: 0.8;
            }

            .wrap-text {
                word-break: break-word;
                word-wrap: break-word;
                white-space: normal;
            }

            .width-pct-100 {
                min-width: 50% !important;
                max-width: 100% !important;
            }
        </style>

        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="采购管理"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <p:fieldset legend="#{msg.AdvancedSearch}">
                        <p:panelGrid id="searchPanel" columns="4" layout="grid"
                                     styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <p:outputLabel class="label" value="采购单编号"/>
                                <p:inputText value="#{purchaseOrderController.searchForm.purchaseNum}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label" value="操作人"/>
                                <p:inputText value="#{purchaseOrderController.searchForm.applicantName}"/>
                            </h:panelGroup>
                           <!-- <h:panelGroup>
                                <p:outputLabel class="label" value="操作日期(#{msg.From})"/>
                                <p:calendar mode="popup" showOn="button"
                                            value="#{purchaseOrderController.searchForm.dateStart}"
                                            timeZone="#{userContextService.getTimeZone()}"
                                            pattern="#{userContextService.timeFormat()}"
                                            locale="#{userContextService.getCalendarLocale()}"
                                            readonlyInput="true" showButtonPanel="true"
                                            navigator="true" mask="true">
                                    <p:ajax event="dateSelect" update="@this"/>
                                </p:calendar>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label" value="操作日期(#{msg.To})"/>
                                <p:calendar mode="popup" showOn="button"
                                            value="#{purchaseOrderController.searchForm.dateEnd}"
                                            timeZone="#{userContextService.getTimeZone()}"
                                            pattern="#{userContextService.timeFormat()}"
                                            locale="#{userContextService.getCalendarLocale()}"
                                            readonlyInput="true" showButtonPanel="true"
                                            navigator="true" mask="true">
                                    <p:ajax event="dateSelect" update="@this"/>
                                </p:calendar>
                            </h:panelGroup>-->
                         <h:panelGroup style="display: flex;">
                                <p:commandButton value="#{msg.Search}"
                                                 actionListener="#{purchaseOrderController.search}"
                                                 update="datalist"/>
                                <p:commandButton value="#{msg.Reset}"
                                                 actionListener="#{purchaseOrderController.resetSearch}"
                                                 update="searchForm datalist"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:dataTable id="datalist" value="#{purchaseOrderController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{purchaseOrderController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="10" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="10,20,50">
                        <p:ajax event="rowSelect" update="createButton viewButton editButton deleteButton exportZipButton viewUrl"/>
                        <p:ajax event="rowDblselect" listener="#{purchaseOrderController.doubleClick}" oncomplete="openViewWindow(xhr, status, args)"/>
                        <p:ajax event="filter" listener="#{purchaseOrderController.onFilter}" />

                        <p:column headerText="采购单号" filterBy="#{item.purchaseNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.purchaseNum}" />
                        </p:column>
                        <p:column headerText="设备名称"  filterBy="#{item.applicationAssetName}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.applicationAssetName}"/>
                        </p:column>
                        <p:column headerText="采购数量" filterBy="#{item.purchaseQuantity}" filterMatchMode="EQ">
                            <h:outputText value="#{item.purchaseQuantity}"/>
                        </p:column>
                        <p:column headerText="采购金额" filterBy="#{item.totalPrice}" filterMatchMode="EQ">
                            <h:outputText value="#{item.totalPrice}">
                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="操作人" filterBy="#{item.operator.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.operator.name}"/>

                        </p:column>
                        <p:column headerText="采购开始时间" filterBy="#{item.startDate}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterStartTime" widgetVar="varFilterStartTime"/>
                            </f:facet>
                            <h:outputText value="#{item.startDate}">
                                <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                   locale="#{userContextService.getCalendarLocale()}"
                                                   pattern="#{userContextService.timeFormat()}"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="采购截止时间" filterBy="#{item.endDate}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterEndTime" widgetVar="varFilterEndTime"/>
                            </f:facet>
                            <h:outputText value="#{item.endDate}">
                                <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                   locale="#{userContextService.getCalendarLocale()}"
                                                   pattern="#{userContextService.timeFormat()}"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="数据状态" filterBy="#{item.status}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('purchaseStatus', 'Enabled')}" itemValue="Enabled"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('purchaseStatus', 'NotEnabled')}" itemValue="NotEnabled"  />
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{fieldMsg.fieldValue('purchaseStatus', item.status)}"/>
                        </p:column>
                        <p:column headerText="#{msg.Operation}" style="width: 100px" exportable="false">
                            <p:commandButton value="启用" rendered="#{item.status eq 'NotEnabled' || item.status eq ''}" update=" datalist deleteButton" actionListener="#{purchaseOrderController.updateStatus(item.id,'Enabled')}"  />
                            <p:commandButton value="停用"  rendered="#{item.status eq 'Enabled'}" update="datalist deleteButton" actionListener="#{purchaseOrderController.updateStatus(item.id,'NotEnabled')}"  />
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray"
                                             title="#{msg.Create}"
                                             action="#{purchaseOrderController.intoActionModel('Create')}"/>
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray"
                                             title="#{msg.Edit}"
                                             action="#{purchaseOrderController.intoActionModel('Edit')}"
                                             disabled="#{empty purchaseOrderController.selected}"/>
                            <p:commandButton id="viewButton" icon="ui-icon-search" class="btn btn-sm btn-gray"
                                             title="#{msg.View}"
                                             action="#{purchaseOrderController.intoActionModel('View')}"
                                             disabled="#{empty purchaseOrderController.selected}" />
                            <p:commandButton id="viewUrl" icon="ui-icon-remove-red-eye" class="btn btn-sm btn-gray"  title="查看Url"
                                             disabled="#{empty purchaseOrderController.selected }"
                                           immediate="false" process="@this"  oncomplete="PF('viewUrlDlg').show()" update=":growl :viewUrlForm" >
                            </p:commandButton>
                           <!-- <p:commandButton id="confirmBid" icon="ui-icon-settings" class="btn btn-sm btn-gray"
                                             actionListener="#{purchaseOrderController.loadVenderInfo}" update=":confirmBidForm"
                                             title="确认中标" oncomplete="PF('confirmBidDlg').show()"
                                             />-->
                            <p:commandButton  title="导出采购单列表" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray"
                                              ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="Purchase_Export"/>
                            </p:commandButton>
                            <p:commandButton id="exportZipButton" ajax="false" title="采购单完整信息" actionListener="#{purchaseOrderController.exportAll}"
                                             disabled="#{empty purchaseOrderController.selected}"
                                             icon="ui-icon-circle-triangle-s" class="btn btn-sm btn-gray">
                                <p:fileDownload value="#{purchaseOrderController.exportFile}"/>
                            </p:commandButton>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash" class="btn btn-sm btn-gray" update="datalist" title="#{msg.Delete}"
                                             disabled="#{(empty purchaseOrderController.selected) ||  purchaseOrderController.selected.status eq 'Enabled'}" actionListener="#{purchaseOrderController.delete}"  >
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>

                        </f:facet>
                    </p:dataTable>

                </h:form>
                <p:dialog id="viewUrlDlg" widgetVar="viewUrlDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="采购单Url" >
                    <h:form id="viewUrlForm">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <span class="label">#{purchaseOrderController.getPurchaseUrl()}</span>
                            </h:panelGroup>
                        </p:panelGrid>
                        <br/>
                        <p:commandButton immediate="true" process="@this" value="关闭" onclick="PF('viewUrlDlg').hide()"/>
                    </h:form>
                </p:dialog>
               <!-- <p:dialog id="confirmBidDlg" widgetVar="confirmBidDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="确认中标" width="960" height="560">
                    <h:form id="confirmBidForm">
                        <p:dataTable id="assetDatalist" value="#{purchaseOrderController.venderInfoList}" var="item" widgetVar="venderInfoList"
                                     lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                                     rowKey="#{item.id}" selection="#{purchaseOrderController.venderInfo}"
                                     paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5,10,20">
                            <p:column selectionMode="single">
                            </p:column>
                            <p:column headerText="供应商名称">
                                <h:outputText value="#{item.venderName}"/>
                            </p:column>
                            <p:column headerText="地址">
                                <h:outputText value="#{item.venderAddress}"/>
                            </p:column>
                            <p:column headerText="供应商联系人">
                                <h:outputText value="#{item.venderContacts}"/>
                            </p:column>
                            <p:column headerText="电话">
                                <h:outputText value="#{item.venderPhone}"/>
                            </p:column>
                        </p:dataTable>
                        <br/>
                       &lt;!&ndash;<p:commandButton validateClient="true" actionListener="#{purchaseOrderController.confirmBid}"
                                         value="确定"
                                         update=":BudgetSelectDlg, :growl"
                                         oncomplete="handleSubmit(args, 'confirmBidDlg');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}"
                                         onclick="PF('confirmBidDlg').hide()"/>&ndash;&gt;
                    </h:form>
                </p:dialog>-->
            </div>
        </div>
        <script>
            function openViewWindow(xhr, status, args) {
                window.document.body.innerHTML = '加载中...';
                window.location.href = args.url;
            }
        </script>
        <p:overlayPanel widgetVar="panelFilterStartTime" for=":searchForm:datalist:filterStartTime" dismissable="false">
            <h:panelGrid columns="2">
                <p:outputLabel value="#{msg.From}"/>
                <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                <p:outputLabel value="#{msg.To}"/>
                <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
            </h:panelGrid>
            <p:commandButton onclick="setDateFilter('varDataList','varFilterStartTime','varStartTimeFrom','varStartTimeTo'); PF('panelFilterStartTime').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
            <p:commandButton onclick="PF('panelFilterStartTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
        </p:overlayPanel>
        <p:overlayPanel widgetVar="panelFilterEndTime" for=":searchForm:datalist:filterEndTime" dismissable="false">
            <h:panelGrid columns="2">
                <p:outputLabel value="#{msg.From}"/>
                <p:calendar timeZone="GMT+8"  widgetVar="varEndTimeFrom" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                <p:outputLabel value="#{msg.To}"/>
                <p:calendar timeZone="GMT+8"  widgetVar="varEndTimeTo" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
            </h:panelGrid>
            <p:commandButton onclick="setDateFilter('varDataList','varFilterEndTime','varEndTimeFrom','varEndTimeTo'); PF('panelFilterEndTime').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
            <p:commandButton onclick="PF('panelFilterEndTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
        </p:overlayPanel>
    </ui:define>

</ui:composition>
