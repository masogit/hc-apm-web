<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition >
        <p:dialog class="BudgetApplicationDialogConfirm" id="BudgetApplicationDialogConfirm" widgetVar="BudgetApplicationDialogConfirm"
                  modal="true" height="200" width="500"  resizable="false" draggable="true" appendTo="@(body)" header="申购信息调整">
            <h:form id="confirmForm">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <p:outputLabel class="label">确认数量(台)<span style="color: red">*</span></p:outputLabel>
                        <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" class="confirm" required="true" requiredMessage="数量(台) #{msg.ValidationRequire}"
                                        value="#{purchaseOrderController.confirmBudget.confirmQuantity}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                         <p:outputLabel class="label">确认预算价(万元)<span style="color: red">*</span></p:outputLabel>
                         <p:inputNumber  inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" class="confirm" required="true" requiredMessage="预算(万元) #{msg.ValidationRequire}"
                                         value="#{purchaseOrderController.confirmBudget.confirmPrice}"/>
                     </h:panelGroup>
                </p:panelGrid>
               <h:panelGroup>
                   <p:panelGrid columns="4"  layout="grid" styleClass="ui-panelgrid-blank form-group">
                       <h:panelGroup>
                       </h:panelGroup>
                       <p:commandButton validateClient="true" actionListener="#{purchaseOrderController.saveConfirmInfoBudgetApp()}"
                                         value="#{msg.Save}" id="saveConfirmButton"
                                         update=":BudgetApplicationDialogConfirm PurchaseApplicationEditForm:budgetApplicationConfirmlist :growl"
                                         oncomplete="handleSubmit(args, 'BudgetApplicationDialogConfirm');"/>
                        <p:commandButton value="取消" immediate="true"  oncomplete="handleSubmit(args, 'BudgetApplicationDialogConfirm');" />
                   </p:panelGrid>
               </h:panelGroup>
            </h:form>
        </p:dialog>
</ui:composition>
</html>
