<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="zkbPurcahseBudGetEditForm">
            <p:fieldset legend="#{msg.zkbContactInfo}" rendered="#{not empty purchaseBudgetConfigController.selected}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                 
                    <h:panelGroup>
                        <label class="label">年度*</label>
                        <p:inputText id="name" value="#{purchaseBudgetConfigController.selected.year}" required="true" requiredMessage="年度 #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">开启日期*</label>
                        <p:calendar timeZone="GMT+8"  id="startDate" pattern="yyyy/MM/dd" value="#{purchaseBudgetConfigController.selected.startDate}" required="true" requiredMessage="开启日期 #{msg.ValidationRequire}" showOn="button" Input="false" showButtonPanel="true" navigator="true" mask="true" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">终止申报日期*</label>
                        <p:calendar timeZone="GMT+8"  id="endDate" pattern="yyyy/MM/dd" value="#{purchaseBudgetConfigController.selected.endDate}" required="true" requiredMessage="终止申报日期 #{msg.ValidationRequire}" showOn="button" Input="false" showButtonPanel="true" navigator="true" mask="true" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">操作人*</label>
                        <p:inputText id="operaterName" value="#{purchaseBudgetConfigController.selected.operaterName}" required="true" requiredMessage="操作人 #{msg.ValidationRequire}" />
                    </h:panelGroup>
                </p:panelGrid>

                <p:commandButton value="#{msg.save}" icon="ui-icon-check" validateClient="true" actionListener="#{purchaseBudgetConfigController.save}" update=":growl :formList :zkbPurcahseBudGetEditForm" style="float:left"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{purchaseBudgetConfigController.cancel}" update=":growl :formList :zkbPurcahseBudGetEditForm"/>
            </p:fieldset>
        </h:form>
    </div>
</ui:composition>

</html>
