<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

<ui:composition>
    <div class="ui-g-12 card" >

        <h:form id="trDetailFormNew">
            <p:fieldset legend="详情">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">开始时间*</label>
                        <p:calendar  timeZone="GMT+8" id="fillDate" pattern="yyyy/MM/dd" value=""  showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh"></p:calendar>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">结束时间*</label>
                        <p:calendar timeZone="GMT+8" id="fillDate1" value="" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh"  requiredMessage="结束时间 #{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                     <p:commandButton value="查询"/>
                </p:panelGrid>
                <p:dataTable id="datalist"
                             value="#{deptPurchaseController.getLogList()}"
                             var="item2"  widgetVar="varDataList"
                             paginator="true"
                             paginatorPosition="both" sortBy="#{item2.id}" paginatorAlwaysVisible="true" paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="10" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="10,20,30,40">
                    <p:column headerText="科室">
                        <h:outputText value="#{item2.clinicalDeptName}"/>
                    </p:column>
                     <p:column headerText="年份">
                         <h:outputText value="#{item2.yearPurchase}" />
                     </p:column>
                     <p:column headerText="类别" >
                         <h:outputText value="#{item2.purchaseType}"/>

                     </p:column>
                     <p:column headerText="金额">
                         <h:outputText value="#{item2.amount}">
                             <f:convertNumber pattern="0.0" minFractionDigits="1"></f:convertNumber>
                         </h:outputText>
                     </p:column>
                     <p:column headerText="备注">
                         <h:outputText value="#{item2.remark}"/>
                     </p:column>
                    <f:facet name="{Toolbar}">

                    <p:commandButton id="addButton" title="#{msg.Create}"  icon="ui-icon-plus" class="btn btn-sm btn-gray"/>

                        <p:commandButton id="editButton"  title="#{msg.Edit}"  icon="ui-icon-pencil" class="btnEdit" update="@(.updateTrCls)" disabled="true"/>

                        <p:commandButton id="deleteButton" disabled="true" title="#{msg.Delete}" process="@this" update=":deptTransactionForm:tranTabView:trDetailFormNew:datalist, :growl"  icon="ui-icon-close" class="delBtn" >
                            <p:confirm header="#{msg.DeleteConformation}"
                                       message="确定删除该事务管理？"
                                       icon="ui-icon-warning"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </p:fieldset>

        </h:form>
    </div>
</ui:composition>
</html>
