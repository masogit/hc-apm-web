<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="科室预算额度管理"/>
            </div>
            <div class="ui-g-12 card" id="d1">

                <h:form id="deptTransactionForm">
                    <p:fieldset legend="科室预算额度汇总">
                    <p:panelGrid columns="3"  layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">年份查询*</label>
                            <p:calendar  timeZone="GMT+8" id="fillDate" pattern="yyyy/MM/dd" value=""  showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh"></p:calendar>
                        </h:panelGroup>
                        <p:commandButton value="查询" />
                    </p:panelGrid>
                    <h:panelGroup>
                    <p:dataTable id="datalist"
                                 class="dt"
                                 var="item"
                                   value="#{deptPurchaseController.getSummary()}">
                        <p:column headerText="科室">
                            <h:outputText value="#{item.clinicalDeptName}"/>
                        </p:column>
                        <p:column headerText="月份">
                            <h:outputText value="#{item.yearPurchase}"/>
                        </p:column>
                        <p:column headerText="预算额度">
                            <h:outputText value="#{item.amount}"/>
                        </p:column>
                        <p:column headerText="录入时间">
                            <h:outputText value="#{item.recordDate}">
                            </h:outputText>
                        </p:column>
                     </p:dataTable>
                    </h:panelGroup>
                    </p:fieldset>

                    <h:panelGroup id="x1id" class="x1" rendered="true">
                        <div class="ui-g-12">
                            <p:tabView rendered="true" class="ui-g-12 x2" id="tranTabView" dynamic="false" cache="false">
                                <p:tab    class="ui-g-12" title="科室预算额度详情">
                                    <ui:include src="depPurchaseDetailList.xhtml"/>
                                </p:tab>

                            </p:tabView>
                        </div>
                    </h:panelGroup>
                </h:form>

            </div>


        </div>
    </ui:define>
</ui:composition>
