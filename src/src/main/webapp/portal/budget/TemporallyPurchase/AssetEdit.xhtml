<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="AssetEditDlg" widgetVar="AssetEditDialog" modal="true" resizable="false"
              draggable="true" appendTo="@(body)" width="920"
              header="新增设备">
        <h:form id="AssetEditForm">
            <h:panelGroup id="display">
                <p:panelGrid id="editPanel" columns="4" layout="grid"
                             styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <p:outputLabel class="label">#{msg.EquipmentName}
                            <span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{budgetBayController.selectedAsset.name}" required="true"
                                     requiredMessage="#{msg.EquipmentName}#{msg.Blank}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">推荐#{msg.AssetBrand}
                            <span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{budgetBayController.selectedAsset.assetBrand}" required="true"
                                     requiredMessage="#{msg.AssetBrand}#{msg.Blank}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">#{msg.EquipmentModel}
                            <span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{budgetBayController.selectedAsset.assetModel}" required="true"
                                     requiredMessage="#{msg.EquipmentModel}#{msg.Blank}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">设备规格  <span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{budgetBayController.selectedAsset.standards}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">设备品类<span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{budgetBayController.selectedAsset.applicationAssetCategory}" />
                    </h:panelGroup>
                </p:panelGrid>

                <br/>
                <p:commandButton validateClient="true" actionListener="#{budgetBayController.saveAsset}"
                                 value="#{msg.Save}" id="saveButton"
                                 update="display :AssetEditDlg :growl"
                                 oncomplete="handleSubmit(args, 'AssetEditDialog');"
                                 disabled="#{empty budgetBayController.selectedDept}"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}"
                                 onclick="PF('AssetEditDialog').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
