<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>

        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.TemporallyPurchase}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <p:fieldset legend="高级查询">
                        <p:panelGrid id="searchPanel" columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.assetGroup}}</label>
                                <p:selectOneMenu id="assetGroup" value="#{purchaseInfoController.assetGroup}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" class="selectAssetGroup"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    <p:ajax listener="#{purchaseInfoController.assetGroupChangeListener}"  />
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.preventiveMaintenanceAnalysis_deviceName}</label>
                                <p:inputText id="assetName" value="#{purchaseInfoController.assetName}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.AssetBrand}</label>
                                <p:inputText id="assetBrand" value="#{purchaseInfoController.functionType}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.functionType}</label>
                                <p:inputText id="functionType" value="#{purchaseInfoController.functionType}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:commandButton value="#{msg.Search}" update=":searchForm:datalist"/>
                                <p:commandButton value="#{msg.Reset}" action="#{purchaseInfoController.reset}" update=":searchForm" />
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:dataTable style="margin-top: 20px;"  id="datalist" value="#{purchaseInfoController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                  rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                  paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                  currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                  rows="20" emptyMessage="#{msg.noRecordFound}"
                                  rowsPerPageTemplate="20,50,100,500">
                        <p:column headerText="操作">
                            <p:link target="_new" title="#{msg.Edit}" outcome="#{purchaseInfoController.getEditPage(item.uid)}" >
                                <p:graphicImage name="icons/edit.png" style="width: 30px; height: 30px;"/>
                            </p:link>
                            <p:commandLink rendered="#{userContextService.hasRole('AssetHead')}" id="deleteButton" title="#{msg.Delete}"  actionListener="#{purchaseInfoController.delete(item)}" update="datalist">
                                <p:graphicImage name="icons/delete.png" style="width: 30px; height: 30px;"/>
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandLink>
                        </p:column>
                        <p:column  headerText="#{msg.productName}" >
                            <h:outputText value="#{item.productName}"/>
                        </p:column>
                        <p:column  headerText="#{msg.PartsSpecification}" >
                            <h:outputText value="#{item.specification}"/>
                        </p:column>
                        <p:column  headerText="#{msg.quantity}" >
                            <h:outputText value="#{item.quantity}"/>
                        </p:column>
                        <p:column  headerText="#{msg.BudgetAmount}" >
                            <h:outputText value="#{item.budgetAmount}"/>
                        </p:column>
                        <p:column  headerText="#{msg.Declaration}" >
                            <h:outputText value="#{item.declaration}"/>
                        </p:column>
                        <p:column  headerText="#{msg.FundingSource}" >
                            <h:outputText value="#{item.fundingSource}"/>
                        </p:column>
                        <p:column  headerText="#{msg.RecommendBrand}" >
                            <h:outputText value="#{item.recommendBrand}"/>
                        </p:column>
                        <p:column  headerText="#{msg.Description}" >
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <p:column  headerText="#{msg.LaboratoryEvidence}" >

                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" action="#{urlEncryptController.encodeUrlParam('Create.xhtml?actionName=Create')}"  />
<!--                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" actionListener="#{purchaseInfoController.exportExcel}" update=":growl"-->
<!--                                             onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false" >-->
<!--                                <p:fileDownload value="#{purchaseInfoController.zipFile}" />-->
<!--                            </p:commandButton>-->
                        </f:facet>
                    </p:dataTable>
                    <p:remoteCommand name="rc" update=":searchForm:datalist datalist:createButton datalist:deleteButton " immediate="true"/>
                </h:form>
            </div>
        </div>

    </ui:define>
</ui:composition>
