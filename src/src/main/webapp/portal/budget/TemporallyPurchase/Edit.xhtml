<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="临时采购申请"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="BudgetApplicationEditForm">
                <h:panelGroup id="display">
                    <p:fieldset legend="#{msg.BudgetInfo}">
                        <p:panelGrid id="editPanel" columns="4" layout="grid"
                                     styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{budgetBayController.selected != null}">
                            <h:panelGroup>
                                <p:outputLabel class="label">#{msg.ApplicationNum}</p:outputLabel>
                                <h:outputText value="#{budgetBayController.selected.applicationNum}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">#{msg.ApplicationDept}<span style="color: red">*</span></p:outputLabel>
                                <p:inputText  id="dept" value="#{budgetBayController.selected.applicationDeptName}" readonly="true" required="true"  requiredMessage="申请科室 #{msg.ValidationRequire}" />
                                <p:commandButton id="orgEdit" process="@this" icon="fa fa-angle-down"
                                                 class="btn btn-sm popupIconButton" rendered="#{!budgetBayController.curModelDisables()}" disabled="#{budgetBayController.selected.applicationStep eq 'PendingComplete'}" />
                                <p:overlayPanel  id="popupPanelEdit" widgetVar="varOrgEdit" for="orgEdit" hideEffect="fade"
                                                style="position: absolute; left: 0; top: 0; width: 300px;"
                                                dynamic="false" modal="false" dismissable="true"   >
                                    <p:scrollPanel style="height:300px; border: 0" mode="native"  >
                                        <p:tree id="orgTreeEdit" value="#{budgetBayController.orgTreeEdit}" var="node"
                                                selectionMode="single" class="tree" style="width:98%; border:0"  >
                                           <p:ajax process="@this" event="select"
                                                    update=":BudgetApplicationEditForm @parent:dept "
                                                    listener="#{budgetBayController.onSelectTreeNode}"
                                                    oncomplete="PF('varOrgEdit').hide();" />
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>
                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">#{msg.Applicant}</p:outputLabel>
                                <h:outputText value="#{budgetBayController.selected.applicant.name}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">#{msg.ApplicationDate}</p:outputLabel>
                                <h:outputText value="#{budgetBayController.selected.applicationDate}">
                                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                       locale="#{userContextService.getCalendarLocale()}"
                                                       pattern="#{userContextService.timeFormat14()}"/>
                                </h:outputText>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>



                    <p:fieldset legend="#{msg.BudgetAssetInfo}" id="applicationDetail" rendered="#{budgetBayController.selectedDept ne null}">


                        <p:panelGrid id="applicationBudgetAssetPanel" columns="4" layout="grid"
                                     styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{budgetBayController.selected != null}">

                            <h:panelGroup rendered="#{budgetBayController.curModelCreate()}">
                                <label class="label">设备名称<span style="color: red">*</span></label>
                                    <p:autoComplete disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" dropdown="true" value="#{budgetBayController.curSelectBudgetAssetInfo}"
                                                    scrollHeight="300" forceSelection="true" completeMethod="#{budgetBayController.autoCompleteAssetName}"
                                                    var="t" itemLabel="#{t.name}" itemValue="#{t}" class="inputVendor3"  converter="budgetAssetInfoConverter" required="true" requiredMessage="设备名称 #{msg.ValidationRequire}">
                                        <p:ajax event="itemSelect" listener="#{budgetBayController.onBudgetAssetInfoChange()}" update="@(.budgetAssetInfoChange)"/>
                                        <p:ajax listener="#{budgetBayController.onBudgetAssetInfoChange()}" update="@(.budgetAssetInfoChange)"/>
                                    </p:autoComplete>
                                <p:commandButton rendered="#{!budgetBayController.curModelDisables()}" disabled="#{budgetBayController.selected.applicationStep eq 'PendingComplete'}" icon="ui-icon-plus" title="#{msg.Create}" process="@this" actionListener="#{budgetBayController.prepareCreateAsset}" update="AssetSelectDlg" oncomplete="PF('AssetSelectDialog').show()"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{!budgetBayController.curModelCreate()}">
                                <label class="label">设备名称<span style="color: red">*</span></label>
                                <p:inputText disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.applicationAssetName}" class="budgetAssetInfoChange"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                        <p:outputLabel class="label">设备品类<span style="color: red">*</span></p:outputLabel>
                                <p:inputText disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.applicationAssetCategory}" class="budgetAssetInfoChange"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:outputLabel class="label">推荐品牌<span style="color: red">*</span></p:outputLabel>
                                <p:inputText disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.recommendedBrand}" class="budgetAssetInfoChange"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:outputLabel class="label">规格<span style="color: red">*</span></p:outputLabel>
                                <p:inputText disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.standards}" class="budgetAssetInfoChange"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:outputLabel class="label">型号<span style="color: red">*</span></p:outputLabel>
                                <p:inputText disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.model}" class="budgetAssetInfoChange"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">数量<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="true" requiredMessage="数量 #{msg.ValidationRequire}"
                                               value="#{budgetBayController.curSelectApplicationBudgetAsset.applicationQuantity}">
                                    <p:ajax listener="#{budgetBayController.calcAmount(budgetBayController.curSelectApplicationBudgetAsset)}" update="@this applicationAmount BudgetApplicationEditForm"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">预算单价<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="true" requiredMessage="预算单价 #{msg.ValidationRequire}"
                                               value="#{budgetBayController.curSelectApplicationBudgetAsset.applicationPrice}">
                                    <p:ajax listener="#{budgetBayController.calcAmount(budgetBayController.curSelectApplicationBudgetAsset)}" update="@this applicationAmount BudgetApplicationEditForm"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">预算总价<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber  id="applicationAmount" disabled="true" inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" value="#{budgetBayController.curSelectApplicationBudgetAsset.applicationAmount}" >
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">单位<span style="color: red">*</span></p:outputLabel>
                                <p:inputText disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.unit}" required="true" requiredMessage="单位 #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">经费来源</p:outputLabel>
                                <p:selectOneMenu disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.sourceFunding}"  >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('sourceFunding')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">拟购设备的用途</p:outputLabel>
                                <p:inputText disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.equipmentUsage}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">情况说明</p:outputLabel>
                                <p:inputTextarea disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.description}" rows="2" cols="20">
                                </p:inputTextarea>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">申请理由</p:outputLabel>
                                <p:inputTextarea disabled="#{budgetBayController.curModelDisables() or budgetBayController.selected.applicationStep eq 'PendingComplete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.applicationReason}" rows="2" cols="20">
                                </p:inputTextarea>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:fieldset legend="#{msg.BudgetApprovalInfo}: #{budgetBayController.selected.approvalConfig.approvalName}"
                                rendered="#{budgetBayController.budgetApprovalsDisplay()}">
                        <p:dataTable id="budgetApprovallist" value="#{budgetBayController.selected.budgetApprovals}"
                                     var="item" widgetVar="varbudgetApprovalDatalist"
                                     lazy="true" rowKey="#{item.id}" sortOrder="descending"
                                     sortBy="#{item.createdDate}" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="审批单号">
                                <h:outputText value="#{item.approvalNumber}"/>
                            </p:column>
                            <p:column headerText="实际审批人">
                                <h:outputText value="#{item.actualApproverName}"/>
                            </p:column>
                            <p:column headerText="审批级别">
                                <h:outputText value="#{item.approvalLevel}级审批人"/>
                            </p:column>
                            <p:column headerText="审批意见">
                                <h:outputText value="#{item.approvalOpinion}"/>
                            </p:column>
                            <p:column headerText="审批节点状态">
                                <h:outputText
                                        value="#{multiLevelApprovalGlobalController.getApprovalNodeStatus(item.approvalNodeStatus)}"/>
                            </p:column>
                            <p:column headerText="审批时间">
                                <h:outputText value="#{item.actualApproverDate}">
                                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                       locale="#{userContextService.getCalendarLocale()}"
                                                       pattern="#{userContextService.timeFormat14()}"/>
                                </h:outputText>
                            </p:column>
                        </p:dataTable>
                    </p:fieldset>


                    <p:fieldset legend="线下审批意见" rendered="#{(!budgetBayController.curModelDisables() and budgetBayController.selected.applicationStep eq 'PendingComplete' ) or budgetBayController.selected.applicationStep eq 'Complete'}">
                        <p:panelGrid id="offlineApproval" columns="4" layout="grid"
                                     styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{budgetBayController.selected != null}">
                            <h:panelGroup >
                                <p:outputLabel class="label">审批时间</p:outputLabel>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  value="#{budgetBayController.curSelectApplicationBudgetAsset.offlineApprovalDate}"
                                            showHour="false" showMinute="false" showSecond="false" showOn="button" showButtonPanel="true" navigator="true" mask="true" disabled="#{budgetBayController.selected.applicationStep eq 'Complete'}"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:outputLabel class="label">审批意见</p:outputLabel>
                                <p:inputTextarea disabled="#{budgetBayController.selected.applicationStep eq 'Complete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.offlineApprovalOpinions}" rows="2" cols="20">
                                </p:inputTextarea>
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:outputLabel class="label">审批结论</p:outputLabel>
                                <p:inputTextarea disabled="#{budgetBayController.selected.applicationStep eq 'Complete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.offlineApprovalConclusion}" rows="2" cols="20">
                                </p:inputTextarea>
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:outputLabel class="label">备注</p:outputLabel>
                                <p:inputTextarea disabled="#{budgetBayController.selected.applicationStep eq 'Complete'}" value="#{budgetBayController.curSelectApplicationBudgetAsset.offlineApprovalRemark}" rows="2" cols="20">
                                </p:inputTextarea>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">记录人</p:outputLabel>
                                <p:inputText  value="#{budgetBayController.curSelectApplicationBudgetAsset.offlineApprovalRecorder}" disabled="#{budgetBayController.selected.applicationStep eq 'Complete'}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <br/>
                    <p:commandButton update=":growl :BudgetApplicationEditForm" rendered="#{budgetBayController.selected.applicationStatus eq '1' and !budgetBayController.curModelDisables()}"
                                     validateClient="true"  actionListener="#{budgetBayController.saveApplication}" value="暂存" id="saveApplication" />
                    <p:commandButton update=":growl :BudgetApplicationEditForm" validateClient="true"
                                     action="#{budgetBayController.applicationDataFlow(2,'PendingApproval','BAY')}"
                                     value="提交审批" rendered="#{budgetBayController.selected.applicationStep eq 'ToSubmitted' and !budgetBayController.curModelDisables()}"
                                     id="submitApplication" />
                    <p:commandButton update=":growl :BudgetApplicationEditForm"
                                     rendered="#{!budgetBayController.curModelDisables() and budgetBayController.selected.applicationStep eq 'PendingComplete'}"
                                     validateClient="true" action="#{budgetBayController.applicationDataFlow(6,'Complete','BAY')}" value="完成" id="compaleteApplication" />
                    <p:commandButton update=":growl :BudgetApplicationEditForm"
                                     rendered="#{!budgetBayController.curModelDisables() and budgetBayController.selected.applicationStep eq 'PendingComplete'}"
                                     validateClient="true" action="#{budgetBayController.applicationDataFlow(5,'Complete','BAY')}" value="取消" id="cancelApplication" />
                    <p:commandButton update=":growl :BudgetApplicationEditForm"
                                     rendered="#{!budgetBayController.curModelDisables() and budgetBayController.selected.applicationStatus eq '4'}"
                                     validateClient="true" action="#{budgetBayController.applicationDataFlow(1,'ToSubmitted','BAY')}" value="取消申请单" id="cancelApplicationN" />
                    <p:commandButton update=":growl :BudgetApplicationEditForm" immediate="false" process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back"
                                     action="#{budgetBayController.backList}" />
                </h:panelGroup>

            </h:form>
        </div>
        <div class="ui-g-12 card">
            <ui:include src="AssetSelect.xhtml"/>
            <ui:include src="AssetEdit.xhtml"/>
        </div>
    </ui:define>
</ui:composition>
