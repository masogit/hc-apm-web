<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="BudgetApplicationEditDlg" widgetVar="BudgetApplicationEditDialog" modal="true" resizable="false"
              draggable="true" appendTo="@(body)" width="1000" height="600"
              header="#{budgetController.CRUDActionName}#{msg.Blank}#{msg.BudgetApplication}">
        <h:form id="BudgetApplicationEditForm">
            <h:panelGroup id="display">
                <p:fieldset legend="#{msg.BudgetInfo}">
                    <p:dataTable id="budgetlist" value="#{budgetController.selected}"
                                 var="item" widgetVar="varbudgetDatalist"
                                 lazy="true" rowKey="#{item.id}" sortOrder="descending"
                                 sortBy="#{item.createdDate}" emptyMessage="#{msg.noRecordFound}">
                        <p:column headerText="#{msg.ApplicationNum}">
                            <h:outputText value="#{item.applicationNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.Applicant}">
                            <h:outputText value="#{item.applicant.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.ApplicationDept}">
                            <h:outputText value="#{item.applicationDept.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.ApplicationTotalAmount}">
                            <h:outputText value="#{item.totalAmount}">
                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.ApplicationDate}">
                            <h:outputText value="#{item.applicationDate}">
                                <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                   locale="#{userContextService.getCalendarLocale()}"
                                                   pattern="#{userContextService.timeFormat14()}"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </p:fieldset>

                <p:fieldset legend="#{msg.BudgetAssetInfo}">
                    <p:dataTable id="budgetAssetlist" value="#{budgetController.selected.budgetAssets}"
                                 var="item" widgetVar="varbudgetAssetDatalist" lazy="true" paginator="true"
                                 paginatorPosition="top" paginatorAlwaysVisible="true" rowKey="#{item.id}"
                                 sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5">

                        <p:ajax event="rowEdit" update="budgetAssetlist"/>

                        <p:column headerText="#{msg.StockType}">
                            <!--                            <p:cellEditor>-->
                            <!--                                <f:facet name="output">-->
                            <!--                                    <h:outputText value="#{fieldMsg.fieldValue('budgetStockType', item.stockType)}"/>-->
                            <!--                                </f:facet>-->
                            <!--                                <f:facet name="input">-->
                            <p:selectOneMenu id="stockType" value="#{item.stockType}">
                                <f:selectItems value="#{fieldMsg.getFieldValueList('budgetStockType')}" var="t"
                                               itemLabel="#{t.value}" itemValue="#{t.msgKey}"/>
                            </p:selectOneMenu>
                            <!--                                </f:facet>-->
                            <!--                            </p:cellEditor>-->
                        </p:column>
                        <p:column headerText="#{msg.deviceNum}">
                            <h:outputText value="#{item.asset.departNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.EquipmentName}">
                            <h:outputText value="#{item.asset.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.AssetBrand}">
                            <h:outputText value="#{item.asset.brand.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.AssetType}">
                            <h:outputText value="#{item.asset.assetType}"/>
                        </p:column>
                        <p:column headerText="#{msg.Unit}">
                            <!--                            <p:cellEditor>-->
                            <!--                                <f:facet name="output">-->
                            <!--                                    <h:outputText value="#{item.unit}" inputStyleClass="width-pct-100"/>-->
                            <!--                                </f:facet>-->
                            <!--                                <f:facet name="input">-->
                            <p:inputText styleClass="width-pct-100" value="#{item.unit}"/>
                            <!--                                </f:facet>-->
                            <!--                            </p:cellEditor>-->
                        </p:column>
                        <p:column headerText="#{msg.ApplicationQuantity}">
                            <!--                            <p:cellEditor>-->
                            <!--                                <f:facet name="output">-->
                            <!--                                    <h:outputText converter="javax.faces.Number" value="#{item.applicationQuantity}"/>-->
                            <!--                                </f:facet>-->
                            <!--                                <f:facet name="input">-->
                            <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0"
                                           value="#{item.applicationQuantity}">
                                <p:ajax listener="#{budgetController.calcAmount(item)}"
                                        update="@this amount BudgetApplicationEditForm"/>
                            </p:inputNumber>
                            <!--                                </f:facet>-->
                            <!--                            </p:cellEditor>-->
                        </p:column>
                        <p:column headerText="#{msg.ApplicationPrice}">
                            <!--                            <p:cellEditor>-->
                            <!--                                <f:facet name="output">-->
                            <!--                                    <h:outputText value="#{item.applicationPrice}">-->
                            <!--                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>-->
                            <!--                                    </h:outputText>-->
                            <!--                                </f:facet>-->
                            <!--                                <f:facet name="input">-->
                            <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2"
                                           value="#{item.applicationPrice}">
                                <p:ajax listener="#{budgetController.calcAmount(item)}"
                                        update="@this amount BudgetApplicationEditForm"/>
                            </p:inputNumber>
                            <!--                                </f:facet>-->
                            <!--                            </p:cellEditor>-->
                        </p:column>
                        <p:column headerText="#{msg.ApplicationAmount}">
                            <h:outputText id="amount" value="#{item.applicationAmount}">
                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.Actions}" width="50">
                            <!--                            <p:rowEditor/>-->
                            <p:commandButton process="@this" icon="ui-icon-close" styleClass="zoom-06"
                                             title="#{msg.Delete}" update="budgetAssetlist"
                                             actionListener="#{budgetController.delBudgetAsset(item)}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.Add}"
                                             icon="ui-icon-plus" class="btn btn-sm btn-gray zoom-08"
                                             actionListener="#{budgetController.preAddBudgetAsset}"
                                             update="AssetEditDlg"
                                             oncomplete="PF('AssetEditDialog').show()"/>
                        </f:facet>
                    </p:dataTable>
                </p:fieldset>

                <br/>
                <p:commandButton validateClient="true" actionListener="#{budgetController.save}"
                                 value="#{msg.Save}"
                                 update="display,:BudgetApplicationEditDlg, budgetTabView, :growl"
                                 oncomplete="handleSubmit(args, 'BudgetApplicationEditDialog');"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}"
                                 onclick="PF('BudgetApplicationEditDialog').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
