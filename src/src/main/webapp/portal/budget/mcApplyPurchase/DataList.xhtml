<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <h:form>
        <p:dataTable id="datalist" value="#{mcApplyPurchaseListController.lazyModel}" var="item" widgetVar="varDataList"
                     selectionMode="single" selection="#{mcApplyPurchaseListController.selected}"
                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                     rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                     rows="10" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="10,20,50">
            <p:ajax event="rowSelect" update="createButton editButton deleteButton exportZipButton"/>
            <p:ajax event="rowDblselect" listener="#{mcApplyPurchaseListController.doubleClick}" oncomplete="openViewWindow(xhr, status, args)"/>
            <p:column headerText="#{msg.ApplicationNum}" >
                <h:outputText value="#{item.applicationNum}"/>
            </p:column>
            <p:column headerText="申请科室" >
                <h:outputText value="#{item.applicationDeptName}"/>
            </p:column>
            <p:column headerText="#{msg.Applicant}" >
                <h:outputText value="#{item.applicantName}"/>
            </p:column>
            <p:column headerText="#{msg.ApplicationDate}" >
                <h:outputText value="#{item.applicationDate}">
                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}" pattern="#{userContextService.timeFormat14()}"/>
                </h:outputText>
            </p:column>
            <p:column headerText="病区代码" >
                <h:outputText value="#{item.wardCode}"/>
            </p:column>
            <p:column headerText="状态">
                <h:outputText value="#{fieldMsg.fieldValue('mcApplyPurchaseStatus', item.applicationStatus)}"/>
            </p:column>
            <p:column headerText="步骤">
                <h:outputText value="#{fieldMsg.fieldValue('mcApplyPurchaseStep', item.applicationStep)}"/>
            </p:column>
            <f:facet name="{Toolbar}">
                <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" action="#{mcApplyPurchaseListController.pageForward('Create')}"/>
                <p:commandButton id="editButton" icon="#{(mcApplyPurchaseListController.tabIndex eq 0  or mcApplyPurchaseListController.tabIndex eq 2 or mcApplyPurchaseListController.tabIndex eq 4 ) ? 'ui-icon-pencil' : 'ui-icon-web'}" class="btn btn-sm btn-gray" title="#{(mcApplyPurchaseListController.tabIndex eq 0  or mcApplyPurchaseListController.tabIndex eq 2 or mcApplyPurchaseListController.tabIndex eq 4 ) ? '修改' : '查看'}" action="#{mcApplyPurchaseListController.pageForward('Edit')}" disabled="#{empty mcApplyPurchaseListController.selected }"/>
                <p:commandButton id="deleteButton" icon="ui-icon-trash" class="btn btn-sm btn-gray" update="datalist" title="#{msg.Delete}" actionListener="#{mcApplyPurchaseListController.delete}" >
                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                </p:commandButton>
                <p:commandButton id="exportZipButton" ajax="false" title="下载压缩文件" actionListener="#{mcApplyPurchaseListController.exportAll}"
                                 disabled="#{empty mcApplyPurchaseListController.selected}"
                                 icon="ui-icon-circle-triangle-s" class="btn btn-sm btn-gray">
                    <p:fileDownload value="#{mcApplyPurchaseListController.exportFile}"/>
                </p:commandButton>

            </f:facet>
        </p:dataTable>
    </h:form>
</ui:composition>
</html>
