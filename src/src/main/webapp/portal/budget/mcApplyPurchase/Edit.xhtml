<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{msg.MaintenanceContractApplyDetail}"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="applyPurchaseEditForm">
                <h:panelGroup id="display">
                    <p:fieldset legend="#{msg.BudgetInfo}">
                        <p:panelGrid id="editPanel" columns="3" layout="grid"
                                     styleClass="ui-panelgrid-blank form-group"
                                     rendered="#{mcApplyPurchaseEditController.selected != null}">
                            <h:panelGroup>
                                <p:outputLabel class="label">#{msg.ApplicationNum}</p:outputLabel>
                                <h:outputText value="#{mcApplyPurchaseEditController.selected.applicationNum}"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">院区</label>
                                <h:outputText value="#{mcApplyPurchaseEditController.selected.courtyardArea}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">#{msg.ApplicationDept}<span style="color: red">*</span></p:outputLabel>
                                <p:inputText  id="dept" value="#{mcApplyPurchaseEditController.selected.applicationDeptName}" readonly="true" required="true" requiredMessage="申请科室 #{msg.ValidationRequire}" disabled="#{!mcApplyPurchaseEditController.applyPurchaseStatusVo.canEdit}"/>
                                <p:commandButton id="orgEdit" process="@this" icon="fa fa-angle-down"
                                                 class="btn btn-sm popupIconButton" disabled="#{!mcApplyPurchaseEditController.applyPurchaseStatusVo.canEdit}" />
                                <p:overlayPanel  id="popupPanelEdit" widgetVar="varOrgEdit" for="orgEdit"
                                                style="position: absolute; left: 0; top: 0; width: 300px;"
                                                dynamic="false" modal="false" dismissable="true"   >
                                    <p:scrollPanel style="height:300px; border: 0" mode="native"  >
                                        <p:inputText id="searchDeptName" value="#{mcApplyPurchaseEditController.searchDeptName}"  />
                                        <p:commandButton process=":applyPurchaseEditForm:searchDeptName @this" partialSubmit="true" icon="ui-icon-search" update="orgTreeEdit" actionListener="#{mcApplyPurchaseEditController.treeSeachCondition()}" value="检索"/>
                                        <p:tree id="orgTreeEdit" value="#{mcApplyPurchaseEditController.orgTree}" var="node"
                                                selectionMode="single" class="tree" style="width:98%; border:0"  >
                                           <p:ajax process="@this" event="select"
                                                    update="@parent:dept "
                                                    listener="#{mcApplyPurchaseEditController.onSelectTreeNode}"
                                                    oncomplete="PF('varOrgEdit').hide();" />
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>
                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">病区代码<span style="color: red">*</span></label>
                                <p:inputText disabled="#{!mcApplyPurchaseEditController.applyPurchaseStatusVo.canEdit}" value="#{mcApplyPurchaseEditController.selected.wardCode}" required="false" requiredMessage="病区代码 #{msg.ValidationRequire}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">#{msg.Applicant}</p:outputLabel>
                                <h:outputText value="#{mcApplyPurchaseEditController.selected.applicantName}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">#{msg.ApplicationDate}</p:outputLabel>
                                <h:outputText value="#{mcApplyPurchaseEditController.selected.applicationDate}">
                                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}" pattern="#{userContextService.timeFormat14()}"/>
                                </h:outputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">备注</p:outputLabel>
                                <p:inputTextarea  cols="40" value="#{mcApplyPurchaseEditController.selected.remark}"  disabled="#{!mcApplyPurchaseEditController.applyPurchaseStatusVo.canEdit}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">设备现状及维保需求说明</p:outputLabel>
                                <p:inputTextarea  cols="40" value="#{mcApplyPurchaseEditController.selected.equipmentDescription}" disabled="#{!mcApplyPurchaseEditController.applyPurchaseStatusVo.canEdit}"  />
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="选择保养设备" id="applicationDetail" >
                        <p:dataTable id="assetDatalist" value="#{mcApplyPurchaseEditController.applyPurchaseAssetList}" var="item"
                                     widgetVar="detailDatalist" selectionMode="single" selection="#{mcApplyPurchaseEditController.selectedApplyPurchaseAsset}"
                                     lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                                     paginatorTemplate="{Toolbar}" rows="200" emptyMessage="#{msg.noRecordFound}" >
                            <p:ajax event="rowSelect" update="deleteDetailButton"/>
                            <p:column headerText="设备名称">
                                <h:outputText value="#{item.assetInfo.name}"/>
                            </p:column>
                            <p:column headerText="品牌/制造商简称">
                                <h:outputText value="#{item.assetInfo.makerShortName}"/>
                            </p:column>
                            <p:column headerText="设备型号">
                                <h:outputText value="#{item.assetInfo.functionType}"/>
                            </p:column>
                            <p:column headerText="制造商序列号">
                                <h:outputText value="#{item.assetInfo.serialNum}"/>
                            </p:column>
                            <p:column headerText="资产编号">
                                <h:outputText value="#{item.assetInfo.financingNum}"/>
                            </p:column>
                            <p:column headerText="购置价格(元)">
                                <h:outputText value="#{item.assetInfo.purchasePrice}"/>
                            </p:column>
                            <p:column headerText="启用日期">
                                <h:outputText value="#{item.assetInfo.installDate}">
                                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale="#{userContextService.getCalendarLocale()}" pattern="#{userContextService.timeFormat14()}"/>
                                </h:outputText>
                            </p:column>
                            <f:facet name="{Toolbar}">
                                <p:commandButton immediate="false" process="@this" id="createDetailButton" icon="ui-icon-plus" validateClient="false" title="#{msg.Create}" actionListener="#{mcApplyPurchaseEditController.prepareAssetAdd}" update=":growl :assetSearchForm :assetSelectForm" oncomplete="PF('AssetSelectDlg').show()" rendered="#{mcApplyPurchaseEditController.applyPurchaseStatusVo.canEdit}"/>
                                <p:commandButton immediate="false" process="@this" id="deleteDetailButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{mcApplyPurchaseEditController.deleteApplyPurchaseAsset}" update=":growl :applyPurchaseEditForm:assetDatalist" disabled="#{empty mcApplyPurchaseEditController.selectedApplyPurchaseAsset}" rendered="#{mcApplyPurchaseEditController.applyPurchaseStatusVo.canEdit}">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                </p:commandButton>
                            </f:facet>
                        </p:dataTable>
                    </p:fieldset>
                    <p:fieldset legend="附件信息"  >
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <p:dataList id="attachList"
                                            value="#{mcApplyPurchaseEditController.v2_blobObjectList}"
                                            var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}"
                                            paginator="true" paginatorPosition="top" paginatorAlwaysVisible="false" rows="5">
                                    <f:facet name="header">附件详情</f:facet>
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                    <p:commandButton actionListener="#{mcApplyPurchaseEditController.removeAttachmentById(fileitem.id)}" update="attachList" icon="ui-icon-clear" title="#{msg.Delete}"
                                                     class="popupIconButton" process="@this" >
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>
                                </p:dataList>
                                <p:fileUpload  allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/" fileUploadListener="#{mcApplyPurchaseEditController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                               multiple="true"  sizeLimit="100000000"  update="attachList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}" rendered="#{mcApplyPurchaseEditController.applyPurchaseStatusVo.canEdit}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:fieldset legend="保养设备详情" rendered="#{mcApplyPurchaseEditController.applyPurchaseStatusVo.showTech}">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{mcApplyPurchaseEditController.selected != null}">
                            <h:panelGroup>
                                <p:outputLabel class="label">技术分析讨论<span style="color: red">*</span></p:outputLabel>
                                <p:inputTextarea rows="6" cols="50" value="#{mcApplyPurchaseEditController.selected.techAnalysisDiscussion}" disabled="true" />
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">审批意见</label>
                                <p:inputText value="#{mcApplyPurchaseEditController.selected.techComment}" disabled="true"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="论证情况结果" rendered="#{mcApplyPurchaseEditController.applyPurchaseStatusVo.showMeetReasoning}">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">论证情况结果<span style="color: red">*</span></label>
                                <p:inputTextarea rows="6" cols="50" value="#{mcApplyPurchaseEditController.selected.meetReasoningResult}" disabled="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">审批意见<span style="color: red">*</span></label>
                                <p:inputText rows="6" cols="50" value="#{mcApplyPurchaseEditController.selected.meetAuditComment}" disabled="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">审批时间<span style="color: red">*</span></label>
                                <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" value="#{mcApplyPurchaseEditController.selected.meetAuditDate}"  showOn="button" disabled="true"  Input="false" showButtonPanel="true" navigator="true" mask="true" readonly="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">记录人<span style="color: red">*</span></label>
                                <p:inputText value="#{mcApplyPurchaseEditController.selected.recordPersonName}" disabled="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">备注</label>
                                <p:inputText value="#{mcApplyPurchaseEditController.selected.meetAuditRemark}" disabled="true" />
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="采购确认信息" rendered="#{mcApplyPurchaseEditController.applyPurchaseStatusVo.showPurchaseConfirm}">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">审批意见</label>
                                <p:inputText value="#{mcApplyPurchaseEditController.selected.purchaseConfirmComment}" disabled="true" />
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <br/>
                    <p:commandButton update=":growl :applyPurchaseEditForm" validateClient="true" action="#{mcApplyPurchaseEditController.saveApplication}" value="暂存" id="saveApplication" rendered="#{mcApplyPurchaseEditController.applyPurchaseStatusVo.canEdit}"/>
                    <p:commandButton update=":growl :applyPurchaseEditForm" validateClient="true" action="#{mcApplyPurchaseEditController.submitAudit}" rendered="#{mcApplyPurchaseEditController.applyPurchaseStatusVo.canEdit}" value="提交审批"  id="submitApplication" />
                    <p:commandButton update=":growl :applyPurchaseEditForm" immediate="false" process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back" action="#{mcApplyPurchaseEditController.backList}" />
                </h:panelGroup>
            </h:form>
        </div>
        <div class="ui-g-12 ">
            <ui:include src="AssetSelect.xhtml"/>
        </div>
    </ui:define>
</ui:composition>
