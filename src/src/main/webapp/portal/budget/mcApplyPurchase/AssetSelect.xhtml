<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="AssetSelectDlg" widgetVar="AssetSelectDlg" modal="true" resizable="false"
              draggable="true" appendTo="@(body)" width="960" height="660"
              header="选择设备">
        <h:form id="assetSearchForm">
            <p:fieldset legend="#{msg.searchAsset}">
                <p:panelGrid id="assetSearchPanel" columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.ApplicationDept}</label>
                        <p:inputText id="dept" readonly="true"
                                     value="#{mcApplyPurchaseEditController.assetSearchForm.dept}"/>
                        <p:commandButton id="org" process="@this" icon="fa fa-angle-down"
                                         class="btn btn-sm popupIconButton"/>
                        <p:overlayPanel id="popupPanel" widgetVar="varOrg" for="org" hideEffect="fade"
                                        style="position: absolute; left: 0; top: 0; width: 300px;"
                                        dynamic="false" modal="false" dismissable="true">
                            <p:scrollPanel style="height:300px; border: 0" mode="native">
                                <p:inputText id="searchDeptName" value="#{mcApplyPurchaseEditController.assetSearchForm.deptName}"  />
                                <p:commandButton process=":assetSearchForm:searchDeptName @this" partialSubmit="true" icon="ui-icon-search" update="orgTree" actionListener="#{mcApplyPurchaseListController.treeSeachCondition('list')}" value="检索"/>
                                <p:tree id="orgTree" value="#{mcApplyPurchaseEditController.orgTreeSearch}" var="node"
                                        selectionMode="single" class="tree" style="width:98%; border:0">
                                    <p:ajax process="@this" event="select" update="assetSearchForm:dept"
                                            listener="#{mcApplyPurchaseEditController.onSearchTreeNode}"
                                            oncomplete="PF('varOrg').hide();"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label" value="#{msg.EquipmentName}"/>
                        <p:inputText value="#{mcApplyPurchaseEditController.assetSearchForm.assetName}"/>
                    </h:panelGroup>
                   <h:panelGroup>
                      <p:outputLabel class="label">推荐品牌</p:outputLabel>
                      <p:inputText value="#{mcApplyPurchaseEditController.assetSearchForm.assetBrand}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">型号</p:outputLabel>
                        <p:inputText value="#{mcApplyPurchaseEditController.assetSearchForm.assetModel}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">制造商序列号</p:outputLabel>
                        <p:inputText value="#{mcApplyPurchaseEditController.assetSearchForm.serialNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">资产编号</p:outputLabel>
                        <p:inputText value="#{mcApplyPurchaseEditController.assetSearchForm.financingNum}"/>
                    </h:panelGroup>
                    <h:panelGroup style="display: flex;">
                        <p:commandButton value="#{msg.Search}"
                                         actionListener="#{mcApplyPurchaseEditController.searchAsset}"
                                         update="assetSelectForm"/>
                        <p:commandButton value="#{msg.Reset}"
                                         actionListener="#{mcApplyPurchaseEditController.resetAssetSearch}"
                                         update="assetSelectForm assetSearchForm"/>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
        </h:form>
        <h:form id="assetSelectForm">
            <p:dataTable id="assetDatalist" value="#{mcApplyPurchaseEditController.assetInfoList}" var="item" widgetVar="varAssetDatalist"
                         selectionMode="single" selection="#{mcApplyPurchaseEditController.selectedAssetInfo}"
                         lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.asset.id}"
                         paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rows="10" pageLinks="10" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="10,20,50">
                <p:column headerText="#{msg.EquipmentName}">
                    <h:outputText value="#{item.name}"/>
                </p:column>
                <p:column headerText="推荐品牌">
                    <h:outputText value="#{item.makerShortName}"/>
                </p:column>
                <p:column headerText="制造商序列号">
                    <h:outputText value="#{item.serialNum}"/>
                </p:column>
                <p:column headerText="型号">
                    <h:outputText value="#{item.functionType}"/>
                </p:column>
                <p:column headerText="设备分类">
                    <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetCategory)}"/>
                </p:column>
                <p:column headerText="制造商序列号">
                    <h:outputText value="#{item.serialNum}"/>
                </p:column>
                <p:column headerText="资产编号">
                    <h:outputText value="#{item.financingNum}"/>
                </p:column>
                <f:facet name="{Toolbar}">
                   
                </f:facet>
            </p:dataTable>
            <p:commandButton validateClient="true" actionListener="#{mcApplyPurchaseEditController.saveSelectedAsset}"
                             value="确定"
                             update=":AssetSelectDlg, :applyPurchaseEditForm:assetDatalist, :growl"
                             oncomplete="handleSubmit(args, 'AssetSelectDlg');"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}"
                             onclick="PF('AssetSelectDlg').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
