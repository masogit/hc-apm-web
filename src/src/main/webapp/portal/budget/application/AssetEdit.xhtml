<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="AssetEditDlg" widgetVar="AssetEditDialog" modal="true" resizable="false"
              draggable="true" appendTo="@(body)" width="920"
              header="#{msg.Create}#{msg.Blank}#{msg.BudgetAsset}">
        <h:form id="AssetEditForm">
            <h:panelGroup id="display">
                <p:panelGrid id="editPanel" columns="4" layout="grid"
                             styleClass="ui-panelgrid-blank form-group"
                             rendered="#{budgetController.selectedAsset != null}">
                    <h:panelGroup>
                        <p:outputLabel class="label">#{msg.ProductNumber}
                            <span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{budgetController.selectedAsset.financingNum}" required="true"
                                     requiredMessage="#{msg.ProductNumber}#{msg.Blank}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">#{msg.EquipmentName}
                            <span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{budgetController.selectedAsset.name}" required="true"
                                     requiredMessage="#{msg.EquipmentName}#{msg.Blank}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">#{msg.AssetGroup}
                            <span style="color: red">*</span></p:outputLabel>
                        <p:selectOneMenu value="#{budgetController.selectedAsset.assetGroup}" required="true"
                                         requiredMessage="#{msg.AssetGroup}#{msg.Blank}#{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"
                                           itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            <p:ajax event="change" listener="#{budgetController.onBudgetFilterAssetGroupChange}"
                                    update="@this assetGroupSecondary"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{budgetController.show('assetGroupSecondary')}">
                        <p:outputLabel class="label">#{msg.AssetGroupSecondary}
                            <span style="color: red">*</span></p:outputLabel>
                        <p:selectOneMenu id="assetGroupSecondary" required="true"
                                         requiredMessage="#{msg.AssetGroupSecondary}#{msg.Blank}#{msg.ValidationRequire}"
                                         value="#{budgetController.selectedAsset.assetGroupSecondary}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{budgetController.assetCreateAssetGroupSecondaryList}" var="item"
                                           itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">#{msg.AssetBrand}
                            <span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{budgetController.selectedAsset.assetBrand}" required="true"
                                     requiredMessage="#{msg.AssetBrand}#{msg.Blank}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">#{msg.EquipmentModel}
                            <span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{budgetController.selectedAsset.assetModel}" required="true"
                                     requiredMessage="#{msg.EquipmentModel}#{msg.Blank}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">#{msg.Unit}
                            <span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{budgetController.selectedAsset.unit}" required="true"
                                     requiredMessage="#{msg.Unit}#{msg.Blank}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">#{msg.Price}</p:outputLabel>
                        <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2"
                                       value="#{budgetController.selectedAsset.price}">
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">要求</p:outputLabel>
                        <p:inputText value="#{budgetController.selectedAsset.requirement}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">是否需要进口</p:outputLabel>
                        <p:selectOneMenu id="importedOrNot"
                                         value="#{budgetController.selectedAsset.importedOrNot}">
                            <f:selectItem itemValue="否" itemLabel="否" />
                            <f:selectItem itemValue="是" itemLabel="是" />
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">是否为特种设备</p:outputLabel>
                        <p:selectOneMenu id="specialOrNot" value="#{budgetController.selectedAsset.specialOrNot}">
                            <f:selectItem itemValue="否" itemLabel="否" />
                            <f:selectItem itemValue="是" itemLabel="是" />
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>

                <br/>
                <p:commandButton validateClient="true" actionListener="#{budgetController.saveAsset}"
                                 value="#{msg.Save}" id="saveButton"
                                 update="display :AssetEditDlg :growl"
                                 oncomplete="handleSubmit(args, 'AssetEditDialog');"
                                 disabled="#{empty budgetController.selectedDept}"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}"
                                 onclick="PF('AssetEditDialog').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
