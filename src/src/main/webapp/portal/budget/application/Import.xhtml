<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
            <div class="ui-g">
                <div class="ui-g-12 card cardTitle">
                        <p:outputLabel class="pageTitle" value="申购信息导入"/>
                </div>
            </div>
            <div class="ui-g-12 card">
                <h:form enctype="multipart/form-data" id="budgetImportForm">
                    <p:fieldset  legend="批量导入申购数据" >
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">#{msg.hospitalId}<span style="color:red">*</span></label><!--所属医院-->
                                <p:inputText id="selectedOrgName" value="#{budgetController.selectedImportOrgName}" readonly="true" />
                                <p:commandButton id="selectBtnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton"  />
                                <p:overlayPanel id="selectPopupPanel" widgetVar="varPanelOrg" for="selectBtnOrg" hideEffect="fade" dynamic="false" style="width:300px" modal="false">
                                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{budgetController.orgImportTree}"  var="node" selectionMode="single">
                                            <p:ajax process="@this" event="select" update="budgetImportForm @parent:selectedOrgName" listener="#{budgetController.onSelectedImportTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>
                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                            <p:treeNode type="hidden" rendered="false"/>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                            <p:fileUpload fileUploadListener="#{budgetController.handleFileUploadImport}"
                                          mode="advanced"
                                          dragDropSupport="false" multiple="false" auto="true"
                                          invalidFileMessage="只支持xls或xlsx格式的文件"
                                          invalidSizeMessage="文件大小不得超过5M"
                                          sizeLimit="5242880" allowTypes="/(\.|\/)(xls|xlsx)$/"
                                          update=":errorDataListForm"
                                          label="从Excel导入" cancelLabel="取消" uploadLabel="确认上传"/>
                        </p:panelGrid>
                        <h:panelGroup>
                            <p>说明</p>
                            <p>1. <a href="excel/Budget_Import_Template.xlsx" title="download">下载模板</a> </p>
                            <p>2. 文件中填入要导入的申购信息数据<br/>
                            其中：申请编号，申请科室，病区代码，申请人登录账号，申请日期，审核人登录账号，审核日期，设备名称，设备品类，推荐品牌，规格，型号，数量，
                                单位，预算单价，是否在手术室使用，审批时间，审批意见，审批结论，记录人，审批数量，审批单价，备注为必填字段</p>
                            <p>3. 上传文件进行导入</p>
                        </h:panelGroup>
                    </p:fieldset>
                    <h:panelGroup>
                        <p:commandButton value="#{msg.Return}"  icon="ui-icon-arrow-back" action="List.xhtml?faces-redirect=true" immediate="true"  update=":growl" style="float:left"/>
                    </h:panelGroup>
                </h:form>
            </div>


            <div class="ui-g-12 card">
                <h:form id="errorDataListForm">
                    <p:messages id="messages" showDetail="true" closable="false" autoUpdate="false"></p:messages>
                    <p:fieldset  legend="导入失败的数据">
                        <p:dataTable id="datalist" rendered="#{not empty budgetController.errorImportList}" value="#{budgetController.errorImportList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="数据为空"
                                     rowsPerPageTemplate="20,50,100,500">
                            <p:column headerText="EXCEL行数">
                                <h:outputText value="#{item.excelIdex}" />
                            </p:column>
                            <p:column headerText="错误信息"  >
                                <h:outputText value="#{item.errorInfo}"/>
                            </p:column>
                           <f:facet name="{Toolbar}">
                                <p:commandButton title="导出错误数据" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                    <p:dataExporter type="xls" target="datalist" fileName="ProbeFailed_export"/>
                                </p:commandButton>
                            </f:facet>
                        </p:dataTable>
                    </p:fieldset>
                </h:form>
            </div>
    </ui:define>
</ui:composition>
