<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <h:form>
        <p:dataTable id="datalist" value="#{budgetController.lazyModel}" var="item" widgetVar="varDataList"
                     selectionMode="single" selection="#{budgetController.selected}"
                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                     rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                     rows="10" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="10,20,50">

            <p:ajax event="rowSelect" update="createButton editButton viewButton deleteButton"/>
            <p:ajax event="filter" listener="#{budgetController.onFilter}"
                    update="createButton editButton viewButton deleteButton"/>

            <p:column headerText="#{msg.ApplicationNum}" sortBy="#{item.applicationNum}">
                <h:outputText value="#{item.applicationNum}"/>
            </p:column>
            <p:column headerText="#{msg.Applicant}" sortBy="#{item.applicant.name}">
                <h:outputText value="#{item.applicant.name}"/>
            </p:column>
            <p:column headerText="#{msg.ApplicationDate}" sortBy="#{item.applicationDate}">
                <h:outputText value="#{item.applicationDate}">
                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                       locale="#{userContextService.getCalendarLocale()}"
                                       pattern="#{userContextService.timeFormat14()}"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.ApplicationTotalAmount}" sortBy="#{item.totalAmount}">
                <h:outputText value="#{item.totalAmount}">
                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.ApplicationStatus}">
                <h:outputText value="#{fieldMsg.fieldValue('budgetApplicationStatus', item.applicationStatus)}"/>
            </p:column>
            <p:column headerText="#{msg.ApprovalProgress}">
                <h:outputText value="#{item.approvalProgressPercentage()}%"/>
            </p:column>
            <p:column headerText="#{msg.Approver}" sortBy="#{item.approver.name}"
                      filterBy="#{item.approver.name}" filterMatchMode="LIKE">
                <h:outputText value="#{item.approver.name}"/>
            </p:column>
            <p:column headerText="#{msg.ApprovalDate}" sortBy="#{item.approvalDate}"
                      filterBy="#{item.approvalDate}" filterMatchMode="GTE">
                <f:facet name="filter">
                    <p:inputText id="approvalDate" widgetVar="varApprovalDate"/>
                </f:facet>
                <h:outputText value="#{item.approvalDate}">
                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                       locale="#{userContextService.getCalendarLocale()}"
                                       pattern="#{userContextService.timeFormat14()}"/>
                </h:outputText>
            </p:column>
            <f:facet name="{Toolbar}">
                <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray"
                                 title="#{msg.Create}"
                                 actionListener="#{budgetController.prepareCreate}"
                                 update=":BudgetApplicationEditDlg"
                                 oncomplete="PF('BudgetApplicationEditDialog').show()"
                                 disabled="#{userContextService.hasNotAnyRole('AssetHead,DeptHead,ClinicalStaff')}"/>
                <p:commandButton id="viewButton" icon="ui-icon-search" class="btn btn-sm btn-gray"
                                 title="#{msg.View}"
                                 actionListener="#{budgetController.prepareView}"
                                 update=":BudgetApplicationViewDlg"
                                 oncomplete="PF('BudgetApplicationViewDialog').show()"
                                 disabled="#{empty budgetController.selected}"/>
                <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray"
                                 title="#{msg.Edit}"
                                 actionListener="#{budgetController.prepareEdit}"
                                 update=":BudgetApplicationEditDlg"
                                 oncomplete="PF('BudgetApplicationEditDialog').show()"
                                 rendered="#{budgetController.tabIndex eq 0 or budgetController.tabIndex eq 1}"
                                 disabled="#{empty budgetController.selected or budgetController.selected.applicationStatus ne 1}"/>
                <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s"
                                 class="btn btn-sm btn-gray" ajax="false">
                    <p:dataExporter type="xls" target="datalist" fileName="BudgetApplication_export"/>
                </p:commandButton>
                <p:commandButton id="deleteButton" icon="ui-icon-trash" class="btn btn-sm btn-gray"
                                 title="#{msg.Delete}"
                                 actionListener="#{budgetController.prepareDelete}"
                                 update=":BudgetApplicationViewDlg"
                                 oncomplete="PF('BudgetApplicationViewDialog').show()"
                                 rendered="#{budgetController.tabIndex eq 0 or budgetController.tabIndex eq 1}"
                                 disabled="#{empty budgetController.selected or budgetController.selected.applicationStatus ne 1}"/>
            </f:facet>
        </p:dataTable>

        <p:overlayPanel widgetVar="dateFilter" for="@parent:datalist:approvalDate" dismissable="true" style="position: absolute; left: 0; top: 0">
            <h:panelGrid columns="2">
                <p:outputLabel value="#{msg.From}"/>
                <p:calendar id="from" timeZone="#{userContextService.getTimeZone()}"
                            locale="#{userContextService.getCalendarLocale()}"
                            pattern="#{userContextService.timeFormat()}"
                            widgetVar="varApprovalDateFrom" showButtonPanel="true"
                            showOn="button" navigator="true"/>
                <p:outputLabel value="#{msg.To}"/>
                <p:calendar id="to" timeZone="#{userContextService.getTimeZone()}"
                            locale="#{userContextService.getCalendarLocale()}"
                            pattern="#{userContextService.timeFormat()}"
                            widgetVar="varApprovalDateTo" showButtonPanel="true"
                            showOn="button" navigator="true"/>
            </h:panelGrid>
            <p:commandButton
                    onclick="setDateFilter('varDataList', 'varApprovalDate', 'varApprovalDateFrom', 'varApprovalDateTo'); PF('dateFilter').hide();"
                    title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
            <p:commandButton onclick="PF('dateFilter').hide()" title="#{msg.Close}"
                             icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
        </p:overlayPanel>
    </h:form>

</ui:composition>
</html>
