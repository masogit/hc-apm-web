<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <h:form>
        <p:dataTable id="datalist" value="#{budgetController.lazyModel}" var="item" widgetVar="varDataList"
                     selectionMode="single" selection="#{budgetController.selected}"
                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                     rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                     rows="10" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="10,20,50">
            <p:ajax event="rowSelect" update="createButton editButton deleteButton exportZipButton"/>
            <p:ajax event="rowDblselect" listener="#{budgetController.doubleClick}" oncomplete="openViewWindow(xhr, status, args)"/>
            <p:column headerText="#{msg.ApplicationNum}" >
                <h:outputText value="#{item.applicationNum}"/>
            </p:column>
            <p:column headerText="年份" >
                <h:outputText value="#{item.applicationDate}">
                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                       locale="#{userContextService.getCalendarLocale()}"
                                       pattern="yyyy"/>
                </h:outputText>
            </p:column>
             <p:column headerText="设备名称" >
                <h:outputText value="#{item.applicationAssetName}"/>
             </p:column>
            <p:column headerText="数量" >
                <h:outputText value="#{item.applicationQuantity}"/>
            </p:column>
            <p:column headerText="预算单价" >
                <h:outputText value="#{item.applicationPrice}">
                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                </h:outputText>
            </p:column>
            <p:column headerText="预算总价" >
                <h:outputText value="#{item.applicationAmount}">
                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                </h:outputText>
            </p:column>
            <p:column headerText="申请科室" >
                <h:outputText value="#{item.applicationDeptName}"/>
            </p:column>
            <p:column headerText="#{msg.Applicant}" >
                <h:outputText value="#{item.applicantName}"/>
            </p:column>
            <p:column headerText="#{msg.ApplicationDate}" >
                <h:outputText value="#{item.applicationDate}">
                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                       locale="#{userContextService.getCalendarLocale()}"
                                       pattern="#{userContextService.timeFormat14()}"/>
                </h:outputText>
            </p:column>
            <p:column headerText="状态">
                <h:outputText value="#{fieldMsg.fieldValue('budgetApplicationStatus', item.applicationStatus)}"/>
            </p:column>
            <p:column headerText="步骤">
                <h:outputText value="#{fieldMsg.fieldValue('budgetApplicationStep', item.applicationStep)}"/>
            </p:column>
            <p:column headerText="审批数量">
                <h:outputText value="#{item.offlineApplicationQuantity}"/>
            </p:column>
            <p:column headerText="#{msg.Approver}" >
                <h:outputText value="#{item.approveName}"/>
            </p:column>
            <p:column headerText="#{msg.ApprovalDate}">
                <f:facet name="filter">
                    <p:inputText id="approvalDate" widgetVar="varApprovalDate"/>
                </f:facet>
                <h:outputText value="#{item.approvalDate}">
                          <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                           locale="#{userContextService.getCalendarLocale()}"
                                           pattern="#{userContextService.timeFormat14()}"/>
                 </h:outputText>
            </p:column>
            <p:column headerText="采购状态" rendered="#{budgetController.tabIndex eq 3 }">
                <h:outputText value="#{fieldMsg.fieldValue('procureStatus', item.procureStatus)}"/>
            </p:column>
           <!-- <p:column headerText="采购信息确认状态" rendered="#{budgetController.tabIndex eq 4}">
                <h:outputText value="#{fieldMsg.fieldValue('budgetConfirmStatus', item.confirmStatus)}"/>
            </p:column>-->
            <f:facet name="{Toolbar}">
                <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray"
                                 title="#{msg.Create}"
                                 action="#{budgetController.intoActionModel('Create')}"/>
                <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray"
                                 title="#{msg.Edit}"
                                 action="#{budgetController.intoActionModel('Edit')}"
                                 disabled="#{empty budgetController.selected }"/>

                <p:commandButton  title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray"
                                  ajax="false">
                    <p:dataExporter type="xls" target="datalist" fileName="Budget_Application_Export"/>
                </p:commandButton>
               <!-- <p:commandButton id="exportButton" ajax="false" title="#{msg.exportToXLS}" class="btn btn-sm btn-gray" actionListener="#{budgetController.exportExcel('BAP')}" icon="ui-icon-arrowstop-1-s">
                    <p:fileDownload value="#{budgetController.exportFile}"/>
                </p:commandButton>-->
                <p:commandButton id="deleteButton" icon="ui-icon-trash" class="btn btn-sm btn-gray" update="datalist" title="#{msg.Delete}"
                                 disabled="#{budgetController.deleteButtonStatus()}" actionListener="#{budgetController.delete}" >
                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                </p:commandButton>
                <p:commandButton id="exportZipButton" ajax="false" title="下载压缩文件" actionListener="#{budgetController.exportAll}"
                                 disabled="#{empty budgetController.selected}"
                                 icon="ui-icon-circle-triangle-s" class="btn btn-sm btn-gray">
                    <p:fileDownload value="#{budgetController.exportFile}"/>
                </p:commandButton>

                <p:commandButton id="importButton" ajax="false" title="年度申购信息导入" action="Import.xhtml" icon="ui-icon-arrowstop-1-n"  class="btn btn-sm btn-gray">
                        </p:commandButton>
            </f:facet>
        </p:dataTable>
    </h:form>
</ui:composition>
</html>
