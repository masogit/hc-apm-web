       <h:form id="assetSearchForm">
            <p:fieldset legend="#{msg.searchAsset}">
                <p:panelGrid id="assetSearchPanel" columns="3" layout="grid"
                             styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.AssetGroup}</label>
                        <p:selectOneMenu value="#{budgetController.assetSearchForm.assetGroup}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"
                                           itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            <p:ajax event="change" listener="#{budgetController.onAssetFilterAssetGroupChange}"
                                    update="@this assetGroupSecondary"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{budgetController.show('assetGroupSecondary')}">
                        <p:outputLabel class="label">#{msg.AssetGroupSecondary}</p:outputLabel>
                        <p:selectOneMenu id="assetGroupSecondary"
                                         value="#{budgetController.assetSearchForm.assetGroupSecondary}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{budgetController.assetFilterAssetGroupSecondaryList}" var="item"
                                           itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label" value="#{msg.EquipmentName}"/>
                        <p:inputText value="#{budgetController.assetSearchForm.assetName}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">#{msg.AssetBrand}</p:outputLabel>
                        <p:inputText value="#{budgetController.assetSearchForm.assetBrand}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EquipmentModel}</label>
                        <p:inputText value="#{budgetController.assetSearchForm.assetModel}"/>
                    </h:panelGroup>
                    <h:panelGroup style="display: flex;">
                        <p:commandButton value="#{msg.Search}"
                                         actionListener="#{budgetController.searchAsset}"
                                         update="AssetSelectForm"/>
                        <p:commandButton value="#{msg.Reset}"
                                         actionListener="#{budgetController.resetAssetSearch}"
                                         update="AssetSelectForm assetSearchForm"/>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
