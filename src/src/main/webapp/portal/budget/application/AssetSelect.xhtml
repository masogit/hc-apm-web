<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="AssetSelectDlg" widgetVar="AssetSelectDialog" modal="true" resizable="false"
              draggable="true" appendTo="@(body)" width="960" height="560"
              header="选择设备">
        <h:form id="assetSearchForm">
            <p:fieldset legend="#{msg.searchAsset}">
                <p:panelGrid id="assetSearchPanel" columns="3" layout="grid"
                             styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <p:outputLabel class="label" value="#{msg.EquipmentName}"/>
                        <p:inputText value="#{budgetController.assetSearchForm.assetName}"/>
                    </h:panelGroup>
                   <h:panelGroup>
                      <p:outputLabel class="label">推荐品牌</p:outputLabel>
                      <p:inputText value="#{budgetController.assetSearchForm.assetBrand}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">规格</p:outputLabel>
                        <p:inputText value="#{budgetController.assetSearchForm.standards}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">型号</p:outputLabel>
                        <p:inputText value="#{budgetController.assetSearchForm.assetModel}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel class="label">设备分类</p:outputLabel>
                        <p:selectOneMenu  id="assetGroup" value="#{budgetController.assetSearchForm.applicationAssetCategory}"  >
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup style="display: flex;">
                        <p:commandButton value="#{msg.Search}"
                                         actionListener="#{budgetController.searchAsset}"
                                         update="AssetSelectForm"/>
                        <p:commandButton value="#{msg.Reset}"
                                         actionListener="#{budgetController.resetAssetSearch}"
                                         update="AssetSelectForm assetSearchForm"/>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
        </h:form>
        <h:form id="AssetSelectForm">
            <p:dataTable id="assetDatalist" value="#{budgetController.optionalBudgetAssets}" var="item" widgetVar="varAssetDatalist"
                         selectionMode="single" selection="#{budgetController.curSelectBudgetAssetInfo}"
                         lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.asset.id}"
                         paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5,10,20">
                <p:column headerText="#{msg.EquipmentName}">
                    <h:outputText value="#{item.name}"/>
                </p:column>
                <p:column headerText="推荐品牌">
                    <h:outputText value="#{item.assetBrand}"/>
                </p:column>
                <p:column headerText="规格">
                    <h:outputText value="#{item.standards}"/>
                </p:column>
                <p:column headerText="型号">
                    <h:outputText value="#{item.assetModel}"/>
                </p:column>
                <p:column headerText="设备分类">
                    <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.applicationAssetCategory)}"/>
                </p:column>
                <f:facet name="{Toolbar}">
                    <p:commandButton value="#{msg.AddNewAsset}" class="zoom-08"
                                     actionListener="#{budgetController.prepareCreateAsset}"
                                     update="AssetEditDlg"
                                     oncomplete="PF('AssetEditDialog').show()"/>
                </f:facet>
            </p:dataTable>
            <br/>
            <p:commandButton validateClient="true" actionListener="#{budgetController.onBudgetAssetInfoChange}"
                             value="确定"
                             update=":AssetSelectDlg, @(.budgetAssetInfoChange), :growl"
                             oncomplete="handleSubmit(args, 'AssetSelectDialog');"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}"
                             onclick="PF('AssetSelectDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
