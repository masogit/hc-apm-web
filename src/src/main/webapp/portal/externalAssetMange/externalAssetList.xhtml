<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.externalAssetManage}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="externalAssetListForm">
                    <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                        <p:commandButton value="#{msg.probationApplication}" update="datalist buttonSet" action="#{assetProbationController.createAction()}" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_APPLICATION')}"/>
                        <p:commandButton value="#{msg.all}" update="datalist buttonSet" disabled="#{assetProbationController.queryIndex == -1}" action="/portal/externalAssetMange/externalAssetList.xhtml?faces-redirect=true&amp;query=-1"/>
                        <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus','0')}" update="datalist buttonSet externalAssetListForm" disabled="#{assetProbationController.queryIndex == 0}" action="/portal/externalAssetMange/externalAssetList.xhtml?faces-redirect=true&amp;query=0" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_TEMP_SAVE') and userContextService.hasRole('ProbationStaff')}"/>
                        <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus','1')}" update="datalist buttonSet externalAssetListForm" disabled="#{assetProbationController.queryIndex == 1}" action="/portal/externalAssetMange/externalAssetList.xhtml?faces-redirect=true&amp;query=1" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_DETECTION')}"/>
                        <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus','2')}" update="datalist buttonSet externalAssetListForm" disabled="#{assetProbationController.queryIndex == 2}" action="/portal/externalAssetMange/externalAssetList.xhtml?faces-redirect=true&amp;query=2" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_PROBATION')}"/>
                        <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus','3')}" update="datalist buttonSet externalAssetListForm" disabled="#{assetProbationController.queryIndex == 3}" action="/portal/externalAssetMange/externalAssetList.xhtml?faces-redirect=true&amp;query=3" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_PROBATION')}"/>
                        <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus','4')}" update="datalist buttonSet externalAssetListForm" disabled="#{assetProbationController.queryIndex == 4}" action="/portal/externalAssetMange/externalAssetList.xhtml?faces-redirect=true&amp;query=4" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_EVACUATION')}"/>
                        <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus','5')}" update="datalist buttonSet externalAssetListForm" disabled="#{assetProbationController.queryIndex == 5}" action="/portal/externalAssetMange/externalAssetList.xhtml?faces-redirect=true&amp;query=5" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_CLOSED')}"/>
                        <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus','6')}" update="datalist buttonSet externalAssetListForm" disabled="#{assetProbationController.queryIndex == 6}" action="/portal/externalAssetMange/externalAssetList.xhtml?faces-redirect=true&amp;query=6" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_CLOSED')}"/>
                        <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus','7')}" update="datalist buttonSet externalAssetListForm" disabled="#{assetProbationController.queryIndex == 7}" action="/portal/externalAssetMange/externalAssetList.xhtml?faces-redirect=true&amp;query=7" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_CANCEL')}"/>
                    </h:panelGrid>
                    <p:dataTable id="datalist" value="#{assetProbationController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single" selection="#{assetProbationController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.lastModifiedDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500" >
                        <p:ajax event="filter" listener="#{assetProbationController.onFilter}"/>
                        <p:ajax event="rowSelect" listener="#{assetProbationController.onSelectOrder(item.id)}" onstart="prepareOrderViewWindow();" oncomplete="openOrderViewWindow(xhr, status, args)"/>
                        <p:column headerText="#{msg.zkbPartOrder_srNum}" sortBy="#{item.orderNum}" filterBy="#{item.orderNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.orderNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.EquipmentName}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.pattern}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                        <p:column headerText="#{msg.AssetDepartment}" sortBy="#{item.assetDeptName}" filterBy="#{item.assetDeptName}" filterMatchMode="LIKE">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" filter="true" filterMatchMode="contains">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{assetProbationController.assetDeptList}" var="item" itemLabel="#{item.name}" itemValue="#{item.name}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.assetDeptName}"/>
                        </p:column>
                        <p:column headerText="#{msg.AssetDepartment.concat(msg.contactPerson)}" sortBy="#{item.deptContactName}" filterBy="#{item.deptContactName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.deptContactName}"/>
                        </p:column>
                        <p:column headerText="#{msg.zkbEngineer_companyName}" sortBy="#{item.company}" filterBy="#{item.company}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.company}"/>
                        </p:column>
                        <p:column headerText="#{msg.approvalCompletedDate}" filterBy="#{item.approvalCompletedDate}" filterMatchMode="GET" sortBy="#{item.approvalCompletedDate}">
                            <f:facet name="filter">
                                <p:inputText id="filterApprovalCompletedDate" widgetVar="varFilterApprovalCompletedDate"/>
                            </f:facet>
                            <h:outputText value="#{item.approvalCompletedDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.PlannedStartTime}" filterBy="#{item.planStartDate}" filterMatchMode="GET" sortBy="#{item.planStartDate}">
                            <f:facet name="filter">
                                <p:inputText id="filterStartTime" widgetVar="varFilterStartTime"/>
                            </f:facet>
                            <h:outputText value="#{item.planStartDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.plannedEndTime}"  filterBy="#{item.planEndDate}" filterMatchMode="GET" sortBy="#{item.planEndDate}">
                            <f:facet name="filter">
                                <p:inputText id="filterEndTime" widgetVar="varFilterEndTime"/>
                            </f:facet>
                            <h:outputText value="#{item.planEndDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.probationStatus}" sortBy="#{item.status}" filterBy="#{item.status}" filterMatchMode="EQ" rendered="#{assetProbationController.queryIndex eq -1}">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" rendered="#{assetProbationController.queryIndex == -1}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('probationStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.cancel ? fieldMsg.doGetFieldValue('probationStatus', 7) : fieldMsg.doGetFieldValue('probationStatus', item.status)}"/>
                        </p:column>
                        <p:column headerText="#{msg.Operation}" style="width: 100px" exportable="false" rendered="#{assetProbationController.canOperation()}">
                            <p:commandButton value="#{msg.modify}" actionListener="#{assetProbationController.setSelected(item)}" action="#{assetProbationController.editAction(0)}" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_TEMP_SAVE') and item.status eq 0 and item.applicantUserUid eq assetProbationController.loginUser.uid}"/>
                            <p:commandButton value="#{msg.modify}" actionListener="#{assetProbationController.setSelected(item)}" action="#{assetProbationController.editAction(-11)}" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_TEMP_SAVE') and item.status eq 1 and item.applicantUserUid eq assetProbationController.loginUser.uid}"/>
                            <p:commandButton value="#{msg.modify}" actionListener="#{assetProbationController.setSelected(item)}" action="#{assetProbationController.editAction(-22)}" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_TEMP_SAVE') and item.status eq 2 and item.detectionUserUid eq assetProbationController.loginUser.uid}"/>
                            <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus', 1).substring(1)}" actionListener="#{assetProbationController.setSelected(item)}" action="#{assetProbationController.editAction(1)}" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_DETECTION') and item.status eq 1 and item.currentPersonId eq assetProbationController.loginUser.uid}"/>
                            <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus', 2).substring(1)}" actionListener="#{assetProbationController.setSelected(item)}" action="#{assetProbationController.editAction(2)}" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_PROBATION') and item.status eq 2 and item.currentPersonId eq assetProbationController.loginUser.uid}"/>
                            <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus', 4).substring(1)}" actionListener="#{assetProbationController.setSelected(item)}" action="#{assetProbationController.editAction(3)}" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_EVACUATION') and item.status eq 3 and item.currentPersonId eq assetProbationController.loginUser.uid}"/>
                            <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus', 4).substring(1)}" actionListener="#{assetProbationController.setSelected(item)}" action="#{assetProbationController.editAction(4)}" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_EVACUATION') and item.status eq 4 and item.currentPersonId eq assetProbationController.loginUser.uid}"/>
                            <p:commandButton value="#{fieldMsg.doGetFieldValue('probationStatus', 5).substring(1)}" actionListener="#{assetProbationController.setSelected(item)}" action="#{assetProbationController.editAction(5)}" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_CLOSED') and item.status eq 5 and item.currentPersonId eq assetProbationController.loginUser.uid}"/>
                            <p:commandButton value="#{msg.Cancel}" update="cancelForm" actionListener="#{assetProbationController.setSelected(item)}" oncomplete="PF('cancelDialog').show()" rendered="#{userContextService.accessContainsFunctionMenu('EXTERNAL_ASSET_MANAGE_CANCEL') and item.status le 2 and item.applicantUserUid eq assetProbationController.loginUser.uid}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="ExternalAsset_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
            <!--取消对话框 -->
            <p:dialog id="cancelDialog" widgetVar="cancelDialog" modal="true" width="400"  resizable="true" draggable="true" header="#{msg.CancelDialog}">
                <h:panelGroup>
                    <h:form id="cancelForm" class="cancelFormCls" >
                        <h:panelGroup>
                            <label class="label">#{msg.CancellationReason}<span style="color:red">*</span></label>
                            <p:inputTextarea  value="#{assetProbationController.selected.cancelReason}" maxlength="256" required="true" requiredMessage="#{msg.CancelReasonCannotBeEmpty}"/>
                        </h:panelGroup>
                        <br></br>
                        <h:panelGroup>
                            <p:commandButton validateClient="true" update="externalAssetListForm:datalist :growl" actionListener="#{assetProbationController.cancelOrder()}" value="#{msg.Confirm}" icon="ui-icon-check" oncomplete="handleSubmit(args, 'cancelDialog');">
                                <p:confirm header="#{msg.confirmcancel}" message="#{msg.probationConfirmCancel}" icon="ui-icon-info"/>
                            </p:commandButton>
                            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('cancelDialog').hide()"/>
                        </h:panelGroup>
                    </h:form>
                </h:panelGroup>
            </p:dialog >

            <p:overlayPanel appendTo="externalAssetListForm" widgetVar="panelFilterApprovalCompletedDate" for="externalAssetListForm:datalist:filterApprovalCompletedDate" dismissable="false">
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varApprovalCompletedDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varApprovalCompletedDateTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList', 'varFilterApprovalCompletedDate', 'varApprovalCompletedDateFrom', 'varApprovalCompletedDateTo'); PF('panelFilterApprovalCompletedDate').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterApprovalCompletedDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>

            <p:overlayPanel appendTo="externalAssetListForm" widgetVar="panelFilterStartTime" for="externalAssetListForm:datalist:filterStartTime" dismissable="false">
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varStartTimeFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varStartTimeTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList', 'varFilterStartTime', 'varStartTimeFrom', 'varStartTimeTo'); PF('panelFilterStartTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterStartTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>

            <p:overlayPanel appendTo="externalAssetListForm" widgetVar="panelFilterEndTime" for="externalAssetListForm:datalist:filterEndTime" dismissable="false">
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varEndTimeFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varEndTimeTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList', 'varFilterEndTime', 'varEndTimeFrom', 'varEndTimeTo'); PF('panelFilterEndTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterEndTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>
        </div>
        <script>
            var newWin;
            function prepareOrderViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openOrderViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }
        </script>
    </ui:define>

</ui:composition>
