<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template_withoutGrowl.xhtml">
    <ui:define name="content">
        <link rel="stylesheet" href="all.min.css"/>
        <link rel="stylesheet" href="github.min.css"/>
        <script src="highlight.min.js"></script>
        <script src="marked.min.js"></script>
        <script src="purify.min.js"></script>
        <script src="#{request.contextPath}/portal/js/axios.min.js"></script>
        <script src="all.chat.js"></script>
        <script src="chat.js"></script>
        <style>
            /* 聊天容器样式 */
            .chat-container {
                width: auto;
                margin: 0 auto;
                max-height: 90vh;
                overflow-y: auto;
                padding: 20px;
                background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
                scroll-behavior: smooth;
            }

            /* 消息气泡样式 */
            .message-content {
                max-width: 70%;
                background-color: rgba(255, 255, 255, 0.95);
                border-radius: 18px;
                padding: 12px 16px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                transition: all 0.3s ease;
            }

            .message-content:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            }

            /* 用户消息样式 */
            .message-right {
                display: flex;
                justify-content: flex-end;
                margin-bottom: 16px;
                width: 100%;
            }

            /* 助手消息样式 */
            .message-left {
                display: flex;
                justify-content: flex-start;
                margin-bottom: 16px;
                width: 100%;
            }

            .message-left .message-content {
                background: linear-gradient(135deg, #f5eded 0%, #d9d2d2 100%);
            }

            /* 用户信息样式 */
            .user-info {
                display: flex;
                align-items: center;
                margin-bottom: 6px;
            }

            .user-name {
                font-size: 0.75rem;
                color: #0e77ca;
                margin-left: 12px;
                font-weight: 600;
            }

            .assistant-name {
                color: #e9d5ff;
            }

            /* 消息文本样式 */
            .message-text {
                color: #2d3748;
                font-size: 0.875rem;
                text-align: right;
                margin-left: 16px;
                word-wrap: break-word;
                line-height: 1.5;
            }

            .message-left .message-text {
                text-align: left;
                margin-left: 0;
                margin-right: 16px;
                color: #1a1919;
                white-space: pre-wrap; /* 保留空格和换行 */
                word-break: break-word; /* 自动换行以防文字太长 */
            }

            /* 输入指示器样式 */
            .typing-indicator {
                display: flex;
                align-items: center;
                color: #9fa8da;
                font-size: 0.75rem;
            }

            .typing-dots {
                display: flex;
                margin-left: 8px;
            }

            .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background-color: #9fa8da;
                margin: 0 2px;
                animation: typing 1.4s infinite ease-in-out;
            }

            .dot:nth-child(2) {
                animation-delay: 0.2s;
            }

            .dot:nth-child(3) {
                animation-delay: 0.4s;
            }

            @keyframes typing {
                0%, 60%, 100% {
                    transform: translateY(0);
                    opacity: 0.6;
                }
                30% {
                    transform: translateY(-4px);
                    opacity: 1;
                }
            }

            /* 按钮样式 */
            .p-button-primary {
                background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
                border: none;
                padding: 12px 24px;
                border-radius: 12px;
                color: white;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .p-button-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            }

            .p-button-warning {
                background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            }

            /* 响应式设计 */
            @media (max-width: 768px) {
                .chat-container {
                    height: 500px;
                    padding: 15px;
                }

                .message-content {
                    max-width: 85%;
                }
            }

            /* 滚动条样式 */
            .chat-container::-webkit-scrollbar {
                width: 6px;
            }

            .chat-container::-webkit-scrollbar-track {
                background: rgba(255, 255, 255, 0.3);
                border-radius: 10px;
            }

            .chat-container::-webkit-scrollbar-thumb {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }

            .chat-container::-webkit-scrollbar-thumb:hover {
                background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
                border-radius: 10px;
            }
            .dropdown-transition {
                transition: all 0.3s ease-in-out;
            }
            .dropdown-shadow {
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            }
            .option-hover:hover {
                background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
                transform: translateX(4px);
            }
            .message-markdown {
                line-height: 1.6;
                white-space: normal;       /* Markdown 交给渲染控制 */
            }

            .message-markdown blockquote {
                border-left: 4px solid #e0e0e0;
                margin: 8px 0;
                padding: 6px 12px;
                color: #555;
            }

            .message-markdown table {
                border-collapse: collapse;
            }
            .message-markdown table th,
            .message-markdown table td {
                border: 1px solid #e0e0e0;
                padding: 6px 10px;
            }
            .message-markdown {
                line-height: 1.5;
                white-space: normal;
            }

            .message-markdown p {
                margin: 0.3em 0;  /* 段落更紧凑 */
            }

            .message-markdown ul,
            .message-markdown ol {
                margin: 0.3em 0 0.3em 1.2em;
            }

            .message-markdown pre {
                margin: 0.4em 0;
                padding: 10px;
                border-radius: 6px;
                background: #f6f8fa;
            }

            .message-markdown code {
                background: #f6f8fa;
                padding: 2px 4px;
                border-radius: 3px;
                font-family: Menlo, Consolas, monospace;
                font-size: 0.95em;
            }
        </style>
        <div class="ui-g-12 card cardTitle bg-white shadow-lg">
            <div class="p-4" style="margin-top: -22px;">
                <h1 class="pageTitle text-3xl font-bold text-purple-600">
                    <i class="fa fa-slideshare"></i>
                    APM知识库小管家
                </h1>
            </div>
            <input type="hidden" id="userName" value="#{userContextService.userName}" />
            <div class="chat-container bg-white rounded-lg shadow-xl mt-4">
                <div id="logDisplayForm">
                    <div id="messagesList" class="w-full">
                        <!-- 消息将通过JavaScript动态生成 -->
                    </div>
                </div>

                <!-- 控制面板 -->
                <div class="bg-white rounded-lg shadow-md p-6 mb-6 mt-4">
                    <form id="logForm" class="space-y-4">
                        <!-- 新日志输入 -->
                        <div class="w-full h-32 bg-gray-50 rounded-lg border border-gray-200 p-4">
                    <textarea
                            id="newLogMessage"
                            class="w-full h-full bg-transparent border-none resize-none focus:outline-none"
                            placeholder="请输入您的问题或消息..."
                            rows="4"
                    ></textarea>
                        </div>

                        <!-- 操作按钮 -->
                        <div class="flex flex-wrap gap-3 mt-4">
                            <button
                                    type="button"
                                    id="sendButton"
                                    class="p-button-primary bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg transition-all duration-300 flex items-center"
                                    onclick="sendMessage()"
                            >
                                <i class="fa fa-paper-plane mr-2"></i>
                                发送
                            </button>

                            <button
                                    type="button"
                                    id="clearButton"
                                    class="p-button-warning bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-lg transition-all duration-300 flex items-center"
                                    onclick="clearChat()"
                            >
                                <i class="fa fa-trash mr-2"></i>
                                清空记录
                            </button>
<!--                            <button-->

<!--                                    id="simulateButton"-->
<!--                                    class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg transition-all duration-300 flex items-center"-->
<!--                                    onclick="simulateChat()"-->
<!--                            >-->
<!--                                <i class="fa fa-magic mr-2"></i>-->
<!--                                模拟对话-->
<!--                            </button>-->
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
