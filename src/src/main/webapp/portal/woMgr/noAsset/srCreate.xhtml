<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <p:dialog id="createSrNoAssetDialog" widgetVar="createSrNoAssetDialog" modal="true" resizable="false" draggable="true" width="80%" height="450" appendTo="@(body)" header="#{msg.newrepair}">
        <h:form id="createForm">
            <p:fieldset legend="#{msg.CreateWorkOrder}" rendered="#{not empty serviceRequestNoAssetController.newServiceRequest}">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.hospitalId}*</label>
                        <h:outputText value="#{serviceRequestNoAssetController.newServiceRequest.siteName}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.clinicalDeptName}*</label>
                        <p:inputText  id="dept" value="#{serviceRequestNoAssetController.newServiceRequest.deptName}" readonly="true" required="true" requiredMessage="申请科室 #{msg.ValidationRequire}"/>
                        <p:commandButton id="orgEdit" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" />
                        <p:overlayPanel  id="popupPanelEdit" widgetVar="varOrgEdit" for="orgEdit"
                                         style="position: absolute; left: 0; top: 0; width: 300px;" dynamic="false" modal="false" dismissable="true"   >
                            <p:scrollPanel style="height:300px; border: 0" mode="native"  >
                                <p:inputText id="searchDeptName" value="#{serviceRequestNoAssetController.searchDeptName}"  />
                                <p:commandButton process=":createForm:searchDeptName @this" partialSubmit="true" icon="ui-icon-search" update="orgTreeEdit" actionListener="#{mcApplyPurchaseEditController.treeSeachCondition()}" value="检索"/>
                                <p:tree id="orgTreeEdit" value="#{serviceRequestNoAssetController.orgTree}" var="node"
                                        selectionMode="single" class="tree" style="width:98%; border:0"  >
                                    <p:ajax process="@this" event="select"
                                            update="@parent:dept "
                                            listener="#{serviceRequestNoAssetController.onSelectTreeNode}"
                                            oncomplete="PF('varOrgEdit').hide();" />
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.assetName}*</label>
                        <p:inputText id="assetName" value="#{serviceRequestNoAssetController.newServiceRequest.assetName}" required="true" requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.requestorName}</label>
                        <p:outputLabel value="#{serviceRequestNoAssetController.newServiceRequest.requestorName}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.RepairReporterPhone}</label>
                        <p:inputText id="requestorPhone" requiredMessage="#{msg.RepairReporterPhone} #{msg.ValidationRequire}" value="#{serviceRequestNoAssetController.newServiceRequest.requestorPhone}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.casePriority}*</label>
                        <p:selectOneMenu value="#{serviceRequestNoAssetController.newServiceRequest.casePriority}">
                            <f:selectItems value="#{fieldMsg.getFieldValueList('casePriority')}" var="item"
                                           itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.requestTime}</label>
                        <p:outputLabel value="#{serviceRequestNoAssetController.newServiceRequest.requestTime}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                        </p:outputLabel>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.requestReason}*</label>
                        <p:inputTextarea placeholder="#{msg.EquipmentFault}" value="#{serviceRequestNoAssetController.newServiceRequest.requestReason}" maxlength="256" />
                        <p:outputLabel value="#{serviceRequestNoAssetController.newServiceRequest.requestReason}" />
                    </h:panelGroup>
                    <h:panelGroup id="assetstatus">
                        <label class="label">#{msg.status}</label>
                        <p:selectOneRadio id="status" value="#{serviceRequestNoAssetController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                            <p:ajax listener="#{serviceRequestNoAssetController.onStatusChange()}" update="assetstatus" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(1, 3)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            <c:if test="#{userContextService.countyArea}">
                                <f:selectItem itemLabel="#{msg.NormalUsage}" itemValue="1"/>
                            </c:if>
                        </p:selectOneRadio>
                        <p:calendar timeZone="GMT+8" label="#{msg.confirmedDownTime}" rendered="#{serviceRequestNoAssetController.needConfirmTime}" id="confirmedDownTime" pattern="yyyy/MM/dd HH:mm" value="#{serviceRequestNoAssetController.newServiceRequest.confirmedDownTime}" showOn="button"
                                    readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.confirmedDownTime} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <!--<h:panelGroup >
                        <label class="label">#{msg.comment}</label>
                        <p:inputTextarea value="#{serviceRequestNoAssetController.newServiceRequest.comment}" maxlength="256" />
                    </h:panelGroup>-->

                </p:panelGrid>

                <p:dataGrid id="pictureList" var="fileitem" value="#{serviceRequestNoAssetController.picList}" columns="5" layout="grid">
                    <f:facet name="header">#{msg.RequestImage}<p:outputLabel value="#{msg.MaxImageUploadLimit}" style="color: red"></p:outputLabel></f:facet>
                    <p:panel style="text-align:center">
                        <h:panelGrid columns="1" style="width:100%">
                            <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>
                            <p:commandButton actionListener="#{serviceRequestNoAssetController.removeAttachmentById(fileitem.id)}" update="pictureList :createForm:type1" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </h:panelGrid>
                    </p:panel>
                </p:dataGrid>
                <p:fileUpload id="type1" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/" fileUploadListener="#{serviceRequestNoAssetController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                              multiple="true" sizeLimit="10000000" update="pictureList type1" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" value="#{msg.Save}" icon="ui-icon-check" actionListener="#{serviceRequestNoAssetController.saveServiceRequest()}"  update=":listForm :growl" style="float:left" oncomplete="handleSubmit(args, 'createSrNoAssetDialog');"/>
                    <p:commandButton value="#{msg.Return}" icon="ui-icon-arrow-back" actionListener="#{serviceRequestNoAssetController.cancel()}" immediate="true" update=":createForm :growl" style="float:left" oncomplete="handleSubmit(args, 'createSrNoAssetDialog');"/>
                </h:panelGroup>
            </p:fieldset>

        </h:form>
    </p:dialog>
</ui:composition>

</html>
