<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
   <ui:define name="head">
   </ui:define>
   <ui:define name="content">
      <div class="ui-g clearfix" id="header">
         <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="无报修台账查看"/>
         </div>

         <div class="ui-g-12 card">
         <h:form id="viewForm">
            <p:fieldset legend="报修信息">
               <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                  <h:panelGroup>
                     <label class="label">#{msg.hospitalId}*</label>
                     <h:outputText value="#{serviceRequestNoAssetController.selected.siteName}"/>
                  </h:panelGroup>
                  <h:panelGroup>
                     <label class="label">#{msg.clinicalDeptName}*</label>
                     <h:outputText value="#{serviceRequestNoAssetController.selected.deptName}"/>
                  </h:panelGroup>
                  <h:panelGroup>
                     <label class="label">#{msg.srNum}</label>
                     <p:outputLabel value="#{serviceRequestNoAssetController.selected.srNum}" />
                  </h:panelGroup>
                  <h:panelGroup>
                     <label class="label">#{msg.assetName}</label>
                     <h:outputText value="#{serviceRequestNoAssetController.selected.assetName}" />
                  </h:panelGroup>
                  <h:panelGroup>
                     <label class="label">#{msg.repairSource}</label>
                     <p:outputLabel value="#{fieldMsg.doGetFieldValue('RepairSource',serviceRequestNoAssetController.selected.srRepairSource)}"/>
                  </h:panelGroup>
                  <h:panelGroup>
                     <label class="label">#{msg.requestorName}</label>
                     <h:outputText value="#{serviceRequestNoAssetController.selected.requestorName}" />
                  </h:panelGroup>
                  <h:panelGroup>
                     <label class="label">#{msg.RepairReporterPhone}</label>
                     <h:outputText value="#{serviceRequestNoAssetController.selected.requestorPhone}" />
                  </h:panelGroup>


                  <h:panelGroup>
                     <label class="label">#{msg.casePriority}*</label>
                     <h:outputText value="#{fieldMsg.fieldValue('casePriority',serviceRequestNoAssetController.selected.casePriority)}" />
                  </h:panelGroup>
                  <h:panelGroup>
                     <label class="label">#{msg.requestTime}</label>
                     <p:outputLabel value="#{serviceRequestNoAssetController.selected.requestTime}" >
                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                     </p:outputLabel>
                  </h:panelGroup>
                  <h:panelGroup>
                     <label class="label">#{msg.requestReason}*</label>
                     <h:outputText value="#{serviceRequestNoAssetController.selected.requestReason}" />
                  </h:panelGroup>
                  <h:panelGroup id="assetstatus" class="updateDownTime">
                     <label class="label">#{msg.status}</label>
                     <p:selectOneRadio id="status" value="#{serviceRequestNoAssetController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.validationRequire}" disabled="#{serviceRequestNoAssetController.currentStatus ne 3}">
                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(0, 1)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="true"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(1, 3)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="#{serviceRequestNoAssetController.selected.currentStepId ne 4}"/>
                     </p:selectOneRadio>
                  </h:panelGroup>
                  <h:panelGroup id="showDownTime" rendered="#{serviceRequestNoAssetController.currentStatus == 2}">
                     <label class="label">#{msg.confirmedDownTime}</label>
                     <p:outputLabel value="#{serviceRequestNoAssetController.selected.confirmedDownTime}" >
                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                     </p:outputLabel>
                  </h:panelGroup>
                  <h:panelGroup >
                     <label class="label">#{msg.comment}</label>
                     <h:outputText value="#{serviceRequestNoAssetController.selected.comment}"/>
                  </h:panelGroup>
                  <h:panelGroup >
                     <label class="label">#{msg.Cancelor}</label>
                     <h:outputText value="#{serviceRequestNoAssetController.selected.cancelUserName}"/>
                  </h:panelGroup>
                  <h:panelGroup >
                     <label class="label">#{msg.cancelWorkOrderReason}</label>
                     <h:outputText value="#{serviceRequestNoAssetController.selected.cancelReason}"/>
                  </h:panelGroup>

                  <h:panelGroup >
                     <label class="label">#{msg.CloseTime_xlsx}</label>
                     <p:outputLabel value="#{serviceRequestNoAssetController.selected.closeTime}" >
                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                     </p:outputLabel>
                  </h:panelGroup>
               </p:panelGrid>
               <p:dataGrid var="audioItem" value="#{serviceRequestNoAssetController.audioList}" columns="2" layout="grid" rendered="#{not empty serviceRequestNoAssetController.audioList}">
                  <f:facet name="header">#{msg.requestVoice}</f:facet>
                  <p:panel  style="text-align:center">
                     <h:panelGrid columns="1" style="width:100%">
                        <audio controls="controls">
                           <source src="#{fileDownloadService.getFileUrl(audioItem.objectStorageId)}" />
                        </audio>
                     </h:panelGrid>
                  </p:panel>
                  <h:panelGroup >
                     <label class="label">语音转文字</label>
                     <h:outputText value="#{serviceRequestNoAssetController.selected.voiceToText}"/>
                  </h:panelGroup>
               </p:dataGrid>


               <p:fieldset legend="#{msg.requestImage}" toggleable="false" rendered="#{not empty serviceRequestNoAssetController.getPicListByBoType('ServiceRequestNoAsset')}">
                  <p:dataGrid id="requestImage" var="fileitem" value="#{serviceRequestNoAssetController.getPicListByBoType('ServiceRequestNoAsset')}" columns="5" layout="grid" rendered="#{not empty serviceRequestNoAssetController.getPicListByBoType('ServiceRequestNoAsset')}">
                     <p:panel  style="text-align:center">
                        <h:panelGrid columns="1" style="width:100%" >
                           <p:ajax disabled="#{!preViewerBean.isPreview(fileitem)}" event="click" update="previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(serviceRequestNoAssetController,fileitem.objectStorageId)}"/>
                           <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false" >
                           </p:graphicImage>
                        </h:panelGrid>
                        <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.objectName}" action="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                     </p:panel>
                  </p:dataGrid>
               </p:fieldset>

               <p:dataTable value="#{serviceRequestNoAssetController.getSrStep(selected.id)}" var="stepItem">
                  <p:column headerText="#{msg.stepName}">
                     <h:outputText value="#{stepItem.stepName}" />
                  </p:column>
                  <p:column headerText="#{msg.ownerName}">
                     <h:outputText value="#{stepItem.ownerName}" />
                  </p:column>
                  <p:column headerText="#{msg.startTime}">
                     <h:outputText value="#{stepItem.startTime}" >
                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                     </h:outputText>
                  </p:column>
                  <p:column headerText="#{msg.endTime}">
                     <h:outputText value="#{stepItem.endTime}" >
                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                     </h:outputText>
                  </p:column>
                  <p:column headerText="#{msg.description}">
                     <h:outputText value="#{stepItem.comments}"  style="word-wrap: break-word;"/>
                  </p:column>
               </p:dataTable>
            </p:fieldset>
          <!--  <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
               <h:panelGroup>

                   <p:commandButton value="转台账报修"  actionListener="#{serviceRequestNoAssetController.createServiceRequestByNoAsset(serviceRequestNoAssetController.selected)}" process="@this" icon="ui-icon-arrow-drop-down" update="createSRDialog "  oncomplete="PF('createSRDialog').show()" style="float:right;" />
               </h:panelGroup>
            </p:panelGrid>-->
         </h:form>
         </div>
      </div>
      <ui:include src="/portal/preview/view.xhtml"/>
      <!--<ui:include src="srWoCreate.xhtml"/>-->

   </ui:define>
   <style type="text/css">
      .header1  thead{
         display: none!important;
      }
   </style>
   <script type="text/javascript">
      function handlePreview(args, dialog) {
         debugger;
         var jqDialog = jQuery('#' + dialog);
         if (args.validationFailed) {
            PF(dialog).hide();
         } else {
            PF(dialog).show();
         }
      }
   </script>
</ui:composition>
