<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition>
        <p:dialog id="approveDialog" widgetVar="approveDialog" modal="true"  resizable="true" draggable="true" width="1000" appendTo="@(body)" header="审批" height="430">
            <h:form id="approveDialogForm" >
                <h:panelGroup id="display3" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputTextarea value="#{workOrderMgrController.comments}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4" maxlength="100"/>
                        </h:panelGroup>
                    <p:fieldset legend="费用明细" >

                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <p:dataTable id="accessList" class="uiTransparent" value="#{workOrderMgrController.getWorkOrderDetail(workOrderMgrController.selectedWorkOrder.id)}" var="item" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.accessory}">
                                        <h:outputText value="#{item.parts}"/>
                                    </p:column>

                                    <p:column headerText="#{msg.accessoryQuantity}">
                                        <h:outputText value="#{item.apartsQuantity}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.accessoryPrice}">
                                        <h:outputText value="#{item.partsPrice}">
                                            <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="序列号">
                                        <h:outputText value="#{item.serialNum}" />
                                    </p:column>
                                    <p:column headerText="质保期">
                                        <h:outputText value="#{item.warrantyDate}">
                                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="预计到达时间">
                                        <h:outputText value="#{item.estimatedArriveTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="到货">
                                        <h:outputText value="#{item.arrived?'已到货':'未到货'}" rendered="#{item.id ne '000'}"/>
                                    </p:column>

                                </p:dataTable>
                            </h:panelGroup>
                        </p:panelGrid>

                    </p:fieldset>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.approveWorkOrder('true')}" value="同意" update=":woMgrListForm woTab:woMgrDetailForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'approveDialog');"/>
                        <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.approveWorkOrder('false')}" value="拒绝" update=":woMgrListForm woTab:woMgrDetailForm" icon="ui-icon-clear" oncomplete="handleSubmit(args, 'approveDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('approveDialog').hide()"/>
                    </h:panelGroup>

                    <br/>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
