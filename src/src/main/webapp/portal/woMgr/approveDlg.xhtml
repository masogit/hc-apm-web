<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="approveDialog" widgetVar="approveDialog" modal="true"  resizable="true" draggable="true" width="1000" appendTo="@(body)" header="审批" height="430">
        <h:form id="approveDialogForm" >
            <h:panelGroup id="display3" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">故障类别</label>
                        <p:selectOneMenu  value="#{workOrderMgrController.selectedWorkOrder.caseType}" required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}" disabled="true">
                            <f:selectItems value="#{workOrderMgrController.getAssetFaultType()}" var="item" itemLabel="#{item.faultName}" itemValue="#{item.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea value="#{workOrderMgrController.comments}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4" maxlength="100"/>
                    </h:panelGroup>
                </p:panelGrid>
                <p:fieldset legend="费用明细" >

                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">工时(小时)</label>
                            <p:inputText value="#{workOrderMgrController.selectedWorkOrder.manHours}" readonly="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">其它费用</label>
                            <p:inputText value="#{workOrderMgrController.selectedWorkOrder.otherExpense}" readonly="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:dataTable id="accessList" class="uiTransparent" value="#{workOrderMgrController.getWorkOrderDetail(workOrderMgrController.selectedWorkOrder.id)}" var="item" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.accessory}">
                                    <h:outputText value="#{item.parts}"/>
                                </p:column>

                                <p:column headerText="#{msg.accessoryQuantity}">
                                    <h:outputText value="#{item.apartsQuantity}"/>
                                </p:column>
                                <p:column headerText="#{msg.accessoryPrice}">
                                    <h:outputText value="#{item.partsPrice}"/>
                                </p:column>

                            </p:dataTable>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:dataTable id="coworkerList" class="uiTransparent" value="#{workOrderMgrController.getWorkOrderCoworker(workOrderMgrController.selectedWorkOrder.id)}" var="item" widgetVar="coworkerDataList" lazy="false" paginator="false"
                                         rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.manHours}">
                                    <h:outputText value="#{item.manHours}" />
                                </p:column>
                                <p:column headerText="#{msg.coworker}">
                                    <h:outputText value="#{item.cowokerUserName}"/>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </p:panelGrid>

                </p:fieldset>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.approveWorkOrder('true')}" value="同意" update=":woMgrListForm :woMgrDetailForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'approveDialog');"/>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.approveWorkOrder('false')}" value="拒绝" update=":woMgrListForm :woMgrDetailForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'approveDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('approveDialog').hide()"/>
                </h:panelGroup>

                <br/>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
