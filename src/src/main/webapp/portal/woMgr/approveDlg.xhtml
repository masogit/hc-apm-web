<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition>
        <p:dialog id="approveDialog" widgetVar="approveDialog" modal="true"  resizable="true" draggable="true" width="1000" appendTo="@(body)" header="审批" height="430">
            <h:form id="approveDialogForm" >
                <h:panelGroup id="display3" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                    <p:fieldset legend="费用明细" >
                        <p:dataTable  id="accessList123" value="#{workOrderMgrController.getNeedApprovalDetails()}" var="item" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                            <!--<p:column selectionMode="multiple" style="text-align:center;color: #000!important"/>-->
                            <p:column >
                                <p:selectBooleanCheckbox value="#{workOrderMgrController.selectedMap[item.id]}"  class="selectCheckBox" rendered="#{empty item.approved or !item.approved}">
                                    <p:ajax listener="#{workOrderMgrController.onApprovedDetailsSelected(item.id)}"  update="@this @(.selectCheckBoxHeader)"/>
                                </p:selectBooleanCheckbox>
                                <h:outputText value="已经通过审批"  rendered="#{item.approved}"/>
                                <f:facet name="header"  >
                                    <p:selectBooleanCheckbox itemLabel="勾选审批" id="selectCheckBoxHeader" value="#{workOrderMgrController.selectedMap['All']}" class="selectCheckBoxHeader">
                                        <p:ajax  listener="#{workOrderMgrController.onApprovedDetailsSelected('All')}" update="@(.selectCheckBox)"/>
                                    </p:selectBooleanCheckbox>
                                    <!--<h:outputText value="勾选审批" />-->
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.accessory}">
                                <h:outputText value="#{item.parts}"/>
                            </p:column>

                            <p:column headerText="#{msg.accessoryQuantity}">
                                <h:outputText value="#{item.apartsQuantity}"/>
                            </p:column>
                            <p:column headerText="#{msg.accessoryPrice}">
                                <h:outputText value="#{item.partsPrice}">
                                    <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="序列号">
                                <h:outputText value="#{item.serialNum}" />
                            </p:column>
                            <p:column headerText="质保期">
                                <h:outputText value="#{item.warrantyDate}">
                                    <f:convertDateTime pattern="yyyy-MM-dd"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="申请时间">
                                        <h:outputText value="#{item.applyTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>
                            <p:column headerText="预计到达时间">
                                <h:outputText value="#{item.estimatedArriveTime}">
                                    <f:convertDateTime pattern="yyyy-MM-dd"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="到货">
                                <h:outputText value="#{item.arrived?'已到货':'未到货'}" rendered="#{item.id ne '000'}"/>
                            </p:column>

                        </p:dataTable>

                    </p:fieldset>
                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea id="comment" value="#{workOrderMgrController.comments}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4" maxlength="100"/>
                    </h:panelGroup>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.approveWorkOrder()}" value="审批" update="woTab:woMgrListForm woTab:woMgrDetailForm" icon="ui-icon-check" oncomplete="handleComplete(xhr, status, args);"/>
                        <!--<p:commandButton validateClient="true" actionListener="#{workOrderMgrController.approveWorkOrder('false')}" value="拒绝" update=":woMgrListForm :woMgrDetailForm" icon="ui-icon-clear" oncomplete="handleSubmit(args, 'approveDialog');"/>-->
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('approveDialog').hide()"/>
                    </h:panelGroup>

                </h:panelGroup>
            </h:form>
            <script>
                function handleComplete(xhr, status, args) {
                    if (args.needComents) {
                        $('#woTab\\:approveDialogForm\\:comment').addClass("ui-state-error");
                    } else {
                        handleSubmit(args, 'approveDialog');
                    }
                }
            </script>
        </p:dialog>
    </ui:composition>
</html>
