                    </div>
                    <p:fieldset legend="#{msg.RequestImage}" toggleable="false" rendered="#{not empty workOrderMgrMvsController.getPicListByBoType('ServiceRequest')}">

                    </p:fieldset>

                            <h:panelGrid columns="1" style="width:100%">
                                <p:ajax  event="click" update="previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(workOrderMgrMvsController,woPicItem.objectStorageId)}"/>
                                <p:graphicImage value="#{fileDownloadService.getFile(woPicItem.objectStorageId)}" height="80" width="100" stream="false">
                                </p:graphicImage>
                            </h:panelGrid>

                        </p:panel>
                    </p:dataGrid>

<!--                                <p:link href="#{fileDownloadService.getFileUrl(woAttachItem.objectStorageId)}"> #{msg.DownloadFile}</p:link>-->

                        </p:panel>

                            <h:panelGrid columns="1" style="width:100%">

                        <p:panel  style="text-align:center">

                                <p:ajax  event="click" update="previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(workOrderMgrMvsController,woPicItem.objectStorageId)}"/>

                        </p:panel>
                    </p:dataGrid>

                                <audio controls="controls">  
                                    <source src="#{fileDownloadService.getFileUrl(audioItem.objectStorageId)}" /> 
                                </audio> 
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>

                                    </p:column>

                                    </p:column>
-->

                                    <p:column headerText="#{msg.coworker}">

                                    <p:column headerText="#{msg.manHours}">
                                        <h:outputText value="#{coWorkerItem.manHours}" />
