<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <div class="ui-g-12 card">
        <!--<p:messages autoUpdate="true" closable="true" showDetail="false"/>-->

        <h:form id="woMvsMgrListForm">
            <h:panelGrid id="buttonSet2" columns="12" cellpadding="5">
                <c:choose>
                    <c:when test="#{!userContextService.hasCurrentTenantName('')}">
                        <p:commandButton value="#{msg.ToBeDone}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(0)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==0}"/>
                        <p:commandButton value="#{msg.repaired}" process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(1)}"  disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==1}" />
                        <p:commandButton value="#{msg.tobeReview}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(10)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==10}"/>
                        <p:commandButton value="#{msg.waitDispatch}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(2)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==2}" rendered="#{userContextService.isDispatcher() or userContextService.accessContainsFunctionMenu('REPAIR_ORDER_DISPATCH')}"/>
                        <p:commandButton value="#{msg.waitTake}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(3)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==3}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_TAKE')}"/>
                        <p:commandButton value="#{msg.repairing}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(4)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==4}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_TAKE')}"/>
                        <p:commandButton value="#{msg.waitAck}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(5)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==5}"/>
                        <p:commandButton value="#{msg.waitFeedback}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(6)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==6}"/>
                        <p:commandButton value="#{msg.waitClose}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(7)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==7}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_CLOSE')}"/>
                        <p:commandButton value="#{msg.closed}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(8)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==8}"/>
                        <p:commandButton value="#{msg.canceled}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(9)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==9}"/>
                        <p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(11)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==11}"/>
                    </c:when>
                    <c:otherwise>
                        <!--云阜 全部、待接单、维修中、已完成-->
                        <p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(11)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==11}"  />
                        <p:commandButton value="#{msg.waitTake}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(3)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==3}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_TAKE')}"/>
                        <p:commandButton value="#{msg.repairing}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(4)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==4}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_TAKE')}"/>
                        <p:commandButton value="已完成"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrController.updateQueryIndex(8)}" disabled="#{workOrderMgrController.tabTitle eq 'MVS工单' and workOrderMgrController.queryIndex==8}"/>
                    </c:otherwise>
                </c:choose>
            </h:panelGrid>
            <p:dataTable id="datalist"  var="item" value="#{workOrderMgrController.lazyModel}" widgetVar="varDataList" selectionMode="single"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"  selection="#{workOrderMgrController.selected}"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.serviceRequest.requestTime}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500" >

                <p:ajax event="rowSelect" listener="#{workOrderMgrController.onSelectWorkOrder}" update = "woTab:woMvsMgrDetailForm" />
                <p:ajax event="filter" listener="#{workOrderMgrController.onFilterWo}" update="datalist"/>

                <p:column width="70" styleClass="textCenter"  headerText="#{msg.casePriority}" sortBy="#{item.serviceRequest.casePriority}" filterBy="#{item.serviceRequest.casePriority}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('casePriority')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{item.serviceRequest.casePriority}" class="priorityItem priorityItem#{item.serviceRequest.casePriority}"/>
                </p:column>

                <p:column headerText="#{msg.assetName}" sortBy="#{item.mvsIbMapping.assetInfo.name}" filterBy="#{item.mvsIbMapping.assetInfo.name}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.mvsIbMapping.assetInfo.name}"/>
                </p:column>
                <p:column headerText="#{msg.ManufacturerSerialNumber}" sortBy="#{item.mvsIbMapping.assetInfo.serialNum}" filterBy="#{item.mvsIbMapping.assetInfo.serialNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.mvsIbMapping.assetInfo.serialNum}"/>
                </p:column>
                <p:column headerText="#{msg.departNum}" sortBy="#{item.mvsIbMapping.assetInfo.departNum}" filterBy="#{item.mvsIbMapping.assetInfo.departNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.mvsIbMapping.assetInfo.departNum}"/>
                </p:column>
                <p:column headerText="#{msg.functionType}" sortBy="#{item.mvsIbMapping.assetInfo.functionType}" filterBy="#{item.mvsIbMapping.assetInfo.functionType}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.mvsIbMapping.assetInfo.functionType}"/>
                </p:column>
                <p:column headerText="#{msg.hospitalId}" sortBy="#{item.mvsIbMapping.assetInfo.siteUID}" filterBy="#{item.mvsIbMapping.assetInfo.siteUID}" filterMatchMode="EQ" rendered="#{userContextService.isYiMaiYangGuangTenant()}">
                    <f:facet name="filter" >
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrController.siteUidFilterMVS}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{workOrderMgrController.LoadSiteNameListMVS()}" var="val" itemLabel="#{val.name}" itemValue="#{val.uid}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{workOrderMgrController.getSiteOrgName(item.mvsIbMapping.assetInfo.siteUID)}"/>
                </p:column>
                <!--所属科室-->
                <p:column headerText="#{msg.clinicalDeptName}"  width="100" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <f:facet name="header">
                        <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                        <p:autoComplete dropdown="true" value="#{workOrderMgrController.fileterOrgNameMVS}" appendTo="@(Body)"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{workOrderMgrController.autoCompleteDeptNameMVS}" size="5">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrController.onClinicalDeptNameFilterChangeMVS}" process="@this"  update="woTab:woMvsMgrListForm:datalist" />

                            <p:ajax process="@this" listener="#{workOrderMgrController.onClinicalDeptNameFilterChangeMVS}" update="woTab:woMvsMgrListForm:datalist" />

                        </p:autoComplete>
                    </f:facet>
                    <h:outputText value="#{item.mvsIbMapping.assetInfo.clinicalDeptName}"/>
                </p:column>
                <p:column headerText="#{msg.clinicalDeptName}"  width="100" rendered="#{userContextService.hasCurrentTenantName('')}">
                    <f:facet name="header">
                        <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                        <p:autoComplete dropdown="true" value="#{workOrderMgrController.fileterOrgName}" appendTo="@(Body)"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{workOrderMgrController.autoCompleteDeptName}" size="5">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrController.onClinicalDeptNameFilterChange}" process="@this"  update="woTab:woMvsMgrListForm:datalist" />

                            <p:ajax process="@this" listener="#{workOrderMgrController.onClinicalDeptNameFilterChange}" update="woTab:woMvsMgrListForm:datalist" />

                        </p:autoComplete>
                    </f:facet>
                    <h:outputText value="#{workOrderMgrController.getOrgInfoByUid(item.serviceRequest.fromDeptUID).name}"/>
                </p:column>

                <p:column headerText="#{msg.srNum}" sortBy="#{item.serviceRequest.srNum}" filterBy="#{item.serviceRequest.srNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.serviceRequest.srNum}"/>
                </p:column>

                <p:column headerText="#{msg.requestorName}" sortBy="#{item.serviceRequest.requestorName}" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{item.serviceRequest.requestorName}"/>
                </p:column>
                <p:column headerText="#{msg.requestTime}" sortBy="#{item.serviceRequest.requestTime}" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{item.serviceRequest.requestTime}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="#{msg.requestorName}" sortBy="#{item.serviceRequest.requestorName}" rendered="#{userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{item.serviceRequest.requestorName}"/>
                </p:column>
                <p:column headerText="#{msg.requestTime}" sortBy="#{item.serviceRequest.requestTime}" rendered="#{userContextService.hasCurrentTenantName('')}">
                    <f:facet name="filter">
                        <p:inputText id="filterPlannedCompletionTime" widgetVar="varFilterRequestTime" value="#{workOrderMgrController.plannedCompletionTimeFormat}"/>
                    </f:facet>
                    <h:outputText value="#{item.serviceRequest.requestTime}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.Assignee}" rendered="#{workOrderMgrController.queryIndex==8 and userContextService.hasCurrentTenantName('')}">
                    <!--6 表示 step_name 是待关单-->
                    <h:outputText value="#{workOrderMgrController.getRepairResponer(item.id,6)}"/>
                </p:column>
                <!--当前处理步骤 for 待办-->
                <p:column rendered="#{workOrderMgrController.queryIndex eq 0}" headerText="#{msg.currentStep}" width="186" sortBy="#{item.currentStepId}" filterBy="#{item.currentStepName}" filterMatchMode="EQ">

                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrController.stepFileter}"  rendered="#{workOrderMgrController.queryIndex eq 0 || workOrderMgrController.queryIndex eq 11}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 2)}" itemValue="#{fieldMsg.fieldValue('woSteps', 2)}"  />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 3)}" itemValue="#{fieldMsg.fieldValue('woSteps', 3)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 4)}" itemValue="#{fieldMsg.fieldValue('woSteps', 4)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 5)}" itemValue="#{fieldMsg.fieldValue('woSteps', 5)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 6)}" itemValue="#{fieldMsg.fieldValue('woSteps', 6)}" />
                        </p:selectOneMenu>
                    </f:facet>
                    <p:graphicImage  width="165" height="38" name="#{workOrderMgrController.getStepImg(item)}"/>
                </p:column>
                <!--当前处理步骤 for 全部-->
                <p:column rendered="#{workOrderMgrController.queryIndex eq 11 and !userContextService.hasCurrentTenantName('')}" headerText="#{msg.currentStep}" width="186" sortBy="#{item.currentStepId}" filterBy="#{item.currentStepName}" filterMatchMode="EQ">

                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrController.stepFileter}"  rendered="#{workOrderMgrController.queryIndex eq 0 || workOrderMgrController.queryIndex eq 11}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 2)}" itemValue="#{fieldMsg.fieldValue('woSteps', 2)}"  />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 3)}" itemValue="#{fieldMsg.fieldValue('woSteps', 3)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 4)}" itemValue="#{fieldMsg.fieldValue('woSteps', 4)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 5)}" itemValue="#{fieldMsg.fieldValue('woSteps', 5)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 6)}" itemValue="#{fieldMsg.fieldValue('woSteps', 6)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 9)}" itemValue="#{fieldMsg.fieldValue('woSteps', 9)}" />
                        </p:selectOneMenu>
                    </f:facet>
                    <p:graphicImage  width="165" height="38" name="#{workOrderMgrController.getStepImg(item)}"/>
                </p:column>
                <!--当前处理步骤 for 全部 云阜-->
                <p:column rendered="#{workOrderMgrController.queryIndex eq 11 and userContextService.hasCurrentTenantName('')}" headerText="#{msg.currentStep}" width="186" sortBy="#{item.currentStepId}" filterBy="#{item.currentStepName}" filterMatchMode="EQ" >

                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrController.stepFileter}"  rendered="#{workOrderMgrController.queryIndex eq 0 || workOrderMgrController.queryIndex eq 11}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 3)}" itemValue="#{fieldMsg.fieldValue('woSteps', 3)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 4)}" itemValue="#{fieldMsg.fieldValue('woSteps', 4)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 9)}" itemValue="#{fieldMsg.fieldValue('woSteps', 9)}" />
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText  value="#{workOrderMgrController.getStepName(item)}"/>
                </p:column>
                <p:column width="90" headerText="#{msg.intExtType}" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{fieldMsg.fieldValue('intExtType',item.intExtType)}"/>
                </p:column>
                <p:column headerText="#{msg.requestReason}" sortBy="#{item.serviceRequest.requestReason}" >
                    <h:outputText value="#{workOrderMgrController.getRequestReasonInShort(item.serviceRequest.requestReason)}"  title="#{item.serviceRequest.requestReason}"/>
                </p:column>

                <f:facet name="{Toolbar}">
                    <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
                        <p:dataExporter type="xls" target="datalist" fileName="WorkOrder_export"/>
                    </p:commandButton>
                </f:facet>
            </p:dataTable>
        </h:form>
            <ui:include src="woMvsMgrView.xhtml"/>
    </div>
    <p:overlayPanel id="idMvsPanelFilterPlannedCompletionTime" widgetVar="panelMvsFilterPlannedCompletionTime" for="woTab:woMvsMgrListForm:datalist:filterPlannedCompletionTime" dismissable="false" >
        <h:panelGrid columns="2">
            <p:outputLabel value="#{msg.From}"/>
            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varPlannedCompletionTimeFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
            <p:outputLabel value="#{msg.To}"/>
            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varPlannedCompletionTimeTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
        </h:panelGrid>
        <p:commandButton onclick="setDateFilter('varDataList', 'varFilterRequestTime', 'varPlannedCompletionTimeFrom', 'varPlannedCompletionTimeTo'); PF('panelMvsFilterPlannedCompletionTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
        <p:commandButton onclick="PF('panelMvsFilterPlannedCompletionTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
    </p:overlayPanel>
<p:dialog id="ackMvsEditDialog" widgetVar="ackMvsEditDialog" modal="true" width="300"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.UpdateRepairResult}">
    <h:form id="ackMvsEditForm" >
        <h:panelGroup>
            <label class="label">#{msg.RepairResult}*</label>
            <p:selectOneMenu id="repairResult"  value="#{workOrderMgrController.selectedWorkOrder.repairResult}" required="false" requiredMessage="#{msg.RepairResult} #{msg.ValidationRequire}">
                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                <f:selectItems value="#{fieldMsg.getFieldValueList('repairResult')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
            </p:selectOneMenu>
        </h:panelGroup>
<br/>
        <h:panelGroup>
            <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.saveEditedWorkOrder}" value="#{msg.save}" update="woTab:woMvsMgrListForm" icon="ui-icon-check" oncomplete="handleSubmit(args,'ackMvsEditDialog');"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('ackMvsEditDialog').hide()"/>
        </h:panelGroup>
    </h:form>
</p:dialog>

    <p:dialog id="dispatchMvsDialog" widgetVar="dispatchMvsDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.dispatchWorkOrder}">
        <h:form id="dispatchMvsDialogForm" >
            <h:panelGroup id="display4" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.WorkOrderAssignee}*</label>
                        <p:selectOneMenu  value="#{workOrderMgrController.selectedWorkOrder.currentPersonId}" required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}">
                            <f:selectItems value="#{workOrderMgrController.getWorkerList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.dispatchWorkOrder()}" value="#{msg.dispatchWorkOrder}" update="woTab:woMvsMgrListForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'dispatchMvsDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('dispatchMvsDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
    <p:dialog id="cancelMvsDialog" widgetVar="cancelMvsDialog" modal="true" width="500"  resizable="true" draggable="true" header="#{msg.cancelWorkOrder}">
        <h:form id="cancelMvsDialogForm" >
            <h:panelGroup id="display1" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                    <h:panelGroup>
                        <label class="label">#{msg.deviceStatus}*</label>
                        <p:selectOneMenu value="#{workOrderMgrController.assetStatus}" >
                            <f:selectItems value="#{assetInfoEditController.assetStatusList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="#{!item.editable}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">#{msg.cancelWorkOrderReason}</label>
                        <p:inputTextarea value="#{workOrderMgrController.cancelReason}" maxlength="256"  required="true" requiredMessage="#{msg.cancelWorkOrderReason}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                </p:panelGrid>
                <h:panelGroup >
                    <p:commandButton value="#{msg.selectSearchInterval_2}" icon="ui-icon-arrow-back" actionListener="#{workOrderMgrController.cancelWorkOrder()}" validateClient="true"  update="woTab:woMvsMgrListForm :growl" style="float:left" oncomplete="handleSubmit(args, 'cancelMvsDialog');" >
                        <p:confirm header="#{msg.confirmcancel}" message="#{msg.CancelWorkOrderConformationMsg}" icon="ui-icon-warning"/>
                    </p:commandButton>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('cancelMvsDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
    <p:dialog id="ackMvsDialog" widgetVar="ackMvsDialog" modal="true" width="550"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.Acknowledge}">
        <h:form id="ackMvsDialogForm" >
            <h:panelGroup id="display" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup >
                        <label class="label">#{msg.comments}</label>
                        <p:inputTextarea value="#{workOrderMgrController.failReason}" maxlength="256"  required="true" requiredMessage="#{msg.comments}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup id="assetstatus">
                        <label class="label">#{msg.status}</label>
                        <p:selectOneRadio id="status" value="#{workOrderMgrController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                            <p:ajax  listener="#{workOrderMgrController.onStatusChange()}"  update="assetstatus" />
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(0).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(0).msgKey}" />
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(1).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(1).msgKey}" itemDisabled="false"/>
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(2).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(2).msgKey}" />
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(3).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(3).msgKey}" />
                        </p:selectOneRadio>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" label="#{msg.confirmedDownTime}" rendered="#{workOrderMgrController.needConfirmTime}"  id="confirmedDownTime"  value="#{workOrderMgrController.confirmedDownTime}" showOn="button"
                                    readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.confirmedDownTime} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton immediate="true" validateClient="false" actionListener="#{workOrderMgrController.ackWorkOrder()}" value="#{msg.AckPass}" update="woTab:woMvsMgrListForm ackMvsDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'ackMvsDialog');"/>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.rejectWorkOrder()}" value="#{msg.AckNoPass}" update="woTab:woMvsMgrListForm ackMvsDialogForm :growl"  oncomplete="handleSubmit(args, 'ackMvsDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('ackMvsDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
    <p:dialog id="rateMvsDialog" widgetVar="rateMvsDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.feedbackRating}">
        <h:form id="rateMvsDialogForm" >
            <h:panelGroup id="display" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup >
                        <label class="label">#{msg.feedbackRating}</label>
                        <p:rating value="#{workOrderMgrController.rating}" required="true" requiredMessage="#{msg.feedbackRating}#{msg.ValidationRequire}"  cancel="false"/>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">#{msg.feedbackComment}</label>
                        <p:inputTextarea value="#{workOrderMgrController.comments}" maxlength="256" />
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton immediate="false" validateClient="true" actionListener="#{workOrderMgrController.rateWorkOrder()}" value="#{msg.Confirm}" update="woTab:woMvsMgrListForm rateMvsDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'rateMvsDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('rateMvsDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
