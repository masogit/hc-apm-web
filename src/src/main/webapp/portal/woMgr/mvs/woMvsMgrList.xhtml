<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="woMvsMgrListForm">
            <h:panelGrid id="buttonSet2" columns="12" cellpadding="5">
                <p:commandButton value="#{msg.repairing}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrMvsController.updateQueryIndex(4)}" disabled="#{workOrderMgrMvsController.queryIndex==4}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_TAKE')}"/>
                <p:commandButton value="#{msg.closed}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrMvsController.updateQueryIndex(8)}" disabled="#{workOrderMgrMvsController.queryIndex==8}"/>
                <p:commandButton value="#{msg.canceled}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrMvsController.updateQueryIndex(9)}" disabled="#{workOrderMgrMvsController.queryIndex==9}"/>
                <p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet2 woTab:woMvsMgrDetailForm" action="#{workOrderMgrMvsController.updateQueryIndex(11)}" disabled="#{workOrderMgrMvsController.queryIndex==11}"/>
            </h:panelGrid>
            <p:dataTable id="datalist"  var="item" value="#{workOrderMgrMvsController.lazyModel}" widgetVar="varDataList" selectionMode="single"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"  selection="#{workOrderMgrMvsController.selected}"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500" >

                <c:if test="#{workOrderMgrMvsController.pageType eq 'new'}">
                    <p:ajax event="rowSelect" listener="#{workOrderMgrMvsController.onSelectOrderRedirect}" onstart="prepareOrderViewWindow();" oncomplete="openOrderViewWindow(xhr, status, args)" />
                </c:if>
                <c:if test="#{workOrderMgrMvsController.pageType eq 'current'}">
                    <p:ajax event="rowSelect" listener="#{workOrderMgrMvsController.onSelectWorkOrder}" update = "woTab:woMvsMgrDetailForm" />
                </c:if>

                <p:ajax event="filter" listener="#{workOrderMgrMvsController.onFilterWo}" update="datalist"/>
                <p:column width="36" visible="#{workOrderMgrMvsController.queryIndex==8}" exportable="false">
                    <p:selectBooleanCheckbox  value="#{workOrderMgrMvsController.selectedMap[item.id]}"  class="selectCheckBox">
                        <p:ajax process="@this" listener="#{workOrderMgrMvsController.pick(item.id)}" update="@(.selectCheckBoxHeader)  @(.btn-export-maintenance-report)  @(.downloadConfirm) " oncomplete="updateSelectAllCheckBox();" />
                    </p:selectBooleanCheckbox>
                    <f:facet name="header">
                        <p:selectBooleanCheckbox id="selectCheckBoxHeader"  class="selectCheckBoxHeader">
                            <p:ajax  listener="#{workOrderMgrMvsController.onSelectAllOfPage}" update=" @(.selectCheckBox) @(.btn-export-maintenance-report)   @(.downloadConfirm) " oncomplete="updateSelectAllCheckBox();"/>
                        </p:selectBooleanCheckbox>
                    </f:facet>
                </p:column>
                <p:column width="70" styleClass="textCenter"  headerText="#{msg.casePriority}" filterBy="#{item.serviceRequest.casePriority}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('casePriority')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{workOrderMgrMvsController.displayModeCasePriority.equals('key')?item.serviceRequest.casePriority:fieldMsg.fieldValue('casePriority',item.serviceRequest.casePriority)}" class="priorityItem priorityItem#{item.serviceRequest.casePriority}"/>
                </p:column>
                <p:column headerText="#{msg.assetName}" filterBy="#{item.mvsIbMapping.assetInfo.name}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.assetInfo.name}"/>
                </p:column>
                <p:column headerText="#{msg.ManufacturerSerialNumber}" filterBy="#{item.mvsIbMapping.assetInfo.serialNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.assetInfo.serialNum}"/>
                </p:column>
                <p:column headerText="#{msg.departNum}" filterBy="#{item.mvsIbMapping.assetInfo.departNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.assetInfo.departNum}"/>
                </p:column>
                <p:column headerText="#{msg.functionType}" filterBy="#{item.mvsIbMapping.assetInfo.functionType}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.assetInfo.functionType}"/>
                </p:column>
                <p:column id="hospitalId" headerText="#{msg.hospitalId}" filterBy="#{item.mvsIbMapping.assetInfo.siteUID}" filterMatchMode="EQ" rendered="#{userContextService.isYiMaiYangGuangTenant()}">
                    <f:facet name="filter" >
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrMvsController.siteUidFilterMVS}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}"   noSelectionOption="true"/>
                            <f:selectItems value="#{workOrderMgrMvsController.LoadSiteNameListMVS()}" var="val" itemLabel="#{val.name}" itemValue="#{val.uid}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{workOrderMgrMvsController.getSiteOrgName(item.assetInfo.siteUID)}"/>
                </p:column>
                <!--所属科室-->
                <p:column headerText="#{msg.clinicalDeptName}"  width="100" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <f:facet name="header">
                        <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                        <p:autoComplete dropdown="true" value="#{workOrderMgrMvsController.fileterOrgNameMVS}" appendTo="@(Body)"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{workOrderMgrMvsController.autoCompleteDeptNameMVS}" size="5">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrMvsController.onClinicalDeptNameFilterChangeMVS}" process="@this"  update="woTab:woMvsMgrListForm:datalist" />
                            <p:ajax process="@this" listener="#{workOrderMgrMvsController.onClinicalDeptNameFilterChangeMVS}" update="woTab:woMvsMgrListForm:datalist" />
                        </p:autoComplete>
                    </f:facet>
                    <h:outputText value="#{item.assetInfo.clinicalDeptName}"/>
                </p:column>
                <!-- 使用科室 -->
                <p:column headerText="#{msg.AssetDepartment}" filterBy="#{item.serviceRequest.fromDeptName}" filterMatchMode="LIKE" width="100" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" filter="true" filterMatchMode="contains" filterNormalize="true" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{workOrderMgrMvsController.clinicalDeptList}" var="item" itemLabel="#{item}" itemValue="#{item.name}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{item.serviceRequest.fromDeptName}"/>
                </p:column>

                <p:column headerText="#{msg.locationName}" filterBy="#{item.mvsIbMapping.assetInfo.locationName}" filterMatchMode="LIKE" rendered="#{workOrderMgrMvsController.showLocationName()}">
                    <h:outputText value="#{item.assetInfo.locationName}"/>
                </p:column>
                <p:column headerText="#{msg.srNum}" filterBy="#{item.serviceRequest.srNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.serviceRequest.srNum}"/>
                </p:column>
                <p:column headerText="#{msg.requestorName}"  rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{item.serviceRequest.requestorName}"/>
                </p:column>
                <p:column headerText="#{msg.requestTime}"  rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{item.serviceRequest.requestTime}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="#{msg.Assignee}" rendered="#{workOrderMgrMvsController.queryIndex==8}">
                    <!--6 表示 step_name 是待关单-->
                    <h:outputText value="#{empty item.currentPersonName ?
                    workOrderMgrMvsController.getRepairResponer(item.id,4) :
                    item.currentPersonName}"/>
                </p:column>
                <!--当前处理步骤 for 待办-->
                <p:column rendered="#{workOrderMgrMvsController.queryIndex eq 0}" headerText="#{msg.currentStep}" width="186" filterBy="#{item.currentStepName}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrMvsController.stepFileter}"  rendered="#{workOrderMgrMvsController.queryIndex eq 0 || workOrderMgrMvsController.queryIndex eq 11}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 2)}" itemValue="#{fieldMsg.fieldValue('woSteps', 2)}"  />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 3)}" itemValue="#{fieldMsg.fieldValue('woSteps', 3)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 4)}" itemValue="#{fieldMsg.fieldValue('woSteps', 4)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 5)}" itemValue="#{fieldMsg.fieldValue('woSteps', 5)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 6)}" itemValue="#{fieldMsg.fieldValue('woSteps', 6)}" />
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{item.currentStepName}" style="display: none"/>
                    <p:graphicImage  width="165" height="38" name="#{workOrderMgrMvsController.getStepImg(item)}"/>
                </p:column>
                <!--当前处理步骤 for 全部-->
                <p:column rendered="#{workOrderMgrMvsController.queryIndex eq 11 }" headerText="#{msg.currentStep}" width="186" filterBy="#{item.currentStepName}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrMvsController.stepFileter}"  rendered="#{workOrderMgrMvsController.queryIndex eq 0 || workOrderMgrMvsController.queryIndex eq 11}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 2)}" itemValue="#{fieldMsg.fieldValue('woSteps', 2)}"  />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 3)}" itemValue="#{fieldMsg.fieldValue('woSteps', 3)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 4)}" itemValue="#{fieldMsg.fieldValue('woSteps', 4)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 5)}" itemValue="#{fieldMsg.fieldValue('woSteps', 5)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 6)}" itemValue="#{fieldMsg.fieldValue('woSteps', 6)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 9)}" itemValue="#{fieldMsg.fieldValue('woSteps', 9)}" />
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{item.currentStepName}" style="display: none"/>
                    <p:graphicImage  width="165" height="38" name="#{workOrderMgrMvsController.getStepImg(item)}"/>
                </p:column>
                <p:column width="90" headerText="#{msg.intExtType}" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{fieldMsg.fieldValue('intExtType',item.intExtType)}"/>
                </p:column>
                <p:column headerText="#{msg.requestReason}">
                    <h:outputText value="#{workOrderMgrMvsController.getRequestReasonInShort(item.serviceRequest.requestReason)}"  title="#{item.serviceRequest.requestReason}"/>
                </p:column>
                <p:column width="90" headerText="主子工单" rendered="#{!userContextService.isEnableBtnByKey('displayMainSubWorkOrder')}" filterBy="#{item.mainSub}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()">
                            <f:selectItem itemLabel="#{msg.All}" itemValue="" />
                            <f:selectItem itemLabel="主工单" itemValue="main" />
                            <f:selectItem itemLabel="子工单" itemValue="sub" />
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{empty item.mainSub?'':'main'.equals(item.mainSub)?'主工单':'子工单'}" />
                </p:column>
                <f:facet name="{Toolbar}">
                    <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
                        <p:dataExporter type="xls" target="datalist" fileName="WorkOrder_export"/>
                    </p:commandButton>
                    <ui:fragment rendered="true">
                        <p:commandButton  icon="ui-icon ui-icon-arrow-downward" onclick="PF('downloadConfirm').show(); return false;" class="btn-export-maintenance-report" title="批量下载附件工单" rendered="#{workOrderMgrMvsController.queryIndex==8}" disabled="#{not workOrderMgrMvsController.isTargetSelected()}" ajax="false"/>
                     </ui:fragment>

                </f:facet>

            </p:dataTable>
        </h:form>
        <!-- 确认对话框 -->
        <c:if test="#{ workOrderMgrController.tabTitle eq 'MVS工单'}">
            <ui:include src="woMvsMgrView.xhtml"/>
        </c:if>
        <p:confirmDialog id="downloadConfirm" widgetVar="downloadConfirm"
                         message="#{workOrderMgrMvsController.messageTip}"
                         header="确认下载"
                         severity="warn" class="downloadConfirm" width="700px">
            <h:form>
                <p:commandButton value="确定" ajax="false"
                                 actionListener="#{workOrderMgrMvsController.doExportWorkOrderReport()}"
                                 onclick="PF('downloadConfirm').hide()" styleClass="ui-confirmdialog-yes uiButton"
                                 icon="ui-icon-check">
                    <p:fileDownload value="#{workOrderMgrMvsController.maintenanceReport}"
                                    oncomplete="PF('downloadConfirm').hide()"/>
                </p:commandButton>
                <p:commandButton value="取消" type="button"
                                 onclick="PF('downloadConfirm').hide()" styleClass="ui-confirmdialog-no uiButton"
                                 icon="ui-icon-close"
                />
            </h:form>
        </p:confirmDialog>
    </div>

    <script>
        afterPageLoad = function () {
            /*var requestAssetUid = "#{workOrderMgrMvsController.requestAssetUid}";
            if (requestAssetUid != "") {
                createSR();
            };*/

            var isActive = "#{userContextService.isActive()}";
            if(isActive == '1'){
                PF('ActiveDlg').show();
            }
        }


    </script>


</ui:composition>
</html>
