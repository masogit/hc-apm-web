<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="MVS维修设备管理" />
			</div>
			<div class="ui-g-12 card ">
				<h:form id="searchForm">
                    <h:panelGrid id="searchPanel" columns="3">
                        <h:panelGroup >
                            <p:commandButton id="btnOrg" value="#{empty mVSWorkOrderMgrController.selectSite? '所有租户':mVSWorkOrderMgrController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                            <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{tenantTreeController.buildTenantTree(1)}" selection="#{tenantTreeController.selectedTenantOrgNode}" var="node" selectionMode="single" dynamic="true">
                                        <p:ajax process="@this" event="select" listener="#{mVSWorkOrderMgrController.onSelectSiteTreeNode}" update=":mvsWoMgrListForm :searchForm" oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <!-- <p:inputText id="searchText" value="#{mVSWorkOrderMgrController.oneSearchStr}" placeholder="#{msg.name}/#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}/#{msg.manufacture}/#{msg.clinicalDeptName}" maxlength="100" style="width: 500px">
                            <p:ajax event="keyup" update=":AssetInfoListForm :idPanelFilterWarrantyDate :idVarPanelDeptOrg searchButtons " />
                        </p:inputText>

                        <h:panelGroup id='searchButtons'>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm :idPanelFilterWarrantyDate :idVarPanelDeptOrg"  rendered="#{empty mVSWorkOrderMgrController.oneSearchStr}"/>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm :idPanelFilterWarrantyDate :idVarPanelDeptOrg" actionListener="#{mVSWorkOrderMgrController.setOneSearchStr('')}" rendered="#{not empty mVSWorkOrderMgrController.oneSearchStr}"/>
                        </h:panelGroup> -->
                    </h:panelGrid>
                </h:form>
				<h:form id="mvsWoMgrListForm">
					<p:dataTable id="datalist" value="#{mVSWorkOrderMgrController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single"
						selection="#{mVSWorkOrderMgrController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
						rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
						paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
						currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">

						<p:ajax event="rowSelect" update="editButton" />
						<p:ajax event="filter" listener="#{mVSWorkOrderMgrController.onFilter}" />
						<p:column headerText="报修时间" sortBy="#{item.v2WorkOrderServiceRequestRequestTime}" filterMatchMode="GTE">
							<!-- <f:facet name="filter">
						        <p:inputText id="filterrequestTime" widgetVar="varFilterrequestTime" />
						    </f:facet> -->
							<h:outputText value="#{item.v2WorkOrderServiceRequestRequestTime}" >
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss" />
							</h:outputText>
						</p:column>
						<p:column headerText="MVS工单类型" filterBy="#{item.v2WorkOrderMvsType}" filterMatchMode="EQ">
							<f:facet name="filter">
						        <p:selectOneMenu onchange="PF('varDataList').filter()">
						        	<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
						            <f:selectItems value="#{fieldMsg.getFieldValueList('mvsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
						        </p:selectOneMenu>
						    </f:facet>
							<h:outputText value="#{fieldMsg.fieldValue('mvsType', item.v2WorkOrderMvsType)}"/>
						</p:column>
						<p:column headerText="普通/加急" filterBy="#{item.priority}" filterMatchMode="EQ">
							<f:facet name="filter">
						        <p:selectOneMenu onchange="PF('varDataList').filter()">
						            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
						            <f:selectItem itemLabel="普通" itemValue="1" />
						            <f:selectItem itemLabel="加急" itemValue="2" />
						        </p:selectOneMenu>
						    </f:facet>
							<h:outputText value="#{fieldMsg.fieldValue('mvsPriority', item.priority)}"/>
						</p:column>
						<p:column headerText="FE工程师" filterBy="#{item.v2WorkOrderFEOwnerNamePyCode}" filterMatchMode="LIKE">
							<h:outputText value="#{item.v2WorkOrderFEOwnerName}" />
						</p:column>
						<p:column headerText="所属院区">
							<h:outputText value="#{item.siteOrgName}" />
						</p:column>
						<p:column headerText="设备编号" filterBy="#{item.v2WorkOrderAssetInfoDepartNum}" filterMatchMode="LIKE">
							<h:outputText value="#{item.v2WorkOrderAssetInfoDepartNum}" />
						</p:column>
						<p:column headerText="设备名称" filterBy="#{item.v2WorkOrderAssetInfoNamePyCode}" filterMatchMode="LIKE">
							<h:outputText value="#{item.v2WorkOrderAssetInfoName}" />
						</p:column>
						<p:column headerText="备件名称" filterBy="#{item.parts}" filterMatchMode="LIKE">
							<h:outputText value="#{item.parts}" />
						</p:column>
						<p:column headerText="数量" filterBy="#{item.partsQuantity}" filterMatchMode="EQ">
							<h:outputText value="#{item.partsQuantity}" />
						</p:column>
						<p:column headerText="采购单价" filterBy="#{item.mvsPrice}" filterMatchMode="EQ">
							<h:outputText value="#{item.mvsPrice}" >
								<f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
							</h:outputText>
						</p:column>
						<p:column headerText="序列号" filterBy="#{item.serialNum}" filterMatchMode="LIKE">
							<h:outputText value="#{item.serialNum}" />
						</p:column>
						<p:column headerText="发票号" filterBy="#{item.invoiceNum}" filterMatchMode="LIKE">
							<h:outputText value="#{item.invoiceNum}" />
						</p:column>
						<p:column headerText="质保期" filterBy="#{item.warrantyDate}" filterMatchMode="GTE">
							<f:facet name="filter">
						        <p:inputText id="filterwarrantyDate" widgetVar="varFilterwarrantyDate" />
						    </f:facet>
							<h:outputText value="#{item.warrantyDate}">
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd" />
							</h:outputText>
						</p:column>
						<p:column headerText="采购时间" filterBy="#{item.purchaseTime}" filterMatchMode="GTE">
							<f:facet name="filter">
						        <p:inputText id="filterpurchaseTime" widgetVar="varFilterpurchaseTime" />
						    </f:facet>
							<h:outputText value="#{item.purchaseTime}" >
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss" />
							</h:outputText>
						</p:column>
						<p:column headerText="发货时间" filterBy="#{item.deliverTime}" filterMatchMode="GTE">
							<f:facet name="filter">
						        <p:inputText id="filterdeliverTime" widgetVar="varFilterdeliverTime" />
						    </f:facet>
							<h:outputText value="#{item.deliverTime}" >
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss" />
							</h:outputText>
						</p:column>
						<p:column headerText="收货时间" filterBy="#{item.arrivedTime}" filterMatchMode="GTE">
							<f:facet name="filter">
						        <p:inputText id="filterarrivedTime" widgetVar="varFilterarrivedTime" />
						    </f:facet>
							<h:outputText value="#{item.arrivedTime}" >
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss" />
							</h:outputText>
						</p:column>
						<p:column headerText="是否完好" filterBy="#{item.arrivedGood}" filterMatchMode="EQ">
							<f:facet name="filter">
						        <p:selectOneMenu onchange="PF('varDataList').filter()">
						            <f:converter converterId="javax.faces.Boolean" />
						            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
						            <f:selectItem itemLabel="是" itemValue="true" />
						            <f:selectItem itemLabel="否" itemValue="false" />
						        </p:selectOneMenu>
						    </f:facet>
							<h:outputText value="#{item.arrivedGood?'是':'否'}" />
						</p:column>
						<p:column headerText="好还/坏还" filterBy="#{item.arrivedGoodReturn}" filterMatchMode="EQ">
							<f:facet name="filter">
						        <p:selectOneMenu onchange="PF('varDataList').filter()">
						            <f:converter converterId="javax.faces.Boolean" />
						            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
						            <f:selectItem itemLabel="是" itemValue="true" />
						            <f:selectItem itemLabel="否" itemValue="false" />
						        </p:selectOneMenu>
						    </f:facet>
							<h:outputText value="#{item.arrivedGoodReturn?'是':'否'}" />
						</p:column>
						<p:column headerText="备注">
							<h:outputText value="#{item.comment}" />
						</p:column>
						<f:facet name="{Toolbar}">
							<p:commandButton id="editButton" actionListener="#{mVSWorkOrderMgrController.prepareEdit}" icon="ui-icon-pencil" title="#{msg.Edit}"
								update=":mvsWoMgrEditDlg" oncomplete="PF('mvsWoMgrEditDialog').show()"
								disabled="#{empty mVSWorkOrderMgrController.selected.id}" />
						</f:facet>
						<f:facet name="{Toolbar}">
							<!-- <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
								<p:dataExporter type="xlsx" target="datalist" fileName="MVSWorkOrderInfo_export" />
							</p:commandButton> -->
							<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false"
								actionListener="#{mVSWorkOrderMgrController.exportAll()}" validateClient="true" update=":growl">
								<p:fileDownload value="#{mVSWorkOrderMgrController.exportFile}" />
							</p:commandButton>
						</f:facet>
					</p:dataTable>
				</h:form>
				<!-- <p:overlayPanel widgetVar="panelFilterrequestTime" for=":mvsWoMgrListForm:datalist:filterrequestTime" dismissable="false">
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}"/>
                        <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_requestTime" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                        <p:outputLabel value="#{msg.To}"/>
                        <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_requestTime" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    </h:panelGrid>
                    <p:commandButton onclick="setDateFilter('varDataList','varFilterrequestTime','varStartTimeFrom_requestTime','varStartTimeTo_requestTime'); PF('panelFilterrequestTime').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFilterrequestTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                </p:overlayPanel> -->
				<p:overlayPanel widgetVar="panelFilterwarrantyDate" for=":mvsWoMgrListForm:datalist:filterwarrantyDate" dismissable="false">
				    <h:panelGrid columns="2">
				        <p:outputLabel value="#{msg.From}"/>
				        <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_warrantyDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
				        <p:outputLabel value="#{msg.To}"/>
				        <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_warrantyDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
				    </h:panelGrid>
				    <p:commandButton onclick="setDateFilter('varDataList','varFilterwarrantyDate','varStartTimeFrom_warrantyDate','varStartTimeTo_warrantyDate'); PF('panelFilterwarrantyDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
				    <p:commandButton onclick="PF('panelFilterwarrantyDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
				</p:overlayPanel>
				<p:overlayPanel widgetVar="panelFilterpurchaseTime" for=":mvsWoMgrListForm:datalist:filterpurchaseTime" dismissable="false">
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}"/>
                        <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_purchaseTime" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                        <p:outputLabel value="#{msg.To}"/>
                        <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_purchaseTime" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    </h:panelGrid>
                    <p:commandButton onclick="setDateFilter('varDataList','varFilterpurchaseTime','varStartTimeFrom_purchaseTime','varStartTimeTo_purchaseTime'); PF('panelFilterpurchaseTime').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFilterpurchaseTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                </p:overlayPanel>
				<p:overlayPanel widgetVar="panelFilterdeliverTime" for=":mvsWoMgrListForm:datalist:filterdeliverTime" dismissable="false">
				    <h:panelGrid columns="2">
				        <p:outputLabel value="#{msg.From}"/>
				        <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_deliverTime" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
				        <p:outputLabel value="#{msg.To}"/>
				        <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_deliverTime" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
				    </h:panelGrid>
				    <p:commandButton onclick="setDateFilter('varDataList','varFilterdeliverTime','varStartTimeFrom_deliverTime','varStartTimeTo_deliverTime'); PF('panelFilterdeliverTime').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
				    <p:commandButton onclick="PF('panelFilterdeliverTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
				</p:overlayPanel>
				<p:overlayPanel widgetVar="panelFilterarrivedTime" for=":mvsWoMgrListForm:datalist:filterarrivedTime" dismissable="false">
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}"/>
                        <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeFrom_arrivedTime" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                        <p:outputLabel value="#{msg.To}"/>
                        <p:calendar timeZone="GMT+8"  widgetVar="varStartTimeTo_arrivedTime" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    </h:panelGrid>
                    <p:commandButton onclick="setDateFilter('varDataList','varFilterarrivedTime','varStartTimeFrom_arrivedTime','varStartTimeTo_arrivedTime'); PF('panelFilterarrivedTime').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFilterarrivedTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                </p:overlayPanel>
			</div>
		</div>
		<ui:include src="Edit.xhtml" />
	</ui:define>
</ui:composition>
