<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition><!--关单对话框-->
        <p:dialog id="EditCloseDialog" widgetVar="EditCloseDialog" modal="true"  resizable="true" draggable="true" width="1000" appendTo="@(body)" header="关单" height="500">
            <h:form id="EditCloseDialogForm" >
                <h:panelGroup id="display3" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.caseType}</label>
                            <p:selectOneMenu  value="#{workOrderMgrController.selectedWorkOrder.caseType}" required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}">
                                <f:selectItems value="#{workOrderMgrController.getAssetFaultType()}" var="item" itemLabel="#{item.faultName}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.patProblems}</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patProblems}" rows="2"  cols="40"  queryDelay="750" maxlength="500" minQueryLength="4"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.patActions}</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patActions}" rows="2"  cols="40"  queryDelay="750" maxlength="500" minQueryLength="4"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.patTests}</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patTests}" rows="3"  cols="40"  queryDelay="750" maxlength="500" minQueryLength="4"/>
                        </h:panelGroup>
                        <h:panelGroup  id="equipmentTaker" >
                            <label class="label">#{msg.equipmentTaker}</label>
                            <p:inputText id="taker" value="#{workOrderMgrController.equipmentTaker}"  maxlength="40" readonly="#{not empty workOrderMgrController.equipmentTaker and not empty workOrderMgrController.takeTime}"/>
                            <label class="label">#{msg.equiptaketime}</label>
                            <p:calendar timeZone="GMT+8" label="#{msg.equiptaketime}" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrController.takeTime}" showOn="button"
                                        readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" disabled="#{not empty workOrderMgrController.equipmentTaker and not empty workOrderMgrController.takeTime}"/>
                            <p:commandButton title="#{msg.equiptake}" process="@(equipmentTaker)" actionListener="#{workOrderMgrController.takeEquip}" update="woTab:EditCloseDialogForm:equipmentTaker :growl" disabled="#{not empty workOrderMgrController.equipmentTaker and not empty workOrderMgrController.takeTime}"/>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:fieldset legend="#{msg.expensedetail}" >

                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.manhours}</label>
                                <p:inputText value="#{workOrderMgrController.selectedWorkOrder.manHours}" readonly="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.otherExpense}</label>
                                <p:inputNumber maxValue="99999999"  decimalPlaces="4" value="#{workOrderMgrController.selectedWorkOrder.otherExpense}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">外部费用</label><!--外部费用-->
                                <p:inputNumber  maxValue="99999999"  decimalPlaces="4" value="#{workOrderMgrController.selectedWorkOrder.externalExpense}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.maintenanceValue}</label>
                                <p:inputNumber  maxValue="99999999"  decimalPlaces="4" value="#{workOrderMgrController.selectedWorkOrder.maintenanceValue}"/>
                            </h:panelGroup>
                        </p:panelGrid>

                    </p:fieldset>

                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.saveEditedWorkOrder}" value="#{msg.save}" update="woTab:woMgrListForm woTab:woMgrDetailForm" icon="ui-icon-check" oncomplete="handleSubmit(args,'EditCloseDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('EditCloseDialog').hide()"/>
                    </h:panelGroup>

                    <br/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
