<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition><!--关单对话框-->
        <p:dialog id="EditCloseDialog" widgetVar="EditCloseDialog" modal="true"  resizable="true" draggable="true" width="1000" appendTo="@(body)" header="#{msg.closeWo}" height="500">
            <h:form id="EditCloseDialogForm" >
                <h:panelGroup id="display3" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.caseType}</label>
                            <p:selectOneMenu id="caseType"  value="#{workOrderMgrController.selectedWorkOrder.caseType}" disabled="false">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('faultType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.RepairResult}*</label>
                            <p:selectOneMenu id="repairResult"  value="#{workOrderMgrController.selectedWorkOrder.repairResult}" required="false" requiredMessage="#{msg.RepairResult} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('repairResult')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.patProblems}</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patProblems}" rows="2"  cols="40"  queryDelay="750" maxlength="500" minQueryLength="4" readonly="false"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.patActions}</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patActions}" rows="2"  cols="40"  queryDelay="750" maxlength="500" minQueryLength="4" readonly="false"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.patTests}</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patTests}" rows="3"  cols="40"  queryDelay="750" maxlength="500" minQueryLength="4" readonly="false"/>
                        </h:panelGroup>
                        <h:panelGroup  id="equipmentTaker" >
                            <label class="label">#{msg.equipmentTaker}</label>
                            <p:inputText id="taker" value="#{workOrderMgrController.equipmentTaker}"  maxlength="40" readonly="false"/>
                            <label class="label">#{msg.equiptaketime}</label>
<!--                            <p:calendar timeZone="GMT+8" label="#{msg.equiptaketime}" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrController.takeTime}" showOn="button" 
                                        readonlyInput="true" showButtonPanel="false" navigator="true" mask="true" disabled="true"/>-->
                            <h:outputText value="#{workOrderMgrController.takeTime}"  >
                                <f:convertDateTime pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                            <p:commandButton title="#{msg.equiptake}" process="@(equipmentTaker)" actionListener="#{workOrderMgrController.takeEquip}" update="woTab:EditCloseDialogForm:equipmentTaker :growl" disabled="false"/>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:fieldset legend="#{msg.expensedetail}" >

                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.manhours}</label>
                                <p:inputText value="#{workOrderMgrController.selectedWorkOrder.manHours}" readonly="false" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.otherExpense}</label>
                                <p:inputNumber maxValue="99999999"  decimalPlaces="4" value="#{workOrderMgrController.selectedWorkOrder.otherExpense}" readonly="false"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.ExternalExpenses}</label><!--外部费用-->
                                <p:inputNumber  maxValue="99999999"  decimalPlaces="4" value="#{workOrderMgrController.selectedWorkOrder.externalExpense}" readonly="false"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.maintenanceValue}</label>
                                <p:inputNumber  maxValue="99999999"  decimalPlaces="4" value="#{workOrderMgrController.selectedWorkOrder.maintenanceValue}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                        <p:dataGrid id="pictureList" class="pictureListCls" var="fileitem" value="#{workOrderMgrController.picList}" columns="7" layout="grid">
                            <f:facet name="header">#{msg.addPic}</f:facet><!--增加图片-->
                            <p:panel  style="text-align:center">
                                <h:panelGrid columns="1" style="width:100%" >
                                    <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>
<!--                                <p:graphicImage url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/> -->
                                    <p:commandButton actionListener="#{workOrderMgrController.removeAttachmentById(fileitem.id)}" update="pictureList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>
                                </h:panelGrid>
                            </p:panel>
                        </p:dataGrid>

                        <p:fileUpload id="type1" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{workOrderMgrController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false"  sizeLimit="10000000"  update="pictureList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>



                        <p:dataGrid id="attachList" var="fileitem" value="#{workOrderMgrController.attachList}" columns="7" layout="grid">
                            <f:facet name="header">#{msg.AddDocument}</f:facet>
                            <h:panelGrid columns="1" style="width:100%" >
                                #{fileitem.objectName}
                                <p:commandButton actionListener="#{workOrderMgrController.removeAttachmentByIdPDF(fileitem.id)}" update="attachList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </h:panelGrid>
                            <!-- </p:panel>-->
                        </p:dataGrid>
                        <p:fileUpload id="type2" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{workOrderMgrController.handleFileUploadPDF}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false"  sizeLimit="10000000"  update="attachList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>

                    </p:fieldset>、

                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.saveEditedWorkOrder}" value="#{msg.save}" update="woTab:woMgrListForm woTab:woMgrDetailForm" icon="ui-icon-check" oncomplete="handleEditClose(xhr, status, args);"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('EditCloseDialog').hide()"/>
                    </h:panelGroup>

                    <br/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <script type="text/javascript">
            function handleEditClose(xhr, status, args) {
                if (args.caseType) {
                    $('#woTab\\:EditCloseDialogForm\\:caseType').addClass("ui-state-error");
                }else{
                    handleSubmit(args, 'EditCloseDialog');
                }
            }
        </script>
    </ui:composition>
</html>
