<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog class="moreManHoursDialog" id="moreManHoursDialog" widgetVar="moreManHoursDialog" modal="true" height="600" width="1100"  resizable="true" draggable="true" appendTo="@(body)" header="工时管理">
        <h:form id="moreManHoursDialogForm">
            <h:panelGroup>
                <p:dataTable id="manHoursDataList" class="manHoursDataList" value="#{workOrderMgrController.v2WorkOrderManHoursList}" var="item" widgetVar="varManHoursDataList"
                             lazy="false" paginator="false" editable="true" rowKey="#{item.id}" rows="50" emptyMessage="#{msg.noRecordFound}">
                    <p:ajax event="rowEdit"  listener="#{workOrderMgrController.onRowEdit}" process="@this" update="@this"/>
                    <p:ajax event="rowEditCancel" listener="#{workOrderMgrController.onRowCancel}" process="@this" update="@this"/>
                    <p:column headerText="工单编号">
                        <h:outputText value="#{item.srNum}"/>
                    </p:column>
                    <p:column headerText="工时所属人">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.manHoursOwner}"/>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputText value="#{item.manHoursOwner}" />
                                <span style="color: red;">*</span>
                            </f:facet>
                        </p:cellEditor>
                    </p:column>
                    <p:column headerText="工时日期">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.manHoursDate}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd" />
                                </h:outputText>
                            </f:facet>
                            <f:facet name="input">
                                <p:calendar timeZone="GMT+8" pattern="yyyy-MM-dd" value="#{item.manHoursDate}"
                                            required="true" requiredMessage="工时日期 #{msg.ValidationRequire}" showOn="button"
                                            readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" maxdate="#{appContextService.curentDate}">
                                </p:calendar>
                                <span style="color: red;">*</span>
                            </f:facet>
                        </p:cellEditor>
                    </p:column>
                    <p:column headerText="工作工时">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.workHours}"/>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputNumber maxValue="24" value="#{item.workHours}"/>
                            </f:facet>
                        </p:cellEditor>
                    </p:column>
                    <p:column headerText="差旅工时">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.travelHours}"/>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputNumber maxValue="24" value="#{item.travelHours}"/>
                            </f:facet>
                        </p:cellEditor>
                    </p:column>
                    <p:column headerText="等待工时">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.waitingHours}"/>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputNumber maxValue="24" value="#{item.waitingHours}"/>
                            </f:facet>
                        </p:cellEditor>
                    </p:column>
                    <p:column headerText="工时描述">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.comment}"/>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputTextarea rows="1" cols="40" value="#{item.comment}"/>
                            </f:facet>
                        </p:cellEditor>
                    </p:column>
                    <p:column headerText="操作">
                        <p:commandLink id="createButton" process="@this" actionListener="#{workOrderMgrController.initManHours}" title="#{msg.Add}" update="manHoursDataList" rendered="#{item.id eq '000' and empty item.woId}"><span class="ui-icon ui-icon-plusthick" /></p:commandLink>
                        <p:rowEditor process="@this" cancelTitle="取消" editTitle="修改" saveTitle="保存" rendered="#{item.id ne '000' or (item.id eq '000' and item.woId != null)}" update="manHoursDataList"/>
                        <p:commandLink process="@this" actionListener="#{workOrderMgrController.deleteManHours(item)}" title="#{msg.Delete}" update="manHoursDataList" rendered="#{item.id ne '000' or (item.id eq '000' and item.woId != null)}"><span class="ui-icon ui-icon-trash" /></p:commandLink>
                    </p:column>
                </p:dataTable>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
