<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="searchForm" class="searchForm">
            <h:panelGroup>
               <p:overlayPanel appendTo="searchForm" widgetVar="varPanelOrg1" for="#{workOrderMgrController.siteFor}" hideEffect="fade" dynamic="false" modal="false" >
                    <p:inputText id="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
                    <p:commandButton partialSubmit="true" icon="ui-icon-search" process="woTab:searchForm:treeNodeNameFilter @this" update="woTab:searchForm:orgTree" actionListener="#{orgTreeController.filterTreeNodeByNameType4()}" value="#{msg.Search}"/>
                    <p:commandButton partialSubmit="true" icon="ui-icon-search" process="woTab:searchForm:treeNodeNameFilter @this" update="woTab" value="确定"/>
                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{workOrderMgrController.siteOrgTree}" selection="#{workOrderMgrController.selectedAccessOrgNodes}" var="node" selectionMode="checkbox" dynamic="false" cache="false" propagateSelectionUp="#{orgTreeController.propagateSelectionUp}">
                            <p:ajax process="@this" event="select" listener="#{workOrderMgrController.onSelectSiteTreeNode}"/>
                            <p:ajax process="@this" event="unselect" listener="#{workOrderMgrController.onUnSelectSiteTreeNode}"/>
                            <p:ajax process="@this" event="expand"/>
                            <p:ajax process="@this" event="collapse"/>
                            <p:treeNode type="org">
                                <h:outputText value="#{node.name}"/>
                            </p:treeNode>
                            <p:treeNode type="hidden" rendered="false"/>
                        </p:tree>
                    </p:scrollPanel>
                </p:overlayPanel>
            </h:panelGroup>
        </h:form>
        <h:form id="woMgrListForm" rendered="#{!workOrderMgrController.viewIng}">
            <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                <c:choose>
                    <c:when test="#{!userContextService.hasCurrentTenantName('')}">
                        <p:commandButton value="#{msg.ToBeDone}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" disabled="#{workOrderMgrController.queryIndex==0}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW')}" action="workOrderList.xhtml?faces-redirect=true&amp;query=0" />
                        <p:commandButton value="#{msg.RequestForRepair}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" actionListener="#{workOrderMgrController.createServiceRequest()}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_CREATE')}" oncomplete="PF('createSRDialog').show()"/>
                        <p:commandButton value="#{msg.repaired}" process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm"  disabled="#{workOrderMgrController.queryIndex==1}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW')}" onclick="onButtonChange()" action="workOrderList.xhtml?faces-redirect=true&amp;query=1" />
                        <p:commandButton value="#{msg.tobeReview}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=10"  disabled="#{workOrderMgrController.queryIndex==10}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW') and userContextService.isEnableBtnByKey('enableWorkOrderReviewBtn')}"/>
                        <p:commandButton value="#{msg.waitDispatch}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=2"  disabled="#{workOrderMgrController.queryIndex==2}" rendered="#{userContextService.isDispatcher() or userContextService.accessContainsFunctionMenu('REPAIR_ORDER_DISPATCH')}"/>
                        <p:commandButton value="#{msg.waitTake}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=3"  disabled="#{workOrderMgrController.queryIndex==3}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_TAKE')}"/>
                        <p:commandButton value="#{msg.waitSending}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=13"  disabled="#{workOrderMgrController.queryIndex==13}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW') and userContextService.enableSendRepair()}"/>
                        <p:commandButton value="#{msg.repairing}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=4"  disabled="#{workOrderMgrController.queryIndex==4}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_TAKE')}"/>
                        <p:commandButton value="#{msg.waitReturn}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=14"  disabled="#{workOrderMgrController.queryIndex==14}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW') and userContextService.enableSendRepair()}"/>
                        <p:commandButton value="#{msg.waitAck}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=5"  disabled="#{workOrderMgrController.queryIndex==5}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW') and userContextService.isEnableBtnByKey('enableWorkOrderAckBtn')}"/>
                        <p:commandButton value="#{msg.waitFeedback}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=6"  disabled="#{workOrderMgrController.queryIndex==6}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW') and userContextService.isEnableBtnByKey('enableWorkOrderFeedbackBtn')}"/>
                        <p:commandButton value="#{msg.waitClose}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=7"  disabled="#{workOrderMgrController.queryIndex==7}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_CLOSE')}"/>
                        <p:commandButton value="#{msg.closed}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=8"  disabled="#{workOrderMgrController.queryIndex==8}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_CLOSE')}"/>
                        <p:commandButton value="#{msg.canceled}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=9"  disabled="#{workOrderMgrController.queryIndex==9}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW')}"/>
                        <p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" disabled="#{workOrderMgrController.queryIndex==11}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW')}" action="workOrderList.xhtml?faces-redirect=true&amp;query=11" />
                        <p:remoteCommand id="createSR" name="createSR" update="woTab:ServiceRequestCreateForm" actionListener="#{workOrderMgrController.createServiceRequest()}" oncomplete="PF('createSRDialog').show()" />
                    </c:when>
                    <c:otherwise>
                        <!--云阜 全部、待接单、维修中、已完成-->
                        <p:commandButton value="#{msg.ToBeDone}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" disabled="#{workOrderMgrController.queryIndex==0}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW')}" action="workOrderList.xhtml?faces-redirect=true&amp;query=0" />
                        <p:commandButton value="#{msg.waitTake}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=3"  disabled="#{workOrderMgrController.queryIndex==3}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_TAKE')}"/>
                        <p:commandButton value="#{msg.repairing}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=4"  disabled="#{workOrderMgrController.queryIndex==4}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_TAKE')}"/>
                        <p:commandButton value="已完成"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" action="workOrderList.xhtml?faces-redirect=true&amp;query=8"  disabled="#{workOrderMgrController.queryIndex==8}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW')}"/>
                        <p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet woTab:woMgrDetailForm woTab:ServiceRequestCreateForm" disabled="#{workOrderMgrController.queryIndex==11}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ORDER_VIEW')}" action="workOrderList.xhtml?faces-redirect=true&amp;query=11" />
                    </c:otherwise>
                </c:choose>
            </h:panelGrid>
            <p:dataTable id="datalist" value="#{workOrderMgrController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single" selection="#{workOrderMgrController.selected}"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.serviceRequest.requestTime}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500" >
                <c:if test="#{workOrderMgrController.pageType eq 'new'}">
                    <p:ajax event="rowSelect" listener="#{workOrderMgrController.onSelectOrder(null)}" onstart="prepareOrderViewWindow();" oncomplete="openOrderViewWindow(xhr, status, args)" update=" woTab:ServiceRequestCreateForm manHoursManageButton "/>
                </c:if>
                <c:if test="#{workOrderMgrController.pageType eq 'current'}">
                    <p:ajax event="rowSelect" listener="#{workOrderMgrController.onSelectOrder(null)}"  update=" woTab:woMgrDetailForm manHoursManageButton "/>
                </c:if>
                <p:ajax event="filter" listener="#{workOrderMgrController.onFilterWo}" update="datalist   " oncomplete="updateSelectAllCheckBox();"/>
                <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />

                <p:column width="36" id="checkBoxColumn" visible="#{workOrderMgrController.queryIndex == 10 or workOrderMgrController.queryIndex == 5}" exportable="false">
                    <p:selectBooleanCheckbox value="#{workOrderMgrController.selectedBatchMap[item.id]}"  class="selectCheckBox">
                        <p:ajax process="@this" update="@this @(.batch-terminated) batchReviewButton batchAckButton" oncomplete="updateSelectAllCheckBox();"/>
                    </p:selectBooleanCheckbox>
                    <f:facet name="header"  >
                        <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                            <p:ajax listener="#{workOrderMgrController.onSelectAllOfPage}" update="@(.selectCheckBox) batchReviewButton batchAckButton" oncomplete="updateSelectAllCheckBox();"/>
                        </p:selectBooleanCheckbox>
                    </f:facet>
                </p:column>
                <p:column width="70" styleClass="textCenter"  headerText="#{msg.casePriority}" sortBy="#{item.serviceRequest.casePriority}" filterBy="#{item.serviceRequest.casePriority}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('casePriority')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <c:choose>
                        <c:when test="#{!userContextService.hasCurrentTenantName('')}">
                            <h:outputText value="#{workOrderMgrController.displayModeCasePriority.equals('key')?item.serviceRequest.casePriority:fieldMsg.fieldValue('casePriority',item.serviceRequest.casePriority)}" class="priorityItem priorityItem#{item.serviceRequest.casePriority}"/>
                        </c:when>
                        <c:otherwise>
                            <h:outputText value="#{fieldMsg.fieldValue('casePriority',item.serviceRequest.casePriority)}" class="priorityItem priorityItem#{item.serviceRequest.casePriority}"></h:outputText>
                        </c:otherwise>
                    </c:choose>
                </p:column>
                <c:forEach items="#{workOrderMgrController.fieldColumnDtoList}" var="fieldItem">
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'assetName'}">
                        <p:column headerText="#{msg.assetName}" sortBy="#{item.assetInfo.name}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.name}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'manufacturerSerialNumber'}">
                        <p:column headerText="#{msg.ManufacturerSerialNumber}" sortBy="#{item.assetInfo.serialNum}" filterBy="#{item.assetInfo.serialNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.serialNum}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'departNum'}">
                        <p:column headerText="#{msg.departNum}" sortBy="#{item.assetInfo.departNum}" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.departNum}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'functionType'}">
                        <p:column headerText="#{msg.functionType}" sortBy="#{item.assetInfo.functionType}" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.functionType}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'systemId'}">
                        <c:if test="#{userContextService.isCountyArea()}">
                            <p:column headerText="System ID" sortBy="#{item.assetInfo.systemId}" filterBy="#{item.assetInfo.systemId}" filterMatchMode="LIKE">
                                <h:outputText value="#{item.assetInfo.systemId}"/>
                            </p:column>
                        </c:if>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'siebleNumber'}">
                        <c:if test="#{userContextService.isCountyArea()}">
                            <p:column headerText="#{msg.siebleNumber}" sortBy="#{item.siebleNumber}" filterBy="#{item.siebleNumber}" filterMatchMode="LIKE">
                                <h:outputText value="#{item.siebleNumber}"/>
                            </p:column>
                        </c:if>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'hospitalId'}">
                        <c:if test="#{userContextService.isCountyArea()}">
                            <p:column headerText="#{msg.hospitalId}" sortBy="#{item.serviceRequest.hospitalName}" filterBy="#{item.serviceRequest.hospitalName}" filterMatchMode="LIKE">
                                <h:outputText value="#{item.serviceRequest.hospitalName}"/>
                            </p:column>
                        </c:if>
                        <p:column headerText="#{msg.hospitalId}" sortBy="#{item.siteUID}" filterBy="#{item.siteUID}" filterMatchMode="EQ" rendered="#{!workOrderMgrController.isYiMaiYangGuangTenant}" visible="#{workOrderMgrController.hospitalShow}">
                            <f:facet name="filter" >
                                <p:autoComplete id="btnOrg1" value="请选择院区" type="button" icon="fa fa-angle-down" iconPos="right"/>
                            </f:facet>
                            <h:outputText value="#{workOrderMgrController.getSiteOrgName(item.siteUID)}"/>
                        </p:column>
                        <p:column headerText="#{msg.hospitalId}" sortBy="#{item.siteUID}" filterBy="#{item.siteUID}" filterMatchMode="EQ" rendered="#{workOrderMgrController.isYiMaiYangGuangTenant}">
                            <f:facet name="filter" >
                                <p:autoComplete id="btnOrg2" value="请选择院区" type="button" icon="fa fa-angle-down" iconPos="right"/>
                            </f:facet>
                            <h:outputText value="#{workOrderMgrController.getSiteOrgName(item.siteUID)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'clinicalDeptName'}">
                        <!--所属科室-->
                        <p:column headerText="#{msg.clinicalDeptName}"  filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="LIKE" width="100" rendered="#{!userContextService.hasCurrentTenantName('')}">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrController.fileterOrgName}"  filter="true" filterMatchMode="contains" filterNormalize="true" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{workOrderMgrController.clinicalDeptList}" var="item" itemLabel="#{item}" itemValue="#{item}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.assetInfo.clinicalDeptName}"/>
                        </p:column>
                        <p:column headerText="#{msg.clinicalDeptName}" filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="LIKE" width="100" rendered="#{userContextService.hasCurrentTenantName('')}">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrController.fileterOrgName}"  filter="true" filterMatchMode="contains" filterNormalize="true" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{workOrderMgrController.clinicalDeptList}" var="item" itemLabel="#{item}" itemValue="#{item}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{workOrderMgrController.getOrgInfoByUid(item.serviceRequest.fromDeptUID).name}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'locationName'}">
                        <p:column headerText="#{msg.locationName}" sortBy="#{item.assetInfo.locationName}" filterBy="#{item.assetInfo.locationName}" filterMatchMode="LIKE" rendered="#{workOrderMgrController.showLocationNameFlag}">
                            <h:outputText value="#{item.assetInfo.locationName}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'srNum'}">
                        <p:column headerText="#{msg.srNum}" sortBy="#{item.serviceRequest.srNum}" filterBy="#{item.serviceRequest.srNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.serviceRequest.srNum}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'requestorName'}">
                        <p:column headerText="#{msg.requestorName}" sortBy="#{item.serviceRequest.requestorName}" filterBy="#{item.serviceRequest.requestorName}" filterMatchMode="LIKE" rendered="#{!userContextService.hasCurrentTenantName('')}">
                            <h:outputText value="#{item.serviceRequest.requestorName}"/>
                        </p:column>
                        <p:column headerText="#{msg.requestorName}" sortBy="#{item.serviceRequest.requestorName}" filterBy="#{item.serviceRequest.requestorName}" filterMatchMode="LIKE" rendered="#{userContextService.hasCurrentTenantName('')}">
                            <h:outputText value="#{item.serviceRequest.requestorName}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'requireName'}">
                        <p:column headerText="#{msg.requireName}"  filterBy="#{item.id}" filterMatchMode="IN" rendered="#{!userContextService.hasCurrentTenantName('')}">
                            <h:outputText value="#{item.repairName}"/>
                        </p:column>
                        <!-- 云南阜外 全部、已完成维修人 -->
                        <p:column headerText="#{msg.Assignee}" filterBy="#{item.id}" filterMatchMode="LIKE"  rendered="#{(workOrderMgrController.queryIndex==8 or workOrderMgrController.queryIndex==11) and userContextService.hasCurrentTenantName('')}">
                            <!--维修人是从WorkOrderStep表中获取【维修中】步骤数据owner_name，维修中状态==4-->
                            <h:outputText value="#{workOrderMgrController.getRepairResponer(item.id,4)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'requestTime'}">
                        <p:column headerText="#{msg.requestTime}" sortBy="#{item.serviceRequest.requestTime}" filterBy="#{item.serviceRequest.requestTime}" filterMatchMode="LIKE">
                            <f:facet name="filter">
                                <p:inputText id="filterApplyTime" widgetVar="varFilterApplyTime" value="#{workOrderMgrController.applyTimeFormatTime}"/>
                            </f:facet>
                            <h:outputText value="#{item.serviceRequest.requestTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'currentStep'}">

                        <!--当前处理步骤 for 待办-->
                        <p:column rendered="#{workOrderMgrController.queryIndex eq 0}" headerText="#{msg.currentStep}" width="186" sortBy="#{item.currentStepId}" filterBy="#{item.currentStepName}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrController.stepFileter}"  rendered="#{workOrderMgrController.queryIndex eq 0 || workOrderMgrController.queryIndex eq 11}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{workOrderMgrController.needTwoSubStatus?workOrderMgrController.getWoSteps('2,3,4,5,6,10,11'):workOrderMgrController.getWoSteps('2,3,4,5,6')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.currentStepName}" style="display: none"/>
                            <p:graphicImage  width="165" height="38" url="#{workOrderMgrController.getStepImg(item)}"/>
                        </p:column>
                        <!--当前处理步骤 for 全部-->
                        <p:column rendered="#{workOrderMgrController.queryIndex eq 11 and !userContextService.hasCurrentTenantName('')}" headerText="#{msg.currentStep}" width="186" sortBy="#{item.currentStepId}" filterBy="#{item.currentStepName}" filterMatchMode="EQ">

                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrController.stepFileter}"  rendered="#{workOrderMgrController.queryIndex eq 0 || workOrderMgrController.queryIndex eq 11}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{workOrderMgrController.needTwoSubStatus?workOrderMgrController.getWoSteps('2,3,4,5,6,9,10,11'):workOrderMgrController.getWoSteps('2,3,4,5,6,9')}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.currentStepName}" style="display: none"/>
                            <p:graphicImage  width="165" height="38" url="#{workOrderMgrController.getStepImg(item)}"/>
                        </p:column>
                        <!--当前处理步骤 for 全部 云阜-->
                        <p:column rendered="#{workOrderMgrController.queryIndex eq 11 and userContextService.hasCurrentTenantName('')}" headerText="#{msg.currentStep}" width="186" sortBy="#{item.currentStepId}" filterBy="#{item.currentStepName}" filterMatchMode="EQ" >

                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrController.stepFileter}"  rendered="#{workOrderMgrController.queryIndex eq 0 || workOrderMgrController.queryIndex eq 11}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 3)}" itemValue="#{fieldMsg.fieldValue('woSteps', 3)}" />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 4)}" itemValue="#{fieldMsg.fieldValue('woSteps', 4)}" />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 9)}" itemValue="#{fieldMsg.fieldValue('woSteps', 9)}" />
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.currentStepName}" style="display: none"/>
                            <h:outputText  value="#{workOrderMgrController.getStepName(item)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{fieldItem.rendered and fieldItem.field eq 'intExtType'}">
