<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="preRenderView">
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet name="css/wo_steps.css" />
    </ui:define>

    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="维修工作台"/>
            </div>

            <div class="ui-g-12 card">
                <p:messages autoUpdate="true" closable="true" showDetail="false"/>

                <h:form id="woMgrListForm">
                    <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                        <p:commandButton value="全部"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.searchList(0)}" disabled="#{workOrderMgrController.queryIndex==0}" rendered="true"/>
                        <p:commandButton value="新增报修"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.createServiceRequest()}" rendered="true"/>
                        <p:commandButton value="已报修"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.searchList(1)}" disabled="#{workOrderMgrController.queryIndex==1}" rendered="true"/>
                        <p:commandButton value="待派工"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.searchList(2)}" disabled="#{workOrderMgrController.queryIndex==2}" rendered="#{userContextService.isDispatcher() or userContextService.hasRole('AssetHead')}"/>
                        <p:commandButton value="待接单"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.searchList(3)}" disabled="#{workOrderMgrController.queryIndex==3}" rendered="#{userContextService.hasRole('AssetStaff')}"/>
                        <p:commandButton value="维修中"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.searchList(4)}" disabled="#{workOrderMgrController.queryIndex==4}" rendered="#{userContextService.hasRole('AssetStaff')}"/>
                        <p:commandButton value="待验收"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.searchList(5)}" disabled="#{workOrderMgrController.queryIndex==5}" rendered="true"/>
                        <p:commandButton value="待评价"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.searchList(6)}" disabled="#{workOrderMgrController.queryIndex==6}" rendered="true"/>
                        <p:commandButton value="待关单"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.searchList(6)}" disabled="#{workOrderMgrController.queryIndex==6}" rendered="#{userContextService.hasRole('AssetStaff')}"/>
                        <p:commandButton value="已关单"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.searchList(7)}" disabled="#{workOrderMgrController.queryIndex==7}" rendered="true"/>
                        <p:commandButton value="已取消"  process="@this" update="datalist buttonSet :woMgrDetailForm :ServiceRequestCreateForm" actionListener="#{workOrderMgrController.searchList(8)}" disabled="#{workOrderMgrController.queryIndex==8}" rendered="true"/>
<!--                        <p:commandButton value="已派工" id="btn1" process="@this" update="datalist buttonSet :woMgrDetailForm " actionListener="#{workOrderMgrController.searchList(3)}"  disabled="#{workOrderMgrController.queryIndex==3}" />
                        <p:commandButton value="已关单" id="btn2" process="@this" update="datalist buttonSet :woMgrDetailForm " actionListener="#{workOrderMgrController.searchList(4)}" disabled="#{workOrderMgrController.queryIndex==4}"/>-->
                        <!--<p:commandButton value="已取消" id="btn5" process="@this" update="datalist buttonSet :woMgrDetailForm " actionListener="#{workOrderMgrController.searchList(5)}" disabled="#{workOrderMgrController.queryIndex==5}"/>-->
                    </h:panelGrid>
                    <p:dataTable id="datalist" value="#{workOrderMgrController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{workOrderMgrController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="10" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="10,20,30,90">

                        <p:ajax event="rowSelect" listener="#{workOrderMgrController.onSelectWorkOrder}" update=":woMgrDetailForm :ServiceRequestCreateForm"/>
                        <p:ajax event="filter" listener="#{workOrderMgrController.onFilter}" update="datalist :woMgrDetailForm"/>

                        <p:column styleClass="textCenter"  headerText="#{msg.casePriority}" sortBy="#{item.serviceRequest.casePriority}" filterBy="#{item.serviceRequest.casePriority}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('casePriority')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.serviceRequest.casePriority}" class="priorityItem priorityItem#{item.serviceRequest.casePriority}"/>
                        </p:column>
                        <p:column headerText="#{msg.assetName}" sortBy="#{item.assetInfo.name}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.departNum}" sortBy="#{item.assetInfo.departNum}" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.departNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.srNum}" sortBy="#{item.serviceRequest.srNum}" filterBy="#{item.serviceRequest.srNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.serviceRequest.srNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.requestorName}" sortBy="#{item.serviceRequest.requestorName}">
                            <h:outputText value="#{item.serviceRequest.requestorName}"/>
                        </p:column>
                        <p:column headerText="报修科室" sortBy="#{item.serviceRequest.fromDeptUID}">
                            <h:outputText value="#{workOrderMgrController.getOrgInfoByUid(item.serviceRequest.fromDeptUID).name}"/>
                        </p:column>
                        <p:column headerText="#{msg.requestTime}" sortBy="#{item.serviceRequest.requestTime}">
                            <h:outputText value="#{item.serviceRequest.requestTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.currentStep}" sortBy="#{item.currentStepId}" filterBy="#{item.currentStepName}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrController.stepFileter}"  rendered="#{workOrderMgrController.queryIndex eq 0}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('woSteps').subList(0,6)}" var="item" itemLabel="#{item.value}" itemValue="#{item.value}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.currentStepName}"/>
                        </p:column>
                        <p:column headerText="#{msg.intExtType}">
                            <h:outputText value="#{fieldMsg.fieldValue('intExtType',item.intExtType)}"/>
                        </p:column>
                        <p:column headerText="#{msg.currentPersonName}">
                            <h:outputText value="#{item.currentPersonName}"/>
                        </p:column>
                        <p:column headerText="#{msg.requestReason}" sortBy="#{item.serviceRequest.requestReason}" filterBy="#{item.serviceRequest.requestReason}" filterMatchMode="LIKE">
                            <h:outputText value="#{workOrderMgrController.getRequestReasonInShort(item.serviceRequest.requestReason)}"/>
                        </p:column>
                        <p:column headerText="#{msg.Cancel}" rendered="#{workOrderMgrController.queryIndex==1}">
                            <p:commandButton value="#{msg.Cancel}" actionListener="#{workOrderMgrController.prepareAct(item.id)}" update=":cancelDialogForm" oncomplete="PF('cancelDialog').show()"/>
                        </p:column>
                        <p:column headerText="#{msg.dispatchWorkOrder}" rendered="#{workOrderMgrController.queryIndex==2 and (userContextService.isDispatcher() or userContextService.hasRole('AssetHead'))}">
                            <p:commandButton value="#{msg.dispatchWorkOrder}" actionListener="#{workOrderMgrController.prepareAct(item.id)}" update=":dispatchDialogForm" oncomplete="PF('dispatchDialog').show()"/>
                        </p:column>
                        <p:column headerText="#{msg.takeOrtrans}" rendered="#{workOrderMgrController.queryIndex==3 and (userContextService.hasRole('AssetStaff') or userContextService.hasRole('AssetHead'))}">
                            <p:commandButton value="#{msg.takeorder}" actionListener="#{workOrderMgrController.prepareAct(item.id)}" update=":takeOrderDialogForm" oncomplete="PF('takeOrderDialog').show()"/>
                            <p:commandButton value="#{msg.transfer}" actionListener="#{workOrderMgrController.prepareAct(item.id)}" update=":transferOrderDialogForm" oncomplete="PF('transferOrderDialog').show()"/>
                        </p:column>
                        <p:column headerText="#{msg.Actions}" rendered="#{workOrderMgrController.queryIndex==4 and userContextService.hasRole('AssetStaff')}">
                            <p:commandButton value="签到" actionListener="#{workOrderMgrController.checkIn(item.id)}" update=":woMgrListForm"  disabled="#{not empty item.checkinTime}"/>
                            <p:commandButton value="#{msg.transfer}" actionListener="#{workOrderMgrController.prepareAct(item.id)}" update=":transferOrderDialogForm" oncomplete="PF('transferOrderDialog').show()"/>
                            <p:commandButton value="完成" actionListener="#{workOrderMgrController.prepareCompleteOrder(item.id)}" update=":repairCompleteDialogForm" oncomplete="PF('repairCompleteDialog').show()"/>
                            <p:commandButton  value="#{msg.newWorkOrder}" actionListener="#{workOrderMgrController.prepareAct(item.id)}" update=":newWorkorderDlgForm :growl"  oncomplete="PF('newWorkorderDlg').show()"/>
                        </p:column>
                        <p:column headerText="#{msg.Acknowledge}" rendered="#{workOrderMgrController.queryIndex==5}">
                            <p:commandButton value="#{msg.Acknowledge}" actionListener="#{workOrderMgrController.prepareAct(item.id)}" update=":ackDialogForm" oncomplete="PF('ackDialog').show()"/>
                        </p:column>
                        <p:column headerText="#{msg.feedback}" rendered="#{workOrderMgrController.queryIndex==6}">
                            <p:commandButton value="#{msg.feedback}" actionListener="#{workOrderMgrController.prepareAct(item.id)}" update=":rateDialogForm" oncomplete="PF('rateDialog').show()"  disabled="#{item.feedbackRating gt 0}"/>
                            <p:commandButton value="#{msg.closeWo}" actionListener="#{workOrderMgrController.prepareCloseOrder(item.id)}" update=":toCloseDialogForm" oncomplete="PF('toCloseDialog').show()" rendered="#{userContextService.hasRole('AssetStaff')}" disabled="#{item.serviceRequest.status eq 2}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="WorkOrder_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="woMgrView.xhtml"/>
                <ui:include src="srCreate.xhtml"/>
                <ui:include src="takeOrderDialog.xhtml"/>
                <ui:include src="transferDialog.xhtml"/>
                <ui:include src="repairCompleteDlg.xhtml"/>
                <ui:include src="newOrderDialog.xhtml"/>
                <ui:include src="toCloseDlg.xhtml"/>
            </div>
        </div>
        <p:dialog id="dispatchDialog" widgetVar="dispatchDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.dispatchWorkOrder}">
            <h:form id="dispatchDialogForm" >
                <h:panelGroup id="display" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.WorkOrderAssignee}*</label>
                            <p:selectOneMenu  value="#{workOrderMgrController.selectedWorkOrder.currentPersonId}" required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}">
                                <f:selectItems value="#{workOrderMgrController.getWorkerList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.intExtType}*</label>
                            <p:selectOneMenu  value="#{workOrderMgrController.selectedWorkOrder.intExtType}" required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}">
                                <f:selectItems value="#{fieldMsg.getFieldValueList('intExtType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.dispatchWorkOrder()}" value="#{msg.dispatchWorkOrder}" update=":woMgrListForm :woMgrDetailForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'dispatchDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('dispatchDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <p:dialog id="cancelDialog" widgetVar="cancelDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.cancelWorkOrder}">
            <h:form id="cancelDialogForm" >
                <h:panelGroup id="display" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup >
                            <label class="label">#{msg.cancelWorkOrderReason}</label>
                            <p:inputTextarea value="#{workOrderMgrController.cancelReason}" maxlength="256"  required="true" requiredMessage="#{msg.cancelWorkOrderReason}#{msg.ValidationRequire}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <h:panelGroup >
                        <p:commandButton value="确定" icon="ui-icon-arrow-back" actionListener="#{workOrderMgrController.cancelWorkOrder()}" validateClient="true"  update=":woMgrListForm :woMgrDetailForm :growl" style="float:left" oncomplete="handleSubmit(args, 'cancelDialog');" >
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.CancelWorkOrderConformationMsg}" icon="ui-icon-warning"/>
                        </p:commandButton>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('cancelDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <p:dialog id="ackDialog" widgetVar="ackDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.Acknowledge}">
            <h:form id="ackDialogForm" >
                <h:panelGroup id="display" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">#{msg.comments}</label>
                            <p:inputTextarea value="#{workOrderMgrController.failReason}" maxlength="256"  required="true" requiredMessage="#{msg.comments}#{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup id="assetstatus">
                            <label class="label">#{msg.status}</label>
                            <p:selectOneRadio id="status" value="#{workOrderMgrController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                                <p:ajax  listener="#{workOrderMgrController.onStatusChange()}"  update="assetstatus" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneRadio>
                            <p:calendar timeZone="GMT+8" label="#{msg.confirmedDownTime}" rendered="#{workOrderMgrController.needConfirmTime}"  id="confirmedDownTime" pattern="yyyy/MM/dd HH:mm" value="#{workOrderAckController.confirmedDownTime}" showOn="button" 
                                        readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.confirmedDownTime} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton immediate="true" validateClient="false" actionListener="#{workOrderMgrController.ackWorkOrder()}" value="#{msg.AckPass}" update=":woMgrListForm ackDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'ackDialog');"/>
                        <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.rejectWorkOrder()}" value="#{msg.AckNoPass}" update=":woMgrListForm ackDialogForm :growl"  oncomplete="handleSubmit(args, 'ackDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('ackDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <p:dialog id="rateDialog" widgetVar="rateDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.feedbackRating}">
            <h:form id="rateDialogForm" >
                <h:panelGroup id="display" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">#{msg.feedbackRating}</label>
                            <p:rating value="#{workOrderMgrController.rating}" required="true" requiredMessage="#{msg.feedbackRating}#{msg.ValidationRequire}"  cancel="false"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.feedbackComment}</label>
                            <p:inputTextarea value="#{workOrderRateController.comments}" maxlength="256" />
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{workOrderMgrController.rateWorkOrder()}" value="#{msg.Confirm}" update=":woMgrListForm rateDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'rateDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('rateDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:define>

</ui:composition>
