<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <div class="ui-g-12 card">

        <h:form id="woMgrSupplierListForm">
            <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                <p:commandButton value="#{msg.RequestForRepair}"  process="@this" update="datalist buttonSet woSupplierTab woSupplierTab:ServiceRequestSupplierCreateForm" actionListener="#{workOrderMgrSupplierController.createServiceRequest()}" rendered="#{userContextService.hasRole('SupplierFE') or userContextService.hasRole('SupplierAdmin')}" oncomplete="PF('createSRDiaSupplierlog').show()"/>
                <p:commandButton value="#{msg.waitTake}"  process="@this" update="datalist buttonSet woSupplierTab woSupplierTab:ServiceRequestSupplierCreateForm" action="workOrderSupplierList.xhtml?faces-redirect=true&amp;query=3"  disabled="#{workOrderMgrSupplierController.queryIndex==3}" rendered="#{userContextService.hasRole('SupplierFE')}"/>
                <p:commandButton value="#{msg.repairing}"  process="@this" update="datalist buttonSet woSupplierTab woSupplierTab:ServiceRequestSupplierCreateForm" action="workOrderSupplierList.xhtml?faces-redirect=true&amp;query=4"  disabled="#{workOrderMgrSupplierController.queryIndex==4}" rendered="#{userContextService.hasRole('SupplierFE')}"/>
                <p:commandButton value="#{msg.closed}"  process="@this" update="datalist buttonSet woSupplierTab woSupplierTab:ServiceRequestSupplierCreateForm" action="workOrderSupplierList.xhtml?faces-redirect=true&amp;query=8"  disabled="#{workOrderMgrSupplierController.queryIndex==8}" rendered="#{(userContextService.hasRole('SupplierFE') or userContextService.hasRole('SupplierAdmin'))}"/>
            </h:panelGrid>

            <p:dataTable id="datalist" value="#{workOrderMgrSupplierController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single" selection="#{workOrderMgrSupplierController.selected}"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.serviceRequest.requestTime}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500" >

                <p:ajax event="rowSelect" listener="#{workOrderMgrSupplierController.onSelectWorkOrder}" update="woSupplierTab:woMgrSupplierDetailForm woSupplierTab:ServiceRequestSupplierCreateForm"/>
                <p:ajax event="filter" listener="#{workOrderMgrSupplierController.onFilterWo}" update="datalist woSupplierTab:woMgrSupplierDetailForm"/>

                <p:column width="70" styleClass="textCenter"  headerText="#{msg.casePriority}" sortBy="#{item.serviceRequest.casePriority}" filterBy="#{item.serviceRequest.casePriority}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('casePriority')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{item.serviceRequest.casePriority}" class="priorityItem priorityItem#{item.serviceRequest.casePriority}"/>
                </p:column>

                <p:column headerText="#{msg.assetName}" sortBy="#{item.assetInfo.name}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.assetInfo.name}"/>
                </p:column>
                <p:column headerText="#{msg.ManufacturerSerialNumber}" sortBy="#{item.assetInfo.serialNum}" filterBy="#{item.assetInfo.serialNum}" filterMatchMode="LIKE"> <h:outputText value="#{item.assetInfo.serialNum}"/>
                </p:column>
                <p:column headerText="#{msg.departNum}" sortBy="#{item.assetInfo.departNum}" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.assetInfo.departNum}"/>
                </p:column>
                <p:column headerText="#{msg.functionType}" sortBy="#{item.assetInfo.functionType}" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.assetInfo.functionType}"/>
                </p:column>
                <!--所属科室-->
                <p:column headerText="#{msg.clinicalDeptName}"  width="100" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <f:facet name="header">
                        <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                        <p:autoComplete dropdown="true" value="#{workOrderMgrSupplierController.fileterOrgName}" appendTo="@(Body)"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{workOrderMgrSupplierController.autoCompleteDeptName}" size="5">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrSupplierController.onClinicalDeptNameFilterChange}" process="@this"  update="woSupplierTab:woMgrSupplierListForm:datalist" />

                            <p:ajax process="@this" listener="#{workOrderMgrSupplierController.onClinicalDeptNameFilterChange}" update="woSupplierTab:woMgrSupplierListForm:datalist" />

                        </p:autoComplete>
                    </f:facet>
                    <h:outputText value="#{item.assetInfo.clinicalDeptName}"/>
                </p:column>
                <p:column headerText="#{msg.clinicalDeptName}"  width="100" rendered="#{userContextService.hasCurrentTenantName('')}">
                    <f:facet name="header">
                        <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                        <p:autoComplete dropdown="true" value="#{workOrderMgrSupplierController.fileterOrgName}" appendTo="@(Body)"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{workOrderMgrSupplierController.autoCompleteDeptName}" size="5">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrSupplierController.onClinicalDeptNameFilterChange}" process="@this"  update="woSupplierTab:woMgrSupplierListForm:datalist" />

                            <p:ajax process="@this" listener="#{workOrderMgrSupplierController.onClinicalDeptNameFilterChange}" update="woSupplierTab:woMgrSupplierListForm:datalist" />

                        </p:autoComplete>
                    </f:facet>
                    <h:outputText value="#{workOrderMgrSupplierController.getOrgInfoByUid(item.serviceRequest.fromDeptUID).name}"/>
                </p:column>

                <p:column headerText="#{msg.srNum}" sortBy="#{item.serviceRequest.srNum}" filterBy="#{item.serviceRequest.srNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.serviceRequest.srNum}"/>
                </p:column>

                <p:column headerText="#{msg.requestorName}" sortBy="#{item.serviceRequest.requestorName}" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{item.serviceRequest.requestorName}"/>
                </p:column>
                <p:column headerText="#{msg.requestTime}" sortBy="#{item.serviceRequest.requestTime}" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{item.serviceRequest.requestTime}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="#{msg.requestorName}" sortBy="#{item.serviceRequest.requestorName}" filterBy="#{item.serviceRequest.requestorName}" filterMatchMode="LIKE" rendered="#{userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{item.serviceRequest.requestorName}"/>
                </p:column>
                <p:column headerText="#{msg.requestTime}" sortBy="#{item.serviceRequest.requestTime}" filterBy="#{item.serviceRequest.requestTime}" filterMatchMode="GTE" rendered="#{userContextService.hasCurrentTenantName('')}">
                    <f:facet name="filter">
                        <p:inputText id="filterPlannedCompletionTime" widgetVar="varFilterRequestTime" value="#{workOrderMgrSupplierController.plannedCompletionTimeFormat}"/>
                    </f:facet>
                    <h:outputText value="#{item.serviceRequest.requestTime}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.Assignee}" filterBy="#{item.id}" filterMatchMode="LIKE"  rendered="#{workOrderMgrSupplierController.queryIndex==8 and userContextService.hasCurrentTenantName('')}">
                    <!--6 表示 step_name 是待关单-->
                    <h:outputText value="#{workOrderMgrSupplierController.getRepairResponer(item.id,6)}"/>
                </p:column>
                <p:column headerText="#{msg.Assignee}"  rendered="#{workOrderMgrSupplierController.queryIndex==8 and !userContextService.hasCurrentTenantName('')}">
                    <!--6 表示 step_name 是待关单-->
                    <h:outputText value="#{workOrderMgrSupplierController.getRepairResponer(item.id,6)}"/>
                </p:column>

                <!--当前处理步骤 for 待办-->
                <p:column rendered="#{workOrderMgrSupplierController.queryIndex eq 0}" headerText="#{msg.currentStep}" width="186" sortBy="#{item.currentStepId}" filterBy="#{item.currentStepName}" filterMatchMode="EQ">

                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrSupplierController.stepFileter}"  rendered="#{workOrderMgrSupplierController.queryIndex eq 0 || workOrderMgrSupplierController.queryIndex eq 11}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 2)}" itemValue="#{fieldMsg.fieldValue('woSteps', 2)}"  />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 3)}" itemValue="#{fieldMsg.fieldValue('woSteps', 3)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 4)}" itemValue="#{fieldMsg.fieldValue('woSteps', 4)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 5)}" itemValue="#{fieldMsg.fieldValue('woSteps', 5)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 6)}" itemValue="#{fieldMsg.fieldValue('woSteps', 6)}" />
                        </p:selectOneMenu>
                    </f:facet>
                    <p:graphicImage  width="165" height="38" name="#{workOrderMgrSupplierController.getStepImg(item)}"/>
                </p:column>
                <!--当前处理步骤 for 全部-->
                <p:column rendered="#{workOrderMgrSupplierController.queryIndex eq 11 and !userContextService.hasCurrentTenantName('')}" headerText="#{msg.currentStep}" width="186" sortBy="#{item.currentStepId}" filterBy="#{item.currentStepName}" filterMatchMode="EQ">

                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrSupplierController.stepFileter}"  rendered="#{workOrderMgrSupplierController.queryIndex eq 0 || workOrderMgrSupplierController.queryIndex eq 11}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 2)}" itemValue="#{fieldMsg.fieldValue('woSteps', 2)}"  />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 3)}" itemValue="#{fieldMsg.fieldValue('woSteps', 3)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 4)}" itemValue="#{fieldMsg.fieldValue('woSteps', 4)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 5)}" itemValue="#{fieldMsg.fieldValue('woSteps', 5)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 6)}" itemValue="#{fieldMsg.fieldValue('woSteps', 6)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 9)}" itemValue="#{fieldMsg.fieldValue('woSteps', 9)}" />
                        </p:selectOneMenu>
                    </f:facet>
                    <p:graphicImage  width="165" height="38" name="#{workOrderMgrSupplierController.getStepImg(item)}"/>
                </p:column>
                <!--当前处理步骤 for 全部 云阜-->
                <p:column rendered="#{workOrderMgrSupplierController.queryIndex eq 11 and userContextService.hasCurrentTenantName('')}" headerText="#{msg.currentStep}" width="186" sortBy="#{item.currentStepId}" filterBy="#{item.currentStepName}" filterMatchMode="EQ" >

                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{workOrderMgrSupplierController.stepFileter}"  rendered="#{workOrderMgrSupplierController.queryIndex eq 0 || workOrderMgrSupplierController.queryIndex eq 11}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 3)}" itemValue="#{fieldMsg.fieldValue('woSteps', 3)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 4)}" itemValue="#{fieldMsg.fieldValue('woSteps', 4)}" />
                            <f:selectItem itemLabel="#{fieldMsg.fieldValue('woSteps', 9)}" itemValue="#{fieldMsg.fieldValue('woSteps', 9)}" />
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText  value="#{workOrderMgrSupplierController.getStepName(item)}"/>
                </p:column>
                <p:column width="90" headerText="#{msg.intExtType}" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{fieldMsg.fieldValue('intExtType',item.intExtType)}"/>
                </p:column>

                <p:column headerText="#{msg.requestReason}" sortBy="#{item.serviceRequest.requestReason}" filterBy="#{item.serviceRequest.requestReason}" filterMatchMode="LIKE">
                    <h:outputText value="#{workOrderMgrSupplierController.getRequestReasonInShort(item.serviceRequest.requestReason)}"/>
                </p:column>


                <p:column headerText="#{msg.Actions}" style="width: 100px" rendered="#{workOrderMgrSupplierController.queryIndex==1}" exportable="false">
                    <p:commandButton value="#{msg.Cancel}" actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="woSupplierTab:cancelDialogForm" oncomplete="PF('cancelDialog').show()"/>
                </p:column>
                <p:column headerText="#{msg.Actions}" style="width: 100px" exportable="false" rendered="#{workOrderMgrSupplierController.queryIndex==2 and userContextService.isDispatcher()}">
                    <p:commandButton value="#{msg.dispatchWorkOrder}" actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="woSupplierTab:dispatchDialogForm" oncomplete="PF('dispatchDialog').show()"/>

                    <p:commandButton  value="#{msg.Cancel}"  actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="woSupplierTab:cancelDialogForm" rendered="#{userContextService.hasRole('AssetHead')}" oncomplete="PF('cancelDialog').show()"/>

                </p:column>
                <p:column headerText="#{msg.Actions}" style="width: 100px" exportable="false" rendered="#{workOrderMgrSupplierController.queryIndex==3}">
                    <p:commandButton value="#{item.currentPersonId==userContextService.loginUserId and item.currentStepId==3? msg.takeorder:msg.CompeteOrder}" actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="woSupplierTab:takeOrderDialogSupplierForm" oncomplete="PF('takeOrderDialog').show()"/>
                    <p:commandButton value="#{msg.transfer}" actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="transferOrderDialogSupplierForm" oncomplete="PF('transferOrderDialog').show()"/>
                    <p:commandButton  value="#{msg.Cancel}"  actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="woSupplierTab:cancelDialogForm" rendered="#{!userContextService.hasCurrentTenantName('')}" oncomplete="PF('cancelDialog').show()"/>

                </p:column>
                <p:column headerText="#{msg.Actions}" style="width: 100px" exportable="false" rendered="#{workOrderMgrSupplierController.queryIndex==4}">
                    <p:commandButton value="#{msg.signon}" actionListener="#{workOrderMgrSupplierController.checkIn(item.id)}" update="woSupplierTab:woMgrSupplierListForm"  disabled="#{not empty item.checkinTime}"/>
                    <p:commandButton value="#{msg.transfer}" actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="#{item.approvalStatus eq '1' or item.approvalStatus eq '5'? '':'transferOrderDialogSupplierForm'}" oncomplete="PF('transferOrderDialog').show()" disabled="#{item.approvalStatus eq '1' or item.approvalStatus eq '5'}"/>
                    <p:commandButton value="#{msg.repair}" actionListener="#{workOrderMgrSupplierController.prepareCompleteOrder(item.id)}" update="#{item.approvalStatus eq '1'  or item.approvalStatus eq '5'? '':'@(.x0) @(.pictureListCls) woSupplierTab:repairCompleteDialogForm'}" oncomplete="PF('repairCompleteDialog').show()" disabled="#{item.approvalStatus eq '1' or item.approvalStatus eq '5'}"/>
                    <p:commandButton  value="#{msg.new}" actionListener="#{workOrderMgrSupplierController.prepareNewWorkOrder(item.id)}" update="#{item.approvalStatus eq '1'  or item.approvalStatus eq '5'? '':'woSupplierTab:newWorkorderDlgForm  :growl'}"  oncomplete="PF('newWorkorderDlg').show()" disabled="#{item.approvalStatus eq '1' or item.approvalStatus eq '5'}"/>
                    <!--报修后，被接单的工单 医工主任有权限能够取消 -->
                    <p:commandButton  value="#{msg.Cancel}" actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="woSupplierTab:cancelDialogForm" rendered="#{!userContextService.hasCurrentTenantName('')}" oncomplete="PF('cancelDialog').show()"/>
                </p:column>
                <p:column headerText="#{msg.Actions}" style="width: 100px" exportable="false" rendered="#{workOrderMgrSupplierController.queryIndex==10}"><!--审批-->
                    <p:commandButton value="#{msg.audit}" actionListener="#{workOrderMgrSupplierController.prepareAproval(item)}" update="woSupplierTab:approveDialogForm" oncomplete="PF('approveDialog').show()"/>
                </p:column>
                <p:column headerText="#{msg.Actions}" style="width: 100px" exportable="false" rendered="#{workOrderMgrSupplierController.queryIndex==5}">
                    <p:commandButton value="#{msg.Acknowledge}" actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="woSupplierTab:ackDialogForm"  oncomplete="PF('ackDialog').show()"/>
                    <p:commandButton value="#{msg.Edit}" disabled="#{!userContextService.hasRole('AssetHead')}" actionListener="#{workOrderMgrSupplierController.prepareCloseOrder(item.id)}" update="woSupplierTab:ackEditForm" oncomplete="PF('ackEditDialog').show()"/>

                </p:column>
                <p:column headerText="#{msg.Actions}" style="width: 100px" exportable="false" rendered="#{workOrderMgrSupplierController.queryIndex eq 6}">
                    <p:commandButton value="#{msg.feedback}" actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="woSupplierTab:rateDialogForm" oncomplete="PF('rateDialog').show()"  disabled="#{item.feedbackRating gt 0}" />
                </p:column>
                <p:column headerText="#{msg.Actions}" style="width: 100px" exportable="false" rendered="#{userContextService.hasRole('AssetStaff') and workOrderMgrSupplierController.queryIndex==7}"><!--关单-->
                    <p:commandButton value="#{msg.closeWo}" actionListener="#{workOrderMgrSupplierController.prepareCloseOrder(item.id)}" update="woSupplierTab:toCloseDialogForm" oncomplete="PF('toCloseDialog').show()" disabled="#{item.serviceRequest.status eq 2}"/>
                </p:column>
                <p:column headerText="#{msg.maintenanceValue}" style="width: 100px" sortBy="#{item.maintenanceValue}" rendered="#{workOrderMgrSupplierController.queryIndex==8 and !userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{item.maintenanceValue}"/>
                </p:column>
                <p:column headerText="#{msg.Actions}" style="width: 100px" exportable="false" rendered="#{ workOrderMgrSupplierController.queryIndex==8}"><!--已关单-->
                    <p:commandButton value="#{msg.Edit}" actionListener="#{workOrderMgrSupplierController.prepareCloseOrder(item.id)}" update="woSupplierTab:EditCloseDialogSupplierForm" oncomplete="PF('EditCloseDiaSupplierlog').show()"/>
                </p:column>

                <p:column headerText="#{msg.Actions}" style="width: 100px" exportable="false" rendered="#{userContextService.hasRole('AssetHead') and workOrderMgrSupplierController.queryIndex==0}">
                    <!--待派工 待接单 待维修-->
                    <p:commandButton  value="#{msg.Cancel}" actionListener="#{workOrderMgrSupplierController.prepareAct(item.id)}" update="woSupplierTab:cancelDialogForm" rendered="#{userContextService.hasRole('AssetHead')}" disabled="#{workOrderMgrSupplierController.isStep(item)}" oncomplete="PF('cancelDialog').show()"/>
                </p:column>

                <f:facet name="{Toolbar}">
                    <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
                        <p:dataExporter type="xls" target="datalist" fileName="WorkOrder_export"/>
                    </p:commandButton>
                </f:facet>
            </p:dataTable>
        </h:form>
        <ui:include src="woMgrSupplierView.xhtml"/>
        <ui:include src="repairCompleteSupplierDlg.xhtml"/>
        <ui:include src="srSupplierCreate.xhtml"/>
        <ui:include src="takeOrderSupplierDialog.xhtml"/>
        <ui:include src="transferSupplierDialog.xhtml"/>
        <ui:include src="newOrderDiaSupplierlog.xhtml"/>
        <ui:include src="toCloseDlgSupplier.xhtml"/>
        <ui:include src="editCloseDlgSupplier.xhtml"/>
        <ui:include src="approveDlgSupplier.xhtml"/>
        <ui:include src="moreAccDialogPriceSupplier.xhtml"/>
    </div>
    <p:overlayPanel id="idPanelFilterPlannedCompletionTime" widgetVar="panelFilterPlannedCompletionTime" for="woSupplierTab:woMgrSupplierListForm:datalist:filterPlannedCompletionTime" dismissable="false" >
        <h:panelGrid columns="2">
            <p:outputLabel value="#{msg.From}"/>
            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varPlannedCompletionTimeFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
            <p:outputLabel value="#{msg.To}"/>
            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varPlannedCompletionTimeTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
        </h:panelGrid>
        <p:commandButton onclick="setDateFilter('varDataList', 'varFilterRequestTime', 'varPlannedCompletionTimeFrom', 'varPlannedCompletionTimeTo'); PF('panelFilterPlannedCompletionTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
        <p:commandButton onclick="PF('panelFilterPlannedCompletionTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
    </p:overlayPanel>
    <p:dialog id="ackEditDialog" widgetVar="ackEditDialog" modal="true" width="300"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.UpdateRepairResult}">
        <h:form id="ackEditForm" >
            <h:panelGroup>
                <label class="label">#{msg.RepairResult}*</label>
                <p:selectOneMenu id="repairResult"  value="#{workOrderMgrSupplierController.selectedWorkOrder.repairResult}" required="false" requiredMessage="#{msg.RepairResult} #{msg.ValidationRequire}">
                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                    <f:selectItems value="#{fieldMsg.getFieldValueList('repairResult')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                </p:selectOneMenu>
            </h:panelGroup>
            <br/>
            <h:panelGroup>
                <p:commandButton validateClient="true" actionListener="#{workOrderMgrSupplierController.saveEditedWorkOrder}" value="#{msg.save}" update="woSupplierTab:woMgrSupplierListForm woSupplierTab:woMgrSupplierDetailForm" icon="ui-icon-check" oncomplete="handleSubmit(args,'ackEditDialog');"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrSupplierController.cancel()}" icon="ui-icon-cancel" onclick="PF('ackEditDialog').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>

    <p:dialog id="dispatchDialog" widgetVar="dispatchDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.dispatchWorkOrder}">
        <h:form id="dispatchDialogForm" >
            <h:panelGroup id="display4" rendered="#{not empty workOrderMgrSupplierController.selectedWorkOrder}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.WorkOrderAssignee}*</label>
                        <p:selectOneMenu  value="#{workOrderMgrSupplierController.selectedWorkOrder.currentPersonId}" required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}">
                            <f:selectItems value="#{workOrderMgrSupplierController.getWorkerList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrSupplierController.dispatchWorkOrder()}" value="#{msg.dispatchWorkOrder}" update="woSupplierTab:woMgrSupplierListForm woSupplierTab:woMgrSupplierDetailForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'dispatchDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('dispatchDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
    <p:dialog id="cancelDialog" widgetVar="cancelDialog" modal="true" width="500"  resizable="true" draggable="true" header="#{msg.cancelWorkOrder}">
        <h:form id="cancelDialogForm" >
            <h:panelGroup id="display1" rendered="#{not empty workOrderMgrSupplierController.selectedWorkOrder}">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                    <h:panelGroup>
                        <label class="label">#{msg.deviceStatus}*</label>
                        <p:selectOneMenu value="#{workOrderMgrSupplierController.assetStatus}" >
                            <f:selectItems value="#{assetInfoEditController.assetStatusList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="#{!item.editable}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">#{msg.cancelWorkOrderReason}</label>
                        <p:inputTextarea value="#{workOrderMgrSupplierController.cancelReason}" maxlength="256"  required="true" requiredMessage="#{msg.cancelWorkOrderReason}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                </p:panelGrid>
                <h:panelGroup >
                    <p:commandButton value="#{msg.selectSearchInterval_2}" icon="ui-icon-arrow-back" actionListener="#{workOrderMgrSupplierController.cancelWorkOrder()}" validateClient="true"  update="woSupplierTab:woMgrSupplierListForm woSupplierTab:woMgrSupplierDetailForm :growl" style="float:left" oncomplete="handleSubmit(args, 'cancelDialog');" >
                        <p:confirm header="#{msg.confirmcancel}" message="#{msg.CancelWorkOrderConformationMsg}" icon="ui-icon-warning"/>
                    </p:commandButton>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('cancelDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
    <p:dialog id="ackDialog" widgetVar="ackDialog" modal="true" width="550"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.Acknowledge}">
        <h:form id="ackDialogForm" >
            <h:panelGroup id="display" rendered="#{not empty workOrderMgrSupplierController.selectedWorkOrder}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup >
                        <label class="label">#{msg.comments}</label>
                        <p:inputTextarea value="#{workOrderMgrSupplierController.failReason}" maxlength="256"  required="true" requiredMessage="#{msg.comments}#{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup id="assetstatus">
                        <label class="label">#{msg.status}</label>
                        <p:selectOneRadio id="status" value="#{workOrderMgrSupplierController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                            <p:ajax  listener="#{workOrderMgrSupplierController.onStatusChange()}"  update="assetstatus" />
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(0).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(0).msgKey}" />
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(1).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(1).msgKey}" itemDisabled="false"/>
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(2).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(2).msgKey}" />
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(3).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(3).msgKey}" />
                        </p:selectOneRadio>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" label="#{msg.confirmedDownTime}" rendered="#{workOrderMgrSupplierController.needConfirmTime}"  id="confirmedDownTime"  value="#{workOrderMgrSupplierController.confirmedDownTime}" showOn="button"
                                    readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.confirmedDownTime} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton immediate="true" validateClient="false" actionListener="#{workOrderMgrSupplierController.ackWorkOrder()}" value="#{msg.AckPass}" update="woSupplierTab:woMgrSupplierListForm ackDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'ackDialog');"/>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrSupplierController.rejectWorkOrder()}" value="#{msg.AckNoPass}" update="woSupplierTab:woMgrSupplierListForm ackDialogForm :growl"  oncomplete="handleSubmit(args, 'ackDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrSupplierController.cancel()}" icon="ui-icon-cancel" onclick="PF('ackDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
    <p:dialog id="rateDialog" widgetVar="rateDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.feedbackRating}">
        <h:form id="rateDialogForm" >
            <h:panelGroup id="display" rendered="#{not empty workOrderMgrSupplierController.selectedWorkOrder}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup >
                        <label class="label">#{msg.feedbackRating}</label>
                        <p:rating value="#{workOrderMgrSupplierController.rating}" required="true" requiredMessage="#{msg.feedbackRating}#{msg.ValidationRequire}"  cancel="false"/>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">#{msg.feedbackComment}</label>
                        <p:inputTextarea value="#{workOrderMgrSupplierController.comments}" maxlength="256" />
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton immediate="false" validateClient="true" actionListener="#{workOrderMgrSupplierController.rateWorkOrder()}" value="#{msg.Confirm}" update="woSupplierTab:woMgrSupplierListForm rateDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'rateDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('rateDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

    <script>
        afterPageLoad = function () {
            var requestAssetUid = "#{workOrderMgrSupplierController.requestAssetUid}";
            if (requestAssetUid != "") {
                createSR();
            };

            var isActive = "#{userContextService.isActive()}";
            if(isActive == '1'){
                PF('ActiveDlg').show();
            }
        }


    </script>


</ui:composition>
</html>
