<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition><!--备件对话框 修改-->
    <p:dialog id="moreAccDialogPriceDlg" class="moreAccDialogPriceDlg" widgetVar="moreAccDialogPriceDlg" modal="true" width="1200"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.PartUpdate}" positionType="absolute"><!--维修工单备件更新-->
        <h:form id="moreAccDialogFormX" >
            <h:panelGroup id="display42">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.PartName}*</label>
                        <p:inputText id="parts" value="#{workOrderMgrSupplierController.itemDetail.parts}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.PartQuantity}*</label>
                        <p:inputNumber  maxValue="999999" decimalPlaces="0"  id="apartsQuantity" value="#{workOrderMgrSupplierController.itemDetail.apartsQuantity}" required="true" requiredMessage="#{msg.PartQuantity} #{msg.ValidationRequire}"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedUnitPriceRMB}*</label>
                        <p:inputNumber  decimalPlaces="4" maxValue="99999999" id="partsPrice" disabled="true"  value="#{workOrderMgrSupplierController.itemDetail.partsPrice}" required="true" requiredMessage="#{msg.PartUnitPriceRMB} #{msg.ValidationRequire}">
                            <p:ajax listener="#{workOrderMgrSupplierController.partsPriceUpdate()}" update="@(.contractPrice)">
                            </p:ajax>
                        </p:inputNumber>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{workOrderMgrSupplierController.itemDetail.approved == null ? false : true}">
                        <img src="#{workOrderMgrSupplierController.itemDetail.detailReviewSignature == null ? '' : fileDownloadService.getImgBase64(workOrderMgrSupplierController.itemDetail.detailReviewSignature)}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.PartType}</label>
                        <p:selectOneMenu value="#{workOrderMgrSupplierController.itemDetail.partsType}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.invoiceNum}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.invoiceNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.InvoicingTime}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.InvoicingTime}" pattern="yyyy/MM/dd" value="#{workOrderMgrSupplierController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.InvoiceProvider}</label>
                        <p:autoComplete id="vendor" dropdown="true" value="#{workOrderMgrSupplierController.supplierName}" scrollHeight="300" forceSelection="false"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}" completeMethod="#{workOrderMgrSupplierController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrSupplierController.onSupplierChange()}"/>
                            <p:ajax listener="#{workOrderMgrSupplierController.onSupplierChange()}" />
                        </p:autoComplete>

                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ContractPriceRMB}*</label>
                        <p:inputNumber  decimalPlaces="4" maxValue="99999999" id="closedPrice"  value="#{workOrderMgrSupplierController.itemDetail.closedPrice}" required="true" requiredMessage="#{msg.ActualPriceRMB} #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ApplyTime}</label>
                        <p:calendar disabled="#{workOrderMgrSupplierController.nochange}"  timeZone="GMT+8" label="#{msg.ApplyTime}" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrSupplierController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedArrivalTime}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrSupplierController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.qualityexpirdate}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.equiptaketime}" pattern="yyyy/MM/dd" value="#{workOrderMgrSupplierController.itemDetail.warrantyDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.assetsDashboardclm2}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.serialNum}"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.contractNo}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.contractNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.Remark}</label>
                        <p:inputTextarea id="area" value="#{workOrderMgrSupplierController.itemDetail.comment}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:column headerText="#{msg.Close2}">
                            <p:selectBooleanButton  disabled="#{workOrderMgrSupplierController.selected.currentStepId==5 or workOrderMgrSupplierController.selected.currentStepId==6 or workOrderMgrSupplierController.selected.currentStepId==7}" value="#{workOrderMgrSupplierController.itemDetail.arrived}" onLabel="#{msg.Arrived}" offLabel="#{msg.NonArrived}">
                                <p:ajax listener="#{workOrderMgrSupplierController.arrivalTimeSet}" event="change"></p:ajax>
                            </p:selectBooleanButton>
                            <p:selectBooleanButton   value="#{workOrderMgrSupplierController.itemDetail.closed}" onLabel="#{msg.Closed2}" offLabel="#{msg.Opened}">
                                <p:ajax listener="#{workOrderMgrSupplierController.orderSet}" event="change"></p:ajax>
                            </p:selectBooleanButton>
                        </p:column>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
<!--                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrSupplierController.updateAccessPrice()}" value="#{msg.Save}" update="woSupplierTab:woMgrSupplierDetailForm woSupplierTab:repairCompleteDialogForm:accessList :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogPriceDlg');"/>-->
                    <p:commandButton immediate="true" actionListener="#{workOrderMgrSupplierController.cancelWorkdetail}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogPriceDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>

    </p:dialog>
    
    <p:dialog id="moreAccDialogViewDlg" class="moreAccDialogViewDlg" widgetVar="moreAccDialogViewDlg" modal="true" width="1200"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.PartView}">
        <h:form id="moreAccDialogViewForm" ><!--备件对话框 查看-->
            <h:panelGroup>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.PartName}*</label>
                        <p:inputText id="partsView" disabled="true" value="#{workOrderMgrSupplierController.itemDetail.parts}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.PartQuantity}*</label>
                        <p:inputNumber  maxValue="999999" decimalPlaces="0" disabled="true" id="apartsQuantityView" value="#{workOrderMgrSupplierController.itemDetail.apartsQuantity}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedUnitPriceRMB}*</label>
                        <p:inputNumber disabled="#{workOrderMgrSupplierController.nochange}" decimalPlaces="4" maxValue="99999999" id="partsPriceView"  value="#{workOrderMgrSupplierController.itemDetail.partsPrice}" required="true" requiredMessage="备件单价(元) #{msg.ValidationRequire}" >
                            <p:ajax listener="#{workOrderMgrSupplierController.partsPriceUpdate()}" update="@(.contractPrice)"/>
                        </p:inputNumber>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{workOrderMgrSupplierController.itemDetail.approved == null ? false : true}">
                        <img src="#{workOrderMgrSupplierController.itemDetail.detailReviewSignature == null ? '' :  fileDownloadService.getImgBase64(workOrderMgrSupplierController.itemDetail.detailReviewSignature)}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.PartType}</label>
                        <p:selectOneMenu value="#{workOrderMgrSupplierController.itemDetail.partsType}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.invoiceNum}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.invoiceNum}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.InvoicingTime}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd" value="#{workOrderMgrSupplierController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.InvoiceProvider}</label>
                        <p:autoComplete id="vendorView" dropdown="true" value="#{workOrderMgrSupplierController.supplierName}" scrollHeight="300" forceSelection="false"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}" completeMethod="#{workOrderMgrSupplierController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrSupplierController.onSupplierChange()}"/>
                            <p:ajax listener="#{workOrderMgrSupplierController.onSupplierChange()}" />
                        </p:autoComplete>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.contractNo}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.contractNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ContractPriceRMB}</label>
                        <p:inputNumber  decimalPlaces="4" maxValue="99999999" id="closedPriceView" class="contractPrice"  value="#{workOrderMgrSupplierController.itemDetail.closedPrice}">
                            <p:ajax listener="#{workOrderMgrSupplierController.closePrcieUpdate()}">
                            </p:ajax>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ApplyTime}</label>
                        <p:calendar disabled="#{workOrderMgrSupplierController.nochange}" timeZone="GMT+8" label="#{msg.ApplyTime}" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrSupplierController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedArrivalTime}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrSupplierController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.qualityexpirdate}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.equiptaketime}" pattern="yyyy/MM/dd" value="#{workOrderMgrSupplierController.itemDetail.warrantyDate}" showOn="button"
                                    readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.assetsDashboardclm2}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.serialNum}"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.Remark}</label>
                        <p:inputTextarea id="areaView" value="#{workOrderMgrSupplierController.itemDetail.comment}"/>
                    </h:panelGroup>
                    <p:column headerText="#{msg.arrival}">
                        <p:selectBooleanButton  disabled="true" value="#{workOrderMgrSupplierController.itemDetail.arrived}" onLabel="#{msg.Arrived}" offLabel="#{msg.NonArrived}">
                        </p:selectBooleanButton>
                        <p:selectBooleanButton disabled="true"  value="#{workOrderMgrSupplierController.itemDetail.closed}" onLabel="#{msg.Closed2}" offLabel="#{msg.Opened}">
                        </p:selectBooleanButton>
                    </p:column>




                </p:panelGrid>

            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
