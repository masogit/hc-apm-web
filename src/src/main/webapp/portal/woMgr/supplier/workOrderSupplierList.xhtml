<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
    	<h:outputScript name="js/commonUtils.js"/>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.WorkOrder}"/>
            </div>

            <div class="ui-g-12 ">
                <p:tabView class="ui-g-12" id="woSupplierTab" dynamic="true" cache="false" activeIndex="#{workOrderTabController.queryTab}" >

                    <p:ajax event="tabChange" listener="#{workOrderMgrSupplierController.onTabChange}"/>
                    <p:tab class="ui-g-12" title="#{msg.InternalWorkorder}" id="inWorkOrder" rendered="#{workOrderTabController.showInOrder and not userContextService.isZtbTenant()}">
                        <ui:include src="woMgrSupplierList.xhtml"/>
                    </p:tab>
                    <p:tab class="ui-g-12" title="工单导入" id="importWorkOrder">
                        <ui:include src="WorkOderImport.xhtml"/>
                    </p:tab>
                </p:tabView>
            </div>
        </div>
        <ui:include src="transferSupplierDialog.xhtml"/>
    </ui:define>
</ui:composition>
