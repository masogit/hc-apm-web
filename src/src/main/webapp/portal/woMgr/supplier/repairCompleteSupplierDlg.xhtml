        <script type="text/javascript">
            function handleValidFields(xhr, status, args) {
                var valid = true;
                var valid1 = true;
                if (args.confirmedUpDate) {
                    $('#woSupplierTab\\:repairCompleteDialogForm\\:confirmedUpDate_input').addClass("ui-state-error");
                    valid = false;
                }
                if (args.caseType) {
                    $('#woSupplierTab\\:repairCompleteDialogForm\\:caseType').addClass("ui-state-error");
                    valid = false;
                }
                if (args.repairResult) {
                    $('#woSupplierTab\\:repairCompleteDialogForm\\:repairResult').addClass("ui-state-error");
                    valid = false;
                }
                if (args.manHours_input) {
                    $('#woSupplierTab\\:repairCompleteDialogForm\\:manHours_input').addClass("ui-state-error");
                    valid = false;
                }
                if(args.approvalMust){
                    valid1 =false;
                }
                if (valid) {
                    handleSubmit(args, 'repairCompleteDialog');
                }
                if(valid1){
                    handleSubmit(args, 'submitCommentsDlg')
                }
            }
        </script>
