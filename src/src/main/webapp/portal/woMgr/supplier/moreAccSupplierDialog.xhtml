<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition> <!--备件对话框 维修-->
    <p:dialog id="moreAccDialogDlg" class="moreAccDialogDlg" widgetVar="moreAccDialogDlg" modal="true" width="1250"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.accessory}">
        <h:form id="moreAccDialogForm" >
            <h:panelGroup id="display42" rendered="#{not empty workOrderMgrSupplierController.selectedWorkOrder}">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{!workOrderMgrSupplierController.isEnableIntegrationWithWorkOrder()}">
                    <h:panelGroup>
                        <label class="label">#{msg.PartName}*</label>
                        <p:inputText id="parts1" value="#{workOrderMgrSupplierController.itemDetail.parts}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.PartQuantity}*</label>
                        <p:inputNumber  maxValue="999999" decimalPlaces="0"  id="apartsQuantity1" value="#{workOrderMgrSupplierController.itemDetail.apartsQuantity}" required="true" requiredMessage="#{msg.PartQuantity} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedUnitPriceRMB}*</label>
                        <p:inputNumber disabled="#{workOrderMgrSupplierController.nochange}" decimalPlaces="4" maxValue="99999999" id="partsPrice1"  value="#{workOrderMgrSupplierController.itemDetail.partsPrice}" required="true" requiredMessage="#{msg.PartUnitPriceRMB} #{msg.ValidationRequire}" >
                            <p:ajax listener="#{workOrderMgrSupplierController.partsPriceUpdate()}" update="@(.contractPrice)" >
                        </p:ajax>

                        </p:inputNumber>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{workOrderMgrSupplierController.itemDetail.approved == null ? false : true}">
                        <img src="#{workOrderMgrSupplierController.itemDetail.detailReviewSignature == null ? '' :  fileDownloadService.getFileUrl(workOrderMgrSupplierController.itemDetail.detailReviewSignature)}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.PartType}</label>
                        <p:selectOneMenu value="#{workOrderMgrSupplierController.itemDetail.partsType}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                     <label class="label">#{msg.invoiceNum}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.invoiceNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.InvoicingTime}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd" value="#{workOrderMgrSupplierController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.InvoiceProvider}</label>
                        <p:autoComplete id="vendor1" dropdown="true" value="#{workOrderMgrSupplierController.selectedObjectMap['supplier']}" scrollHeight="300" forceSelection="true"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}" completeMethod="#{workOrderMgrSupplierController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrSupplierController.onSupplierChange()}"/>
                            <p:ajax listener="#{workOrderMgrSupplierController.onSupplierChange()}" />
                        </p:autoComplete>
                        <p:commandButton id="createSupplierButton1" icon="ui-icon-plus" action="#{workOrderMgrSupplierController.prepareCreateSupplier}" title="#{msg.Create}" process="@this"  update="@(.SupplierEditDlgCls)" oncomplete="PF('SupplierEditDialog').show()"/>

                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.contractNo}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.contractNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ContractPriceRMB}</label>
                        <p:inputNumber  decimalPlaces="4" maxValue="99999999" id="closedPrice1" class="contractPrice"  value="#{workOrderMgrSupplierController.itemDetail.closedPrice}">

                            <p:ajax listener="#{workOrderMgrSupplierController.closePrcieUpdate()}">
                            </p:ajax>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ApplyTime}</label>
                        <p:calendar disabled="#{workOrderMgrSupplierController.nochange}" timeZone="GMT+8" label="#{msg.ApplyTime}" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrSupplierController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedArrivalTime}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrSupplierController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.qualityexpirdate}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.equiptaketime}" pattern="yyyy/MM/dd" value="#{workOrderMgrSupplierController.itemDetail.warrantyDate}" showOn="button"
                                    readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.assetsDashboardclm2}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.serialNum}"/>
                    </h:panelGroup>
                    <p:column headerText="#{msg.arrival}">
                        <p:selectBooleanButton   value="#{workOrderMgrSupplierController.itemDetail.arrived}" onLabel="#{msg.Arrived}" offLabel="#{msg.NonArrived}">
                            <p:ajax listener="#{workOrderMgrSupplierController.arrivalTimeSet}" event="change"></p:ajax>
                        </p:selectBooleanButton>
                        <p:selectBooleanButton   value="#{workOrderMgrSupplierController.itemDetail.closed}" onLabel="#{msg.Closed2}" offLabel="#{msg.Opened}">
                            <p:ajax listener="#{workOrderMgrSupplierController.orderSet}" event="change"></p:ajax>
                        </p:selectBooleanButton>
                    </p:column>
                    <h:panelGroup>
                        <label class="label">#{msg.Remark}</label>
                        <p:inputTextarea id="area1" value="#{workOrderMgrSupplierController.itemDetail.comment}"/>
                    </h:panelGroup>
                </p:panelGrid>
        <!-- ==================================================================启用集成工单时==============================================-->
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{workOrderMgrSupplierController.isEnableIntegrationWithWorkOrder()}">
                    <h:panelGroup>
                        <label class="label">#{msg.PartType}</label>
                        <p:selectOneMenu value="#{workOrderMgrSupplierController.itemDetail.partsType}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                            <p:ajax event="itemSelect"  update="moreAccDialogForm" listener="#{workOrderMgrSupplierController.changeStatus()}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup id="sparePartsName" rendered="#{workOrderMgrSupplierController.statusFlag==1}">
                        <label class="label">#{msg.PartName}*</label>
                        <p:autoComplete id="sparePartName" dropdown="true"
                                        value="#{workOrderMgrSupplierController.partsItem}"
                                        readonly="false"
                                        forceSelection="true"
                                        completeMethod="#{workOrderMgrSupplierController.autosparePartName()}"
                                        var="item" itemLabel="#{item.name}"
                                        itemValue="#{item}"
                                        converter="simplePartsItemConverter">
                            <p:ajax event="itemSelect"
                                    listener="#{workOrderMgrSupplierController.onSparePartsValueChange}"
                                    update="moreAccDialogForm"/>
                        </p:autoComplete>

                    </h:panelGroup>
                    <h:panelGroup  rendered="#{workOrderMgrSupplierController.statusFlag==3}">
                        <label class="label">#{msg.PartName}*</label>
                        <p:inputText id="partsOther" value="#{workOrderMgrSupplierController.itemDetail.parts}"  requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{workOrderMgrSupplierController.statusFlag==2}">
                        <label class="label">#{msg.PartName}*</label>
                        <p:autoComplete id="parts" dropdown="true"
                                        value="#{workOrderMgrSupplierController.partsItem}"
                                        readonly="false" forceSelection="true"
                                        completeMethod="#{workOrderMgrSupplierController.initSparePartsMaster()}"
                                        var="item" itemLabel="#{item.name}"
                                        itemValue="#{item}"
                                        converter="simplePartsItemConverter">
                            <p:ajax event="itemSelect"
                                    listener="#{workOrderMgrSupplierController.onSparePartsMasterValueChange}"
                                    update="moreAccDialogForm"/>
                        </p:autoComplete>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.PartQuantity}*</label>
                        <p:inputNumber  decimalPlaces="0"  id="apartsQuantity" value="#{workOrderMgrSupplierController.itemDetail.apartsQuantity}" required="true" requiredMessage="#{msg.PartQuantity} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup id="remainingStock" rendered="#{workOrderMgrSupplierController.statusFlag==1}">
                        <label class="label">所剩库存</label>
                        <p:inputText id="remainingStock2" name="remainingStock" placeholder="剩余库存"
                                     readonly="true"
                                     value="#{workOrderMgrSupplierController.itemDetail.currentQuantity}"/>
                    </h:panelGroup>
                    <h:panelGroup id="EstimatedUnitPriceRMB">
                        <label class="label">#{msg.EstimatedUnitPriceRMB}*</label>
                        <p:inputNumber disabled="#{workOrderMgrSupplierController.nochange}" decimalPlaces="4" maxValue="99999999" id="partsPrice"  value="#{workOrderMgrSupplierController.itemDetail.partsPrice}" required="true" requiredMessage="#{msg.PartUnitPriceRMB} #{msg.ValidationRequire}" >
                            <p:ajax listener="#{workOrderMgrSupplierController.partsPriceUpdate()}" update="@(.contractPrice)" >
                            </p:ajax>

                        </p:inputNumber>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{workOrderMgrSupplierController.itemDetail.approved == null ? false : true}">
                        <img src="#{workOrderMgrSupplierController.itemDetail.detailReviewSignature == null ? '' :  fileDownloadService.getFileUrl(workOrderMgrSupplierController.itemDetail.detailReviewSignature)}" />
                    </h:panelGroup>

                    <h:panelGroup id="invoiceNum">
                        <label class="label">#{msg.invoiceNum}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.invoiceNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.InvoicingTime}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd" value="#{workOrderMgrSupplierController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.InvoiceProvider}</label>
                        <p:autoComplete id="vendor" dropdown="true" value="#{workOrderMgrSupplierController.selectedObjectMap['supplier']}" scrollHeight="300" forceSelection="true"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}" completeMethod="#{workOrderMgrSupplierController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrSupplierController.onSupplierChange()}"/>
                            <p:ajax listener="#{workOrderMgrSupplierController.onSupplierChange()}" />
                        </p:autoComplete>
                        <p:commandButton id="createSupplierButton" icon="ui-icon-plus" action="#{workOrderMgrSupplierController.prepareCreateSupplier}" title="#{msg.Create}" process="@this"  update="@(.SupplierEditDlgCls)" oncomplete="PF('SupplierEditDialog').show()"/>

                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.contractNo}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.contractNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ContractPriceRMB}</label>
                        <p:inputNumber  decimalPlaces="4" maxValue="99999999" id="closedPrice" class="contractPrice"  value="#{workOrderMgrSupplierController.itemDetail.closedPrice}">

                            <p:ajax listener="#{workOrderMgrSupplierController.closePrcieUpdate()}">
                            </p:ajax>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ApplyTime}</label>
                        <p:calendar disabled="#{workOrderMgrSupplierController.nochange}" timeZone="GMT+8" label="#{msg.ApplyTime}" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrSupplierController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedArrivalTime}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrSupplierController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.qualityexpirdate}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.equiptaketime}" pattern="yyyy/MM/dd" value="#{workOrderMgrSupplierController.itemDetail.warrantyDate}" showOn="button"
                                    readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.assetsDashboardclm2}</label>
                        <p:inputText value="#{workOrderMgrSupplierController.itemDetail.serialNum}"/>
                    </h:panelGroup>
                    <p:column headerText="#{msg.arrival}">
                        <p:selectBooleanButton   value="#{workOrderMgrSupplierController.itemDetail.arrived}" onLabel="#{msg.Arrived}" offLabel="#{msg.NonArrived}">
                            <p:ajax listener="#{workOrderMgrSupplierController.arrivalTimeSet}" event="change"></p:ajax>
                        </p:selectBooleanButton>
                        <p:selectBooleanButton   value="#{workOrderMgrSupplierController.itemDetail.closed}" onLabel="#{msg.Closed2}" offLabel="#{msg.Opened}">
                            <p:ajax listener="#{workOrderMgrSupplierController.orderSet}" event="change"></p:ajax>
                        </p:selectBooleanButton>
                    </p:column>
                    <h:panelGroup>
                        <label class="label">#{msg.Remark}</label>
                        <p:inputTextarea id="area" value="#{workOrderMgrSupplierController.itemDetail.comment}"/>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrSupplierController.addAcessItem}" value="#{msg.Save}" update="woTab:repairCompleteDialogForm:accessList @(.cl3) :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogDlg');"/>
                    <p:commandButton immediate="true" actionListener="#{workOrderMgrSupplierController.cancelWorkdetail}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogDlg');"/>
                    <p:commandButton actionListener="#{workOrderMgrSupplierController.saveAndadd(1)}" rendered="#{workOrderMgrSupplierController.switchTmp}" value="#{msg.SaveAndAdd}" update="woTab:moreAccDialogForm woTab:repairCompleteDialogForm:accessList :growl" icon="ui-icon-check"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
        <ui:include src="createSupplierAccSupplier.xhtml" />
    </p:dialog>
</ui:composition>
</html>
