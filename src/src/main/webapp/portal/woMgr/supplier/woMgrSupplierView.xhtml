<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:composition>
        <div class="ui-g-12 card">

            <h:form id="woMgrSupplierDetailForm">
                <p:fieldset legend="#{msg.RequestWorkorder} (#{fieldMsg.fieldValue('casePriority',workOrderMgrSupplierController.selected.serviceRequest.casePriority)})" rendered="#{not empty workOrderMgrSupplierController.selected}">

                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.assetName}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.assetName}" />
                        </h:panelGroup>


                        <h:panelGroup rendered="#{workOrderMgrSupplierController.selected.assetInfo.mvsEquip eq 1 and (userContextService.loginUser.mvsRoleType eq 1 or userContextService.loginUser.mvsRoleType eq 2) }">
                            <label class="label">#{msg.MVSContractStartDate}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.getMvsContract(workOrderMgrSupplierController.selected.assetInfo.id).contractStartDate}" />

                        </h:panelGroup>
                        <h:panelGroup rendered="#{workOrderMgrSupplierController.selected.assetInfo.mvsEquip eq 1 and (userContextService.loginUser.mvsRoleType eq 1 or userContextService.loginUser.mvsRoleType eq 2) }">
                            <label class="label">#{msg.MVSContractEndDate}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.getMvsContract(workOrderMgrSupplierController.selected.assetInfo.id).contractEndDate}" />
                        </h:panelGroup>


                        <h:panelGroup>
                            <label class="label">#{msg.departNum}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.assetInfo.departNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.srNum}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.srNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.requestorName}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.requestorName}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.requestTime}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.requestTime}" >
                                <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                            </p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.assetLocation}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.assetLocation}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.requestReason}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.requestReason}" style="word-wrap: break-word;"/>
                        </h:panelGroup>
                        <h:panelGroup id="assetstatus" class="updateDownTime">
                            <label class="label">#{msg.status}</label>
                            <p:selectOneRadio id="status" value="#{workOrderMgrSupplierController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}" disabled="#{workOrderMgrSupplierController.currentStatus ne 3}">
                                <p:ajax  listener="#{workOrderMgrSupplierController.onStatusChange()}"  update="assetstatus" />

                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(0, 1)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="true"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(1, 3)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="#{workOrderMgrSupplierController.selected.serviceRequest.status ne 1}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(3, 4)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="#{workOrderMgrSupplierController.selected.serviceRequest.status ne 1 or !assetInfoEditController.hasScrappedAuthority()}"/>

                            </p:selectOneRadio>
                            <p:calendar  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" label="#{msg.confirmedDownTime}" rendered="#{workOrderMgrSupplierController.needConfirmTime}"  id="confirmedDownTime"  value="#{workOrderMgrSupplierController.confirmedDownTime}" showOn="button"
                                        readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.confirmedDownTime} #{msg.ValidationRequire}"/>
                            <p:commandButton value="#{msg.UpdateShutdownTime}" rendered="#{workOrderMgrSupplierController.needConfirmTime}" actionListener="#{workOrderMgrSupplierController.updateDownTime}" process="@(.updateDownTime)" update="assetstatus showDownTime"/>
                        </h:panelGroup>
                        <h:panelGroup id="showDownTime">
                            <label class="label">#{msg.confirmedDownTime}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.confirmedDownTime}" >
                                <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                            </p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.UpTimeExcel}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.confirmedUpTime}" >
                                <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                            </p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.equipmentTaker}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.equipmentTaker}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.PickUpTime}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.takeTime}" >
                                <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                            </p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{workOrderMgrSupplierController.selected.serviceRequest.status eq 3}">
                            <label class="label">#{msg.Cancelor}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.cancelPerson}" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{workOrderMgrSupplierController.selected.serviceRequest.status eq 3}">
                            <label class="label">#{msg.cancelWorkOrderReason}</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.cancelReason}" style="word-wrap: break-word;"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">医院客户姓名</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.customerName}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院客户电话</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.customerTel}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">医院客户职务</label>
                            <p:outputLabel value="#{workOrderMgrSupplierController.selected.serviceRequest.customerPosition}" />
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:dataGrid var="picItem" value="#{workOrderMgrSupplierController.getPicListByBoType('ServiceRequest')}" columns="4" layout="grid"  rendered="#{not empty workOrderMgrSupplierController.getPicListByBoType('ServiceRequest')}">
                        <f:facet name="header">#{msg.RequestImage}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                <p:graphicImage value="#{fileDownloadService.getFile(picItem.objectStorageId)}" stream="false" style="max-width: 100%;height: auto"/>
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <p:dataGrid var="woPicItem" value="#{workOrderMgrSupplierController.getPicListByBoType('WorkOrder')}" columns="4" layout="grid" rendered="#{not empty workOrderMgrSupplierController.getPicListByBoType('WorkOrder')}">
                        <f:facet name="header">#{msg.RepairImage}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                <p:graphicImage value="#{fileDownloadService.getFile(woPicItem.objectStorageId)}" stream="false" style="max-width: 100%;height: auto"/>
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>


                    <p:dataGrid var="woAttachItem" value="#{workOrderMgrSupplierController.attachList}" columns="4" layout="grid" rendered="#{not empty workOrderMgrSupplierController.attachList}">
                        <f:facet name="header">#{msg.RepairAttachment}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                #{woAttachItem.objectName}
                                <p:commandLink value="#{msg.DownloadFile}" ajax="false" actionListener="#{fileDownloadService.downloadFile(woAttachItem.objectStorageId)}" styleClass="p-mr-2"/>
<!--                                <p:link href="#{fileDownloadService.getFileUrl(woAttachItem.objectStorageId)}"> #{msg.DownloadFile}</p:link>-->
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>


                    <p:dataGrid var="audioItem" value="#{workOrderMgrSupplierController.audioList}" columns="2" layout="grid" rendered="#{not empty workOrderMgrSupplierController.audioList}">
                        <f:facet name="header">#{msg.RequestVoice}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                <audio controls="controls">  
                                    <source src="#{fileDownloadService.getFileUrl(audioItem.objectStorageId)}" /> 
                                </audio> 
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <c:forEach items="#{workOrderMgrSupplierController.selectedWorkOrderList}" var="woItem" varStatus="rowIndex" >
                        <p:fieldset legend="#{woItem.id==workOrderMgrSupplierController.selected.id? msg.CurrentWorkorder:msg.WorkOrder}" toggleable="false" >
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                                <h:panelGroup>
                                    <label class="label">#{msg.status}</label>
                                    <p:outputLabel value="#{fieldMsg.fieldValue('woSteps', woItem.currentStepId)}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.totalManHour}</label>
                                    <p:outputLabel value="#{woItem.totalManHour}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.totalPrice}</label>
                                    <p:outputLabel value="#{woItem.totalPrice}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.CheckInTime}</label>
                                    <p:outputLabel value="#{woItem.checkinTime}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.intExtType}</label>
                                    <p:outputLabel value="#{fieldMsg.fieldValue('intExtType', woItem.intExtType)}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.caseType}</label>
                                    <p:outputLabel value="#{workOrderMgrSupplierController.getFaultTypeName(woItem.caseType)}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.patProblems}</label>
                                    <p:outputLabel value="#{woItem.patProblems}" style="word-wrap: break-word;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.patActions}</label>
                                    <p:outputLabel value="#{woItem.patActions}" style="word-wrap: break-word;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.patTests}</label>
                                    <p:outputLabel value="#{woItem.patTests}" style="word-wrap: break-word;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.manHours}</label>
                                    <p:outputLabel value="#{woItem.manHours}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.otherExpense}</label>
                                    <p:outputLabel value="#{woItem.otherExpense}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.ExternalExpenses}</label>
                                    <p:outputLabel value="#{woItem.externalExpense}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.currentPersonName}</label>
                                    <p:outputLabel value="#{woItem.currentStepId ==5 ? woItem.ackName:woItem.currentPersonName}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.feedbackRating}</label>
                                    <p:outputLabel value="#{woItem.feedbackRating}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.feedbackComment}</label>
                                    <p:outputLabel value="#{woItem.feedbackComment}" style="word-wrap: break-word;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.endTime}</label>
                                    <p:outputLabel value="#{woItem.closeTime}">
                                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                                    </p:outputLabel>
                                </h:panelGroup>


                                <h:panelGroup>
                                    <label class="label">#{msg.MaintenanceSubStatus}</label>
                                    <p:outputLabel value="#{fieldMsg.fieldValue('subStatus',woItem.subStatus)}" style="word-wrap: break-word;"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">#{msg.maintenanceValue}</label>
                                    <p:outputLabel value="#{woItem.maintenanceValue}"/>
                                </h:panelGroup>

                            </p:panelGrid>


                            <p:dataTable value="#{workOrderMgrSupplierController.getWOrkOrderStep(woItem.id)}" var="stepItem">
                                <p:column headerText="#{msg.stepName}">
                                    <h:outputText value="#{stepItem.stepName}" />
                                </p:column>
                                <p:column headerText="#{msg.ownerName}">
                                    <h:outputText value="#{stepItem.ownerName}" />
                                </p:column>
                                <p:column headerText="#{msg.startTime}">
                                    <h:outputText value="#{stepItem.startTime}" >
                                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.endTime}">
                                    <h:outputText value="#{stepItem.endTime}" >
                                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.description}">
                                    <h:outputText value="#{stepItem.comments}"  style="word-wrap: break-word;"/>
                                </p:column>
                            </p:dataTable>
                            <br/>

                            <h:panelGroup rendered="#{not empty workOrderMgrSupplierController.getWorkOrderDetail(woItem.id)}">
                                <label class="label">#{msg.UsedPart}</label>
                                <p:dataTable id="x3" class="cl3" value="#{workOrderMgrSupplierController.getWorkOrderDetail(woItem.id)}" var="detailItem">
                                    <p:column headerText="#{msg.accessory}#{msg.Name}">
                                        <h:outputText value="#{detailItem.parts}" />
                                    </p:column>
                                    <p:column headerText="#{msg.accessoryQuantity}">
                                        <h:outputText value="#{detailItem.apartsQuantity}" />
                                    </p:column>
                                    <p:column headerText="#{msg.EstimatedUnitPriceRMB}">
                                        <h:outputText value="#{detailItem.partsPrice}">
                                            <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.ContractPriceRMB}">
                                        <h:outputText value="#{detailItem.closedPrice}">
                                            <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.ApprovalStatus}">
                                        <h:outputText value="#{empty detailItem.approved? msg.Unapproved: detailItem.approved? msg.pass:msg.fail}" />
                                    </p:column>
                                    <p:column headerText="#{msg.PartType}">
                                        <h:outputText value="#{fieldMsg.fieldValue('partsType', detailItem.partsType)}" />
                                    </p:column>
                                    <p:column headerText="#{msg.assetsDashboardclm2}">
                                        <h:outputText value="#{detailItem.serialNum}" />
                                    </p:column>
                                    <p:column headerText="#{msg.invoiceNum}">
                                        <h:outputText value="#{detailItem.invoiceNum}" />
                                    </p:column>
                                    <p:column headerText="#{msg.qualityexpirdate}">
                                        <h:outputText value="#{detailItem.warrantyDate}">
                                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.ApplyTime}">
                                        <h:outputText value="#{detailItem.applyTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.EstimatedArrivalTime}">
                                        <h:outputText value="#{detailItem.estimatedArriveTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.ArrivalConfirmationTime}">
                                        <h:outputText value="#{detailItem.arrivedTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.arrival}">
                                        <h:outputText value="#{detailItem.arrived?msg.Arrived:msg.NonArrived}" />
                                    </p:column>

                                    <p:column headerText="#{msg.operation}" >
                                        <p:commandButton rendered="#{workOrderMgrSupplierController.allowChanged()}" process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" disabled="#{workOrderMgrSupplierController.allowChangedForDisable() or (detailItem.approved==null?'false': not detailItem.approved)}"  actionListener="#{workOrderMgrSupplierController.prepareEditAccDetailonPrice(detailItem.id)}" update="@(.moreAccDialogPriceDlg)" oncomplete="PF('moreAccDialogPriceDlg').show()"/>

                                        <p:commandButton process="@this" icon="ui-icon-search" style="zoom:0.8;" title="#{msg.View}"  actionListener="#{workOrderMgrSupplierController.prepareEditAccDetailonPrice(detailItem.id)}" update="@(.moreAccDialogViewDlg)" oncomplete="PF('moreAccDialogViewDlg').show()"/>
                                    </p:column>

                                </p:dataTable>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{not empty workOrderMgrSupplierController.getWorkOrderCoworker(woItem.id)}">
                                <label class="label">#{msg.CorworkerManhours}</label>
                                <p:dataTable  value="#{workOrderMgrSupplierController.getWorkOrderCoworker(woItem.id)}" var="coWorkerItem" lazy="false" paginator="false"
                                              rowKey="#{coWorkerItem.id}" rows="1000" emptyMessage="#{msg.noRecordFound}" >
                                    <p:column headerText="#{msg.coworker}">
                                        <h:outputText value="#{coWorkerItem.cowokerUserName}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.manHours}">
                                        <h:outputText value="#{coWorkerItem.manHours}" />
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>

                            <p:dataGrid id="partPictureList" var="fileitem" value="#{workOrderMgrSupplierController.getPartPictures(woItem.id)}" columns="5" layout="grid">
                                <f:facet name="header">#{msg.AttachmentUpload}</f:facet>
                                <p:panel  style="text-align:center">
                                    <h:panelGrid columns="1" style="width:100%" >
                                        <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" stream="false" height="80"  width="100"/>
                                    </h:panelGrid>
                                </p:panel>
                            </p:dataGrid>
                            <h:panelGroup >
                                <p:dataList value="#{workOrderMgrSupplierController.getServiceRequestMessageList(woItem.id)}" var="msgItem" rendered="#{not empty workOrderMgrSupplierController.getServiceRequestMessageList(woItem.id)}">
                            <!--#{msgItem.message} #{msgItem.sendTime} #{msgItem.senderUserName}-->
                                    <h:outputText value="#{msgItem.sendTime}" >
                                        <f:convertDateTime pattern="MM/dd HH:mm:ss"/>
                                    </h:outputText>
                                    <h:outputText value="#{msgItem.senderUserName}"  style="padding-left: 10px"/>
                                    <h:outputText value="#{msgItem.message}"  style="padding-left: 10px"/>

                                </p:dataList>

                            </h:panelGroup>


                        </p:fieldset>

                    </c:forEach>

                </p:fieldset>
            </h:form>

        </div>
    </ui:composition>
</html>
