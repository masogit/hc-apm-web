<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition>
        <p:dialog id="approveDialog" widgetVar="approveDialog" modal="true"  resizable="true" draggable="true" width="1000" appendTo="@(body)" header="#{msg.audit}" height="430">
            <h:form id="approveDialogForm" >
                <h:panelGroup id="display3" rendered="#{not empty workOrderMgrSupplierController.selectedWorkOrder}">
                    <p:fieldset legend="#{msg.expensedetail}" >
                        <p:dataTable  id="accessList123" value="#{workOrderMgrSupplierController.getNeedApprovalDetails()}" var="item" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                            <!--<p:column selectionMode="multiple" style="text-align:center;color: #000!important"/>-->
                            <p:column >
                                <p:selectBooleanCheckbox value="#{workOrderMgrSupplierController.selectedMap[item.id]}"  class="selectCheckBox" rendered="#{empty item.approved or !item.approved}">
                                    <p:ajax process="@this" listener="#{workOrderMgrSupplierController.onApprovedDetailsSelected(item.id)}"  update="@this @(.selectCheckBoxHeader)"/>
                                </p:selectBooleanCheckbox>
                                <h:outputText value="#{msg.Approved}"  rendered="#{item.approved}"/>
                                <f:facet name="header"  >
                                    <p:selectBooleanCheckbox id="selectCheckBoxHeader" value="#{workOrderMgrSupplierController.selectedMap['All']}" class="selectCheckBoxHeader">
                                        <p:ajax process="@this" listener="#{workOrderMgrSupplierController.onApprovedDetailsSelected('All')}" update="@this @(.selectCheckBox)"/>
                                    </p:selectBooleanCheckbox>
                                    <!--<h:outputText value="勾选审批" />-->
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.accessory} #{msg.Name}">
                                <h:outputText value="#{item.parts}"/>
                            </p:column>

                            <p:column headerText="#{msg.accessoryQuantity}">
                                <h:outputText value="#{item.apartsQuantity}"/>
                            </p:column>

                            <p:column headerText="#{msg.EstimatedUnitPriceRMB}">
                                <h:outputText value="#{item.partsPrice}">
                                    <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.ContractPriceRMB}">
                                <h:outputText value="#{item.closedPrice}">
                                    <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                </h:outputText>

                            </p:column>
                            <p:column headerText="#{msg.PartType}">
                                <h:outputText value="#{fieldMsg.fieldValue('partsType', item.partsType)}" />
                            </p:column>


                            <p:column headerText="#{msg.assetsDashboardclm2}">
                                <h:outputText value="#{item.serialNum}" />
                            </p:column>
                            <p:column headerText="#{msg.invoiceNum}">
                                <h:outputText value="#{item.invoiceNum}" />
                            </p:column>

                            <p:column headerText="#{msg.qualityexpirdate}">
                                <h:outputText value="#{item.warrantyDate}">
                                    <f:convertDateTime pattern="yyyy-MM-dd"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.EstimatedArrivalTime}">
                                <h:outputText value="#{item.estimatedArriveTime}">
                                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                </h:outputText>
                            </p:column>

                        </p:dataTable>

                    </p:fieldset>
                        <h:panelGroup>
                            <label class="label">#{msg.TotalMaintenanceAmount}</label>

                            <p:inputNumber class="c_repairManCost" disabled="true" minValue="0" maxValue="99999999"  decimalPlaces="4" value="#{workOrderMgrSupplierController.c_repairTotalCost}" />
                        </h:panelGroup>
                    <br/>
                    <br/>
                        <h:panelGroup>
                            <label class="label">#{msg.MaintenanceLaborCost}</label>
                            <p:inputNumber class="c_repairManCost" disabled="true" minValue="0" maxValue="99999999"  decimalPlaces="4" value="#{workOrderMgrSupplierController.c_repairManCost}" />
                        </h:panelGroup>
                    <br/>
                    <br/>
                    <h:panelGroup>
                        <label class="label">#{msg.Remark}</label>
                        <p:inputText id="comment" value="#{workOrderMgrSupplierController.comments}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4" maxlength="100"/>
                    </h:panelGroup>
                    <br/>
                    <br/>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{workOrderMgrSupplierController.approveWorkOrder()}" value="#{msg.ApprovalP}" update="woSupplierTab:woMgrSupplierListForm woSupplierTab:woMgrSupplierDetailForm" icon="ui-icon-check" oncomplete="handleComplete(xhr, status, args);"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrSupplierController.cancel()}" icon="ui-icon-cancel" onclick="PF('approveDialog').hide()"/>
                    </h:panelGroup>

                </h:panelGroup>
            </h:form>
            <script>
                function handleComplete(xhr, status, args) {
                    if (args.needComents) {
                        $('#woSupplierTab\\:approveDialogForm\\:comment').addClass("ui-state-error");
                    } else {
                        handleSubmit(args, 'approveDialog');
                    }
                }
            </script>
        </p:dialog>
    </ui:composition>
</html>
