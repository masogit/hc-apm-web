<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="newWorkorderDlg" widgetVar="newWorkorderDlg" modal="true" width="800"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.newWorkOrder}">
        <h:form id="newWorkorderDlgForm">
            <h:panelGroup id="display" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                    <h:panelGroup id="display43" >
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.intExtType}*</label>
                                <p:selectOneMenu  value="#{workOrderMgrController.selectedWorkOrder.intExtType}" required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('intExtType')}" var="item3" itemLabel="#{item3.value}" itemValue="#{item3.msgKey}"/>

                                </p:selectOneMenu>
                                <label class="label">#{msg.WorkOrderAssignee}*</label>
                                <p:selectOneMenu  value="#{workOrderMgrController.selectedWorkOrder.currentPersonId}" required="true" requiredMessage="#{msg.currentPersonId} #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{workOrderMgrController.getWorkerList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                                </p:selectOneMenu>
                                <br/>
                                <label class="label">#{msg.FaultyDesc}*</label>
                                <p:inputTextarea value="#{workOrderMgrController.comments}" rows="3"  cols="40"  queryDelay="750" minQueryLength="4" required="true" requiredMessage="#{msg.FaultyDesc} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                        <p:dataGrid id="pictureList" var="fileitem" value="#{workOrderMgrController.picList}" columns="5" layout="grid">
                        <f:facet name="header">报修图片</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%" >
                                <p:graphicImage url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/> 
                                <p:commandButton actionListener="#{workOrderMgrController.removeAttachmentById(fileitem.id)}" update="pictureList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>   
                            </h:panelGrid>

                        </p:panel>

                    </p:dataGrid>
                    <p:fileUpload id="type1" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{workOrderMgrController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                  multiple="false"  sizeLimit="10000000"  update="pictureList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>

                        <br/>

                    </h:panelGroup>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.createWorkOrder}" value="提交" update="woTab:woMgrListForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'newWorkorderDlg');"/>
                    <p:commandButton immediate="true" actionListener="#{workOrderMgrController.cancel}" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('newWorkorderDlg').hide()"/>

                </h:panelGroup>
            </h:panelGroup>
        </h:form>


    </p:dialog>

</ui:composition>
</html>
