<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
    	<h:outputScript name="js/commonUtils.js"/>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.WorkOrder}"/>
            </div>

            <div class="ui-g-12 ">
                <p:tabView class="ui-g-12" id="woTab" dynamic="true" cache="false" activeIndex="#{workOrderTabController.queryTab}" >

                   <p:ajax event="tabChange" listener="#{workOrderMgrController.onTabChange}" update="woTab"/>
                    <p:tab class="ui-g-12" title="#{msg.InternalWorkorder}" id="inWorkOrder" rendered="#{workOrderTabController.showInOrder and not userContextService.isZtbTenant()}" disabled="#{workOrderMgrController.viewIng}">
                        <ui:include src="woMgrList.xhtml"/>
                    </p:tab>
                    <p:tab class="ui-g-12" title="MVS工单" id="mvsWorkOrder" rendered="#{userContextService.isYiMaiYangGuangTenant()}" disabled="#{workOrderMgrController.viewIng}">
                        <ui:include src="mvs/woMvsMgrList.xhtml"/>
                    </p:tab>

                    <c:if test="#{!userContextService.isZkbAccount()}">
                        <p:tab class="ui-g-12" title="#{msg.ExternalWorkorder}" id="outWorkOrder" rendered="#{(userContextService.enableDisplayExternalWorkOrder() and userContextService.accessContainsFunctionMenu('REPAIR_EXORDER_VIEW'))}" disabled="#{workOrderMgrController.viewIng}">
                            <ui:include src="woMgrOutList.xhtml"/>
                        </p:tab>
                        <p:tab class="ui-g-12" title="#{msg.ExternalRemoteWorkorder}"  id="outRemoteWorkOrder" rendered="#{userContextService.enableDisplayRemoteWorkOrder() and  userContextService.accessContainsFunctionMenu('REPAIR_REMOTE_ORDER_VIEW')}" disabled="#{workOrderMgrController.viewIng}">
                            <ui:include src="woMgrOutRemoteList.xhtml"/>
                        </p:tab>
                    </c:if>
                    <c:if test="#{userContextService.isZkbAccount()}">
                        <p:tab class="ui-g-12" title="#{msg.ExternalWorkorder}" id="outZkbWorkOrder" rendered="#{ userContextService.isZkbAccount()}"  >
                            <ui:include src="woMgrZkbOutList.xhtml"/>
                        </p:tab>
                        <p:tab class="ui-g-12" title="#{msg.ExternalRemoteWorkorder}"  id="outRemoteWorkOrder" rendered="#{not userContextService.isAccountEndUser() and userContextService.isLocale() or userContextService.isZtbTenant() or userContextService.isHaveIbDeviceUser()  or userContextService.accessContainsFunctionMenu('REPAIR_REMOTE_ORDER_VIEW')}" disabled="#{workOrderMgrController.viewIng}">
                            <ui:include src="woMgrZkbOutRemoteList.xhtml"/>
                        </p:tab>
                    </c:if>
                    <p:tab class="ui-g-12" title="全部工单" id="inWorkOrderAll"  >
                        <ui:include src="woMgrUnifiedList.xhtml"/>
                    </p:tab>
                </p:tabView>
            </div>
        </div>
        <ui:include src="transferDialog.xhtml"/>
        <ui:include src="/portal/preview/view.xhtml"/>

    </ui:define>
</ui:composition>
