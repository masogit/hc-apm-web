<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
    	<h:outputScript name="js/commonUtils.js"/>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.WorkOrder}"/>
            </div>

            <div class="ui-g-12 ">
                <p:tabView class="ui-g-12" id="woTab" dynamic="true" cache="false" activeIndex="#{workOrderTabController.queryTab}">
                   <!-- <p:ajax event="tabChange"/>-->
                    <p:tab class="ui-g-12" title="#{msg.InternalWorkorder}" id="inWorkOrder" rendered="#{workOrderTabController.showInOrder}">
                        <ui:include src="woMgrList.xhtml"/>
                    </p:tab>
                    <p:tab class="ui-g-12" title="#{msg.ExternalWorkorder}" id="outWorkOrder" rendered="#{not userContextService.isAccountEndUser()}">
                        <ui:include src="woMgrOutList.xhtml"/>
                    </p:tab>
                    <p:tab class="ui-g-12" title="#{msg.ExternalRemoteWorkorder}"  id="outRemoteWorkOrder" rendered="#{not userContextService.isAccountEndUser()}">
                        <ui:include src="woMgrOutRemoteList.xhtml"/>
                    </p:tab>
                </p:tabView>
            </div>
        </div>
        <ui:include src="transferDialog.xhtml"/>
    </ui:define>
</ui:composition>
