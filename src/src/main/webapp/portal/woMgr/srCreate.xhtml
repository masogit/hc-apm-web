<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:composition>

        <p:dialog id="createSRDialog" widgetVar="createSRDialog" modal="true"  resizable="false" draggable="true" width="80%" height="450" appendTo="@(body)"  header="新增报修" >

            <h:form id="ServiceRequestCreateForm">
                <p:fieldset legend="#{msg.Create}#{msg.WorkOrder}" rendered="#{not empty workOrderMgrController.newServiceRequest}">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                        <h:panelGroup >
                            <label class="label">#{msg.assetName}*</label>
                            <p:inputText id="assetName" readonly="true" value="#{workOrderMgrController.selectedAsset.name}" placeholder="#{msg.noAssetSelected}" required="true" requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>
                            <p:commandButton class="popupIconButton" actionListener="#{selectAssetController.prepareDialogCallback(workOrderMgrController, 'woTab:ServiceRequestCreateForm')}" process="@this" icon="ui-icon-arrow-drop-down" update="woTab:selectAssetDlg assetstatus lName" oncomplete="PF('varSelectAssetDlg').show();"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">当前位置</label>
                            <p:inputText id="lName" value="#{workOrderMgrController.locationName}" maxlength="256" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.requestorName}</label>
                            <p:outputLabel value="#{workOrderMgrController.newServiceRequest.requestorName}" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.casePriority}*</label>
                            <p:selectOneMenu value="#{workOrderMgrController.newServiceRequest.casePriority}" >
                                <f:selectItems value="#{fieldMsg.getFieldValueList('casePriority')}" var="item"
                                               itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>


                        <h:panelGroup>
                            <label class="label">#{msg.requestTime}</label>
                            <p:outputLabel value="#{workOrderMgrController.newServiceRequest.requestTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.requestReason}*</label>
                            <p:inputTextarea value="#{workOrderMgrController.newServiceRequest.requestReason}" maxlength="256" />
                            <p:outputLabel value="#{workOrderMgrController.newServiceRequest.requestReason}" />
                        </h:panelGroup>
                        <h:panelGroup id="assetstatus">
                            <label class="label">#{msg.status}</label>
                            <p:selectOneRadio id="status" value="#{workOrderMgrController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                                <p:ajax  listener="#{workOrderMgrController.onStatusChange()}"  update="assetstatus" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(1, 3)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>

                            </p:selectOneRadio>
                            <p:calendar timeZone="GMT+8" label="#{msg.confirmedDownTime}" rendered="#{workOrderMgrController.needConfirmTime}"  id="confirmedDownTime" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrController.newServiceRequest.confirmedDownTime}" showOn="button" 
                                        readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.confirmedDownTime} #{msg.ValidationRequire}"/>
                        </h:panelGroup>


                    </p:panelGrid>
                    
                    <p:dataGrid id="pictureList" var="fileitem" value="#{workOrderMgrController.picList}" columns="5" layout="grid">
                        <f:facet name="header">报修图片</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%" >
                                <p:graphicImage url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/> 
                                <p:commandButton actionListener="#{workOrderMgrController.removeAttachmentById(fileitem.id)}" update="pictureList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>   
                            </h:panelGrid>

                        </p:panel>

                    </p:dataGrid>
                    <p:fileUpload id="type1" fileUploadListener="#{workOrderMgrController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" 
                                  multiple="false"  sizeLimit="10000000"  update="pictureList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>

                    <h:panelGroup >
                        <p:commandButton value="#{msg.Save}" icon="ui-icon-check" actionListener="#{workOrderMgrController.saveServiceRequest()}" disabled="#{!workOrderMgrController.canCreateSr()}" validateClient="true" update="woTab:woMgrListForm :growl" style="float:left" oncomplete="handleSubmit(args, 'createSRDialog');"/>

                        <p:commandButton value="#{msg.Return}" icon="ui-icon-arrow-back" actionListener="#{workOrderMgrController.cancel()}" immediate="true"  update="woTab:ServiceRequestCreateForm :growl" style="float:left" oncomplete="handleSubmit(args, 'createSRDialog');"/>
                    </h:panelGroup>
                    
                     <h:panelGroup >
                       <h:outputText style="color:red; font-size:18px" value="该设备可以外修,报修电话:4008128188" rendered="#{!workOrderMgrController.canCreateSr() or (workOrderMgrController.selectedAsset.ibStatus eq 1 and workOrderMgrController.selectedAsset.repairForm eq 3)}"/>
                    </h:panelGroup>
                </p:fieldset>
            </h:form>

            <ui:include src="/portal/asset/selectAssetDialog.xhtml"/>
        </p:dialog>

    </ui:composition>
</html>
