<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
            <div class="ui-g-12 card">
                <!--<p:messages autoUpdate="true" closable="true" showDetail="false"/>-->

                <h:form id="woMgrOutListForm">

                    <p:dataTable id="datalist" value="#{assetLifecycleEventController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{assetLifecycleEventController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="10" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="10,20,30,90">

                        <p:ajax event="rowSelect" listener="#{assetLifecycleEventController.onSelectAssetLifecycleEvent}"/>
                        <p:ajax event="filter" listener="#{assetLifecycleEventController.onFilter}"/>

                      <p:column headerText="#{msg.assetName}" sortBy="#{item.assetName}" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>

                        <p:column headerText="外部工单号" sortBy="#{item.eventUid}" filterBy="#{item.eventUid}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.eventUid}"/>
                        </p:column>
                        <p:column headerText="更新时间" sortBy="#{item.createTime}" filterBy="#{item.createTime}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.createTime}"/>
                        </p:column>
                              <p:column headerText="状态">
                                  <h:outputText value="#{assetLifecycleEventController.getMsStatus(item)}"/>
                              </p:column>
                        <!--
                                              <p:column headerText="请求编号" sortBy="#{item.srNum}" filterBy="#{item.srNum}" filterMatchMode="LIKE">
                                                  <h:outputText value="#{item.srNum}"/>
                                              </p:column>-->
                    </p:dataTable>
                </h:form>

            </div>




        <script>
            window.onload = function () {
                var requestAssetUid = "#{workOrderMgrController.requestAssetUid}";
                var isActive = "#{userContextService.isActive()}";
                if(isActive == '1'){
                    PF('ActiveDlg').show();
                }
            }
        </script>


</ui:composition>
</html>
