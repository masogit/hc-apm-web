<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:composition>
        <div class="ui-g-12 card">

            <h:form id="woMgrDetailForm">
                <p:fieldset legend="报修单 (#{fieldMsg.fieldValue('casePriority',workOrderMgrController.selected.serviceRequest.casePriority)})" rendered="#{not empty workOrderMgrController.selected}">

                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.assetName}</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.assetName}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.departNum}</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.assetInfo.departNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.srNum}</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.srNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.requestorName}</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.requestorName}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.requestTime}</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.requestTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">当前位置</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.assetLocation}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.requestReason}</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.requestReason}" style="word-wrap: break-word;"/>
                        </h:panelGroup>
                        <h:panelGroup id="assetstatus" class="updateDownTime">
                            <label class="label">#{msg.status}</label>
                            <p:selectOneRadio id="status" value="#{workOrderMgrController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}" disabled="#{workOrderMgrController.currentStatus ne 3}">
                                <p:ajax  listener="#{workOrderMgrController.onStatusChange()}"  update="assetstatus" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(0, 1)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="true"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(1, 3)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="#{workOrderMgrController.selected.serviceRequest.status ne 1}"/>

                            </p:selectOneRadio>
                            <p:calendar timeZone="GMT+8" label="#{msg.confirmedDownTime}" rendered="#{workOrderMgrController.needConfirmTime}"  id="confirmedDownTime" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrController.confirmedDownTime}" showOn="button" 
                                        readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.confirmedDownTime} #{msg.ValidationRequire}"/>
                            <p:commandButton value="更新停机时间" rendered="#{workOrderMgrController.needConfirmTime}" actionListener="#{workOrderMgrController.updateDownTime}" process="@(.updateDownTime)" update="assetstatus showDownTime"/>
                        </h:panelGroup>
                        <h:panelGroup id="showDownTime">
                            <label class="label">#{msg.confirmedDownTime}</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.confirmedDownTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">开机时间</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.confirmedUpTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.equipmentTaker}</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.equipmentTaker}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">取件时间</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.takeTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{workOrderMgrController.selected.serviceRequest.status eq 3}">
                            <label class="label">取消人</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.cancelPerson}" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{workOrderMgrController.selected.serviceRequest.status eq 3}">
                            <label class="label">取消原因</label>
                            <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.cancelReason}" style="word-wrap: break-word;"/>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:dataGrid var="picItem" value="#{workOrderMgrController.getPicListByBoType('ServiceRequest')}" columns="4" layout="grid"  rendered="#{not empty workOrderMgrController.getPicListByBoType('ServiceRequest')}">
                        <f:facet name="header">报修图片</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                <p:graphicImage url="#{fileDownloadService.getFileUrl(picItem.objectStorageId)}"   style="max-width: 100%;height: auto"/> 
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <p:dataGrid var="woPicItem" value="#{workOrderMgrController.getPicListByBoType('WorkOrder')}" columns="4" layout="grid" rendered="#{not empty workOrderMgrController.getPicListByBoType('WorkOrder')}">
                        <f:facet name="header">维修图片</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                <p:graphicImage url="#{fileDownloadService.getFileUrl(woPicItem.objectStorageId)}"   style="max-width: 100%;height: auto"/> 
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>


                    <p:dataGrid var="woAttachItem" value="#{workOrderMgrController.attachList}" columns="4" layout="grid" rendered="#{not empty workOrderMgrController.attachList}">
                        <f:facet name="header">维修附件</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                #{woAttachItem.objectName}
                                <p:link href="#{fileDownloadService.getFileUrl(woAttachItem.objectStorageId)}"> 下载文件</p:link>
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>


                    <p:dataGrid var="audioItem" value="#{workOrderMgrController.audioList}" columns="2" layout="grid" rendered="#{not empty workOrderMgrController.audioList}">
                        <f:facet name="header">报修语音</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                <audio controls="controls">  
                                    <source src="#{fileDownloadService.getFileUrl(audioItem.objectStorageId)}" /> 
                                </audio> 
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <c:forEach items="#{workOrderMgrController.selectedWorkOrderList}" var="woItem" varStatus="rowIndex" >
                        <p:fieldset legend="#{woItem.id==workOrderMgrController.selected.id? '当前工单':msg.WorkOrder}" toggleable="false" >
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                                <h:panelGroup>
                                    <label class="label">#{msg.status}</label>
                                    <p:outputLabel value="#{fieldMsg.fieldValue('woSteps', woItem.currentStepId)}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.totalManHour}</label>
                                    <p:outputLabel value="#{woItem.totalManHour}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.totalPrice}</label>
                                    <p:outputLabel value="#{woItem.totalPrice}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">签到时间</label>
                                    <p:outputLabel value="#{woItem.checkinTime}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.intExtType}</label>
                                    <p:outputLabel value="#{fieldMsg.fieldValue('intExtType', woItem.intExtType)}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.caseType}</label>
                                    <p:outputLabel value="#{workOrderMgrController.getFaultTypeName(woItem.caseType)}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.patProblems}</label>
                                    <p:outputLabel value="#{woItem.patProblems}" style="word-wrap: break-word;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.patActions}</label>
                                    <p:outputLabel value="#{woItem.patActions}" style="word-wrap: break-word;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.patTests}</label>
                                    <p:outputLabel value="#{woItem.patTests}" style="word-wrap: break-word;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.manHours}</label>
                                    <p:outputLabel value="#{woItem.manHours}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.otherExpense}</label>
                                    <p:outputLabel value="#{woItem.otherExpense}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">外部费用</label>
                                    <p:outputLabel value="#{woItem.externalExpense}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.currentPersonName}</label>
                                    <p:outputLabel value="#{woItem.currentPersonName}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.feedbackRating}</label>
                                    <p:outputLabel value="#{woItem.feedbackRating}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.feedbackComment}</label>
                                    <p:outputLabel value="#{woItem.feedbackComment}" style="word-wrap: break-word;"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.endTime}</label>
                                    <p:outputLabel value="#{woItem.closeTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                                    </p:outputLabel>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">#{msg.maintenanceValue}</label>
                                    <p:outputLabel value="#{woItem.maintenanceValue}"/>
                                </h:panelGroup>

                            </p:panelGrid>


                            <p:dataTable value="#{workOrderMgrController.getWOrkOrderStep(woItem.id)}" var="stepItem">
                                <p:column headerText="#{msg.stepName}">
                                    <h:outputText value="#{stepItem.stepName}" />
                                </p:column>
                                <p:column headerText="#{msg.ownerName}">
                                    <h:outputText value="#{stepItem.ownerName}" />
                                </p:column>
                                <p:column headerText="#{msg.startTime}">
                                    <h:outputText value="#{stepItem.startTime}" >
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.endTime}">
                                    <h:outputText value="#{stepItem.endTime}" >
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.description}">
                                    <h:outputText value="#{stepItem.comments}"  style="word-wrap: break-word;"/>
                                </p:column>
                            </p:dataTable>
                            <br/>

                            <h:panelGroup rendered="#{not empty workOrderMgrController.getWorkOrderDetail(woItem.id)}">
                                <label class="label">使用的备件</label>
                                <p:dataTable value="#{workOrderMgrController.getWorkOrderDetail(woItem.id)}" var="detailItem"  >
                                    <p:column headerText="#{msg.accessory}">
                                        <h:outputText value="#{detailItem.parts}" />
                                    </p:column>
                                    <p:column headerText="#{msg.accessoryQuantity}">
                                        <h:outputText value="#{detailItem.apartsQuantity}" />
                                    </p:column>
                                    <p:column headerText="#{msg.accessoryPrice}">
                                        <h:outputText value="#{detailItem.partsPrice}">
                                            <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="审核状态">
                                        <h:outputText value="#{empty detailItem.approved? '未审核': detailItem.approved? '通过':'不通过'}" />
                                    </p:column>
                                    <p:column headerText="类型">
                                        <h:outputText value="#{fieldMsg.fieldValue('partsType', detailItem.partsType)}" />
                                    </p:column>
                                    <p:column headerText="序列号">
                                        <h:outputText value="#{detailItem.serialNum}" />
                                    </p:column>
                                    <p:column headerText="发票号">
                                        <h:outputText value="#{detailItem.invoiceNum}" />
                                    </p:column>
                                    <p:column headerText="质保期">
                                        <h:outputText value="#{detailItem.warrantyDate}">
                                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="申请时间">
                                        <h:outputText value="#{detailItem.applyTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="预计到达时间">
                                        <h:outputText value="#{detailItem.estimatedArriveTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="到货确认时间">
                                        <h:outputText value="#{detailItem.arrivedTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="到货">
                                        <h:outputText value="#{detailItem.arrived?'已到货':'未到货'}" />
                                    </p:column>
                                    <p:column headerText="实际价格(元)">
                                        <h:outputText value="#{detailItem.closedPrice}">
                                            <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="操作" rendered="#{userContextService.hasAnyRole('AssetHead,AssetStaff')}">
                                        <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" disabled="#{detailItem.approved==null?'false': not detailItem.approved}"  actionListener="#{workOrderMgrController.prepareEditAccDetailonPrice(detailItem.id)}" update="@(.moreAccDialogPriceDlg)" oncomplete="PF('moreAccDialogPriceDlg').show()"/>
                                    </p:column>

                                </p:dataTable>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{not empty workOrderMgrController.getWorkOrderCoworker(woItem.id)}">
                                <label class="label">协作者工时</label>
                                <p:dataTable  value="#{workOrderMgrController.getWorkOrderCoworker(woItem.id)}" var="coWorkerItem" lazy="false" paginator="false"
                                              rowKey="#{coWorkerItem.id}" rows="1000" emptyMessage="#{msg.noRecordFound}" >
                                    <p:column headerText="#{msg.coworker}">
                                        <h:outputText value="#{coWorkerItem.cowokerUserName}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.manHours}">
                                        <h:outputText value="#{coWorkerItem.manHours}" />
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:dataList value="#{workOrderMgrController.getServiceRequestMessageList(woItem.id)}" var="msgItem" rendered="#{not empty workOrderMgrController.getServiceRequestMessageList(woItem.id)}">
                            <!--#{msgItem.message} #{msgItem.sendTime} #{msgItem.senderUserName}-->
                                    <h:outputText value="#{msgItem.sendTime}" >
                                        <f:convertDateTime pattern="MM/dd HH:mm:ss"/>
                                    </h:outputText>
                                    <h:outputText value="#{msgItem.senderUserName}"  style="padding-left: 10px"/>
                                    <h:outputText value="#{msgItem.message}"  style="padding-left: 10px"/>

                                </p:dataList>

                            </h:panelGroup>


                        </p:fieldset>

                    </c:forEach>

                </p:fieldset>
            </h:form>

        </div>
    </ui:composition>
</html>
