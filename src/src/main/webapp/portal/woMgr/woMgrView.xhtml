<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <script type="text/javascript" src="#{request.contextPath}/portal/js/viewer.min.js"></script>
    <link rel="stylesheet" href="#{request.contextPath}/portal/css/viewer.min.css"/>
    <div class="ui-g-12 card">
        <h:form id="woMgrDetailForm">
            <ui:include src="woMgrViewFields.xhtml"></ui:include>
        </h:form>
        <p:dialog id="msgAddDlg" widgetVar="msgAddDlg"  modal="true" resizable="true" draggable="true" appendTo="@(body)"   height="150" width="280" header="#{msg.addMessage}">
            <h:form id="msgAddForm" >
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.latestMessages}*</label>
                        <p:inputTextarea  value="#{workOrderMgrController.newMessage}" cols="30" required="true" maxlength="255"/>
                    </h:panelGroup>
                </p:panelGrid>
                <p:commandButton  validateClient="true" immediate="false" actionListener="#{workOrderMgrController.saveMsg()}" value="#{msg.ok}"  icon="ui-icon-check" update="woTab:woMgrDetailForm" oncomplete="PF('msgAddDlg').hide();"/>
                <p:commandButton  validateClient="false" immediate="true"  value="#{msg.cancel}"  icon="ui-icon-check" oncomplete="PF('msgAddDlg').hide()"/>
            </h:form>
        </p:dialog>
    </div>
    <style type="text/css">
        .header1  thead{
            display: none!important;
        }
    </style>
    <script type="text/javascript">
        function handlePreview(args, dialog) {
            debugger;
            var jqDialog = jQuery('#' + dialog);
            if (args.validationFailed) {
                PF(dialog).hide();
            } else {
                PF(dialog).show();
            }
        }
    </script>
</ui:composition>
</html>
