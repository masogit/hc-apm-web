<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog class="repairCompleteDialog" id="repairCompleteDialog" widgetVar="repairCompleteDialog" modal="true" height="400" width="1000"  resizable="false" draggable="true" appendTo="@(body)" header="#{msg.workcomplete}">
            <h:form id="repairCompleteDialogForm" class="tform">
                <h:panelGroup  id="display5" style="height:500px" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">


                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.recoveryTime}*</label>
                            <p:calendar timeZone="GMT+8" id="confirmedUpDate" pattern="yyyy/MM/dd HH:mm:ss" mask="true" value="#{workOrderMgrController.confirmedUpDate}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="false" requiredMessage="#{msg.recoveryTime} #{msg.ValidationRequire}"></p:calendar>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.caseType}*</label>
                            <p:selectOneMenu id="caseType" value="#{workOrderMgrController.selectedWorkOrder.caseType}" required="false" requiredMessage="#{msg.caseType} #{msg.ValidationRequire}">
                               <!-- <f:selectItem itemLabel="#{msg.selectOneMessage}"/>-->

                                <f:selectItems value="#{fieldMsg.getFieldValueList('faultType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.RepairResult}*</label>
                            <p:selectOneMenu id="repairResult"  value="#{workOrderMgrController.selectedWorkOrder.repairResult}" required="false" requiredMessage="#{msg.RepairResult} #{msg.ValidationRequire}">
                                <p:ajax listener="#{workOrderMgrController.repairResultSet()}" update="@(.x0)"/>

                                <f:selectItems value="#{fieldMsg.getFieldValueList('repairResult')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>


                        <h:panelGroup>
                            <label class="label">#{msg.MaintenanceSubStatus}</label>
                            <p:selectOneMenu id="subStatus"  value="#{workOrderMgrController.selectedWorkOrder.subStatus}" required="false" requiredMessage="#{msg.MaintenanceSubStatus} #{msg.ValidationRequire}">
                                <p:ajax   listener="#{workOrderMgrController.selectSubstatus()}" update="@(.tform)"/>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('subStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>


                        </h:panelGroup>
                        <h:panelGroup  rendered="#{workOrderMgrController.displayTime}">
                            <label class="label">#{msg.startTime}</label>
                            <p:calendar timeZone="GMT+8" label="#{msg.StartTime}" pattern="yyyy/MM/dd" value="#{workOrderMgrController.statusStartTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup  rendered="#{workOrderMgrController.displayTime}">
                            <label class="label">#{msg.endTime}</label>
                            <p:calendar timeZone="GMT+8" label="#{msg.EndTime}" pattern="yyyy/MM/dd" value="#{workOrderMgrController.statusCloseTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>

                    </p:panelGrid>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup id="assetstatus">
                            <label class="label">#{msg.status}</label>
                            <p:selectOneRadio class="x0" id="status" value="#{workOrderMgrController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                                <p:ajax  listener="#{workOrderMgrController.onStatusChange()}"  update="assetstatus" />
                                <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(0).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(0).msgKey}" />
                                <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(1).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(1).msgKey}" itemDisabled="true"/>
                                <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(2).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(2).msgKey}" />
                                <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(3).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(3).msgKey}" />

                            </p:selectOneRadio>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.patProblems}</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patProblems}" rows="3"  cols="40"  maxlength="500"   />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.patActions}</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patActions}" rows="3"  cols="40"  maxlength="500"  />
                        </h:panelGroup>
                        <h:panelGroup>

                            <label class="label">#{msg.patTests}</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patTests}" rows="3"  cols="40"   maxlength="500" />
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:dataGrid id="pictureList" class="pictureListCls" var="fileitem" value="#{workOrderMgrController.picList}" columns="7" layout="grid">
                        <f:facet name="header">#{msg.addPic}</f:facet><!--增加图片-->
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%" >
                                <p:graphicImage url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/> 
                                <p:commandButton actionListener="#{workOrderMgrController.removeAttachmentById(fileitem.id)}" update="pictureList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>   
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>

                    <p:fileUpload id="type1" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{workOrderMgrController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false"  sizeLimit="10000000"  update="pictureList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>



                    <p:dataGrid id="attachList" var="fileitem" value="#{workOrderMgrController.attachList}" columns="7" layout="grid">
                        <f:facet name="header">#{msg.AddDocument}</f:facet>
                            <h:panelGrid columns="1" style="width:100%" >
                                #{fileitem.objectName}
                                <p:commandButton actionListener="#{workOrderMgrController.removeAttachmentByIdPDF(fileitem.id)}" update="attachList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </h:panelGrid>
                       <!-- </p:panel>-->
                    </p:dataGrid>
                    <p:fileUpload id="type2" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{workOrderMgrController.handleFileUploadPDF}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false"  sizeLimit="10000000"  update="attachList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>

                    <p:fieldset legend="#{msg.expensedetail}" ><!--费用明细-->
                        <p:panelGrid columns="3" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup >
                                <label class="label">#{workOrderMgrController.getManHourShow()}</label>

                                <p:inputNumber id="manHours_input" maxValue="999" value="#{workOrderMgrController.selectedWorkOrder.manHours}"  required="false" requiredMessage="#{msg.manhours} #{msg.ValidationRequire}">
                                    <!--<f:validateDoubleRange minimum="0.01"/>-->
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.otherExpense}</label><!--其它费用-->
                                <p:inputNumber minValue="0" maxValue="99999999"  decimalPlaces="4" value="#{workOrderMgrController.selectedWorkOrder.otherExpense}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.ExternalExpenses}</label><!--外部费用-->
                                <p:inputNumber  minValue="0"  maxValue="99999999"  decimalPlaces="4" value="#{workOrderMgrController.selectedWorkOrder.externalExpense}">
                                </p:inputNumber>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.addAcce}</label><!--增加备件-->
                                <p:dataTable id="accessList" class="accessList" value="#{workOrderMgrController.accessoryList}" var="item" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.PartName}">
                                        <h:outputText value="#{item.parts}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.accessoryQuantity}">
                                        <h:outputText value="#{item.apartsQuantity}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.EstimatedUnitPriceRMB}">
                                        <h:outputText value="#{item.partsPrice}">
                                            <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.ContractPriceRMB}">
                                        <h:outputText value="#{item.closedPrice}">
                                            <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                        </h:outputText>

                                    </p:column>
                                    <p:column headerText="#{msg.PartType}">
                                        <h:outputText value="#{fieldMsg.fieldValue('partsType', item.partsType)}" />
                                    </p:column>
                                    <p:column headerText="#{msg.assetsDashboardclm2}">
                                        <h:outputText value="#{item.serialNum}" />
                                    </p:column>
                                    <p:column headerText="#{msg.invoiceNum}">
                                        <h:outputText value="#{item.invoiceNum}" />
                                    </p:column>
                                    <p:column headerText="#{msg.qualityexpirdate}">
                                        <h:outputText value="#{item.warrantyDate}">
                                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.EstimatedArrivalTime}">
                                        <h:outputText value="#{item.estimatedArriveTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>

                                    <p:column headerText="#{msg.ArrivalConfirmationTime}">
                                        <h:outputText value="#{item.arrivedTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>

                                    <p:column headerText="#{msg.arrival}">
                                        <h:outputText value="#{item.arrived?msg.Arrived:msg.NonArrived}" rendered="#{item.id ne '000'}" class="arrivalItem"/>
                                    </p:column>

                                    <p:column headerText="#{msg.Actions}"><!--操作-->
                                        <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{workOrderMgrController.prepareEditAccDetail('new')}" update="@(.moreAccDialogDlg)" oncomplete="PF('moreAccDialogDlg').show()" rendered="#{item.id eq '000'}"/>
                                        <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{workOrderMgrController.prepareEditAccDetail(item)}" update="@(.moreAccDialogDlg)" oncomplete="PF('moreAccDialogDlg').show()" rendered="#{item.id ne '000'}" />
                                        <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{workOrderMgrController.deleteWoDetail(item.id,1)}" update="@(.accessList)" rendered="#{item.id ne '000' and ( empty item.approved? true:not item.approved)}">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                        </p:commandButton>
                                        <h:outputText value="#{msg.Approved2}" rendered="#{item.id ne '000' and ( empty item.approved? false: item.approved)}" />
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.addworker}</label>
                                <p:dataTable id="coworkerList" class="coworkerList" value="#{workOrderMgrController.coWorkerList}" var="item" widgetVar="coworkerDataList" lazy="false" paginator="false"
                                             rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.coworker}">
                                        <h:outputText value="#{item.cowokerUserName}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.manHours}">
                                        <h:outputText value="#{item.manHours}" />
                                    </p:column>
                                    <p:column headerText="#{msg.Actions}">
                                        <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{workOrderMgrController.prepareEditCoWorkerDetail('new')}" update="@(.coworkerDlg)" oncomplete="PF('coworkerDlg').show()" rendered="#{item.id eq '000'}"/>
                                        <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{workOrderMgrController.prepareEditCoWorkerDetail(item.id)}" update="@(.coworkerDlg)" oncomplete="PF('coworkerDlg').show()" rendered="#{item.id ne '000'}" />
                                        <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{workOrderMgrController.deleteWoDetail(item.id,2)}" update="@(.coworkerList)" rendered="#{item.id ne '000'}">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>
                        </p:panelGrid>

                      <!--  <h:panelGroup>
                            <label class="label">验收人*</label>
                            <p:selectOneMenu  value="#{workOrderMgrController.assigneeId}" required="true" requiredMessage="验收人 #{msg.ValidationRequire}">
                                <f:selectItems value="#{workOrderMgrController.acker}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>-->

                        <h:panelGroup>
                            <label class="label">#{msg.AcknowledgedBy}*</label>
                            <p:autoComplete id="ackerName" converter="userAccountConverter" value="#{workOrderMgrController.ua1}" dropdown="true" forceSelection="true" requiredMessage="#{msg.AcknowledgedBy}#{msg.ValidationRequire}"  var="t" itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{workOrderMgrController.completeAckList}">
                               <!-- <p:ajax event="itemSelect" listener="#{workOrderMgrController.test}" process="@this" />
                                <p:ajax listener="#{workOrderMgrController.test}" process="@this" />-->
                                <p:column>
                                    <h:outputText value="#{t.name}"/>
                                </p:column>

                            </p:autoComplete>
                        </h:panelGroup>
                    </p:fieldset>
                    <!--维修完成 转单 新建工单-->
                    <h:panelGroup>
                        <p:commandButton validateClient="true" immediate="false" actionListener="#{workOrderMgrController.saveRepairWorkOrder()}" value="#{msg.save}" update=":growl woTab:woMgrListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'repairCompleteDialog');"/>
                        <p:commandButton validateClient="true" immediate="false" actionListener="#{workOrderMgrController.repairWorkOrder()}" value="#{msg.workcomplete}" update=":growl woTab:woMgrListForm:datalist" icon="ui-icon-check" oncomplete="handleValidFields(xhr, status, args);"/>
                        <p:commandButton validateClient="false" immediate="true" onclick="PF('submitCommentsDlg').show()" value="#{msg.SubmitForApproval}" update="woTab:submitCommentsDialogForm" icon="ui-icon-check" />
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('repairCompleteDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>

            </h:form>

        </p:dialog>
        <p:dialog id="submitCommentsDlg" widgetVar="submitCommentsDlg" modal="true" height="200" width="300"  resizable="false" draggable="true" appendTo="@(body)" header="#{msg.SubmitForApproval}">
            <h:form id="submitCommentsDialogForm" >

                <h:panelGroup rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">


                        <h:panelGroup>
                            <label class="label">#{msg.ReasonForApprovalRequest}</label>
                            <p:inputTextarea placeholder="#{msg.QuotationApproval}" value="#{workOrderMgrController.comments}" maxlength="256" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.approveUserId}*</label>
                            <p:autoComplete id="approver" value="#{workOrderMgrController.selectedApproverUid}" dropdown="true" scrollHeight="300"
                                            forceSelection="true" required="true" requiredMessage="#{msg.approveUserId}#{msg.ValidationRequire}"
                                            completeMethod="#{workOrderMgrController.getApproverList}"
                                            var="t" itemLabel="#{t.name}" itemValue="#{t.uid}">
                                <p:ajax process="@this" event="itemSelect" listener="#{workOrderMgrController.setNothing()}"/>
                                <p:ajax process="@this" listener="#{workOrderMgrController.setNothing()}"/>
                            </p:autoComplete>
<!--                            <p:selectOneMenu  value="#{workOrderMgrController.selectedApproverUid}" required="true" requiredMessage="审核人#{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{workOrderMgrController.getApproverList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                            </p:selectOneMenu>-->
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.submitWorkOrder()}" value="#{msg.SubmitForApproval}" update=":growl woTab:woMgrListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'repairCompleteDialog');PF('submitCommentsDlg').hide()" />
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <!--<ui:include src="expenseDialogforComplete.xhtml"/>-->
        <ui:include src="moreAccDialog.xhtml"/>
        <ui:include src="coWorkDialog.xhtml"/>

        <script type="text/javascript">
            function handleValidFields(xhr, status, args) {
                var valid = true;
                if (args.confirmedUpDate) {
                    $('#woTab\\:repairCompleteDialogForm\\:confirmedUpDate_input').addClass("ui-state-error");
                    valid = false;
                }
                if (args.caseType) {
                    $('#woTab\\:repairCompleteDialogForm\\:caseType').addClass("ui-state-error");
                    valid = false;
                }
                if (args.repairResult) {
                    $('#woTab\\:repairCompleteDialogForm\\:repairResult').addClass("ui-state-error");
                    valid = false;
                }
                if (args.manHours_input) {
                    $('#woTab\\:repairCompleteDialogForm\\:manHours_input').addClass("ui-state-error");
                    valid = false;
                }
                if (valid) {
                    handleSubmit(args, 'repairCompleteDialog');
                }
            }
        </script>
    </ui:composition>
</html>
