<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="repairCompleteDialog" widgetVar="repairCompleteDialog" modal="true" height="400" width="1000"  resizable="false" draggable="true" appendTo="@(body)" header="#{msg.workcomplete}">
            <h:form id="repairCompleteDialogForm" >
                <h:panelGroup  id="display5" style="height:500px" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.recoveryTime}*</label>
                            <p:calendar timeZone="GMT+8" id="fillDate" pattern="yyyy/MM/dd HH:mm:ss"  value="#{workOrderMgrController.confirmedUpDate}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="恢复时间 #{msg.ValidationRequire}"></p:calendar>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.caseType}</label>
                            <p:selectOneMenu  value="#{workOrderMgrController.selectedWorkOrder.caseType}" required="true" requiredMessage="#{msg.caseType} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{workOrderMgrController.getAssetFaultType()}" var="item" itemLabel="#{item.faultName}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                    
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                        <h:panelGroup>
                            <label class="label">#{msg.patProblems}*</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patProblems}" rows="3"  cols="40"  queryDelay="750" maxlength="100" minQueryLength="4" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.patActions}*</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patActions}" rows="3"  cols="40"  queryDelay="750" maxlength="100" minQueryLength="4" />
                        </h:panelGroup>
                        <h:panelGroup>

                            <label class="label">#{msg.patTests}*</label>
                            <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patTests}" rows="3"  cols="40"  queryDelay="750"  maxlength="100" minQueryLength="4" />
                        </h:panelGroup>

                    </p:panelGrid>
                    <p:dataGrid id="pictureList" var="fileitem" value="#{workOrderMgrController.picList}" columns="7" layout="grid">
                        <f:facet name="header">增加图片</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%" >
                                <p:graphicImage url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/> 
                                <p:commandButton actionListener="#{workOrderMgrController.removeAttachment(fileitem.objectStorageId)}" update="pictureList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>   
                            </h:panelGrid>

                        </p:panel>

                    </p:dataGrid>
                    <p:fileUpload id="type1" fileUploadListener="#{workOrderMgrController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" 
                                  multiple="false"  sizeLimit="10000000"  update="pictureList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>


                    <p:fieldset legend="费用明细" >
                        <p:panelGrid columns="2" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">工时(小时)*</label>
                                <p:inputNumber decimalPlaces="2" value="#{workOrderMgrController.selectedWorkOrder.manHours}" required="true" requiredMessage="工时(小时) #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">其它费用</label>
                                <p:inputNumber  decimalPlaces="4" value="#{workOrderMgrController.selectedWorkOrder.otherExpense}"/>
                            </h:panelGroup>
                        </p:panelGrid>

                        
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">增加备件</label>
                                <p:dataTable id="accessList" class="uiTransparent" value="#{workOrderMgrController.accessoryList}" var="item" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.accessory}">
                                        <h:outputText value="#{item.parts}"/>
                                    </p:column>

                                    <p:column headerText="#{msg.accessoryQuantity}">
                                        <h:outputText value="#{item.apartsQuantity}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.accessoryPrice}">
                                        <h:outputText value="#{item.partsPrice}"/>
                                    </p:column>

                                    <p:column headerText="#{msg.Actions}">
                                        <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{workOrderMgrController.prepareEditAccDetail('new')}" update=":moreAccDialogDlg :moreAccDialogForm" oncomplete="PF('moreAccDialogDlg').show()" rendered="#{item.id eq '000'}"/>
                                        <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{workOrderMgrController.prepareEditAccDetail(item.id)}" update=":moreAccDialogDlg :moreAccDialogForm" oncomplete="PF('moreAccDialogDlg').show()" rendered="#{item.id ne '000'}" />
                                        <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{workOrderMgrController.deleteWoDetail(item.id,1)}" update=":repairCompleteDialogForm:accessList" rendered="#{item.id ne '000'}">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">增加协作人</label>
                                <p:dataTable id="coworkerList" class="uiTransparent" value="#{workOrderMgrController.coWorkerList}" var="item" widgetVar="coworkerDataList" lazy="false" paginator="false"
                                             rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.manHours}">
                                        <h:outputText value="#{item.manHours}" />
                                    </p:column>
                                    <p:column headerText="#{msg.coworker}">
                                        <h:outputText value="#{item.cowokerUserName}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.Actions}">
                                        <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{workOrderMgrController.prepareEditCoWorkerDetail('new')}" update=":coworkerDlg :coworkerDlgForm" oncomplete="PF('coworkerDlg').show()" rendered="#{item.id eq '000'}"/>
                                        <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{workOrderMgrController.prepareEditCoWorkerDetail(item.id)}" update=":coworkerDlg" oncomplete="PF('coworkerDlg').show()" rendered="#{item.id ne '000'}" />
                                        <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{workOrderMgrController.deleteWoDetail(item.id,2)}" update=":repairCompleteDialogForm :repairCompleteDialogForm:coworkerList" rendered="#{item.id ne '000'}">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>

                        </p:panelGrid>
                        
                    </p:fieldset>
                    <!--维修完成 转单 新建工单-->
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.repairWorkOrder()}" value="#{msg.workcomplete}" update=":growl :woMgrListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'repairCompleteDialog');"/>
                        <p:commandButton validateClient="false" immediate="true" actionListener="#{workOrderMgrController.submitWorkOrder()}" value="提交审核" update=":growl :woMgrListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'repairCompleteDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('repairCompleteDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
                
            </h:form>

        </p:dialog>
        

        <!--<ui:include src="expenseDialogforComplete.xhtml"/>-->
         <ui:include src="moreAccDialog.xhtml"/>
         <ui:include src="coWorkDialog.xhtml"/>

    </ui:composition>
</html>
