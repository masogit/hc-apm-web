<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

<ui:composition>
    <h:outputStylesheet>
        .display-none{
            display: none;
        }
    </h:outputStylesheet>

    <p:dialog class="repairCompleteDialog" id="repairCompleteDialog" widgetVar="repairCompleteDialog" modal="true" height="400" width="1000"  resizable="false" draggable="true" appendTo="@(body)" header="#{msg.workcomplete}">
        <h:form id="repairCompleteDialogForm" class="tform">
            <h:panelGroup  id="display5" style="height:500px" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">#{msg.RepairResult}*</label>
                        <p:selectOneMenu id="repairResult"  value="#{workOrderMgrController.selectedWorkOrder.repairResult}" required="false" requiredMessage="#{msg.RepairResult} #{msg.ValidationRequire}">
                            <p:ajax listener="#{workOrderMgrController.repairResultSet()}" update="@(.x0) woTab:repairCompleteDialogForm:recoveryTimeGroup"/>

                            <f:selectItems value="#{fieldMsg.getFieldValueList('repairResult')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup id="assetstatus">
                        <label class="label">#{msg.status}</label>
                        <p:selectOneRadio class="x0" id="status" value="#{workOrderMgrController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                            <p:ajax  listener="#{workOrderMgrController.onStatusChange()}"  update="assetstatus" />
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(0).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(0).msgKey}" />
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(1).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(1).msgKey}" itemDisabled="true"/>
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(2).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(2).msgKey}" />
                            <f:selectItem itemLabel="#{fieldMsg.getFieldValueList('assetStatus').get(3).value}" itemValue="#{fieldMsg.getFieldValueList('assetStatus').get(3).msgKey}" itemDisabled="#{!assetInfoEditController.hasScrappedAuthority()}"/>
                        </p:selectOneRadio>
                    </h:panelGroup>
                    <h:panelGroup id="recoveryTimeGroup" >
                        <h:panelGroup rendered="#{not empty workOrderMgrController.selectedWorkOrder.repairResult and (
                            workOrderMgrController.selectedWorkOrder.repairResult == '1' or
                            workOrderMgrController.selectedWorkOrder.repairResult == '5' or
                            workOrderMgrController.selectedWorkOrder.repairResult == '6'
                    )}">
                            <label class="label">#{msg.recoveryTime}*</label>
                            <p:calendar timeZone="GMT+8" id="confirmedUpDate" pattern="yyyy/MM/dd HH:mm:ss" mask="true"
                                        value="#{workOrderMgrController.confirmedUpDate}" showOn="button"
                                        showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh"
                                        required="false" requiredMessage="#{msg.recoveryTime} #{msg.ValidationRequire}">
                                <p:ajax event="dateSelect"/>
                            </p:calendar>
                        </h:panelGroup>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.caseType}*</label>
                        <p:selectOneMenu id="caseType" value="#{workOrderMgrController.selectedWorkOrder.caseType}" required="false" requiredMessage="#{msg.caseType} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:choose>
                                <c:when test="#{userContextService.isCountyArea()}">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('faultTypeCountyArea')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </c:when>
                                <c:otherwise>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('faultType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </c:otherwise>
                            </c:choose>
                            <p:ajax event="change" process="@this" />
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.intExtType}</label>
                        <p:selectOneMenu value="#{workOrderMgrController.selectedWorkOrder.intExtType}" required="false" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('intExtType').subList(0,2)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.MaintenanceSubStatus}</label>
                        <p:selectOneMenu id="subStatus"  value="#{workOrderMgrController.selectedWorkOrder.subStatus}" required="false" requiredMessage="#{msg.MaintenanceSubStatus} #{msg.ValidationRequire}">
                            <p:ajax   listener="#{workOrderMgrController.selectSubstatus()}" update="subStatusStartSubStatusTimeStart subStatusStartSubStatusTimeEnd"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('subStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup id="subStatusStartSubStatusTimeStart">
                        <h:panelGroup  rendered="#{workOrderMgrController.displayTime}">
                            <label class="label">#{msg.startTime}</label>
                            <p:calendar timeZone="GMT+8" label="#{msg.StartTime}" pattern="yyyy/MM/dd" value="#{workOrderMgrController.statusStartTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true">
                                <p:ajax event="dateSelect"/>
                            </p:calendar>
                        </h:panelGroup>
                    </h:panelGroup>
                    <h:panelGroup id="subStatusStartSubStatusTimeEnd">
                        <h:panelGroup  rendered="#{workOrderMgrController.displayTime}">
                            <label class="label">#{msg.endTime}</label>
                            <p:calendar timeZone="GMT+8" label="#{msg.EndTime}" pattern="yyyy/MM/dd" value="#{workOrderMgrController.statusCloseTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true">
                                <p:ajax event="dateSelect"/>
                            </p:calendar>
                        </h:panelGroup>
                    </h:panelGroup>
                </p:panelGrid>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'showWorkOrderType').rendered}">
                        <label class="label">
                            #{systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'showWorkOrderType').label
                                    .concat(systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'showWorkOrderType').required ? '*' : '')}
                        </label>
                        <p:selectOneMenu id="workOrderType" value="#{workOrderMgrController.selectedWorkOrder.workOrderType}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('workOrderType')}" var="item"
                                           itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'showDiagnosticProcess').rendered}">
                        <label class="label">#{msg.diagnosticProcess}#{systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'showWorkOrderType').required ? '*' : ''}</label>
                        <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.diagnosticProcess}" rows="3"  cols="40"  maxlength="500" required="#{systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'showDiagnosticProcess').required}"
                                         requiredMessage="#{systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'showDiagnosticProcess').requiredMessage}" >
                            <p:ajax />
                        </p:inputTextarea>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.patProblems}</label>
                        <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patProblems}" rows="3"  cols="40"  maxlength="500"   >
                            <p:ajax />
                        </p:inputTextarea>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.patActions}</label>
                        <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patActions}" rows="3"  cols="40"  maxlength="500"  >
                            <p:ajax />
                        </p:inputTextarea>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.patTests}</label>
                        <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patTests}" rows="3"  cols="40"   maxlength="500" >
                            <p:ajax />
                        </p:inputTextarea>
                    </h:panelGroup>
                </p:panelGrid>
                <p:fieldset legend="#{msg.requestImage}" toggleable="false" rendered="#{not empty workOrderMgrController.getPicListByBoType('ServiceRequest')}">
                    <p:dataGrid id="requestImage" var="fileitem" value="#{workOrderMgrController.getPicListByBoType('ServiceRequest')}" columns="5" layout="grid" rendered="#{not empty workOrderMgrController.getPicListByBoType('ServiceRequest')}" emptyMessage="#{msg.noRecordFound}">
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%" >
                                <p:ajax disabled="#{!preViewerBean.isPreview(fileitem)}" event="click" update="previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(workOrderMgrController,fileitem.objectStorageId)}"/>
                                <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false" >
                                </p:graphicImage>
                            </h:panelGrid>
                            <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.objectName}" action="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                        </p:panel>
                    </p:dataGrid>
                </p:fieldset>
                <p:dataGrid id="pictureList" class="pictureListCls" var="fileitem" value="#{workOrderMgrController.getPicListByBoType('WorkOrder')}" columns="7" layout="grid" emptyMessage="#{msg.noRecordFound}">
                    <f:facet name="header">
                        #{msg.addPic}<p:outputLabel value="(#{msg.maxUpload5Pics})" style="color: red"></p:outputLabel>
                    </f:facet>
                    <p:panel  style="text-align:center">
                        <h:panelGrid columns="1" style="width:100%" >
                            <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>
                            <p:commandButton actionListener="#{workOrderMgrController.removeAttachmentById(fileitem.id)}" update="pictureList woTab:repairCompleteDialogForm:type1" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </h:panelGrid>
                    </p:panel>
                </p:dataGrid>
                <p:fileUpload id="type1" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/" fileUploadListener="#{workOrderMgrController.handleFileUpload}" mode="advanced"
                              dragDropSupport="false" style="width:100%" multiple="true" sizeLimit="10000000"  update="pictureList type1" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}"
                              invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}" disabled="#{workOrderMgrController.getPicListByBoType('WorkOrder').size() ge 5}"/>


                <p:dataGrid id="attachList" var="fileitem" value="#{workOrderMgrController.attachList}" columns="7" layout="grid" emptyMessage="#{msg.noRecordFound}">
                    <f:facet name="header">#{msg.AddDocument}<p:outputLabel value="(#{msg.maxUpload5Docs})" style="color: red"></p:outputLabel></f:facet>
                    <h:panelGrid columns="1" style="width:100%" >
                        #{fileitem.objectName}
                        <p:commandButton actionListener="#{workOrderMgrController.removeAttachmentByIdPDF(fileitem.id)}" update="attachList woTab:repairCompleteDialogForm:type2" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                        </p:commandButton>
                    </h:panelGrid>
                </p:dataGrid>
                <p:fileUpload id="type2" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/" fileUploadListener="#{workOrderMgrController.handleFileUploadPDF}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="true" sizeLimit="10000000" update="attachList type2" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}" disabled="#{workOrderMgrController.attachList.size() ge 5}"/>

                <p:fieldset legend="#{msg.expensedetail}" >
                    <p:panelGrid columns="4" styleClass="ui-panelgrid-blank form-group" id="entryTypeFlag">
                        <h:panelGroup>
                            <label class="label">#{msg.manHoursEntryType}*</label>
                            <p:selectOneRadio id="entryType" required="true" disabled="false" value="#{workOrderMgrController.selectedWorkOrder.entryType}"  requiredMessage="#{msg.manHoursEntryType} #{msg.ValidationRequire}">
                                <p:ajax event="change" process="@this" update=":growl woTab:repairCompleteDialogForm:entryType woTab:repairCompleteDialogForm:workHourDetail woTab:repairCompleteDialogForm:coworkerList woTab:repairCompleteDialogForm:entryTypeFlag"  listener="#{workOrderMgrController.updateEntryType(workOrderMgrController.selectedWorkOrder.entryType)}" />
                                <c:if test="#{workOrderMgrController.selectedWorkOrder.entryType==1 || workOrderMgrController.selectedWorkOrder.entryType==0}">
                                    <f:selectItem itemLabel="#{msg.addManHoursSection}" itemValue="1"/>
                                    <f:selectItem itemLabel="#{msg.enterTotalManHours}" itemValue="0"/>
                                </c:if>

                                <c:if test="#{workOrderMgrController.selectedWorkOrder.entryType==3}">
                                    <f:selectItem itemLabel="#{msg.addManHoursSection}" itemValue="3"/>
                                </c:if>
                                <c:if test="#{workOrderMgrController.selectedWorkOrder.entryType==2}">
                                    <f:selectItem itemLabel="#{msg.enterTotalManHours}" itemValue="2"/>
                                </c:if>
                            </p:selectOneRadio>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{workOrderMgrController.selectedWorkOrder.entryType==0 || workOrderMgrController.selectedWorkOrder.entryType==2  || workOrderMgrController.selectedWorkOrder.entryType==null}">
                            <label class="label">#{workOrderMgrController.getManHourShow()}(小时)</label>
                            <p:inputNumber id="manHours_input" maxValue="999" value="#{workOrderMgrController.selectedWorkOrder.manHours}"  required="false" requiredMessage="#{msg.manhours} #{msg.ValidationRequire}">
                                <p:ajax />
                            </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{workOrderMgrController.selectedWorkOrder.entryType==1 || workOrderMgrController.selectedWorkOrder.entryType==3}">
                            <label class="label">#{workOrderMgrController.getManHourShow()}(小时)</label>
                            <p:inputNumber id="manHours_input2" readonly="true" maxValue="999" value="#{workOrderMgrController.selectedWorkOrder.manHours}"  required="false" requiredMessage="#{msg.manhours} #{msg.ValidationRequire}">
                                <p:ajax />
                            </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.otherExpense}</label>
                            <p:inputNumber minValue="0" maxValue="99999999"  decimalPlaces="2" value="#{workOrderMgrController.selectedWorkOrder.otherExpense}" >
                                <p:ajax />
                            </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.ExternalExpenses}</label>
                            <p:inputNumber  minValue="0"  maxValue="99999999"  decimalPlaces="2" value="#{workOrderMgrController.selectedWorkOrder.externalExpense}">
                                <p:ajax />
                            </p:inputNumber>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:panelGrid id="workHourDetail" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup  rendered="#{workOrderMgrController.selectedWorkOrder.entryType==1 || workOrderMgrController.selectedWorkOrder.entryType==3 }">
                            <label class="label">#{msg.addManHoursSection}</label>
                            <p:dataTable id="workHourDetailList" class="workHourDetailList" value="#{workOrderMgrController.workHoursList}" var="item" widgetVar="workHourDetailList"
                                         lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.startTime}">
                                    <h:outputText value="#{item.startTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.endTime}">
                                    <h:outputText value="#{item.endTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.manHours}">
                                    <h:outputText value="#{item.hours}"/>
                                </p:column>
                                <p:column headerText="#{msg.Remark}">
                                    <h:outputText value="#{item.remark}"/>
                                </p:column>
                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{workOrderMgrController.prepareEditWorkOrderManHoursDetail('new')}" update="@(.manHoursDetailDlg)" oncomplete="PF('manHoursDetailDlg').show()" rendered="#{item.id eq '000'}"/>
                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{workOrderMgrController.prepareEditWorkOrderManHoursDetail(item.id)}" update="@(.manHoursDetailDlg)" oncomplete="PF('manHoursDetailDlg').show()" rendered="#{item.id ne '000'}" />
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{workOrderMgrController.deleteWorkOrderManHoursDetail(item.id)}" update="@(.workHourDetailList) woTab:repairCompleteDialogForm:manHours_input woTab:repairCompleteDialogForm:manHours_input2" rendered="#{item.id ne '000'}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.addAcce}</label>
                            <p:dataTable id="accessList" class="accessList" value="#{workOrderMgrController.accessoryList}" var="item" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.PartName}">
                                    <h:outputText value="#{item.parts}"/>
                                </p:column>
                                <p:column headerText="#{msg.PartsItemCode}" rendered="#{userContextService.countyArea}">
                                    <h:outputText value="#{workOrderMgrController.getPartsItemCode(item)}"/>
                                </p:column>
                                <p:column headerText="#{msg.accessoryQuantity}">
                                    <h:outputText value="#{item.apartsQuantity}"/>
                                </p:column>
                                <p:column headerText="#{msg.EstimatedUnitPriceRMB}">
                                    <h:outputText value="#{item.partsPrice}">
                                        <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.ContractPriceRMB}">
                                    <h:outputText value="#{item.closedPrice}">
                                        <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                    </h:outputText>

                                </p:column>
                                <p:column headerText="#{msg.PartType}">
                                    <h:outputText value="#{fieldMsg.fieldValue('partsType', item.partsType)}" />
                                </p:column>
                                <p:column headerText="#{msg.assetsDashboardclm2}">
                                    <h:outputText value="#{item.serialNum}" />
                                </p:column>
                                <p:column headerText="#{msg.invoiceNum}">
                                    <h:outputText value="#{item.invoiceNum}" />
                                </p:column>
                                <p:column headerText="#{msg.qualityexpirdate}">
                                    <h:outputText value="#{item.warrantyDate}">
                                        <f:convertDateTime pattern="yyyy-MM-dd"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.EstimatedArrivalTime}">
                                    <h:outputText value="#{item.estimatedArriveTime}">
                                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="#{msg.ArrivalConfirmationTime}">
                                    <h:outputText value="#{item.arrivedTime}">
                                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="#{msg.arrival}">
                                    <h:outputText value="#{item.arrived?msg.Arrived:msg.NonArrived}" rendered="#{item.id ne '000'}" class="arrivalItem"/>
                                </p:column>
                                <c:if test="#{userContextService.countyArea}">
                                    <p:column headerText="#{msg.partUseType}">
                                        <h:outputText value="#{fieldMsg.fieldValue('partUseType', item.partUseType)}" />
                                    </p:column>
                                    <p:column headerText="#{msg.partsDescription}">
                                        <h:outputText value="#{item.partsDescription}" />
                                    </p:column>
                                </c:if>
                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{workOrderMgrController.prepareEditAccDetail('new')}" disabled="#{workOrderMgrController.selectedWorkOrder.approvalStatus eq '1' or workOrderMgrController.selectedWorkOrder.approvalStatus eq '5'}" update="@(.moreAccDialogDlg)" oncomplete="PF('moreAccDialogDlg').show()" rendered="#{item.id eq '000'}"/>
                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{workOrderMgrController.prepareEditAccDetail(item)}" update="@(.moreAccDialogDlg)" oncomplete="PF('moreAccDialogDlg').show()" rendered="#{item.id ne '000'}" disabled="#{workOrderMgrController.selectedWorkOrder.approvalStatus eq '1' or workOrderMgrController.selectedWorkOrder.approvalStatus eq '5'}"/>
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{workOrderMgrController.deleteWoDetail(item.id,1)}" update="@(.accessList) woTab:repairCompleteDialogForm:addContractor" rendered="#{item.id ne '000' and ( empty item.approved? true:not item.approved)}" disabled="#{workOrderMgrController.selectedWorkOrder.approvalStatus eq '1' or workOrderMgrController.selectedWorkOrder.approvalStatus eq '5'}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                    <h:outputText value="#{msg.Approved2}" rendered="#{item.id ne '000' and ( empty item.approved? false: item.approved)}" />
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.coworkerManHoursEntryType}</label>
                            <p:selectOneRadio id="coworkerEntryType" required="true" value="#{workOrderMgrController.selectedWorkOrder.coworkerEntryType}"  requiredMessage="#{msg.coworkerManHoursEntryType} #{msg.ValidationRequire}">
                                <p:ajax event="change" process="@this" update=":growl woTab:repairCompleteDialogForm:coworkerEntryType woTab:repairCompleteDialogForm:coworkerList"  listener="#{workOrderMgrController.updateCoworkerEntryType(workOrderMgrController.selectedWorkOrder.coworkerEntryType)}" />
                                <c:if test="#{workOrderMgrController.selectedWorkOrder.coworkerEntryType==1 || workOrderMgrController.selectedWorkOrder.coworkerEntryType==0}">
                                    <f:selectItem itemLabel="#{msg.addManHoursSection}" itemValue="1"/>

    <script type="text/javascript">
        function handleValidFields(xhr, status, args) {
            var valid = true;
            var valid1 = true;
            if (args.confirmedUpDate) {
                $('#woTab\\:repairCompleteDialogForm\\:confirmedUpDate_input').addClass("ui-state-error");
                valid = false;
            }
            if (args.caseType) {
                $('#woTab\\:repairCompleteDialogForm\\:caseType').addClass("ui-state-error");
                valid = false;
            }
            if (args.repairResult) {
                $('#woTab\\:repairCompleteDialogForm\\:repairResult').addClass("ui-state-error");
                valid = false;
            }
            if (args.manHours_input) {
                $('#woTab\\:repairCompleteDialogForm\\:manHours_input').addClass("ui-state-error");
                valid = false;
            }
            if (args.travelTime) {
                $('#woTab\\:repairCompleteDialogForm\\:travelTime').addClass("ui-state-error");
                valid = false;
            }
            if (args.pat_problems) {
                valid = false;
            }
            if (args.pat_actions) {
                valid = false;
            }
            if (args.pat_tests) {
                valid = false;
            }
            if (args.imges) {
                valid = false;
            }
            if(args.approvalMust){
                valid1 =false;
            }

            if (valid) {
                if(args.detailFlag){
                    PF('partCommentsDlg').show();
                }else{
                    handleSubmit(args, 'repairCompleteDialog');
                    handleSubmit(args, 'partCommentsDlg');
                }
            }
            if(valid1){
                handleSubmit(args, 'submitCommentsDlg')
            }
        }

        function handleCheckApprovalCompletes(xhr, status, args) {
            var checkApproval = args.checkApproval;
            if(checkApproval==true) {
                var button = document.getElementById('woTab:repairCompleteDialogForm:oldApproval');
                button.click();
            }else{
                PF('repairCompleteDialog').hide();
            }
        }
    </script>
