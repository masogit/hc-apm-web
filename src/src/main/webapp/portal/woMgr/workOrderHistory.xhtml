<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">

        <div class="ui-g">
             <div class="ui-g-12">
                <div class="ui-g-12 card cardTitle">
                    <p:outputLabel class="pageTitle" value="历史工单"/>
                </div>
                <h:form id="secondmentOrderManage">
                    <p:panelGrid columns="1" layout="grid">
                        <h:panelGroup>
                            <p:dataTable id="datalist" value="#{workOrderESHistoryController.lazyModel}" var="item" widgetVar="secondmentOrderManageList"
                                         selectionMode="single"  selection="#{workOrderESHistoryController.selected}"
                                         lazy="true" paginator="true" paginatorPosition="both"  paginatorAlwaysVisible="true"
                                         rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         rows="20" emptyMessage="#{msg.noRecordFound}"
                                         rowsPerPageTemplate="10,20,50,100">

                                <p:ajax event="filter" listener="#{workOrderESHistoryController.onFilter}" update="datalist"/>
                                <p:column headerText="报修单号"  >
                                    <h:outputText value="#{item.srNum}" />
                                </p:column>
                                <p:column headerText="报修人" filterBy="#{item.requestorName}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.requestorName}" />
                                </p:column>
                                <p:column headerText="联系电话" filterBy="#{item.requestorPhone}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.requestorPhone}" />
                                </p:column>
                                <p:column headerText="#{msg.requestTime}"  >
                                    <h:outputText value="#{item.requestTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="关单时间" >
                                    <h:outputText value="#{item.closeTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.requestReason}" >
                                    <h:outputText value="#{item.requestReason}"/>
                                </p:column>
                                <p:column headerText="语音" width="20%">
                                    <h:outputText value="#{item.requestReasonVoice}"/>
                                </p:column>
                                <p:column headerText="#{msg.assetName}" >
                                    <h:outputText value="#{item.assetName}"/>
                                </p:column>
                                <p:column headerText="#{msg.financingNum}" >
                                    <h:outputText value="#{item.financingNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.qrCode}" >
                                    <h:outputText value="#{item.qrCode}"/>
                                </p:column>
                                <p:column headerText="#{msg.serialNum}" >
                                    <h:outputText value="#{item.serialNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.departNum}" >
                                    <h:outputText value="#{item.departNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.functionType}" >
                                    <h:outputText value="#{item.functionType}"/>
                                </p:column>
                                <p:column headerText="#{msg.clinicalDeptName}" >
                                    <h:outputText value="#{item.clinicalDeptName}"/>
                                </p:column>
                                <p:column headerText="院区名称" >
                                    <h:outputText value="#{item.siteName}"/>
                                </p:column>

                                <f:facet name="{Toolbar}">
                                    <p:commandButton  title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                        <p:dataExporter type="xls" target="datalist" fileName="secondmentOrder_export"/>
                                    </p:commandButton>

                                </f:facet>
                            </p:dataTable>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:form>

             </div>
        </div>
    </ui:define>
</ui:composition>
