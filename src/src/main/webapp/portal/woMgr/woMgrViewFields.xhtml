<?xml version="1.0" encoding="UTF-8" ?>
    <ui:composition xmlns="http://www.w3.org/1999/xhtml"
                    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                    xmlns:h="http://xmlns.jcp.org/jsf/html"
                    xmlns:f="http://xmlns.jcp.org/jsf/core"
                    xmlns:p="http://primefaces.org/ui"
                    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                    xmlns:apm="http://www.ge.com/tags/apm">

    <p:fieldset legend="#{msg.requestWorkorder} (#{fieldMsg.fieldValue('casePriority',workOrderMgrController.selected.serviceRequest.casePriority)})" rendered="#{not empty workOrderMgrController.selected}">
        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">#{msg.assetName}</label>
                <p:link href="#{workOrderMgrController.setDataLinkUrl(workOrderMgrController.selected.assetInfo.name, workOrderMgrController.selected.assetInfo.uid)}" value="#{workOrderMgrController.selected.assetInfo.name}" target="_blank" />
            </h:panelGroup>
            <h:panelGroup rendered="#{workOrderMgrController.selected.assetInfo.mvsEquip eq 1 and (userContextService.loginUser.mvsRoleType eq 1 or userContextService.loginUser.mvsRoleType eq 2) }">
                <label class="label">#{msg.mvsContractStartDate}</label>
                <p:outputLabel value="#{workOrderMgrController.getMvsContract(workOrderMgrController.selected.assetInfo.id).contractStartDate}" />
            </h:panelGroup>
            <h:panelGroup rendered="#{workOrderMgrController.selected.assetInfo.mvsEquip eq 1 and (userContextService.loginUser.mvsRoleType eq 1 or userContextService.loginUser.mvsRoleType eq 2) }">
                <label class="label">#{msg.mvsContractEndDate}</label>
                <p:outputLabel value="#{workOrderMgrController.getMvsContract(workOrderMgrController.selected.assetInfo.id).contractEndDate}" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.departNum}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.assetInfo.departNum}" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.srNum}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.srNum}" />
            </h:panelGroup>
            <h:panelGroup rendered="#{workOrderMgrController.selected.serviceRequest.srRepairSource != null}">
                <label class="label">#{msg.repairSource}</label>
                <p:outputLabel value="#{fieldMsg.doGetFieldValue('RepairSource',workOrderMgrController.selected.serviceRequest.srRepairSource)}"   />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.requestorName}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.requestorName}" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.requestorPhone}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.requestorPhone}" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.requestTime}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.requestTime}" >
                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                </p:outputLabel>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.assetLocation}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.assetLocation}" />
            </h:panelGroup>
            <h:panelGroup rendered="#{userContextService.countyArea}">
                <label class="label">#{msg.hospitalAreaName}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.hospitalName}" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.requestReason}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.requestReason}" style="word-wrap: break-word;"/>
            </h:panelGroup>
            <h:panelGroup id="assetstatus" class="updateDownTime">
                <label class="label">#{msg.status}</label>
                <p:selectOneRadio id="status" value="#{workOrderMgrController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.validationRequire}" disabled="#{workOrderMgrController.currentStatus ne 3}">
                    <p:ajax  listener="#{workOrderMgrController.onStatusChange()}"  update="assetstatus" />
                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(0, 1)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="true"/>
                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(1, 3)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="#{workOrderMgrController.selected.currentStepId ne 4}"/>
                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus').subList(3, 4)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" itemDisabled="true"/>
                </p:selectOneRadio>
                <p:calendar  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" label="#{msg.confirmedDownTime}" rendered="#{workOrderMgrController.needConfirmTime}"  id="confirmedDownTime"  value="#{workOrderMgrController.confirmedDownTime}" showOn="button"
                             readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.confirmedDownTime} #{msg.validationRequire}"/>
                <p:commandButton value="#{msg.updateDownTime}" rendered="#{workOrderMgrController.needConfirmTime}" actionListener="#{workOrderMgrController.updateDownTime}" process="@(.updateDownTime)" update="assetstatus showDownTime"/>
            </h:panelGroup>
            <h:panelGroup id="showDownTime">
                <label class="label">#{msg.confirmedDownTime}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.confirmedDownTime}" >
                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                </p:outputLabel>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.upTimeExcel}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.confirmedUpTime}" >
                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                </p:outputLabel>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.equipmentTaker}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.equipmentTaker}" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.pickUpTime}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.takeTime}" >
                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                </p:outputLabel>
            </h:panelGroup>
            <h:panelGroup rendered="#{workOrderMgrController.selected.serviceRequest.status eq 3}">
                <label class="label">#{msg.cancelor}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.cancelPerson}" />
            </h:panelGroup>
            <h:panelGroup rendered="#{workOrderMgrController.selected.serviceRequest.status eq 3}">
                <label class="label">#{msg.cancelWorkOrderReason}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.cancelReason}" style="word-wrap: break-word;"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.customerName}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.customerName}" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.customerTel}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.customerTel}" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.customerPosition}</label>
                <p:outputLabel value="#{workOrderMgrController.selected.serviceRequest.customerPosition}" />
            </h:panelGroup>
            <h:panelGroup rendered="#{workOrderMgrController.repairReportSendPlaceRender()}">
                <label class="label">#{msg.repairReportSendPlace}</label>
                <p:outputLabel value="#{fieldMsg.fieldValue('repairReportSendPlace', workOrderMgrController.selected.serviceRequest.repairReportSendPlace)}" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.repairCurrentStatus}</label>
                <p:outputLabel value="#{fieldMsg.fieldValue('assetStatus', workOrderMgrController.selected.serviceRequest.ibStatus)}" />
            </h:panelGroup>
        </p:panelGrid>
        <p:fieldset legend="#{msg.requestImage}" toggleable="false" rendered="#{not empty workOrderMgrController.getPicListByBoType('ServiceRequest')}">
            <p:dataGrid id="requestImage" var="fileitem" value="#{workOrderMgrController.getPicListByBoType('ServiceRequest')}" columns="5" layout="grid" rendered="#{not empty workOrderMgrController.getPicListByBoType('ServiceRequest')}" emptyMessage="#{msg.noRecordFound}">
                <p:panel  style="text-align:center">
                    <h:panelGrid columns="1" style="width:100%" >
                        <p:ajax disabled="#{!preViewerBean.isPreview(fileitem)}" event="click" update="previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(workOrderMgrController,fileitem.objectStorageId)}"/>
                        <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false" >
                        </p:graphicImage>
                    </h:panelGrid>
                    <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.objectName}" action="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                </p:panel>
            </p:dataGrid>
        </p:fieldset>
        <p:fieldset legend="#{msg.repairImage}" toggleable="false" rendered="#{not empty workOrderMgrController.getPicListByBoType('WorkOrder')}">
            <p:dataGrid id="woPicItem" var="fileitem" value="#{workOrderMgrController.getPicListByBoType('WorkOrder')}" columns="5" layout="grid" rendered="#{not empty workOrderMgrController.getPicListByBoType('WorkOrder')}" emptyMessage="#{msg.noRecordFound}">
                <p:panel  style="text-align:center">
                    <h:panelGrid columns="1" style="width:100%" >
                        <p:ajax disabled="#{!preViewerBean.isPreview(fileitem)}" event="click" update="previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(workOrderMgrController,fileitem.objectStorageId)}"/>
                        <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false" >
                        </p:graphicImage>
                    </h:panelGrid>
                    <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.objectName}" action="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                </p:panel>
            </p:dataGrid>
        </p:fieldset>
        <p:dataGrid var="fileitem" value="#{workOrderMgrController.attachList}" columns="4" layout="grid" rendered="#{not empty workOrderMgrController.attachList}" emptyMessage="#{msg.noRecordFound}">
            <f:facet name="header">#{msg.repairAttachment}</f:facet>
            <p:panel  style="text-align:center">
                <h:panelGrid columns="1" style="width:100%" >
                    <p:ajax disabled="#{!preViewerBean.isPreview(fileitem)}" event="click" update="previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(workOrderMgrController,fileitem.objectStorageId)}"/>
                    <img src="#{fileDownloadService.getImgBase64(fileitem.objectStorageId)}" style="width:100px; height:80px;margin: 0px 5px 0px 5px;"/>
                </h:panelGrid>
                <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.objectName}" action="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
            </p:panel>
        </p:dataGrid>
        <p:fieldset rendered="#{not empty workOrderMgrController.audioList}">
            <p:dataGrid var="audioItem" value="#{workOrderMgrController.audioList}" columns="2" layout="grid" rendered="#{not empty workOrderMgrController.audioList}" emptyMessage="#{msg.noRecordFound}">
                <f:facet name="header">#{msg.requestVoice}</f:facet>
                <p:panel  style="text-align:center">
                    <h:panelGrid columns="1" style="width:100%">
                        <audio controls="controls">
                            <source src="#{fileDownloadService.getFileUrl(audioItem.objectStorageId)}" />
                        </audio>
                    </h:panelGrid>
                </p:panel>
            </p:dataGrid>
            <!--                    <p:dataGrid var="voiceToText" value="#{workOrderMgrController.selected.serviceRequest.voiceToText}" rendered="#{not empty workOrderMgrController.audioList and not empty workOrderMgrController.selected.serviceRequest.voiceToText}">-->
            <!--                        <f:facet name="header">语音转文字</f:facet>-->
            <!--                        <h:panelGroup>-->
            <!--                            <h:outputText value="#{workOrderMgrController.selected.serviceRequest.voiceToText}"-->
            <!--                                          style="display: block; margin-top: 4px; white-space: pre-wrap;" />-->
            <!--                        </h:panelGroup>-->
            <!--                    </p:dataGrid>-->
        </p:fieldset>
        <p:dataGrid var="audioItem" value="#{workOrderMgrController.videoList}" columns="2" layout="grid" rendered="#{not empty workOrderMgrController.videoList}" emptyMessage="#{msg.noRecordFound}">
            <f:facet name="header">#{msg.repairVideo}</f:facet>
            <p:panel  style="text-align:center">
                <h:panelGrid columns="6" style="width: 100%">
                    <video controls="" name="media" width="100%" height="500">
                        <source src="#{fileDownloadService.getFileUrl(audioItem.objectStorageId)}"/>
                    </video>
                </h:panelGrid>
            </p:panel>
        </p:dataGrid>
        <c:forEach items="#{workOrderMgrController.selectedWorkOrderList}" var="woItem" varStatus="rowIndex" >
            <p:fieldset legend="#{woItem.id==workOrderMgrController.selected.id? msg.currentWorkorder:msg.workOrder} #{empty woItem.parentWoId?'(主工单)':''}" toggleable="false" >
                <div class="ui-g">
                    <div class="ui-g-10 ui-g-nopad">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.status}</label>
                                <p:outputLabel value="#{fieldMsg.fieldValue('woSteps', woItem.currentStepId)}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.totalManHour}</label>
                                <p:outputLabel value="#{woItem.totalManHour}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.totalPrice}</label>
                                <p:outputLabel value="#{woItem.totalPrice}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.checkInTime}</label>
                                <p:outputLabel value="#{woItem.checkinTime}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.intExtType}</label>
                                <p:outputLabel value="#{fieldMsg.fieldValue('intExtType', woItem.intExtType)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.caseType}</label>
                                <c:choose>
                                    <c:when test="#{userContextService.isCountyArea()}">
                                        <p:outputLabel value="#{fieldMsg.fieldValue('faultTypeCountyAreaMore', woItem.caseType)}"/>
                                    </c:when>
                                    <c:otherwise>
                                        <p:outputLabel value="#{workOrderMgrController.getFaultTypeName(woItem.caseType)}"/>
                                    </c:otherwise>
                                </c:choose>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'showWorkOrderType').rendered}">
                                <label class="label"> #{systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'showWorkOrderType').label}</label>
                                <p:outputLabel value="#{fieldMsg.fieldValue('workOrderType', woItem.workOrderType)}" />
                            </h:panelGroup>
                            <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'showDiagnosticProcess').rendered}}">
                                <label class="label">#{msg.diagnosticProcess}</label>
                                <p:outputLabel value="#{woItem.diagnosticProcess}" title="#{woItem.diagnosticProcess}" style="word-wrap: break-word;"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.patProblems}</label>
                                <p:outputLabel value="#{woItem.patProblems}" style="word-wrap: break-word;"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.patActions}</label>
                                <p:outputLabel value="#{woItem.patActions}" style="word-wrap: break-word;"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.patTests}</label>
                                <p:outputLabel value="#{woItem.patTests}" style="word-wrap: break-word;"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.entryType}</label>
                                <p:outputLabel value="#{fieldMsg.fieldValue('hoursEntryType', woItem.entryType == null ? 0 : woItem.entryType)}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.manHours}</label>
                                <p:outputLabel value="#{woItem.manHours}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.otherExpense}</label>
                                <p:outputLabel value="#{woItem.otherExpense}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.externalExpenses}</label>
                                <p:outputLabel value="#{woItem.externalExpense}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.currentPersonName}</label>
                                <p:outputLabel value="#{woItem.currentStepId ==5 ? woItem.ackName:woItem.currentPersonName}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.feedbackRating}</label>
                                <p:outputLabel value="#{woItem.feedbackRating != null and woItem.feedbackRating ==0 ?'':woItem.feedbackRating}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.feedbackComment}</label>
                                <p:outputLabel value="#{woItem.feedbackComment}" style="word-wrap: break-word;"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.endTime}</label>
                                <p:outputLabel value="#{woItem.closeTime}">
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.maintenanceSubStatus}</label>
                                <p:outputLabel value="#{fieldMsg.fieldValue('subStatus',woItem.subStatus)}" style="word-wrap: break-word;"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.maintenanceValue}</label>
                                <p:outputLabel value="#{woItem.maintenanceValue}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.externalQuotation}</label>
                                <p:outputLabel value="#{woItem.externalQuotation}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.latestDevelopments}</label>
                                <p:outputLabel value="#{woItem.comment}"/>
                            </h:panelGroup>
                            <c:if test="#{userContextService.countyArea}">
                                <h:panelGroup>
                                    <label class="label">#{msg.siebleNumber}</label>
                                    <p:outputLabel value="#{woItem.siebleNumber}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.callCenterNumber}</label>
                                    <p:outputLabel value="#{woItem.callCenterNumber}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.countyAreaOrderType}</label>
                                    <p:outputLabel value="#{fieldMsg.fieldValue('countyAreaOrderType',woItem.orderType)}" rendered="#{not empty woItem.orderType}"/>
                                </h:panelGroup>
                            </c:if>
                            <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(workOrderMgrController.currentUserOrgInfo, 'workOrderShowTravelTime').rendered}">
                                <label class="label">#{msg.travelTime}</label>
                                <p:outputLabel id="travel_time"  value="#{woItem.travelTime}" />
                            </h:panelGroup>
                            <h:panelGroup rendered="#{woItem.currentStepId != 1 and woItem.currentStepId != 2}">
                                <label class="label">#{msg.repairType}</label>
                                <p:outputLabel value="#{fieldMsg.fieldValue('repairType',woItem.repairType)}" />
                            </h:panelGroup>
                            <h:panelGroup rendered="#{userContextService.enableDisplayByKey('workOrderShowTubeInstall')}">
                                <label class="label">#{msg.tubeInstallDate}</label>
                                <p:outputLabel value="#{woItem.tubeInstallDate}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{userContextService.enableDisplayByKey('workOrderShowTubeInstall')}">
                                <label class="label">#{msg.totalExposureCount}</label>
                                <p:outputLabel value="#{woItem.totalExposureCount}" />
                            </h:panelGroup>
                            <h:panelGroup rendered="#{userContextService.enableDisplayByKey('workOrderShowTubeInstall')}">
                                <label class="label">#{msg.totalInspectionCount}</label>
                                <p:outputLabel value="#{woItem.totalInspectionCount}" />
                            </h:panelGroup>
                        </p:panelGrid>
                    </div>
                    <div class="ui-g-2">
                        <h:outputText value="#{msg.acceptanceSignature}" />
                        <div class="container-fluid" style="height: 200px; width: 200px;">
                            <p:graphicImage value="#{fileDownloadService.getFile(woItem.ackSignature)}" stream="false" style="max-width: 100%;height: auto"/>
                        </div>
                    </div>
                </div>
                <p:dataTable value="#{workOrderMgrController.getWOrkOrderStep(woItem.id)}" var="stepItem">
                    <p:column headerText="#{msg.stepName}">
                        <h:outputText value="#{stepItem.stepName}" />
                    </p:column>
                    <p:column headerText="#{msg.ownerName}">
                        <h:outputText value="#{stepItem.ownerName}" />
                    </p:column>
                    <p:column headerText="#{msg.startTime}">
                        <h:outputText value="#{stepItem.startTime}" >
                            <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.endTime}">
                        <h:outputText value="#{stepItem.endTime}" >
                            <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.description}">
                        <h:outputText value="#{stepItem.comments}"  style="word-wrap: break-word;"/>
                    </p:column>
                </p:dataTable>
                <br/>
                <h:panelGroup rendered="#{not empty workOrderMgrController.getWorkOrderManHoursDetail(woItem.id)}">
                    <label class="label">#{msg.workTimePeriod}</label>
                    <p:dataTable id="x4" class="cl4" value="#{workOrderMgrController.getWorkOrderManHoursDetail(woItem.id)}" var="detailItem">
                        <p:column headerText="#{msg.startTime}">
                            <h:outputText value="#{detailItem.startTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.endTime}">
                            <h:outputText value="#{detailItem.endTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.hourslb}">
                            <h:outputText value="#{detailItem.hours}" />
                        </p:column>
                        <p:column headerText="#{msg.remark}">
                            <h:outputText value="#{detailItem.remark}"/>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>
                <h:panelGroup rendered="#{not empty workOrderMgrController.getWorkOrderDetail(woItem.id)}">
                    <p:panelGrid columns="2" layout="grid" style="padding-left: 0" styleClass="ui-panelgrid-blank">
                        <h:panelGroup style="float: left;margin-left: -16px"><label class="label" style="margin-top: 25px">#{msg.usedPart}</label></h:panelGroup>
                        <h:panelGroup style="float: right;margin-right: -18px;margin-top: 10px">
                            <p:commandButton id="printBtn" value="#{msg.printSparePartsList}" icon="ui-icon-print" action="#{workOrderMgrController.openNewWindowView(workOrderMgrController.selected.srId)}" >
                            </p:commandButton>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:dataTable id="x3" class="cl3" value="#{workOrderMgrController.getWorkOrderDetail(woItem.id)}" var="detailItem">
                        <p:column headerText="#{msg.accessory}#{msg.name}">
                            <h:outputText value="#{detailItem.parts}" />
                        </p:column>
                        <p:column headerText="#{msg.partsItemCode}" rendered="#{userContextService.countyArea}">
                            <h:outputText value="#{workOrderMgrController.getPartsItemCode(detailItem)}"/>
                        </p:column>
                        <p:column headerText="#{msg.accessoryQuantity}">
                            <h:outputText value="#{detailItem.apartsQuantity}" />
                        </p:column>
                        <p:column headerText="#{msg.estimatedUnitPriceRMB}">
                            <h:outputText value="#{detailItem.partsPrice}">
                                <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.contractPriceRMB}">
                            <h:outputText value="#{detailItem.closedPrice}">
                                <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.approvalStatus}">
                            <h:outputText value="#{detailItem.approvalStatusName}" />
                        </p:column>
                        <p:column headerText="#{msg.partType}">
                            <h:outputText value="#{fieldMsg.fieldValue('partsType', detailItem.partsType)}" />
                        </p:column>
                        <p:column headerText="#{msg.assetsDashboardclm2}">
                            <h:outputText value="#{detailItem.serialNum}" />
                        </p:column>
                        <p:column headerText="#{msg.invoiceNum}">
                            <h:outputText value="#{detailItem.invoiceNum}" />
                        </p:column>
                        <p:column headerText="#{msg.qualityexpirdate}">
                            <h:outputText value="#{detailItem.warrantyDate}">
                                <f:convertDateTime pattern="yyyy-MM-dd"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.applyTime}">
                            <h:outputText value="#{detailItem.applyTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.estimatedArrivalTime}">
                            <h:outputText value="#{detailItem.estimatedArriveTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.arrivalConfirmationTime}">
                            <h:outputText value="#{detailItem.arrivedTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.arrival}">
                            <h:outputText value="#{detailItem.arrived?msg.arrived:msg.nonArrived}" />
                        </p:column>
                        <p:column headerText="#{msg.sparePartsDescription}" rendered="#{userContextService.countyArea}">
                            <h:outputText value="#{detailItem.partsDescription}" />
                        </p:column>
                        <p:column headerText="#{msg.operation}" >
                            <p:commandButton rendered="#{workOrderMgrController.allowChanged()}" process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.edit}" disabled="#{workOrderMgrController.allowChangedForDisable() or (detailItem.approved==null?'false': not detailItem.approved)}"  actionListener="#{workOrderMgrController.prepareEditAccDetailonPrice(detailItem.id)}" update="@(.moreAccDialogPriceDlg)" oncomplete="PF('moreAccDialogPriceDlg').show()"/>
                            <p:commandButton process="@this" icon="ui-icon-search" style="zoom:0.8;" title="#{msg.view}"  actionListener="#{workOrderMgrController.prepareEditAccDetailonPrice(detailItem.id)}" update="@(.moreAccDialogViewDlg)" oncomplete="PF('moreAccDialogViewDlg').show()"/>
                        </p:column>
                    </p:dataTable>
                    <!--添加审核流程表格-->
                    <p:dataTable class="cl3" value="#{workOrderMgrController.getApproveList()}" var="approveItem" rendered="#{not empty workOrderMgrController.approveList and userContextService.hasAnyRoleByApmRoles('AssetStaff') and (workOrderMgrController.queryIndex == 4 or workOrderMgrController.queryIndex == 5 or workOrderMgrController.queryIndex == 6 or workOrderMgrController.queryIndex == 7 or workOrderMgrController.queryIndex == 8or workOrderMgrController.queryIndex == 12)}">
                        <p:column headerText="#{msg.approvalNumber}">
                            <h:outputText value="#{approveItem.approvalNumber}"/>
                        </p:column>
                        <p:column headerText="#{msg.businessNumber}">
                            <h:outputText value="#{approveItem.businessNumber}"/>
                        </p:column>
                        <p:column headerText="#{msg.businessType}" >
                            <h:outputText value="#{multiLevelApprovalGlobalController.getBusinessType(approveItem)}"/>
                        </p:column>
                        <p:column headerText="#{msg.approver}">
                            <h:outputText value="#{approveItem.actualApproverName}"/>
                        </p:column>
                        <p:column headerText="#{msg.approvalLevel}">
                            <h:outputText value="#{approveItem.approvalLevel}级审批人"/>
                        </p:column>
                        <p:column headerText="#{msg.approvalOpinion}">
                            <h:outputText value="#{approveItem.approvalOpinion}"/>
                        </p:column>
                        <p:column headerText="#{msg.approvalStatus}">
                            <h:outputText value="#{multiLevelApprovalGlobalController.getApprovalStatus(approveItem.approvalStatus)}"/>
                        </p:column>
                        <p:column headerText="#{msg.approvalNodeStatus}">
                            <h:outputText value="#{multiLevelApprovalGlobalController.getApprovalNodeStatus(approveItem.approvalNodeStatus)}"/>
                        </p:column>
                        <p:column headerText="#{msg.approvalTime}"  >
                            <h:outputText value="#{approveItem.actualApproverDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>
                <h:panelGroup rendered="#{workOrderMgrController.maintenancePersonInformation != null}">
                    <label class="label">#{msg.maintenancePersonInfo}</label>
                    <p:dataTable styleClass="header1" id="qrCodeEditForm" var="person" value="#{workOrderMgrController.maintenancePersonInformation}" editable="true" rowKey="#{person.fieldName}">
                        <p:ajax event="rowEdit" listener="#{workOrderMgrController.onRowEditExternalTempUser}" update="woTab:woMgrDetailForm:qrCodeEditForm" />
                        <p:ajax event="rowEditCancel" listener="#{workOrderMgrController.onRowCancelExternalTempUser}" update="woTab:woMgrDetailForm:qrCodeEditForm" />
                        <p:column  >
                            <h:outputText value="#{person.key}" />
                        </p:column>
                        <p:column  >
                            <p:cellEditor>
                                <f:facet name="output"><h:outputText value="#{person.label}" /></f:facet>
                                <f:facet name="input"><p:inputText id="label" value="#{person.label}" style="width:100%"/></f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column >
                            <p:rowEditor editTitle="#{msg.edit}" />
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>
                <h:panelGroup rendered="#{not empty workOrderMgrController.externalTempUser and not empty workOrderMgrController.externalTempUser.signature}">
                    <label class="label">#{msg.signatureImage}</label>
                    <p:panel  style="text-align:center">
                        <h:panelGrid columns="1" style="width:100%" >
                            <p:graphicImage value="#{fileDownloadService.getFile(workOrderMgrController.externalTempUser.signature)}" stream="false" height="80"  width="100"/>
                        </h:panelGrid>
                    </p:panel>
                </h:panelGroup>
                <c:choose>
                    <c:when test="#{userContextService.isCountyArea()}">
                        <h:panelGroup rendered="#{not empty workOrderMgrController.getWorkOrderManHours(woItem.id)}">
                            <label class="label">#{msg.countyManHoursInfo}</label>
                            <p:dataTable  value="#{workOrderMgrController.getWorkOrderManHours(woItem.id)}" var="manHoursItem" lazy="false" paginator="false"
                                          rowKey="#{manHoursItem.id}" rows="100" emptyMessage="#{msg.noRecordFound}" >
                                <p:column headerText="#{msg.manHoursOwner}">
                                    <h:outputText value="#{manHoursItem.manHoursOwner}"/>
                                </p:column>
                                <p:column headerText="#{msg.manHoursDate}">
                                    <h:outputText value="#{manHoursItem.manHoursDate}"/>
                                </p:column>
                                <p:column headerText="#{msg.workHours}">
                                    <h:outputText value="#{manHoursItem.workHours}"/>
                                </p:column>
                                <p:column headerText="#{msg.travelHours}">
                                    <h:outputText value="#{manHoursItem.travelHours}"/>
                                </p:column>
                                <p:column headerText="#{msg.waitingHours}">
                                    <h:outputText value="#{manHoursItem.waitingHours}"/>
                                </p:column>
                                <p:column headerText="#{msg.manHoursDescription}">
                                    <h:outputText value="#{manHoursItem.comment}"/>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{not empty workOrderMgrController.getWorkOrderDetailReturnView(woItem.id)}">
                            <label class="label" >#{msg.countyTenantSparePartsReturn}</label>
                            <p:dataTable id="detailReturnList" class="uiTransparent" value="#{workOrderMgrController.getWorkOrderDetailReturnView(woItem.id)}"
                                         var="item"  lazy="false" paginator="false" rowKey="#{item.id}" rows="100" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.accessory}">
                                    <h:outputText value="#{item.partName}"/>
                                </p:column>
                                <p:column headerText="#{msg.assetsDashboardclm2}">
                                    <h:outputText value="#{item.serialNum}" />
                                </p:column>
                                <p:column headerText="#{msg.returnNum}">
                                    <h:outputText value="#{item.returnNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.returnType}">
                                    <p:selectOneMenu id="partReturnType" value="#{item.returnType}" disabled="true">
                                        <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('partReturnType')}" var="item1" itemLabel="#{item1.value}" itemValue="#{item1.msgKey}"/>
                                        <p:ajax listener="#{workOrderMgrController.savePartReturnInfo(item)}" update="detailReturnList"/>
                                    </p:selectOneMenu>
                                </p:column>
                                <p:column headerText="#{msg.returnTime}">
                                    <h:outputText value="#{item.returnTime}">
                                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                                    </h:outputText>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </c:when>
                    <c:otherwise>
                        <h:panelGroup rendered="#{not empty workOrderMgrController.getWorkOrderCoworker(woItem.id)}">
                            <label class="label">#{msg.coWorkerManhours}</label>
                            <p:dataTable  value="#{workOrderMgrController.getWorkOrderCoworker(woItem.id)}" var="coWorkerItem" lazy="false" paginator="false"
                                          rowKey="#{coWorkerItem.id}" rows="1000" emptyMessage="#{msg.noRecordFound}" >
                                <p:column headerText="#{msg.coworker}">
                                    <h:outputText value="#{coWorkerItem.cowokerUserName}"/>
                                </p:column>

                                <p:column headerText="#{msg.startTime}" rendered="#{workOrderMgrController.selected.coworkerEntryType==1 || workOrderMgrController.selected.coworkerEntryType==3}">
                                    <h:outputText value="#{coWorkerItem.startTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.endTime}" rendered="#{workOrderMgrController.selected.coworkerEntryType==1 || workOrderMgrController.selected.coworkerEntryType==3}">
                                    <h:outputText value="#{coWorkerItem.endTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.manHours}">
                                    <h:outputText value="#{coWorkerItem.manHours}" />
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </c:otherwise>
                </c:choose>
                <p:dataGrid id="partPictureList" var="fileitem" value="#{workOrderMgrController.getPartPictures(woItem.id)}" columns="5" layout="grid" emptyMessage="#{msg.noRecordFound}">
                    <f:facet name="header">#{msg.attachmentUpload}</f:facet>
                    <p:panel  style="text-align:center">
                        <h:panelGrid columns="1" style="width:100%" >
                            <p:ajax  disabled="#{!preViewerBean.isPreview(fileitem)}"  event="click" update="previewedDlg" oncomplete="handlePreview(args, 'previewedDlg');"    listener="#{preViewerBean.onServerEvent(workOrderMgrController,fileitem.objectStorageId)}"/>
                            <img src="#{fileDownloadService.getImgBase64(fileitem.objectStorageId)}" style="width:100px; height:80px;margin: 0px 5px 0px 5px;"/>
                        </h:panelGrid>
                        <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.objectName}" action="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                    </p:panel>
                </p:dataGrid>
                <p:panelGrid id="msgList">
                    <h:panelGroup>
                        <p:dataList value="#{workOrderMgrController.getServiceRequestMessageList(woItem.id)}" var="msgItem" type="definition" emptyMessage="#{msg.noRecordFound}">
                            <f:facet name="header">#{msg.latestMessages}</f:facet>
                            <h:outputText value="#{msgItem.sendTime}" >
                                <f:convertDateTime pattern="MM/dd HH:mm:ss"/>
                            </h:outputText>
                            <h:outputText value="#{msgItem.senderUserName}"  style="padding-left: 10px"/>
                            <h:outputText value="#{msgItem.message}"  style="padding-left: 10px"/>
                            <h:outputText value="#{msgItem.auditUserName}"  style="padding-left: 10px"/>
                        </p:dataList>
                        <p:commandButton value="#{msg.addMessage}"  process="@this" update="woTab:msgAddDlg" oncomplete="PF('msgAddDlg').show();" />
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
        </c:forEach>
    </p:fieldset>



</ui:composition>
