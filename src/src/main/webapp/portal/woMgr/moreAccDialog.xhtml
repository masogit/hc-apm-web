<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition> <!--备件对话框 维修-->
    <p:dialog id="moreAccDialogDlg" class="moreAccDialogDlg" widgetVar="moreAccDialogDlg" modal="true" width="1250"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.accessory}">
        <h:form id="moreAccDialogForm" >
            <h:panelGroup id="display42" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.PartName}*</label>
                        <p:inputText id="parts" value="#{workOrderMgrController.itemDetail.parts}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.PartQuantity}*</label>
                        <p:inputNumber  maxValue="999999" decimalPlaces="0"  id="apartsQuantity" value="#{workOrderMgrController.itemDetail.apartsQuantity}" required="true" requiredMessage="备件(数量) #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedUnitPriceRMB}*</label>
                        <p:inputNumber disabled="#{workOrderMgrController.nochange}" decimalPlaces="4" maxValue="99999999" id="partsPrice"  value="#{workOrderMgrController.itemDetail.partsPrice}" required="true" requiredMessage="备件单价(元) #{msg.ValidationRequire}" >
                            <p:ajax listener="#{workOrderMgrController.partsPriceUpdate()}" update="@(.contractPrice)" >
                        </p:ajax>

                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.PartType}</label>
                        <p:selectOneMenu value="#{workOrderMgrController.itemDetail.partsType}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                     <label class="label">#{msg.invoiceNum}</label>
                        <p:inputText value="#{workOrderMgrController.itemDetail.invoiceNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.InvoicingTime}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd" value="#{workOrderMgrController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <!--<h:panelGroup>
                       <label class="label">#{msg.vendor}<span style="color:red">#{workOrderMgrController.customConfig.assetFields['vendor'].required? '*':''}</span></label>

                       <p:autoComplete id="vendor" dropdown="true" value="#{workOrderMgrController.selectedObjectMap['supplier']}" scrollHeight="300"
                                       forceSelection="true"  required="#{workOrderMgrController.customConfig.assetFields['vendor'].required}"  requiredMessage="#{msg.vendor} #{msg.ValidationRequire}"
                                       completeMethod="#{workOrderMgrController.autoCompleteSupplier}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter" class="inputVendor">
                           <p:ajax event="itemSelect" listener="#{workOrderMgrController.onSupplierChange('supplier')}" update="@(.vendorChange)"/>
                           <p:ajax listener="#{workOrderMgrController.onSupplierChange('supplier')}" />
                       </p:autoComplete>
                       <p:commandButton id="createSupplierButton1" icon="ui-icon-plus" title="#{msg.Create}" process="@this" actionListener="#{workOrderMgrController.prepareCreateSupplier}" update="SupplierEditDlg" oncomplete="PF('SupplierEditDialog').show()"/>
                   </h:panelGroup>-->
                    <h:panelGroup>
                        <label class="label">#{msg.InvoiceProvider}</label>
                        <p:autoComplete id="vendor" dropdown="true" value="#{workOrderMgrController.selectedObjectMap['supplier']}" scrollHeight="300" forceSelection="true"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}" completeMethod="#{workOrderMgrController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrController.onSupplierChange()}"/>
                            <p:ajax listener="#{workOrderMgrController.onSupplierChange()}" />
                        </p:autoComplete>
                        <p:commandButton id="createSupplierButton" icon="ui-icon-plus" action="#{workOrderMgrController.prepareCreateSupplier}" title="#{msg.Create}" process="@this"  update="@(.SupplierEditDlgCls)" oncomplete="PF('SupplierEditDialog').show()"/>

                    </h:panelGroup>
                   <!-- <h:panelGroup>
                        <label class="label">供应商&#45;&#45;</label>
                        <p:autoComplete id="vendor" dropdown="true" value="#{workOrderMgrController.supplierName}" scrollHeight="300" forceSelection="false"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}" completeMethod="#{workOrderMgrController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrController.onSupplierChange()}"/>
                            <p:ajax listener="#{workOrderMgrController.onSupplierChange()}" />
                        </p:autoComplete>
                        <p:commandButton id="createSupplierButton" icon="ui-icon-plus" action="#{assetInfoEditController.prepareCreateSupplier}" title="#{msg.Create}" process="@this"  oncomplete="PF('SupplierEditDialog').show()"/>
                    </h:panelGroup>-->
                    <h:panelGroup>
                        <label class="label">#{msg.contractNo}</label>
                        <p:inputText value="#{workOrderMgrController.itemDetail.contractNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ContractPriceRMB}</label>
                        <p:inputNumber  decimalPlaces="4" maxValue="99999999" id="closedPrice" class="contractPrice"  value="#{workOrderMgrController.itemDetail.closedPrice}">

                            <p:ajax listener="#{workOrderMgrController.closePrcieUpdate()}">
                            </p:ajax>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ApplyTime}</label>
                        <p:calendar disabled="#{workOrderMgrController.nochange}" timeZone="GMT+8" label="申请时间" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedArrivalTime}</label>
                        <p:calendar timeZone="GMT+8" label="预计到达时间" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.qualityexpirdate}</label>
                        <p:calendar timeZone="GMT+8" label="取物时间" pattern="yyyy/MM/dd" value="#{workOrderMgrController.itemDetail.warrantyDate}" showOn="button"
                                    readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.assetsDashboardclm2}</label>
                        <p:inputText value="#{workOrderMgrController.itemDetail.serialNum}"/>
                    </h:panelGroup>
                    <p:column headerText="#{msg.arrival}">
                        <p:selectBooleanButton   value="#{workOrderMgrController.itemDetail.arrived}" onLabel="已到货" offLabel="未到货">
                            <p:ajax listener="#{workOrderMgrController.arrivalTimeSet}" event="change"></p:ajax>
                        </p:selectBooleanButton>
                        <p:selectBooleanButton   value="#{workOrderMgrController.itemDetail.closed}" onLabel="已结单" offLabel="未结单">
                            <p:ajax listener="#{workOrderMgrController.orderSet}" event="change"></p:ajax>
                        </p:selectBooleanButton>
                    </p:column>
                    <h:panelGroup>
                        <label class="label">#{msg.Remark}</label>
                        <p:inputTextarea id="area" value="#{workOrderMgrController.itemDetail.comment}"/>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.addAcessItem}" value="#{msg.Save}" update="woTab:repairCompleteDialogForm:accessList @(.cl3) :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogDlg');"/>
                    <p:commandButton immediate="true" actionListener="#{workOrderMgrController.cancelWorkdetail}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogDlg');"/>
                    <p:commandButton actionListener="#{workOrderMgrController.saveAndadd(1)}" rendered="#{workOrderMgrController.switchTmp}" value="#{msg.SaveAndAdd}" update="woTab:moreAccDialogForm woTab:repairCompleteDialogForm:accessList :growl" icon="ui-icon-check"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
        <ui:include src="createSupplierAcc.xhtml" />
    </p:dialog>

</ui:composition>
</html>
