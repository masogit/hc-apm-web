<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="moreAccDialogDlg" class="moreAccDialogDlg" widgetVar="moreAccDialogDlg" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="备件">
        <h:form id="moreAccDialogForm" >
            <h:panelGroup id="display42" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">备件名称*</label>
                        <p:inputText id="parts" value="#{workOrderMgrController.itemDetail.parts}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备件(数量)*</label>
                        <p:inputNumber  maxValue="999999" decimalPlaces="0"  id="apartsQuantity" value="#{workOrderMgrController.itemDetail.apartsQuantity}" required="true" requiredMessage="备件(数量) #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备件单价(元)*</label>
                        <p:inputNumber  decimalPlaces="4" maxValue="99999999" id="partsPrice"  value="#{workOrderMgrController.itemDetail.partsPrice}" required="true" requiredMessage="备件单价(元) #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">类型</label>
                        <p:selectOneMenu value="#{workOrderMgrController.itemDetail.partsType}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">申请时间</label>
                        <p:calendar timeZone="GMT+8" label="申请时间" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">预计到达时间</label>
                        <p:calendar timeZone="GMT+8" label="预计到达时间" pattern="yyyy/MM/dd HH:mm" value="#{workOrderMgrController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">质保期</label>
                        <p:calendar timeZone="GMT+8" label="取物时间" pattern="yyyy/MM/dd" value="#{workOrderMgrController.itemDetail.warrantyDate}" showOn="button"
                                    readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">序列号</label>
                        <p:inputText value="#{workOrderMgrController.itemDetail.serialNum}"/>
                    </h:panelGroup>
                    <!--xxxxxxxzssssssssssssssssssssss-->
                    <h:panelGroup>
                    <label class="label">发票号</label>
                     <p:inputText value="#{workOrderMgrController.itemDetail.invoiceNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                    <label class="label">维修合同号</label>
                     <p:inputText value="#{workOrderMgrController.itemDetail.contractNum}"/>
                    </h:panelGroup>
                    <!--value="#{workOrderMgrController.selectedObjectMap['supplier']}"-->
                    <h:panelGroup>
                        <label class="label">供应商</label>
                        <p:autoComplete id="vendor" dropdown="true" value="#{workOrderMgrController.supplierName}" scrollHeight="300"
                                        forceSelection="false"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}"
                                        completeMethod="#{workOrderMgrController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                            <p:ajax event="itemSelect" listener="#{workOrderMgrController.onSupplierChange()}"/>
                            <p:ajax listener="#{workOrderMgrController.onSupplierChange()}" />
                        </p:autoComplete>
                        <!-- <p:inputText value="#{workOrderMgrController.itemDetail.invoiceNum}"/>-->
                    </h:panelGroup>

                    <h:panelGroup>
                    <label class="label">开票时间</label>
                        <p:calendar timeZone="GMT+8" label="预计到达时间" pattern="yyyy/MM/dd" value="#{workOrderMgrController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <p:column headerText="到货">
                        <p:selectBooleanButton   value="#{workOrderMgrController.itemDetail.arrived}" onLabel="已到货" offLabel="未到货">
                            <p:ajax listener="#{workOrderMgrController.arrivalTimeSet}" event="change"></p:ajax>
                        </p:selectBooleanButton>
                        <p:selectBooleanButton   value="#{workOrderMgrController.itemDetail.closed}" onLabel="已结单" offLabel="未结单">
                            <p:ajax listener="#{workOrderMgrController.orderSet}" event="change"></p:ajax>
                        </p:selectBooleanButton>
                    </p:column>
                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea id="area" value="#{workOrderMgrController.itemDetail.comment}"/>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.addAcessItem}" value="#{msg.Save}" update="woTab:repairCompleteDialogForm:accessList :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogDlg');"/>
                    <p:commandButton immediate="true" actionListener="#{workOrderMgrController.cancelWorkdetail}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
