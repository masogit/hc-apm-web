<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="toCloseDialog" widgetVar="toCloseDialog" modal="true"  resizable="true" draggable="true" width="1000" appendTo="@(body)" header="关单--" >
        <h:form id="toCloseDialogForm" >
            <h:panelGroup id="display3" rendered="#{not empty workOrderMgrController.selectedWorkOrder}">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">故障类别</label>
                        <p:selectOneMenu  value="#{workOrderMgrController.selectedWorkOrder.caseType}" required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}">
                            <f:selectItems value="#{workOrderMgrController.getAssetFaultType()}" var="item" itemLabel="#{item.faultName}" itemValue="#{item.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">问题描述</label>
                        <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patProblems}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">解决方案</label>
                        <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patActions}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">测试方法</label>
                        <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.patTests}" rows="3"  cols="40"  queryDelay="750" minQueryLength="4"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea value="#{workOrderMgrController.selectedWorkOrder.comment}" rows="3"  cols="40"  queryDelay="750" minQueryLength="4"/>
                    </h:panelGroup>

                    <h:panelGroup  id="equipmentTaker" >
                        <label class="label">取物人</label>
                        <p:inputText id="taker" value="#{workOrderMgrController.equipmentTaker}"  maxlength="40" readonly="#{not empty workOrderMgrController.equipmentTaker}" required="true" requiredMessage="取物人#{msg.ValidationRequire}"/>
                        <p:commandButton title="取物" process="@(equipmentTaker)" actionListener="#{workOrderMgrController.takeEquip}" update=":toCloseDialogForm:equipmentTaker" disabled="#{not empty workOrderMgrController.equipmentTaker}"/>
                    </h:panelGroup>


                </p:panelGrid>
                <p:fieldset legend="费用明细" >

                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">工时(小时)</label>
                            <p:inputText value="#{workOrderMgrController.selectedWorkOrder.manHours}" readonly="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">其它费用</label>
                            <p:inputText value="#{workOrderMgrController.selectedWorkOrder.otherExpense}" readonly="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:dataTable id="accessList" class="uiTransparent" value="#{workOrderMgrController.getWorkOrderDetail(workOrderMgrController.selectedWorkOrder.id)}" var="item" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.accessory}">
                                    <h:outputText value="#{item.parts}"/>
                                </p:column>

                                <p:column headerText="#{msg.accessoryQuantity}">
                                    <h:outputText value="#{item.apartsQuantity}"/>
                                </p:column>
                                <p:column headerText="#{msg.accessoryPrice}">
                                    <h:outputText value="#{item.partsPrice}"/>
                                </p:column>

                            </p:dataTable>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:dataTable id="coworkerList" class="uiTransparent" value="#{workOrderMgrController.getWorkOrderCoworker(workOrderMgrController.selectedWorkOrder.id)}" var="item" widgetVar="coworkerDataList" lazy="false" paginator="false"
                                         rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.manHours}">
                                    <h:outputText value="#{item.manHours}" />
                                </p:column>
                                <p:column headerText="#{msg.coworker}">
                                    <h:outputText value="#{item.cowokerUserName}"/>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </p:panelGrid>

                </p:fieldset>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.closeWorkOrder}" value="#{msg.closeWo}" update=":woMgrListForm :woMgrDetailForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'toCloseDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderMgrController.cancel()}" icon="ui-icon-cancel" onclick="PF('toCloseDialog').hide()"/>
                </h:panelGroup>

                <br/>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
