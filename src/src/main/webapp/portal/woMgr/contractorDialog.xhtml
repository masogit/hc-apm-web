<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>

    <p:dialog class="contractorDlg" id="contractorDlg" widgetVar="contractorDlg" modal="true" width="550"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.addContractor}">
        <h:form id="contractorDlgForm" >
            <h:panelGroup  rendered="#{not empty workOrderMgrController.externalTempUser}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup >
                        <label class="label">#{msg.userName}*</label>
                        <p:inputText id="userName" value="#{workOrderMgrController.externalTempUser.userName}" required="true" />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">#{msg.contactPhone}*</label>
                        <p:inputText id="tel" value="#{workOrderMgrController.externalTempUser.tel}" required="true"  />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">#{msg.zkbEngineer_companyName}*</label>
                        <p:inputText id="comName" value="#{workOrderMgrController.externalTempUser.comName}" required="true"  />
                    </h:panelGroup>
                </p:panelGrid>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderMgrController.editContractor}" value="#{msg.Save}" update="woTab:repairCompleteDialogForm:externalTempUserList :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'contractorDlg');"/>
                    <p:commandButton immediate="true"  value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'contractorDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
