<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:p="http://primefaces.org/ui"
				template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<div class="ui-g-12 card cardTitle">
					<p:outputLabel class="pageTitle" value="出入库记录"/>
				</div>
				<h:form id="searchForm">
					<h:panelGrid id="searchPanel" columns="3">
						<h:panelGroup>
							<p:selectOneMenu id="recordType" value="#{sparePartStockRecordController.filterRecordType}">
								<p:ajax update=":recordPartForm:datalist" />
								<f:selectItem value="1" itemLabel="入库"/>
								<f:selectItem value="2" itemLabel="出库"/>
							</p:selectOneMenu>
						</h:panelGroup>
						<h:panelGroup>
							<label class="label">#{msg.StartTime}*</label>
							<p:calendar id="StartTime" timeZone="#{userContextService.getTimeZone()}"  pattern="#{userContextService.timeFormat()}" locale = "#{userContextService.getCalendarLocale()}" value="#{sparePartStockRecordController.startTime}" showOn="button" disabled="false" showButtonPanel="true" navigator="true" mask="true"/>
							<label class="label">#{msg.EndTime}*</label>
							<p:calendar  id="endTime" timeZone="#{userContextService.getTimeZone()}"  pattern="#{userContextService.timeFormat()}" locale = "#{userContextService.getCalendarLocale()}" value="#{sparePartStockRecordController.endTime}" showOn="button" disabled="false" showButtonPanel="true" navigator="true" mask="true"/>
							<p:commandButton update=":recordPartForm:datalist" value="查询" />
						</h:panelGroup>
					</h:panelGrid>
				</h:form>
				<h:form id="recordPartForm">
					<p:panelGrid columns="1" layout="grid">
						<h:panelGroup>
							<p:dataTable id="datalist" value="#{sparePartController.lazyModel}" var="item" widgetVar="varDataList"
										 selectionMode="single" selection="#{sparePartController.selected}"
										 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
										 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
										 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
										 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
										 rows="20" emptyMessage="#{msg.noRecordFound}"
										 rowsPerPageTemplate="20,50,100,500">

								<p:ajax event="rowSelect" listener="#{sparePartController.onSelect}" update="addButton editButton deleteButton tenantButton"/>
								<p:ajax event="filter" listener="#{sparePartController.onFilter}" update="addButton editButton deleteButton tenantButton"/>
								<p:column headerText="备件名称" filterBy="#{item.name}" filterMatchMode="LIKE">
									<h:outputText value="#{item.name}"/>
								</p:column>
								<p:column headerText="规格型号">
									<h:outputText value="#{item.model}" />
								</p:column>
								<p:column headerText="序列号">
									<h:outputText value="#{item.serialNumber}" />
								</p:column>
								<p:column headerText="厂家">
									<h:outputText value="#{item.manufacturer}" />
								</p:column>
								<p:column headerText="供应商">
									<h:outputText value="#{item.supplier}" />
								</p:column>
								<p:column headerText="单位">
									<h:outputText value="#{item.unit}" />
								</p:column>
								<p:column headerText="数量">
									<h:outputText value="#{item.quantity}" />
								</p:column>
								<p:column headerText="单价">
									<h:outputText value="#{item.unitPrice}" />
								</p:column>
								<p:column headerText="总价">
									<h:outputText value="#{item.totalPrice}" />
								</p:column>
								<p:column headerText="仓库">
									<h:outputText value="#{item.partsWarehouse.name}" />
								</p:column>
								<p:column headerText="入库人" rendered="#{item.recordType eq 1}">
									<h:outputText value="#{item.warehouseOprPerson}" />
								</p:column>
								<p:column headerText="入库时间" rendered="#{item.recordType eq 1}">
									<h:outputText value="#{item.recordDate}">
										<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
									</h:outputText>
								</p:column>
								<p:column headerText="出库时间" rendered="#{item.recordType eq 2}">
									<h:outputText value="#{item.recordDate}" >
										<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
									</h:outputText>
								</p:column>
								<p:column headerText="出库人" rendered="#{item.recordType eq 2}">
									<h:outputText value="#{item.warehouseOprPerson}" />
								</p:column>
								<p:column headerText="领取科室" rendered="#{item.recordType eq 2}">
									<h:outputText value="#{item.receivingDepartment}" />
								</p:column>
								<f:facet name="{Toolbar}">
									<p:commandButton id="exportButton" title="#{msg.exportToXLS}"  icon="ui-icon-plus" class="btn btn-sm btn-gray" />
								</f:facet>
							</p:dataTable>
						</h:panelGroup>
					</p:panelGrid>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
