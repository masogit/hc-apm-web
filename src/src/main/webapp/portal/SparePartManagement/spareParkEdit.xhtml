<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="pkEditDlg" widgetVar="pkEditDialog" width="1000" height="650" modal="true" resizable="true" draggable="true" appendTo="@this" header="备件编辑" closable="false">
        <h:form id="pkEditForm">
            <h:panelGroup id="display">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup >
                        <label class ="label">备件名称* </label>
                        <p:inputText id="name" value="#{sparePartController.selected.name}"  required="true" requiredMessage="备件名称必填" />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">规格型号 </label>
                        <p:inputText id="model" value="#{sparePartController.selected.model}"  />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">序列号 </label>
                        <p:inputText id="serialNumber" value="#{sparePartController.selected.serialNumber}"  />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">厂家 </label>
                        <p:inputText id="manufacturer" value="#{sparePartController.selected.manufacturer}"  />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">供应商 </label>
                        <p:inputText id="supplier" value="#{sparePartController.selected.supplier}"  />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">单位 </label>
                        <p:inputText id="unit" value="#{sparePartController.selected.unit}"  />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">数量* </label>
                        <p:outputLabel id="quantity" value="#{sparePartController.selected.quantity}"/>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">单价* </label>
                        <p:outputLabel id="unitPrice" value="#{sparePartController.selected.unitPrice}"/>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">总价* </label>
                        <p:outputLabel id="totalPrice" value="#{sparePartController.totalPrice(sparePartController.selected.unitPrice, sparePartController.selected.quantity)}" rendered="#{not empty sparePartController.selected}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class ="label">发票号* </label>
                        <p:inputText id="invoiceNumber" value="#{sparePartController.selected.invoiceNumber}" />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">备注 </label>
                        <p:inputText id="remark" value="#{sparePartController.selected.remark}"  />
                    </h:panelGroup>
                    <h:panelGroup rendered="${userContextService.hasCurrentTenantName('')}">
                        <label class ="label">适用设备 </label>
                        <p:inputText id="adaptingDevices" value="#{sparePartController.selected.adaptingDevices}"  />
                    </h:panelGroup>
                    <h:panelGroup rendered="${userContextService.hasCurrentTenantName('')}">
                        <label class ="label">有效期 </label>
                        <p:calendar id="effectiveDate" timeZone="#{userContextService.getTimeZone()}"  pattern="#{userContextService.timeFormat()}" locale = "#{userContextService.getCalendarLocale()}" value="#{sparePartController.selected.effectiveDate}" showOn="button" disabled="false" showButtonPanel="true" navigator="true" mask="true" />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">仓库* </label>
                        <p:selectOneMenu id="partsWarehouseId" value="#{sparePartController.partsWarehouseId}" disabled="true">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{sparePartController.warehouses}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <p:commandButton validateClient="true" actionListener="#{sparePartController.saveEdit()}" value="#{msg.Save}" update="display,:pkEditForm, :sparePartForm:datalist, :growl, :pkEditForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pkEditDialog');"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{sparePartController.cancel()}" icon="ui-icon-cancel" update=":sparePartForm:datalist" onclick="PF('pkEditDialog').hide()" />
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
