<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:p="http://primefaces.org/ui"
				template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12">
				<div class="ui-g-12 card cardTitle">
					<p:outputLabel class="pageTitle" value="备件出入库"/>
				</div>
				<h:form id="sparePartForm">
					<p:panelGrid columns="1" layout="grid">
						<h:panelGroup>
							<p:dataTable id="datalist" value="#{sparePartController.lazyModel}" var="item" widgetVar="varDataList"
										 selectionMode="single" selection="#{sparePartController.selected}"
										 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
										 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
										 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
										 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
										 rows="20" emptyMessage="#{msg.noRecordFound}"
										 rowsPerPageTemplate="20,50,100,500">

								<p:ajax event="rowSelect" listener="#{sparePartController.onSelect}" update="addButton editButton  deleteButton"/>
								<p:ajax event="filter" listener="#{sparePartController.onFilter}" update="addButton editButton  deleteButton"/>
								<p:column headerText="备件名称" filterBy="#{item.name}" filterMatchMode="LIKE">
									<h:outputText value="#{item.name}"/>
								</p:column>
								<p:column headerText="规格型号" filterBy="#{item.model}" filterMatchMode="LIKE">
									<h:outputText value="#{item.model}" />
								</p:column>
								<p:column headerText="序列号" filterBy="#{item.serialNumber}" filterMatchMode="LIKE">
									<h:outputText value="#{item.serialNumber}" />
								</p:column>
								<p:column headerText="厂家" filterBy="#{item.manufacturer}" filterMatchMode="LIKE">
									<h:outputText value="#{item.manufacturer}" />
								</p:column>
								<p:column headerText="供应商" filterBy="#{item.supplier}" filterMatchMode="LIKE">
									<h:outputText value="#{item.supplier}" />
								</p:column>
								<p:column headerText="单位">
									<h:outputText value="#{item.unit}" />
								</p:column>
								<p:column headerText="数量">
									<h:outputText value="#{item.quantity}" />
								</p:column>
								<p:column headerText="单价">
									<h:outputText value="#{item.unitPrice}" />
								</p:column>
								<p:column headerText="总价">
									<h:outputText value="#{sparePartController.totalPrice(item.unitPrice, item.quantity)}" />
								</p:column>
								<p:column headerText="发票号">
									<h:outputText value="#{item.invoiceNumber}" />
								</p:column>
								<p:column headerText="适用设备" rendered="${userContextService.hasCurrentTenantName('')}">
									<h:outputText value="#{item.adaptingDevices}" />
								</p:column>
								<p:column headerText="有效期" rendered="${userContextService.hasCurrentTenantName('')}">
									<h:outputText value="#{item.effectiveDate}" >
										<f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd"/>
									</h:outputText>
								</p:column>
								<p:column headerText="备注">
									<h:outputText value="#{item.remark}" />
								</p:column>
								<p:column headerText="仓库" filterBy="#{item.partsWarehouse.name}" filterMatchMode="LIKE">
									<h:outputText value="#{item.partsWarehouse.name}" />
								</p:column>
								<p:column headerText="附件" rendered="#{userContextService.hasCurrentTenantName('')}">
									<p:commandButton id="findAttach" value="#{sparePartController.hasBlob(item.id)? '查看':'新增'}" actionListener="#{sparePartController.clickSelectAttach(item)}" update="@(.updateTrCls) sidebar" oncomplete="PF('sidebar').show()"/>
								</p:column>
								<p:column headerText="操作" >
									<p:commandButton id="outButton" value="出库" actionListener="#{sparePartController.outStock(item)}" update="@(.updateTrCls) :pkOutDlg :pkOutForm:outQuantity" oncomplete="PF('pkOutDialog').show()"/>
								</p:column>
								<f:facet name="{Toolbar}">
									<p:commandButton id="addButton" title="#{msg.Create}"  icon="ui-icon-plus" class="btn btn-sm btn-gray" actionListener="#{sparePartController.prepareCreate}"  update="@(.updateTrCls) :pkInDlg" oncomplete="PF('pkInDialog').show()"/>

									<p:commandButton id="editButton"  title="#{msg.Edit}"  icon="ui-icon-pencil" class="btnEdit" actionListener="#{sparePartController.prepareEdit}" update="@(.updateTrCls) :pkEditDlg" disabled="#{empty sparePartController.selected.id}" oncomplete="PF('pkEditDialog').show()"/>
									
									<p:commandButton id="deleteButton" disabled="#{empty sparePartController.selected.id or sparePartController.AreThereNnyOutboundRecords(sparePartController.selected.id)}" title="#{msg.Delete}" process="@this" actionListener="#{sparePartController.delete}" update=":sparePartForm:datalist, :growl"  icon="ui-icon-close" class="delBtn" >
										<p:confirm header="#{msg.DeleteConformation}"
												   message="确定删除该备件？"
												   icon="ui-icon-warning"/>
									</p:commandButton>
								</f:facet>
							</p:dataTable>
						</h:panelGroup>
					</p:panelGrid>
				</h:form>
				<p:panelGrid columns="1" layout="grid" rendered="${userContextService.hasCurrentTenantName('')}">
					<h:panelGroup>
						<p:sidebar id="sidebar" widgetVar="sidebar" position="left" style="width: 100%;height: 50%; " >
							<h3>附件列表</h3>
							<p:dataGrid id="pic" var="fileitem" value="#{sparePartController.picList}" columns="5" layout="grid">
								<p:panel  style="text-align:center">
									<h:panelGrid columns="1" style="width:100%" >
										<p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>
										<p:commandButton actionListener="#{sparePartController.removeAttachmentById(fileitem.id)}" update="pic :sparePartForm :uploadPicForm:uploadPic" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
											<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
										</p:commandButton>
									</h:panelGrid>
								</p:panel>
							</p:dataGrid>
							<h:form id="uploadPicForm">
								<p:fileUpload id="uploadPic" disabled="#{sparePartController.disableUploadButton()}" allowTypes="/(\.|\/)(jpeg|jpg|png)$/" fileUploadListener="#{sparePartController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false" sizeLimit="10000000" update="@this pic" auto="true" invalidFileMessage="图片类型应该为png,jpeg,jpg" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>
							</h:form>
						</p:sidebar>
					</h:panelGroup>
				</p:panelGrid>
				<ui:include src="spareParkEdit.xhtml"/>
				<ui:include src="spareParkIn.xhtml"/>
				<ui:include src="spareParkOut.xhtml"/>
			</div>
		</div>
	</ui:define>
</ui:composition>
