<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:p="http://primefaces.org/ui"
				template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<div class="ui-g-12 card cardTitle">
					<p:outputLabel class="pageTitle" value="简易备件管理"/>
				</div>
				<h:form id="sparePartForm">
					<p:panelGrid columns="1" layout="grid">
						<h:panelGroup>
							<p:dataTable id="datalist" value="#{sparePartController.lazyModel}" var="item" widgetVar="varDataList"
										 selectionMode="single" selection="#{sparePartController.selected}"
										 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
										 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
										 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
										 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
										 rows="20" emptyMessage="#{msg.noRecordFound}"
										 rowsPerPageTemplate="20,50,100,500">

								<p:ajax event="rowSelect" listener="#{sparePartController.onSelect}" update="addButton editButton deleteButton tenantButton"/>
								<p:ajax event="filter" listener="#{sparePartController.onFilter}" update="addButton editButton deleteButton tenantButton"/>
								<p:column headerText="备件名称" filterBy="#{item.name}" filterMatchMode="LIKE">
									<h:outputText value="#{item.name}"/>
								</p:column>
								<p:column headerText="规格型号">
									<h:outputText value="#{item.model}" />
								</p:column>
								<p:column headerText="序列号">
									<h:outputText value="#{item.serialNumber}" />
								</p:column>
								<p:column headerText="厂家">
									<h:outputText value="#{item.manufacturer}" />
								</p:column>
								<p:column headerText="供应商">
									<h:outputText value="#{item.supplier}" />
								</p:column>
								<p:column headerText="单位">
									<h:outputText value="#{item.unit}" />
								</p:column>
								<p:column headerText="数量">
									<h:outputText value="#{item.quantity}" />
								</p:column>
								<p:column headerText="单价">
									<h:outputText value="#{item.unitPrice}" />
								</p:column>
								<p:column headerText="总价">
									<h:outputText value="#{item.totalPrice}" />
								</p:column>
								<p:column headerText="仓库">
									<h:outputText value="#{item.partsWarehouse.name}" />
								</p:column>
								<p:column  headerText="出库" >
									
								</p:column>
								<f:facet name="{Toolbar}">
									<p:commandButton id="addButton" title="#{msg.Create}"  icon="ui-icon-plus" class="btn btn-sm btn-gray" actionListener="#{sparePartController.prepareCreate}"  update="@(.updateTrCls) :pkInDlg" oncomplete="PF('pkInDialog').show()"/>

									<p:commandButton id="editButton"  title="#{msg.Edit}"  icon="ui-icon-pencil" class="btnEdit" actionListener="#{sparePartController.prepareEdit}" update="@(.updateTrCls) :pkEditDlg" disabled="#{empty sparePartController.selected.id}" oncomplete="PF('pkEditDialog').show()"/>
									
									<p:commandButton id="deleteButton" disabled="#{empty sparePartController.selected.id}" title="#{msg.Delete}" process="@this" actionListener="#{sparePartController.delete}" update=":sparePartForm:datalist, :growl"  icon="ui-icon-close" class="delBtn" >
										<p:confirm header="#{msg.DeleteConformation}"
												   message="确定删除该备件？"
												   icon="ui-icon-warning"/>
									</p:commandButton>
								</f:facet>
							</p:dataTable>
						</h:panelGroup>
					</p:panelGrid>
				</h:form>
				<ui:include src="spareParkEdit.xhtml"/>
				<ui:include src="spareParkIn.xhtml"/>
				<ui:include src="spareParkOut.xhtml"/>
			</div>
		</div>
	</ui:define>
</ui:composition>
