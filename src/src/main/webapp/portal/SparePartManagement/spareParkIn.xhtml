<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="pkInDlg" widgetVar="pkInDialog" width="1000" height="650" modal="true" resizable="true" draggable="true" appendTo="@this" header="备件入库" closable="false">
            <h:form id="pkInForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class ="label">备件名称* </label>
                            <p:inputText id="name" value="#{sparePartController.selected.name}" required="true" requiredMessage="备件名称必填"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">规格型号 </label>
                            <p:inputText id="model" value="#{sparePartController.selected.model}"  />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">序列号 </label>
                            <p:inputText id="serialNumber" value="#{sparePartController.selected.serialNumber}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">厂家 </label>
                            <p:inputText id="manufacturer" value="#{sparePartController.selected.manufacturer}"  />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">供应商 </label>
                            <p:inputText id="supplier" value="#{sparePartController.selected.supplier}"  />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">单位 </label>
                            <p:inputText id="unit" value="#{sparePartController.selected.unit}"  />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">数量* </label>
                            <p:inputText id="quantity" value="#{sparePartController.selected.quantity}"  required="true" requiredMessage="数量必填">
                                <f:validateLongRange minimum="1" />
                                <p:ajax event="change" update=":pkInForm:totalPrice" />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">单价 </label>
                            <p:inputText id="unitPrice" value="#{sparePartController.selected.unitPrice}" >
                                <f:validateDoubleRange minimum="0" />
                                <p:ajax event="change" update=":pkInForm:totalPrice"/>
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">总价 </label>
                            <p:inputText id="totalPrice" value="#{sparePartController.totalPrice()}" rendered="#{not empty sparePartController.selected}" readonly="true"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">发票号 </label>
                            <p:inputText id="invoiceNumber" value="#{sparePartController.selected.invoiceNumber}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">备注 </label>
                            <p:inputText id="remark" value="#{sparePartController.selected.remark}"  />
                        </h:panelGroup>
                        <h:panelGroup rendered="${userContextService.hasCurrentTenantName('')}">
                            <label class ="label">适用设备 </label>
                            <p:inputText id="adaptingDevices" value="#{sparePartController.selected.adaptingDevices}"  />
                        </h:panelGroup>
                        <h:panelGroup rendered="${userContextService.hasCurrentTenantName('')}">
                            <label class ="label">有效期 </label>
                            <p:calendar id="effectiveDate" timeZone="#{userContextService.getTimeZone()}"  pattern="#{userContextService.timeFormat()}" locale = "#{userContextService.getCalendarLocale()}" value="#{sparePartController.selected.effectiveDate}" showOn="button" disabled="false" showButtonPanel="true" navigator="true" mask="true" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">仓库* </label>
                            <p:selectOneMenu id="partsWarehouseId" value="#{sparePartController.partsWarehouseId}" required="true" requiredMessage="仓库必填">
                                <f:selectItems value="#{sparePartController.warehouses}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:fieldset legend="备件照片" rendered="${userContextService.hasCurrentTenantName('')}">
                        <p:dataGrid id="pictureList" var="fileitem" value="#{sparePartController.tempFile}" columns="5" layout="grid">
                            <p:panel  style="text-align:center">
                                <h:panelGrid columns="1" style="width:100%" >
                                    <p:graphicImage value="#{sparePartController.getStreamedContent(fileitem)}" height="80" width="100" stream="false"/>
                                    <p:commandButton actionListener="#{sparePartController.removeTempAttachment(fileitem)}" update="pictureList pkInForm:pic" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>
                                </h:panelGrid>
                            </p:panel>
                        </p:dataGrid>
                        <p:fileUpload id="pic" disabled="#{sparePartController.disableUploadButton_temp()}" allowTypes="/(\.|\/)(jpeg|jpg|png)$/" fileUploadListener="#{sparePartController.tempFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false" sizeLimit="10000000" update="@this pictureList" auto="true" invalidFileMessage="图片类型应该为png,jpeg,jpg" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>
                    </p:fieldset>
                    <p:commandButton validateClient="true" actionListener="#{sparePartController.save()}" value="#{msg.Save}" update="display,:pkInForm, :sparePartForm:datalist, :growl, :pkInForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pkInDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{sparePartController.cancel()}" icon="ui-icon-cancel" update=":sparePartForm:datalist" onclick="PF('pkInDialog').hide()" />
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
