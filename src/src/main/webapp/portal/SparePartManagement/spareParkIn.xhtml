<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="pkInDlg" widgetVar="pkInDialog" width="1000" height="650" modal="true" resizable="true" draggable="true" appendTo="@this" header="备件入库" closable="false">
            <h:form id="pkInForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class ="label">备件名称* </label>
                            <p:inputText id="name" value="#{sparePartController.selected.name}" required="true" requiredMessage="备件名称必填"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">规格型号 </label>
                            <p:inputText id="model" value="#{sparePartController.selected.model}"  />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">序列号 </label>
                            <p:inputText id="serialNumber" value="#{sparePartController.selected.serialNumber}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">厂家 </label>
                            <p:inputText id="manufacturer" value="#{sparePartController.selected.manufacturer}"  />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">供应商 </label>
                            <p:inputText id="supplier" value="#{sparePartController.selected.supplier}"  />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">单位 </label>
                            <p:inputText id="unit" value="#{sparePartController.selected.unit}"  />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">数量* </label>
                            <p:inputText id="quantity" value="#{sparePartController.selected.quantity}"  required="true" requiredMessage="数量必填">
                                <f:validateLongRange minimum="1" />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">单价* </label>
                            <p:inputText id="unitPrice" value="#{sparePartController.selected.unitPrice}" required="true" requiredMessage="单价必填">
                                <f:validateDoubleRange minimum="0.01" />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">总价* </label>
                            <p:inputText id="totalPrice" value="#{sparePartController.selected.totalPrice}"  readonly="true" required="true" requiredMessage="总价必须计算"/>
                            <p:commandButton value="计算" actionListener="#{sparePartController.totalPrice}" update="totalPrice"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">仓库* </label>
                            <p:selectOneMenu id="partsWarehouseId" value="#{sparePartController.partsWarehouseId}" required="true" requiredMessage="仓库必填">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{sparePartController.warehouses}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:commandButton validateClient="true" actionListener="#{sparePartController.save()}" value="#{msg.Save}" update="display,:pkInForm, :sparePartForm:datalist, :growl, :pkInForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pkInDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{sparePartController.cancel()}" icon="ui-icon-cancel" update=":sparePartForm:datalist" onclick="PF('pkInDialog').hide()" />
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
