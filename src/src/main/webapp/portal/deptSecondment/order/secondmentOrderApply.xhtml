<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">

        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="全院科室间设备调剂管理"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="secondmentOrderAsset">
                    <p:dataTable id="datalist" value="#{secondmentOrderAssetController.lazyModel}"
                                 var="item"
                                 widgetVar="secondmentOrderAssetList"
                                 lazy="true" paginator="true" paginatorPosition="both"
                                 paginatorAlwaysVisible="true"
                                 selectionMode="single"  selection="#{secondmentOrderAssetController.selected}"
                                 sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="10,20,50,100">

                        <p:ajax event="rowSelect" update="" />
                        <p:ajax event="filter" listener="#{secondmentOrderAssetController.onFilter}" update="datalist"/>

                        <p:column headerText="#{msg.assetName}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}" />
                        </p:column>
                        <p:column headerText="#{msg.functionType}"  filterBy="#{item.functionType}" filterMatchMode="EQ">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                        <p:column headerText="#{msg.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                            <f:facet name="filter" >
                                <p:selectOneMenu onchange="PF('secondmentOrderAssetList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                        </p:column>
                        <p:column headerText="#{msg.departNum}" >
                            <h:outputText value="#{item.departNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.qrCode}" >
                            <h:outputText value="#{item.qrCode}"/>
                        </p:column>
                        <p:column headerText="#{msg.clinicalDeptName}" >
                            <h:outputText value="#{item.clinicalDeptName}"/>
                        </p:column>
                        <p:column headerText="设备调剂状态" >
                            <h:outputText value="#{item.borrowedStatus}"/>
                        </p:column>
                        <p:column headerText="使用计费模式" >
                            <h:outputText value="#{secondmentAssetSettingController.getBillingModel(item)}"/>
                        </p:column>
                        <p:column headerText="累计借出时长" >
                            <h:outputText value="#{item.billingTime}"/>
                        </p:column>
                        <p:column headerText="累计借出费用" >
                            <h:outputText value="#{item.billingCost}"/>
                        </p:column>
                        <p:column exportable="false" width="100" headerText="操作">
                            <h:panelGroup >
                                <p:commandButton id="cancel" style="zoom:0.80;" disabled="#{item.borrowedStatus != 0}" process="@this" title="申请借用" actionListener="#{secondmentOrderAssetController.applyBorrowBefore(item)}" oncomplete="PF('applyBorrowOrder').show()" update="applyBorrowOrder" icon="ui-icon-create" />
                            </h:panelGroup>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="secondmentConfig_export"/>
                            </p:commandButton>
<!--                            <p:commandButton id="createButton" icon="ui-icon-plus" actionListener="#{secondmentConfigController.prepareCreate()}" update="" class="btn btn-sm btn-gray" title="#{msg.Create}" oncomplete="PF('configEditDlg').show()"/>-->
<!--                            <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" actionListener="#{secondmentAssetSettingController.delete}" disabled="#{empty secondmentAssetSettingController.selected || secondmentAssetSettingController.selected.borrowedStatus == 1}" class="btn btn-sm btn-gray" title="#{msg.Delete}"  update="datalist" >-->
<!--                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>-->
<!--                            </p:commandButton>-->

                        </f:facet>
                    </p:dataTable>
                </h:form>
                <ui:include src="applyBorrowOrder.xhtml"/>
            </div>

        </div>
    </ui:define>
</ui:composition>
</html>
