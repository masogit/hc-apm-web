<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="applyBorrowOrder" width="1000" height="600" widgetVar="applyBorrowOrder" modal="true" draggable="true" appendTo="@(body)" header="#{secondmentAssetSettingController.getCRUDActionName()}" >
        <div class="ui-g-12 card">
            <h:form id="applyBorrowOrderFrom">
                <p:fieldset legend="调剂设备借用信息" style="margin-bottom:20px">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.assetName}</label>
                            <p:inputText value="#{secondmentOrderAssetController.selected.name}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.functionType}</label>
                            <p:inputText value="#{secondmentOrderAssetController.selected.functionType}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.assetGroup}</label>
                            <p:inputText value="#{fieldMsg.doGetFieldValue('assetGroup',secondmentOrderAssetController.selected.assetGroup)}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.departNum}</label>
                            <p:inputText value="#{secondmentOrderAssetController.selected.departNum}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.qrCode}</label>
                            <p:inputText value="#{secondmentOrderAssetController.selected.qrCode}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.clinicalDeptName}</label>
                            <p:inputText value="#{secondmentOrderAssetController.selected.clinicalDeptName}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">是否需要备件<span style="color:red">*</span></label>
                            <p:selectOneRadio  value="#{secondmentOrderAssetController.secondmentOrder.needSpareParts}" >
                                <f:selectItem itemLabel="是" itemValue="true" />
                                <f:selectItem itemLabel="否" itemValue="false" />
                                <p:ajax  update="applyBorrowOrderFrom" />
                            </p:selectOneRadio>
                        </h:panelGroup>
                        <h:panelGroup id="sparePartsRemark" rendered="#{secondmentOrderAssetController.secondmentOrder.needSpareParts}">
                            <label class="label">备件备注</label>
                            <p:inputText value="#{secondmentOrderAssetController.secondmentOrder.sparePartsRemark}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请科室<span style="color:red">*</span></label>
                            <p:selectOneMenu required="true" disabled="#{!secondmentOrderAssetController.chooseDept}" value="#{secondmentOrderAssetController.secondmentOrder.borrowDeptUid}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems  value="#{secondmentOrderAssetController.orgInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请人</label>
                            <p:inputText value="#{secondmentOrderAssetController.getUserName(secondmentOrderAssetController.secondmentOrder.applicantUid)}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间</label>
                            <p:calendar pattern="yyyy-MM-dd HH:mm:ss" value="#{secondmentOrderAssetController.secondmentOrder.applyTime}" readonly="true" disabled="true" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">计费标准</label>
                            <p:inputText value="#{secondmentOrderAssetController.secondmentOrder.billingStandards}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">备注</label>
                            <p:inputText value="#{secondmentOrderAssetController.secondmentOrder.remark}" />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset legend="计费配置信息" style="margin-bottom:20px">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.name}</label>
                            <p:inputText value="#{secondmentOrderAssetController.secondmentConfig.name}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">单价</label>
                            <p:inputNumber id="unitPrice" value="#{secondmentOrderAssetController.secondmentConfig.unitPrice}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>计价方式</label>
                            <p:selectOneMenu id="billingType" readonly="true" disabled="true"
                                             value="#{secondmentOrderAssetController.secondmentConfig.billingType}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems  value="#{fieldMsg.getFieldValueList('chargingType')}"  var="option" itemLabel="#{option.value}" itemValue="#{option.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.remark}</label>
                            <p:inputTextarea id="remark"  readonly="true" value="#{secondmentOrderAssetController.secondmentConfig.remark}"  />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:commandButton  validateClient="true" actionListener="#{secondmentOrderAssetController.save}" value="申请借用" update=":secondmentOrderAsset:datalist :growl" icon="ui-icon-check" oncomplete="PF('applyBorrowOrder').hide()"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('applyBorrowOrder').hide()"/>
            </h:form>
        </div>
    </p:dialog>
    <script type="text/javascript">
        function handleSubmitDigital(args, dialog) {
            if (args.validationFailed) {
                PF(dialog).show();
            } else {
                PF(dialog).hide();
            }
        }
    </script>
</ui:composition>
</html>
