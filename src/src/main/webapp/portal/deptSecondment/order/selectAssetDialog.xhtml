<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="selectAssetDlg"  widgetVar="varSelectAssetDlg" modal="true" resizable="true" draggable="true" header="选择设备" appendTo="@(body)" width="80%" height="500">
            <h:form id="selectAssetForm" >
                <p:panelGrid columns="1" layout="grid">
                        <p:dataTable id="selectAssetDatalist" filterDelay="" value="#{secondmentOrderAssetController.lazyModel}" var="item" widgetVar="varSelectAssetDatalist"
                                     selectionMode="single" selection="#{secondmentOrderAssetController.selected}"
                                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                     rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                     rows="5" emptyMessage="#{msg.noRecordFound}">

                            <p:ajax event="rowSelect"  update=""/>
                            <p:ajax event="filter" listener="#{secondmentOrderAssetController.onFilter}" update="selectAssetDatalist"/>
                            <p:column headerText="#{msg.assetName}" filterBy="#{item.name}" filterMatchMode="LIKE">
                                <h:outputText value="#{item.name}" />
                            </p:column>
                            <p:column headerText="#{msg.functionType}"  filterBy="#{item.functionType}" filterMatchMode="EQ">
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                                <f:facet name="filter" >
                                    <p:selectOneMenu onchange="PF('varSelectAssetDatalist').filter()" >
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </f:facet>
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}" >
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.qrCode}" >
                                <h:outputText value="#{item.qrCode}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}" >
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                            <p:column headerText="设备调剂状态" >
                                <h:outputText value="#{item.borrowedStatus}"/>
                                <h:outputText value="#{fieldMsg.doGetFieldValue('borrowedStatus',item.status)}"/>
                            </p:column>
                            <p:column headerText="使用计费模式" >
                                <h:outputText value="#{secondmentAssetSettingController.getBillingModel(item)}"/>
                            </p:column>
                            <p:column headerText="累计借出时长" >
                                <h:outputText value="#{item.billingTime}"/>
                            </p:column>
                            <p:column headerText="累计借出费用" >
                                <h:outputText value="#{item.billingCost}"/>
                            </p:column>
                        </p:dataTable>
                </p:panelGrid>
                <p:commandButton value="#{msg.Confirm}" icon="ui-icon-check" update="growl #{secondmentOrderAssetController.updateViewIDs}" actionListener="#{secondmentOrderAssetController.confirmSelection()}" oncomplete="handleSubmit(args, 'varSelectAssetDlg');"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" type="button" icon="ui-icon-cancel" onclick="PF('varSelectAssetDlg').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
