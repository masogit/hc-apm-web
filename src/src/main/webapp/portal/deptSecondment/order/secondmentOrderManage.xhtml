<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">

        <div class="ui-g">
             <div class="ui-g-12">
                <div class="ui-g-12 card cardTitle">
                    <p:outputLabel class="pageTitle" value="科室间设备调剂工作台"/>
                </div>
                <h:form id="secondmentOrderManage">
                    <p:panelGrid columns="1" layout="grid">
                        <h:panelGroup>
                            <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                                <p:commandButton value="借出工单"  process="@this" actionListener="#{secondmentOrderManageController.setBorrowFlag(true)}" update="secondmentOrderManage" disabled="#{secondmentOrderManageController.borrowFlag}"  />
                                <p:commandButton value="借入工单"  process="@this" actionListener="#{secondmentOrderManageController.setBorrowFlag(false)}" update="secondmentOrderManage" disabled="#{!secondmentOrderManageController.borrowFlag}" />
                            </h:panelGrid>
                            <p:dataTable id="datalist" value="#{secondmentOrderManageController.lazyModel}" var="item" widgetVar="secondmentOrderManageList"
                                         selectionMode="single"  selection="#{secondmentOrderManageController.selected}"
                                         lazy="true" paginator="true" paginatorPosition="both"  paginatorAlwaysVisible="true"
                                         rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         rows="20" emptyMessage="#{msg.noRecordFound}"
                                         rowsPerPageTemplate="10,20,50,100">

                                <p:ajax event="rowSelect"  update="editButton" />
                                <p:ajax event="filter" listener="#{secondmentOrderManageController.onFilter}" update="datalist"/>
                                <p:column headerText="单号" filterBy="#{item.secondment_no}" >
                                    <h:outputText value="#{item.secondmentNo}" />
                                </p:column>
                                <p:column headerText="#{msg.assetName}" filterBy="#{item.name}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.assetName}" />
                                </p:column>
                                <p:column headerText="#{msg.functionType}"  filterBy="#{item.function_type}" filterMatchMode="EQ">
                                    <h:outputText value="#{item.functionType}"/>
                                </p:column>
                                <p:column headerText="#{msg.assetGroup}" filterBy="#{item.asset_group}" filterMatchMode="EQ">
                                    <f:facet name="filter" >
                                        <p:selectOneMenu onchange="PF('secondmentOrderManageList').filter()" >
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        </p:selectOneMenu>
                                    </f:facet>
                                    <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                                </p:column>
                                <p:column headerText="#{msg.departNum}" >
                                    <h:outputText value="#{item.departNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.qrCode}" >
                                    <h:outputText value="#{item.qrCode}"/>
                                </p:column>
                                <p:column headerText="#{msg.clinicalDeptName}" >
                                    <h:outputText value="#{secondmentOrderManageController.getBorrowDeptName(item.lendDeptUid)}"/>
                                </p:column>
                                <p:column headerText="使用科室" >
                                    <h:outputText value="#{secondmentOrderManageController.getBorrowDeptName(item.borrowDeptUid)}"/>
                                </p:column>
                                <p:column headerText="设备调剂状态"  filterMatchMode="EQ" filterBy="#{item.so.status}" >
                                    <f:facet name="filter">
                                        <p:selectOneMenu  onchange="PF('secondmentOrderManageList').filter()" >
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}"  noSelectionOption="true" />
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('borrowedStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        </p:selectOneMenu>
                                    </f:facet>
                                    <h:outputText value="#{fieldMsg.doGetFieldValue('borrowedStatus',item.status)}"/>
                                </p:column>
                                <p:column headerText="申请时间" >
                                    <h:outputText value="#{item.applyTime}">
                                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat14()}"  />
                                    </h:outputText>
                                </p:column>>
                                <p:column headerText="使用计费模式" >
                                    <h:outputText value="#{item.billingStandards}"/>
                                </p:column>
                                <p:column headerText="计费开始时间" >
                                    <h:outputText value="#{item.billingBeginTime}">
                                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat14()}"  />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="计费结束时间" >
                                    <h:outputText value="#{item.billingEndTime}">
                                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat14()}"  />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="借出时长" >
                                    <h:outputText value="#{item.billingTime}"/>
                                </p:column>
                                <p:column headerText="借出费用" >
                                    <h:outputText value="#{item.cost}"/>
                                </p:column>
                                <f:facet name="{Toolbar}">
                                    <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                        <p:dataExporter type="xls" target="datalist" fileName="secondmentOrder_export"/>
                                    </p:commandButton>
                                    <p:commandButton id="editButton"  icon="ui-icon-pencil" class="btn btn-sm btn-gray" disabled="#{empty secondmentOrderManageController.selected}" actionListener="#{secondmentOrderManageController.prepareEdit()}" update="secondmentOrderEdit" title="#{msg.Edit}"   oncomplete="PF('secondmentOrderEdit').show()"/>

                                </f:facet>
                            </p:dataTable>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:form>
                 <ui:include src="secondmentOrderEdit.xhtml"/>

             </div>
        </div>
    </ui:define>
</ui:composition>
