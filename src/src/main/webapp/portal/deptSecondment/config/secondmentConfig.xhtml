<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">

        <div class="ui-g">
            <div class="ui-g-12">
                <div class="ui-g-12 card cardTitle">
                    <p:outputLabel class="pageTitle" value="调剂计费配置"/>
                </div>
                    <h:form id="secondmentConfigForm">
                        <p:panelGrid columns="1" layout="grid">
                            <h:panelGroup>
                                <p:dataTable id="datalist" value="#{secondmentConfigController.lazyModel}"
                                             var="item"
                                             widgetVar="configEditList"
                                             lazy="true" paginator="true" paginatorPosition="both"
                                             paginatorAlwaysVisible="true"
                                             selectionMode="single"  selection="#{secondmentConfigController.selected}"
                                             sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}" rowKey="#{item.id}"
                                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                             rows="20" emptyMessage="#{msg.noRecordFound}"
                                             rowsPerPageTemplate="10,20,50,100">

                                    <p:ajax event="rowSelect" update="createButton  editButton deleteButton" />
                                    <p:ajax event="filter" listener="#{secondmentConfigController.onFilter}" update="datalist"/>
                                    <p:column headerText="调剂配置名称" filterBy="#{item.name}" filterMatchMode="LIKE">
                                        <h:outputText value="#{item.name}" />
                                    </p:column>
                                    <p:column headerText="单价"  filterBy="#{item.unitPrice}" filterMatchMode="LTE">
                                        <h:outputText value="#{item.unitPrice}"/>
                                    </p:column>
                                    <p:column headerText="计费类型" filterBy="#{item.billingType}" filterMatchMode="EQ">
                                        <f:facet name="filter" >
                                            <p:selectOneMenu onchange="PF('configEditList').filter()" >
                                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                                <f:selectItems value="#{fieldMsg.getFieldValueList('chargingType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                            </p:selectOneMenu>
                                        </f:facet>
                                        <h:outputText value="#{fieldMsg.doGetFieldValue('chargingType',item.billingType)}"/>
                                    </p:column>
                                    <p:column headerText="创建时间" >
                                        <h:outputText value="#{item.createdDate}">
                                            <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat14()}"  />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="创建人" >
                                        <h:outputText value="#{secondmentConfigController.getCreatedBy(item)}"/>
                                    </p:column>
                                    <p:column headerText="备注" >
                                        <h:outputText value="#{item.remark}"/>
                                    </p:column>
                                    <f:facet name="{Toolbar}">
                                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                            <p:dataExporter type="xls" target="datalist" fileName="secondmentConfig_export"/>
                                        </p:commandButton>
                                        <p:commandButton id="createButton" icon="ui-icon-plus" actionListener="#{secondmentConfigController.prepareCreate()}" update=":configEditDlg" class="btn btn-sm btn-gray" title="#{msg.Create}" oncomplete="PF('configEditDlg').show()"/>
                                        <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" disabled="#{secondmentConfigController.selected == null}" actionListener="#{secondmentConfigController.prepareEdit()}" update=":configEditDlg" title="#{msg.Edit}"   oncomplete="PF('configEditDlg').show()"/>

                                        <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" actionListener="#{secondmentConfigController.delete}" disabled="#{secondmentConfigController.selected == null}" class="btn btn-sm btn-gray" title="#{msg.Delete}"  update="datalist" >
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                        </p:commandButton>

                                    </f:facet>
                                </p:dataTable>
                            </h:panelGroup>
                        </p:panelGrid>
                    </h:form>
                    <ui:include src="configEdit.xhtml"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
