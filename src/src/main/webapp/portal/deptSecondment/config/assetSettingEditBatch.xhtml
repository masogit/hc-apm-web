<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="assetSettingEditBatch" width="1000" height="600" widgetVar="assetSettingEditBatch" modal="true" draggable="true" appendTo="@(body)" header="#{secondmentAssetSettingBatchController.getCRUDActionName()}" >
        <div class="ui-g-12 card">
            <h:form id="assetSettingBatchFrom">
                <p:fieldset legend="调剂设备配置" style="margin-bottom:20px">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">计费配置*</label>
                            <p:selectOneMenu  id="secondmentConfigId"  value="#{secondmentAssetSettingBatchController.selected.borrowConfigId}" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="" noSelectionOption="true" />
                                <f:selectItems value="#{secondmentAssetSettingBatchController.cacheConfigList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                                <p:ajax event="valueChange" listener="#{secondmentAssetSettingBatchController.refreshSecondmentConfig}" update="configName1 unitPrice1 billingType1 createdBy1 remark1" />
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.name}</label>
                            <p:inputText id="configName1" value="#{secondmentAssetSettingBatchController.secondmentConfig.name}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">单价</label>
                            <p:inputNumber id="unitPrice1" value="#{secondmentAssetSettingBatchController.secondmentConfig.unitPrice}" readonly="true"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>计价方式</label>
                            <p:selectOneMenu id="billingType1" readonly="true" disabled="true"
                                              value="#{secondmentAssetSettingBatchController.secondmentConfig.billingType}"
                                              requiredMessage="计价方式 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems  value="#{fieldMsg.getFieldValueList('chargingType')}"  var="option" itemLabel="#{option.value}" itemValue="#{option.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.createdBy}</label>
                            <p:inputText id="createdBy1" value="#{secondmentAssetSettingBatchController.getCreatedBy(secondmentAssetSettingBatchController.secondmentConfig)}"  readonly="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.remark}</label>
                            <p:inputTextarea id="remark1" cols="100" readonly="true" value="#{secondmentAssetSettingBatchController.secondmentConfig.remark}"  />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset legend="设备" id="assetList" style="margin-bottom:20px">
                    <p:panelGrid columns="1" layout="grid">
                        <p:dataTable id="datalist" value="#{secondmentAssetSettingBatchController.lazyModel}"
                                     var="item"
                                     widgetVar="configEditList1"
                                     lazy="true" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.createdDate}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" emptyMessage="#{msg.noRecordFound}"
                                     rowsPerPageTemplate="5,10,20,50">
                            <p:column headerText="#{msg.assetName}" filterBy="#{item.name}" filterMatchMode="LIKE">
                                <h:outputText value="#{item.name}" />
                            </p:column>
                            <p:column headerText="#{msg.functionType}"  filterBy="#{item.functionType}" filterMatchMode="EQ">
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                                <f:facet name="filter" >
                                    <p:selectOneMenu onchange="PF('configEditList1').filter()" >
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </f:facet>
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}" >
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.qrCode}" >
                                <h:outputText value="#{item.qrCode}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}" >
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                            <p:column headerText="设备调剂状态" >
                                <f:facet name="filter" >
                                    <p:selectOneMenu onchange="PF('configEditList1').filter()" >
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetBorrowedStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </f:facet>
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetBorrowedStatus',item.borrowedStatus)}"/>
                            </p:column>
                            <p:column exportable="false" width="100" headerText="操作">
                                <h:panelGroup >
                                    <p:commandButton id="createButton1" disabled="#{secondmentAssetSettingBatchController.exist(item)}" icon="ui-icon-plus" actionListener="#{secondmentAssetSettingBatchController.addSelectAsset(item)}" class="btn btn-sm btn-gray" title="#{msg.Create}" update="createButton1 deleteButton1"  />
                                    <p:commandButton id="deleteButton1" disabled="#{!secondmentAssetSettingBatchController.exist(item)}" process="@this" icon="ui-icon-close" actionListener="#{secondmentAssetSettingBatchController.unSelectAsset(item)}"  class="btn btn-sm btn-gray" title="#{msg.Delete}"  update="createButton1 deleteButton1" />
                                </h:panelGroup>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                </p:fieldset>
                <p:commandButton  validateClient="true" actionListener="#{secondmentAssetSettingBatchController.save}" value="#{msg.Save}" update=":secondmentAssetSetting:datalist :growl" icon="ui-icon-check" oncomplete="handleSubmitDigital(args, 'assetSettingEditBatch')"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('assetSettingEditBatch').hide()"/>
            </h:form>
        </div>
    </p:dialog>
    <script type="text/javascript">
        function handleSubmitDigital(args, dialog) {
            if (args.validationFailed) {
                PF(dialog).show();
            } else {
                PF(dialog).hide();
            }
        }
    </script>
</ui:composition>
</html>
