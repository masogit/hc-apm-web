<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="assetSettingEditBatch" width="1000" height="600" widgetVar="assetSettingEditBatch" modal="true" draggable="true" appendTo="@(body)" header="#{secondmentAssetSettingBatchController.getCRUDActionName()}" >
        <div class="ui-g-12 card">
            <h:form id="assetSettingBatchFrom">
                <p:fieldset legend="设备" id="assetList" style="margin-bottom:20px">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:dataTable id="datalist" value="#{secondmentAssetSettingBatchController.lazyModel}"
                                     var="item"
                                     widgetVar="configEditList1"
                                     lazy="true" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" emptyMessage="#{msg.noRecordFound}"
                                     rowsPerPageTemplate="5,10,20,50">
                            <p:ajax event="filter" listener="#{secondmentAssetSettingBatchController.onFilter}" update="datalist"/>
                            <p:ajax event="page"  listener="#{secondmentAssetSettingBatchController.setAllSelected1(false)}" oncomplete="updateSelectAllCheckBox('selectCheckBox','selectCheckBoxHeader');"/>
                            <p:column width="40" id="checkBoxCol">
                                <p:selectBooleanCheckbox value="#{secondmentAssetSettingBatchController.selectedAssetUidTable1[item.uid]}" class="selectCheckBox">
                                    <p:ajax event="change" listener="#{secondmentAssetSettingBatchController.updateSelctedAssetList1}" update="@(.selectCheckBoxHeader)"/>
                                    <f:attribute name="assetObj" value="#{item}"/>
                                </p:selectBooleanCheckbox>
                                <f:facet name="header">
                                    <p:selectBooleanCheckbox value="#{secondmentAssetSettingBatchController.allSelected1}" id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                        <p:ajax event="change" listener="#{secondmentAssetSettingBatchController.addAssetsOfCurrentPage1}" update="@(.selectCheckBox)"/>
                                    </p:selectBooleanCheckbox>
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.assetName}" filterBy="#{item.name}" filterMatchMode="LIKE">
                                <h:outputText value="#{item.name}" />
                            </p:column>
                            <p:column headerText="#{msg.functionType}"  filterBy="#{item.functionType}" filterMatchMode="EQ">
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                                <f:facet name="filter" >
                                    <p:selectOneMenu onchange="PF('configEditList1').filter()" >
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </f:facet>
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}" >
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.qrCode}" >
                                <h:outputText value="#{item.qrCode}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}" >
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                            <p:column headerText="设备调剂状态" >
                                <f:facet name="filter" >
                                    <p:selectOneMenu onchange="PF('configEditList1').filter()" >
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetBorrowedStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </f:facet>
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetBorrowedStatus',item.borrowedStatus)}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:commandButton  validateClient="true" actionListener="#{secondmentAssetSettingBatchController.addCheckedDevice}" value="添加已勾选设备" update="assetList assetList2 :growl" icon="ui-icon-check" />
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" id="assetList2" styleClass="ui-panelgrid-blank form-group ">
                        <p:dataTable id="datalist1" value="#{secondmentAssetSettingBatchController.lazyModel2}"
                                     var="item"
                                     widgetVar="selectedTable"
                                     lazy="true" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" emptyMessage="#{msg.noRecordFound}" rowKey="#{item.id}"
                                     rowsPerPageTemplate="5,10,20,50">
                            <p:ajax event="page"  listener="#{secondmentAssetSettingBatchController.setAllSelected2(false)}" oncomplete="updateSelectAllCheckBox('selectCheckBox1','selectCheckBoxHeader1');"/>
                            <p:column width="40" id="checkBoxCol1">
                                <p:selectBooleanCheckbox value="#{secondmentAssetSettingBatchController.selectedAssetUidTable2[item.uid]}" class="selectCheckBox1">
                                    <p:ajax event="change" listener="#{secondmentAssetSettingBatchController.updateSelctedAssetList2}" update="@(.selectCheckBoxHeader1)"/>
                                    <f:attribute name="assetObj" value="#{item}"/>
                                </p:selectBooleanCheckbox>
                                <f:facet name="header">
                                    <p:selectBooleanCheckbox value="#{secondmentAssetSettingBatchController.allSelected2}" id="selectCheckBoxHeader1" class="selectCheckBoxHeader1">
                                        <p:ajax event="change" listener="#{secondmentAssetSettingBatchController.addAssetsOfCurrentPage2}" update="@(.selectCheckBox1)"/>
                                    </p:selectBooleanCheckbox>
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.assetName}" >
                                <h:outputText value="#{item.name}" />
                            </p:column>
                            <p:column headerText="#{msg.functionType}"  >
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}" >
<!--                                <f:facet name="filter" >-->
<!--                                    <p:selectOneMenu onchange="PF('configEditList1').filter()" >-->
<!--                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>-->
<!--                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>-->
<!--                                    </p:selectOneMenu>-->
<!--                                </f:facet>-->
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}" >
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.qrCode}" >
                                <h:outputText value="#{item.qrCode}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}" >
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                            <p:column headerText="设备调剂状态" >
<!--                                <f:facet name="filter" >-->
<!--                                    <p:selectOneMenu onchange="PF('configEditList1').filter()" >-->
<!--                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>-->
<!--                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetBorrowedStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>-->
<!--                                    </p:selectOneMenu>-->
<!--                                </f:facet>-->
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetBorrowedStatus',item.borrowedStatus)}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:commandButton  validateClient="true" actionListener="#{secondmentAssetSettingBatchController.deleteCheckedDevice}" value="删除已勾选设备" update="assetList assetList2 :growl" icon="ui-icon-check"/>
                        <p:commandButton  value="全部清空" actionListener="#{secondmentAssetSettingBatchController.clearAll}"  icon="ui-icon-cancel" update="assetList assetList2 :growl" />
                    </p:panelGrid>
                </p:fieldset>
                <p:commandButton  validateClient="true" actionListener="#{secondmentAssetSettingBatchController.save}" value="#{msg.Save}" update=":secondmentAssetSetting:datalist :growl" icon="ui-icon-check" oncomplete="handleSubmitDigital(args, 'assetSettingEditBatch')"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('assetSettingEditBatch').hide()"/>
            </h:form>
        </div>
    </p:dialog>
    <script type="text/javascript">
        function handleSubmitDigital(args, dialog) {
            if (args.validationFailed) {
                PF(dialog).show();
            } else {
                PF(dialog).hide();
            }
        }
        function updateSelectAllCheckBox(checkBox,checkBoxHeader) {
            var checkboxlist = $("."+checkBox);
            var selectAllstatus = true;
            checkboxlist.each(function () {
                selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked;
            });
            if (selectAllstatus) {
                $("."+checkBoxHeader)[0].children[1].classList.add("ui-state-active");
            } else {
                $("."+checkBoxHeader)[0].children[1].classList.remove("ui-state-active");
            }
        }
    </script>
</ui:composition>
</html>
