<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="EditDlg" widgetVar="EditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="计费结束时间录入">
            <h:form id="EditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{sharedAssetReqDetailController.selected != null}">

                        <h:panelGroup>
                            <label class="label">计费结束时间</label>
                            <p:calendar class="endtime" pattern="yyyy/MM/dd HH:mm" stepMinute="30"  value="#{sharedAssetReqDetailController.selected.chargingEndTime}" showOn="button" readonlyInput="true" showButtonPanel="true" navigator="true"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{sharedAssetReqDetailController.saves('归还')}" value="#{msg.Save}" update=":SharedAssetRequestEditForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'EditDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('EditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>
<!--    <script>
        function time(){
            
        }
    </script>    -->
    </ui:composition>
    
     
</html>
