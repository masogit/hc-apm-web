<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="head">
        <h:outputStylesheet name="css/inspection.css"/>
    </ui:define>
    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="借还维护"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="SharedAssetRequestEditForm">
                    <p:fieldset legend="借还维护信息" style="margin-bottom:20px">
                       <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{sharedAssetRequestNewController.selected != null}">
<!--                            <h:panelGroup>
                                <label class='label'>#{msg.clinicalDeptName}</label>
                                <p:selectOneMenu  value="#{sharedAssetRequestNewController.selected.clinicalDeptUid}" required="false" requiredMessage="#{msg.clinicalDeptUid} #{msg.ValidationRequire}">
                                
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>

                            </p:selectOneMenu>
                            </h:panelGroup>-->
                            <h:panelGroup>
                                <label class='label'></label>
                                <p:selectOneRadio id="chargingType" required="true"  value="#{sharedAssetRequestNewController.selected.type}" requiredMessage="#{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="维修" itemValue="1" />
                                    <f:selectItem itemLabel="补登记" itemValue="2" />
                                </p:selectOneRadio>
                            </h:panelGroup> 
<!--                            <h:panelGroup>
                                <label class='label'>申请人</label>
                                <p:inputText id="applicant" value="#{sharedAssetRequestNewController.selected.applicant}" />
                            </h:panelGroup>-->
<!--                            <h:panelGroup>
                                <label class='label'>状态</label>
                                <p:inputText id="state" value="借用待提交" rendered="#{sharedAssetRequestNewController.selected.state == '0'}" readonly="true"/>
                                <p:inputText  value="借用待受理" rendered="#{sharedAssetRequestNewController.selected.state == '1'}" readonly="true"/>
                                <p:inputText  value="" rendered="#{sharedAssetRequestNewController.selected.state == null}" readonly="true"/>
                            </h:panelGroup>-->
                            <h:panelGroup>
                                <label class='label'>创建日期</label>
                                <h:outputText value="#{sharedAssetRequestNewController.selected.createDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                </h:outputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class='label'>备注</label>
                                <p:inputTextarea id="remark" rows="1"  cols="100"  queryDelay="750" minQueryLength="4" value="#{sharedAssetRequestNewController.selected.remark}" />
                            </h:panelGroup>
<!--                            <h:panelGroup>
                            <label class='label'></label>
                            <p:selectOneRadio id="chargingType" required="true"  value="" requiredMessage="#{msg.ValidationRequire}">
                                <f:selectItem itemLabel="维修" itemValue="维修" />
                                <f:selectItem itemLabel="维护" itemValue="维护" />
                               
                            </p:selectOneRadio>
                        </h:panelGroup> -->
                        </p:panelGrid>
                        <br/>
                     </p:fieldset>
                        
                     <p:fieldset legend="借还维护明细信息" style="margin-bottom:20px">
                             <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                    <h:panelGroup >
                                        <div style="width:630px">
                                           <label class='label'>批量输入</label>
                                           <p:calendar  pattern="yyyy/MM/dd HH:mm"   placeholder="        计费开始时间" value="#{sharedAssetRequestNewController.selected.msgBeginTime}" required="true" readonlyInput="true" showOn="button" showButtonPanel="true" navigator="true" requiredMessage="请选择开始时间"/>
                                           <p:calendar  pattern="yyyy/MM/dd HH:mm"   placeholder="        计费结束时间" value="#{sharedAssetRequestNewController.selected.msgEndTime}" readonlyInput="true" showOn="button" showButtonPanel="true" navigator="true"/>
                                           <p:inputText  style="width: 100px;margin-left:10px " placeholder="设备接收人" required="true" value="#{sharedAssetRequestNewController.selected.msgAccepter}" requiredMessage="请选择设备接收人"/>

                                           <p:selectOneMenu style="margin-left:40px;float:right" id="clinicalDeptUid"  value="#{sharedAssetRequestNewController.selected.clinicalDeptUid}" required="true" requiredMessage="请选择科室">        
                                               <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                               <f:selectItems value="#{assetInfoService.getOrgDeptList(sharedAssetRequestNewController.selected.siteUID)}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                           </p:selectOneMenu>
                                        </div>   
                                   </h:panelGroup>
<!--                                    <h:panelGroup >
                                       <label class='label'>科室名称</label>
                                       <p:selectOneMenu id="clinicalDeptUid" value="#{sharedAssetRequestNewController.selected.clinicalDeptUid}" required="true" requiredMessage="#{msg.clinicalDeptUid} #{msg.ValidationRequire}">        
                                           <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                           <f:selectItems value="#{assetInfoService.getOrgDeptList(sharedAssetRequestNewController.selected.siteUID)}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                       </p:selectOneMenu>
                                   </h:panelGroup>-->
                                    <h:panelGroup >
                                        <p:inputText  value="#{sharedAssetRequestNewController.selected.applyAssetInfo}" label="Text 1" placeholder="资产编号/设备编号/二维码" maxlength="100" style="width: 175px"/>
                                        <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" action="#{sharedAssetRequestNewController.getAssetInfo(sharedAssetRequestNewController.selected.msgBeginTime,sharedAssetRequestNewController.selected.msgEndTime,sharedAssetRequestNewController.selected.msgAccepter,sharedAssetRequestNewController.selected.clinicalDeptUid)}" update="datalist,confirm"/>
                                    </h:panelGroup>
                             </p:panelGrid>
                             <p:dataTable id="datalist" value="#{sharedAssetRequestNewController.selected.sardList}" var="item" widgetVar="varDataList"
                               selectionMode="single" selection="#{sharedAssetRequestNewController.selectedSard}"
                               lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                               rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                               paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                               currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                               rows="20" emptyMessage="#{msg.noRecordFound}"
                               rowsPerPageTemplate="20,40,60,90">

                               <p:ajax event="rowSelect"  listener="#{sharedAssetRequestNewController.prepareEditSard}" update=":EditDlg,editButton" oncomplete="PF('EditDialog').show()"/>
                               <p:ajax event="filter" listener="#{sharedAssetReqDetailController.onFilter}" />
                               <p:column headerText="设备编号" sortBy="#{item.assetNumber}">
                                   <h:outputText value="#{item.assetNumber}"/>
                               </p:column>
                               <p:column headerText="调剂设备名称" sortBy="#{item.assetNumber}">
                                   <h:outputText value="#{sharedAssetReqDetailController.getSwapName(item.sharedAssetTypeId)}"/>
                               </p:column>
                               <p:column headerText="计费开始时间" sortBy="#{item.chargingBeginTime}">
                                   <h:outputText value="#{item.chargingBeginTime}">
                                       <f:convertDateTime pattern="yyyy/MM/dd HH:mm" />
                                   </h:outputText>
                               </p:column>
                               <p:column headerText="计费结束时间" sortBy="#{item.chargingEndTime}">
                                   <h:outputText value="#{item.chargingEndTime}">
                                       <f:convertDateTime pattern="yyyy/MM/dd HH:mm" />
                                   </h:outputText>
                               </p:column>
                               <p:column headerText="单价" sortBy="#{item.unitPrice}" >
                                    <h:outputText value="#{item.unitPrice}"/>
                               </p:column>
                                 <p:column headerText="计价方式" sortBy="#{item.chargingType}">
                                     <h:outputText value="#{fieldMsg.fieldValue('chargingType',item.chargingType)=='' ? '维修借用' : fieldMsg.fieldValue('chargingType',item.chargingType)}"/>
                                 </p:column>
                               <p:column headerText="费用" sortBy="#{item.cost}" >
                                   <h:outputText value="#{item.cost}">
                                       <f:convertNumber pattern="0.00"/>
                                   </h:outputText>
                               </p:column>
                               <p:column headerText="备注" sortBy="#{item.remark}" >
                                    <h:outputText value="#{item.remark}"/>
                               </p:column>
                               <p:column headerText="删除" >
                                <p:commandButton id="deleteButton"  icon="ui-icon-trash"  actionListener="#{sharedAssetRequestNewController.deleteBy(item.id)}"  update="datalist">
                                      <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                </p:commandButton>
                                </p:column>
                               <f:facet name="{Toolbar}">
                                   <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                       <p:dataExporter type="xls" target="datalist" fileName="SharedAssetReqDetail_export"/>
                                   </p:commandButton>
<!--                                   <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{sharedAssetReqDetailController.prepareCreate}" update=":SharedAssetReqDetailEditDlg" oncomplete="PF('SharedAssetReqDetailEditDialog').show()"/>
                                   <p:commandButton id="viewButton" icon="ui-icon-search" class="btn btn-sm btn-gray" title="#{msg.View}" actionListener="#{sharedAssetReqDetailController.prepareView}" update=":SharedAssetReqDetailViewDlg" oncomplete="PF('SharedAssetReqDetailViewDialog').show()" disabled="#{empty sharedAssetReqDetailController.selected}"/>-->
                                   <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" actionListener="#{sharedAssetReqDetailController.prepareEdit}" update=":EditDlg" oncomplete="PF('EditDialog').show()" disabled="#{empty sharedAssetReqDetailController.selected}"/>
<!--                                   <p:commandButton id="deleteButton" icon="ui-icon-trash" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{sharedAssetReqDetailController.prepareDelete}" update=":SharedAssetReqDetailViewDlg" oncomplete="PF('SharedAssetReqDetailViewDialog').show()" disabled="#{empty sharedAssetReqDetailController.selected}"/>-->
                               </f:facet>
                           </p:dataTable>
                     </p:fieldset>
<!--                     <p:commandButton validateClient="true" actionListener="#{sharedAssetRequestNewController.save}" value="#{msg.Save}" action="List?faces-redirect=true"/>-->
                     <p:commandButton id="confirm" validateClient="true" actionListener="#{sharedAssetRequestNewController.deliverR}" action="List?faces-redirect=true" value="提交" rendered="#{sharedAssetRequestNewController.selected.state == 0}" >
                       <p:confirm header="提交确认" message="您确定要提交吗" icon="ui-icon-warning"/>
                     </p:commandButton>
<!--                     <p:commandButton id="confirmcancel" validateClient="true" actionListener="#{sharedAssetRequestNewController.cancel()}" action="List?faces-redirect=true" value="取消借用" rendered="#{sharedAssetRequestNewController.selected.state == '1'}" >
                       <p:confirm header="提交确认" message="您确定要取消吗" icon="ui-icon-warning"/>
                     </p:commandButton>-->
                     <p:commandButton immediate="true" value="返回" icon="ui-icon-cancel" action="List?faces-redirect=true" />
                </h:form>
                <ui:include src="EditDetail.xhtml"/>
            </div>  
        </div> 
    </ui:define>  
</ui:composition>
