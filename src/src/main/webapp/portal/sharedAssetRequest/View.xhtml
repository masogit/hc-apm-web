<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="SharedAssetRequestViewDlg" widgetVar="SharedAssetRequestViewDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{sharedAssetRequestController.CRUDActionName} #{msg.SharedAssetRequest}">
            <h:form id="SharedAssetRequestViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{sharedAssetRequestController.selected != null}">
                        <h:outputLabel value="#{msg.id}" for="id" />
                        <h:outputText value="#{sharedAssetRequestController.selected.id}"/>
                        <h:outputLabel value="#{msg.applicant}" for="applicant" />
                        <h:outputText value="#{sharedAssetRequestController.selected.applicant}"/>
                        <h:outputLabel value="#{msg.applicantPhone}" for="applicantPhone" />
                        <h:outputText value="#{sharedAssetRequestController.selected.applicantPhone}"/>
                        <h:outputLabel value="#{msg.accepter}" for="accepter" />
                        <h:outputText value="#{sharedAssetRequestController.selected.accepter}"/>
                        <h:outputLabel value="#{msg.accepterNumber}" for="accepterNumber" />
                        <h:outputText value="#{sharedAssetRequestController.selected.accepterNumber}"/>
                        <h:outputLabel value="#{msg.clinicalDeptUid}" for="clinicalDeptUid" />
                        <h:outputText value="#{sharedAssetRequestController.selected.clinicalDeptUid}"/>
                        <h:outputLabel value="#{msg.clinicalDeptName}" for="clinicalDeptName" />
                        <h:outputText value="#{sharedAssetRequestController.selected.clinicalDeptName}"/>
                        <h:outputLabel value="#{msg.applyTime}" for="applyTime" />
                        <h:outputText value="#{sharedAssetRequestController.selected.applyTime}">
                            <f:convertDateTime pattern="yyyy/MM/dd HH:mm:ss" />
                        </h:outputText>
                        <h:outputLabel value="#{msg.invalidTime}" for="invalidTime" />
                        <h:outputText value="#{sharedAssetRequestController.selected.invalidTime}">
                            <f:convertDateTime pattern="yyyy/MM/dd HH:mm:ss" />
                        </h:outputText>
                        <h:outputLabel value="#{msg.state}" for="state" />
                        <h:outputText value="#{sharedAssetRequestController.selected.state}"/>
                        <h:outputLabel value="#{msg.remark}" for="remark" />
                        <h:outputText value="#{sharedAssetRequestController.selected.remark}"/>
                        <h:outputLabel value="#{msg.tenantUID}" for="tenantUID" />
                        <h:outputText value="#{sharedAssetRequestController.selected.tenantUID}"/>
                        <h:outputLabel value="#{msg.institutionUID}" for="institutionUID" />
                        <h:outputText value="#{sharedAssetRequestController.selected.institutionUID}"/>
                        <h:outputLabel value="#{msg.hospitalUID}" for="hospitalUID" />
                        <h:outputText value="#{sharedAssetRequestController.selected.hospitalUID}"/>
                        <h:outputLabel value="#{msg.siteUID}" for="siteUID" />
                        <h:outputText value="#{sharedAssetRequestController.selected.siteUID}"/>
                        <h:outputLabel value="#{msg.createBy}" for="createBy" />
                        <h:outputText value="#{sharedAssetRequestController.selected.createBy}"/>
                        <h:outputLabel value="#{msg.modifyBy}" for="modifyBy" />
                        <h:outputText value="#{sharedAssetRequestController.selected.modifyBy}"/>
                        <h:outputLabel value="#{msg.createDate}" for="createDate" />
                        <h:outputText value="#{sharedAssetRequestController.selected.createDate}">
                            <f:convertDateTime pattern="yyyy/MM/dd HH:mm:ss" />
                        </h:outputText>
                        <h:outputLabel value="#{msg.modifyDate}" for="modifyDate" />
                        <h:outputText value="#{sharedAssetRequestController.selected.modifyDate}">
                            <f:convertDateTime pattern="yyyy/MM/dd HH:mm:ss" />
                        </h:outputText>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton rendered="#{sharedAssetRequestController.deleteAction}" icon="ui-icon-trash" actionListener="#{sharedAssetRequestController.delete}" value="#{msg.Delete}" update="display,:SharedAssetRequestViewDlg, :SharedAssetRequestListForm:datalist, :growl" oncomplete="handleSubmit(args, 'SharedAssetRequestViewDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Close}" icon="glyphicon-off" onclick="PF('SharedAssetRequestViewDialog').hide()"/>
                    
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
