<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="surgeryEquipmentInfoSettingEditBatch" width="75%" height="600"
              widgetVar="surgeryEquipmentInfoSettingEditBatch" modal="true" resizable="true" draggable="true" appendTo="@(body)"
              header="新增绩效设备">
        <div class="ui-g-12 card">
            <h:form id="surgeryEquipmentBatchForm">
                <style>
                    .surgery-batch-equal-col { width: 25% !important; box-sizing: border-box; }
                    .surgery-batch-equal-col .ui-inputtext,
                    .surgery-batch-equal-col .ui-autocomplete,
                    .surgery-batch-equal-col .ui-selectonemenu,
                    .surgery-batch-equal-col .ui-inputnumber { width: 100% !important; box-sizing: border-box; }
                    .surgery-batch-equal-col .ui-autocomplete-input { width: calc(100% ) !important; }
                </style>

                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" columnClasses="surgery-batch-equal-col,surgery-batch-equal-col,surgery-batch-equal-col,surgery-batch-equal-col,surgery-batch-equal-col">
                    <h:panelGroup>
                        <label class="label">#{msg.hospitalId}<span style="color:red">*</span></label>
                        <p:inputText id="selectedOrgName" value="#{surgeryAnesthesiaEquipmentCreateBatchController.selectedOrg==null ? '': surgeryAnesthesiaEquipmentCreateBatchController.selectedOrg.name}" readonly="true" style="width:100%"/>
                        <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                        <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg1" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                <p:tree id="orgTree1" class="tree" style="width:98%;border:0;" value="#{surgeryAnesthesiaEquipmentCreateBatchController.orgTree}" selection="#{surgeryAnesthesiaEquipmentCreateBatchController.selectedNode}" var="node" selectionMode="single">
                                    <p:ajax process="@this" event="select" update="surgeryEquipmentBatchForm" listener="#{surgeryAnesthesiaEquipmentCreateBatchController.onSelectTreeNode}" oncomplete="PF('varPanelOrg1').hide()"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
                                    <p:treeNode type="hidden" rendered="false"/>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class='label'>#{msg.clinicalDeptName}</label>
                        <p:autoComplete id="clinicalDeptName" dropdown="true" value="#{surgeryAnesthesiaEquipmentCreateBatchController.filterDeptOrg}"
                                        scrollHeight="300" forceSelection="true"
                                        completeMethod="#{surgeryAnesthesiaEquipmentCreateBatchController.autoCompleteDept}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter"
                                        style="width:100%">
                            <p:ajax event="itemSelect" listener="#{surgeryAnesthesiaEquipmentCreateBatchController.onClinicalDeptChange}" process="@this" update="datalist"/>
                        </p:autoComplete>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class='label'>#{msg.assetGroup}</label>
                        <p:selectOneMenu id="assetGroup" value="#{surgeryAnesthesiaEquipmentCreateBatchController.assetGroup}" style="width:100%">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            <p:ajax/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class='label'>设备名称</label>
                        <p:inputText id="filterName" value="#{surgeryAnesthesiaEquipmentCreateBatchController.filterName}" style="width:100%"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class='label'>资产编号</label>
                        <p:inputText id="filterDepartNum" value="#{surgeryAnesthesiaEquipmentCreateBatchController.filterDepartNum}" style="width:100%"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class='label'>制造商序列号</label>
                        <p:inputText id="filterSerialNum" value="#{surgeryAnesthesiaEquipmentCreateBatchController.filterSerialNum}" style="width:100%"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class='label'>二维码</label>
                        <p:inputText id="filterQrCode" value="#{surgeryAnesthesiaEquipmentCreateBatchController.filterQrCode}" style="width:100%"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class='label'>采购金额下限(元)</label>
                        <p:inputNumber id="purchasePrice" value="#{surgeryAnesthesiaEquipmentCreateBatchController.purchasePrice}" decimalPlaces="0" style="width:100%">
                            <p:ajax/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:commandButton actionListener="#{surgeryAnesthesiaEquipmentCreateBatchController.getQueryAssetsList()}"
                                         value="查询" update="datalist" process="@form"
                                         icon="ui-icon-check"/>
                    </h:panelGroup>
                </p:panelGrid>

                <p:fieldset legend="设备" id="assetList" style="margin-bottom:20px">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:dataTable id="datalist" value="#{surgeryAnesthesiaEquipmentCreateBatchController.selectAssetInfos}"
                                     var="item"
                                     widgetVar="configEditList1"
                                     lazy="false" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="10" emptyMessage="#{msg.noRecordFound}"
                                     rowsPerPageTemplate="5,10,20,50">
                            <p:column width="40" id="checkBoxCol">
                                <p:selectBooleanCheckbox value="#{surgeryAnesthesiaEquipmentCreateBatchController.selectedAssetUidTable1[item.uid]}" class="selectCheckBox1">
                                    <p:ajax event="change" update="@(.selectCheckBoxHeader1)"/>
                                    <f:attribute name="assetObj" value="#{item}"/>
                                </p:selectBooleanCheckbox>
                                <f:facet name="header">
                                    <p:selectBooleanCheckbox value="#{surgeryAnesthesiaEquipmentCreateBatchController.allSelected1}" id="selectCheckBoxHeader1" class="selectCheckBoxHeader1">
                                        <p:ajax event="change" listener="#{surgeryAnesthesiaEquipmentCreateBatchController.addAssetsOfCurrentPage1}" update="@(.selectCheckBox1)"/>
                                    </p:selectBooleanCheckbox>
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.assetName}">
                                <h:outputText value="#{item.name}"/>
                            </p:column>
                            <p:column headerText="#{msg.functionType}">
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}">
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}">
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.qrCode}">
                                <h:outputText value="#{item.qrCode}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}">
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:commandButton validateClient="true" actionListener="#{surgeryAnesthesiaEquipmentCreateBatchController.addCheckedDevice}" value="添加已勾选设备" icon="fa fa-filter" process="@form" update="assetList assetList2 :growl"/>
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" id="assetList2" styleClass="ui-panelgrid-blank form-group ">
                        <p:dataTable id="datalist1" value="#{surgeryAnesthesiaEquipmentCreateBatchController.selectAsset}"
                                     var="item"
                                     widgetVar="selectedTable"
                                     lazy="false" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="10" emptyMessage="#{msg.noRecordFound}" rowKey="#{item.id}"
                                     rowsPerPageTemplate="5,10,20,50">
                            <p:column width="40" id="checkBoxCol1">
                                <p:selectBooleanCheckbox value="#{surgeryAnesthesiaEquipmentCreateBatchController.selectedAssetUidTable2[item.uid]}" class="selectCheckBox2">
                                    <p:ajax event="change" update="@(.selectCheckBoxHeader2)"/>
                                    <f:attribute name="assetObj" value="#{item}"/>
                                </p:selectBooleanCheckbox>
                                <f:facet name="header">
                                    <p:selectBooleanCheckbox value="#{surgeryAnesthesiaEquipmentCreateBatchController.allSelected2}" id="selectCheckBoxHeader2" class="selectCheckBoxHeader2">
                                        <p:ajax event="change" listener="#{surgeryAnesthesiaEquipmentCreateBatchController.addAssetsOfCurrentPage2}" update="@(.selectCheckBox2)"/>
                                    </p:selectBooleanCheckbox>
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.assetName}">
                                <h:outputText value="#{item.name}"/>
                            </p:column>
                            <p:column headerText="#{msg.functionType}">
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}">
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}">
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.qrCode}">
                                <h:outputText value="#{item.qrCode}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}">
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:commandButton validateClient="true" actionListener="#{surgeryAnesthesiaEquipmentCreateBatchController.deleteCheckedDevice}" value="删除已勾选设备" update="assetList assetList2 :growl" icon="ui-icon-check"/>
                        <p:commandButton value="全部清空" actionListener="#{surgeryAnesthesiaEquipmentCreateBatchController.clearAll}" icon="ui-icon-cancel" update="assetList assetList2 :growl"/>
                    </p:panelGrid>
                </p:fieldset>

                <p:commandButton validateClient="true" actionListener="#{surgeryAnesthesiaEquipmentCreateBatchController.save}"
                                 value="#{msg.Save}" update=":SurgeryEquipmentInfoListForm:datalist :growl"
                                 icon="ui-icon-check"
                                 oncomplete="handleSubmitDigital(args, 'surgeryEquipmentInfoSettingEditBatch')"/>

                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('surgeryEquipmentInfoSettingEditBatch').hide()"/>
            </h:form>
        </div>
    </p:dialog>

    <script type="text/javascript">
        function handleSubmitDigital(args, dialog) {
            if (args.validationFailed) {
                PF(dialog).show();
            } else {
                PF(dialog).hide();
            }
        }
    </script>

</ui:composition>
</html>
