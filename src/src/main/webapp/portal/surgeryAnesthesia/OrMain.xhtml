
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:his="http://www.ge.com/tags/his">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="设备匹配"/>
            </div>

            <div class="ui-g-12 card ">
                <h:form id="HisOrgForm">
                    <div style="border: 0px solid;margin: 10px 10px 15px 0px">
                        <his:selectOrg update="@(form)"></his:selectOrg>
                    </div>
                </h:form>
                <p:tabView id="HisTab" class="tabs">
                    <p:tab title="数据匹配" id="showList">
                        <ui:include src="hisMatch.xhtml"/>
                    </p:tab>
                    <p:tab title="取消匹配" id="result">
                        <ui:include src="hisUnmatch.xhtml"/>
                    </p:tab>
                    <p:tab title="设备导入" id="import">
                        <ui:include src="hisAssetImport.xhtml"/>
                    </p:tab>
                </p:tabView>

            </div>
        </div>
    </ui:define>
</ui:composition>
