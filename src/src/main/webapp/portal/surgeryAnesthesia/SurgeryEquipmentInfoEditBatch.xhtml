<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="surgeryEquipmentInfoEditBatch" width="50%" height="280"
              widgetVar="surgeryEquipmentInfoEditBatch" modal="true" resizable="true" draggable="true" appendTo="@(body)"
              header="批量修改">
        <div class="ui-g-12 card">
            <h:form id="surgeryEquipmentEditBatchForm">

                <p:fieldset legend="绩效设备信息" style="margin-bottom:20px">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">展示名称</label>
                            <p:inputText id="displayName" value="#{surgeryAnesthesiaEquipmentInfoController.batchDisplayName}">
                                <p:ajax/>
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">阳性率(%)</label>
                            <p:inputNumber minValue="0" maxValue="100" decimalPlaces="2" id="positiveRate"
                                           value="#{surgeryAnesthesiaEquipmentInfoController.batchPositiveRate}">
                                <p:ajax/>
                            </p:inputNumber>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>

                <p:commandButton validateClient="true" actionListener="#{surgeryAnesthesiaEquipmentInfoController.editBatch}"
                                 value="保存" update=":SurgeryEquipmentInfoListForm:datalist :growl :surgeryEquipmentEditBatchForm"
                                 icon="ui-icon-check"
                                 oncomplete="handleSubmitEditBatch(args, 'surgeryEquipmentInfoEditBatch')"/>

                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('surgeryEquipmentInfoEditBatch').hide()"/>

            </h:form>
        </div>
    </p:dialog>

    <script type="text/javascript">
        function handleSubmitEditBatch(args, dialog) {
            if (args.validationFailed) {
                PF(dialog).show();
            } else {
                PF(dialog).hide();
            }
        }
    </script>

</ui:composition>
</html>
