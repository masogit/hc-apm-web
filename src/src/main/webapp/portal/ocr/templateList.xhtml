<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            .ui-selectmanycheckbox td{
                width: 80px !important;
            }
            .ui-state-highlight{
                background-color: #5180ce !important;
                color: #ffffff;
            }
            .ui-datatable-tablewrapper{
                /*max-height: 400px !important;*/
                overflow-y: auto;
            }
            .ui-inputnumber input{
                width: 95%;
            }
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="OCR模板配置管理"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="templateListForm">
                    <p:dataTable id="datalist" class="datalist" value="#{ocrTemplateController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{ocrTemplateController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="editButton deleteButton testButton" />
                        <p:ajax event="filter" listener="#{ocrTemplateController.onFilter}" />

                        <p:column headerText="#{msg.template}#{msg.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>

                        <p:column headerText="#{msg.template}#{msg.type}" filterBy="#{item.type}" filterMatchMode="LIKE">
                            <h:outputText value="#{ocrTemplateController.fieldsMap.get(item.type)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{ocrTemplateController.fieldsMap.entrySet()}" var="fieldItem" itemLabel="#{fieldItem.value}"  itemValue="#{fieldItem.key}" />
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>

                        <p:column headerText="#{msg.remark}"  >
                            <h:outputText value="#{item.remark}" />
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon ui-icon-add" title="#{msg.Create}" class="btn btn-sm btn-gray" action="CreateTemplate.xhtml?faces-redirect=true&amp;action=Create" />
                            <p:commandButton id="editButton" icon="ui-icon ui-icon-pencil" action="#{ocrTemplateController.getEditLink}" class="btn btn-sm btn-gray" title="#{msg.Edit}" disabled="#{empty ocrTemplateController.selected}" />
                            <p:commandButton id="deleteButton" icon="ui-icon ui-icon-delete" actionListener="#{ocrTemplateController.delete()}" class="btn btn-sm btn-gray" title="#{msg.Edit}" update=":templateListForm"  disabled="#{empty ocrTemplateController.selected}" >
                                <p:confirm header="删除-#{item.name}" message="您确认要删除选中的配置吗？" icon="ui-icon-warning"/>
                            </p:commandButton>
                            <p:commandButton id="testButton" title="测试" icon="ui-icon ui-icon-wifi-tethering" update=":ocrPreviewedDlg"  class="btn btn-sm btn-gray" oncomplete="PF('ocrPreviewedDlg').show()" disabled="#{empty ocrTemplateController.selected}" />
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
        <ui:include src="preview.xhtml"/>
    </ui:define>
</ui:composition>
