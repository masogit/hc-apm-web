<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="OCR模板#{msg.modify}"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="ocrEditForm">
                    <div class="ui-g-12 ui-lg-7">
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">#{msg.template}#{msg.name}*</label>
                                    <p:inputText value="#{ocrTemplateController.thisTemplate.name}" required="true" requiredMessage="#{msg.template}#{msg.type}不能为空"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.template}#{msg.type}</label>
                                    <p:selectOneMenu value="#{ocrTemplateController.thisTemplate.type}" required="true" requiredMessage="#{msg.template}#{msg.type}不能为空">
                                        <p:ajax event="select" process="@this" update="elementTable" />
                                        <f:selectItems value="#{ocrTemplateController.fieldsMap.entrySet()}" var="fieldItem" itemLabel="#{fieldItem.value}"  itemValue="#{fieldItem.key}" />
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.remark}</label>
                                    <p:inputText value="#{ocrTemplateController.thisTemplate.remark}" />
                                </h:panelGroup>
                            </p:panelGrid>
                            <h:panelGroup >
                                <p:dataTable  id="elementTable"  value="#{ocrTemplateController.templateJsonObject['Elements']}" var="element" editable="true" >
                                    <f:facet name="header">
                                        #{msg.Text}#{msg.modify}
                                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}"  actionListener="#{ocrTemplateController.createNewElement}" update="elementTable" process="@this" />
                                    </f:facet>
                                    <p:ajax event="rowEdit"  update="ocrEditForm:preView :growl" />
                                    <p:ajax event="rowEditCancel"  update=":growl" />

                                    <p:column headerText="关键字">
                                        <p:cellEditor>
                                            <f:facet name="output"><h:outputText value="#{element.TextValue}" /></f:facet>
                                            <f:facet name="input"><p:inputText  value="#{element.TextValue}" style="width:100%"/></f:facet>
                                        </p:cellEditor>
                                    </p:column>
                                    <p:column headerText="#{msg.field}">
                                        <p:cellEditor>
                                            <f:facet name="output"><h:outputText value="#{element.FieldKey}" /></f:facet>
                                            <f:facet name="input"><p:inputText  value="#{element.FieldKey}" style="width:100%"/></f:facet>
                                        </p:cellEditor>
                                    </p:column>

                                    <p:column headerText="#{msg.positionX}">
                                        <p:cellEditor>
                                            <f:facet name="output"><h:outputText value="#{element.PositionX}" /></f:facet>
                                            <f:facet name="input"><p:inputNumber  value="#{element.PositionX}" decimalPlaces="0" /></f:facet>
                                        </p:cellEditor>
                                    </p:column>
                                    <p:column headerText="#{msg.positionY}">
                                        <p:cellEditor>
                                            <f:facet name="output"><h:outputText value="#{element.PositionY}" /></f:facet>
                                            <f:facet name="input"><p:inputNumber  value="#{element.PositionY}" decimalPlaces="0" /></f:facet>
                                        </p:cellEditor>
                                    </p:column>
                                    <p:column headerText="#{msg.width}">
                                        <p:cellEditor>
                                            <f:facet name="output"><h:outputText value="#{element.Width}" /></f:facet>
                                            <f:facet name="input"><p:inputNumber  value="#{element.Width}" decimalPlaces="0" /></f:facet>
                                        </p:cellEditor>
                                    </p:column>
                                    <p:column headerText="#{msg.height}">
                                        <p:cellEditor>
                                            <f:facet name="output"><h:outputText value="#{element.Height}" /></f:facet>
                                            <f:facet name="input"><p:inputNumber  value="#{element.Height}" decimalPlaces="0" /></f:facet>
                                        </p:cellEditor>
                                    </p:column>
                                    <p:column style="width:32px">
                                        <p:rowEditor editTitle="#{msg.Edit}" />
                                        <p:commandLink process="@this" actionListener="#{ocrTemplateController.removeElement(element)}" title="#{msg.Delete}" update="ocrEditForm:preView elementTable"><span class="ui-icon ui-icon-trash" /></p:commandLink>
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>

                            <h:panelGroup >
                                <p:commandButton value="#{msg.Save}" icon="ui-icon-check" action="#{ocrTemplateController.saveChange()}" oncomplete="" validateClient="true" update="ocrEditForm:preView :growl"  style="float:right"/>
                                <p:commandButton value="#{msg.Return}"  icon="ui-icon-arrow-back" action="templateList.xhtml?faces-redirect=true" immediate="true"  update=":growl" style="float:right"/>
                            </h:panelGroup>

                    </div>
                    <div class="ui-g-12 ui-lg-5" style="text-align: center" >
                        <div>
                            <label>#{msg.preView}</label>
                        </div>
                        <h:panelGroup id="preView">
                            <img  style="border: 1px;border-color: grey;border-style: solid" src="#{ocrTemplateController.getPreViewBase64()}"  />
                        </h:panelGroup>
                    </div>

                </h:form>

            </div>
        </div>

        <script type="text/javascript">
            function handleComplete(xhr, status, args) {
                if (args.url) {
                    PF('importDlg').hide()
                }
            }
        </script>
    </ui:define>
</ui:composition>
