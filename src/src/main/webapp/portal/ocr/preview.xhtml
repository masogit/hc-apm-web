<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
        xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="ocrPreviewedDlg" width="1000" height="800"  widgetVar="ocrPreviewedDlg" modal="true" howEffect="fade"  maximizable="true" appendTo="@this">
        <h:form id="ocrPreviewedFrom">
            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">#{msg.template}#{msg.name}</label>
                    <h:outputText value="#{ocrTemplateController.selected.name}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.template}#{msg.type}</label>
                    <p:selectOneMenu disabled="true" value="#{ocrTemplateController.selected.type}" required="true" requiredMessage="#{msg.template}#{msg.type}不能为空">
                        <f:selectItems value="#{ocrTemplateController.businessType.entrySet()}" var="fieldItem" itemLabel="#{fieldItem.value}"  itemValue="#{fieldItem.key}" />
                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup>
                    <p:fileUpload allowTypes="/(\.|\/)(pdf|jpeg|jpg|png)$/" fileUploadListener="#{ocrTemplateController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                  multiple="false" sizeLimit="20000000" update="previewResult fileName" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}20M"  label="#{msg.Add}"  />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">文件名</label>
                    <h:outputText id="fileName" value="#{ocrTemplateController.fileName}"/>
                </h:panelGroup>
            </p:panelGrid>
            <h:panelGrid columns="1" layout="grid" >
                <p:inputTextarea id="previewResult" value="#{ocrTemplateController.previewResult}" readonly="true" rows="10" cols="50" autoResize="false" />
            </h:panelGrid>
        </h:form>

    </p:dialog>
</ui:composition>
</html>
