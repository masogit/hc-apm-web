<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="specificationEditDlg" widgetVar="specificationEditDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)"
              header="#{acquisitionSpecificationListController.CRUDActionName} 课程" height="500" width="600">

        <h:form id="editForm" rendered="#{not empty acquisitionSpecificationListController.selected}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <p:outputLabel class="label">大类<span style="color: red">*</span></p:outputLabel>
                        <p:selectOneMenu value="#{acquisitionSpecificationListController.selected.majorCategory}"
                                         required="true" requiredMessage="大类不能为空！" styleClass="width-pct-100">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{acquisitionSpecificationListController.majorCategoryOptions}" 
                                           var="cat" itemLabel="#{cat}" itemValue="#{cat}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <p:outputLabel class="label">一级分类<span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{acquisitionSpecificationListController.selected.firstLevelCategory}" 
                                     required="true" requiredMessage="一级分类不能为空！" styleClass="width-pct-100"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <p:outputLabel class="label">二级分类<span style="color: red">*</span></p:outputLabel>
                        <p:inputText value="#{acquisitionSpecificationListController.selected.secondLevelCategory}" 
                                     required="true" requiredMessage="二级分类不能为空！" styleClass="width-pct-100"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <p:outputLabel class="label">设备等级<span style="color: red">*</span></p:outputLabel>
                        <p:selectOneMenu value="#{acquisitionSpecificationListController.selected.deviceGrade}" styleClass="width-pct-100"  required="true">
                            <f:selectItem itemLabel="请选择" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{acquisitionSpecificationListController.deviceGradeOptions}" 
                                           var="grade" itemLabel="#{grade.label}" itemValue="#{grade.value}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <p:outputLabel class="label">modality<span style="color: red">*</span></p:outputLabel>
                        <p:selectOneMenu value="#{acquisitionSpecificationListController.selected.modality}" styleClass="width-pct-100"  required="true">
                            <f:selectItem itemLabel="请选择" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{acquisitionSpecificationListController.modalityOptions}" 
                                           var="m" itemLabel="#{m}" itemValue="#{m}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup colspan="2">
                        <p:outputLabel class="label">分类简述</p:outputLabel>
                        <p:inputTextarea value="#{acquisitionSpecificationListController.selected.briefDescription}" 
                                         rows="3" cols="30" maxlength="500" styleClass="width-pct-100"/>
                    </h:panelGroup>

                    <h:panelGroup colspan="2">
                        <p:outputLabel class="label">典型示例</p:outputLabel>
                        <p:inputTextarea value="#{acquisitionSpecificationListController.selected.typicalExamples}" 
                                         rows="4" cols="50" maxlength="1000" styleClass="width-pct-100"/>
                    </h:panelGroup>
                </p:panelGrid>

                <br/>

                <p:commandButton validateClient="true" update=":growl" oncomplete="PF('specificationEditDlg').hide()"
                                 action="#{acquisitionSpecificationListController.save}" 
                                 value="#{msg.Save}" icon="ui-icon-check"/>
                <p:commandButton immediate="false" process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back" oncomplete="PF('specificationEditDlg').hide()"
                                 action="#{acquisitionSpecificationListController.backList}"/>
            </h:form>
    </p:dialog>
</ui:composition>
</html>
