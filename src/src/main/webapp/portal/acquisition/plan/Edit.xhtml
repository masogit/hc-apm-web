<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="购置计划管理编辑"/>
        </div>
        <div  class="ui-g-12 card">
            <h:form id="planFilingPeriodEditForm">
                <p:accordionPanel id="accordionPanel" multiple="true" activeIndex="0,1,2,3,4">
                    <p:tab title="申报信息" closable="false">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <p:outputLabel class="label">申报单位</p:outputLabel>
                                <p:inputText value="#{acquisitionPlanEditController.selected.applicationHospitalName}" disabled="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">申报科室<span style="color: red">*</span></p:outputLabel>
                                <p:inputText  id="dept" value="#{acquisitionPlanEditController.selected.applicationDeptName}" readonly="true" required="false" requiredMessage="申报科室 #{msg.ValidationRequire}" />
                                <p:commandButton id="orgEdit" process="@this" icon="fa fa-angle-down"
                                                 class="btn btn-sm popupIconButton" />
                                <p:overlayPanel  id="popupPanelEdit" widgetVar="varOrgEdit" for="orgEdit"
                                                 style="position: absolute; left: 0; top: 0; width: 300px;"
                                                 dynamic="false" modal="false" dismissable="true"   >
                                    <p:scrollPanel style="height:300px; border: 0" mode="native"  >
                                        <p:inputText id="searchDeptName" value="#{acquisitionPlanEditController.searchDeptName}"  />
                                        <p:commandButton process=":planFilingPeriodEditForm:accordionPanel:searchDeptName @this" partialSubmit="true" icon="ui-icon-search" update="orgTreeEdit" actionListener="#{acquisitionPlanEditController.treeSearchCondition()}" value="检索"/>
                                        <p:tree id="orgTreeEdit" value="#{acquisitionPlanEditController.orgTreeEdit}" var="node"
                                                selectionMode="single" class="tree" style="width:98%; border:0"  >
                                            <p:ajax process="@this" event="select"
                                                    update="@parent:dept "
                                                    listener="#{acquisitionPlanEditController.onSelectTreeNode}"
                                                    oncomplete="PF('varOrgEdit').hide();" />
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>
                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">申报人</p:outputLabel>
                                <p:inputText value="#{acquisitionPlanEditController.selected.applicationUserName}" disabled="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">申报时间</p:outputLabel>
                                <h:outputText value="#{acquisitionPlanEditController.selected.applicationDate}">
                                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                       locale="#{userContextService.getCalendarLocale()}"
                                                       pattern="#{userContextService.timeFormat14()}"/>
                                </h:outputText>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:tab>
                    <p:tab title="购置设备信息" closable="false">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="acquisitionAsset">
                            <h:panelGroup>
                                <p:outputLabel class="label">设备名称<span style="color: red">*</span></p:outputLabel>
                                <p:inputText value="#{acquisitionPlanEditController.selected.assetName}" required="false" requiredMessage="设备名称 不能为空！" disabled="#{!acquisitionPlanEditController.canEdit}"><p:ajax /></p:inputText>
                            </h:panelGroup>

                            <h:panelGroup>
                                <p:outputLabel class="label">规格<span style="color: red">*</span></p:outputLabel>
                                <p:inputText id="specifications" value="#{acquisitionPlanEditController.selected.specifications}" required="false" requiredMessage="规格 不能为空！" disabled="true"><p:ajax /></p:inputText>
                                <p:commandButton id="specificationsBtn" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" />
                                <p:overlayPanel  id="specificationsEdit" widgetVar="varSpecificationsEdit" for="specificationsBtn"
                                                 style="position: absolute; left: 0; top: 0; width: 300px;" dynamic="false" modal="false" dismissable="true"   >
                                    <p:scrollPanel style="height:300px; border: 0" mode="native"  >
                                        <p:inputText id="searchSpecifications" value="#{acquisitionPlanEditController.searchSpecifications}"  />
                                        <p:commandButton process=":planFilingPeriodEditForm:accordionPanel:searchSpecifications @this" partialSubmit="true" icon="ui-icon-search" update="specificationsTreeEdit" actionListener="#{acquisitionPlanEditController.treeSearchSpecificationsCondition()}" value="检索"/>
                                        <p:tree id="specificationsTreeEdit" value="#{acquisitionPlanEditController.orgTreeSpecifications}" var="node"
                                                selectionMode="single" class="tree" style="width:98%; border:0"  showRoot="false"  >
                                            <p:ajax process="@this" event="select"
                                                    update="@parent:specifications "
                                                    listener="#{acquisitionPlanEditController.onSelectSpecificationsTreeNode}"
                                                    oncomplete="PF('varSpecificationsEdit').hide();" />
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>
                                            <p:treeNode type="firstLevel" styleClass="treeNodeDisabled">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                            <p:treeNode type="secondLevel">
                                                <h:outputText value="#{node.secondLevelCategory}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>

                            <h:panelGroup>
                                <p:outputLabel class="label">申请类别<span style="color: red">*</span></p:outputLabel>
                                <p:selectOneMenu value="#{acquisitionPlanEditController.selected.applicationType}" required="false"  requiredMessage="申请类别 #{msg.Blank}#{msg.ValidationRequire}" disabled="#{!acquisitionPlanEditController.canEdit}" >
                                    <p:ajax  update="acquisitionAsset"/>
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('acquisitionApplicationType')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{acquisitionPlanEditController.selected.applicationType eq 'updates'}">
                                <p:outputLabel class="label">被更新设备<span style="color: red">*</span></p:outputLabel>
                                <c:if test="#{!acquisitionPlanEditController.canEdit}">
                                    <p:outputLabel value="#{acquisitionPlanEditController.splitAssetName(acquisitionPlanEditController.selected.updatedAssetName)}" title="#{acquisitionPlanEditController.selected.updatedAssetName}" />
                                </c:if>
                                <c:if test="#{acquisitionPlanEditController.canEdit}">
                                    <p:inputText value="#{acquisitionPlanEditController.selected.updatedAssetName}" title="#{acquisitionPlanEditController.selected.updatedAssetName}" required="false" requiredMessage="被更新设备 不能为空！" readonly="#{acquisitionPlanEditController.canEdit}"><p:ajax /></p:inputText>
                                </c:if>
                                <p:commandButton class="popupIconButton" actionListener="#{acquisitionSelectAssetController.prepareDialogCallback(acquisitionPlanEditController, ':planFilingPeriodEditForm', acquisitionPlanEditController.selectedAssets, acquisitionPlanEditController.selected.applicationStatus,  acquisitionPlanEditController.selected.updatedAssetUid)}" process="@this" icon="ui-icon-arrow-drop-down" update=":selectAssetDlg " oncomplete="PF('varSelectAssetDlg').show();"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">计划采购数量（台/套）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="false" requiredMessage="计划采购数量（台/套） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.applicationPlanCount}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax listener="#{acquisitionPlanEditController.calcAmount()}" update="@this budgetTotalAmount "/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">预算单价（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="4" required="false" requiredMessage="预算单价（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.budgetUnitPrice}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax listener="#{acquisitionPlanEditController.calcAmount()}" update="@this budgetTotalAmount depreciationCost"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">预算总价（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber id="budgetTotalAmount" inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="false" requiredMessage="预算总价（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.budgetTotalAmount}" disabled="true">
                                    <p:ajax />
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">预计使用年限（年）<span style="color: red">*</span></p:outputLabel>
                                <p:selectOneMenu value="#{acquisitionPlanEditController.selected.estimatedServiceYears}" required="false"  requiredMessage="预计使用年限（年） #{msg.ValidationRequire}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax update="depreciationCost" listener="#{acquisitionPlanEditController.calcDepreciationCost()}"/>
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{acquisitionPlanEditController.getYears()}" var="entry" itemLabel="#{entry}" itemValue="#{entry}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">同类设备数量（台/套）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="false" requiredMessage="同类设备数量（台/套） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.similarEquipmentCount}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{acquisitionPlanEditController.selected.applicationType eq 'updates'}">
                                <p:outputLabel class="label">拟更新设备已使用年数（年）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="false" requiredMessage="拟更新设备已使用年数（年） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.currentEquipmentServiceYears}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax />
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">资金来源<span style="color: red">*</span></p:outputLabel>
                                <p:selectOneMenu value="#{acquisitionPlanEditController.selected.fundingSource}" required="false"  requiredMessage="资金来源 #{msg.ValidationRequire}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax />
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('acquisitionFundingSource')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">资金落实（是/否）<span style="color: red">*</span></p:outputLabel>
                                <p:selectOneMenu value="#{acquisitionPlanEditController.selected.fundingImplemented}" required="false"  requiredMessage="资金落实（是/否） #{msg.ValidationRequire}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax />
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('budgetApplicationT_F')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">甲乙类大型医疗设备及配置许可证<span style="color: red">*</span></p:outputLabel>
                                <p:selectOneMenu value="#{acquisitionPlanEditController.selected.medicalEquipmentLicense}" required="false"  requiredMessage="资金落实（是/否） #{msg.ValidationRequire}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax />
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('medicalEquipmentLicense')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">场地改造成本（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="false" requiredMessage="场地改造成本（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.siteRenovationCost}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">采购原因<span style="color: red">*</span></p:outputLabel>
                                <p:inputTextarea value="#{acquisitionPlanEditController.selected.purchaseReason}" maxlength="250" rows="2" cols="20" required="false" requiredMessage="采购原因 #{msg.ValidationRequire}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                </p:inputTextarea>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{acquisitionPlanEditController.selected.applicationType eq 'necessities' or acquisitionPlanEditController.selected.applicationType eq 'general'}">
                                <p:outputLabel class="label">新增人员配置（人）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="false" requiredMessage="新增人员配置（人） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.newStaffAllocation}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:tab>
                    <p:tab title="年度运用效益分析" closable="false">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup >
                                <p:outputLabel class="label">折旧成本（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber id="depreciationCost" inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="false" requiredMessage="折旧成本（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.depreciationCost}" disabled="true">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">维保费用（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="false" requiredMessage="维保费用（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.maintenanceCost}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">配套不可单独收费耗材收费占比急采购成本（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="false" requiredMessage="配套不可单独收费耗材收费占比急采购成本（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.consumablesCost}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">年均服务量（人/次）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="false" requiredMessage="年均服务量（人/次） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.annualServiceVolume}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax />
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">年服务收入总金额（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="false" requiredMessage="年服务收入总金额（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.annualServiceIncome}" disabled="#{!acquisitionPlanEditController.canEdit}">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">年度运营效益权重（%）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber id="annualOperationEfficiencyWeight" inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="true" requiredMessage="年度运营效益权重（%） #{msg.ValidationRequire}" value="#{acquisitionPlanEditController.selected.annualOperationEfficiencyWeight}" disabled="true">
                                    <p:ajax />
                                </p:inputNumber>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:tab>
                    <p:tab title="附件信息" closable="false">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <p:dataList id="attachList"
                                            value="#{acquisitionPlanEditController.getAttachList()}"
                                            var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}"
                                            paginator="true" paginatorPosition="top" paginatorAlwaysVisible="false" rows="5">
                                    <f:facet name="header">附件详情</f:facet>
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                    <p:commandButton actionListener="#{acquisitionPlanEditController.removeAttachmentById(fileitem.id)}" update="attachList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this" >
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>
                                </p:dataList>
                                <p:fileUpload allowTypes="/(\.|\/)(pdf|PDF)$/" fileUploadListener="#{acquisitionPlanEditController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" rendered="#{acquisitionPlanEditController.canEdit}"
                                              multiple="true"  sizeLimit="100000000"  update="attachList" auto="true" invalidFileMessage="文件类型只能上传pdf格式" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:tab>
                    <p:tab title="工单详情" closable="false" rendered="#{!(empty acquisitionPlanEditController.selected.applicationStatus or acquisitionPlanEditController.selected.applicationStatus eq 'TempSave')}">
                        <p:dataTable id="steplist" value="#{acquisitionPlanEditController.acquisitionPlanStepList}"
                                     var="item" widgetVar="varbudgetAssetDatalist" lazy="true" paginator="true"
                                     selectionMode="single"
                                     paginatorPosition="top" paginatorAlwaysVisible="true" rowKey="#{item.id}"
                                     sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5">
                            <p:column headerText="审批级别">
                                <h:outputText value="#{item.step}"/>
                            </p:column>
                            <p:column headerText="待审批人">
                                <h:outputText value="#{item.pendingAuditUserName}"/>
                            </p:column>
                            <p:column headerText="实际审批人">
                                <h:outputText value="#{item.actualAuditUserName}"/>
                            </p:column>
                            <p:column headerText="审批状态">
                                <h:outputText value="#{fieldMsg.fieldValue('AcquisitionApplicationStatus', item.auditStatus)}"/>
                            </p:column>
                            <p:column headerText="审批节点状态">
                                <h:outputText value="#{fieldMsg.fieldValue('AcquisitionNodeStatus', item.nodeStatus)}"/>
                            </p:column>
                            <p:column headerText="审批时间">
                                <h:outputText value="#{item.auditDate}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="审批结果">
                                <h:outputText value="#{fieldMsg.fieldValue('AcquisitionNodeStatus', item.auditResult)}"/>
                            </p:column>
                            <p:column headerText="审批意见">
                                <h:outputText value="#{item.auditComment}"/>
                            </p:column>
                        </p:dataTable>
                    </p:tab>
                </p:accordionPanel>
                <br/>
                <p:commandButton update=":growl :planFilingPeriodEditForm" validateClient="true"
                                 action="#{acquisitionPlanEditController.saveApplication}" value="暂存" id="saveApplication" rendered="#{acquisitionPlanEditController.canEdit}" />
                <p:commandButton update=":growl :planFilingPeriodEditForm" validateClient="true"
                                 action="#{acquisitionPlanEditController.submitApplication}" value="提交" id="submitApplication" rendered="#{acquisitionPlanEditController.canEdit}" />
                <p:commandButton update=":growl :planFilingPeriodEditForm" validateClient="true"
                                 action="#{acquisitionPlanEditController.cancelApplication}" value="取消" id="cancelApplication" rendered="#{acquisitionPlanEditController.canEdit and not empty acquisitionPlanEditController.selected.id}" />
                <p:commandButton update=":growl :planFilingPeriodEditForm" immediate="false" process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back"
                                 action="#{acquisitionPlanEditController.backList}" />
            </h:form>
        </div>
        <ui:include src="selectAssetList.xhtml"></ui:include>
    </ui:define>

</ui:composition>
