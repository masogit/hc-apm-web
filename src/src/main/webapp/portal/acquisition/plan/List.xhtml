<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            .zoom-06 {
                zoom: 0.6;
            }

            .zoom-08 {
                zoom: 0.8;
            }

            .wrap-text {
                word-break: break-word;
                word-wrap: break-word;
                white-space: normal;
            }

            .width-pct-100 {
                min-width: 50% !important;
                max-width: 100% !important;
            }
        </style>

        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="购置计划管理"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="formList">
                    <p:dataTable id="datalist" value="#{acquisitionPlanListController.lazyModel}" var="item"
                                 widgetVar="varDataList"
                                 selectionMode="single" selection="#{acquisitionPlanListController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending"
                                 sortBy="#{item.applicationDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="10" pageLinks="5" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="createButton editButton deleteButton"/>
                        <p:ajax event="filter" listener="#{acquisitionPlanListController.onFilter}"
                                update="createButton editButton deleteButton"/>

                        <p:column headerText="申请年份">
                            <h:outputText value="#{item.applicationYear}"/>
                        </p:column>
                        <p:column headerText="申请编号">
                            <h:outputText value="#{item.applicationNo}"/>
                        </p:column>
                        <p:column headerText="申报单位">
                            <h:outputText value="#{item.applicationHospitalName}"/>
                        </p:column>
                        <p:column headerText="申报科室">
                            <h:outputText value="#{item.applicationDeptName}"/>
                        </p:column>
                        <p:column headerText="设备名称">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                        <p:column headerText="申请类别">
                            <h:outputText value="#{item.applicationType}"/>
                        </p:column>
                        <p:column headerText="计划采购数量" styleClass="zoom-08">
                            <h:outputText value="#{item.applicationPlanCount}"/>
                        </p:column>
                        <p:column headerText="预算单价（万元）" styleClass="zoom-08">
                            <h:outputText value="#{item.budgetUnitPrice}">
                                <f:convertNumber pattern="#,##0.0000" maxFractionDigits="4"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="预算总价（万元）" styleClass="zoom-08">
                            <h:outputText value="#{item.budgetTotalAmount}">
                                <f:convertNumber pattern="#,##0.0000" maxFractionDigits="4"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="预计使用年限（年）" styleClass="zoom-08">
                            <h:outputText value="#{item.estimatedServiceYears}"/>
                        </p:column>
                        <p:column headerText="工单状态">
                            <h:outputText value="#{item.applicationStep}"/>
                        </p:column>
                        <p:column headerText="申请人">
                            <h:outputText value="#{item.applicationUserName}"/>
                        </p:column>
                        <p:column headerText="申请时间">
                            <h:outputText value="#{item.applicationDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss"/>
                            </h:outputText>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" action="#{acquisitionPlanListController.createUrl()}" update=":formList"  rendered="#{userContextService.accessContainsFunctionMenu('ACQUISITION_PLAN_MANAGEMENT_APPLY_EDIT')}"/>
                            <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" action="#{acquisitionPlanListController.editUrl()}" update=":formList" disabled="#{empty acquisitionPlanListController.selected.id}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{acquisitionPlanListController.delete}" update=":formList" disabled="#{empty acquisitionPlanListController.selected.id}" rendered="#{userContextService.accessContainsFunctionMenu('ACQUISITION_PLAN_MANAGEMENT_APPLY_EDIT')}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="Purcahse_Budget_Config_Export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>

                </h:form>

                <!--<ui:include src="Edit.xhtml"/>-->
            </div>
        </div>

    </ui:define>

</ui:composition>
