<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <div class="ui-g-12 card">
        <!--<p:messages autoUpdate="true" closable="true" showDetail="false"/>-->

        <h:form id="currentListForm">
            <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                <p:commandButton value="待审批" process="@this" update="datalist" action="Main.xhtml?faces-redirect=true&amp;query=0" disabled="#{acquisitionPlanAuditListController.queryIndex == 0}"/>
                <p:commandButton value="我审批的" process="@this" update="datalist" action="Main.xhtml?faces-redirect=true&amp;query=1" disabled="#{acquisitionPlanAuditListController.queryIndex == 1}"/>
                <p:commandButton value="全部" process="@this" update="datalist" action="Main.xhtml?faces-redirect=true&amp;query=2" disabled="#{acquisitionPlanAuditListController.queryIndex == 2}"/>
            </h:panelGrid>
            <h:panelGroup>
                <p:overlayPanel appendTo="currentListForm" widgetVar="varPanelOrg1" for="tab:currentListForm:datalist:btnOrg1" hideEffect="fade" dynamic="false" modal="false" >
                    <p:inputText id="treeNodeNameFilter" value="#{acquisitionPlanListController.treeNodeNameFilter}"/>
                    <p:commandButton partialSubmit="true" icon="ui-icon-search" process="tab:currentListForm:treeNodeNameFilter @this" update="tab:currentListForm:orgTree" actionListener="#{acquisitionPlanAuditListController.treeSearchCondition()}" value="#{msg.Search}"/>
                    <p:commandButton partialSubmit="true" icon="ui-icon-search" process=":@this" update="tab:currentListForm" value="清空" actionListener="#{acquisitionPlanAuditListController.clearDeptOrg}"/>

                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{acquisitionPlanAuditListController.orgTreeEdit}"
                                selectionMode="single" var="node"
                                dynamic="false" cache="false" propagateSelectionUp="#{orgTreeController.propagateSelectionUp}">
                            <p:ajax process="@this" event="select"
                                    update="tab:currentListForm "
                                    listener="#{acquisitionPlanAuditListController.onSelectTreeNode}"/>
                            <p:ajax process="@this" event="expand"/>
                            <p:ajax process="@this" event="collapse"/>
                            <p:treeNode type="org">
                                <h:outputText value="#{node.name}"/>
                            </p:treeNode>
                            <p:treeNode type="hidden" rendered="false"/>
                        </p:tree>
                    </p:scrollPanel>
                </p:overlayPanel>
            </h:panelGroup>
            <p:dataTable id="datalist" value="#{acquisitionPlanAuditListController.lazyModel}" var="item"
                         widgetVar="varDataList"
                         selectionMode="single" selection="#{acquisitionPlanAuditListController.selected}"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending"
                         sortBy="#{item.applicationDate}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rows="10" pageLinks="5" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500">

                <p:ajax event="rowSelect" listener="#{acquisitionPlanAuditListController.viewUrl(item.id)}" onstart="prepareOrderViewWindow();" oncomplete="openOrderViewWindow(xhr, status, args)"/>
                <p:ajax event="filter" listener="#{acquisitionPlanAuditListController.onFilter}"/>
                <p:column headerText="申报单位"  filterBy="#{item.applicationHospitalUid}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{acquisitionPlanAuditListController.selectedHospital}" >
                            <p:ajax update="tab:currentListForm" listener="#{acquisitionPlanAuditListController.hospitalListChange}" />
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{acquisitionPlanAuditListController.hospitalList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{item.applicationHospitalName}"/>
                </p:column>
                <p:column headerText="申请年份" filterBy="#{item.applicationYear}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.applicationYear}"/>
                </p:column>
                <p:column headerText="申请编号" filterBy="#{item.applicationNo}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.applicationNo}"/>
                </p:column>

                <p:column headerText="申报科室" filterBy="#{item.applicationDeptUid}" filterMatchMode="EQ">
                    <h:outputText value="#{item.applicationDeptName}"/>
                    <f:facet name="filter" >
                        <p:autoComplete id="btnOrg1" value="请选择科室" type="button" icon="fa fa-angle-down" iconPos="right"/>
                    </f:facet>
                </p:column>
                <p:column headerText="设备名称" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.assetName}"/>
                </p:column>
                <p:column headerText="申请类别"  filterBy="#{item.applicationType}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()"  >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('acquisitionApplicationType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{fieldMsg.fieldValue('acquisitionApplicationType', item.applicationType)}"/>
                </p:column>
                <p:column headerText="计划采购数量"  filterBy="#{item.applicationPlanCount}" filterMatchMode="GTE">
                    <h:outputText value="#{item.applicationPlanCount}"/>
                </p:column>
                <p:column headerText="预算单价（万元）" filterBy="#{item.budgetUnitPrice}" filterMatchMode="GTE">
                    <h:outputText value="#{item.budgetUnitPrice}">
                        <f:convertNumber pattern="#,##0.0000" maxFractionDigits="4"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="预算总价（万元）" filterBy="#{item.budgetTotalAmount}" filterMatchMode="GTE">
                    <h:outputText value="#{item.budgetTotalAmount}">
                        <f:convertNumber pattern="#,##0.0000" maxFractionDigits="4"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="预计使用年限（年）" filterBy="#{item.estimatedServiceYears}" filterMatchMode="GTE">
                    <h:outputText value="#{item.estimatedServiceYears}"/>
                </p:column>
                <p:column headerText="工单状态"  filterBy="#{item.applicationStatus}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()"  >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('AcquisitionApplicationStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{fieldMsg.fieldValue('AcquisitionApplicationStatus', item.applicationStatus)}"/>
                </p:column>
                <p:column headerText="申请人"  filterBy="#{item.applicationUserName}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.applicationUserName}"/>
                </p:column>
                <p:column headerText="申请时间" filterBy="#{item.applicationDate}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.applicationDate}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss"/>
                    </h:outputText>
                    <f:facet name="filter">
                        <p:inputText id="filterApplicationDate" widgetVar="varFilterApplicationDate" value="#{acquisitionPlanAuditListController.filterApplicationDate}"/>
                    </f:facet>
                </p:column>
                <p:column headerText="#{msg.Actions}" style="width: 100px" exportable="false" rendered="#{acquisitionPlanAuditListController.queryIndex == 0}">
                    <p:commandButton value="审批"  action="#{acquisitionPlanAuditListController.auditUrl(item.id)}"/>

                </p:column>


                 <f:facet name="{Toolbar}">

                 </f:facet>
            </p:dataTable>
            <p:overlayPanel appendTo="currentListForm" id="idPanelFilterApplicationDate" widgetVar="panelFilterApplicationDate" for="tab:currentListForm:datalist:filterApplicationDate" dismissable="false" >
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varApplicationDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varApplicationDateTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter('varDataList', 'varFilterApplicationDate', 'varApplicationDateFrom', 'varApplicationDateTo'); PF('panelFilterApplicationDate').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterApplicationDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>
        </h:form>
        <script>
            var newWin;
            function prepareOrderViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openOrderViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }
        </script>

    </div>
</ui:composition>
</html>
