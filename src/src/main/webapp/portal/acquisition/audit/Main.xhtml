<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
    	<h:outputScript name="js/commonUtils.js"/>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="医疗设备购置计划管理"/>
            </div>

            <div class="ui-g-12 ">
                <p:tabView class="ui-g-12" id="tab" dynamic="true" cache="false" activeIndex="0" >
                    <p:ajax event="tabChange" listener="#{acquisitionPlanAuditListController.onTabChange}" update="tab"/>

                    <p:tab class="ui-g-12" title="当年购置计划" id="current">
                        <ui:include src="CurrentList.xhtml"/>
                    </p:tab>
                    <p:tab class="ui-g-12" title="历史购置计划" id="history" >
                        <ui:include src="HistoryList.xhtml"/>
                    </p:tab>


                </p:tabView>
            </div>
        </div>

    </ui:define>
</ui:composition>
