<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="医疗设备购置计划申请审批"/>
        </div>

        <div class="ui-g-12 card">
            <h:form id="auditForm">
                <p:accordionPanel id="accordionPanel" multiple="true" activeIndex="0,1,2,3,5">
                    <p:tab title="申报信息" closable="false">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <p:outputLabel class="label">申报单位</p:outputLabel>
                                <p:inputText value="#{acquisitionPlanAuditEditController.selected.applicationHospitalName}" disabled="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">申报科室<span style="color: red">*</span></p:outputLabel>
                                <p:inputText value="#{acquisitionPlanAuditEditController.selected.applicationDeptName}" disabled="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">申报人</p:outputLabel>
                                <p:inputText value="#{acquisitionPlanAuditEditController.selected.applicationUserName}" disabled="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">申报时间</p:outputLabel>
                                <h:outputText value="#{acquisitionPlanAuditEditController.selected.applicationDate}">
                                    <f:convertDateTime timeZone="#{userContextService.getTimeZone()}"
                                                       locale="#{userContextService.getCalendarLocale()}"
                                                       pattern="#{userContextService.timeFormat14()}"/>
                                </h:outputText>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:tab>
                    <p:tab title="购置设备信息" closable="false">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="acquisitionAsset">
                            <h:panelGroup>
                                <p:outputLabel class="label">设备名称<span style="color: red">*</span></p:outputLabel>
                                <p:inputText value="#{acquisitionPlanAuditEditController.selected.assetName}" required="true" requiredMessage="设备名称 不能为空！" disabled="true"><p:ajax /></p:inputText>
                            </h:panelGroup>

                            <h:panelGroup>
                                <p:outputLabel class="label">规格<span style="color: red">*</span></p:outputLabel>
                                <p:inputText value="#{acquisitionPlanAuditEditController.selected.specifications}" required="true" requiredMessage="规格 不能为空！" disabled="true"><p:ajax /></p:inputText>
                            </h:panelGroup>

                            <h:panelGroup>
                                <p:outputLabel class="label">申请类别<span style="color: red">*</span></p:outputLabel>
                                <p:selectOneMenu value="#{acquisitionPlanAuditEditController.selected.applicationType}" required="true"  requiredMessage="申请类别 #{msg.Blank}#{msg.ValidationRequire}" disabled="true" >
                                    <p:ajax  update="acquisitionAsset"/>
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('acquisitionApplicationType')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{acquisitionPlanAuditEditController.selected.applicationType eq 'updates'}">
                                <p:outputLabel class="label">被更新设备<span style="color: red">*</span></p:outputLabel>
                                <p:inputText value="#{acquisitionPlanAuditEditController.selected.updatedAssetName}" required="true" requiredMessage="被更新设备 不能为空！" disabled="true"><p:ajax /></p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">计划采购数量（台/套）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="true" requiredMessage="计划采购数量（台/套） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.applicationPlanCount}" disabled="true">
                                    <p:ajax listener="#{acquisitionPlanAuditEditController.calcAmount()}" update="@this budgetTotalAmount "/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">预算单价（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="4" required="true" requiredMessage="预算单价（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.budgetUnitPrice}" disabled="true">
                                    <p:ajax listener="#{acquisitionPlanAuditEditController.calcAmount()}" update="@this budgetTotalAmount depreciationCost"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">预算总价（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber id="budgetTotalAmount" inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="true" requiredMessage="预算总价（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.budgetTotalAmount}" disabled="true">
                                    <p:ajax />
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">预计使用年限（年）<span style="color: red">*</span></p:outputLabel>
                                <p:inputText value="#{acquisitionPlanAuditEditController.selected.estimatedServiceYears}" disabled="true"/>

                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">同类设备数量（台/套）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="true" requiredMessage="同类设备数量（台/套） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.similarEquipmentCount}" disabled="true">
                                    <p:ajax/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{acquisitionPlanAuditEditController.selected.applicationType eq 'updates'}">
                                <p:outputLabel class="label">拟更新设备已使用年数（年）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="true" requiredMessage="拟更新设备已使用年数（年） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.currentEquipmentServiceYears}" disabled="true">
                                    <p:ajax />
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">资金来源<span style="color: red">*</span></p:outputLabel>
                                <p:selectOneMenu value="#{acquisitionPlanAuditEditController.selected.fundingSource}" required="true"  requiredMessage="资金来源 #{msg.ValidationRequire}" disabled="true">
                                    <p:ajax />
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('acquisitionFundingSource')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">资金落实（是/否）<span style="color: red">*</span></p:outputLabel>
                                <p:selectOneMenu value="#{acquisitionPlanAuditEditController.selected.fundingImplemented}" required="true"  requiredMessage="资金落实（是/否） #{msg.ValidationRequire}" disabled="true">
                                    <p:ajax />
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('budgetApplicationT_F')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">甲乙类大型医疗设备及配置许可证<span style="color: red">*</span></p:outputLabel>
                                <p:selectOneMenu value="#{acquisitionPlanAuditEditController.selected.medicalEquipmentLicense}" required="true"  requiredMessage="资金落实（是/否） #{msg.ValidationRequire}" disabled="true">
                                    <p:ajax />
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('medicalEquipmentLicense')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">场地改造成本（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="true" requiredMessage="场地改造成本（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.currentEquipmentServiceYears}" disabled="true">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanAuditEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">采购原因<span style="color: red">*</span></p:outputLabel>
                                <p:inputTextarea value="#{acquisitionPlanAuditEditController.selected.purchaseReason}" rows="2" cols="20" required="false" requiredMessage="采购原因 #{msg.ValidationRequire}" disabled="true">
                                </p:inputTextarea>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{acquisitionPlanAuditEditController.selected.applicationType eq 'necessities' or acquisitionPlanAuditEditController.selected.applicationType eq 'general'}">
                                <p:outputLabel class="label">新增人员配置（人）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="true" requiredMessage="新增人员配置（人） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.newStaffAllocation}" disabled="true">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanAuditEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:tab>
                    <p:tab title="年度运用效益分析">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup >
                                <p:outputLabel class="label">折旧成本（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber id="depreciationCost" inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="true" requiredMessage="折旧成本（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.depreciationCost}" disabled="true">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanAuditEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">维保费用（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="true" requiredMessage="维保成本（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.maintenanceCost}" disabled="true">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanAuditEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">配套不可单独收费耗材收费占比急采购成本（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="true" requiredMessage="配套不可单独收费耗材收费占比急采购成本（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.consumablesCost}" disabled="true">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanAuditEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">年均服务量（人/次）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="0" required="true" requiredMessage="维保成本（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.annualServiceVolume}" disabled="true">
                                    <p:ajax />
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">年服务收入总金额（万元）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="true" requiredMessage="年服务收入总金额（万元） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.annualServiceIncome}" disabled="true">
                                    <p:ajax update="annualOperationEfficiencyWeight" listener="#{acquisitionPlanAuditEditController.calcEfficiencyWeight()}"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel class="label">年度运营效益权重（%）<span style="color: red">*</span></p:outputLabel>
                                <p:inputNumber id="annualOperationEfficiencyWeight" inputStyleClass="width-pct-100" minValue="0" decimalPlaces="2" required="true" requiredMessage="年度运营效益权重（%） #{msg.ValidationRequire}" value="#{acquisitionPlanAuditEditController.selected.annualOperationEfficiencyWeight}" disabled="true">
                                    <p:ajax />
                                </p:inputNumber>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:tab>
                    <p:tab title="附件信息">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <p:dataList id="attachList"
                                            value="#{acquisitionPlanAuditEditController.getAttachList()}"
                                            var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}"
                                            paginator="true" paginatorPosition="top" paginatorAlwaysVisible="false" rows="5">
                                    <f:facet name="header">附件详情</f:facet>
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                </p:dataList>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:tab>
                    <p:tab title="辅助论证" closable="true">
                    </p:tab>
                    <p:tab title="工单详情">
                        <p:dataTable id="steplist" value="#{acquisitionPlanAuditEditController.acquisitionPlanStepList}"
                                     var="item" widgetVar="varbudgetAssetDatalist" lazy="true" paginator="true"
                                     selectionMode="single"
                                     paginatorPosition="top" paginatorAlwaysVisible="true" rowKey="#{item.id}"
                                     sortMode="single" sortOrder="descending" sortBy="#{item.createdDate}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" pageLinks="5" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="5">
                            <p:column headerText="审批级别">
                                <h:outputText value="#{item.step}"/>
                            </p:column>
                            <p:column headerText="待审批人">
                                <h:outputText value="#{item.pendingAuditUserName}"/>
                            </p:column>
                            <p:column headerText="实际审批人">
                                <h:outputText value="#{item.actualAuditUserName}"/>
                            </p:column>
                            <p:column headerText="审批状态">
                                <h:outputText value="#{fieldMsg.fieldValue('AcquisitionApplicationStatus', item.auditStatus)}"/>
                            </p:column>
                            <p:column headerText="审批节点状态">
                                <h:outputText value="#{fieldMsg.fieldValue('AcquisitionNodeStatus', item.nodeStatus)}"/>
                            </p:column>
                            <p:column headerText="审批时间">
                                <h:outputText value="#{item.auditDate}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="审批结果">
                                <h:outputText value="#{fieldMsg.fieldValue('AcquisitionResult', item.auditResult)}"/>
                            </p:column>
                            <p:column headerText="审批意见">
                                <h:outputText value="#{item.auditComment}"/>
                            </p:column>
                        </p:dataTable>
                    </p:tab>
                </p:accordionPanel>
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{acquisitionPlanAuditEditController.selected.applicationStatus != 'Approved' and acquisitionPlanAuditEditController.selected.applicationStatus != 'Rejected' and acquisitionPlanAuditEditController.action eq 'Audit'}">
                    <h:panelGroup>
                        <label class="label">审批结果<span style="color:red">*</span></label>
                        <p:selectOneMenu id="auditResult" value="#{acquisitionPlanAuditEditController.auditResult}" required="true" requiredMessage="请选择审批结果">
                            <f:selectItem itemLabel="请选择" itemValue=""/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('AcquisitionResult')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">审批意见<span style="color:red">*</span></label>
                        <p:inputTextarea value="#{acquisitionPlanAuditEditController.auditComment}" ></p:inputTextarea>

                    </h:panelGroup>

                </p:panelGrid>
                <br/>

                <p:commandButton update=":growl " validateClient="true"
                                 action="#{acquisitionPlanAuditEditController.audit()}" value="提交" id="submitApplication" rendered="#{acquisitionPlanAuditEditController.selected.applicationStatus != 'Approved' and acquisitionPlanAuditEditController.selected.applicationStatus != 'Rejected' and acquisitionPlanAuditEditController.action eq 'Audit'}"/>
                <p:commandButton update=":growl " immediate="false" process="@this" value="#{msg.Return}" icon="ui-icon-arrow-back"
                                 action="#{acquisitionPlanAuditEditController.backList}" />
            </h:form>

        </div>

    </ui:define>
</ui:composition>
