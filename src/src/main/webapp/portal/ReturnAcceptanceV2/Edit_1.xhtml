<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="head">
        <h:outputStylesheet name="css/inspection.css"/>
    </ui:define>

    <ui:define name="content">
        <script>
             window.onload = function () {
                 $("#growl").removeAttr("autoUpdate");
                 $("#growl").attr('life','0');
             };
            function hideGrowl() {
                   $("#growl").removeAttr("autoUpdate");
                   $("#growl").attr('life','0');
            };
        </script>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="归还交付"/>
            </div>
            <div class="ui-g-12 card">
            
            <h:form id="IouEditForm">
                <p:fieldset legend="归还申请信息" style="margin-bottom:20px">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{sharedAssetRequestV2Controller.selected != null}">
                        <h:panelGroup>
                            <label class='label'>申请人</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.getNameByLoginName2()}"></h:outputText>
                            <!--<h:outputText value="#{sharedAssetRequestV2Controller.selected.applicant}"/>-->
                            <!--<p:inputText id="applicant" readonly="true" value="#{sharedAssetRequestV2Controller.selected.applicant}" />-->
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>申请科室</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.selected.clinicalDeptName}"/>
                            <!--<p:inputText id="clinicalDeptName" readonly="true" value="#{sharedAssetRequestV2Controller.selected.clinicalDeptName}" />-->
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>虚拟网电话</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.selected.applicantPhone}"/>
                            <!--<p:inputText id="applicantPhone" readonly="true" value="#{sharedAssetRequestV2Controller.selected.applicantPhone}" />-->
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>申请日期</label>
                            <h:outputText value="#{sharedAssetRequestV2Controller.selected.applyTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                            <!--<p:calendar id="applyTime"  pattern="yyyy/MM/dd HH:mm" value="#{sharedAssetRequestV2Controller.selected.applyTime}" mindate="#{sharedAssetRequestV2Controller.selected.applyTime}"-->
                                        <!--maxdate="#{sharedAssetRequestV2Controller.selected.applyTime}" timeOnly="true" readonlyInput="true" showButtonPanel="false"/>-->
                            <!--<p:inputText id="applyTime" readonly="true" value="#{sharedAssetRequestV2Controller.selected.createDate}" />-->
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>备注</label>
                            <p:inputTextarea id="remark" readonly="true" rows="1"  cols="100"  queryDelay="750" minQueryLength="4" value="#{sharedAssetRequestV2Controller.selected.remark}" />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                
<!--                <p:fieldset legend="归还受理信息录入" style="margin-bottom:20px">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{sharedAssetRequestV2Controller.selected != null}">
                      
                        <h:panelGroup>
                            <label class='label'>设备接收人</label>
                            <p:inputText id="accepter" value="#{sharedAssetRequestV2Controller.selected.accepter}" />
                        </h:panelGroup>
                        
                        <h:panelGroup>
                            <label class='label'>接收人工号</label>
                            <p:inputText id="accepterNumber" value="#{sharedAssetRequestV2Controller.selected.accepterNumber}" />
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>-->
                
<!--                <p:fieldset legend="设备编号" style="margin-bottom:20px">
                    
                </p:fieldset>-->
               
                <p:fieldset legend="归还申请明细" style="margin-bottom:20px">
                   <p:dataTable id="datalistDetail" value="#{sharedAssetRequestV2Controller.selected.sartList}" 
                                 var="item" widgetVar="varDataListDetail"
                        selectionMode="single" selection="#{sharedAssetRequestV2Controller.selectedSart}"
                        paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                        lazy="true" rowKey="#{item.swapName.hashCode()}" 
                       sortMode="single" sortOrder="descending" sortBy="#{item.swapName.hashCode()}"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                        currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                        rows="20" emptyMessage="#{msg.noRecordFound}"
                        rowsPerPageTemplate="20,40,60,90">
                
                    <p:column headerText="调剂设备名称" sortBy="#{item.swapName}" >
                        <h:outputText value="#{item.swapName}"/>
                    </p:column>
                    <p:column headerText="设备在借数" sortBy="#{item.sharedAssetTypeId}" >
                        <h:outputText value="#{sharedAssetRequestV2Controller.getSwapQty2(item.sharedAssetTypeId,sharedAssetRequestV2Controller.selected.clinicalDeptUid)}"/>
                    </p:column>
                    <p:column headerText="申请归还数" sortBy="#{item.applyQty}" >
                        <h:outputText value="#{item.applyQty}"/>
                    </p:column>
                    <p:column headerText="实际归还数" sortBy="#{item.actualQty}">
                        <h:outputText value="#{item.actualQty}"/>
                    </p:column>
                    <p:column headerText="备注" sortBy="#{item.remark}" >
                        <h:outputText value="#{item.remark}"/>
                    </p:column>
                     <!--<f:facet name="{Toolbar}">-->
                       <!--<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">-->
                            <!--<p:dataExporter type="xls" target="datalistDetail" fileName="SharedAssetReqType_export"/>-->
                        <!--</p:commandButton>-->
                       <!---->
                    <!--</f:facet>-->
                </p:dataTable>
                </p:fieldset>
                
                <p:fieldset id="fSet1" legend="录入归还设备" style="margin-bottom:20px">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{sharedAssetRequestV2Controller.selected.state eq 8}" >
                        <h:panelGroup >
                            <label class='label'>计费结束时间</label>
                            <!--<p:calendar  pattern="yyyy/MM/dd HH:mm"  stepMinute="30" placeholder="      归还结束时间" value="#{sharedAssetRequestV2Controller.selected.msgEndTime}" readonlyInput="true" showOn="button" showButtonPanel="true" navigator="true"/>-->
                            <p:calendar  pattern="yyyy/MM/dd HH:mm" placeholder="      归还结束时间" value="#{sharedAssetRequestV2Controller.selected.msgEndTime}" readonlyInput="true" showOn="button" showButtonPanel="true" navigator="true"/>
                        </h:panelGroup>
                        <h:panelGroup >
<!--                            <p:growl id="growl2" showDetail="true" sticky="false" life="0"/> -->
                            <p:messages id="messages" closable="true" style="width: 900px" />
                             
                            <p:inputText id="applyAssetInfo" maxlength="100" style="width: 200px" placeholder="资产编号/设备编号/二维码"  value="#{sharedAssetRequestV2Controller.selected.applyAssetInfo}" />
                            <p:commandButton icon="ui-icon-search" class="btn btn-sm btn-gray" update="datalistDetail datalistOperation , messages"  
                                             action="#{sharedAssetRequestV2Controller.getAssetInfoR(sharedAssetRequestV2Controller.selected.msgEndTime)}"
                                             actionListener="hideGrowl()"/>
                            
                        </h:panelGroup>
                    </p:panelGrid>
                    
                    <p:dataTable id="datalistOperation" value="#{sharedAssetRequestV2Controller.selected.sardList}" 
                                 var="item" widgetVar="varDataListdetail"
                        selectionMode="single" selection="#{sharedAssetRequestV2Controller.selectedSard}"
                        lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                        rowKey="#{item.id}"
                        sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                        paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                        currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                        rows="20" emptyMessage="#{msg.noRecordFound}"
                        rowsPerPageTemplate="20,40,60,90">  
                            
                    <p:ajax event="rowSelect" listener="#{sharedAssetRequestV2Controller.prepareEditSard}" update=":EditDlg" oncomplete="PF('EditDialog').show()" />
<!--                    <p:ajax event="filter" listener="#{sharedAssetReqDetailV2Controller.onFilter}"/>-->
                      
                        <p:column headerText="设备名称" sortBy="#{item.assetName}">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                        <p:column headerText="设备编号" sortBy="#{item.assetNumber}" >
                            <h:outputText value="#{item.assetNumber}"/>
                        </p:column>
                        <p:column headerText="计费开始时间" sortBy="#{item.chargingBeginTime}" >
                            <f:facet name="filter">
                                <p:inputMask mask="9999-99-99 #{msg.filterTo} 9999-99-99" onkeyup="filterByDateField(event, this, 'varDataList', ' #{msg.filterTo} ');" onblur="filterByDateFieldOnBlur(this, ' #{msg.filterTo} ');"/>
                            </f:facet>
                            <h:outputText value="#{item.chargingBeginTime}">
                                <f:convertDateTime pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="计费结束时间" sortBy="#{item.chargingEndTime}" >
                            <f:facet name="filter">
                                <p:inputMask mask="9999-99-99 #{msg.filterTo} 9999-99-99" onkeyup="filterByDateField(event, this, 'varDataList', ' #{msg.filterTo} ');" onblur="filterByDateFieldOnBlur(this, ' #{msg.filterTo} ');"/>
                            </f:facet>
                            <h:outputText value="#{item.chargingEndTime}">
                                <f:convertDateTime pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="单价" sortBy="#{item.unitPrice}" >
                            <h:outputText value="#{item.unitPrice}"/>
                        </p:column>
                        <p:column headerText="计价方式" sortBy="#{item.chargingType}">
                            <h:outputText value="#{fieldMsg.fieldValue('chargingType',item.chargingType)}"/>
                        </p:column>
                        <p:column headerText="费用" sortBy="#{item.cost}" >
                            <h:outputText value="#{item.cost}">
                                <f:convertNumber pattern="0.00"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="备注" sortBy="#{item.remark}" >
                            <h:outputText value="#{item.remark}"/>
                        </p:column>
                        <p:column headerText="删除">
                            <p:commandButton id="deleteButton"  icon="ui-icon-trash"  actionListener="#{sharedAssetRequestV2Controller.deleteBy(item.id)}"  update=":IouEditForm:datalistDetail, datalistOperation">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </p:column>

                      <f:facet name="{Toolbar}">
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalistOperation" fileName="IouApplyDetail_export"/>
                        </p:commandButton>
                    </f:facet>  
                    </p:dataTable>
                </p:fieldset>
                
                <h:panelGroup id="display">
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{sharedAssetRequestV2Controller.deliverR}" oncomplete="openSwapTypeViewWindow(xhr, status, args)" 
                                     update="datalistDetail, datalistOperation, messages, display , fSet1" value="完成交付" icon="ui-icon-check" rendered="#{sharedAssetRequestV2Controller.selected.state  eq 8}"/>
                    <p:commandButton value="#{msg.Return}" action="List?faces-redirect=true" immediate="true"  icon="ui-icon-arrow-back"/>
                </h:panelGroup>
            </h:form>
                <ui:include src="EditDetail.xhtml"/>
                <ui:include src="Detail_Edit.xhtml"/>
                <ui:include src="/portal/asset/selectAssetDialog.xhtml"/>
                <ui:include src="Msg.xhtml"/>
         </div>  
        </div> 
        <script>
           
            function openSwapTypeViewWindow(xhr, status, args) {
                var url = args.url;
                if (url == "norespond") {
                    
                } else {
                    this.location.href = url;
                }
            }

        </script>
    </ui:define>  
       
</ui:composition>
