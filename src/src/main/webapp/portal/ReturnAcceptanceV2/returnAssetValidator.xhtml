<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="returnAssetValidator" widgetVar="returnAssetValidator" modal="true" width="400"  resizable="true" draggable="true" appendTo="@(body)" header="设备归还">
        <h:form id="returnAssetValidatorForm" >
            <h:panelGroup id="display1">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup rendered="false">
                        <label class="label">借据ID: </label>
                        <h:outputText value="#{sharedAssetRequestV2Controller.preSelectReqDetail.voucherNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">计费开始时间*</label>
                        <p:calendar timeZone="GMT+8"
                                    id="chargingBeginTime"
                                    binding="#{chargingBeginTimeComponent}"
                                    pattern="yyyy/MM/dd HH:mm:ss"
                                    value="#{sharedAssetRequestV2Controller.preSelectReqDetail.chargingBeginTime}"
                                    maxdate="#{sharedAssetRequestV2Controller.getMaxChargingBeginTime(sharedAssetRequestV2Controller.preSelectReqDetail)}"
                                    showOn="button"
                                    showButtonPanel="true"
                                    navigator="true"
                                    readonlyInput="false"
                                    locale= "zh"
                                    required="true"
                                    requiredMessage="计费开始时间 #{msg.ValidationRequire}">
                            <p:ajax update=":returnAssetValidatorForm:chargingEndTime"/>
                        </p:calendar>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">计费结束时间*</label>
                        <p:calendar timeZone="GMT+8"
                                    id="chargingEndTime"
                                    pattern="yyyy/MM/dd HH:mm:ss"
                                    value="#{sharedAssetRequestV2Controller.preSelectReqDetail.chargingEndTime}"
                                    mindate="#{sharedAssetRequestV2Controller.preSelectReqDetail.chargingBeginTime}"
                                    maxdate="#{sharedAssetRequestV2Controller.getMaxChargingEndTime(sharedAssetRequestV2Controller.preSelectReqDetail)}"
                                    showOn="button"
                                    showButtonPanel="true"
                                    navigator="true"
                                    readonlyInput="true"
                                    locale= "zh"
                                    required="true"
                                    requiredMessage="计费结束时间 #{msg.ValidationRequire}">
                            <f:validator validatorId="chargingTimeValidator" />
                            <f:attribute name="chargingBeginTimeComponent" value="#{chargingBeginTimeComponent}" />
                        </p:calendar>
                    </h:panelGroup>
                </p:panelGrid>
                <h:panelGroup>
                    <p:commandButton validateClient="true"
                                     value="确认"
                                     update="IouEditForm:datalistOperation"
                                     icon="ui-icon-check"
                                     action="#{sharedAssetRequestV2Controller.getAssetInfoR(sharedAssetRequestV2Controller.selected.msgEndTime)}"
                                     oncomplete="handleSubmit(args, 'returnAssetValidator');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('returnAssetValidator').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
