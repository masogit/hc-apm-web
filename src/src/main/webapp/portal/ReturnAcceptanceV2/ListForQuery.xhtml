<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
     <ui:define name="head">
        <h:outputScript name="js/main.js"/>
        
        <style type="text/css">      
        .ui-chkbox .ui-chkbox-box .ui-icon-check {
            color: gray!important;
        }
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">
                <div class="ui-g-12 card cardTitle">
                    <p:outputLabel class="pageTitle" value="设备计费情况"/>
                </div>
                <div class="ui-g-12 card">
                    <h:form id="searchForm">
                        <h:panelGrid id="searchPanel" columns="2">
                            <p:inputText id="searchText" value="#{sharedAssetReqDetailForQueryController.oneSearchStr}" placeholder="#{msg.name}/#{msg.departNum}" maxlength="100" style="width: 450px">
                                <p:ajax event="keyup" delay="1200" update=":IouListForm searchButtons" />
                            </p:inputText>
                            <h:panelGroup id='searchButtons'>
                                <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":IouListForm :searchForm"  rendered="#{empty sharedAssetReqDetailForQueryController.oneSearchStr}"/>
                                <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":IouListForm :searchForm" actionListener="#{sharedAssetReqDetailForQueryController.setOneSearchStr('')}" rendered="#{not empty sharedAssetReqDetailForQueryController.oneSearchStr}"/>
                            </h:panelGroup>

                        </h:panelGrid>
                    </h:form>
                     <h:form id="IouListForm">

                        <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                            <c:if test="#{userContextService.selectSite != null}">
                                <ui:include src="../BorrowAcceptanceV2/site-switching.xhtml"/>
                            </c:if>
                            <p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet " actionListener="#{sharedAssetReqDetailForQueryController.searchList(0)}" rendered="true" disabled="#{sharedAssetReqDetailForQueryController.queryIndex == 0}"/>
                            <p:commandButton value="在借中"  process="@this" update="datalist buttonSet " actionListener="#{sharedAssetReqDetailForQueryController.searchList(1)}"  rendered="true" disabled="#{sharedAssetReqDetailForQueryController.queryIndex == 1}"/>
                        </h:panelGrid>

                        <p:dataTable id="datalist" value="#{sharedAssetReqDetailForQueryController.lazyModel}" var="item" widgetVar="varDataList"
                            selectionMode="single" selection="#{sharedAssetReqDetailForQueryController.selected}"
                            lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                            rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.charging_begin_time}"
                            paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                            currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                            rows="20" emptyMessage="#{msg.noRecordFound}"
                            rowsPerPageTemplate="20,50,100,500">
                            <p:ajax event="rowSelect" update="deleteButton" />
                            <p:ajax event="filter" listener="#{sharedAssetReqDetailForQueryController.onFilter}" update=""/>
                           <c:forEach items="#{sharedAssetReqDetailForQueryController.assetAllocateFields}" var="columnItem" >
                               <c:if test="#{columnItem eq 'reclinicalDept'}">
                                    <p:column headerText="借用科室" sortBy="#{item.clinical_dept_name}" filterBy="#{item.clinical_dept_name}" filterMatchMode="LIKE" >
                                             <h:outputText value="#{item.clinicalDeptName}"/>
                                    </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'arrivalListAssetName'}">
                                    <p:column headerText="设备名称" sortBy="#{item.asset_name}" filterBy="#{item.asset_name}" filterMatchMode="LIKE" >
                                     <h:outputText value="#{item.assetName}"/>
                                     </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'departNum'}">
                                   <c:choose>
                                   <c:when test="#{userContextService.hasCurrentTenantName('')}">
                                       <p:column headerText="设备二维码" sortBy="#{item.qr_code}" filterBy="#{item.qr_code}" filterMatchMode="LIKE">
                                           <h:outputText value="#{item.qrCode}"/>
                                       </p:column>
                                   </c:when>
                                   <c:otherwise>
                                       <p:column headerText="设备编号" sortBy="#{item.asset_number}" filterBy="#{item.asset_number}" filterMatchMode="LIKE">
                                           <h:outputText value="#{item.assetNumber}"/>
                                       </p:column>
                                   </c:otherwise>
                                   </c:choose>
                               </c:if>
                            <c:if test="#{sharedAssetReqDetailForQueryController.openWhethertoenableunattended()}">
                               <c:if test="#{columnItem eq 'swapName'}">
                                    <p:column headerText="调剂名称"  sortBy="#{item.swap_name}" filterBy="#{item.swap_name}" filterMatchMode="LIKE">
                                        <h:outputText value="#{item.swapName}"/>
                                    </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'functionType'}">
                                    <p:column headerText="型号" sortBy="#{item.function_type}" filterBy="#{item.function_type}" filterMatchMode="LIKE">
                                        <h:outputText value="#{item.functionType}"/>
                                    </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'brand'}">
                                    <p:column headerText="品牌"  sortBy="#{item.brand_name}" filterBy="#{item.brand_name}" filterMatchMode="LIKE">
                                        <h:outputText value="#{item.brandName}"/>
                                    </p:column>
                               </c:if>
                            </c:if>
                            <c:if test="#{columnItem eq 'chargingBeginTime'}">
                                <p:column headerText="计费开始时间"  sortBy="#{item.charging_begin_time}" filterBy="#{item.charging_begin_time}" filterMatchMode="GTE">
                                    <f:facet name="filter">
                                        <p:calendar id="cal1" effect="fold" value="#{sharedAssetReqDetailForQueryController.filterBeginTime}"
                                                    onchange="PF('varDataList').filter()" pattern="yyyy/MM/dd HH:mm" showButtonPanel="true" navigator="true"/>
                                    </f:facet>
                                    <h:outputText value="#{item.chargingBeginTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'chargingEndTime'}">
                               <p:column headerText="计费结束时间"  sortBy="#{item.charging_end_time}" filterBy="#{item.charging_end_time}" filterMatchMode="LTE">
                                    <f:facet name="filter">
                                        <p:calendar id="cal2" effect="fold" value="#{sharedAssetReqDetailForQueryController.filterEndTime}"
                                                    onchange="PF('varDataList').filter()" pattern="yyyy/MM/dd HH:mm" showButtonPanel="true" navigator="true"/>
                                    </f:facet>
                                    <h:outputText value="#{item.chargingEndTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="病人号" rendered="#{sharedAssetStockController.isLogPatientInfoEnabled()}" sortBy="#{item.patient_num}" filterBy="#{item.patient_num}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.patientNum}"/>
                                </p:column>

                                <p:column headerText="床号" rendered="#{sharedAssetStockController.isLogPatientInfoEnabled()}" sortBy="#{item.patient_bed_num}" filterBy="#{item.patient_bed_num}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.patientBedNum}"/>
                                </p:column>
                            </c:if>

                               <c:if test="#{columnItem eq 'unitPrice'}">
                                   <p:column headerText="单价" sortBy="#{item.unit_price}" >
                                        <f:facet name="filter">
                                            <p:inputText id="filterUnitPrice" widgetVar="varFilterUnitPrice" value="#{sharedAssetReqDetailForQueryController.filterUnitPrice}"/>
                                        </f:facet>
                                        <h:outputText value="#{item.unitPrice}"/>
                                    </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'chargingType'}">
                                <p:column headerText="计价方式"  sortBy="#{item.charging_type}" filterBy="#{item.charging_type}" filterMatchMode="EQ">
                                    <f:facet name="filter">
                                        <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('chargingType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                            <f:selectItem itemLabel="维修借用" itemValue="维修借用" />
                                        </p:selectOneMenu>
                                    </f:facet>
                                    <h:outputText value="#{fieldMsg.fieldValue('chargingType',item.chargingType)=='' ? '维修借用' : fieldMsg.fieldValue('chargingType',item.chargingType)}"/>
                                </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'rentalTime'}">
                                   <p:column headerText="使用时长" >
                                        <h:outputText value="#{item.getFormattedRentalTime()}"/>
                                    </p:column>
                               </c:if>

                               <c:if test="#{columnItem eq 'totalAmount'}">
                                    <p:column headerText="租赁费用" >
                                        <h:outputText value="#{item.totalAmount}">
                                            <f:convertNumber pattern="0.00"/>
                                        </h:outputText>
                                    </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'compensationAmount'}">
                                    <p:column headerText="赔偿费用">
                                        <h:outputText value="#{item.compensationAmount}">
                                            <f:convertNumber pattern="0.00"/>
                                        </h:outputText>
                                    </p:column>
                               </c:if>
                            <c:if test="#{sharedAssetReqDetailForQueryController.openWhethertoenableunattended()}">
                               <c:if test="#{columnItem eq 'gratisDuration'}">
                                    <p:column headerText="免除计费时长" >
                                        <h:outputText value="#{item.gratisDuration*1}">
                                            <f:convertNumber pattern="0.00"/>
                                        </h:outputText>
                                    </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'gratisFee'}">
                                    <p:column headerText="免除费用">
                                        <h:outputText value="#{item.gratisFee}">
                                            <f:convertNumber pattern="0.00"/>
                                        </h:outputText>
                                    </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'discountPeriod'}">
                                    <p:column headerText="优惠时段" >
                                        <h:outputText value="#{item.getDiscountPeriod()}">
                                            <f:convertNumber pattern="0.00"/>
                                        </h:outputText>
                                    </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'discount'}">
                                    <p:column headerText="优惠折扣">
                                        <h:outputText value="#{item.discount}">
                                            <f:convertNumber pattern="0.00"/>
                                        </h:outputText>%
                                    </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'discountTime'}">
                                   <p:column headerText="优惠时长" >
                                    <h:outputText value="#{item.discountTime}">
                                        <f:convertNumber pattern="0.00"/>
                                    </h:outputText>
                                </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'discountFee'}">
                                <p:column headerText="优惠费用" >
                                    <h:outputText value="#{item.discountFee}">
                                        <f:convertNumber pattern="0.00"/>
                                    </h:outputText>
                                </p:column>
                               </c:if>
                               <c:if test="#{columnItem eq 'cost'}">
                                    <p:column headerText="总计费用" >
                                        <h:outputText value="#{item.compensationAmount + item.totalAmount}">
                                            <f:convertNumber pattern="0.00"/>
                                        </h:outputText>
                                    </p:column>
                               </c:if>
                                <c:if test="#{columnItem eq 'status'}">
                                    <p:column headerText="状态" filterBy="#{item.state}" filterMatchMode="EQ"  >
                                        <f:facet name="filter">
                                            <p:selectOneMenu onchange="PF('varDataList').filter()" id="selectOneMenu1">
                                                <f:selectItem id="select1" itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                                <f:selectItem itemLabel="已预约" itemValue="已预约" />
                                                <f:selectItem itemLabel="使用中" itemValue="使用中" />
                                                <c:if test="#{sharedAssetReqDetailForQueryController.queryIndex != 1}">
                                                    <f:selectItem itemLabel="已归还（未清洁保养）" itemValue="已归还（未清洁保养）" />
                                                    <f:selectItem itemLabel="已完成" itemValue="已完成" />
                                                </c:if>
                                            </p:selectOneMenu>
                                        </f:facet>
                                        <h:outputText value="#{item.state}" />
                                    </p:column>
                                </c:if>
                                <c:if test="#{columnItem eq 'swapIndex'}">
                                    <p:column headerText="调剂编码" filterBy="#{item.swap_index}" filterMatchMode="LIKE"  >
                                        <h:outputText value="#{item.swapIndex}" />
                                    </p:column>
                                </c:if>
                                <c:if test="#{columnItem eq 'precautions'}">
                                    <p:column headerText="注意事项"   >
                                        <h:outputText value="#{item.remark}" title="#{item.remark}" style="white-space: nowrap;text-overline: ellipsis"/>
                                    </p:column>
                                </c:if>
                            </c:if>
                            <c:if test="#{!sharedAssetReqDetailForQueryController.openWhethertoenableunattended()}">
                               <c:if test="#{columnItem eq 'cost'}">
                                    <p:column headerText="总计费用"  >
                                       <h:outputText value="#{item.compensationAmount + sharedAssetReqDetailForQueryController.getTotalAmount(item)}">
                                           <f:convertNumber pattern="0.00"/>
                                       </h:outputText>
                                   </p:column>
                               </c:if>
                                <c:if test="#{columnItem eq 'signatory'}">
                                    <p:column headerText="签名操作人"  >
                                        <h:outputText value="#{item.signatory}"/>
                                    </p:column>
                                </c:if>

                                <c:if test="#{columnItem eq 'signatureTime'}">
                                    <p:column headerText="签名日期"  >
                                        <h:outputText value="#{item.signatureTime}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd"/>
                                        </h:outputText>
                                    </p:column>
                                </c:if>
                                <c:if test="#{columnItem eq 'signatureId'}">
                                    <p:column headerText="签名" exportable="false" >
                                        <p:commandButton disabled="#{item.signatureId == null}" actionListener="#{sharedAssetReqDetailForQueryController.setSignatureId(item.signatureId)}" title="预览" update="viewImage" icon="ui-icon-search" oncomplete="PF('viewImageDialog').show();"/>
                                    </p:column>
                                </c:if>
                            </c:if>

                           </c:forEach>

                            <f:facet name="{Toolbar}">
                                <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                    <p:dataExporter type="xls" target="datalist" fileName="Iou_export"/>
                                </p:commandButton>
                                <p:commandButton rendered="#{userContextService.checkRole('SharedAssetMgmt') and sharedAssetReqDetailForQueryController.openWhethertoenableunattended()}" id="deleteButton" icon="ui-icon-delete" class="btn btn-sm btn-gray batch-terminated" title="#{msg.Delete}" actionListener="#{sharedAssetReqDetailForQueryController.deleteRecord}" update=":IouListForm" disabled="#{empty sharedAssetReqDetailForQueryController.selected}">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </f:facet>
                        </p:dataTable>
                    </h:form>
                    <p:dialog  id="viewImage" widgetVar="viewImageDialog" modal="true" height="500" width="500"  resizable="true" draggable="true" appendTo="@(body)" >
                        <p:graphicImage  value="#{sharedAssetReqDetailForQueryController.previewSignature()}" alt="不支持预览" stream="false" style="width: 100%" />
                    </p:dialog>
                </div>
            </div>
        </div>
        <script>
            afterPageLoad = function () {
                $("#searchForm\\:searchText").keypress(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                    }
                });
            }
        

            function openSwapTypeViewWindow(xhr, status, args) {
                this.location.href = args.url;
            }

            $(function () {
                //解决两个时间选择样式问题
                var removeUiDatepickerDivClipRect = function (i) {
                    if(i &lt; 20){
                        i++;
                        $("#ui-datepicker-div").css("clip","");
                        setTimeout(function (){removeUiDatepickerDivClipRect(i)}, 50);
                    }
                }
                $("#IouListForm\\:datalist\\:cal1_input").click(function (){removeUiDatepickerDivClipRect(1);});
                $("#IouListForm\\:datalist\\:cal2_input").click(function (){removeUiDatepickerDivClipRect(1);});
            })

        </script>
    </ui:define>

</ui:composition>
</html>
