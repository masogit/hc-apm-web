<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="specialAssetSettingEditBatch" width="1000" height="600" widgetVar="specialAssetSettingEditBatch" modal="true" draggable="true" appendTo="@(body)" header="#{specialAssetBatchController.getCRUDActionName()}" >
        <div class="ui-g-12 card">
            <h:form id="specialAssetSettingBatchFrom">
                <p:fieldset legend="设备" id="assetList" style="margin-bottom:20px">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:dataTable id="datalist" value="#{specialAssetBatchController.lazyModel}"
                                     var="item"
                                     widgetVar="configEditList1"
                                     lazy="true" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" emptyMessage="#{msg.noRecordFound}"
                                     rowsPerPageTemplate="5,10,20,50">
                            <p:ajax event="filter" listener="#{specialAssetBatchController.onFilter}" update="datalist"/>
                            <p:ajax event="page"  listener="#{specialAssetBatchController.setAllSelected1(false)}"  oncomplete="updateSelectAllCheckBox2('selectCheckBox1','selectCheckBoxHeader1');"/>
                            <p:column width="40" id="checkBoxCol">
                                <p:selectBooleanCheckbox value="#{specialAssetBatchController.selectedAssetUidTable1[item.uid]}" class="selectCheckBox1">
                                    <p:ajax event="change" listener="#{specialAssetBatchController.updateSelctedAssetList1}" update="@(.selectCheckBoxHeader1)"/>
                                    <f:attribute name="assetObj" value="#{item}"/>
                                </p:selectBooleanCheckbox>
                                <f:facet name="header">
                                    <p:selectBooleanCheckbox value="#{specialAssetBatchController.allSelected1}" id="selectCheckBoxHeader1" class="selectCheckBoxHeader1">
                                        <p:ajax event="change" listener="#{specialAssetBatchController.addAssetsOfCurrentPage1}" update="@(.selectCheckBox1)"/>
                                    </p:selectBooleanCheckbox>
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.assetName}" filterBy="#{item.name}" filterMatchMode="LIKE">
                                <h:outputText value="#{item.name}" />
                            </p:column>
                            <p:column headerText="#{msg.functionType}"  filterBy="#{item.functionType}" filterMatchMode="LIKE">
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                                <f:facet name="filter" >
                                    <p:selectOneMenu onchange="PF('configEditList1').filter()" >
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </f:facet>
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}" filterBy="#{item.departNum}" filterMatchMode="EQ">
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.qrCode}" filterBy="#{item.qrCode}" filterMatchMode="EQ" >
                                <h:outputText value="#{item.qrCode}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}" filterBy="#{item.clinicalDeptUID}" filterMatchMode="EQ" >
                                <f:facet name="filter" >
                                    <p:selectOneMenu onchange="PF('configEditList1').filter()" >
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{specialAssetBatchController.cacheOrgList}" var="org" itemLabel="#{org.name}" itemValue="#{org.uid}"/>
                                    </p:selectOneMenu>
                                </f:facet>
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:commandButton validateClient="true" actionListener="#{specialAssetBatchController.addCheckedDevice}" value="添加已勾选设备" icon="fa fa-filter" process="@form" update="assetList assetList2 :growl"
                                         oncomplete="PF('configEditList1').clearFilters();">
                            <p:resetInput target="datalist" />
                        </p:commandButton>
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" id="assetList2" styleClass="ui-panelgrid-blank form-group ">
                        <p:dataTable id="datalist1" value="#{specialAssetBatchController.lazyModel2}"
                                     var="item"
                                     widgetVar="selectedTable"
                                     lazy="true" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="5" emptyMessage="#{msg.noRecordFound}" rowKey="#{item.id}"
                                     rowsPerPageTemplate="5,10,20,50">
                            <p:ajax event="page"  listener="#{specialAssetBatchController.setAllSelected2(false)}" oncomplete="updateSelectAllCheckBox2('selectCheckBox2','selectCheckBoxHeader2');"/>
                            <p:column width="40" id="checkBoxCol1">
                                <p:selectBooleanCheckbox value="#{specialAssetBatchController.selectedAssetUidTable2[item.uid]}" class="selectCheckBox2">
                                    <p:ajax event="change" listener="#{specialAssetBatchController.updateSelctedAssetList2}" update="@(.selectCheckBoxHeader2)"/>
                                    <f:attribute name="assetObj" value="#{item}"/>
                                </p:selectBooleanCheckbox>
                                <f:facet name="header">
                                    <p:selectBooleanCheckbox value="#{specialAssetBatchController.allSelected2}" id="selectCheckBoxHeader2" class="selectCheckBoxHeader2">
                                        <p:ajax event="change" listener="#{specialAssetBatchController.addAssetsOfCurrentPage2}" update="@(.selectCheckBox2)"/>
                                    </p:selectBooleanCheckbox>
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.assetName}" >
                                <h:outputText value="#{item.name}" />
                            </p:column>
                            <p:column headerText="#{msg.functionType}"  >
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}" >
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}" >
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.qrCode}" >
                                <h:outputText value="#{item.qrCode}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}" >
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:commandButton  validateClient="true" actionListener="#{specialAssetBatchController.deleteCheckedDevice}" value="删除已勾选设备" update="assetList assetList2 :growl" icon="ui-icon-check"/>
                        <p:commandButton  value="全部清空" actionListener="#{specialAssetBatchController.clearAll}"  icon="ui-icon-cancel" update="assetList assetList2 :growl" />
                    </p:panelGrid>
                </p:fieldset>
                <p:commandButton  validateClient="true" actionListener="#{specialAssetBatchController.save}" value="#{msg.Save}" update=":SpecialAssetInfoListForm:datalist :growl" icon="ui-icon-check" oncomplete="handleSubmitDigital(args, 'specialAssetSettingEditBatch')"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('specialAssetSettingEditBatch').hide()"/>
            </h:form>
        </div>
    </p:dialog>
    <script type="text/javascript">
        function handleSubmitDigital(args, dialog) {
            if (args.validationFailed) {
                PF(dialog).show();
            } else {
                PF(dialog).hide();
            }
        }
        function updateSelectAllCheckBox2(checkBox,checkBoxHeader) {
            var checkboxlist = $("."+checkBox);
            var selectAllstatus = true;
            checkboxlist.each(function () {
                selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked;
            });
            if (selectAllstatus) {
                $("."+checkBoxHeader)[0].children[1].classList.add("ui-state-active");
            } else {
                $("."+checkBoxHeader)[0].children[1].classList.remove("ui-state-active");
            }
        }
    </script>
</ui:composition>
</html>
