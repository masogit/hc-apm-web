<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="head">
<!--        <h:outputStylesheet name="css/assetUsageAll.css"/>-->
        <h:outputScript name="js/assetUsageAll.js"/>
        <script type="text/javascript" src="#{request.contextPath}/portal/js/viewer.min.js"></script>
        <link rel="stylesheet" href="#{request.contextPath}/portal/css/viewer.min.css"/>
        <style>
            div.ui-autocomplete.ui-autocomplete-multiple.asset-tags ul.ui-autocomplete-multiple-container{
                max-width: 200px;
                max-height: 100px;
                overflow-y: hidden;
            }
        </style>
    </ui:define>
    <ui:define name="content">
        <div class="ui-g clearfix" id="header">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{assetInfoDetailController.terminate? msg.TerminateAssetInfoDetail :msg.AssetInfoDetail}"/>
            </div>

        </div>

        <div class="ui-g-12 card" >
            <p:tabView dynamic="true" id="assetDetail">
                <p:tab title="#{msg.BasicInfo}">
                    <p:accordionPanel id="accordion" multiple="false" >
                        <p:tab title="#{msg.BasicInfo}">
                            <div class="ui-g">
                                <div class="ui-g-8 ui-g-nopad">
                                    <p:panelGrid id="basicPanel" columns="4"  layout="grid" styleClass="ui-panelgrid-blank">
                                        <c:forEach items="#{assetInfoDetailController.customConfig.assetsDetailpageBasicFields}" var="fieldItem" >
                                            <ui:include src="customViewFields.xhtml"/>
                                        </c:forEach>
                                    </p:panelGrid>
                                </div>
                                <div class="ui-g-4">
                                    <div class="container-fluid" style="height: 400px; overflow: auto;">
                                        <div class="row" id="picDiv">
                                            <c:forEach items="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,1)}" var="attach" >
                                                <div>
                                                    <img data-original="#{fileDownloadService.getImgBase64(attach.objectStorageId)}"
                                                         src="#{fileDownloadService.getImgBase64(attach.objectStorageId)}"
                                                         style="opacity:0; width:1px; height:1px" />
                                                </div>
                                            </c:forEach>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </p:tab>
                    </p:accordionPanel>
                    <p:accordionPanel id="accordion2">
                        <p:tab title="#{msg.AssetInfoDetail}">
                            <div class="ui-g">
                                <div class="ui-g-12 ui-g-nopad">
                                    <p:panelGrid id="detailPanel" columns="4"  layout="grid" styleClass="ui-panelgrid-blank">
                                        <c:forEach items="#{assetInfoDetailController.customConfig.assetsDetailpageDetailFields}" var="fieldItem" >
                                            <ui:include src="customViewFields.xhtml"/>
                                        </c:forEach>
                                        <c:if test="#{userContextService.zkbAccount}" >
                                            <h:panelGroup  >
                                                <label class="label">#{msg.mainDirectory}</label>
                                                <p:inputText value="#{assetInfoDetailController.selected.mainDirectory}" readonly="true"/>
                                            </h:panelGroup>
                                            <h:panelGroup  >
                                                <label class="label">#{msg.secondDirectory}</label>
                                                <p:inputText value="#{assetInfoDetailController.selected.secondDirectory}" readonly="true"/>
                                            </h:panelGroup>
                                        </c:if>
                                        <h:panelGroup rendered="#{userContextService.countyArea}" >
                                            <label class="label">IB合同类别</label>
                                            <p:inputText id="contractType" value="#{assetInfoDetailController.selected.contractType}"/>
                                        </h:panelGroup>
                                    </p:panelGrid>
                                </div>
                            </div>
                        </p:tab>
                    </p:accordionPanel>
                    <p:fieldset legend="GE MVS" style="margin-bottom:20px" rendered="#{userContextService.isMVSRole()}">
                        <ui:include src="MvsViewFields.xhtml"/>
                    </p:fieldset>

                    <h:form>
                        <p:panel  header="相关设备" rendered="#{assetInfoDetailController.showParentsTree()}">
                            <p:treeTable styleClass="ui-datatable"  value="#{assetInfoDetailController.getParentsRelationTree()}" var="assetItem">
                                <f:facet name="header" />
                                <p:column headerText="#{msg.name}">
                                    <h:outputText value="#{assetItem.name}" />
                                </p:column>
                                <p:column headerText="#{msg.functionType}">
                                    <h:outputText value="#{assetItem.functionType}" />
                                </p:column>
                                <p:column headerText="#{msg.serialNum}">
                                    <h:outputText value="#{assetItem.serialNum}" />
                                </p:column>
                                <p:column headerText="#{msg.financingNum}">
                                    <h:outputText value="#{assetItem.financingNum}" />
                                </p:column>
                                <p:column headerText="#{msg.departNum}">
                                    <h:outputText value="#{assetItem.departNum}" />
                                </p:column>
                                <p:column >
                                    <p:link  outcome="#{assetInfoDetailController.getDetailPageLink(assetItem.uid)}" disabled="#{assetItem.uid eq assetInfoDetailController.selected.uid}" >#{msg.View}</p:link>
                                </p:column>

                            </p:treeTable>

                        </p:panel>

                        <p:panel  header="#{msg.EquipmentRelatedContract}">
                            <f:facet name="actions">
                                <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="#{urlEncryptController.encodeUrlParam('/portal/asset/contract/ContractList?faces-redirect=true&amp;assetUid='.concat(assetInfoDetailController.selected.uid))}"
                                               disabled="#{not (userContextService.hasAnyRole('SuperAdmin,HospitalHead,AssetHead,AssetStaff') and userContextService.versionContains('asset.mgt'))}"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                            </f:facet>
                            <p:dataTable var="item" value="#{assetInfoDetailController.getContractList()}" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.name}" >
                                    <h:outputText value="#{item.name}"/>
                                </p:column>
                                <p:column headerText="#{msg.contractNum}" >
                                    <h:outputText value="#{item.contractNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.startTime}"  >

                                    <h:outputText value="#{item.startDate}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.endTime}" >

                                    <h:outputText value="#{item.endDate}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.AssetContractAmount}" sortBy="#{item.contractAmount}" >
                                    <h:outputText value="#{item.amount}"/>
                                </p:column>
                                <p:column headerText="#{msg.invoiceNum}"  >
                                    <h:outputText value="#{assetInfoDetailController.getContractInvoice(item)}"/>
                                </p:column>
                                <p:column   >
                                    <p:link outcome="#{urlEncryptController.encodeUrlParam('/portal/asset/contract/ContractEdit?faces-redirect=true&amp;action=Edit&amp;selectedid='.concat(item.id))}" disabled="#{not (userContextService.hasAnyRole('SuperAdmin,HospitalHead,AssetHead,AssetStaff') and userContextService.versionContains('asset.mgt'))}">#{msg.View}</p:link>
                                </p:column>
                            </p:dataTable>
                        </p:panel>
                        <p:tabView>
                            <p:tab title="#{fieldMsg.fieldValue('attachmentType', 1)}">
                                <p:dataList value="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,1)}" var="fileitem" type="ordered" emptyMessage="#{msg.noRecordFound}">
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                </p:dataList>
                            </p:tab>
                            <p:tab title="#{fieldMsg.fieldValue('attachmentType', 2)}">
                                <p:dataList value="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,2)}" var="fileitem" type="ordered" emptyMessage="#{msg.noRecordFound}">
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                </p:dataList>
                            </p:tab>
                            <p:tab title="#{fieldMsg.fieldValue('attachmentType', 3)}">
                                <p:dataList value="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,3)}" var="fileitem" type="ordered" emptyMessage="#{msg.noRecordFound}">
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                </p:dataList>
                            </p:tab>
                            <p:tab title="#{fieldMsg.fieldValue('attachmentType', 4)}">
                                <p:dataList value="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,4)}" var="fileitem" type="ordered" emptyMessage="#{msg.noRecordFound}">
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                </p:dataList>
                            </p:tab>
                            <c:forEach items="#{assetInfoDetailController.getAttachmentCategories()}" var="attachmentConfig">
                                <p:tab title="#{attachmentConfig.label}">
                                    <p:dataList value="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,attachmentConfig.boType)}" var="fileitem" type="ordered" emptyMessage="#{msg.noRecordFound}">
                                        <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
                                    </p:dataList>
                                </p:tab>
                            </c:forEach>
                            <p:tab title="#{fieldMsg.fieldValue('attachmentType', 'vlink')}">
                                <p:dataList value="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,'vlink')}" var="fileitem" type="ordered" emptyMessage="#{msg.noRecordFound}">
                                    <p:link href="#{fileitem.extLink}" target="_blank">#{fileitem.objectName}</p:link>
                                </p:dataList>
                            </p:tab>
                            <p:tab title="#{msg.QRCode}" rendered="#{not empty assetInfoDetailController.selected.qrCode}">
                                <p:panelGrid columns="2" layout="grid" styleClass="showcase-text-align-center">
                                    <p:graphicImage id="qrcode" value="#{qrCodeShowController.getImg(assetInfoDetailController.selected.qrCode,assetInfoDetailController.selected.siteUID)}" stream="false" />
                                    <p:commandButton id="btn" value="打印" icon="ui-icon-print" style="margin-top: 41px;margin-left: 30px">
                                        <p:printer target="qrcode" />
                                    </p:commandButton>
                                </p:panelGrid>
                            </p:tab>
                        </p:tabView>
                    </h:form>

                </p:tab>
                <p:tab title="#{msg.EventRecord}">
                    <h:form>
                        <p:panelGrid columns="2"  layout="grid" styleClass="ui-panelgrid-blank">

                            <p:panel  header="#{msg.MaintainanceRecord}" rendered="#{assetInfoDetailController.maintanceType eq 'internal' or assetInfoDetailController.maintanceType eq 'both' }">
                                <f:facet name="actions">
                                    <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default"  action="#{urlEncryptController.encodeUrlParam('/portal/woMgr/workOrderList?faces-redirect=true&amp;query=12&amp;queryAssetUID='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                                    <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default"  action="#{urlEncryptController.encodeUrlParam('/portal/woMgr/workOrderList?faces-redirect=true&amp;assetUID='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-add" /></h:commandLink>
                                    <p:commandButton ajax="false" value="#{msg.ExportAllReports}"
                                                     actionListener="#{workOrderReportExportController.exportAllWoByAssetInfoId(assetInfoDetailController.selected.id)}"
                                                     icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl">
                                        <p:fileDownload value="#{workOrderReportExportController.exportFile}"/>
                                    </p:commandButton>
                                    <p:commandButton ajax="false" value="#{msg.ExportAllDetails}"
                                                     actionListener="#{workOrderReportExportController.exportAllWoDocxByAssetInfoId(assetInfoDetailController.selected.id)}"
                                                     icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl">
                                        <p:fileDownload value="#{workOrderReportExportController.exportDocx}"/>
                                    </p:commandButton>
                                </f:facet>

                                <p:dataTable var="item" value="#{inspectionServiceController.getWorkOrderList(assetInfoDetailController.selected.uid)}" emptyMessage="#{msg.noRecordFound}"
                                             paginator="true" paginatorPosition="both" rows="5"
                                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}">
                                    <p:column styleClass="textCenter"  headerText="#{msg.casePriority}" >
                                        <h:outputText value="#{item.casePriority}" class="priorityItem priorityItem#{item.casePriority}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.requestTime}" >
                                        <h:outputText value="#{item.requestTime}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.requestReason}" >
                                        <h:outputText value="#{item.requestReason}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.requestorName}" >
                                        <h:outputText value="#{item.requestorName}"/>
                                    </p:column>
                                </p:dataTable>
                            </p:panel>

                            <p:panel  header="#{msg.MetrologyMonitor}" rendered="#{assetInfoDetailController.maintanceType eq 'internal' or assetInfoDetailController.maintanceType eq 'both' }">
                                <f:facet name="actions">
                                    <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="#{urlEncryptController.encodeUrlParam('/portal/measuring/measuringResultMain?faces-redirect=true&amp;query=12&amp;queryAssetUID='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                                </f:facet>
                                <p:dataTable var="item" value="#{inspectionServiceController.getMeasureAssetList(assetInfoDetailController.selected.id)}" emptyMessage="#{msg.noRecordFound}"
                                             paginator="true" paginatorPosition="both" rows="5"
                                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}">
                                    <p:column headerText="#{msg.serialNum}">
                                        <h:outputText value="#{item.serialNum}" />
                                    </p:column>
                                    <p:column headerText="计量证书编号">
                                        <h:outputText value="#{item.meteringNO}" />
                                    </p:column>
                                    <p:column headerText="检定结论">
                                        <h:outputText value="#{fieldMsg.fieldValue('measuringStatus', item.verificationConclusion)}" />
                                    </p:column>
                                    <p:column headerText="计量日期">
                                        <h:outputText value="#{item.checkDate}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                        </h:outputText>
                                    </p:column>
                                </p:dataTable >
                            </p:panel>
                            <!--test-->
                            <p:panel  header="#{msg.InternalMaintenanceRecord}" rendered="#{assetInfoDetailController.maintanceType eq 'internal' or assetInfoDetailController.maintanceType eq 'both' }">
                                <f:facet name="actions">
                                    <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="#{urlEncryptController.encodeUrlParam('/portal/pm/pmOrderListAll?faces-redirect=true&amp;query=100&amp;queryAssetUID='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                                </f:facet>
                                <p:dataTable var="item" value="#{inspectionServiceController.getPmOrderList(assetInfoDetailController.selected.uid)}" emptyMessage="#{msg.noRecordFound}"
                                             paginator="true" paginatorPosition="both" rows="5"
                                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}">
                                    <p:column headerText="#{msg.creatorUID}" >
                                        <h:outputText value="#{item.creatorName}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.MaintenanceID}" >
                                        <h:outputText value="#{item.pmNum}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.currentStep}" >
                                        <h:outputText value="#{item.currentStepName}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.currentPersonUID}" >
                                        <h:outputText value="#{item.currentPersonName}"/>
                                    </p:column>
                                </p:dataTable>
                            </p:panel>
                            <p:panel  header="盘点记录" rendered="#{(assetInfoDetailController.maintanceType eq 'internal' or assetInfoDetailController.maintanceType eq 'both' ) and userContextService.hasCurrentTenantName('')}">
                                <f:facet name="actions">
                                    <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="#{urlEncryptController.encodeUrlParam('/portal/inventory/inventoryOrderDetailAssetInfoMainAll?faces-redirect=true&amp;query=100&amp;queryAssetUID='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                                </f:facet>
                                <p:dataTable var="item" value="#{inspectionServiceController.getInventoryOrderDetailList(assetInfoDetailController.selected.id)}" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="盘点状态" >
                                        <h:outputText value="#{item.status==0?msg.NonInventory:item.status==1?msg.Inventorized:item.status==2?msg.NonLedger:item.status==3?msg.HasIssue:item.status==4?msg.NoWorkOrder:item.status}" />

                                    </p:column>
                                    <p:column headerText="#{msg.InventoryChecker}" >
                                        <h:outputText value="#{assetInfoDetailController.getUserName(item.lastModifiedBy)}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.InvnetoryTime}" >
                                        <h:outputText value="#{item.lastModifiedDate}" >
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm " />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.PlannedStartTime}" >
                                        <h:outputText value="#{item.planStartTime}" >
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm " />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.plannedEndTime}" >
                                        <h:outputText value="#{item.planEndTime}" >
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm " />
                                        </h:outputText>
                                    </p:column>
                                </p:dataTable>
                            </p:panel>
                            <p:panel  header="#{msg.ExternalMaintenanceRecord}4566" rendered="#{assetInfoDetailController.maintanceType eq 'external' or assetInfoDetailController.maintanceType eq 'both' }">
                                <f:facet name="actions">
                                    <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="#{urlEncryptController.encodeUrlParam('/portal/pm/pmOrderListAll?faces-redirect=true&amp;queryTab=pmOrderListRemote&amp;queryAssetUID='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                                </f:facet>
                                <p:dataTable var="item" value="#{assetInfoDetailController.getOrderList('5')}" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.MaintenanceID}" >
                                        <h:outputText value="#{item.eventUid}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.UpdateDate}" >
                                        <h:outputText value="#{item.createTime}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.status}" >
                                        <h:outputText value="#{item.descriptionObject.status}"/>
                                    </p:column>
                                </p:dataTable>
                            </p:panel>
                            <p:panel  header="#{msg.ExternalMaintenanceRecord2}" rendered="#{assetInfoDetailController.maintanceType eq 'external' or assetInfoDetailController.maintanceType eq 'both' }">
                                <f:facet name="actions">
                                    <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default"  action="#{urlEncryptController.encodeUrlParam('/portal/woMgr/workOrderList?faces-redirect=true&amp;queryTab=outWorkOrder&amp;queryAssetUID='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                                </f:facet>
                                <p:dataTable var="item" value="#{assetInfoDetailController.getOrderList(3)}" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.arrivalListItemNum}" >
                                        <h:outputText value="#{item.eventUid}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.UpdateDate}" >
                                        <h:outputText value="#{item.createTime}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.status}" >
                                        <h:outputText value="#{item.descriptionObject.status}"/>
                                    </p:column>
                                </p:dataTable>
                            </p:panel>
                            <p:panel  header="#{msg.OnSiteMaintenanceRecord}" rendered="#{assetInfoDetailController.maintanceType eq 'external' or assetInfoDetailController.maintanceType eq 'both' }">
                                <f:facet name="actions">
                                    <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="#{urlEncryptController.encodeUrlParam('/portal/pm/pmOrderListAll?faces-redirect=true&amp;queryTab=pmOrderListOut&amp;queryAssetUID='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                                </f:facet>
                                <p:dataTable var="item" value="#{assetInfoDetailController.getOrderList(4)}" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.arrivalListItemNum}" >
                                        <h:outputText value="#{item.eventUid}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.UpdateDate}" >
                                        <h:outputText value="#{item.createTime}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.status}" >
                                        <h:outputText value="#{item.descriptionObject.status}"/>
                                    </p:column>
                                </p:dataTable>
                            </p:panel>
                            <p:panel  header="日常检查记录" >
                                <f:facet name="actions">
                                    <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default"  action="#{urlEncryptController.encodeUrlParam('/portal/nurseSite/maintainMain?faces-redirect=true&amp;query=12&amp;queryAssetUID='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                                    <p:commandButton  value="#{msg.ExportAllReports}" icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl nurseSiteMaintainForm" onclick="PF('nurseSiteMaintainDialog').show()"/>
                                </f:facet>
                                <p:dataTable var="item" value="#{maintainController.getMaintainDataList(assetInfoDetailController.selected.uid)}" emptyMessage="#{msg.noRecordFound}"
                                             paginator="true" paginatorPosition="both" rows="5"
                                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}">
                                    <p:column styleClass="textCenter"  headerText="计划检查日期" >
                                        <h:outputText value="#{item.scheduleDate}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="实际检查日期" >
                                        <h:outputText value="#{item.checkDate}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                        </h:outputText>
                                    </p:column>
                                    <!--                            <p:column headerText="负责人" >
                                                                    <h:outputText value="#{item.principal}"/>
                                                                </p:column>-->
                                    <p:column headerText="检查人" >
                                        <h:outputText value="#{item.checker}"/>
                                    </p:column>
                                    <p:column headerText="工单状态" >

        <script id="shwoPicDialog_s" type="text/javascript">$(function () {
            PrimeFaces.cw("Dialog", "shwoPicDialog", {id: "shwoPicDialog", modal: true, appendTo: "@(body)"});
        });
        </script>
        <script>
            afterPageLoad = function () {
                $(".jqplot-table-legend").css("display", "none");
            }
            
            function showthis(pic) {
                var s = $('#shwoPicDialogImg')[0];
                s.src = pic.src;
                s.style.transform = 'rotate('+ 0 +'deg)';
                s.width = pic.width * 1.8;
                s.height = pic.height * 1.8;
                PF('shwoPicDialog').show();
                var dia = $("#shwoPicDialog")[0];
                dia.style.top = '5px';
                for (let i = 0; i &lt; 12; i++) {
                    ImageSuofang(true);
                }
            }

            //旋转
            var num = 0;
            $("#spin").click(function () {
                num++;
                // $("#shwoPicDialogImg").style.rotate = num * 90;
                var pic = $("#shwoPicDialogImg")[0];
                pic.style.transform = 'rotate('+num * 90+'deg)';
                if(pic.width > pic.height &amp;&amp; num%2 ==1){
                    pic.style.marginTop='140px';
                }else{
                    pic.style.marginTop='5px';
                }
            })

            function ImageSuofang(args) {
                var imgsrc =  $("#shwoPicDialogImg")[0];
                if (args) {

                    if(imgsrc.width * 1.1 > 1000 ||imgsrc.height * 1.1 > 700 ){
                        return;
                    }

                    imgsrc.width = imgsrc.width * 1.1;
                    imgsrc.height = imgsrc.height * 1.1;
                }
                else {
                    imgsrc.width = imgsrc.width / 1.1;
                    imgsrc.height = imgsrc.height / 1.1;
                }
            }
            //<![CDATA[
            window.onscroll = function () {
                console.log(document.documentElement.scrollTop);
                var scrollTop = document.documentElement.scrollTop;
                /*1.默认的透明度*/
                var sharedAssetConfigOpen=document.getElementById('sharedAssetConfigForm:sharedAssetConfigOpen').value;
                var nurseSiteMaintainOpen=document.getElementById('nurseSiteMaintainForm:nurseSiteMaintainOpen').value;
                if(sharedAssetConfigOpen=='true' || nurseSiteMaintainOpen =='true'){
                    document.documentElement.scrollTop=0;
                }else{
                    document.documentElement.scrollTop=scrollTop;
                }

            }
            //]]>
        </script>

            new Viewer(document.getElementById('picDiv'), {inline: true});
        </script>
