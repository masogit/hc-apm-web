<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <!-- 报废操作人人 -->
    <p:column headerText="报废操作人人" width="130">
        <h:outputText value="#{item.changePerson}" />
    </p:column>

    <!-- 操作时间 -->
    <p:column headerText="操作时间" width="130">
        <h:outputText value="#{item.changeTime}">
            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
        </h:outputText>
    </p:column>

    <!-- 申请变更科室 -->
    <p:column headerText="申请变更科室" width="130">
        <h:outputText value="#{item.applyChangeDepartment}" />
    </p:column>

    <!-- 申请人 -->
    <p:column headerText="申请人" width="130">
        <h:outputText value="#{item.applyPerson}" />
    </p:column>

    <!-- 操作时间 -->
    <p:column headerText="操作时间" width="130">
        <h:outputText value="#{item.changeTime}">
            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
        </h:outputText>
    </p:column>

</ui:composition>
</html>
