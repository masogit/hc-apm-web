<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>

    <!-- 资产名称 -->
    <p:column headerText="#{msg.assetName}" width="100" filterBy="#{item.assetName}" filterMatchMode="LIKE">
        <p:link outcome="#{urlEncryptController.encodeUrlParam('/portal/asset/info/AssetDetail.xhtml?faces-redirect=true&amp;actionName=View&amp;terminate=false&amp;selectedid='.concat(item.assetUid))}" style="color: #337ab7;">
            <h:outputText value="#{empty item.name ? item.assetName : item.name}"/>
        </p:link>
    </p:column>

    <!-- 资产编号 -->
    <p:column headerText="#{msg.AssetID}" width="125" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
        <h:outputText value="#{empty item.financingNum ? '暂无' : item.financingNum}"/>
    </p:column>

    <!-- 设备编号 -->
    <p:column headerText="#{msg.departNum}" width="125" rendered="#{currentCustomConfigController.showImportantField('departNum')}">
        <h:outputText value="#{item.departNum}"/>
    </p:column>

    <!-- 使用部门 -->
    <p:column headerText="#{msg.assetDeptName}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('assetDeptName')}">
        <h:outputText value="#{item.assetDeptName}"/>
    </p:column>

    <!-- 所属部门 -->
    <p:column headerText="#{msg.clinicalDeptName}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('clinicalDeptName')}">
        <h:outputText value="#{item.clinicalDeptName}"/>
    </p:column>

    <!-- 使用人 -->
    <p:column headerText="#{msg.clinicalOwnerName}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('clinicalOwnerName')}">
        <h:outputText value="#{item.clinicalOwnerName}" />
    </p:column>

    <!-- 安装位置 -->
    <p:column headerText="#{msg.locationName}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('locationName')}">
        <h:outputText value="#{item.locationName}" />
    </p:column>

    <!-- 资产状态 -->
    <p:column headerText="#{msg.deviceStatus}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('deviceStatus')}">
        <h:outputText value="#{item.deviceStatus}" />
    </p:column>

    <!-- 当前状态 -->
    <p:column headerText="#{msg.status}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('status')}">
        <h:outputText value="#{item.status}" />
    </p:column>

    <!-- 在用? -->
    <p:column headerText="#{msg.isValid}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('isValid')}">
        <h:outputText value="#{item.isValid}" />
    </p:column>
    <!-- 资产处置结果-->
    <p:column headerText="#{msg.assetDisposalResults}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('assetDisposalResults')}">
        <h:outputText value="#{item.assetDisposalResults}" />
    </p:column>

    <!-- 采购日期 -->
    <p:column headerText="#{msg.purchaseDate}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('purchaseDate')}">
        <h:outputText value="#{item.purchaseDate}" />
    </p:column>

    <!-- 采购原值 -->
    <p:column headerText="#{msg.purchasePrice}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('purchasePrice')}">
        <h:outputText value="#{item.purchasePrice}" />
    </p:column>

    <!-- 二维码 -->
    <p:column headerText="#{msg.qrCode}(旧)" width="130"
              rendered="#{currentCustomConfigController.showImportantField('qrCode')}">
        <h:outputText value="#{item.qrCodeOld}" />
    </p:column>
    <p:column headerText="#{msg.qrCode}(新)" width="130"
              rendered="#{currentCustomConfigController.showImportantField('qrCode')}">
        <h:outputText value="#{item.qrCodeNew}" />
    </p:column>

    <!-- 启用日期 -->
    <p:column headerText="#{msg.installDate}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('installDate')}">
        <h:outputText value="#{item.installDate}" />
    </p:column>

    <!-- 设备型号 -->
    <p:column headerText="#{msg.functionType}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('functionType')}">
        <h:outputText value="#{item.functionType}" />
    </p:column>

    <!-- 修改人 contains-->
    <p:column headerText="#{msg.ModifiedBy}" width="80" filterBy="#{item.createdBy}" filterMatchMode="LIKE">
        <h:outputText value="#{item.createdBy}"/>
    </p:column>

    <!-- 修改来源 -->
    <p:column headerText="修改来源" width="100">
        <h:outputText value="#{item.modifySource}"/>
    </p:column>

    <p:column headerText="#{msg.spare06}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('spare06')}">
        <h:outputText value="#{item.spare06}" />
    </p:column>
    <p:column headerText="#{msg.spare07}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('spare07')}">
        <h:outputText value="#{item.spare07}" />
    </p:column>
    <p:column headerText="#{msg.spare08}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('spare08')}">
        <h:outputText value="#{item.spare08}" />
    </p:column>
    <p:column headerText="#{msg.spare09}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('spare09')}">
        <h:outputText value="#{item.spare09}" />
    </p:column>
    <p:column headerText="#{msg.spare10}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('spare10')}">
        <h:outputText value="#{item.spare10}" />
    </p:column>


    <p:column headerText="#{msg.riskGrade}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('riskGrade')}">
        <h:outputText value="#{item.riskGrade}" />
    </p:column>
    <p:column headerText="#{msg.emergencyEquipment}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('emergencyEquipment')}">
        <h:outputText value="#{item.emergencyEquipment}" />
    </p:column>
    <p:column headerText="#{msg.importEquipment}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('importEquipment')}">
        <h:outputText value="#{item.importEquipment}" />
    </p:column>
    <p:column headerText="#{msg.capitalSource}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('capitalSource')}">
        <h:outputText value="#{item.capitalSource}" />
    </p:column>
    <p:column headerText="#{msg.assetUsage}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('assetUsage')}">
        <h:outputText value="#{item.assetUsage}" />
    </p:column>
    <p:column headerText="#{msg.measureGrade}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('measureGrade')}">
        <h:outputText value="#{item.measureGrade}" />
    </p:column>
    <p:column headerText="#{msg.vendor}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('vendor')}">
        <h:outputText value="#{item.vendor}" />
    </p:column>
    <p:column headerText="#{msg.registrationNo}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('registrationNo')}">
        <h:outputText value="#{item.registrationNo}" />
    </p:column>
    <p:column headerText="#{msg.manufacture}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('manufacture')}">
        <h:outputText value="#{item.manufacture}" />
    </p:column>
    <p:column headerText="#{msg.makerShortName}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('makerShortName')}">
        <h:outputText value="#{item.makerShortName}" />
    </p:column>
    <p:column headerText="#{msg.assetOwnerName}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('assetOwnerName')}">
        <h:outputText value="#{item.assetOwnerName}" />
    </p:column>
    <p:column headerText="#{msg.manufactDate}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('manufactDate')}">
        <h:outputText value="#{item.manufactDate}" />
    </p:column>
    <p:column headerText="#{msg.factoryWarrantyDate}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('factoryWarrantyDate')}">
        <h:outputText value="#{item.factoryWarrantyDate}" />
    </p:column>
    <p:column headerText="#{msg.lifecycle}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('lifecycle')}">
        <h:outputText value="#{item.lifecycle}" />
    </p:column>
    <p:column headerText="#{msg.medicalApparatusClassification}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('medicalApparatusClassification')}">
        <h:outputText value="#{item.medicalApparatusClassification}" />
    </p:column>
    <p:column headerText="#{msg.systemNum4}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('systemNum4')}">
        <h:outputText value="#{item.systemNum4}" />
    </p:column>
    <p:column headerText="#{msg.functionGroup}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('functionGroup')}">
        <h:outputText value="#{item.functionGroup}" />
    </p:column>
    <p:column headerText="#{msg.assetCode68}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('assetCode68')}">
        <h:outputText value="#{item.assetCode68}" />
    </p:column>
    <p:column headerText="#{msg.serialNum}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('serialNum')}">
        <h:outputText value="#{item.serialNum}" />
    </p:column>
    <p:column headerText="#{msg.repairForm}" width="130"
              rendered="#{currentCustomConfigController.showImportantField('repairForm')}">
        <h:outputText value="#{item.repairForm}" />
    </p:column>
    <!-- 修改时间 -->
    <p:column headerText="#{msg.modifiedTime}" width="160" filterBy="#{item.createdDate}" filterMatchMode="GTE">
        <f:facet name="filter">
            <p:inputText id="filterLastModifiedDateAll" widgetVar="varFilterLastModifiedDateAll" />
        </f:facet>
        <h:outputText value="#{item.createdDate}">
            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
        </h:outputText>
    </p:column>

    <!-- 导出文件 -->
    <f:facet name="{Toolbar}">
        <!--<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-file-download"
                         class="btn btn-sm btn-gray"
                         ajax="false">
            <p:dataExporter type="xls" target="datalistView"
                            fileName="#{msg.ModifyRecord}"/>
        </p:commandButton>-->
        <p:commandButton ajax="false" actionListener="#{assetHistoryController.exportData()}" title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" validateClient="true" update=":growl">
            <p:fileDownload value="#{assetHistoryController.exportFile}" />
        </p:commandButton>
    </f:facet>

</ui:composition>
</html>
