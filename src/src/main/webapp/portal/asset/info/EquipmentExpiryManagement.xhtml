<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <script type="text/javascript">
        </script>
        <style>
            .btn+.btn { margin-left: 0 }
            .ui-column-resizer:before {content: none!important;}
            th{font-size: 12px!important;}
            td{font-size: 12px!important;padding: 0!important;}
            table .ui-chkbox-icon, td img{ zoom: 0.7!important}
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.deviceExpiryManagement}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <h:panelGrid id="searchPanel" columns="3">
                        <h:panelGroup>
                            <p:commandButton id="btnOrg"
                                             value="#{empty equipmentExpiryManagementController.selectSite? msg.AllHospitals:equipmentExpiryManagementController.selectSite.name}"
                                             type="button" icon="fa fa-angle-down" iconPos="right"/>
                            <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false"
                                            modal="false">
                                <p:inputText id="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
                                <p:commandButton partialSubmit="true" icon="ui-icon-search"
                                                 process=":searchForm:treeNodeNameFilter @this"
                                                 update="searchForm:orgTree"
                                                 actionListener="#{orgTreeController.filterTreeNodeByName()}"
                                                 value="#{msg.Search}"/>
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;"
                                            value="#{orgTreeController.siteOrgTree}"
                                            selection="#{orgTreeController.selectedOrgNode}" var="node"
                                            selectionMode="single" dynamic="true">
                                        <p:ajax process="@this" event="select"
                                                listener="#{equipmentExpiryManagementController.onSelectSiteTreeNode}"
                                                update=":equipmentExpiryManagementForm"
                                                oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <p:inputText id="searchText" value="#{equipmentExpiryManagementController.oneSearchStr}"
                                     placeholder="#{msg.name}/#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}/#{msg.manufacture}/#{msg.clinicalDeptName}/#{msg.assetTags}"
                                     maxlength="100" style="width: 500px">
                            <p:ajax event="keyup"
                                    update=":equipmentExpiryManagementForm searchButtons"/>
                        </p:inputText>
                        <h:panelGroup id="searchButtons">
                            <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":equipmentExpiryManagementForm searchText searchButtons" actionListener="#{equipmentExpiryManagementController.setOneSearchStr('')}" rendered="#{not empty equipmentExpiryManagementController.oneSearchStr}"/>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
                <h:form id="equipmentExpiryManagementForm">
                    <p:dataTable id="datalist" value="#{equipmentExpiryManagementController.lazyModel}" var="item"
                                 widgetVar="varDataList"
                                 selectionMode="single" scrollable="false"
                                 selection="#{equipmentExpiryManagementController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.JumpTo} {JumpToPageDropdown} #{msg.Page} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="filter" listener="#{equipmentExpiryManagementController.onFilter}"
                                oncomplete="updateSelectAllCheckBox();" update="searchForm"/>
                        <p:ajax event="page" oncomplete="updateSelectAllCheckBox();"/>
                        <p:column id="checkBoxColumn" width="49" exportable="false">
                            <p:selectBooleanCheckbox value="#{equipmentExpiryManagementController.selectedMap[item.id]}"
                                                     class="selectCheckBox">
                                <p:ajax process="@this" update="@this @(.batch-terminated) :equipmentExpiryManagementForm:datalist :panelFilterManufactureDate"
                                        listener="#{equipmentExpiryManagementController.onSelectOfPage}"
                                        oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header">
                                <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                    <p:ajax listener="#{equipmentExpiryManagementController.onSelectAllOfPage}"
                                            update=" :equipmentExpiryManagementForm:datalist :panelFilterManufactureDate"
                                            oncomplete="updateSelectAllCheckBox();"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column headerText="操 作" exportable="false" width="49">
                            <p:commandLink title="#{msg.editUsageYear}" onclick="PF('editUsageDateDialog').show()" update=":editUsageDateForm" process="@this" actionListener="#{equipmentExpiryManagementController.prepareEditUsageDate(item)}">
                                <p:graphicImage name="icons/edit.png" style="width: 30px; height: 30px;margin-top: 8px"/>
                            </p:commandLink>
                        </p:column>
                        <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}"
                                  sortBy="#{item.namePyCode}" filterBy="#{item.name}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.clinicalDeptName}">
                            <f:facet name="header">
                                <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                                <p:autoComplete dropdown="true" value="#{equipmentExpiryManagementController.filterClinicalDeptOrg}" appendTo="@(Body)"
                                                scrollHeight="300"  forceSelection="true" completeMethod="#{equipmentExpiryManagementController.autoCompleteDeptName}" size="5">
                                    <p:ajax event="itemSelect" listener="#{equipmentExpiryManagementController.onClinicalDeptNameFilterChange}" process="@this"  update=":equipmentExpiryManagementForm:datalist :panelFilterManufactureDate" oncomplete="afterLoadRender()" />
                                    <p:ajax process="@this" listener="#{equipmentExpiryManagementController.onClinicalDeptNameFilterChange}" update=":equipmentExpiryManagementForm:datalist :panelFilterManufactureDate"  oncomplete="afterLoadRender()"/>
                                </p:autoComplete>
                            </f:facet>
                            <h:outputText value="#{item.clinicalDeptOrg.shortName}"/>
                        </p:column>
                        <c:if test="#{userContextService.accessContainsFunctionMenu('CONFIG_ASSET_GROUP')}">
                            <p:column headerText="#{msg.assetTypeGroup}" width="100" exportable="true">
                                <f:facet name="header">
                                    <h:outputText value="#{msg.assetTypeGroup}"/><br/>
                                    <p:autoComplete dropdown="true" value="#{equipmentExpiryManagementController.filterAssetTypeGroup}" appendTo="@(Body)"
                                                    scrollHeight="300"  forceSelection="true" completeMethod="#{equipmentExpiryManagementController.autoCompleteAssetTypeGroupName}" size="5">
                                        <p:ajax event="itemSelect" listener="#{equipmentExpiryManagementController.onAssetTypeGroupNameFilterChange}" process="@this"  update=":equipmentExpiryManagementForm:datalist :panelFilterManufactureDate"/>
                                        <p:ajax process="@this" listener="#{equipmentExpiryManagementController.onAssetTypeGroupNameFilterChange}" update=":equipmentExpiryManagementForm:datalist :panelFilterManufactureDate" />
                                    </p:autoComplete>
                                </f:facet>
                                <h:outputText value="#{equipmentExpiryManagementController.convertAssetTypeGroupEncodedToName(item.assetType)}"/>
                            </p:column>
                        </c:if>
                        <p:column headerText="#{msg.manufacture}" sortBy="#{item.manufacture}"
                                  filterBy="#{item.manufacture}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.manufacture}"/>
                        </p:column>
                        <p:column headerText="#{msg.makerShortName}" sortBy="#{item.makerShortName}"
                                  filterBy="#{item.makerShortName}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.makerShortName}"/>
                        </p:column>
                        <p:column headerText="#{msg.functionType}" sortBy="#{item.functionType}"
                                  filterBy="#{item.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                        <p:column headerText="#{msg.RegistrationNumber}" sortBy="#{item.registrationNo}"
                                  filterBy="#{item.registrationNo}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.registrationNo}"/>
                        </p:column>
                        <p:column headerText="#{msg.lifecycle}" sortBy="#{item.lifecycle}"
                                  filterBy="#{item.lifecycle}" filterMatchMode="EQ">
                            <h:outputText
                                    value="#{item.lifecycle == null ? null : item.lifecycle / 12}"/>
                        </p:column>
                        <p:column headerText="#{msg.ManufactureDate}" sortBy="#{item.manufactDate}" filterBy="#{item.manufactDate}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterManufactureDate" widgetVar="varFilterManufactureDate" />
                            </f:facet>
                            <h:outputText value="#{item.manufactDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.serialNum}" sortBy="#{item.serialNum}"
                                  filterBy="#{item.serialNum}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.serialNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.QRCode}" exportable="true" width="150"
                                  sortBy="#{item.qrCode}" filterBy="#{item.qrCode}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.qrCode}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="batchSetUseYearButton" icon="fa fa-cogs" class="btnEdit" title="#{msg.batchEditUsageYear}" update="batchEditBeforeForm" actionListener="#{equipmentExpiryManagementController.batchEditUsageDateBefore()}" disabled="#{!equipmentExpiryManagementController.isChecked()}" oncomplete="PF('batchEditBeforeDialog').show()"/>
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-file-download" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="AquipmentExpiry_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                    <p:remoteCommand name="rc"
                                     update=":equipmentExpiryManagementForm:datalist datalist:batchSetUseYearButton"
                                     immediate="true"/>
                </h:form>
                <p:overlayPanel id="panelFilterManufactureDate" widgetVar="panelFilterManufactureDate"
                                for=":equipmentExpiryManagementForm:datalist:filterManufactureDate" dismissable="false">
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}" />
                        <p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_manufactureDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false"
                                    navigator="true" mask="true" size="12" locale="zh" />
                        <p:outputLabel value="#{msg.To}" />
                        <p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_manufactureDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false"
                                    navigator="true" mask="true" size="12" locale="zh" />
                    </h:panelGrid>
                    <p:commandButton
                            onclick="setDateFilter('varDataList','varFilterManufactureDate','varStartTimeFrom_manufactureDate','varStartTimeTo_manufactureDate'); PF('panelFilterManufactureDate').hide();"
                            title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
                    <p:commandButton onclick="PF('panelFilterManufactureDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button"
                                     style="zoom: 0.8;" />
                </p:overlayPanel>
            </div>
        </div>
        <p:dialog  id="batchEditBeforeDialog" widgetVar="batchEditBeforeDialog"  modal="true" resizable="true" draggable="true" width="30%" height="200px" header="#{msg.batchEditAssets}">
            <h:form id="batchEditBeforeForm" class="bcls">
                <p:panelGrid id ="batchEditUsage" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <h1 class="m-0">#{msg.batchEditAffectedDevices} <span style="color: red">#{equipmentExpiryManagementController.batchModifyCount}</span> #{msg.devices}</h1>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{equipmentExpiryManagementController.prepareEditUsageDate(null)}" value="#{msg.ok}" onclick="PF('editUsageDateDialog').show();PF('batchEditBeforeDialog').hide()" icon="ui-icon-check" update=":editUsageDateForm" />
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('batchEditBeforeDialog').hide()"/>
                    </h:panelGroup>
                </p:panelGrid>
            </h:form>
        </p:dialog>
        <p:dialog id="editUsageDateDlg" widgetVar="editUsageDateDialog" width="1000" height="500" modal="true" resizable="true" draggable="true" appendTo="@this" header="#{msg.editUsageYear}" closable="true">
            <h:form id="editUsageDateForm">
                <p:fieldset legend="#{msg.usageYearDate}">
                    <p:inputNumber id="lifecycle" value="#{equipmentExpiryManagementController.lifecycle}" decimalPlaces="0" emptyValue="0" minValue="0" maxValue="100" style="width: 500px" />#{msg.usageYear}
                    &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;
                    <h:panelGroup rendered="#{!empty equipmentExpiryManagementController.selected}">
                        <p:calendar  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}"
                                    id="manufactureDate"  value="#{equipmentExpiryManagementController.selected.manufactDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" title="#{msg.ManufactureDate}"/> <span style="margin-left: -33px">#{msg.manufactureDateInput}</span>
                    </h:panelGroup>

                </p:fieldset>
                <p:fieldset legend="#{msg.usageYearDateReferTo}" style="height: 350px">
                    <span style="width: 700px;font-size: 11px;color: #3e464c94">#{msg.usageYearDateComments}</span>
                <br/>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;
                    <span style="width: 700px;font-size: 11px;color: #3e464c94">#{msg.usageYearDateCommentsTwo}</span>
                    <p:dataTable id="lifecyclelist" value="#{equipmentExpiryManagementController.equipmentExpiryManagements}" var="item"
                                 widgetVar="varLifecyclelist" resizableColumns="true" liveResize="true" resizeMode="fit"
                                 disabledSelection="true"
                                 scrollable="false"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.JumpTo} {JumpToPageDropdown} #{msg.Page} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rowIndexVar="idx"
                                 rows="5" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="5">
                        <p:column headerText="#{msg.RegistrationNumber}">
                            <h:outputText value="#{item.registerNo}"/>
                        </p:column>
                        <p:column headerText="#{msg.functionType}">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                        <p:column headerText="#{msg.makerShortName}">
                            <h:outputText value="#{empty item.manufacture?item.manufactureName:item.manufacture}"/>
                        </p:column>
                        <p:column headerText="#{msg.lifecycle}">
                            <h:outputText value="#{item.lifecycle}"/>
                        </p:column>
                        <p:column headerText="#{msg.manufactureDateYear}">
                            <h:outputText value="#{item.manufactDate}" />
                        </p:column>
                        <p:column headerText="#{msg.matchFactor}" rendered="#{equipmentExpiryManagementController.matchByFunctionType}">
                            <h:outputText value="#{item.matchFactor}" >
                                <f:convertNumber type="percent" minFractionDigits="2" />
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </p:fieldset>
                <p:commandButton validateClient="true" actionListener="#{equipmentExpiryManagementController.applyChange()}" value="#{msg.Save}"
                                 update=":equipmentExpiryManagementForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'editUsageDateDialog');"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('editUsageDateDialog').hide()" />
            </h:form>
        </p:dialog>
        <script>
            function afterLoadRender(){
                $(".ui-datatable-tablewrapper").css('width', '100%');
                $("div table")[1].style.overflowX= "scroll";
                $("div table")[1].style.width = "auto";
                $("html")[0].style.overflowX= "hidden";
            }



            //<![CDATA[
            afterPageLoad = function () {
                $("#searchForm\\:searchText").keypress(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                    }
                })
                var isActive = "#{userContextService.isActive()}";
                if (isActive == '1') {
                    PF('ActiveDlg').show();
                }
            }
            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#equipmentExpiryManagementForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }

            //]]>
        </script>
    </ui:define>
</ui:composition>
