                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.deviceStatus}</label>
                                <p:selectOneRadio id="deviceStatus"  label="#{msg.status}" value="#{assetInfoApprovalController.selected.deviceStatus}" disabled="true">

                                </p:selectOneRadio>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.comments}</label>
                                <p:inputText  value="#{assetInfoApprovalController.selected.comments}" readonly="true"/>

                            </h:panelGroup>
                            <h:panelGroup>

                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.warrantyDate}</label>
                                <p:inputText value="#{assetInfoApprovalController.selected.warrantyDate}" readonly="true">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.terminateDate}</label>

                                </p:selectOneRadio>

                    </p:fieldset>
                    <p:fieldset legend="设备图片" >
                        <p:dataGrid var="picItem" value="#{assetInfoApprovalController.getPicList()}" columns="4" layout="grid"  rendered="#{not empty assetInfoApprovalController.getPicList()}">
                            <p:panel  style="text-align:center">
                                <h:panelGrid columns="1" style="width:100%">
                                    <p:graphicImage url="#{fileDownloadService.getFileUrl(picItem.objectStorageId)}"   style="max-width: 100%;height: auto" onclick="javascript:showthis(this);"/> 
                                </h:panelGrid>
                            </p:panel>
                        </p:dataGrid>
                    </p:fieldset>
                    <h:panelGroup>
                        <p:commandButton validateClient="false" actionListener="#{assetInfoApprovalController.rejectCreate()}" action="ApprovalList?faces-redirect=true" value="审核不通过" update=":approvalAssetDialogForm" icon="ui-icon-clear" oncomplete="handleSubmit(args, 'approvalAssetDialog');"/>
                        <p:commandButton validateClient="false" actionListener="#{assetInfoApprovalController.approveCreate()}" action="ApprovalList?faces-redirect=true" value="审核通过" update=":approvalAssetDialogForm" icon="ui-icon-check" oncomplete="handleSubmit(args, 'approvalAssetDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{assetInfoApprovalController.cancel()}" action="ApprovalList?faces-redirect=true" icon="ui-icon-cancel" onclick="PF('easyInstallDialog').hide()"/>

                    <br/>

        <div id="shwoPicDialog" class="ui-dialog ui-widget ui-widget-content ui-corner-all ui-shadow ui-hidden-container" style="max-width: 800px;max-height:600px;min-width:800px;min-height:600px">
            <div class="ui-dialog-titlebar ui-widget-header ui-helper-clearfix ui-corner-top">
                <span id="shwoPicDialog_title" class="ui-dialog-title">图片</span><a href="#" class="ui-dialog-titlebar-icon ui-dialog-titlebar-close ui-corner-all" aria-label="Close">
                    <span class="ui-icon ui-icon-closethick"></span></a>
                <a href="#" class="ui-dialog-titlebar-icon ui-dialog-titlebar-maximize ui-corner-all"><span class="ui-icon ui-icon-extlink"></span></a>
            </div>
            <div class="ui-dialog-content ui-widget-content"  style="max-width: 800px;max-height:600px;min-width:800px;min-height:600px">

                <image id="shwoPicDialogImg" src="" ></image>
            </div>
        </div>
        <script id="shwoPicDialog_s" type="text/javascript">$(function () {
                PrimeFaces.cw("Dialog", "shwoPicDialog", {id: "shwoPicDialog", modal: true, appendTo: "@(body)"});
            });
        </script>
        <script>
        function showthis(pic) {
            var s = $('#shwoPicDialogImg')[0];
            s.src = pic.src;
            PF('shwoPicDialog').show();
        }
    </script>

</ui:composition>
