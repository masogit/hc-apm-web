<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="TerminationByFileDlg" widgetVar="TerminationByFileDlg"
              width="1000" height="450" modal="true"
              resizable="true" draggable="true" appendTo="@(body)"
              header="#{msg.BatchTerminate}">
        <h:form id="WoExportTemplateEditForm">
            <h:panelGroup id="display">
                <p:fieldset id="basic" legend="#{msg.UploadedFileTerminatedInBatch}">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <h:outputText value="#{assetInfoToBeTerminatedListController.uploadedFile.fileName}"
                                          rendered="#{not empty assetInfoToBeTerminatedListController.uploadedFile}"/>
                            <p:fileUpload fileUploadListener="#{assetInfoToBeTerminatedListController.uploadDataFile}"
                                          value="#{assetInfoToBeTerminatedListController.file}" mode="advanced"
                                          dragDropSupport="false" style="width:100%" process="@this"
                                          multiple="false" sizeLimit="10000000" update=":woTab:WoExportTemplateEditForm"
                                          auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}10M"
                                          allowTypes="/(\.|\/)(xlsx)$/" label="#{msg.Add}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <h:panelGroup>
                        <p>#{msg.description}</p>
                        <p>
                            1.
                            <p:commandButton value="#{msg.downloadTemplateFile}" title="#{msg.exportToXLS}"
                                             icon="ui-icon-arrowstop-1-s" class="btn btn-sm"
                                             actionListener="#{assetInfoToBeTerminatedListController.exportAssetExcelTemplate}"
                                             update=":growl"
                                             onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false"
                                             style="background-color: #5180ce;">
                                <p:fileDownload value="#{assetInfoToBeTerminatedListController.assetTemplateFile}"/>
                            </p:commandButton>
                        </p>
                        <p>2. #{msg.AssetIDRequired}</p>
                        <p>3. #{msg.upFileImport}</p>
                    </h:panelGroup>
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="false"
                                 actionListener="#{assetInfoToBeTerminatedListController.batchUpdate()}"
                                 value="#{msg.Save}"
                                 update="display,:woTab:AssetInfoListForm1, :woTab:TerminationByFileDlg, :growl"
                                 icon="ui-icon-check" oncomplete="handleSubmit(args, 'TerminationByFileDlg');"/>
                &nbsp;&nbsp;
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('TerminationByFileDlg').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
