<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:apm="http://www.ge.com/tags/apm">

<ui:composition>

    <p:dialog widgetVar="unfinishedAssetOrderDetailDialog" modal="true" id="unfinishedAssetOrderDetailDialog" draggable="true" appendTo="@(body)" height="300" width="500"   >
        <p:fieldset legend="当前设备有未完成工单,请进行处理">
            <p:commandButton  rendered="#{assetInfoEditController.nurseSiteMaintainIsComplete}" validateClient="true" actionListener="#{assetInfoEditController.processUnfinishedNurseSiteMaintain('已报废')}"  value="自动处理未完成临床助手工单" icon="ui-icon-check"/>
            <br/> <br/> <br/>
            <h:panelGroup rendered="#{not empty assetInfoEditController.workOrderList}">
                未完成维修工单号: #{assetInfoEditController.workOrderList}  <br/> <br/> <br/>
            </h:panelGroup>
            <h:panelGroup rendered="#{not empty assetInfoEditController.pmOrderList}">
                未完成保养工单号: #{assetInfoEditController.pmOrderList}  <br/> <br/> <br/>
            </h:panelGroup>

        </p:fieldset>
    </p:dialog>

    <p:dialog id="scrapapply" widgetVar="scrapapply"  modal="true" resizable="true" draggable="true" appendTo="@(body)"   height="500" width="500" header="报废申请">
        <h:form id="nodeForm" >
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">申请理由*</label>
                    <p:inputTextarea placeholder="报废申请"  value="#{assetInfoEditController.applyReason}" maxlength="256"  required="true" />
                    <p:outputLabel value="#{assetInfoEditController.applyReason}" />
                </h:panelGroup>
                <h:panelGroup rendered="#{assetInfoEditController.getIsAssetStaff()}">
                    <label class="label">鉴定理由*</label>
                    <p:inputTextarea placeholder="鉴定理由"  value="#{assetInfoEditController.approvalReason}" maxlength="256"  required="#{assetInfoEditController.getIsAssetStaff()}"/>
                    <p:outputLabel value="#{assetInfoEditController.approvalReason}" />
                </h:panelGroup>

                <h:panelGroup rendered="#{assetInfoEditController.getIsAssetStaff()}">
                    <label class="label">处置方式</label>
                    <p:selectOneMenu id="equipmentDisposalMethod"  value="#{assetInfoEditController.equipmentDisposalMethod}" >
                        <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('equipmentDisposalMethod')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        <p:ajax event="itemSelect"  update="nodeForm:customDisposalMethod  nodeForm:scrapButton "/>

                    </p:selectOneMenu>
                </h:panelGroup>
                <h:panelGroup id="customDisposalMethod" rendered="#{assetInfoEditController.getIsAssetStaff()}">
                    <h:panelGroup  rendered="#{assetInfoEditController.equipmentDisposalMethod eq '0'}" >
                        <label class="label">自定义处置方式</label>
                        <p:inputTextarea placeholder="自定义处置方式" value="#{assetInfoEditController.customDisposalMethod}" maxlength="256" />
                        <p:outputLabel value="#{assetInfoEditController.customDisposalMethod}" />
                    </h:panelGroup>
                </h:panelGroup>
            </p:panelGrid>

            <p:commandButton id="scrapButton"  validateClient="true" immediate="false" actionListener="#{assetInfoEditController.getSig()}" value="确定"  icon="ui-icon-check"  oncomplete="handleCompleteSig(xhr, status, args);"/>
            <p:commandButton style="display: none" id="openSignature" actionListener="#{assetInfoEditController.getSignature()}" value="查看签名" update="signatureDlg" oncomplete="PF('signatureDlg').show();" />

            <p:commandButton  validateClient="false" immediate="true"  value="取消"  icon="ui-icon-check" oncomplete="PF('scrapapply').hide()"/>
        </h:form>

    </p:dialog>

    <p:dialog id="signatureDlg" widgetVar="signatureDlg" header="签名" modal="true">
        <h:form id="signatureForm">
            <h:panelGrid columnClasses="value" columns="1">
                <h:panelGroup>
                    <p:signature id="signatureContent" style="width:400px;height:200px" widgetVar="sigPanel" base64Value="#{assetInfoEditController.signatureContent}"
                                 guideline="false" rendered="#{assetInfoEditController.signatureContentStream==null}" />
                    <p:graphicImage value="#{assetInfoEditController.signatureContentStream}" stream="false" rendered="#{assetInfoEditController.signatureContentStream!=null}"></p:graphicImage>
                </h:panelGroup>
            </h:panelGrid>
            <p:commandButton value="确认" actionListener="#{assetInfoEditController.applyAssetApplication('scrap')}" update=":assetDetail"  oncomplete="handleApproveSuccess(xhr, status, args);" />
            <p:commandButton immediate="true" process="@this" value="重写" actionListener="#{assetInfoEditController.resetSignature()}" update="signatureForm" oncomplete="PF('sigPanel').clear()"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" onclick="PF('signatureDlg').hide()"/>
        </h:form>

    </p:dialog>


    <script type="text/javascript">
        function handleCompleteSig(xhr, status, args) {
            if(xhr.status===205){
                // alert(document.getElementById('nodeForm:openSignature'));
                document.getElementById('nodeForm:openSignature').click();
            }else{
                PF('scrapapply').hide();
            }
        }
        function handleApproveSuccess(xhr, status, args) {
            if(xhr.status!==206){
                PF('signatureDlg').hide();
                PF('scrapapply').hide();
            }
        }
        function handleAssetScrapSubmit(xhr, status, args) {
            var asetOrderIsComplete = args.asetOrderIsComplete;
            if(asetOrderIsComplete==true) {
                PF('unfinishedAssetOrderDetailDialog').show();
            }else{
                PF('scrapapply').show();
            }
        }
    </script>

</ui:composition>
</html>
