<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="ExportTemplateEditDlg" widgetVar="ExportTemplateEditDialog"
              onHide="#{assetInfoToBeTerminatedListController.isChecked()}" width="1000" height="450" modal="true"
              resizable="true" draggable="true" appendTo="@(body)"
              header="报损鉴定表导出">
        <h:form id="ExportTemplateEditForm">
            <p/>
            <h:panelGroup id="display">
                <p:commandButton id="exportButton" value="#{msg.toBeTerminatedAppraisal}"
                                 actionListener="#{assetInfoToBeTerminatedListController.exportToBeTerminatedAppraisalFile}"
                                 update=":growl" icon="ui-icon-file-download"
                                 onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false">
                    <p:fileDownload value="#{assetInfoToBeTerminatedListController.toBeTerminatedAppraisalFile}"/>
                </p:commandButton>
                &nbsp;&nbsp;
                <p:commandButton immediate="true" id="templateConfigButton" value="模版配置"
                                 icon="ui-icon-settings" onclick="PF('templateDialog').show()">
                </p:commandButton>
                &nbsp;&nbsp;
                <p:commandButton immediate="true" value="#{msg.Cancel}"
                                 icon="ui-icon-cancel" onclick="PF('ExportTemplateEditDialog').hide()"/>
            </h:panelGroup>
            <p/>
            <p:dialog id="templateDialog" widgetVar="templateDialog" width="800" height="300">
                <h:panelGroup id="display2">
                    <p:fieldset id="basic" legend="模版配置">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <p:commandButton update=":growl" icon="ui-icon-file-download" value="下载当前生效模版"
                                                 onclick="PrimeFaces.monitorDownload(start, stop);">
                                    <p:fileDownload
                                            value="#{assetInfoToBeTerminatedListController.getActiveTemplate()}"/>
                                </p:commandButton>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.choseFileToUpload}</label>
                                <h:outputText id="uuu" value="#{assetInfoToBeTerminatedListController.uploadedFile.fileName}"
                                              rendered="#{not empty assetInfoToBeTerminatedListController.uploadedFile}"/>
                                <p:fileUpload
                                        fileUploadListener="#{assetInfoToBeTerminatedListController.uploadDataFile}"
                                        value="#{assetInfoToBeTerminatedListController.file}" mode="advanced"
                                        dragDropSupport="false" style="width:100%" process="@this"
                                        multiple="false" sizeLimit="10000000" update=":growl :woTab:ExportTemplateEditForm:display2"
                                        auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}10M"
                                        allowTypes="/(\.|\/)(docx)$/" label="#{msg.Add}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                </h:panelGroup>
            </p:dialog>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
