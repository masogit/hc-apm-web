<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog  id="batchEditBeforeDialog" widgetVar="batchEditBeforeDialog"  modal="true" resizable="true" draggable="true" width="30%" height="200px" header="#{msg.batchEditAssets}">
        <h:form id="batchEditBeforeForm" class="bcls">
            <p:panelGrid id ="PmOrderRule" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <h1 class="m-0">#{msg.batchEditAffectedDevices} <span style="color: red">#{assetInfoListController.resultList.size()}</span> #{msg.devices}</h1>
                </h:panelGroup>
                <h:panelGroup>
                    <p:commandButton validateClient="true"  actionListener="#{assetInfoListController.navigateTo()}" value="#{msg.ok}" icon="ui-icon-check" update=":growl" />
                    <p:commandButton id="returnButton" value="#{msg.Return}" icon="ui-icon-arrow-back" onclick="PF('batchEditBeforeDialog').hide()" immediate="true" />
                </h:panelGroup>
            </p:panelGrid>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
