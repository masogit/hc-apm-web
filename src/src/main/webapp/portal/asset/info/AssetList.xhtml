<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            .btn+.btn { margin-left: 0 }
            .ui-column-resizer:before {content: none!important;}
            th{font-size: 12px!important;}
            td{font-size: 12px!important;padding: 0px!important;}
            table .ui-chkbox-icon, td img{ zoom: 0.7!important}
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value=" #{assetInfoListController.terminate? msg.TerminateAssetInfo:msg.AssetInfo}"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="searchForm">
                    <h:panelGrid id="searchPanel" columns="3">
                        <h:panelGroup >
                            <p:commandButton id="btnOrg" value="#{empty assetInfoListController.selectSite? msg.AllHospitals:assetInfoListController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                            <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.siteOrgTree}" selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
                                        <p:ajax process="@this" event="select" listener="#{assetInfoListController.onSelectSiteTreeNode}" update=":AssetInfoListForm :searchForm :idVarPanelDeptOrg" oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <p:inputText id="searchText" value="#{assetInfoListController.oneSearchStr}" placeholder="#{msg.name}/#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}/#{msg.manufacture}/#{msg.clinicalDeptName}" maxlength="100" style="width: 500px">
                            <p:ajax event="keyup" update=":AssetInfoListForm :idPanelFilterWarrantyDate :idVarPanelDeptOrg searchButtons " />
                        </p:inputText>

                        <h:panelGroup id='searchButtons'>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm :idPanelFilterWarrantyDate :idVarPanelDeptOrg"  rendered="#{empty assetInfoListController.oneSearchStr}"/>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm :idPanelFilterWarrantyDate :idVarPanelDeptOrg" actionListener="#{assetInfoListController.setOneSearchStr('')}" rendered="#{not empty assetInfoListController.oneSearchStr}"/>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
                <h:form id="AssetInfoListForm">
                    <p:dataTable id="datalist" value="#{assetInfoListController.lazyModel}" var="item" widgetVar="varDataList" resizableColumns="false" resizeMode="expand"
                                 selectionMode="single" scrollable="false" scrollWidth="98%" selection="#{assetInfoListController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true" binding="#{assetInfoListController.customTable}"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"  
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rowIndexVar="idx"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,40,90,200">

                        <p:ajax  event="rowSelect" listener="#{assetInfoListController.onSelectAsset}" onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)" update="createButton  deleteButton "/>
                        <p:ajax event="filter" listener="#{assetInfoListController.onFilter}" oncomplete="updateSelectAllCheckBox();"/>
                        <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                        <p:column width="36"  id="checkBoxColumn">
                            <p:selectBooleanCheckbox value="#{assetInfoListController.selectedMap[item.uid]}"  class="selectCheckBox">
                                <p:ajax listener="#{assetInfoListController.onItemSelected(item.uid)}" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header"  >
                                <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                    <p:ajax listener="#{assetInfoListController.onSelectAllOfPage}" update="@(.selectCheckBox) :AssetInfoListForm:datalist:batchToBeTerminatedButton :AssetInfoListForm:datalist:batchToTerminatedButton" oncomplete="updateSelectAllCheckBox();"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column exportable="false" width="#{userContextService.hasRole('AssetHead')?60:30}" id="operatorColumn">
                            <h:panelGroup rendered="#{empty assetInfoListController.filterWarrantyDate}">
                                <p:link target="_new" title="#{msg.Edit}" outcome="#{assetInfoListController.getEditPage(item.id,item.name)}" rendered="#{userContextService.hasAnyRole('AssetHead,AssetStaff')}">
                                    <p:graphicImage name="icons/edit.png" style="width: 30px; height: 30px;"/>
                                </p:link>
                                <p:commandLink rendered="#{userContextService.hasRole('AssetHead')}" id="deleteButton" title="#{msg.Delete}"  actionListener="#{assetInfoListController.deleteAsset(item)}" update="datalist">
                                    <p:graphicImage name="icons/delete.png" style="width: 30px; height: 30px;"/>
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandLink>
                            </h:panelGroup>
                            <p:commandButton id="cancleWarranty" style="zoom:0.65;" process="@this" title="取消保修提醒" actionListener="#{assetInfoListController.cancleWarranty(item.uid)}" update="datalist" rendered="#{!empty assetInfoListController.filterWarrantyDate and item.warranty}" icon="ui-icon-notifications-off">
                                <p:confirm header="取消保修提醒" message="确定取消该设备保修提醒？" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </p:column>
                        <p:column id="name" headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE" visible="false" rendered="false">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column id="functionType" visible="false" rendered="false" headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                        <p:column id="serialNum" visible="false" rendered="false" headerText="#{msg.serialNum}" sortBy="#{item.serialNum}" filterBy="#{item.serialNum}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.serialNum}"/>
                        </p:column>
                        <p:column id="departNum" visible="false" rendered="false" headerText="#{msg.departNum}" sortBy="#{item.departNum}" filterBy="#{item.departNum}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.departNum}"/>
                        </p:column>

                        <p:column id="assetGroup" visible="false" rendered="false" headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column id="clinicalDeptName" visible="false" rendered="false" headerText="#{msg.clinicalDeptName}" >
                            <f:facet name="header">
                                <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                                <p:inputText id="clinicalDept"  value="#{assetInfoListController.fileterOrg.name}"  readonly="true"/>
                            </f:facet>
                            <h:outputText value="#{item.clinicalDeptName}"/>
                        </p:column>
                        <p:column id="nationalStandardCode" visible="false" rendered="false" headerText="#{msg.nationalStandardCode}"  >
                            <h:outputText value="#{item.nationalStandardCode}"/>
                        </p:column>
                        <p:column id="manufacture" visible="false" rendered="false" headerText="#{msg.manufacture}" sortBy="#{item.manufacture}" filterBy="#{item.manufacture}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.manufacture}"/>
                        </p:column>
                        <p:column id="vendor" visible="false" rendered="false" headerText="#{msg.vendor}" sortBy="#{item.vendor}" filterBy="#{item.vendor}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.vendor}"/>
                        </p:column>
                        <p:column id="status" visible="false" headerText="#{msg.status}" sortBy="#{item.status}" filterBy="#{item.status}" filterMatchMode="EQ" rendered="#{!assetInfoListController.terminate}">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{assetInfoListController.filterAssetStatus}" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{fieldMsg.fieldValue('assetStatus',item.status)}"/>
                        </p:column>
                        <p:column id="warrantyDate" visible="false" rendered="false" headerText="#{msg.warrantyDate}" sortBy="#{item.warrantyDate}" filterBy="#{item.warrantyDate}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterWarrantyDate" widgetVar="varFilterWarrantyDate" value="#{assetInfoListController.warrantyFormatTime}"/>
                            </f:facet>
                            <h:outputText value="#{item.warrantyDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column id="financingNum" visible="false" rendered="false" headerText="#{msg.financingNum}" exportable="true" sortBy="#{item.financingNum}" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.financingNum}"/>
                        </p:column>
                        <p:column id="qrCode" visible="false" rendered="false" headerText="#{msg.QRCode}" exportable="true" width="150" sortBy="#{item.qrCode}" filterBy="#{item.qrCode}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.qrCode}"/>
                        </p:column>

                        <p:column id="aliasName" visible="false" rendered="false" headerText="#{msg.aliasName}" >
                            <h:outputText value="#{item.aliasName}"/>
                        </p:column>
                        <p:column id="assetOwnerName" visible="false" rendered="false" headerText="#{msg.assetOwnerName}" >
                            <h:outputText value="#{item.assetOwnerName}"/>
                        </p:column>
                        <p:column id="assetOwnerTel" visible="false" rendered="false" headerText="#{msg.assetOwnerTel}" >
                            <h:outputText value="#{item.assetOwnerTel}"/>
                        </p:column>
                        <p:column  id="assetOwnerName2" visible="false" rendered="false" headerText="#{msg.assetOwnerName2}" >
                            <h:outputText value="#{item.assetOwnerName2}"/>
                        </p:column>
                        <p:column id="assetOwnerTel2" visible="false" rendered="false" headerText="#{msg.assetOwnerTel2}" >
                            <h:outputText value="#{item.assetOwnerTel2}"/>
                        </p:column>
                        <p:column id="assetOwnerName3" visible="false" rendered="false" headerText="#{msg.assetOwnerName3}" >
                            <h:outputText value="#{item.assetOwnerName3}"/>
                        </p:column>
                        <p:column id="assetOwnerTel3" visible="false" rendered="false" headerText="#{msg.assetOwnerTel3}" >
                            <h:outputText value="#{item.assetOwnerTel3}"/>
                        </p:column>
                        <p:column id="clinicalOwnerName" visible="false" rendered="false" headerText="#{msg.clinicalOwnerName}" >
                            <h:outputText value="#{item.clinicalOwnerName}"/>
                        </p:column>
                        <p:column id="clinicalOwnerTel" visible="false" rendered="false" headerText="#{msg.clinicalOwnerTel}" >
                            <h:outputText value="#{item.clinicalOwnerTel}"/>
                        </p:column>
                        <p:column id="assetUsage" visible="false" rendered="false" headerText="#{msg.assetUsage}" >
                            <h:outputText value="#{fieldMsg.fieldValue('assetUsage', item.assetUsage)}"/>
                        </p:column>
                        <p:column id="capitalSource" visible="false" rendered="false" headerText="#{msg.capitalSource}" >
                            <h:outputText value="#{fieldMsg.fieldValue('capitalSource', item.capitalSource)}"/>
                        </p:column>
                        <p:column id="measureGrade" visible="false" rendered="false" headerText="#{msg.measureGrade}" >
                            <h:outputText value="#{fieldMsg.fieldValue('measureGrade', item.measureGrade)}"/>
                        </p:column>
                        <p:column id="riskGrade" visible="false" rendered="false" headerText="#{msg.riskGrade}" >
                            <h:outputText value="#{fieldMsg.fieldValue('riskGrade', item.riskGrade)}"/>
                        </p:column>
                        <p:column id="emergencyEquipment" visible="false" rendered="false" headerText="#{msg.emergencyEquipment}" >
                            <h:outputText value="#{fieldMsg.fieldValue('emergencyEquipment', item.emergencyEquipment)}"/>
                        </p:column>
                        <p:column id="importEquipment" visible="false" rendered="false" headerText="#{msg.importEquipment}" >
                            <h:outputText value="#{fieldMsg.fieldValue('importEquipment', item.importEquipment)}"/>
                        </p:column>
                        <p:column id="measuringItemCategory" visible="false" rendered="false" headerText="#{msg.measuringItemCategory}" >
                            <h:outputText value="#{fieldMsg.fieldValue('measuringItemCategory', item.measuringItemCategory)}"/>
                        </p:column>
                        <p:column id="accountingCategory" visible="false" rendered="false" headerText="#{msg.accountingCategory}" >
                            <h:outputText value="#{fieldMsg.fieldValue('accountingCategory', item.accountingCategory)}"/>
                        </p:column>
                        <p:column id="siteUID" visible="false" rendered="false" headerText="#{msg.hospitalId}" >
                            <h:outputText value="#{assetInfoListController.getSiteOrgName(item.siteUID)}"/>
                        </p:column>
                        <p:column id="parentAssetId" visible="false" rendered="false" headerText="#{msg.parentAsset}" >
                            <h:outputText value="#{assetInfoListController.getParentAssetNameByAssetId(item.id)}"/>
                        </p:column>
                        <p:column id="systemId" visible="false" rendered="false" headerText="#{msg.systemId}" >
                            <h:outputText value="#{item.systemId}"/>
                        </p:column>
                        <p:column id="functionGroup" visible="false" rendered="false" headerText="#{msg.functionGroup}" >
                            <h:outputText value="#{fieldMsg.fieldValue('assetFunctionType',item.functionGroup)}"/>
                        </p:column>
                        <p:column id="assetCode68" visible="false" rendered="false" headerText="#{msg.assetCode68}"  >
                            <h:outputText value="#{item.assetCode68}"/>
                        </p:column>
                        <p:column id="functionGrade" visible="false" rendered="false" headerText="#{msg.functionGrade}" >
                            <h:outputText value="#{fieldMsg.fieldValue('assetFunctionGrade',item.functionGrade)}"/>
                        </p:column>
                        <p:column id="maitanance" visible="false" rendered="false" headerText="#{msg.maitanance}" >
                            <h:outputText value="#{item.maitanance}"/>
                        </p:column>
                        <p:column id="maitananceTel" visible="false" rendered="false" headerText="#{msg.maitananceTel}" >
                            <h:outputText value="#{item.maitananceTel}"/>
                        </p:column>
                        <p:column id="barcode" visible="false" rendered="false" headerText="#{msg.barcode}" >
                            <h:outputText value="#{item.barcode}"/>
                        </p:column>
                        <p:column id="modalityId" visible="false" rendered="false" headerText="#{msg.modalityId}" >
                            <h:outputText value="#{item.modalityId}"/>
                        </p:column>
                        <p:column id="locationCode" visible="false" rendered="false" headerText="#{msg.locationCode}" >
                            <h:outputText value="#{item.locationCode}"/>
                        </p:column>
                        <p:column id="locationName" visible="false" rendered="false" headerText="#{msg.locationName}" >
                            <h:outputText value="#{item.locationName}"/>
                        </p:column>
                        <p:column id="registrationNo" visible="false" rendered="false" headerText="#{msg.registrationNo}" >
                            <h:outputText value="#{item.registrationNo}"/>
                        </p:column>
                        <p:column id="deviceStatus" visible="false" rendered="false" headerText="#{msg.deviceStatus}" >
                            <h:outputText value=" #{fieldMsg.fieldValue('deviceStatus',item.deviceStatus)}"/>
                        </p:column>
                        <p:column id="manufactDate" visible="false" rendered="false" headerText="#{msg.manufactDate}" >
                            <h:outputText value="#{item.manufactDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column id="purchaseDate" visible="false" rendered="false" headerText="#{msg.purchaseDate}" >
                            <h:outputText value="#{item.purchaseDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column id="arriveDate" visible="false" rendered="false" headerText="#{msg.arriveDate}" >
                            <h:outputText value="#{item.arriveDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column id="installDate" visible="false" rendered="false" headerText="#{msg.installDate}" >
                            <h:outputText value="#{item.installDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column id="terminateDate" visible="false" rendered="false" headerText="#{msg.terminateDate}" >
                            <h:outputText value="#{item.terminateDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column id="factoryWarrantyDate" visible="false" rendered="false" headerText="质保日期" >
                            <h:outputText value="#{item.factoryWarrantyDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column id="purchasePrice" visible="false" rendered="false" headerText="#{msg.purchasePrice}" >
                            <h:outputText value="#{item.purchasePrice}"/>
                        </p:column>
                        <p:column id="salvageValue" visible="false" rendered="false" headerText="#{msg.salvageValue}" >
                            <h:outputText value="#{item.salvageValue}"/>
                        </p:column>
                        <p:column id="lifecycle" visible="false" rendered="false" headerText="#{msg.lifecycle}">
                            <h:outputText value="#{item.lifecycle}"/>
                        </p:column>
                        <p:column id="depreciationMethod" visible="false" rendered="false" headerText="#{msg.depreciationMethod}" >
                            <h:outputText value="#{fieldMsg.fieldValue('depreciationMethodList',item.depreciationMethod)}"/>
                        </p:column>
                        <p:column id="makerShortName" visible="false" rendered="false" headerText="#{msg.makerShortName}" >
                            <h:outputText value="#{item.makerShortName}"/>
                        </p:column>
                        <p:column id="deviceName" visible="false" rendered="false" headerText="#{msg.depreciationMethod}" >
                            <h:outputText value="#{item.deviceName}"/>
                        </p:column>
                        <p:column id="repairForm" visible="false" rendered="false" headerText="#{msg.repairForm}" >
                            <h:outputText value="#{fieldMsg.fieldValue('repairForm',item.repairForm)}"/>
                        </p:column>
                        <p:column id="comments" visible="false" rendered="false" headerText="#{msg.comments}"  >
                            <h:outputText value="#{item.comments}"/>
                        </p:column>
                        <p:column id="usageStatus" headerText="#{msg.usageStatus}" visible="true" exportable="false" filterBy="#{item.usageStatus}" filterMatchMode="EQ" rendered="#{assetInfoListController.needShowAssetApproval}">
                            <h:outputText value="#{fieldMsg.fieldValue('usageStatus', item.usageStatus)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('usageStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{assetInfoListController.prepareCreate}" action="#{urlEncryptController.encodeUrlParam('Create.xhtml?actionName=Create')}" rendered="#{!assetInfoListController.terminate and userContextService.hasAnyRole('HospitalHead,AssetHead,AssetStaff')}"/>
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" actionListener="#{assetInfoListController.exportExcel}" update=":growl"
                                             onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false">
                                <p:fileDownload value="#{assetInfoListController.excelFile}" />
                            </p:commandButton>
                            <p:commandButton id="exportButton" icon="ui-icon-arrow-1-s" title="#{msg.exportQrCode}" oncomplete="PF('exportQrCodeDialog').show()" rendered="#{!assetInfoListController.terminate and userContextService.hasAnyRole('HospitalHead,AssetHead,AssetStaff')}"/>

                            <ui:fragment rendered="#{!assetInfoListController.terminate and userContextService.hasAnyRole('HospitalHead,AssetHead,AssetStaff')}">
                                <p:commandButton id="batchToBeTerminatedButton" icon="ui-icon-delete" class="btn btn-sm btn-gray batch-terminated" title="批量待报废" actionListener="#{assetInfoListController.batchProcessToBeTerminated}" update=":AssetInfoListForm" disabled="#{not assetInfoListController.isChecked()}">
                                    <p:confirm header="批量待报废确认" message="您确定要待报废选定的记录么?" icon="ui-icon-warning"/>
                                </p:commandButton>
                                <p:commandButton id="batchToTerminatedButton" icon="ui-icon-delete-forever" class="btn btn-sm btn-gray batch-terminated" title="批量报废" actionListener="#{assetInfoListController.batchProcessToTerminated}" update=":AssetInfoListForm" disabled="#{not assetInfoListController.isChecked()}">
                                    <p:confirm header="批量报废确认" message="您确定要报废选定的记录么?" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </ui:fragment>

                        </f:facet>
                    </p:dataTable>

                    <p:remoteCommand name="rc" update=":AssetInfoListForm:datalist datalist:createButton datalist:deleteButton " immediate="true"/>
                </h:form>
            </div>
        </div>

        <p:overlayPanel id="idPanelFilterWarrantyDate" widgetVar="panelFilterWarrantyDate" for=":AssetInfoListForm:datalist:filterWarrantyDate" dismissable="false">
            <h:panelGrid columns="2">
                <p:outputLabel value="#{msg.From}"/>
                <p:calendar timeZone="GMT+8"  widgetVar="varWarrantyDateFrom" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                <p:outputLabel value="#{msg.To}"/>
                <p:calendar timeZone="GMT+8"  widgetVar="varWarrantyDateTo" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
            </h:panelGrid>
            <p:commandButton onclick="setDateFilter('varDataList', 'varFilterWarrantyDate', 'varWarrantyDateFrom', 'varWarrantyDateTo'); PF('panelFilterWarrantyDate').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
            <p:commandButton onclick="PF('panelFilterWarrantyDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
        </p:overlayPanel>

        <p:overlayPanel id="idVarPanelDeptOrg" widgetVar="varPanelDeptOrg" for=":AssetInfoListForm:datalist:clinicalDept" dismissable="true" style="text-align: left;">
            <p:scrollPanel style="height:300px;border: 0" mode="native">
                <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.getDeptOrgTree(assetInfoListController.selectSite==null? '':assetInfoListController.selectSite.uid)}"  var="node" selectionMode="single" dynamic="false">
                    <p:ajax process="@this" event="select"  listener="#{assetInfoListController.onClinicalDeptFilter}" update=":AssetInfoListForm:datalist :idVarPanelDeptOrg :idPanelFilterWarrantyDate" oncomplete="PF('varPanelDeptOrg').hide();"/>
                    <p:ajax process="@this" event="expand"/>
                    <p:ajax process="@this" event="collapse"/>
                    <p:treeNode type="org">
                        <h:outputText value="#{node.name}"/>
                    </p:treeNode>
                </p:tree>
            </p:scrollPanel>
        </p:overlayPanel>
        <p:dialog id="exportQrCodeDialog" widgetVar="exportQrCodeDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="导出二维码">
            <h:form id="exportQrCodeForm" >
                <h:panelGroup id="display" >
                    <label class="label">选择导出模版</label>
                    <p:selectOneMenu  value="#{assetInfoListController.exportQrCodeTemplateId}">
                        <p:ajax update="preview" />
                        <f:selectItem itemLabel="默认使用中模版" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{assetInfoListController.getQrCodeTemplates()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                    </p:selectOneMenu>
                    <h:panelGrid columns="1" style="width:100%" id="preview">
                        <h:panelGroup rendered="#{not empty assetInfoListController.exportQrCodeTemplateId}">
                            <img src="#{qrCodeShowController.getQrCodeImageWithTemplate('8888888888888888',assetInfoListController.exportQrCodeTemplateId,'')}" />
                        </h:panelGroup>
                    </h:panelGrid>
                </h:panelGroup>
                <p:commandButton id="exportButton" value="#{msg.exportQrCode}" actionListener="#{assetInfoListController.exportQrCode}" update=":growl" 
                                 onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false">
                    <p:fileDownload value="#{assetInfoListController.zipFile}" />
                </p:commandButton>
                <p:commandButton  immediate="true" value="#{msg.Close}" icon="ui-icon-cancel" onclick="PF('exportQrCodeDialog').hide()" />
            </h:form>
        </p:dialog>

        <script>
            //<![CDATA[
            window.onload = function () {
                $("#searchForm\\:searchText").keypress(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                    }
                });
                var isActive = "#{userContextService.isActive()}";
                if (isActive == '1') {
                    PF('ActiveDlg').show();
                }
            }
            var newWin;
            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }

            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#AssetInfoListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if(selectAllstatus){
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                }else{
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
//]]>
        </script>
    </ui:define>
</ui:composition>
