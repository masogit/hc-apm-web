<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="preRenderView">
        <f:metadata>
            <f:viewParam name="assetStatus" value="#{assetInfoListController.filterAssetStatus}"/>
            <f:viewParam name="model" value="#{assetInfoListController.filterWarrantyDate}"/>
            <f:viewParam name="assetId" value="#{assetInfoListController.assetId}"/>
        </f:metadata>
        <f:event type="preRenderView" listener="#{assetInfoListController.setAssetStatusFilter()}"/>
    </ui:define>

    <ui:define name="content">
        <script type="text/javascript">
            function handleAssetGroupChange(selection) {
                var ct = document.getElementById('AssetInfoListForm:datalist:assetGroupSeconday_input');
                if (ct) {
                    ct.value = '';
                }

                PF('varDataList').filter();
            }
        </script>

        <style>
            .warrantyExpireSoon {
            background-color: #fca752!important;
            color: #000000!important;
            }
            .warrantyExpired {
            background-color: #f04134!important;
            color: #000000!important;
            }
            .btn+.btn { margin-left: 0 }
            .ui-column-resizer:before {content: none!important;}
            th{font-size: 12px!important;}
            td{font-size: 12px!important;padding: 0px!important;}
            table .ui-chkbox-icon, td img{ zoom: 0.7!important}
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value=" #{assetInfoListController.terminate? msg.TerminateAssetInfo:msg.AssetInfo}"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="searchForm">
                    <h:panelGroup style="position: absolute; float: right; right: 50px;" rendered="#{assetInfoListController.showWarrantyAlert}">
                        <span >图例：</span>
                        <span class="warrantyExpireSoon">维保或质保即将到期</span>
                        <span></span>
                        <span class="warrantyExpired">维保或质保已经到期</span>
                    </h:panelGroup>
                    
                    <h:panelGrid id="searchPanel" columns="3">
                        <h:panelGroup rendered="#{userContextService.hasNotAnyRole('MVSAdmin,MVSFE')}">
                            <p:commandButton id="btnOrg" value="#{empty assetInfoListController.selectSite? msg.AllHospitals:assetInfoListController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                            <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false">
                                <p:inputText id="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
                                <p:commandButton partialSubmit="true" icon="ui-icon-search" process=":searchForm:treeNodeNameFilter @this" update="searchForm:orgTree" actionListener="#{orgTreeController.filterTreeNodeByName()}" value="检索"/>
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.siteOrgTree}" selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
                                        <p:ajax process="@this" event="select" listener="#{assetInfoListController.onSelectSiteTreeNode}" update=":AssetInfoListForm @(.dataTableFilterByHospital) :searchForm #{assetInfoListController.isShowColumn('clinicalDeptName')?'':''}" oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{userContextService.hasAnyRole('MVSAdmin,MVSFE')}">
                            <p:commandButton id="btnTenant" value="#{empty assetInfoListController.selectSite? '所有租户':assetInfoListController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right" />
                            <p:overlayPanel widgetVar="varPanelTenant" for="btnTenant" hideEffect="fade" dynamic="false" modal="false" style="text-align: left;">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="tenantTree" class="tree" style="width:98%;border:0;" value="#{tenantTreeController.buildTenantTree(1)}" selection="#{tenantTreeController.selectedTenantOrgNode}" var="node" selectionMode="single" dynamic="true">
                                        <p:ajax process="@this" event="select" listener="#{assetInfoListController.onSelectSiteTreeNode}" update=":AssetInfoListForm :searchForm" oncomplete="PF('varPanelTenant').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
										<p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <p:inputText id="searchText" value="#{assetInfoListController.oneSearchStr}" placeholder="#{msg.name}/#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}/#{msg.manufacture}/#{msg.clinicalDeptName}" maxlength="100" style="width: 500px">
                            <p:ajax event="keyup" update=":AssetInfoListForm #{assetInfoListController.isShowColumn('warrantyDate')?':idPanelFilterWarrantyDate':''} #{assetInfoListController.isShowColumn('clinicalDeptName')?'':''} searchButtons " />
                        </p:inputText>

                        <h:panelGroup id='searchButtons'>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm #{assetInfoListController.isShowColumn('warrantyDate')?':idPanelFilterWarrantyDate':''} #{assetInfoListController.isShowColumn('clinicalDeptName')?'':''}"  rendered="#{empty assetInfoListController.oneSearchStr}"/>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm #{assetInfoListController.isShowColumn('warrantyDate')?':idPanelFilterWarrantyDate':''} #{assetInfoListController.isShowColumn('clinicalDeptName')?'':''}" actionListener="#{assetInfoListController.setOneSearchStr('')}" rendered="#{not empty assetInfoListController.oneSearchStr}"/>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
                <h:form id="AssetInfoListForm">
                    <p:dataTable id="datalist" value="#{assetInfoListController.lazyModel}" var="item" widgetVar="varDataList" resizableColumns="true" liveResize="false" resizeMode="expand"
                                 selectionMode="single" scrollable="false" scrollWidth="98%" selection="#{assetInfoListController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true" 
                                 rowStyleClass="#{item.warrantyAlertStatus}"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.namePyCode}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rowIndexVar="idx"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax  event="rowSelect" listener="#{assetInfoListController.onSelectAsset}" onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)" update="createButton  deleteButton "/>
                        <p:ajax event="filter" listener="#{assetInfoListController.onFilter}" oncomplete="updateSelectAllCheckBox();"/>
                        <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                        <p:column width="36"  id="checkBoxColumn">
                            <p:selectBooleanCheckbox value="#{assetInfoListController.selectedMap[item.uid]}"  class="selectCheckBox">
                                <p:ajax process="@this" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header"  >
                                <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                    <p:ajax listener="#{assetInfoListController.onSelectAllOfPage}" update="@(.selectCheckBox) :AssetInfoListForm:datalist:batchToBeTerminatedButton" oncomplete="updateSelectAllCheckBox();"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column exportable="false" width="#{userContextService.hasRole('AssetHead')?60:30}" id="operatorColumn">
                            <h:panelGroup rendered="#{empty assetInfoListController.filterWarrantyDate}">
                                <p:link target="_new" title="#{msg.Edit}" outcome="#{assetInfoListController.getEditPage(item.id,item.name)}" rendered="#{userContextService.hasAnyRole('AssetHead,AssetStaff,MvsAdmin,SuperAdmin,SiteAdmin')}">
                                    <p:graphicImage name="icons/edit.png" style="width: 30px; height: 30px;"/>
                                </p:link>
                                <p:commandLink rendered="#{userContextService.hasRole('AssetHead')}" id="deleteButton" title="#{msg.Delete}"  actionListener="#{assetInfoListController.deleteAsset(item)}" update="datalist">
                                    <p:graphicImage name="icons/delete.png" style="width: 30px; height: 30px;"/>
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandLink>
                            </h:panelGroup>
                            <p:commandButton id="cancleWarranty" style="zoom:0.65;" process="@this" title="取消保修提醒" actionListener="#{assetInfoListController.cancleWarranty(item.uid)}" update="datalist" rendered="#{!empty assetInfoListController.filterWarrantyDate and item.warranty}" icon="ui-icon-notifications-off">
                                <p:confirm header="取消保修提醒" message="确定取消该设备保修提醒？" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </p:column>
                        <c:forEach items="#{assetInfoListController.customedColumns}" var="columnItem" >
                            <c:if test="#{columnItem eq 'name'}">
                                <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}" sortBy="#{item.namePyCode}" filterBy="#{item.name}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.name}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'functionType'}">
                                <p:column  headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.functionType}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'serialNum'}">
                                <p:column  headerText="#{msg.serialNum}" sortBy="#{item.serialNum}" filterBy="#{item.serialNum}" filterMatchMode="LIKE" >
                                    <h:outputText value="#{item.serialNum}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'departNum'}">
                                <p:column  headerText="#{msg.departNum}" sortBy="#{item.departNum}" filterBy="#{item.departNum}" filterMatchMode="LIKE" >
                                    <h:outputText value="#{item.departNum}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetGroup'}">
                                <p:column  headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                                    <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                                    <f:facet name="filter">
                                        <p:selectOneMenu onchange="handleAssetGroupChange()"  autoWidth="false" style="max-width: 150px;" height="300" value="#{assetInfoListController.assetGroup}">
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                            <p:ajax listener="#{assetInfoListController.assetGroupChangeListener}" update="@(.assetGroupChange)" />
                                        </p:selectOneMenu>
                                    </f:facet>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetGroupSecondary'}">
                                <p:column  headerText="#{msg.assetGroupSecondary}" sortBy="#{item.assetGroupSecondary}" filterBy="#{item.assetGroupSecondary}" filterMatchMode="EQ">
                                    <h:outputText value="#{fieldMsg.fieldValue('assetGroupSecondary_'.concat(item.assetGroup), item.assetGroupSecondary)}"/>

                                    <f:facet name="filter">
                                        <p:selectOneMenu id="assetGroupSeconday" onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" height="300" class="assetGroupChange" value="#{assetInfoListController.assetGroupSecondary}">
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{assetInfoListController.assetGroupSecondayList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                            <p:ajax listener="#{assetInfoListController.assetGroupSecondaryChangeListener}"/>
                                        </p:selectOneMenu>
                                    </f:facet>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetDeptName'}">
                                <p:column headerText="#{msg.assetDeptName}"  width="100">
                                    <f:facet name="header">
                                        <h:outputText value="#{msg.assetDeptName}"/><br/>
                                        <p:autoComplete dropdown="true" value="#{assetInfoListController.filterAssetDeptOrg}" appendTo="@(Body)"
                                                        scrollHeight="300"  forceSelection="true" completeMethod="#{assetInfoListController.autoCompleteDeptName}" size="5">
                                            <p:ajax event="itemSelect" listener="#{assetInfoListController.onAssetDeptNameFilterChange}" process="@this"  update=":AssetInfoListForm:datalist  :idPanelFilterWarrantyDate" />
                                            <p:ajax process="@this" listener="#{assetInfoListController.onAssetDeptNameFilterChange}" update=":AssetInfoListForm:datalist  :idPanelFilterWarrantyDate" />
                                        </p:autoComplete>
                                    </f:facet>
                                    <h:outputText value="#{item.assetDeptOrg.shortName}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'clinicalDeptName'}">
                                <p:column headerText="#{msg.clinicalDeptName}"  width="100">
                                    <f:facet name="header">
                                        <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                                        <p:autoComplete dropdown="true" value="#{assetInfoListController.filterClinicalDeptOrg}" appendTo="@(Body)"
                                                        scrollHeight="300"  forceSelection="true" completeMethod="#{assetInfoListController.autoCompleteDeptName}" size="5">
                                            <p:ajax event="itemSelect" listener="#{assetInfoListController.onClinicalDeptNameFilterChange}" process="@this"  update=":AssetInfoListForm:datalist  :idPanelFilterWarrantyDate" />
                                            <p:ajax process="@this" listener="#{assetInfoListController.onClinicalDeptNameFilterChange}" update=":AssetInfoListForm:datalist  :idPanelFilterWarrantyDate" />
                                        </p:autoComplete>
                                    </f:facet>
                                    <h:outputText value="#{item.clinicalDeptOrg.shortName}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'nationalStandardCode'}">
                                <p:column headerText="#{msg.nationalStandardCode}"  >
                                    <h:outputText value="#{item.nationalStandardCode}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'manufacture'}">
                                <p:column headerText="#{msg.manufacture}" sortBy="#{item.manufacture}" filterBy="#{item.manufacture}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.manufacture}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'vendor'}">
                                <p:column headerText="#{msg.vendor}" sortBy="#{item.vendor}" filterBy="#{item.vendor}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.vendor}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'subjectProject'}">
                                <p:column headerText="#{msg.subjectProject}" sortBy="#{item.subjectProject}" filterBy="#{item.subjectProject}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.subjectProject}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'status'}">
                                <p:column headerText="#{msg.status}" sortBy="#{item.status}" filterBy="#{item.status}" filterMatchMode="EQ" rendered="#{!assetInfoListController.terminate}">
                                    <f:facet name="filter">
                                        <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{assetInfoListController.filterAssetStatus}" >
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        </p:selectOneMenu>
                                    </f:facet>
                                    <h:outputText value="#{fieldMsg.fieldValue('assetStatus',item.status)}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'warrantyDate'}">
                                <p:column  headerText="#{msg.warrantyDate}" sortBy="#{item.warrantyDate}" filterBy="#{item.warrantyDate}" filterMatchMode="GTE">
                                    <f:facet name="filter">
                                        <p:inputText id="filterWarrantyDate" widgetVar="varFilterWarrantyDate" value="#{assetInfoListController.warrantyFormatTime}"/>
                                    </f:facet>
                                    <h:outputText value="#{item.warrantyDate}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                    </h:outputText>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'createdDate'}">
                                <p:column  headerText="#{msg.createdDate}" sortBy="#{item.createdDate}" filterBy="#{item.createdDate}" filterMatchMode="GTE">
                                    <f:facet name="filter">
                                        <p:inputText id="filterCreatedDate" widgetVar="varFilterCreatedDate" value="#{assetInfoListController.selectedObject['createdDate']}"/>
                                    </f:facet>
                                    <h:outputText value="#{item.createdDate}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                    </h:outputText>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'financingNum'}">
                                <p:column headerText="#{msg.financingNum}" exportable="true" sortBy="#{item.financingNum}" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.financingNum}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'qrCode'}">
                                <p:column headerText="#{msg.QRCode}" exportable="true" width="150" sortBy="#{item.qrCode}" filterBy="#{item.qrCode}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.qrCode}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'aliasName'}">
                                <p:column  headerText="#{msg.aliasName}" sortBy="#{item.aliasName}" filterBy="#{item.aliasName}" filterMatchMode="LIKE" >
                                    <h:outputText value="#{item.aliasName}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetOwnerName'}" >
                                <p:column  headerText="#{msg.assetOwnerName}" sortBy="#{item.assetOwnerName}" filterBy="#{item.assetOwnerName}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.assetOwnerName}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetOwnerTel'}">
                                <p:column  headerText="#{msg.assetOwnerTel}" sortBy="#{item.assetOwnerTel}" filterBy="#{item.assetOwnerTel}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.assetOwnerTel}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetOwnerName2'}" >
                                <p:column  headerText="#{msg.assetOwnerName2}" sortBy="#{item.assetOwnerName2}" filterBy="#{item.assetOwnerName2}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.assetOwnerName2}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetOwnerTel2'}">
                                <p:column headerText="#{msg.assetOwnerTel2}" sortBy="#{item.assetOwnerTel2}" filterBy="#{item.assetOwnerTel2}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.assetOwnerTel2}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetOwnerName3'}">
                                <p:column headerText="#{msg.assetOwnerName3}" sortBy="#{item.assetOwnerName3}" filterBy="#{item.assetOwnerName3}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.assetOwnerName3}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetOwnerTel3'}">
                                <p:column headerText="#{msg.assetOwnerTel3}" sortBy="#{item.assetOwnerTel3}" filterBy="#{item.assetOwnerTel3}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.assetOwnerTel3}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'clinicalOwnerName'}">
                                <p:column headerText="#{msg.clinicalOwnerName}" sortBy="#{item.clinicalOwnerName}" filterBy="#{item.clinicalOwnerName}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.clinicalOwnerName}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'clinicalOwnerTel'}">
                                <p:column headerText="#{msg.clinicalOwnerTel}" sortBy="#{item.clinicalOwnerTel}" filterBy="#{item.clinicalOwnerTel}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.clinicalOwnerTel}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetUsage'}">
                                <p:column id="assetUsage" headerText="#{msg.assetUsage}" sortBy="#{item.assetUsage}" filterBy="#{item.assetUsage}" filterMatchMode="EQ">
                                    <h:outputText value="#{fieldMsg.fieldValue('assetUsage', item.assetUsage)}"/>
                                    <f:facet name="filter">
                                        <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetUsage')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        </p:selectOneMenu>
                                    </f:facet>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetValueCategory'}">
                                <p:column headerText="#{msg.assetValueCategory}" >
                                    <h:outputText value="#{fieldMsg.fieldValue('assetValueCategory', item.assetValueCategory)}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'capitalSource'}">
                                <p:column id="capitalSource" headerText="#{msg.capitalSource}" sortBy="#{item.capitalSource}" filterBy="#{item.capitalSource}" filterMatchMode="EQ">
                                    <h:outputText value="#{fieldMsg.fieldValue('capitalSource', item.capitalSource)}"/>
                                    <f:facet name="filter">
                                        <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('capitalSource')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        </p:selectOneMenu>
                                    </f:facet>
                                </p:column>

                            </c:if>
                            <c:if test="#{columnItem eq 'capitalSource2'}">
                                <p:column id="capitalSource2" headerText="#{msg.capitalSource2}" sortBy="#{item.capitalSource2}" filterBy="#{item.capitalSource2}" filterMatchMode="EQ">
                                    <h:outputText value="#{fieldMsg.fieldValue('capitalSource2', item.capitalSource2)}"/>
                                    <f:facet name="filter">
                                        <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('capitalSource2')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        </p:selectOneMenu>
                                    </f:facet>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'measureGrade'}">
                                <p:column headerText="#{msg.measureGrade}" >
                                    <h:outputText value="#{fieldMsg.fieldValue('measureGrade', item.measureGrade)}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'riskGrade'}">
                                <p:column headerText="#{msg.riskGrade}" >
                                    <h:outputText value="#{fieldMsg.fieldValue('riskGrade', item.riskGrade)}"/>
                                </p:column>

                        e.preventDefault();
                    }
                })
                var isActive = "#{userContextService.isActive()}";
                if (isActive == '1') {
                    PF('ActiveDlg').show();
                }
            }
            var newWin;
            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }

            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#AssetInfoListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
