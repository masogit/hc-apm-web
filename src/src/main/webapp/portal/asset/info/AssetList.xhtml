
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="preRenderView">
        <f:metadata>
            <f:viewParam name="assetStatus" value="#{assetInfoListController.filterAssetStatus}"/>
            <f:viewParam name="model" value="#{assetInfoListController.filterWarrantyDate}"/>
            <f:viewParam name="assetId" value="#{assetInfoListController.assetId}"/>
        </f:metadata>
        <f:event type="preRenderView" listener="#{assetInfoListController.setAssetStatusFilter()}"/>
    </ui:define>

    <ui:define name="content">
        <script type="text/javascript">
            function handleAssetGroupChange(selection) {
                var ct = document.getElementById('AssetInfoListForm:datalist:assetGroupSeconday_input');
                if (ct) {
                    ct.value = '';
                }

                PF('varDataList').filter();
            }
            function updateWarrantyButtonLabel() {
                var selected = PF('warrantyMenuWidget').getSelectedItems();
                var btn = document.getElementById('btnwarranty');
                if (selected.length === 0) {
                    btn.querySelector('.ui-button-text').textContent = '维保质保';
                } else {
                    btn.querySelector('.ui-button-text').textContent = '维保质保 (' + selected.length + ')';
                }
            }
        </script>

        <style>
            .warrantyExpireSoon {
                background-color: #fca752!important;
                color: #000000!important;
            }
            .warrantyExpired {
                background-color: #f04134!important;
                color: #000000!important;
            }
            .riskLevelHigh {
                background-color: #f04134!important;
                color: #ffffff!important;
            }
            .riskLevelMedium {
                background-color: #fca752!important;
                color: #000000!important;
            }
            .btn+.btn { margin-left: 0 }
            .ui-column-resizer:before {content: none!important;}
            th{font-size: 12px!important;}
            td{font-size: 12px!important;padding: 0px!important;}
            table .ui-chkbox-icon, td img{ zoom: 0.7!important}
            .adv-col-field { width: 170px; }
            .adv-col-operator { width: 130px; }
            .adv-col-value { width: 190px; }
            .adv-col-value2 { width: 10px; }
            .adv-col-action { width: 40px; }
            #advancedSearchForm .ui-panelgrid td { padding: 2px 4px; vertical-align: middle; }
            .btn-blue { background-color: #337ab7!important; color: #fff!important; border-color: #2e6da4!important; }
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value=" #{assetInfoListController.terminate? msg.TerminateAssetInfo:msg.AssetInfo}"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="searchForm">
                    <h:panelGrid id="filterType" columns="4" style="float: right">
<!--                        <h:panelGroup>-->
<!--                            <p:selectOneMenu id="option" value="#{assetInfoListController.queryType}" widgetVar="masterEquipmentWidget" style="opacity:0; width:0; height:0; overflow:hidden; border:none;">-->
<!--                                <f:selectItem itemLabel="#{msg.All}" itemValue="1"/>-->
<!--                                <f:selectItem itemLabel="#{msg.ParentDevice}" itemValue="2"/>-->
<!--                                <f:selectItem itemLabel="#{msg.ChildDevice}" itemValue="3"/>-->
<!--                                <p:ajax listener="#{assetInfoListController.assetGroupChangeListener}" update="AssetInfoListForm" />-->
<!--                            </p:selectOneMenu>-->
<!--                            &lt;!&ndash; 自定义按钮：点击直接弹出下拉 &ndash;&gt;-->
<!--                            <p:commandButton value="主子设备"-->
<!--                                             type="button"-->
<!--                                             icon="fa fa-angle-down"-->
<!--                                             iconPos="right"-->
<!--                                             onclick="PF('masterEquipmentWidget').show(); return false;" rendered="#{assetInfoListController.showMasterEquipment}"/>-->
<!--                        </h:panelGroup>-->
                        <h:panelGroup>
                            <p:menuButton id="reportButton" value="主子设备" rendered="#{assetInfoListController.showMasterEquipment}">
                                <p:menuitem style="left: 15px" immediate="true" action="#{assetInfoListController.setQueryType(1)}" value="#{msg.All}" update="AssetInfoListForm"/>
                                <p:menuitem style="left: 15px" immediate="true" action="#{assetInfoListController.setQueryType(2)}" value="#{msg.ParentDevice}" update="AssetInfoListForm"/>
                                <p:menuitem style="left: 15px" immediate="true" action="#{assetInfoListController.setQueryType(3)}" value="#{msg.ChildDevice}" update="AssetInfoListForm"/>
                            </p:menuButton>
                        </h:panelGroup>
                        <h:panelGroup style="float: right"  rendered="#{assetInfoListController.showWarrantyAlert}">
                            <p:selectCheckboxMenu id="warrantyMenu"
                                                  widgetVar="warrantyMenuWidget"
                                                  value="#{assetInfoListController.warrantyStatus}"
                                                  label="维保质保"
                                                  updateLabel="true"
                                                  style="opacity:0; width:0; height:0; overflow:hidden; border:none;"
                                                  panelStyle="width:200px">
                                <f:selectItem itemLabel="维保临期" itemValue="1"/>
                                <f:selectItem itemLabel="维保逾期" itemValue="2"/>
                                <f:selectItem itemLabel="质保临期" itemValue="3"/>
                                <f:selectItem itemLabel="质保逾期" itemValue="4"/>
                                <p:ajax event="toggleSelect" update="AssetInfoListForm"/>
                                <p:ajax event="change" update="AssetInfoListForm"/>
                            </p:selectCheckboxMenu>

                            <!-- 自定义按钮：点击直接弹出下拉 -->
                            <p:commandButton id="btnwarranty"
                                         value="维保质保"
                                         type="button"
                                         icon="fa fa-angle-down"
                                         iconPos="right"
                                         onclick="PF('warrantyMenuWidget').show(); return false;" />
                        </h:panelGroup>
                    </h:panelGrid>

                    <h:panelGrid id="searchPanel" columns="3">
                        <h:panelGroup rendered="#{!userContextService.hasAnyRoleByApmRoles('MVSAdmin','MVSFE')}">
                            <p:commandButton id="btnOrg" value="院区" type="button" icon="fa fa-angle-down" iconPos="right"/>
                            <p:overlayPanel appendTo="searchForm" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false" >
                                <p:inputText id="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
                                <p:commandButton partialSubmit="true" icon="ui-icon-search" process=":searchForm:treeNodeNameFilter @this" update="searchForm:orgTree" actionListener="#{orgTreeController.filterTreeNodeByNameType4()}" value="#{msg.Search}"/>
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.siteClinicalDeptOrgTree}" selection="#{assetInfoListController.selectedAccessOrgNodes}" var="node" selectionMode="checkbox"     dynamic="false"  cache="false"   propagateSelectionUp="#{orgTreeController.propagateSelectionUp}"    >
                                        <p:ajax process="@this" event="select" listener="#{assetInfoListController.onSelectSiteTreeNode}" update=":AssetInfoListForm @(.dataTableFilterByHospital) " />
                                        <p:ajax process="@this" event="unselect" listener="#{assetInfoListController.onUnSelectSiteTreeNode}" update=":AssetInfoListForm @(.dataTableFilterByHospital)"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{userContextService.hasAnyRoleByApmRoles('MVSAdmin','MVSFE')}">
                            <p:commandButton id="btnTenant" value="院区" type="button" icon="fa fa-angle-down" iconPos="right" />
                            <p:overlayPanel appendTo="searchForm" widgetVar="varPanelTenant" for="btnTenant" hideEffect="fade" dynamic="false" modal="false" style="text-align: left;">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="tenantTree" class="tree" style="width:98%;border:0;" value="#{tenantTreeController.buildTenantTree(1)}" selection="#{assetInfoListController.selectedAccessOrgNodes}" var="node" selectionMode="checkbox"    dynamic="false"  cache="false" >
                                        <p:ajax process="@this" event="select" listener="#{assetInfoListController.onSelectSiteTreeNode}"  update=":AssetInfoListForm :searchForm" />
                                        <p:ajax process="@this" event="unselect" listener="#{assetInfoListController.onUnSelectSiteTreeNode}"  update=":AssetInfoListForm :searchForm" />

                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <p:inputText id="searchText" value="#{assetInfoListController.oneSearchStr}" placeholder="#{msg.name}/#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}/#{msg.manufacture}/#{msg.clinicalDeptName}/#{msg.assetTags}" maxlength="100" style="width: 500px">
                            <p:ajax event="keyup" update=":AssetInfoListForm #{assetInfoListController.isShowColumn('warrantyDate')?':AssetInfoListForm:idPanelFilterWarrantyDate':''} #{assetInfoListController.isShowColumn('clinicalDeptName')?'':''} searchButtons " />
                        </p:inputText>

                        <h:panelGroup id='searchButtons'>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm #{assetInfoListController.isShowColumn('warrantyDate')?':AssetInfoListForm:idPanelFilterWarrantyDate':''} #{assetInfoListController.isShowColumn('clinicalDeptName')?'':''}"  rendered="#{empty assetInfoListController.oneSearchStr}"/>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm #{assetInfoListController.isShowColumn('warrantyDate')?':AssetInfoListForm:idPanelFilterWarrantyDate':''} #{assetInfoListController.isShowColumn('clinicalDeptName')?'':''}" actionListener="#{assetInfoListController.setOneSearchStr('')}" rendered="#{not empty assetInfoListController.oneSearchStr}"/>
                            <p:commandButton value="高级查询" icon="fa fa-search-plus"
                                             style="zoom:0.8; margin-left: 5px;" class="btn btn-sm btn-blue">
                                <p:ajax listener="#{assetInfoListController.loadSavedSearches()}" process="@this" update=":advancedSearchForm" oncomplete="PF('advancedSearchDialog').show();"/>
                            </p:commandButton>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
                <h:form id="AssetInfoListForm">
                    <p:dataTable id="datalist" value="#{assetInfoListController.lazyModel}" var="item" widgetVar="varDataList" resizableColumns="true" liveResize="true" resizeMode="fit"
                                 selectionMode="single" scrollable="false" selection="#{assetInfoListController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowStyleClass="#{assetInfoListController.getRowStyleClass(item.warrantyAlertStatus, item.estimatedRiskLevel)}"
                                 rowKey="#{item.id}" sortMode="single"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.JumpTo} {JumpToPageDropdown} #{msg.Page} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rowIndexVar="idx"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax  event="rowSelect" listener="#{assetInfoListController.onSelectAsset}" onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)" update="createButton  deleteButton "/>
                        <p:ajax event="filter" listener="#{assetInfoListController.onFilter}" oncomplete="updateSelectAllCheckBox();"/>
                        <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                        <p:column width="36"  id="checkBoxColumn">
                            <p:selectBooleanCheckbox value="#{assetInfoListController.selectedMap[item.uid]}"  class="selectCheckBox">
                                <p:ajax process="@this" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header"  >
                                <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                    <p:ajax listener="#{assetInfoListController.onSelectAllOfPage}" update="@(.selectCheckBox) :AssetInfoListForm:datalist batchToRelRule" oncomplete="updateSelectAllCheckBox();"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.Actions}" exportable="false" width="60" id="operatorColumn">
                            <h:panelGroup rendered="#{empty assetInfoListController.filterWarrantyDate}">
                                <p:link target="_new" title="#{msg.Edit}" outcome="#{assetInfoListController.getEditPage(item.uid,item.name)}" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_INFO_EDIT') or userContextService.accessContainsFunctionMenu('ASSET_INFO_SINGLE_EDIT')}" >
                                    <p:graphicImage name="icons/edit.png" style="width: 30px; height: 30px;"/>
                                </p:link>
                                <p:commandLink rendered="#{userContextService.accessContainsFunctionMenu('ASSET_INFO_DELETE')}" id="deleteButton" title="#{msg.Delete}"  actionListener="#{assetInfoListController.deleteAsset(item)}" update="datalist">
                                    <p:graphicImage name="icons/delete.png" style="width: 30px; height: 30px;"/>
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandLink>
                                <p:link   target="_new1" title="复制" outcome="#{assetInfoListController.getCopyPage(item.uid,item.name)}" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_INFO_EDIT') and !userContextService.isEnableBtnByKey('enableDeviceReplication')}" >
                                    <p:graphicImage value="/images/icons/copyy.png" style="width: 30px; height: 30px;"/>
<!--                                        <p:graphicImage name="icons/copy.png" style="width: 30px; height: 30px;"/>-->
                                </p:link>
                            </h:panelGroup>
                            <p:commandButton id="cancleWarranty" style="zoom:0.65;" process="@this" title="#{msg.CancelWarrantyReminder}" actionListener="#{assetInfoListController.cancleWarranty(item.uid)}" update="datalist" rendered="#{!empty assetInfoListController.filterWarrantyDate and item.warranty}" icon="ui-icon-notifications-off">
                                <p:confirm header="#{msg.CancelWarrantyReminder}" message="#{msg.ConfirmToCancelTheEquipmentWarrantyReminder}" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </p:column>
                        <p:column  headerText="是否已配置保养规则" rendered="#{assetInfoListController.showIsPm()}" filterBy="#{item.isPm}" filterMatchMode="EQ">
                            <h:outputText value="#{assetInfoListController.getRelRuleStatusName(item.uid,item.isPm)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="handleAssetGroupChange()" value="#{assetInfoListController.isPmSearch}"  autoWidth="false" style="max-width: 300px;" height="300" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{assetInfoListController.getListForRelRule()}" var="item" itemLabel="#{item.valueZh}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <c:forEach items="#{assetInfoListController.customedColumns}" var="columnItem" >
                            <c:if test="#{columnItem eq 'name'}">
                                <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}" sortBy="#{item.namePyCode}" filterBy="#{item.name}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.name}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'functionType'}">
                                <p:column  headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.functionType}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'serialNum'}">
                                <p:column  headerText="#{msg.serialNum}" sortBy="#{item.serialNum}" filterBy="#{item.serialNum}" filterMatchMode="LIKE" >
                                    <h:outputText value="#{item.serialNum}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'departNum'}">
                                <p:column  headerText="#{msg.departNum}" sortBy="#{item.departNum}" filterBy="#{item.departNum}" filterMatchMode="LIKE" >
                                    <h:outputText value="#{item.departNum}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetGroup'}">
                                <p:column  headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                                    <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                                    <f:facet name="filter">
                                        <p:selectOneMenu onchange="handleAssetGroupChange()"  autoWidth="false" style="max-width: 150px;" height="300" value="#{assetInfoListController.assetGroup}">
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                            <p:ajax listener="#{assetInfoListController.assetGroupChangeListener}" update="@(.assetGroupChange)" />
                                        </p:selectOneMenu>
                                    </f:facet>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetClass'}">
                                <p:column  headerText="#{msg.assetClass}" sortBy="#{item.assetClass}" filterBy="#{item.assetClass}" filterMatchMode="EQ">
                                    <h:outputText value="#{fieldMsg.fieldValue('assetClass',item.assetClass)}"/>
                                    <f:facet name="filter">
                                        <p:selectOneMenu onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" height="300" value="#{assetInfoListController.assetClass}">
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetClass')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                            <p:ajax listener="#{assetInfoListController.assetClassChangeListener}" update="@(.assetGroupChange)" />
                                        </p:selectOneMenu>
                                    </f:facet>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetGroupSecondary'}">
                                <p:column  headerText="#{msg.assetGroupSecondary}" sortBy="#{item.assetGroupSecondary}" filterBy="#{item.assetGroupSecondary}" filterMatchMode="EQ">
                                    <h:outputText value="#{fieldMsg.fieldValue('assetGroupSecondary_'.concat(item.assetGroup), item.assetGroupSecondary)}"/>

                                    <f:facet name="filter">
                                        <p:selectOneMenu id="assetGroupSeconday" onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" height="300" class="assetGroupChange" value="#{assetInfoListController.assetGroupSecondary}">
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{assetInfoListController.assetGroupSecondayList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                            <p:ajax listener="#{assetInfoListController.assetGroupSecondaryChangeListener}"/>
                                        </p:selectOneMenu>
                                    </f:facet>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetDeptName'}">
                                <p:column headerText="#{msg.assetDeptName}">
                                    <f:facet name="header">
                                        <h:outputText value="#{msg.assetDeptName}"/><br/>
                                        <p:autoComplete dropdown="true" value="#{assetInfoListController.filterAssetDeptOrg}" appendTo="@(Body)"
                                                        scrollHeight="300"  forceSelection="true" completeMethod="#{assetInfoListController.autoCompleteDeptName}" size="5">
                                            <p:ajax event="itemSelect" listener="#{assetInfoListController.onAssetDeptNameFilterChange}" process="@this"  update=":AssetInfoListForm:datalist  :AssetInfoListForm:idPanelFilterWarrantyDate" oncomplete="afterLoadRender()"/>
                                            <p:ajax process="@this" listener="#{assetInfoListController.onAssetDeptNameFilterChange}" update=":AssetInfoListForm:datalist  :AssetInfoListForm:idPanelFilterWarrantyDate" oncomplete="afterLoadRender()"/>
                                        </p:autoComplete>
                                    </f:facet>
                                    <h:outputText value="#{item.assetDeptOrg.shortName}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'clinicalDeptName'}">
                                <p:column headerText="#{msg.clinicalDeptName}" sortBy="#{item.clinicalDeptName}">
                                    <f:facet name="header">
                                        <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                                        <p:autoComplete dropdown="true" value="#{assetInfoListController.filterClinicalDeptOrg}" appendTo="@(Body)"
                                                        scrollHeight="300"  forceSelection="true" completeMethod="#{assetInfoListController.autoCompleteDeptName}" size="5">
                                            <p:ajax event="itemSelect" listener="#{assetInfoListController.onClinicalDeptNameFilterChange}" process="@this"  update=":AssetInfoListForm:datalist  :AssetInfoListForm:idPanelFilterWarrantyDate" oncomplete="afterLoadRender()" />
                                            <p:ajax process="@this" listener="#{assetInfoListController.onClinicalDeptNameFilterChange}" update=":AssetInfoListForm:datalist  :AssetInfoListForm:idPanelFilterWarrantyDate"  oncomplete="afterLoadRender()"/>
                                        </p:autoComplete>
<!--                                        <p:selectCheckboxMenu-->
<!--                                                value="#{assetInfoListController.selectDeptList}">-->
<!--                                            <f:selectItems value="#{assetInfoListController.autoCompleteDeptName(null)}"/>-->
<!--                                            <p:ajax process="@this" listener="#{assetInfoListController.onClinicalDeptNameFilterChange2()}" update=":AssetInfoListForm:datalist  :AssetInfoListForm:idPanelFilterWarrantyDate"  oncomplete="afterLoadRender()"/>-->
<!--                                        </p:selectCheckboxMenu>-->
                                    </f:facet>
                                    <h:outputText value="#{item.clinicalDeptOrg.shortName}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetTypeGroup'}">
                                <p:column headerText="#{msg.assetTypeGroup}" width="100" exportable="true">
                                    <f:facet name="header">
                                        <h:outputText value="#{msg.assetTypeGroup}"/><br/>
                                        <p:autoComplete dropdown="true" value="#{assetInfoListController.filterAssetTypeGroup}" appendTo="@(Body)"
                                                        scrollHeight="300"  forceSelection="true" completeMethod="#{assetInfoListController.autoCompleteAssetTypeGroupName}" size="5">
                                            <p:ajax event="itemSelect" listener="#{assetInfoListController.onAssetTypeGroupNameFilterChange}" process="@this"  update=":AssetInfoListForm:datalist  :AssetInfoListForm:idPanelFilterWarrantyDate"/>
                                            <p:ajax process="@this" listener="#{assetInfoListController.onAssetTypeGroupNameFilterChange}" update=":AssetInfoListForm:datalist  :AssetInfoListForm:idPanelFilterWarrantyDate" />
                                        </p:autoComplete>
                                    </f:facet>
                                    <h:outputText value="#{assetInfoListController.convertAssetTypeGroupEncodedToName(item.assetType)}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'lastInventoryDate'}">
                                <p:column  headerText="#{msg.lastInventoryDate}" sortBy="#{item.lastInventoryDate}" filterBy="#{item.lastInventoryDate}" filterMatchMode="GTE">
                                    <f:facet name="filter">
                                        <p:inputText id="filterLastInventoryDate" widgetVar="varFilterLastInventoryDate" value="#{assetInfoListController.lastInventoryDateFormatTime}"/>
                                    </f:facet>
                                    <h:outputText value="#{item.lastInventoryDate}">
                                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                                    </h:outputText>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'assetClassification32'}">
                                <p:column headerText="#{msg.assetClassification32}" sortBy="#{item.assetClassification32}" filterBy="#{item.assetClassification32}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.assetClassification32}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'nationalStandardCode'}">
                                <p:column headerText="#{msg.nationalStandardCode}"  >
                                    <h:outputText value="#{item.nationalStandardCode}"/>
                                </p:column>
                            </c:if>
                            <c:if test="#{columnItem eq 'manufacture'}">
                                <p:column headerText="#{msg.manufacture}" sortBy="#{item.manufacture}" filterBy="#{item.manufacture}" filterMatchMode="LIKE">
                                    <h:outputText value="#{item.manufacture}"/>
                                </p:column>
                            </c:if>

        <ui:include src="AssetDepartmentConvert.xhtml"/>
        <p:dialog id="exportQrCodeDialog" widgetVar="exportQrCodeDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.ExportQRCode}">
            <h:form id="exportQrCodeForm" >
                <h:panelGroup id="display" >
                    <label class="label">#{msg.SelectExportTemplate}</label>
                    <p:selectOneMenu  value="#{assetInfoListController.exportQrCodeTemplateId}">
                        <p:ajax update="preview" />
                        <f:selectItem itemLabel="#{msg.TemplateUsedbyDefault}" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{assetInfoListController.getQrCodeTemplates()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                    </p:selectOneMenu>
                    <h:panelGrid columns="1" style="width:100%" id="preview">
                        <h:panelGroup rendered="#{not empty assetInfoListController.exportQrCodeTemplateId}">
                            <img src="#{qrCodeShowController.getQrCodeImageWithTemplate('8888888888888888',assetInfoListController.exportQrCodeTemplateId,'')}" />
                        </h:panelGroup>
                    </h:panelGrid>
                </h:panelGroup>
                <p:commandButton id="exportButton" value="#{msg.exportQrCode}" actionListener="#{assetInfoListController.exportQrCode}" update=":growl"
                                 onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false">
                    <p:fileDownload value="#{assetInfoListController.zipFile}" />
                </p:commandButton>
                <p:commandButton  immediate="true" value="#{msg.Close}" icon="ui-icon-cancel" onclick="PF('exportQrCodeDialog').hide()" />
            </h:form>
        </p:dialog>

        <c:if test="#{assetInfoListController.isShowColumn('siteUID')}">
            <h:form id="dataTableFilterByHospital">
            <p:overlayPanel appendTo="dataTableFilterByHospital" widgetVar="varPanelOrg2" hideEffect="fade" dynamic="false" modal="false" class="dataTableFilterByHospital">
                    <p:inputText id="treeNodeNameFilter2" value="#{orgTreeController.treeNodeNameFilter}"/>
                    <p:commandButton partialSubmit="true" icon="ui-icon-search" process="dataTableFilterByHospital:treeNodeNameFilter2 @this" update="dataTableFilterByHospital:orgTree2" actionListener="#{orgTreeController.filterTreeNodeByName()}" value="检索"/>
                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                        <p:tree id="orgTree2" class="tree" style="width:98%;border:0;" value="#{orgTreeController.siteOrgTree}" selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
                            <p:ajax process="@this" event="select" listener="#{assetInfoListController.onSelectSiteTreeNode2}" update=":AssetInfoListForm:datalist :searchForm :dataTableFilterByHospital" oncomplete="PF('varPanelOrg2').hide(); afterLoadRender()"/>
                            <p:ajax process="@this" event="expand"/>
                            <p:ajax process="@this" event="collapse"/>
                            <p:treeNode type="org">
                                <h:outputText value="#{node.name}"/>
                            </p:treeNode>
                            <p:treeNode type="hidden" rendered="false"/>
                        </p:tree>
                    </p:scrollPanel>
                </p:overlayPanel>
            </h:form>
        </c:if>
        <p:dialog id="advancedSearchDialog" widgetVar="advancedSearchDialog" header="高级查询" modal="true"
                  width="900" height="600" resizable="true" draggable="true" appendTo="@(body)"
                  closeOnEscape="true" dynamic="false">
            <h:form id="advancedSearchForm">
                <div style="margin-bottom: 10px;">
                    <p:commandButton value="添加条件" icon="ui-icon-plus"
                                     actionListener="#{assetInfoListController.addAdvancedCondition()}"
                                     update=":advancedSearchForm:conditionPanel"
                                     process="@this"/>
                    <p:commandButton value="清空条件" icon="ui-icon-trash"
                                     actionListener="#{assetInfoListController.clearAdvancedConditions()}"
                                     update=":advancedSearchForm:conditionPanel"
                                     process="@this" style="margin-left: 5px;"/>
                    <span style="margin-left: 20px; border-left: 1px solid #ccc; padding-left: 15px;">
                        <p:inputText id="savedSearchName" value="#{assetInfoListController.newSavedSearchName}"
                                     placeholder="输入收藏名称" style="width: 150px;" maxlength="50"/>
                        <p:commandButton value="收藏查询" icon="ui-icon-star"
                                         actionListener="#{assetInfoListController.saveCurrentSearch()}"
                                         update=":advancedSearchForm :growl"
                                         process="@this :advancedSearchForm:savedSearchName"
                                         style="margin-left: 5px;" styleClass="btn btn-sm btn-yellow"/>
                        <p:commandButton value="我的收藏" icon="ui-icon-bookmark"
                                         actionListener="#{assetInfoListController.loadSavedSearches()}"
                                         update=":savedSearchListForm:savedSearchPanel"
                                         process="@this"
                                         oncomplete="PF('savedSearchListDialog').show();"
                                         style="margin-left: 5px;" styleClass="btn btn-sm btn-green"/>
                    </span>
                </div>
                <p:scrollPanel style="height: 380px; border: 0;" mode="native">
                    <h:panelGroup id="conditionPanel">
                        <ui:repeat value="#{assetInfoListController.advancedConditions}" var="condition" varStatus="status">
                            <h:panelGrid columns="5" style="margin-bottom: 8px; width: 100%;" columnClasses="adv-col-field,adv-col-operator,adv-col-value,adv-col-value2,adv-col-action">
                                <p:selectOneMenu value="#{condition.fieldName}" style="width: 160px;"
                                                 filter="true" filterMatchMode="contains">
                                    <f:selectItem itemLabel="-- 选择字段 --" itemValue="" noSelectionOption="true"/>
                                    <f:selectItems value="#{assetInfoListController.advancedSearchFieldOptions}"
                                                   var="field" itemLabel="#{field.label}" itemValue="#{field.value}"/>
                                    <p:ajax update=":advancedSearchForm:conditionPanel" process="@this"
                                            listener="#{assetInfoListController.onFieldChange(condition)}"/>
                                </p:selectOneMenu>

                                <p:selectOneMenu value="#{condition.operator}" style="width: 120px;">
                                    <f:selectItems value="#{assetInfoListController.getOperatorsForField(condition.fieldName)}"
                                                   var="op" itemLabel="#{op.label}" itemValue="#{op.value}"/>
                                    <p:ajax update=":advancedSearchForm:conditionPanel" process="@this"
                                            listener="#{assetInfoListController.onOperatorChange(condition)}"/>
                                </p:selectOneMenu>

                                <h:panelGroup rendered="#{condition.operator ne 'IsNull' and condition.operator ne 'IsNotNull' and condition.operator ne 'BETWEEN'}">
                                    <p:inputText value="#{condition.value}" style="width: 180px;"
                                                 rendered="#{assetInfoListController.getFieldType(condition.fieldName) eq 'string'}"
                                                 placeholder="输入搜索内容"/>
                                    <p:inputText value="#{condition.value}" style="width: 180px;"
                                                 rendered="#{assetInfoListController.getFieldType(condition.fieldName) eq 'number'}"
                                                 placeholder="输入数字"/>
                                    <p:calendar value="#{condition.dateValue}" style="width: 180px;"
                                                pattern="yyyy-MM-dd" showOn="button"
                                                rendered="#{assetInfoListController.getFieldType(condition.fieldName) eq 'date'}"
                                                placeholder="选择日期"/>
                                    <p:selectOneMenu value="#{condition.value}" style="width: 180px;"
                                                     rendered="#{assetInfoListController.getFieldType(condition.fieldName) eq 'boolean'}">
                                        <f:selectItem itemLabel="-- 选择 --" itemValue="" noSelectionOption="true"/>
                                        <f:selectItem itemLabel="是" itemValue="true"/>
                                        <f:selectItem itemLabel="否" itemValue="false"/>
                                    </p:selectOneMenu>
                                    <p:selectOneMenu value="#{condition.value}" style="width: 180px;"
                                                     filter="true" filterMatchMode="contains"
                                                     rendered="#{assetInfoListController.getFieldType(condition.fieldName) eq 'enum'}">
                                        <f:selectItem itemLabel="-- 选择 --" itemValue="" noSelectionOption="true"/>
                                        <f:selectItems value="#{assetInfoListController.getEnumOptionsForField(condition.fieldName)}"
                                                       var="enumOpt" itemLabel="#{enumOpt.label}" itemValue="#{enumOpt.value}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{condition.operator eq 'BETWEEN'}">
                                    <h:panelGrid columns="3" style="width: 180px;">
                                        <p:inputText value="#{condition.value}" style="width: 75px;" placeholder="起始值"
                                                     rendered="#{assetInfoListController.getFieldType(condition.fieldName) ne 'date'}"/>
                                        <p:calendar value="#{condition.dateValue}" style="width: 75px;"
                                                    pattern="yyyy-MM-dd" showOn="button"
                                                    rendered="#{assetInfoListController.getFieldType(condition.fieldName) eq 'date'}"/>
                                        <h:outputText value=" ~ " style="text-align:center;"/>
                                        <p:inputText value="#{condition.value2}" style="width: 75px;" placeholder="结束值"
                                                     rendered="#{assetInfoListController.getFieldType(condition.fieldName) ne 'date'}"/>
                                        <p:calendar value="#{condition.dateValue2}" style="width: 75px;"
                                                    pattern="yyyy-MM-dd" showOn="button"
                                                    rendered="#{assetInfoListController.getFieldType(condition.fieldName) eq 'date'}"/>
                                    </h:panelGrid>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{condition.operator eq 'IsNull' or condition.operator eq 'IsNotNull'}">
                                    <h:outputText value="(无需输入)" style="color: #999; font-style: italic;"/>
                                </h:panelGroup>

                                <h:outputText value="" rendered="#{condition.operator ne 'BETWEEN' and condition.operator ne 'IsNull' and condition.operator ne 'IsNotNull'}"/>
                                <h:outputText value="" rendered="#{condition.operator eq 'BETWEEN'}"/>
                                <h:outputText value="" rendered="#{condition.operator eq 'IsNull' or condition.operator eq 'IsNotNull'}"/>

                                <p:commandButton icon="ui-icon-minus" title="删除此条件"
                                                 actionListener="#{assetInfoListController.removeAdvancedCondition(status.index)}"
                                                 update=":advancedSearchForm:conditionPanel"
                                                 process="@this" style="zoom: 0.8;"/>
                            </h:panelGrid>
                        </ui:repeat>
                        <h:outputText value="暂无查询条件，请点击【添加条件】按钮添加"
                        rendered="#{empty assetInfoListController.advancedConditions}"
                        style="color: #999; font-style: italic; display: block; text-align: center; margin-top: 20px;"/>
                    </h:panelGroup>
                </p:scrollPanel>
                <div style="margin-top: 10px; text-align: right;">
                    <p:commandButton value="查询" icon="ui-icon-search" class="btn btn-sm btn-primary"
                                     actionListener="#{assetInfoListController.applyAdvancedSearch()}"
                                     update=":AssetInfoListForm :growl"
                                     process="@form"
                                     oncomplete="PF('advancedSearchDialog').hide()"/>
                    <p:commandButton value="取消" icon="ui-icon-close" class="btn btn-sm btn-gray"
                                     onclick="PF('advancedSearchDialog').hide()" type="button"                                     style="margin-left: 5px;"/>
                </div>
            </h:form>
        </p:dialog>

        <!-- 收藏查询列表对话框 -->
        <p:dialog id="savedSearchListDialog" widgetVar="savedSearchListDialog" header="我的收藏查询" modal="true"
                  width="600" height="400" resizable="true" draggable="true" appendTo="@(body)"
                  closeOnEscape="true" dynamic="false">
            <h:form id="savedSearchListForm">
                <p:commandButton value="刷新" icon="ui-icon-refresh"
                                 actionListener="#{assetInfoListController.loadSavedSearches()}"
                                 update=":savedSearchListForm:savedSearchPanel"
                                 process="@this" style="margin-bottom: 10px;"/>
                <p:scrollPanel style="height: 300px; border: 0;" mode="native">
                    <h:panelGroup id="savedSearchPanel">
                        <ui:repeat value="#{assetInfoListController.savedSearches}" var="savedSearch" varStatus="status">
                            <h:panelGroup layout="block" style="padding: 8px; margin-bottom: 5px; border: 1px solid #ddd; border-radius: 4px; background: #f9f9f9;">
                                <h:panelGrid columns="3" style="width: 100%;" columnClasses="saved-name,saved-actions">
                                    <h:outputText value="#{savedSearch.name}" style="font-weight: bold; font-size: 14px;"/>
                                    <h:panelGroup>
                                        <p:commandButton value="加载" icon="ui-icon-arrowreturnthick-1-w"
                                                         actionListener="#{assetInfoListController.loadSavedSearch(savedSearch)}"
                                                         update=":advancedSearchForm:conditionPanel :growl"
                                                         process="@this"
                                                         oncomplete="PF('savedSearchListDialog').hide(); PF('advancedSearchDialog').show();"
                                                         style="zoom: 0.85; margin-right: 5px;" styleClass="btn btn-sm btn-blue"/>
                                        <p:commandButton value="删除" icon="ui-icon-trash"
                                                         actionListener="#{assetInfoListController.deleteSavedSearch(savedSearch)}"
                                                         update=":savedSearchListForm:savedSearchPanel :growl"
                                                         process="@this" style="zoom: 0.85;" styleClass="btn btn-sm btn-red">
                                            <p:confirm header="确认删除" message="确定要删除该收藏查询吗？" icon="ui-icon-warning"/>
                                        </p:commandButton>
                                    </h:panelGroup>
                                    <h:outputText value=""/>
                                </h:panelGrid>
                            </h:panelGroup>
                        </ui:repeat>
                        <h:outputText value="暂无收藏的查询条件"
                                      rendered="#{empty assetInfoListController.savedSearches}"
                                      style="color: #999; font-style: italic; display: block; text-align: center; margin-top: 20px;"/>
                    </h:panelGroup>
                </p:scrollPanel>
                <div style="margin-top: 10px; text-align: right;">
                    <p:commandButton value="关闭" icon="ui-icon-close" class="btn btn-sm btn-gray"
                                     onclick="PF('savedSearchListDialog').hide()" type="button"/>
                </div>
            </h:form>
        </p:dialog>

        <script>

            function afterLoadRender(){
                $(".ui-datatable-tablewrapper").css('width', '100%');
                $("div table")[1].style.overflowX= "scroll";
                $("div table")[1].style.width = "auto";
                $("html")[0].style.overflowX= "hidden";
            }

            $(function () {
                $(".ui-datatable-tablewrapper").css('width', '100%');
                $("div table")[1].style.overflowX= "scroll";
                $("div table")[1].style.width = "auto";
                $("html")[0].style.overflowX= "hidden";
            });

            //<![CDATA[
            afterPageLoad = function () {
                $("#searchForm\\:searchText").keypress(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                    }
                })
                var isActive = "#{userContextService.isActive()}";
                if (isActive == '1') {
                    PF('ActiveDlg').show();
                }
            }
            var newWin;
            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }

            function changeDiaLog() {
                PF('relRuleAssetDialog').hide();
                PF('redirectDialog').show();
            }

            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#AssetInfoListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
            //]]>
        </script>
    </ui:define>
</ui:composition>
