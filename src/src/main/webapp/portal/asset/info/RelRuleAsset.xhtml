<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="relRuleAssetDialog" widgetVar="relRuleAssetDialog" modal="true" resizable="true" draggable="true" width="30%" height="200px" header="#{msg.BatchConfigMaintenanceRule}">
        <h:form id="BatchCreateForm" class="bcls">

            <p:commandButton id ="hidden1" value="hello1" style="display:none"/>
            <p:panelGrid id ="PmOrderRule" columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">#{msg.SecondLevel.concat(msg.PmOrderRule)}*</label>
                    <p:autoComplete id="SelectedPmOrderRuleTwoLevel" value="#{relRuleAssetController.pmOrderRuleTwoLevel}" dropdown="true" scrollHeight="300"
                                    forceSelection="true" completeMethod="#{relRuleAssetController.geLevelTwoRuleList}"
                                    var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="pmOrderRuleConverter">
                        <p:ajax process="@this" event="itemSelect" listener="#{relRuleAssetController.setRuleId()}"/>
                        <p:ajax process="@this" listener="#{relRuleAssetController.setRuleId()}"/>
                    </p:autoComplete>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.ThirdLevel.concat(msg.PmOrderRule)}*</label>
                    <p:autoComplete id="SelectedPmOrderRuleThreeLevel" value="#{relRuleAssetController.pmOrderRuleThreeLevel}" dropdown="true" scrollHeight="300"
                                    forceSelection="true" completeMethod="#{relRuleAssetController.getLevelThreeRuleList}"
                                    var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="pmOrderRuleConverter">
                        <p:ajax process="@this" event="itemSelect" listener="#{relRuleAssetController.setRuleId()}"/>
                        <p:ajax process="@this" listener="#{relRuleAssetController.setRuleId()}"/>
                    </p:autoComplete>
                </h:panelGroup>
            </p:panelGrid>
            <br/> <br/>
            <h:panelGroup>
                <p:commandButton validateClient="true" oncomplete="changeDiaLog()" actionListener="#{relRuleAssetController.saveRelFromAssetList()}" value="#{msg.Save}" icon="ui-icon-check" update=":growl" />
                <p:commandButton id="returnButton" value="#{msg.Return}" icon="ui-icon-arrow-back" onclick="PF('relRuleAssetDialog').hide()" immediate="true" />
            </h:panelGroup>
            <br/>
        </h:form>
    </p:dialog>

    <p:dialog id="redirectDialog" widgetVar="redirectDialog" modal="true" resizable="true" draggable="true" width="20%" height="100px" header="#{msg.RedirectToRuleManagement}">
        <h:form id="redirectForm" class="bcls">
            <h:panelGroup>
                <p:commandButton validateClient="true" action="/portal/pm/relRuleAsset/List.xhtml?faces-redirect=true" value="#{msg.Yes}" icon="ui-icon-check" update=":growl" />
                <p:commandButton id="returnButtonTwo" action="/portal/asset/info/AssetList.xhtml?faces-redirect=true" value="#{msg.No}" icon="ui-icon-arrow-back" onclick="PF('redirectDialog').hide()" immediate="true" />
            </h:panelGroup>
            <br/>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
