    <h:form id="CreateSpecialAssetForm">
        <p:fieldset legend="特种设备状态" style="margin-bottom:20px">
           
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">放射诊疗许可证目录内是否登记</label>
                        <p:selectOneRadio value="#{assetInfoDetailController.specialAssetInfo.radiotherapyIsRegistration}"
                                          requiredMessage="#{msg.radiotherapyIsRegistration} #{msg.ValidationRequire}" disabled="true">
                            <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                            <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                        </p:selectOneRadio>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">预评/控评情况<span
                                style="color:red"></span></label>
                        <h:outputText id="assessmentSituation"
                                     value="#{assetInfoDetailController.specialAssetInfo.assessmentSituation}"
                                     requiredMessage="#{msg.assessmentSituation} #{msg.ValidationRequire}"
                        >
                        </h:outputText>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">预评批号<span
                                style="color:red"></span></label>
                        <h:outputText id="assessmentNo" value="#{assetInfoDetailController.specialAssetInfo.assessmentNo}"
                                     requiredMessage="#{msg.assessmentNo} #{msg.ValidationRequire}"
                        >
                            <!--                        <p:ajax event="blur" listener="#{assetInfoDetailController.checkAssessmentNoExists}"/>-->
                        </h:outputText>
                    </h:panelGroup>


                    <h:panelGroup>
                        <label class="label">预评文件时间<span style="color:red"></span></label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                    locale="#{userContextService.getCalendarLocale()}"
                                    pattern="#{userContextService.timeFormat()}"
                                    value="#{assetInfoDetailController.specialAssetInfo.assessmentFileDate}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true"
                                    mask="true" requiredMessage="#{msg.assessmentFileDate} #{msg.ValidationRequire}" disabled="true"/>
                    </h:panelGroup>


                    <h:panelGroup>
                        <label class="label">预评批号<span
                                style="color:red"></span></label>
                        <h:outputText id="andAssessmentNo"
                                     value="#{assetInfoDetailController.specialAssetInfo.andAssessmentNo}"
                                     requiredMessage="#{msg.andAssessmentNo} #{msg.ValidationRequire}"
                        >
                            <!--                        <p:ajax event="blur" listener="#{assetInfoDetailController.checkAssessmentNoExists}"/>-->
                        </h:outputText>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">控评批复时间 <span style="color:red"></span></label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                    locale="#{userContextService.getCalendarLocale()}"
                                    pattern="#{userContextService.timeFormat()}"
                                    value="#{assetInfoDetailController.specialAssetInfo.andAssessmentApprovalDate}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true"
                                    mask="true" requiredMessage="#{msg.assessmentFileDate} #{msg.ValidationRequire}" disabled="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">辐射安全许可证目录内是否登记</label>
                        <p:selectOneRadio value="#{assetInfoDetailController.specialAssetInfo.radiationSafetyIsRegistration}"
                                          requiredMessage="#{msg.radiationSafetyIsRegistration} #{msg.ValidationRequire}" disabled="true">
                            <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                            <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                        </p:selectOneRadio>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">院内公示、核技术网公示是否完成</label>
                        <p:selectOneRadio value="#{assetInfoDetailController.specialAssetInfo.coreTechnologyFinish}"
                                          requiredMessage="#{msg.coreTechnologyFinish} #{msg.ValidationRequire}" disabled="true">
                            <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                            <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                        </p:selectOneRadio>
                    </h:panelGroup>


                </p:panelGrid>

           


        </p:fieldset>


        <p:fieldset legend="其他信息" style="margin-bottom:20px">
            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                <h:panelGroup>
                    <label class="label">特种设备类别</label>
                    <p:selectOneMenu id="assetUsage"
                                     value="#{assetInfoDetailController.specialAssetInfo.specialAssetType}"
                                     requiredMessage="#{msg.specialAssetType} #{msg.ValidationRequire}" disabled="true">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItem itemLabel="特种设备类别1" itemValue="特种设备类别1"/>
                        <f:selectItem itemLabel="特种设备类别2" itemValue="特种设备类别2"/>
                        <f:selectItem itemLabel="特种设备类别3" itemValue="特种设备类别3"/>
                        <f:selectItem itemLabel="特种设备类别4" itemValue="特种设备类别4"/>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">设备管理组别</label>
                    <p:selectOneMenu id="assetManagementType"
                                     value="#{assetInfoDetailController.specialAssetInfo.assetManagementType}"
                                     requiredMessage="#{msg.assetManagementType} #{msg.ValidationRequire}" disabled="true">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItem itemLabel="设备管理组别1" itemValue="设备管理组别1"/>
                        <f:selectItem itemLabel="设备管理组别2" itemValue="设备管理组别2"/>
                        <f:selectItem itemLabel="设备管理组别3" itemValue="设备管理组别3"/>
                        <f:selectItem itemLabel="设备管理组别4" itemValue="设备管理组别4"/>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">设备类型用途<span
                            style="color:red"></span></label>
                    <h:outputText id="assetTypePurpose"
                                 value="#{assetInfoDetailController.specialAssetInfo.assetTypePurpose}"
                                 requiredMessage="#{msg.assetTypePurpose} #{msg.ValidationRequire}"
                    >
                    </h:outputText>
                </h:panelGroup>


                <h:panelGroup>
                    <label class="label">办证情况<span
                            style="color:red"></span></label>
                    <h:outputText id="registrationSituation"
                                 value="#{assetInfoDetailController.specialAssetInfo.registrationSituation}"
                                 requiredMessage="#{msg.registrationSituation} #{msg.ValidationRequire}"
                    >
                    </h:outputText>
                </h:panelGroup>


                <h:panelGroup>
                    <label class="label">铅衣配备情况<span
                            style="color:red"></span></label>
                    <h:outputText id="leadApronEquipment"
                                 value="#{assetInfoDetailController.specialAssetInfo.leadApronEquipment}"
                                 requiredMessage="#{msg.leadApronEquipment} #{msg.ValidationRequire}"
                    >
                    </h:outputText>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">铅衣位置情况<span
                            style="color:red"></span></label>
                    <h:outputText id="leadApronPosition"
                                 value="#{assetInfoDetailController.specialAssetInfo.leadApronPosition}"
                                 requiredMessage="#{msg.LeadApronPosition} #{msg.ValidationRequire}"
                    >
                    </h:outputText>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">备注<span
                            style="color:red"></span></label>
                    <h:outputText id="remarks" value="#{assetInfoDetailController.specialAssetInfo.remarks}"
                                 requiredMessage="#{msg.remarks} #{msg.ValidationRequire}"
                    >
                    </h:outputText>
                </h:panelGroup>


            </p:panelGrid>

        </p:fieldset>
        <p:fieldset legend="年检报告管理" style="margin-bottom:20px">
            <p:dataTable id="reportInfoList"
                         value="#{assetInfoDetailController.specialAssetInfo.assetAnnualInspectionReports}" var="item"
                         lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                         emptyMessage="#{msg.noRecordFound}">

                <p:column headerText="报告名称">
                    <h:outputText value="#{item.name}"/>
                </p:column>
                <p:column headerText="报告类型">
                    <h:outputText value="#{item.reportType}"/>
                </p:column>
                <p:column headerText="检测单位">
                    <h:outputText value="#{item.testingUnit}"/>
                </p:column>
                <p:column headerText="检测结果">
                    <h:outputText value="#{item.testResults}"/>
                </p:column>
                <p:column headerText="报告发证单位">
                    <h:outputText value="#{item.certificateIssuingUnit}"/>
                </p:column>
                <p:column headerText="报告生效时间">
                    <h:outputText value="#{item.effectiveTime}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                    </h:outputText>
                </p:column>
                <p:column headerText="报告到期时间">
                    <h:outputText value="#{item.expiryDate}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                    </h:outputText>
                </p:column>
                <p:column headerText="上传人">
                    <h:outputText value="#{item.createdByName}"/>
                </p:column>

            <p:dataList id="reportattachmentList" value="#{assetInfoDetailController.specialAssetInfo.assetAnnualInspectionReports}" var="report" type="definition" emptyMessage="#{msg.noRecordFound}">

        </p:fieldset>
        <p:fieldset legend="证件信息" style="margin-bottom:20px">
            <p:dataTable id="permitInfoList"
