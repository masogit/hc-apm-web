<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >

        <h:panelGroup>
            <label class="label">#{msg.mvsDeviceType}</label>
            <p:inputText id="mvsDeviceType" value="#{assetInfoDetailController.mvsAssetInfo.deviceType}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.mvsAssetGroup}</label>
            <p:inputText id="mvsAssetGroup" value="#{assetInfoDetailController.mvsAssetInfo.mvsType}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.name}</label>
            <p:inputText id="mvs_name" value="#{assetInfoDetailController.mvsAssetInfo.name}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.aliasName}</label>
            <p:inputText id="mvs_aliasName" value="#{assetInfoDetailController.mvsAssetInfo.aliasName}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.hospitalId}</label>
            <p:inputText id="mvs_siteName" value="#{assetInfoDetailController.mvsAssetInfo.siteName}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.clinicalDeptName}</label>
            <p:inputText id="mvs_clinicalDeptName" value="#{assetInfoDetailController.mvsAssetInfo.clinicalDeptName}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.manufacture}</label>
            <p:inputText id="mvs_manufacture" value="#{assetInfoDetailController.mvsAssetInfo.manufacture}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.makerShortName}</label>
            <p:inputText id="mvs_makerShortName" value="#{assetInfoDetailController.mvsAssetInfo.makerShortName}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.assetGroup}</label>
            <p:inputText id="mvs_assetGroup" value="#{assetInfoDetailController.mvsAssetInfo.assetGroup}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.repairForm}</label>
            <p:inputText id="mvs_repairForm" value="#{assetInfoDetailController.mvsAssetInfo.repairForm}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.functionType}</label>
            <p:inputText id="mvs_functionType" value="#{assetInfoDetailController.mvsAssetInfo.functionType}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.serialNum}</label>
            <p:inputText id="mvs_serialNum" value="#{assetInfoDetailController.mvsAssetInfo.serialNum}" readonly="true" />
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.systemId}</label>
            <p:inputText id="mvs_systemId" value="#{assetInfoDetailController.mvsAssetInfo.systemId}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.financingNum}</label>
            <p:inputText id="mvs_financingNum" value="#{assetInfoDetailController.mvsAssetInfo.financingNum}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.factoryWarrantyDate}</label>
            <p:inputText id="mvs_factoryWarrantyDate" value="#{assetInfoDetailController.mvsAssetInfo.factoryWarrantyDate}" readonly="true">
                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
            </p:inputText>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.warrantyDate}</label>
            <p:inputText id="mvs_warrantyDate" value="#{assetInfoDetailController.mvsAssetInfo.warrantyDate}" readonly="true">
                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
            </p:inputText>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.QRCode}</label>
            <p:inputText id="mvs_QRCode" value="#{assetInfoDetailController.mvsAssetInfo.qrCode}" readonly="true"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.comments}</label>
            <p:inputText id="mvs_comments" value="#{assetInfoDetailController.mvsAssetInfo.comments}" readonly="true"/>
        </h:panelGroup>

    </p:panelGrid>

</ui:composition>
