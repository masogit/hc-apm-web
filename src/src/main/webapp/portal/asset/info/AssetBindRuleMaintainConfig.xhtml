<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


<ui:composition>
	<p:dialog id="maintainConfigEditDlg" widgetVar="maintainConfigEditDialog" header="日常检查查看" height="600" width="1150" appendTo="@(body)" maximizable="true">
		<h:form id="maintainConfigEditForm">
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">名称*</label>
					<p:outputLabel value="#{assetBindRuleController.selectedNurseSiteMaintainConfig.name}" />
				</h:panelGroup>
			</p:panelGrid>
			<p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">增加检查项*</label>
					<p:dataTable id="addCheckItem2" value="#{assetBindRuleController.listCheckItems}" var="item" widgetVar="addCheckItem2" lazy="false" paginator="true"
					    selectionMode="single" paginatorTemplate="{Toolbar}"  paginatorPosition="top" paginatorAlwaysVisible="true"
						rowKey="#{item.key}" rows="1000" emptyMessage="#{msg.noRecordFound}" style="width:600px">
						<p:column headerText="#{msg.name}">
							<h:outputText value="#{item.name}" />
						</p:column>
						<p:column headerText="分组">
							<h:outputText value="#{item.groupName}" />
						</p:column>
						<p:column headerText="描述">
							<h:outputText value="#{item.description}" />
						</p:column>
						<p:column headerText="类型">
							<h:outputText value="#{item.fieldTypeStr()}" />
						</p:column>
						<p:column headerText="默认值">
							<h:outputText rendered="#{(item.fieldType ne 'Select')}" value="#{item.defaultValue}" />
							<h:outputText rendered="#{item.fieldType eq 'Select'}" value="#{item.optionStr()}" />
						</p:column>
						<p:column headerText="是否必填">
							<h:outputText value="#{empty item.name?'':item.required?'是':'否'}" />
						</p:column>
						<f:facet name="{Toolbar}">
						
						</f:facet>
					</p:dataTable>
				</h:panelGroup>
			</p:panelGrid>
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" id="idTypeGroup">
				<h:panelGroup>
					<label class="label">检查类型*</label>
					<p:selectOneRadio value="#{assetBindRuleController.selectedNurseSiteMaintainConfig.type}" required="true" requiredMessage="检查类型不能为空" layout="responsive" columns="1" disabled="true">
						<p:ajax event="change" update=":maintainConfigEditForm:idTypeGroup" process="@this"></p:ajax>
						<f:selectItem itemLabel="每天" itemValue="1" />
						<f:selectItem itemLabel="每周" itemValue="2" />
						<f:selectItem itemLabel="每月" itemValue="3" />
					</p:selectOneRadio>
				</h:panelGroup>
				<h:panelGroup id="typeValueId1" rendered="#{assetBindRuleController.selectedNurseSiteMaintainConfig.type==1}">
					<label class="label">检查频率(次)</label>
					<p:outputLabel value="#{assetBindRuleController.selectedNurseSiteMaintainConfig.typeValue}" />
				</h:panelGroup>
				<h:panelGroup id="typeValueId2" rendered="#{assetBindRuleController.selectedNurseSiteMaintainConfig.type==2}">
					<label class="label">检查频率</label>
					<p:selectManyMenu value="#{assetBindRuleController.listWeekDay}" var="t" required="true"
						requiredMessage="检查频率不能为空" showCheckbox="true">
						<f:selectItems value="#{assetBindRuleController.checkListWeekDays}" var="item" itemLabel="#{item.key}" itemValue="#{item.intValue}" />
						<p:column>
							<h:outputText value="#{t==2?'星期一':t==3?'星期二':t==4?'星期三':t==5?'星期四':t==6?'星期五':t==7?'星期六':t==1?'星期日':''}" />
						</p:column>
					</p:selectManyMenu>
				</h:panelGroup>
				<h:panelGroup id="typeValueId3" rendered="#{assetBindRuleController.selectedNurseSiteMaintainConfig.type==3}">
					<label class="label">检查频率</label>
					<p:selectManyMenu value="#{assetBindRuleController.listMonthDay}" var="t" required="true"
						requiredMessage="检查频率不能为空" filter="true" filterMatchMode="contains" showCheckbox="true">
						<f:selectItems value="#{assetBindRuleController.checkListMonthDays}" var="item" itemLabel="#{item.key}" itemValue="#{item.intValue}" />
						<p:column>
							<h:outputText value="#{t}日" />
						</p:column>
					</p:selectManyMenu>
				</h:panelGroup>
			</p:panelGrid>


		</h:form>
	</p:dialog>
</ui:composition>
</html>
