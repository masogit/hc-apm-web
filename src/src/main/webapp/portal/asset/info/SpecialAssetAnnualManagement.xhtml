<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="年检管理"/>
            </div>

            <div class="ui-g-12">
                <p:tabView id="specialAssetTab" dynamic="true" class="ui-g-12">
                    <p:ajax event="tabChange" oncomplete="openAssetViewWindow(xhr, status, args)"/>
                    <p:tab title="年检结果" id="measuringAssetList" >
                        <ui:include src="specialAssetReportList.xhtml"/>
                    </p:tab>
                    <p:tab title="年检结果导入" id="resultImport" >
                        <ui:include src="specialAssetReportImport.xhtml"/>
                    </p:tab>
                    <p:tab title="年检报告批量上传" id="fileImport" >
                        <ui:include src="specialAssetReportUpload.xhtml"/>
                    </p:tab>
                </p:tabView>
                <ui:include src="/portal/preview/view.xhtml" />
            </div>
        </div>
        <script>
            function openAssetViewWindow(xhr, status, args) {
                if(args.url != null){
                    window.location.href = args.url;
                }

            }

            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked;
                });
                $("#specialAssetReportListForm\\:datalist_specialAssetReport\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
        </script>
    </ui:define>
</ui:composition>
