<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            div.ui-panelgrid-cell>label+div.ui-selectonemenu {
                min-width: 75px !important;
                max-width: 90%;
            }
        </style>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{assetInfoEditController.CRUDActionName} #{assetInfoEditController.terminate? msg.TerminateAssetInfo :msg.AssetInfo}"/>
            </div>

            <div class="ui-g-12 card">

                <!--<p:separator/>-->
                <h:form id="AssetInfoEditForm">
                    <p:fieldset legend="#{msg.BasicInfo}" style="margin-bottom:20px">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">#{msg.serialNum}</label>
                                <p:inputText id="serialNum" value="#{assetInfoEditController.selected.serialNum}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.name}*</label>
                                <p:autoComplete id="name" value="#{assetInfoEditController.selected.name}" completeMethod="#{assetInfoEditController.completeAssetName}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.aliasName}</label>
                                <p:inputText id="aliasName" value="#{assetInfoEditController.selected.aliasName}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.assetGroup}*</label>
                                <p:selectOneMenu id="assetGroup" value="#{assetInfoEditController.selected.assetGroup}" required="true" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.assetOwnerName}</label>
                                <p:autoComplete id="assetOwnerName" value="#{assetInfoEditController.selectedObjectMap['assetOwner']}" converter="userAccountConverter" dropdown="true" forceSelection="true" required="false" requiredMessage="#{msg.assetOwnerName} #{msg.ValidationRequire}"
                                                var="t" itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{assetInfoEditController.completeOwnerList}">
                                    <p:ajax event="itemSelect" listener="#{assetInfoEditController.onOwnerChange('assetOwner')}" process="@this" update="assetOwnerTel" />
                                    <p:ajax listener="#{assetInfoEditController.onOwnerChange('assetOwner')}" process="@this" update="assetOwnerTel" />
                                    <p:column>
                                        <h:outputText value="#{t.name}"/>
                                    </p:column>
                                    <p:column>
                                        <h:outputText value="#{t.telephone}"/>
                                    </p:column>
                                </p:autoComplete>

                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.assetOwnerTel}</label>
                                <p:inputText id="assetOwnerTel" value="#{assetInfoEditController.selected.assetOwnerTel}" readonly="true"/>
                            </h:panelGroup>

                            <h:panelGroup >
                                <label class="label">#{msg.assetOwnerName2}</label>
                                <p:autoComplete id="assetOwnerName2" value="#{assetInfoEditController.selectedObjectMap['assetOwner2']}" converter="userAccountConverter" dropdown="true" forceSelection="true" var="t" required="false" requiredMessage="#{msg.assetOwnerName} #{msg.ValidationRequire}"
                                                itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{assetInfoEditController.completeOwnerList}">
                                    <p:ajax event="itemSelect" listener="#{assetInfoEditController.onOwnerChange('assetOwner2')}" process="@this" update="assetOwnerTel2" />
                                    <p:ajax listener="#{assetInfoEditController.onOwnerChange('assetOwner2')}" process="@this" update="assetOwnerTel2" />
                                    <p:column>
                                        <h:outputText value="#{t.name}"/>
                                    </p:column>
                                    <p:column>
                                        <h:outputText value="#{t.telephone}"/>
                                    </p:column>
                                </p:autoComplete>

                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.assetOwnerTel2}</label>
                                <p:inputText id="assetOwnerTel2" value="#{assetInfoEditController.selected.assetOwnerTel2}" readonly="true"/>
                            </h:panelGroup>

                            <h:panelGroup >
                                <label class="label">#{msg.assetOwnerName3}</label>
                                <p:autoComplete id="assetOwnerName3" value="#{assetInfoEditController.selectedObjectMap['assetOwner3']}" converter="userAccountConverter" dropdown="true" forceSelection="true" var="t" required="false" requiredMessage="#{msg.assetOwnerName} #{msg.ValidationRequire}"
                                                itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{assetInfoEditController.completeOwnerList}">
                                    <p:ajax event="itemSelect" listener="#{assetInfoEditController.onOwnerChange('assetOwner3')}" process="@this" update="assetOwnerTel3" />
                                    <p:ajax listener="#{assetInfoEditController.onOwnerChange('assetOwner3')}" process="@this" update="assetOwnerTel3" />
                                    <p:column>
                                        <h:outputText value="#{t.name}"/>
                                    </p:column>
                                    <p:column>
                                        <h:outputText value="#{t.telephone}"/>
                                    </p:column>
                                </p:autoComplete>

                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.assetOwnerTel3}</label>
                                <p:inputText id="assetOwnerTel3" value="#{assetInfoEditController.selected.assetOwnerTel3}" readonly="true"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.hospitalId}</label>
                                <p:inputText id="selectedUserOrgName" value="#{assetInfoEditController.selectedOrg==null?'':assetInfoEditController.selectedOrg.name}" readonly="true" />
                                <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" disabled="#{not empty assetInfoEditController.selected.id}"/>
                                <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" style="width:300px" modal="false">
                                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{assetInfoEditController.orgTree}" selection="#{assetInfoEditController.selectedNode}" var="node" selectionMode="single">
                                            <p:ajax process="@this" event="select" update=":AssetInfoEditForm:selectedUserOrgName :AssetInfoEditForm:clinicalDeptName :AssetInfoEditForm:assetOwnerName :AssetInfoEditForm:assetOwnerName2 :AssetInfoEditForm:parentAssetList :AssetInfoEditForm:buttonGroup :AssetInfoEditForm:qrCode" listener="#{assetInfoEditController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>

                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.clinicalDeptName}</label>
                                <p:autoComplete id="clinicalDeptName" dropdown="true" value="#{assetInfoEditController.selectedObjectMap['clinicalDept']}"  scrollHeight="300"  forceSelection="true"  requiredMessage="#{msg.clinicalDeptName} #{msg.ValidationRequire}" completeMethod="#{assetInfoEditController.autoCompleteDept}"
                                                var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter">
                                    <p:ajax event="itemSelect" listener="#{assetInfoEditController.onClinicalDeptChange}" update="clinicalOwnerName clinicalOwnerTel parentAssetList" />
                                    <p:ajax listener="#{assetInfoEditController.onClinicalDeptChange}" update="clinicalOwnerName clinicalOwnerTel parentAssetList" />
                                </p:autoComplete>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.clinicalOwnerName}</label>

                                <p:autoComplete id="clinicalOwnerName" value="#{assetInfoEditController.selectedObjectMap['clinicalOwner']}" converter="userAccountConverter" dropdown="true" forceSelection="true" var="t" required="false" requiredMessage="#{msg.clinicalOwnerId} #{msg.ValidationRequire}"
                                                itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{assetInfoEditController.completeClinicalOwnerList}">
                                    <p:ajax event="itemSelect" listener="#{assetInfoEditController.onOwnerChange('clinicalOwner')}" process="@this" update="clinicalOwnerTel" />
                                    <p:ajax listener="#{assetInfoEditController.onOwnerChange('clinicalOwner')}" process="@this" update="clinicalOwnerTel" />
                                    <p:column>
                                        <h:outputText value="#{t.name}"/>
                                    </p:column>
                                    <p:column>
                                        <h:outputText value="#{t.telephone}"/>
                                    </p:column>
                                </p:autoComplete>

                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.clinicalOwnerTel}</label>
                                <p:inputText id="clinicalOwnerTel" value="#{assetInfoEditController.selected.clinicalOwnerTel}" readonly="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.manufacture}</label>
                                <p:autoComplete id="manufacture" value="#{assetInfoEditController.selected.manufacture}" completeMethod="#{assetInfoEditController.completeManufacture}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.makerShortName}</label>
                                <p:inputText id="makerShortName" value="#{assetInfoEditController.selected.makerShortName}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">设备#{msg.vendor}</label>

                                <p:autoComplete id="vendor2" dropdown="true" value="#{assetInfoEditController.selectedObjectMap['supplier']}" scrollHeight="300"  forceSelection="true"  requiredMessage="#{msg.vendor} #{msg.ValidationRequire}" completeMethod="#{assetInfoEditController.autoCompleteSupplier}"
                                                var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                                    <p:ajax event="itemSelect" listener="#{assetInfoEditController.onSupplierChange}"/>
                                    <p:ajax listener="#{assetInfoEditController.onSupplierChange}"/>
                                </p:autoComplete>

                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">维修供应商</label>
                                <p:autoComplete id="vendor3" dropdown="true" value="#{assetInfoEditController.selectedObjectMap['maintainer']}" scrollHeight="300"  forceSelection="true"  requiredMessage="维修供应商 #{msg.ValidationRequire}" completeMethod="#{assetInfoEditController.autoCompleteMaintainer}"
                                                var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                                    <p:ajax event="itemSelect" listener="#{assetInfoEditController.onMaintainerChange}"/>
                                    <p:ajax listener="#{assetInfoEditController.onMaintainerChange}"/>
                                </p:autoComplete>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.maitananceTel}</label>
                                <p:inputText id="maitananceTel" value="#{assetInfoEditController.selected.maitananceTel}"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">设备国标码</label>
                                <p:autoComplete id="gbname" value="#{assetInfoEditController.gbCodeName}" completeMethod="#{assetInfoEditController.completeGbName}">
                                    <p:ajax process="@this" update="" listener="#{assetInfoEditController.updateFinancingNumByNationalStandardCode()}"/>
                                </p:autoComplete>
                                <p:commandButton id="btnOrg1" class="btn btn-sm popupIconButton"  process="@this" icon="ui-icon-arrow-drop-down" />
                                <p:overlayPanel id="popupPanel1" widgetVar="varPanelOrg1" for="btnOrg1" hideEffect="fade" dynamic="false" style="width:300px" modal="false">
                                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                                        <p:tree id="gbTree" class="tree" style="width:98%;border:0;" value="#{assetInfoEditController.gbTree}" selection="#{assetInfoEditController.selectedGbNode}" var="node" selectionMode="single">
                                            <p:ajax process="@this" event="select" listener="#{assetInfoEditController.onSelectGbTreeNode}" update=":AssetInfoEditForm:gbname" oncomplete="PF('varPanelOrg1').hide();"/>

                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>

                                            <p:treeNode type="gb">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>

                        </p:panelGrid>
                    </p:fieldset>

                    <p:fieldset  style="margin-bottom:20px">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">#{msg.parentAsset}</label>
                                <p:selectOneMenu id="parentAssetList" value="#{assetInfoEditController.selected.parentAssetId}" required="false" requiredMessage="#{msg.clinicalOwnerId} #{msg.ValidationRequire}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{assetInfoEditController.parentAssetList}" var="item" itemLabel="#{item.departNum}/#{item.name}" itemValue="#{item.id}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.deviceName}</label>
                                <p:inputText id="deviceName" value="#{assetInfoEditController.selected.deviceName}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.systemId}</label>
                                <p:inputText id="systemId" value="#{assetInfoEditController.selected.systemId}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.financingNum}</label>
                                <p:inputText value="#{assetInfoEditController.selected.financingNum}" class="financingNum">
                                    <p:ajax event="keyup" process="@this" update="generateFinancingNum"/>
                                    <p:ajax listener="#{assetInfoEditController.onDepartNumChange('financingNum')}" update="@(.financingNum) qrCode qrCodeButton departNum" />
                                </p:inputText>
                                <p:commandButton id="generateFinancingNum" actionListener="#{assetInfoEditController.generateFinancialNum()}"  disabled="#{assetInfoEditController.selected.financingNum.length() gt 4}"
                                    process="@(.financingNum) parentAssetList gbname" update="@(.financingNum) qrCode qrCodeButton departNum" icon="ui-icon-repeat" title="#{msg.Renew}" class="popupIconButton financingNum" />
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.departNum}</label>
                                <p:inputText id="departNum" value="#{assetInfoEditController.selected.departNum}">
                                    <p:ajax process="@this" listener="#{assetInfoEditController.onDepartNumChange('departNum')}" update="@(.financingNum) qrCode qrCodeButton departNum"/>
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.barcode}</label>
                                <p:inputText id="barcode" value="#{assetInfoEditController.selected.barcode}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.registrationNo}</label>
                                <p:inputText id="registrationNo" value="#{assetInfoEditController.selected.registrationNo}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.modalityId}</label>
                                <p:inputText id="modalityId" value="#{assetInfoEditController.selected.modalityId}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.qrCode}</label>
                                <p:inputText id="qrCode" value="#{assetInfoEditController.qrCode}" readonly="#{not empty assetInfoEditController.selected.qrCode}">
                                <p:ajax process="@this" listener="#{assetInfoEditController.onDepartNumChange('qrCode')}" update="@(.financingNum) qrCode qrCodeButton departNum"/>
                                </p:inputText>
                                <p:commandButton id="qrCodeButton" actionListener="#{assetInfoEditController.renewQrcode()}" update="@(.financingNum) departNum qrCode qrCodeButton" icon="ui-icon-repeat" title="#{msg.Renew}" class="popupIconButton" process="@this" disabled="#{not empty assetInfoEditController.qrCode}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset  style="margin-bottom:20px">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">#{msg.functionType}</label>
                                <p:inputText id="functionType" value="#{assetInfoEditController.selected.functionType}"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.functionGroup}</label>
                                <p:selectOneMenu id="functionGroup" value="#{assetInfoEditController.selected.functionGroup}" style="width: 100%">
                                    <p:ajax  listener="#{assetInfoEditController.onFunctionGroupChange()}" update="assetCode68" />
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetFunctionType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.assetCode68}</label>
                                <p:selectOneMenu id="assetCode68" value="#{assetInfoEditController.selected.assetCode68}" style="width: 100%">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{assetInfoEditController.code68List}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.functionGrade}</label>
                                <p:selectOneMenu id="functionGrade" value="#{assetInfoEditController.selected.functionGrade}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetFunctionGrade')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.repairForm}</label>
                                <p:selectOneMenu id="repairForm" value="#{assetInfoEditController.selected.repairForm}">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('repairForm')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.locationCode}</label>
                                <p:inputText id="locationCode" value="#{assetInfoEditController.selected.locationCode}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.locationName}</label>
                                <p:inputText id="locationName" value="#{assetInfoEditController.selected.locationName}"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.status}*</label>
                                <p:selectOneRadio id="status" value="#{assetInfoEditController.selected.status}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.deviceStatus}*</label>
                                <p:selectOneRadio id="deviceStatus" value="#{assetInfoEditController.selected.deviceStatus}" required="true" requiredMessage="#{msg.deviceStatus} #{msg.ValidationRequire}">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('deviceStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.isAssetPMed}</label>
                                <p:selectOneRadio value="#{assetInfoEditController.selected.isPm}">
                                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.isAssetChecked}</label>
                                <p:selectOneRadio value="#{assetInfoEditController.selected.isChecked}">
                                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.comments}</label>
                                <p:inputTextarea value="#{assetInfoEditController.selected.comments}"  maxlength="256"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="#{msg.assetCategory}" style="margin-bottom:20px">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                            <h:panelGroup>
                                <label class="label">#{msg.assetUsage}</label>
                                <p:selectOneMenu id="assetUsage" value="#{assetInfoEditController.selected.assetUsage}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetUsage')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.capitalSource}</label>
                                <p:selectOneMenu id="capitalSource" value="#{assetInfoEditController.selected.capitalSource}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('capitalSource')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            
                            <h:panelGroup>
                                <label class="label">#{msg.capitalSource2}</label>
                                <p:selectOneMenu id="capitalSource2" value="#{assetInfoEditController.selected.capitalSource2}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('capitalSource2')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.measureGrade}</label>
                                <p:selectOneMenu id="measureGrade" value="#{assetInfoEditController.selected.measureGrade}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('measureGrade')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.riskGrade}</label>
                                <p:selectOneMenu id="riskGrade" value="#{assetInfoEditController.selected.riskGrade}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('riskGrade')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.emergencyEquipment}</label>
                                <p:selectOneMenu id="emergencyEquipment" value="#{assetInfoEditController.selected.emergencyEquipment}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('emergencyEquipment')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.importEquipment}</label>
                                <p:selectOneMenu id="importEquipment" value="#{assetInfoEditController.selected.importEquipment}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('importEquipment')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.measuringItemCategory}</label>
                                <p:selectOneMenu id="measuringItemCategory" value="#{assetInfoEditController.selected.measuringItemCategory}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('measuringItemCategory')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.accountingCategory}</label>
                                <p:selectOneMenu id="accountingCategory" value="#{assetInfoEditController.selected.accountingCategory}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('accountingCategory')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>

                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset  style="margin-bottom:20px">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">#{msg.manufactDate}</label>
                                <p:calendar timeZone="GMT+8"  id="manufactDate" pattern="yyyy/MM/dd" value="#{assetInfoEditController.selected.manufactDate}" 
                                            maxdate="#{appContextService.curentDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"  >
                                    <p:ajax process="@(this)" update="@(.inputDate) purchaseDate" />
                                </p:calendar>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.purchaseDate}</label>
                                <p:calendar timeZone="GMT+8"  id="purchaseDate" pattern="yyyy/MM/dd" value="#{assetInfoEditController.selected.purchaseDate}" maxdate="#{appContextService.curentDate}"
                                            showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="false" requiredMessage="#{msg.purchaseDate} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.arriveDate}</label>
                                <p:calendar timeZone="GMT+8"  id="arriveDate" pattern="yyyy/MM/dd" value="#{assetInfoEditController.selected.arriveDate}" maxdate="#{appContextService.curentDate}"
                                            showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.installDate}</label>
                                <p:calendar timeZone="GMT+8"  id="installDate" pattern="yyyy/MM/dd" value="#{assetInfoEditController.selected.installDate}" maxdate="#{appContextService.curentDate}"
                                            showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="false" requiredMessage="#{msg.installDate} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.factoryWarrantyDate}</label>
                                <p:calendar timeZone="GMT+8"  id="factoryWarrantyDate" pattern="yyyy/MM/dd" value="#{assetInfoEditController.selected.factoryWarrantyDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.warrantyDate}</label>
                                <p:calendar timeZone="GMT+8"  id="warrantyDate" pattern="yyyy/MM/dd" value="#{assetInfoEditController.selected.warrantyDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.terminateDate}</label>
                                <p:calendar timeZone="GMT+8"  id="terminateDate" pattern="yyyy/MM/dd" value="#{assetInfoEditController.selected.terminateDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">是否对质保到期进行提醒</label>
                                <p:selectOneRadio value="#{assetInfoEditController.selected.warranty}">
                                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                                   	<f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset  style="margin-bottom:20px">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">#{msg.purchasePrice}</label>
                                <p:inputNumber minValue="0" decimalPlaces="2" id="purchasePrice" value="#{assetInfoEditController.selected.purchasePrice}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.salvageValue}</label>
                                <p:inputNumber minValue="0" decimalPlaces="2" id="salvageValue" value="#{assetInfoEditController.selected.salvageValue}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.lifecycle}</label>
                                <p:inputNumber minValue="0" decimalPlaces="1" id="lifecycle" value="#{assetInfoEditController.selected.lifecycleInYear}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.depreciationMethod}</label>
                                <p:selectOneMenu id="depreciationMethod" value="#{assetInfoEditController.selected.depreciationMethod}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('depreciationMethodList')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:fieldset legend="#{msg.Attachment}" style="margin-bottom:20px">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup >
                                <p:dataList id="pictureList" value="#{assetInfoEditController.getAttachList(assetInfoEditController.selected.uid,1)}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                    <f:facet name="header">#{fieldMsg.fieldValue('attachmentType', 1)}</f:facet>

                                    #{fileitem.objectName}
                                    <p:commandButton actionListener="#{assetInfoEditController.removeAttachmentById(fileitem.id)}" update="pictureList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>
                                </p:dataList>
                                <p:fileUpload id="type1" fileUploadListener="#{assetInfoEditController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                              multiple="true"  sizeLimit="100000000"  update="pictureList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:dataList id="contractList" value="#{assetInfoEditController.getAttachList(assetInfoEditController.selected.uid,2)}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                    <f:facet name="header">#{fieldMsg.fieldValue('attachmentType', 2)}</f:facet>
                                    #{fileitem.objectName}
                                    <p:commandButton actionListener="#{assetInfoEditController.removeAttachmentById(fileitem.id)}" update="contractList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>
                                </p:dataList>
                                <p:fileUpload id="type2" fileUploadListener="#{assetInfoEditController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                              multiple="true"  sizeLimit="100000000"  update="contractList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <p:dataList id="manualList" value="#{assetInfoEditController.getAttachList(assetInfoEditController.selected.uid,3)}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                    <f:facet name="header">#{fieldMsg.fieldValue('attachmentType', 3)}</f:facet>
                                    #{fileitem.objectName},
                                    <p:commandButton actionListener="#{assetInfoEditController.removeAttachmentById(fileitem.id)}" update="manualList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>
                                </p:dataList>
                                <p:fileUpload id="type3" fileUploadListener="#{assetInfoEditController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                              multiple="true"  sizeLimit="100000000"  update="manualList" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <h:panelGroup id="buttonGroup">
                        <p:commandButton value="#{msg.Save}" icon="ui-icon-check" action="#{assetInfoEditController.applyChange()}" validateClient="true" update=":growl" style="float:left" rendered="#{!(assetInfoEditController.needAssetApproval(assetInfoEditController.selected.siteUID) and (assetInfoEditController.CRUDActionName eq msg.Create or assetInfoEditController.selected.usageStatus ne 3))}"/>
                        <p:commandButton value="提交审核" icon="ui-icon-check" action="#{assetInfoEditController.submitApproval()}" validateClient="true" update=":growl" style="float:left" rendered="#{assetInfoEditController.needAssetApproval(assetInfoEditController.selected.siteUID) and (assetInfoEditController.CRUDActionName eq msg.Create or assetInfoEditController.selected.usageStatus ne 3)}"/>
                        <p:commandButton value="#{msg.Return}" icon="ui-icon-arrow-back" action="#{assetInfoEditController.getListPageLink()}" immediate="true"  update=":growl" style="float:left"/>
                        <p:commandButton id="setIsValid" value="#{assetInfoEditController.terminate? msg.ActiveAsset :msg.InactiveAsset}" action="#{assetInfoEditController.setValidButton}" immediate="true"  update=":growl" style="float:right;"/>
                    </h:panelGroup>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
