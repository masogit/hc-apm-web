<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="PmOrderRuleEditDlg" widgetVar="PmOrderRuleEditDialog" width="1000" height="480" modal="true" resizable="true" draggable="true" appendTo="@this" header=" #{msg.PmOrderRule}">
        <h:form id="PmOrderRuleEditForm">
            <h:panelGroup id="display">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{assetBindRuleController.pmOrderRule != null}">
                    <h:panelGroup>
                        <label class="label">#{userContextService.isYiMaiYangGuangTenant()?msg.AffiliatedOrganization:msg.hospitalId}</label>
                        <p:inputText value="#{assetBindRuleController.getSiteName(assetBindRuleController.pmOrderRule.siteUID)}" disabled="true"/>
                    </h:panelGroup>

                    <h:panelGroup >
                        <label class ="label">#{msg.assetName} *</label>
                        <p:inputText value="#{assetBindRuleController.pmOrderRule.assetName}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">#{msg.assetGroup}</label>
                        <p:selectOneMenu value="#{assetBindRuleController.pmOrderRule.assetGroup}" disabled="true" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">#{msg.manufacture}</label>
                        <p:inputText value="#{assetBindRuleController.pmOrderRule.manufacture}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">#{msg.functionType}</label>
                        <p:inputText id="functionType" value="#{assetBindRuleController.pmOrderRule.functionType}" disabled="true" />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">#{msg.period}</label>
                        <p:inputNumber id="period" value="#{assetBindRuleController.pmOrderRule.period}" minValue="1" maxValue="120" decimalPlaces="0" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">#{msg.cyclePeriodUnit} *</label>
                        <p:selectOneMenu  value="#{assetBindRuleController.pmOrderRule.periodUnit}" required="true" style="max-width: 150px;" disabled="true">
                            <f:selectItems value="#{fieldMsg.getFieldValueList('cyclePeriodUnit')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class ="label">#{msg.feedbackComment}</label>
                        <p:inputText id="remark" value="#{assetBindRuleController.pmOrderRule.remark}" disabled="true"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{!assetBindRuleController.getPmRule()}">
                        <label class ="label">#{msg.ruleLevel}*</label>
                        <p:selectOneMenu value="#{assetBindRuleController.pmOrderRule.level}"  disabled="true" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{assetBindRuleController.getPmRule()}">
                        <label class ="label">#{msg.ruleLevel}*</label>
                        <p:selectOneMenu value="#{assetBindRuleController.pmOrderRule.level}" disabled="true" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevelFour')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            <p:ajax listener="#{assetBindRuleController.changeruleLevelTip()}" update=":PmOrderRuleEditForm:tipChange" />
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>

                <p:panelGrid id="report" columns="4"  styleClass="ui-panelgrid-blank form-group" layout="grid" rendered="#{assetBindRuleController.pmOrderRule != null}">
                    <h:panelGroup>
                        <label class ="label" >#{msg.safetyReport}</label>
                        <h:outputText value="#{assetBindRuleController.tableDefinitionEs.name}" />
                        <h:outputText id="safetyReport"  value="#{assetBindRuleController.tableDefinitionEs.schema}"  style="display:none" />
                        &nbsp;&nbsp;
                        <p:commandButton  rendered="#{not empty assetBindRuleController.pmOrderRule.safetyReport}" immediate="true" value="#{msg.preview}" onclick="preparePreview(1,'PmOrderRuleEditForm');" oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                    </h:panelGroup>
                    <h:panelGroup></h:panelGroup>
                    <h:panelGroup></h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel id="tipChange" style="color: red!important;font-size: smaller!important;" rendered="#{userContextService.hasCurrentTenantName('')}">#{assetBindRuleController.getRuleLevelTip()}</p:outputLabel>
                    </h:panelGroup>
                </p:panelGrid>

                <p:panelGrid id="xnreport" columns="1"  styleClass="ui-panelgrid-blank form-group" layout="grid" rendered="#{assetBindRuleController.pmOrderRule != null}">
                    <h:panelGroup>
                        <label class ="label">#{msg.performanceReport}</label>
                        <h:outputText value="#{assetBindRuleController.tableDefinition.name}" />
                        <h:outputText id="performanceReport" value="#{assetBindRuleController.tableDefinition.schema}"  style="display:none"  />
                        &nbsp;&nbsp;
                        <p:commandButton rendered="#{not empty assetBindRuleController.pmOrderRule.performanceReport}"  immediate="true" value="#{msg.preview}" onclick="preparePreview(2,'PmOrderRuleEditForm');"  oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{userContextService.hasRole('AssetHead')}">
                        <label class="label">#{msg.MaintenanceTemplate}</label>
                        <p:commandLink value="#{msg.DownloadSampleTemplate}" actionListener="#{assetBindRuleController.generateReportTemplateFile()}" ajax="false" immediate="true">
                            <p:fileDownload value="#{assetBindRuleController.reportTemplateFile}"/>
                        </p:commandLink><br/>
                    </h:panelGroup>
                </p:panelGrid>
                &nbsp;&nbsp;
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.AddCheckItem}</label>
                        <p:dataTable id="addCheckList" class="addCheckList" value="#{assetBindRuleController.checkItemLists}" var="item" widgetVar="addCheckList" lazy="false" paginator="false"
                                     rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="#{msg.name}">
                                <h:outputText value="#{item.name}" />
                            </p:column>
                            <p:column headerText="#{msg.period}">
                                <h:outputText value="#{item.period}" />
                            </p:column>
                            <p:column headerText="#{msg.Items}">
                                <h:outputText value="#{item.remark}"  style="word-wrap: break-word;"/>
                            </p:column>
                        </p:dataTable>
                    </h:panelGroup>
                </p:panelGrid>
            </h:panelGroup>
        </h:form>
    </p:dialog>


    <p:dialog id="PmOrderPreviewDlg" widgetVar="PmOrderPreviewDlg" height="500" width="400" modal="true" resizable="false" draggable="true" appendTo="@(body)" header="#{msg.preview}">
        <h:form id="PmOrderPreviewForm" >
            <iframe src="/wx/form/preview/"  width="100%"  height="490"/>
        </h:form>

    </p:dialog>
    <script>
        function preparePreview(index,formName) {
            var $jasonText;
            if(index == '1'){
                $jasonText = $("#"+formName+"\\:safetyReport")[0];
            }else if(index == '2'){
                $jasonText = $("#"+formName+"\\:performanceReport")[0];
            }
            if ('localStorage' in window) {
                localStorage.setItem("hc-apm-form-preview", $jasonText.innerText || ''); // # for test/dev perpose
                localStorage.setItem("hc-apm-token-expireAt", Date.now() + 8640000)
            }

        }
    </script>
</ui:composition>
</html>
