<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
        <h:panelGroup>
            <label class="label">#{msg.name}</label>
            <p:autoComplete id="mvs_name" value="#{assetInfoEditController.mvsAssetInfo.name}"
                            completeMethod="#{assetInfoEditController.completeAssetName}"/>
        </h:panelGroup>

        <h:panelGroup>
            <label class="label">#{msg.aliasName}</label>
            <p:inputText id="mvs_aliasName" value="#{assetInfoEditController.mvsAssetInfo.aliasName}" />
        </h:panelGroup>

    </p:panelGrid>


</ui:composition>
