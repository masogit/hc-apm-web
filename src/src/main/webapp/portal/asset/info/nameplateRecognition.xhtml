<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:apm="http://www.ge.com/tags/apm">
    <p:dialog class="coworkerDlg" id="nameplateRecognition" widgetVar="nameplateRecognitionDlg" modal="true" width="800"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.nameplateRecognition}">

            <h:form id="nameplateRecognitionForm">
                <p:fieldset legend="#{msg.nameplateRecognition}" style="margin-bottom:20px">
                    <p:dataTable id="datalist" value="#{assetInfoEditController.getAttachList(assetInfoEditController.selected.uid,1)}" var="item" widgetVar="varDataList"  resizeMode="expand"
                                 scrollable="true" scrollWidth="98%"
                                 lazy="true" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true"
                                 sortMode="single" sortOrder="descending"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="5" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="5">
                        <p:column headerText="#{msg.name}" >
                            <h:outputText value="#{item.objectName}"/>
                        </p:column>
<!--                        <p:column headerText="图片" exportable="false">-->
<!--                            <p:graphicImage value="#{fileDownloadService.getFile(item.objectStorageId)}" height="80" width="100" stream="false" >-->
<!--                            </p:graphicImage>-->
<!--                        </p:column>-->
                        <p:column headerText="操作">
        <!--                    <p:commandButton process="@this" icon="ui-icon ui-icon-file-download" style="zoom:0.8;" title="#{msg.Download}"-->
        <!--                                     rendered="#{not empty item}"-->
        <!--                    />-->
                            <p:commandButton process="@this" icon="ui-icon ui-icon-wifi-tethering" style="zoom:0.8;" title="识别"
                                             update="nameplateRecognitionForm" rendered="#{not empty item}" actionListener="#{assetInfoEditController.plateRecognition(item.objectStorageId)}"/>
                        </p:column>
                    </p:dataTable>

                </p:fieldset>

                <p:fieldset legend="识别结果" style="margin-bottom:20px">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.name}</label>
                            <p:inputText id="serialNum" value="#{assetInfoEditController.equipmentNameplate.device_name}" ></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">当前#{msg.name}</label>
                            <p:inputText id="serialNumOdl" value="#{assetInfoEditController.selected.name}" readonly="true"></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.financingNum}</label>
                            <p:inputText id="serialNum1" value="#{assetInfoEditController.equipmentNameplate.pattern}" ></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">当前#{msg.financingNum}</label>
                            <p:inputText id="serialNum1Old" value="#{assetInfoEditController.selected.financingNum}" readonly="true"></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.serialNum}</label>
                            <p:inputText id="serialNum2" value="#{assetInfoEditController.equipmentNameplate.serial_num}" ></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">当前#{msg.serialNum}</label>
                            <p:inputText id="serialNum2Old" value="#{assetInfoEditController.selected.serialNum}" readonly="true"></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.manufacture}</label>
                            <p:inputText id="serialNum3" value="#{assetInfoEditController.equipmentNameplate.manufactory}" ></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">当前#{msg.manufacture}</label>
                            <p:inputText id="serialNum3Old" value="#{assetInfoEditController.selected.manufacture}" readonly="true"></p:inputText>
                        </h:panelGroup>
        <!--                <h:panelGroup>-->
        <!--                    <label class="label">#{msg.power}</label>-->
        <!--                    <p:inputText id="serialNum4" value="#{assetInfoEditController.equipmentNameplate.power}" ></p:inputText>-->
        <!--                </h:panelGroup>-->
        <!--                <h:panelGroup>-->
        <!--                    <label class="label">当前#{msg.power}</label>-->
        <!--                    <p:inputText id="serialNum4Old" value="#{assetInfoEditController.equipmentNameplate.power}" readonly="true"></p:inputText>-->
        <!--                </h:panelGroup>-->
                        <h:panelGroup>
                            <label class="label">#{msg.registrationNo}</label>
                            <p:inputText id="serialNum5" value="#{assetInfoEditController.equipmentNameplate.registry_num}" ></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">当前#{msg.registrationNo}</label>
                            <p:inputText id="serialNum5Old" value="#{assetInfoEditController.selected.registrationNo}" readonly="true"></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.lifecycle}</label>
                            <p:inputText id="serialNum6" value="#{assetInfoEditController.equipmentNameplate.using_year}" ></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">当前#{msg.lifecycle}</label>
                            <p:inputText id="serialNum6Old" value="#{assetInfoEditController.selected.lifecycleInYear}" readonly="true"></p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.manufactDate}</label>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}" id="serialNum7" pattern="#{userContextService.timeFormat()}" value="#{assetInfoEditController.equipmentNameplate.factory_date}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.manufactDate}</label>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" readonly="true" locale = "#{userContextService.getCalendarLocale()}" id="serialNum7Old" pattern="#{userContextService.timeFormat()}" value="#{assetInfoEditController.selected.manufactDate}" />
                        </h:panelGroup>
                        <p:commandButton id = "saveButton" value="应用" icon="ui-icon-check" action="#{assetInfoEditController.applyResult()}" oncomplete="PF('nameplateRecognitionDlg').hide();" validateClient="true" update="tab:AssetInfoEditForm @(.manufacturerChange)" style="float:left" />
                        <p:commandButton value="#{msg.Return}" icon="ui-icon-arrow-back" onclick="PF('nameplateRecognitionDlg').hide()" />

                    </p:panelGrid>
                </p:fieldset>


            </h:form>
    </p:dialog>


</ui:composition>
        <!--</html>-->
