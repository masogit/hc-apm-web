<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <iframe id="chartFrame" src="/reports/asset-life-timeline?assetUid=#{assetInfoDetailController.selected.uid}" width="100%" height="900"></iframe>

    <h:form id="hiddenForm">
        <!-- remoteCommand 调用后端获取跳转 URL -->
        <p:remoteCommand name="getAssetDetailUrl"
                         actionListener="#{assetInfoDetailController.buildDataLinkUrl}"
                         oncomplete="if(args &amp;&amp; args.url) { window.open(args.url, '_blank', 'noopener,noreferrer'); }" />
    </h:form>
    <h:outputScript>
        window.addEventListener('message', function(event) {
            const data = event.data;
            console.log(data.payload.uid);
            console.log(data);
            if(data.type === 'eventClick'){
                // 调用 remoteCommand，把 uid 传给后端
                getAssetDetailUrl([{name:'uid', value: data.payload.uid},{name:'type', value: data.type}]);
            }
        });
    </h:outputScript>
</ui:composition>

</html>
