<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:apm="http://www.ge.com/tags/apm">

    <h:form id="CreateSpecialAssetForm">
        <p:fieldset legend="特种设备状态" style="margin-bottom:20px">

                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">放射诊疗许可证目录内是否登记</label>
                        <p:selectOneRadio value="#{assetInfoEditController.specialAssetInfo.radiotherapyIsRegistration}"
                                          requiredMessage="#{msg.radiotherapyIsRegistration} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                            <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                            <p:ajax event="change"></p:ajax>
                        </p:selectOneRadio>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">预评/控评情况<span
                                style="color:red"></span></label>
                        <p:inputText id="assessmentSituation"
                                     value="#{assetInfoEditController.specialAssetInfo.assessmentSituation}"
                                     requiredMessage="#{msg.assessmentSituation} #{msg.ValidationRequire}"
                        >
                            <p:ajax event="change"></p:ajax>
                        </p:inputText>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">预评批号<span
                                style="color:red"></span></label>
                        <p:inputText id="assessmentNo" value="#{assetInfoEditController.specialAssetInfo.assessmentNo}"
                                     requiredMessage="#{msg.assessmentNo} #{msg.ValidationRequire}"
                        >                           <p:ajax event="change"></p:ajax>

                        </p:inputText>
                    </h:panelGroup>


                    <h:panelGroup>
                        <label class="label">预评文件时间<span style="color:red"></span></label>
                        <p:calendar  timeZone="#{userContextService.getTimeZone()}"
                                    locale="#{userContextService.getCalendarLocale()}"
                                    pattern="#{userContextService.timeFormat()}"
                                    value="#{assetInfoEditController.specialAssetInfo.assessmentFileDate}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true"
                                    mask="true" requiredMessage="#{msg.assessmentFileDate} #{msg.ValidationRequire}">
                            <p:ajax event="dateSelect"  ></p:ajax>

                        </p:calendar>
                    </h:panelGroup>


                    <h:panelGroup>
                        <label class="label">预评批号<span
                                style="color:red"></span></label>
                        <p:inputText id="andAssessmentNo"
                                     value="#{assetInfoEditController.specialAssetInfo.andAssessmentNo}"
                                     requiredMessage="#{msg.andAssessmentNo} #{msg.ValidationRequire}"
                        >
                            <p:ajax event="change"></p:ajax>
                        </p:inputText>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">控评批复时间 <span style="color:red"></span></label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                    locale="#{userContextService.getCalendarLocale()}"
                                    pattern="#{userContextService.timeFormat()}"
                                    value="#{assetInfoEditController.specialAssetInfo.andAssessmentApprovalDate}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true"
                                    mask="true" requiredMessage="#{msg.assessmentFileDate} #{msg.ValidationRequire}" >
                            <p:ajax event="dateSelect"  ></p:ajax>


                        </p:calendar>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">辐射安全许可证目录内是否登记</label>
                        <p:selectOneRadio value="#{assetInfoEditController.specialAssetInfo.radiationSafetyIsRegistration}"
                                          requiredMessage="#{msg.radiationSafetyIsRegistration} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                            <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                            <p:ajax event="change"></p:ajax>

                        </p:selectOneRadio>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">院内公示、核技术网公示是否完成</label>
                        <p:selectOneRadio value="#{assetInfoEditController.specialAssetInfo.coreTechnologyFinish}"
                                          requiredMessage="#{msg.coreTechnologyFinish} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                            <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                            <p:ajax event="change"></p:ajax>

                        </p:selectOneRadio>
                    </h:panelGroup>


                </p:panelGrid>




        </p:fieldset>

        <p:fieldset legend="其他信息" style="margin-bottom:20px">
            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                <h:panelGroup>
                    <label class="label">特种设备类别</label>
                    <p:selectOneMenu id="assetUsage"
                                     value="#{assetInfoEditController.specialAssetInfo.specialAssetType}"
                                     requiredMessage="#{msg.specialAssetType} #{msg.ValidationRequire}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItem itemLabel="特种设备类别1" itemValue="特种设备类别1"/>
                        <f:selectItem itemLabel="特种设备类别2" itemValue="特种设备类别2"/>
                        <f:selectItem itemLabel="特种设备类别3" itemValue="特种设备类别3"/>
                        <f:selectItem itemLabel="特种设备类别4" itemValue="特种设备类别4"/>
                        <p:ajax event="change"></p:ajax>

                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">设备管理组别</label>
                    <p:selectOneMenu id="assetManagementType"
                                     value="#{assetInfoEditController.specialAssetInfo.assetManagementType}"
                                     requiredMessage="#{msg.assetManagementType} #{msg.ValidationRequire}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItem itemLabel="设备管理组别1" itemValue="设备管理组别1"/>
                        <f:selectItem itemLabel="设备管理组别2" itemValue="设备管理组别2"/>
                        <f:selectItem itemLabel="设备管理组别3" itemValue="设备管理组别3"/>
                        <f:selectItem itemLabel="设备管理组别4" itemValue="设备管理组别4"/>
                        <p:ajax event="change"></p:ajax>

                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">设备类型用途<span
                            style="color:red"></span></label>
                    <p:inputText id="assetTypePurpose"
                                 value="#{assetInfoEditController.specialAssetInfo.assetTypePurpose}"
                                 requiredMessage="#{msg.assetTypePurpose} #{msg.ValidationRequire}"
                    >                           <p:ajax event="change"></p:ajax>

                    </p:inputText>
                </h:panelGroup>


                <h:panelGroup>
                    <label class="label">办证情况<span
                            style="color:red"></span></label>
                    <p:inputText id="registrationSituation"
                                 value="#{assetInfoEditController.specialAssetInfo.registrationSituation}"
                                 requiredMessage="#{msg.registrationSituation} #{msg.ValidationRequire}"
                    >                            <p:ajax event="change"></p:ajax>

                    </p:inputText>
                </h:panelGroup>


                <h:panelGroup>
                    <label class="label">铅衣配备情况<span
                            style="color:red"></span></label>
                    <p:inputText id="leadApronEquipment"
                                 value="#{assetInfoEditController.specialAssetInfo.leadApronEquipment}"
                                 requiredMessage="#{msg.leadApronEquipment} #{msg.ValidationRequire}"
                    >                            <p:ajax event="change"></p:ajax>

                    </p:inputText>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">铅衣位置情况<span
                            style="color:red"></span></label>
                    <p:inputText id="leadApronPosition"
                                 value="#{assetInfoEditController.specialAssetInfo.leadApronPosition}"
                                 requiredMessage="#{msg.LeadApronPosition} #{msg.ValidationRequire}"
                    >                            <p:ajax event="change"></p:ajax>

                    </p:inputText>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">备注<span
                            style="color:red"></span></label>
                    <p:inputText id="remarks" value="#{assetInfoEditController.specialAssetInfo.remarks}"
                                 requiredMessage="#{msg.remarks} #{msg.ValidationRequire}"
                    >                            <p:ajax event="change"></p:ajax>

                    </p:inputText>
                </h:panelGroup>


            </p:panelGrid>

        </p:fieldset>
<!--        <p:fieldset>-->
<!--        <p:commandButton id = "saveButton" value="#{msg.Save}" icon="ui-icon-check" actionListener="#{assetInfoEditController.processInputChange}" oncomplete="handleComplete(xhr, status, args);" validateClient="true" update="saveButton :growl" style="float:left" />-->

<!--        </p:fieldset>-->
        <p:fieldset legend="年检报告管理" style="margin-bottom:20px">
            <p:dataTable id="reportInfoList"
                         value="#{assetInfoEditController.assetAnnualInspectionReports}" var="item"
                         lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                         emptyMessage="#{msg.noRecordFound}">

                <p:column headerText="报告名称">
                    <h:outputText value="#{item.name}"/>
                </p:column>
                <p:column headerText="报告类型">
                    <h:outputText value="#{item.reportType}"/>
                </p:column>
                <p:column headerText="检测单位">
                    <h:outputText value="#{item.testingUnit}"/>
                </p:column>
                <p:column headerText="检测结果">
                    <h:outputText value="#{item.testResults}"/>
                </p:column>
                <p:column headerText="报告发证单位">
                    <h:outputText value="#{item.certificateIssuingUnit}"/>
                </p:column>
                <p:column headerText="报告生效时间">
                    <h:outputText value="#{item.effectiveTime}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                    </h:outputText>
                </p:column>
                <p:column headerText="报告到期时间">
                    <h:outputText value="#{item.expiryDate}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                    </h:outputText>
                </p:column>
                <p:column headerText="上传人">
                    <h:outputText value="#{item.createdByName}"/>
                </p:column>


                <p:column headerText="操作">
                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}"
                                     oncomplete="PF('annualInspectionReportDlg').show()"
                                     rendered="#{empty item.name}"
                                     actionListener="#{assetInfoEditController.onAddReport()}"
                                     update="annualInspectionReportDlg"/>
                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}"
                                     actionListener="#{assetInfoEditController.onEditReport(item.uid)}"
                                     oncomplete="PF('annualInspectionReportDlg').show()"
                                     update="annualInspectionReportDlg" rendered="#{not empty item.name}"/>
                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
                                     actionListener="#{assetInfoEditController.delReport(item.name)}"
                                     update="tab:CreateSpecialAssetForm:reportInfoList"
                                     rendered="#{not empty item.name}">
                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                   icon="ui-icon-alert"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>


        </p:fieldset>
        <p:fieldset legend="证件信息" style="margin-bottom:20px">
            <p:dataTable id="permitInfoList"
                         value="#{assetInfoEditController.permitInfos}" var="item"
                         lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                         emptyMessage="#{msg.noRecordFound}">

                <p:column headerText="证书名称">
                    <h:outputText value="#{item.certificateName}"/>
                </p:column>
                <p:column headerText="持证人">
                    <h:outputText value="#{item.holder}"/>
                </p:column>
                <p:column headerText="证书类型">
                    <h:outputText value="#{item.certificateType}"/>
                </p:column>
                <p:column headerText="证书生效时间">
                    <h:outputText value="#{item.effectiveTime}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                    </h:outputText>
                </p:column>
                <p:column headerText="证书到期时间">
                    <h:outputText value="#{item.expiryDate}">
                        <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                    </h:outputText>
                </p:column>
                <p:column headerText="上传人">
                    <h:outputText value="#{item.createdByName}"/>
                </p:column>


                <p:column headerText="操作">
                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}"
                                     oncomplete="PF('permitInfoDlg').show()"
                                     rendered="#{empty item.certificateName}"
                                     actionListener="#{assetInfoEditController.onAddPermitInfo()}"
                                     update="permitInfoDlg"/>
                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}"
                                     actionListener="#{assetInfoEditController.onEditPermitInfo(item.certificateName)}"
                                     oncomplete="PF('permitInfoDlg').show()"
                                     update="permitInfoDlg" rendered="#{not empty item.certificateName}"/>
                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
                                     actionListener="#{assetInfoEditController.delPermitInfo(item.certificateName)}"
                                     update="tab:CreateSpecialAssetForm:permitInfoList"
                                     rendered="#{not empty item.certificateName}">
                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                   icon="ui-icon-alert"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>


        </p:fieldset>

    </h:form>



</ui:composition>
