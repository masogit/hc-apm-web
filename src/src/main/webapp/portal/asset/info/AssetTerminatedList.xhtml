<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="searchForm">
            <h:panelGrid id="searchPanel" columns="3">
                <h:panelGroup rendered="#{userContextService.hasNotAnyRole('MVSAdmin,MVSFE')}">
                    <p:commandButton id="btnOrg" value="#{empty assetInfoTerminatedListController.selectSite? msg.AllHospitals:assetInfoTerminatedListController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                    <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false">
                        <p:inputText id="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
                        <p:commandButton partialSubmit="true" icon="ui-icon-search" process=":woTab:searchForm:treeNodeNameFilter @this" update="searchForm:orgTree" actionListener="#{orgTreeController.filterTreeNodeByName()}" value="检索"/>
                        <p:scrollPanel style="height:300px;border: 0" mode="native">
                            <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.siteOrgTree}" selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
                                <p:ajax process="@this" event="select" listener="#{assetInfoTerminatedListController.onSelectSiteTreeNode}" update=":woTab:AssetInfoListForm :woTab:searchForm #{assetInfoTerminatedListController.isShowColumn('clinicalDeptName')?'':''}" oncomplete="PF('varPanelOrg').hide();"/>
                                <p:ajax process="@this" event="expand"/>
                                <p:ajax process="@this" event="collapse"/>
                                <p:treeNode type="org">
                                    <h:outputText value="#{node.name}"/>
                                </p:treeNode>
                                <p:treeNode type="hidden" rendered="false"/>
                            </p:tree>
                        </p:scrollPanel>
                    </p:overlayPanel>
                </h:panelGroup>
                <h:panelGroup rendered="#{userContextService.hasAnyRole('MVSAdmin,MVSFE')}">
                    <p:commandButton id="btnTenant" value="#{empty assetInfoTerminatedListController.selectSite? '#{msg.AllTenants}':assetInfoTerminatedListController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right" />
                    <p:overlayPanel widgetVar="varPanelTenant" for="btnTenant" hideEffect="fade" dynamic="false" modal="false" style="text-align: left;">
                        <p:scrollPanel style="height:300px;border: 0" mode="native">
                            <p:tree id="tenantTree" class="tree" style="width:98%;border:0;" value="#{tenantTreeController.buildTenantTree(1)}" selection="#{tenantTreeController.selectedTenantOrgNode}" var="node" selectionMode="single" dynamic="true">
                                <p:ajax process="@this" event="select" listener="#{assetInfoTerminatedListController.onSelectSiteTreeNode}" update=":woTab:AssetInfoListForm :woTab:searchForm" oncomplete="PF('varPanelTenant').hide();"/>
                                <p:ajax process="@this" event="expand"/>
                                <p:ajax process="@this" event="collapse"/>
                                <p:treeNode type="org">
                                    <h:outputText value="#{node.name}"/>
                                </p:treeNode>
                                <p:treeNode type="hidden" rendered="false"/>
                            </p:tree>
                        </p:scrollPanel>
                    </p:overlayPanel>
                </h:panelGroup>
                <p:inputText id="searchText" value="#{assetInfoTerminatedListController.oneSearchStr}" placeholder="#{msg.name}/#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}/#{msg.manufacture}/#{msg.clinicalDeptName}" maxlength="100" style="width: 500px">
                    <p:ajax event="keyup" update=":woTab:AssetInfoListForm #{assetInfoTerminatedListController.isShowColumn('clinicalDeptName')?'':''} searchButtons " />
                </p:inputText>

                <h:panelGroup id='searchButtons'>
                    <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":woTab:AssetInfoListForm :woTab:searchForm  #{assetInfoTerminatedListController.isShowColumn('clinicalDeptName')?'':''}"  rendered="#{empty assetInfoTerminatedListController.oneSearchStr}"/>
                    <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":woTab:AssetInfoListForm :woTab:searchForm #{assetInfoTerminatedListController.isShowColumn('clinicalDeptName')?'':''}" actionListener="#{assetInfoTerminatedListController.setOneSearchStr('')}" rendered="#{not empty assetInfoTerminatedListController.oneSearchStr}"/>
                </h:panelGroup>
            </h:panelGrid>
        </h:form>
        <h:form id="AssetInfoListForm">
            <p:dataTable id="datalist" value="#{assetInfoTerminatedListController.lazyModel}" var="item" widgetVar="varDataList"
                         selectionMode="single" selection="#{assetInfoTerminatedListController.selected}"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.namePyCode}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.JumpTo} {JumpToPageDropdown} #{msg.Page} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rowIndexVar="idx"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500">

                <p:ajax  event="rowSelect" listener="#{assetInfoTerminatedListController.onSelectAsset}" onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)"/>
                <p:ajax event="filter" listener="#{assetInfoTerminatedListController.onFilter}" oncomplete="updateSelectAllCheckBox();"/>
                <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                <p:column width="36"  id="checkBoxColumn">
                    <p:selectBooleanCheckbox value="#{assetInfoTerminatedListController.selectedMap[item.uid]}"  class="selectCheckBox">
                        <p:ajax process="@this" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                    </p:selectBooleanCheckbox>
                    <f:facet name="header"  >
                        <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                            <p:ajax listener="#{assetInfoTerminatedListController.onSelectAllOfPage}" update="@(.selectCheckBox)" oncomplete="updateSelectAllCheckBox();"/>
                        </p:selectBooleanCheckbox>
                    </f:facet>
                </p:column>
                <p:column exportable="false" width="#{userContextService.hasRole('AssetHead')?60:30}" id="operatorColumn">
                    <h:panelGroup rendered="#{empty assetInfoListController.filterWarrantyDate}">
                        <p:link target="_new" title="#{msg.Edit}" outcome="#{assetInfoListController.getEditPage(item.id,item.name)}" rendered="#{userContextService.hasAnyRole('AssetHead,AssetStaff,MvsAdmin,SuperAdmin,SiteAdmin')}">
                            <p:graphicImage name="icons/edit.png" style="width: 30px; height: 30px;"/>
                        </p:link>
                        <p:commandLink rendered="#{userContextService.hasRole('AssetHead')}" id="deleteButton" title="#{msg.Delete}"  actionListener="#{assetInfoListController.deleteAsset(item)}" update="datalist">
                            <p:graphicImage name="icons/delete.png" style="width: 30px; height: 30px;"/>
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                        </p:commandLink>
                    </h:panelGroup>
                    <p:commandButton id="cancleWarranty" style="zoom:0.65;" process="@this" title="#{msg.CancelWarrantyReminder}" actionListener="#{assetInfoListController.cancleWarranty(item.uid)}" update="datalist" rendered="#{!empty assetInfoListController.filterWarrantyDate and item.warranty}" icon="ui-icon-notifications-off">
                        <p:confirm header="#{msg.CancelWarrantyReminder}" message="#{msg.ConfirmToCancelTheEquipmentWarrantyReminder}" icon="ui-icon-alert"/>
                    </p:commandButton>
                </p:column>
                <c:forEach items="#{assetInfoTerminatedListController.customedColumns}" var="columnItem" >
                    <c:if test="#{columnItem eq 'name'}">
                        <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}" sortBy="#{item.namePyCode}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'functionType'}">
                        <p:column  headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'serialNum'}">
                        <p:column  headerText="#{msg.serialNum}" sortBy="#{item.serialNum}" filterBy="#{item.serialNum}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.serialNum}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'departNum'}">
                        <p:column  headerText="#{msg.departNum}" sortBy="#{item.departNum}" filterBy="#{item.departNum}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.departNum}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetGroup'}">
                        <p:column  headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="handleAssetGroupChange()"  autoWidth="false" style="max-width: 150px;" height="300" value="#{assetInfoTerminatedListController.assetGroup}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    <p:ajax listener="#{assetInfoTerminatedListController.assetGroupChangeListener}" update="@(.assetGroupChange)" />
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetGroupSecondary'}">
                        <p:column  headerText="#{msg.assetGroupSecondary}" sortBy="#{item.assetGroupSecondary}" filterBy="#{item.assetGroupSecondary}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroupSecondary_'.concat(item.assetGroup), item.assetGroupSecondary)}"/>

                            <f:facet name="filter">
                                <p:selectOneMenu id="assetGroupSeconday" onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" height="300" class="assetGroupChange" value="#{assetInfoTerminatedListController.assetGroupSecondary}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{assetInfoTerminatedListController.assetGroupSecondayList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    <p:ajax listener="#{assetInfoTerminatedListController.assetGroupSecondaryChangeListener}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetDeptName'}">
                        <p:column headerText="#{msg.assetDeptName}"  width="100">
                            <f:facet name="header">
                                <h:outputText value="#{msg.assetDeptName}"/><br/>
                                <p:autoComplete dropdown="true" value="#{assetInfoTerminatedListController.filterAssetDeptOrg}" appendTo="@(Body)"
                                                scrollHeight="300"  forceSelection="true" completeMethod="#{assetInfoTerminatedListController.autoCompleteDeptName}" size="5">
                                    <p:ajax event="itemSelect" listener="#{assetInfoTerminatedListController.onAssetDeptNameFilterChange}" process="@this"  update=":woTab:AssetInfoListForm:datalist" />
                                    <p:ajax process="@this" listener="#{assetInfoTerminatedListController.onAssetDeptNameFilterChange}" update=":woTab:AssetInfoListForm:datalist" />
                                </p:autoComplete>
                            </f:facet>
                            <h:outputText value="#{item.assetDeptOrg.shortName}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'clinicalDeptName'}">
                        <p:column headerText="#{msg.clinicalDeptName}"  width="100">
                            <f:facet name="header">
                                <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                                <p:autoComplete dropdown="true" value="#{assetInfoTerminatedListController.filterClinicalDeptOrg}" appendTo="@(Body)"
                                                scrollHeight="300"  forceSelection="true" completeMethod="#{assetInfoTerminatedListController.autoCompleteDeptName}" size="5">
                                    <p:ajax event="itemSelect" listener="#{assetInfoTerminatedListController.onClinicalDeptNameFilterChange}" process="@this"  update=":woTab:AssetInfoListForm:datalist" />
                                    <p:ajax process="@this" listener="#{assetInfoTerminatedListController.onClinicalDeptNameFilterChange}" update=":woTab:AssetInfoListForm:datalist" />
                                </p:autoComplete>
                            </f:facet>
                            <h:outputText value="#{item.clinicalDeptOrg.shortName}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'nationalStandardCode'}">
                        <p:column headerText="#{msg.nationalStandardCode}"  >
                            <h:outputText value="#{item.nationalStandardCode}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'manufacture'}">
                        <p:column headerText="#{msg.manufacture}" sortBy="#{item.manufacture}" filterBy="#{item.manufacture}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.manufacture}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'vendor'}">
                        <p:column headerText="#{msg.vendor}" sortBy="#{item.vendor}" filterBy="#{item.vendor}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.vendor}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'subjectProject'}">
                        <p:column headerText="#{msg.subjectProject}" sortBy="#{item.subjectProject}" filterBy="#{item.subjectProject}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.subjectProject}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'warrantyDate'}">
                        <p:column  headerText="#{msg.warrantyDate}" sortBy="#{item.warrantyDate}" filterBy="#{item.warrantyDate}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterWarrantyDate" widgetVar="varFilterWarrantyDate" value="#{assetInfoTerminatedListController.warrantyFormatTime}"/>
                            </f:facet>
                            <h:outputText value="#{item.warrantyDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'createdDate'}">
                        <p:column  headerText="#{msg.createdDate}" sortBy="#{item.createdDate}" filterBy="#{item.createdDate}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterCreatedDate" widgetVar="varFilterCreatedDate" value="#{assetInfoTerminatedListController.selectedObject['createdDate']}"/>
                            </f:facet>
                            <h:outputText value="#{item.createdDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'financingNum'}">
                        <p:column headerText="#{msg.financingNum}" exportable="true" sortBy="#{item.financingNum}" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.financingNum}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'qrCode'}">
                        <p:column headerText="#{msg.QRCode}" exportable="true" width="150" sortBy="#{item.qrCode}" filterBy="#{item.qrCode}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.qrCode}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'aliasName'}">
                        <p:column  headerText="#{msg.aliasName}" sortBy="#{item.aliasName}" filterBy="#{item.aliasName}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.aliasName}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetOwnerName'}" >
                        <p:column  headerText="#{msg.assetOwnerName}" sortBy="#{item.assetOwnerName}" filterBy="#{item.assetOwnerName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetOwnerName}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetOwnerTel'}">
                        <p:column  headerText="#{msg.assetOwnerTel}" sortBy="#{item.assetOwnerTel}" filterBy="#{item.assetOwnerTel}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetOwnerTel}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetOwnerName2'}" >
                        <p:column  headerText="#{msg.assetOwnerName2}" sortBy="#{item.assetOwnerName2}" filterBy="#{item.assetOwnerName2}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetOwnerName2}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetOwnerTel2'}">
                        <p:column headerText="#{msg.assetOwnerTel2}" sortBy="#{item.assetOwnerTel2}" filterBy="#{item.assetOwnerTel2}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetOwnerTel2}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetOwnerName3'}">
                        <p:column headerText="#{msg.assetOwnerName3}" sortBy="#{item.assetOwnerName3}" filterBy="#{item.assetOwnerName3}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetOwnerName3}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetOwnerTel3'}">
                        <p:column headerText="#{msg.assetOwnerTel3}" sortBy="#{item.assetOwnerTel3}" filterBy="#{item.assetOwnerTel3}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetOwnerTel3}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'clinicalOwnerName'}">
                        <p:column headerText="#{msg.clinicalOwnerName}" sortBy="#{item.clinicalOwnerName}" filterBy="#{item.clinicalOwnerName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.clinicalOwnerName}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'clinicalOwnerTel'}">
                        <p:column headerText="#{msg.clinicalOwnerTel}" sortBy="#{item.clinicalOwnerTel}" filterBy="#{item.clinicalOwnerTel}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.clinicalOwnerTel}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetUsage'}">
                        <p:column id="assetUsage" headerText="#{msg.assetUsage}" sortBy="#{item.assetUsage}" filterBy="#{item.assetUsage}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetUsage', item.assetUsage)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetUsage')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetValueCategory'}">
                        <p:column headerText="#{msg.assetValueCategory}" >
                            <h:outputText value="#{fieldMsg.fieldValue('assetValueCategory', item.assetValueCategory)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'capitalSource'}">
                        <p:column id="capitalSource" headerText="#{msg.capitalSource}" sortBy="#{item.capitalSource}" filterBy="#{item.capitalSource}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('capitalSource', item.capitalSource)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('capitalSource')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>

                    </c:if>
                    <c:if test="#{columnItem eq 'capitalSource2'}">
                        <p:column id="capitalSource2" headerText="#{msg.capitalSource2}" sortBy="#{item.capitalSource2}" filterBy="#{item.capitalSource2}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('capitalSource2', item.capitalSource2)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('capitalSource2')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'measureGrade'}">
                        <p:column headerText="#{msg.measureGrade}" >
                            <h:outputText value="#{fieldMsg.fieldValue('measureGrade', item.measureGrade)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'riskGrade'}">
                        <p:column headerText="#{msg.riskGrade}" >
                            <h:outputText value="#{fieldMsg.fieldValue('riskGrade', item.riskGrade)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'emergencyEquipment'}">
                        <p:column id="emergencyEquipment" headerText="#{msg.emergencyEquipment}" sortBy="#{item.emergencyEquipment}" filterBy="#{item.emergencyEquipment}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('emergencyEquipment', item.emergencyEquipment)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('emergencyEquipment')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'importEquipment'}">
                        <p:column id="importEquipment" headerText="#{msg.importEquipment}" sortBy="#{item.importEquipment}" filterBy="#{item.importEquipment}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('importEquipment', item.importEquipment)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('importEquipment')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'measuringItemCategory'}">
                        <p:column headerText="#{msg.measuringItemCategory}" >
                            <h:outputText value="#{fieldMsg.fieldValue('measuringItemCategory', item.measuringItemCategory)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'accountingCategory'}">
                        <p:column headerText="#{msg.accountingCategory}" >
                            <h:outputText value="#{fieldMsg.fieldValue('accountingCategory', item.accountingCategory)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'siteUID'}">
                        <p:column headerText="#{msg.hospitalId}">
                            <h:outputText value="#{assetInfoTerminatedListController.getSiteOrgName(item.siteUID)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'parentAssetId'}">
                        <p:column headerText="#{msg.parentAsset}" >
                            <h:outputText value="#{assetInfoTerminatedListController.getParentAssetNameByAssetId(item.id)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'systemId'}">
                        <p:column  headerText="#{msg.systemId}" sortBy="#{item.systemId}" filterBy="#{item.systemId}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.systemId}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'functionGroup'}">
                        <p:column headerText="#{msg.functionGroup}" >
                            <h:outputText value="#{fieldMsg.fieldValue('assetFunctionType',item.functionGroup)}"/>
                        </p:column>
                    </c:if>
                    <c:if test="#{columnItem eq 'assetCode68'}">
                        <p:column headerText="#{msg.assetCode68}"  >
                            <h:outputText value="#{fieldMsg.fieldValue(item.functionGroup,item.assetCode68)}"/>
                        </p:column>
                    </c:if>
