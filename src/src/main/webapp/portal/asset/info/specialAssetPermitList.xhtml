<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">



    <ui:define name="content">
        <script type="text/javascript">
            function handleAssetGroupChange(selection) {
                var ct = document.getElementById('SpecialAssetPermitInfoListForm:datalist:assetGroupSeconday_input');
                if (ct) {
                    ct.value = '';
                }

                PF('varDataList').filter();
            }
        </script>

        <style>
            .warrantyExpireSoon {
                background-color: #fca752 !important;
                color: #000000 !important;
            }

            .warrantyExpired {
                background-color: #f04134 !important;
                color: #000000 !important;
            }

            .btn + .btn {
                margin-left: 0
            }

            .ui-column-resizer:before {
                content: none !important;
            }

            th {
                font-size: 12px !important;
            }

            td {
                font-size: 12px !important;
                padding: 0px !important;
            }

            table .ui-chkbox-icon, td img {
                zoom: 0.7 !important
            }
        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="特种设备证照管理"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="searchForm">

                    <h:panelGrid id="searchPanel" columns="3">
                        <h:panelGroup rendered="#{!userContextService.hasAnyRoleByApmRoles('MVSAdmin','MVSFE')}">
                            <p:commandButton id="btnOrg"
                                             value="#{empty specialAssetPermitInfoController.selectSite? msg.AllHospitals:specialAssetPermitInfoController.selectSite.name}"
                                             type="button" icon="fa fa-angle-down" iconPos="right"/>
                            <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false"
                                            modal="false">
                                <p:inputText id="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
                                <p:commandButton partialSubmit="true" icon="ui-icon-search"
                                                 process=":searchForm:treeNodeNameFilter @this"
                                                 update="searchForm:orgTree"
                                                 actionListener="#{orgTreeController.filterTreeNodeByName()}"
                                                 value="#{msg.Search}"/>
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;"
                                            value="#{orgTreeController.siteOrgTree}"
                                            selection="#{orgTreeController.selectedOrgNode}" var="node"
                                            selectionMode="single" dynamic="true">
                                        <p:ajax process="@this" event="select"
                                                listener="#{specialAssetPermitInfoController.onSelectSiteTreeNode}"
                                                update=":SpecialAssetPermitInfoListForm"
                                                oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
                <h:form id="SpecialAssetPermitInfoListForm">
                    <p:dataTable id="datalist" value="#{specialAssetPermitInfoController.lazyModel}" var="item"
                                 widgetVar="varDataList" resizableColumns="true" liveResize="true" resizeMode="fit"
                                 selectionMode="single" scrollable="false"
                                 selection="#{specialAssetPermitInfoController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"

                                 rowKey="#{item.uid}" sortMode="single"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.JumpTo} {JumpToPageDropdown} #{msg.Page} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rowIndexVar="idx"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" listener="#{specialAssetPermitInfoController.onSelectAsset}"
                                onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)"
                                update="createButton  deleteButton "/>
                        <p:ajax event="filter" listener="#{specialAssetPermitInfoController.onFilter}"
                                oncomplete="updateSelectAllCheckBox();"/>
                        <p:ajax event="page" oncomplete="updateSelectAllCheckBox();"/>
<!--                        <p:column width="36" id="checkBoxColumn">-->
<!--                            <p:selectBooleanCheckbox value="#{specialAssetPermitInfoController.selectedMap[item.id]}"-->
<!--                                                     class="selectCheckBox">-->
<!--                                <p:ajax process="@this" update="@this @(.batch-terminated)"-->
<!--                                        oncomplete="updateSelectAllCheckBox();"/>-->
<!--                            </p:selectBooleanCheckbox>-->
<!--                            <f:facet name="header">-->
<!--                                <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">-->
<!--                                    <p:ajax listener="#{specialAssetPermitInfoController.onSelectAllOfPage}"-->
<!--                                            update="@(.selectCheckBox) :SpecialAssetPermitInfoListForm:datalist"-->
<!--                                            oncomplete="updateSelectAllCheckBox();"/>-->
<!--                                </p:selectBooleanCheckbox>-->
<!--                            </f:facet>-->
<!--                        </p:column>-->
                        <p:column headerText="操 作" exportable="false"
                                  width="#{userContextService.hasRole('AssetHead')?60:30}" id="operatorColumn">
                            <h:panelGroup>
                                <p:link target="_new" title="#{msg.Edit}"
                                        outcome="#{specialAssetPermitInfoController.getEditPage(item.uid,item.certificateName)}"
                                        rendered="#{userContextService.accessContainsFunctionMenu('SPECIALASSET_PERMIT_EDIT')}">
                                    <p:graphicImage name="icons/edit.png" style="width: 30px; height: 30px;"/>
                                </p:link>
                                <p:commandLink
                                        rendered="#{userContextService.accessContainsFunctionMenu('SPECIALASSET_PERMIT_EDIT')}"
                                        id="deleteButton" title="#{msg.Delete}"
                                        actionListener="#{specialAssetPermitInfoController.deleteAssetPermit(item)}" update="datalist">
                                    <p:graphicImage name="icons/delete.png" style="width: 30px; height: 30px;"/>
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                               icon="ui-icon-warning"/>
                                </p:commandLink>
                            </h:panelGroup>

                        </p:column>
                        <p:column headerText="持证人姓名"
                                  sortBy="#{item.holder}" filterBy="#{item.holder}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.holder}"/>
                        </p:column>
                        <p:column headerText="持有证照名称" sortBy="#{item.certificateName}"
                                  filterBy="#{item.certificateName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.certificateName}"/>
                        </p:column>
                        <p:column headerText="持有证照类型" sortBy="#{item.certificateType}"
                                  filterBy="#{item.certificateType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.certificateType}"/>
                        </p:column>
                        <p:column  headerText="持有证照有效开始时间" sortBy="#{item.effectiveTime}" filterBy="#{item.effectiveTime}" filterMatchMode="GTE">
<!--                            <f:facet name="filter">-->
<!--                                <p:inputText id="filterCreatedDate" widgetVar="varFilterCreatedDate" value="#{assetInfoListController.selectedObject['createdDate']}"/>-->
<!--                            </f:facet>-->
                            <h:outputText value="#{item.effectiveTime}">
                                <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                            </h:outputText>
                        </p:column>
                        <p:column  headerText="持有证照有效结束时间" sortBy="#{item.expiryDate}" filterBy="#{item.expiryDate}" filterMatchMode="GTE">
                            <!--                            <f:facet name="filter">-->
                            <!--                                <p:inputText id="filterCreatedDate" widgetVar="varFilterCreatedDate" value="#{assetInfoListController.selectedObject['createdDate']}"/>-->
                            <!--                            </f:facet>-->
                            <h:outputText value="#{item.expiryDate}">
                                <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                            </h:outputText>
                        </p:column>


                        <f:facet name="{Toolbar}">

                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray"
                                             title="#{msg.Create}"
                                             rendered="#{userContextService.accessContainsFunctionMenu('SPECIALASSET_PERMIT_EDIT')}"
                                             actionListener="#{specialAssetPermitInfoController.prepareCreate}"
                                             action="#{urlEncryptController.encodeUrlParam('SpecialAssetPermitCreate.xhtml?actionName=Create')}"

                            />
                        </f:facet>
                    </p:dataTable>

                    <p:remoteCommand name="rc"
                                     update=":SpecialAssetPermitInfoListForm:datalist datalist:createButton datalist:deleteButton "
                                     immediate="true"/>
                </h:form>
            </div>
        </div>

        <script>

            function afterLoadRender() {
                $(".ui-datatable-tablewrapper").css('width', '100%');
                $("div table")[1].style.overflowX = "scroll";
                $("div table")[1].style.width = "auto";
                $("html")[0].style.overflowX = "hidden";
            }

            $(function () {
                $(".ui-datatable-tablewrapper").css('width', '100%');
                $("div table")[1].style.overflowX = "scroll";
                $("div table")[1].style.width = "auto";
                $("html")[0].style.overflowX = "hidden";
            });

            //<![CDATA[
            afterPageLoad = function () {
                $("#searchForm\\:searchText").keypress(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                    }
                })
                var isActive = "#{userContextService.isActive()}";
                if (isActive == '1') {
                    PF('ActiveDlg').show();
                }
            }
            var newWin;

            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }

            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }

            function changeDiaLog() {
                PF('relRuleAssetDialog').hide();
                PF('redirectDialog').show();
            }

            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#SpecialAssetPermitInfoListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }

            //]]>
        </script>
    </ui:define>
</ui:composition>
