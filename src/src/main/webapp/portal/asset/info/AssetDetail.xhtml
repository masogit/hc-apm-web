<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="head">
        <h:outputStylesheet name="css/assetUsageAll.css"/>
        <h:outputScript name="js/assetUsageAll.js"/>
    </ui:define>
    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{assetInfoDetailController.terminate? msg.TerminateAssetInfoDetail :msg.AssetInfoDetail}"/>
            </div>

        </div>

        <div class="ui-g-12 card" >
            <h:panelGroup rendered="#{!assetInfoDetailController.terminate and userContextService.hasAnyRole('SuperAdmin,HospitalHead,AssetHead,AssetStaff,DeptHead')}">
                <p:link outcome="/portal/analysis/assetUsageSingle.xhtml" value="#{msg.DeviceUtilizationAnalysis}">
                    <f:param name="asset_name" value="#{assetInfoDetailController.selected.name}" />
                    <f:param name="asset_id" value="#{assetInfoDetailController.selected.id}" />
                </p:link>
                <br/>
            </h:panelGroup>

            <p:accordionPanel id="accordion" multiple="false" >
                <p:tab title="#{msg.BasicInfo}">
                    <div class="ui-g">
                        <div class="ui-g-8 ui-g-nopad">
                            <p:panelGrid id="basicPanel" columns="4"  layout="grid" styleClass="ui-panelgrid-blank">
                                <c:forEach items="#{assetInfoDetailController.customConfig.assetsDetailpageBasicFields}" var="fieldItem" >
                                    <ui:include src="customViewFields.xhtml"/>
                                </c:forEach>
                            </p:panelGrid>
                        </div>
                        <div class="ui-g-4">
                            <p:galleria value="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,1)}" var="attach" panelWidth="300" panelHeight="200" showCaption="false" rendered="#{!empty assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,1)}">
                                <p:graphicImage url="#{fileDownloadService.getFileUrl(attach.objectStorageId)}" style="max-width: auto;height: 100%;" onclick="javascript:showthis(this);"/>
                            </p:galleria>
                        </div>
                    </div>
                </p:tab>
            </p:accordionPanel>
            <p:accordionPanel id="accordion2">
                <p:tab title="#{msg.AssetInfoDetail}">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-g-nopad">
                            <p:panelGrid id="detailPanel" columns="4"  layout="grid" styleClass="ui-panelgrid-blank">
                                <c:forEach items="#{assetInfoDetailController.customConfig.assetsDetailpageDetailFields}" var="fieldItem" >
                                    <ui:include src="customViewFields.xhtml"/>
                                </c:forEach>
                            </p:panelGrid>
                        </div>
                    </div>
                </p:tab>
            </p:accordionPanel>

            <h:form>
                <p:panelGrid columns="2"  layout="grid" styleClass="ui-panelgrid-blank">

                    <p:panel  header="#{msg.MaintainanceRecord}">
                        <f:facet name="actions">
                            <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default"  action="/portal/woMgr/workOrderList?faces-redirect=true"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                            <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default"  action="#{urlEncryptController.encodeUrlParam('/portal/woMgr/workOrderList?faces-redirect=true&amp;assetUID='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-add" /></h:commandLink>
                        </f:facet>

                        <p:dataTable var="item" value="#{inspectionServiceController.getWorkOrderList(assetInfoDetailController.selected.id, 3)}" emptyMessage="#{msg.noRecordFound}">
                            <p:column styleClass="textCenter"  headerText="#{msg.casePriority}" >
                                <h:outputText value="#{item.casePriority}" class="priorityItem priorityItem#{item.casePriority}"/>
                            </p:column>
                            <p:column headerText="#{msg.requestTime}" >
                                <h:outputText value="#{item.requestTime}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.requestReason}" >
                                <h:outputText value="#{item.requestReason}"/>
                            </p:column>
                            <p:column headerText="#{msg.requestorName}" >
                                <h:outputText value="#{item.requestorName}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panel>

                    <p:panel  header="#{msg.MetrologyMonitor}">
                        <f:facet name="actions">
                            <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="/portal/measuring/measuringResultMain?faces-redirect=true"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                            <!--<h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="#{urlEncryptController.encodeUrlParam('/portal/insp/MetrologyOrderCreate?faces-redirect=true&amp;actionName=Create')}"><h:outputText styleClass="ui-icon ui-icon-add" /></h:commandLink>-->
                        </f:facet>

                        <p:dataTable var="item" value="#{inspectionServiceController.getInspectionOrderList(assetInfoDetailController.selected.id, 2, 3)}" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="#{msg.createTime}">
                                <h:outputText value="#{item.createTime}" />
                            </p:column>
                            <p:column headerText="#{msg.creatorName}">
                                <h:outputText value="#{item.creatorName}" />
                            </p:column>
                            <p:column headerText="#{msg.ownerId}">
                                <h:outputText value="#{item.ownerName}" />
                            </p:column>
                            <p:column headerText="#{msg.examStartTime}">
                                <h:outputText value="#{item.startTime}" >
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.endTime}">
                                <h:outputText value="#{item.endTime}" />
                            </p:column>
                        </p:dataTable>
                    </p:panel>
                    <!--test-->
                    <p:panel  header="内部保养记录">
                        <f:facet name="actions">
                            <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="/portal/pm/pmOrderListAll?faces-redirect=true"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                        </f:facet>
                        <p:dataTable var="item" value="#{inspectionServiceController.getPmOrderList(assetInfoDetailController.selected.uid,3)}" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="创建人" >
                                <h:outputText value="#{item.creatorName}"/>
                            </p:column>
                            <p:column headerText="保养编号" >
                                <h:outputText value="#{item.pmNum}"/>
                            </p:column>
                            <p:column headerText="当前处理步骤" >
                                <h:outputText value="#{item.currentStepName}"/>
                            </p:column>
                            <p:column headerText="当前处理人" >
                                <h:outputText value="#{item.currentPersonName}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panel>
                    <p:panel  header="远程保养记录">
                        <f:facet name="actions">
                            <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="/portal/pm/pmOrderListAll?faces-redirect=true"><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                        </f:facet>
                        <p:dataTable var="item" value="#{assetInfoDetailController.getPmScheduleData('epm')}" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="保养编号" >
                                <h:outputText value="#{item.assetNum}"/>
                            </p:column>
                            <p:column headerText="关单日期" >
                                <h:outputText value="#{item.closeDate}"/>
                            </p:column>
                            <p:column headerText="当前处理步骤" >
                                <h:outputText value="#{item.scheduleDate}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panel>
                </p:panelGrid>
            </h:form>

            <p:fieldset  style="margin-bottom:20px" rendered="#{assetInfoDetailController.selected.assetGroup eq 1 and not empty assetUsageSingleController.deviceExpo.series}">
                <!-- Chart 2: Device Exposure -->
                <div class="ui-g-12">
                    <div class="block">
                        <h3 class="block-title">#{msg.deviceExpohd}</h3>
                        <p:chart id="exposure_bar" type="line" model="#{assetUsageSingleController.deviceExpo}" 
                                 responsive="true"/>
                    </div>
                </div>
            </p:fieldset>
            <p:fieldset  style="margin-bottom:20px" rendered="#{assetInfoDetailController.selected.assetGroup eq 1 and not empty assetUsageSingleController.deviceScan.series}">
                <!-- Chart 1: Device Scan --> 
                <div class="ui-g-12">
                    <div class="block">
                        <h3 class="block-title">#{msg.deviceScanhd}</h3>
                        <p:chart id="scan_bar" type="line"
                                 model="#{assetUsageSingleController.deviceScan}" responsive="true"/>
                    </div>
                </div>
            </p:fieldset>
            <h:form>
                <p:panel  header="相关设备" rendered="#{assetInfoDetailController.showParentsTree()}">
                    <p:treeTable styleClass="ui-datatable"  value="#{assetInfoDetailController.getParentsRelationTree()}" var="assetItem">
                        <f:facet name="header" />
                        <p:column headerText="#{msg.name}">
                            <h:outputText value="#{assetItem.name}" />
                        </p:column>
                        <p:column headerText="#{msg.serialNum}">
                            <h:outputText value="#{assetItem.serialNum}" />
                        </p:column>
                        <p:column headerText="#{msg.financingNum}">
                            <h:outputText value="#{assetItem.financingNum}" />
                        </p:column>
                        <p:column headerText="#{msg.departNum}">
                            <h:outputText value="#{assetItem.departNum}" />
                        </p:column>
                        <p:column >
                            <!--<p:commandLink value="#{msg.View}" action="#{assetInfoDetailController.getDetailPageLink(assetItem.uid)}" disabled="#{assetItem.uid eq assetInfoDetailController.selected.uid}"/>-->
                            <p:link  outcome="#{assetInfoDetailController.getDetailPageLink(assetItem.uid)}" disabled="#{assetItem.uid eq assetInfoDetailController.selected.uid}" >#{msg.View}</p:link>
                        </p:column>

                    </p:treeTable>

                </p:panel>

                <p:panel  header="设备相关合同">
                    <f:facet name="actions">
                        <h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="#{urlEncryptController.encodeUrlParam('/portal/asset/contract/ContractList?faces-redirect=true&amp;assetUid='.concat(assetInfoDetailController.selected.uid))}" ><h:outputText styleClass="ui-icon ui-icon-fullscreen" /></h:commandLink>
                        <!--<h:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="#{urlEncryptController.encodeUrlParam('/portal/asset/contract/ContractEdit?faces-redirect=true&amp;action=Create&amp;assetId='.concat(assetInfoDetailController.selected.uid))}"><h:outputText styleClass="ui-icon ui-icon-add" /></h:commandLink>-->
                    </f:facet>
                    <p:dataTable var="item" value="#{assetInfoService.getContractList(assetInfoDetailController.selected.uid)}" emptyMessage="#{msg.noRecordFound}">
                        <p:column headerText="#{msg.name}" >
                            <h:outputText value="#{item.contractInfo.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.startTime}"  >

                            <h:outputText value="#{item.contractInfo.startDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.endTime}" >

                            <h:outputText value="#{item.contractInfo.endDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.AssetContractAmount}" sortBy="#{item.contractAmount}" >
                            <h:outputText value="#{item.contractInfo.amount}"/>
                        </p:column>
                        <p:column   >
                            <!--<p:commandLink action="#{urlEncryptController.encodeUrlParam('/portal/asset/contract/ContractEdit?faces-redirect=true&amp;action=Edit&amp;selectedid='.concat(item.contractInfo.id))}" value="查看" />-->
                            <p:link outcome="#{urlEncryptController.encodeUrlParam('/portal/asset/contract/ContractEdit?faces-redirect=true&amp;action=Edit&amp;selectedid='.concat(item.contractInfo.id))}">查看</p:link>
                        </p:column>
                    </p:dataTable>
                </p:panel>


                <p:tabView>
                    <p:tab title="#{fieldMsg.fieldValue('attachmentType', 1)}">
                        <p:dataList value="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,1)}" var="fileitem" type="ordered" emptyMessage="#{msg.noRecordFound}">
                            <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>
                        </p:dataList>
                    </p:tab>
                    <p:tab title="#{fieldMsg.fieldValue('attachmentType', 2)}">
                        <p:dataList value="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,2)}" var="fileitem" type="ordered" emptyMessage="#{msg.noRecordFound}">
                            <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>
                        </p:dataList>
                    </p:tab>
                    <p:tab title="#{fieldMsg.fieldValue('attachmentType', 3)}">
                        <p:dataList value="#{assetInfoDetailController.getAttachList(assetInfoDetailController.selected.uid,3)}" var="fileitem" type="ordered" emptyMessage="#{msg.noRecordFound}">
                            <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}">#{fileitem.objectName}</p:link>
                        </p:dataList>
                    </p:tab>
                    <p:tab title="#{msg.QRCode}" rendered="#{not empty assetInfoDetailController.selected.qrCode}">
                        <img src="#{qrCodeShowController.getQrCodeImageBase64(assetInfoDetailController.selected.qrCode,assetInfoDetailController.selected.siteUID)}" />
                    </p:tab>
                </p:tabView>
            </h:form>

            <h:panelGroup >
                <p:commandButton id="returnButton" value="#{msg.Return}" icon="ui-icon-arrow-back" action="#{assetInfoDetailController.getListPageLink()}" immediate="true"  update=":growl" style="float:left"/>

            </h:panelGroup>
        </div>
        <div id="shwoPicDialog" class="ui-dialog ui-widget ui-widget-content ui-corner-all ui-shadow ui-hidden-container" style="max-width: 800px;max-height:600px;min-width:800px;min-height:600px">
            <div class="ui-dialog-titlebar ui-widget-header ui-helper-clearfix ui-corner-top">
                <span id="shwoPicDialog_title" class="ui-dialog-title">图片</span><a href="#" class="ui-dialog-titlebar-icon ui-dialog-titlebar-close ui-corner-all" aria-label="Close">
                    <span class="ui-icon ui-icon-closethick"></span></a>
                <a href="#" class="ui-dialog-titlebar-icon ui-dialog-titlebar-maximize ui-corner-all"><span class="ui-icon ui-icon-extlink"></span></a>
            </div>
            <div class="ui-dialog-content ui-widget-content"  style="max-width: 800px;max-height:600px;min-width:800px;min-height:600px">

                <image id="shwoPicDialogImg" src="" ></image>
            </div>
        </div>
        <script id="shwoPicDialog_s" type="text/javascript">$(function () {
                PrimeFaces.cw("Dialog", "shwoPicDialog", {id: "shwoPicDialog", modal: true, appendTo: "@(body)"});
            });
        </script>
        <script>
            afterPageLoad = function () {
                $(".jqplot-table-legend").css("display", "none");
            }

            function showthis(pic) {
                var s = $('#shwoPicDialogImg')[0]
                s.src = pic.src;
                PF('shwoPicDialog').show();
            }
        </script>
    </ui:define>
</ui:composition>
