<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="TerminationCauseEditDlg" widgetVar="TerminationCauseEditDlg" width="650" height="250" modal="true"
              resizable="true" draggable="true" onHide="#{assetInfoToBeTerminatedListController.isChecked()}"
              header="#{msg.TerminationAppraisal}">
        <h:form id="TerminationCauseEditForm">
            <h:panelGroup id="display" class="TerminationCauseEditDlg">
                <p:fieldset id="basic" legend="#{msg.TerminationAppraisal}">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label>#{msg.deviceStatus}：&nbsp;&nbsp;#{msg.ToBeTerminated}</label>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label>#{msg.terminationCause}：</label>
                            <p:selectOneMenu id="cause"
                                             value="#{assetInfoToBeTerminatedListController.terminationCause}"
                                             style="width:250px">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue=""/>
                                <f:selectItem itemLabel="#{msg.LifeCycleBeyond}" itemValue="msg.LifeCycleBeyond"/>
                                <f:selectItem itemLabel="#{msg.MainFunctionIsDamaged}" itemValue="#{msg.MainFunctionIsDamaged}"/>
                                <f:selectItem itemLabel="#{msg.TheEquipmentIsDefective}" itemValue="#{msg.TheEquipmentIsDefective}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="true"
                                 actionListener="#{assetInfoToBeTerminatedListController.saveTerminationCause}"
                                 value="#{msg.Save}" icon="ui-icon-check"
                                 update=":growl :woTab:AssetInfoListForm1:datalist"
                                 oncomplete="handleSubmit(args, 'TerminationCauseEditDlg');"/>
                &nbsp;&nbsp;
                <p:commandButton immediate="true" value="#{msg.Cancel}" update=":growl"
                                 icon="ui-icon-cancel" onclick="PF('TerminationCauseEditDlg').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
