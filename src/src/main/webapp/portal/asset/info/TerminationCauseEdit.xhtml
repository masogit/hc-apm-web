<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="TerminationCauseEditDlg" widgetVar="TerminationCauseEditDlg" width="650" height="250" modal="true"
              resizable="true" draggable="true" onHide="#{assetInfoToBeTerminatedListController.isChecked()}"
              header="报废鉴定">
        <h:form id="TerminationCauseEditForm">
            <h:panelGroup id="display" class="TerminationCauseEditDlg">
                <p:fieldset id="basic" legend="报废鉴定">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label>资产状态：&nbsp;&nbsp;待报废</label>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label>报废原因：</label>
                            <p:selectOneMenu id="cause"
                                             value="#{assetInfoToBeTerminatedListController.terminationCause}"
                                             style="width:250px">
                                <f:selectItem itemLabel="请选择..." itemValue=""/>
                                <f:selectItem itemLabel="使用年限超过国家或厂家规定" itemValue="使用年限超过国家或厂家规定"/>
                                <f:selectItem itemLabel="主要功能损坏，无法修复或维修成本过高" itemValue="主要功能损坏，无法修复或维修成本过高"/>
                                <f:selectItem itemLabel="设备有缺陷，国家警示需强制报废" itemValue="设备有缺陷，国家警示需强制报废"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="true"
                                 actionListener="#{assetInfoToBeTerminatedListController.saveTerminationCause}"
                                 value="#{msg.Save}" icon="ui-icon-check"
                                 update=":growl :woTab:AssetInfoListForm1:datalist"
                                 oncomplete="handleSubmit(args, 'TerminationCauseEditDlg');"/>
                &nbsp;&nbsp;
                <p:commandButton immediate="true" value="#{msg.Cancel}" update=":growl"
                                 icon="ui-icon-cancel" onclick="PF('TerminationCauseEditDlg').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
