<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="searchFormView">
            <h:panelGrid columns="1" style="float: right">
                <h:panelGroup>
                    <p:menuButton id="modifySourceFilterBtn"
                                  value="#{assetHistoryController.filterModifySourceLabel}">
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('ALL')}"
                                    value="全部" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('LEDGER_EDIT')}"
                                    value="台账编辑" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('BULK_EDIT')}"
                                    value="批量修改" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('ASSET_IMPORT')}"
                                    value="资产导入" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('MVS_IMPORT')}"
                                    value="MVS导入" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('BATCH_TRANSFER')}"
                                    value="批量转科" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('ASSET_DELETE')}"
                                    value="资产删除" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('DEPT_SECONDMENT')}"
                                    value="科室间调剂" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('CENTRAL_ALLOCATION')}"
                                    value="集中调剂" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('SITE_ADJUSTMENT')}"
                                    value="院区间调剂" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('STOCK_IN_OUT')}"
                                    value="出入库" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
<!--                        <p:menuitem style="left: 15px" immediate="true"-->
<!--                                    action="#{assetHistoryController.setFilterModifySource('SPECIAL_ASSET')}"-->
<!--                                    value="特种设备设置" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>-->
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('WORK_ORDER_UPDATE')}"
                                    value="工单更新" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
<!--                        <p:menuitem style="left: 15px" immediate="true"-->
<!--                                    action="#{assetHistoryController.setFilterModifySource('MEASURING_IMPORT')}"-->
<!--                                    value="计量导入" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>-->
<!--                        <p:menuitem style="left: 15px" immediate="true"-->
<!--                                    action="#{assetHistoryController.setFilterModifySource('SCAN_CREATE')}"-->
<!--                                    value="扫码建档" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>-->
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('QR_BINDING')}"
                                    value="二维码绑定" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
<!--                        <p:menuitem style="left: 15px" immediate="true"-->
<!--                                    action="#{assetHistoryController.setFilterModifySource('EQUIPMENT_INSTALL')}"-->
<!--                                    value="设备安装" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>-->
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('DEPT_BORROW')}"
                                    value="科室借调" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('ASSET_TRANSFER')}"
                                    value="资产转科" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
                        <p:menuitem style="left: 15px" immediate="true"
                                    action="#{assetHistoryController.setFilterModifySource('ASSET_SCRAP')}"
                                    value="资产报废" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>
<!--                        <p:menuitem style="left: 15px" immediate="true"-->
<!--                                    action="#{assetHistoryController.setFilterModifySource('BATCH_RESTORE_SCRAP')}"-->
<!--                                    value="批量恢复报废资产" update=":woTab:AssetInfoListFormView :woTab:searchFormView"/>-->
                    </p:menuButton>
                </h:panelGroup>
            </h:panelGrid>
            <h:panelGrid id="searchPanel" columns="3">
                <p:inputText id="searchText" value="#{assetHistoryController.oneSearchStr}"
                             placeholder=""
                             maxlength="100" style="width: 360px">
                </p:inputText>

                <h:panelGroup id='searchButtons'>
                    <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray"
                                     actionListener="#{assetHistoryController.doSearch}"
                                     update=":woTab:AssetInfoListFormView :woTab:searchFormView"
                                     rendered="#{empty assetHistoryController.oneSearchStr}"/>
                    <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray"
                                     action="#{assetHistoryController.setOneSearchStr('')}"
                                     actionListener="#{assetHistoryController.doSearch}"
                                     update=":woTab:AssetInfoListFormView :woTab:searchFormView"
                                     rendered="#{not empty assetHistoryController.oneSearchStr}"/>
                </h:panelGroup>
                <p:outputLabel id="trainTips" style="color: red;font-weight:bold;margin-left: 12px;font-size: small" value="#{assetHistoryController.tips}"/><br/>

            </h:panelGrid>
        </h:form>
        <h:form id="AssetInfoListFormView">

            <p:dataTable id="datalistView" value="#{assetHistoryController.lazyModel}"
                         var="item"
                         widgetVar="varDataListView" resizableColumns="false" liveResize="false"
                         resizeMode="expand"
                         scrollable="false" scrollWidth="98%"
                         selection="#{assetHistoryController.selected}"
                         lazy="true" paginator="true" paginatorPosition="both"
                         paginatorAlwaysVisible="true"
                         sortBy="#{item.createdDate}"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.JumpTo} {JumpToPageDropdown} #{msg.Page} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rowIndexVar="idx"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500">
                <p:ajax event="filter" listener="#{assetHistoryController.onFilterByAssetHistory}"/>
                <ui:include src="ImportantFieldsView.xhtml"/>
            </p:dataTable>
        </h:form>
        <p:overlayPanel widgetVar="panelFilterLastModifiedDateAll" for=":woTab:AssetInfoListFormView:datalistView:filterLastModifiedDateAll" dismissable="false">
            <h:panelGrid columns="2">
                <p:outputLabel value="#{msg.From}" />
                <p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_LastModifiedDateAll" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
                            mask="true" size="12" locale="zh" />
                <p:outputLabel value="#{msg.To}" />
                <p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_LastModifiedDateAll" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
                            mask="true" size="12" locale="zh" />
            </h:panelGrid>
            <p:commandButton
                    onclick="setDateFilter('varDataListView','varFilterLastModifiedDateAll','varStartTimeFrom_LastModifiedDateAll','varStartTimeTo_LastModifiedDateAll'); PF('panelFilterLastModifiedDateAll').hide();"
                    title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
            <p:commandButton onclick="PF('panelFilterLastModifiedDateAll').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;" />
        </p:overlayPanel>
    </div>
</ui:composition>
</html>
