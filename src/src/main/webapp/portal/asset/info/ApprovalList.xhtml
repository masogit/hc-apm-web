<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="新增资产审核"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="AssetInfoApprovalListForm">
                    <p:dataTable id="datalist" value="#{assetInfoApprovalController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{assetInfoApprovalController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}" 
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,40,60,90">

                        <p:ajax  event="rowSelect" update="viewButton" oncomplete="selectRow();"/>
                        <!--<p:ajax  event="rowSelect" update="viewButton" listener="#{assetInfoApprovalController.onSelectAsset()}"  onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)" />-->
                        <p:ajax event="filter" listener="#{assetInfoApprovalController.onFilter}" oncomplete="rc();"/>

                        <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                        <p:column headerText="#{msg.serialNum}" sortBy="#{item.serialNum}" filterBy="#{item.serialNum}" filterMatchMode="LIKE"  style="word-wrap: break-word;">
                            <h:outputText value="#{item.serialNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.departNum}" sortBy="#{item.departNum}" filterBy="#{item.departNum}" filterMatchMode="LIKE"  style="word-wrap: break-word;">
                            <h:outputText value="#{item.departNum}"/>
                        </p:column>

                        <p:column headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.clinicalDeptName}">
                            <f:facet name="header">
                                <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                                <p:inputText id="clinicalDept"  value="#{assetInfoApprovalController.fileterOrg.name}"  readonly="true"/>
                            </f:facet>
                            <h:outputText value="#{item.clinicalDeptName}"/>
                        </p:column>
                        <p:column headerText="#{msg.nationalStandardCode}"  visible="false" exportable="true">
                            <h:outputText value="#{item.nationalStandardCode}"/>
                        </p:column>

                        <p:column headerText="#{msg.brand}" sortBy="#{item.brand.name}" filterBy="#{item.brand.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.brand.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.manufacture}" sortBy="#{item.manufacture}" filterBy="#{item.manufacture}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.manufacture}"/>
                        </p:column>
                        <p:column headerText="#{msg.vendor}" sortBy="#{item.vendor}" filterBy="#{item.vendor}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.vendor}"/>
                        </p:column>
                        <p:column headerText="#{msg.financingNum}" visible="true" exportable="true" sortBy="#{item.financingNum}" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.financingNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.QRCode}" visible="true" exportable="true" width="150" sortBy="#{item.qrCode}" filterBy="#{item.qrCode}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.qrCode}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton rendered="false" id="viewButton" icon="ui-icon-check" class="btn btn-sm btn-gray" title="审核" disabled="#{empty assetInfoApprovalController.selected}" action="#{assetInfoApprovalController.checkItem()}" />

                        </f:facet>
                    </p:dataTable>
                    <p:remoteCommand name="rc" update="datalist:viewButton " immediate="true"/>
                    <p:remoteCommand name="selectRow" immediate="true" action="#{assetInfoApprovalController.checkItem()}" />
                </h:form>
            </div>
        </div>

        <p:overlayPanel id="idVarPanelDeptOrg" widgetVar="varPanelDeptOrg" for=":AssetInfoApprovalListForm:datalist:clinicalDept" dismissable="true" style="text-align: left;">
            <p:scrollPanel style="height:300px;border: 0" mode="native">
                <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.getDeptOrgTree(userContextService.loginUser.siteUID)}"  var="node" selectionMode="single" dynamic="false">
                    <p:ajax process="@this" event="select"  listener="#{assetInfoApprovalController.onClinicalDeptFilter}" update=":AssetInfoApprovalListForm:datalist :idVarPanelDeptOrg " oncomplete="PF('varPanelDeptOrg').hide();"/>
                    <p:ajax process="@this" event="expand"/>
                    <p:ajax process="@this" event="collapse"/>
                    <p:treeNode type="org">
                        <h:outputText value="#{node.name}"/>
                    </p:treeNode>
                </p:tree>
            </p:scrollPanel>
        </p:overlayPanel>
    </ui:define>
</ui:composition>
