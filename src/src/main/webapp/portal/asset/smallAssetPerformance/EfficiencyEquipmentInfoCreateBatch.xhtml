<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:apm="http://www.ge.com/tags/apm">

<ui:composition>
    <p:dialog id="efficiencyEquipmentInfotSettingEditBatch" width="75%" height="600"
              widgetVar="efficiencyEquipmentInfotSettingEditBatch" modal="true" resizable="true" draggable="true" appendTo="@(body)"
              header="新增效益设备">
        <div class="ui-g-12 card">
            <h:form id="efficiencyEquipmentBatchForm">


                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                        <h:panelGroup>
                            <label class="label">#{msg.hospitalId}<span style="color:red">*</span></label>
                            <apm:selectSiteOrgByOrgTree update="@(form)" />

                        </h:panelGroup>


                        <h:panelGroup>
                            <label class="label">#{msg.clinicalDeptName}<span style="color:red">*</span></label>
                            <p:autoComplete id="clinicalDeptName" required="true" dropdown="true" value="#{efficiencyEquipmentInfoController.filterDeptOrg}"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{efficiencyEquipmentInfoController.autoCompleteDept}"
                                            var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" class="SiteUIDChange">
                                <p:ajax event="itemSelect" listener="#{efficiencyEquipmentInfoController.onClinicalDeptChange()}"  update="pickList" />

                            </p:autoComplete>
                        </h:panelGroup>

                    </p:panelGrid>



<!--                <p:pickList id="pickList" value="#{efficiencyEquipmentInfoController.assets}"-->
<!--                            var="asset" itemLabel="#{asset}" itemValue="#{asset}"-->
<!--                            showSourceFilter="false" showTargetFilter="false" responsive="true"-->
<!--                            filterMatchMode="contains" converter="assetInfoConverter" class="pickList" >-->

                <p:pickList id="pickList" value="#{efficiencyEquipmentInfoController.assets}" var="asset"
                            itemValue="#{asset}" itemLabel="#{asset.name}" showCheckbox="false" responsive="true" immediate="true"
                            showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter">
                    <f:facet name="sourceCaption"><p style="padding-bottom:-200px">待选设备
                        <br/>
                        <br/>
                        <span style="width:18%;float: left">#{msg.EquipmentName}</span>
                        <span style="width:20%;float: left">#{msg.financingNum}</span>
                        <span style="width:18%;float: left">#{msg.serialNum}</span>
                        <span style="width:21%;float: left">#{msg.departNum}</span>
                        <span style="width:23%;float: left">#{msg.qrCode}</span></p>
                        <br/>
                    </f:facet>
                    <f:facet name="targetCaption"><p style="padding-bottom:-200px">已选设备
                        <br/>
                        <br/>
                        <span style="width:18%;float: left">#{msg.EquipmentName}</span>
                        <span style="width:20%;float: left">#{msg.financingNum}</span>
                        <span style="width:18%;float: left">#{msg.serialNum}</span>
                        <span style="width:21%;float: left">#{msg.departNum}</span>
                        <span style="width:23%;float: left">#{msg.qrCode}</span></p>
                        <br/>
                    </f:facet>
                    <p:column style="width:18%;float: left; ">
                        <h:outputText value="#{asset.name}"/>
                    </p:column>
                    <p:column style="width:20%;float: left;">
                        <h:outputText value="#{asset.financingNum}"/>
                    </p:column>
                    <p:column style="width:18%;float: left;">
                        <h:outputText value="#{asset.serialNum}"/>
                    </p:column>
                    <p:column style="width:21%;float: left;">
                        <h:outputText value="#{asset.departNum}"/>
                    </p:column>
                    <p:column style="width:23%;float: left;">
                        <h:outputText value="#{asset.qrCode}"/>
                    </p:column>
                </p:pickList>
                <br/>
                <br/>
                <br/>

                <p:commandButton validateClient="true" actionListener="#{efficiencyEquipmentInfoController.save}"
                                 value="#{msg.Save}" update=":EfficiencyEquipmentInfoListForm:datalist :growl"
                                 icon="ui-icon-check"
                                 oncomplete="handleSubmitDigital(args, 'efficiencyEquipmentInfotSettingEditBatch')"/>

                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('efficiencyEquipmentInfotSettingEditBatch').hide()"/>
            </h:form>

        </div>
    </p:dialog>

    <script type="text/javascript">
        function handleSubmitDigital(args, dialog) {
            if (args.validationFailed) {
                PF(dialog).show();
            } else {
                PF(dialog).hide();
            }
        }
    </script>

</ui:composition>
</html>
