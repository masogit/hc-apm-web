<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="设备绩效报表" />
			</div>

			<div class="ui-g-12 card">
				<h:form id="smallAssetPerformanceReportListForm">
					<p:dataTable id="datalist" value="#{smallAssetPerformanceReportController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single"
						selection="#{smallAssetPerformanceReportController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
						rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
						paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
						currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">

						<p:ajax event="filter" listener="#{smallAssetPerformanceReportController.onFilter}" />

						<p:column headerText="科室名称" filterBy="#{item.department}" filterMatchMode="LIKE">
							<h:outputText value="#{item.department}" />
						</p:column>
						<p:column headerText="设备名称" filterBy="#{item.assetName}" filterMatchMode="LIKE">
							<h:outputText value="#{item.assetName}" />
						</p:column>
						<p:column headerText="费别" filterBy="#{item.costType}" filterMatchMode="LIKE">
							<h:outputText value="#{item.costType}" />
						</p:column>
						<p:column headerText="项目名称" filterBy="#{item.projectName}" filterMatchMode="LIKE">
							<h:outputText value="#{item.projectName}" />
						</p:column>
						<p:column headerText="一类收费" sortBy="#{item.standard}">
							<h:outputText value="#{item.standard}" />
						</p:column>
						<p:column headerText="数量" sortBy="#{item.quantity}">
							<h:outputText value="#{item.quantity}" />
						</p:column>
						<p:column headerText="金额" sortBy="#{item.amount}">
							<h:outputText value="#{item.amount}" />
						</p:column>
						<p:column headerText="日期" sortBy="#{item.reportDate}" filterBy="#{item.reportDate}" filterMatchMode="GTE">
							<f:facet name="filter">
								<p:inputText id="filterReportDate" widgetVar="varFilterReportDate" />
							</f:facet>
							<h:outputText value="#{item.reportDate}">
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
							</h:outputText>
						</p:column>
						<f:facet name="{Toolbar}">
							<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
								<p:dataExporter type="xls" target="datalist" fileName="SmallAssetPerformanceConfigFailed_export" />
							</p:commandButton>
						</f:facet>
					</p:dataTable>
				</h:form>
				<p:overlayPanel widgetVar="panelFilterReportDate" for=":smallAssetPerformanceReportListForm:datalist:filterReportDate" dismissable="false">
					<h:panelGrid columns="2">
						<p:outputLabel value="#{msg.From}" />
						<p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_ReportDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
							mask="true" size="12" locale="zh" />
						<p:outputLabel value="#{msg.To}" />
						<p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_ReportDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
							mask="true" size="12" locale="zh" />
					</h:panelGrid>
					<p:commandButton
						onclick="setDateFilter('varDataList','varFilterReportDate','varStartTimeFrom_ReportDate','varStartTimeTo_ReportDate'); PF('panelFilterReportDate').hide();"
						title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
					<p:commandButton onclick="PF('panelFilterReportDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;" />
				</p:overlayPanel>
			</div>
		</div>
	</ui:define>
</ui:composition>
