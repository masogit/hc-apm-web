<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
	<p:dialog id="smallAssetPerformanceConfigCreateDlg" widgetVar="smallAssetPerformanceConfigCreateDialog" modal="true" resizable="true" draggable="true"
		appendTo="@(body)" header="设备绩效配置">
		<h:form id="smallAssetPerformanceConfigCreateForm">
			<p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{smallAssetPerformanceConfigController.selected != null}">

				<h:panelGroup>
					<label class="label">项目名称</label>
					<p:inputText value="#{smallAssetPerformanceConfigController.selected.projectName}" required="true" requiredMessage="项目名称不能为空" />
				</h:panelGroup>
				<h:panelGroup>
					<label class="label">项目编号</label>
					<p:inputText value="#{smallAssetPerformanceConfigController.selected.projectNumber}" />
				</h:panelGroup>
				<h:panelGroup>
					<label class="label">科室名称*</label>
					<p:autoComplete dropdown="true" value="#{smallAssetPerformanceConfigController.selectedObjectMap['clinicalDept']}" scrollHeight="300"
						forceSelection="true" required="true"
						requiredMessage="#{msg.clinicalDeptName} #{msg.ValidationRequire}" completeMethod="#{smallAssetPerformanceConfigController.autoCompleteDept}" var="t"
						itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoUidConverter" class="SiteUIDChange">
						<p:ajax event="itemSelect" listener="#{smallAssetPerformanceConfigController.onAssetDeptChange('clinicalDept')}"  />
					</p:autoComplete>
				</h:panelGroup>
				<!-- <h:panelGroup>
					<label class="label">设备名称</label>
					<p:inputText value="#{smallAssetPerformanceConfigController.selected.assetName}" required="true" requiredMessage="设备名称不能为空" />
				</h:panelGroup>
				<h:panelGroup>
					<label class="label">占比</label>
					<p:inputNumber value="#{smallAssetPerformanceConfigController.selected.rate}" required="true" minValue="0.00" maxValue="1.00" requiredMessage="占比不能为空" />
				</h:panelGroup> -->
				<h:panelGroup>
					<label class="label">增加设备*</label>
					<p:dataTable id="addAssetConfig" value="#{smallAssetPerformanceConfigController.listNewConfig}" var="item" widgetVar="addAssetConfig" lazy="false" paginator="false"
						rowKey="#{item.assetName}" rows="1000" emptyMessage="#{msg.noRecordFound}" style="width:900px">
						<p:column headerText="设备名称">
							<h:outputText value="#{item.assetName}" />
						</p:column>
						<p:column headerText="占比">
							<h:outputText value="#{item.rate}" />
						</p:column>
						<p:column headerText="#{msg.Actions}">
							<p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" update=":smallAssetPerformanceConfigTab:checkItemEditDlg"
								oncomplete="PF('checkItemEditDlg').show()" rendered="#{empty item.assetName}" />
							<p:commandButton process="@this" icon="ui-icon-edit" style="zoom:0.8;" title="#{msg.Edit}"
								actionListener="#{smallAssetPerformanceConfigController.setObjCheckItem(item)}" update=":smallAssetPerformanceConfigTab:checkItemEditDlg" oncomplete="PF('checkItemEditDlg').show()"
								rendered="#{not empty item.assetName}" />
							<p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
								actionListener="#{smallAssetPerformanceConfigController.deleteItemDetail(item)}" update=":smallAssetPerformanceConfigTab:smallAssetPerformanceConfigCreateForm:addAssetConfig"
								rendered="#{not empty item.assetName}"></p:commandButton>
						</p:column>
					</p:dataTable>
				</h:panelGroup>
			</p:panelGrid>
			<br />
			<p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{smallAssetPerformanceConfigController.save}"
				update=":smallAssetPerformanceConfigTab:smallAssetPerformanceConfigCreateDlg, :smallAssetPerformanceConfigTab:smallAssetPerformanceConfigListForm:datalist, :growl"
				icon="ui-icon-check" oncomplete="handleSubmit(args, 'smallAssetPerformanceConfigCreateDialog');" />

			<p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('smallAssetPerformanceConfigCreateDialog').hide()" />
		</h:form>
	</p:dialog>
	<p:dialog id="checkItemEditDlg" widgetVar="checkItemEditDlg" width="400" height="130" modal="true" resizable="true" draggable="true" appendTo="@(body)"
		header="#{msg.PmOrderRuleItem}">
		<h:form id="checkItemEditForm" rendered="#{smallAssetPerformanceConfigController.editConfig!=null}">
			<h:panelGroup id="display" class="checkItemEditDlg">
				<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
					<h:panelGroup>
						<label>设备名称*</label>
						<p:autoComplete dropdown="true" value="#{smallAssetPerformanceConfigController.selectedObjectMap['asset']}" scrollHeight="300"
							forceSelection="true" required="true" requiredMessage="#{msg.clinicalDeptName} #{msg.ValidationRequire}"
							completeMethod="#{smallAssetPerformanceConfigController.autoCompleteAsset}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="assetInfoConverter">
							<p:ajax event="itemSelect" listener="#{smallAssetPerformanceConfigController.onAssetChange('asset')}" />
						</p:autoComplete>
					</h:panelGroup>
					<h:panelGroup>
						<label>占比*</label>
						<p:inputText id="description" value="#{smallAssetPerformanceConfigController.editConfig.rate}" required="true" />
					</h:panelGroup>
				</p:panelGrid>
				<p:commandButton validateClient="true" actionListener="#{smallAssetPerformanceConfigController.saveCheckListItem}"
					update=":growl,:smallAssetPerformanceConfigTab:smallAssetPerformanceConfigCreateForm:addAssetConfig" value="#{msg.Save}" icon="ui-icon-check"
					oncomplete="handleSubmit(args, 'checkItemEditDlg');" />
                 &nbsp;&nbsp;
                 <p:commandButton immediate="true" value="#{msg.Cancel}" update=":growl" icon="ui-icon-cancel" onclick="PF('checkItemEditDlg').hide()" />
			</h:panelGroup>
		</h:form>
	</p:dialog>
</ui:composition>

</html>
