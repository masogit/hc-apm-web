<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
	<p:dialog id="searchDlg" widgetVar="varCommonSearchDlg" modal="true" resizable="true" draggable="true" width="80%" showHeader="false">
		<h:form id="commonSearchForm" rendered="#{searchController.showDialog}">
			<ui:include src="/portal/asset/searchDiv.xhtml"/>
			<p:commandButton value="#{msg.Confirm}" icon="ui-icon-check" update="growl #{searchController.updateViewIDs}" actionListener="#{searchController.confirm()}"
				oncomplete="handleSubmit(args, 'varCommonSearchDlg');" />
			<p:commandButton immediate="true" value="#{msg.Cancel}" type="button" icon="ui-icon-cancel" onclick="PF('varCommonSearchDlg').hide()" />
		</h:form>
	</p:dialog>
</ui:composition>
</html>
