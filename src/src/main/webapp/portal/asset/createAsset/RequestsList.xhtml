<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card">

                <p align="center">
                    <b>#{msg.QrCodeLib}</b>
                </p>
            </div>
            <div class="ui-g-12 card">
                <h:form id="QrCodeLibListForm">
                    <p:remoteCommand name="outputMsg" actionListener="#{qrCodeLibCreateController.showMsg}" update=":growl"/>
                    <p:dataTable id="datalist" value="#{qrCodeLibCreateController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{qrCodeLibCreateController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.uid}" sortMode="single" sortOrder="descending" sortBy="#{item.submitDate}"
                                 paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="filter" listener="#{qrCodeLibCreateController.onFilter}" />
                        <p:column headerText="#{msg.hospitalId}">
                            <f:facet name="header">
                                <h:outputText value="#{msg.hospitalId}"/><br/>
                                <p:inputText id="hospitalId"  value="#{qrCodeLibCreateController.fileterSiteOrg.name}"  readonly="true"/>
                            </f:facet>
                            <h:outputText value="#{qrCodeLibCreateController.getHospitalName(item.siteUID)}"/>
                        </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}">
                                <f:facet name="header">
                                    <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                                    <p:autoComplete dropdown="true" value="#{qrCodeLibCreateController.filterClinicalDeptOrg}" appendTo="@(Body)"
                                                    scrollHeight="300"  forceSelection="true" completeMethod="#{qrCodeLibCreateController.autoCompleteDeptName}" size="5">
                                        <p:ajax event="itemSelect" listener="#{qrCodeLibCreateController.onClinicalDeptNameFilterChange}" process="@this"  update=":QrCodeLibListForm:datalist" oncomplete="afterLoadRender()" />
                                        <p:ajax process="@this" listener="#{qrCodeLibCreateController.onClinicalDeptNameFilterChange}" update=":QrCodeLibListForm:datalist"  oncomplete="afterLoadRender()"/>
                                    </p:autoComplete>
                                </f:facet>
                                <h:outputText value="#{qrCodeLibCreateController.getOrgName(item.orgId)}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetDeptName}" rendered="#{userContextService.enableDisplayByKey('assetCreateDeptFilter')}">
                                <f:facet name="header">
                                    <h:outputText value="#{msg.assetDeptName}"/><br/>
                                    <p:autoComplete dropdown="true" value="#{qrCodeLibCreateController.filterAssetDeptOrg}" appendTo="@(Body)"
                                                    scrollHeight="300"  forceSelection="true" completeMethod="#{qrCodeLibCreateController.autoCompleteDeptName}" size="5">
                                        <p:ajax event="itemSelect" listener="#{qrCodeLibCreateController.onAssetDeptNameFilterChange}" process="@this"  update=":QrCodeLibListForm:datalist" oncomplete="afterLoadRender()" />
                                        <p:ajax process="@this" listener="#{qrCodeLibCreateController.onAssetDeptNameFilterChange}" update=":QrCodeLibListForm:datalist"  oncomplete="afterLoadRender()"/>
                                    </p:autoComplete>
                                </f:facet>
                                <h:outputText value="#{qrCodeLibCreateController.getOrgName(item.assetDeptId)}"/>
                            </p:column>
                        <p:column headerText="#{msg.name}" sortBy="#{item.assetName}" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                        <p:column headerText="#{msg.qrCode}" filterBy="#{item.qrCode}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.qrCode}"/>
                        </p:column>
                        <p:column headerText="#{msg.functionType}" filterBy="#{item.modelNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.modelNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.serialNum}" filterBy="#{item.serialNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.serialNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.issueDate}" sortBy="#{item.issueDate}" >
                            <h:outputText value="#{item.issueDate}">
                                <f:convertDateTime pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.submitDate}" sortBy="#{item.submitDate}" >
                            <h:outputText value="#{item.submitDate}">
                                <f:convertDateTime pattern="MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.Create2}" >
                            <p:link target="_new" outcome="/portal/asset/info/AssetCreate"  rendered="#{userContextService.accessContainsFunctionMenu('ASSET_CREATE_ADD')}">#{msg.Create}
                                <f:param name="qrCode" value="#{item.qrCode}" />
                                <f:param name="siteUid" value="#{item.siteUID}" />
                            </p:link >
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_CREATE_VIEW')}">
                                <p:dataExporter type="xls" target="datalist" fileName="QrCodeLib_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>

            </div>
        </div>
    <script>
        afterPageLoad = function () {
            outputMsg();
        };
    </script>
        <script>

            function afterLoadRender(){
                $(".ui-datatable-tablewrapper").css('width', '100%');
                $("div table")[1].style.overflowX= "scroll";
                $("div table")[1].style.width = "auto";
                $("html")[0].style.overflowX= "hidden";
            }

            $(function () {
                $(".ui-datatable-tablewrapper").css('width', '100%');
                $("div table")[1].style.overflowX= "scroll";
                $("div table")[1].style.width = "auto";
                $("html")[0].style.overflowX= "hidden";
            });

            //<![CDATA[
            afterPageLoad = function () {
                $("#searchForm\\:searchText").keypress(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                    }
                })
                var isActive = "#{userContextService.isActive()}";
                if (isActive == '1') {
                    PF('ActiveDlg').show();
                }
            }
            var newWin;
            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }

            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#AssetInfoListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
            //]]>
        </script>
    </ui:define>

</ui:composition>
