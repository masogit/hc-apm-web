<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card">

                <p align="center">
                    <b>#{msg.QrCodeLib}</b>
                </p>
            </div>
            <div class="ui-g-12 card">
                <h:form id="QrCodeLibListForm">
                    <p:remoteCommand name="outputMsg" actionListener="#{qrCodeLibCreateController.showMsg}" update=":growl"/>
                    <p:dataTable id="datalist" value="#{qrCodeLibCreateController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{qrCodeLibCreateController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.uid}" sortMode="single" sortOrder="descending" sortBy="#{item.submitDate}"
                                 paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,40,60,90">

                        <p:ajax event="filter" listener="#{qrCodeLibCreateController.onFilter}" />
<!--                        <p:column headerText="#{msg.hospitalId}" sortBy="#{item.hospitalId}" filterBy="#{item.siteUID}" filterMatchMode="EQ">
                             <f:facet name="filter">
                                 <p:selectOneMenu value="#{qrCodeLibCreateController.selectedSiteUid}" >
                                     <p:ajax listener="#{qrCodeLibCreateController.onSiteChange}"  update="datalist clinicalDeptName"/>
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{qrCodeLibCreateController.getHospitalList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{qrCodeLibCreateController.getHospitalName(item.siteUID)}"/>
                        </p:column>
                        <p:column headerText="#{msg.clinicalDeptName}" sortBy="#{item.orgId}" filterBy="#{item.orgId}" filterMatchMode="EQ" >
                                <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()"  id="clinicalDeptName">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{qrCodeLibCreateController.getOrgList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                                </p:selectOneMenu>
                                 </f:facet>
                                <h:outputText value="#{qrCodeLibCreateController.getOrgName(item.orgId)}"/>
                        </p:column>-->
                        <p:column headerText="#{msg.hospitalId}">
                            <f:facet name="header">
                                <h:outputText value="#{msg.hospitalId}"/><br/>
                                <p:inputText id="hospitalId"  value="#{qrCodeLibCreateController.fileterSiteOrg.name}"  readonly="true"/>
                            </f:facet>
                            <h:outputText value="#{qrCodeLibCreateController.getHospitalName(item.siteUID)}"/>
                        </p:column>

                        <p:column headerText="#{msg.clinicalDeptName}">
                            <f:facet name="header">
                                <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                                <p:inputText id="clinicalDept"  value="#{qrCodeLibCreateController.fileterDeptOrg.name}"  readonly="true"/>
                            </f:facet>
                            <h:outputText value="#{qrCodeLibCreateController.getOrgName(item.orgId)}"/>
                        </p:column>

                        <p:column headerText="#{msg.name}" sortBy="#{item}" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                        <p:column headerText="#{msg.qrCode}" filterBy="#{item.qrCode}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.qrCode}"/>
                        </p:column>
                        <p:column headerText="#{msg.issueDate}" sortBy="#{item.issueDate}" >
                            <h:outputText value="#{item.issueDate}">
                                <f:convertDateTime pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.submitDate}" sortBy="#{item.submitDate}" >
                            <h:outputText value="#{item.submitDate}">
                                <f:convertDateTime pattern="MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="创建" >
                            <p:link   outcome="CreateAsset" >#{msg.Create}
                                <f:param name="qrCode" value="#{item.qrCode}" />
                                <f:param name="siteUid" value="#{item.siteUID}" />
                            </p:link >
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="QrCodeLib_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>

            </div>
        </div>

        <p:overlayPanel id="idVarPanelDeptOrg" widgetVar="varPanelDeptOrg" for=":QrCodeLibListForm:datalist:clinicalDept" dismissable="true" style="text-align: left;">
            <p:scrollPanel style="height:300px;border: 0" mode="native">
                <p:tree class="tree" style="width:98%;border:0;" value="#{orgTreeController.getDeptOrgTree(empty qrCodeLibCreateController.fileterSiteOrg ? userContextService.loginUser.siteUID : qrCodeLibCreateController.fileterSiteOrg.uid)}"  var="node" selectionMode="single" dynamic="false">
                    <p:ajax process="@this" event="select"  listener="#{qrCodeLibCreateController.onClinicalDeptFilter}" update=":QrCodeLibListForm:datalist :idVarPanelDeptOrg :idVarPanelSiteOrg" oncomplete="PF('varPanelDeptOrg').hide();"/>
                    <p:ajax process="@this" event="expand"/>
                    <p:ajax process="@this" event="collapse"/>
                    <p:treeNode type="org">
                        <h:outputText value="#{node.name}"/>
                    </p:treeNode>
                </p:tree>
            </p:scrollPanel>
        </p:overlayPanel>
        <p:overlayPanel id="idVarPanelSiteOrg" widgetVar="varPanelSiteOrg" for=":QrCodeLibListForm:datalist:hospitalId" dismissable="true" style="text-align: left;">
            <p:scrollPanel style="height:300px;border: 0" mode="native">
                <p:tree class="tree" style="width:98%;border:0;" value="#{orgTreeController.siteOrgTree}"  var="node" selectionMode="single" dynamic="false">
                    <p:ajax process="@this" event="select"  listener="#{qrCodeLibCreateController.onSelectSiteTreeNode}" update=":QrCodeLibListForm:datalist :idVarPanelSiteOrg :idVarPanelDeptOrg" oncomplete="PF('varPanelSiteOrg').hide();"/>
                    <p:ajax process="@this" event="expand"/>
                    <p:ajax process="@this" event="collapse"/>
                    <p:treeNode type="org">
                        <h:outputText value="#{node.name}"/>
                    </p:treeNode>
                </p:tree>
            </p:scrollPanel>
        </p:overlayPanel>
    <script>
        afterPageLoad = function () {
            outputMsg();
        };
    </script>
    </ui:define>

</ui:composition>
