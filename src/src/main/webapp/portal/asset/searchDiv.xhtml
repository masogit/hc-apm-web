<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
	<p:dialog id="searchDlg" widgetVar="varCommonSearchDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)"
		width="80%" showHeader="false">
		<h:form id="commonSearchForm" rendered="#{searchController.showDialog}">
			<p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">所属院区</label>
					<p:selectOneMenu value="#{searchController.orgSite}" disabled="false" converter="orgInfoConverter">
						<p:ajax listener="#{searchController.onOrgSiteChange()}" update=":commonSearchForm:clinicalOrgInfo,:commonSearchForm:AssetsPickList" />
						<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
						<f:selectItems value="#{searchController.listOrgSite}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
					</p:selectOneMenu>
				</h:panelGroup>
				<h:panelGroup>
					<label class="label">所属科室</label>
					<p:selectOneMenu id="clinicalOrgInfo" value="#{searchController.orgDepart}" disabled="false" converter="orgInfoConverter">
						<p:ajax listener="#{searchController.onOrgDeptChange()}" update=":commonSearchForm:AssetsPickList"/>
						<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
						<f:selectItems value="#{searchController.listOrgDept}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
					</p:selectOneMenu>
				</h:panelGroup>
				<h:panelGroup>
					<label class="label">设备分类</label>
					<p:selectOneMenu value="#{searchController.assetGroup}" disabled="false">
						<p:ajax listener="#{searchController.onAssetGroupChange()}" update=":commonSearchForm:AssetsPickList"/>
						<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
						<f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
					</p:selectOneMenu>
				</h:panelGroup>
				<h:panelGroup>
					<label class="label">三码</label>
					<p:inputText id="idOneSearchStr" value="#{searchController.threeQrCode}" placeholder="#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}" maxlength="100"
						style="width: 300px" >
						<p:ajax listener="#{searchController.onThreeQrCodeChange()}" update=":commonSearchForm:AssetsPickList"/>
					</p:inputText>
				</h:panelGroup>
			</p:panelGrid>
			<br />
			<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<p:pickList id="AssetsPickList" value="#{searchController.availableAssets}" var="item"
                                itemValue="#{item}" itemLabel="#{item.name}" showCheckbox="false" responsive="true"
                                showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter"
                                required="false" requiredMessage="已选设备 #{msg.ValidationRequire}" style="width:1150px">
                        <f:facet name="sourceCaption">待选设备</f:facet>
                        <f:facet name="targetCaption">已选设备</f:facet>
                        <p:ajax event="transfer" listener="#{searchController.onAssetsTransfer}"/>
                        <p:column style="float: left;width:25%;text-align:left;">
                            <h:outputText value="#{item.name}" />
                        </p:column>
                        <p:column style="float: left;width:25%;text-align:left;">
                            <h:outputText value="#{item.departNum}" />
                        </p:column>
                         <p:column style="float: left;width:25%;text-align:left;">
                            <h:outputText value="#{item.clinicalDeptName}" />
                        </p:column>
                        <p:column style="float: left;width:25%;text-align:left;">
                            <h:outputText value="#{item.functionType}" />
                        </p:column>
                    </p:pickList>
				</h:panelGroup>
			</p:panelGrid>
			<p:commandButton value="#{msg.Confirm}" icon="ui-icon-check" update="growl #{searchController.updateViewIDs}" actionListener="#{searchController.confirm()}"
				oncomplete="handleSubmit(args, 'varCommonSearchDlg');" />
			<p:commandButton immediate="true" value="#{msg.Cancel}" type="button" icon="ui-icon-cancel" onclick="PF('varCommonSearchDlg').hide()" />
		</h:form>
	</p:dialog>
</ui:composition>
</html>
