<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group common-search-div">
        <h:panelGroup>
            <label class="label">所属院区</label>
            <p:inputText id="selectedOrgName" value="#{searchController.selectedOrg.name}" readonly="true" required="true"
                requiredMessage="#{msg.orgId} #{msg.ValidationRequire}" />
            <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;" />
            <p:overlayPanel id="panelOrg" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;"
                modal="false">
                <p:scrollPanel style="height:300px;border: 0" mode="native">
                    <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;" value="#{searchController.orgTree}" selection="#{searchController.selectedNode}"
                        var="node" selectionMode="single">
                        <p:ajax process="@this" event="select" update="@parent:selectedOrgName,@parent:AssetsPickList,@parent:idAssetSelect,@parent:clinicalOrgInfo"
                            listener="#{searchController.onSelectOrgFromTree}" oncomplete="PF('varPanelOrg').hide();" />
                        <p:ajax process="@this" event="expand" />
                        <p:ajax process="@this" event="collapse" />
                        <p:treeNode type="org">
                            <h:outputText value="#{node}" />
                        </p:treeNode>
                    </p:tree>
                </p:scrollPanel>
            </p:overlayPanel>
        </h:panelGroup>
        <h:panelGroup>
            <label class="label">所属科室</label>
            <p:selectOneMenu id="clinicalOrgInfo" value="#{searchController.orgDepart}" disabled="false" converter="orgInfoConverter">
                <p:ajax listener="#{searchController.onOrgDeptChange()}" update="@parent:AssetsPickList,@parent:idAssetSelect" />
                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                <f:selectItems value="#{searchController.listOrgDept}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
            </p:selectOneMenu>
        </h:panelGroup>
        <h:panelGroup>
            <label class="label">设备分类</label>
            <p:selectOneMenu value="#{searchController.assetGroup}" disabled="false">
                <p:ajax listener="#{searchController.onAssetGroupChange()}" update="@parent:AssetsPickList,@parent:idAssetSelect" />
                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
            </p:selectOneMenu>
        </h:panelGroup>
        <h:panelGroup>
            <label class="label">三码</label>
            <p:inputText id="idOneSearchStr" value="#{searchController.threeQrCode}" placeholder="#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}" maxlength="100"
                style="width: 300px">
                <p:ajax listener="#{searchController.onThreeQrCodeChange()}" update="@parent:AssetsPickList,@parent:idAssetSelect" />
            </p:inputText>
        </h:panelGroup>

        <h:panelGroup rendered="#{searchController.blnPickList}">
            <p:pickList id="AssetsPickList" value="#{searchController.availableAssets}" var="item" itemValue="#{item}" itemLabel="#{item.name}" showCheckbox="false"
                responsive="true" showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter" required="false"
                requiredMessage="已选设备 #{msg.ValidationRequire}" style="width:850px">
                <f:facet name="sourceCaption">待选设备</f:facet>
                <f:facet name="targetCaption">已选设备</f:facet>
                <p:ajax event="transfer" listener="#{searchController.onAssetsTransfer}" />
                <p:column style="float: left;width:25%;text-align:left;">
                    <h:outputText value="#{item.name}" />
                </p:column>
                <p:column style="float: left;width:25%;text-align:left;">
                    <h:outputText value="#{item.departNum}" />
                </p:column>
                <p:column style="float: left;width:25%;text-align:left;">
                    <h:outputText value="#{item.clinicalDeptName}" />
                </p:column>
                <p:column style="float: left;width:25%;text-align:left;">
                    <h:outputText value="#{item.functionType}" />
                </p:column>
            </p:pickList>
        </h:panelGroup>
        <h:panelGroup rendered="#{searchController.blnAssetSelect}">
            <label class="label">设备</label>
            <p:autoComplete id="idAssetSelect" dropdown="true" scrollHeight="300" value="#{searchController.selectedAssetInfo}"
                completeMethod="#{searchController.completeSelectedAssetInfo}" requiredMessage="#{msg.parentAsset} #{msg.ValidationRequire}" forceSelection="true"
                class="SiteUIDChange clinicalDeptNameChange" var="t" itemLabel="#{t.name}#{t.name eq null ? '' : '/'}#{t.qrCode}" itemValue="#{t}"
                converter="assetInfoConverter">
            </p:autoComplete>
        </h:panelGroup>
    </p:panelGrid>
    <script>
    	$(".common-search-div").each(function(index,e){
    		let parent=e.parentElement;
    		$(parent).css("overflow","unset");
    	});
    </script>
</ui:composition>
</html>
