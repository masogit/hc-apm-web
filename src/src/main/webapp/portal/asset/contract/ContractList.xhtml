<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.AssetContractMgmt}"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="AssetContractListForm">
                    <p:dataTable id="datalist" value="#{contractInfoController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{contractInfoController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect"  update="createButton deleteButton editButton"/>
                        <p:ajax event="filter" listener="#{contractInfoController.onFilter}" oncomplete="rc();"/>
                        <p:column headerText="#{msg.contractNum}" sortBy="#{item.contractNum}" filterBy="#{item.contractNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.contractNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.name}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.contractType}" sortBy="#{item.contractType}" filterBy="#{item.contractType}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('contractInfoType', item.contractType)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Full')}" itemValue="Full"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Artificial')}" itemValue="Artificial"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Equipment')}" itemValue="Equipment"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Other')}" itemValue="Other"  />
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.startTime}" sortBy="#{item.startDate}" >
                            <f:facet name="filter">
                                <p:inputText id="filterStartTime" widgetVar="varFilterStartTime"/>
                            </f:facet>
                            <h:outputText value="#{item.startDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.endTime}" sortBy="#{item.endDate}">
                            <f:facet name="filter">
                                <p:inputText id="filterEndTime" widgetVar="varFilterEndTime"/>
                            </f:facet>
                            <h:outputText value="#{item.endDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.AssetContractAmount}" sortBy="#{item.amount}" >
                            <!-- <h:outputText  value="#{item.contractAmount}"/> -->
                            <p:inputNumber value="#{item.amount}" readonly="true"> </p:inputNumber>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" action="#{contractInfoController.createAction}" />
                            <!--<p:commandButton id="viewButton" icon="ui-icon-remove-red-eye" class="btn btn-sm btn-gray" title="#{msg.View}" actionListener="#{contractInfoController.prepareView}" update=":AssetContractViewDlg" oncomplete="PF('AssetContractViewDialog').show()" disabled="#{empty contractInfoController.selected}"/>-->
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" action="#{contractInfoController.editAction}" disabled="#{empty contractInfoController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{contractInfoController.deleteContract}" update=":AssetContractListForm:datalist, :growl"  disabled="#{empty contractInfoController.selected}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                            
                            
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="AssetContract_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                    <p:remoteCommand name="rc" update="datalist:createButton datalist:deleteButton" immediate="true"/>
                </h:form>
            </div>
        </div>
    </ui:define>
    <script type="text/javascript">
        function start() {
            PF('statusDialog').show();
        }

        function stop() {
            PF('statusDialog').hide();
        }
    </script>
</ui:composition>
