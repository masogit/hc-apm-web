<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.AssetContractMgmt}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form>
                    <p:commandButton id="importButton" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_CONTRACT_EDIT')}"  value="#{msg.ContractImport}" title="#{msg.ContractImport}" action="#{contractInfoController.importAction}"/>
                    <p:commandButton id="importItemButton"  rendered="#{userContextService.accessContainsFunctionMenu('ASSET_CONTRACT_EDIT')}" value="#{msg.ContractRelatedEquipmentImport}" title="#{msg.ContractRelatedEquipmentImport}" action="#{contractInfoController.importItemAction}"/>
                    <h:panelGrid id="filterType" columns="2" style="float: right">
                        <h:panelGroup style="float: right"  rendered="#{contractInfoController.contractExpirationReminderDays > 0}">
                            <span >#{msg.Legend}：</span>
                            <span class="contractExpiredSoon">合同即将到期</span>
                            <span></span>
                            <span class="contractExpired">合同已经到期</span>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
                <h:form id="AssetContractListForm">
                    <p:dataTable id="datalist" value="#{contractInfoController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{contractInfoController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowStyleClass="#{item.contractAlertStatus}"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="rowDblselect" listener="#{contractInfoController.doubleClick}" oncomplete="openViewWindow(xhr, status, args)"/>
                        <p:ajax event="rowSelect"  update="createButton deleteButton editButton renewalButton"/>
                        <p:ajax event="filter" listener="#{contractInfoController.onFilter}" oncomplete="rc();"/>
                        <p:column headerText="#{msg.contractNum}" sortBy="#{item.contractNum}" filterBy="#{item.contractNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.contractNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.name}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.reportNum}" sortBy="#{item.reportNum}" filterBy="#{item.reportNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.reportNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.contractType}" sortBy="#{item.contractType}" filterBy="#{item.contractType}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('contractInfoType', item.contractType)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Full')}" itemValue="Full"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Artificial')}" itemValue="Artificial"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Equipment')}" itemValue="Equipment"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Parts')}" itemValue="Parts"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Other')}" itemValue="Other"  />
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.vendor}" sortBy="#{item.supplierName}" filterBy="#{item.supplierName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.supplierName}"/>
                        </p:column>

                        <p:column headerText="#{msg.plannedArriveDate}" filterBy="#{item.expectArrivalDate}" filterMatchMode="GET"    sortBy="#{item.expectArrivalDate}">
                            <f:facet name="filter">
                                <p:inputText id="filterExpectArrivalDate" widgetVar="varfilterExpectArrivalDate"  value="#{contractInfoController.filterObject['expectArrivalDate']}"/>
                            </f:facet>
                            <h:outputText value="#{item.expectArrivalDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.startTime}" filterBy="#{item.startDate}" filterMatchMode="GET"    sortBy="#{item.startDate}" >
                            <f:facet name="filter">
                                <p:inputText id="filterStartTime" widgetVar="varFilterStartTime"/>
                            </f:facet>
                            <h:outputText value="#{item.startDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.endTime}"  filterBy="#{item.endDate}" filterMatchMode="GET"     sortBy="#{item.endDate}">
                            <f:facet name="filter">
                                <p:inputText id="filterEndTime" widgetVar="varFilterEndTime"/>
                            </f:facet>
                            <h:outputText value="#{item.endDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.AssetContractAmount}"  filterBy="#{item.assetContractAmount}" filterMatchMode="GET"  sortBy="#{item.assetContractAmount}">
                            <f:facet name="filter">
                                <p:inputText id="filterAssetContractAmount" widgetVar="varFilterAssetContractAmount" value="#{contractInfoController.filterObject['assetContractAmount']}"/>
                            </f:facet>
                            <p:inputNumber value="#{(item.amount + item.supplementaryAmount) > 0 ? (item.amount + item.supplementaryAmount) : null}" readonly="true"> </p:inputNumber>
                        </p:column>

                        <p:column headerText="#{msg.PaymentProgress}"     sortBy="#{item.paymentProgress}">
                            <h:outputText value="#{item.paymentProgress}"/>
                        </p:column>
                        <p:column headerText="完成情况">
                            <h:outputText value="#{item.completion}"/>
                        </p:column>

                        <p:column headerText="是否已完成验收"  filterBy="#{item.contractStatus}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()">
                                    <f:converter converterId="javax.faces.Boolean" />
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="" />
                                    <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true" />
                                    <f:selectItem itemLabel="#{msg.False2No}" itemValue="false" />
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.contractStatus eq 'COMPLETE'?msg.True2Yes:msg.False2No}"/>
                        </p:column>

                        <p:column headerText="#{msg.Actions}">
                            <p:commandButton value="#{msg.ContractComplete}"
                                             rendered="#{item.contractType == 'Equipment' and (item.status == null or item.status == 4)}"
                                             disabled="#{item.isContractComplete()}"
                                             update=":AssetContractListForm:datalist"
                                             actionListener="#{contractInfoController.completeContract(item)}">
                                <p:confirm  header="验收提示"  message="当前合同内的设备未安装验收完成，请确认是否验收完成合同！" disabled="#{contractInfoEditController.acceptTip(item)}" icon="ui-icon-alert"/>
                            </p:commandButton>
                            <p:commandButton id="audit" value="#{msg.Approval}" process="@this" update="ContractAuditDlg" actionListener="#{contractInfoEditController.prepareApproval(item)}" rendered="#{item.status == 2}" oncomplete="PF('ContractAuditDialog').show()"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_CONTRACT_EDIT')}" title="#{msg.Create}" action="#{contractInfoController.createAction}" />
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_CONTRACT_EDIT')}" action="#{contractInfoController.editAction}" disabled="#{!contractInfoController.isEditable(contractInfoController.selected)}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_CONTRACT_DELETE')}" actionListener="#{contractInfoController.deleteContract}" update=":AssetContractListForm:datalist, :growl"  disabled="#{!contractInfoController.isEditable(contractInfoController.selected)}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false" action="#{contractInfoController.exportAction}"/>
                            <p:commandButton id="renewalButton" icon="ui-icon-content-copy" class="btn btn-sm btn-gray" rendered="#{userContextService.accessContainsFunctionMenu('ASSET_CONTRACT_EDIT')}" title="续约" action="#{contractInfoController.renewalAction}" disabled="#{empty contractInfoController.selected or !(contractInfoController.selected.contractType eq 'Full' or contractInfoController.selected.contractType eq 'Artificial')}" >
                                <p:confirm header="提示" message="确定要一键续约吗？" icon="ui-icon-info"/>
                            </p:commandButton>

                        </f:facet>
                    </p:dataTable>
                    <p:remoteCommand name="rc" update="datalist:createButton datalist:deleteButton" immediate="true"/>

                    <p:overlayPanel appendTo="AssetContractListForm" widgetVar="panelFilterAssetContractAmount" for="AssetContractListForm:datalist:filterAssetContractAmount" dismissable="false">
                        <h:panelGrid columns="2">
                            <!--                            <p:outputLabel value="#{msg.From}"/>-->
                            <!--                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varAssetContractAmountFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />-->
                            <!--                            <p:outputLabel value="#{msg.To}"/>-->
                            <!--                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varAssetContractAmountTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />-->
                            <p:outputLabel value="#{msg.From}"/>
                            <p:inputNumber minValue="0" decimalPlaces="2" widgetVar="varAssetContractAmountFrom" >
                            </p:inputNumber>
                            <p:outputLabel value="#{msg.To}"/>
                            <p:inputNumber minValue="0" decimalPlaces="2" widgetVar="varAssetContractAmountTo">
                            </p:inputNumber>
                        </h:panelGrid>
                        <p:commandButton onclick="setNumberFilter('varDataList', 'varFilterAssetContractAmount', 'varAssetContractAmountFrom', 'varAssetContractAmountTo'); PF('panelFilterAssetContractAmount').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                        <p:commandButton onclick="PF('panelFilterAssetContractAmount').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                    </p:overlayPanel>

                    <p:overlayPanel appendTo="AssetContractListForm" widgetVar="panelFilterExpectArrivalDate" for="AssetContractListForm:datalist:filterExpectArrivalDate" dismissable="false">
                        <h:panelGrid columns="2">
                            <p:outputLabel value="#{msg.From}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varExpectArrivalDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                            <p:outputLabel value="#{msg.To}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varExpectArrivalDateTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        </h:panelGrid>
                        <p:commandButton onclick="setDateFilter('varDataList', 'varfilterExpectArrivalDate', 'varExpectArrivalDateFrom', 'varExpectArrivalDateTo'); PF('panelFilterExpectArrivalDate').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                        <p:commandButton onclick="PF('panelFilterExpectArrivalDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                    </p:overlayPanel>

                    <p:overlayPanel appendTo="AssetContractListForm" widgetVar="panelFilterStartTime" for="AssetContractListForm:datalist:filterStartTime" dismissable="false">
                        <h:panelGrid columns="2">
                            <p:outputLabel value="#{msg.From}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varStartTimeFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                            <p:outputLabel value="#{msg.To}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varStartTimeTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        </h:panelGrid>
                        <p:commandButton onclick="setDateFilter('varDataList', 'varFilterStartTime', 'varStartTimeFrom', 'varStartTimeTo'); PF('panelFilterStartTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                        <p:commandButton onclick="PF('panelFilterStartTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                    </p:overlayPanel>


                    <p:overlayPanel appendTo="AssetContractListForm" widgetVar="panelFilterEndTime" for="AssetContractListForm:datalist:filterEndTime" dismissable="false">
                        <h:panelGrid columns="2">
                            <p:outputLabel value="#{msg.From}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varEndTimeFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                            <p:outputLabel value="#{msg.To}"/>
                            <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varEndTimeTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        </h:panelGrid>
                        <p:commandButton onclick="setDateFilter('varDataList', 'varFilterEndTime', 'varEndTimeFrom', 'varEndTimeTo'); PF('panelFilterEndTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                        <p:commandButton onclick="PF('panelFilterEndTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                    </p:overlayPanel>

                </h:form>
            </div>
        </div>
        <style>
            .contractExpiredSoon {
                background-color: #fca752!important;
                color: #000000!important;
            }
            .contractExpired {
                background-color: #f04134!important;
                color: #000000!important;
            }
            .btn+.btn { margin-left: 0 }
            .ui-column-resizer:before {content: none!important;}
            th{font-size: 12px!important;}
            td{font-size: 12px!important;padding: 0px!important;}
            table .ui-chkbox-icon, td img{ zoom: 0.7!important}
        </style>
        <p:dialog id="ContractAuditDlg" class="ContractAuditDlgCls" width="300" widgetVar="ContractAuditDialog" modal="true" resizable="true"
                  draggable="true" appendTo="@this" header="#{msg.Supplier}">
            <h:form id="ContractAuditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="true">
                        <h:panelGroup>
                            <p:outputLabel class="label" rendered="#{contractInfoEditController.showText()}">
                                以下附件尚未审核，是否仍确认审核？
                            </p:outputLabel>
                            <ui:repeat value="#{contractInfoEditController.attachements}" var="attachement">
                                <ul class="" style="display: #{attachement.approveStatus !=1 ? '' : 'none'}; list-style: none; padding-left: 0px;">
                                    <li >#{attachement.objectName}</li>
                                </ul>
                            </ui:repeat>
                            <label class="label">审核状态<span style="color:red">*</span></label>
                            <p:selectOneRadio id="auditStatus" value="#{contractInfoEditController.selected.approvalStatus}" required="true" requiredMessage="请选择审核状态">
                                <f:selectItem itemLabel="通过" itemValue="true"/>
                                <f:selectItem itemLabel="不通过" itemValue="false"/>
                            </p:selectOneRadio>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">审核结果</label>
                            <p:inputText id="city" value="#{contractInfoEditController.selected.approvalResult}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:commandButton validateClient="true"
                                     actionListener="#{contractInfoEditController.approval}"
                                     value="#{msg.Approval}"
                                     icon="ui-icon-check"
                                     update="AssetContractListForm:datalist :growl"
                                     oncomplete="handleSubmit(args, 'ContractAuditDialog');"/>
                    <p:commandButton immediate="true"
                                     value="#{msg.Cancel}"
                                     icon="ui-icon-cancel"
                                     onclick="PF('ContractAuditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <script type="text/javascript">
            function start() {
                PF('statusDialog').show();
            }

            function stop() {
                PF('statusDialog').hide();
            }

            function openViewWindow(xhr, status, args) {
                window.document.body.innerHTML = '加载中...';
                window.location.href = args.url;
            }
            function setNumberFilter(dataTableWidgetVar, inputWidgetVar, fromDateWidgetVar, toDateWidgetVar) {
                var input = document.getElementById(PF(inputWidgetVar).id);
                var oldValue = input.value;


                var dateFrom = PF(fromDateWidgetVar).getValue();
                var dateTo = PF(toDateWidgetVar).getValue();

                var value = "";
                if (dateFrom !== null)
                    value = dateFrom;
                if (dateTo !== null)
                    value = value + "~" + dateTo;

                if(oldValue===value) return;

                input.value = value;
                PF(dataTableWidgetVar).filter();
            }
            function handleSubmitDigital(args, dialog) {
                if (args.validationFailed) {
                    PF(dialog).show();
                } else {
                    PF(dialog).hide();
                }
            }
        </script>
    </ui:define>

</ui:composition>
