<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <h:form id="AssetContractEditForm">
            <p:fieldset  id="editSet" legend="#{iBAssetConstractController.CRUDActionName}" style="margin-bottom:20px" rendered="#{iBAssetConstractController.selected != null}">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                        <!--                        <h:panelGroup>
                                                    <label class="label">#{msg.fileType}*</label>
                                                    <p:selectOneMenu id="fileType" value="#{iBAssetConstractController.selected.fileType}" required="true" requiredMessage="#{msg.fileType} #{msg.ValidationRequire}">
                                                        <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                                        <f:selectItems value="#{fieldMsg.getFieldValueList('attachmentType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                                                    </p:selectOneMenu>
                                                </h:panelGroup>-->

                        <h:panelGroup>
                            <label class="label">#{msg.AssetContractName}*</label>
                            <p:inputText   id="contractName"  value="#{iBAssetConstractController.selected.name}" required="true" requiredMessage="#{msg.AssetContractName} #{msg.ValidationRequire}"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.contractType}</label>
                            <p:selectOneMenu id="contractType" value="#{iBAssetConstractController.selected.contractType}" required="false" requiredMessage="#{msg.contractType} #{msg.ValidationRequire}">
                                <p:ajax update="pmCount" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                <f:selectItems value="#{iBAssetConstractController.getContractTypeList()}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                <!--<f:selectItems value="#{fieldMsg.getFieldValueList('contractType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />-->
                            </p:selectOneMenu>
                        </h:panelGroup>
                        
                        <h:panelGroup>
                            <label class="label">#{msg.assetName}*</label>
                            <p:inputText id="assetName" readonly="true" value="#{iBAssetConstractController.selectedAsset.name}" placeholder="#{msg.noAssetSelected}" required="true" requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>
                            <p:commandButton class="popupIconButton" actionListener="#{selectAssetController.prepareDialogCallback(iBAssetConstractController, ':AssetContractEditForm:assetName')}" process="@this" icon="ui-icon-arrow-drop-down" update=":selectAssetDlg" oncomplete="PF('varSelectAssetDlg').show()"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.startTime}*</label>
                            <p:calendar timeZone="GMT+8"  id="startTime" pattern="yyyy/MM/dd" value="#{iBAssetConstractController.selected.startDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.startTime} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.endTime}*</label>
                            <p:calendar timeZone="GMT+8"  id="endTime" pattern="yyyy/MM/dd" value="#{iBAssetConstractController.selected.endDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.endTime} #{msg.ValidationRequire}"/>
                        </h:panelGroup>

                        <h:panelGroup id="pmCount">
                        <h:panelGroup rendered="#{iBAssetConstractController.selected.contractType == 5}">
                            <label class="label">保养次数*</label>
                            <p:inputNumber decimalPlaces="0" value="#{iBAssetConstractController.pmCount}" required="true" requiredMessage="保养次数 #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.AssetContractAmount}*</label>
                                <p:inputNumber decimalPlaces="0" id="contractAmount" value="#{iBAssetConstractController.selected.contractAmount}" required="true" requiredMessage="#{msg.AssetContractAmount} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panel  id="upload" styleClass="ui-panelgrid-blank" style=" border: 0">
                        <h:panelGroup  style="max-width:50px;" rendered="#{iBAssetConstractController.isCreatAction() and iBAssetConstractController.selected.objectId==null}">
                            <label class="label">合同附件*</label>
                            <p:fileUpload required="true" fileUploadListener="#{iBAssetConstractController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:40%" process="@this" multiple="false" sizeLimit="10000000" update=":AssetContractEditForm:upload" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  label="#{msg.Add}" />
                            <p:growl id="messages" showDetail="true" />
                        </h:panelGroup>
                        <h:panelGroup id="namepanel" rendered="#{iBAssetConstractController.selected.objectId!=null}">
                            <label class="label">#{msg.AssetContractAttachment}*</label>
                            <p:inputText id="name" value="#{iBAssetConstractController.fileName}"  required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}" readonly="true"/>
                            <p:commandButton actionListener="#{iBAssetConstractController.removeAttachmentById(iBAssetConstractController.blobObject)}" id="iconOnly" update=":AssetContractEditForm:upload" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this" rendered="#{iBAssetConstractController.isCreatAction()}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </h:panelGroup>
                    </p:panel>
                    <h:panelGroup>
                        <p:commandButton validateClient="true"  actionListener="#{iBAssetConstractController.save}" value="#{msg.Save}" update=":AssetContractEditForm :AssetContractListForm:datalist, :growl" icon="ui-icon-check"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{iBAssetConstractController.cancel}" update="display,:AssetContractEditForm :growl"/>
                    </h:panelGroup>

                </h:panelGroup>
            </p:fieldset>
        </h:form>

    </ui:composition>
</html>
