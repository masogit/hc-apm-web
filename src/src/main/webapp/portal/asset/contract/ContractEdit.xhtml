<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{contractInfoEditController.CRUDActionName}#{msg.ContractInfo}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="AssetContractEditForm">
                    <p:fieldset legend="基本信息">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">#{msg.hospitalId}</label>
                                <p:inputText id="selectedUserOrgName" value="#{contractInfoEditController.selectedObjectMap['selectedOrg']}" readonly="true" class="SiteUIDChange"/>
                                <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" disabled="#{not empty contractInfoEditController.selected.id}"/>
                                <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" style="width:300px" modal="false">
                                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{contractInfoEditController.orgTree}" var="node" selectionMode="single">
                                            <p:ajax process="@this" event="select" update="@(.SiteUIDChange)"
                                                    listener="#{contractInfoEditController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>

                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.AssetContractName}*</label>
                                <p:inputText value="#{contractInfoEditController.selected.name}" required="true" requiredMessage="#{msg.AssetContractName} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.contractNum}</label>
                                <p:inputText value="#{contractInfoEditController.selected.contractNum}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.contractType}</label>
                                <p:selectOneMenu id="contractType" value="#{contractInfoEditController.selected.contractType}" required="true" requiredMessage="#{msg.contractType} #{msg.ValidationRequire}" disabled="#{not empty contractInfoEditController.selected.id}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                    <f:selectItems value="#{contractInfoEditController.getContractTypeList()}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.vendor}</label>
                                <p:autoComplete dropdown="true" value="#{contractInfoEditController.selectedObjectMap['supplier']}"  scrollHeight="300"  forceSelection="true" 
                                                completeMethod="#{contractInfoEditController.autoCompleteSupplier}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                                    <p:ajax event="itemSelect" process="@this" listener="#{contractInfoEditController.onSelectedObjectChange('supplier')}" />
                                    <p:ajax listener="#{contractInfoEditController.onSelectedObjectChange('supplier')}" />
                                </p:autoComplete>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.AssetContractAmount}</label>
                                <p:inputNumber decimalPlaces="0" id="contractAmount" value="#{contractInfoEditController.selected.amount}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.startTime}*</label>
                                <p:calendar timeZone="GMT+8"  id="startTime" pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.startDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.startTime} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.endTime}*</label>
                                <p:calendar timeZone="GMT+8"  id="endTime" pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.endDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.endTime} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                        <h:panelGroup >
                            <p:dataList id="AttachList" value="#{contractInfoEditController.attachements}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}" style="text-align:left">
                                <f:facet name="header">
                                    <div class="ui-g" style="text-align:left">
                                        <h:outputText value="附件类型" class="ui-g-2"/>
                                        <h:outputText value="文件名称" class="ui-g-3"/>
                                        <h:outputText value="上传时间" class="ui-g-3" />
                                        <h:outputText value="上传人" class="ui-g-2" />
                                        <p:commandLink value="#{msg.Add}#{msg.attachment}" immediate="true"  oncomplete="PF('uploadDialog').show()" class="ui-g-2"/>
                                    </div>
                                </f:facet>

                                <div class="ui-g">
                                    <h:outputText value="#{fieldMsg.fieldValue('contractAttachmentType', fileitem.boSubType)}" class="ui-g-2"/>
                                    <p:link href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" class="ui-g-3" >#{fileitem.objectName}</p:link>
                                    <h:outputText value="#{fileitem.createdDate}" class="ui-g-3">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                                    </h:outputText>
                                    <h:outputText value="#{contractInfoEditController.getUserNameByUid(fileitem.createdBy)}" class="ui-g-2" />
                                    <p:commandLink value="#{msg.Delete}" class="ui-g-2" update="AttachList " actionListener="#{contractInfoEditController.removeAttachmentById(fileitem.id)}" process="@this">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandLink>
                                </div>
                            </p:dataList>

                        </h:panelGroup>

                    </p:fieldset>
                    <p:fieldset legend="详细信息一" rendered="#{not empty contractInfoEditController.selected.id and contractInfoEditController.selected.contractType eq 'Equipment'}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">#{msg.reportNum}*</label>
                                <p:inputText value="#{contractInfoEditController.selected.reportNum}" required="true" requiredMessage="#{msg.reportNum} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.applyProjectName}</label>
                                <p:inputText value="#{contractInfoEditController.selected.applyProjectName}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.tenderType}</label>
                                <p:selectOneMenu value="#{contractInfoEditController.selected.tenderType}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('tenderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.argumentEndDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.argumentEndDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.parameterEndDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.parameterEndDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.parameterPerson}</label>
                                <p:inputText value="#{contractInfoEditController.selected.parameterPerson}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.tenderOpenDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.tenderOpenDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.bidWinner}</label>
                                <p:autoComplete dropdown="true" value="#{contractInfoEditController.selectedObjectMap['bidWinner']}"  scrollHeight="300"  forceSelection="true" 
                                                completeMethod="#{contractInfoEditController.autoCompleteSupplier}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                                    <p:ajax event="itemSelect" listener="#{contractInfoEditController.onSelectedObjectChange('bidWinner')}" update="@(.bidWinner)" />
                                    <p:ajax listener="#{contractInfoEditController.onSelectedObjectChange('bidWinner')}" update="@(.bidWinner)"/>
                                </p:autoComplete>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.bidWinnerPerson}</label>
                                <p:inputText class="bidWinner" value="#{contractInfoEditController.selected.bidWinnerPerson}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.bidWinnerTelphone}</label>
                                <p:inputText class="bidWinner" value="#{contractInfoEditController.selected.bidWinnerTelphone}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.tenderNoticeDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.tenderNoticeDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.receiveFileDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.receiveFileDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.copyFileDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.copyFileDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.firstCheckDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.firstCheckDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.changeCommentDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.changeCommentDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.lawerDignDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.lawerDignDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.returnSupplierDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.returnSupplierDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.fileContractDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.fileContractDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.signContractDate}</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.signContractDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:dataTable id="purchaseList"  value="#{contractInfoEditController.purchaseItemsList}" var="item"
                                     rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     rowsPerPageTemplate="5,10,15"  >
                            <p:ajax event="rowSelect" />
                            <p:column headerText="#{msg.contractAssetName}">
                                <h:outputText value="#{item.contractAssetName}"/>
                            </p:column>
                            <p:column headerText="#{msg.contractAssetQuantity}">
                                <h:outputText value="#{item.contractAssetQuantity}"/>
                            </p:column>
                            <p:column headerText="#{msg.manufacture}">
                                <h:outputText value="#{contractInfoEditController.getSupplierName(item.manufacturer)}"/>
                            </p:column>
                            <p:column headerText="#{msg.pattern}">
                                <h:outputText value="#{item.pattern}"/>
                            </p:column>
                            <p:column width="140" >
                                <f:facet name="header" >
                                    <h:outputText value="操作" />
                                </f:facet>
                                <p:commandLink actionListener="#{contractInfoEditController.prepareEditPurchaseAsset(item)}" update=":addPurchaseForm" oncomplete="PF('addPurchaseDlg').show()" value="#{msg.Edit}" style="padding:10px" />
                                <p:commandLink process="@this" actionListener="#{contractInfoEditController.remomveContractItem(item)}" value="#{msg.Delete}" disabled="#{!contractInfoEditController.canRemovePucheseItem(item)}"  update="purchaseList" />
                            </p:column>

                            <f:facet name="{Toolbar}">
                                <p:commandLink value="添加订购设备" style="color:#3e87e8;padding: 10px" actionListener="#{contractInfoEditController.prepareAddPurchaseAsset()}" process="@this" 
                                               update=":addPurchaseForm" oncomplete="PF('addPurchaseDlg').show()" rendered="#{contractInfoEditController.selected.contractType eq 'Equipment'}"/>
                            </f:facet>

                        </p:dataTable>
                    </p:fieldset>
                    <p:fieldset legend="合同相关设备" rendered="#{not empty contractInfoEditController.selected.id}">
                        <p:dataTable id="itemList"  value="#{contractInfoEditController.contractItemsList}" var="item"
                                     rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     rowsPerPageTemplate="5,10,15" rows="10" emptyMessage="#{msg.noRecordFound}" >
                            <p:ajax event="rowSelect" />
                            <p:column headerText="#{msg.AssetName}">
                                <h:outputText value="#{item.itemType eq 'ExistAsset'? item.assetInfo.name : item.arrivalListItem.arrivalList.assetName}"/>
                            </p:column>
                            <p:column headerText="#{msg.serialNum}" rendered="#{contractInfoEditController.selected.contractType ne 'Equipment'}">
                                <h:outputText value="#{item.assetInfo.serialNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.serialNum}" rendered="#{contractInfoEditController.selected.contractType eq 'Equipment'}">
                                <h:outputText value="#{empty item.assetInfo? item.arrivalListItem.serialNum:item.assetInfo.serialNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}" rendered="#{contractInfoEditController.selected.contractType ne 'Equipment'}" >
                                <h:outputText value="#{item.assetInfo.clinicalDeptName}" />
                            </p:column>
                            <p:column headerText="#{msg.arrivalDate}" rendered="#{contractInfoEditController.selected.contractType eq 'Equipment'}" >
                                <h:outputText  value="#{contractInfoEditController.selectedContractItem.arrivalListItem.arrivalList.arrivalDate}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.inTimeArrived}" rendered="#{contractInfoEditController.selected.contractType eq 'Equipment'}" >
                                <h:outputText  value="#{contractInfoEditController.isOnTimeArrival(item)}" />
                            </p:column>
                            <p:column headerText="#{msg.AssetArrivalListClinicalAckDate}" rendered="#{contractInfoEditController.selected.contractType eq 'Equipment'}" >
                                <h:outputText value="#{contractInfoEditController.selectedContractItem.arrivalListItem.clinicalAckDate}" >
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.arrivalListInvoiceNum}" rendered="#{contractInfoEditController.selected.contractType eq 'Equipment'}" >
                                <h:outputText value="#{contractInfoEditController.selectedContractItem.arrivalListItem.arrivalList.invoiceNum}" />
                            </p:column>
                            <p:column headerText="安装状态" rendered="#{contractInfoEditController.selected.contractType eq 'Equipment'}" >
                                <h:outputText value="#{fieldMsg.fieldValue('arrivalListItemStatus',item.arrivalListItem.installStatus)}" />
                            </p:column>

                            <p:column width="140" >
                                <f:facet name="header" >
                                    <h:outputText value="操作" />
                                </f:facet>
                                <p:commandLink actionListener="#{contractInfoEditController.viewContractItemPage(item)}" onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)"  value="#{msg.View}"  update="itemList" style="padding:10px" rendered="#{contractInfoEditController.selected.contractType eq 'Equipment'}" disabled="#{empty item.arrivalListItem.assetUID}"/>
                                <!--<p:commandLink actionListener="#{contractInfoEditController.prepareEditPurchaseAsset(item)}" oncomplete="PF('viewContractItemDlg').show()" value="#{msg.View}"  update=":viewContractItemForm" style="padding:10px" rendered="#{contractInfoEditController.selected.contractType eq 'Equipment'}"/>-->
                                <p:commandLink actionListener="#{contractInfoEditController.viewContractItemPage(item)}" onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)"  value="#{msg.View}"  update="itemList" style="padding:10px" rendered="#{contractInfoEditController.selected.contractType ne 'Equipment'}"/>
                                <p:commandLink process="@this" actionListener="#{contractInfoEditController.remomveContractItem(item)}" value="#{msg.Delete}"  update="itemList" rendered="#{contractInfoEditController.selected.contractType ne 'Equipment'}" />
                            </p:column>

                            <f:facet name="{Toolbar}">
                                <p:commandLink  value="添加已有设备" style="color:#3e87e8;padding: 10px" actionListener="#{selectAssetController.prepareDialogCallback(contractInfoEditController, ':AssetContractEditForm:itemList')}" 
                                                process="@this" update=":selectAssetDlg" oncomplete="PF('varSelectAssetDlg').show()" rendered="#{contractInfoEditController.selected.contractType ne 'Equipment'}"/>
                            </f:facet>

                        </p:dataTable>
                    </p:fieldset>
                    <h:panelGroup>
                        <p:commandButton validateClient="true"  actionListener="#{contractInfoEditController.saveContract}" value="#{msg.Save}" update=":AssetContractEditForm :growl" icon="ui-icon-check"/>
                        <p:commandButton value="#{msg.Return}" icon="ui-icon-arrow-back" action="ContractList?faces-redirect=true" immediate="true" />
                    </h:panelGroup>
                </h:form>
            </div>

        </div>
        <ui:include src="/portal/asset/selectAssetDialog.xhtml"/>

                                <h:panelGroup>
                                    <label class="label">#{msg.serialNum}</label>
                                    <p:inputText  value="#{contractInfoEditController.selectedContractItem.arrivalListItem.serialNum}" readonly="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.arrivalDate}</label>

                                </h:panelGroup>
                                <h:panelGroup>

        <p:dialog id="addPurchaseDlg" widgetVar="addPurchaseDlg" modal="true" width="800"  resizable="true" draggable="true" appendTo="@this" header="添加/修改采购设备">
            <h:form id="addPurchaseForm" >
                <h:panelGroup id="display" rendered="#{not empty contractInfoEditController.selectedContractItem}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.contractAssetName}</label>
                            <p:inputText class="bidWinner" value="#{contractInfoEditController.selectedContractItem.contractAssetName}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                                <label class="label">#{msg.applyDept}</label>
                                <p:autoComplete id="clinicalDeptName" dropdown="true" value="#{contractInfoEditController.selectedObjectMap['applyDept']}" scrollHeight="300"  forceSelection="true" appendTo="@this"
                                                completeMethod="#{contractInfoEditController.autoCompleteDept}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" class="SiteUIDChange">
                                    <p:ajax event="itemSelect" listener="#{contractInfoEditController.onSelectedObjectChange('applyDept')}"/>
                                    <p:ajax listener="#{contractInfoEditController.onSelectedObjectChange('applyDept')}" />
                                </p:autoComplete>
                            </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.estimatedPrice}</label>
                            <p:inputNumber decimalPlaces="4"  value="#{contractInfoEditController.selectedContractItem.estimatedPrice}">
                                <p:ajax listener="#{contractInfoEditController.onEstimatedPriceChange}" process="@this" update="priceType" />
                            </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.priceType}</label>
                            <p:selectOneMenu id="priceType" value="#{contractInfoEditController.selectedContractItem.priceType}" disabled="true">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('contractPriceType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.contractAssetPrice}</label>
                            <p:inputNumber  decimalPlaces="4"  value="#{contractInfoEditController.selectedContractItem.contractAssetPrice}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.contractAssetQuantity}*</label>
                            <p:inputNumber  maxValue="999"  decimalPlaces="0" value="#{contractInfoEditController.selectedContractItem.contractAssetQuantity}" required="true" requiredMessage="#{msg.contractAssetQuantity} #{msg.ValidationRequire}" />
                        </h:panelGroup>

                                <p:ajax listener="#{contractInfoEditController.onSelectedObjectChange('manufacture')}"/>

                <h:panelGroup id="display" >
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <p:selectOneMenu id="functionGroup" value="#{contractInfoEditController.attachmentType}" autoWidth="false" style="width: 100%">
                                <p:ajax process="@this" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('contractAttachmentType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>

                                    #{fileitem.objectName}
                                <p:commandButton actionListener="#{contractInfoEditController.removeUploadedFileObjects(fileitem.id)}" update="AttachUploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:dataList>
                            <p:fileUpload  fileUploadListener="#{contractInfoEditController.uploadDataFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                           multiple="true" sizeLimit="10000000" update=":uploadDialogForm:AttachUploadList saveButton" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  label="#{msg.Add}" />
                        </h:panelGroup>


                    </p:panelGrid>
                    <h:panelGroup>
                        <p:commandButton id="saveButton" immediate="false" validateClient="true" actionListener="#{contractInfoEditController.finishUpload()}" disabled="#{empty contractInfoEditController.uploadedFileObjects}" value="#{msg.Confirm}" 
                                         update=":AssetContractEditForm:AttachList :uploadDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'uploadDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{contractInfoEditController.cancelUpload()}" icon="ui-icon-cancel" onclick="PF('uploadDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>

        <script>
            //<![CDATA[
            var newWin;
            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }
            function handleValidFields(xhr, status, args) {
                var valid = true;
                if (args.confirmedUpDate) {
                    $('#woTab\\:repairCompleteDialogForm\\:confirmedUpDate_input').addClass("ui-state-error");
                    valid = false;
                }
                if (args.caseType) {
                    $('#woTab\\:repairCompleteDialogForm\\:caseType').addClass("ui-state-error");
                    valid = false;
                }
                if (args.repairResult) {
                    $('#woTab\\:repairCompleteDialogForm\\:repairResult').addClass("ui-state-error");
                    valid = false;
                }
                if (args.manHours) {
                    $('#woTab\\:repairCompleteDialogForm\\:manHours_input').addClass("ui-state-error");
                    valid = false;
                }
                if (valid) {
                    handleSubmit(args, 'repairCompleteDialog');
                }
            }
            //]]>
        </script>
