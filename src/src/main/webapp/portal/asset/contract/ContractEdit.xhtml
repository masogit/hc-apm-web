<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">

        <ui:include src="CreateSupplier.xhtml"/>

        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{contractInfoEditController.CRUDActionName} #{msg.ContractInfo}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="AssetContractEditForm">
                    <p:fieldset legend="#{msg.BasicInformation}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">#{msg.hospitalId}</label>
                                <p:inputText id="selectedUserOrgName" value="#{contractInfoEditController.selectedObjectMap['selectedOrg']}" readonly="true" class="SiteUIDChange"/>
                                <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" disabled="#{not empty contractInfoEditController.selected.id}"/>
                                <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" style="width:300px" modal="false">
                                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{contractInfoEditController.orgTree}" var="node" selectionMode="single">
                                            <p:ajax process="@this" event="select" update="@(.SiteUIDChange)"
                                                    listener="#{contractInfoEditController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>

                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
											<p:treeNode type="hidden" rendered="false"/>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.contractType}</label>
                                <p:selectOneMenu id="contractType" value="#{contractInfoEditController.selected.contractType}" required="true" requiredMessage="#{msg.contractType} #{msg.ValidationRequire}" disabled="#{not empty contractInfoEditController.selected.id}">
                                    <p:ajax process="@this" listener="#{contractInfoEditController.onContractTypeChange}"  update=":AssetContractEditForm" />
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Full')}" itemValue="Full"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Artificial')}" itemValue="Artificial"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Equipment')}" itemValue="Equipment"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Parts')}" itemValue="Parts"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Other')}" itemValue="Other"  />
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.AssetContractName}*</label>
                                <p:inputText value="#{contractInfoEditController.selected.name}" required="true" requiredMessage="#{msg.AssetContractName} #{msg.ValidationRequire}">
                                    <p:ajax process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.contractNum}</label>
                                <p:inputText value="#{contractInfoEditController.selected.contractNum}">
                                    <p:ajax process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.vendor}</label>
                                <p:autoComplete dropdown="true" value="#{contractInfoEditController.selectedObjectMap['supplier']}"  scrollHeight="300"  forceSelection="true" 
                                                completeMethod="#{contractInfoEditController.autoCompleteSupplierByPY}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                                    <p:ajax event="itemSelect" process="@this" listener="#{contractInfoEditController.onSelectedObjectChange('supplier')}" />
                                    <p:ajax listener="#{contractInfoEditController.onSelectedObjectChange('supplier')}" />
                                </p:autoComplete>
                                <p:commandButton id="createSupplierButton" icon="ui-icon-plus" title="#{msg.Create}" process="@this" actionListener="#{contractInfoEditController.prepareCreateSupplier('supplier')}" update="SupplierEditDlg" oncomplete="PF('SupplierEditDialog').show()"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">合同金额</label>
                                <p:inputNumber decimalPlaces="0" id="contractAmount" value="#{contractInfoEditController.selected.amount}" minValue="0">
                                    <p:ajax process="@this" update="AssetContractEditForm:amount"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.startTime}#{contractInfoEditController.selected.contractType ne 'Equipment'?'*':''}</label>
                                <p:calendar timeZone="GMT+8"  id="startTime" pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.startDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="#{contractInfoEditController.selected.contractType ne 'Equipment'?true:false}" requiredMessage="#{msg.startTime} #{msg.ValidationRequire}">
                                    <p:ajax event="dateSelect" listener="#{contractInfoEditController.onChangeEndDate}" update=":AssetContractEditForm:endTime"></p:ajax>
                                    <p:ajax listener="#{contractInfoEditController.onChangeEndDate}" update=":AssetContractEditForm:endTime"></p:ajax>
                                </p:calendar>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.endTime}#{contractInfoEditController.selected.contractType ne 'Equipment'?'*':''}</label>
                                <p:calendar timeZone="GMT+8"  id="endTime" pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.endDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="#{contractInfoEditController.selected.contractType ne 'Equipment'?true:false}" requiredMessage="#{msg.endTime} #{msg.ValidationRequire}">
                                    <p:ajax event="dateSelect" listener="#{contractInfoEditController.onChangeEndMonths}" update=":AssetContractEditForm:endMonths"></p:ajax>
                                    <p:ajax listener="#{contractInfoEditController.onChangeEndMonths}" update=":AssetContractEditForm:endMonths"></p:ajax>
                                </p:calendar>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.ContractPeriodMonths}</label>
                                <p:inputNumber decimalPlaces="0" maxValue="99" id="endMonths" value="#{contractInfoEditController.selected.endMonths}">
                                    <p:ajax listener="#{contractInfoEditController.onChangeEndDate}" update=":AssetContractEditForm:endTime"></p:ajax>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup id="invoiceNum">
                                <h:panelGroup  rendered="#{contractInfoEditController.selected.contractType ne 'Parts' and ( contractInfoEditController.selected.contractType ne 'Equipment')}">
                                    <label class="label" >#{msg.invoiceNum}</label>
                                    <p:inputText value="#{contractInfoEditController.selected.invoiceNum}" class="invoiceNum">
                                        <p:ajax process="@this" />
                                    </p:inputText>
                                </h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractSigningDate').rendered}">
                                <label class="label">
                                    #{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractSigningDate').label
                                    .concat(systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractSigningDate').required ? '*' : '')}
                                </label>
                                <p:calendar timeZone="GMT+8" pattern="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractSigningDate').datePattern}" value="#{contractInfoEditController.selected.signingDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"
                                            required="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractSigningDate').required}"
                                            requiredMessage="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractSigningDate').requiredMessage}">
                                </p:calendar>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractMaintenancePeriod').rendered}">
                                <label class="label">
                                    #{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractMaintenancePeriod').label
                                            .concat(systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractMaintenancePeriod').required ? '*' : '')}
                                </label>
                                <p:inputNumber decimalPlaces="0" maxValue="999" value="#{contractInfoEditController.selected.maintenancePeriod}"
                                               required="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractMaintenancePeriod').required}"
                                               requiredMessage="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractMaintenancePeriod').requiredMessage}">
                                    <p:ajax process="@this" />
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractDeliveryTime').rendered}">
                                <label class="label">
                                    #{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractDeliveryTime').label
                                            .concat(systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractDeliveryTime').required ? '*' : '')}
                                </label>
                                <p:inputText value="#{contractInfoEditController.selected.deliveryTime}"
                                             required="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractDeliveryTime').required}"
                                             requiredMessage="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractDeliveryTime').requiredMessage}">
                                    <p:ajax process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractDeliveryLocation').rendered}">
                                <label class="label">
                                    #{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractDeliveryLocation').label
                                            .concat(systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractDeliveryLocation').required ? '*' : '')}
                                </label>
                                <p:inputText value="#{contractInfoEditController.selected.deliveryLocation}"
                                             required="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractDeliveryLocation').required}"
                                             requiredMessage="#{systemConfigItemController.getFieldColumn(contractInfoEditController.selectedObjectMap['selectedOrg'], 'contractDeliveryLocation').requiredMessage}">
                                    <p:ajax process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.ReportNumber}</label>
                                <p:inputText value="#{contractInfoEditController.selected.reportNum}" >
                                    <p:ajax process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.foreignTradeNum}</label>
                                <p:inputText value="#{contractInfoEditController.selected.foreignTradeNum}" >
                                    <p:ajax process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{contractInfoEditController.isYunNanFuWai()}">
                                <label class="label">合同状态</label>
                                <p:selectOneMenu id="extensionStatus" value="#{contractInfoEditController.selected.extensionStatus}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('extensionStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{contractInfoEditController.isYunNanFuWai()}">
                                <label class="label">经费来源</label>
                                <p:selectOneMenu id="fundingSource" value="#{contractInfoEditController.selected.fundingSource}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('fundingSource')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">补充协议内容</label>
                                <p:inputText value="#{contractInfoEditController.selected.supplementary}" >
                                    <p:ajax process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">补充协议金额</label>
                                <p:inputNumber decimalPlaces="0" id="supplementaryAmount" value="#{contractInfoEditController.selected.supplementaryAmount}" minValue="0">
                                    <p:ajax process="@this" update="AssetContractEditForm:amount"/>
                                </p:inputNumber>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">招标编号</label>
                                <p:inputText value="#{contractInfoEditController.selected.bidNum}" >
                                    <p:ajax process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.createdBy}</label>
                                <p:inputText readonly="true" value="#{contractInfoEditController.getCreatedBy(contractInfoEditController.selected.createdBy)}" >
                                    <p:ajax process="@this" />
                                </p:inputText>
                            </h:panelGroup>
                        </p:panelGrid>
                        <h:panelGroup>
                            <p:commandButton value="批量删除文件" class="bathDeleteAttach" update=":AssetContractEditForm:AttachList @(.selectCheckBox) @(.selectCheckBoxHeader) @(.bathDeleteAttach) @(.bathDownloadAttach)" actionListener="#{contractInfoEditController.bathDeleteAttach}" disabled="#{!contractInfoEditController.isChecked()}">
                                <p:confirm header="批量删除文件" message="您确认要删除选中的文件吗？" icon="ui-icon-warning"/>
                            </p:commandButton>
                            <p:commandButton value="批量下载文件" class="bathDownloadAttach" actionListener="#{contractInfoEditController.bathDownloadAttach}" disabled="#{!contractInfoEditController.isChecked()}" onclick="PrimeFaces.monitorDownload(start, stop);">
                                <p:fileDownload value="#{contractInfoEditController.attachListFile}"/>
                            </p:commandButton>
                            <p:dataList id="AttachList" value="#{contractInfoEditController.attachements}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}" style="text-align:left">
                                <f:facet name="header">
                                    <div class="ui-g" style="text-align:left">
                                        <div class="ui-g-1">
                                            <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                                <p:ajax listener="#{contractInfoEditController.onSelectAllOfPage}" update="@(.selectCheckBox) @(.selectCheckBoxHeader) @(.bathDeleteAttach) @(.bathDownloadAttach)" oncomplete="updateSelectAllCheckBox();" />
                                            </p:selectBooleanCheckbox>
                                        </div>
                                        <p:commandLink value="↑↓" actionListener="#{contractInfoEditController.attachSort()}" update="AttachList"/>
                                        <h:outputText value="#{msg.AttachmentType}" class="ui-g-2"/>
                                        <h:outputText value="#{msg.FileName}" class="ui-g-3"/>
                                        <h:outputText value="#{msg.UploadTime}" class="ui-g-2" />
                                        <h:outputText value="#{msg.Uploader}" class="ui-g-2" />
                                        <p:commandLink value="#{msg.Add}#{msg.attachment}" immediate="true"  oncomplete="PF('uploadDialog').show()" class="ui-g-1" rendered="#{contractInfoEditController.canBeEdit}"/>
                                    </div>
                                </f:facet>

                                <div class="ui-g">
                                    <div class="ui-g-1">
                                        <p:selectBooleanCheckbox value="#{contractInfoEditController.blobObjectSelectedMap[fileitem.id]}" id="selectCheckBox" class="selectCheckBoxHeader">
                                            <p:ajax process="@this" listener="#{contractInfoEditController.pick(fileitem.id)}" update="@(.selectCheckBox) @(.selectCheckBox) @(.bathDeleteAttach) @(.bathDownloadAttach)" oncomplete="updateSelectAllCheckBox();" />
                                        </p:selectBooleanCheckbox>
                                    </div>
                                    <h:outputText value="#{fileitem.boSubTypeValue}" class="ui-g-2"/>
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="ui-g-3"/>
<!--                                    <p:link href="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" class="ui-g-3" >#{fileitem.objectName}</p:link>-->
                                    <h:outputText value="#{fileitem.createdDate}" class="ui-g-2">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                                    </h:outputText>
                                    <h:outputText value="#{contractInfoEditController.getUserNameByUid(fileitem.createdBy)}" class="ui-g-2" />
                                    <p:commandLink value="#{msg.preview}" style="margin-right: 5px;" update="previewedDlg" rendered="#{fileitem.showPreview()}" process="@this" actionListener="#{preViewerBean.onServerEvent('', fileitem.objectStorageId)}" oncomplete="PF('previewedDlg').show()"/>
                                    <p:commandLink value="#{msg.Delete}" style="margin-right: 5px;" update="AttachList" actionListener="#{contractInfoEditController.removeAttachmentById(fileitem.id)}" process="@this" rendered="#{contractInfoEditController.canBeEdit}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandLink>
                                    <p:commandLink value="#{msg.approveAttactments}" style="margin-right: 5px;"  update="AttachList" process="@this" actionListener="#{contractInfoEditController.approveAttachmentById(fileitem.id)}" rendered="#{contractInfoEditController.canApprove(fileitem.id)}" />
                                    <p:commandLink value="#{msg.attactmentsApproved}" style="margin-right: 5px;"  process="@this"  rendered="#{!contractInfoEditController.canApprove(fileitem.id)}" disabled="true"/>
                                </div>
                            </p:dataList>

                        </h:panelGroup>
                        <p:fieldset id="amount" legend="#{msg.PaymentPlan} 合同总额：#{contractInfoEditController.getBigDecimal(contractInfoEditController.selected.amount + contractInfoEditController.selected.supplementaryAmount)}（合同总额=合同金额+补充协议金额）">
                            <h:panelGroup >
                                <p:dataTable id="paymentList"  value="#{contractInfoEditController.getPaymentList()}" var="item" 
                                             rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                             paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                             rowsPerPageTemplate="20,50,100,500"  rows="20" emptyMessage="#{msg.noRecordFound}">
                                    <p:ajax event="rowSelect" />
                                    <p:column headerText="#{msg.PaymentAmount}">
                                        <h:outputText value="#{contractInfoEditController.getBigDecimal(item.paymentPrice)}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.PaymentTime}">
                                        <h:outputText value="#{item.paymentDate}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.EstimatedPaymentDate}">
                                        <h:outputText value="#{item.estimatedPaymentDate}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="支付方式" rendered="#{contractInfoEditController.isYunNanFuWai()}">
                                        <h:outputText value="#{fieldMsg.fieldValue('paymentMode', item.paymentMode)}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.comments}">
                                        <h:outputText value="#{item.comments}"/>
                                    </p:column>
                                    <p:column width="140" rendered="#{contractInfoEditController.canBeEdit}">
                                        <f:facet name="header" >
                                            <h:outputText value="#{msg.Operation}" />
                                        </f:facet>
                                        <p:commandLink process="@this" actionListener="#{contractInfoEditController.prepareEditPaymentInfo(item)}" update=":addPaymentForm" oncomplete="PF('addPaymentDlg').show()" value="#{msg.Edit}" style="padding:10px" />
                                        <p:commandLink process="@this" actionListener="#{contractInfoEditController.remomveContractItem(item)}" value="#{msg.Delete}"  update="paymentList" />
                                    </p:column>

                                    <f:facet name="{Toolbar}">
                                        <p:commandLink value="#{msg.AddPaymentPlan}" style="color:#3e87e8;padding: 10px" actionListener="#{contractInfoEditController.prepareAddPaymentInfo()}" process="@this" rendered="#{contractInfoEditController.canBeEdit}"
                                                       update=":addPaymentForm" oncomplete="PF('addPaymentDlg').show()" />
                                    </f:facet>
                                </p:dataTable>
                            </h:panelGroup>
                        </p:fieldset>
                        <p:fieldset legend="发票信息" rendered="#{not empty contractInfoEditController.selected.id and contractInfoEditController.selected.contractType eq 'Equipment'}">
                            <p:dataTable id="contractInvoiceList"  value="#{contractInfoEditController.contractInvoiceList}" var="item"
                                         rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                         rowsPerPageTemplate="20,50,100,500" rows="20" emptyMessage="#{msg.noRecordFound}" >

                                <p:column headerText="#{msg.invoiceNum}">
                                    <h:outputText value="#{item.invoiceNum}"/>
                                </p:column>
                                <p:column headerText="发票金额">
                                    <h:outputText value="#{contractInfoEditController.getBigDecimal(item.invoicePrice)}"/>
                                </p:column>
                                <p:column headerText="#{msg.InvoicingTime}">
                                    <h:outputText  value="#{item.invoiceTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="支付方式">
                                    <h:outputText value="#{item.paymentMode}"/>
                                </p:column>
                                <p:column headerText="是否付款">
                                    <h:outputText value="#{item.paid ? '是' : '否'}"/>
                                </p:column>
                                <p:column headerText="#{msg.comment}">
                                    <h:outputText value="#{item.comments}"/>
                                </p:column>
                                <p:column width="140" rendered="#{contractInfoEditController.canBeEdit}">
                                    <f:facet name="header" >
                                        <h:outputText value="#{msg.Operation}" />
                                    </f:facet>
                                    <p:commandLink process="@this" actionListener="#{contractInfoEditController.prepareEditInvoiceInfo(item)}" update=":addInvoiceForm" oncomplete="PF('addInvoiceDlg').show()" value="#{msg.Edit}" style="padding:10px" />
                                    <p:commandLink process="@this" actionListener="#{contractInfoEditController.remomveContractItem(item)}" value="#{msg.Delete}"  update="contractInvoiceList" />
                                </p:column>
                                <f:facet name="{Toolbar}">
                                    <p:commandLink value="添加发票信息" style="color:#3e87e8;padding: 10px" actionListener="#{contractInfoEditController.prepareAddInvoiceInfo()}" process="@this" rendered="#{contractInfoEditController.canBeEdit}"
                                                   update=":addInvoiceForm" oncomplete="PF('addInvoiceDlg').show()" />
                                </f:facet>
                            </p:dataTable>
                        </p:fieldset>
                    </p:fieldset>
                    <p:fieldset legend="#{msg.DetailOne}" rendered="#{not empty contractInfoEditController.selected.id and contractInfoEditController.selected.contractType eq 'Equipment'}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">预算申请时间</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.budgetRequestTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">审批时间</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.approvalTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">论证通过时间</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.argumentThroughTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">上报管理部门时间</label>
                                <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{contractInfoEditController.selected.reportToManagementTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">立项时间</label>

        <script>
            //<![CDATA[
            var newWin;
            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }
            function handleValidFields(xhr, status, args) {
                var valid = true;
                if (args.confirmedUpDate) {
                    $('#woTab\\:repairCompleteDialogForm\\:confirmedUpDate_input').addClass("ui-state-error");
                    valid = false;
                }
                if (args.caseType) {
                    $('#woTab\\:repairCompleteDialogForm\\:caseType').addClass("ui-state-error");
                    valid = false;
                }
                if (args.repairResult) {
                    $('#woTab\\:repairCompleteDialogForm\\:repairResult').addClass("ui-state-error");
                    valid = false;
                }
                if (args.manHours) {
                    $('#woTab\\:repairCompleteDialogForm\\:manHours_input').addClass("ui-state-error");
                    valid = false;
                }
                if (valid) {
                    handleSubmit(args, 'repairCompleteDialog');
                }
            }

            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#AssetContractEditForm\\:AttachList\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
            //]]>
        </script>
