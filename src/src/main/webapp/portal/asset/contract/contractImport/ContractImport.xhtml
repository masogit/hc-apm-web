<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="导入合同信息"/>
            </div>
        </div>
        <div class="ui-g-12 card">
            <h:form id="importForm">
                <p:fieldset  legend="合同导入" id="uploaderContainer">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">*#{msg.hospitalId}</label>
                            <p:inputText id="selectedOrgName"
                                         value="#{contractImportController.selectedOrg==null ? '': contractImportController.selectedOrg.name}"
                                         readonly="true" required="false" requiredMessage="所属院区不能为空"/>
                            <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down"
                                             class="btn btn-sm popupIconButton"/>
                            <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false"
                                            style="width:300px" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;"
                                            value="#{contractImportController.orgTree}"
                                            selection="#{contractImportController.selectedNode}" var="node"
                                            selectionMode="single">
                                        <p:ajax process="@this" event="select" update=":importForm:selectedOrgName :importForm:fileUpload"
                                                listener="#{contractImportController.onSelectTreeNode}"
                                                oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>

                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">*#{msg.contractType}</label>
                            <p:selectOneMenu id="contractType" value="#{contractImportController.contractType}" required="false" requiredMessage="#{msg.contractType} #{msg.ValidationRequire}">
                                <p:ajax update=":importForm:fileUpload"></p:ajax>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Full')}" itemValue="Full"  />
                                <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Artificial')}" itemValue="Artificial"  />
                                <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Equipment')}" itemValue="Equipment"  />
                                <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Other')}" itemValue="Other"  />
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <p:fileUpload  id="fileUpload" fileUploadListener="#{contractImportController.uploadDataFile}" value="#{contractImportController.file}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                           multiple="false" sizeLimit="10000000" auto="true" update=":importForm :errorDataListForm" invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(xls|xlsx)$/" label="#{msg.Add}" disabled="#{contractImportController.selectedOrg == null or contractImportController.contractType == null}" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <p>说明</p>
                            <p>1. <a href="APM_Contract_Service_Template.xlsx" title="download">#{msg.downloadTemplateFile}</a> </p>
                            <p>2. 文件中填入要导入的合同数据</p>
                            <p>3. 上传文件进行导入</p>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>

                <p:commandButton value="#{msg.Return}" icon="ui-icon-arrow-back" action="/portal/asset/contract/ContractList?faces-redirect=true" immediate="true" />
            </h:form>
        </div>

        <div class="ui-g-12 card">
            <h:form id="errorDataListForm">
                <p:fieldset  legend="导入失败数据">
                    <p:dataTable id="errorDatalist" rendered="#{not empty contractImportController.errorContractList}" value="#{contractImportController.errorContractList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:column headerText="EXCEL行数">
                            <h:outputText value="#{item.get('contractInfoVO').lineNum}" />
                        </p:column>
                        <p:column headerText="合同编号">
                            <h:outputText value="#{item.get('contractInfoVO').contractNum}" />
                        </p:column>
                        <p:column headerText="名称">
                            <h:outputText value="#{item.get('contractInfoVO').name}" />
                        </p:column>
                        <p:column headerText="供应商">
                            <h:outputText value="#{item.get('contractInfoVO').supplierName}" />
                        </p:column>
                        <p:column headerText="合同总额">
                            <h:outputText value="#{item.get('contractInfoVO').amount}" />
                        </p:column>
                        <p:column headerText="开始时间">
                            <h:outputText value="#{item.get('contractInfoVO').startDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="结束时间">
                            <h:outputText value="#{item.get('contractInfoVO').endDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="失败信息" >
                            <!--<h:outputText value="#{fieldMsg.fieldValue('importStatus',item.get('status'))}"/><br/>-->
                            <h:outputText value="#{item.get('errmsg')}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton ajax="false" actionListener="#{contractImportController.downloadImportFailureData}"
                                             icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" update=":growl">
                                <p:fileDownload value="#{contractImportController.exportFile}"/>
                            </p:commandButton>
                        </f:facet>

                    </p:dataTable>
                </p:fieldset>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
