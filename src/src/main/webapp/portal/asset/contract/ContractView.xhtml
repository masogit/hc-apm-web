<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">

        <ui:include src="CreateSupplier.xhtml"/>

        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.ContractInfo} 详情"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="AssetContractEditForm">
                    <p:fieldset legend="#{msg.BasicInformation}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">#{msg.hospitalId}</label>
                                <h:outputText value="#{contractInfoEditController.selectedObjectMap['selectedOrg']}"  class="SiteUIDChange"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.contractType}</label>
                                <p:selectOneMenu id="contractType" value="#{contractInfoEditController.selected.contractType}"  disabled="true">
                                    <p:ajax process="@this" listener="#{contractInfoEditController.onContractTypeChange}"  update=":AssetContractEditForm" />
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Full')}" itemValue="Full"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Artificial')}" itemValue="Artificial"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Equipment')}" itemValue="Equipment"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Parts')}" itemValue="Parts"  />
                                    <f:selectItem itemLabel="#{fieldMsg.fieldValue('contractInfoType', 'Other')}" itemValue="Other"  />
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.AssetContractName}*</label>
                                <h:outputText value="#{contractInfoEditController.selected.name}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.contractNum}</label>
                                <h:outputText value="#{contractInfoEditController.selected.contractNum}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.foreignTradeNum}</label>
                                <h:outputText value="#{contractInfoEditController.selected.foreignTradeNum}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.vendor}</label>
                                <p:autoComplete dropdown="true" value="#{contractInfoEditController.selectedObjectMap['supplier']}"  scrollHeight="300"  forceSelection="true" disabled="true"
                                                completeMethod="#{contractInfoEditController.autoCompleteSupplierByPY}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                                </p:autoComplete>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">合同金额</label>
                                <h:outputText value="#{contractInfoEditController.selected.amount}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.startTime}#{contractInfoEditController.selected.contractType ne 'Equipment'?'*':''}</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.startDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.endTime}#{contractInfoEditController.selected.contractType ne 'Equipment'?'*':''}</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.endDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.ContractPeriodMonths}</label>
                                <h:outputText value="#{contractInfoEditController.selected.endMonths}" />
                            </h:panelGroup>
                            <h:panelGroup id="invoiceNum">
                                <h:panelGroup  rendered="#{contractInfoEditController.selected.contractType ne 'Parts' and ( contractInfoEditController.selected.contractType ne 'Equipment')}">
                                    <label class="label" >#{msg.invoiceNum}</label>
                                    <h:outputText value="#{contractInfoEditController.selected.invoiceNum}" class="invoiceNum" />
                                </h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.ReportNumber}</label>
                                <h:outputText value="#{contractInfoEditController.selected.reportNum}" />
                            </h:panelGroup>
                            <h:panelGroup rendered="#{contractInfoEditController.isYunNanFuWai()}">
                                <label class="label">合同状态</label>
                                <p:selectOneMenu id="extensionStatus" value="#{contractInfoEditController.selected.extensionStatus}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('extensionStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{contractInfoEditController.isYunNanFuWai()}">
                                <label class="label">经费来源</label>
                                <p:selectOneMenu id="fundingSource" value="#{contractInfoEditController.selected.fundingSource}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('fundingSource')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">补充协议内容</label>
                                <h:outputText value="#{contractInfoEditController.selected.supplementary}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">补充协议金额</label>
                                <h:outputText value="#{contractInfoEditController.selected.supplementaryAmount}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">招标编号</label>
                                <h:outputText value="#{contractInfoEditController.selected.bidNum}" />
                            </h:panelGroup>
                        </p:panelGrid>
                        <h:panelGroup>
                            <p:dataList id="AttachList" value="#{contractInfoEditController.attachements}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}" style="text-align:left">
                                <f:facet name="header">
                                    <div class="ui-g" style="text-align:left">
                                        <h:outputText value="#{msg.AttachmentType}" class="ui-g-2"/>
                                        <h:outputText value="#{msg.FileName}" class="ui-g-3"/>
                                        <h:outputText value="#{msg.UploadTime}" class="ui-g-2" />
                                        <h:outputText value="#{msg.Uploader}" class="ui-g-2" />
                                    </div>
                                </f:facet>
                                <div class="ui-g">
                                    <h:outputText value="#{fieldMsg.fieldValue('contractAttachmentType', fileitem.boSubType)}" class="ui-g-2"/>
                                    <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="ui-g-3"/>
<!--                                    <p:link href="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" class="ui-g-3" >#{fileitem.objectName}</p:link>-->
                                    <h:outputText value="#{fileitem.createdDate}" class="ui-g-2">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                                    </h:outputText>
                                    <h:outputText value="#{contractInfoEditController.getUserNameByUid(fileitem.createdBy)}" class="ui-g-2" />
                                </div>
                            </p:dataList>

                        </h:panelGroup>
                        <p:fieldset id="amount" legend="#{msg.PaymentPlan} 合同总额：#{(contractInfoEditController.selected.amount + contractInfoEditController.selected.supplementaryAmount)}（合同总额=合同金额+补充协议金额）">
                            <h:panelGroup >
                                <p:dataTable id="paymentList"  value="#{contractInfoEditController.getPaymentList()}" var="item" 
                                             rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                             paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                             rowsPerPageTemplate="20,50,100,500"  rows="20" emptyMessage="#{msg.noRecordFound}">
                                    <p:ajax event="rowSelect" />
                                    <p:column headerText="#{msg.PaymentAmount}">
                                        <h:outputText value="#{item.paymentPrice}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.PaymentTime}">
                                        <h:outputText value="#{item.paymentDate}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="#{msg.EstimatedPaymentDate}">
                                        <h:outputText value="#{item.estimatedPaymentDate}">
                                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="支付方式" rendered="#{contractInfoEditController.isYunNanFuWai()}">
                                        <h:outputText value="#{fieldMsg.fieldValue('paymentMode', item.paymentMode)}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.comments}">
                                        <h:outputText value="#{item.comments}"/>
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>
                        </p:fieldset>
                        <p:fieldset legend="发票信息" rendered="#{not empty contractInfoEditController.selected.id and contractInfoEditController.selected.contractType eq 'Equipment'}">
                            <p:dataTable id="contractInvoiceList"  value="#{contractInfoEditController.contractInvoiceList}" var="item"
                                         rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                         rowsPerPageTemplate="20,50,100,500" rows="20" emptyMessage="#{msg.noRecordFound}" >

                                <p:column headerText="#{msg.invoiceNum}">
                                    <h:outputText value="#{item.invoiceNum}"/>
                                </p:column>
                                <p:column headerText="发票金额">
                                    <h:outputText value="#{item.invoicePrice}"/>
                                </p:column>
                                <p:column headerText="#{msg.InvoicingTime}">
                                    <h:outputText  value="#{item.invoiceTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="支付方式">
                                    <h:outputText value="#{item.paymentMode}"/>
                                </p:column>
                                <p:column headerText="是否付款">
                                    <h:outputText value="#{item.paid ? '是' : '否'}"/>
                                </p:column>
                                <p:column headerText="#{msg.comment}">
                                    <h:outputText value="#{item.comments}"/>
                                </p:column>
                            </p:dataTable>
                        </p:fieldset>
                    </p:fieldset>
                    <p:fieldset legend="#{msg.DetailOne}" rendered="#{not empty contractInfoEditController.selected.id and contractInfoEditController.selected.contractType eq 'Equipment'}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                            <h:panelGroup>
                                <label class="label">预算申请时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.budgetRequestTime}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">审批时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.approvalTime}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">论证通过时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.argumentThroughTime}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">上报管理部门时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.reportToManagementTime}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">立项时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.projectEstablishmentTime}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">开标时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.tenderOpenDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">中标时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.bidDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">接招标文件材料时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.receiveFileDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">拷样本、发《供货通知书》时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.copyFileDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">接电子版合同时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.receiveDigitalContractDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">初审返修时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.firstCheckDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">送审时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.sendContractDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">接审计修改意见时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.changeCommentDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">送律师时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.sendLawerDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">律师意见及签字时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.lawerDignDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">返回供货商修改意见时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.returnSupplierDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">收合同定稿【4份】时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.fileContractDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">签字并盖合同专用章时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.signContractDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">中标单位领【1】份合同时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.receiveContractDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">合同转交存档时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.archiveDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">应到货时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.expectArrivalDate}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">到货时间</label>
                                <p:outputLabel value="#{contractInfoEditController.selected.arrivalTime}" >
                                    <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="yyyy/MM/dd" />
                                </p:outputLabel>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:dataTable id="purchaseList"  value="#{contractInfoEditController.purchaseItemsList}" var="item"
                                     rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     rowsPerPageTemplate="20,50,100,500"  rows="20" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="#{msg.contractAssetName}">
                                <h:outputText value="#{item.contractAssetName}"/>
                            </p:column>
                            <p:column headerText="#{msg.contractAssetQuantity}">
                                <h:outputText value="#{item.contractAssetQuantity}"/>
                            </p:column>
                            <p:column headerText="单价">
                                <h:outputText value="#{item.contractAssetPrice}"/>
                            </p:column>
                            <p:column headerText="#{msg.manufacture}">
                                <h:outputText value="#{contractInfoEditController.getSupplierName(item.manufacturer)}"/>
                            </p:column>
                            <p:column headerText="#{msg.pattern}">
                                <h:outputText value="#{item.pattern}"/>
                            </p:column>
                            <p:column headerText="产地">
                                <h:outputText value="#{item.productionPlace}"/>
                            </p:column>
                            <p:column headerText="主设备名称">
                                <h:outputText value="#{contractInfoEditController.getParentName(item.parentId)}"/>
                            </p:column>
                        </p:dataTable>
                    </p:fieldset>

                    <p:fieldset legend="#{msg.ContractRelatedEquipment}(到货安装中)" rendered="#{not empty contractInfoEditController.selected.id and contractInfoEditController.selected.contractType eq 'Equipment'}">
                        <p:dataTable id="contractArrivalItemList"  value="#{contractInfoEditController.contractArrivalItemsList}" var="item"
                                     rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     rowsPerPageTemplate="20,50,100,500" rows="20" emptyMessage="#{msg.noRecordFound}" >

                            <p:column headerText="#{msg.AssetName}">
                                <h:outputText value="#{item.itemType eq 'ExistAsset'? item.assetInfo.name : item.arrivalListItem.arrivalList.assetName}"/>
                            </p:column>
                            <p:column headerText="#{msg.serialNum}">
                                <h:outputText value="#{empty item.assetInfo? item.arrivalListItem.serialNum:item.assetInfo.serialNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.arrivalDate}">
                                <h:outputText  value="#{item.arrivalListItem.arrivalList.arrivalDate}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.AssetArrivalListClinicalAckDate}">
                                <h:outputText value="#{item.arrivalListItem.clinicalAckDate}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.arrivalListInvoiceNum}">
                                <h:outputText value="#{item.arrivalListItem.arrivalList.invoiceNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.InstallationStatus}">
                                <h:outputText value="#{fieldMsg.fieldValue('arrivalListItemStatus',item.arrivalListItem.installStatus)}"/>
                            </p:column>
                            <p:column width="140" >
                                <f:facet name="header" >
                                    <h:outputText value="#{msg.operation}" />
                                </f:facet>
                                <p:link target="_blank" outcome="#{contractInfoEditController.getDetailPageLinkByAsset(item.assetInfo)}" style="padding:10px" disabled="#{empty item.arrivalListItem.assetUID}" >#{msg.View}</p:link>
                            </p:column>
                        </p:dataTable>
                    </p:fieldset>

                    <p:fieldset legend="#{msg.ContractRelatedEquipment}(台账已存在)" rendered="#{not empty contractInfoEditController.selected.id and contractInfoEditController.selected.contractType ne 'Parts'}">
                        <p:dataTable id="itemList"  value="#{contractInfoEditController.contractItemsList}" var="item"
                                     rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     paginatorTemplate="{Toolbar} {CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     rowsPerPageTemplate="20,50,100,500" rows="20" emptyMessage="#{msg.noRecordFound}" >
                            <p:ajax event="rowSelect" />
                            <p:column headerText="#{msg.AssetName}">
                                <h:outputText value="#{item.itemType eq 'ExistAsset'? item.assetInfo.name : item.arrivalListItem.arrivalList.assetName}"/>
                            </p:column>
                            <p:column headerText="#{msg.serialNum}">
                                <h:outputText value="#{item.assetInfo.serialNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}">
                                <h:outputText value="#{item.assetInfo.clinicalDeptName}" />
                            </p:column>
                            <p:column width="140" >
                                <f:facet name="header" >
                                    <h:outputText value="#{msg.operation}" />
                                </f:facet>
                                <p:link  outcome="#{contractInfoEditController.getDetailPageLinkByUid(item.assetUid)}">#{msg.View}</p:link>
                            </p:column>
                        </p:dataTable>
                    </p:fieldset>

                    <p:fieldset legend="#{msg.ContractRelatedEquipment}" rendered="#{not empty contractInfoEditController.selected.id and contractInfoEditController.selected.contractType eq 'Parts'}">
                        <p:dataTable value="#{contractInfoEditController.partsList}" var="item"
                                     rowKey="#{item.id}" paginator="true" currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     rowsPerPageTemplate="20,50,100,500" rows="20" emptyMessage="#{msg.noRecordFound}" >
                            <p:ajax event="rowSelect" />
                            <p:column headerText="#{msg.AssetName}">
                                <h:outputText value="#{item[0].name}"/>
                            </p:column>
                            <p:column headerText="#{msg.serialNum}">
                                <h:outputText value="#{item[0].serialNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}"  >
                                <h:outputText value="#{item[0].clinicalDeptName}" />
                            </p:column>
                            <p:column headerText="#{msg.name}" >
                                <h:outputText value="#{item[1].parts}" />
                            </p:column>
                            <p:column headerText="#{msg.arrivalListInvoiceNum}" >
                                <h:outputText value="#{item[1].invoiceNum}" />
                            </p:column>
                            <p:column headerText="#{msg.Quantity}" >
                                <h:outputText value="#{item[1].apartsQuantity}" />
                            </p:column>
                            <p:column width="140" rendered="#{contractInfoEditController.canBeEdit}">
                                <f:facet name="header" >
                                    <h:outputText value="#{msg.operation}" />
                                </f:facet>
                                <p:link  outcome="#{contractInfoEditController.getDetailPageLinkByAsset(item[0])}" style="padding:10px" disabled="#{contractInfoEditController.selected.contractType eq 'Equipment' and empty item.arrivalListItem.assetUID}" >#{msg.View}</p:link>
                            </p:column>
                        </p:dataTable>
                    </p:fieldset>
                    <h:panelGroup rendered="#{contractInfoEditController.canBeEdit}">
                        <p:commandButton value="#{msg.Return}" icon="ui-icon-arrow-back" action="ContractList?faces-redirect=true" immediate="true" />
                    </h:panelGroup>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
