<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.CustomConfiguration}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="customConfigForm">
                    <c:choose>
                        <c:when test="#{orgTreeController.judgeTheUser()}">
                            <h:panelGroup >
                                <p:commandButton id="retrieval2"  icon="fa fa-angle-down" title="查询"   validateClient="true"  actionListener="#{orgTreeController.filterNode()}" value="#{customConfigController.selectSite.name}"  update="orgTree :growl" iconPos="right"/>
                                <p:overlayPanel widgetVar="varPanelOrg" for="retrieval2" hideEffect="fade" dynamic="false" modal="false">
                                    <p:inputText id="retrieval" value="#{orgTreeController.retrieval}" style="width:150px;"/>
                                    <p:commandButton id="retrieval3" partialSubmit="true"  process=":customConfigForm:retrieval @this" icon="ui-icon-search"   validateClient="true"  actionListener="#{orgTreeController.filterNode()}" value="#{msg.Search}"  update="orgTree :growl" iconPos="right"/>
                                    <p:scrollPanel style="height:300px;border: 0" mode="native" >
                                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.tenantOrgTree}" selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
                                            <p:ajax process="@this" event="select" listener="#{customConfigController.onSelectSiteTreeNode}" update="customConfigForm" oncomplete="PF('varPanelOrg').hide();"/>
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>
                                            <p:treeNode type="org">
                                                <h:outputText value="#{node.name}"/>
                                            </p:treeNode>
                                            <p:treeNode type="hidden" rendered="false"/>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                        </c:when>
                        <c:otherwise>
                             <h:panelGroup >
                               <p:commandButton id="btnOrg" value="#{customConfigController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                               <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false">
                                   <p:scrollPanel style="height:300px;border: 0" mode="native">
                                       <p:tree id="orgTree2" class="tree" style="width:98%;border:0;" value="#{orgTreeController.tenantOrgTree}" selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
                                           <p:ajax process="@this" event="select" listener="#{customConfigController.onSelectSiteTreeNode}" update="customConfigForm" oncomplete="PF('varPanelOrg').hide();"/>
                                           <p:ajax process="@this" event="expand"/>
                                           <p:ajax process="@this" event="collapse"/>
                                           <p:treeNode type="org">
                                               <h:outputText value="#{node.name}"/>
                                           </p:treeNode>
                                           <p:treeNode type="hidden" rendered="false"/>
                                       </p:tree>
                                   </p:scrollPanel>
                               </p:overlayPanel>
                           </h:panelGroup>
                        </c:otherwise>
                    </c:choose>
                    <h:panelGroup >
                        <h:outputText id="configInfo" value="#{msg.CreatedAfterSaving}" rendered="#{empty customConfigController.customConfig}" style="font-weight:bold; padding: 10px"/>
                        <h:outputText value="#{msg.Creator}:" rendered="#{not empty customConfigController.customConfig}" style="font-weight:bold; padding: 10px"/>
                        <h:outputText value="#{customConfigController.configInfo['CreatedBy']}" rendered="#{not empty customConfigController.customConfig}"/>
                        <h:outputText value="#{msg.createTime}:" rendered="#{not empty customConfigController.customConfig}" style="font-weight:bold; padding: 10px"/>
                        <h:outputText value="#{customConfigController.configInfo['CreatedDate']}" rendered="#{not empty customConfigController.customConfig}"/>
                        <h:outputText value="#{msg.ModifiedBy}:" rendered="#{not empty customConfigController.customConfig and not empty customConfigController.configInfo['LastModifiedBy']}" style="font-weight:bold; padding: 10px"/>
                        <h:outputText value="#{customConfigController.configInfo['LastModifiedBy']}" rendered="#{not empty customConfigController.customConfig}"/>
                        <h:outputText value="#{msg.modifiedTime}:" rendered="#{not empty customConfigController.customConfig and not empty customConfigController.configInfo['LastModifiedDate']}" style="font-weight:bold; padding: 10px"/>
                        <h:outputText value="#{customConfigController.configInfo['LastModifiedDate']}" rendered="#{not empty customConfigController.customConfig}"/>
                    </h:panelGroup>
                    <p:tabView  id="tabView">
                        <p:tab title="#{msg.AssetFieldSettings}">
                            <p:dataTable id="assetFieldsTable" var='item' value="#{customConfigController.assetFieldsList}">
                                <p:column headerText="#{msg.DisplayedField}">
                                    <h:outputText value="#{customConfigController.allFields[item.key]}#{customConfigController.isSystemFields(item.key)?'*':''}"  style="color:#{customConfigController.isSystemFields(item.key)? 'red':'black'}" />
                                </p:column>
                                <p:column headerText="#{msg.ReadableRole}">
                                    <h:outputText value="#{customConfigController.getAssetFieldsRoles(item.readRoles)}" />
                                </p:column>
                                <p:column headerText="#{msg.ExportableRole}">
                                    <h:outputText value="#{customConfigController.getAssetFieldsRoles(item.exportRoles)}" />
                                </p:column>
                                <p:column headerText="#{msg.ModifiableRole}">
                                    <h:outputText value="#{customConfigController.getAssetFieldsRoles(item.editRoles)}" />
                                </p:column>
                                <p:column>
                                    <f:facet name="header" >
                                        <h:outputText />
                                        <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('UsingFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()"/>
                                    </f:facet>
                                    <p:commandLink value="#{msg.Update}" actionListener="#{customConfigController.prepareEditAssetField(item.key)}" update="assetFieldsTable :AssetFieldsEditForm" oncomplete="PF('AssetFieldsEditDialog').show()" />
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.removeAssetField(item.key)}" disabled="#{customConfigController.isSystemFields(item.key)}" update=":customConfigForm" style="padding:10px"/>
                                    <p:commandLink value="修改名称" actionListener="#{customConfigController.prepareEditAssetField(item.key)}" update="assetFieldsTable :AssetFieldsRenameForm" disabled="#{not customConfigController.isRenameFields(item.key)}" oncomplete="PF('AssetFieldsRenameDialog').show()" />
                                </p:column>
                            </p:dataTable>
                        </p:tab>
                        <p:tab title="#{msg.AssetListPage}">
                            <p:dataTable id="assetListPageTable" var='item' value="#{customConfigController.customConfigObject.assetsListPageFields}" draggableRows="true">
                                <p:ajax event="rowReorder" update="assetListPageTable"/>
                                <p:column headerText="#{msg.DisplayedField}">
                                    <h:outputText value="#{customConfigController.allFields[item]}" />
                                </p:column>

                                <p:column headerText="#{msg.Operation}">
                                    <f:facet name="header" >
                                        <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('ListPageFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()"/>
                                    </f:facet>
                                    <!--<p:commandLink value="修改" actionListener="#{customConfigController.prepareEditAssetField(item)}" update=":ListPageFieldsEditForm" oncomplete="PF('ListPageFieldsEditDialog').show()"/>-->
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.removeListPageField(item)}" update="assetListPageTable "/>
                                </p:column>
                            </p:dataTable>
                            <p:fieldset legend="排序规则">
                                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="nameSort">
                                    <h:panelGroup >
                                        <label class="label">#{msg.EquipmentName}</label>
                                        <p:selectOneMenu value="#{customConfigController.customConfigObject.assetListSort.namePyCode}" >
                                            <f:selectItem   itemLabel="请选择" itemValue=""/>
                                            <f:selectItem   itemLabel="正序" itemValue="true"/>
                                            <f:selectItem   itemLabel="倒序" itemValue="false"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup>
                                    <h:panelGroup >
                                        <label class="label">#{msg.createTime}</label>
                                        <p:selectOneMenu value="#{customConfigController.customConfigObject.assetListSort.createdDate}" >
                                            <f:selectItem   itemLabel="请选择" itemValue=""/>
                                            <f:selectItem   itemLabel="正序" itemValue="true"/>
                                            <f:selectItem   itemLabel="倒序" itemValue="false"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup>
                                    <h:panelGroup >
                                        <label class="label">#{msg.modifiedTime}</label>
                                        <p:selectOneMenu value="#{customConfigController.customConfigObject.assetListSort.lastModifiedDate}" >
                                            <f:selectItem   itemLabel="请选择" itemValue=""/>
                                            <f:selectItem   itemLabel="正序" itemValue="true"/>
                                            <f:selectItem   itemLabel="倒序" itemValue="false"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>
                        </p:tab>
                        <p:tab title="#{msg.AssetDetailPage}">
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <p:fieldset legend="#{msg.BasicInformationFieldset}">
                                    <p:orderList id="BasicFieldsList" value="#{customConfigController.customConfigObject.assetsDetailpageBasicFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('BasicFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveBasicFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                                <p:fieldset legend="#{msg.DetailFields}">
                                    <p:orderList id="DetailFieldsList" value="#{customConfigController.customConfigObject.assetsDetailpageDetailFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('DetailFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveDetailFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="#{msg.AssetEditPage}">
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <p:fieldset legend="#{msg.BasicFields}">
                                    <p:orderList id="EditpageBasicFields" value="#{customConfigController.customConfigObject.assetsEditpageBasicFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('EditpageBasicFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveEditpageBasicFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                                <p:fieldset legend="#{msg.CodeFields}">
                                    <p:orderList id="EditpageCodesFields" value="#{customConfigController.customConfigObject.assetsEditpageCodesFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('EditpageCodesFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveEditpageCodesFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                                <p:fieldset legend="#{msg.StatusFields}">
                                    <p:orderList id="EditpageStatusFields" value="#{customConfigController.customConfigObject.assetsEditpageStatusFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('EditpageStatusFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveEditpageStatusFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                                <p:fieldset legend="#{msg.CategoryFields}">
                                    <p:orderList id="EditpageCatalogFields" value="#{customConfigController.customConfigObject.assetsEditpageCatalogFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('EditpageCatalogFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveEditpageCatalogFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                                <p:fieldset legend="#{msg.DateFields}">
                                    <p:orderList id="EditpageDateFields" value="#{customConfigController.customConfigObject.assetsEditpageDateFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('EditpageDateFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveEditpageDateFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                                <p:fieldset legend="#{msg.FinancialFields}">
                                    <p:orderList id="EditpageFinicialFields" value="#{customConfigController.customConfigObject.assetsEditpageFinicialFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('EditpageFinicialFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveEditpageFinicialFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="#{msg.WeChatAssetPage}">
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <p:fieldset legend="#{msg.HeaderFields}">
                                    <p:orderList id="MobileHeaderFieldsList" value="#{customConfigController.customConfigObject.assetsMobilepageHeaderFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('MobileHeaderFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveMobileHeaderFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                                <p:fieldset legend="#{msg.BasicFields}">
                                    <p:orderList id="MobileBasicFieldsList" value="#{customConfigController.customConfigObject.assetsMobilepageBasicFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('MobileBasicFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveMobileBasicFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                                <p:fieldset legend="#{msg.DateFields}">
                                    <p:orderList id="MobileDetailFieldsList" value="#{customConfigController.customConfigObject.assetsMobilepageDetailFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('MobileDetailFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveMobileDetailFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                                <p:fieldset legend="#{msg.FilterCondition}">
                                    <p:orderList id="MobileFilterFieldsList" value="#{customConfigController.customConfigObject.assetsMobilepageFilterFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('MobileFilterFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveMobileFilterFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                            </p:panelGrid>
                        </p:tab>
                        <!--<p:tab title="xxx">
                            <p:fieldset legend="维修信息字段组">
                                <p:orderList id="WebMaintainFieldsList" value="#{customConfigController.customConfigObject.assetsMobilepageHeaderFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                <p:commandLink value="添加" actionListener="#{customConfigController.prepareAddAssetField('MobileHeaderFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                <p:commandLink value="删除" actionListener="#{customConfigController.prepareAddAssetField('RemoveMobileHeaderFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                            </p:fieldset>

                        </p:tab>-->
                        <p:tab title="微信端维修页面">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <p:dataList id="WebWorkOrderFieldsList" value="#{customConfigController.customConfigObject.mobileMaintainPage.pageWorkOrder.group}" var="groupItem" varStatus="groupIndex" type="definition" >
                                    <p:fieldset legend="维修信息字段组" rendered="#{groupItem.type eq 'assetInfo'}">
                                        <p:orderList value="#{groupItem.assetInfoFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                        <p:commandLink value="添加" actionListener="#{customConfigController.prepareAddAssetField('WebWorkOrderFieldsList')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                        <p:commandLink value="删除" actionListener="#{customConfigController.prepareAddAssetField('RemoveWebWorkOrderFieldsList')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>

                                    </p:fieldset>
                                    <p:fieldset legend="维修信息字段控制" rendered="#{groupItem.type eq 'assetInfo'}">
                                        <h:panelGroup >
                                            <label class="label">外部报价</label>
                                            <p:selectBooleanCheckbox value="#{groupItem.externalQuotation.enable}" >
                                            </p:selectBooleanCheckbox>
                                        </h:panelGroup>

                                    </p:fieldset>
                                </p:dataList>
                            </p:panelGrid>


                        </p:tab>

                        <p:tab title="#{msg.WeChatRequestPage}">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <p:dataList id="MobileWorkOrderFieldsList" value="#{customConfigController.customConfigObject.mobilePage.pageWorkOrder.group}" var="groupItem" varStatus="groupIndex" type="definition" >
                                    <p:fieldset legend="#{msg.AssetInformationDisplayFields}" rendered="#{groupItem.type eq 'assetInfo'}">
                                        <p:orderList value="#{groupItem.assetInfoFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                        <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('MobileWorkOrderFieldsList')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                        <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveMobileWorkOrderFieldsList')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                    </p:fieldset>
                                    <p:fieldset legend="#{msg.ProvideTheRequestInformation}" rendered="#{groupItem.type eq 'orderFields'}">
                                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="priorityGroup">
                                            <h:panelGroup >
                                                <label class="label">#{msg.DisplayPriority}</label>
                                                <p:selectBooleanCheckbox value="#{groupItem.priority.enable}" >
                                                </p:selectBooleanCheckbox>
                                            </h:panelGroup>
                                            <h:panelGroup >
                                                <label class="label">#{msg.Default}</label>
                                                <p:selectOneMenu value="#{groupItem.priority.defaultValue}" >
                                                    <f:selectItems value="#{fieldMsg.getFieldValueList('casePriority')}" var="item"
                                                                   itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                                </p:selectOneMenu>
                                            </h:panelGroup>
                                        </p:panelGrid>
                                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="assetStatusGroup">
                                            <h:panelGroup >
                                                <label class="label">#{msg.DisplayAssetStatus}</label>
                                                <p:selectBooleanCheckbox value="#{groupItem.assetStatus.enable}" >
                                                </p:selectBooleanCheckbox>
                                            </h:panelGroup>
                                            <h:panelGroup >
                                                <label class="label">#{msg.Default}</label>
                                                <p:selectOneMenu value="#{groupItem.assetStatus.defaultValue}" >
                                                    <f:selectItem   itemLabel="#{fieldMsg.fieldValue('assetStatus',2)}" itemValue="2"/>
                                                    <f:selectItem   itemLabel="#{fieldMsg.fieldValue('assetStatus',3)}" itemValue="3"/>
                                                </p:selectOneMenu>
                                            </h:panelGroup>
                                        </p:panelGrid>
                                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="repairReportSendPlace">
                                            <h:panelGroup >
                                                <label class="label">#{msg.DisplayRepairReportSendPlace}</label>
                                                <p:selectBooleanCheckbox value="#{groupItem.repairReportSendPlace.enable}" >
                                                </p:selectBooleanCheckbox>
                                            </h:panelGroup>
                                            <h:panelGroup >
                                                <label class="label">#{msg.Default}</label>
                                                <p:selectOneMenu value="#{groupItem.repairReportSendPlace.defaultValue}" >
                                                    <f:selectItem   itemLabel="请选择" itemValue=""/>
                                                    <f:selectItem   itemLabel="#{fieldMsg.fieldValue('repairReportSendPlace', 'ward')}" itemValue="ward"/>
                                                    <f:selectItem   itemLabel="#{fieldMsg.fieldValue('repairReportSendPlace', 'non-ward')}" itemValue="non-ward"/>
                                                </p:selectOneMenu>
                                            </h:panelGroup>
                                        </p:panelGrid>

                                        <h:panelGroup style="float:right;padding-left: 5px">
                                            <p:commandLink style="padding-left: 5px" actionListener="#{customConfigController.moveItem(groupItem,'up')}" value="#{msg.ShiftUp}"  update=":customConfigForm "   disabled="#{groupIndex.index eq 1}"/>
                                            <p:commandLink style="padding-left: 5px" actionListener="#{customConfigController.moveItem(groupItem,'down')}" value="#{msg.ShiftDown}"  update=":customConfigForm "  disabled="#{groupIndex.index eq 2}"/>
                                            <p:selectBooleanCheckbox style="padding-left: 5px"  label="#{msg.RequestPageDisplay}" value="#{groupItem.show}" />
                                        </h:panelGroup>
                                    </p:fieldset>
                                    <p:fieldset legend="#{msg.ProvideTheFaultDescription}" rendered="#{groupItem.type eq 'descriptions'}" id="descriptionsSet">
                                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="attachmentsGroup">
                                            <h:panelGroup >
                                                <label class="label">#{msg.DisplayImageUploaded}</label>
                                                <p:selectBooleanCheckbox value="#{groupItem.attachments.enable}" >
                                                    <p:ajax listener="#{customConfigController.onCheckConfig('attachments.enable')}" update="descriptionsSet"/>
                                                </p:selectBooleanCheckbox>
                                            </h:panelGroup>
                                            <h:panelGroup >
                                                <label class="label">#{msg.Required}</label>
                                                <p:selectBooleanCheckbox value="#{groupItem.attachments.required}"  disabled="#{!groupItem.attachments.enable}">
                                                    <p:ajax />
                                                </p:selectBooleanCheckbox>
                                            </h:panelGroup>
                                        </p:panelGrid>

                                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="voiceAttachmentGroup">
                                            <h:panelGroup >

                                                </p:selectBooleanCheckbox>
                                            </h:panelGroup>
                                        </p:panelGrid>

                                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="requestReasonGroup">
                                            <h:panelGroup >
                                                <label class="label">#{msg.DisplayTextDescription}</label>
                                                <p:selectBooleanCheckbox value="#{groupItem.requestReason.enable}" >
                                                    <p:ajax listener="#{customConfigController.onCheckConfig('requestReason.enable')}" update="descriptionsSet"/>
                                                </p:selectBooleanCheckbox>
                                            </h:panelGroup>
                                            <h:panelGroup >
                                                <label class="label">#{msg.Required}</label>
                                                <p:selectBooleanCheckbox value="#{groupItem.requestReason.required}" disabled="#{!groupItem.requestReason.enable}">
                                                    <p:ajax listener="#{customConfigController.onCheckConfig('requestReason.required')}" update="descriptionsSet"/>
                                                </p:selectBooleanCheckbox>
                                            </h:panelGroup>
                                            <h:panelGroup >
                                                <label class="label">#{msg.Default}</label>
                                                <p:inputText value="#{groupItem.requestReason.defaultValue}" maxlength="200" >
                                                    <p:ajax />
                                                </p:inputText>
                                            </h:panelGroup>
                                        </p:panelGrid>
                                        <br/>

                                        <h:panelGroup >
                                            <label class="label">#{msg.VoiceOrTextRequired}</label>
                                            <p:selectBooleanCheckbox value="#{groupItem.voiceOrReasonRequired}" disabled="#{!groupItem.requestReason.enable or !groupItem.voiceAttachment.enable}" >
                                                <p:ajax listener="#{customConfigController.onCheckConfig('voiceOrReasonRequired')}" update="descriptionsSet"/>
                                            </p:selectBooleanCheckbox>
                                        </h:panelGroup>

                                        <h:panelGroup style="float:right;padding-left: 5px">
                                            <p:commandLink style="padding-left: 5px" actionListener="#{customConfigController.moveItem(groupItem,'up')}" value="#{msg.ShiftUp}"  update=":customConfigForm "   disabled="#{groupIndex.index eq 1}" />
                                            <p:commandLink style="padding-left: 5px" actionListener="#{customConfigController.moveItem(groupItem,'down')}" value="#{msg.ShiftDown}"  update=":customConfigForm "  disabled="#{groupIndex.index eq 2}"/>
                                            <p:selectBooleanCheckbox style="padding-left: 5px"  label="#{msg.RequestPageDisplay}" value="#{groupItem.show}" >
                                                <p:ajax />
                                            </p:selectBooleanCheckbox>
                                        </h:panelGroup>
                                    </p:fieldset>
                                </p:dataList>

                                <h:panelGroup>
                                    <label class="label">#{msg.PartTypeDefault}</label>
                                    <p:selectOneMenu value="#{customConfigController.customConfigObject.mobilePage.pageWorkOrder.accessoryDefaultType}" >
                                        <p:ajax />
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item"
                                                       itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:tab>

                        <p:tab title="微信端扫码建档页面">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <p:fieldset legend="扫码建档字段组">
                                    <p:orderList id="MobileBuildAssetFieldsList" value="#{customConfigController.customConfigObject.assetsMobilepageBuildAssetFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('MobileBuildAssetFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveMobileBuildAssetFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                            </p:panelGrid>
                        </p:tab>

                        <p:tab title="#{msg.AssetImportant}">
                            <p:dataTable id="assetImportantFieldsTable" var='item' value="#{customConfigController.assetsImportantFieldsAll}" draggableRows="true">
                                <p:growl id="msgss" />
                                <p:ajax event="rowReorder" update="assetImportantFieldsTable"/>
                                <p:column headerText="#{msg.DisplayedField}">
                                    <h:outputText value="#{customConfigController.allFields[item]}"  />
                                </p:column>
                                <p:column headerText="#{msg.Operation}">
                                    <h:panelGroup >
                                        <p:selectBooleanCheckbox value="#{customConfigController.importantFieldsCheckedStatus[item]}">
                                            <p:ajax  listener="#{customConfigController.removeAssetsImportantFields(item)}"></p:ajax>
                                        </p:selectBooleanCheckbox>
                                    </h:panelGroup>
                                </p:column>
                            </p:dataTable>
                        </p:tab>


                        <p:tab title="供应商授权字段页面" rendered="#{customConfigController.showSupplierViewAndEditFieldsTable()}">
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <p:fieldset legend="可查看字段">
                                    <p:orderList id="SupplierViewFieldsList" value="#{customConfigController.customConfigObject.supplierViewFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('SupplierViewFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveSuppplierViewFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                                <p:fieldset legend="可编辑字段">
                                    <p:orderList id="SupplierEditFieldsList" value="#{customConfigController.customConfigObject.supplierEditFields}"  var="item" controlsLocation="none" itemLabel="#{customConfigController.allFields[item]}" itemValue="#{item}" />
                                    <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('SupplierEditFields')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()" style="padding:10px"/>
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.prepareAddAssetField('RemoveSupplierEditFields')}" update=":FieldsAddForm" oncomplete="PF('FieldsAddDialog').show()"/>
                                </p:fieldset>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="无人值守调剂计费情况列表自定义页面" rendered="#{customConfigController.enabledWhethertoenableunattended()}">
                            <p:dataTable id="assetAllocatePageTable"  var='item' value="#{customConfigController.customConfigObject.assetAllocateFields}" draggableRows="true">
                                <p:ajax event="rowReorder" update="assetAllocatePageTable"/>
                                <p:column headerText="#{msg.DisplayedField}">
                                    <h:outputText value="#{customConfigController.allAllocateFields[item]}" />
                                </p:column>
                                <p:column headerText="#{msg.Operation}">
                                    <f:facet name="header" >
                                        <p:commandLink value="#{msg.Add}" actionListener="#{customConfigController.prepareAddAssetField('assetAllocateFieldsList')}" update=":FieldsAddForm"  oncomplete="PF('FieldsAddDialog').show()"/>
                                    </f:facet>
                                    <!--<p:commandLink value="修改" actionListener="#{customConfigController.prepareEditAssetField(item)}" update=":ListPageFieldsEditForm" oncomplete="PF('ListPageFieldsEditDialog').show()"/>-->
                                    <p:commandLink value="#{msg.Delete}" actionListener="#{customConfigController.removeAllocateListPageField(item)}" update="assetAllocatePageTable "/>
                                </p:column>
                            </p:dataTable>
                        </p:tab>

                        <p:tab title="高级查询配置">
                            <p:dataTable id="advSearchFieldTable" var="fieldKey" value="#{customConfigController.allFields.keySet().toArray()}">
                                <p:column headerText="字段名称">
                                    <h:outputText value="#{customConfigController.allFields[fieldKey]}" />
                                </p:column>
                                <p:column headerText="字段类型">
                                    <h:outputText value="#{customConfigController.getFieldTypeLabel(fieldKey)}" />
                                </p:column>
                                <p:column headerText="启用">
                                    <p:selectBooleanCheckbox value="#{customConfigController.advancedSearchFieldSelection[fieldKey]}">
                                        <p:ajax process="@form" update="advSearchFieldTable" listener="#{customConfigController.setAdvancedSearchFieldSelected(fieldKey, customConfigController.advancedSearchFieldSelection[fieldKey])}" />
                                    </p:selectBooleanCheckbox>
                                </p:column>
                                <p:column headerText="默认条件" >
                                    <p:selectBooleanCheckbox value="#{customConfigController.getAdvSearchFieldConfig(fieldKey).defaultCondition}" />
                                </p:column>
                                <p:column headerText="操作" >
                                    <p:commandButton value="配置区间" icon="ui-icon-gear"
                                                     rendered="#{customConfigController.advancedSearchFieldSelection[fieldKey] and customConfigController.isRangeField(fieldKey)}"
                                                     actionListener="#{customConfigController.prepareEditAdvSearchField(fieldKey)}"
                                                     update=":advSearchRangeForm" oncomplete="PF('AdvSearchRangeDialog').show()" />
                                </p:column>
                            </p:dataTable>
                        </p:tab>
                    </p:tabView>

                    <h:panelGroup >
                        <p:commandButton value="#{msg.Onekey}#{msg.Save}"  icon="ui-icon-check" action="#{customConfigController.saveChange()}" validateClient="true" update=":customConfigForm :growl" style="float:left"/>
                        <p:commandButton value="#{msg.Onekey}#{msg.Delete}" icon="ui-icon-check" action="#{customConfigController.deleteConfig()}" validateClient="true" update=":customConfigForm :growl" style="float:left">
                            <p:confirm header="#{msg.DeleteConformation}" message="是否确认删除当前配置并使用上级组织机构的自定义配置？" icon="ui-icon-warning"/>
                        </p:commandButton>
                    </h:panelGroup>

                </h:form>

                <p:dialog id="AssetFieldsEditDialog" widgetVar="AssetFieldsEditDialog" modal="true" width="950" height="450" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.Edit}">
                    <h:form id="AssetFieldsEditForm" >
                        <h:panelGroup id="display" rendered="#{not empty customConfigController.currentEditField}">
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup >
                                    <label class="label">#{msg.name}</label>
                                    <h:outputText value="#{customConfigController.allFields[customConfigController.currentEditField.key]}"/>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <label class="label">#{msg.BasicEquipmentInformationRequired}</label>
                                    <p:selectBooleanCheckbox value="#{customConfigController.currentEditField.required}" disabled="#{customConfigController.isSystemFields(customConfigController.currentEditField.key)}"/>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <label class="label">#{msg.InstallationOfTheArrivalsRequired}</label>
                                    <p:selectBooleanCheckbox value="#{customConfigController.currentEditField.arrivalRequired}" disabled="#{customConfigController.isSystemFields(customConfigController.currentEditField.key)}"/>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <p:scrollPanel style="height: 250px; border: 0;" mode="native">
                                        <label class="label">#{msg.ReadableRole}</label>
                                        <p:selectManyCheckbox value="#{customConfigController.currentEditField.readRoles}" layout="pageDirection">
                                            <f:selectItems value="#{customConfigController.getRolesSelectItems()}" var="item" itemValue="#{item}" itemLabel="#{customConfigController.configRoles[item]}" />
                                        </p:selectManyCheckbox>
                                    </p:scrollPanel>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <p:scrollPanel style="height: 250px; border: 0;" mode="native">
                                        <label class="label">#{msg.ExportableRole}</label>
                                        <p:selectManyCheckbox value="#{customConfigController.currentEditField.exportRoles}" layout="pageDirection">
                                            <f:selectItems value="#{customConfigController.getRolesSelectItems()}" var="item" itemValue="#{item}" itemLabel="#{customConfigController.configRoles[item]}"/>
                                        </p:selectManyCheckbox>
                                    </p:scrollPanel>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <p:scrollPanel style="height: 250px; border: 0;" mode="native">
                                        <label class="label">#{msg.ModifiableRole}</label>
                                        <p:selectManyCheckbox value="#{customConfigController.currentEditField.editRoles}" disabled="#{customConfigController.isReadOnlyFields(customConfigController.currentEditField.key)}" layout="pageDirection">
                                            <f:selectItems value="#{customConfigController.getRolesSelectItems()}" var="item" itemValue="#{item}" itemLabel="#{customConfigController.configRoles[item]}"/>
                                        </p:selectManyCheckbox>
                                    </p:scrollPanel>
                                </h:panelGroup>

                            </p:panelGrid>
                            <p:fieldset id="assetTypeCheck" legend="资产分类必填" rendered="#{customConfigController.enableAssetTypeGroup()}">
                                <c:forEach items="#{customConfigController.assetTypeGroups}" var="assetTypeItem" >
                                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                        <p:selectBooleanCheckbox
                                                value="#{customConfigController.currentEditField.assetTypeRequired[assetTypeItem.encoded]}"
                                                itemLabel="#{assetTypeItem.name}">
                                            <p:ajax update="assetTypeCheck"/>
                                        </p:selectBooleanCheckbox>
                                        <p:outputLabel>#{assetTypeItem.name}</p:outputLabel>
                                    </p:panelGrid>
                                </c:forEach>
                            </p:fieldset>
                            <br/>
                            <h:panelGroup>
                                <p:commandButton immediate="false" validateClient="true" value="#{msg.Confirm}" update=" :customConfigForm:tabView:assetFieldsTable :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'AssetFieldsEditDialog');"/>
                                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('AssetFieldsEditDialog').hide()"/>
                            </h:panelGroup>
                        </h:panelGroup>
                    </h:form>
                </p:dialog>


                <p:dialog id="AssetFieldsRenameDialog" widgetVar="AssetFieldsRenameDialog" modal="true" width="950" height="450" resizable="true" draggable="true" appendTo="@(body)" header="字段重命名">
                    <h:form id="AssetFieldsRenameForm" >
                        <h:panelGroup id="display" rendered="#{not empty customConfigController.currentEditField}">
                            <h:panelGroup >
                                <h:outputText value="此修改租户内生效"/>
                            </h:panelGroup>

                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup >
                                    <label class="label">当前名称</label>
                                    <h:outputText value="#{customConfigController.allFields[customConfigController.currentEditField.key]}"/>
                                </h:panelGroup>

                                <h:panelGroup >
                                    <label class="label">系统默认</label>
                                    <h:outputText value="#{customConfigController.getSystemShowName()}"/>
                                </h:panelGroup>

                                <h:panelGroup >
                                    <label class="label">重命名</label>
                                    <p:inputText value="#{customConfigController.newName}"/>
                                </h:panelGroup>

                            </p:panelGrid>
                            <br/>
                            <h:panelGroup>
                                <p:commandButton immediate="false" validateClient="true" value="#{msg.Confirm}修改" update=" :customConfigForm:tabView:assetFieldsTable :growl" icon="ui-icon-check"  actionListener="#{customConfigController.renameField()}" oncomplete="handleSubmit(args, 'AssetFieldsRenameDialog');" />
                                <p:commandButton immediate="false" validateClient="true" value="恢复系统默认" update=" :customConfigForm:tabView:assetFieldsTable :growl"  actionListener="#{customConfigController.resetField()}" oncomplete="handleSubmit(args, 'AssetFieldsRenameDialog');"/>
                                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('AssetFieldsRenameDialog').hide()"/>
                            </h:panelGroup>
                        </h:panelGroup>
                    </h:form>
                </p:dialog>

                <p:dialog id="ListPageFieldsEditDialog" widgetVar="ListPageFieldsEditDialog" modal="true" width="600"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.Edit}">
                    <h:form id="ListPageFieldsEditForm" >
                        <h:panelGroup id="display" rendered="#{not empty customConfigController.currentEditField}">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup >
                                    <label class="label">#{msg.name}</label>
                                    <h:outputText value="#{customConfigController.allFields[customConfigController.currentEditField.key]}"/>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <label class="label">#{msg.ColumnWidth}%</label>
                                    <p:inputNumber value="#{customConfigController.currentEditField.widthInListPage}" symbol="%" />
                                </h:panelGroup>

                            </p:panelGrid>
                            <br/>
                            <h:panelGroup>
                                <p:commandButton immediate="false" validateClient="true" value="#{msg.Confirm}" update=" :customConfigForm:tabView:assetListPageTable :growl" 
                                                 icon="ui-icon-check" oncomplete="handleSubmit(args, 'ListPageFieldsEditDialog');"/>
                                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('ListPageFieldsEditDialog').hide()"/>
                            </h:panelGroup>
                        </h:panelGroup>
                    </h:form>
                </p:dialog>

                <p:dialog id="FieldsAddDialog" widgetVar="FieldsAddDialog" modal="true" width="1000" height="400"  resizable="true" draggable="true" appendTo="@this" header="选择字段">
                    <h:form id="FieldsAddForm" >
                        <h:panelGroup id="display" rendered="#{not empty customConfigController.addFieldsType}">
                            <h:outputText value="#{msg.NoAddableField}" rendered="#{empty customConfigController.addFieldsList}" />
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <c:forEach items="#{customConfigController.addFieldsList}" var="item" >
                                    <c:if test="#{customConfigController.addFieldsType ne 'assetAllocateFieldsList'}">
                                        <h:panelGroup >
                                            <p:selectBooleanCheckbox label="#{customConfigController.allFields[item]}" value="#{customConfigController.selectedAddFields[item]}"   />
                                        </h:panelGroup>
                                    </c:if>
                                    <c:if test="#{customConfigController.addFieldsType eq 'assetAllocateFieldsList'}">
                                        <h:panelGroup >
                                            <p:selectBooleanCheckbox label="#{customConfigController.allAllocateFields[item]}" value="#{customConfigController.selectedAddFields[item]}"   />
                                        </h:panelGroup>
                                    </c:if>

                                </c:forEach>
                            </p:panelGrid>
                            <br/>
                            <h:panelGroup>
                                <p:commandButton immediate="false" validateClient="true" actionListener="#{customConfigController.addAssetFields()}" value="#{msg.Confirm}" 
                                                 update="#{customConfigController.getAddFieldsUpdateString()} :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'FieldsAddDialog');"/>
                                <p:commandButton immediate="true" actionListener="#{customConfigController.cancelAddFields}" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('FieldsAddDialog').hide()"/>
                            </h:panelGroup>
                        </h:panelGroup>
                    </h:form>
                </p:dialog>
                <p:dialog id="AdvSearchRangeDialog" widgetVar="AdvSearchRangeDialog" modal="true" width="700" resizable="true" draggable="true" appendTo="@(body)" header="区间配置">
                    <h:form id="advSearchRangeForm">
                        <h:panelGroup rendered="#{not empty customConfigController.currentAdvSearchEditField}">
                            <h:outputText value="字段: #{customConfigController.allFields[customConfigController.currentAdvSearchEditField.fieldKey]}" style="font-weight:bold;display:block;margin-bottom:10px" />
                            <ui:repeat value="#{customConfigController.currentAdvSearchEditField.ranges}" var="range" varStatus="rStatus">
                                <h:panelGrid columns="4" style="margin-bottom: 5px; width: 100%;">
                                    <h:panelGroup>
                                        <h:outputText value="最小值: " />
                                        <p:inputText value="#{range.minValue}" placeholder="最小值" style="width: 120px;" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <h:outputText value="最大值: " />
                                        <p:inputText value="#{range.maxValue}" placeholder="空=无上限" style="width: 120px;" />
                                    </h:panelGroup>
                                    <p:commandButton value="删除" icon="ui-icon-trash"
                                                     actionListener="#{customConfigController.removeRangeOption(rStatus.index)}"
                                                     update=":advSearchRangeForm" process="@form" />
                                    <h:outputText value="" />
                                </h:panelGrid>
                            </ui:repeat>
                            <br/>
                            <p:commandButton value="添加区间" icon="ui-icon-plus" actionListener="#{customConfigController.addRangeOption()}" update=":advSearchRangeForm" process="@form" />
                            <br/><br/>
                            <p:commandButton value="确定" icon="ui-icon-check" process="@form"
                                             update=":advSearchRangeForm"
                                             oncomplete="PF('AdvSearchRangeDialog').hide()" />
                        </h:panelGroup>
                    </h:form>
                </p:dialog>
            </div>
        </div>
    </ui:define>
</ui:composition>
