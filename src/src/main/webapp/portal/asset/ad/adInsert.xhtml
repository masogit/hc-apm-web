<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="设备宣传广告新建" />
			</div>

			<div class="ui-g-12 card">
				<h:form id="assetADForm">
					<p:fieldset style="margin-bottom:20px">
						<p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
							<h:panelGroup>
                                <label class="label">System ID</label>
                                <p:inputText id="system_id" value="#{assetADController.assetAD.systemID}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">广告描述</label>
                                <p:inputText id="comment" value="#{assetADController.assetAD.comment}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">广告内容</label>
                                <p:inputText id="content" value="#{assetADController.assetAD.content}"/>
                            </h:panelGroup>
						</p:panelGrid>
					</p:fieldset>
					
					<h:panelGroup id="buttonGroup">
                        <p:commandButton value="#{msg.Save}" icon="ui-icon-check" action="#{assetInfoController.applyChange()}" validateClient="true" update=":growl" style="float:left" rendered="#{!(assetInfoController.needAssetApproval(assetInfoController.selected.siteUID) and (assetInfoController.CRUDActionName eq msg.Create or assetInfoController.selected.usageStatus ne 3))}"/>
                    </h:panelGroup>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
