<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="assetADEditDlg" widgetVar="assetADEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="设备绩效配置">
            <h:form id="assetADEditForm">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{assetADController.selected != null}">

                    <h:panelGroup >
                        <label class="label" >SystemID</label>
                        <p:inputText value="#{assetADController.selected.systemId}" required="true" requiredMessage="SytemID不能为空"/>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">描述</label>
                        <p:inputText value="#{assetADController.selected.comment}"/>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{assetADController.save}" update=":assetADTab:assetADEditDlg, :assetADTab:assetADListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'assetADEditDialog');"/>

                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('assetADEditDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
