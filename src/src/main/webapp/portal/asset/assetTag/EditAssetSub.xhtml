<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <!--新增 标签关注/修改 标签关注-->
    <p:dialog class="acl1" id="AssetSubscribEditDlg" height="550" width="1300" widgetVar="AssetSubscribEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{assetSubscriberController.CRUDActionName} #{msg.EquipmentFocus}">
        <h:form id="AssetSubscribEditForm">
            <h:panelGroup>
                <label class="label">#{msg.roleId}</label>
                <p:selectCheckboxMenu
                        id = "roleList"
                        rendered="#{assetSubscriberController.CRUDActionName.equals(msg.Create)}"
                        value="#{assetSubscriberController.subscribeRoleIndexList}"
                        label="#{assetSubscriberController.selectRoleName}"
                        filter="true"
                        converter="javax.faces.Integer"
                        filterMatchMode="contains"
                        panelStyle="width:280px" style="width:15%;height: 40px"
                        scrollHeight="260"
                        onHide="refreshUserListRC()" updateLabel="true"
                >
                    <f:selectItems value="#{assetSubscriberController.roleListVO}"
                                   var="roleItem"
                                   itemLabel="#{roleItem.roleDesc}"
                                   itemValue="#{roleItem.index}"/>
                    <p:ajax event="change" listener="#{assetSubscriberController.onSubscribeUsersChange}"/>
                </p:selectCheckboxMenu>
                <!-- 定义远程命令：用于在面板关闭时刷新 userList -->
                <p:remoteCommand
                        name="refreshUserListRC"
                        update="roleList userList"
                        process="@this"
                        global="false" />
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">#{msg.subscriber}</label>
                <p:selectCheckboxMenu
                        id = "userList"
                        rendered="#{assetSubscriberController.CRUDActionName.equals(msg.Create)}"
                        value="#{assetSubscriberController.subscribeUserIds}"
                        label="#{assetSubscriberController.selectUserName}"
                        filter="true"
                        converter="javax.faces.Integer"
                        filterMatchMode="contains"
                        panelStyle="width:280px" style="width:15%;height: 40px"
                        scrollHeight="260"
                        onHide="refreshUserListRC()"
                >
                    <f:selectItems value="#{assetSubscriberController.tenantUserList}"
                                   var="u"
                                   itemLabel="#{assetSubscriberController.getUserName(u)}"
                                   itemValue="#{u.id}" />
                    <p:ajax event="change" listener="#{assetSubscriberController.onSubscribeUsersChange}"/>
                </p:selectCheckboxMenu>
                <!-- 定义远程命令：用于在面板关闭时刷新 userList -->
                <p:remoteCommand
                        name="refreshUserListRC"
                        update="userList"
                        process="@this"
                        global="false" />
            </h:panelGroup>
            <h:panelGroup id="display" rendered="#{assetSubscriberController.selected != null}">
                <p:fieldset legend="#{msg.SelectedEquipment}" rendered="#{assetSubscriberController.CRUDActionName.equals(msg.Edit)}" >
                    <h:panelGroup>
                        <h:panelGrid columns="2">
                            <h:outputLabel class="label">#{msg.EquipmentName2}:</h:outputLabel>
                            <h:outputLabel
                                           value="#{assetSubscriberController.getSelectedAssetName()}"></h:outputLabel>
                        </h:panelGrid>
                    </h:panelGroup>
                </p:fieldset>

                <p:fieldset rendered="#{assetSubscriberController.CRUDActionName.equals(msg.Create)}" legend="#{msg.EquipmentSelection}">
                    <p:panelGrid columns="8" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup  >
                        <!--设备分类-->
                        <label class ="label">#{msg.assetGroup}</label>
                        <p:selectOneMenu value="#{assetSubscriberController.queryAsset1.assetGroup}" disabled="false" >
                            <p:ajax  listener="#{assetSubscriberController.getQueryAssetsList()}" update="datalist" />
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.hospitalId}</label>
                            <p:inputText id="selectedOrgName" value="#{assetSubscriberController.selectedOrg==null ? '': assetSubscriberController.selectedOrg.name}" readonly="true"/>
                            <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                            <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{assetSubscriberController.orgTree}" selection="#{assetSubscriberController.selectedNode}" var="node" selectionMode="single">
                                        <p:ajax process="@this" event="select" update="scriTab:AssetSubscribEditForm:selectedOrgName, scriTab:AssetSubscribEditForm:datalist, scriTab:AssetSubscribEditForm:clinicalDeptName" listener="#{assetSubscriberController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>

                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
										<p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.clinicalDeptId}</label>
                            <p:selectOneMenu id="clinicalDeptName" value="#{assetSubscriberController.queryAsset1.clinicalDeptId}">
                                <p:ajax  listener="#{assetSubscriberController.getQueryAssetsList()}" update="datalist" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{assetSubscriberController.clinicalDeptList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.measuringItemCategory}</label>
                            <p:selectOneMenu id="measuringItemCategory" value="#{assetSubscriberController.queryAsset1.measuringItemCategory}">
                                <p:ajax  listener="#{assetSubscriberController.getQueryAssetsList()}" update="datalist" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('measuringItemCategory')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.repairForm}</label>
                            <p:selectOneMenu id="repairForm" value="#{assetSubscriberController.queryAsset1.repairForm}">
                                <p:ajax  listener="#{assetSubscriberController.getQueryAssetsList()}" update="datalist" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('repairForm')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                </p:panelGrid>
                    <p:fieldset rendered="#{assetSubscriberController.CRUDActionName.equals(msg.Create)}"  legend="设备" id="assetList" style="margin-bottom:20px">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                            <p:dataTable id="datalist" value="#{assetSubscriberController.selectAssetInfos}"
                                         var="item"
                                         lazy="true" paginator="true" paginatorPosition="both"
                                         paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         rows="20" emptyMessage="#{msg.noRecordFound}"
                                         rowsPerPageTemplate="20,50,100,500">
                                <p:ajax event="page" />
                                <p:column width="40" id="checkBoxCol">
                                    <p:selectBooleanCheckbox value="#{assetSubscriberController.selectedAssetUidTable1[item.uid]}" class="selectCheckBox1">
                                        <p:ajax event="change" listener="#{assetSubscriberController.updateSelctedAssetList1}" update="@(.selectCheckBoxHeader1)"/>
                                        <f:attribute name="assetObj" value="#{item}"/>
                                    </p:selectBooleanCheckbox>
                                    <f:facet name="header">
                                        <p:selectBooleanCheckbox value="#{assetSubscriberController.allSelected1}" id="selectCheckBoxHeader1" class="selectCheckBoxHeader1">
                                            <p:ajax event="change" listener="#{assetSubscriberController.addAssetsOfCurrentPage1}" update="@(.selectCheckBox1)"/>
                                        </p:selectBooleanCheckbox>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="#{msg.assetName}">
                                    <h:outputText value="#{item.name}" />
                                </p:column>
                                <p:column headerText="#{msg.functionType}" >
                                    <h:outputText value="#{item.functionType}"/>
                                </p:column>
                                <p:column headerText="#{msg.assetGroup}">
                                    <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                                </p:column>
                                <p:column headerText="#{msg.departNum}">
                                    <h:outputText value="#{item.departNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.qrCode}" >
                                    <h:outputText value="#{item.qrCode}"/>
                                </p:column>
                                <p:column headerText="#{msg.clinicalDeptName}">
                                    <h:outputText value="#{item.clinicalDeptName}"/>
                                </p:column>
                            </p:dataTable>
                        </p:panelGrid>
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                            <p:commandButton validateClient="true" actionListener="#{assetSubscriberController.addCheckedDevice}" value="添加已勾选设备" icon="fa fa-filter" process="@form" update="assetList assetList2 :growl"
                            >
                            </p:commandButton>
                        </p:panelGrid>
                        <p:panelGrid columns="1" layout="grid" id="assetList2" styleClass="ui-panelgrid-blank form-group ">
                            <p:dataTable id="datalist1" value="#{assetSubscriberController.selectAsset}"
                                         var="item"
                                         widgetVar="selectedTable"
                                         lazy="true" paginator="true" paginatorPosition="both"
                                         paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         rows="20" emptyMessage="#{msg.noRecordFound}" rowKey="#{item.id}"
                                         rowsPerPageTemplate="20,50,100,500">
                                <p:ajax event="page" />
                                <p:column width="40" id="checkBoxCol1">
                                    <p:selectBooleanCheckbox value="#{assetSubscriberController.selectedAssetUidTable2[item.uid]}" class="selectCheckBox2">
                                        <p:ajax event="change" listener="#{assetSubscriberController.updateSelctedAssetList2}" update="@(.selectCheckBoxHeader2)"/>
                                        <f:attribute name="assetObj" value="#{item}"/>
                                    </p:selectBooleanCheckbox>
                                    <f:facet name="header">
                                        <p:selectBooleanCheckbox value="#{assetSubscriberController.allSelected2}" id="selectCheckBoxHeader2" class="selectCheckBoxHeader2">
                                            <p:ajax event="change" listener="#{assetSubscriberController.addAssetsOfCurrentPage2}" update="@(.selectCheckBox2)"/>
                                        </p:selectBooleanCheckbox>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="#{msg.assetName}" >
                                    <h:outputText value="#{item.name}" />
                                </p:column>
                                <p:column headerText="#{msg.functionType}"  >
                                    <h:outputText value="#{item.functionType}"/>
                                </p:column>
                                <p:column headerText="#{msg.assetGroup}" >
                                    <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                                </p:column>
                                <p:column headerText="#{msg.departNum}" >
                                    <h:outputText value="#{item.departNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.qrCode}" >
                                    <h:outputText value="#{item.qrCode}"/>
                                </p:column>
                                <p:column headerText="#{msg.clinicalDeptName}" >
                                    <h:outputText value="#{item.clinicalDeptName}"/>
                                </p:column>
                            </p:dataTable>
                        </p:panelGrid>
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                            <p:commandButton  validateClient="true" actionListener="#{assetSubscriberController.deleteCheckedDevice}" value="删除已勾选设备" update="assetList assetList2 :growl" icon="ui-icon-check"/>
                            <p:commandButton  value="全部清空" actionListener="#{assetSubscriberController.clearAll}"  icon="ui-icon-cancel" update="assetList assetList2 :growl" />
                        </p:panelGrid>
                    </p:fieldset>


                    <!--</h:panelGroup>-->
                </p:fieldset>
                <p:fieldset legend="#{msg.MessageSettings}">
                    <h:panelGrid columns="5" id="grid">
                        <h:panelGroup>
                            <h:panelGrid columns="2">
                                <p:outputLabel value="#{msg.RepairEvent}: "/>
                            </h:panelGrid>
                        </h:panelGroup>
                        <h:panelGroup>
                            <h:panelGrid columns="2">
                                <p:selectBooleanCheckbox class="ck2" value="#{assetSubscriberController.selected.level0}"/>
                                <p:outputLabel value="#{fieldMsg.fieldValue('casePriority','1')}"/>
                            </h:panelGrid>
                        </h:panelGroup>
                        <h:panelGroup>
                            <h:panelGrid columns="2">
                                <p:selectBooleanCheckbox class="ck3" value="#{assetSubscriberController.selected.level1}"/>
                                <p:outputLabel value="#{fieldMsg.fieldValue('casePriority','2')}"/>
                            </h:panelGrid>
                        </h:panelGroup>
                        <h:panelGroup>
                            <h:panelGrid columns="2">
                                <p:selectBooleanCheckbox class="ck4" value="#{assetSubscriberController.selected.level2}"/>
                                <p:outputLabel value="#{fieldMsg.fieldValue('casePriority','3')}"/>
                            </h:panelGrid>
                        </h:panelGroup>
                        <h:panelGroup>
                            <h:panelGrid columns="2">
                                <p:selectBooleanCheckbox class="ck5" value="#{assetSubscriberController.selected.isReceiveTimeoutMsg}">
                                    <p:ajax update="@(.ck5)"></p:ajax>
                                </p:selectBooleanCheckbox>
                                <p:outputLabel value="#{fieldMsg.fieldValue('casePriority','4')}"/>
                            </h:panelGrid>
                        </h:panelGroup>
                    </h:panelGrid>
                    <h:panelGrid columns="2" rendered = "#{userContextService.isLocale()}">
                        <h:panelGroup>
                            <h:panelGrid columns="2">
                                <p:outputLabel value="#{msg.MeasurementEvent}:"/>
                            </h:panelGrid>
                        </h:panelGroup>
                        <h:panelGroup>
                            <h:panelGrid columns="2">
                                <p:selectBooleanCheckbox value="#{assetSubscriberController.selected.meterHit}"/>
                            </h:panelGrid>
                        </h:panelGroup>
                    </h:panelGrid>
                </p:fieldset>
                <br/>

            </h:panelGroup>

            <p:commandButton  actionListener="#{assetSubscriberController.saveAssetSub()}" value="#{msg.Save}" update="scriTab:AssetTagSubscribEditForm scriTab:AssetSubscriberForm :growl" icon="ui-icon-check" oncomplete="handleToSave(xhr, status, args)"/>

            <p:commandButton immediate="true" value="#{msg.Cancel}"  actionListener="#{assetSubscriberController.cancel()}" icon="ui-icon-cancel" update="scriTab:TagSubscriberForm" onclick="PF('AssetSubscribEditDialog').hide()"/>
        </h:form>
    </p:dialog>
    <script>
        function handleToSave(xhr, status, args) {
            if(args.addAsset){
                // $('#scriTab\\:AssetSubscribEditForm\\:datalist1').addClass("ui-state-error");
            }else if(args.priority){
                // $('#scriTab\\:AssetSubscribEditForm\\:grid').addClass("ui-state-error");
            }
            else{
                handleSubmit(args, 'AssetSubscribEditDialog');
            }
        }

    </script>

</ui:composition>
</html>
