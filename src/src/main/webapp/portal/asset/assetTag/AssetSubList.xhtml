<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>

    <div class="ui-g clearfix">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="#{msg.MessageSubscriber}"/>
        </div>
        <div class="ui-g-12 card">
            <h:form id ="AssetSubscriberForm" style="margin-top: 20px;">

                <p:dataTable  class="dt" id="dataList" value="#{assetSubscriberController.lazyModel}" var="item" widgetVar="varDataListAsset" selectionMode="single" selection="#{assetSubscriberController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                              rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                              paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                              currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                              rows="20" emptyMessage="#{msg.noRecordFound}"
                              rowsPerPageTemplate="20,50,100,500">
                    <p:ajax event="filter" listener="#{assetSubscriberController.onFilter}" />
                    <p:column width="36"  exportable="false">
                        <p:selectBooleanCheckbox  class="selectCheckBox" value="#{assetSubscriberController.selectedMap[item.id]}">
                            <p:ajax update="@(.selectCheckBoxHeader) @(.delCls) @(.editCls) @(.btnEdit)" listener="#{assetSubscriberController.onItemSelected}" />
                        </p:selectBooleanCheckbox>
                        <f:facet name="header">
                            <p:selectBooleanCheckbox id="selectCheckBoxHeader" value="#{assetSubscriberController.isSelectedCurrentPage}"  class="selectCheckBoxHeader">
                                <p:ajax update="@(.selectCheckBox)  @(.delCls) @(.btnEdit)" listener="#{assetSubscriberController.onSelectAllOfPage}"/>
                            </p:selectBooleanCheckbox>
                        </f:facet>
                    </p:column>
                    <p:column headerText="#{msg.suscriber}" filterMatchMode="LIKE" filterBy="#{item.subscriberUser.name}" sortBy="#{item.subscriberUser.name}">
                        <h:outputText value="#{item.subscriberUser.name}" />
                    </p:column>

                    <p:column headerText="#{msg.devicelb}" filterMatchMode="LIKE" filterBy="#{item.assetInfo.name}" sortBy="#{item.assetInfo.name}">
                        <h:outputText value="#{item.assetInfo.name}" />
                    </p:column>


                    <p:column headerText="#{msg.clinicalDeptId}" filterMatchMode="LIKE" filterBy="#{item.assetInfo.clinicalDeptName}" sortBy="#{item.assetInfo.clinicalDeptName}">
                        <h:outputText value="#{item.assetInfo.clinicalDeptName}" />
                    </p:column>
                    <p:column headerText="#{msg.assetDeptName}" filterMatchMode="LIKE" filterBy="#{item.assetInfo.assetDeptUID}" sortBy="#{item.assetInfo.assetDeptUID}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataListAsset').filter()" filter="true" filterMatchMode="contains" filterNormalize="true" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{assetSubscriberController.assetDeptList}" var="item" itemLabel="#{item}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </f:facet>

                        <h:outputText value="#{assetSubscriberController.getOrgInfoByUid(item.assetInfo.assetDeptUID).name}" />
                    </p:column>

                    <p:column headerText="#{msg.EquipmentID}" filterMatchMode="LIKE" filterBy="#{item.assetInfo.departNum}" sortBy="#{item.assetInfo.departNum}">
                        <h:outputText value="#{item.assetInfo.departNum}"/>
                    </p:column>

                    <p:column headerText="#{msg.functionType}" filterMatchMode="LIKE" filterBy="#{item.assetInfo.functionType}" sortBy="#{item.assetInfo.functionType}">
                        <h:outputText value="#{item.assetInfo.functionType}" />
                    </p:column>

                    <p:column headerText="#{msg.qrCode}" filterMatchMode="EQ" filterBy="#{item.assetInfo.qrCode}">
                        <h:outputText value="#{item.assetInfo.qrCode}" />
                    </p:column>

                    <p:column headerText="#{msg.RepairEvent}" filterBy="#{assetSubscriberController.repairEventLevelCsv(item)}">
                        <!-- 显示：把勾选的紧急程度用逗号拼接 -->
                        <h:outputText value="#{assetSubscriberController.repairEventLabelCsv(item)}" />

                        <!-- 筛选：多选紧急程度（不改实体类），由 Controller 在 loadData 里做二次过滤 -->
                        <f:facet name="filter">
                            <p:selectCheckboxMenu value="#{assetSubscriberController.repairEventFilter}"  label="#{msg.SelectOneMessage}" panelStyle="width:240px" scrollHeight="200">
                                <f:selectItem itemLabel="#{fieldMsg.fieldValue('casePriority','1')}" itemValue="1" />
                                <f:selectItem itemLabel="#{fieldMsg.fieldValue('casePriority','2')}" itemValue="2" />
                                <f:selectItem itemLabel="#{fieldMsg.fieldValue('casePriority','3')}" itemValue="3" />
                                <f:selectItem itemLabel="#{fieldMsg.fieldValue('casePriority','4')}" itemValue="4" />
                                <p:ajax event="change" oncomplete="PF('varDataListAsset').filter()"/>
                                <p:ajax event="toggleSelect" oncomplete="PF('varDataListAsset').filter()" update="dataList"/>
                            </p:selectCheckboxMenu>
                        </f:facet>
                    </p:column>
                    <f:facet name="{Toolbar}">
                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_MESSAGE_EDIT')}" actionListener="#{assetSubscriberController.prepareCreate}" update="scriTab:AssetSubscribEditDlg scriTab:AssetSubscribEditForm"  oncomplete="PF('AssetSubscribEditDialog').show()"/>
                        <p:commandButton id="editButton" class ="editCls" actionListener="#{assetSubscriberController.prepareEdit}" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_MESSAGE_EDIT')}" icon="ui-icon-pencil" title="#{msg.Edit}"  update="scriTab:AssetSubscribEditDlg" oncomplete="PF('AssetSubscribEditDialog').show()" disabled="#{assetSubscriberController.multiSelect()}"/>
                        <p:commandButton icon="fa fa-cogs" class="btnEdit" title="#{msg.BatchModify}" id="batchEditButton"
                                         disabled="#{assetSubscriberController.checkBatchEdit()}"
                                         oncomplete="PF('batchDlg').show()"
                                         update="scriTab:AssetSubscriberForm:batchDlg"/>
                        <p:commandButton id="deleteButton" process="@this" class="btn delCls" icon="ui-icon-close" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_MESSAGE_DELETE')}" title="#{msg.Delete}" actionListener="#{assetSubscriberController.delete}" update="scriTab:AssetSubscriberForm:dataList" disabled="#{not assetSubscriberController.isChecked()}">
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
                <p:dialog id="batchDlg" widgetVar="batchDlg" modal="true" width="720" header="#{msg.batchEdit}">
                    <p:fieldset legend="#{msg.MessageSettings}">
                        <h:panelGrid columns="4">
                            <p:selectBooleanCheckbox value="#{assetSubscriberController.batch.level0}"/>
                            <h:outputText value="#{fieldMsg.fieldValue('casePriority','1')}"/>

                            <p:selectBooleanCheckbox value="#{assetSubscriberController.batch.level1}"/>
                            <h:outputText value="#{fieldMsg.fieldValue('casePriority','2')}"/>

                            <p:selectBooleanCheckbox value="#{assetSubscriberController.batch.level2}"/>
                            <h:outputText value="#{fieldMsg.fieldValue('casePriority','3')}"/>

                            <p:selectBooleanCheckbox value="#{assetSubscriberController.batch.isReceiveTimeoutMsg}"/>
                            <h:outputText value="#{fieldMsg.fieldValue('casePriority','4')}"/>
                        </h:panelGrid>
                    </p:fieldset>

                    <p:separator/>

                    <p:commandButton value="#{msg.Save}" icon="pi pi-check"
                                     action="#{assetSubscriberController.applyBatchUpdate}"
                                     update="dataList"
                                     oncomplete="if(!args.validationFailed) PF('batchDlg').hide();"/>
                    <p:commandButton value="#{msg.Cancel}" icon="pi pi-times"
                                     onclick="PF('batchDlg').hide();return false;"/>
                </p:dialog>
            </h:form>
            <ui:include src="EditAssetSub.xhtml"/>
        </div>
    </div>
</ui:composition>
</html>
