<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>

    <!--<ui:define name="content">-->
    <div class="ui-g clearfix">
        <div class="ui-g-12 card cardTitle">
            <p:outputLabel class="pageTitle" value="标签设备消息订阅"/>
        </div>
        <div class="ui-g-12 card">
            <h:form id ="TagSubscriberForm" style="margin-top: 20px;">
                <p:dataTable  class="dt" id="dataList" value="#{tagSubscriberController.lazyModel}" var="item" widgetVar="varDataListTag" selectionMode="single" selection="#{tagSubscriberController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                              rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                              paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                              currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                              rows="20" emptyMessage="#{msg.noRecordFound}"
                              rowsPerPageTemplate="20,50,100,500">
                    <p:ajax event="rowSelect" update="@(.editCls) @(.delCls)"/>
                    <p:ajax event="filter" listener="#{tagSubscriberController.onFilter}" />

                    <p:column headerText="关注者" filterMatchMode="LIKE" filterBy="#{item.subscriberUser.name}" sortBy="#{item.subscriberUser.name}">
                        <h:outputText value="#{item.subscriberUser.name}" />
                    </p:column>

                    <p:column headerText="#{msg.AssetTag}" filterMatchMode="LIKE">
                        <h:outputText value="#{tagSubscriberController.getTagName(item.tagId)}" />
                    </p:column>

                    <p:column headerText="#{msg.messagepushoption}" >
                        <h:outputText value="#{tagSubscriberController.getMsgMode(item.receiveMsgMode)}" />
                    </p:column>
                    <p:column headerText="#{msg.overtimenotification}" ><h:outputText value="#{item.isReceiveTimeoutMsg?'推送':'不推送'}" style="color:#{item.isReceiveTimeoutMsg?'blue':'red'} "/></p:column>

                    <f:facet name="{Toolbar}">
                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{tagSubscriberController.prepareCreate}" update="scriTab:AssetTagSubscribEditDlg scriTab:AssetTagSubscribEditForm" oncomplete="PF('AssetTagSubscribEditDialog').show()"/>

                        <p:commandButton id="editButton" class ="editCls" actionListener="#{tagSubscriberController.prepareEdit}" icon="ui-icon-pencil" title="#{msg.Edit}"  update="scriTab:AssetTagSubscribEditDlg" oncomplete="PF('AssetTagSubscribEditDialog').show()" disabled="#{empty tagSubscriberController.selected or tagSubscriberController.selected.getReceiveMsgMode()==3}"/>

                        <p:commandButton id="deleteButton" class="delCls" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{tagSubscriberController.delete}" update="scriTab:TagSubscriberForm:dataList" disabled="#{empty tagSubscriberController.selected}">
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>
            <ui:include src="EditSub.xhtml"/>
        </div>
    </div>
    <!-- </ui:define>-->

</ui:composition>
</html>
