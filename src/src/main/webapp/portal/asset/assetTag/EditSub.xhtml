<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
<!--新增 标签关注/修改 标签关注-->
        <p:dialog id="AssetTagSubscribEditDlg" widgetVar="AssetTagSubscribEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{tagSubscriberController.CRUDActionName} 标签关注">
            <h:form id="AssetTagSubscribEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{tagSubscriberController.selected != null}">
                        <h:panelGroup >
                            <label class="label" >关注人</label>
                            <p:selectOneMenu disabled="#{!(userContextService.hasRole('ITAdmin') or userContextService.hasRole('LocalITAdmin'))}" value="#{tagSubscriberController.selected.subscribeUserId}"  required="true" requiredMessage="关注人不能为空">
                            <!--<p:selectOneMenu disabled="#{!userContextService.hasRole('ITAdmin') or !userContextService.hasRole('LocalITAdmin')}" value="#{tagSubscriberController.selected.subscribeUserId}"  required="true" requiredMessage="关注人不能为空">-->
                                <p:ajax update=":AssetTagSubscribEditForm:assetTag" event="change" listener="#{tagSubscriberController.takeAssetTags()}"></p:ajax>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{tagSubscriberController.tenantUserList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup >
                            <label class="label">设备标签*</label>
                            <p:selectOneMenu id="assetTag" value="#{tagSubscriberController.selected.tagId}" required="true" requiredMessage="设备标签不能为空">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{tagSubscriberController.assetTags}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        
                        <h:panelGroup  >
                            <label class="label">工单消息推送选项*</label>
                            <p:selectOneMenu  value="#{tagSubscriberController.selected.receiveMsgMode}" required="true" requiredMessage="工单消息推送选项不能为空">
                                <p:ajax update=":AssetTagSubscribEditForm:id1" event="change"></p:ajax>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{tagSubscriberController.msgModeList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup id ="id1">
                            <p:selectBooleanCheckbox  rendered="#{tagSubscriberController.selected.receiveMsgMode!=3}" value="#{tagSubscriberController.selected.isReceiveTimeoutMsg}"  itemLabel="工单超时消息推送"/>
                        </h:panelGroup>

                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{tagSubscriberController.saveTagSub}" value="#{msg.Save}" update="@(.dt) :AssetTagSubscribEditDlg :TagSubscriberForm:dataList :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'AssetTagSubscribEditDialog');"/>

                    <p:commandButton immediate="true" value="#{msg.Cancel}"  actionListener="#{tagSubscriberController.cancel()}" icon="ui-icon-cancel" update="TagSubscriberForm" onclick="PF('AssetTagSubscribEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
