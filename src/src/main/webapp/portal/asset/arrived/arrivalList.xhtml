<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.AssetArrivalListMgmt}"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="AssetArrivalListForm">
                    <p:dataTable id="datalist" value="#{assetArrivedListController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{assetArrivedListController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.arrivalDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,40,60,90">
                        <p:ajax event="rowSelect" update="createButton deleteButton viewButton exportPdfButton saveAsButton" />
                        <p:ajax event="filter" listener="#{assetArrivedListController.onFilter}" update="createButton deleteButton" />
                        <p:column headerText="到货单名称/编号" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.creatorUID}" sortBy="#{item.creatorUID}" filterBy="#{item.creator.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.creator.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.arrivalDate}" sortBy="#{item.arrivalDate}" filterBy="#{item.arrivalDate}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterArrivalDate" widgetVar="varFilterArrivalDate" value="#{assetArrivedListController.arrivalFormatTime}"/>
                            </f:facet>
                            <h:outputText value="#{item.arrivalDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.assetName}" sortBy="#{item.assetName}" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                        <p:column headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                        <p:column headerText="#{msg.quantity}" sortBy="#{item.quantity}">
                            <h:outputText value="#{item.quantity}"/>
                        </p:column>
                        <p:column headerText="#{msg.ArrivalProcessType}" sortBy="#{item.processType}" filterBy="#{item.processType}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('arrivalListProcessType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{fieldMsg.fieldValue('arrivalListProcessType',item.processType)}"/>
                        </p:column>
                        <p:column headerText="#{msg.status}" sortBy="#{item.status}" filterBy="#{item.status}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('arrivalListStatus', item.status)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('arrivalListStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" action="#{assetArrivedListController.createAction}" update="datalist"  />
                            <p:commandButton id="viewButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" action="#{assetArrivedListController.editAction}" update="datalist " disabled="#{empty assetArrivedListController.selected}"/>
                            <p:commandButton id="saveAsButton" icon="ui-icon-save" class="btn btn-sm btn-gray" title="另存为" action="#{assetArrivedListController.saveAsAction}" update="datalist" disabled="#{empty assetArrivedListController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{assetArrivedListController.delete}" update=":AssetArrivalListForm:datalist, :growl"  disabled="#{empty assetArrivedListController.selected or assetArrivedListController.selected.status ne 1}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="AssetContract_export"/>
                            </p:commandButton>
                            <p:commandButton id="exportPdfButton" title="导出选中记录到PDF" icon="ui-icon-document" ajax="false" class="btn btn-sm btn-gray" actionListener="#{assetArrivedListController.exportSelectedToPdf()}" update="datalist" disabled="#{empty assetArrivedListController.selected}">
                                <p:fileDownload value="#{assetArrivedListController.exportPdf}" />
                            </p:commandButton>
                            
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
        
        <p:overlayPanel id="idPanelFilterArrivalDate" widgetVar="panelFilterArrivalDate" for=":AssetArrivalListForm:datalist:filterArrivalDate" dismissable="false">
            <h:panelGrid columns="2">
                <p:outputLabel value="#{msg.From}"/>
                <p:calendar timeZone="GMT+8"  widgetVar="varArrivalDateFrom" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                <p:outputLabel value="#{msg.To}"/>
                <p:calendar timeZone="GMT+8"  widgetVar="varArrivalDateTo" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
            </h:panelGrid>
            <p:commandButton onclick="setDateFilter('varDataList', 'varFilterArrivalDate', 'varArrivalDateFrom', 'varArrivalDateTo'); PF('panelFilterArrivalDate').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
            <p:commandButton onclick="PF('panelFilterArrivalDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
        </p:overlayPanel>
    </ui:define>
</ui:composition>
