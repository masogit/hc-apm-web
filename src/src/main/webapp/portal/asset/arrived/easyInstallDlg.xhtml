<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition>
        <p:dialog id="easyInstallDialog" widgetVar="easyInstallDialog" modal="true"  resizable="true" draggable="true" width="1000" appendTo="@(body)" header="分配安装"  height="430">
            <h:form id="easyInstallDialogForm" >

                <h:panelGroup id="display3" rendered="#{not empty assetArrivedListEditController.easyInstallItem}">

                    <p:fieldset  legend="#{msg.AssetArrivalListAssetInfo}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">分配数量</label>
                                <p:spinner value="#{assetArrivedListEditController.installCount}"  min="1" max="#{assetArrivedListEditController.getNewInstallAssetList().size()}">
                                    <p:ajax process="@this" update="fieldset"/>
                                </p:spinner>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.clinicalDeptName}*</label>
                                <p:selectOneMenu id="clinicalDeptName" value="#{assetArrivedListEditController.easyInstallItem.clinicalDeptUID}" required="true" requiredMessage="#{msg.clinicalDeptName} #{msg.ValidationRequire}">
                                    <p:ajax  update=":easyInstallDialogForm:clinicalOwnerName" process="@this" />
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{orgTreeController.getClinicalDeptListBySite(assetArrivedListEditController.selected.siteUID)}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>


                            <h:panelGroup>
                                <label class="label">安装工时</label>
                                <p:inputText value="#{assetArrivedListEditController.easyInstallItem.workHours}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">同时生成保养工单</label>
                                <p:selectBooleanButton title="同时生成保养工单"    onLabel="是" offLabel="否"  value="#{assetArrivedListEditController.generateMap['generatePmorder']}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:fieldset  legend="#{msg.AssetArrivalListAssetInfoInput}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.aliasName}</label>
                                <p:inputText id="aliasName" value="#{assetArrivedListEditController.easyInstallItem.aliasName}"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.assetOwnerName}</label>
                                <p:selectOneMenu id="assetOwnerName" value="#{assetArrivedListEditController.easyInstallItem.assetOwnerUID}" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{assetArrivedListEditController.getOwnerList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.assetOwnerName2}</label>
                                <p:selectOneMenu id="assetOwnerName2" value="#{assetArrivedListEditController.easyInstallItem.assetOwnerUID2}"  >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{assetArrivedListEditController.getOwnerList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.assetOwnerName3}</label>
                                <p:selectOneMenu id="assetOwnerName3" value="#{assetArrivedListEditController.easyInstallItem.assetOwnerUID3}"  >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{assetArrivedListEditController.getOwnerList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.clinicalOwnerName}</label>
                                <p:selectOneMenu id="clinicalOwnerName" value="#{assetArrivedListEditController.easyInstallItem.clinicalOwnerUid}" >
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{assetArrivedListEditController.getClinicalOwnerList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.locationCode}</label>
                                <p:inputText id="locationCode" value="#{assetArrivedListEditController.easyInstallItem.locationCode}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.locationName}</label>
                                <p:inputText id="locationName" value="#{assetArrivedListEditController.easyInstallItem.locationName}"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.comments}</label>
                                <p:inputTextarea value="#{assetArrivedListEditController.easyInstallItem.comments}"  maxlength="256"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset id="fieldset"  legend="#{msg.AssetArrivalListAssetInfoInput}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup rendered="#{assetArrivedListEditController.installCount eq 1}">
                                <label class="label">#{msg.serialNum}</label>
                                <p:inputText value="#{assetArrivedListEditController.easyInstallItem.serialNum}" />
                            </h:panelGroup>
                            <h:panelGroup rendered="#{assetArrivedListEditController.installCount eq 1}">
                                <label class="label">#{msg.departNum}</label>
                                <p:inputText id="departNum2" value="#{assetArrivedListEditController.easyInstallItem.departNum}" />
                            </h:panelGroup>
                            <h:panelGroup  >
                                <label class="label">#{msg.financingNum}</label>
                                <p:inputText value="#{assetArrivedListEditController.easyInstallItem.financingNum}" class="financingNum">
                                    <p:ajax process="@this" update="#{empty assetArrivedListEditController.easyInstallItem.financingNum? '':'@(.financingNum)'}"/>
                                </p:inputText>
                                <p:selectBooleanButton title="生成#{msg.financingNum}" onLabel="是" offLabel="否"  value="#{assetArrivedListEditController.generateMap['generateFinancingNum']}" rendered="#{assetArrivedListEditController.installCount gt 1}"/>
                                <p:commandButton actionListener="#{assetArrivedListEditController.generateFinacialNum()}" rendered="#{assetArrivedListEditController.installCount eq 1}" disabled="#{assetArrivedListEditController.easyInstallItem.financingNum.length() gt 3}" update="@(.financingNum)" icon="ui-icon-repeat" title="#{msg.Renew}" class="popupIconButton financingNum" process="@(.financingNum)"/>
                            </h:panelGroup>
                            <h:panelGroup id="qrCode" rendered="#{assetArrivedListEditController.installCount eq 1}">
                                <label class="label">#{msg.qrCode}</label>
                                <p:inputText  value="#{assetArrivedListEditController.easyInstallItem.qrCode}" readonly="#{not empty assetArrivedListEditController.easyInstallItem.qrCode}"/>
                                <p:commandButton actionListener="#{assetArrivedListEditController.renewQrcode()}" disabled="#{not empty assetArrivedListEditController.easyInstallItem.qrCode}" update="qrCode" icon="ui-icon-repeat" title="#{msg.Renew}" class="popupIconButton" process="@this"/>
                            </h:panelGroup>
<!--                            <h:panelGroup rendered="#{assetArrivedListEditController.installCount gt 1}">
                                <label class="label">生成#{msg.financingNum}</label>
                                <p:inputText value="#{assetArrivedListEditController.easyInstallItem.financingNum}" />
                                <p:selectBooleanButton title="生成#{msg.financingNum}" onLabel="是" offLabel="否"  value="#{assetArrivedListEditController.generateMap['generateFinancingNum']}"/>
                            </h:panelGroup>-->

                            <h:panelGroup rendered="#{assetArrivedListEditController.installCount gt 1}">
                                <label class="label">生成#{msg.qrCode}</label>
                                <p:selectBooleanButton title="生成#{msg.qrCode}"    onLabel="是" offLabel="否"  value="#{assetArrivedListEditController.generateMap['generateQrCode']}"/>
                            </h:panelGroup>


                            
                        </p:panelGrid>
                    </p:fieldset>

                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{assetArrivedListEditController.submitEasyInstall()}" value="安装" update=":AssetArrivalEditForm :easyInstallDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'easyInstallDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{assetArrivedListEditController.cancelSaveEasyInstall()}" icon="ui-icon-cancel" onclick="PF('easyInstallDialog').hide()"/>
                    </h:panelGroup>

                    <br/>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
