<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <h:form id="AssetArrivalEditForm">
            <p:fieldset  id="editSet" legend="#{assetArrivedListController.selected.id==null? msg.Create: assetArrivedListController.selected.status ne '1' ? msg.View:msg.Edit }" style="margin-bottom:20px" rendered="#{assetArrivedListController.selected != null}">
                <h:panelGroup id="display">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListSiteUID}</label>

                            <p:inputText id="selectedOrgName" value="#{assetArrivedListController.selectedOrg.orgFullName}" readonly="true" required="true" requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
                            <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;" disabled="#{assetArrivedListController.selected.status ne '1'}" />
                            <p:overlayPanel id="panelOrg" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;" value="#{assetArrivedListController.orgTree}" selection="#{assetArrivedListController.selectedNode}" var="node" selectionMode="single">
                                        <p:ajax process="@this" event="select" update=":AssetArrivalEditForm:selectedOrgName" listener="#{assetArrivedListController.onSelectOrgFromTree}" oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>

                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListName}*</label>
                            <p:inputText value="#{assetArrivedListController.selected.name}" required="true" requiredMessage="#{msg.arrivalListName} #{msg.ValidationRequire}" readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListOrderType}*</label>
                            <p:selectOneMenu value="#{assetArrivedListController.selected.orderType}" disabled="#{assetArrivedListController.selected.status ne '1'}" required="true" requiredMessage="#{msg.arrivalListOrderType} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('arrivalListOrderType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListAssetName}*</label>
                            <p:inputText value="#{assetArrivedListController.selected.assetName}" required="true" requiredMessage="#{msg.arrivalListAssetName} #{msg.ValidationRequire}" readonly="#{assetArrivedListController.selected.status ne '1'}"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.assetGroup}*</label>
                            <p:selectOneMenu id="assetGroup" value="#{assetArrivedListController.selected.assetGroup}" required="true" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}" disabled="#{assetArrivedListController.selected.status ne '1'}" >
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                                <label class="label">#{msg.arrivalDate}*</label>
                                <p:calendar timeZone="GMT+8"  id="manufactDate" pattern="yyyy/MM/dd" value="#{assetArrivedListController.selected.arrivalDate}" required="true" requiredMessage="#{msg.arrivalDate} #{msg.ValidationRequire}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"  />
                            </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListFunctionType}</label>
                            <p:inputText value="#{assetArrivedListController.selected.functionType}" readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListManufacture}</label>
                            <p:inputText value="#{assetArrivedListController.selected.manufacture}" readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.quantity}*</label>
                            <p:inputNumber  maxValue="99999"  decimalPlaces="0" value="#{assetArrivedListController.selected.quantity}"  readonly="#{assetArrivedListController.selected.status ne '1'}" required="true" requiredMessage="#{msg.quantity} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.brand}</label>
                            <p:inputText value="#{assetArrivedListController.selected.brand}"  readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListOrigin}</label>
                            <p:inputText value="#{assetArrivedListController.selected.origin}" readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListInvoiceNum}</label>
                            <p:inputText value="#{assetArrivedListController.selected.invoiceNum}" readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListContractNum}</label>
                            <p:inputText value="#{assetArrivedListController.selected.contractNum}" readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListContractPrice}</label>
                            <p:inputNumber  maxValue="99999999"  decimalPlaces="4" value="#{assetArrivedListController.selected.contractPrice}" readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListVendor}</label>
                            <p:inputText value="#{assetArrivedListController.selected.vendor}" readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListAgent}</label>
                            <p:inputText value="#{assetArrivedListController.selected.agent}" readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListClassCode}</label>
                            <p:inputText value="#{assetArrivedListController.selected.classCode}" readonly="#{assetArrivedListController.selected.status ne '1'}" />
                        </h:panelGroup>



                    </p:panelGrid>
                    <p:dataTable rendered="#{not empty assetArrivedListController.arrivalItemList}"  sortBy="#{item.itemNum}" value="#{assetArrivedListController.arrivalItemList}" var="item">
                        <p:column headerText="#{msg.arrivalListItemNum}" >
                            <h:outputText value="#{item.itemNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.serialNum}">
                            <h:outputText value="#{item.serialNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.AssetArrivalListBusinessAck}">
                            <h:outputText value="#{fieldMsg.fieldValue('arrivalListAckStatus',item.businessAckStatus)}"/>
                        </p:column>
                        <p:column headerText="#{msg.AssetArrivalListClinicalAck}">
                            <h:outputText value="#{fieldMsg.fieldValue('arrivalListAckStatus',item.clinicalAckStatus)}"/>
                        </p:column>
                        <p:column headerText="#{msg.AssetArrivalListTechnicalAck}">
                            <h:outputText value="#{fieldMsg.fieldValue('arrivalListAckStatus',item.technicalAckStatus)}"/>
                        </p:column>
                        <p:column headerText="#{msg.status}">
                            <h:outputText value="#{fieldMsg.fieldValue('arrivalListItemStatus',item.installStatus)}"/>
                        </p:column>

                    </p:dataTable>
                    <h:panelGroup rendered="#{assetArrivedListController.selected.status eq '1'}">
                        <p:commandButton validateClient="true"  actionListener="#{assetArrivedListController.applyChange}" value="#{msg.Save}" update=":AssetArrivalEditForm :AssetArrivalListForm:datalist, :growl" icon="ui-icon-check"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{assetArrivedListController.cancel}" update="display,:AssetArrivalEditForm :growl"/>
                        <p:commandButton validateClient="true" value="#{msg.Submit}"  actionListener="#{assetArrivedListController.submitArrivalList}" update=":AssetArrivalEditForm :AssetArrivalListForm :growl" disabled="#{assetArrivedListController.selected.status ne 1}"/>
                    </h:panelGroup>

                </h:panelGroup>
            </p:fieldset>
        </h:form>

    </ui:composition>
</html>
