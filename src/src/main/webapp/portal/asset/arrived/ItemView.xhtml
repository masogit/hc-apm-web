<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <h:form id="ItemViewForm">
            <p:fieldset id="display" legend="到货单信息" rendered="#{not empty assetArrivedItemsController.selected}">

                <p:fieldset  legend="#{msg.AssetArrivalListInfo}" rendered="#{not empty assetArrivedItemsController.selected}">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.name}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.name}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.assetName}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.assetName}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.assetGroup}</label>
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup', assetArrivedItemsController.selected.arrivalList.assetGroup)}" />
                        </h:panelGroup>
                        <!--                        <h:panelGroup>
                                                    <label class="label">#{msg.brand}</label>
                                                    <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.brand}" />
                                                </h:panelGroup>-->
<!--                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListOrderType}</label>
                            <h:outputText value="#{fieldMsg.fieldValue('arrivalListOrderType', assetArrivedItemsController.selected.arrivalList.orderType)}" />
                        </h:panelGroup>-->
                        <h:panelGroup>
                            <label class="label">#{msg.functionType}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.functionType}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.quantity}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.quantity}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.manufacture}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.manufacture}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListOrigin}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.origin}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListInvoiceNum}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.invoiceNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListContractPrice}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.contractPrice}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListContractNum}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.contractNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.vendor}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.vendor}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListAgent}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.agent}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.creatorUID}</label>
                            <h:outputText value="#{assetArrivedItemsController.getUserAccountByUid(assetArrivedItemsController.selected.arrivalList.creatorUID).name}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalDate}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.arrivalList.arrivalDate}" />
                        </h:panelGroup>

                    </p:panelGrid>


                </p:fieldset>
            </p:fieldset>
        </h:form>

    </ui:composition>
</html>
