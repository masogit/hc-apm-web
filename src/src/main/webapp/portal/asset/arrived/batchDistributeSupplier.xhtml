<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <ui:include src="createSupplier.xhtml"/>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="绑定供应商管理（批量）"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="batchdistributeSupplierForm">
                    <p:fieldset legend="绑定供应商" id="distributeSupplier">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.vendor}<span style="color:red">*</span></label>
                                <p:autoComplete id="vendor" dropdown="true" value="#{assetArrivedListEditController.supplier}"  scrollHeight="300"  forceSelection="true" required="true" requiredMessage="#{msg.vendor} #{msg.PersonnelCannotBeEmpty}"
                                                disabled="#{not assetArrivedListController.isChecked()}" completeMethod="#{assetArrivedListEditController.autoCompleteVendor}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                                    <p:ajax event="itemSelect" listener="#{assetArrivedListEditController.onSupplierChange2}" update="distributeSupplier" />
                                    <p:ajax listener="#{assetArrivedListEditController.onSupplierChange2}"/>
                                </p:autoComplete>
                                <p:commandButton id="createSupplierButton4" icon="ui-icon-plus" title="#{msg.Create}" process="@this" actionListener="#{assetArrivedListEditController.prepareCreateSupplier('supplier')}" update="SupplierEditDlg" oncomplete="PF('SupplierEditDialog').show()" disabled="#{not assetArrivedListController.isChecked()}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">供应商责任人<span style="color:red">*</span></label>
                                <p:selectOneMenu id="supplierUser" value="#{assetArrivedListEditController.installCount}" style="width:125px" required="true" requiredMessage="供应商责任人 #{msg.PersonnelCannotBeEmpty}" disabled="#{not assetArrivedListController.isChecked()}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{assetArrivedListEditController.supplierUserList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:commandButton value="#{msg.Save}" actionListener="#{assetArrivedListEditController.saveDistributeSupplier(assetArrivedListController.selectedMap)}" update="datalist" style="margin-right: 10px;" disabled="#{not assetArrivedListController.isChecked() or empty assetArrivedListEditController.supplier}"/>
                                <p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-arrow-back" action="arrivalList?faces-redirect=true" update=":batchdistributeSupplierForm"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:dataTable id="datalist" value="#{assetArrivedListController.lazyModel}" var="item" widgetVar="varDataList" liveResize="true" resizeMode="fit"
                                 selectionMode="single" selection="#{assetArrivedListController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.contractNum}"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="filter" listener="#{assetArrivedListController.onFilter}" oncomplete="updateSelectAllCheckBox();"/>
                        <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />

                        <p:column width="36" id="checkBoxColumn">
                            <p:selectBooleanCheckbox value="#{assetArrivedListController.selectedMap[item.id]}"  class="selectCheckBox">
                                <p:ajax process="@this" update="@this batchdistributeSupplierForm" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header"  >
                                <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                    <p:ajax listener="#{assetArrivedListController.onSelectAllOfPage}" update="@(.selectCheckBox) batchdistributeSupplierForm" oncomplete="updateSelectAllCheckBox();"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column headerText="到货单名称/编号" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.arrivalListContractNum}" sortBy="#{item.contractNum}" filterBy="#{item.contractNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.contractNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.creatorUID}" sortBy="#{item.creatorUID}" filterBy="#{item.creator.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.creator.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.assetName}" sortBy="#{item.assetName}" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                        <p:column headerText="供应商联系人绑定" sortBy="#{item.supplierUserId}" filterBy="#{item.supplierUserId}" filterMatchMode="EQ">
                            <h:outputText value="未绑定" rendered="#{empty item.supplierUserId}"/>
                            <h:outputText value="已绑定" rendered="#{not empty item.supplierUserId}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{assetArrivedListController.supplierUserBind}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('supplierUserBind')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.vendor}" sortBy="#{item.vendor}" filterBy="#{item.vendor}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.vendor}"/>
                        </p:column>
                        <p:column headerText="供应商责任人">
                            <h:outputText value="#{assetArrivedListController.getSupplierUserName(item.supplierUserId)}"/>
                        </p:column>
                        <p:column headerText="#{msg.status}">
                            <h:outputText value="#{assetArrivedListController.getArrivalListStatus(item.id, item.status)}"/>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>

        <script>
            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked;
                });
                $("#batchdistributeSupplierForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
        </script>
    </ui:define>
</ui:composition>
