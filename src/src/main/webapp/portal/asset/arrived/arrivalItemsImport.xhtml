<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<div class="ui-g">
	<div class="ui-g-12 card">
		<h:form enctype="multipart/form-data">
			<p:fieldset legend="#{msg.BatchImport3} #{msg.AssetArrivalListAssetInfo}" id="uploaderContainer">
				<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
					<p:fileUpload fileUploadListener="#{assetArrivedItemsImportController.handleFileUpload}" mode="advanced" dragDropSupport="false" multiple="false" auto="true"
						invalidFileMessage="#{msg.OnlySupportsXlsOrXlsxFormat}" invalidSizeMessage="#{msg.FileSizeMustNotExceedFiveM}" update=":arrivalItemsTab:dataListForm, :arrivalItemsTab:AssetArrivalItemListForm"
						sizeLimit="5242880" allowTypes="/(\.|\/)(xls|xlsx)$/" label="#{msg.ImportFromExcel}" cancelLabel="#{msg.Cancel}" uploadLabel="#{msg.ConfirmUpload}" />
				</p:panelGrid>
				<h:panelGroup>
					<p>#{msg.description}</p>
					<p>
						1. <p:commandLink value="#{msg.downloadTemplateFile}" ajax="false" actionListener="#{fileDownloadService.exportTemplateFile('ARRIVAL_ITEM')}" styleClass="p-mr-2"/>
					</p>
					<p>2. #{msg.FillInTheFileToBeImported}</p>
					<p>3. #{msg.upFileImport}</p>
				</h:panelGroup>
			</p:fieldset>
		</h:form>
	</div>

	<div class="ui-g-12 card">
		<h:form id="dataListForm">
			<p:messages id="messages" showDetail="true" closable="false" autoUpdate="false">
			</p:messages>
			<p:fieldset legend="#{msg.ImportFailureData}">
				<p:dataTable id="datalist2" rendered="#{not empty assetArrivedItemsImportController.importFailedDataList}"
					value="#{assetArrivedItemsImportController.importFailedDataList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
					paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
					currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">
					<p:column headerText="#{msg.EXCELRowNumber}">
						<h:outputText value="#{item.excelRow}" />
					</p:column>
					<p:column headerText="到货单名称/编号">
						<h:outputText value="#{item.name}" />
					</p:column>
					<p:column headerText="#{msg.assetName}">
						<h:outputText value="#{item.assetName}" />
					</p:column>
					<p:column headerText="#{msg.hospitalId}">
						<h:outputText value="#{item.site}" />
					</p:column>
					<p:column headerText="#{msg.clinicalDeptName}">
						<h:outputText value="#{item.clinicalDept}" />
					</p:column>
					<p:column headerText="#{msg.FailureInformation}" >
						<h:outputText value="#{item.errMsg}"/>
					</p:column>
					<f:facet name="{Toolbar}">
						<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
							<p:dataExporter type="xls" target="datalist2" fileName="UserAccountImportFailed_export" />
						</p:commandButton>
					</f:facet>
				</p:dataTable>
			</p:fieldset>
		</h:form>

	</div>
</div>
</html>
