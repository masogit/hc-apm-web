<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"

    <ui:composition>

        <h:form id="ItemDetailViewForm">

                <p:fieldset  legend="#{msg.AssetArrivalListAssetInfo}" rendered="#{not empty assetArrivedItemsController.selected}">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.arrivalListItemNum}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.itemNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.clinicalDeptName}</label>
                            <h:outputText value="#{assetArrivedItemsController.getOrgNameByUid(assetArrivedItemsController.selected.clinicalDeptUID)}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.financingNum}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.financingNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.serialNum}</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.serialNum}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.currentPersonUID}</label>
                            <h:outputText value="#{assetArrivedItemsController.getUserAccountByUid(assetArrivedItemsController.selected.currentPersonUID).name}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">安装工时</label>
                            <h:outputText value="#{assetArrivedItemsController.selected.workHours}" />
                        </h:panelGroup>
                    </p:panelGrid>

                </p:fieldset>
                <p:fieldset  legend="#{msg.AssetArrivalListAssetInfoInput}">

                        <h:panelGroup>

                            <p:inputText id="aliasName" value="#{assetArrivedItemsController.selected.aliasName}" readonly="true"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.assetOwnerName}</label>
                            <p:inputText value="#{assetArrivedItemsController.getUserAccountByUid(assetArrivedItemsController.selected.assetOwnerUID).name}" readonly="true" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.assetOwnerName2}</label>
                            <p:inputText value="#{assetArrivedItemsController.getUserAccountByUid(assetArrivedItemsController.selected.assetOwnerUID2).name}" readonly="true" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.assetOwnerName3}</label>
                            <p:inputText value="#{assetArrivedItemsController.getUserAccountByUid(assetArrivedItemsController.selected.assetOwnerUID3).name}" readonly="true" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.clinicalOwnerName}</label>
                            <p:inputText value="#{assetArrivedItemsController.getUserAccountByUid(assetArrivedItemsController.selected.clinicalOwnerUid).name}" readonly="true" />

                        <h:panelGroup>

                            <p:inputText id="locationName" value="#{assetArrivedItemsController.selected.locationName}" readonly="true"/>
                        </h:panelGroup>

                        <h:panelGroup >
                            <label class="label">#{msg.comments}</label>
                            <p:inputTextarea value="#{assetArrivedItemsController.selected.comments}"  maxlength="256" readonly="true"/>
                        </h:panelGroup>

                    </p:panelGrid>
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.manufactDate}</label>
                            <p:inputText  value="#{assetArrivedItemsController.selected.manufactDate}" readonly="true">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.purchaseDate}</label>
                            <p:inputText value="#{assetArrivedItemsController.selected.purchaseDate}" readonly="true">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                            </p:inputText>
                        </h:panelGroup>
                        <!--                        <h:panelGroup>
                                                    <label class="label">#{msg.arriveDate}</label>
                                                    <p:inputText  value="#{assetArrivedItemsController.selected.arriveDate}" readonly="true">

                        <h:panelGroup>
                            <label class="label">#{msg.warrantyDate}</label>

                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>

                            <p:inputText  value="#{assetArrivedItemsController.selected.terminateDate}" readonly="true">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                            </p:inputText>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.purchasePrice}</label>
                            <p:inputNumber minValue="0" decimalPlaces="2" id="purchasePrice" value="#{assetArrivedItemsController.selected.purchasePrice}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.salvageValue}</label>
                            <p:inputNumber minValue="0" decimalPlaces="2" id="salvageValue" value="#{assetArrivedItemsController.selected.salvageValue}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.lifecycle}</label>
                            <p:inputNumber minValue="0" decimalPlaces="1" value="#{assetArrivedItemsController.selected.lifecycleInYear}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.depreciationMethod}</label>
                            <p:inputText value="#{fieldMsg.fieldValue('depreciationMethodList',assetArrivedItemsController.selected.depreciationMethod)}"  readonly="true"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset legend="#{msg.assetCategory}" style="margin-bottom:20px">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.assetUsage}</label>
                            <p:inputText value="#{fieldMsg.fieldValue('assetUsage',assetArrivedItemsController.selected.assetUsage)}"  readonly="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.capitalSource}</label>
                            <p:inputText value="#{fieldMsg.fieldValue('capitalSource',assetArrivedItemsController.selected.capitalSource)}"  readonly="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.measureGrade}</label>
                            <p:inputText value="#{fieldMsg.fieldValue('measureGrade',assetArrivedItemsController.selected.measureGrade)}"  readonly="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.riskGrade}</label>
                            <p:inputText value="#{fieldMsg.fieldValue('riskGrade',assetArrivedItemsController.selected.riskGrade)}"  readonly="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.emergencyEquipment}</label>
                            <p:inputText value="#{fieldMsg.fieldValue('emergencyEquipment',assetArrivedItemsController.selected.emergencyEquipment)}"  readonly="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.importEquipment}</label>
                            <p:inputText value="#{fieldMsg.fieldValue('importEquipment',assetArrivedItemsController.selected.importEquipment)}"  readonly="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.measuringItemCategory}</label>
                            <p:inputText value="#{fieldMsg.fieldValue('measuringItemCategory',assetArrivedItemsController.selected.measuringItemCategory)}"  readonly="true"/>
                        </h:panelGroup>

                        <!--                        <h:panelGroup>
                                                    <label class="label">#{msg.usageStatus}</label>
                                                    <p:inputText value="#{fieldMsg.fieldValue('usageStatus',assetArrivedItemsController.selected.usageStatus)}"  readonly="true"/>
                                                </h:panelGroup>-->

                        <h:panelGroup>
                            <label class="label">#{msg.accountingCategory}</label>
                            <p:inputText value="#{fieldMsg.fieldValue('accountingCategory',assetArrivedItemsController.selected.accountingCategory)}"  readonly="true"/>
                        </h:panelGroup>

                    </p:panelGrid>
                </p:fieldset>
                <p:fieldset  legend="#{msg.AssetArrivalListAckInfo}" rendered="#{not empty assetArrivedItemsController.selected and assetArrivedItemsController.selected.arrivalList.processType ne 'Easy'}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.AssetArrivalListBusinessAck}</label>
                            <h:outputText value="#{fieldMsg.fieldValue('arrivalListAckStatus',assetArrivedItemsController.selected.businessAckStatus)}" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{not empty assetArrivedItemsController.selected.businessAckDate}">
                            <label class="label">#{msg.AssetArrivalListBusinessAckDate}</label>
                            <p:inputText  value="#{assetArrivedItemsController.selected.businessAckDate}"  readonly="true">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                            </p:inputText>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:dataGrid var="businessPicItem" value="#{assetArrivedItemsController.getAckPicList('business')}" columns="4" layout="grid"  rendered="#{assetArrivedItemsController.selected.businessAckStatus ne 'none'}">
                        <f:facet name="header">#{msg.AssetArrivalListPic}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                <p:graphicImage url="#{fileDownloadService.getFileUrl(businessPicItem.objectStorageId)}"   style="max-width: 100%;height: auto"/> 
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">

                        <h:panelGroup>
                            <label class="label">#{msg.AssetArrivalListClinicalAck}</label>

                        </h:panelGroup>
                        <h:panelGroup rendered="#{not empty assetArrivedItemsController.selected.clinicalAckDate}">
                            <label class="label">#{msg.AssetArrivalListClinicalAckDate}</label>
                            <p:inputText  value="#{assetArrivedItemsController.selected.clinicalAckDate}"  readonly="true">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                            </p:inputText>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:dataGrid var="clinicalPicItem" value="#{assetArrivedItemsController.getAckPicList('clinical')}" columns="4" layout="grid"  rendered="#{assetArrivedItemsController.selected.clinicalAckStatus ne 'none'}">
                        <f:facet name="header">#{msg.AssetArrivalListPic}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                <p:graphicImage url="#{fileDownloadService.getFileUrl(clinicalPicItem.objectStorageId)}"   style="max-width: 100%;height: auto"/> 
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.AssetArrivalListTechnicalAck}</label>
                            <h:outputText value="#{fieldMsg.fieldValue('arrivalListAckStatus',assetArrivedItemsController.selected.technicalAckStatus)}" />
                        </h:panelGroup>
                        <h:panelGroup rendered="#{not empty assetArrivedItemsController.selected.technicalAckDate}">
                            <label class="label">#{msg.AssetArrivalListTechnicalAckDate}</label>
                            <p:inputText  value="#{assetArrivedItemsController.selected.technicalAckDate}" rendered="#{not empty assetArrivedItemsController.selected.businessAckDate}" readonly="true">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                            </p:inputText>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:dataGrid var="technicalPicItem" value="#{assetArrivedItemsController.getAckPicList('technical')}" columns="4" layout="grid"  rendered="#{assetArrivedItemsController.selected.technicalAckStatus ne 'none'}">
                        <f:facet name="header">#{msg.AssetArrivalListPic}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%">
                                <p:graphicImage url="#{fileDownloadService.getFileUrl(technicalPicItem.objectStorageId)}"   style="max-width: 100%;height: auto"/> 
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>

                </p:fieldset>

                    <p:dataList id="reportList" value="#{commonReportController.getReportList(assetArrivedItemsController.selected.id)}" var="reportItem" emptyMessage="#{msg.noRecordFound}">

        </p:fieldset>-->
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">


                </p:panelGrid>
            </p:fieldset>
        </h:form>
        <p:dialog id="qrCodeLibShowDlg" widgetVar="qrCodeLibShowDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="二维码展示">
            <h:form id="qrCodeLibShowForm">
                <h:panelGroup>
                    <label class="label">选择模版</label>
                    <p:selectOneMenu  value="#{assetArrivedItemsController.exportQrCodeTemplateId}">
                        <p:ajax update="preview" />
                        <f:selectItem itemLabel="默认使用中模版" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{assetArrivedItemsController.getQrCodeTemplates()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                    </p:selectOneMenu>
                </h:panelGroup>
                <p:panel header="#{qrCodeLibController.qrCode}" id="preview" style="text-align:center" rendered="#{not empty assetArrivedItemsController.selected.qrCode}">
                    <h:panelGrid columns="1" style="width:100%">
                        <img src="#{assetArrivedItemsController.getQrCodeImageForAsset()}" />
                        <!--<img src="#{qrCodeShowController.getQrCodeImageBase64(assetArrivedItemsController.selected.qrCode)}" />-->
                    </h:panelGrid>
                </p:panel>
            </h:form>
        </p:dialog>

    </ui:composition>
