<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="content">
        <div class="ui-g">

            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.AssetArrivalListInstallInfo}"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="ItemEditDlgForm">
                    <p:fieldset  legend="#{msg.AssetArrivalListInfo}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.name}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.name}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.assetName}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.assetName}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.assetGroup}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('assetGroup', assetInstallationController.arrivalListItem.arrivalList.assetGroup)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.functionType}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.functionType}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.quantity}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.quantity}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.arrivalListOrigin}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.origin}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.arrivalListInvoiceNum}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.invoiceNum}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.arrivalListContractPrice}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.contractPrice}" >
                                    <f:convertNumber minIntegerDigits="0"  minFractionDigits="2" />
                                </h:outputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.arrivalListContractNum}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.contractNum}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.vendor}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.vendor}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.arrivalListAgent}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.agent}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.creatorUID}</label>
                                <h:outputText value="#{assetInstallationController.getUserAccountByUid(assetInstallationController.arrivalListItem.arrivalList.creatorUID).name}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.arrivalDate}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.arrivalList.arrivalDate}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.currentPersonUID}</label>
                                <h:outputText value="#{assetInstallationController.getUserAccountByUid(assetInstallationController.arrivalListItem.currentPersonUID).name}" />
                            </h:panelGroup>

                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset  legend="#{msg.AssetArrivalListAssetInfo}" >
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">设备国标码</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.nationalStandardCode}" />
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.registrationNo}</label>
                                <h:outputText id="registrationNo" value="#{assetInstallationController.arrivalListItem.registrationNo}" />
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.maitanance}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.maitanance}"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.medicalInstrumentClassification}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('assetFunctionType', assetInstallationController.arrivalListItem.functionGroup)}"/>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">#{msg.medicalInstrumentSubclassification}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue(assetInstallationController.arrivalListItem.functionGroup, assetInstallationController.arrivalListItem.assetCode68)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.purchaseDate}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.purchaseDate}">
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </h:outputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">保修时长(年)</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.warrantyYear}" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.purchasePrice}</label>
                                <h:outputText  value="#{assetInstallationController.arrivalListItem.purchasePrice}">
                                    <f:convertNumber minIntegerDigits="0"  minFractionDigits="2" />
                                </h:outputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.salvageValue}</label>
                                <h:outputText  value="#{assetInstallationController.arrivalListItem.salvageValue}">
                                    <f:convertNumber minIntegerDigits="0"  minFractionDigits="2" />
                                </h:outputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.lifecycle}</label>
                                <h:outputText  value="#{assetInstallationController.arrivalListItem.lifecycleInYear}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.depreciationMethod}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('depreciationMethodList', assetInstallationController.arrivalListItem.depreciationMethod)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.assetUsage}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('assetUsage', assetInstallationController.arrivalListItem.assetUsage)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.capitalSource}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('capitalSource', assetInstallationController.arrivalListItem.capitalSource)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.measureGrade}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('measureGrade', assetInstallationController.arrivalListItem.measureGrade)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.riskGrade}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('riskGrade', assetInstallationController.arrivalListItem.riskGrade)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.emergencyEquipment}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('emergencyEquipment', assetInstallationController.arrivalListItem.emergencyEquipment)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.importEquipment}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('importEquipment', assetInstallationController.arrivalListItem.importEquipment)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.measuringItemCategory}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('measuringItemCategory', assetInstallationController.arrivalListItem.measuringItemCategory)}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.accountingCategory}</label>
                                <h:outputText  value="#{fieldMsg.fieldValue('accountingCategory', assetInstallationController.arrivalListItem.accountingCategory)}"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:fieldset  legend="#{msg.AssetArrivalListAssetInfo}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.arrivalListItemNum}</label>
                                <h:outputText value="#{assetInstallationController.arrivalListItem.itemNum}" />
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.clinicalDeptName}*</label>
                                <p:autoComplete dropdown="true" value="#{assetInstallationController.deptName}"  scrollHeight="300"  forceSelection="true"  completeMethod="#{assetInstallationController.autoCompleteDept}">
                                    <p:ajax event="itemSelect" listener="#{assetInstallationController.onClinicalDeptChange}" update="clinicalOwnerName @(.parentAssetList) parentAssetList" />
                                    <p:ajax listener="#{assetInstallationController.onClinicalDeptChange(null)}" update="clinicalOwnerName @(.parentAssetList) parentAssetList" />
                                </p:autoComplete>
                            </h:panelGroup>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['parentAssetId']}">
                                <h:panelGroup id="parentAssetList">
                                    <label class="label">#{msg.parentAsset}<span style="color:red">#{assetInstallationController.customConfig.assetFields['parentAssetId'].arrivalRequired? '*':''}</span></label>
                                    <p:autoComplete dropdown="true" value="#{assetInstallationController.parentAssetInfo}"  scrollHeight="300"  forceSelection="true" required="#{assetInstallationController.customConfig.assetFields['parentAssetId'].arrivalRequired}" 
                                                    requiredMessage="#{msg.parentAsset} #{msg.ValidationRequire}" completeMethod="#{assetInstallationController.completeParentAssetInfoList}" var="t" itemLabel="#{t.name}#{t.name eq null ? '' : '/'}#{t.qrCode}" itemValue="#{t}" converter="assetInfoConverter">
                                        <p:ajax event="blur" listener="#{assetInstallationController.onParentAssetInfoChange}" process="@this"/>
                                    </p:autoComplete>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['aliasName']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.aliasName}<span style="color:red">#{assetInstallationController.customConfig.assetFields['aliasName'].arrivalRequired? '*':''}</span></label>
                                    <p:inputText id="aliasName" value="#{assetInstallationController.arrivalListItem.aliasName}" required="#{assetInstallationController.customConfig.assetFields['aliasName'].arrivalRequired}" 
                                                 requiredMessage="#{msg.aliasName} #{msg.ValidationRequire}"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['serialNum']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.serialNum}<span style="color:red">#{assetInstallationController.customConfig.assetFields['serialNum'].arrivalRequired? '*':''}</span></label>
                                    <p:inputText value="#{assetInstallationController.arrivalListItem.serialNum}" id="serialNum" required="#{assetInstallationController.customConfig.assetFields['serialNum'].arrivalRequired}" 
                                                 requiredMessage="#{msg.serialNum} #{msg.ValidationRequire}"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['departNum']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.departNum}<span style="color:red">#{(assetInstallationController.needInstorageCheck or assetInstallationController.customConfig.assetFields['departNum'].arrivalRequired)? '*':''}</span></label>
                                    <p:inputText id="departNum2" value="#{assetInstallationController.arrivalListItem.departNum}" class="financingNum" required="#{assetInstallationController.needInstorageCheck or assetInstallationController.customConfig.assetFields['departNum'].arrivalRequired}" 
                                                 requiredMessage="#{msg.departNum} #{msg.ValidationRequire}">
                                        <p:ajax process="@this" listener="#{assetInstallationController.onDepartNumChange('departNum')}" update="@(.financingNum)" />
                                    </p:inputText>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['financingNum']}">
                                <h:panelGroup >
                                    <label class="label">#{msg.financingNum}<span style="color:red">#{(assetInstallationController.needInstorageCheck or assetInstallationController.customConfig.assetFields['financingNum'].arrivalRequired)? '*':''}</span></label>
                                    <p:inputText  value="#{assetInstallationController.arrivalListItem.financingNum}" class="financingNum" required="#{assetInstallationController.needInstorageCheck or assetInstallationController.customConfig.assetFields['financingNum'].arrivalRequired}" 
                                                  requiredMessage="#{msg.financingNum} #{msg.ValidationRequire}">
                                        <p:ajax event="keyup" process="@this" update="generateFinancingNum"/>
                                        <p:ajax process="@this" listener="#{assetInstallationController.onDepartNumChange('financingNum')}" update="departNum2 qrCode generateFinancingNum @(.financingNum)"/>
                                    </p:inputText>
                                    <p:commandButton id="generateFinancingNum" validateClient="false" actionListener="#{assetInstallationController.gennerateFinancingNum()}" disabled="#{assetInstallationController.arrivalListItem.financingNum.length() gt 4}" 
                                                     update="@(.financingNum)" icon="ui-icon-repeat" title="#{msg.Renew}" class="popupIconButton financingNum" process="@(.financingNum)"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['qrCode']}">
                                <h:panelGroup id="qrCode" class="financingNum">
                                    <label class="label">#{msg.qrCode}#{assetInstallationController.needInstorageCheck?'*':''}<span style="color:red">#{(assetInstallationController.needInstorageCheck or assetInstallationController.customConfig.assetFields['qrCode'].arrivalRequired)? '*':''}</span></label>
                                    <p:inputText  value="#{assetInstallationController.arrivalListItem.qrCode}" required="#{assetInstallationController.needInstorageCheck or assetInstallationController.customConfig.assetFields['qrCode'].arrivalRequired}" 
                                                  requiredMessage="#{msg.qrCode} #{msg.ValidationRequire}">
                                        <p:ajax listener="#{assetInstallationController.onQrCodeChange()}" update="@(.financingNum)" />
                                    </p:inputText>
                                    <p:commandButton actionListener="#{assetInstallationController.renewQrcode()}" disabled="#{not empty assetInstallationController.arrivalListItem.qrCode}" update="@(.financingNum)" icon="ui-icon-repeat" title="#{msg.Renew}" class="popupIconButton" process="@this"/>
                                    <p:commandButton process="@this" icon="ui-icon-search" title="#{msg.View}" update=":qrCodeLibShowDlg" oncomplete="PF('qrCodeLibShowDialog').show()" disabled="#{empty assetInstallationController.arrivalListItem.qrCode}" class="popupIconButton"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['systemId']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.systemId}<span style="color:red">#{assetInstallationController.customConfig.assetFields['systemId'].arrivalRequired? '*':''}</span></label>
                                    <p:inputText id="systemId" value="#{assetInstallationController.arrivalListItem.systemId}" required="#{assetInstallationController.customConfig.assetFields['systemId'].arrivalRequired}" 
                                                 requiredMessage="#{msg.systemId} #{msg.ValidationRequire}"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['barcode']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.barcode}<span style="color:red">#{assetInstallationController.customConfig.assetFields['barcode'].arrivalRequired? '*':''}</span></label>
                                    <p:inputText id="barcode" value="#{assetInstallationController.arrivalListItem.barcode}" required="#{assetInstallationController.customConfig.assetFields['barcode'].arrivalRequired}" 
                                                 requiredMessage="#{msg.barcode} #{msg.ValidationRequire}"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['modalityId']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.modalityId}<span style="color:red">#{assetInstallationController.customConfig.assetFields['modalityId'].arrivalRequired? '*':''}</span></label>
                                    <p:inputText id="modalityId" value="#{assetInstallationController.arrivalListItem.modalityId}" required="#{assetInstallationController.customConfig.assetFields['modalityId'].arrivalRequired}" 
                                                 requiredMessage="#{msg.modalityId} #{msg.ValidationRequire}"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['manufactDate']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.manufactDate}<span style="color:red">#{assetInstallationController.customConfig.assetFields['manufactDate'].arrivalRequired? '*':''}</span></label>
                                    <p:calendar timeZone="GMT+8"  id="manufactDate" pattern="yyyy/MM/dd" value="#{assetInstallationController.arrivalListItem.manufactDate}" required="#{assetInstallationController.customConfig.assetFields['manufactDate'].arrivalRequired}" 
                                                requiredMessage="#{msg.manufactDate} #{msg.ValidationRequire}" maxdate="#{assetInstallationController.arrivalListItem.arrivalList.arrivalDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"  />
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['warrantyDate']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.warrantyDate}<span style="color:red">#{assetInstallationController.customConfig.assetFields['warrantyDate'].arrivalRequired? '*':''}</span></label>
                                    <p:calendar timeZone="GMT+8"  id="warrantyDate" pattern="yyyy/MM/dd" value="#{assetInstallationController.arrivalListItem.warrantyDate}" required="#{assetInstallationController.customConfig.assetFields['warrantyDate'].arrivalRequired}" 
                                                requiredMessage="#{msg.warrantyDate} #{msg.ValidationRequire}" mindate="#{appContextService.curentDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['installDate']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.InstallDate}<span style="color:red">#{assetInstallationController.customConfig.assetFields['installDate'].arrivalRequired? '*':''}</span></label>
                                    <p:calendar timeZone="GMT+8"  pattern="yyyy/MM/dd" value="#{assetInstallationController.arrivalListItem.installDate}" required="#{assetInstallationController.customConfig.assetFields['installDate'].arrivalRequired}" 
                                                requiredMessage="#{msg.installDate} #{msg.ValidationRequire}" mindate="#{assetInstallationController.arrivalListItem.arrivalList.arrivalDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['assetOwnerName']}">
                                <h:panelGroup >
                                    <label class="label">#{msg.assetOwnerName}<span style="color:red">#{assetInstallationController.customConfig.assetFields['assetOwnerName'].arrivalRequired? '*':''}</span></label>
                                    <p:autoComplete id="assetOwnerName" value="#{assetInstallationController.owner1}" converter="userAccountConverter" dropdown="true" forceSelection="true" required="#{assetInstallationController.customConfig.assetFields['assetOwnerName'].arrivalRequired}" 
                                                    requiredMessage="#{msg.assetOwnerName} #{msg.ValidationRequire}" var="t" itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{assetInstallationController.completeOwnerList}">
                                        <p:ajax event="blur" listener="#{assetInstallationController.onAssetOwnerNameChange}" update="assetOwnerName2 assetOwnerName3" process="@this"/>
                                        <p:column>
                                            <h:outputText value="#{t.name}"/>
                                        </p:column>
                                        <p:column>
                                            <h:outputText value="#{t.telephone}"/>
                                        </p:column>
                                    </p:autoComplete>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['assetOwnerName2']}">
                                <h:panelGroup >
                                    <label class="label">#{msg.assetOwnerName2}<span style="color:red">#{assetInstallationController.customConfig.assetFields['assetOwnerName2'].arrivalRequired? '*':''}</span></label>
                                    <p:autoComplete id="assetOwnerName2" value="#{assetInstallationController.owner2}" converter="userAccountConverter" dropdown="true" required="#{assetInstallationController.customConfig.assetFields['assetOwnerName2'].arrivalRequired}" 
                                                    requiredMessage="#{msg.assetOwnerName2} #{msg.ValidationRequire}" forceSelection="true" var="t" itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{assetInstallationController.completeOwnerList}">
                                        <p:ajax event="blur" listener="#{assetInstallationController.onAssetOwnerName2Change}" process="@this"/>
                                        <p:column>
                                            <h:outputText value="#{t.name}"/>
                                        </p:column>
                                        <p:column>
                                            <h:outputText value="#{t.telephone}"/>
                                        </p:column>
                                    </p:autoComplete>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['assetOwnerName3']}">
                                <h:panelGroup >
                                    <label class="label">#{msg.assetOwnerName3}<span style="color:red">#{assetInstallationController.customConfig.assetFields['assetOwnerName3'].arrivalRequired? '*':''}</span></label>
                                    <p:autoComplete id="assetOwnerName3" value="#{assetInstallationController.owner3}" converter="userAccountConverter" dropdown="true" forceSelection="true" required="#{assetInstallationController.customConfig.assetFields['assetOwnerName3'].arrivalRequired}" 
                                                    requiredMessage="#{msg.assetOwnerName3} #{msg.ValidationRequire}" var="t" itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{assetInstallationController.completeOwnerList}">
                                        <p:ajax event="blur" listener="#{assetInstallationController.onAssetOwnerName3Change}" process="@this"/>
                                        <p:column>
                                            <h:outputText value="#{t.name}"/>
                                        </p:column>
                                        <p:column>
                                            <h:outputText value="#{t.telephone}"/>
                                        </p:column>
                                    </p:autoComplete>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['clinicalOwnerName']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.clinicalOwnerName}<span style="color:red">#{assetInstallationController.customConfig.assetFields['clinicalOwnerName'].arrivalRequired? '*':''}</span></label>
                                    <p:autoComplete id="clinicalOwnerName" value="#{assetInstallationController.useOwner}" converter="userAccountConverter" dropdown="true" forceSelection="true" required="#{assetInstallationController.customConfig.assetFields['clinicalOwnerName'].arrivalRequired}" 
                                                    requiredMessage="#{msg.clinicalOwnerName} #{msg.ValidationRequire}" var="t" itemLabel="#{t.name}" itemValue="#{t}" completeMethod="#{assetInstallationController.completeClinicalOwnerList}">
                                        <p:ajax event="blur" listener="#{assetInstallationController.onUseOwnerNameChange}" process="@this"/>
                                        <p:column>
                                            <h:outputText value="#{t.name}"/>
                                        </p:column>
                                        <p:column>
                                            <h:outputText value="#{t.telephone}"/>
                                        </p:column>
                                    </p:autoComplete>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['locationCode']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.locationCode}<span style="color:red">#{assetInstallationController.customConfig.assetFields['locationCode'].arrivalRequired? '*':''}</span></label>
                                    <p:inputText id="locationCode" value="#{assetInstallationController.arrivalListItem.locationCode}" required="#{assetInstallationController.customConfig.assetFields['locationCode'].arrivalRequired}" 
                                                 requiredMessage="#{msg.locationCode} #{msg.ValidationRequire}"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['locationName']}">
                                <h:panelGroup>
                                    <label class="label">#{msg.locationName}<span style="color:red">#{assetInstallationController.customConfig.assetFields['locationName'].arrivalRequired? '*':''}</span></label>
                                    <p:inputText id="locationName" value="#{assetInstallationController.arrivalListItem.locationName}" required="#{assetInstallationController.customConfig.assetFields['locationName'].arrivalRequired}" 
                                                 requiredMessage="#{msg.locationName} #{msg.ValidationRequire}"/>
                                </h:panelGroup>
                            </c:if>
                            <c:if test="#{not empty assetInstallationController.customConfig.assetFields['isPm']}">
                                <h:panelGroup >
                                    <label class="label">#{msg.isAssetPMed}<span style="color:red">#{assetInstallationController.customConfig.assetFields['isPm'].arrivalRequired? '*':''}</span></label>
