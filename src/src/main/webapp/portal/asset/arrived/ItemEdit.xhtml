                            </p:panel>

                        </p:dataGrid>
                        <p:fileUpload id="clinical" fileUploadListener="#{assetInstallationController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" 
                                      multiple="false"  sizeLimit="10000000"  update="pictureList2" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>

                        <label class="label">#{msg.businessAckStatus}</label>
                        <p:selectOneRadio  value="#{assetInstallationController.arrivalListItem.technicalAckStatus}">
                            <f:selectItem itemLabel="待验收" itemValue="none" />
                            <f:selectItem itemLabel="验收通过" itemValue="pass" />
                            <f:selectItem itemLabel="验收不合格" itemValue="reject" />
                        </p:selectOneRadio>
                        <p:dataGrid id="pictureList3" var="fileitem" value="#{assetInstallationController.getAckPicList('technical')}" columns="5" layout="grid" emptyMessage="#{msg.noRecordFound}">
                            <f:facet name="header">#{msg.addPic}</f:facet><!--增加图片-->
                            <p:panel  style="text-align:center">
                                <h:panelGrid columns="1" style="width:100%" >
                                    <p:graphicImage url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/> 
                                    <p:commandButton actionListener="#{assetInstallationController.removeAttachment(fileitem.objectStorageId)}" update="pictureList3" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>   
                                </h:panelGrid>

                            </p:panel>

                        </p:dataGrid>
                        <p:fileUpload id="technical" fileUploadListener="#{assetInstallationController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" 
                                      multiple="false"  sizeLimit="10000000"  update="pictureList3" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>


                    </p:fieldset>
                    <h:panelGroup>

                        <p:commandButton validateClient="true" actionListener="#{assetInstallationController.updateItem}" update=":growl"  value="保存" icon="ui-icon-check" />
                        <p:commandButton validateClient="true" action="#{assetInstallationController.finishInstall}" value="完成安装" />
                        <p:commandButton validateClient="true" action="#{assetInstallationController.rejectInstall}" value="退货" immediate="true" />
                        <p:commandButton value="#{msg.Return}" icon="ui-icon-arrow-back" action="arrivalItemsList?faces-redirect=true" immediate="true" />

                    </h:panelGroup>

                </h:form>
            </div>



        </div>


    </ui:define>
