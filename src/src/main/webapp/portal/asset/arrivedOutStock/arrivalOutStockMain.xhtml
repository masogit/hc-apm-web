<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.AssetOutStock}"/>
            </div>
            <div class="ui-g-12">
                <p:tabView id="assetOutStockTab"  dynamic="true" cache="false" activeIndex="0">
                    <p:ajax event="tabChange" listener="#{assetStockedController.onTabChange}" update=":growl :assetOutStockTab:inStockedRecord :assetOutStockTab:outStockedRecord"/>
                    <!--<p:tab title="审核入库" id="auditInStocked">
                        <ui:include src="auditInStocked.xhtml"/>
                    </p:tab>-->
                    <p:tab title="库存管理" id="stockedManage">
                        <ui:include src="stockedManage.xhtml"/>
                    </p:tab>
                    <p:tab title="入库记录" id="inStockedRecord">
                        <ui:include src="inStockedRecord.xhtml"/>
                    </p:tab>
                    <p:tab title="出库记录" id="outStockedRecord">
                        <ui:include src="outStockedRecord.xhtml"/>
                    </p:tab>
                </p:tabView>
                <ui:include src="/portal/preview/QRView.xhtml"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
