<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <h:form id="inStockedDataForm">
        <p:fieldset legend="#{msg.FilterCondition}">
            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">入库单号</label>
                    <p:inputText value="#{assetInStockedController.searchItem.inStockNo}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">业务时间</label>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                locale="#{userContextService.getCalendarLocale()}"
                                pattern="#{userContextService.timeFormat()}" id="startDate"
                                value="#{assetInStockedController.inStockBusinessStartDate}"
                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                    -
                    <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                locale="#{userContextService.getCalendarLocale()}"
                                pattern="#{userContextService.timeFormat()}" id="endDate"
                                value="#{assetInStockedController.inStockBusinessEndDate}"
                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.assetName}</label>
                    <p:inputText value="#{assetInStockedController.searchItem.assetName}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.vendor}</label>
                    <p:autoComplete dropdown="true" value="#{assetInStockedController.supplier}" scrollHeight="300"  forceSelection="true"
                                    completeMethod="#{assetInStockedController.autoCompleteSupplier}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                    </p:autoComplete>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">资产价值</label>
                    <p:inputNumber minValue="0" decimalPlaces="2" value="#{assetInStockedController.startPrice}"/>
                    -
                    <p:inputNumber minValue="0" decimalPlaces="2" value="#{assetInStockedController.endPrice}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.functionType}</label>
                    <p:inputText value="#{assetInStockedController.searchItem.functionType}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.arrivalListInvoiceNum}</label>
                    <p:inputText value="#{assetInStockedController.searchItem.invoiceNum}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.arrivalListContractNum}</label>
                    <p:inputText value="#{assetInStockedController.searchItem.contractNum}"/>
                </h:panelGroup>
            </p:panelGrid>
            <p:commandButton value="#{msg.Search}" validateClient="true" update=":growl :assetOutStockTab:AssetInStockedListForm :assetOutStockTab:AssetInStockedListForm:datalist"/>
            <p:commandButton value="清空条件" validateClient="true" actionListener="#{assetInStockedController.initSearchItem()}" update=":growl :assetOutStockTab:inStockedDataForm :assetOutStockTab:AssetInStockedListForm:datalist"/>
        </p:fieldset>
    </h:form>

    <h:form id="AssetInStockedListForm">
        <p:dataTable id="datalist" value="#{assetInStockedController.lazyModel}" var="item" widgetVar="varDataList"
                     selection="#{assetInStockedController.selectedItems}"
                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                     rowKey="#{item.id}" sortMode="single" sortBy="#{item.businessDate}"   sortOrder="descending"
                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                     rows="20" emptyMessage="#{msg.noRecordFound}"
                     rowsPerPageTemplate="20,50,100,500">
            <p:ajax event="rowSelect" listener="#{assetInStockedController.onRowSelect}" update=":growl :assetOutStockTab:inStockedDataForm :assetOutStockTab:AssetInStockedListForm:datalist"/>
            <p:column selectionMode="multiple" style="width:50px;text-align:center"/>
            <p:column headerText="入库单号">
                <h:commandLink target="_blank" action="#{assetInStockedController.openNewWindowView(item.inStockNo)}" value="#{item.inStockNo}" />
            </p:column>
            <p:column headerText="业务时间">
                <h:outputText value="#{item.businessDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.vendor}">
                <h:outputText value="#{item.vendor}"/>
            </p:column>
            <p:column headerText="制单人">
                <h:outputText value="#{assetInStockedController.getUserNameByUid(item.inStockUser)}"/>
            </p:column>
            <p:column headerText="#{msg.financingNum}">
                <h:outputText value="#{item.financingNum}"/>
            </p:column>
            <p:column headerText="#{msg.assetName}">
                <h:outputText value="#{item.assetName}"/>
            </p:column>
            <p:column headerText="#{msg.arrivalListContractNum}">
                <h:commandLink target="_blank" action="#{assetInStockedController.openNewWindowView(item.contractNum)}" value="#{item.contractNum}" />
<!--                <h:outputText value="#{item.contractNum}"/>-->
            </p:column>
            <p:column headerText="#{msg.installDate}">
                <h:outputText value="#{item.installDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.functionType}">
                <h:outputText value="#{item.functionType}"/>
            </p:column>
            <p:column headerText="#{msg.comments}">
                <h:outputText value="#{item.comments}"/>
            </p:column>
            <p:column headerText="资产价值">
                <h:outputText value="#{item.purchasePrice}"/>
            </p:column>
            <p:column headerText="#{msg.arrivalListInvoiceNum}">
                <h:outputText value="#{item.invoiceNum}"/>
            </p:column>
            <p:column headerText="发票日期">
                <h:outputText value="#{item.invoiceDate}"/>
            </p:column>
        </p:dataTable>
    </h:form>
    <script type="text/javascript">
        function reload() {
            window.location.reload();
        }
    </script>
</ui:composition>
</html>
