<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <h:form id="inStockedDataForm">
        <p:fieldset legend="#{msg.FilterCondition}">
            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">入库单号</label>
                    <p:inputText value="#{assetStockedController.searchItem.inStockNo}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">业务时间</label>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                locale="#{userContextService.getCalendarLocale()}"
                                pattern="#{userContextService.timeFormat()}" id="startDate"
                                value="#{assetStockedController.startDate}"
                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                    -
                    <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                locale="#{userContextService.getCalendarLocale()}"
                                pattern="#{userContextService.timeFormat()}" id="endDate"
                                value="#{assetStockedController.endDate}"
                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.assetName}</label>
                    <p:inputText value="#{assetStockedController.searchItem.arrivalList.name}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.vendor}</label>
                    <p:autoComplete dropdown="true" value="#{assetStockedController.supplier}"  scrollHeight="300"  forceSelection="true"
                                    completeMethod="#{assetStockedController.autoCompleteSupplier}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                    </p:autoComplete>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">资产价值</label>
                    <p:inputNumber minValue="0" decimalPlaces="2" value="#{assetStockedController.startPrice}"/>
                    -
                    <p:inputNumber minValue="0" decimalPlaces="2" value="#{assetStockedController.endPrice}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.functionType}</label>
                    <p:inputText value="#{assetStockedController.searchItem.arrivalList.functionType}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.arrivalListInvoiceNum}</label>
                    <p:inputText value="#{assetStockedController.searchItem.arrivalList.invoiceNum}"/>
                </h:panelGroup>
            </p:panelGrid>
            <p:commandButton value="#{msg.Search}" validateClient="true" update=":growl :assetOutStockTab:AssetInStockedListForm :assetOutStockTab:AssetInStockedListForm:datalist"/>
            <p:commandButton value="清空条件" validateClient="true" actionListener="#{assetStockedController.initSearchItem()}" update=":growl :assetOutStockTab:inStockedDataForm"/>
        </p:fieldset>
    </h:form>

    <h:form id="AssetInStockedListForm">
        <p:dataTable id="datalist" value="#{assetStockedController.lazyModel}" var="item" widgetVar="varDataList"
                     selection="#{assetStockedController.selectedItems}"
                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                     rowKey="#{item.id}" sortMode="single" sortBy="#{item.lastModifiedDate}"   sortOrder="descending"
                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                     rows="20" emptyMessage="#{msg.noRecordFound}"
                     rowsPerPageTemplate="20,50,100,500">

            <p:column selectionMode="multiple" style="width:50px;text-align:center"/>
            <p:column headerText="入库单号">
                <h:outputText value="#{item.inStockNo}"/>
            </p:column>
            <p:column headerText="业务时间">
                <h:outputText value="#{item.lastModifiedDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                </h:outputText>
            </p:column>
            <p:column headerText="单据时间">
                <h:outputText value="#{item.inStockDocumentsDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.vendor}">
                <h:outputText value="#{item.arrivalList.vendor}"/>
            </p:column>
            <p:column headerText="#{msg.financingNum}">
                <h:outputText value="#{item.financingNum}"/>
            </p:column>
            <p:column headerText="#{msg.assetName}">
                <h:outputText value="#{item.arrivalList.assetName}"/>
            </p:column>
            <p:column headerText="#{msg.arrivalListContractNum}">
                <h:outputText value="#{item.arrivalList.contractNum}"/>
            </p:column>
            <p:column headerText="#{msg.installDate}">
                <h:outputText value="#{item.installDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.functionType}">
                <h:outputText value="#{item.arrivalList.functionType}"/>
            </p:column>
            <p:column headerText="#{msg.comments}">
                <h:outputText value="#{item.comments}"/>
            </p:column>
            <p:column headerText="资产价值">
                <h:outputText value="#{item.purchasePrice}"/>
            </p:column>
            <p:column headerText="#{msg.arrivalListInvoiceNum}">
                <h:outputText value="#{item.arrivalList.invoiceNum}"/>
            </p:column>
            <p:column headerText="发票日期">
                <h:outputText value="#{item.arrivalList.invoiceDate}"/>
            </p:column>
            <p:column headerText="状态">
                <h:outputText value="#{fieldMsg.fieldValue('stockStatus',item.stockStatus)}" style="color: #989898"/>
            </p:column>
            <f:facet name="{Toolbar}">
                <p:commandButton value="生成入库单" disabled="#{!userContextService.hasAnyRoleByApmRoles('StockedManager')}" validateClient="true" oncomplete="PF('GeneratedInStockDocDialog').show()" update=":growl :assetOutStockTab:GeneratedInStockDocDlg"/>
                <p:commandButton value="打印入库单" disabled="#{!userContextService.hasAnyRoleByApmRoles('StockedManager')}"/>
            </f:facet>
        </p:dataTable>
    </h:form>
    <p:dialog id="GeneratedInStockDocDlg" widgetVar="GeneratedInStockDocDialog" modal="true" resizable="true" draggable="true" width="1450" header="生成入库单">
        <h:form id="GeneratedInStockForm">
            <label class="label">合计数量：#{assetStockedController.selectedItems.size()}；合计金额：#{assetStockedController.totalPurchasePrice()}</label>
            <br/>
            <p:dataTable id="inStockDocList" value="#{assetStockedController.selectedItems}" var="item"
                         lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                         emptyMessage="#{msg.noRecordFound}">
                <p:column headerText="业务时间">
                    <h:outputText value="#{item.installDate}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.vendor}">
                    <h:outputText value="#{item.arrivalList.vendor}"/>
                </p:column>
                <p:column headerText="#{msg.financingNum}">
                    <h:outputText value="#{item.financingNum}"/>
                </p:column>
                <p:column headerText="#{msg.assetName}">
                    <h:outputText value="#{item.arrivalList.assetName}"/>
                </p:column>
                <p:column headerText="#{msg.arrivalListContractNum}">
                    <h:outputText value="#{item.arrivalList.contractNum}"/>
                </p:column>
                <p:column headerText="#{msg.functionType}">
                    <h:outputText value="#{item.arrivalList.functionType}"/>
                </p:column>
                <p:column headerText="#{msg.comments}">
                    <h:outputText value="#{item.comments}"/>
                </p:column>
                <p:column headerText="资产价值">
                    <h:outputText value="#{item.purchasePrice}"/>
                </p:column>
                <p:column headerText="#{msg.arrivalListInvoiceNum}">
                    <h:outputText value="#{item.arrivalList.invoiceNum}"/>
                </p:column>
                <p:column headerText="发票日期">
                    <h:outputText value="#{item.arrivalList.invoiceDate}"/>
                </p:column>
                <p:column headerText="状态">
                    <h:outputText value="#{fieldMsg.fieldValue('stockStatus',item.stockStatus)}" style="color: #989898"/>
                </p:column>
            </p:dataTable>
            <p:commandButton validateClient="true" actionListener="#{assetStockedController.generatedInStockDoc()}"
                             value="#{msg.Confirm}" update=":growl :assetOutStockTab:AssetInStockedListForm :assetOutStockTab:AssetInStockedListForm:datalist" icon="ui-icon-check"
                             onclick="PF('GeneratedInStockDocDialog').hide()"/>

            <p:commandButton immediate="true" value="#{msg.Cancel}" update=":growl :assetOutStockTab:AssetInStockedListForm :assetOutStockTab:AssetInStockedListForm:datalist" icon="ui-icon-cancel"
                             onclick="PF('GeneratedInStockDocDialog').hide()"/>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
