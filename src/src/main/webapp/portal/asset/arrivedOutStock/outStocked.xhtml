<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://java.sun.com/jsp/jstl/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>

   <h:form id="assetOutStockedListForm">
      <p:dataTable id="datalist" value="#{assetOutStockedController.lazyModel}" var="item" widgetVar="varDataList"
                   selectionMode="single" selection="#{assetOutStockedController.selected}"
                   lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                   rowKey="#{item.id}" sortMode="single" sortBy="#{item.lastModifiedDate}"   sortOrder="descending"
                   paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                   currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                   rows="20" emptyMessage="#{msg.noRecordFound}"
                   rowsPerPageTemplate="20,50,100,500">
         <p:ajax event="filter" listener="#{assetOutStockedController.onFilter}" update="datalist" />
         <p:ajax event="rowSelect" update="exportButton" />

         <p:column headerText="资产类别" >
            <h:outputText value="专用设备"/>
         </p:column>
         <p:column headerText="资产编号" sortBy="#{item.financingNum}" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
            <h:outputText value="#{item.financingNum}"/>
         </p:column>
         <p:column headerText="资产名称" sortBy="#{item.arrivalList.assetName}" filterBy="#{item.arrivalList.assetName}" filterMatchMode="LIKE">
            <h:outputText value="#{item.arrivalList.assetName}"/>
         </p:column>
         <p:column headerText="#{msg.assetGroup}" sortBy="#{item.arrivalList.assetGroup}" filterBy="#{item.arrivalList.assetGroup}" filterMatchMode="LIKE">
            <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.arrivalList.assetGroup)}"/>
         </p:column>

         <p:column headerText="#{msg.arrivalListContractNum}" sortBy="#{item.arrivalList.contractNum}" filterBy="#{item.arrivalList.contractNum}" filterMatchMode="LIKE">
            <h:outputText value="#{item.arrivalList.contractNum}"/>
         </p:column>
         <p:column headerText="#{msg.clinicalDeptName}">
            <f:facet name="header">
               <h:outputText value="#{msg.clinicalDeptName}"/><br/>
               <p:autoComplete dropdown="true" value="#{assetOutStockedController.filterClinicalDeptOrg}" appendTo="@(Body)"
                               scrollHeight="300"  forceSelection="true" completeMethod="#{assetOutStockedController.autoCompleteDeptName}" size="5">
                  <p:ajax event="itemSelect" listener="#{assetOutStockedController.onClinicalDeptNameFilterChange}" process="@this"  update="assetOutStockTab:assetOutStockedListForm:datalist"/>
                  <p:ajax process="@this" listener="#{assetOutStockedController.onClinicalDeptNameFilterChange}" update="assetOutStockTab:assetOutStockedListForm:datalist"/>
               </p:autoComplete>
            </f:facet>
            <h:outputText value="#{assetOutStockedController.getOrgNameByUid(item.recruiteDeptUid)}"/>
         </p:column>
         <p:column headerText="#{msg.installDate}" sortBy="#{item.installDate}" filterBy="#{item.installDate}" filterMatchMode="GTE" >
            <f:facet name="filter">
               <p:inputText id="filterArrivalDate" widgetVar="varFilterArrivalDate" value="#{assetUnOutStockController.arrivalFormatTime}"/>
            </f:facet>
            <h:outputText value="#{item.installDate}">
               <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
            </h:outputText>
         </p:column>
         <c:choose>
            <c:when test="#{userContextService.activeSupplier()}">
               <p:column headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                  <h:outputText value="#{item.functionType}"/>
               </p:column>
            </c:when>
            <c:otherwise>
               <p:column headerText="#{msg.functionType}" sortBy="#{item.arrivalList.functionType}" filterBy="#{item.arrivalList.functionType}" filterMatchMode="LIKE">
                  <h:outputText value="#{item.arrivalList.functionType}"/>
               </p:column>
            </c:otherwise>
         </c:choose>
         <p:column headerText="#{msg.financingNum}" sortBy="#{item.financingNum}" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
            <h:outputText value="#{item.financingNum}"/>
         </p:column>
         <p:column headerText="#{msg.status}" >
            <h:outputText value="#{fieldMsg.fieldValue('arrivalListItemStatus', item.installStatus)}"/>
         </p:column>
         <p:column headerText="数量" sortBy="#{item.qty}" >
            <h:outputText value="1"/>
         </p:column>
         <p:column headerText="单位" sortBy="#{item.unit}" >
            <h:outputText value="#{item.unit}"/>
         </p:column>
         <p:column headerText="出库单号" sortBy="#{item.outStockNo}" filterBy="#{item.outStockNo}" filterMatchMode="LIKE">
            <h:outputText value="#{item.outStockNo}"/>
         </p:column>
         <p:column headerText="领用人" sortBy="#{item.recruiter}" filterBy="#{item.recruiter}" filterMatchMode="LIKE">
            <h:outputText value="#{item.recruiter}"/>
         </p:column>
         <p:column headerText="领用日期">
            <h:outputText value="#{item.outStocDate}">
               <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
            </h:outputText>
         </p:column>
         <f:facet name="{Toolbar}">
            <p:commandButton id="exportButton" ajax="false" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray batch-terminated" title="打印"  actionListener="#{assetOutStockedController.exportStocked()}" disabled="#{empty assetOutStockedController.selected or empty assetOutStockedController.selected.outStockNo}">
               <p:fileDownload value="#{assetOutStockedController.exportFile}"/>
            </p:commandButton>

         </f:facet>
      </p:dataTable>

   </h:form>
   <p:overlayPanel id="idPanelFilterArrivalDate2" widgetVar="panelFilterArrivalDate2" for="assetOutStockTab:assetOutStockedListForm:datalist:filterArrivalDate2" dismissable="false">
      <h:panelGrid columns="2">
         <p:outputLabel value="#{msg.From}"/>
         <p:calendar timeZone="GMT+8"  widgetVar="varArrivalDateFrom" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
         <p:outputLabel value="#{msg.To}"/>
         <p:calendar timeZone="GMT+8"  widgetVar="varArrivalDateTo" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
      </h:panelGrid>
      <p:commandButton onclick="setDateFilter('varDataList', 'varFilterArrivalDate2', 'varArrivalDateFrom', 'varArrivalDateTo'); PF('panelFilterArrivalDate2').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
      <p:commandButton onclick="PF('panelFilterArrivalDate2').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
   </p:overlayPanel>

   <p:overlayPanel id="idPanelFilterBusinessAckDate2" widgetVar="panelFilterBusinessAckDate2" for="assetOutStockTab:assetOutStockedListForm:datalist:filterBusinessAckDate2" dismissable="false">
      <h:panelGrid columns="2">
         <p:outputLabel value="#{msg.From}"/>
         <p:calendar timeZone="GMT+8"  widgetVar="varArrivalDateFrom2" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
         <p:outputLabel value="#{msg.To}"/>
         <p:calendar timeZone="GMT+8"  widgetVar="varArrivalDateTo2" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
      </h:panelGrid>
      <p:commandButton onclick="setDateFilter('varDataList', 'varFilterBusinessAckDate2', 'varArrivalDateFrom2', 'varArrivalDateTo2'); PF('panelFilterBusinessAckDate2').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
      <p:commandButton onclick="PF('panelFilterBusinessAckDate2').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
   </p:overlayPanel>
</ui:composition>
</html>
