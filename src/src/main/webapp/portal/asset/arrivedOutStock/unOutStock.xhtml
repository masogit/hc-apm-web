<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://java.sun.com/jsp/jstl/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition>

        <h:form id="assetOutStockListForm">
            <p:dataTable id="datalist" value="#{assetUnOutStockController.lazyModel}" var="item" widgetVar="varDataList"
                     selectionMode="single" selection="#{assetUnOutStockController.selected}"
                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                     rowKey="#{item.id}" sortMode="single" sortBy="#{item.lastModifiedDate}"   sortOrder="descending"
                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                     rows="20" emptyMessage="#{msg.noRecordFound}"
                     rowsPerPageTemplate="20,50,100,500">
                <p:ajax event="filter" listener="#{assetUnOutStockController.onFilter}" update="datalist" />
                <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />

                <p:column width="36" id="checkBoxColumn">
                    <p:selectBooleanCheckbox value="#{assetUnOutStockController.selectedMap[item.id]}"  class="selectCheckBox">
                        <p:ajax process="@this" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                    </p:selectBooleanCheckbox>
                    <f:facet name="header"  >
                        <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                            <p:ajax listener="#{assetUnOutStockController.onSelectAllOfPage}" update="@(.selectCheckBox) stockButton" oncomplete="updateSelectAllCheckBox();"/>
                        </p:selectBooleanCheckbox>
                    </f:facet>
                </p:column>

                <p:column headerText="#{msg.arrivalListContractNum}" sortBy="#{item.arrivalList.contractNum}" filterBy="#{item.arrivalList.contractNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.arrivalList.contractNum}"/>
                </p:column>
                <p:column headerText="批文号" sortBy="#{item.arrivalList.approvalNo}" filterBy="#{item.arrivalList.approvalNo}" filterMatchMode="LIKE" rendered="#{userContextService.activeSupplier()}">
                    <h:outputText value="#{item.arrivalList.approvalNo}"/>
                </p:column>
                <p:column headerText="#{msg.assetName}" sortBy="#{item.arrivalList.assetName}" filterBy="#{item.arrivalList.assetName}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.arrivalList.assetName}"/>
                </p:column>
                <p:column headerText="#{msg.clinicalDeptName}">
                    <h:outputText value="#{assetUnOutStockController.getOrgNameByUid(item.clinicalDeptUID)}"/>
                </p:column>
                <p:column headerText="#{msg.creatorUID}" sortBy="#{item.arrivalList.creatorUID}" filterBy="#{item.arrivalList.creator.name}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.arrivalList.creator.name}"/>
                </p:column>
                <p:column headerText="#{msg.arrivalListAgent}" sortBy="#{item.arrivalList.agent}" filterBy="#{item.arrivalList.agent}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.arrivalList.agent}"/>
                </p:column>
                <p:column headerText="#{msg.arrivalDate}" sortBy="#{item.arrivalList.arrivalDate}" filterBy="#{item.arrivalList.arrivalDate}" filterMatchMode="GTE" rendered="#{not userContextService.activeSupplier()}">
                    <f:facet name="filter">
                        <p:inputText id="filterArrivalDate" widgetVar="varFilterArrivalDate" value="#{assetUnOutStockController.arrivalFormatTime}"/>
                    </f:facet>
                    <h:outputText value="#{item.arrivalList.arrivalDate}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.AssetArrivalListBusinessAckDate}" sortBy="#{item.businessAckDate}" filterBy="#{item.businessAckDate}" filterMatchMode="GTE">
                    <f:facet name="filter">
                        <p:inputText id="filterBusinessAckDate" widgetVar="varFilterBusinessAckDate" value="#{assetUnOutStockController.arrivalFormatTime}"/>
                    </f:facet>
                    <h:outputText value="#{item.businessAckDate}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                    </h:outputText>
                </p:column>
                <c:choose>
                    <c:when test="#{userContextService.activeSupplier()}">
                        <p:column headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                    </c:when>
                    <c:otherwise>
                        <p:column headerText="#{msg.functionType}" sortBy="#{item.arrivalList.functionType}" filterBy="#{item.arrivalList.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.arrivalList.functionType}"/>
                        </p:column>
                    </c:otherwise>
                </c:choose>
                <p:column headerText="#{msg.financingNum}" sortBy="#{item.financingNum}" filterBy="#{item.financingNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.financingNum}"/>
                </p:column>
                <p:column headerText="#{msg.status}" >
                    <h:outputText value="#{fieldMsg.fieldValue('arrivalListItemStatus', item.installStatus)}"/>
                </p:column>
                <p:column headerText="#{msg.ArrivalProcessType}" sortBy="#{item.arrivalList.processType}" filterBy="#{item.arrivalList.processType}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList').filter()" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('arrivalListProcessType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{fieldMsg.fieldValue('arrivalListProcessType',item.arrivalList.processType)}"/>
                </p:column>
               <!-- <p:column headerText="操作" exportable="false">
                    <p:commandButton  value="操作" actionListener="#{assetUnOutStockController.prepareOperate(item.id)}" update="assetOutStockTab:operateDialogForm" oncomplete="PF('operateDialog').show()"/>

                </p:column>-->
                <f:facet name="{Toolbar}">
                   <p:commandButton id="stockButton" icon="ui-icon-settings" class="btn btn-sm btn-gray batch-terminated" title="批量操作" oncomplete="PF('operateDialog').show()" actionListener="#{assetUnOutStockController.batchStock}" update=":assetOutStockTab:assetOutStockListForm :assetOutStockTab:operateDialogForm" disabled="#{not assetUnOutStockController.isChecked()}"/>


                </f:facet>
            </p:dataTable>

        </h:form>
      

        <p:dialog id="operateDialog" widgetVar="operateDialog" modal="true" width="1000" height="550" resizable="true" draggable="true" header="调拨出库">
            <h:form id="operateDialogForm" >
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                    <h:panelGroup>
                        <label class="label">出库单号<span style="color: red">*</span></label>
                        <p:inputText value="#{assetUnOutStockController.assetOutStockDto.outStockNo}" required="true" requiredMessage="出库单号 #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">领用科室<span style="color: red">*</span></label>
                        <p:inputText  id="dept" value="#{assetUnOutStockController.assetOutStockDto.stockedDeptName}" readonly="true" required="true" requiredMessage="领用科室 #{msg.ValidationRequire}"/>
                        <p:commandButton id="orgEdit" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" />
                        <p:overlayPanel  id="popupPanelEdit" widgetVar="varOrgEdit" for="orgEdit"
                                         style="position: absolute; left: 0; top: 0; width: 300px;" dynamic="false" modal="false" dismissable="true"   >
                            <p:scrollPanel style="height:300px; border: 0" mode="native"  >
                                <p:inputText id="searchDeptName" value="#{assetUnOutStockController.searchDeptName}"  />
                                <p:commandButton process=":assetOutStockTab:operateDialogForm:searchDeptName @this" partialSubmit="true" icon="ui-icon-search" update="orgTreeEdit" actionListener="#{assetUnOutStockController.treeSeachCondition()}" value="检索"/>
                                <p:tree id="orgTreeEdit" value="#{budgetController.orgTreeEdit}" var="node"
                                        selectionMode="single" class="tree" style="width:98%; border:0"  >
                                    <p:ajax process="@this" event="select"
                                            update="@parent:dept "
                                            listener="#{assetUnOutStockController.onSelectTreeNode}"
                                            oncomplete="PF('varOrgEdit').hide();" />
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">领用日期<span style="color: red">*</span></label>
                        <p:calendar  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"
                                     value="#{assetUnOutStockController.assetOutStockDto.outStocDate}" required="true"
                                     requiredMessage="领用日期 #{msg.ValidationRequire}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">单位<span style="color: red">*</span></label>
                        <p:inputText value="#{assetUnOutStockController.assetOutStockDto.unit}" required="true" requiredMessage="单位 #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">领用人<span style="color: red">*</span></label>
                        <p:inputText value="#{assetUnOutStockController.assetOutStockDto.recruiter}" required="true" requiredMessage="领用人 #{msg.ValidationRequire}" />
                    </h:panelGroup>
                </p:panelGrid>
                <p:dataTable id="outStocklist" value="#{assetUnOutStockController.selectedArrivalItems}" var="item"
                             widgetVar="outStocklist" selectionMode="single" lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.id}"
                             paginatorTemplate="" rows="20" emptyMessage="#{msg.noRecordFound}" >
                    <p:column headerText="资产类别">
                        <p:outputLabel value="专用设备" />
                    </p:column>
                    <p:column headerText="资产编号" >
                        <p:outputLabel value="#{item.departNum}" />
                    </p:column>
                    <p:column headerText="#{msg.assetName}" >
                        <h:outputText value="#{item.arrivalList.assetName}"/>
                    </p:column>
                    <p:column headerText="#{msg.clinicalDeptName}">
                        <h:outputText value="#{assetUnOutStockController.getOrgNameByUid(item.clinicalDeptUID)}"/>
                    </p:column>
                    <p:column headerText="启用日期">
                        <h:outputText value="#{item.installDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.assetName}" >
                        <h:outputText value="1"/>
                    </p:column>
                    <p:column headerText="单价" >
                        <p:outputLabel value="#{item.purchasePrice}" />
                    </p:column>
                    <p:column headerText="金额" >
                        <p:outputLabel value="#{item.purchasePrice}" />
                    </p:column>
                    <p:column headerText="供应商" >
                        <p:outputLabel value="#{item.arrivalList.vendor}" />
                    </p:column>
                </p:dataTable>
                <br/>

                <p:commandButton validateClient="true"  value="打印" ajax="false" title="下载压缩文件" actionListener="#{assetUnOutStockController.exportAll}"
                                 icon="ui-icon-print" class="btn btn-sm btn-gray">
                    <p:fileDownload value="#{assetUnOutStockController.exportFile}"/>
                </p:commandButton>
                <p:commandButton validateClient="true"  value="出库" action="#{assetUnOutStockController.stock()}" icon="ui-icon-check" oncomplete="PF('operateDialog').hide()"  update=":assetOutStockTab:assetOutStockListForm :assetOutStockTab:operateDialogForm"/>

                <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{assetUnOutStockController.cancel()}" icon="ui-icon-cancel" onclick="PF('operateDialog').hide()"/>

            </h:form>

        </p:dialog>

        <script >
            //<![CDATA[
            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });

                $("#assetOutStockTab\\:assetOutStockListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                    $(".selectCheckBoxHeader")[0].children[1].children[0].classList.add("ui-icon-check");
                    $(".selectCheckBoxHeader")[0].children[1].children[0].classList.remove("ui-icon-blank");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                    $(".selectCheckBoxHeader")[0].children[1].children[0].classList.remove("ui-icon-check");
                    $(".selectCheckBoxHeader")[0].children[1].children[0].classList.add("ui-icon-blank");
                }
            }

            //]]>


        </script>
    </ui:composition>
</html>
