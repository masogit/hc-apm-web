<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <h:form id="outStockedDataForm">
        <p:fieldset legend="#{msg.FilterCondition}">
            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">出库单号</label>
                    <p:inputText value="#{assetOutStockedController.searchItem.outStockNo}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">业务时间</label>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                locale="#{userContextService.getCalendarLocale()}"
                                pattern="#{userContextService.timeFormat()}" id="startDate"
                                value="#{assetOutStockedController.outStockBusinessStartDate}"
                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                    -
                    <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                locale="#{userContextService.getCalendarLocale()}"
                                pattern="#{userContextService.timeFormat()}" id="endDate"
                                value="#{assetOutStockedController.outStockBusinessEndDate}"
                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.assetName}</label>
                    <p:inputText value="#{assetOutStockedController.searchItem.assetName}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.vendor}</label>
                    <p:autoComplete dropdown="true" value="#{assetOutStockedController.supplier}" scrollHeight="300"  forceSelection="true"
                                    completeMethod="#{assetOutStockedController.autoCompleteSupplier}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                    </p:autoComplete>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">资产价值</label>
                    <p:inputNumber minValue="0" decimalPlaces="2" value="#{assetOutStockedController.startPrice}"/>
                    -
                    <p:inputNumber minValue="0" decimalPlaces="2" value="#{assetOutStockedController.endPrice}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.functionType}</label>
                    <p:inputText value="#{assetOutStockedController.searchItem.functionType}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.arrivalListInvoiceNum}</label>
                    <p:inputText value="#{assetOutStockedController.searchItem.invoiceNum}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">领用科室</label>
                    <p:inputText id="queryDept" value="#{assetOutStockedController.queryRecruiteDept.name}" readonly="true"/>
                    <p:commandButton id="orgQuery" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton"/>
                    <p:overlayPanel  id="popupPanelQuery" widgetVar="varOrgQuery" for="orgQuery"
                                     style="position: absolute; left: 0; top: 0; width: 300px;" dynamic="false" modal="false" dismissable="true">
                        <p:scrollPanel style="height:300px; border: 0" mode="native">
                            <p:inputText id="searchQueryDeptName" value="#{assetOutStockedController.searchDeptName}"/>
                            <p:commandButton process=":assetOutStockTab:outStockedDataForm:searchQueryDeptName @this" partialSubmit="true" icon="ui-icon-search" update="orgTreeQuery" actionListener="#{assetOutStockedController.treeSeachCondition()}" value="检索"/>
                            <p:tree id="orgTreeQuery" value="#{assetOutStockedController.orgTreeEdit}" var="node"
                                    selectionMode="single" class="tree" style="width:98%; border:0">
                                <p:ajax process="@this" event="select"
                                        update="@parent:queryDept"
                                        listener="#{assetOutStockedController.onSelectTreeNode}"
                                        oncomplete="PF('varOrgQuery').hide();"/>
                                <p:ajax process="@this" event="expand"/>
                                <p:ajax process="@this" event="collapse"/>
                                <p:treeNode type="org">
                                    <h:outputText value="#{node}"/>
                                </p:treeNode>
                            </p:tree>
                        </p:scrollPanel>
                    </p:overlayPanel>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.arrivalListContractNum}</label>
                    <p:inputText value="#{assetOutStockedController.searchItem.contractNum}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.stockStatus}</label>
                    <p:selectOneMenu value="#{assetOutStockedController.searchItem.stockStatus}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}"/>
                        <f:selectItem itemLabel="#{fieldMsg.fieldValue('stockStatus', 4)}" itemValue="4"/>
                        <f:selectItem itemLabel="#{fieldMsg.fieldValue('stockStatus', 5)}" itemValue="5"/>
                    </p:selectOneMenu>
                </h:panelGroup>
            </p:panelGrid>
            <p:commandButton value="#{msg.Search}" validateClient="true" update=":growl :assetOutStockTab:AssetOutStockedListForm :assetOutStockTab:AssetOutStockedListForm:datalist"/>
            <p:commandButton value="清空条件" validateClient="true" actionListener="#{assetOutStockedController.initSearchItem()}" update=":growl :assetOutStockTab:outStockedDataForm :assetOutStockTab:AssetOutStockedListForm:datalist"/>
        </p:fieldset>
    </h:form>

    <h:form id="AssetOutStockedListForm">
        <p:dataTable id="datalist" value="#{assetOutStockedController.lazyModel}" var="item" widgetVar="varDataList"
                     selection="#{assetOutStockedController.selectedItems}"
                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                     rowKey="#{item.id}" sortMode="single" sortBy="#{item.businessDate}"   sortOrder="descending"
                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                     rows="20" emptyMessage="#{msg.noRecordFound}"
                     rowsPerPageTemplate="20,50,100,500">
            <p:ajax event="rowSelect" listener="#{assetOutStockedController.onRowSelect}" update=":growl :assetOutStockTab:outStockedDataForm :assetOutStockTab:AssetOutStockedListForm:datalist"/>
            <p:column selectionMode="multiple" style="width:50px;text-align:center"/>
            <p:column headerText="出库单号">
<!--                <h:commandLink target="_blank" action="#{assetOutStockedController.openNewWindowView(item, 'outStocked')}" value="#{item.outStockNo}" onblur="reload()" />-->
                <a href="/geapm#{assetOutStockedController.getJmPrintReportViewUrl(item, 'outStocked')}" target="_Blank">
                    <h:outputText value="#{item.outStockNo}"/>
                </a>
            </p:column>
            <p:column headerText="业务时间">
                <h:outputText value="#{item.businessDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.vendor}">
                <h:outputText value="#{assetOutStockedController.supplierMap.get(item.assetInfo.supplierId)}"/>
            </p:column>
            <p:column headerText="制单人">
                <h:outputText value="#{assetOutStockedController.userMap.get(item.outStockUser)}"/>
            </p:column>
            <p:column headerText="#{msg.financingNum}">
<!--                <h:commandLink target="_blank" action="#{assetOutStockedController.openNewWindowView(item, 'assetInfo')}" value="#{item.assetInfo.financingNum}" onblur="reload()" />-->
                <a href="/geapm#{assetOutStockedController.getJmPrintReportViewUrl(item, 'assetInfo')}" target="_Blank">
                    <h:outputText value="#{item.assetInfo.financingNum}"/>
                </a>
            </p:column>
            <p:column headerText="#{msg.assetName}">
                <h:outputText value="#{item.assetInfo.name}"/>
            </p:column>
            <p:column headerText="#{msg.arrivalListContractNum}">
<!--                <h:commandLink target="_blank" action="#{assetOutStockedController.openNewWindowView(item, 'contractInfo')}" value="#{item.arrivalList.contractNum}" onblur="reload()" />-->
                <a href="/geapm#{assetOutStockedController.getJmPrintReportViewUrl(item, 'contractInfo')}" target="_Blank">
                    <h:outputText value="#{item.arrivalList.contractNum}"/>
                </a>
            </p:column>
            <p:column headerText="#{msg.installDate}">
                <h:outputText value="#{item.assetInfo.installDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.functionType}">
                <h:outputText value="#{item.assetInfo.functionType}"/>
            </p:column>
            <p:column headerText="#{msg.serialNum}">
                <h:outputText value="#{item.assetInfo.serialNum}"/>
            </p:column>
            <p:column headerText="#{msg.comments}">
                <h:outputText value="#{item.comments}"/>
            </p:column>
            <p:column headerText="资产价值">
                <h:outputText value="#{item.assetInfo.purchasePrice}"/>
            </p:column>
            <p:column headerText="#{msg.arrivalListInvoiceNum}">
                <h:outputText value="#{item.arrivalList.invoiceNum}"/>
            </p:column>
            <p:column headerText="发票日期">
                <h:outputText value="#{item.arrivalList.invoiceDate}"/>
            </p:column>
            <p:column headerText="领用科室">
                <h:outputText value="#{assetOutStockedController.getOrgNameByUid(item.recruiteDeptUid)}"/>
            </p:column>
            <p:column headerText="#{msg.stockStatus}">
                <h:outputText value="#{fieldMsg.fieldValue('stockStatus', item.stockStatus)}"/>
            </p:column>
            <p:column headerText="#{msg.stockSource}">
                <h:outputText value="#{fieldMsg.fieldValue('stockSource', item.stockSource)}"/>
            </p:column>
            <p:column headerText="退库单号">
<!--                <h:commandLink target="_blank" action="#{assetOutStockedController.openNewWindowView(item, 'returnedStocked')}" value="#{item.returnedStockNo}" onblur="reload()" />-->
                <a href="/geapm#{assetOutStockedController.getJmPrintReportViewUrl(item, 'returnedStocked')}" target="_Blank">
                    <h:outputText value="#{item.returnedStockNo}"/>
                </a>
            </p:column>
            <f:facet name="{Toolbar}">
                <p:commandButton value="生成退库单" disabled="#{!userContextService.hasAnyRoleByApmRoles('StockedManager')}" action="#{assetOutStockedController.prepareGeneratedReturnedStockDoc()}" validateClient="true"
                                 oncomplete="handleAssetReturnedStockSubmit(xhr, status, args);" update=":growl :assetOutStockTab:GeneratedReturnedStockDocDlg :assetOutStockTab:unfinishedAssetOrderDetailDialog"/>
                <p:commandButton id="previewQRCode" class="btn btn-sm btn-gray" icon="ui-icon-print" title="预览打印二维码"  actionListener="#{assetOutStockedController.prepareViewQrcode()}" update=":qrPreviewedDlg"  oncomplete="handleSubmit(args,'qrPreviewedDlg')" />
                <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false" actionListener="#{assetOutStockedController.exportExcel}" onclick="PrimeFaces.monitorDownload(start, stop);">
                    <p:fileDownload value="#{assetOutStockedController.exportExcelFile}"/>
                </p:commandButton>
            </f:facet>
        </p:dataTable>
    </h:form>
    <p:dialog id="GeneratedReturnedStockDocDlg" widgetVar="GeneratedReturnedStockDocDialog" modal="true" resizable="true" draggable="true" width="1450" header="生成退库单">
        <h:form id="GeneratedReturnedStockForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label class="label">合计数量：#{assetOutStockedController.selectedItems.size()}；合计金额：#{assetOutStockedController.totalPurchasePrice()}</label>
                    <label class="label">合同号：#{assetOutStockedController.contractNum}；到货单名称/编号：#{assetOutStockedController.arrivalName}；已安装设备：#{assetOutStockedController.installed}台；未安装：#{assetOutStockedController.notInstalled}台</label>
                </h:panelGroup>
            </p:panelGrid>
            <p:dataTable id="outStockDocList" value="#{assetOutStockedController.selectedItems}" var="item"
                         lazy="false" paginator="false" rowKey="#{item.id}" rows="1000"
                         emptyMessage="#{msg.noRecordFound}">
                <p:column headerText="业务时间">
                    <h:outputText value="#{item.businessDate}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.vendor}">
                    <h:outputText value="#{assetOutStockedController.supplierMap.get(item.assetInfo.supplierId)}"/>
                </p:column>
                <p:column headerText="#{msg.financingNum}">
                    <h:outputText value="#{item.assetInfo.financingNum}"/>
                </p:column>
                <p:column headerText="#{msg.assetName}">
                    <h:outputText value="#{item.assetInfo.name}"/>
                </p:column>
                <p:column headerText="#{msg.arrivalListContractNum}">
                    <h:outputText value="#{item.arrivalList.contractNum}"/>
                </p:column>
                <p:column headerText="#{msg.functionType}">
                    <h:outputText value="#{item.assetInfo.functionType}"/>
                </p:column>
                <p:column headerText="#{msg.comments}">
                    <h:outputText value="#{item.comments}"/>
                </p:column>
                <p:column headerText="资产价值">
                    <h:outputText value="#{item.assetInfo.purchasePrice}"/>
                </p:column>
                <p:column headerText="#{msg.arrivalListInvoiceNum}">
                    <h:outputText value="#{item.arrivalList.invoiceNum}"/>
                </p:column>
                <p:column headerText="发票日期">
                    <h:outputText value="#{item.arrivalList.invoiceDate}"/>
                </p:column>
                <p:column headerText="#{msg.stockStatus}">
                    <h:outputText value="#{fieldMsg.fieldValue('stockStatus',item.stockStatus)}"/>
                </p:column>
            </p:dataTable>
            <h:panelGroup>
                <label class="label">退库理由</label>
                <p:inputText value="#{assetOutStockedController.searchItem.comments}"/>
            </h:panelGroup>
            <p:commandButton validateClient="true" action="#{assetOutStockedController.generatedReturnedStockDoc()}"
                             value="#{msg.Confirm}" update=":assetOutStockTab:GeneratedReturnedStockForm :assetOutStockTab:AssetOutStockedListForm:datalist" icon="ui-icon-check"
                             oncomplete="handleSubmit(args, 'GeneratedReturnedStockDocDialog');"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" update=":assetOutStockTab:AssetOutStockedListForm:datalist" onclick="PF('GeneratedReturnedStockDocDialog').hide()"/>
        </h:form>
    </p:dialog>
    <p:dialog widgetVar="unfinishedAssetOrderDetailDialog" modal="true" id="unfinishedAssetOrderDetailDialog" draggable="true" appendTo="@(body)" height="300" width="500"   >
        <p:fieldset legend="当前设备有未完成工单,请进行处理">
            <p:commandButton rendered="#{assetInfoEditController.nurseSiteMaintainIsComplete}" validateClient="true" actionListener="#{assetInfoEditController.processUnfinishedNurseSiteMaintain('returnedStock')}"  value="自动处理未完成临床助手工单" icon="ui-icon-check"/>
            <br/> <br/> <br/>
            <h:panelGroup rendered="#{not empty assetInfoEditController.workOrderList}">
                未完成维修工单号: #{assetInfoEditController.workOrderList}  <br/> <br/> <br/>
            </h:panelGroup>
            <h:panelGroup rendered="#{not empty assetInfoEditController.pmOrderList}">
                未完成保养工单号: #{assetInfoEditController.pmOrderList}  <br/> <br/> <br/>
            </h:panelGroup>

        </p:fieldset>
    </p:dialog>
    <script type="text/javascript">
        function reload() {
            window.location.reload();
        }
        function handleAssetReturnedStockSubmit(xhr, status, args) {
            var asetOrderIsComplete = args.asetOrderIsComplete;
            var generatedReturnedStockDoc = args.generatedReturnedStockDoc;
            if (generatedReturnedStockDoc != false) {
                if (asetOrderIsComplete == true) {
                    PF('unfinishedAssetOrderDetailDialog').show();
                }else{
                    PF('GeneratedReturnedStockDocDialog').show();
                }
            }
        }
    </script>
</ui:composition>
</html>
