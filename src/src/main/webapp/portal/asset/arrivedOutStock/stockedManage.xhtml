<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <h:form id="searchDataForm">
        <p:fieldset legend="#{msg.FilterCondition}">
            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">入库单号</label>
                    <p:inputText value="#{assetStockedController.searchItem.inStockNo}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">业务时间</label>
                    <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                locale="#{userContextService.getCalendarLocale()}"
                                pattern="#{userContextService.timeFormat()}" id="startDate"
                                value="#{assetStockedController.startDate}"
                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                    -
                    <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                locale="#{userContextService.getCalendarLocale()}"
                                pattern="#{userContextService.timeFormat()}" id="endDate"
                                value="#{assetStockedController.endDate}"
                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.assetName}</label>
                    <p:inputText value="#{assetStockedController.searchItem.assetName}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.vendor}</label>
                    <p:autoComplete dropdown="true" value="#{assetStockedController.supplier}" scrollHeight="300"  forceSelection="true"
                                    completeMethod="#{assetStockedController.autoCompleteSupplier}" var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="supplierConverter">
                    </p:autoComplete>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">资产价值</label>
                    <p:inputNumber minValue="0" decimalPlaces="2" value="#{assetStockedController.startPrice}"/>
                    -
                    <p:inputNumber minValue="0" decimalPlaces="2" value="#{assetStockedController.endPrice}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.functionType}</label>
                    <p:inputText value="#{assetStockedController.searchItem.functionType}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.arrivalListInvoiceNum}</label>
                    <p:inputText value="#{assetStockedController.searchItem.invoiceNum}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.arrivalListContractNum}</label>
                    <p:inputText value="#{assetStockedController.searchItem.contractNum}"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">#{msg.stockStatus}</label>
                    <p:selectOneMenu value="#{assetStockedController.searchItem.stockStatus}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}"/>
                        <f:selectItem itemLabel="#{fieldMsg.fieldValue('stockStatus', 2)}" itemValue="2"/>
                        <f:selectItem itemLabel="#{fieldMsg.fieldValue('stockStatus', 3)}" itemValue="3"/>
                    </p:selectOneMenu>
                </h:panelGroup>
            </p:panelGrid>
            <p:commandButton value="#{msg.Search}" validateClient="true" update=":growl :assetOutStockTab:AssetStockedManageListForm :assetOutStockTab:AssetStockedManageListForm:datalist"/>
            <p:commandButton value="清空条件" validateClient="true" actionListener="#{assetStockedController.initSearchItem()}" update=":growl :assetOutStockTab:searchDataForm :assetOutStockTab:AssetStockedManageListForm:datalist"/>
        </p:fieldset>
    </h:form>

    <h:form id="AssetStockedManageListForm">
        <p:dataTable id="datalist" value="#{assetStockedController.lazyModel}" var="item" widgetVar="varDataList"
                     selection="#{assetStockedController.selectedItems}"
                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                     rowKey="#{item.id}" sortMode="single" sortBy="#{item.id}" sortOrder="descending"
                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                     rows="20" emptyMessage="#{msg.noRecordFound}"
                     rowsPerPageTemplate="20,50,100,500">
            <p:ajax event="rowSelect" listener="#{assetStockedController.onRowSelect}" update=":growl :assetOutStockTab:searchDataForm :assetOutStockTab:AssetStockedManageListForm:datalist"/>
            <p:column selectionMode="multiple" style="width:50px;text-align:center"/>
            <p:column headerText="入库单号">
<!--                <h:commandLink target="_blank" action="#{assetStockedController.openNewWindowView(item.inStockNo)}" value="#{item.inStockNo}" onblur="reload()" />-->
                <a href="/geapm#{assetStockedController.getJmPrintReportViewUrl(item.inStockNo)}" target="_Blank">
                    <h:outputText value="#{item.inStockNo}"/>
                </a>
            </p:column>
            <p:column headerText="业务时间">
                <h:outputText value="#{item.businessDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.vendor}">
                <h:outputText value="#{item.arrivalList.vendor}"/>
            </p:column>
            <p:column headerText="制单人">
                <h:outputText value="#{assetStockedController.getUserNameByUid(item.inStockUser)}"/>
            </p:column>
            <p:column headerText="#{msg.financingNum}">
                <h:outputText value="#{item.assetInfo.financingNum}"/>
            </p:column>
            <p:column headerText="#{msg.assetName}">
                <h:outputText value="#{item.assetInfo.name}"/>
            </p:column>
            <p:column headerText="#{msg.arrivalListContractNum}">
                <h:outputText value="#{item.arrivalList.contractNum}"/>
            </p:column>
            <p:column headerText="#{msg.installDate}">
                <h:outputText value="#{item.assetInfo.installDate}">
                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                </h:outputText>
            </p:column>
            <p:column headerText="#{msg.functionType}">
                <h:outputText value="#{item.assetInfo.functionType}"/>
            </p:column>
            <p:column headerText="#{msg.serialNum}">
                <h:outputText value="#{item.assetInfo.serialNum}"/>
            </p:column>
            <p:column headerText="#{msg.comments}">
                <h:outputText value="#{item.comments}"/>
            </p:column>
            <p:column headerText="资产价值">
                <h:outputText value="#{item.assetInfo.purchasePrice}"/>
            </p:column>
            <p:column headerText="#{msg.arrivalListInvoiceNum}">
                <h:outputText value="#{item.arrivalList.invoiceNum}"/>
            </p:column>
            <p:column headerText="发票日期">
                <h:outputText value="#{item.arrivalList.invoiceDate}"/>
            </p:column>
            <p:column headerText="#{msg.stockStatus}">
                <h:outputText value="#{fieldMsg.fieldValue('stockStatus', item.stockStatus)}"/>
            </p:column>
            <p:column headerText="#{msg.stockSource}">
                <h:outputText value="#{fieldMsg.fieldValue('stockSource', item.stockSource)}"/>
            </p:column>
            <f:facet name="{Toolbar}">
                <p:commandButton value="生成入库单" action="#{assetStockedController.prepareGeneratedInStockDoc()}" actionListener="#{assetStockedController.generatedStockDoc('inStock')}" validateClient="true" oncomplete="handleGeneratedInStockDoc(xhr, status, args);" update=":growl :assetOutStockTab:GeneratedInStockDocDlg"/>
                <p:commandButton value="生成出库单"  action="#{assetStockedController.prepareGeneratedOutStockDoc()}" actionListener="#{assetStockedController.generatedStockDoc('outStock')}" validateClient="true" oncomplete="handleGeneratedOutStockDoc(xhr, status, args);" update=":growl :assetOutStockTab:GeneratedOutStockDocDlg"/>
                <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false" actionListener="#{assetStockedController.exportExcel}" onclick="PrimeFaces.monitorDownload(start, stop);">
                    <p:fileDownload value="#{assetStockedController.exportExcelFile}"/>
                </p:commandButton>
            </f:facet>
        </p:dataTable>
    </h:form>
    <p:dialog id="GeneratedInStockDocDlg" widgetVar="GeneratedInStockDocDialog" modal="true" resizable="true" draggable="true" width="1450" header="#{assetStockedController.inStock ? '打印入库单' : '生成入库单'}">
        <h:form id="GeneratedInStockForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">合计数量：#{assetStockedController.selectedItems.size()}；合计金额：#{assetStockedController.totalPurchasePrice()}</label>
                    <label class="label">合同号：#{assetStockedController.contractNum}；到货单名称/编号：#{assetStockedController.arrivalName}；已安装设备：#{assetStockedController.installed}台；未安装：#{assetStockedController.notInstalled}台</label>
                </h:panelGroup>
                <h:panelGroup rendered="#{assetStockedController.inStock}">
                    <label class="label">入库单号</label>
                    <p:autoComplete dropdown="true" value="#{assetStockedController.inStockNo}" scrollHeight="300"  forceSelection="true"
                                    completeMethod="#{assetStockedController.autoCompleteInStockNo}">
                        <p:ajax event="itemSelect" listener="#{assetStockedController.onNoChange('inStock')}" update=":assetOutStockTab:GeneratedInStockForm"/>
                        <p:ajax listener="#{assetStockedController.onNoChange('inStock')}" update=":assetOutStockTab:GeneratedInStockForm"/>
                    </p:autoComplete>
                </h:panelGroup>
            </p:panelGrid>
            <div style="max-height: 600px; overflow-y: auto; overflow-x: auto;">
                <p:dataTable id="inStockDocList" value="#{assetStockedController.selectedItems}" var="item" selectionMode="single"
                             lazy="true" paginator="true" rowKey="#{item.id}" editable="true" widgetVar="inStockTable"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"  scrollable="false"
                             rows="10" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="10,50,100,500" >
                    <p:ajax event="rowEdit" listener="#{assetStockedController.onRowEdit}" update=":assetOutStockTab:GeneratedInStockForm:inStockDocList"/>
                    <p:ajax event="rowEditCancel"  update=":growl"/>
                    <p:column headerText="业务时间">
                        <h:outputText value="#{item.businessDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.vendor}">
                        <h:outputText value="#{item.arrivalList.vendor}"/>
                    </p:column>
                    <p:column headerText="#{msg.financingNum}">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.assetInfo.financingNum}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputText value="#{item.assetInfo.financingNum}" required="true" />
                            </f:facet>
                        </p:cellEditor>

                    </p:column>
                    <p:column headerText="#{msg.assetName}">
                        <h:outputText value="#{item.arrivalList.assetName}"/>
                    </p:column>
                    <p:column headerText="#{msg.arrivalListContractNum}">
                        <h:outputText value="#{item.arrivalList.contractNum}"/>
                    </p:column>
                    <p:column headerText="#{msg.functionType}">
                        <h:outputText value="#{item.arrivalList.functionType}"/>
                    </p:column>
                    <p:column headerText="#{msg.comments}">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.assetInfo.comments}">
                                </h:outputText>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputText value="#{item.assetInfo.comments}" />
                            </f:facet>
                        </p:cellEditor>
                    </p:column>
                    <p:column headerText="资产价值">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.assetInfo.purchasePrice}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputNumber value="#{item.assetInfo.purchasePrice}" decimalPlaces="2"/>
                            </f:facet>
                        </p:cellEditor>
                        <!--<p:inputNumber value="#{item.assetInfo.purchasePrice}" decimalPlaces="2"/>-->
                    </p:column>
                    <p:column headerText="自有资金" sortBy="#{item.assetInfo.ownFunds}" rendered="#{assetStockedController.enableShowSourceFunds eq 'true'}">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.assetInfo.ownFunds}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputNumber value="#{item.assetInfo.ownFunds}" decimalPlaces="2"/>
                            </f:facet>
                        </p:cellEditor>
                        <!-- <p:inputNumber value="#{item.assetInfo.ownFunds}" decimalPlaces="2"/>-->
                    </p:column>
                    <p:column headerText="财政拨款" sortBy="#{item.assetInfo.govtFunds}" rendered="#{assetStockedController.enableShowSourceFunds eq 'true'}">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.assetInfo.govtFunds}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputNumber value="#{item.assetInfo.govtFunds}" decimalPlaces="2"/>
                            </f:facet>
                        </p:cellEditor>
                        <!-- <p:inputNumber value="#{item.assetInfo.govtFunds}" decimalPlaces="2"/>-->
                    </p:column>
                    <p:column headerText="科教资金" sortBy="#{item.assetInfo.sciFunds}" rendered="#{assetStockedController.enableShowSourceFunds eq 'true'}">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText value="#{item.assetInfo.sciFunds}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </f:facet>
                            <f:facet name="input">
                                <p:inputNumber value="#{item.assetInfo.sciFunds}" decimalPlaces="2"/>
                            </f:facet>
                        </p:cellEditor>
                        <!--<p:inputNumber value="#{item.assetInfo.sciFunds}" decimalPlaces="2"/>-->
                    </p:column>
                    <p:column headerText="#{msg.arrivalListInvoiceNum}">
                        <h:outputText value="#{item.arrivalList.invoiceNum}"/>
                    </p:column>
                    <p:column headerText="发票日期">
                        <h:outputText value="#{item.arrivalList.invoiceDate}"/>
                    </p:column>
                    <p:column headerText="#{msg.stockStatus}">
                        <h:outputText value="#{fieldMsg.fieldValue('stockStatus',item.stockStatus)}"/>
                    </p:column>
                    <p:column style="width:6rem">
                        <p:rowEditor editTitle="Edit Row" cancelTitle="Cancel Edit" saveTitle="Save Row"/>
                    </p:column>
                    <f:facet name="{Toolbar}">
                        <p:commandButton id="batchButton" validateClient="false" immediate="true" icon="ui-icon-settings" oncomplete="PF('batchModifyFundsDialog').show()" class="btn btn-sm btn-gray batch-terminated" title="批量修改资金" rendered="#{assetStockedController.enableShowSourceFunds eq 'true'}"/>
                    </f:facet>
                </p:dataTable>

            </div>
            <p:commandButton validateClient="true" action="#{assetStockedController.generatedInStockDoc()}" rendered="#{!assetStockedController.inStock}"
                             value="#{msg.Confirm}" update=":assetOutStockTab:GeneratedInStockForm :assetOutStockTab:AssetStockedManageListForm:datalist" icon="ui-icon-check"
                             oncomplete="handleSubmit(args, 'GeneratedInStockDocDialog');"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" update=":assetOutStockTab:AssetStockedManageListForm:datalist" onclick="PF('GeneratedInStockDocDialog').hide()"/>
        </h:form>
    </p:dialog>
    <p:dialog id="batchModifyFundsDialog"
              widgetVar="batchModifyFundsDialog"
              modal="true" resizable="true" draggable="true"
              width="30%" height="230px" header="批量修改资金">
        <h:form id="batchModifyFundsform">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label class="label">自有资金</label>
                    <p:inputNumber value="#{assetStockedController.ownFunds}" decimalPlaces="2"> <p:ajax/></p:inputNumber>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">财政拨款</label>
                    <p:inputNumber value="#{assetStockedController.govtFunds}" decimalPlaces="2"> <p:ajax/></p:inputNumber>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">科教资金</label>
                    <p:inputNumber value="#{assetStockedController.sciFunds}" decimalPlaces="2"> <p:ajax/></p:inputNumber>
                </h:panelGroup>
            </p:panelGrid>
            <p:commandButton
                    actionListener="#{assetStockedController.saveBatchModifyFunds()}"
                    value="#{msg.Save}"
                    icon="ui-icon-check"
                    process="@this" update=":assetOutStockTab:GeneratedInStockForm:inStockDocList :assetOutStockTab:batchModifyFundsform"
                    oncomplete="PF('batchModifyFundsDialog').hide()" />

            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                             onclick="PF('batchModifyFundsDialog').hide(); return false;" />
        </h:form>

    </p:dialog>
    <p:dialog id="GeneratedOutStockDocDlg" widgetVar="GeneratedOutStockDocDialog" modal="true" resizable="true" draggable="true" width="1450" header="#{assetStockedController.outStock ? '打印出库单' : '生成出库单'}">
        <h:form id="GeneratedOutStockForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                <h:panelGroup>
                    <label class="label">合计数量：#{assetStockedController.selectedItems.size()}；合计金额：#{assetStockedController.totalPurchasePrice()}</label>
                </h:panelGroup>
                <h:panelGroup rendered="#{assetStockedController.outStock}">
                    <label class="label">出库单号</label>
                    <p:autoComplete dropdown="true" value="#{assetStockedController.outStockNo}" scrollHeight="300"  forceSelection="true"
                                    completeMethod="#{assetStockedController.autoCompleteOutStockNo}">
                        <p:ajax event="itemSelect" listener="#{assetStockedController.onNoChange('outStock')}" update=":assetOutStockTab:GeneratedOutStockForm"/>
                        <p:ajax listener="#{assetStockedController.onNoChange('outStock')}" update=":assetOutStockTab:GeneratedOutStockForm"/>
                    </p:autoComplete>
                </h:panelGroup>
                <h:panelGroup rendered="#{!assetStockedController.outStock}">
                    <label class="label">领用科室<span style="color: red">*</span></label>
                    <p:inputText id="dept" value="#{assetStockedController.recruiteDept.name}" readonly="true" required="true" requiredMessage="领用科室 #{msg.ValidationRequire}"/>
                    <p:commandButton id="orgEdit" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton"/>
                    <p:overlayPanel  id="popupPanelEdit" widgetVar="varOrgEdit" for="orgEdit"
                                     style="position: absolute; left: 0; top: 0; width: 300px;" dynamic="false" modal="false" dismissable="true">
                        <p:scrollPanel style="height:300px; border: 0" mode="native">
                            <p:inputText id="searchDeptName" value="#{assetStockedController.searchDeptName}"/>
                            <p:commandButton process=":assetOutStockTab:GeneratedOutStockForm:searchDeptName @this" partialSubmit="true" icon="ui-icon-search" update="orgTreeEdit" actionListener="#{assetStockedController.treeSeachCondition()}" value="检索"/>
                            <p:tree id="orgTreeEdit" value="#{assetStockedController.orgTreeEdit}" var="node"
                                    selectionMode="single" class="tree" style="width:98%; border:0">
                                <p:ajax process="@this" event="select"
                                        update="@parent:dept"
                                        listener="#{assetStockedController.onSelectTreeNode}"
                                        oncomplete="PF('varOrgEdit').hide();"/>
                                <p:ajax process="@this" event="expand"/>
                                <p:ajax process="@this" event="collapse"/>
                                <p:treeNode type="org">
                                    <h:outputText value="#{node}"/>
                                </p:treeNode>
                            </p:tree>
                        </p:scrollPanel>
                    </p:overlayPanel>
                </h:panelGroup>
            </p:panelGrid>
            <div style="max-height: 620px; overflow-y: auto; overflow-x: auto;">
                <p:dataTable id="outStockDocList" value="#{assetStockedController.selectedItems}" var="item"
                             lazy="false" paginator="true" rowKey="#{item.id}"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"  scrollable="false"
                             rows="10" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="10,50,100,500">
                    <p:column headerText="业务时间">
                        <h:outputText value="#{item.businessDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.vendor}">
                        <h:outputText value="#{item.arrivalList.vendor}"/>
                    </p:column>
                    <p:column headerText="#{msg.financingNum}">
                        <h:outputText value="#{item.assetInfo.financingNum}"/>
                    </p:column>
                    <p:column headerText="#{msg.assetName}">
                        <h:outputText value="#{item.arrivalList.assetName}"/>
                    </p:column>
                    <p:column headerText="#{msg.arrivalListContractNum}">
                        <h:outputText value="#{item.arrivalList.contractNum}"/>
                    </p:column>
                    <p:column headerText="#{msg.functionType}">
                        <h:outputText value="#{item.arrivalList.functionType}"/>
                    </p:column>
                    <p:column headerText="#{msg.comments}">
                        <h:outputText value="#{item.comments}"/>
                    </p:column>
                    <p:column headerText="资产价值">
                        <h:outputText value="#{item.assetInfo.purchasePrice}"/>
                    </p:column>
                    <p:column headerText="#{msg.arrivalListInvoiceNum}">
                        <h:outputText value="#{item.arrivalList.invoiceNum}"/>
                    </p:column>
                    <p:column headerText="发票日期">
                        <h:outputText value="#{item.arrivalList.invoiceDate}"/>
                    </p:column>
                    <p:column headerText="#{msg.stockStatus}">
                        <h:outputText value="#{fieldMsg.fieldValue('stockStatus',item.stockStatus)}"/>
                    </p:column>
                </p:dataTable>

            </div>
            <p:commandButton validateClient="true" action="#{assetStockedController.generatedOutStockDoc()}" rendered="#{!assetStockedController.outStock}"
                             value="#{msg.Confirm}" update=":assetOutStockTab:GeneratedOutStockForm :assetOutStockTab:AssetStockedManageListForm:datalist" icon="ui-icon-check"
                             oncomplete="handleSubmit(args, 'GeneratedOutStockDocDialog');"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" update=":assetOutStockTab:AssetOutStockedListForm:datalist" onclick="PF('GeneratedOutStockDocDialog').hide()"/>
        </h:form>
    </p:dialog>
    <script type="text/javascript">
        function reload() {
            window.location.reload();
        }
        function handleGeneratedInStockDoc(xhr, status, args) {
            var generatedInStockDoc = args.generatedInStockDoc;
            if(generatedInStockDoc != false) {
                PF('GeneratedInStockDocDialog').show();
            }
        }
        function handleGeneratedOutStockDoc(xhr, status, args) {
            var generatedOutStockDoc = args.generatedOutStockDoc;
            if(generatedOutStockDoc != false) {
                PF('GeneratedOutStockDocDialog').show();
            }
        }
    </script>
</ui:composition>
</html>
