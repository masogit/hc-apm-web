<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="content">
        <style>
            .ui-picklist .ui-picklist-list {
                height: 500px;
            }
        </style>

        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="批量修改资产"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="bulkEditForm">

                    <p:tabView id="tab">

                        <p:tab title="选择资产">

                            <p:fieldset legend="过滤条件">

                                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                    <h:panelGroup>
                                        <label class="label">#{msg.assetGroup}<span style="color:red">*</span></label>
                                        <p:selectOneMenu value="#{assetInfoBulkEditController.filter.assetGroup}">
                                            <p:ajax  update="pickList" />
                                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>

                            <p:pickList id="pickList" value="#{assetInfoBulkEditController.assets}"
                                        var="asset" itemLabel="#{asset}" itemValue="#{asset}"
                                        showSourceFilter="true" showTargetFilter="true" responsive="true"
                                        filterMatchMode="contains" converter="assetInfoConverter">
                                <f:facet name="sourceCaption">待选设备</f:facet>
                                <f:facet name="targetCaption">已选设备</f:facet>
                                <p:ajax event="transfer" listener="#{assetInfoBulkEditController.onTransfer}" />
                                <p:column style="width:20%;">
                                    <h:outputText value="#{asset.name}" />
                                </p:column>
                            </p:pickList>

                        </p:tab>

                        <p:tab title="选择资产属性">
                            <p:fieldset legend="候选资产属性列表">
                                <p:selectManyCheckbox id="grid" value="#{assetInfoBulkEditController.selectedKeyLabels}" layout="grid" columns="4">
                                    <p:ajax listener="#{assetInfoBulkEditController.updateSelectedPropertiesToChange}"  update="changeList"/>
                                    <f:selectItems value="#{assetInfoBulkEditController.candidateKeyLabels}" var="item" itemLabel="#{item.label}" itemValue="#{item.key}" />
                                </p:selectManyCheckbox>
                            </p:fieldset>
                            <p:fieldset legend="已选资产属性列表">
                                <p:panelGrid  id="changeList" columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                                    <h:panelGroup rendered="#{assetInfoBulkEditController.displayControl('hospitalId')}">
                                        <label class="label">#{msg.hospitalId}</label>
                                        <p:inputText id="selectedUserOrgName" value="#{assetInfoBulkEditController.selected.siteOrg}" readonly="true" class="SiteUIDChange"/>
                                        <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" />
                                        <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" style="width:300px" modal="false">

                                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                                <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{tenantOrgTreeController.tenantOrgTree}" var="node" selectionMode="single">
                                                    <p:ajax process="@this" event="select" update="@(.SiteUIDChange) "
                                                            listener="#{assetInfoBulkEditController.onSelectTreeNodeAsNewValue}" oncomplete="PF('varPanelOrg').hide();"/>
                                                    <p:ajax process="@this" event="expand"/>
                                                    <p:ajax process="@this" event="collapse"/>
                                                    <p:treeNode type="org">
                                                        <h:outputText value="#{node}"/>
                                                    </p:treeNode>
                                                </p:tree>
                                            </p:scrollPanel>
                                        </p:overlayPanel>
                                    </h:panelGroup>

                                    <h:panelGroup rendered="#{assetInfoBulkEditController.displayControl('clinicalDeptName')}">
                                        <label class="label">#{msg.clinicalDeptName}</label>
                                        <p:autoComplete id="clinicalDeptName" dropdown="true" value="#{assetInfoBulkEditController.selected.clinicalDeptOrg}"
                                                        scrollHeight="300"  forceSelection="true"  completeMethod="#{assetInfoBulkEditController.autoCompleteDept}"
                                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoUidConverter" class="SiteUIDChange">
                                            <p:ajax event="itemSelect" listener="#{assetInfoEditController.onClinicalDeptChange}" update="@(.clinicalDeptNameChange)" />
                                            <p:ajax listener="#{assetInfoEditController.onAssetDeptChange('clinicalDept')}" update="@(.clinicalDeptNameChange)" />
                                        </p:autoComplete>
                                    </h:panelGroup>

                                    <h:panelGroup rendered="#{assetInfoBulkEditController.displayControl('assetGroup')}">
                                        <label class="label">#{msg.assetGroup}</label>
                                        <p:selectOneMenu value="#{assetInfoBulkEditController.selected.assetGroup}">
                                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup>
                                </p:panelGrid>

                            </p:fieldset>

                            <p:commandButton id="commitBulkEditBtn" value="确认批量修改" actionListener="#{assetInfoBulkEditController.commitBulkEdit}"
                                             disabled="#{assetInfoBulkEditController.noAssetSelected()}"/>

                        </p:tab>

                    </p:tabView>



                </h:form>

            </div>
        </div>

    </ui:define>
</ui:composition>
