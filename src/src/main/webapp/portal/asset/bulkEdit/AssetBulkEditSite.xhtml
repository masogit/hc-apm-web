<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="content">
        <style>
            .ui-picklist .ui-picklist-list {
                height: 500px;
            }
        </style>

        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="批量修改资产"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="bulkEditForm">

                    <p:tabView id="tab">
                        <p:ajax event="tabChange" listener="#{assetInfoBulkEditController.onTabChange}" />

                        <p:tab title="选择资产" id="#{assetInfoBulkEditController.tabIDAsSelectAssets}">

                            <p:fieldset legend="过滤条件">

                                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                                    <h:panelGroup>
                                        <label class="label">#{msg.hospitalId}</label>
                                        <p:inputText value="#{assetInfoBulkEditController.filter.siteOrg}" readonly="true" class="siteFilterChange"/>
                                        <p:commandButton id="btnOrgFilter" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" />
                                        <p:overlayPanel widgetVar="varPanelOrgFilter" for="btnOrgFilter" hideEffect="fade" dynamic="false" style="width:300px" modal="false">

                                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                                <p:tree class="tree" style="width:98%;border:0;" value="#{tenantOrgTreeController.tenantOrgTreeOther}" var="node" selectionMode="single">
                                                    <p:ajax process="@this" event="select" update="@(.siteFilterChange) @(.pickList)"
                                                            listener="#{assetInfoBulkEditController.onSelectTreeNodeAsFilter}" oncomplete="PF('varPanelOrgFilter').hide();"/>
                                                    <p:ajax process="@this" event="expand"/>
                                                    <p:ajax process="@this" event="collapse"/>
                                                    <p:treeNode type="org">
                                                        <h:outputText value="#{node}"/>
                                                    </p:treeNode>
                                                </p:tree>
                                            </p:scrollPanel>
                                        </p:overlayPanel>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <label class="label">#{msg.clinicalDeptName}</label>
                                        <p:autoComplete dropdown="true" value="#{assetInfoBulkEditController.filter.clinicalDeptOrg}"
                                                        scrollHeight="300"  forceSelection="true"  completeMethod="#{assetInfoBulkEditController.autoCompleteDeptAsFilter}"
                                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoUidConverter" class="siteFilterChange">
                                            <p:ajax event="itemSelect" update="@(.pickList)" />
                                            <p:ajax listener="#{assetInfoEditController.onAssetDeptChange('clinicalDept')}" update="@(.pickList)" />
                                        </p:autoComplete>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <label class="label">#{msg.assetGroup}</label>
                                        <p:selectOneMenu value="#{assetInfoBulkEditController.filter.assetGroup}">
                                            <p:ajax  update="pickList" />
                                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <label class="label">#{msg.name}/#{msg.financingNum}/#{msg.departNum}/#{msg.qrCode}/#{msg.serialNum}</label>
                                        <p:inputText value="#{assetInfoBulkEditController.oneSearchStr}"  maxlength="100" style="width: 250px">
                                            <p:ajax event="keyup" update="pickList" />
                                        </p:inputText>
                                    </h:panelGroup>

                                </p:panelGrid>
                            </p:fieldset>

                            <p:pickList id="pickList" value="#{assetInfoBulkEditController.assets}"
                                        var="asset" itemLabel="#{asset}" itemValue="#{asset}"
                                        showSourceFilter="false" showTargetFilter="false" responsive="true"
                                        filterMatchMode="contains" converter="assetInfoConverter" class="pickList">
                                <f:facet name="sourceCaption"><p  style="padding-bottom:-200px">待选设备
                                    <br/>
                                    <br/>
                                    <span style="width:18%;float: left">#{msg.EquipmentName}</span>
                                    <span style="width:20%;float: left">#{msg.financingNum}</span>
                                    <span style="width:18%;float: left">#{msg.serialNum}</span>
                                    <span style="width:21%;float: left">#{msg.departNum}</span>
                                    <span style="width:21%;float: left">#{msg.qrCode}</span></p>
                                </f:facet>
                                <f:facet name="targetCaption"><p  style="padding-bottom:-200px">已选设备
                                    <br/>
                                    <br/>
                                    <span style="width:18%;float: left">#{msg.EquipmentName}</span>
                                    <span style="width:20%;float: left">#{msg.financingNum}</span>
                                    <span style="width:18%;float: left">#{msg.serialNum}</span>
                                    <span style="width:21%;float: left">#{msg.departNum}</span>
                                    <span style="width:23%;float: left">#{msg.qrCode}</span></p>
                                </f:facet>
                                <p:ajax event="transfer" listener="#{assetInfoBulkEditController.onTransfer}" update="btnBulkEditSite pickList"/>
                                <p:column style="width:18%; left: auto;">
                                    <h:outputText value="#{asset.name}" />
                                </p:column>
                                <p:column style="width:20%;left: auto;" >
                                    <h:outputText value="#{asset.financingNum}" />
                                </p:column>
                                <p:column style="width:18%;left: auto;" >
                                    <h:outputText value="#{asset.serialNum}" />
                                </p:column>
                                <p:column style="width:21%;left: auto;" >
                                    <h:outputText value="#{asset.departNum}" />
                                </p:column>
                                <p:column style="width:23%;left: auto;" >
                                    <h:outputText value="#{asset.qrCode}" />
                                </p:column>
                            </p:pickList>

                        </p:tab>

                        <p:tab title="变更资产所属院区" rendered="true" >
                            <span  style="color:red">请务必将相关资产的维修负责人/保养负责人/设备标签工程师等用户迁移到新院区，以免导致工作流问题！</span>
                            <p:fieldset>
                                <p:panelGrid  id="changeSite" columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                                    <h:panelGroup>
                                        <label class="label">#{msg.hospitalId}<span style="color:red">*</span></label>
                                        <p:inputText id="selectedUserOrgName" value="#{assetInfoBulkEditController.selected.siteOrg}" readonly="true" class="clsNewSiteName"/>
                                        <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" />
                                        <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" style="width:300px" modal="false">

                                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                                <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{tenantOrgTreeController.tenantOrgTree}" var="node" selectionMode="single">
                                                    <p:ajax process="@this" event="select" update="@(.clsBtnChangeSite) @(.clsNewSiteName) bulkEditForm:tab:clinicalDeptName"
                                                            listener="#{assetInfoBulkEditController.onSelectTreeNodeAsNewValue}" oncomplete="PF('varPanelOrg').hide();"/>
                                                    <p:ajax process="@this" event="expand"/>
                                                    <p:ajax process="@this" event="collapse"/>
                                                    <p:treeNode type="org">
                                                        <h:outputText value="#{node}"/>
                                                    </p:treeNode>
                                                </p:tree>
                                            </p:scrollPanel>
                                        </p:overlayPanel>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <label class="label">#{msg.clinicalDeptName}<span style="color:red">*</span></label>
                                        <p:autoComplete id="clinicalDeptName" dropdown="true" value="#{assetInfoBulkEditController.selected.clinicalDeptOrg}"
                                                        scrollHeight="300"  forceSelection="true"  completeMethod="#{assetInfoBulkEditController.autoCompleteDept}"
                                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoUidConverter" class="SiteUIDChange">
                                            <p:ajax update="@(.clsBtnChangeSite) " />
                                        </p:autoComplete>
                                    </h:panelGroup>

                                </p:panelGrid>

                            </p:fieldset>

                            <p:commandButton id="btnBulkEditSite" value="确认批量修改院区" actionListener="#{assetInfoBulkEditController.checkedIfNessesaryBeforeCommitBulkEditSite}"
                                             disabled="#{assetInfoBulkEditController.disableBulkEditSiteButton()}" oncomplete="handleComplete(xhr, status, args)" update="@form" class="clsBtnChangeSite"/>
                        </p:tab>


                    </p:tabView>



                </h:form>

            </div>
        </div>
        <script>
            //<![CDATA[

            function handleComplete(xhr, status, args) {
                var unCheckedNurseSite = args.unCheckedNurseSite;
                var toDeleteNurseMaintainSite = args.toDeleteNurseMaintainSite
                if(unCheckedNurseSite==true && toDeleteNurseMaintainSite == false) {
                    PF('toDeleteCheckedNurseSite').show()
                }
            }

            //]]>
        </script>
        <p:dialog widgetVar="toDeleteCheckedNurseSite" modal="true" class="toDeleteCheckedNurseSiteDialog" draggable="false" closable="false" resizable="false" showHeader="false">
            <p:fieldset legend="设备存在未完成的日常检查，需要删除吗？">
                <p:commandButton validateClient="true" actionListener="#{assetInfoBulkEditController.todelete()}" value="是" update="bulkEditForm :growl" icon="ui-icon-check"
                                 oncomplete="PF('toDeleteCheckedNurseSite').hide()"/>
                <p:commandButton immediate="true" value="否" icon="ui-icon-arrow-back" oncomplete="PF('toDeleteCheckedNurseSite').hide()"  update="bulkEditForm :growl"/>
            </p:fieldset>
        </p:dialog>
    </ui:define>
</ui:composition>
