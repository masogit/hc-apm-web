<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="departmentOwnerSettingForm">
            <p:fieldset legend="#{msg.DepartmentOwnerSettings}" rendered="#{not empty departmentOwnerSettingController.selected}">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.hospitalId}</label>
                        <p:outputLabel value="#{departmentOwnerSettingController.ownerOrgInfo == null ? '': departmentOwnerSettingController.ownerOrgInfo.name}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.clinicalDeptName}*</label>
                        <p:autoComplete id="deptOrg" dropdown="true" value="#{departmentOwnerSettingController.deptOrg}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{departmentOwnerSettingController.autoCompleteDept}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" class="SiteUIDChange">
                            <p:ajax event="itemSelect" listener="#{departmentOwnerSettingController.loadOwnerConfig()}" update="woOwner_department pmOwner_department" />
                            <p:ajax listener="#{departmentOwnerSettingController.loadOwnerConfig()}" update="woOwner_department pmOwner_department" />
                        </p:autoComplete>
                    </h:panelGroup>
                </p:panelGrid>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="woOwner_department">
                    <h:panelGroup id="woOwnerSelecter_department">
                        <label class="label">#{msg.SettingOwner}#{msg.assetOwnerName}</label>
                        <p:autoComplete dropdown="true" value="#{departmentOwnerSettingController.woOwner}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{departmentOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                    <h:panelGroup id="woOwnerSelecter_department2">
                        <label class="label">#{msg.SettingOwner}#{msg.assetOwnerName2}</label>
                        <p:autoComplete dropdown="true" value="#{departmentOwnerSettingController.woOwner2}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{departmentOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                    <h:panelGroup id="woOwnerSelecter_department3">
                        <label class="label">#{msg.SettingOwner}#{msg.assetOwnerName3}</label>
                        <p:autoComplete dropdown="true" value="#{departmentOwnerSettingController.woOwner3}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{departmentOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                </p:panelGrid>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="pmOwner_department">
                    <h:panelGroup id="pmOwnerSelecter_department">
                        <label class="label">#{msg.SetPMOwner}</label>
                        <p:autoComplete dropdown="true" value="#{departmentOwnerSettingController.pmOwner}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{departmentOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                </p:panelGrid>

                <p:commandButton value="#{msg.Save}" icon="ui-icon-check" actionListener="#{departmentOwnerSettingController.saveChange()}" validateClient="true" update=":growl ownerConfigTab:departmentOwnerListForm" style="float:left"/>
            </p:fieldset>
        </h:form>
    </div>
</ui:composition>

</html>
