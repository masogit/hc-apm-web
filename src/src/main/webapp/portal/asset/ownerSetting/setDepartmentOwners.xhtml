<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="departmentOwnerForm">
            <p:fieldset legend="科室设置" >
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.clinicalDeptName}*</label>
                        <p:selectOneMenu id="clinicalDeptName" value="#{departmentOwnerSettingController.clinicalDeptUID}" required="true" requiredMessage="请设置科室">
                            <p:ajax  listener="#{departmentOwnerSettingController.loadOwnerConfig()}" update="woOwnerSelecter_department woOwnerSelecter_department2 woOwnerSelecter_department3 pmOwnerSelecter_department" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{assetInfoService.getAllAccessibleOrgDeptListNestedByOrgLevel()}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
            <p:fieldset legend="#{msg.AssetOwnerSetting}" >
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup id="woOwnerSelecter_department">
                        <p:selectBooleanCheckbox itemLabel="#{msg.SettingOwner}#{msg.assetOwnerName}" value="#{departmentOwnerSettingController.chanegeWoOwner}" >
                            <p:ajax listener="#{departmentOwnerSettingController.onCheckChange}"  update="woOwnerSelecter_department" />
                        </p:selectBooleanCheckbox>
                        <p:autoComplete dropdown="true" value="#{departmentOwnerSettingController.woOwner}" rendered="#{departmentOwnerSettingController.chanegeWoOwner}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{departmentOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                    <h:panelGroup id="woOwnerSelecter_department2">
                        <p:selectBooleanCheckbox itemLabel="#{msg.SettingOwner}#{msg.assetOwnerName2}" value="#{departmentOwnerSettingController.chanegeWoOwner2}" >
                            <p:ajax listener="#{departmentOwnerSettingController.onCheckChange}"  update="woOwnerSelecter_department2" />
                        </p:selectBooleanCheckbox>
                        <p:autoComplete dropdown="true" value="#{departmentOwnerSettingController.woOwner2}" rendered="#{departmentOwnerSettingController.chanegeWoOwner2}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{departmentOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                    <h:panelGroup id="woOwnerSelecter_department3">
                        <p:selectBooleanCheckbox itemLabel="#{msg.SettingOwner}#{msg.assetOwnerName3}" value="#{departmentOwnerSettingController.chanegeWoOwner3}" >
                            <p:ajax listener="#{departmentOwnerSettingController.onCheckChange}"  update="woOwnerSelecter_department3" />
                        </p:selectBooleanCheckbox>
                        <p:autoComplete dropdown="true" value="#{departmentOwnerSettingController.woOwner3}" rendered="#{departmentOwnerSettingController.chanegeWoOwner3}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{departmentOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
            <p:fieldset legend="保养责任人设置" >
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup id="pmOwnerSelecter_department">
                        <p:selectBooleanCheckbox itemLabel="设置保养负责人" value="#{departmentOwnerSettingController.chanegePmOwner}" >
                            <p:ajax listener="#{departmentOwnerSettingController.onCheckChange}"  update="pmOwnerSelecter_department" />
                        </p:selectBooleanCheckbox>
                        <p:autoComplete dropdown="true" value="#{departmentOwnerSettingController.pmOwner}" rendered="#{departmentOwnerSettingController.chanegePmOwner}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{departmentOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>

            <p:commandButton value="#{msg.Save}" icon="ui-icon-check" actionListener="#{departmentOwnerSettingController.saveChange()}" validateClient="true" update=":growl" style="float:left"/>
        </h:form>
    </div>
</ui:composition>

</html>
