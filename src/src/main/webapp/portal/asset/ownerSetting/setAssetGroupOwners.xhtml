<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="assetGroupOwnerSettingForm">
            <p:fieldset legend="设备类型设置" rendered="#{not empty assetGroupOwnerSettingController.selected}">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.hospitalId}</label>
                        <p:outputLabel value="#{assetGroupOwnerSettingController.ownerOrgInfo==null ? '': assetGroupOwnerSettingController.ownerOrgInfo.name}" />
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">#{msg.assetGroup}*</label>
                        <p:selectOneMenu id="assetGroup_assetGroup" value="#{assetGroupOwnerSettingController.assetGroupID}">
                            <p:ajax event="itemSelect" listener="#{assetGroupOwnerSettingController.loadAssetGroupSecondary()}" update="assetGroupOwnerSettingForm" />
                            <p:ajax listener="#{assetGroupOwnerSettingController.loadAssetGroupSecondary()}" update="assetGroupOwnerSettingForm" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <!--<h:panelGroup >
                        <label class="label">#{msg.assetGroupSecondary}</label>
                        <p:selectOneMenu id="assetGroupSecondary_assetGroup" value="#{assetGroupOwnerSettingController.assetGroupSecondaryID}">
                            <p:ajax event="itemSelect" listener="#{assetGroupOwnerSettingController.loadOwnerConfig()}" update="assetGroupOwnerSettingForm" />
                            <p:ajax listener="#{assetGroupOwnerSettingController.loadOwnerConfig()}" update="assetGroupOwnerSettingForm" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{assetGroupOwnerSettingController.assetGroupSecondaryList}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>-->
                </p:panelGrid>

                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup id="woOwnerSelecter_assetGroup">
                        <label class="label">#{msg.SettingOwner}#{msg.assetOwnerName}</label>
                        <p:autoComplete dropdown="true" value="#{assetGroupOwnerSettingController.woOwner}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{assetGroupOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                    <h:panelGroup id="woOwnerSelecter_assetGroup2">
                        <label class="label">#{msg.SettingOwner}#{msg.assetOwnerName2}</label>
                        <p:autoComplete dropdown="true" value="#{assetGroupOwnerSettingController.woOwner2}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{assetGroupOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                    <h:panelGroup id="woOwnerSelecter_assetGroup3">
                        <label class="label">#{msg.SettingOwner}#{msg.assetOwnerName3}</label>
                        <p:autoComplete dropdown="true" value="#{assetGroupOwnerSettingController.woOwner3}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{assetGroupOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                </p:panelGrid>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup id="pmOwnerSelecter_assetGroup">
                        <label class="label">设置保养负责人</label>
                        <p:autoComplete dropdown="true" value="#{assetGroupOwnerSettingController.pmOwner}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{assetGroupOwnerSettingController.autoCompleteOwner}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        </p:autoComplete>
                    </h:panelGroup>
                </p:panelGrid>

                <p:commandButton value="#{msg.Save}" icon="ui-icon-check" actionListener="#{assetGroupOwnerSettingController.saveChange()}" validateClient="true" update=":growl ownerConfigTab:assetGroupOwnerListForm" style="float:left"/>
            </p:fieldset>
        </h:form>
    </div>
</ui:composition>

</html>
