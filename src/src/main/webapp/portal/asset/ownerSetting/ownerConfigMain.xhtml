<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.AssetOwnerSetting}"/>
            </div>

            <div class="ui-g-12">
                <p:tabView id="ownerConfigTab" class="ui-g-12">
                    <!--
                    <p:ajax event="tabChange" listener="#{measureAssetListController.onTabChange}" oncomplete="openAssetViewWindow(xhr, status, args)"/>
                    -->
                    <p:tab title="#{msg.EquipmentOwnerSettings}" id="assetOwnerSetting">
                        <ui:include src="setAssetOwners.xhtml"/>
                    </p:tab>
                    <p:tab title="#{msg.EquipmentTypeOwnerSettings}" id="assetGroupOwnerSetting">
                        <ui:include src="assetGroupOwnersList.xhtml"/>
                    </p:tab>
                    <p:tab title="#{msg.DepartmentOwnerSettings}" id="departmentOwnerSetting">
                        <ui:include src="departmentOwnersList.xhtml"/>
                    </p:tab>
                </p:tabView>
            </div>
        </div>
        <script>
            function openAssetViewWindow(xhr, status, args) {
                if(args.url != null){
                    window.location.href = args.url;
                }
            }
        </script>
    </ui:define>
</ui:composition>
