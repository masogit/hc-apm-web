<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <div class="ui-g-12 card">
            <h:form id="departmentOwnerListForm">
                <p:commandButton id="btnOrg_departmentOwner" value="#{departmentOwnerSettingController.selectedOrg==null ? msg.AllHospitals:departmentOwnerSettingController.selectedOrg.name}" type="button"
                                 icon="fa fa-angle-down" iconPos="right" />
                <p:overlayPanel widgetVar="varPanelOrg_departmentOwner" for="btnOrg_departmentOwner" hideEffect="fade" dynamic="false" style="width:300px" modal="false" appendTo="@form">
                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                        <p:tree id="orgTree_departmentOwner" class="tree" style="width:98%;border:0;" value="#{departmentOwnerSettingController.orgTree}" selection="#{departmentOwnerSettingController.selectedNode}" var="node" selectionMode="single" dynamic="true">
                            <p:ajax process="@this" event="select" update="ownerConfigTab:departmentOwnerListForm ownerConfigTab:departmentOwnerSettingForm" listener="#{departmentOwnerSettingController.onSelectTreeNode}"
                                    oncomplete="PF('varPanelOrg_departmentOwner').hide();" />
                            <p:ajax process="@this" event="expand" />
                            <p:ajax process="@this" event="collapse" />

                            <p:treeNode type="org">
                                <h:outputText value="#{node.shortName}" />
                            </p:treeNode>
							<p:treeNode type="hidden" rendered="false"/>
                        </p:tree>
                    </p:scrollPanel>
                </p:overlayPanel>

                <p:dataTable id="datalist_departmentOwner" value="#{departmentOwnerSettingController.lazyModel}" var="item" widgetVar="varDataList_departmentOwner"
                             selectionMode="single" selection="#{departmentOwnerSettingController.selected}"
                             lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                             rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                             rows="10" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="10,20,50,100">

                    <p:ajax event="rowSelect" listener="#{departmentOwnerSettingController.onSelectOwnerConfig}" update="ownerConfigTab:departmentOwnerSettingForm deleteButton"/>
                    <p:ajax event="filter" listener="#{departmentOwnerSettingController.onFilter}"/>

                    <p:column headerText="#{msg.Site}">
                        <h:outputText value="#{item.siteOrgInfo.name}"/>
                    </p:column>

                    <p:column headerText="#{msg.clinicalDeptName}" filterBy="#{item.deptOrgInfo.shortName}" filterMatchMode="LIKE" width="100">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_departmentOwner').filter()" value="#{departmentOwnerSettingController.filterOrgName}"  filter="true" filterMatchMode="contains" filterNormalize="true" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{departmentOwnerSettingController.clinicalDeptList}" var="item" itemLabel="#{item}" itemValue="#{item}"/>
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{item.deptOrgInfo.shortName}"/>
                    </p:column>

                    <p:column headerText="#{msg.assetTypeGroup}" sortBy="#{item.assetType}" filterBy="#{item.assetType}" filterMatchMode="EQ" rendered="#{departmentOwnerSettingController.enableAssetTypeGroup}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList_departmentOwner').filter()" filter="true" filterMatchMode="contains" filterNormalize="true" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{departmentOwnerSettingController.assetTypeGroupList}" var="item" itemLabel="#{item.name}" itemValue="#{item.encoded}"/>
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{departmentOwnerSettingController.assetTypeGroupMap.get(item.assetType).displayName}"/>
                    </p:column>
                    <p:column headerText="#{msg.RepairOwner}" filterBy="#{item.woOwner.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.woOwner.name}"/>
                    </p:column>
                    <p:column headerText="#{msg.RepairOwner2}" filterBy="#{item.woOwner2.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.woOwner2.name}"/>
                    </p:column>
                    <p:column headerText="#{msg.RepairOwner3}" filterBy="#{item.woOwner3.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.woOwner3.name}"/>
                    </p:column>
                    <p:column headerText="#{msg.pmOwnerName}" filterBy="#{item.pmOwner.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.pmOwner.name}"/>
                    </p:column>

                    <f:facet name="{Toolbar}">
                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{departmentOwnerSettingController.createOwerConfig}" update="ownerConfigTab:departmentOwnerSettingForm"/>
                        <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{departmentOwnerSettingController.deleteOwerConfig}" update="ownerConfigTab:departmentOwnerSettingForm ownerConfigTab:departmentOwnerListForm" disabled="#{empty departmentOwnerSettingController.selected.id}">
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>

            <ui:include src="setDepartmentOwners.xhtml"/>

        </div>
    </ui:composition>
</html>
