<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="assetGroupOwnerListForm">

            <p:commandButton id="btnOrg_assetGroupOwner" value="#{assetGroupOwnerSettingController.selectedOrg==null ? msg.AllHospitals:assetGroupOwnerSettingController.selectedOrg.name}" type="button"
                             icon="fa fa-angle-down" iconPos="right" />
            <p:overlayPanel widgetVar="varPanelOrg_assetGroupOwner" for="btnOrg_assetGroupOwner" hideEffect="fade" dynamic="false" style="width:300px" modal="false" appendTo="@form">
                <p:scrollPanel style="height:300px;border: 0" mode="native">
                    <p:tree id="orgTree_assetGroupOwner" class="tree" style="width:98%;border:0;" value="#{assetGroupOwnerSettingController.orgTree}" selection="#{assetGroupOwnerSettingController.selectedNode}" var="node" selectionMode="single" dynamic="true">
                        <p:ajax process="@this" event="select" update="ownerConfigTab:assetGroupOwnerListForm ownerConfigTab:assetGroupOwnerSettingForm" listener="#{assetGroupOwnerSettingController.onSelectTreeNode}"
                                oncomplete="PF('varPanelOrg_assetGroupOwner').hide();" />
                        <p:ajax process="@this" event="expand" />
                        <p:ajax process="@this" event="collapse" />

                        <p:treeNode type="org">
                            <h:outputText value="#{node.shortName}" />
                        </p:treeNode>
						<p:treeNode type="hidden" rendered="false"/>
                    </p:tree>
                </p:scrollPanel>
            </p:overlayPanel>

            <p:dataTable id="datalist_assetGroupOwner" value="#{assetGroupOwnerSettingController.lazyModel}" var="item" widgetVar="varDataList_assetGroupOwner"
                         selectionMode="single" selection="#{assetGroupOwnerSettingController.selected}"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rows="10" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="10,20,50,100">

                <p:ajax event="rowSelect" listener="#{assetGroupOwnerSettingController.onSelectOwnerConfig}" update="ownerConfigTab:assetGroupOwnerSettingForm deleteButton"/>
                <p:ajax event="filter" listener="#{assetGroupOwnerSettingController.onFilter}"/>

                <p:column headerText="院区">
                    <h:outputText value="#{item.siteOrgInfo.name}"/>
                </p:column>
                <p:column headerText="#{msg.assetGroup}" filterBy="#{item.assetGroupID}" filterMatchMode="EQ">
                    <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroupID)}"/>
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataList_assetGroupOwner').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                            <p:ajax event="itemSelect" listener="#{assetGroupOwnerSettingController.loadAssetGroupSecondaryFilter}" /><!--update="assetGroupSeconday" />-->
                            <p:ajax listener="#{assetGroupOwnerSettingController.loadAssetGroupSecondaryFilter}" /><!--update="assetGroupSeconday" />-->
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                </p:column>
                <!--<p:column  headerText="#{msg.assetGroupSecondary}" sortBy="#{item.assetGroupSecondaryID}" filterBy="#{item.assetGroupSecondaryID}" filterMatchMode="EQ">
                    <h:outputText value="#{fieldMsg.fieldValue('assetGroupSecondary_'.concat(item.assetGroupID), item.assetGroupSecondaryID)}"/>
                    <f:facet name="filter">
                        <p:selectOneMenu id="assetGroupSeconday" value="#{assetGroupOwnerSettingController.assetGroupSecondaryIDFilter}" onchange="PF('varDataList_assetGroupOwner').filter()"  autoWidth="false" style="max-width: 150px;" height="300" class="assetGroupChange">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{assetGroupOwnerSettingController.assetGroupSecondaryListFilter}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                </p:column>-->

                <p:column headerText="维修责任人" filterBy="#{item.woOwner.name}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.woOwner.name}"/>
                </p:column>
                <p:column headerText="维修责任人2" filterBy="#{item.woOwner2.name}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.woOwner2.name}"/>
                </p:column>
                <p:column headerText="维修责任人3" filterBy="#{item.woOwner3.name}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.woOwner3.name}"/>
                </p:column>
                <p:column headerText="保养责任人" filterBy="#{item.pmOwner.name}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.pmOwner.name}"/>
                </p:column>

                <f:facet name="{Toolbar}">
                    <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{assetGroupOwnerSettingController.createOwerConfig}" update="ownerConfigTab:assetGroupOwnerSettingForm"/>
                    <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{assetGroupOwnerSettingController.deleteOwerConfig}" update="ownerConfigTab:assetGroupOwnerSettingForm ownerConfigTab:assetGroupOwnerListForm" disabled="#{empty assetGroupOwnerSettingController.selected.id}">
                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                    </p:commandButton>
                </f:facet>
            </p:dataTable>
        </h:form>

        <ui:include src="setAssetGroupOwners.xhtml"/>
    </div>
</ui:composition>
</html>
