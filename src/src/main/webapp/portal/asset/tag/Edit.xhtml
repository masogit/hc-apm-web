<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="AssetTagEditDlg" widgetVar="AssetTagEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{assetTagController.CRUDActionName} #{msg.EquipmentLabel}" width="70%" height="550">
        <h:form id="AssetTagSearchForm" rendered="#{assetTagController.selected != null}">
            <p:fieldset legend="#{msg.assetSearchingConditions}">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.hospitalId}</label>
                        <p:inputText id="selectedOrgName" value="#{assetTagController.selectedOrg==null ? '': assetTagController.selectedOrg.name}" readonly="true" required="true"/>
                        <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                        <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{assetTagController.orgTree}" selection="#{assetTagController.selectedNode}" var="node" selectionMode="single">
                                    <p:ajax process="@this" event="select" update=":AssetTagSearchForm:selectedOrgName :AssetTagSearchForm:clinicalDeptName" listener="#{assetTagController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>

                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
                                </p:tree>
                                <p:treeNode type="hidden" rendered="false"/>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.clinicalDeptName}</label>
                        <p:autoComplete id="clinicalDeptName" dropdown="true" value="#{assetTagController.filterDeptOrg}"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{assetTagController.autoCompleteDept}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" class="SiteUIDChange">
                            <!--<p:ajax event="itemSelect" listener="#{assetTagController.getQueryAssetsList()}" update="AssetsPickList" />
                            <p:ajax listener="#{assetTagController.getQueryAssetsList()}" update="AssetsPickList" />-->
                        </p:autoComplete>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.assetGroup}</label>
                        <p:selectOneMenu id="assetGroup" value="#{assetTagController.queryAsset.assetGroup}">
                            <!--<p:ajax  listener="#{assetTagController.getQueryAssetsList()}" update="AssetsPickList" />-->
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.functionType}</label>
                        <p:inputText id="functionType" value="#{assetTagController.queryAsset.functionType}" maxlength="100"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.assetName}</label>
                        <p:inputText id="assetName" value="#{assetTagController.assetName}" maxlength="100"/>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>

            <h:panelGroup>
                <p:commandButton validateClient="true" actionListener="#{assetTagController.getQueryAssetsList()}" value="#{msg.Search}" update=":AssetTagDataForm:AssetsPickList"/>
            </h:panelGroup>
        </h:form>
        <h:form id="AssetTagDataForm" rendered="#{assetTagController.selected != null}">
            <p:fieldset legend="#{msg.relationAsset}">
                <p:pickList id="AssetsPickList" value="#{assetTagController.availableAssets}" var="item"
                            itemValue="#{item}" itemLabel="#{item.name}" showCheckbox="false" responsive="true" immediate="true"
                            showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter">
                    <f:facet name="sourceCaption">#{msg.EquipmentToBeSelected}</f:facet>
                    <f:facet name="targetCaption">#{msg.SelectedEquipment}</f:facet>
                    <p:ajax event="transfer" listener="#{assetTagController.onAssetsTransfer}" />
                    <p:column style="float: left;width:40%;">
                        <h:outputText value="#{item.name}" />
                    </p:column>
                    <p:column style="float: left;width:30%;">
                        <h:outputText value="#{item.departNum}" />
                    </p:column>
                    <p:column style="float: left;width:30%;">
                        <h:outputText value="#{item.functionType}" />
                    </p:column>
                </p:pickList>
            </p:fieldset>
            <p:fieldset legend="#{msg.RelatedMaintenanceEngineerGroup}">
                <p:pickList id="UserAccountPickList" value="#{assetTagController.availableBiomedGroup}" var="item"
                            itemValue="#{item}" itemLabel="#{item.groupName}" showCheckbox="false" responsive="true"
                            showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains"  converter="biomedGroupConverter" >
                    <f:facet name="sourceCaption">#{msg.GroupOfMaintenanceEngineersToBeSelected}</f:facet>
                    <f:facet name="targetCaption">#{msg.GroupOfMaintenanceEngineersSelected}</f:facet>
                    <p:ajax event="transfer" listener="#{assetTagController.onBiomedGroupTransfer}" />
                    <p:column style="width:100%">
                        <h:outputText value="#{item.groupName}" />
                    </p:column>
                </p:pickList>
            </p:fieldset>
            <br/>
            <h:panelGroup>
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                    <h:panelGroup styleClass="md-inputfield">
                        <p:inputText id="name" value="#{assetTagController.selected.name}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}" />
                        <label>#{msg.EquipmentLabelName}*</label>
                    </h:panelGroup>
                </p:panelGrid>
            </h:panelGroup>
            <br/>

            <p:commandButton validateClient="true" actionListener="#{assetTagController.save}" value="#{msg.Save}" update=":AssetTagEditDlg, :AssetTagListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'AssetTagEditDialog');"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('AssetTagEditDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
