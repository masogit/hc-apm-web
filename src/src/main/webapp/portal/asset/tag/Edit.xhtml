<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="AssetTagEditDlg" widgetVar="AssetTagEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{assetTagController.CRUDActionName} 设备标签" width="70%" height="550">
        <h:form id="AssetTagEditForm">
            <br/>
            <h:panelGroup>
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{assetTagController.selected != null}">
                    <h:panelGroup styleClass="md-inputfield">
                        <p:inputText id="name" value="#{assetTagController.selected.name}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}" />
                        <label>设备标签名称*</label>
                    </h:panelGroup>
                </p:panelGrid>
            </h:panelGroup>
            <br/>
            <p:fieldset legend="相关设备" rendered="#{assetTagController.selected != null}">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.assetGroup}</label>
                        <p:selectOneMenu id="assetGroup" value="#{assetTagController.queryAsset.assetGroup}">
                            <p:ajax  listener="#{assetTagController.getQueryAssetsList()}" update="AssetsPickList" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.hospitalId}</label>
                        <p:inputText id="selectedOrgName" value="#{assetTagController.selectedOrg==null ? '': assetTagController.selectedOrg.name}" readonly="true"/>
                        <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                        <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{assetTagController.orgTree}" selection="#{assetTagController.selectedNode}" var="node" selectionMode="single">
                                    <p:ajax process="@this" event="select" update=":AssetTagEditForm:selectedOrgName, :AssetTagEditForm:AssetsPickList, :AssetTagEditForm:clinicalDeptName" listener="#{assetTagController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>

                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.clinicalDeptName}</label>
                        <p:selectOneMenu id="clinicalDeptName" value="#{assetTagController.queryAsset.clinicalDeptId}">
                            <p:ajax  listener="#{assetTagController.getQueryAssetsList()}" update="AssetsPickList" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{assetTagController.clinicalDeptList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <p:pickList id="AssetsPickList" value="#{assetTagController.availableAssets}" var="item"
                            itemValue="#{item}" itemLabel="#{item.name}" showCheckbox="false" responsive="true" immediate="true"
                            showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter">
                    <f:facet name="sourceCaption">待选设备</f:facet>
                    <f:facet name="targetCaption">已选设备</f:facet>
                    <p:ajax event="transfer" listener="#{assetTagController.onAssetsTransfer}" />
                    <p:column style="float: left;width:40%;">
                        <h:outputText value="#{item.name}" />
                    </p:column>
                    <p:column style="float: left;width:30%;">
                        <h:outputText value="#{assetTagController.getOrgName(item.siteUID)}" />
                        <!--<h:outputText value="#{item.hospital.name}" />-->
                    </p:column>
                    <p:column style="float: left;width:30%;">
                        <h:outputText value="#{item.clinicalDeptName}" />
                    </p:column>
                </p:pickList>
            </p:fieldset>
            <p:fieldset legend="相关维修工程师群组" rendered="#{assetTagController.selected != null}">
                <p:pickList id="UserAccountPickList" value="#{assetTagController.availableBiomedGroup}" var="item"
                            itemValue="#{item}" itemLabel="#{item.groupName}" showCheckbox="false" responsive="true"
                            showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains"  converter="biomedGroupConverter" >
                    <f:facet name="sourceCaption">待选维修工程师群组</f:facet>
                    <f:facet name="targetCaption">已选维修工程师群组</f:facet>
                    <p:ajax event="transfer" listener="#{assetTagController.onBiomedGroupTransfer}" />
                    <p:column style="width:100%">
                        <h:outputText value="#{item.groupName}" />
                    </p:column>
                </p:pickList>
            </p:fieldset>
            <p:commandButton validateClient="true" actionListener="#{assetTagController.save}" value="#{msg.Save}" update=":AssetTagEditDlg, :AssetTagListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'AssetTagEditDialog');"/>
            &nbsp;&nbsp;
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('AssetTagEditDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
