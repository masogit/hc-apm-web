<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.Import}#{msg.AssetInfo}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="importForm">
                    <p:fieldset  legend="#{msg.ImportAssetDataFile}" id="uploaderContainer">

                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                            <h:panelGroup>
                                <label class="label">#{msg.hospitalId}<span style="color:red">*</span></label><!--所属医院-->
                                <p:inputText id="selectedUserOrgName" value="#{assetFileImportController.getSelectedOrgName()}" readonly="true" />
                                <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" disabled="#{assetFileImportController.file != null}"/>
                                <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" style="width:300px" modal="false">
                                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{assetFileImportController.orgTree}" selection="#{assetFileImportController.selectedNode}" var="node" selectionMode="single">
                                            <p:ajax process="@this" event="select" update="@form" listener="#{assetFileImportController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>

                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.choseFileToUpload}</label>
                                <h:outputText   value="#{assetFileImportController.file.fileName}"  rendered="#{not empty assetFileImportController.file}"/>
                                <p:fileUpload  id="fileUpload" fileUploadListener="#{assetFileImportController.uploadDataFile}" value="#{assetFileImportController.file}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                               multiple="false" sizeLimit="10000000" update="uploaderContainer :importDataForm" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(xls|xlsx)$/" label="#{msg.Add}" rendered="#{empty assetFileImportController.file}" />
                            </h:panelGroup>

                            <h:panelGroup>
                                <p>说明</p>

                                <p>
                                    1.
                                    <p:commandButton value="#{msg.downloadTemplateFile}" title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm" actionListener="#{assetFileImportController.exportAssetExcelTemplate}" update=":growl"
                                                     onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false"  style="background-color: #5180ce;">
                                        <p:fileDownload value="#{assetFileImportController.assetTemplateFile}" />
                                    </p:commandButton>
                                </p>
                                <p>2. 文件中填入要导入的资产数据</p>
                                <p>3. 上传文件进行导入</p>
                                <!--<p><a href="APM_Asset_Template.xlsx" title="download">#{msg.downloadTemplateFile}</a></p>-->

                            </h:panelGroup>

                        </p:panelGrid>
                    </p:fieldset>
                </h:form>
            </div>
            <div class="ui-g-12 card ">

                <h:form id="importDataForm">
                    <p:messages id="messages" showDetail="false" closable="false" autoUpdate="false">
                    </p:messages>
                    <h:panelGroup >
                        <p:selectOneRadio id="status" value="#{assetFileImportController.displayErrorsOnly}">
                            <p:ajax event="change" process="@this" update=":importDataForm" listener="#{assetFileImportController.switchAssetCheckStatus}"/>
                            <f:selectItem itemValue="false" itemLabel="全部记录"/>
                            <f:selectItem itemValue="true" itemLabel="错误记录"/>
                        </p:selectOneRadio>
                    </h:panelGroup>
                    <p:tabView>
                        <p:tab title="资产导入">
                            <p:dataTable id="assetTable" value="#{assetFileImportController.displayAssets}" var="item" rows="20" paginator="true"
                                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                         rowsPerPageTemplate="20,50,100,500" >
                                <p:column headerText="Excel行数" >
                                    <h:outputText value="#{item.get('asset').lineNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.assetName}" >
                                    <h:outputText value="#{item.get('asset').name}"/>
                                </p:column>
                                <p:column headerText="#{msg.departNum}"  >
                                    <h:outputText value="#{item.get('asset').departNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.assetOwnerName}"  >
                                    <h:outputText value="#{item.get('asset').assetOwnerName}"/>
                                </p:column>
                                <p:column headerText="#{msg.clinicalDeptName}"  >
                                    <h:outputText value="#{item.get('asset').clinicalDeptName}"/>
                                </p:column>
                                <p:column headerText="#{msg.assetGroup}"  >
                                    <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.get('asset').assetGroup)}"/>
                                </p:column>
                                <p:column headerText="#{msg.manufacture}"  >
                                    <h:outputText value="#{item.get('asset').manufacture}"/>
                                </p:column>
                                <p:column headerText="#{msg.vendor}"  >
                                    <h:outputText value="#{item.get('asset').vendor}"/>
                                </p:column>
                                <p:column headerText="#{assetFileImportController.isImported? msg.importStatus : '检查结果'}" >
                                    <h:outputText value="#{fieldMsg.fieldValue('importStatus',item.get('status'))}"/><br/>
                                    <h:outputText value="#{item.get('errmsg')}"/>
                                </p:column>
                            </p:dataTable>
                            <h:panelGroup>
                                <h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="5">
                                    <h:panelGroup>
                                        <label class="label">当二维码为空时自动生成</label>
                                        <p:selectBooleanButton   value="#{assetFileImportController.autoGenerateQrcode}" onLabel="是" offLabel="否" disabled="#{assetFileImportController.isImported}"/>
                                    </h:panelGroup>
<!--                                    <h:panelGroup>
                                        <label class="label">同时生成保养工单*</label>
                                        <p:selectOneMenu  value="#{assetFileImportController.isGeneratePmOrder}" required="true" requiredMessage="同时生成保养工单 #{msg.ValidationRequire}">
                                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                            <f:selectItem itemLabel="是" itemValue="true"/>
                                            <f:selectItem itemLabel="否" itemValue="false"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup>-->
                                </h:panelGrid>

                            </h:panelGroup>
                        </p:tab>
                        <p:tab title="部门导入">
                            <p:dataTable  value="#{assetFileImportController.displayOrgs}" var="item" >
                                <p:column headerText="Excel行数" >
                                    <h:outputText value="#{item.get('org').lineNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.Department}" >
                                    <h:outputText value="#{item.get('org').name}"/>
                                </p:column>
                                <p:column headerText="#{assetFileImportController.isImported? msg.importStatus : '检查结果'}" >
                                    <h:outputText value="#{fieldMsg.fieldValue('importStatus',item.get('status'))}"/>
                                    <h:outputText value="#{item.get('errmsg')}"/>
                                </p:column>
                            </p:dataTable>

                        </p:tab>
                        <!--                        <p:tab title="人员导入">
                                                    <p:dataTable  value="#{assetFileImportController.importUserMap.values()}" var="item" >
                                                        <p:column headerText="#{msg.assetName}"  >
                                                            <h:outputText value="#{item.get('user').name}"/>
                                                        </p:column>
                                                        <p:column headerText="#{msg.telephone}"  >
                                                            <h:outputText value="#{item.get('user').telephone}"/>
                                                        </p:column>
                                                        <p:column headerText="#{msg.orgInfoId}"  >
                                                            <h:outputText value="#{item.get('org').name}"/>
                                                        </p:column>
                                                        <p:column headerText="#{msg.loginName}"  >
                                                            <h:outputText value="#{item.get('user').loginName}"/>
                                                        </p:column>
                                                        <p:column headerText="#{msg.importStatus}" >
                                                            <h:outputText value="#{item.get('status').toString()}"/>
                                                        </p:column>
                                                    </p:dataTable>
                        
                                                </p:tab>-->
                    </p:tabView>

                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >


                        <h:panelGroup>
                            <p:commandButton validateClient="true" actionListener="#{assetFileImportController.importData()}" value="#{msg.Import}" update=":importDataForm :growl" icon="ui-icon-check" disabled="#{assetFileImportController.isEmpty() or !assetFileImportController.canbeImported or assetFileImportController.isImported}"/>
                            <!--<p:commandButton validateClient="true"  ajax="false" value="#{msg.Export}" update=" :growl" icon="ui-icon-arrowthick-1-s" onclick="PrimeFaces.monitorDownload(start, stop);" disabled="#{!assetFileImportController.isImported}" rendered="#{assetFileImportController.hasExportData}">-->
                                <!--<p:fileDownload value="#{assetFileImportController.exportFile}" />-->
                            <!--</p:commandButton>-->
                            <p:commandButton immediate="true" value="#{msg.Return}" icon="ui-icon-arrow-back" action="assetImport?faces-redirect=true"  update=":growl"/>
                        </h:panelGroup>
                        <!--<h:panelGroup >-->
                            <!--<h:outputText value="#{assetFileImportController.assetErrorCounts}资产导入数据有错误,请检查" rendered="#{assetFileImportController.assetErrorCounts>0}" />-->
                            <!--<h:outputText value="#{assetFileImportController.orgErrorCounts}部门导入数据有错误,请检查" rendered="#{assetFileImportController.orgErrorCounts>0}" />-->
                            <!--<c:forEach items="#{assetFileImportController.getAssetErrorList()}" var="item">-->
                                <!--<h:outputText value="#{item}" />-->
                            <!--</c:forEach>-->
                        <!--</h:panelGroup>-->
                    </p:panelGrid>
                </h:form>
            </div>

        </div>

    </ui:define>

</ui:composition>
