<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.QRCodeTemplateMgmt}"/>
            </div>

            <div class="ui-g-12 card">
				
                <h:form id="qrCodeLibListForm">
                    <p:dataTable id="datalist" value="#{qrCodeTemplateController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{qrCodeTemplateController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,40,60,90">

                        <p:ajax event="rowSelect" update="viewButton editButton createButton deleteButton"/>
                        <p:ajax event="filter" listener="#{qrCodeTemplateController.onFilter}" />
                        
                        <p:column headerText="租户"  filterBy="#{item.tenantUID}" filterMatchMode="EQ" rendered="#{userContextService.hasRole('SuperAdmin')}">
                            <f:facet name="filter">
                                <p:selectOneMenu value="#{qrCodeTemplateController.selectedTenantUid}" autoWidth="false" style="max-width: 150px;" >
                                    <p:ajax  update="datalist" />
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{qrCodeTemplateController.tenantList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{qrCodeTemplateController.getTenantName(item.tenantUID)}"/>
                        </p:column>

                        <p:column headerText="医院" sortBy="#{item.hospitalId}" filterBy="#{item.siteUID}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu id="hospitalIdSelect_list" onchange="PF('varDataList').filter()" autoWidth="false" style="max-width: 150px;">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{qrCodeTemplateController.hospitalFileterList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{qrCodeTemplateController.getHospitalName(item.siteUID)}"/>
                        </p:column>
                        <p:column headerText="#{msg.name}" sortBy="#{item.name}" >
                            <h:outputText value="#{item.name}">
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.Size}"  >
                            <h:outputText value="#{item.width} * #{item.height}">
                            </h:outputText>
                        </p:column>
                        <p:column headerText="启用时间"  >
                            <h:outputText value="#{item.usingDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.status}">
                            <h:outputText value="未启用"  rendered="#{not item.isUsing}"/>
                            <h:outputText value="使用中"  rendered="#{item.isUsing}"/>
                            <p:spacer/>
                            <p:commandButton icon="ui-icon-play-arrow" style="zoom:0.7" title="#{msg.setToUsing}" actionListener="#{qrCodeTemplateController.setToUsing(item.id,true)}" update=":qrCodeLibListForm:datalist"  rendered="#{not item.isUsing}" disabled="#{not qrCodeTemplateController.canEdit(item.siteUID)}"/>
                            <p:commandButton icon="ui-icon-close" style="zoom:0.7" title="停止使用" actionListener="#{qrCodeTemplateController.setToUsing(item.id,false)}" update=":qrCodeLibListForm:datalist"  rendered="#{item.isUsing}" disabled="#{not qrCodeTemplateController.canEdit(item.siteUID)}"/>
                        </p:column>


                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-add" title="#{msg.Create}" action="CreateTemplate.xhtml?faces-redirect=true&amp;action=Create" />
                            <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" action="#{qrCodeTemplateController.getEditLink()}" disabled="#{not qrCodeTemplateController.canEdit(null)}"/>
                            <p:commandButton id="viewButton" icon="ui-icon-search" title="#{msg.View}" update="TemplateViewDlg" oncomplete="PF('TemplateViewDlg').show()" disabled="#{empty qrCodeTemplateController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{qrCodeTemplateController.deleteTemplate}" update=":qrCodeLibListForm:datalist, :growl"  disabled="#{not qrCodeTemplateController.canEdit(null) or qrCodeTemplateController.selected.isUsing}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="qrCodeInfo_export"/>
                            </p:commandButton>
                        </f:facet>

                    </p:dataTable>

                </h:form>
                
                <p:dialog id="TemplateViewDlg" widgetVar="TemplateViewDlg" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.QrCode}">
                    <h:panelGroup id="display">
                        <img style="border: 1px;border-color: grey;border-style: solid" src="#{qrCodeTemplateController.getPreViewBase64()}"  width="#{qrCodeTemplateController.selected.width}px" height="#{qrCodeTemplateController.selected.height}px"/>
                    </h:panelGroup>
                </p:dialog>

<!--                <ui:include src="qrCodeLibCreate.xhtml"/>
                <ui:include src="qrCodeLibShow.xhtml"/>
                <ui:include src="generateQrCodes.xhtml"/>-->
            </div>
        </div>
    </ui:define>
</ui:composition>
