<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="qrCodeLibCreateDlg" widgetVar="qrCodeLibCreateDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.QRCodeCreate}">
    <h:form id="qrCodeLibCreateForm">
        <h:panelGroup id="display">
        	<h:panelGroup id ="tenant" >
            <h:outputLabel for="siteIdSelect" value="#{msg.TenantInfo} ： "  />
            <p:selectOneMenu id="siteIdSelect" value="#{qrCodeLibController.tenantUID}" required="true" requiredMessage="#{msg.SiteCannotBeEmpty}">
                <p:ajax  listener="#{qrCodeLibController.onSiteChange}" update="hospitalIdSelect" />
                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                <f:selectItems value="#{qrCodeLibController.tenantList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
            </p:selectOneMenu>
            <br/>
            <br/>
            <h:outputLabel for="hospitalIdSelect" value="#{msg.Hospital} ： " />
            <p:selectOneMenu id="hospitalIdSelect" value="#{qrCodeLibController.siteUID}" required="true" requiredMessage="#{msg.HospitalCannotBeEmpty}" >
                <p:ajax  listener="#{qrCodeLibController.onSiteUIDChange}" />
                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                <f:selectItems value="#{qrCodeLibController.hospitalFileterList}" var="item" itemLabel="#{qrCodeLibController.getFullorgName(item.uid)}" itemValue="#{item.uid}"/>
            </p:selectOneMenu>
            <br/>
            <br/>
            </h:panelGroup>
            <h:outputLabel for="hospitalIdSelect" value="#{msg.QRCodeQuantity} ： " />
            <p:inputNumber id="qrCodeNum" decimalPlaces="0" minValue="1" maxValue="9999" value="#{qrCodeLibController.qrCodeNum}" required="true" requiredMessage="#{msg.QuantityCannotBeEmpty}"/>
            <br/>
            <br/>
            <p:commandButton value="#{msg.ConfirmCreate}" icon="ui-icon-extlink" validateClient="true" actionListener="#{qrCodeLibController.createQrCode}" update=":qrCodeLibListForm:datalist :growl" oncomplete="handleSubmit(args, 'qrCodeLibCreateDialog');"/>
            <br/>
        </h:panelGroup>
    </h:form>
    </p:dialog>

</ui:composition>

</html>
