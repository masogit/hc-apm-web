<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:composition>
        <p:dialog id="qrCodeLibCreateDlg" widgetVar="qrCodeLibCreateDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.QRCodeCreate}">
            <h:form id="qrCodeLibCreateForm">
                <h:panelGroup id="display">
                    <h:panelGroup >
                        <p:inputText id="hospitalIdSelect" value="#{qrCodeLibController.selectedOrg.name}" readonly="true" required="true" requiredMessage="#{msg.HospitalCannotBeEmpty}"/>
                        <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;" />
                        <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false" class="ui-selectonemenu-panel">
                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                <p:inputText id="retrieval" value="#{qrCodeLibController.retrieval}" style="width:150px;"/>
                                <p:commandButton id="retrieval3" partialSubmit="true"  process=":qrCodeLibCreateForm:retrieval @this" icon="ui-icon-search"   validateClient="true"  actionListener="#{qrCodeLibController.filterNode()}" value="#{msg.Search}"  update="orgTree :growl" iconPos="right"/>
                                <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{qrCodeLibController.tenantOrgTreePage}"  var="node" selectionMode="single" dynamic="true">
                                    <p:ajax process="@this" event="select" oncomplete="PF('varPanelOrg').hide();" listener="#{qrCodeLibController.onHospitalChange}" update=":qrCodeLibCreateForm:hospitalIdSelect"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>
                                    <p:treeNode type="org">
                                        <h:outputText value="#{node.name}"/>
                                    </p:treeNode>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>

                    <h:outputLabel for="hospitalIdSelect" value="#{msg.QRCodeQuantity} ： " />
                    <p:inputNumber id="qrCodeNum" decimalPlaces="0" minValue="1" maxValue="9999" value="#{qrCodeLibController.qrCodeNum}" required="true" requiredMessage="#{msg.QuantityCannotBeEmpty}"/>
                    <br/>
                    <br/>
                    <p:commandButton value="#{msg.ConfirmCreate}"  validateClient="true" actionListener="#{qrCodeLibController.createQrCode}" update=":qrCodeLibListForm:datalist :growl" oncomplete="handleSubmit(args, 'qrCodeLibCreateDialog');"/>
                    <br/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>

</html>
