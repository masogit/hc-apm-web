<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.QRCodeMgmt}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form >
                    <p:commandButton id="qrCodeLibCreateButton"  value="#{msg.GenerateQRCodes}" title="#{msg.GenerateQRCodes}" update=":qrCodeLibCreateDlg" oncomplete="PF('qrCodeLibCreateDialog').show()"/>
                    <!--<p:commandButton id="importQrcode"  value="生成二维码" title="生成二维码" update=":qrCodeLibCreateDlg" oncomplete="PF('qrCodeLibCreateDialog').show()"/>-->
                </h:form>

                <h:form id="qrCodeLibListForm">
                    <p:dataTable id="datalist" value="#{qrCodeLibController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{qrCodeLibController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.uid}" sortMode="single" sortOrder="descending" sortBy="#{item.issueDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="viewButton"/>
                        <p:ajax event="filter" listener="#{qrCodeLibController.onFilter}" />
                        <p:column headerText="#{msg.TenantInfo}" sortBy="#{item.tenantUID}" filterBy="#{item.tenantUID}" filterMatchMode="EQ" >
                            <f:facet name="filter">
                                <p:selectOneMenu value="#{qrCodeLibController.tenantUIDFilter}" autoWidth="false" style="max-width: 150px;" disabled="#{qrCodeLibController.isChooseTenant()}"  filter="true" filterMatchMode="startsWith" effect="fade">
                                    <p:ajax  listener="#{qrCodeLibController.onTenantFilterChange}" update="datalist" />
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{qrCodeLibController.tenantList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{qrCodeLibController.getTenantName(item.tenantUID)}"/>
                        </p:column>

                        <c:choose>
                            <c:when test="#{!qrCodeLibController.hospitalOn}">
                                <p:column id="hospitalid" headerText="#{msg.Hospital}" sortBy="#{item.siteUID}" filterBy="#{item.siteUID}" filterMatchMode="EQ" >
                                    <f:facet name="filter">
                                        <p:selectOneMenu id="hospitalIdSelect_list" value="#{qrCodeLibController.siteUIDFilter}" onchange="PF('varDataList').filter()" autoWidth="false" style="max-width: 150px;" filter="true" filterMatchMode="startsWith" effect="fade">
                                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                            <f:selectItems value="#{qrCodeLibController.hospitalFileterList}" var="item" itemLabel="#{qrCodeLibController.getFullorgName(item.uid)}" itemValue="#{item.uid}"/>
                                        </p:selectOneMenu>
                                    </f:facet>
                                    <h:outputText value="#{qrCodeLibController.getHospitalName(item.siteUID)}"/>
                                </p:column>
                            </c:when>
                            <c:otherwise>
                                <p:column headerText="#{msg.Hospital}" style="word-wrap: break-word;" exportable="false">
                                   <f:facet name="header">
                                       <h:outputText value="#{msg.Hospital}"/><br/>
                                       <p:overlayPanel widgetVar="varPanelSiteFilter" for="filterOrg" hideEffect="fade" dynamic="false" modal="false" style="text-align: left;">
                                           <p:scrollPanel style="height:300px;border: 0" mode="native">
                                               <p:inputText id="retrieval" value="#{qrCodeLibController.retrieval}" style="width:150px;"/>
                                               <p:commandButton id="retrieval3" partialSubmit="true"  process=":qrCodeLibListForm:datalist:retrieval @this" icon="ui-icon-search"   validateClient="true"  actionListener="#{qrCodeLibController.filterNode()}" value="#{msg.Search}"  update="orgTree :growl" iconPos="right"/>
                                               <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{qrCodeLibController.tenantOrgTreePage}"  var="node" selectionMode="single" dynamic="true">
                                                   <p:ajax process="@this" event="select" listener="#{qrCodeLibController.onSiteFilterChange}" update=":qrCodeLibListForm:datalist" oncomplete="PF('varPanelSiteFilter').hide();"/>
                                                   <p:ajax process="@this" event="expand"/>
                                                   <p:ajax process="@this" event="collapse"/>
                                                   <p:treeNode type="org">
                                                       <h:outputText value="#{node.name}"/>
                                                   </p:treeNode>
                                                   <p:treeNode type="hidden" rendered="false"/>
                                               </p:tree>
                                           </p:scrollPanel>
                                       </p:overlayPanel>
                                       <p:inputText id="filterOrg"  value="#{qrCodeLibController.siteUIDFilter==null?'':qrCodeLibController.getHospitalName(qrCodeLibController.siteUIDFilter)}"  readonly="true"/>
                                   </f:facet>
                                   <h:outputText value="#{qrCodeLibController.getHospitalName(item.siteUID)}"/>
                               </p:column>
                            </c:otherwise>
                        </c:choose>
                        <p:column headerText="#{msg.QRCode}" sortBy="#{item.qrCode}" filterBy="#{item.qrCode}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.qrCode}"/>
                        </p:column>

                        <p:column headerText="#{msg.CurrentStatus}" sortBy="#{item.status}" filterBy="#{item.status}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" autoWidth="false" style="max-width: 150px;">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('qrCodeLibStatus')}" var="entry" itemLabel="#{entry.value}" itemValue="#{entry.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{fieldMsg.fieldValue('qrCodeLibStatus', item.status)}"/>
                        </p:column>

                        <!--<p:column headerText="#{msg.issueDate}" sortBy="#{item.issueDate}" >
                            <h:outputText value="#{item.issueDate}" style="max-width: 50px;"/>
                        </p:column>-->
                        <!--================================================================新逻辑=============filterMatchMode="GTE"=======================================================-->
                        <p:column headerText="#{msg.issueDate}"  sortBy="#{item.issueDate}" filterBy="#{item.issueDate}" filterMatchMode="EQ" >
                            <f:facet name="filter">
                                <p:inputText id="filterPlannedCompletionTime" widgetVar="varFilterPlannedCompletionTime" value="#{qrCodeLibController.plannedCompletionTimeFormat}"/>
                            </f:facet>
                            <h:outputText value="#{item.issueDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd"/>
                            </h:outputText>
                        </p:column>



                        <p:column headerText="#{msg.submitDate}" sortBy="#{item.submitDate}" >
                            <h:outputText value="#{item.submitDate}">
                                <f:convertDateTime pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="qrCodeInfo_export"/>
                            </p:commandButton>
                            <p:commandButton id="viewButton" icon="ui-icon-search" title="#{msg.View}" actionListener="#{qrCodeLibController.showQrCode}" update=":qrCodeLibShowDlg" oncomplete="PF('qrCodeLibShowDialog').show()" disabled="#{empty qrCodeLibController.selected}"/>
                            <p:commandButton id="exportButton" icon="ui-icon-arrow-1-s" title="#{msg.exportQrCode}" actionListener="#{qrCodeLibController.exportQrCode}" update=":growl" 
                                             onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false">
                                <p:fileDownload value="#{qrCodeLibController.zipFile}" />
                            </p:commandButton>
                        </f:facet>

                    </p:dataTable>

                </h:form>


                <ui:include src="qrCodeLibCreate.xhtml"/>
                <ui:include src="qrCodeLibShow.xhtml"/>
                <!--<ui:include src="generateQrCodes.xhtml"/>-->
            </div>
            <p:dialog modal="true" id="statusDialog" widgetVar="statusDialog" draggable="false" closable="false" resizable="false">
                <p:graphicImage name="img/ajaxloader.gif" />
            </p:dialog>
            <!--====================================增加时间过滤========================================-->
            <!--<p:overlayPanel id="idPanelFilterPlannedCompletionTime" widgetVar="panelFilterPlannedCompletionTime" for="qrCodeLibListForm:datalist:filterPlannedCompletionTime" dismissable="false" >
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.From}"/>
                    <p:calendar  timeZone="GMT+8"   pattern="yyyy-MM-dd"  widgetVar="varPlannedCompletionTimeFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    <p:outputLabel value="#{msg.To}"/>
                    <p:calendar  timeZone="GMT+8"   pattern="yyyy-MM-dd"  widgetVar="varPlannedCompletionTimeTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter2('varDataList', 'varFilterPlannedCompletionTime', 'varPlannedCompletionTimeFrom', 'varPlannedCompletionTimeTo'); PF('varFilterPlannedCompletionTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterPlannedCompletionTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>-->
            <p:overlayPanel id="idPanelFilterPlannedCompletionTime" widgetVar="panelFilterPlannedCompletionTime" for="qrCodeLibListForm:datalist:filterPlannedCompletionTime" dismissable="false" >
                <h:panelGrid columns="2">
                    <p:outputLabel value="#{msg.Date}"/>
                    <p:calendar  timeZone="GMT+8"   pattern="yyyy-MM-dd"  widgetVar="varPlannedCompletionTimeFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                </h:panelGrid>
                <p:commandButton onclick="setDateFilter3('varDataList', 'varFilterPlannedCompletionTime', 'varPlannedCompletionTimeFrom', 'varPlannedCompletionTimeTo'); PF('varFilterPlannedCompletionTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                <p:commandButton onclick="PF('panelFilterPlannedCompletionTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
            </p:overlayPanel>

        </div>

        <script type="text/javascript">
            function start() {
                PF('statusDialog').show();
            }

            function stop() {
                PF('statusDialog').hide();
            }

            function setDateFilter2(dataTableWidgetVar, inputWidgetVar, fromDateWidgetVar, toDateWidgetVar) {
                var input = document.getElementById(PF(inputWidgetVar).id);
                var oldValue = input.value;

                var dateFrom = PF(fromDateWidgetVar).getDate();
                var dateTo = PF(toDateWidgetVar).getDate();

                var value = "";
                if (dateFrom !== null)
                    value = dateToString(dateFrom);
                if (dateTo !== null)
                    value = value + " " + dateToString(dateTo);

                if(oldValue===value) return;

                input.value = value;
                PF(dataTableWidgetVar).filter();
            }
            function setDateFilter3(dataTableWidgetVar, inputWidgetVar, fromDateWidgetVar, toDateWidgetVar) {
                var input = document.getElementById(PF(inputWidgetVar).id);
                var oldValue = input.value;
                var dateFrom = PF(fromDateWidgetVar).getDate();
                var value = "";
                if (dateFrom !== null)
                    value = dateToString(dateFrom);

                if(oldValue===value) return;

                input.value = value;
                PF(dataTableWidgetVar).filter();
            }

            function dateToString(aDate) {
                var year = aDate.getFullYear();
                var month = (aDate.getMonth() + 1).toString();
                var day = (aDate.getDate()).toString();
                if (month.length === 1) {
                    month = "0" + month;
                }
                if (day.length === 1) {
                    day = "0" + day;
                }
                return year + "-" + month + "-" + day;
            }
        </script>
    </ui:define>
</ui:composition>
