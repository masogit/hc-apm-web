<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <script>
            var newWin;
            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }
        </script>
        <style>
            .btn+.btn { margin-left: 0 }
            .ui-column-resizer:before {content: none!important;}
            th{font-size: 12px!important;}
            td{font-size: 12px!important;padding: 0px!important;}
            table .ui-chkbox-icon, td img{ zoom: 0.7!important}
        </style>
        <div class="ui-g">
            <div class="ui-g-12">
                <div class="ui-g-12 card cardTitle">
                    <p:outputLabel class="pageTitle" value="主子设备信息"/>
                </div>
            </div>

            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <h:panelGrid id="filterType" columns="4" style="float: right">
                        <h:panelGroup>
                            <p:commandButton process="@this" update="assetPreviewListForm filterType" actionListener="#{assetPreviewController.setQueryType(1)}"  rendered="true" disabled="#{assetPreviewController.queryType == 1}" value="#{msg.All}" />
                            <p:commandButton process="@this" update="assetPreviewListForm filterType" actionListener="#{assetPreviewController.setQueryType(2)}"  rendered="true" disabled="#{assetPreviewController.queryType == 2}" value="#{msg.ParentDevice}"/>
                            <p:commandButton process="@this" update="assetPreviewListForm filterType" actionListener="#{assetPreviewController.setQueryType(3)}"  rendered="true" disabled="#{assetPreviewController.queryType == 3}" value="#{msg.ChildDevice}"/>
                        </h:panelGroup>
                    </h:panelGrid>
                    <h:panelGrid id="searchPanel" columns="3">
                        <h:panelGroup rendered="#{userContextService.hasNotAnyRole('MVSAdmin,MVSFE')}">
                            <p:commandButton id="btnOrg" value="#{empty assetPreviewController.selectSite ? msg.AllHospitals : assetPreviewController.selectSite.name}" type="button"
                                             icon="fa fa-angle-down" iconPos="right" />
                            <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false" appendTo="searchForm">
                                <p:inputText id = "listFormtreeNodeNameFilter" class="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
                                <p:commandButton partialSubmit="true" icon="ui-icon-search" process=":searchForm:listFormtreeNodeNameFilter @this" update="searchForm:orgTree" actionListener="#{orgTreeController.filterTreeNodeByName()}" value="检索"/>
                                <p:scrollPanel style="height:300px;border: 0;" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.siteOrgTree}"
                                            selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="false" cache="false">
                                        <p:ajax process="@this" event="select" update="assetPreviewListForm searchForm" listener="#{assetPreviewController.onSelectTreeNode}"
                                                oncomplete="PF('varPanelOrg').hide();" />
                                        <p:ajax process="@this" event="expand" />
                                        <p:ajax process="@this" event="collapse" />

                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.shortName}" />
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{userContextService.hasAnyRole('MVSAdmin,MVSFE')}">
                            .                            <p:commandButton id="btnTenant" value="#{empty assetInfoListController.selectSite? msg.AllTenants:assetInfoListController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right" />
                            <p:overlayPanel widgetVar="varPanelTenant" for="btnTenant" hideEffect="fade" dynamic="false" modal="false" style="text-align: left;">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="tenantTree" class="tree" style="width:98%;border:0;" value="#{tenantTreeController.buildTenantTree(1)}" selection="#{tenantTreeController.selectedTenantOrgNode}" var="node" selectionMode="single" dynamic="true">
                                        <p:ajax process="@this" event="select" listener="#{assetInfoListController.onSelectSiteTreeNode}" update=":assetPreviewListForm :searchForm" oncomplete="PF('varPanelTenant').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <p:inputText id="searchText" value="#{assetPreviewController.oneSearchStr}" placeholder="#{msg.name}/#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}/#{msg.manufacture}/#{msg.clinicalDeptName}/#{msg.assetTags}" maxlength="100" style="width: 500px">
                            <p:ajax event="keyup" update=":assetPreviewListForm searchButtons " />
                        </p:inputText>

                        <h:panelGroup id='searchButtons'>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":assetPreviewListForm :searchForm"  rendered="#{empty assetPreviewController.oneSearchStr}"/>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":assetPreviewListForm :searchForm " actionListener="#{assetPreviewController.setOneSearchStr('')}" rendered="#{not empty assetPreviewController.oneSearchStr}"/>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
                <h:form id="assetPreviewListForm">
                    <p:dataTable id="dataList" value="#{assetPreviewController.lazyModel}" var="item"  resizableColumns="true" liveResize="true" resizeMode="fit" scrollable="false"
                                 widgetVar="varDataList" selection="#{assetPreviewController.selected}" selectionMode="single"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.branchIds}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:ajax  event="rowSelect" listener="#{assetPreviewController.onSelectAsset()}" onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)" />
                        <p:column headerText="子设备" id="imgs" exportable="false" width="30">
                            <p:graphicImage url="/portal/asset/previewAsset/dot.png" style="width: 10px; height: 10px;" rendered="#{item.rank != 0}"/>
                        </p:column>


                        <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}" >
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.functionType}">
                            <h:outputText
                                    value="#{item.functionType}"/>
                        </p:column>
                        <p:column headerText="#{msg.serialNum}">
                            <h:outputText
                                    value="#{item.serialNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.departNum}">
                            <h:outputText value="#{item.departNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.assetGroup}">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                        </p:column>
                       <!-- <p:column headerText="#{msg.assetDeptName}">
                            <h:outputText value="#{item.assetDeptOrg.shortName}"/>
                        </p:column>-->
                        <p:column headerText="#{msg.clinicalDeptName}" >
                            <h:outputText value="#{item.clinicalDeptName}"/>
                        </p:column>
                        <p:column headerText="#{msg.manufacture}">
                            <h:outputText value="#{item.manufacture}"/>
                        </p:column>
                        <p:column headerText="#{msg.vendor}">
                            <h:outputText value="#{item.vendor}"/>
                        </p:column>
                        <p:column headerText="#{msg.status}">
                            <h:outputText value="#{fieldMsg.fieldValue('assetStatus',item.status)}"/>
                        </p:column>
                        <p:column headerText="#{msg.warrantyDate}">
                            <h:outputText value="#{item.warrantyDate}"/>
                        </p:column>
                        <p:column headerText="#{msg.financingNum}">
                            <h:outputText value="#{item.financingNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.QRCode}" >
                            <h:outputText value="#{item.qrCode}"/>
                        </p:column>
                       <!-- <p:column headerText="#{msg.assetTags}">
                            <h:outputText value="#{item.assetTagsView}"/>
                        </p:column>-->
                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" actionListener="#{assetPreviewController.exportExcel}" update=":growl"
                                             onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false" >
                                <p:fileDownload value="#{assetInfoListController.excelFile}" />
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
