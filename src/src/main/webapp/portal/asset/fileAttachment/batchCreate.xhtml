<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>

    <p:dialog id="FileEditDlg" widgetVar="FileEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="批量创建" width="70%" height="550">
        <h:form id="FileEditForm">
            <p:fieldset legend="相关设备">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.hospitalId}</label>
                        <p:inputText id="selectedOrgName" value="#{assetFileAttachmentController.selectedOrg==null ? '': assetFileAttachmentController.selectedOrg.name}" readonly="true"/>
                        <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                        <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{assetFileAttachmentController.orgTree}" selection="#{assetFileAttachmentController.selectedNode}" var="node" selectionMode="single">
                                    <p:ajax process="@this" event="select" update=":FileEditForm:selectedOrgName, :FileEditForm:clinicalDeptName, :FileEditForm:AssetsPickList" listener="#{assetFileAttachmentController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>

                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.clinicalDeptName}</label>
                        <p:selectOneMenu id="clinicalDeptName" value="#{assetFileAttachmentController.queryAsset.clinicalDeptId}">
                            <p:ajax  listener="#{assetFileAttachmentController.getQueryAssetsList()}" update="AssetsPickList"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{assetFileAttachmentController.clinicalDeptList}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.assetGroup}</label>
                        <p:selectOneMenu id="assetGroup" value="#{assetFileAttachmentController.queryAsset.assetGroup}">
                            <p:ajax  listener="#{assetFileAttachmentController.getQueryAssetsList()}" update="AssetsPickList"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <p:pickList id="AssetsPickList" value="#{assetFileAttachmentController.availableAssets}" var="item"
                            itemValue="#{item}" itemLabel="#{item.name}#{item.functionType}" showCheckbox="false" responsive="true" immediate="true"
                            showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter">
                    <f:facet name="sourceCaption">待选设备</f:facet>
                    <f:facet name="targetCaption">已选设备</f:facet>
                    <p:ajax event="transfer" listener="#{assetFileAttachmentController.onAssetsTransfer}" />
                    <p:column style="float: left;width:40%;">
                        <h:outputText value="#{item.name}(#{item.functionType})" />
                    </p:column>
                    <p:column style="float: left;width:30%;">
                        <h:outputText value="#{assetFileAttachmentController.getOrgName(item.siteUID)}" />
                    </p:column>
                    <p:column style="float: left;width:30%;">
                        <h:outputText value="#{item.clinicalDeptName}" />
                    </p:column>
                </p:pickList>
            </p:fieldset>
            <p:fieldset  id="editSet" legend="相关附件" style="margin-bottom:20px">
                <h:panelGroup id="display">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                        <h:panelGroup>
                            <label class="label">#{msg.fileType}*</label>
                            <p:selectOneMenu id="fileType" value="#{assetFileAttachmentController.boSubTypeBatch}" required="true" requiredMessage="#{msg.fileType} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                                <c:forEach items="#{fieldMsg.getFieldValueList('attachmentType')}" var="v">
                                    <c:if test="#{v.msgKey ne '4'}">
                                        <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}" />
                                    </c:if>
                                </c:forEach>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <p:panel id="upload" styleClass="ui-panelgrid-blank" style=" border: 0">
                            <h:panelGroup rendered="#{assetFileAttachmentController.batchBlobObject.objectName==null}">
                                <p:fileUpload fileUploadListener="#{assetFileAttachmentController.handleFileUploadBatch}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                              multiple="false" sizeLimit="100000000" update=":FileEditForm:upload" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M"  label="#{msg.Add}" />
                                <!--<p:growl id="messages" showDetail="true" />-->
                            </h:panelGroup>
                            <h:panelGroup id="namepanel" rendered="#{assetFileAttachmentController.batchBlobObject.objectName!=null}">
                                <label class="label">#{msg.name}*</label>
                                <p:inputText id="name" value="#{assetFileAttachmentController.batchBlobObject.objectName}"  required="false" requiredMessage="#{msg.SelectUploadFile}" readonly="true"/>
                                <p:commandButton actionListener="#{assetFileAttachmentController.removeAttachmentBatch(assetFileAttachmentController.batchBlobObject.boId)}" id="iconOnly" update=":FileEditForm:upload" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </h:panelGroup>
                        </p:panel>
                    </p:panelGrid>
                </h:panelGroup>
            </p:fieldset>
            <h:panelGroup>
                <p:commandButton validateClient="true" actionListener="#{assetFileAttachmentController.batchSave()}" value="#{msg.Save}" update=":AssetFileAttachmentListForm:datalist, :growl" icon="ui-icon-check" oncomplete="PF('FileEditDialog').hide()"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('FileEditDialog').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
