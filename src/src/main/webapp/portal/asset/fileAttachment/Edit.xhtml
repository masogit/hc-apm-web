<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>

    <h:form id="AssetFileAttachmentEditForm">
        <p:fieldset id="editSet" legend="#{assetFileAttachmentController.CRUDActionName}" style="margin-bottom:20px"
                    rendered="#{assetFileAttachmentController.selected != null}">
            <h:panelGroup id="display">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">#{msg.fileType}*</label>
                        <p:selectOneMenu id="fileType" value="#{assetFileAttachmentController.selected.boSubType}"
                                         required="true" requiredMessage="#{msg.fileType} #{msg.ValidationRequire}">
                            <p:ajax update="AssetFileAttachmentEditForm"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{assetFileAttachmentController.i18nMessages}" var="v">
                                <!--                                <c:if test="#{v.msgKey ne '4'}">-->
                                <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}"/>
                                <!--  </c:if>-->
                            </c:forEach>
                        </p:selectOneMenu>
                    </h:panelGroup>

                 <!--   <h:panelGroup>
                        <label class="label">#{msg.assetName}*</label>
                        <p:inputText id="assetName" readonly="true"
                                     value="#{assetFileAttachmentController.selectedAsset.name}"
                                     placeholder="#{msg.noAssetSelected}" required="true"
                                     requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>
                        <p:commandButton class="popupIconButton"
                                         actionListener="#{assetFileSelectAssetController.prepareDialogCallback(assetFileAttachmentController, ':AssetFileAttachmentEditForm:assetName :AssetFileAttachmentEditForm:targetAssets')}"
                                         process="@this" icon="ui-icon-arrow-drop-down" update=":selectAssetDlg"
                                         oncomplete="PF('varSelectAssetDlg').show()"/>
                    </h:panelGroup>-->
                    <h:panelGroup>
                        <p:dataTable id="targetAssets" value="#{assetFileAttachmentController.targetAssets}" var="item"
                                     widgetVar="targetAssets" selectionMode="single"
                                     lazy="false" paginator="true" rowKey="#{item.id}" sortMode="single"
                                     sortOrder="ascending" sortBy="#{item.id}" paginatorTemplate="{Toolbar} "
                                     emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="#{msg.name}" sortBy="#{item.name}">
                                <h:outputText value="#{item.name}"/>
                            </p:column>
                            <p:column headerText="#{msg.manufacture}" sortBy="#{item.manufacture}">
                                <h:outputText value="#{item.manufacture}"/>
                            </p:column>
                            <p:column headerText="#{msg.vendor}" sortBy="#{item.vendor}">
                                <h:outputText value="#{item.vendor}"/>
                            </p:column>
                            <p:column headerText="#{msg.maitanance}" sortBy="#{item.maitanance}">
                                <h:outputText value="#{item.maitanance}"/>
                            </p:column>
                            <p:column headerText="#{msg.maitananceTel}" sortBy="#{item.maitananceTel}">
                                <h:outputText value="#{item.maitananceTel}"/>
                            </p:column>
                            <p:column headerText="#{msg.serialNum}" sortBy="#{item.serialNum}">
                                <h:outputText value="#{item.serialNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}" sortBy="#{item.departNum}">
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.financingNum}" sortBy="#{item.financingNum}">
                                <h:outputText value="#{item.financingNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.locationName}" sortBy="#{item.locationName}">
                                <h:outputText value="#{item.locationName}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}" sortBy="#{item.clinicalDeptName}">
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}">
                                <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetOwnerName}" sortBy="#{item.assetOwnerName}">
                                <h:outputText value="#{item.assetOwnerName}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetOwnerTel}" sortBy="#{item.assetOwnerTel}">
                                <h:outputText value="#{item.assetOwnerTel}"/>
                            </p:column>
                            <f:facet name="{Toolbar}">
                                <p:commandButton value="#{msg.AddNewAsset}" class="zoom-08" immediate="false" process="@this"
                                                 actionListener="#{assetFileSelectAssetController.prepareDialogCallback(assetFileAttachmentController, ' :AssetFileAttachmentEditForm:targetAssets')}"
                                                 update="selectAssetDlg"
                                                 oncomplete="PF('varSelectAssetDlg').show()"/>
                            </f:facet>
                        </p:dataTable>
                    </h:panelGroup>

                    <p:panel id="upload" styleClass="ui-panelgrid-blank" style=" border: 0"
                             rendered="#{'vlink' ne assetFileAttachmentController.selected.boSubType}">
                        <h:panelGroup rendered="#{assetFileAttachmentController.isCreatAction()}">

                            <p:dataList id="objectImages" value="#{assetFileAttachmentController.batchBlobObjectList}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                                <f:facet name="header">附件</f:facet>
                                <p:commandLink value="#{fileitem.objectName}" ajax="false" actionListener="#{assetFileAttachmentController.downloadDocument(fileitem.objectStorageId)}"/>
                                <p:commandButton actionListener="#{assetFileAttachmentController.removeAttachmentBatch(fileitem.id)}" update="objectImages" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </p:dataList>
                            <p:fileUpload allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS|PPTX|PPT|ppt|pptx)$/"
                                          fileUploadListener="#{assetFileAttachmentController.handleFileUpload}"
                                          mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                          multiple="false" sizeLimit="500000000"
                                          update=":AssetFileAttachmentEditForm:upload" auto="true"
                                          invalidSizeMessage="#{msg.invalidSizeMessage}500M" label="#{msg.Add}"/>
                        </h:panelGroup>


                       <!-- <h:panelGroup id="namepanel"
                                      rendered="#{assetFileAttachmentController.selected.objectName!=null}">
                            <label class="label">#{msg.name}*</label>
                            <p:inputText id="name" value="#{assetFileAttachmentController.selected.objectName}"
                                         required="false" requiredMessage="#{msg.SelectUploadFile}" readonly="true"/>
                            <p:commandButton
                                    actionListener="#{assetFileAttachmentController.removeAttachment(assetFileAttachmentController.selected.boId)}"
                                    id="iconOnly" update=":AssetFileAttachmentEditForm:upload" icon="ui-icon-clear"
                                    title="#{msg.Delete}" class="popupIconButton" process="@this"
                                    rendered="#{assetFileAttachmentController.isCreatAction()}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}"
                                           icon="ui-icon-warning"/>
                            </p:commandButton>
                        </h:panelGroup>-->
                    </p:panel>
                    <p:panel id="vlinkPanel" styleClass="ui-panelgrid-blank" style=" border: 0"
                             rendered="#{'vlink' eq assetFileAttachmentController.selected.boSubType}">
                        <h:panelGroup>
                            <label class="label">#{msg.name}<span style="color:red">*</span></label>
                            <p:inputTextarea id="vlinkTitle" value="#{assetFileAttachmentController.vlinkTitle}"
                                             rows="1" cols="33"/>

                            <label class="label">#{msg.link}<span style="color:red">*</span></label>
                            <p:inputTextarea id="vlinkinput" value="#{assetFileAttachmentController.vlink}" rows="1"
                                             cols="33"/>
                        </h:panelGroup>
                    </p:panel>
                </p:panelGrid>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{assetFileAttachmentController.save}"
                                     value="#{msg.Save}"
                                     update=":AssetFileAttachmentListForm:datalist, :growl :AssetFileAttachmentEditForm"
                                     icon="ui-icon-check"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back"
                                     actionListener="#{assetFileAttachmentController.cancel}"
                                     update="display,:AssetFileAttachmentEditForm :growl"/>
                </h:panelGroup>

            </h:panelGroup>
        </p:fieldset>
    </h:form>

</ui:composition>
</html>
