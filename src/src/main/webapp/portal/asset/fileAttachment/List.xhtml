<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.AssetDocMgmt}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form>
                    <p:commandButton id="batchCreate"  value="批量创建" title="批量创建" action="#{assetFileAttachmentController.cancelData()}" update=":FileEditDlg" oncomplete="PF('FileEditDialog').show()"/>
                </h:form>

                <h:form id="AssetFileAttachmentListForm">
                    <p:dataTable id="datalist" value="#{assetFileAttachmentController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{assetFileAttachmentController.selected}" disabledSelection="true"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" listener="#{assetFileAttachmentController.onSelectedChange}" update="createButton  deleteButton :AssetFileAttachmentEditForm"/>
                        <p:ajax event="filter" listener="#{assetFileAttachmentController.onFilter}" oncomplete="updateSelectAllCheckBox();"/>
                        <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />

                        <p:column width="36" id="checkBoxColumn">
                            <p:selectBooleanCheckbox value="#{assetFileAttachmentController.selectedMap[item.id]}"  class="selectCheckBox">
                                <p:ajax process="@this" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header"  >
                                <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                    <p:ajax listener="#{assetFileAttachmentController.onSelectAllOfPage}" update="@(.selectCheckBox) deleteButton" oncomplete="updateSelectAllCheckBox();"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.assetName}" sortBy="#{item.assetInfo.name}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.serialNum}" sortBy="#{item.assetInfo.serialNum}" filterBy="#{item.assetInfo.serialNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.serialNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.qrCode}" sortBy="#{item.assetInfo.qrCode}" filterBy="#{item.assetInfo.qrCode}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.qrCode}"/>
                        </p:column>
                        <p:column headerText="设备型号" sortBy="#{item.assetInfo.functionType}" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.functionType}"/>
                        </p:column>
                        <p:column rendered="#{!userContextService.hasCurrentTenantName('')}" headerText="#{msg.fileType}" filterBy="#{item.boSubType}" filterMatchMode="EQ">
                            <h:outputText value="#{assetFileAttachmentController.getAttachmentType(item.boSubType)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <c:forEach items="#{assetFileAttachmentController.i18nMessages}" var="v">
                                        <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}" />
                                    </c:forEach>
                                    <!--<f:selectItems value="#{fieldMsg.getFieldValueList('attachmentType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>-->
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column rendered="#{userContextService.hasCurrentTenantName('')}" headerText="#{msg.fileType}" filterBy="#{item.boSubType}" filterMatchMode="EQ">
                            <h:outputText value="#{assetFileAttachmentController.getAttachmentType(item.boSubType)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <c:forEach items="#{assetFileAttachmentController.i18nMessages}" var="v">
                                        <c:if test="#{v.msgKey ne '1' and v.msgKey ne '4'}">
                                            <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}" />
                                        </c:if>
                                    </c:forEach>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.name}" sortBy="#{item.objectName}" filterBy="#{item.objectName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.objectName}"/>
                        </p:column>
                        <p:column headerText="#{msg.download}" exportable="false">
                            <p:commandLink value="#{msg.download}" ajax="false" actionListener="#{assetFileAttachmentController.downloadDocument(item.objectStorageId)}"/>
                            <p:link href="#{item.extLink}" target="_blank" rendered="#{'vlink' eq item.boSubType}">打开</p:link>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{assetFileAttachmentController.prepareCreate}" update=":AssetFileAttachmentEditForm" />
                            <p:commandButton id="deleteButton" icon="ui-icon-delete" class="btn btn-sm btn-gray batch-terminated" title="批量删除" actionListener="#{assetFileAttachmentController.deleteBatch}" update=":AssetFileAttachmentListForm :growl" disabled="#{not assetFileAttachmentController.isChecked()}">
                                <p:confirm header="批量删除确认" message="您确定要删除选定的记录么?" icon="ui-icon-warning"/>
                            </p:commandButton>
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="AssetFileAttachment_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                    <p:remoteCommand name="rc" update="datalist:createButton datalist:deleteButton AssetFileAttachmentEditForm" immediate="true"/>
                </h:form>
                <ui:include src="Edit.xhtml"/>
                <ui:include src="View.xhtml"/>
                <ui:include src="batchCreate.xhtml"/>
            </div>
        </div>
        <ui:include src="selectAssetDialog.xhtml"/>

        <script>
            //<![CDATA[
            function start() {
                PF('statusDialog').show();
            }

            function stop() {
                PF('statusDialog').hide();
            }

            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });

                $("#AssetFileAttachmentListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }

            //]]>


        </script>
    </ui:define>
</ui:composition>
