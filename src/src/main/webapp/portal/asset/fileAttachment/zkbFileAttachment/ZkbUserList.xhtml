<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.zkbKnowledgeView}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="zkbUserFileAttachmentListForm">
                    <p:dataTable id="datalist" value="#{zkbUserFileAttachmentController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbUserFileAttachmentController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="filter" listener="#{zkbUserFileAttachmentController.onFilter}" />

                        <p:column headerText="#{msg.mainDirectory}" filterBy="#{item.blobObject.mainDirectory}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.blobObject.mainDirectory}"/>
                        </p:column>

                        <p:column headerText="#{msg.secondDirectory}" filterBy="#{item.blobObject.secondDirectory}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.blobObject.secondDirectory}"/>
                        </p:column>

                        <p:column headerText="#{msg.name}" filterBy="#{item.blobObject.objectName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.blobObject.objectName}"/>
                        </p:column>

                        <p:column headerText="#{msg.fileType}" filterBy="#{item.blobObject.boSubType}" filterMatchMode="LIKE">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbAttachmentType', item.blobObject.boSubType)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <c:forEach items="#{fieldMsg.getFieldValueList('zkbAttachmentType')}" var="v">
                                        <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}" />
                                    </c:forEach>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>

                        <p:column headerText="#{msg.operationType}" filterBy="#{item.blobObject.operationType}" filterMatchMode="LIKE">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbOperationType', item.blobObject.operationType)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <c:forEach items="#{fieldMsg.getFieldValueList('zkbOperationType')}" var="v">
                                        <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}" />
                                    </c:forEach>
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>

                        <p:column headerText="#{msg.download}" exportable="false">
                            <p:link href="#{fileDownloadService.getFileUrl(item.blobObject.objectStorageId)}">#{msg.download}</p:link>
                        </p:column>

                        <f:facet name="{Toolbar}">
                        </f:facet>

                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
