<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.zkbKnowledgeView}"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.mainDirectory}</label>
<!--                                <p:inputText id="mainDirectory" value="#{zkbUserFileAttachmentController.mainDirectory}" />-->
                                <p:selectOneMenu id="mainDirectory" value="#{zkbUserFileAttachmentController.mainDirectory}">
                                    <p:ajax update="secondDirectory"/>
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <c:forEach items="#{zkbUserFileAttachmentController.findMainDirectory()}" var="v">
                                        <f:selectItem itemLabel="#{v.name}" itemValue="#{v.name}"/>
                                    </c:forEach>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.secondDirectory}</label>
<!--                                <p:inputText id="secondDirectory" value="#{zkbUserFileAttachmentController.secondDirectory}" />-->
                                <p:selectOneMenu id="secondDirectory" value="#{zkbUserFileAttachmentController.secondDirectory}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <c:forEach items="#{zkbUserFileAttachmentController.getSubZkbFileDirectoryListByMainDirectory()}" var="v">
                                        <f:selectItem itemLabel="#{v.name}" itemValue="#{v.name}"/>
                                    </c:forEach>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.name}</label>
                                <p:inputText id="objectName" value="#{zkbUserFileAttachmentController.objectName}" />
                            </h:panelGroup>
                            <!--<h:panelGroup>
                                <label class="label">#{msg.fileType}</label>
                                <p:selectOneMenu id="boSubType" value="#{zkbUserFileAttachmentController.boSubType}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbAttachmentType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.operationType}</label>
                                <p:selectOneMenu id="operationType" value="#{zkbUserFileAttachmentController.operationType}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('zkbOperationType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>-->
                        </p:panelGrid>
                    </p:fieldset>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <p:commandButton value="#{msg.SearchResult}" actionListener="#{zkbUserFileAttachmentController.loadData}" icon="ui-icon-arrowthick-1-s" validateClient="false" update=":growl :zkbUserFileAttachmentListForm:datalist">
                            </p:commandButton>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:form>
                <h:form id="zkbUserFileAttachmentListForm">
                    <p:dataTable id="datalist" value="#{zkbUserFileAttachmentController.v2_BlobObjectList}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{zkbUserFileAttachmentController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.operationType}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:column headerText="#{msg.mainDirectory}">
                            <h:outputText value="#{item.mainDirectory}"/>
                        </p:column>
                        <p:column headerText="#{msg.secondDirectory}">
                            <h:outputText value="#{item.secondDirectory}"/>
                        </p:column>
                        <p:column headerText="#{msg.name}">
                            <h:outputText value="#{item.objectName}"/>
                        </p:column>
                        <p:column headerText="#{msg.fileType}">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbAttachmentType', item.boSubType)}"/>
                        </p:column>
                        <p:column headerText="#{msg.operationType}">
                            <h:outputText value="#{fieldMsg.fieldValue('zkbOperationType', item.operationType)}"/>
                        </p:column>
                        <p:column headerText="操作" exportable="false">
                            <h:panelGroup rendered="#{'OperationVideo' ne item.boSubType}">
                                <p:commandLink value="#{msg.download}" ajax="false" actionListener="#{assetFileAttachmentController.downloadDocument(item.objectStorageId)}"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{'OperationVideo' eq item.boSubType and item.extLink !=null}">
                                <p:link href="#{item.extLink}"  target="_blank">观看</p:link>
                            </h:panelGroup>
                        </p:column>
                        <f:facet name="{Toolbar}">
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
