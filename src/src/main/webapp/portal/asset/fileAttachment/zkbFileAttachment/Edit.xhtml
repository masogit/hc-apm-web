<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>

    <h:form id="zkbFileAttachmentEditForm">
        <p:fieldset id="zkbFiledSet" legend="#{zkbFileAttachmentController.CRUDActionName}" style="margin-bottom:20px" rendered="#{zkbFileAttachmentController.selected != null}">
            <h:panelGroup>
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup rendered="#{zkbFileAttachmentController.actionName eq 'Edit'}">
                        <label class="label">#{msg.name}</label>
                        <h:outputText value="#{zkbFileAttachmentController.selected.objectName}"/>
                    </h:panelGroup>
                </p:panelGrid>

                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">#{msg.fileType}*</label>
                        <p:selectOneMenu id="fileType" value="#{zkbFileAttachmentController.selected.boSubType}" required="true" requiredMessage="#{msg.fileType} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{fieldMsg.getFieldValueList('zkbAttachmentType')}" var="v">
                                <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}"/>
                            </c:forEach>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.operationType}*</label>
                        <p:selectOneMenu id="fileOperationType" value="#{zkbFileAttachmentController.selected.operationType}" required="true" requiredMessage="#{msg.operationType} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{fieldMsg.getFieldValueList('zkbOperationType')}" var="v">
                                <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}"/>
                            </c:forEach>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.mainDirectory}*</label>
                        <p:selectOneMenu id="fileMainDirectory" value="#{zkbFileAttachmentController.selected.mainDirectory}" required="true" requiredMessage="#{msg.mainDirectory} #{msg.ValidationRequire}">
                            <p:ajax update="fileSecondDirectory"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{fieldMsg.getFieldValueList('zkbMainDirectory')}" var="v">
                                <f:selectItem itemLabel="#{v.value}" itemValue="#{v.msgKey}"/>
                            </c:forEach>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.secondDirectory}*</label>
                        <p:selectOneMenu id="fileSecondDirectory" value="#{zkbFileAttachmentController.selected.secondDirectory}" required="true" requiredMessage="#{msg.secondDirectory} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:forEach items="#{zkbFileAttachmentController.zkbSecondDirectoryList}" var="v">
                                <f:selectItem itemLabel="#{v}" itemValue="#{v}"/>
                            </c:forEach>
                        </p:selectOneMenu>
                    </h:panelGroup>

                </p:panelGrid>
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup rendered="#{zkbFileAttachmentController.actionName eq 'Create'}">
                        <p:dataList id="zkbUploadList" value="#{zkbFileAttachmentController.attachements}" var="fileitem" type="definition" emptyMessage="#{msg.noRecordFound}">
                            <f:facet name="header">#{msg.attachmentList}</f:facet>
                            <h:outputText value="#{fileitem.objectName}"/>
                            <p:commandButton actionListener="#{zkbFileAttachmentController.removeAttachmentById(fileitem.id)}" update="zkbUploadList" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </p:dataList>
                        <p:fileUpload id="zkbUploadFile" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/" fileUploadListener="#{zkbFileAttachmentController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%"
                                      multiple="true"  sizeLimit="100000000"  update="zkbUploadList" auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}100M" label="#{msg.Add}"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.TenantInfo}*</label>
                        <p:selectManyMenu value="#{zkbFileAttachmentController.selectedTenantInfoList}" var="t" converter="tenantInfoConverter" required="true" filter="true" filterMatchMode="contains" showCheckbox="true" requiredMessage="#{msg.TenantInfo} #{msg.ValidationRequire}" style="width:50%">
                            <f:selectItems value="#{zkbFileAttachmentController.tenantInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
                            <p:column>
                                <h:outputText value="#{t.name}" />
                            </p:column>
                        </p:selectManyMenu>
                    </h:panelGroup>

                </p:panelGrid>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{zkbFileAttachmentController.saveZkbFileAttachment}" update=":zkbFileAttachmentListForm :zkbFileAttachmentEditForm :growl" value="#{msg.Save}" icon="ui-icon-check"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-arrow-back" actionListener="#{zkbFileAttachmentController.cancel}" update=":zkbFileAttachmentEditForm :growl"/>
                </h:panelGroup>

            </h:panelGroup>
        </p:fieldset>
    </h:form>

</ui:composition>
</html>
