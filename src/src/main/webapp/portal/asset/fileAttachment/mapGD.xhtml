        function buildPolygon(pathArray,sub){

             var polygon = new AMap.Polygon( {
                            pathL:pathArray,
                            //线条颜色，使用16进制颜色代码赋值。默认值为#006600
                            strokeColor: 'rgb(255,255,0)',
                            strokeWeight: 2,
                            //轮廓线透明度，取值范围[0,1]，0表示完全透明，1表示不透明。默认为0.9
                            strokeOpacity:0.5,
                            //多边形填充颜色，使用16进制颜色代码赋值，如：#FFAA00
                            fillColor: sub?colors[subIndex++%colors.length]:'rgb(0,0,0)',
                            //多边形填充透明度，取值范围[0,1]，0表示完全透明，1表示不透明。默认为0.9
                            fillOpacity: sub?0.1:0.9,
                            //轮廓线样式，实线:solid，虚线:dashed
                            strokeStyle:'solid'
                        });
                        polygon.setPath(pathArray);
            return polygon;

            }

function showMovingObj(){
            let pos = lineArr[0];
            let car = new AMap.Marker({
                map: map,
                position: pos,
                icon: "https://a.amap.com/jsapi_demos/static/demo-center-v2/car.png",
                offset: new AMap.Pixel(-13, -26),
            });
            map.setFitView(car);

            // 绘制轨迹
            var polyline = new AMap.Polyline({
                map: map,
                path: lineArr,
                showDir: true,
                strokeColor: "#28F",  //线颜色
                // strokeOpacity: 1,     //线透明度
                strokeWeight: 6,      //线宽
                // strokeStyle: "solid"  //线样式
            });

            var passedPolyline = new AMap.Polyline({
                map: map,
                strokeColor: "#AF5",  //线颜色
                strokeWeight: 6,      //线宽
            });


            car.on('moving', function (e) {
                passedPolyline.setPath(e.passedPath);
                map.setCenter(e.target.getPosition(), true)
            });

            let dura=1000;
            let delay=80;
            let interv=(lineArr.length-1)*(dura+delay);

            car.moveAlong(lineArr, {
                    duration: dura,
                    autoRotation: true,
                    delay: delay
            });
            setTimeout(function(){
                map.setFitView(hospsMarker);
                map.remove(car);
            },interv);

};
