<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

		<style>
			table.checkboxGroup tr td:nth-child(2)  {
				text-align: left;
			}
		</style>

        <p:dialog id="assetAchievementsEditDlg" widgetVar="assetAchievementsEditDialog" width="1000" height="650" modal="true" resizable="true" draggable="true" appendTo="@this" header="设备绩效记录" closable="false">

            <h:form id="assetAchievementsEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.hospitalId}*</label>
                            <p:inputText id="selectedUserOrgName" value="#{assetAchievementsController.getOrgFullName(assetAchievementsController.selectSite)}" readonly="true" required="true" requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
                            <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;" disabled="#{assetAchievementsController.disabel}"/>
                            <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false" >
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;" value="#{assetAchievementsController.orgTree}" selection="#{assetAchievementsController.selectedNode}" var="node" selectionMode="single">
                                        <p:ajax process="@this" event="select" update=":assetAchievementsEditForm" listener="#{assetAchievementsController.onSelectOrgForUser}" oncomplete="PF('varPanelOrg4User').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
										<p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>

                        <h:panelGroup >
                            <label class ="label">#{msg.assetName} </label>
                            <p:inputText id="assetName" value="#{assetAchievementsController.selected.assetName}" required="false" requiredMessage="#{msg.assetName} #{msg.ValidationRequire}" disabled="#{assetAchievementsController.disabel}">
                                <p:ajax event="keyup" listener="#{assetAchievementsController.searchAsset}" update="assetList"/>
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.manufacture}</label>
                            <p:autoComplete id="manufacture" value="#{assetAchievementsController.selected.manufacture}" dropdown="true" scrollHeight="300"
                                            forceSelection="true" required="false" requiredMessage="" completeMethod="#{assetAchievementsController.getSupplier}" disabled="#{assetAchievementsController.disabel}"
                                            var="t" itemLabel="#{t}" itemValue="#{t}">
                                <p:ajax event="itemSelect" listener="#{assetAchievementsController.searchAsset}" update="assetList"/>
                            </p:autoComplete>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.functionType}</label>
                            <p:inputText id="functionType" value="#{assetAchievementsController.selected.functionType}" required="false" requiredMessage="#{msg.functionType} " disabled="#{assetAchievementsController.disabel}">
                                <p:ajax event="keyup" listener="#{assetAchievementsController.searchAsset}" update="assetList"/>
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.RecordDate}</label>
                            <p:inputText id="recordData" value="#{assetAchievementsController.selected.recordDate}"  />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.feedbackComment}</label>
                            <p:inputText id="remark" value="#{assetAchievementsController.selected.remark}" required="false" requiredMessage="#{msg.manufacture} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    
                   <p:panelGrid id="report" columns="4"  styleClass="ui-panelgrid-blank form-group" layout="grid" rendered="#{assetAchievementsController.selected != null}">
                       <h:panelGroup >
                           <label class ="label">#{msg.assetGroup}</label>
                           <p:selectOneMenu value="#{assetAchievementsController.selected.assetGroup}"  required="false" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}" disabled="#{assetAchievementsController.disabel}">
                               <p:ajax event="itemSelect" listener="#{assetAchievementsController.searchAsset}" update="report assetList" />
                               <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                               <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                           </p:selectOneMenu>
                       </h:panelGroup>
                       <h:panelGroup>
                           <label class ="label" >#{msg.templateType}</label>
		                   <p:selectOneMenu  value="#{assetAchievementsController.selected.achievementsReport}"  >
                               <p:ajax update="report" />
                               <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                               <f:selectItems value="#{assetAchievementsController.getTableDefinitionForES()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.baseId}"/>
	                       </p:selectOneMenu>
                                 <h:outputText id="achievementsReport"  value="#{assetAchievementsController.getJsonValueById(assetAchievementsController.selected.achievementsReport)}"  style="display:none" />
	                        &nbsp;&nbsp;
                           <p:commandButton  rendered="#{not empty assetAchievementsController.selected.achievementsReport}" immediate="true" value="#{msg.preview}" onclick="preparePreview(1,'assetAchievementsEditForm');" oncomplete="PF('assetAchievementsPreviewDlg').show();" update=":assetAchievementsPreviewForm"/>
                       </h:panelGroup>
                   </p:panelGrid>
                    <p:panelGrid columns="1" >
                        <h:panelGroup>
                            <label class="label">#{msg.RelatedEquipment}</label>
                            <p:dataTable id="assetList" value="#{assetAchievementsController.assetInfoList}" style="height: 300px;width: 100%" scrollHeight="250" scrollable="true" var="item" widgetVar="assetList" lazy="false" paginator="false"
                                         selectionMode="single" selection="#{assetAchievementsController.selectedAssetInfo}"
                                         rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.name}">
                                    <h:outputText value="#{item.name}" />
                                </p:column>
                                <p:column headerText="#{msg.functionType}">
                                    <h:outputText value="#{item.functionType}" />
                                </p:column>
                                <p:column  headerText="#{msg.departNum}">
                                    <h:outputText value="#{item.departNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.clinicalDeptName}">
                                    <h:outputText value="#{item.clinicalDeptName}"/>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:commandButton validateClient="true" actionListener="#{assetAchievementsController.applyChange()}" value="#{msg.Save}"
                    update="display,:assetAchievementsEditForm, :AssetAchievementsForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'assetAchievementsEditDialog');"/>
                    &nbsp;&nbsp;

                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{assetAchievementsController.cancelSave()}" icon="ui-icon-cancel" update=":assetAchievementsEditForm:assetList"
                    onclick="PF('assetAchievementsEditDialog').hide()" />
                    &nbsp;&nbsp;
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
