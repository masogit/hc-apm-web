<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <script type="text/javascript">
            function handleAssetGroupChange(selection) {
                var ct = document.getElementById('AssetAchievementsForm:datalist:assetGroupSeconday_input');
                if (ct) {
                    ct.value = '';
                }
                PF('varDataList').filter();
            }
        </script>

        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="设备绩效记录"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="AssetAchievementsForm">
                    <p:dataTable id="datalist" value="#{assetAchievementsController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{assetAchievementsController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

<!--                        <p:ajax event="rowSelect"  update="createButton editButton reportButton"/>-->
                        <p:ajax event="filter" listener="#{assetAchievementsController.onFilter}" />
                        <p:ajax event="page"  />
                        <p:column headerText="操 作" exportable="false" id="operatorColumn">
<!--                            <p:commandLink rendered="#{userContextService.hasRole('AssetHead')}" id="reportButton" title="#{msg.AssetAchievementsTemplate}" action="#{assetAchievementsController.getEditUrl(item.achievementsReport)}"    disabled="#{empty item.achievementsReport}">-->
<!--                                <p:graphicImage name="icons/find.png" style="width: 30px; height: 30px;"/>-->
<!--                            </p:commandLink>-->
                            <p:commandLink rendered="#{userContextService.hasRole('AssetHead')}" id="editButton" title="#{msg.Edit}" actionListener="#{assetAchievementsController.prepareEdit(item)}" oncomplete="PF('assetAchievementsEditDialog').show()" update=":assetAchievementsEditForm,:assetAchievementsEditForm:assetList">
                                <p:graphicImage name="icons/edit.png" style="width: 30px; height: 30px;"/>
                            </p:commandLink>
                            <p:commandLink rendered="#{userContextService.hasRole('AssetHead')}" id="deleteButton" title="#{msg.Delete}"  actionListener="#{assetAchievementsController.delete(item)}" update="datalist">
                                <p:graphicImage name="icons/delete.png" style="width: 30px; height: 30px;"/>
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                            </p:commandLink>
<!--                            <p:commandButton id="editButton"  title="#{msg.Edit}"  icon="ui-icon-pencil"  actionListener="#{assetAchievementsController.prepareEdit}" update="datalist" oncomplete="PF('assetAchievementsEditDialog').show()" disabled="#{empty assetAchievementsController.selected}"/>-->
<!--                            <p:commandButton id="reportButton"  title="#{msg.AssetAchievementsTemplate}" icon="fa fa-file-excel-o"  action="#{urlEncryptController.encodeUrlParam('/portal/reporter/createTable.xhtml?faces-redirect=true&amp;id='.concat(assetAchievementsController.selected.achievementsReport))}"   disabled="#{empty assetAchievementsController.selected.achievementsReport}"/>-->
                        </p:column>
                        <p:column headerText="#{msg.ConfigItemName}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}" sortBy="#{item.assetName}" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                        <p:column  headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.functionType}"/>
                        </p:column>
                        <p:column  headerText="#{msg.Manufacturer}" sortBy="#{item.manufacture}" filterBy="#{item.manufacture}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.manufacture}"/>
                        </p:column>
                        <p:column  headerText="#{msg.RecordDate}" sortBy="#{item.recordDate}" filterBy="#{item.recordDate}" filterMatchMode="LIKE" >
                            <h:outputText value="#{item.recordDate}"/>
                        </p:column>
                        <p:column  headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                            <h:outputText value="#{fieldMsg.fieldValue('assetGroup', item.assetGroup)}"/>
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="handleAssetGroupChange()"  autoWidth="false" style="max-width: 150px;" height="300" value="#{assetAchievementsController.assetGroup}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    <p:ajax listener="#{assetAchievementsController.assetGroupChangeListener}" update="@(.assetGroupChange)" />
                                </p:selectOneMenu>
                            </f:facet>
                        </p:column>
                        <p:column  headerText="#{msg.AssetAchievementsTemplate}" >
                            <p:commandLink rendered="#{userContextService.hasRole('AssetHead')}" id="reportButton" title="#{msg.AssetAchievementsTemplate}" action="#{assetAchievementsController.getEditUrl(item.uid)}"  disabled="#{empty item.achievementsReport}">
                                <p:graphicImage name="icons/find.png" style="width: 30px; height: 30px;"/>
                            </p:commandLink>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" title="#{msg.Create}"  icon="ui-icon-plus" class="btn btn-sm btn-gray"  actionListener="#{assetAchievementsController.prepareCreate}" update="assetAchievementsEditForm" oncomplete="PF('assetAchievementsEditDialog').show()"/>
                         </f:facet>
                    </p:dataTable>

<!--                    <p:remoteCommand name="rc" update=":AssetAchievementsForm:datalist datalist:createButton datalist:deleteButton " immediate="true"/>-->
                </h:form>
                <ui:include src="assetAchievementsEdit.xhtml"/>
                <p:dialog id="assetAchievementsPreviewDlg" widgetVar="assetAchievementsPreviewDlg" height="500" width="400" modal="true" resizable="false" draggable="true" appendTo="@(body)" header="#{msg.preview}">
                    <h:form id="assetAchievementsPreviewForm" >
                        <iframe src="/wx/form/preview/"  width="100%"  height="490"/>
                    </h:form>

                </p:dialog>
                <script>
                    function preparePreview(index,formName) {
                        var $jasonText;
                        if(index == '1'){
                            $jasonText = $("#"+formName+"\\:achievementsReport")[0];
                        }
                        if ('localStorage' in window) {
                            localStorage.setItem("hc-apm-form-preview", $jasonText.innerText || ''); // # for test/dev perpose
                            localStorage.setItem("hc-apm-token-expireAt", Date.now() + 8640000)
                        }

                    }

                </script>
            </div>
        </div>
    </ui:define>
</ui:composition>
