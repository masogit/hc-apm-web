<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
	<p:dialog id="captureDataMessagesEditDlg" widgetVar="captureDataMessagesEditDialog" modal="true" resizable="false" draggable="true" appendTo="@(body)"
		header="小屏消息编辑" styleClass="fullscreen-dialog">
		<h:form id="captureDataMessagesEditForm" rendered="#{captureDataMessagesController.selected != null}">
			<p:messages id="messages" autoUpdate="true" closable="false" showDetail="true" for="systemID"></p:messages>
			
			<div class="ui-g">
				<div class="ui-g-3">
					<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
						<h:panelGroup>
							<label class="label">配置级别</label>
							<p:selectOneRadio id="idDeviceType" value="#{captureDataMessagesController.selected.type}" required="true" requiredMessage="请选择配置级别"
								onclick="CaptureDataMessageJS.showHide(this);">
								<p:ajax update="@this"></p:ajax>
								<f:selectItem itemLabel="单个设备" itemValue="0"></f:selectItem>
								<f:selectItem itemLabel="设备类型" itemValue="1"></f:selectItem>
							</p:selectOneRadio>
							<span id="type0Span" style="#{captureDataMessagesController.selected.type==1?'display: none; ':' display: block;'}"> <label class="label">SystemID*</label>
								<p:inputText id="systemId" value="#{captureDataMessagesController.selected.systemId}" required="#{captureDataMessagesController.selected.type==0?true:false}" requiredMessage="请输入SystemID">
								</p:inputText>
								<p:commandButton id="searchSystemId" value="查找" actionListener="#{captureDataMessagesController.checkSystemId()}" update="idIbStatus,idGeDeviceType" process="@parent"/>
								<label class="label">是否GE IB</label> 
								<p:selectOneMenu id="idIbStatus" value="#{captureDataMessagesController.selected.ibStatus}">
									<f:selectItem itemLabel="否" itemValue="0" />
									<f:selectItem itemLabel="是" itemValue="1" />
								</p:selectOneMenu>
							</span>
							<label class="label">设备类型*</label>
							<p:selectOneMenu id="idGeDeviceType" value="#{captureDataMessagesController.selected.geDeviceType}" required="#{captureDataMessagesController.selected.type==1?true:false}" requiredMessage="请选择设备类型">
								<f:selectItem itemLabel="#{msg.selectOneMessage}" />
								<f:selectItems value="#{fieldMsg.getFieldValueList('geDeviceType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
							</p:selectOneMenu>
							<label class="label">备注</label>
							<p:inputText value="#{captureDataMessagesController.selected.comment}" />
							<!-- <label class="label">序号</label>
							<p:inputNumber minValue="1" maxValue="99" decimalPlaces="0" value="#{captureDataMessagesController.selected.index}"></p:inputNumber> -->
							<label class="label">生效日期</label>
							<p:calendar value="#{captureDataMessagesController.selected.startDate}" pattern="MM/dd/yyyy HH:mm:ss" showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
							<label class="label">截止日期</label>
							<p:calendar value="#{captureDataMessagesController.selected.endDate}" pattern="MM/dd/yyyy HH:mm:ss" showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
						</h:panelGroup>
						<h:panelGroup>
							<p:commandButton validateClient="false" value="#{msg.Save}" actionListener="#{captureDataMessagesController.save}"
								update="@parent, :captureDataMessagesListForm:datalist, :captureDataMessagesListForm:growl" icon="ui-icon-check"
								oncomplete="handleSubmit(args, 'captureDataMessagesEditDialog');" timeout="3000"/>
							<p:commandButton process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('captureDataMessagesEditDialog').hide()" />
						</h:panelGroup>
					</p:panelGrid>
				</div>
				<div class="ui-g-9">
					<h:panelGroup>
						<div class="ui-g">
							<button type="button" onclick="CaptureDataMessageJS.triggerUpload()" class="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only">上传图片</button>
							<p:fileUpload fileUploadListener="#{captureDataMessagesController.handleImageUpload}" mode="advanced" dragDropSupport="false" style="display:none"
								multiple="false" auto="true" update="@this:imageTextTempContent,@this:insertImageButton,@this:imageName" label="上传图片" />
							<!-- <p:fileUpload id="simpleUploadImage" label="选择图片" mode="simple" skinSimple="true" value="#{captureDataMessagesController.file}"/>
						<p:commandButton value="上传图片" ajax="true" actionListener="#{captureDataMessagesController.upload()}" partialSubmit="true" process="simpleUploadImage"/> -->
							<p:commandButton id="insertImageButton" value="插入图片" onclick="CaptureDataMessageJS.setImageTextTempContent()"
								disabled="#{empty captureDataMessagesController.tempImageContent}" />
							<h:outputText id="imageName" value="#{captureDataMessagesController.fileName}"></h:outputText>
						</div>
						<p:inputText id="imageTextTempContent" value="#{captureDataMessagesController.tempImageContent}" style="display:none;" />
						<label class="label">消息内容*</label>
						<span id="idContentEditorMessage" class="ui-messages-warn" style="display: none;"></span>
						<p:editor id="idContentEditor" value="#{captureDataMessagesController.selected.content}" required="true" requiredMessage="请输入消息内容">
						</p:editor>
					</h:panelGroup>
				</div>
			</div>
		</h:form>
	</p:dialog>
</ui:composition>

</html>
