<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>

	<p:dialog id="captureDataMessagesEditDlg" widgetVar="captureDataMessagesEditDialog" modal="true" resizable="false" draggable="true" appendTo="@(body)"
		header="小屏消息编辑" styleClass="fullscreen-dialog">
		<h:form id="captureDataMessagesEditForm" rendered="#{captureDataMessagesController.selected != null}">
			<p:messages id="messages" autoUpdate="true" closable="false" showDetail="true"></p:messages>
			<div class="ui-g">
				<div class="ui-g-3">
					<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
						<h:panelGroup>
							<label class="label">配置级别</label>
							<p:selectOneRadio id="idDeviceType" value="#{captureDataMessagesController.selected.type}" required="true" requiredMessage="请选择配置级别" onclick="showHide(this);">
								<f:selectItem itemLabel="单个设备" itemValue="0"></f:selectItem>
								<f:selectItem itemLabel="设备类型" itemValue="1"></f:selectItem>
							</p:selectOneRadio>
							<span id="type0Span" style="#{captureDataMessagesController.selected.type==1?'display: none; ':' display: block;'}"> <label class="label">SystemID</label>
								<p:inputText value="#{captureDataMessagesController.selected.systemId}">
									<p:ajax event="blur" update="@this:idIbStatus, @this:idGeDeviceType" listener="#{captureDataMessagesController.checkSystemId()}" process="@this,@parent:idDeviceType"/>
								</p:inputText> <label class="label">是否GE IB</label> <p:selectOneMenu id="idIbStatus" value="#{captureDataMessagesController.selected.ibStatus}">
									<f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" />
									<f:selectItem itemLabel="否" itemValue="0" />
									<f:selectItem itemLabel="是" itemValue="1" />
								</p:selectOneMenu>
							</span>
							<label class="label">设备类型</label>
							<p:selectOneMenu id="idGeDeviceType" value="#{captureDataMessagesController.selected.geDeviceType}">
								<f:selectItem itemLabel="#{msg.selectOneMessage}" />
								<f:selectItems value="#{fieldMsg.getFieldValueList('geDeviceType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
							</p:selectOneMenu>
							<label class="label">备注</label>
							<p:inputText value="#{captureDataMessagesController.selected.comment}" />
							<!-- <label class="label">序号</label>
							<p:inputNumber minValue="1" maxValue="99" decimalPlaces="0" value="#{captureDataMessagesController.selected.index}"></p:inputNumber> -->
							<label class="label">生效日期</label>
							<p:calendar value="#{captureDataMessagesController.selected.startDate}" pattern="MM/dd/yyyy HH:mm:ss" />
							<label class="label">截止日期</label>
							<p:calendar value="#{captureDataMessagesController.selected.endDate}" pattern="MM/dd/yyyy HH:mm:ss" />
						</h:panelGroup>
						<h:panelGroup>
							<p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{captureDataMessagesController.save}"
								update=":captureDataMessagesTab:captureDataMessagesEditDlg, :captureDataMessagesTab:captureDataMessagesListForm:datalist, :growl" icon="ui-icon-check"
								oncomplete="handleSubmit(args, 'captureDataMessagesEditDialog');" />
							<p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('captureDataMessagesEditDialog').hide()" />
						</h:panelGroup>
					</p:panelGrid>
				</div>
				<div class="ui-g-9">
					<h:panelGroup>
						<div class="ui-g">
							<button type="button" onclick="triggerUpload()" class="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only">上传图片</button>
							<p:fileUpload fileUploadListener="#{captureDataMessagesController.handleImageUpload}" mode="advanced" dragDropSupport="false" style="display:none"
								multiple="false" auto="true" update="@this:imageTextTempContent,@this:insertImageButton" label="上传图片" />
							<!-- <p:fileUpload id="simpleUploadImage" label="选择图片" mode="simple" skinSimple="true" value="#{captureDataMessagesController.file}"/>
						<p:commandButton value="上传图片" ajax="true" actionListener="#{captureDataMessagesController.upload()}" partialSubmit="true" process="simpleUploadImage"/> -->
							<p:commandButton id="insertImageButton" value="插入图片" onclick="setImageTextTempContent()" disabled="#{empty captureDataMessagesController.selected.tempImageContent}"/>
						</div>
						<p:inputText id="imageTextTempContent" value="#{captureDataMessagesController.selected.tempImageContent}" style="display:none;" />
						<label class="label">消息内容</label>
						<span id="idContentEditorMessage" class="ui-messages-warn" style="display: none;"></span>
						<p:editor id="idContentEditor" value="#{captureDataMessagesController.selected.content}" height="350" onchange="contentEditorChange()">
						</p:editor>
					</h:panelGroup>
				</div>
			</div>
		</h:form>
	</p:dialog>
	<script type="text/javascript">
		var beginImage = '&lt;img';
		var beginImageLength = beginImage.length;
		var endImage = '&lt;/img&gt;';
		var endImageLength = endImage.length;
		var brTag = '&lt;br&gt;';
		var contentEditor = null;
		var contentEditorMessage = null;
		var imageTextTempContent = null;
		var uploadElement = null;
		var contentEditorTextArea = null;
		var contentEditorChangeInit = true;
		function captureDataMessageParseImage(str) {
			var strArr = [];
			var start = 0;
			var end = 0;
			if (str) {
				while ((start = str.indexOf(beginImage)) > -1) {
					if (start != 0) {
						strArr.push(str.substr(0, start));
						str = str.substring(start, str.length);
						start = 0;
					}
					end = str.indexOf('"&gt;');
					if (end > -1) {
						//ignore image
						if (end + 1 != str.length) {
							str = str.substring(end + 2, str.length);
						} else {
							str = "";
						}
					}
				}
				if (str) {
					strArr.push(str);
				}
			}
			return strArr;
		}
		function showHide(a) {
			var type0Span = document.getElementById("type0Span");
			if (a.value) {
				if (a.value == 0) {
					type0Span.setAttribute("style", "display:block;");
				} else {
					type0Span.setAttribute("style", "display:none;");
				}
			}
		}

		function setCaptureDataMessageValue() {
			contentEditor = $("[id='captureDataMessagesTab:captureDataMessagesEditForm:idContentEditor'] iframe")
					.contents().find("html body");
			contentEditorMessage = $("#idContentEditorMessage");
			contentEditorTextArea = $("[id='captureDataMessagesTab:captureDataMessagesEditForm:idContentEditor_input']");
			imageTextTempContent = $("[id='captureDataMessagesTab:captureDataMessagesEditForm:imageTextTempContent']");
			uploadElement = $("[id^='captureDataMessagesTab:captureDataMessagesEditForm'] .ui-fileupload input");
		}
		function contentEditorChange() {
			var noError = true;
			var errorString = "请注意！";
			if (contentEditorChangeInit) {
				setCaptureDataMessageValue();
				contentEditorChangeInit = false;
			}
			var contentStr = contentEditor.html();
			if (contentStr) {
				var strArr = captureDataMessageParseImage(contentStr);
				var strCount = 0;
				for ( var obj in strArr) {
					strCount += strArr[obj].length;
				}
				if (strCount > 120) {
					errorString += "连续输入120个字符将被强制分页。";
					noError = false;
				}
				if (contentStr.indexOf(brTag) > -1) {
					errorString += "不允许输入回车符。";
					noError = false;
					contentStr = contentStr.replace(/&lt;br&gt;/g, "");
					contentEditor.html(contentStr);
				}
				if (noError) {
					contentEditorMessage.html("").css("display", "none");
				} else {
					contentEditorMessage.html(errorString).css("display", "block");
				}
			}
		}

		function setImageTextTempContent() {
			setCaptureDataMessageValue();
			contentEditor.html(contentEditor.html() + imageTextTempContent.val());
			contentEditorTextArea.val(contentEditorTextArea.val() + imageTextTempContent.val());
		}
		function triggerUpload() {
			setCaptureDataMessageValue();
			uploadElement.trigger("click");
		}
	</script>
</ui:composition>

</html>
