<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="WoExportTemplateEditDlg" widgetVar="WoExportTemplateEditDialog"
              onHide="#{toBeTerminatedTemplateController.onSelect()}" width="1000" height="450" modal="true"
              resizable="true" draggable="true" appendTo="@(body)"
              header="#{toBeTerminatedTemplateController.CRUDActionName} #{msg.AssetTerminationReportTemplate}配置">
        <h:form id="WoExportTemplateEditForm">
            <h:panelGroup id="display">
                <p:fieldset id="basic" legend="#{msg.AssetTerminationReportTemplate}配置">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <p:commandButton update=":growl" icon="ui-icon-file-download" value="下载当前生效模版"
                                             onclick="PrimeFaces.monitorDownload(start, stop);">
                                <p:fileDownload
                                        value="#{toBeTerminatedTemplateController.getActiveTemplate()}"/>
                            </p:commandButton>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <h:outputText value="#{toBeTerminatedTemplateController.file.fileName}"
                                          rendered="#{not empty toBeTerminatedTemplateController.file}"/>
                            <p:fileUpload fileUploadListener="#{toBeTerminatedTemplateController.uploadDataFile}"
                                          value="#{toBeTerminatedTemplateController.file}" mode="advanced"
                                          dragDropSupport="false" style="width:100%" process="@this"
                                          multiple="false" sizeLimit="10000000" update=":WoExportTemplateEditForm"
                                          auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}10M"
                                          allowTypes="/(\.|\/)(docx)$/" label="#{msg.Add}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="false"
                                 actionListener="#{toBeTerminatedTemplateController.applyChange()}" value="#{msg.Save}"
                                 update="display,:WoExportTemplateEditDlg, :WoExportTemplateListForm:datalist, :growl"
                                 icon="ui-icon-check" oncomplete="handleSubmit(args, 'WoExportTemplateEditDialog');"/>
                &nbsp;&nbsp;
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('WoExportTemplateEditDialog').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
