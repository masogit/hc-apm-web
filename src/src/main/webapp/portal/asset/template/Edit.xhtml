<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="TemplateEditDlg" widgetVar="TemplateEditDialog"
              onHide="#{toBeTerminatedTemplateController.onSelect()}" width="1000" height="450" modal="true"
              resizable="true" draggable="true" appendTo="@(body)"
              header="#{toBeTerminatedTemplateController.CRUDActionName} #{msg.AssetTerminationReportTemplate} #{msg.Configuration}">
        <h:form id="WoExportTemplateEditForm">
            <h:panelGroup id="display">
                <p:fieldset id="basic" legend="#{msg.AssetTerminationReportTemplate} #{msg.Configuration}">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <p:commandButton update=":growl" icon="ui-icon-file-download" value="#{msg.DownloadTheCurrentActiveTemplate}"
                                             onclick="PrimeFaces.monitorDownload(start, stop);">
                                <p:fileDownload
                                        value="#{toBeTerminatedTemplateController.getActiveTemplate()}"/>
                            </p:commandButton>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">模板类型</label>
                            <p:selectOneMenu id="templateType" value="#{toBeTerminatedTemplateController.selected.templateType}" requiredMessage="模板类型 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('importTemplateType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">是否单个文件导出(注: 一个文件件导出一台或者多台设备信息的选择是，一个文件导出一台设备信息的选择否，根据配置的模板选择，系统模板支持单个文件导出多个设备)</label>
                            <p:selectOneRadio value="#{toBeTerminatedTemplateController.selected.singleFileImport}"
                                              requiredMessage="是否单个文件导出多台设备信息 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.True2Yes}" itemValue="true"/>
                                <f:selectItem itemLabel="#{msg.False2No}" itemValue="false"/>
                            </p:selectOneRadio>
                        </h:panelGroup>

                        <h:panelGroup id="fileName">
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <h:outputText  value="#{toBeTerminatedTemplateController.file.fileName}"
                                          rendered="#{not empty toBeTerminatedTemplateController.file}"/>
                        </h:panelGroup>

                        </h:panelGroup>

                        <h:panelGroup>
                            <p:fileUpload fileUploadListener="#{toBeTerminatedTemplateController.uploadDataFile}"
                                          value="#{toBeTerminatedTemplateController.file}" mode="advanced"
                                          dragDropSupport="false" style="width:100%" process="@this"
                                          multiple="false" sizeLimit="10000000" update=":WoExportTemplateEditForm:fileName"
                                          auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}10M"
                                          allowTypes="/(\.|\/)(docx)$/" label="#{msg.Add}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="false"
                                 actionListener="#{toBeTerminatedTemplateController.applyChange()}" value="#{msg.Save}"
                                 update="display,:TemplateEditDlg, :TemplateListForm:datalist, :growl"
                                 icon="ui-icon-check" oncomplete="handleSubmit(args, 'TemplateEditDialog');"/>
                &nbsp;&nbsp;
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('TemplateEditDialog').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
