<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
	<p:dialog id="assetAdEditDlg" widgetVar="assetAdEditDialog" modal="true" resizable="false" draggable="true" appendTo="@(body)" header="设备广告编辑"
		style="margin:10px;padding:10px;width:100%;height:100%;top:10px;left:10px;" styleClass="fullscreen-dialog">
		<h:form id="assetAdEditForm" rendered="#{assetAdController.selected != null}">
			<div class="ui-g">
				<div class="ui-g-3">
					<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
						<h:panelGroup>
							<label class="label">SystemID</label>
							<p:inputText value="#{assetAdController.selected.systemId}" required="true" requiredMessage="SystemID不能为空" />
							<label class="label">项目名称</label>
							<p:inputText value="#{assetAdController.selected.comment}" />
							<label class="label">序号</label>
							<p:inputText value="#{assetAdController.selected.index}" />
							<label class="label">生效日期</label>
							<p:calendar id="startDate" value="#{assetAdController.selected.startDate}" showOn="button" />
							<label class="label">截止日期</label>
							<p:calendar id="endDate" value="#{assetAdController.selected.endDate}" showOn="button" />
						</h:panelGroup>
						<h:panelGroup>
							<p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{assetAdController.save}"
								update=":assetAdTab:assetAdEditDlg, :assetAdTab:assetAdListForm:datalist, :growl" icon="ui-icon-check"
								oncomplete="handleSubmit(args, 'assetAdEditDialog');" />
							<p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('assetAdEditDialog').hide()" />
						</h:panelGroup>
					</p:panelGrid>
				</div>
				<div class="ui-g-9">
					<h:panelGroup>
						<label class="label">广告内容</label>
						<p:textEditor value="#{assetAdController.selected.content}" height="400" />
					</h:panelGroup>
				</div>
			</div>
		</h:form>
	</p:dialog>

</ui:composition>
</html>
