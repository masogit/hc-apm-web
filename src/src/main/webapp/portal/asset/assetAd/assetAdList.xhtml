<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<ui:include src="assetAdEdit.xhtml" />
<h:form id="assetAdListForm">
	<p:dataTable id="datalist" value="#{assetAdController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single"
		selection="#{assetAdController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true" rowKey="#{item.id}"
		sortMode="single" sortOrder="descending" sortBy="#{item.id}"
		paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
		currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,40,60,90">

		<p:ajax event="rowSelect" update="editButton deleteButton" />
		<p:ajax event="filter" listener="#{assetAdController.onFilter}" />

		<p:column headerText="SystemID" filterBy="#{item.systemId}" filterMatchMode="EQ">
			<h:outputText value="#{item.systemId}" />
		</p:column>
		<p:column headerText="备注" filterBy="#{item.comment}" filterMatchMode="LIKE">
			<h:outputText value="#{item.comment}" />
		</p:column>
		<p:column headerText="生效时间" filterBy="#{item.startDate}">
			<h:outputText value="#{item.startDate}" />
		</p:column>
		<p:column headerText="截止时间" filterBy="#{item.endDate}">
			<h:outputText value="#{item.endDate}" />
		</p:column>
		<p:column headerText="预览广告">
			<p:commandButton update=":assetAdTab:displayAssetAdContent" oncomplete="PF('assetAdDlg').show()" icon="fa fa-search" actionListener="#{assetAdController.setContent(item.id)}"/>
		</p:column>

		<f:facet name="{Toolbar}">
			<p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{assetAdController.prepareCreate}"
				update=":assetAdTab:assetAdEditDlg" oncomplete="PF('assetAdEditDialog').show()" />
			<p:commandButton id="editButton" actionListener="#{assetAdController.prepareEdit}" icon="ui-icon-pencil" title="#{msg.Edit}"
				update=":assetAdTab:assetAdEditDlg" oncomplete="PF('assetAdEditDialog').show()" disabled="#{empty assetAdController.selected.id}" />
			<p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{assetAdController.delete}"
				update=":assetAdTab:assetAdListForm:datalist" disabled="#{empty assetAdController.selected.id}">
				<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert" />
			</p:commandButton>
		</f:facet>
	</p:dataTable>
</h:form>
<p:dialog header="Content" widgetVar="assetAdDlg" showEffect="fade" hideEffect="fade">
	<p:outputPanel id="displayAssetAdContent" >
		<h:outputText value="#{assetAdController.getContent()}" escape="false" />
	</p:outputPanel>
</p:dialog>

</html>
