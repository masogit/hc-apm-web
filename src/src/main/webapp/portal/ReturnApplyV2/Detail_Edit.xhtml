<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="IouApplyDetailEditDlg" widgetVar="IouApplyDetailEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{sharedAssetRequestV2Controller.CRUDActionName} 归还设备">
            <h:form id="IouApplyDetailEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >

                        <h:panelGroup>
                            <label class="label">调剂设备名称*</label>
                            <p:selectOneMenu id="swapTypeId" value="#{sharedAssetRequestV2Controller.selectedSart.sharedAssetTypeId}"  required="true" requiredMessage="调剂设备 #{msg.ValidationRequire}">
                                <p:ajax  update="broQty applyQty" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{sharedAssetTypeController.getSwapNameReturnList()}" var="item" itemLabel="#{item.swapName}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">设备在借数*</label>
                            <p:inputText id="broQty" value="#{sharedAssetTypeController.getSwapQty(sharedAssetRequestV2Controller.selectedSart.sharedAssetTypeId,sharedAssetRequestV2Controller.selected.clinicalDeptUid)}"   readonly="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">归还申请数*</label>
                            <!--<p:inputText value="#{sharedAssetRequestV2Controller.selectedSart.applyQty}" />-->
                            <p:inputNumber id="applyQty" value="#{sharedAssetRequestV2Controller.selectedSart.applyQty}"
                                           decimalPlaces="0" minValue="0" maxValue="#{sharedAssetTypeController.getSwapQty(sharedAssetRequestV2Controller.selectedSart.sharedAssetTypeId,sharedAssetRequestV2Controller.selected.clinicalDeptUid)}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>备注</label>
                            <p:inputTextarea id="remark" rows="1"  cols="100"  queryDelay="750" minQueryLength="4" value="#{sharedAssetRequestV2Controller.selectedSart.remark}" />
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{sharedAssetRequestV2Controller.saveSart}" value="#{msg.Save}" update=":IouEditForm:datalistDetail" icon="ui-icon-check" oncomplete="openSwapTypeViewWindow2(xhr, status, args)"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('IouApplyDetailEditDialog').hide()"/>
                    <script>

                        function openSwapTypeViewWindow2(xhr, status, args) {
                            var message = args.message;
                            if (message == "wrong") {

                            } else {
                                PF('IouApplyDetailEditDialog').hide();
                            }
                        }

                    </script>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
    
     
</html>
