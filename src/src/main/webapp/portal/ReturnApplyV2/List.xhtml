<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
     <ui:define name="head">
        <h:outputScript name="js/main.js"/>
        
        <style type="text/css">      
        .ui-chkbox .ui-chkbox-box .ui-icon-check {
            color: gray!important;
        }
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">
                <div class="ui-g-12 card cardTitle">
                    <p:outputLabel class="pageTitle" value="归还申请"/>
                </div>
                 <div class="ui-g-12 card">
            <h:form id="IouListForm">
                
                <p:dataTable id="datalist" value="#{sharedAssetRequestV2Controller.lazyModel}" var="item" widgetVar="varDataList"
                    selectionMode="single" selection="#{sharedAssetRequestV2Controller.selected}"
                    lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                    rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.applyTime}"
                    paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                    currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                    rows="20" emptyMessage="#{msg.noRecordFound}" 
                    rowsPerPageTemplate="20,50,100,500">

<!--                    <p:ajax event="rowSelect" listener="#{sharedAssetReqTypeController.onChanged}"  update="createButton "/>
                    <p:ajax event="rowSelect" listener="#{sharedAssetReqDetailController.onChanged}"  update="createButton "/>
                    -->
                    <p:ajax event="rowSelect" update="createButton  " 
                            listener="#{sharedAssetRequestV2Controller.onSelectD}" 
                            oncomplete="openSwapTypeViewWindow(xhr, status, args)" />
                    <p:ajax event="filter" listener="#{sharedAssetRequestV2Controller.onFilter}" update="createButton "/>
                    
                    <p:column headerText="科室名称" sortBy="#{item.clinicalDeptUid}" filterBy="#{item.clinicalDeptUid}" filterMatchMode="EQ">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList').filter()" autoWidth="false" style="max-width: 150px;" height="200">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{assetInfoService.getAllAccessibleOrgDeptListNestedByOrgLevel()}" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{item.clinicalDeptName}"/>
                    </p:column>
                    <p:column headerText="申请人" sortBy="#{item.applicantName}" filterBy="#{item.applicantName}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.applicantName}"/>
                    </p:column>
                    <p:column headerText="虚拟网电话" sortBy="#{item.applicantPhone}" filterBy="#{item.applicantPhone}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.applicantPhone}"/>
                    </p:column>
                    <p:column headerText="归还状态" sortBy="#{item.state}" filterBy="#{item.state}" filterMatchMode="EQ">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetReturnStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                        
<!--                        <h:outputText value="归还待受理" rendered="#{item.state eq '8'}"></h:outputText> 
                        <h:outputText value="归还待交付" rendered="#{item.state eq '9'}"></h:outputText> 
                        <h:outputText value="归还待确认" rendered="#{item.state eq '10'}"></h:outputText>
                        <h:outputText value="归还已取消" rendered="#{item.state eq '11'}"></h:outputText> 
                        <h:outputText value="归还已完成" rendered="#{item.state eq '12'}"></h:outputText> -->
                        <h:outputText value="#{fieldMsg.fieldValue('assetReturnStatus',item.state)}"/>
                    </p:column>
                    <p:column headerText="申请日期" sortBy="#{item.applyTime}" filterBy="#{item.applyTime}" filterMatchMode="LIKE">
                         <f:facet name="filter">
                           <p:inputText id="filterApplyTime" widgetVar="varFilterApplyTime" value="#{sharedAssetRequestV2Controller.applyTimeFormatTime}"/>
                        </f:facet>
                        <h:outputText value="#{item.applyTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <!--<p:column headerText="申请失效日期" sortBy="#{item.invalidTime}"  filterMatchMode="LIKE">-->
                        <!--<h:outputText value="#{item.invalidTime}">-->
                            <!--<f:convertDateTime pattern="yyyy/MM/dd HH:mm" />-->
                        <!--</h:outputText>-->
                    <!--</p:column>-->
                    <p:column headerText="备注" sortBy="#{item.remark}" filterBy="#{item.remark}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.remark}"/>
                    </p:column>

                    <f:facet name="{Toolbar}">
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist" fileName="Iou_export"/>
                        </p:commandButton>
                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" action="#{sharedAssetRequestV2Controller.workOrderRouter()}" oncomplete="router(xhr, status, args)" />
                        
                        <!--<p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" actionListener="#{sharedAssetRequestV2Controller.getViewPageA('Edit')}" action="#{urlEncryptController.encodeUrlParam(sharedAssetRequestV2Controller.operation)}"  disabled="#{empty sharedAssetRequestV2Controller.selected}"/>-->
                    </f:facet>
                </p:dataTable>
                <p:overlayPanel widgetVar="panelFilterApplyTime" for=":IouListForm:datalist:filterApplyTime" dismissable="false">
                    <h:panelGrid columns="2">
                        <p:outputLabel for="cal1" />
                        <p:calendar id="cal1" widgetVar="varApplyTimeFrom" effect="fold" value="#{sharedAssetRequestV2Controller.applyTimeFrom}"
                                    pattern="yyyy/MM/dd" showOn="button" showButtonPanel="true" navigator="true" placeholder="开始时间"/>
                        <p:outputLabel for="cal2"/>
                        <p:calendar id="cal2" widgetVar="varApplyTimeTo" effect="fold" 
                                    pattern="yyyy/MM/dd" showOn="button" showButtonPanel="true" navigator="true" placeholder="结束时间"/>
                    </h:panelGrid>
                    <p:commandButton onclick="PF('panelFilterApplyTime').hide();setDateFilter('varDataList', 'varFilterApplyTime', 'varApplyTimeFrom', 'varApplyTimeTo'); " title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFilterApplyTime').hide()" title="#{msg.Close}" icon="ui-icon-close" style="zoom: 0.8;"/>
                </p:overlayPanel>
            </h:form>
             <p:dialog id="UserAccountEditDlg" widgetVar="UserAccountEditDialog" modal="true" resizable="true" draggable="true"  appendTo="@(body)" header="提示信息" >
                 <p:outputPanel>如需归还设备请拨打虚拟网 #{sharedAssetRequestV2Controller.getOnCallNumber()}</p:outputPanel>
             </p:dialog>
            </div>
            </div>
        </div>
        
        
        <script>
            afterPageLoad = function () {
                $("#searchForm\\:searchText").keypress(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                    }
                });
            }


            function openSwapTypeViewWindow(xhr, status, args) {
                this.location.href = args.url;
            }

            function router(xhr, status, args) {
            	var d = PF('UserAccountEditDialog');
            	if(args['showNotification']) {
            		d.show();
            	}
            }

        </script>
    </ui:define>

</ui:composition>
    </html>
