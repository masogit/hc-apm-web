<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

   <p:dialog id="qrPreviewedDlg" width="1000" height="800"  widgetVar="qrPreviewedDlg" modal="true" howEffect="fade"  maximizable="true" appendTo="@this">
       <p:panelGrid   columns="1" layout="grid" styleClass="showcase-text-align-center" rendered="#{qRPreViewerBean.itemList.size() > 0}">
           <p:commandButton value="打印" icon="ui-icon-print" style="position: relative;left: 90%">
                   <p:printer target="qrcodePanel" />
           </p:commandButton>
           <p:panelGrid id="qrcodePanel"  columns="2" layout="grid"  rendered="#{qRPreViewerBean.itemList.size() > 0}">
               <p:outputLabel>总数：#{qRPreViewerBean.itemList.size()}</p:outputLabel>
               <p:outputLabel></p:outputLabel>
                   <c:forEach var="item" items="#{qRPreViewerBean.itemList}">
                       <p:outputPanel id="pnlPrint">
                        <p:graphicImage value="#{qRPreViewerBean.getImg(item)}" stream="false"/>
                       </p:outputPanel>
                   </c:forEach>
           </p:panelGrid>
       </p:panelGrid>
   </p:dialog>
 </ui:composition>
</html>
