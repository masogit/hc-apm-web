<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
        xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="previewedDlg" width="1000" height="800" widgetVar="previewedDlg" modal="true" howEffect="fade"
              maximizable="#{preViewerBean.type ne 0}" appendTo="@this">
        <c:choose>
            <c:when test="#{preViewerBean.type eq 0}">
                <div class="row" id="imgDiv" style="width: auto">
                    <img data-original="#{fileDownloadService.getImgBase64ByObject(preViewerBean.getObjectId(), preViewerBean.blobObject)}"
                         src="#{fileDownloadService.getImgBase64ByObject(preViewerBean.getObjectId(), preViewerBean.blobObject)}"
                         style="opacity:0; width:1px; height:1px"/>
                </div>
                <script>
                    new Viewer(document.getElementById('imgDiv'), {inline: true});
                </script>
            </c:when>
            <c:when test="#{preViewerBean.type eq 1}">
                <embed src="#{preViewerBean.pdfUrl}" type="application/pdf" width="100%" height="780px"/>
            </c:when>
            <c:when test="#{preViewerBean.type eq 2}">
                <div class="row" id="imgDivStream" style="width: auto">
                    <img data-original="#{preViewerBean.preViewerImg()}"
                         src="#{preViewerBean.preViewerImg()}"
                         style="opacity:0; width:1px; height:1px"/>
                </div>
                <script>
                    new Viewer(document.getElementById('imgDivStream'), {inline: true});
                </script>
            </c:when>
            <c:otherwise>
                <h:outputText value="预览失败！"/>
            </c:otherwise>
        </c:choose>
    </p:dialog>
    <script type="text/javascript" src="#{request.contextPath}/portal/js/viewer.min.js"></script>
    <link rel="stylesheet" href="#{request.contextPath}/portal/css/viewer.min.css"/>
</ui:composition>
</html>
