<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
				xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="未关机设备列表" />
			</div>
			<div class="ui-g-12 card ">
				<h:form id="optRecordListForm">
					<ui:include src="/portal/asset/searchDiv.xhtml"/>
					<p:dataTable id="datalist" value="#{assetOptUnClosedRecordController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single"
								 selection="#{assetOptUnClosedRecordController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true" rowKey="#{item.id}"
								 sortMode="single" sortOrder="descending" sortBy="#{item.startDate}"
								 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
								 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500" >

						<p:ajax event="filter" listener="#{assetOptUnClosedRecordController.onFilter}" />

						<p:column headerText="设备名称" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE">
							<h:outputText value="#{item.assetInfo.name}" />
						</p:column>
						<p:column headerText="设备编号" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
							<h:outputText value="#{item.assetInfo.departNum}" />
						</p:column>
						<p:column headerText="设备型号" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE">
							<h:outputText value="#{item.assetInfo.functionType}" />
						</p:column>
						<p:column headerText="制造商序列号" filterBy="#{item.assetInfo.serialNum}" filterMatchMode="LIKE">
							<h:outputText value="#{item.assetInfo.serialNum}" />
						</p:column>
						<!--<p:column headerText="设备分类" filterBy="#{item.assetInfo.assetGroup}" filterMatchMode="EQ">
							<f:facet name="filter">
								<p:selectOneMenu onchange="PF('varDataList').filter()">
									<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
									<f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
								</p:selectOneMenu>
							</f:facet>
							<h:outputText value="#{fieldMsg.fieldValue('assetGroup', item.assetInfo.assetGroup)}" />
						</p:column>
						<p:column headerText="所属院区" visible="false" exportable="true">
							<h:outputText value="#{item.assetInfoSiteName}" />
						</p:column>-->
						<p:column headerText="所属科室" filterBy="#{item.clinicalDeptName}" filterMatchMode="LIKE">
							<h:outputText value="#{item.assetInfo.clinicalDeptName}" />
						</p:column>
						<p:column headerText="使用科室" filterBy="#{item.assetInfo.assetDeptUID}" filterMatchMode="EQ" rendered="#{userContextService.enableDisplayByKey('assetOptUnClosedRecordDeptFilter')}">
							<f:facet name="filter">
								<p:selectOneMenu value="#{assetOptUnClosedRecordController.filterAssetDeptOrg}" filter="true" filterMatchMode="contains" filterNormalize="true" converter="orgInfoUidConverter">
									<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
									<f:selectItems value="#{assetOptUnClosedRecordController.clinicalDeptList}" var="item" itemLabel="#{item.name}" itemValue="#{item}"/>
									<p:ajax listener="#{assetOptUnClosedRecordController.onAssetDeptNameFilterChange}" process="@this" update=":optRecordListForm:datalist"/>
								</p:selectOneMenu>
							</f:facet>
							<h:outputText value="#{assetOptUnClosedRecordController.getOrgInfoByUid(item.assetInfo.assetDeptUID).name}" />
						</p:column>
						<!--<p:column headerText="开机人" filterBy="#{item.createBy.name}" filterMatchMode="LIKE">
							<h:outputText value="#{item.createBy.name}" />
						</p:column>
						<p:column headerText="关机人" filterBy="#{item.modifyBy.name}" filterMatchMode="LIKE">
							<h:outputText value="#{empty item.endDate?'':item.modifyBy.name}" />
						</p:column>-->
						<p:column headerText="开机时间" sortBy="#{item.startDate}" filterBy="#{item.startDate}" filterMatchMode="GTE">
							<f:facet name="filter">
								<p:inputText id="filterstartDate" widgetVar="varFilterstartDate" />
							</f:facet>
							<h:outputText value="#{item.startDate}">
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
							</h:outputText>
						</p:column>
						<!--<p:column headerText="关机时间" sortBy="#{item.endDate}" filterBy="#{item.endDate}" filterMatchMode="GTE">
							<f:facet name="filter">
								<p:inputText id="filterendDate" widgetVar="varFilterendDate" />
							</f:facet>
							<h:outputText value="#{item.endDate}">
								<f:convertDateTime timeZone="GMT+8" pattern="MM/dd/yyyy HH:mm:ss" />
							</h:outputText>
						</p:column>
						<p:column headerText="使用时长">
							<h:outputText value="#{item.costTime}">
							</h:outputText>
						</p:column>
						<p:column headerText="住院号" filterBy="#{item.hospitalNumber}" filterMatchMode="LIKE">
							<h:outputText value="#{item.hospitalNumber}">
							</h:outputText>
						</p:column>
						<p:column headerText="床号" filterBy="#{item.bedNo}" filterMatchMode="LIKE">
							<h:outputText value="#{item.bedNo}">
							</h:outputText>
						</p:column>
						<p:column headerText="诊断结果" filterBy="#{item.diagnosticResult}" filterMatchMode="LIKE">
							<h:outputText value="#{item.diagnosticResult}">
							</h:outputText>
						</p:column>-->
						<p:column headerText="备注">
							<h:outputText value="#{item.comment}">
							</h:outputText>
						</p:column>
						<f:facet name="{Toolbar}">
							<p:commandButton ajax="false" icon="ui-icon-arrowthick-1-s" update=":growl" title="导出到Excel" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_OPERATE_RECORD_EDIT')}">
								<p:dataExporter type="xlsx" target="datalist" fileName="assetOptRecord"/>
							</p:commandButton>
						</f:facet>
					</p:dataTable>
				</h:form>
			</div>
		</div>
		<p:overlayPanel widgetVar="panelFilterstartDate" for="optRecordListForm:datalist:filterstartDate" dismissable="false">
			<h:panelGrid columns="2">
				<p:outputLabel value="#{msg.From}" />
				<p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_startDate" pattern="MM/dd/yyyy" showOn="button" showButtonPanel="false" navigator="true"
							mask="true" size="12" locale="zh" />
				<p:outputLabel value="#{msg.To}" />
				<p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_startDate" pattern="MM/dd/yyyy" showOn="button" showButtonPanel="false" navigator="true" mask="true"
							size="12" locale="zh" />
			</h:panelGrid>
			<p:commandButton
					onclick="setDateFilter('varDataList','varFilterstartDate','varStartTimeFrom_startDate','varStartTimeTo_startDate'); PF('panelFilterstartDate').hide();"
					title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
			<p:commandButton onclick="PF('panelFilterstartDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;" />
		</p:overlayPanel>
		<!--<p:overlayPanel widgetVar="panelFilterendDate" for="optRecordListForm:datalist:filterendDate" dismissable="false">
			<h:panelGrid columns="2">
				<p:outputLabel value="#{msg.From}" />
				<p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_endDate" pattern="MM/dd/yyyy" showOn="button" showButtonPanel="false" navigator="true" mask="true"
							size="12" locale="zh" />
				<p:outputLabel value="#{msg.To}" />
				<p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_endDate" pattern="MM/dd/yyyy" showOn="button" showButtonPanel="false" navigator="true" mask="true"
							size="12" locale="zh" />
			</h:panelGrid>
			<p:commandButton
					onclick="setDateFilter('varDataList','varFilterendDate','varStartTimeFrom_endDate','varStartTimeTo_endDate'); PF('panelFilterendDate').hide();"
					title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
			<p:commandButton onclick="PF('panelFilterendDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;" />
		</p:overlayPanel>-->
	</ui:define>
</ui:composition>
