<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
	<p:dialog id="maintainBatchDeleteDlg" widgetVar="maintainBatchDeleteDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="批量删除日常检查工单">
		<h:form id="maintainBatchDeleteForm">
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">开始时间*</label>
					<p:calendar timeZone="GMT+8" pattern="yyyy-MM-dd" value="#{maintainController.startBatchDate}" required="true"
						requiredMessage="开始时间 #{msg.ValidationRequire}" showOn="button" disabled="false" showButtonPanel="true" navigator="true" mask="true" />
				</h:panelGroup>
				<h:panelGroup>
					<label class="label">结束时间*</label>
					<p:calendar timeZone="GMT+8" pattern="yyyy-MM-dd" value="#{maintainController.endBatchDate}" required="true"
						requiredMessage="结束时间 #{msg.ValidationRequire}" showOn="button" disabled="false" showButtonPanel="true" navigator="true" mask="true" />
				</h:panelGroup>
			</p:panelGrid>
			<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
				<h:panelGroup>
					<label class="label">请选择配置</label>
					<p:selectManyMenu id="nurseSiteMaintainConfigId" value="#{maintainController.listCheckedNurseSiteMaintainConfig}" var="t"
						converter="nurseSiteMaintainConfigConverter" required="true" requiredMessage="配置 #{msg.ValidationRequire}" filter="true" filterMatchMode="contains" showCheckbox="true" style="width:100%">
						<f:selectItems value="#{maintainController.showListNurseSiteMaintainConfig}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
						<p:column style="float: left;text-align:left;">
							<h:outputText value="#{t.name}" />
						</p:column>
					</p:selectManyMenu>
				</h:panelGroup>
			</p:panelGrid>

			<br />
			<br />
			<p:commandButton validateClient="true" value="删除" action="#{maintainController.batchDeleteMaintainData}" update=":messages" icon="ui-icon-check"
				oncomplete="PF('maintainBatchDeleteDialog').hide()" timeout="180000" />
			<p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('maintainBatchDeleteDialog').hide()" />
		</h:form>
	</p:dialog>
</ui:composition>
</html>
