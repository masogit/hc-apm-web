<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
	<ui:define name="head">
		<h:outputStylesheet name="css/inspection.css" />
	</ui:define>
	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="临床助手日常检查" />
			</div>
			<div class="ui-g-12 card">
				<p:growl widgetVar="messages" id="messages" showDetail="true" />
				<h:form id="maintainHeaderForm" rendered="#{not empty maintainController}">
					<p:commandButton id="batchCompleteButton" value="批量完成" title="批量完成" update=":maintainBatchCompleteDlg"
						oncomplete="PF('maintainBatchCompleteDialog').show()" rendered="#{maintainController.authModify()}"/>
					<p:commandButton id="batchCreateButton" value="批量创建" title="批量创建" update=":maintainBatchDlg" oncomplete="PF('maintainBatchDialog').show()" rendered="#{maintainController.authCreate()}"/>
					<br />
					<ui:include src="/portal/asset/searchDiv.xhtml"></ui:include>
				</h:form>
				<h:form id="maintainForm">
					<h:panelGrid columnClasses="value">
						<h3>-</h3>
						<p:schedule id="maintain" value="#{maintainController.lazyEventModel}" widgetVar="maintain" timeZone="GMT+8" centerHeaderTemplate="title"
							rightHeaderTemplate="" tooltip="true" rendered="#{maintainController.authSearch()}">
							<p:ajax event="dateSelect" listener="#{maintainController.onDateSelect}" update="createMaintainDlg" oncomplete="PF('createMaintainDlg').show();" disabled="#{!maintainController.authCreate()}"/>
							<p:ajax event="eventSelect" listener="#{maintainController.onEventSelect}" update="maintainDlg" oncomplete="PF('maintainDialog').show();"/>
						</p:schedule>
					</h:panelGrid>
				</h:form>
				

				<p:dialog id="createMaintainDlg" widgetVar="createMaintainDlg" header="创建检查">
					<h:form id="createMaintainForm">
						<h:panelGrid columns="1" styleClass="ui-panelgrid-blank form-group">
							<h:panelGroup style="float:left">
								<label>请选择配置: </label>
								<p:selectOneMenu id="currentMaintainConfig" value="#{maintainController.nurseSiteMaintainConfig}" var="t" converter="nurseSiteMaintainConfigConverter"
									required="true" requiredMessage="配置 #{msg.ValidationRequire}">
									<p:ajax event="change" listener="#{maintainController.onNurseSiteMaintainConfigChange}" update=":createMaintainForm"></p:ajax>
									<f:selectItem itemLabel="#{msg.selectOneMessage}" />
									<f:selectItems value="#{maintainController.showListNurseSiteMaintainConfig}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
									<p:column>
										<h:outputText value="#{t!=null?t.name:'请选择...'}" />
									</p:column>
								</p:selectOneMenu>
							</h:panelGroup>
							<h:panelGroup id="currentSequence" style="float:left" rendered="#{maintainController.nurseSiteMaintainConfig.type==1}">
								<label>请选择班次: </label>
								<p:selectOneMenu value="#{maintainController.selectSequence}" required="true" requiredMessage="班次 #{msg.ValidationRequire}">
									<f:selectItems value="#{maintainController.listSequence}" var="item" itemLabel="#{item}" itemValue="#{item}" />
								</p:selectOneMenu>
							</h:panelGroup>
						</h:panelGrid>
						<br />
						<br />
						<p:commandButton id="addButton" validateClient="true" value="创建" actionListener="#{maintainController.createMaintain()}" update=":messages"
							oncomplete="PF('maintain').update();PF('createMaintainDlg').hide();" />
						<p:commandButton immediate="true" value="#{msg.Cancel}" update=":messages" icon="ui-icon-cancel" onclick="PF('createMaintainDlg').hide()" />
					</h:form>
				</p:dialog>
				<p:dialog id="signatureDlg" widgetVar="signatureDlg" header="签名">
					<h:form id="signatureForm">
						<h:panelGrid columnClasses="value" columns="1">
							<h:panelGroup rendered="#{maintainController.signatureContentWeiXin==null}">
								<p:signature id="signatureContent" style="width:400px;height:200px" widgetVar="sig" base64Value="#{maintainController.signatureContent}"
									required="false" requiredMessage="签名 #{msg.ValidationRequire}" guideline="false" rendered="#{maintainController.signatureContentStream==null}" />
								<p:graphicImage value="#{maintainController.signatureContentStream}" stream="false" rendered="#{maintainController.signatureContentStream!=null}"></p:graphicImage>
							</h:panelGroup>
							<h:panelGroup rendered="#{maintainController.signatureContentWeiXin!=null}">
								<p:graphicImage value="#{maintainController.signatureContentWeiXin}" stream="false" />
							</h:panelGroup>
						</h:panelGrid>
						<p:commandButton value="确认" actionListener="#{maintainController.saveMaintainSignature()}" oncomplete="PF('signatureDlg').hide();"
							rendered="#{maintainController.blnWebSignatureEidt and maintainController.authModify()}"/>
						<p:commandButton value="重写" actionListener="#{maintainController.resetMaintainSignature()}" update=":signatureForm:signatureContent"
							oncomplete="PF('sig').clear()" rendered="#{maintainController.blnWebSignatureEidt}" />
						<p:commandButton value="关闭" oncomplete="PF('signatureDlg').hide();" />
					</h:form>
				</p:dialog>
				
				<ui:include src="maintainBatchCreate.xhtml" />
				<ui:include src="maintainData.xhtml" />
				<ui:include src="maintainBatchComplete.xhtml" />
			</div>
		</div>
	</ui:define>

</ui:composition>
