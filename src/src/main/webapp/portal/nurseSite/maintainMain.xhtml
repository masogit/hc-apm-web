<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
    	<h:outputScript name="js/nurseSiteMaintain.js"></h:outputScript>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="护士站设备保养"/>
            </div>
            <div class="ui-g-12 card">
                <h:form>
                	<p:commandButton id="batchCompleteButton" icon="ui-icon-extlink" value="批量完成保养报告" title="批量完成保养报告" update=":maintainBatchCompleteDlg" oncomplete="PF('maintainBatchCompleteDialog').show()" actionListener="#{maintainController.batchCompleteInit}"/>
                    <p:commandButton id="batchCreateButton" icon="ui-icon-extlink" value="批量创建保养报告" title="批量创建保养记录" update=":maintainBatchDlg" oncomplete="PF('maintainBatchDialog').show()" rendered="#{maintainController.deptHead}"/>
                    <p:commandButton id="maintainConfigButton" icon="ui-icon-extlink" value="保养报告设置" title="保养报告设置" update=":maintainConfigDlg" oncomplete="PF('maintainConfigDialog').show()" onclick="NurseSiteMaintain.on()" rendered="#{maintainController.deptHead}"/>
                </h:form>
                <h:form id="maintainForm">
                    <p:growl widgetVar="messages" id="messages" showDetail="true" />

                    <h:panelGrid columnClasses="value">
                        <h3>保养报告</h3>
                        <p:schedule id="maintain" value="#{maintainController.lazyEventModel}" widgetVar="maintain" timeZone="GMT+8" centerHeaderTemplate="title" rightHeaderTemplate="" tooltip="true">
                            <p:ajax event="dateSelect" listener="#{maintainController.onDateSelect}" update="maintainDialog" oncomplete="PF('maintainDialog').show();" />
                            <p:ajax event="eventSelect" listener="#{maintainController.onEventSelect}" update="maintainDialog" oncomplete="PF('maintainDialog').show();" />
                        </p:schedule>
                    </h:panelGrid>

                    <p:dialog id="maintainDialog" widgetVar="maintainDialog" header="报告详情" showEffect="clip" hideEffect="clip">
                    	<table>
                    		<c:forEach items="#{maintainController.listCheckItems}" var="item">
                    			<tr>
                    				<td>
                    					<label class="label">#{item.key}</label>
                    				</td>
                    				<c:forEach items="#{item.listSimplePairValue}" var="item2">
                    					<td>
	                    					<label class="label">#{item2.key}</label>
			                           	 <p:selectBooleanCheckbox value="#{item2.blnValue}" />
	                    				</td>
									</c:forEach>
	                    		</tr>
							</c:forEach>
                    	</table>
                    	<h:panelGrid columnClasses="value" columns="1">
                    		<h:panelGroup>
                    			<label>负责人: </label>
                    			<h:outputText value="#{maintainController.nurseSiteMaintain.modifyBy.name}"></h:outputText>
                    		</h:panelGroup>
                    		<h:panelGroup>
                    			<label>检测时间: </label>
                    			<h:outputText value="#{maintainController.nurseSiteMaintain.checkDate}">
                    				<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm"/>
                    			</h:outputText>
                    		</h:panelGroup>
	                    </h:panelGrid>
                        <p:commandButton id="addButton" value="保存" validateClient="true" actionListener="#{maintainController.saveMaintainData}" update="messages" disabled="#{maintainController.saveDisable}" oncomplete="PF('maintain').update();PF('maintainDialog').hide();" />
                        <p:commandButton id="deleteButton" value="删除" actionListener="#{maintainController.deleteMaintainData}" disabled="#{maintainController.deleteDisable}" oncomplete="PF('maintain').update();PF('maintainDialog').hide();" >
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                        </p:commandButton>
                    </p:dialog>
                </h:form>
                <ui:include src="maintainBatchCreate.xhtml"/>
                <ui:include src="maintainBatchComplete.xhtml"/>
                <ui:include src="maintainConfig.xhtml"/>
            </div>
        </div>
    </ui:define>

</ui:composition>
