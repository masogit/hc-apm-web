<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
	<ui:define name="head">
		<h:outputStylesheet name="css/inspection.css" />
		<style>
			.schedule-item-nopass-partialpass {
				color: white !important;
				background-color: #7022f6 !important;
			}
		</style>
	</ui:define>
	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="临床助手日常检查" />
			</div>
			<div class="ui-g-12 card">
				<div class="ui-g-12 card">
				<div style="width: 1000px;height: 225px;float: left">
					<p:growl widgetVar="messages" id="messages" showDetail="true" />
					<h:form id="maintainHeaderForm" rendered="#{not empty maintainController}">
						<p:commandButton id="batchCompleteButton" value="批量完成" title="批量完成" update=":maintainBatchCompleteDlg" actionListener="#{maintainController.resetBatchSignatures()}"
										 oncomplete="PF('maintainBatchCompleteDialog').show()" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_CHECK')}"/>
						<p:commandButton id="batchCreateButton" actionListener="#{maintainController.onCheckDefault}" value="批量创建" title="批量创建" update=":maintainBatchDlg" oncomplete="PF('maintainBatchDialog').show()" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_CREATE')}"/>
						<p:commandButton id="batchDeleteButton" actionListener="#{maintainController.onCheckDefault}" value="批量删除" title="批量删除" update=":maintainBatchDeleteDlg" oncomplete="PF('maintainBatchDeleteDialog').show()" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_DELETE')}"/>
						<br /><br /><br /><br />
						<ui:include src="/portal/asset/searchDivMaintainMain.xhtml"></ui:include>
					</h:form>

				</div>
				<div style="float: right; position: absolute;right: 30px">
					<table style="float:right;width:210px;height:150px;font-family: Century" >  <!--	status-->
						<tr style="background-color: #777D81"><td style="color: whitesmoke ;float: left">　　未检查</td></tr>  <!-- 0 -->
						<tr style="background-color: #0000FF"><td style="color: whitesmoke ;float: left">　　进行中</td></tr>  <!-- 4 -->
						<tr style="background-color: #008000"><td style="color: whitesmoke ;float: left">　　通　过，未延期，无备注</td></tr>  <!--	2 -->
						<tr style="background-color: #90EE90"><td style="color: black ;float: left">　　通　过，未延期，有备注</td></tr>    <!-- 5 -->
						<tr style="background-color: #FFFFE0"><td style="color: black ;float: left">　　通　过，延　期，无备注</td></tr>  <!-- 7 -->
						<tr style="background-color: #FFD700"><td style="color: black ;float: left">　　通　过，延　期，有备注</td></tr> <!--	6 -->
						<tr style="background-color: #7022f6"><td style="color: whitesmoke ;float: left">　　有问题，进行中</td></tr> <!--	9 -->
						<tr style="background-color: #FFC0CB"><td style="color: black ;float: left">　　有问题，已完成，未延期</td></tr>   <!--	8 -->
						<tr style="background-color: #FF0000"><td style="color: whitesmoke;float: left">　　有问题，已完成，延　期</td></tr>    <!-- 3-->
					</table>
				</div>
                </div>
				<h:form id="maintainForm">
					<h:panelGrid columnClasses="value">

						<p:schedule style="overflow: auto" id="maintain" value="#{maintainController.lazyEventModel}" widgetVar="maintain" timeZone="GMT+8" centerHeaderTemplate="title"
							rightHeaderTemplate="" tooltip="true" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_VIEW')}">
							<p:ajax event="dateSelect" listener="#{maintainController.onDateSelect}" update="createMaintainDlg" oncomplete="PF('createMaintainDlg').show();" disabled="#{!userContextService.accessContainsFunctionMenu('NURSESITE_CREATE')}"/>
							<p:ajax event="eventSelect" listener="#{maintainController.onEventSelect}" update="maintainDlg" oncomplete="PF('maintainDialog').show();"/>
						</p:schedule>
					</h:panelGrid>
				</h:form>
				

				<p:dialog id="createMaintainDlg" widgetVar="createMaintainDlg" header="创建检查">
					<h:form id="createMaintainForm">
						<h:panelGrid columns="1" styleClass="ui-panelgrid-blank form-group">
							<h:panelGroup style="float:left">
								<label>请选择配置: </label>
								<p:selectOneMenu id="currentMaintainConfig" value="#{maintainController.nurseSiteMaintainConfig}" var="t" converter="nurseSiteMaintainConfigConverter"
									required="true" requiredMessage="配置 #{msg.ValidationRequire}">
									<p:ajax event="change" listener="#{maintainController.onNurseSiteMaintainConfigChange}" update=":createMaintainForm"></p:ajax>
									<f:selectItem itemLabel="#{msg.selectOneMessage}" />
									<f:selectItems value="#{maintainController.showListNurseSiteMaintainConfig}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
									<p:column>
										<h:outputText value="#{t!=null?t.name:'请选择...'}" />
									</p:column>
								</p:selectOneMenu>
							</h:panelGroup>
							<h:panelGroup id="currentSequence" style="float:left" rendered="#{maintainController.nurseSiteMaintainConfig.type==1}">
								<label>请选择班次: </label>
								<p:selectOneMenu value="#{maintainController.selectSequence}" required="true" requiredMessage="班次 #{msg.ValidationRequire}">
									<f:selectItems value="#{maintainController.listSequence}" var="item" itemLabel="#{item}" itemValue="#{item}" />
								</p:selectOneMenu>
							</h:panelGroup>
						</h:panelGrid>
						<br />
						<br />
						<p:commandButton id="addButton" validateClient="true" value="创建" actionListener="#{maintainController.createMaintain()}" update=":messages"
							oncomplete="PF('maintain').update();PF('createMaintainDlg').hide();" />
						<p:commandButton immediate="true" value="#{msg.Cancel}" update=":messages" icon="ui-icon-cancel" onclick="PF('createMaintainDlg').hide()" />
					</h:form>
				</p:dialog>
				<p:dialog id="signatureDlg" widgetVar="signatureDlg" header="签名" width="500">
					<h:form id="signatureForm">
						<h:panelGrid columnClasses="value" columns="1">
							<!-- 多签名查看区域（新增签名时隐藏） -->
							<h:panelGroup rendered="#{maintainController.currentSignatureContent != null and !maintainController.showSignaturePad}">
								<h:panelGroup layout="block" style="text-align:center;margin-bottom:8px;">
									<h:outputText value="#{maintainController.signatureCountText}" style="font-weight:bold;font-size:14px;color:#333;" />
								</h:panelGroup>
								<h:panelGroup layout="block" style="text-align:center;min-height:160px;display:flex;align-items:center;justify-content:center;">
									<p:graphicImage value="#{maintainController.currentSignatureContent}" stream="false"
										style="max-width:400px;max-height:200px;" />
								</h:panelGroup>
								<!-- 分页导航栏：导航按钮 + 页码指示器 合一 -->
								<h:panelGroup layout="block" style="text-align:center;margin-top:12px;padding:8px 0;"
									rendered="#{maintainController.hasMultipleSignatures}">
									<p:commandLink actionListener="#{maintainController.previousSignature()}" update=":signatureForm"
										style="display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;margin:0 4px;#{maintainController.hasPreviousSignature ? 'color:#0078d7;border:1px solid #0078d7;' : 'color:#ccc;border:1px solid #ddd;'}text-decoration:none;font-size:14px;"
										disabled="#{!maintainController.hasPreviousSignature}">
										<h:outputText value="&amp;lt;" escape="false" />
									</p:commandLink>
									<p:repeat value="#{maintainController.signatureList}" var="sig" varStatus="loop">
										<p:commandLink actionListener="#{maintainController.selectSignature(loop.index)}" update=":signatureForm"
											style="display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;margin:0 3px;font-size:12px;font-weight:bold;text-decoration:none;#{loop.index == maintainController.currentSignatureIndex ? 'background:#0078d7;color:#fff;' : 'background:#f0f0f0;color:#666;'}">
											<h:outputText value="#{loop.index + 1}" />
										</p:commandLink>
									</p:repeat>
									<p:commandLink actionListener="#{maintainController.nextSignature()}" update=":signatureForm"
										style="display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;margin:0 4px;#{maintainController.hasNextSignature ? 'color:#0078d7;border:1px solid #0078d7;' : 'color:#ccc;border:1px solid #ddd;'}text-decoration:none;font-size:14px;"
										disabled="#{!maintainController.hasNextSignature}">
										<h:outputText value="&amp;gt;" escape="false" />
									</p:commandLink>
								</h:panelGroup>
							</h:panelGroup>
							<!-- 新增签名按钮 -->
							<h:panelGroup rendered="#{maintainController.currentSignatureContent != null and !maintainController.showSignaturePad and userContextService.accessContainsFunctionMenu('NURSESITE_CHECK')}">
								<h:panelGroup layout="block" style="text-align:center;margin-top:10px;">
									<p:commandButton value="新增签名" actionListener="#{maintainController.addNewSignature()}"
										update=":signatureForm signatureContent" oncomplete="PF('sig').clear();" />
								</h:panelGroup>
							</h:panelGroup>
							<!-- 签名板区域：新增签名时或无多签名时显示 -->
							<h:panelGroup rendered="#{maintainController.signatureContentWeiXin==null and maintainController.currentSignatureContent==null or maintainController.showSignaturePad}">
								<p:signature id="signatureContent" style="width:400px;height:200px" widgetVar="sig" base64Value="#{maintainController.signatureContent}"
									required="false" requiredMessage="签名 #{msg.ValidationRequire}" guideline="false" rendered="#{maintainController.signatureContentStream==null}" />
								<p:graphicImage value="#{maintainController.signatureContentStream}" stream="false" rendered="#{maintainController.signatureContentStream!=null}"></p:graphicImage>
							</h:panelGroup>
							<h:panelGroup rendered="#{maintainController.signatureContentWeiXin!=null}">
								<p:graphicImage value="#{maintainController.signatureContentWeiXin}" stream="false" />
							</h:panelGroup>
						</h:panelGrid>
						<p:commandButton value="确认" actionListener="#{maintainController.saveMaintainSignature()}" update=":signatureForm"
							oncomplete="if(PF('sig'))PF('sig').clear();"
							rendered="#{(maintainController.blnWebSignatureEidt or maintainController.showSignaturePad) and userContextService.accessContainsFunctionMenu('NURSESITE_CHECK')}"/>
						<p:commandButton value="重写" actionListener="#{maintainController.resetMaintainSignature()}" update=":signatureForm:signatureContent"
							oncomplete="PF('sig').clear()" rendered="#{(maintainController.blnWebSignatureEidt or maintainController.showSignaturePad) and userContextService.accessContainsFunctionMenu('NURSESITE_CHECK')}" />
						<p:commandButton value="关闭" oncomplete="PF('signatureDlg').hide();" />
					</h:form>
				</p:dialog>
				
				<ui:include src="maintainBatchCreate.xhtml" />
				<ui:include src="maintainBatchDelete.xhtml" />
				<ui:include src="maintainData.xhtml" />
				<ui:include src="maintainBatchComplete.xhtml" />
			</div>
		</div>
	</ui:define>

	<script>
		$(".common-search-div").each(function(index, e) {
			let parent = e.parentElement;
			$(parent).css("overflow", "unset");
		});
	</script>

</ui:composition>
