<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>
	<p:dialog id="maintainDlg" widgetVar="maintainDialog" header="检查详情" modal="true" resizable="true"  draggable="true" appendTo="@(body)" width="1000">
		<h:outputText rendered="#{empty maintainItemController.lazyModel}" value="工单详情后台生成中，请稍候刷新页面查看。"></h:outputText>
		<h:form id="maintainDlgTable" rendered="#{not empty maintainItemController.lazyModel}" >
			<div class="ui-datatable ui-widget" style="overflow: visible; height: 480px;">
				<div  style="padding-left: 10px; padding-right: 10px;">
					<table border="1">
						<tr>
							<th width="100px"><label class="label">名称</label></th>
							<th width="100px"><label class="label">设备编号</label></th>
							<th width="100px"><label class="label">制造商序列号</label></th>
							<th width="100px"><label class="label">设备型号</label></th>
							<th width="100px"><label class="label">具体位置</label></th>
							<th width="100px"><label class="label">检查时间</label></th>
							<th width="100px"><label class="label">检查人</label></th>
							<p:repeat value="#{maintainItemController.nurseSiteMaintain.showLables}" var="item">
								<th width="200px" ><label class="label">#{item.name}</label></th>
							</p:repeat>
							<th width="300px"><label class="label">备注</label></th>
							<!-- <th>
                                            <label class="label">查看签名</label>
                                        </th> -->
						</tr>
						<p:repeat value="#{maintainItemController.nurseSiteMaintain.listNurseSiteMaintainItem}" var="item2">
							<tr>
								<td><h:outputText value="#{item2.assetInfo.name}" /></td>
								<td><h:outputText value="#{item2.assetInfo.departNum}" /></td>
								<td><h:outputText value="#{item2.assetInfo.serialNum}" /></td>
								<td><h:outputText value="#{item2.assetInfo.functionType}" /></td>
								<td><h:outputText value="#{item2.assetInfo.nurseLocation}" /></td>
								<td>
									<h:outputText value="#{item2.updateDate}">
										<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
									</h:outputText>
								</td>
								<td><h:outputText value="#{maintainItemController.getUpdateByName(item2)}" /></td>
								<p:repeat value="#{maintainItemController.nurseSiteMaintain.showLables}" var="item3">
									<td >
										<h:panelGrid columns="3" layout="grid" styleClass="showcase-text-align-center">
											<p:triStateCheckbox value="#{item2.getDataValue(item3.name).checkValueWeb}" />
											<p:inputText value="#{item2.getDataValue(item3.name).variableText}" placeholder="#{item3.defaultValue}" rendered="#{item3.fieldType eq 'Text'}"/>
											<p:inputNumber value="#{item2.getDataValue(item3.name).variableText}" placeholder="#{item3.defaultValue}" rendered="#{ item3.fieldType eq 'Number'}"/>
											<p:selectOneMenu  value="#{item2.getDataValue(item3.name).variableText}" rendered="#{ item3.fieldType eq 'Select'}">
												<f:selectItem itemLabel="#{msg.selectOneMessage}"/>
												<f:selectItems value="#{item3.options}" var="option" itemLabel="#{option.value}" itemValue="#{option.key}"/>
											</p:selectOneMenu>
											<p:calendar timeZone="GMT+8" id="startTime" value="#{item2.getDataValue(item3.name).dateValue}" rendered="#{ item3.fieldType eq 'Date'}"
														pattern="yyyy/MM/dd"  requiredMessage="开始时间 #{msg.ValidationRequire}"
														showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
										</h:panelGrid>
								  </td>
								</p:repeat>
								<td><p:inputText value="#{item2.comment}" maxlength="200"></p:inputText></td>
							</tr>
						</p:repeat>
					</table>
				</div>
				<div  style="padding-left: 10px; padding-right: 10px;">
							<label>负责人: </label>
							<h:outputText value="#{maintainItemController.nurseSiteMaintain.modifyBy.name}"></h:outputText>
							<label>检测时间: </label>
							<h:outputText value="#{maintainItemController.nurseSiteMaintain.checkDate}">
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
							</h:outputText>
					<br/>
					<br/>
					<p:commandButton actionListener="#{maintainItemController.pre()}" value="上一页" update="maintainDlgTable" disabled="#{!maintainItemController.blnPre}"></p:commandButton>
					<p:commandButton actionListener="#{maintainItemController.next()}" value="下一页" update="maintainDlgTable" disabled="#{!maintainItemController.blnNext}"></p:commandButton>
					<p:commandButton id="btnCheckData" value="检查项" update="checkDataDlg" oncomplete="PF('checkDataDlg').show()" />
					<p:commandButton id="checkRightButton" value="全部勾选(当前页)" actionListener="#{maintainItemController.checkRightAll}" update="maintainDlgTable" />
					<p:commandButton id="addButton" value="保存" actionListener="#{maintainController.saveMaintain()}" update=":messages"
									 oncomplete="PF('maintain').update();PF('maintainDialog').hide();" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_CREATE')}"/>
					<p:commandButton id="deleteButton" value="删除" actionListener="#{maintainController.deleteMaintain}" update=":messages"
									 disabled="#{maintainController.deleteDisable}" oncomplete="PF('maintain').update();PF('maintainDialog').hide();" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_DELETE')}">
						<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert" />
					</p:commandButton>
					<p:commandButton id="openSignature"
									 actionListener="#{maintainController.getMaintainSignature(maintainController.nurseSiteMaintain.signatureId,maintainController.nurseSiteMaintain.signatureSourceType)}"
									 value="查看签名" update=":signatureDlg" oncomplete="PF('signatureDlg').show();" />
				</div>
			</div>

		</h:form>
	</p:dialog>
	<p:dialog id="checkDataDlg" widgetVar="checkDataDlg" header="请选择检查项" modal="true" resizable="true" draggable="true" appendTo="@(body)" width="500">
		<h:form id="checkDataForm">
				<table style="border-collapse:collapse">
					<tr style="border: 1px solid black" >
						<th width="300px" colspan="2"><span>检查项</span></th>
						<th width="300px"><span >输入项</span></th>
					</tr>

						<p:repeat value="#{maintainItemController.listCheckData}" var="item">
							<tr style="border: 1px solid black">

								<td >
									<p:selectBooleanCheckbox value="#{item.checkValue}"></p:selectBooleanCheckbox>
								</td>
								<td style="border-right: 1px solid black">
									<h:outputText value="#{item.name}" />
								</td>
								<td>
									<p:inputText value="#{item.defaultValue}" placeholder="#{item.defaultValue}" rendered="#{ item.fieldType eq 'Text'}"/>
									<p:inputNumber value="#{item.defaultValue}" placeholder="#{item.defaultValue}" rendered="#{ item.fieldType eq 'Number'}"/>
									<p:selectOneMenu  value="#{item.defaultValue}" rendered="#{ item.fieldType eq 'Select'}">
										<f:selectItem itemLabel="#{msg.selectOneMessage}"/>
										<f:selectItems value="#{item.options}" var="option" itemLabel="#{option.value}" itemValue="#{option.key}"/>
									</p:selectOneMenu>
									<p:calendar timeZone="GMT+8" id="startTime1" value="#{item.dateValue}" rendered="#{ item.fieldType eq 'Date'}"
												pattern="yyyy/MM/dd"  requiredMessage="开始时间 #{msg.ValidationRequire}"
												showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
								</td>
							</tr>
						</p:repeat>
				</table>
			<p:commandButton value="批量通过" actionListener="#{maintainItemController.saveCheckData()}" oncomplete="PF('checkDataDlg').hide();PF('maintainDialog').hide();PF('maintain').update();" rendered="#{maintainController.customRoleAuth.authModify}"/>
			<p:commandButton value="全选" actionListener="#{maintainItemController.resetCheckData()}" update=":checkDataForm" />
			<p:commandButton value="全不选" actionListener="#{maintainItemController.resetCheckData2()}" update=":checkDataForm"  />
		</h:form>
	</p:dialog>
</ui:composition>
</html>
