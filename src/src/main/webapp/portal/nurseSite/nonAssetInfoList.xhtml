<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="设备绩效配置" />
			</div>
			<div class="ui-g-12 card ">
				<h:form id="nonAssetInfoListForm">
					<p:dataTable id="datalist" value="#{nonAssetInfoController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single"
						selection="#{nonAssetInfoController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true" rowKey="#{item.id}"
						sortMode="single" sortOrder="descending" sortBy="#{item.id}"
						paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
						currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">

						<p:ajax event="rowSelect" update="editButton deleteButton" />
						<p:ajax event="filter" listener="#{nonAssetInfoController.onFilter}" />

						<p:column headerText="名称" filterBy="#{item.name}" filterMatchMode="LIKE">
							<h:outputText value="#{item.name}" />
						</p:column>

						<f:facet name="{Toolbar}">
							<p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}"
								actionListener="#{nonAssetInfoController.prepareCreate}" update=":nonAssetInfoEditDlg"
								oncomplete="PF('nonAssetInfoEditDialog').show()" />
							<p:commandButton id="editButton" actionListener="#{nonAssetInfoController.prepareEdit}" icon="ui-icon-pencil" title="#{msg.Edit}"
								update=":nonAssetInfoEditDlg" oncomplete="PF('nonAssetInfoEditDialog').show()" disabled="#{empty nonAssetInfoController.selected.id}" />
							<p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{nonAssetInfoController.delete}"
								update=":nonAssetInfoListForm:datalist" disabled="#{empty nonAssetInfoController.selected.id}">
								<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert" />
							</p:commandButton>
						</f:facet>
					</p:dataTable>
				</h:form>
			</div>
		</div>
		<ui:include src="nonAssetInfoEdit.xhtml" />
	</ui:define>
</ui:composition>
