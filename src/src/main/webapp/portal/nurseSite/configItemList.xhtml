<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	  xmlns:h="http://xmlns.jcp.org/jsf/html"
	  xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui"
	  xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition>
	<p:dialog id="batchAdd" widgetVar="batchAdd" width="800" height="400" modal="true" resizable="true" draggable="true" appendTo="@(body)">
		<h:form id="batchAddForm">
			<p:dataTable id="datalist" value="#{selectCheckItemController.lazyModel}" var="item" widgetVar="varDataList"
						 selection="#{selectCheckItemController.selected}" selectionMode="single" lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
						 rowKey="#{item.id}" sortOrder="descending" sortBy="#{item.id}"
						 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}  {RowsPerPageDropdown}"
						 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="5" emptyMessage="#{msg.noRecordFound}" >
				<p:ajax event="page" listener="#{selectCheckItemController.setSelectAll(false)}" update="@(.selectCheckBox)" oncomplete="updateSelectAllCheckBox();" />
				<p:ajax event="filter" listener="#{selectCheckItemController.onFilter}" />
				<p:column width="36"  id="checkBoxColumn">
					<p:selectBooleanCheckbox value="#{selectCheckItemController.selectedMap[item.id]}"  class="selectCheckBox">
						<p:ajax process="@this" update="@this @(.batch-terminated)"   oncomplete="updateSelectAllCheckBox();"/>
					</p:selectBooleanCheckbox>
					<f:facet name="header"  >
						<p:selectBooleanCheckbox value="#{selectCheckItemController.selectAll}" id="selectCheckBoxHeader" class="selectCheckBoxHeader">
							<p:ajax listener="#{selectCheckItemController.onSelectAllOfPage}" update="@(.selectCheckBox) :batchAddForm:datalist " oncomplete="updateSelectAllCheckBox();"/>
						</p:selectBooleanCheckbox>
					</f:facet>
				</p:column>
				<p:column headerText="分组" filterBy="#{item.groupName}" filterMatchMode="LIKE">
					<f:facet name="filter">
						<p:selectOneMenu onchange="PF('varDataList').filter()" >
							<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="" noSelectionOption="true" />
							<f:selectItems value="#{selectCheckItemController.groupNames}" />
						</p:selectOneMenu>
					</f:facet>
					<h:outputText value="#{item.groupName}" />
				</p:column>
				<p:column headerText="检查项" filterBy="#{item.name}" filterMatchMode="LIKE">
					<h:outputText value="#{item.name}" />
				</p:column>
				<p:column headerText="描述" filterBy="#{item.description}" filterMatchMode="LIKE">
					<h:outputText value="#{item.description}" />
				</p:column>
				<p:column headerText="类型">
					<h:outputText value="#{item.fieldTypeStr()}" />
				</p:column>
				<p:column headerText="默认值">
					<h:outputText rendered="#{(item.fieldType ne 'Select')}" value="#{item.defaultValue}" />
					<h:outputText rendered="#{item.fieldType eq 'Select'}" value="#{item.optionStr()}" />
				</p:column>
				<p:column headerText="创建日期">
					<h:outputText value="#{item.createDate}" >
						<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
					</h:outputText>
				</p:column>
				<p:column headerText="修改日期">
					<h:outputText value="#{item.modifyDate}" >
						<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
					</h:outputText>
				</p:column>
				<p:column headerText="是否必填">
					<h:outputText value="#{item.required?'是':'否'}" />
				</p:column>
			</p:dataTable>
			<p:commandButton value="批量添加" actionListener="#{selectCheckItemController.saveSelectCheckItem()}" update="batchAddForm :maintainConfigCreateForm:addCheckItem :maintainConfigEditForm:addCheckItem2" oncomplete="PF('batchAdd').hide()"  />
			<p:commandButton immediate="true"  value="#{msg.Cancel}"  icon="ui-icon-cancel" onclick="PF('batchAdd').hide()" />
		</h:form>
		<script>
			function updateSelectAllCheckBox() {
				var checkboxlist = $(".selectCheckBox");
				var selectAllstatus = true;
				checkboxlist.each(function () {
					selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked;
				});

				if (selectAllstatus) {
					$("#batchAddForm\\:datalist\\:selectCheckBoxHeader").find('div')[1].classList.add("ui-state-active");
					// $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
				} else {
					// $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
					$("#batchAddForm\\:datalist\\:selectCheckBoxHeader").find('div')[1].classList.remove("ui-state-active");
				}
			}

		</script>
	</p:dialog>
</ui:composition>
</html>
