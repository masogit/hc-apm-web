<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="设备开关机记录" />
			</div>
			<div class="ui-g-12 card ">
				<h:form id="optRecordListForm" rendered="#{not empty assetOptRecordController}">
					<ui:include src="/portal/asset/searchDiv.xhtml"/>
					<p:dataTable id="datalist" value="#{assetOptRecordController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single"
						selection="#{assetOptRecordController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true" rowKey="#{item.id}"
						sortMode="single" sortOrder="descending" sortBy="#{item.id}"
						paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
						currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">

						<!-- <p:ajax event="rowSelect" update="createButton editButton deleteButton" /> -->
						<p:ajax event="filter" listener="#{assetOptRecordController.onFilter}" />

						<p:column headerText="资产名称" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE">
							<h:outputText value="#{item.assetInfo.name}" />
						</p:column>
						<p:column headerText="设备编号" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
							<h:outputText value="#{item.assetInfo.departNum}" />
						</p:column>
						<p:column headerText="设备型号" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE">
							<h:outputText value="#{item.assetInfo.functionType}" />
						</p:column>
						<p:column headerText="设备分类" filterBy="#{item.assetInfo.assetGroup}" filterMatchMode="EQ">
							<f:facet name="filter">
								<p:selectOneMenu onchange="PF('varDataList').filter()">
									<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
									<f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
								</p:selectOneMenu>
							</f:facet>
							<h:outputText value="#{fieldMsg.fieldValue('assetGroup', item.assetInfo.assetGroup)}" />
						</p:column>
						<p:column headerText="所属院区" visible="false" exportable="true">
							<h:outputText value="#{item.siteOrgInfo.name}" />
						</p:column>
						<p:column headerText="所属科室" filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="LIKE">
							<h:outputText value="#{item.assetInfo.clinicalDeptName}" />
						</p:column>
						<p:column headerText="开机人" filterBy="#{item.createBy.name}" filterMatchMode="LIKE">
							<h:outputText value="#{item.createBy.name}" />
						</p:column>
						<p:column headerText="关机人" filterBy="#{item.modifyBy.name}" filterMatchMode="LIKE">
							<h:outputText value="#{empty item.endDate?'':item.modifyBy.name}" />
						</p:column>
						<p:column headerText="开机时间" sortBy="#{item.startDate}" filterBy="#{item.startDate}" filterMatchMode="GTE">
							<f:facet name="filter">
								<p:inputText id="filterstartDate" widgetVar="varFilterstartDate" />
							</f:facet>
							<h:outputText value="#{item.startDate}">
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
							</h:outputText>
						</p:column>
						<p:column headerText="关机时间" sortBy="#{item.endDate}" filterBy="#{item.endDate}" filterMatchMode="GTE">
							<f:facet name="filter">
								<p:inputText id="filterendDate" widgetVar="varFilterendDate" />
							</f:facet>
							<h:outputText value="#{item.endDate}">
								<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
							</h:outputText>
						</p:column>
						<p:column headerText="使用时长">
							<h:outputText value="#{item.costTime}">
							</h:outputText>
						</p:column>
						<p:column headerText="备注">
							<h:outputText value="#{item.comment}">
							</h:outputText>
						</p:column>
						<f:facet name="{Toolbar}">
							<p:commandButton ajax="false" icon="ui-icon-arrowthick-1-s" update=":growl" title="导出到Excel">
								<p:dataExporter type="xlsx" target="datalist" fileName="assetOptRecord"/>
							</p:commandButton>
				            <!-- <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}"
				                actionListener="#{assetOptRecordController.prepareCreate}" update=":optRecordCreateDlg"
				                oncomplete="PF('optRecordCreateDialog').show()" onclick="NurseSiteMaintain.on()"/>
				            <p:commandButton id="editButton" actionListener="#{assetOptRecordController.prepareEdit}" icon="ui-icon-pencil" title="#{msg.Edit}"
				                update=":optRecordEditDlg" oncomplete="PF('optRecordEditDialog').show()"
				                disabled="#{empty assetOptRecordController.selected.id}" onclick="NurseSiteMaintain.on()"/>
				            <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}"
				                actionListener="#{assetOptRecordController.delete}" update=":optRecordListForm:datalist"
				                disabled="#{empty assetOptRecordController.selected.id}">
				                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert" />
				            </p:commandButton> -->
				        </f:facet>
					</p:dataTable>
				</h:form>
			</div>
		</div>
		<p:overlayPanel widgetVar="panelFilterstartDate" for="optRecordListForm:datalist:filterstartDate" dismissable="false">
			<h:panelGrid columns="2">
				<p:outputLabel value="#{msg.From}" />
				<p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_startDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true"
					mask="true" size="12" locale="zh" />
				<p:outputLabel value="#{msg.To}" />
				<p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_startDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true"
					size="12" locale="zh" />
			</h:panelGrid>
			<p:commandButton
				onclick="setDateFilter('varDataList','varFilterstartDate','varStartTimeFrom_startDate','varStartTimeTo_startDate'); PF('panelFilterstartDate').hide();"
				title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
			<p:commandButton onclick="PF('panelFilterstartDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;" />
		</p:overlayPanel>
		<p:overlayPanel widgetVar="panelFilterendDate" for="optRecordListForm:datalist:filterendDate" dismissable="false">
			<h:panelGrid columns="2">
				<p:outputLabel value="#{msg.From}" />
				<p:calendar timeZone="GMT+8" widgetVar="varStartTimeFrom_endDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true"
					size="12" locale="zh" />
				<p:outputLabel value="#{msg.To}" />
				<p:calendar timeZone="GMT+8" widgetVar="varStartTimeTo_endDate" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true"
					size="12" locale="zh" />
			</h:panelGrid>
			<p:commandButton
				onclick="setDateFilter('varDataList','varFilterendDate','varStartTimeFrom_endDate','varStartTimeTo_endDate'); PF('panelFilterendDate').hide();"
				title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;" />
			<p:commandButton onclick="PF('panelFilterendDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;" />
		</p:overlayPanel>
	</ui:define>
</ui:composition>
