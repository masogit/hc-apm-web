<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">


<ui:composition>
	<p:dialog id="maintainConfigCreateDlg" widgetVar="maintainConfigCreateDialog" header="使用登记检查设置" height="600" width="1150" appendTo="@(body)" maximizable="true">
		<h:form id="maintainConfigCreateFormJN" rendered="#{maintainConfigJNController.selected!=null}">
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">名称*</label>
					<p:inputText value="#{maintainConfigJNController.selected.name}" required="true" requiredMessage="名称不能为空"></p:inputText>
				</h:panelGroup>
			</p:panelGrid>
			<p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<p:dataTable id="addCheckItem" value="#{maintainConfigJNController.listPairCheckItems}" var="item" widgetVar="addCheckItem" lazy="false" paginator="false"
						rowKey="#{item.key}" rows="1000" emptyMessage="#{msg.noRecordFound}" style="width:600px">
						<p:column headerText="#{msg.name}">
							<h:outputText value="#{item.name}" />
						</p:column>
						<p:column headerText="备注">
							<h:outputText value="#{item.description}" />
						</p:column>
						<p:column headerText="是否默认开机操作">
							<h:outputText value="#{item.defaultPowerOn ? '是' : '否'}" />
						</p:column>
						<p:column headerText="#{msg.Actions}">
							<p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" update=":checkItemCreateDlg"
								oncomplete="PF('checkItemCreateDlg').show()" rendered="#{empty item.name}" />
							<p:commandButton process="@this" icon="ui-icon-edit" style="zoom:0.8;" title="#{msg.Edit}"
								actionListener="#{maintainConfigJNController.setObjCheckItem(item)}" update=":checkItemCreateDlg" oncomplete="PF('checkItemCreateDlg').show()"
								rendered="#{not empty item.name}" />
							<p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
								actionListener="#{maintainConfigJNController.deleteItemDetail(item)}"
								update=":maintainConfigCreateFormJN:addCheckItem,:maintainConfigCreateFormJN:saveButtonId" rendered="#{not empty item.name}"></p:commandButton>
						</p:column>
					</p:dataTable>
				</h:panelGroup>
			</p:panelGrid>
            <p:fieldset>
                <ui:include src="assetListJN.xhtml"></ui:include>
            </p:fieldset>
			<br />
			<br />
			<p:commandButton id="saveButtonId" validateClient="true" value="#{msg.Save}" process="@parent" update=":growl,:maintainConfigListForm" icon="ui-icon-check"
				oncomplete="PF('maintainConfigCreateDialog').hide();handleSubmit(args, 'maintainConfigCreateDialog')" actionListener="#{maintainConfigJNController.save}"
                disabled="#{maintainConfigJNController.saveDisable}" timeout="180000" />
			<p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('maintainConfigCreateDialog').hide()" />
		</h:form>
	</p:dialog>
	<p:dialog id="checkItemCreateDlg" widgetVar="checkItemCreateDlg" width="400" height="130" modal="true" resizable="true" draggable="true" appendTo="@(body)"
		header="#{msg.UseRegistrationCheckItemSettings}">
		<h:form id="checkItemCreateFormJN" rendered="#{maintainConfigJNController.objCheckItem!=null}">
			<h:panelGroup id="display" class="checkItemCreateDlg">
				<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
					<h:panelGroup>
						<label>#{msg.name} *：</label>
						<p:inputText id="name" value="#{maintainConfigJNController.objCheckItem.name}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}" />
					</h:panelGroup>
					<h:panelGroup>
						<label>备注：</label>
						<p:inputText id="description" value="#{maintainConfigJNController.objCheckItem.description}" />
					</h:panelGroup>
					<h:panelGroup>
						<label>是否默认开机操作：</label>
						<p:selectBooleanCheckbox value="#{maintainConfigJNController.objCheckItem.defaultPowerOn}" />
					</h:panelGroup>
				</p:panelGrid>
				<p:commandButton validateClient="true" actionListener="#{maintainConfigJNController.saveCheckListItem}"
					update=":growl,:maintainConfigCreateFormJN:addCheckItem,:maintainConfigCreateFormJN:saveButtonId" value="#{msg.Save}" icon="ui-icon-check"
					oncomplete="handleSubmit(args, 'checkItemCreateDlg');" />
                 &nbsp;&nbsp;
                 <p:commandButton immediate="true" value="#{msg.Cancel}" update=":growl" icon="ui-icon-cancel" onclick="PF('checkItemCreateDlg').hide()" />
			</h:panelGroup>
		</h:form>
	</p:dialog>
</ui:composition>
</html>
