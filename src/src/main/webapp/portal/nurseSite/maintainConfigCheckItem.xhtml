<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="常用日常检查项设置" />
            </div>
            <div class="ui-g-12 card ">
                <h:form id="maintainConfigCheckItemListForm">

                    <p:dataTable id="datalist" value="#{maintainCheckItemController.lazyModel}" var="item" widgetVar="varDataList"
                        selection="#{maintainCheckItemController.selected}" selectionMode="single" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                        rowKey="#{item.id}" sortOrder="descending" sortBy="#{item.id}"
                        paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                        currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">
                        <p:ajax event="rowSelect" update="createButton editButton deleteButton" />
                        <p:ajax event="filter" listener="#{maintainCheckItemController.onFilter}" />
                        <p:column headerText="检查项" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}" />
                        </p:column>
                        <p:column headerText="描述" filterBy="#{item.description}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.description}" />
                        </p:column>
                         <p:column headerText="类型">
                             <h:outputText value="#{item.fieldTypeStr()}" />
                         </p:column>
                        <p:column headerText="默认值">
                            <h:outputText rendered="#{(item.fieldType ne 'Select')}" value="#{item.defaultValue}" />
                            <h:outputText rendered="#{item.fieldType eq 'Select'}" value="#{item.optionStr()}" />
                        </p:column>
                        <p:column headerText="创建日期">
                            <h:outputText value="#{item.createDate}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="修改日期">
                            <h:outputText value="#{item.modifyDate}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}"
                                             actionListener="#{maintainCheckItemController.prepareCreate}" update=":maintainConfigcheckItemEditDlg"
                                             oncomplete="PF('maintainConfigcheckItemEditDlg').show()" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_CONFIG_EDIT')}"/>
                            <p:commandButton id="editButton" actionListener="#{maintainCheckItemController.prepareEdit}" icon="ui-icon-pencil" title="#{msg.Edit}" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_CONFIG_EDIT')}"
                                             update="maintainConfigcheckItemEditDlg" oncomplete="PF('maintainConfigcheckItemEditDlg').show()" disabled="#{empty maintainCheckItemController.selected}"/>
                            <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}"  disabled="#{empty maintainCheckItemController.selected}" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_CONFIG_EDIT')}"
                                             actionListener="#{maintainCheckItemController.delete}" update=":maintainConfigCheckItemListForm:datalist">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert" />
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
        <p:dialog id="editOptionDialog" widgetVar="editOptionDialog"  modal="true" width="500" resizable="true" draggable="true"  appendTo="@(body)" header="#{msg.EditOption}">
            <h:form id="editOptionDialogForm" >
                <h:panelGroup id="display" >
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">#{msg.key}</label>
                            <p:inputText disabled="#{maintainCheckItemController.edit}" value="#{maintainCheckItemController.tableOption.key}" required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class="label">#{msg.value}</label>
                            <p:inputText value="#{maintainCheckItemController.tableOption.value}" required="true" requiredMessage="#{msg.value}#{msg.ValidationRequire}" />
                        </h:panelGroup>

                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{maintainCheckItemController.addOption()}" value="#{msg.Confirm}"  icon="ui-icon-check" update=":checkItemEditForm:optionsTable  :checkItemEditForm:DefaultValue :growl" oncomplete="handleSubmit(args, 'editOptionDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}"  icon="ui-icon-cancel" onclick="PF('editOptionDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
		<p:dialog id="maintainConfigcheckItemEditDlg" widgetVar="maintainConfigcheckItemEditDlg" width="450" height="500" modal="true" resizable="true"
			draggable="true" appendTo="@(body)" header="日常检查项配置">
			<h:form id="checkItemEditForm" rendered="#{maintainCheckItemController.selected!=null}">
				<h:panelGroup>
					<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
						<h:panelGroup>
							<label>#{msg.name} *：</label>
							<p:inputText id="name" value="#{maintainCheckItemController.selected.name}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}" />
						</h:panelGroup>
						<h:panelGroup>
							<label>备注：</label>
							<p:inputText id="description" value="#{maintainCheckItemController.selected.description}" />
						</h:panelGroup>
                        <h:panelGroup >
                            <label >#{msg.fieldType}：</label>
                            <p:selectOneMenu value="#{maintainCheckItemController.selected.fieldType}" >
                                <p:ajax listener="#{maintainCheckItemController.onRuleChange}"  update="optionsTable   DefaultValue"  />
                                <f:selectItem itemLabel="无类型" itemValue="#{''}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeInputText}" itemValue="#{'Text'}"/>
<!--                                <f:selectItem itemLabel="#{msg.ComponentTypeSwitch}" itemValue="#{'Switch'}"/>-->
                                <f:selectItem itemLabel="#{msg.ComponentTypeNumber}" itemValue="#{'Number'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeSelect}" itemValue="#{'Select'}"/>
                                <f:selectItem itemLabel="#{msg.ComponentTypeDate}" itemValue="#{'Date'}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup id="DefaultValue" >
                            <c:if test="#{!maintainCheckItemController.dateType()}">
                             <label >默认值：</label>
                            </c:if>
                            <c:if test="#{ maintainCheckItemController.selected.fieldType eq 'Text'}" >
                                <p:inputText value="#{maintainCheckItemController.selected.defaultValue}" placeholder="#{maintainCheckItemController.selected.defaultValue}"/>
                            </c:if>
                            <c:if test="#{maintainCheckItemController.selected.fieldType eq 'Number'}" >
                                <p:inputNumber value="#{maintainCheckItemController.selected.defaultValue}" placeholder="#{maintainCheckItemController.selected.defaultValue}" />
                            </c:if>
                            <c:if test="#{maintainCheckItemController.selected.fieldType eq 'Select'}" >
                                <p:selectOneMenu value="#{maintainCheckItemController.selected.defaultValue}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{maintainCheckItemController.options}" var="option" itemLabel="#{option.value}" itemValue="#{option.key}"/>
                                </p:selectOneMenu>
                            </c:if>
                        </h:panelGroup>
                        <h:panelGroup id="optionsTable"  >
                            <p:dataTable value="#{maintainCheckItemController.options}" var="optionItem" rendered="#{maintainCheckItemController.selected.fieldType eq 'Select'}" emptyMessage="#{msg.noRecordFound}" >

                                <f:facet name="header">
                                    <p:commandButton id="createButton1" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}"  actionListener="#{maintainCheckItemController.prepareAddOption()}" process="@this" update=":editOptionDialogForm"  oncomplete="PF('editOptionDialog').show()" />
                                </f:facet>
                                <p:column headerText="#{msg.OptionIdentifier}" >
                                    <h:outputText value="#{optionItem.key}"/>
                            </p:column>
                                <p:column headerText="#{msg.OptionDisplayValue}" >
                                    <h:outputText value="#{optionItem.value}"/>
                                </p:column>
                                <p:column headerText="#{msg.Operation}" width="64" >
                                    <p:commandLink actionListener="#{maintainCheckItemController.prepareEditOption(optionItem)}" process="@this"  oncomplete="PF('editOptionDialog').show()" update=":checkItemEditForm :editOptionDialogForm" rendered="#{not empty optionItem.key}"><span class="ui-icon ui-icon-pencil" /></p:commandLink>
                                    <p:commandLink actionListener="#{maintainCheckItemController.removeOption(optionItem)}" process="@this" update=":checkItemEditForm:optionsTable :checkItemEditForm:DefaultValue" rendered="#{not empty optionItem.key}"><span class="ui-icon ui-icon-trash" /></p:commandLink>
                                </p:column>
                            </p:dataTable>

                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label" style="font-size: medium; font-weight: bold">是否必填</label>
                            <p:selectOneRadio id="enable" value="#{maintainCheckItemController.selected.required}">
                                <p:ajax event="change" process="@this" />
                                <f:selectItem itemLabel="是" itemValue="true"/>
                                <f:selectItem itemLabel="否" itemValue="false"/>
                            </p:selectOneRadio>
                        </h:panelGroup>
					</p:panelGrid>

					<p:commandButton validateClient="true" actionListener="#{maintainCheckItemController.save}" update=":growl,:maintainConfigCheckItemListForm"
						value="#{msg.Save}" icon="ui-icon-check" oncomplete="handleSubmit(args, 'maintainConfigcheckItemEditDlg');" />
					<p:commandButton immediate="true" value="#{msg.Cancel}" update=":maintainConfigCheckItemListForm:datalist :growl" icon="ui-icon-cancel" onclick="PF('maintainConfigcheckItemEditDlg').hide()" />
				</h:panelGroup>

			</h:form>
		</p:dialog>
	</ui:define>
</ui:composition>
