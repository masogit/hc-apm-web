<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <h:outputScript name="js/nurseSiteMaintain.js"></h:outputScript>
        <ui:include src="maintainConfigEdit.xhtml" />
        <ui:include src="maintainConfigCreate.xhtml" />
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="日常检查配置" />
            </div>
            <div class="ui-g-12 card ">
                <h:form id="searchForm">
                    <h:panelGrid id="searchPanel" columns="3">
                        <h:panelGroup>
                            <p:commandButton id="btnOrg" value="#{empty maintainConfigController.selectSite? msg.AllHospitals:maintainConfigController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                            <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false">
                                <p:inputText id="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
                                <p:commandButton partialSubmit="true" icon="ui-icon-search" process="searchForm:treeNodeNameFilter @this" update="orgTree" actionListener="#{orgTreeController.filterTreeNodeByName()}" value="#{msg.Search}"/>
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.siteOrgTree}" selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
                                        <p:ajax process="@this" event="select" listener="#{maintainConfigController.onSelectSiteTreeNode}" update="maintainConfigListForm:datalist searchForm" oncomplete="PF('varPanelOrg').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node.name}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
                <h:form id="maintainConfigListForm">
                    <p:dataTable id="datalist" value="#{maintainConfigController.lazyModel}" var="item" widgetVar="varDataList"
                        selection="#{maintainConfigController.listSelected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                        rowKey="#{item.id}" sortOrder="descending" sortBy="#{item.id}"
                        paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                        currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_CONFIGITEM_VIEW')}">
               			<p:column selectionMode="multiple" style="width:32px;text-align:center" exportable="false">
						</p:column>
                        <p:ajax event="rowSelect" update="createButton editButton deleteButton" />
						<p:ajax event="rowSelectCheckbox" update="createButton editButton deleteButton" />
						<p:ajax event="rowUnselectCheckbox" update="createButton editButton deleteButton" />
						<p:ajax event="toggleSelect" update="createButton editButton deleteButton"/>
                        <p:ajax event="filter" listener="#{maintainConfigController.onFilter}" />
                
                        <p:column headerText="配置名称" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}" />
                        </p:column>
                        <p:column headerText="创建人">
                            <h:outputText value="#{item.createBy.name}" />
                        </p:column>
                        <p:column headerText="创建日期">
                            <h:outputText value="#{item.createDate}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="修改人">
                            <h:outputText value="#{item.modifyBy.name}" />
                        </p:column>
                        <p:column headerText="修改日期">
                            <h:outputText value="#{item.modifyDate}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}"
                                actionListener="#{maintainConfigController.prepareCreate}" update=":maintainConfigCreateDlg"
                                oncomplete="PF('maintainConfigCreateDialog').show()" onclick="NurseSiteMaintain.on()" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_CONFIGITEM_EDIT')}"/>
                            <p:commandButton id="editButton" actionListener="#{maintainConfigController.prepareEdit}" icon="ui-icon-pencil" title="#{msg.Edit}"
                                update=":maintainConfigEditDlg" oncomplete="PF('maintainConfigEditDialog').show()"
                                disabled="#{(empty maintainConfigController.listSelected) or (maintainConfigController.listSelected.size()>1)}" onclick="NurseSiteMaintain.on()" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_CONFIGITEM_EDIT')}"/>
                            <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}"
                                actionListener="#{maintainConfigController.delete}" update=":maintainConfigListForm:datalist"
                                disabled="#{empty maintainConfigController.listSelected}" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_CONFIGITEM_EDIT')}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteNurseSiteMaintainConfig}" icon="ui-icon-alert" />
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
