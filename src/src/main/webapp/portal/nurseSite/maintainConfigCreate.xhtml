<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


<ui:composition>
	<p:dialog id="maintainConfigCreateDlg" widgetVar="maintainConfigCreateDialog" header="日常检查设置" height="600" width="1150" appendTo="@(body)" maximizable="true">
		<h:form id="maintainConfigCreateForm" rendered="#{maintainConfigController.selected!=null}">
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">名称*</label>
					<p:inputText value="#{maintainConfigController.selected.name}" required="true" requiredMessage="名称不能为空"></p:inputText>
				</h:panelGroup>
			</p:panelGrid>
			<p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">增加检查项*</label>
					<p:dataTable id="addCheckItem" value="#{maintainConfigController.listPairCheckItems}" var="item" widgetVar="addCheckItem" lazy="false" paginator="true"
						selection="#{maintainConfigController.objCheckItem}" selectionMode="single"
						paginatorTemplate="{Toolbar}"  paginatorPosition="top" paginatorAlwaysVisible="true"
						rowKey="#{item.key}" rows="1000" emptyMessage="#{msg.noRecordFound}" style="width:600px">
						<p:ajax event="rowSelect" update="createButton editButton deleteButton moveUp moveDown" />
						<p:column headerText="#{msg.name}">
							<h:outputText value="#{item.name}" />
						</p:column>
						<p:column headerText="分组">
							<h:outputText value="#{item.groupName}" />
						</p:column>
						<p:column headerText="描述">
							<h:outputText value="#{item.description}" />
						</p:column>
						<p:column headerText="类型">
							<h:outputText value="#{item.fieldTypeStr()}" />
						</p:column>
						<p:column headerText="默认值">
							<h:outputText rendered="#{item.fieldType ne 'Select'}" value="#{item.defaultValue}" />
							<h:outputText rendered="#{item.fieldType eq 'Select'}" value="#{item.defaultValue}" />
						</p:column>
						<p:column headerText="是否必填">
							<h:outputText value="#{empty item.name?'':item.required?'是':'否'}" />
						</p:column>
						<f:facet name="{Toolbar}">
							<p:commandButton id="bacth" process="@this" icon="fa fa-cogs" style="zoom:0.8;" title="批量添加" update=":batchAdd"
											 actionListener="#{maintainConfigController.setSelectAll()}" oncomplete="PF('batchAdd').show()"  />
							<p:commandButton id="createButton" process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" update=":checkItemCreateDlg"
											 actionListener="#{maintainConfigController.createObjCheckItem()}" oncomplete="PF('checkItemCreateDlg').show()"  />
							<p:commandButton id="editButton" process="@this" icon="ui-icon-edit" style="zoom:0.8;" title="#{msg.Edit}"
											  update=":checkItemCreateDlg" oncomplete="PF('checkItemCreateDlg').show()"
											 disabled="#{maintainConfigController.objCheckItem eq null or maintainConfigController.objCheckItem.id ne null}"  />
							<p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
											 actionListener="#{maintainConfigController.deleteItemDetail()}"
											 update=":maintainConfigCreateForm:addCheckItem,:maintainConfigCreateForm:saveButtonId" disabled="#{maintainConfigController.objCheckItem eq null}" />
							<p:commandButton id="moveUp" process="@this" icon="ui-icon-arrow-upward" style="zoom:0.8;"  title="上移"
											 actionListener="#{maintainConfigController.checkItemMoveUp()}"
											 update=":maintainConfigCreateForm:addCheckItem,:maintainConfigCreateForm:saveButtonId"	disabled="#{maintainConfigController.objCheckItem eq null}" />
							<p:commandButton id="moveDown" process="@this" icon="ui-icon-arrow-downward" style="zoom:0.8;"  title="下移"
											 actionListener="#{maintainConfigController.checkItemMoveDown()}"
											 update=":maintainConfigCreateForm:addCheckItem,:maintainConfigCreateForm:saveButtonId" disabled="#{maintainConfigController.objCheckItem eq null}"  />
						</f:facet>
					</p:dataTable>
				</h:panelGroup>
			</p:panelGrid>
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" id="idTypeGroup">
				<h:panelGroup>
					<label class="label">检查类型*</label>
					<p:selectOneRadio value="#{maintainConfigController.selected.type}" required="true" requiredMessage="检查类型不能为空" layout="responsive" columns="1">
						<p:ajax event="change" update=":maintainConfigCreateForm:idTypeGroup" process="@this"></p:ajax>
						<f:selectItem itemLabel="每天" itemValue="1" />
						<f:selectItem itemLabel="每周" itemValue="2" />
						<f:selectItem itemLabel="每月" itemValue="3" />
					</p:selectOneRadio>
				</h:panelGroup>
				<h:panelGroup id="typeValueId1" rendered="#{maintainConfigController.selected.type==1}">
					<label class="label">检查频率(次)</label>
					<p:inputText value="#{maintainConfigController.perDayCount}" required="true" requiredMessage="检查频率(次)不能为空"></p:inputText>
				</h:panelGroup>
				<h:panelGroup id="typeValueId2" rendered="#{maintainConfigController.selected.type==2}">
					<label class="label">检查频率</label>
					<p:selectManyMenu value="#{maintainConfigController.listWeekDay}" var="t" required="true" requiredMessage="检查频率不能为空" showCheckbox="true">
						<f:selectItems value="#{maintainConfigController.checkListWeekDays}" var="item" itemLabel="#{item.key}" itemValue="#{item.intValue}" />
						<p:column>
							<h:outputText value="#{t==2?'星期一':t==3?'星期二':t==4?'星期三':t==5?'星期四':t==6?'星期五':t==7?'星期六':t==1?'星期日':''}" />
						</p:column>
					</p:selectManyMenu>
				</h:panelGroup>
				<h:panelGroup id="typeValueId3" rendered="#{maintainConfigController.selected.type==3}">
					<label class="label">检查频率</label>
					<p:selectManyMenu value="#{maintainConfigController.listMonthDay}" var="t" required="true" requiredMessage="检查频率不能为空" filter="true"
						filterMatchMode="contains" showCheckbox="true">
						<f:selectItems value="#{maintainConfigController.checkListMonthDays}" var="item" itemLabel="#{item.key}" itemValue="#{item.intValue}" />
						<p:column>
							<h:outputText value="#{t}日" />
						</p:column>
					</p:selectManyMenu>
				</h:panelGroup>
			</p:panelGrid>
            <p:fieldset>
                <ui:include src="assetList.xhtml"></ui:include>
            </p:fieldset>
			<br />
			<br />
			<p:commandButton id="saveButtonId" validateClient="true" value="#{msg.Save}" process="@parent" update=":growl,:maintainConfigListForm" icon="ui-icon-check"
				oncomplete="handleSubmitMaintainConfigEdit(args, 'maintainConfigCreateDialog')" actionListener="#{maintainConfigController.save}"
                disabled="#{maintainConfigController.saveDisable}" timeout="180000" />
			<p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('maintainConfigCreateDialog').hide()" />
		</h:form>
	</p:dialog>
	<p:dialog id="editOptionDialog" widgetVar="editOptionDialog"  modal="true" width="500" resizable="true" draggable="true"  appendTo="@(body)" header="#{msg.EditOption}">
		<h:form id="editOptionDialogForm" >
			<h:panelGroup id="display1" >
				<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
					<h:panelGroup >
						<label class="label">#{msg.key}</label>
						<p:inputText disabled="#{!maintainConfigController.createOption}" value="#{maintainConfigController.tableOption.key}" required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}" />
					</h:panelGroup>
					<h:panelGroup >
						<label class="label">#{msg.value}</label>
						<p:inputText value="#{maintainConfigController.tableOption.value}" required="true" requiredMessage="#{msg.value}#{msg.ValidationRequire}" />
					</h:panelGroup>

				</p:panelGrid>
				<br/>
				<h:panelGroup>
					<p:commandButton immediate="false" validateClient="true" actionListener="#{maintainConfigController.addOption()}" value="#{msg.Confirm}"  icon="ui-icon-check" update=":checkItemCreateForm:optionsTable   :checkItemCreateForm:DefaultValue :growl" oncomplete="handleSubmit(args, 'editOptionDialog');"/>
					<p:commandButton immediate="true" value="#{msg.Cancel}"  icon="ui-icon-cancel" onclick="PF('editOptionDialog').hide()"/>
				</h:panelGroup>
			</h:panelGroup>
		</h:form>
	</p:dialog>
	<p:dialog id="checkItemCreateDlg" widgetVar="checkItemCreateDlg" width="400" height="500" modal="true" resizable="true" draggable="true" appendTo="@(body)"
		header="日常检查设置">
		<h:form id="checkItemCreateForm" rendered="#{maintainConfigController.objCheckItem!=null}">
			<h:panelGroup id="display" class="checkItemCreateDlg">
				<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
					<h:panelGroup>
						<label>#{msg.name} *：</label>
<!--						<p:selectOneMenu  id="name" value="#{maintainConfigController.objCheckItem.name}" editable="true" filter="true" filterMatchMode="contains" autoWidth="200">-->
<!--							<p:ajax event="change" process="@this" listener="#{maintainConfigController.onSelectObjCheckItem}" update="checkItemCreateForm"></p:ajax>-->
<!--							<f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue=""/>-->
<!--							<f:selectItems value="#{maintainConfigController.listWholeCheckItems}" var="item" itemLabel="#{item.name} #{item.description} #{item.groupName}" itemValue="#{item.name}" />-->
<!--						</p:selectOneMenu>-->
						<p:inputText id="name"  value="#{maintainConfigController.objCheckItem.name}" disabled="#{maintainConfigController.objCheckItem.name ne null}"/>
					</h:panelGroup>
					<h:panelGroup>
						<label>分组：</label>
						<p:selectOneMenu disabled="#{maintainConfigController.disabled}" id="groupName" value="#{maintainConfigController.objCheckItem.groupName}" editable="true" filter="true" filterMatchMode="contains" autoWidth="200">
							<f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue=""/>
							<f:selectItems value="#{maintainConfigController.groupNames}"/>
						</p:selectOneMenu>
					</h:panelGroup>
					<h:panelGroup>
						<label>描述：</label>
						<p:inputText id="description" disabled="#{maintainConfigController.disabled}" value="#{maintainConfigController.objCheckItem.description}" />
					</h:panelGroup>
					<h:panelGroup >
						<label >#{msg.fieldType}：</label>
						<p:selectOneMenu disabled="#{maintainConfigController.disabled}" value="#{maintainConfigController.objCheckItem.fieldType}" >
							<p:ajax listener="#{maintainConfigController.onRuleChange}"   update="optionsTable DefaultValue requiredRadio"  />
							<f:selectItem itemLabel="无类型" itemValue=""/>
							<f:selectItem itemLabel="#{msg.ComponentTypeInputText}" itemValue="#{'Text'}"/>
							<f:selectItem itemLabel="#{msg.ComponentTypeNumber}" itemValue="#{'Number'}"/>
							<f:selectItem itemLabel="#{msg.ComponentTypeSelect}" itemValue="#{'Select'}"/>
							<f:selectItem itemLabel="#{msg.ComponentTypeDate}" itemValue="#{'Date'}"/>
						</p:selectOneMenu>
					</h:panelGroup>
					<h:panelGroup id="DefaultValue" >
						<c:if test="#{!maintainConfigController.dateType()}" disabled="#{maintainConfigController.disabled}">
							<label >默认值：</label>
						</c:if>
						<c:if test="#{maintainConfigController.objCheckItem.fieldType eq 'Text'}" >
							<p:inputText value="#{maintainConfigController.objCheckItem.defaultValue}" placeholder="#{maintainConfigController.objCheckItem.defaultValue}" disabled="#{maintainConfigController.disabled}"/>
						</c:if>
						<c:if test="#{maintainConfigController.objCheckItem.fieldType eq 'Number'}" >
							<p:inputNumber value="#{maintainConfigController.objCheckItem.defaultValue}" placeholder="#{maintainConfigController.objCheckItem.defaultValue}" disabled="#{maintainConfigController.disabled}"/>
						</c:if>
						<c:if test="#{maintainConfigController.objCheckItem.fieldType eq 'Select'}" >
							<p:selectOneMenu value="#{maintainConfigController.objCheckItem.defaultValue}" disabled="#{maintainConfigController.disabled}">
								<f:selectItem itemLabel="#{msg.selectOneMessage}"/>
								<f:selectItems value="#{maintainConfigController.objCheckItem.options}" var="option" itemLabel="#{option.value}" itemValue="#{option.key}"/>
							</p:selectOneMenu>
						</c:if>
					</h:panelGroup>
					<h:panelGroup id="optionsTable"  >
						<p:dataTable value="#{maintainConfigController.objCheckItem.options}" var="optionItem" rendered="#{maintainConfigController.objCheckItem.fieldType eq 'Select'}" emptyMessage="#{msg.noRecordFound}" >

							<f:facet name="header">
								<p:commandButton id="createButton1" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}"  actionListener="#{maintainConfigController.prepareAddOption()}" process="@this" update="editOptionDialogForm"  oncomplete="PF('editOptionDialog').show()" />
							</f:facet>
							<p:column headerText="#{msg.OptionIdentifier}" >
								<h:outputText value="#{optionItem.key}"/>
							</p:column>
							<p:column headerText="#{msg.OptionDisplayValue}" >
								<h:outputText value="#{optionItem.value}"/>
							</p:column>
							<p:column headerText="#{msg.Operation}" width="64" >
								<p:commandLink actionListener="#{maintainConfigController.prepareEditOption(optionItem)}" process="@this"  oncomplete="PF('editOptionDialog').show()" update=":checkItemCreateForm editOptionDialogForm" rendered="#{not empty optionItem.key}" disabled="#{maintainConfigController.disabled}"><span class="ui-icon ui-icon-pencil" /></p:commandLink>
								<p:commandLink actionListener="#{maintainConfigController.removeOption(optionItem)}" process="@this" update=":checkItemCreateForm:optionsTable :checkItemCreateForm:DefaultValue" rendered="#{not empty optionItem.key}" disabled="#{maintainConfigController.disabled}"><span class="ui-icon ui-icon-trash" /></p:commandLink>
							</p:column>
						</p:dataTable>
						<h:panelGroup id="requiredRadio">
							<c:if test="#{!maintainConfigController.emptyType()}" >
							<label class="label" style="font-size: medium; font-weight: bold">是否必填</label>
							<p:selectOneRadio id="enable" value="#{maintainConfigController.objCheckItem.required}" disabled="#{maintainConfigController.disabled}">
								<p:ajax event="change" process="@this" />
								<f:selectItem itemLabel="是" itemValue="true"/>
								<f:selectItem itemLabel="否" itemValue="false"/>
							</p:selectOneRadio>
							</c:if>
						</h:panelGroup>
					</h:panelGroup>
				</p:panelGrid>
				<p:commandButton validateClient="true" actionListener="#{maintainConfigController.saveCheckListItem}"
					update=":growl,:maintainConfigCreateForm:addCheckItem,:maintainConfigCreateForm:saveButtonId" value="#{msg.Save}" icon="ui-icon-check"
					oncomplete="handleSubmit(args, 'checkItemCreateDlg');" />
                 &nbsp;&nbsp;
                 <p:commandButton immediate="true"  value="#{msg.Cancel}" update=":maintainConfigCreateForm :checkItemCreateForm :editOptionDialogForm :growl" icon="ui-icon-cancel" onclick="PF('checkItemCreateDlg').hide()" />
			</h:panelGroup>
		</h:form>

		<h:outputScript>
			function handleSubmitMaintainConfigEdit(args,t){
				var complete = args.complete;
				if(complete==true) {
					PF(t).hide();
				}
			}
		</h:outputScript>
	</p:dialog>
	<ui:include src="configItemList.xhtml" />
</ui:composition>
</html>
