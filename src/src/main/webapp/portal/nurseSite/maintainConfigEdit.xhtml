<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">


<ui:composition>
	<p:dialog id="maintainConfigEditDlg" widgetVar="maintainConfigEditDialog" header="保养工单设置" height="600" width="950" appendTo="@(body)">
		<h:form id="maintainConfigEditForm"  rendered="#{maintainConfigController.selected!=null}">
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">名称*</label>
					<p:inputText value="#{maintainConfigController.selected.name}" required="true" requiredMessage="名称不能为空"></p:inputText>
				</h:panelGroup>
			</p:panelGrid>
			<p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">增加检查项*</label>
                    <p:dataTable id="addCheckList" value="#{maintainConfigController.listPairCheckItems}" var="item" widgetVar="addCheckList" lazy="false" paginator="false"
                                 rowKey="#{item.key}" rows="1000" emptyMessage="#{msg.noRecordFound}" style="width:900px">
                        <p:column headerText="#{msg.name}">
                            <h:outputText value="#{item.name}" />
                        </p:column>
                        <p:column headerText="备注">
                            <h:outputText value="#{item.description}" />
                        </p:column>
                        <p:column headerText="#{msg.Actions}">
                            <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" update=":checkItemDlg" oncomplete="PF('checkItemDlg').show()" rendered="#{empty item.name}"/>
                            <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{maintainConfigController.deleteItemDetail(item.name)}" update=":maintainConfigEditForm:addCheckList,:maintainConfigEditForm:saveButtonId" rendered="#{not empty item.name}"></p:commandButton>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>
            </p:panelGrid>
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">维护类型*</label>
					<p:selectOneRadio value="#{maintainConfigController.selected.type}" required="true" requiredMessage="保养报告类型不能为空" onclick="NurseSiteMaintain.showHide(this);" layout="responsive" columns="1">
						<p:ajax update=":maintainConfigEditForm:typeValueId" proocess="@this"></p:ajax>
						<f:selectItem itemLabel="每天" itemValue="1" />
						<f:selectItem itemLabel="每周" itemValue="2" />
					</p:selectOneRadio>
				</h:panelGroup>
				<h:panelGroup id="typeValueId">
					<span id="type1Span" style="#{maintainConfigController.selected.type==1?'display:block;':'display:none;'}">
						<label class="label">维护频率(次)</label>
						<!-- <p:selectManyMenu value="#{maintainConfigController.listCheckDate}" var="t" required="#{maintainConfigController.selected.type==1?true:false}" filter="true" filterMatchMode="contains" showCheckbox="true">
							<f:selectItems value="#{maintainConfigController.checkListHours}" var="item" itemLabel="#{item.key}" itemValue="#{item.intValue}" />
							<p:column>
								<h:outputText value="#{t}时" />
							</p:column>
						</p:selectManyMenu> -->
						<p:inputText value="#{maintainConfigController.perDayCount}" required="#{maintainConfigController.selected.type==1?true:false}"></p:inputText>
					</span>
					<span id="type2Span" style="#{maintainConfigController.selected.type==2?'display:block;':'display:none;'}">
						<label class="label">维护频率</label>
						<p:selectManyMenu value="#{maintainConfigController.listWeekDay}" var="t" required="#{maintainConfigController.selected.type==2?true:false}" showCheckbox="true">
							<f:selectItems value="#{maintainConfigController.checkListWeekDays}" var="item" itemLabel="#{item.key}" itemValue="#{item.intValue}" />
							<p:column>
								<h:outputText value="#{t==2?'星期一':t==3?'星期二':t==4?'星期三':t==5?'星期四':t==6?'星期五':t==7?'星期六':t==1?'星期日':''}" />
							</p:column>
						</p:selectManyMenu>
					</span>
					<span id="type3Span" style="display:none;">
						<label class="label">维护频率</label>
						<p:selectManyMenu value="#{maintainConfigController.listMonthDay}" var="t" required="#{maintainConfigController.selected.type==3?true:false}" filter="true" filterMatchMode="contains" showCheckbox="true">
							<f:selectItems value="#{maintainConfigController.checkListMonthDays}" var="item" itemLabel="#{item.key}" itemValue="#{item.intValue}" />
							<p:column>
								<h:outputText value="#{t}日" />
							</p:column>
						</p:selectManyMenu>
					</span>
				</h:panelGroup>
				<!-- <h:panelGroup>
					<label class="label">检查项*</label>
					<p:inputText value="#{maintainConfigController.selected.checkItems}" required="true" requiredMessage="检查项不能为空" placeholder="请输入检查项并以空格分割"></p:inputText>
				</h:panelGroup> -->
			</p:panelGrid>
			<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<!-- <label class="label">检查设备*</label>
					<p:selectManyMenu value="#{maintainConfigController.listCheckAssets}" var="t" required="true" converter="assetInfoConverter"
						filter="true" filterMatchMode="contains" showCheckbox="true" style="width:300px;">
						<f:selectItems value="#{maintainConfigController.checkListAssets}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
						<p:column>
							<h:outputText value="#{t.name} / #{t.departNum}" />
						</p:column>
					</p:selectManyMenu> -->
					<p:pickList id="AssetsPickList" value="#{maintainConfigController.availableAssets}" var="item"
                                itemValue="#{item}" itemLabel="#{item.name}" showCheckbox="false" responsive="true"
                                showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter"
                                required="false" requiredMessage="已选设备 #{msg.ValidationRequire}">
                        <f:facet name="sourceCaption">待选设备</f:facet>
                        <f:facet name="targetCaption">已选设备</f:facet>
                        <p:ajax event="transfer" listener="#{maintainConfigController.onAssetsTransfer}" />
                        <p:column style="float: left;width:25%;">
                            <h:outputText value="#{item.name}" />
                        </p:column>
                        <p:column style="float: left;width:30%;">
                            <h:outputText value="#{item.departNum}" />
                        </p:column>
                         <p:column style="float: left;width:25%;">
                            <h:outputText value="#{item.clinicalDeptName}" />
                        </p:column>
                        <p:column>
                            <h:outputText value="#{item.functionType}" />
                        </p:column>
                    </p:pickList>
				</h:panelGroup>
				<h:panelGroup rendered="#{maintainConfigController.selected.id!=null}">
					<label>覆盖历史未完成检查</label>
					<p:selectBooleanCheckbox value="#{maintainConfigController.blnModifyAll}"/>
				</h:panelGroup>
			</p:panelGrid>
			<br />
			<br />
			<p:commandButton id="saveButtonId" validateClient="true" value="#{msg.Save}" process="@parent"  update=":growl,:maintainConfigListForm" icon="ui-icon-check"
				oncomplete="PF('maintainConfigEditDialog').hide()" action="#{maintainConfigController.save}" disabled="#{maintainConfigController.saveDisable}"/>
			<p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('maintainConfigEditDialog').hide()" />
		</h:form>
	</p:dialog>
	<ui:include src="checkItemEdit.xhtml" />
</ui:composition>
</html>
