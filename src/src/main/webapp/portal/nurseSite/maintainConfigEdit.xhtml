<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


<ui:composition>
	<p:dialog id="maintainConfigEditDlg" widgetVar="maintainConfigEditDialog" header="日常检查设置" height="600" width="1150" appendTo="@(body)" maximizable="true">
		<h:form id="maintainConfigEditForm" rendered="#{maintainConfigController.selected!=null}">
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">名称*</label>
					<p:inputText value="#{maintainConfigController.selected.name}" required="true" requiredMessage="名称不能为空"></p:inputText>
				</h:panelGroup>
			</p:panelGrid>
			<p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
				<h:panelGroup>
					<label class="label">增加检查项*</label>
					<p:dataTable id="addCheckItem2" value="#{maintainConfigController.listPairCheckItems}" var="item" widgetVar="addCheckItem2" lazy="false" paginator="true"
					    selection="#{maintainConfigController.objCheckItem}" selectionMode="single"
					    paginatorTemplate="{Toolbar}"  paginatorPosition="top" paginatorAlwaysVisible="true"
						rowKey="#{item.key}" rows="1000" emptyMessage="#{msg.noRecordFound}" style="width:600px">
						<p:ajax event="rowSelect"  update="createButton2 editButton2 deleteButton2 moveUp2 moveDown2" />
						<p:column headerText="#{msg.name}">
							<h:outputText value="#{item.name}" />
						</p:column>
						<p:column headerText="分组">
							<h:outputText value="#{item.groupName}" />
						</p:column>
						<p:column headerText="描述">
							<h:outputText value="#{item.description}" />
						</p:column>
						<p:column headerText="类型">
							<h:outputText value="#{item.fieldTypeStr()}" />
						</p:column>
						<p:column headerText="默认值">
							<h:outputText rendered="#{(item.fieldType ne 'Select')}" value="#{item.defaultValue}" />
							<h:outputText rendered="#{item.fieldType eq 'Select'}" value="#{item.optionStr()}" />
						</p:column>
						<p:column headerText="是否必填">
							<h:outputText value="#{empty item.name?'':item.required?'是':'否'}" />
						</p:column>
						<f:facet name="{Toolbar}">
							<p:commandButton id="bacth" process="@this" icon="fa fa-cogs" style="zoom:0.8;" title="批量添加" update=":batchAdd"
											 actionListener="#{maintainConfigController.setSelectAll()}" oncomplete="PF('batchAdd').show()"  />
							<p:commandButton id="createButton2" process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" update=":checkItemEditDlg"
								 actionListener="#{maintainConfigController.createObjCheckItem}" oncomplete="PF('checkItemEditDlg').show()" rendered="#{empty item.name}" />
							<p:commandButton id="editButton2"   icon="ui-icon-edit" style="zoom:0.8;" title="#{msg.Edit}"
								 update=":checkItemEditDlg" oncomplete="PF('checkItemEditDlg').show()"
								disabled="#{maintainConfigController.objCheckItem eq null or maintainConfigController.objCheckItem.id ne null}"/>
							<p:commandButton id="deleteButton2" process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}"
								actionListener="#{maintainConfigController.deleteItemDetail()}" update=":maintainConfigEditForm:addCheckItem2,:maintainConfigEditForm:saveButtonId"
								 disabled="#{maintainConfigController.objCheckItem eq null}"/>
							<p:commandButton id="moveUp2" process="@this" icon="ui-icon-arrow-upward" style="zoom:0.8;"  title="上移"
											 actionListener="#{maintainConfigController.checkItemMoveUp()}"
											 update=":maintainConfigEditForm:addCheckItem2,:maintainConfigCreateForm:saveButtonId"	disabled="#{maintainConfigController.objCheckItem eq null}" />
							<p:commandButton id="moveDown2" process="@this" icon="ui-icon-arrow-downward" style="zoom:0.8;"  title="下移"
											 actionListener="#{maintainConfigController.checkItemMoveDown()}"
											 update=":maintainConfigEditForm:addCheckItem2,:maintainConfigCreateForm:saveButtonId" disabled="#{maintainConfigController.objCheckItem eq null}"  />
						</f:facet>
					</p:dataTable>
				</h:panelGroup>
			</p:panelGrid>
			<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" id="idTypeGroup">
				<h:panelGroup>
					<label class="label">检查类型*</label>
					<p:selectOneRadio value="#{maintainConfigController.selected.type}" required="true" requiredMessage="检查类型不能为空" layout="responsive" columns="1">
						<p:ajax event="change" update=":maintainConfigEditForm:idTypeGroup" process="@this"></p:ajax>
						<f:selectItem itemLabel="每天" itemValue="1" />
						<f:selectItem itemLabel="每周" itemValue="2" />
						<f:selectItem itemLabel="每月" itemValue="3" />
					</p:selectOneRadio>
				</h:panelGroup>
				<h:panelGroup id="typeValueId1" rendered="#{maintainConfigController.selected.type==1}">
					<label class="label">检查频率(次)</label>
					<p:inputText value="#{maintainConfigController.perDayCount}" required="true"
						requiredMessage="检查频率(次)不能为空"></p:inputText>
				</h:panelGroup>
				<h:panelGroup id="typeValueId2" rendered="#{maintainConfigController.selected.type==2}">
					<label class="label">检查频率</label>
					<p:selectManyMenu value="#{maintainConfigController.listWeekDay}" var="t" required="true"
						requiredMessage="检查频率不能为空" showCheckbox="true">
						<f:selectItems value="#{maintainConfigController.checkListWeekDays}" var="item" itemLabel="#{item.key}" itemValue="#{item.intValue}" />
						<p:column>
							<h:outputText value="#{t==2?'星期一':t==3?'星期二':t==4?'星期三':t==5?'星期四':t==6?'星期五':t==7?'星期六':t==1?'星期日':''}" />
						</p:column>
					</p:selectManyMenu>
				</h:panelGroup>
				<h:panelGroup id="typeValueId3" rendered="#{maintainConfigController.selected.type==3}">
					<label class="label">检查频率</label>
					<p:selectManyMenu value="#{maintainConfigController.listMonthDay}" var="t" required="true"
						requiredMessage="检查频率不能为空" filter="true" filterMatchMode="contains" showCheckbox="true">
						<f:selectItems value="#{maintainConfigController.checkListMonthDays}" var="item" itemLabel="#{item.key}" itemValue="#{item.intValue}" />
						<p:column>
							<h:outputText value="#{t}日" />
						</p:column>
					</p:selectManyMenu>
				</h:panelGroup>
			</p:panelGrid>
			<h:panelGroup>
				<p:fieldset>
					<ui:include src="assetList.xhtml"></ui:include>
				</p:fieldset>
			</h:panelGroup>
			<h:panelGroup id="applyPanel" rendered="#{maintainConfigController.selected.id!=null}">
				<p:selectBooleanCheckbox value="#{maintainConfigController.selected.applyDirectly}" label="覆盖历史未完成检查">
					<p:ajax process="@this" listener="#{maintainConfigController.applyChange(1)}" update=":maintainConfigEditForm:applyPanel"></p:ajax>
				</p:selectBooleanCheckbox>
				<p:selectBooleanCheckbox value="#{maintainConfigController.selected.applyFeatureData}" label="修改将来未完成检查">
					<p:ajax process="@this" listener="#{maintainConfigController.applyChange(2)}" update=":maintainConfigEditForm:applyPanel"></p:ajax>
				</p:selectBooleanCheckbox>
			</h:panelGroup>
			<br />
			<br />
			<p:commandButton id="saveButtonId" validateClient="true" value="#{msg.Save}" process="@parent" update=":growl,:maintainConfigListForm" icon="ui-icon-check"
				oncomplete="handleSubmitMaintainConfigEdit(args, 'maintainConfigEditDialog')" action="#{maintainConfigController.update}"
				disabled="#{maintainConfigController.saveDisable}" timeout="180000" />
			<p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('maintainConfigEditDialog').hide()" />
		</h:form>
	</p:dialog>
	<p:dialog id="editOptionDialog1" widgetVar="editOptionDialog1"  modal="true" width="500" resizable="true" draggable="true"  appendTo="@(body)" header="#{msg.EditOption}">
		<h:form id="editOptionDialogForm1" >
			<h:panelGroup id="display1" >
				<p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
					<h:panelGroup >
						<label class="label">#{msg.key}</label>
						<p:inputText disabled="#{!maintainConfigController.createOption}" value="#{maintainConfigController.tableOption.key}" required="true" requiredMessage="#{msg.name}#{msg.ValidationRequire}" />
					</h:panelGroup>
					<h:panelGroup >
						<label class="label">#{msg.value}</label>
						<p:inputText value="#{maintainConfigController.tableOption.value}" required="true" requiredMessage="#{msg.value}#{msg.ValidationRequire}" />
					</h:panelGroup>

				</p:panelGrid>
				<br/>
				<h:panelGroup>
					<p:commandButton immediate="false" validateClient="true" actionListener="#{maintainConfigController.addOption()}" value="#{msg.Confirm}"  icon="ui-icon-check" update=":checkItemEditForm:optionsTable   :checkItemEditForm:DefaultValue :growl" oncomplete="handleSubmit(args, 'editOptionDialog1');"/>
					<p:commandButton immediate="true" value="#{msg.Cancel}"  icon="ui-icon-cancel" onclick="PF('editOptionDialog1').hide()"/>
				</h:panelGroup>
			</h:panelGroup>
		</h:form>
	</p:dialog>
	<p:dialog id="checkItemEditDlg" widgetVar="checkItemEditDlg" width="450" height="500" modal="true" resizable="true" draggable="true" appendTo="@(body)"
		header="日常检查项配置">
		<h:form id="checkItemEditForm" rendered="#{maintainConfigController.objCheckItem!=null}">
			<h:panelGroup id="display" class="checkItemEditDlg">
				<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
					<h:panelGroup>
						<label>#{msg.name} *：</label>
<!--						<p:selectOneMenu  id="name" value="#{maintainConfigController.objCheckItem.name}" editable="true" filter="true" filterMatchMode="LIKE" autoWidth="200">-->
<!--							<p:ajax event="change" process="@this" listener="#{maintainConfigController.onSelectObjCheckItem}" update="checkItemEditForm"></p:ajax>-->
<!--							<f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue=""/>-->
<!--							<f:selectItems value="#{maintainConfigController.listWholeCheckItems}" var="item" itemLabel="#{item.name} #{item.description} #{item.groupName}" itemValue="#{item.name}" />-->
<!--						</p:selectOneMenu>-->
						<p:inputText id="name"  value="#{maintainConfigController.objCheckItem.name}" disabled="#{maintainConfigController.objCheckItem.name ne null}" />
					</h:panelGroup>
					<h:panelGroup>
						<label>分组：</label>
						<p:selectOneMenu disabled="#{maintainConfigController.disabled}" id="groupName" value="#{maintainConfigController.objCheckItem.groupName}" editable="true" filter="true" filterMatchMode="contains" autoWidth="200">
							<f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue=""/>
							<f:selectItems value="#{maintainConfigController.groupNames}"/>
						</p:selectOneMenu>
					</h:panelGroup>
					<h:panelGroup>
						<label>描述：</label>
						<p:inputText id="description" value="#{maintainConfigController.objCheckItem.description}" disabled="#{maintainConfigController.disabled}" />
					</h:panelGroup>
					<h:panelGroup >
						<label >#{msg.fieldType}：</label>
						<p:selectOneMenu value="#{maintainConfigController.objCheckItem.fieldType}" disabled="#{maintainConfigController.disabled}" >
							<p:ajax  listener="#{maintainConfigController.onRuleChange}" update="optionsTable DefaultValue requiredRadio"  />
							<f:selectItem itemLabel="无类型" itemValue=""/>
							<f:selectItem itemLabel="#{msg.ComponentTypeInputText}" itemValue="#{'Text'}"/>
							<f:selectItem itemLabel="#{msg.ComponentTypeNumber}" itemValue="#{'Number'}"/>
							<f:selectItem itemLabel="#{msg.ComponentTypeSelect}" itemValue="#{'Select'}"/>
							<f:selectItem itemLabel="#{msg.ComponentTypeDate}" itemValue="#{'Date'}"/>
						</p:selectOneMenu>
					</h:panelGroup>
					<h:panelGroup id="DefaultValue" >
						<c:if test="#{!maintainConfigController.dateType()}" >
							<label >默认值：</label>
						</c:if>
						<c:if test="#{maintainConfigController.objCheckItem.fieldType eq 'Text'}" >
							<p:inputText value="#{maintainConfigController.objCheckItem.defaultValue}" placeholder="#{maintainConfigController.objCheckItem.defaultValue}" disabled="#{maintainConfigController.disabled}" />
						</c:if>
						<c:if test="#{maintainConfigController.objCheckItem.fieldType eq 'Number'}" >
							<p:inputNumber value="#{maintainConfigController.objCheckItem.defaultValue}" placeholder="#{maintainConfigController.objCheckItem.defaultValue}" disabled="#{maintainConfigController.disabled}" />
						</c:if>
						<c:if test="#{maintainConfigController.objCheckItem.fieldType eq 'Select'}" >
							<p:selectOneMenu value="#{maintainConfigController.objCheckItem.defaultValue}" disabled="#{maintainConfigController.disabled}">
								<f:selectItem itemLabel="#{msg.selectOneMessage}"/>
								<f:selectItems value="#{maintainConfigController.objCheckItem.options}" var="option" itemLabel="#{option.value}" itemValue="#{option.key}"/>
							</p:selectOneMenu>
						</c:if>
					</h:panelGroup>
					<h:panelGroup id="optionsTable"  >
						<p:dataTable value="#{maintainConfigController.objCheckItem.options}" var="optionItem" rendered="#{maintainConfigController.objCheckItem.fieldType eq 'Select'}" disabled="#{maintainConfigController.disabled}" emptyMessage="#{msg.noRecordFound}" >

							<f:facet name="header">
								<p:commandButton id="createButton1" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}"  actionListener="#{maintainConfigController.prepareAddOption()}" process="@this" update="editOptionDialogForm1"  oncomplete="PF('editOptionDialog1').show()" />
							</f:facet>
							<p:column headerText="#{msg.OptionIdentifier}" >
								<h:outputText value="#{optionItem.key}"/>
							</p:column>
							<p:column headerText="#{msg.OptionDisplayValue}" >
								<h:outputText value="#{optionItem.value}"/>
							</p:column>
							<p:column headerText="#{msg.Operation}" width="64" >
								<p:commandLink actionListener="#{maintainConfigController.prepareEditOption(optionItem)}" process="@this"  oncomplete="PF('editOptionDialog1').show()" update=":checkItemEditForm editOptionDialogForm1" rendered="#{not empty optionItem.key}" disabled="#{maintainConfigController.disabled}"><span class="ui-icon ui-icon-pencil" /></p:commandLink>
								<p:commandLink actionListener="#{maintainConfigController.removeOption(optionItem)}" process="@this" update=":checkItemEditForm:optionsTable :checkItemEditForm:DefaultValue" rendered="#{not empty optionItem.key}" disabled="#{maintainConfigController.disabled}"><span class="ui-icon ui-icon-trash" /></p:commandLink>
							</p:column>
						</p:dataTable>
						<h:panelGroup id="requiredRadio">
							<c:if test="#{!maintainConfigController.emptyType()}">
							<label class="label" style="font-size: medium; font-weight: bold">是否必填</label>
							<p:selectOneRadio id="enable" value="#{maintainConfigController.objCheckItem.required}" disabled="#{maintainConfigController.disabled}">
								<p:ajax event="change" process="@this" />
								<f:selectItem itemLabel="是" itemValue="true"/>
								<f:selectItem itemLabel="否" itemValue="false"/>
							</p:selectOneRadio>
							</c:if>
						</h:panelGroup>
					</h:panelGroup>
				</p:panelGrid>
				<p:commandButton validateClient="true" actionListener="#{maintainConfigController.saveCheckListItem}"
					update=":growl,:maintainConfigEditForm:addCheckItem2,:maintainConfigEditForm:saveButtonId" value="#{msg.Save}" icon="ui-icon-check"
					oncomplete="handleSubmit(args, 'checkItemEditDlg');" />
                 &nbsp;&nbsp;
                 <p:commandButton  immediate="true"  value="#{msg.Cancel}" update=":growl,:maintainConfigEditForm:addCheckItem2,:maintainConfigEditForm:saveButtonId" icon="ui-icon-cancel" onclick="PF('checkItemEditDlg').hide()" />
			</h:panelGroup>
		</h:form>

		<h:outputScript>
			function handleSubmitMaintainConfigEdit(args,t){
				var complete = args.complete;
				if(complete==true) {
					PF(t).hide();
                }
			}
		</h:outputScript>
	</p:dialog>
</ui:composition>
</html>
