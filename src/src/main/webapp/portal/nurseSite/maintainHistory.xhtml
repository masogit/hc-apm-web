<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:form id="historyDataForm">
    <p:fieldset legend="#{msg.FilterCondition}">
        <p:panelGrid columns="8" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">开始时间*</label>
                <p:calendar timeZone="GMT+8" id="startTime" value="#{maintainHistoryController.startDate}"
                            pattern="yyyy/MM/dd" required="true" requiredMessage="开始时间 #{msg.ValidationRequire}"
                            showOn="button" showButtonPanel="true" navigator="true" mask="true" maxdate="#{maintainHistoryController.getMaxDate()}"/>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">截至时间*</label>
                <p:calendar timeZone="GMT+8" id="endTime" value="#{maintainHistoryController.endDate}"
                            pattern="yyyy/MM/dd" required="true" requiredMessage="结束时间 #{msg.ValidationRequire}"
                            showOn="button" showButtonPanel="true" navigator="true" mask="true" maxdate="#{maintainHistoryController.getMaxDate()}"/>
            </h:panelGroup>
        </p:panelGrid>
        <p:panelGrid columns="6" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <label class="label">所属院区</label>
                <p:inputText id="idCSHisSelectedOrgName" value="#{maintainHistoryController.selectedOrg.name}" readonly="true" required="true"
                             requiredMessage="#{msg.orgId} #{msg.ValidationRequire}" />
                <p:commandButton id="btnHisOrg" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;" />
                <p:overlayPanel id="idCSHisPanelOrg" widgetVar="varCSHisPanelOrg" for="btnHisOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel"
                                style="width:300px;" modal="false">
                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                        <p:tree id="idCSHisTreeUser" class="tree" style="width:98%;border:0;" value="#{maintainHistoryController.orgTree}" selection="#{maintainHistoryController.selectedNode}"
                                var="node" selectionMode="single">
                            <p:ajax process="@this" event="select"
                                    update="@parent:idCSHisSelectedOrgName,@parent:idCSHisClinicalOrgInfo"
                                    listener="#{maintainHistoryController.onSelectOrgTree}" oncomplete="PF('varCSHisPanelOrg').hide();" />
                            <p:ajax process="@this" event="expand" />
                            <p:ajax process="@this" event="collapse" />
                            <p:treeNode type="org">
                                <h:outputText value="#{node}" />
                            </p:treeNode>
                            <p:treeNode type="hidden" rendered="false"/>
                        </p:tree>
                    </p:scrollPanel>
                </p:overlayPanel>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">所属科室</label>
                <p:selectOneMenu id="idCSHisClinicalOrgInfo" value="#{maintainHistoryController.selectedOrgDepart}" disabled="false" converter="orgInfoColumnFilterConverter"
                                 style="width:100%;" filter="true" filterMatchMode="contains">
                    <f:selectItems value="#{maintainHistoryController.listOrgDept}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
                </p:selectOneMenu>
            </h:panelGroup>
            <h:panelGroup rendered="#{userContextService.enableDisplayByKey('dailyCheckDeptFilter')}">
                <label class="label">使用科室</label>
                <p:selectOneMenu id="idCSHisAssetDeptInfo" value="#{maintainHistoryController.selectedAssetDept}" disabled="false" converter="orgInfoColumnFilterConverter"
                                 style="width:100%;" filter="true" filterMatchMode="contains">
                    <f:selectItems value="#{maintainHistoryController.listOrgDept}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
                </p:selectOneMenu>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">日常检查名称</label>
                <p:selectOneMenu id="configName" value="#{maintainHistoryController.selectedConfig}" disabled="false" converter="nurseSiteMaintainConfigConverter"
                                 style="width:100%;" filter="true" filterMatchMode="contains">
                    <f:selectItems value="#{maintainHistoryController.listConfig}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
                </p:selectOneMenu>
            </h:panelGroup>
            <h:panelGroup>
                <label class="label">状态</label>
                <p:selectOneMenu id="status" value="#{maintainHistoryController.status}" disabled="false" style="width:100%;">
                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                    <f:selectItem itemLabel="未检查" itemValue="(0)"/>
                    <f:selectItem itemLabel="进行中" itemValue="(4)"/>
                    <f:selectItem itemLabel="已通过" itemValue="(2,5,6,7)"/>
                    <f:selectItem itemLabel="有问题" itemValue="(3,8,9)"/>
                </p:selectOneMenu>
            </h:panelGroup>
        </p:panelGrid>
    </p:fieldset>

    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
        <h:panelGroup>
            <p:commandButton value="预览结果" actionListener="#{maintainHistoryController.previewData}"
                             icon="ui-icon-arrowthick-1-s" validateClient="true"
                             update=":growl :maintainExportTab:dataListHistoryForm" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_HISTORY_VIEW')}">
            </p:commandButton>
        </h:panelGroup>
    </p:panelGrid>
</h:form>

<h:form id="dataListHistoryForm">
    <p:dataTable id="datalist" rendered="#{not empty maintainHistoryController.listMaintainData}"
                 value="#{maintainHistoryController.listMaintainData}" var="item"
                 selection="#{maintainHistoryController.selectedListMaintain}"
                 rowKey="#{item.id}" lazy="false" paginator="true" paginatorPosition="both"
                 paginatorAlwaysVisible="true"
                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20"
                 emptyMessage="#{msg.noRecordFound}"
                 rowsPerPageTemplate="20,50,100,500">
        <p:column selectionMode="multiple" style="width:50px;text-align:center" exportable="false"/>
        <p:column headerText="名称">
            <h:outputText value="#{item.getShowTitle()}"/>
        </p:column>
        <p:column headerText="负责人">
            <h:outputText value="#{item.modifyBy.name}"/>
        </p:column>
        <p:column headerText="计划检查日期">
            <h:outputText value="#{item.scheduleDate}">
            	<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
            </h:outputText>
        </p:column>
        <p:column headerText="实际检查日期">
            <h:outputText value="#{item.checkDate}">
            	<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm:ss" />
            </h:outputText>
        </p:column>
        <p:column headerText="状态">
            <h:outputText value="#{fieldMsg.fieldValue('nurseSiteMaintainStatus', item.status)}"/>
        </p:column>
        <p:column headerText="创建人">
            <h:outputText value="#{item.createBy.name}"/>
        </p:column>
       
        <f:facet name="{Toolbar}">
            <p:commandButton value="报表全部导出" actionListener="#{maintainHistoryController.exportAll()}" icon="ui-icon-arrowthick-1-s" ajax="false" validateClient="true" update=":growl" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_HISTORY_VIEW')}">
                <p:fileDownload value="#{maintainHistoryController.exportFile}"/>
            </p:commandButton>
            <p:commandButton value="报表选择导出" actionListener="#{maintainHistoryController.exportSelected()}" icon="ui-icon-arrowthick-1-s" ajax="false" validateClient="true" update=":growl" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_HISTORY_VIEW')}">
                <p:fileDownload value="#{maintainHistoryController.exportFile}"/>
            </p:commandButton>
            <p:commandButton ajax="false" value="详情全部导出"
                             actionListener="#{maintainHistoryController.exportAllDetail()}"
                             icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_HISTORY_VIEW')}">
                <p:fileDownload value="#{maintainHistoryController.exportFile}"/>
            </p:commandButton>
            <p:commandButton ajax="false" value="详情选择导出"
                             actionListener="#{maintainHistoryController.exportSelectedDetail()}"
                             icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_HISTORY_VIEW')}">
                <p:fileDownload value="#{maintainHistoryController.exportFile}"/>
            </p:commandButton>
            <p:commandButton ajax="false" value="Word全部导出"
                             actionListener="#{maintainHistoryController.exportAll2Docx()}"
                             icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_HISTORY_VIEW')}">
                <p:fileDownload value="#{maintainHistoryController.exportFile}"/>
            </p:commandButton>
            <p:commandButton ajax="false" value="Word选择导出"
                             actionListener="#{maintainHistoryController.exportSelected2Docx()}"
                             icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl" rendered="#{userContextService.accessContainsFunctionMenu('NURSESITE_HISTORY_VIEW')}">
                <p:fileDownload value="#{maintainHistoryController.exportFile}"/>
            </p:commandButton>
        </f:facet>
    </p:dataTable>
</h:form>
</html>
