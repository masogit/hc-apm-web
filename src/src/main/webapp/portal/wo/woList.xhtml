<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="preRenderView">
        <!--        <f:metadata>
                    <f:viewParam name="isClosed" value="#{workOrderController.filterIsClosed}"/>
                    <f:viewParam name="aid" value="#{workOrderController.filterAssetId}"/>
                </f:metadata>
                <f:event type="preRenderView" listener="#{workOrderController.setViewFilter()}"/>-->
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet name="css/wo_steps.css" />
    </ui:define>

    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.WorkOrder} #{msg.List}"/>
            </div>

            <div class="ui-g-12 card">
                <p:messages autoUpdate="true" closable="true" showDetail="false"/>

                <h:form id="woListForm">
                    <p:dataTable id="datalist" value="#{workOrderFromReportController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{workOrderFromReportController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" listener="#{workOrderFromReportController.onSelectServiceRequest}" update=":WorkOrderEditForm"/>
                        <p:ajax event="filter" listener="#{workOrderFromReportController.onFilter}" update="datalist :WorkOrderEditForm"/>

                        <p:column styleClass="textCenter"  headerText="#{msg.casePriority}" sortBy="#{item.serviceRequest.casePriority}" filterBy="#{item.serviceRequest.casePriority}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('casePriority')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.serviceRequest.casePriority}" class="priorityItem priorityItem#{item.serviceRequest.casePriority}"/>
                        </p:column>
                        <p:column headerText="#{msg.requestTime}" sortBy="#{item.serviceRequest.requestTime}" filterBy="#{item.serviceRequest.requestTime}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterRequestTime" widgetVar="varFilterRequestTime"/>
                            </f:facet>
                            <h:outputText value="#{item.serviceRequest.requestTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.requestorName}" sortBy="#{item.serviceRequest.requestorName}" filterBy="#{item.requestorId}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{workOrderFromReportController.usersInHospital}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.serviceRequest.requestorName}"/>
                        </p:column>
                        <p:column headerText="#{msg.clinicalDeptName}" >
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{workOrderFromReportController.clinicalDeptNameList}" var="item" itemLabel="#{item}" itemValue="#{item}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.assetInfo.clinicalDeptName}"/>
                        </p:column>
                        <p:column headerText="#{msg.assetName}" sortBy="#{item.assetInfo.name}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.name}"/>
                        </p:column><!--
-->                        <p:column headerText="#{msg.requestReason}" sortBy="#{item.patProblems}" filterBy="#{item.serviceRequest.requestReason}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.serviceRequest.requestReason}" title="#{item.serviceRequest.requestReason}"/>
                        </p:column><!--
    -->                        <p:column headerText="#{msg.status}" sortBy="#{item.status}" filterBy="#{item.status}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('status')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{fieldMsg.fieldValue('status', item.status)}"/>
                        </p:column>

                    </p:dataTable>
                </h:form>

                <ui:include src="srView.xhtml"/>

            </div>
        </div>

    </ui:define>

</ui:composition>
