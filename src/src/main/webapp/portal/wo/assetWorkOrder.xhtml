<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.EquipmentRepairStatistics}"/>
            </div>

            <div class="ui-g-12 card">

                <h:form id="searchForm">
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.hospitalId}</label>
                                <p:inputText id="selectedOrgName"
                                             value="#{assetWorkOrderController.selectedOrg==null ? '': assetWorkOrderController.selectedOrg.name}"
                                             readonly="true" required="true" requiredMessage="#{msg.SiteCannotBeEmpty}"/>
                                <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down"
                                                 class="btn btn-sm popupIconButton"/>
                                <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false"
                                                style="width:300px" modal="false">
                                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;"
                                                value="#{assetWorkOrderController.orgTree}"
                                                selection="#{assetWorkOrderController.selectedNode}" var="node"
                                                selectionMode="single">
                                            <p:ajax process="@this" event="select" update=":searchForm:selectedOrgName :searchForm:clinicalDeptName :searchForm:fromDeptName" listener="#{assetWorkOrderController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>

                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
											<p:treeNode type="hidden" rendered="false"/>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.clinicalDeptName}</label>
                                <p:autoComplete id="clinicalDeptName" dropdown="true" value="#{assetWorkOrderController.filterDeptOrg}"
                                                scrollHeight="300"  forceSelection="true" completeMethod="#{assetWorkOrderController.autoCompleteDept}"
                                                var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" class="SiteUIDChange">
                                </p:autoComplete>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.assetDeptName}</label>
                                <p:autoComplete id="fromDeptName" dropdown="true" value="#{assetWorkOrderController.filterFromDeptOrg}"
                                                scrollHeight="300"  forceSelection="true" completeMethod="#{assetWorkOrderController.autoCompleteDept}"
                                                var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" class="SiteUIDChange">
                                </p:autoComplete>
                            </h:panelGroup>

                        </p:panelGrid>

                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.assetGroup}</label>
                                <p:selectOneMenu id="assetGroup" value="#{assetWorkOrderController.filterAssetGroup}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.RequestStartTime}</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" id="startDate" value="#{assetWorkOrderController.startDate}"
                                             required="false" requiredMessage="#{msg.StartTime} #{msg.ValidationRequire}"
                                            showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.RequestEndTime}</label>
                                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" id="endDate" value="#{assetWorkOrderController.endDate}"
                                             required="false" requiredMessage="#{msg.EndTime} #{msg.ValidationRequire}"
                                            showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{assetWorkOrderController.enableAssetTypeGroup}">
                                <label class="label">#{msg.assetTypeGroup}</label>
                                <p:autoComplete dropdown="true" value="#{assetWorkOrderController.filterAssetTypeName}"
                                                scrollHeight="300"  forceSelection="true" completeMethod="#{assetWorkOrderController.completeAssetTypeGroupList}">
                                    <p:ajax event="itemSelect" listener="#{assetWorkOrderController.onAssetTypeGroupChange}" />
                                    <p:ajax listener="#{assetWorkOrderController.onAssetTypeGroupChange}" />
                                </p:autoComplete>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <p:inputText id="searchText" value="#{assetWorkOrderController.searchStr}" placeholder="#{msg.name}/#{msg.functionType}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}" maxlength="100" style="width: 500px"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <p:commandButton value="#{msg.SearchResult}" actionListener="#{assetWorkOrderController.loadData}" icon="ui-icon-arrowthick-1-s" validateClient="false" update=":growl :assetWorkOrderListForm:datalist">
                            </p:commandButton>
                        </h:panelGroup>
                    </p:panelGrid>

                </h:form>
                <h:form id="assetWorkOrderListForm">
                    <p:dataTable id="datalist" value="#{assetWorkOrderController.assetWorkOrderList}" var="item"
                                 rowKey="#{item.uid}" lazy="false" paginator="true" paginatorPosition="both"
                                 paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20"
                                 emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}">
                            <p:link  href="#{item.linkUrl}" value="#{item.name}" target="_blank" />
                        </p:column>
                        <p:column headerText="#{msg.functionType}">
                            <h:outputText value="#{item.functionType}" title="#{item.functionType}"/>
                        </p:column>
                        <p:column headerText="#{msg.serialNum}">
                            <h:outputText value="#{item.serialNum}" title="#{item.serialNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.financingNum}">
                            <h:outputText value="#{item.financingNum}" title="#{item.financingNum}" />
                        </p:column>
                        <p:column headerText="#{msg.assetGroup}">
                            <h:outputText value="#{item.assetGroupName}" title="#{item.assetGroupName}" />
                        </p:column>
                        <p:column headerText="#{msg.hospitalId}">
                            <h:outputText value="#{item.siteName}" title="#{item.siteName}" />
                        </p:column>
                        <p:column headerText="#{msg.clinicalDeptId}">
                            <h:outputText value="#{item.clinicalDeptName}" title="#{item.clinicalDeptName}" />
                        </p:column>
                        <p:column headerText="#{msg.assetDeptName}">
                            <h:outputText value="#{item.fromDeptName}" title="#{item.fromDeptName}" />
                        </p:column>
                        <p:column headerText="#{msg.QRCode}">
                            <h:outputText value="#{item.qrCode}" title="#{item.qrCode}" />
                        </p:column>
                        <p:column headerText="#{msg.WorkorderQuantity}">
<!--                            <p:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default" action="#{urlEncryptController.encodeUrlParam('/portal/woMgr/workOrderList?faces-redirect=true&amp;query=12&amp;queryAssetUID='.concat(item.uid))}" target="_Blank">-->
                                <h:outputText value="#{item.workOrderCount}" title="#{item.workOrderCount}" />
<!--                            </p:commandLink>-->
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="AssetWorkOrder_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
