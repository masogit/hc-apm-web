<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="维修工单报表导出"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="exportDataForm">
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <!--<h:panelGroup >
                                <label class="label">集团</label>
                                <p:selectOneMenu id="institution" value="#{workOrderReportExportController.currentInstitutionUID}" disabled="true">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue=""/>
                                    <f:selectItems value="#{workOrderReportExportController.getInstitutionList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">医院</label>
                                <p:selectOneMenu id="hospital" value="#{workOrderReportExportController.currentHospitalUID}">
                                    <p:ajax  listener="#{workOrderReportExportController.filterSiteByHospital()}" update="site" />
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue=""/>
                                    <f:selectItems value="#{workOrderReportExportController.getHospitalList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                            <h:panelGroup >
                                <label class="label">院区</label>
                                <p:selectOneMenu id="site" value="#{workOrderReportExportController.currentSiteUID}">
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue=""/>
                                    <f:selectItems value="#{workOrderReportExportController.getSiteList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>-->
                            <h:panelGroup>
                                <label class="label">*#{msg.hospitalId}</label>
                                <p:inputText id="selectedOrgName" value="#{workOrderReportExportController.selectedOrg==null ? '': workOrderReportExportController.selectedOrg.name}" readonly="true" required="true" requiredMessage="所属院区不能为空" />
                                <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton"/>
                                <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" style="width:300px" modal="false">
                                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{workOrderReportExportController.orgTree}" selection="#{workOrderReportExportController.selectedNode}" var="node" selectionMode="single">
                                            <p:ajax process="@this" event="select" update=":exportDataForm:selectedOrgName" listener="#{workOrderReportExportController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                            <p:ajax process="@this" event="expand"/>
                                            <p:ajax process="@this" event="collapse"/>

                                            <p:treeNode type="org">
                                                <h:outputText value="#{node}"/>
                                            </p:treeNode>
                                        </p:tree>
                                    </p:scrollPanel>
                                </p:overlayPanel>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup id="statusOpen">
                                <p:selectBooleanCheckbox itemLabel="在修" value="#{workOrderReportExportController.statusOpen}" >
                                </p:selectBooleanCheckbox>
                            </h:panelGroup>
                            <h:panelGroup id="statusClose">
                                <p:selectBooleanCheckbox itemLabel="完成" value="#{workOrderReportExportController.statusClose}" >
                                </p:selectBooleanCheckbox>
                            </h:panelGroup>
                            <h:panelGroup id="statusCancel">
                                <p:selectBooleanCheckbox itemLabel="取消" value="#{workOrderReportExportController.statusCancel}" >
                                </p:selectBooleanCheckbox>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <p:fieldset legend="#{msg.FilterCondition}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">*报修开始时间</label>
                                <p:calendar timeZone="GMT+8"  id="startTime" value="#{workOrderReportExportController.startTime}" pattern="yyyy/MM/dd" required="true" requiredMessage="开始时间 #{msg.ValidationRequire}" showOn="button"  showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">*报修结束时间</label>
                                <p:calendar timeZone="GMT+8"  id="endTime" value="#{workOrderReportExportController.endTime}" pattern="yyyy/MM/dd" required="true" requiredMessage="结束时间 #{msg.ValidationRequire}" showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>

                            <!--<p:commandButton ajax="false" actionListener="#{workOrderReportExportController.exportData()}" icon="ui-icon-arrowthick-1-s" value="#{msg.Export}" onclick="test()" >
                                <p:fileDownload value="#{workOrderReportExportController.exportFile}"/>
                            </p:commandButton>
                            <p:remoteCommand name="test" ajax="true" validateClient="true" update=":growl">
                                <p:fileDownload value="#{workOrderReportExportController.exportFile}"/>
                            </p:remoteCommand>-->

                            <p:commandButton value="预览结果" actionListener="#{workOrderReportExportController.previewData()}" icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl :dataListForm :dataListForm:datalist">
                            </p:commandButton>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:form>

                <h:form id="dataListForm">
                    <p:dataTable id="datalist" rendered="#{not empty workOrderReportExportController.workOrderList}" value="#{workOrderReportExportController.workOrderList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="10" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:column headerText="报修单号">
                            <a href="/geapm/portal/wo/woList.xhtml?woId=#{item.woId}" target="_Blank"><h:outputText value="#{item.报修单号}" /></a>
                        </p:column>
                        <p:column headerText="设备编号">
                            <h:outputText value="#{item.设备编号}" />
                        </p:column>
                        <p:column headerText="资产编号">
                            <h:outputText value="#{item.资产编号}" />
                        </p:column>
                        <p:column headerText="设备名称">
                            <h:outputText value="#{item.设备名称}" />
                        </p:column>
                        <p:column headerText="院区">
                            <h:outputText value="#{item.院区}" />
                        </p:column>
                        <p:column headerText="科室">
                            <h:outputText value="#{item.科室}" />
                        </p:column>
                        <p:column headerText="报修人">
                            <h:outputText value="#{item.报修人}" />
                        </p:column>
                        <p:column headerText="报修时间">
                            <h:outputText value="#{item.报修时间}" />
                        </p:column>
                        <p:column headerText="当前责任人">
                            <h:outputText value="#{item.当前责任人}" />
                        </p:column>
                        <p:column headerText="故障描述">
                            <h:outputText value="#{item.故障描述}" />
                        </p:column>
                        <p:column headerText="当前步骤">
                            <h:outputText value="#{item.当前步骤}" />
                        </p:column>
                        <p:column headerText="工单状态">
                            <h:outputText value="#{item.工单状态}" />
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton ajax="false" value="导出" actionListener="#{workOrderReportExportController.exportData()}" icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl">
                                <p:fileDownload value="#{workOrderReportExportController.exportFile}" />
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
