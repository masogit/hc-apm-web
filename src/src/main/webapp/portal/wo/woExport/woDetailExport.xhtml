<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:form id="woDetailExportDataForm">
        <p:fieldset legend="#{msg.FilterCondition}">
            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">*#{msg.hospitalId}</label>
                    <p:inputText id="selectedOrgName_woDetail"
                                 value="#{workOrderDetailExportController.selectedOrg==null ? '': workOrderDetailExportController.selectedOrg.name}"
                                 readonly="true" required="true" requiredMessage="所属院区不能为空"/>
                    <p:commandButton id="btnOrg_woDetail" process="@this" icon="fa fa-angle-down"
                                     class="btn btn-sm popupIconButton"/>
                    <p:overlayPanel id="popupPanel_woDetail" widgetVar="varPanelOrg_woDetail" for="btnOrg_woDetail" hideEffect="fade" dynamic="false"
                                    style="width:300px" modal="false">
                        <p:scrollPanel style="height:300px;border: 0" mode="native">
                            <p:tree id="orgTree_woDetail" class="tree" style="width:98%;border:0;"
                                    value="#{workOrderDetailExportController.orgTree}"
                                    selection="#{workOrderDetailExportController.selectedNode}" var="node"
                                    selectionMode="single">
                                <p:ajax process="@this" event="select" update=":woTab:woDetailExportDataForm:selectedOrgName_woDetail :woTab:woDetailExportDataForm:clinicalDeptName_woDetail"
                                        listener="#{workOrderDetailExportController.onSelectTreeNode}"
                                        oncomplete="PF('varPanelOrg_woDetail').hide();"/>
                                <p:ajax process="@this" event="expand"/>
                                <p:ajax process="@this" event="collapse"/>

                                <p:treeNode type="org">
                                    <h:outputText value="#{node}"/>
                                </p:treeNode>
                            </p:tree>
                        </p:scrollPanel>
                    </p:overlayPanel>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">#{msg.clinicalDeptName}</label>
                    <p:autoComplete id="clinicalDeptName_woDetail" dropdown="true" value="#{workOrderDetailExportController.filterDeptOrg}"
                                    scrollHeight="300"  forceSelection="true" completeMethod="#{workOrderDetailExportController.autoCompleteDept}"
                                    var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" class="SiteUIDChange">
                        <p:ajax event="itemSelect" listener="#{workOrderDetailExportController.onClinicalDeptChange}" />
                        <p:ajax listener="#{workOrderDetailExportController.onClinicalDeptChange}" />
                    </p:autoComplete>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">当前责任人</label>
                    <p:autoComplete id="currentOwner_woDetail" dropdown="true" value="#{workOrderDetailExportController.filterCurrentOwner}"
                                    scrollHeight="300"  forceSelection="true" completeMethod="#{workOrderDetailExportController.completeOwnerList}"
                                    var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="userAccountConverter" class="SiteUIDChange">
                        <p:ajax event="itemSelect" listener="#{workOrderDetailExportController.onCurrentOwnerChange}" />
                        <p:ajax listener="#{workOrderDetailExportController.onCurrentOwnerChange}" />
                    </p:autoComplete>
                </h:panelGroup>
            </p:panelGrid>

            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">*最早报修时间</label>
                    <p:calendar timeZone="GMT+8" id="startTime_woDetail" value="#{workOrderDetailExportController.startTime}"
                                pattern="yyyy/MM/dd" required="true" requiredMessage="最早报修时间 #{msg.ValidationRequire}"
                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">*最晚报修时间</label>
                    <p:calendar timeZone="GMT+8" id="endTime_woDetail" value="#{workOrderDetailExportController.endTime}"
                                pattern="yyyy/MM/dd" required="true" requiredMessage="最晚报修时间 #{msg.ValidationRequire}"
                                showOn="button" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">结单状态</label>
                    <p:selectOneMenu id="statementStatus_woDetail" value="#{workOrderDetailExportController.filterStatementStatus}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}" />
                        <f:selectItem itemLabel="已结单" itemValue="Closed" />
                        <f:selectItem itemLabel="未结单" itemValue="Opened" />
                    </p:selectOneMenu>
                </h:panelGroup>
            </p:panelGrid>

            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">配件金额区间</label>
                    <p:inputNumber id="minPrice_woDetail" decimalPlaces="0" minValue="0" maxValue="999999999" emptyValue="true" value="#{workOrderDetailExportController.filterMinPrice}">
                        <f:convertNumber pattern="0" type="number"/>
                    </p:inputNumber>
                    -
                    <p:inputNumber id="maxPrice_woDetail" decimalPlaces="0" minValue="0" maxValue="999999999" emptyValue="true" value="#{workOrderDetailExportController.filterMaxPrice}">
                        <f:convertNumber pattern="0" type="number"/>
                    </p:inputNumber>
                </h:panelGroup>
            </p:panelGrid>

            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <p:inputText id="searchText_woDetail" value="#{workOrderDetailExportController.searchStr}" placeholder="设备编号/工单编号/发票号/公司名称" maxlength="100" style="width: 500px"/>
                </h:panelGroup>
            </p:panelGrid>
        </p:fieldset>

        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
            <h:panelGroup>
                <p:commandButton value="预览结果" actionListener="#{workOrderDetailExportController.previewData}"
                                 icon="ui-icon-arrowthick-1-s" validateClient="true"
                                 update=":growl :woTab:dataListForm_woDetail">
                </p:commandButton>
            </h:panelGroup>
        </p:panelGrid>
    </h:form>

    <h:form id="dataListForm_woDetail">
        <p:dataTable id="datalist_woDetail" value="#{workOrderDetailExportController.workOrderDetailPojoList}" var="item"
                     selection="#{workOrderDetailExportController.selectedItems}"
                     rowKey="#{item.wodID}" lazy="false" paginator="true" paginatorPosition="both"
                     paginatorAlwaysVisible="true"
                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20"
                     emptyMessage="#{msg.noRecordFound}"
                     rowsPerPageTemplate="20,50,100,500">

            <p:column selectionMode="multiple"  style="width:50px;text-align:center" >
            </p:column>
            <p:column headerText="部门名称">
                <h:outputText value="#{item.部门名称}"/>
            </p:column>
            <p:column headerText="卡片编号">
                <h:outputText value="#{item.卡片编号}"/>
            </p:column>
            <p:column headerText="资产名称">
                <h:outputText value="#{item.资产名称}"/>
            </p:column>
            <p:column headerText="卡片编号">
                <h:outputText value="#{item.供货单位名称}"/>
            </p:column>
            <p:column headerText="配件名称">
                <h:outputText value="#{item.配件名称}"/>
            </p:column>
            <p:column headerText="数量">
                <h:outputText value="#{item.数量}"/>
            </p:column>
            <p:column headerText="发生费用">
                <h:outputText value="#{item.发生费用}"/>
            </p:column>
            <p:column headerText="发票号">
                <h:outputText value="#{item.发票号}"/>
            </p:column>
            <p:column headerText="开票日期">
                <h:outputText value="#{item.开票日期}"/>
            </p:column>
            <p:column headerText="经手人员">
                <h:outputText value="#{item.经手人员}"/>
            </p:column>
            <p:column headerText="合同号">
                <h:outputText value="#{item.合同号}"/>
            </p:column>
            <!--<p:column headerText="备注">
                <h:outputText value="#{item.备注}"/>
            </p:column>-->
            <p:column headerText="结单状态">
                <h:outputText value="#{item.结单状态}"/>
            </p:column>

            <f:facet name="{Toolbar}">
                <p:commandButton ajax="false" value="报表全部导出" rendered="#{not empty workOrderDetailExportController.workOrderDetailPojoList}"
                                 actionListener="#{workOrderDetailExportController.exportAllWo()}"
                                 icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl">
                    <p:fileDownload value="#{workOrderDetailExportController.exportFile}"/>
                </p:commandButton>
                <p:commandButton ajax="false" value="报表选择导出" rendered="#{not empty workOrderDetailExportController.workOrderDetailPojoList}"
                                 actionListener="#{workOrderDetailExportController.exportSelectedWo()}"
                                 icon="ui-icon-arrowthick-1-s" validateClient="true" update=":growl">
                    <p:fileDownload value="#{workOrderDetailExportController.exportFile}"/>
                </p:commandButton>
                <p:commandButton id="statementClosed" value="变更为结单" actionListener="#{workOrderDetailExportController.updateStatement('close')}" icon="ui-icon-pencil" update=":growl :woTab:dataListForm_woDetail:datalist_woDetail" rendered="#{not empty workOrderDetailExportController.workOrderDetailPojoList}">
                    <p:confirm header="状态变更确认" message="将所选记录变更成结单状态！" icon="ui-icon-alert"/>
                </p:commandButton>
                <p:commandButton id="statementOpened" value="变更为未结单" actionListener="#{workOrderDetailExportController.updateStatement('open')}" icon="ui-icon-pencil" update=":growl :woTab:dataListForm_woDetail:datalist_woDetail" rendered="#{not empty workOrderDetailExportController.workOrderDetailPojoList}">
                    <p:confirm header="状态变更确认" message="将所选记录变更成未结单状态！" icon="ui-icon-alert"/>
                </p:commandButton>
            </f:facet>

        </p:dataTable>

    </h:form>


</html>
