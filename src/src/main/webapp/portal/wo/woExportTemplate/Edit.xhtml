<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="WoExportTemplateEditDlg" widgetVar="WoExportTemplateEditDialog"
              onHide="#{workOrderExportTemplateController.onSelect()}" width="1000" height="450" modal="true"
              resizable="true" draggable="true" appendTo="@(body)"
              header="#{workOrderExportTemplateController.CRUDActionName} #{msg.SystemConfig}">
        <h:form id="WoExportTemplateEditForm">
            <h:panelGroup id="display">
                <p:fieldset id="basic" legend="报表模板配置">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group"
                                 rendered="#{workOrderExportTemplateController.selected != null}">
                        <h:panelGroup>
                            <label class="label">#{msg.orgId}*</label>
                            <p:inputText id="selectedUserOrgName"
                                         value="#{workOrderExportTemplateController.getOrgFullName(workOrderExportTemplateController.selectedUserOrg)}"
                                         readonly="true" required="true"
                                         requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
                            <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down"
                                             style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                            <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User"
                                            hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel"
                                            style="width:300px;" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;"
                                            value="#{workOrderExportTemplateController.orgTree}"
                                            selection="#{workOrderExportTemplateController.selectedNode}" var="node"
                                            selectionMode="single">
                                        <p:ajax process="@this" event="select" update=":WoExportTemplateEditForm"
                                                listener="#{workOrderExportTemplateController.onSelectOrgForUser}"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <h:outputText value="#{workOrderExportTemplateController.file.fileName}"
                                          rendered="#{not empty workOrderExportTemplateController.file}"/>
                            <p:fileUpload fileUploadListener="#{workOrderExportTemplateController.uploadDataFile}"
                                          value="#{workOrderExportTemplateController.file}" mode="advanced"
                                          dragDropSupport="false" style="width:100%" process="@this"
                                          multiple="false" sizeLimit="10000000" update=":WoExportTemplateEditForm"
                                          auto="true" invalidSizeMessage="#{msg.invalidSizeMessage}10M"
                                          allowTypes="/(\.|\/)(xls|xlsx)$/" label="#{msg.Add}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="false"
                                 actionListener="#{workOrderExportTemplateController.applyChange()}" value="#{msg.Save}"
                                 update="display,:WoExportTemplateEditDlg, :WoExportTemplateListForm:datalist, :growl"
                                 icon="ui-icon-check" oncomplete="handleSubmit(args, 'WoExportTemplateDialog');"/>
                &nbsp;&nbsp;
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('WoExportTemplateEditDialog').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
