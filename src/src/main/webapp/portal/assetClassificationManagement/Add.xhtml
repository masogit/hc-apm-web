<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="ModelAddDlg" widgetVar="ModelAddDlg"
              width="1000" height="450" modal="true"
              resizable="true" draggable="true" appendTo="@(body)"
              header="添加分类模型">
        <h:form id="AddModelForm">
            <h:panelGroup id="display">
                <p:fieldset id="basic">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">


                        <h:panelGroup>
                            <label class="label">#{msg.manufacture}<span style="color:red">*</span></label>
                            <p:inputText  required="true" value="#{modelTrainingController.selected.factory}" />
                        </h:panelGroup>


                        <h:panelGroup>
                            <label class="label">#{msg.brand}<span style="color:red">*</span></label>
                            <p:inputText required="true" value="#{modelTrainingController.selected.brand}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.preventiveMaintenanceAnalysis_deviceName}<span style="color:red">*</span></label>
                            <p:inputText required="true"  value="#{modelTrainingController.selected.sourceName}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.functionType}<span style="color:red">*</span></label>
                            <p:inputText required="true"  value="#{modelTrainingController.selected.pattern}" />
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">设备32分类<span style="color:red">*</span></label>
                            <p:inputText required="true"  value="#{modelTrainingController.selected.category}" />
                        </h:panelGroup>
 
                    </p:panelGrid>
                </p:fieldset>
                <br/>
                <p:commandButton validateClient="true"
                                 actionListener="#{modelTrainingController.addCategoryModel()}" value="#{msg.Save}"
                                 update="display,:ModelAddDlg, :AssetDetailListForm:datalist, :growl"
                                 icon="ui-icon-check" oncomplete="handleSubmit(args, 'ModelAddDlg');"/>
                &nbsp;&nbsp;
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('ModelAddDlg').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
