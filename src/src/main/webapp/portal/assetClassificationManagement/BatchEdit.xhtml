<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>

        </style>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="设备32分类设置"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="batchEditAssetClassificationForm">


                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                        <h:panelGroup>
                            <label class="label">#{msg.hospitalId}<span style="color:red">*</span></label>
                            <!--                            <apm:selectSiteOrgByOrgTree update="@(form)"/>-->

                            <p:inputText id="selectedOrgName" value="#{batchEditAssetClassificationController.selectedOrg==null ? '': batchEditAssetClassificationController.selectedOrg.name}" readonly="true" required="true"/>
                            <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                            <p:overlayPanel id="popupPanel" appendTo="btnOrg" widgetVar="varPanelOrg1" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">

                                    <p:tree id="orgTree1" class="tree" style="width:98%;border:0;" value="#{batchEditAssetClassificationController.orgTree}" selection="#{batchEditAssetClassificationController.selectedNode}" var="node" selectionMode="single">
                                        <p:ajax process="@this" event="select" update="batchEditAssetClassificationForm"  listener="#{batchEditAssetClassificationController.onSelectTreeNode2}" oncomplete="PF('varPanelOrg1').hide()"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>

                        </h:panelGroup>


                        <h:panelGroup>
                            <label class="label">#{msg.clinicalDeptName}<span style="color:red">*</span></label>
<!--                            <p:autoComplete id="clinicalDeptName" required="true" dropdown="true" value="#{batchEditAssetClassificationController.filterDeptOrg}"-->
<!--                                            scrollHeight="300"  forceSelection="true" completeMethod="#{batchEditAssetClassificationController.autoCompleteDept}"-->
<!--                                            var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" class="SiteUIDChange">-->
<!--                                <p:ajax event="itemSelect" listener="#{batchEditAssetClassificationController.onClinicalDeptChange()}"  update="datalist"/>-->

<!--                            </p:autoComplete>-->

                            <p:selectCheckboxMenu
                                                  value="#{batchEditAssetClassificationController.selectsDeptOrg}"
                                                  panelStyle="width:280px" style="width:100%" required="true" requiredMessage="科室不能为空！"
                                                  multiple="true" filter="true" updateLabel="true"
                                                  filterMatchMode="contains" converter="orgInfoConverter">
                                <f:selectItems value="#{batchEditAssetClassificationController.autoCompleteDept(null)}" var="item"
                                               itemLabel="#{item.name}" itemValue="#{item}"/>

                                <p:ajax process="@this" event="change" listener="#{batchEditAssetClassificationController.onClinicalDeptChange}" update="datalist"/>

                            </p:selectCheckboxMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class='label'>#{msg.assetName}</label>
                            <p:inputText id="assetName" value="#{batchEditAssetClassificationController.assetName}">
                                <p:ajax/>
                            </p:inputText>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class='label'>#{msg.functionType}</label>
                            <p:inputText id="functionType" value="#{batchEditAssetClassificationController.functionType}">
                                <p:ajax/>
                            </p:inputText>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class='label'>#{msg.manufacture}</label>
                            <p:inputText id="manufacture" value="#{batchEditAssetClassificationController.manufacture}">
                                <p:ajax/>
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class='label'>#{msg.makerShortName}</label>
                            <p:inputText id="makerShortName" value="#{batchEditAssetClassificationController.makerShortName}">
                                <p:ajax/>
                            </p:inputText>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:commandButton actionListener="#{batchEditAssetClassificationController.getQueryAssetsList()}"
                                             value="查询" update="datalist" immediate="true" validateClient="false" process="@this"
                                             icon="ui-icon-check"
                            />
                        </h:panelGroup>
                    </p:panelGrid>


                    <p:fieldset legend="设备" id="assetList" style="margin-bottom:20px">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                            <p:dataTable id="datalist" value="#{batchEditAssetClassificationController.selectAssetInfos}"
                                         var="item"
                                         widgetVar="configEditList1"
                                         lazy="true" paginator="true" paginatorPosition="both"
                                         paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         rows="10" emptyMessage="#{msg.noRecordFound}"
                                         rowsPerPageTemplate="5,10,20,50">
                                <p:ajax event="filter" listener="#{batchEditAssetClassificationController.onFilter}" update="datalist"/>
                                <p:ajax event="page" />
                                <p:column width="40" id="checkBoxCol">
                                    <p:selectBooleanCheckbox value="#{batchEditAssetClassificationController.selectedAssetUidTable1[item.uid]}" class="selectCheckBox1">
                                        <p:ajax event="change" listener="#{batchEditAssetClassificationController.updateSelctedAssetList1}" update="@(.selectCheckBoxHeader1)"/>
                                        <f:attribute name="assetObj" value="#{item}"/>
                                    </p:selectBooleanCheckbox>
                                    <f:facet name="header">
                                        <p:selectBooleanCheckbox value="#{batchEditAssetClassificationController.allSelected1}" id="selectCheckBoxHeader1" class="selectCheckBoxHeader1">
                                            <p:ajax event="change" listener="#{batchEditAssetClassificationController.addAssetsOfCurrentPage1}" update="@(.selectCheckBox1)"/>
                                        </p:selectBooleanCheckbox>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="#{msg.assetName}">
                                    <h:outputText value="#{item.name}" />
                                </p:column>
                                <p:column headerText="#{msg.functionType}" >
                                    <h:outputText value="#{item.functionType}"/>
                                </p:column>

                                <p:column headerText="#{msg.serialNum}">
                                    <h:outputText value="#{item.serialNum}"/>
                                </p:column>

                                <p:column headerText="#{msg.departNum}">
                                    <h:outputText value="#{item.departNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.qrCode}" >
                                    <h:outputText value="#{item.qrCode}"/>
                                </p:column>
                                <p:column headerText="#{msg.clinicalDeptName}">
                                    <h:outputText value="#{item.clinicalDeptName}"/>
                                </p:column>
                            </p:dataTable>
                        </p:panelGrid>
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                            <p:commandButton validateClient="true" actionListener="#{batchEditAssetClassificationController.addCheckedDevice}" value="添加已勾选设备" icon="fa fa-filter" process="@form" update="assetList assetList2 :growl"
                            >
                            </p:commandButton>
                        </p:panelGrid>
                        <p:panelGrid columns="1" layout="grid" id="assetList2" styleClass="ui-panelgrid-blank form-group ">
                            <p:dataTable id="datalist1" value="#{batchEditAssetClassificationController.selectAsset}"
                                         var="item"
                                         widgetVar="selectedTable"
                                         lazy="true" paginator="true" paginatorPosition="both"
                                         paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                         rows="10" emptyMessage="#{msg.noRecordFound}" rowKey="#{item.id}"
                                         rowsPerPageTemplate="5,10,20,50">
                                <p:ajax event="page" />
                                <p:column width="40" id="checkBoxCol1">
                                    <p:selectBooleanCheckbox value="#{batchEditAssetClassificationController.selectedAssetUidTable2[item.uid]}" class="selectCheckBox2">
                                        <p:ajax event="change" listener="#{batchEditAssetClassificationController.updateSelctedAssetList2}" update="@(.selectCheckBoxHeader2)"/>
                                        <f:attribute name="assetObj" value="#{item}"/>
                                    </p:selectBooleanCheckbox>
                                    <f:facet name="header">
                                        <p:selectBooleanCheckbox value="#{batchEditAssetClassificationController.allSelected2}" id="selectCheckBoxHeader2" class="selectCheckBoxHeader2">
                                            <p:ajax event="change" listener="#{batchEditAssetClassificationController.addAssetsOfCurrentPage2}" update="@(.selectCheckBox2)"/>
                                        </p:selectBooleanCheckbox>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="#{msg.assetName}" >
                                    <h:outputText value="#{item.name}" />
                                </p:column>
                                <p:column headerText="#{msg.departNum}" >
                                    <h:outputText value="#{item.departNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.serialNum}" >
                                    <h:outputText value="#{item.serialNum}"/>
                                </p:column>
                                <p:column headerText="#{msg.functionType}"  >
                                    <h:outputText value="#{item.functionType}"/>
                                </p:column>
                                <p:column headerText="#{msg.manufacture}" >
                                    <h:outputText value="#{item.manufacture}"/>
                                </p:column>
                                <p:column headerText="#{msg.makerShortName}" >
                                    <h:outputText value="#{item.makerShortName}"/>
                                </p:column>
                                <p:column headerText="#{msg.qrCode}" >
                                    <h:outputText value="#{item.qrCode}"/>
                                </p:column>
                                <p:column headerText="设备32分类" >
<!--                                    <p:inputText value="#{item.assetClassification32}"/>-->
                                    <p:selectOneMenu
                                            value="#{item.assetClassification32}"
                                            id="classificationSelect">
<!--                                            style="width: 100%">-->
                                        <f:selectItem itemLabel="请选择" noSelectionOption="true" />
                                        <f:selectItems value="#{item.availableCategories}"
                                                       var="cat"
                                                       itemLabel="#{cat}"
                                                       itemValue="#{cat}" />
                                        <p:ajax event="change" process="@this" update="datalist1"/>
                                    </p:selectOneMenu>
                                </p:column>

                                <p:column headerText="AI推荐分类">
                                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                                        <div>
                                            <p:selectOneRadio id="categoryRadio" value="#{item.assetClassification32}" layout="custom" style="display:none;" >
                                                <f:selectItem itemLabel="请选择" noSelectionOption="true" />
                                                <f:selectItems value="#{item.availableCategories}"
                                                               var="cat"
                                                               itemLabel="#{cat}"
                                                               itemValue="#{cat}" />
                                                <p:ajax event="change"
                                                        process="@this"
                                                        update="datalist1" />
                                            </p:selectOneRadio>
                                            <p:radioButton for="categoryRadio" itemIndex="1" rendered="#{not empty item.category1}"/>
                                            <h:outputText value="Top1: #{item.category1}" rendered="#{not empty item.category1}"/>
                                            <h:outputText value="-" rendered="#{empty item.category1}"/>
                                        </div>
                                        <div>
                                            <p:radioButton for="categoryRadio" itemIndex="2" rendered="#{not empty item.category2}"/>
                                            <h:outputText value="Top2: #{item.category2}" rendered="#{not empty item.category2}"/>
                                            <h:outputText value="-" rendered="#{empty item.category2}"/>
                                        </div>
                                        <div>
                                            <p:radioButton for="categoryRadio" itemIndex="3" rendered="#{not empty item.category3}"/>
                                            <h:outputText value="Top3: #{item.category3}" rendered="#{not empty item.category3}"/>
                                            <h:outputText value="-" rendered="#{empty item.category3}"/>
                                        </div>
                                    </div>
                                </p:column>
                                <!-- Top1 列 -->
                                <!-- 在每一行中 -->
<!--                                <p:column headerText="AI推荐分类Top1">-->
<!--                                    &lt;!&ndash; 隐藏的 radio 组 &ndash;&gt;-->
<!--                                    <p:selectOneRadio id="categoryRadio"-->
<!--                                                      value="#{item.assetClassification32}"-->
<!--                                                      layout="custom"-->
<!--                                                      style="display:none;">-->
<!--                                        <f:selectItem itemValue="#{item.category1}" />-->

<!--                                        <f:selectItem itemValue="#{item.category3}" />-->
<!--                                    </p:selectOneRadio>-->

<!--                                    &lt;!&ndash; 使用 @parent 引用同级的 radio 组 &ndash;&gt;-->
<!--                                    <p:radioButton for="@parent"-->
<!--                                                   itemIndex="0"-->
<!--                                                   rendered="#{not empty item.category1}"/>-->
<!--                                    <h:outputText value="-" rendered="#{empty item.category1}"/>-->
<!--                                </p:column>-->

<!--                                &lt;!&ndash; Top2 列 &ndash;&gt;-->
<!--                                <p:column headerText="AI推荐分类Top2">-->
<!--                                    <p:radioButton for="@parent"-->
<!--                                                   itemIndex="1"-->
<!--                                                   rendered="#{not empty item.category2}"/>-->
<!--                                    <h:outputText value="-" rendered="#{empty item.category2}"/>-->
<!--                                </p:column>-->

<!--                                &lt;!&ndash; Top3 列 &ndash;&gt;-->
<!--                                <p:column headerText="AI推荐分类Top3">-->
<!--                                    <p:radioButton for="@parent"-->
<!--                                                   itemIndex="2"-->
<!--                                                   rendered="#{not empty item.category3}"/>-->
<!--                                    <h:outputText value="-" rendered="#{empty item.category3}"/>-->
<!--                                </p:column>-->
                            </p:dataTable>
                        </p:panelGrid>
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                            <p:commandButton  validateClient="true" actionListener="#{batchEditAssetClassificationController.deleteCheckedDevice}" value="删除已勾选设备" update="assetList assetList2 :growl" icon="ui-icon-check"/>
                            <p:commandButton  value="全部清空" actionListener="#{batchEditAssetClassificationController.clearAll}"  icon="ui-icon-cancel" update="assetList assetList2 :growl" />
                        </p:panelGrid>
                    </p:fieldset>




                    <p:commandButton  actionListener="#{batchEditAssetClassificationController.batchEdit}"
                                     value="#{msg.Save}"
                                     icon="ui-icon-check"
                                      update="batchEditAssetClassificationForm"
                                  />

                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                     action="details?faces-redirect=true"
                    />
                    <!--                update="#{batchEditAssetClassificationController.cancel}"-->
                </h:form>

            </div>
        </div>

        <script>

        </script>
    </ui:define>
</ui:composition>
