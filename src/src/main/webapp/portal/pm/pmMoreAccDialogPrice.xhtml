<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="pmMoreAccDialogPriceDlg" class="pmMoreAccDialogPriceDlg" widgetVar="pmMoreAccDialogPriceDlg" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="备件更新">
        <h:form id="pmMoreAccDialogFormX" >
            <h:panelGroup id="display42">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">备件名称*</label>
                        <p:inputText id="parts" disabled="true" value="#{v2PmOrderController.itemDetail.parts}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备件(数量)*</label>
                        <p:inputNumber  maxValue="999999" decimalPlaces="0" disabled="true" id="apartsQuantity" value="#{v2PmOrderController.itemDetail.apartsQuantity}" required="true" requiredMessage="备件(数量) #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">合同(元)*</label>
                        <p:inputNumber  decimalPlaces="4" maxValue="99999999" id="partsPrice"  value="#{v2PmOrderController.itemDetail.closedPrice}" required="true" requiredMessage="实际价格(元) #{msg.ValidationRequire}" />
                    </h:panelGroup>
                    <!--update-->
                    <h:panelGroup>
                        <label class="label">发票号</label>
                        <p:inputText value="#{v2PmOrderController.itemDetail.invoiceNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea id="area" value="#{v2PmOrderController.itemDetail.comment}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">合同号</label>
                        <p:inputText value="#{v2PmOrderController.itemDetail.contractNum}"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <p:column headerText="结单">
                            <p:selectBooleanButton   value="#{v2PmOrderController.itemDetail.closed}" onLabel="已结单" offLabel="未结单">
                                <p:ajax listener="#{v2PmOrderController.orderSet}" event="change"></p:ajax>
                            </p:selectBooleanButton>
                        </p:column>
                    </h:panelGroup>

                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.updateAccessPrice()}" value="#{msg.Save}" update="@(.pmOrderDetailFormCls) @(.accessCls) :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmMoreAccDialogPriceDlg');"/>
                    <p:commandButton immediate="true" actionListener="#{v2PmOrderController.cancelWorkdetail}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmMoreAccDialogPriceDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

    <p:dialog id="pmmoreAccDialogViewDlg" class="pmmoreAccDialogViewDlg" widgetVar="pmmoreAccDialogViewDlg" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="备件查看">
        <h:form id="pmmoreAccDialogViewForm" >
            <h:panelGroup>
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">备件名称*</label>
                        <p:inputText id="parts" disabled="true" value="#{v2PmOrderController.itemDetail.parts}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备件(数量)*</label>
                        <p:inputNumber  maxValue="999999" decimalPlaces="0" disabled="true" id="apartsQuantity" value="#{v2PmOrderController.itemDetail.apartsQuantity}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">合同价格(元)*</label>
                        <p:inputNumber  decimalPlaces="4" maxValue="99999999" id="partsPrice"  value="#{v2PmOrderController.itemDetail.closedPrice}" readonly="true" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">发票号</label>
                        <p:inputText value="#{v2PmOrderController.itemDetail.invoiceNum}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea id="area" value="#{v2PmOrderController.itemDetail.comment}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">合同号</label>
                        <p:inputText value="#{v2PmOrderController.itemDetail.contractNum}" readonly="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <p:column headerText="结单">
                            <p:selectBooleanButton   value="#{v2PmOrderController.itemDetail.closed}" onLabel="已结单" offLabel="未结单" disabled="true">
                            </p:selectBooleanButton>
                        </p:column>
                    </h:panelGroup>
                </p:panelGrid>

            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
