<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition><!--备件对话框 保养-->
        <p:dialog class="pmmoreAccDialogDlgCls" id="pmmoreAccDialogDlg" widgetVar="pmmoreAccDialogDlg" modal="true" width="1250"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.Part}">
            <h:form class="pmmoreAccDialogFormCls"  id="pmmoreAccDialogForm" >
                <h:panelGroup id="display42">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.PartName}*</label>
                            <p:inputText id="parts" value="#{v2PmOrderController.itemDetail.parts}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>

                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.PartQuantity}*</label>
                            <p:inputNumber  maxValue="999"  decimalPlaces="0"  id="apartsQuantity" value="#{v2PmOrderController.itemDetail.apartsQuantity}" required="true" requiredMessage="#{msg.PartQuantity} #{msg.ValidationRequire}">
                            <f:convertNumber pattern="0" type="number"/>
                            </p:inputNumber>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.EstimatedUnitPriceRMB}*</label>
                            <p:inputNumber  disabled="#{v2PmOrderController.nochange}" decimalPlaces="0" maxValue="999999" id="partsPrice"  value="#{v2PmOrderController.itemDetail.partsPrice}" required="true" requiredMessage="#{msg.EstimatedUnitPriceRMB} #{msg.ValidationRequire}">
                                <p:ajax listener="#{v2PmOrderController.partsPriceUpdate()}" update="@(.hetongjia)" >
                                </p:ajax>
                                <f:convertNumber pattern="0" type="number"/>

                            </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.PartType}</label>
                            <p:selectOneMenu value="#{v2PmOrderController.itemDetail.partsType}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.InvoiceNumber}</label>
                            <p:inputText value="#{v2PmOrderController.itemDetail.invoiceNum}"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.InvoicingTime}</label>
                            <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd" value="#{v2PmOrderController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.InvoiceProvider}</label>
                            <p:autoComplete id="vendor" dropdown="true" value="#{v2PmOrderController.supplierName}" scrollHeight="300"
                                            forceSelection="false"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}"
                                            completeMethod="#{v2PmOrderController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                                <p:ajax event="itemSelect" listener="#{v2PmOrderController.onSupplierChange()}"/>
                                <p:ajax listener="#{v2PmOrderController.onSupplierChange()}" />
                            </p:autoComplete>
                            <p:commandButton id="createSupplierButton" icon="ui-icon-plus" action="#{v2PmOrderController.prepareCreateSupplier}" title="#{msg.Create}" process="@this" update="@(.SupplierEditDlgCls)" oncomplete="PF('SupplierEditDialog').show()"/>


                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.ContractNumber}</label>
                            <p:inputText value="#{v2PmOrderController.itemDetail.contractNum}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.ContractPriceRMB}</label>
                            <p:inputNumber  decimalPlaces="0" maxValue="999999" class="hetongjia" id="closedPrice"  value="#{v2PmOrderController.itemDetail.closedPrice}">
                                <p:ajax listener="#{v2PmOrderController.closePrcieUpdate()}">
                                </p:ajax>
                                <f:convertNumber pattern="0" type="number"/>
                            </p:inputNumber>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.WarrantyDate}</label>
                            <p:calendar timeZone="GMT+8" label="#{msg.EquipmentTakingTime}" pattern="yyyy/MM/dd" value="#{v2PmOrderController.itemDetail.warrantyDate}" showOn="button"
                                        readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.SerialNumber}</label>
                            <p:inputText value="#{v2PmOrderController.itemDetail.serialNum}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.EstimatedArrivalTime}</label>
                            <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd HH:mm" value="#{v2PmOrderController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.ApplyTime}</label>
                            <p:calendar disabled="#{workOrderMgrController.nochange}" timeZone="GMT+8" label="#{msg.ApplyTime}" pattern="yyyy/MM/dd HH:mm" value="#{v2PmOrderController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                        <p:column headerText="#{msg.Arrival}">
                            <p:selectBooleanButton   value="#{v2PmOrderController.itemDetail.arrived}" onLabel="#{msg.Arrived}" offLabel="#{msg.NonArrived}">
                                <p:ajax listener="#{v2PmOrderController.arrivalTimeSet}" event="change"></p:ajax>
                            </p:selectBooleanButton>
                            <p:selectBooleanButton   value="#{v2PmOrderController.itemDetail.closed}" onLabel="#{msg.Closed}" offLabel="#{msg.Opened}">
                                <p:ajax listener="#{v2PmOrderController.orderSet}" event="change"></p:ajax>
                            </p:selectBooleanButton>
                        </p:column>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.feedbackComment}</label>
                            <p:inputTextarea id="area" value="#{v2PmOrderController.itemDetail.comment}"/>
                        </h:panelGroup>

                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.addAcessItem}" value="#{msg.Save}" update="pmTab:pmrepairCompleteDialogForm:accessList  pmTab:pmrepairCompleteDialogForm:cmd1 :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmmoreAccDialogDlg');"/>
                        <p:commandButton immediate="true" actionListener="#{v2PmOrderController.cancelWorkdetail}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmmoreAccDialogDlg');"/>
                    </h:panelGroup>

                    <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.saveAndadd(1)}" rendered="#{v2PmOrderController.switchTmp}" value="#{msg.SaveAdd}" update="@(.pmmoreAccDialogFormCls) pmTab:pmrepairCompleteDialogForm:accessList  :growl" icon="ui-icon-check"/>

                </h:panelGroup>
            </h:form>
            <ui:include src="createSupplierAccPm.xhtml" />

        </p:dialog>

    </ui:composition>
</html>
