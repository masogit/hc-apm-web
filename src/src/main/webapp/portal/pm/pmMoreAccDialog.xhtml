<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition><!--备件对话框-->
        <p:dialog class="pmmoreAccDialogDlgCls" id="pmmoreAccDialogDlg" widgetVar="pmmoreAccDialogDlg" modal="true" width="550"  resizable="true" draggable="true" appendTo="@(body)" header="备件">
            <h:form class="pmmoreAccDialogFormCls"  id="pmmoreAccDialogForm" >
                <h:panelGroup id="display42">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">备件名称*</label>
                            <p:inputText id="parts" value="#{v2PmOrderController.itemDetail.parts}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>

                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">备件(数量)*</label>
                            <p:inputNumber  maxValue="999"  decimalPlaces="0"  id="apartsQuantity" value="#{v2PmOrderController.itemDetail.apartsQuantity}" required="true" requiredMessage="备件(数量) #{msg.ValidationRequire}">
                            <f:convertNumber pattern="0" type="number"/>
                            </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">备件单价(元)*</label>
                            <p:inputNumber  decimalPlaces="0" maxValue="999999" id="partsPrice"  value="#{v2PmOrderController.itemDetail.partsPrice}" required="true" requiredMessage="实际价格(元) #{msg.ValidationRequire}">
                            <f:convertNumber pattern="0" type="number"/>
                        </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">类型</label>
                            <p:selectOneMenu value="#{v2PmOrderController.itemDetail.partsType}">
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">申请时间</label>
                            <p:calendar timeZone="GMT+8" label="申请时间" pattern="yyyy/MM/dd HH:mm:ss" value="#{v2PmOrderController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">预计到达时间</label>
                            <p:calendar timeZone="GMT+8" label="预计到达时间" pattern="yyyy/MM/dd HH:mm:ss" value="#{v2PmOrderController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                       <!-- <h:panelGroup>
                            <label class="label">到货确认时间</label>
                            <p:calendar timeZone="GMT+8" label="到达时间" pattern="yyyy/MM/dd HH:mm:ss" value="#{v2PmOrderController.itemDetail.arrivedTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>-->

                        <h:panelGroup>
                            <label class="label">质保期</label>
                            <p:calendar timeZone="GMT+8" label="取物时间" pattern="yyyy/MM/dd" value="#{v2PmOrderController.itemDetail.warrantyDate}" showOn="button"
                                        readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">序列号</label>
                            <p:inputText value="#{v2PmOrderController.itemDetail.serialNum}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">发票号</label>
                            <p:inputText value="#{v2PmOrderController.itemDetail.invoiceNum}"/>
                        </h:panelGroup>
                        <!--update -->
                        <h:panelGroup>
                            <label class="label">维修合同号</label>
                            <p:inputText value="#{v2PmOrderController.itemDetail.contractNum}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">供应商</label>
                            <p:autoComplete id="vendor" dropdown="true" value="#{v2PmOrderController.supplierName}" scrollHeight="300"
                                            forceSelection="false"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}"
                                            completeMethod="#{v2PmOrderController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                                <p:ajax event="itemSelect" listener="#{v2PmOrderController.onSupplierChange()}"/>
                                <p:ajax listener="#{v2PmOrderController.onSupplierChange()}" />
                            </p:autoComplete>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">开票时间</label>
                            <p:calendar timeZone="GMT+8" label="预计到达时间" pattern="yyyy/MM/dd" value="#{v2PmOrderController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                        </h:panelGroup>


                        <p:column headerText="到货">
                            <p:selectBooleanButton   value="#{v2PmOrderController.itemDetail.arrived}" onLabel="已到货" offLabel="未到货">
                                <p:ajax listener="#{v2PmOrderController.arrivalTimeSet}" event="change"></p:ajax>
                            </p:selectBooleanButton>
                        </p:column>

                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.addAcessItem}" value="#{msg.Save}" update="pmTab:pmrepairCompleteDialogForm:accessList  pmTab:pmrepairCompleteDialogForm:cmd1 :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmmoreAccDialogDlg');"/>
                        <p:commandButton immediate="true" actionListener="#{v2PmOrderController.cancelWorkdetail}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmmoreAccDialogDlg');"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
