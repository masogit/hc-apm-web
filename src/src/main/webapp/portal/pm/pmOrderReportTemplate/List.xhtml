<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">
                <div class="ui-g-12 card cardTitle">
                    <p:outputLabel class="pageTitle" value="#{msg.ReportFormTemplateManagement}"/>
                </div>
                <h:form id="pmOrderReportTemplateListForm">
                    <p:dataTable id="dataList" value="#{pmOrderReportSysTemplateController.lazyModel}" var="item"
                                 widgetVar="varDataList"
                                 selectionMode="single" selection="#{pmOrderReportSysTemplateController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" listener="#{pmOrderReportSysTemplateController.onSelect()}"
                                update="createButton editButton deleteButton"/>

                        <p:column headerText="#{msg.TenantInfo}" sortBy="#{item.tenantUid}" filterBy="#{item.tenantUid}"
                                  filterMatchMode="EQ">
                            <h:outputText value="#{pmOrderReportSysTemplateController.getTenantName(item.tenantUid)}"/>
                        </p:column>
                        <p:column headerText="#{msg.Institution}" sortBy="#{item.institutionUid}" filterBy="#{item.institutionUid}"
                                  filterMatchMode="EQ">
                            <h:outputText
                                    value="#{pmOrderReportSysTemplateController.getInsNameByUID(item.institutionUid)}"/>
                        </p:column>
                        <p:column headerText="#{msg.Hospital}" sortBy="#{item.hospitalUid}" filterBy="#{item.hospitalUid}"
                                  filterMatchMode="EQ">
                            <h:outputText
                                    value="#{pmOrderReportSysTemplateController.getHospitalNameByUID(item.hospitalUid)}"/>
                        </p:column>
                        <p:column headerText="#{msg.Site}" sortBy="#{item.siteUid}" filterBy="#{item.siteUid}"
                                  filterMatchMode="EQ">
                            <h:outputText value="#{pmOrderReportSysTemplateController.getSiteNameByUID(item.siteUid)}"/>
                        </p:column>
                        <p:column headerText="#{msg.TemplateFile}" sortBy="#{item.fileName}" filterBy="#{item.fileName}"
                                  filterMatchMode="EQ">
                            <p:commandLink value="#{item.fileName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(item.storageId)}" styleClass="p-mr-2"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_TEMPLATE_EDIT')}"
                                             actionListener="#{pmOrderReportSysTemplateController.prepareCreate()}"
                                             update=":pmOrderReportTemplateEditDlg"
                                             oncomplete="PF('pmOrderReportTemplateEditDialog').show()"
                                             disabled="#{pmOrderReportSysTemplateController.existsSiteTemplate()}" />
                            <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_TEMPLATE_EDIT')}"
                                             actionListener="#{pmOrderReportSysTemplateController.prepareEdit()}"
                                             update=":pmOrderReportTemplateEditDlg"
                                             oncomplete="PF('pmOrderReportTemplateEditDialog').show()"
                                             disabled="#{empty pmOrderReportSysTemplateController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_TEMPLATE_EDIT')}"
                                             actionListener="#{pmOrderReportSysTemplateController.delete}"
                                             update=":pmOrderReportTemplateEditDlg,dataList,pmOrderReportTemplateListForm"
                                             disabled="#{empty pmOrderReportSysTemplateController.selected}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                           icon="ui-icon-warning"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>

                <ui:include src="Edit.xhtml"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
