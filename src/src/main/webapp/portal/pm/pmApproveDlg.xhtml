<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog class="pmapproveDialogCls" id="pmapproveDialog" widgetVar="pmapproveDialog" modal="true"  resizable="true" draggable="true" width="1000" appendTo="@(body)" header="#{msg.ApprovalP}" height="430">
        <h:form id="pmapproveDialogForm" class="pmapproveDialogFormCls">
            <h:panelGroup id="display3" rendered="#{not empty v2PmOrderController.selectedPmOrder}">
                <p:fieldset legend="#{msg.PartApproval}" >
                    <p:dataTable  id="accessList123" value="#{v2PmOrderController.getNeedApprovalDetails()}" var="item" paginator="false"
                                  rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                        <p:column >
                            <p:selectBooleanCheckbox value="#{v2PmOrderController.selectedMap[item.id]}"  class="selectCheckBox" rendered="#{empty item.approved or !item.approved}">
                                <p:ajax process="@this" listener="#{v2PmOrderController.onApprovedDetailsSelected(item.id)}"  update="@this @(.selectCheckBoxHeader)"/>
                            </p:selectBooleanCheckbox>
                            <h:outputText value="#{msg.ApprovedPass}"  rendered="#{item.approved}"/>
                            <f:facet name="header"  >
                                <p:selectBooleanCheckbox  id="selectCheckBoxHeader" value="#{v2PmOrderController.selectedMap['All']}" class="selectCheckBoxHeader">
                                    <p:ajax process="@this" listener="#{v2PmOrderController.onApprovedDetailsSelected('All')}" update="@this @(.selectCheckBox)"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.PartName}">
                            <h:outputText value="#{item.parts}"/>
                        </p:column>
                        <p:column headerText="#{msg.accessoryQuantity}">
                            <h:outputText value="#{item.apartsQuantity}"/>
                        </p:column>
                        <p:column headerText="#{msg.EstimatedUnitPriceRMB}">
                            <h:outputText value="#{item.partsPrice}">
                                <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.ContractPriceRMB}">
                            <h:outputText value="#{item.closedPrice}">
                                <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.PartType}">
                            <h:outputText value="#{fieldMsg.fieldValue('partsType', item.partsType)}" />
                        </p:column>
                        <p:column headerText="#{msg.SerialNumber}">
                            <h:outputText value="#{item.serialNum}" />
                        </p:column>
                        <p:column headerText="#{msg.InvoiceNumber}">
                            <h:outputText value="#{item.invoiceNum}" />
                        </p:column>
                        <p:column headerText="#{msg.WarrantyDate}">
                            <h:outputText value="#{item.warrantyDate}">
                                <f:convertDateTime pattern="yyyy-MM-dd"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.EstimatedArrivalTime}">
                            <h:outputText value="#{item.estimatedArriveTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </p:fieldset>
                <h:panelGroup>
                    <label class="label">#{msg.feedbackComment}</label>
                    <p:inputTextarea id="comment" class="beizhuClass" value="#{v2PmOrderController.comments}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4" maxlength="100" requiredMessage="#{msg.MustProvideTheReasonForApprovalFailure}"/>
                </h:panelGroup>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.preApprovePMOrder()}" value="#{msg.ApprovalP}" update="pmTab:signatureDlg" icon="ui-icon-check" oncomplete="handleComplete(xhr, status, args);"/>
                    <p:commandButton style="display: none" id="partRefresh" update="pmTab:pmOrderListForm @(.beizhuClass) @(.selectCheckBoxHeader) @(.selectCheckBox)"/>
                    <p:commandButton style="display: none" id="openSignature" actionListener="#{v2PmOrderController.getSignature()}" value="#{msg.ViewSignature}" update="pmTab:signatureDlg" oncomplete="PF('signatureDlg').show();" />
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{v2PmOrderController.cancel()}" icon="ui-icon-cancel" onclick="PF('pmapproveDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
        <script>
            function handleComplete(xhr, status, args){
                if(xhr.status===205){
                    document.getElementById('pmTab:pmapproveDialogForm:openSignature').click();
                }else{
                    if (args.needComents) {
                        $('#pmTab\\:pmapproveDialogForm\\:comment').addClass("ui-state-error");
                    } else {
                        handleSubmit(args, 'pmapproveDialog');
                        document.getElementById('pmTab:pmapproveDialogForm:partRefresh').click();
                    }
                }
            }
            function handleApproveSuccess(xhr, status, args) {
                if(xhr.status!==206){
                    document.getElementById('pmTab:signatureForm:refreshDataTable').click();
                    handleSubmit(args, 'signatureDlg');
                    handleSubmit(args, 'pmapproveDialog');
                }
            }
        </script>
    </p:dialog>
    <p:dialog id="signatureDlg" widgetVar="signatureDlg" header="#{msg.Signature}" modal="true">
        <h:form id="signatureForm">
            <h:panelGrid columnClasses="value" columns="1">
                <h:panelGroup>
                    <p:signature id="signatureContent" style="width:400px;height:200px" widgetVar="sigPanel" base64Value="#{v2PmOrderController.signatureContent}"
                                 guideline="false" rendered="#{v2PmOrderController.signatureContentStream==null}" />
                    <p:graphicImage value="#{v2PmOrderController.signatureContentStream}" stream="false" rendered="#{v2PmOrderController.signatureContentStream!=null}"></p:graphicImage>
                </h:panelGroup>
            </h:panelGrid>
            <p:commandButton value="#{msg.Confirm}" actionListener="#{v2PmOrderController.saveSignatureAndSubmitApprove()}" update="pmTab:signatureForm" oncomplete="handleApproveSuccess(xhr, status, args);"/>
            <p:commandButton immediate="true" process="@this" style="display: none" id="refreshDataTable" update="pmTab:pmOrderListForm @(.beizhuClass) @(.selectCheckBoxHeader) @(.selectCheckBox)"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Rewrite}" actionListener="#{v2PmOrderController.resetSignature()}" update="pmTab:signatureForm" oncomplete="PF('sigPanel').clear()"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" onclick="PF('signatureDlg').hide()"/>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
