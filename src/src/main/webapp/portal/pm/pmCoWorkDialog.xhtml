<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>

    <p:dialog class="pmcoworkerDlgClass" id="pmcoworkerDlg"  widgetVar="pmcoworkerDlg" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.coworker}" >
        <h:form id="pmcoworkerDlgForm">
            <h:panelGroup >
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">#{msg.coworker}</label>
                        <p:selectOneMenu id="selectEmployee" value="#{v2PmOrderController.coWorkerDetail.cowokerUserId}" required="true" requiredMessage="#{msg.coworker} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{v2PmOrderController.getWorkerList()}" var="item1" itemLabel="#{item1.name}" itemValue="#{item1.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{v2PmOrderController.selectedPmOrder.coworkerEntryType==1}">
                        <label class="label">开始时间*</label>
                        <p:calendar  timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm"  value="#{v2PmOrderController.coWorkerDetail.startTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="开始时间#{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{v2PmOrderController.selectedPmOrder.coworkerEntryType==1}">
                        <label class="label">结束时间*</label>
                        <p:calendar  timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm"  value="#{v2PmOrderController.coWorkerDetail.endTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="结束时间#{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{v2PmOrderController.selectedPmOrder.coworkerEntryType==0}">
                        <label class="label">#{msg.InternalManhoursHours}*</label>
                        <p:inputNumber decimalPlaces="2" maxValue="999" id="manHours" value="#{v2PmOrderController.coWorkerDetail.manHours}" required="true" requiredMessage="#{msg.InternalManhoursHours} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea value="#{v2PmOrderController.coWorkerDetail.remark}" rows="3"  cols="30"  queryDelay="750" minQueryLength="4" maxlength="100"/>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.addCoWokerItem}" value="#{msg.Save}" update="pmTab:pmrepairCompleteDialogForm:pmcoworkerList :growl  @(.pmcoworkerDlgClass)" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmcoworkerDlg');"/>
                    <p:commandButton immediate="true" actionListener="#{v2PmOrderController.cancelWorkdetail}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmcoworkerDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
