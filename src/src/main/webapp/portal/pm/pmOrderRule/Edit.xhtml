        <p:dialog id="PmOrderRuleEditDlg" widgetVar="PmOrderRuleEditDialog" width="1000" height="480" modal="true" resizable="true" draggable="true" appendTo="@this" header=" #{msg.PmOrderRule}">
            <h:form id="PmOrderRuleEditForm">

                                <p:ajax process="@this" event="itemSelect" listener="#{pmOrderRuleController.setNothing()}"/>
                                <p:ajax process="@this" listener="#{pmOrderRuleController.setNothing()}"/>
                            </p:autoComplete>
                            <!--<p:selectOneMenu value="#{pmOrderRuleController.selected.manufacture}" style="max-width: 200px">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{generatePmOrdersController.getSupplier()}" var="item" itemLabel="#{item.name}" itemValue="#{item.name}"/>
                            </p:selectOneMenu>-->
                        </h:panelGroup>
                <!--        <h:panelGroup >
                            <label class ="label">#{msg.manufacture}</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.manufacture}" disabled="false" required="false" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}" style="max-width: 200px">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getSupplier()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.name}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>-->
                        <h:panelGroup >
                            <label class ="label">#{msg.functionType}</label>

                        </h:panelGroup>
                        <h:panelGroup >

                            </p:calendar>
                        </h:panelGroup>

                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />

                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'm'}">

                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getMonthDays()}" var="day" itemLabel="#{day}号" itemValue="#{day}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'y'}">
                            <label class="label">每年几月 *</label>

                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getMonths()}" var="month" itemLabel="#{month}月" itemValue="#{month}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'y'}">
                            <label class="label">每月几号 *</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.scheduleDay}" required="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'y'}" requiredMessage="每月几号 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getMonthDays()}" var="day" itemLabel="#{day}号" itemValue="#{day}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1}">

                            <p:inputNumber value="#{pmOrderRuleController.selected.completionDays}" minValue="1" maxValue="365" decimalPlaces="0"

                        </h:panelGroup>
<!--                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'd'}">-->
<!--                            <p:outputLabel style="color: red;" value="日周期暂不支持定时周期配置"/>-->
<!--                        </h:panelGroup>-->
                        <h:panelGroup rendered="#{!pmOrderRuleController.getPmRule()}">
                            <label class ="label">#{msg.ruleLevel}*</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.level}" disabled="false" required="true" requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                <p:ajax listener="#{pmOrderRuleController.changeruleLevelTip()}" update=":PmOrderRuleEditForm:tipChange" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.getPmRule()}">
                            <label class ="label">#{msg.ruleLevel}*</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.level}" disabled="false" required="true" requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevelFour')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                <p:ajax listener="#{pmOrderRuleController.changeruleLevelTip()}" update=":PmOrderRuleEditForm:tipChange" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.pmRuleShowScoreFlag eq 'true'}">
                            <label class ="label">#{msg.feedbackRating}</label>
                            <p:inputNumber minValue="0" maxValue="100"  decimalPlaces="1" value="#{pmOrderRuleController.selected.ruleScore}" >
                                <p:ajax />
                            </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">默认工时</label>
                            <p:inputNumber id="defaultWorkHours" value="#{pmOrderRuleController.selected.defaultWorkHours}" minValue="0" decimalPlaces="2" required="false"/>
                        </h:panelGroup>
                    </p:panelGrid>

                   <p:panelGrid id="report" columns="4"  styleClass="ui-panelgrid-blank form-group" layout="grid" rendered="#{pmOrderRuleController.selected != null}">
                    	<h:panelGroup>
	                    	 <label class ="label" >#{msg.safetyReport}</label>
		                   <p:selectOneMenu  value="#{pmOrderRuleController.selected.safetyReport}"  >
                               <p:ajax update="report" />
                               <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                               <f:selectItems value="#{pmOrderRuleController.getTableDefinitionForES()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.baseId}"/>

                                 <h:outputText id="safetyReport"  value="#{pmOrderRuleController.getJsonValueById(pmOrderRuleController.selected.safetyReport)}"  style="display:none" />

	                   <p:commandButton  rendered="#{not empty pmOrderRuleController.selected.safetyReport}" immediate="true" value="#{msg.preview}" onclick="preparePreview(1,'PmOrderRuleEditForm');" oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                       </h:panelGroup>
                       <h:panelGroup></h:panelGroup>
                       <h:panelGroup></h:panelGroup>
                       <h:panelGroup>

                       </h:panelGroup>
                   </p:panelGrid>

                    <p:panelGrid id="xnreport" columns="1"  styleClass="ui-panelgrid-blank form-group" layout="grid" rendered="#{pmOrderRuleController.selected != null}">

                    <h:panelGroup>
	                		<label class ="label">#{msg.performanceReport}</label>
	                     <p:selectOneMenu  value="#{pmOrderRuleController.selected.performanceReport}"  >
	                     		<p:ajax   update="xnreport" />
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getTableDefinition()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.baseId}"/>
                       	</p:selectOneMenu>
                                        <h:outputText id="performanceReport" value="#{pmOrderRuleController.getJsonValueById(pmOrderRuleController.selected.performanceReport)}"  style="display:none"  />
                       	 &nbsp;&nbsp;
                     	<p:commandButton rendered="#{not empty pmOrderRuleController.selected.performanceReport}"  immediate="true" value="#{msg.preview}" onclick="preparePreview(2,'PmOrderRuleEditForm');"  oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                     </h:panelGroup>

                       <!--rendered="#{(not empty pmOrderRuleController.selected.id) and userContextService.hasRole('AssetHead')}"-->
                       <h:panelGroup rendered="#{userContextService.hasRole('AssetHead')}">
                           <!-- hide while creation -->
                           <label class="label">#{msg.MaintenanceTemplate}</label>
                           <p:commandLink value="#{msg.DownloadSampleTemplate}" actionListener="#{pmOrderRuleController.generateReportTemplateFile()}" ajax="false" immediate="true">
                               <p:fileDownload value="#{pmOrderRuleController.reportTemplateFile}"/>
                           </p:commandLink><br/>
                           <!--<p:commandButton value="下载模版示例" actionListener="#{pmOrderRuleController.generateReportTemplateFile()}" process="@this">
                               <p:fileDownload value="#{pmOrderRuleController.reportTemplateFile}"/>
                           </p:commandButton><br/>-->
                           <h:panelGroup id="importReportTemplate">
                               <p:commandButton value="#{msg.ImportTemplate}" process="@this" update="importReportTemplate" oncomplete="PF('uploadEditDialog').show()" rendered="#{empty pmOrderRuleController.selected.reportStorageId}"/>
                               <p:commandLink value="#{pmOrderRuleController.selected.reportTemplateName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(pmOrderRuleController.selected.reportStorageId)}" styleClass="p-mr-2" rendered="#{not empty pmOrderRuleController.selected.reportStorageId}"/>
<!--                               <p:link href="#{fileDownloadService.getFileUrl(pmOrderRuleController.selected.reportStorageId)}" rendered="#{not empty pmOrderRuleController.selected.reportStorageId}">#{pmOrderRuleController.selected.reportTemplateName}</p:link>-->

                       </h:panelGroup>
                   </p:panelGrid>
					 &nbsp;&nbsp;


                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.AddCheckItem}</label>
                            <p:dataTable id="addCheckList" class="addCheckList" value="#{pmOrderRuleController.checkItemLists}" var="item" widgetVar="addCheckList" lazy="false" paginator="false"
                                         rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.name}">
                                    <h:outputText value="#{item.name}" />
                                </p:column>
                                <p:column headerText="#{msg.period}">
                                    <h:outputText value="#{item.period}" />
                                </p:column>
                                <!--<p:column headerText="注意事项">
                                    <h:outputText value="#{item.remark}"  style="word-wrap: break-word;"/>
                                </p:column>-->
                                <p:column headerText="#{msg.Items}">
                                    <h:outputText value="#{item.remark}"  style="word-wrap: break-word;"/>
                                </p:column>
                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" rendered="#{item.uid eq '000'}" disabled="#{pmOrderRuleController.isDisable()}" actionListener="#{pmOrderRuleController.prepareEditItemDetail('new')}" update=":PmOrderRuleItemEditDlg" oncomplete="PF('PmOrderRuleItemEditDlg').show()" />
                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" rendered="#{item.uid ne '000'}"  disabled="#{pmOrderRuleController.isDisable()}" actionListener="#{pmOrderRuleController.prepareEditItemDetail(item.uid)}" update="@(.PmOrderRuleItemEditDlg)" oncomplete="PF('PmOrderRuleItemEditDlg').show()" />
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" rendered="#{item.uid ne '000'}" disabled="#{pmOrderRuleController.isDisable()}" actionListener="#{pmOrderRuleController.deleteItemDetail(item.uid)}" update="@(.addCheckList)" >
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>

                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{pmOrderRuleController.applyChange()}" value="#{msg.Save}"

                    &nbsp;&nbsp;

                    onclick="PF('PmOrderRuleEditDialog').hide()" update = ":PmOrderRuleListForm" />
                    &nbsp;&nbsp;

<p:dialog id="uploadEditDialog" widgetVar="uploadEditDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.UploadTemplateFile}">
<h:form id="uploadEditDialogForm" >
    <h:panelGroup id="display1" >
        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
            <h:panelGroup>
                <label class="label">#{msg.choseFileToUpload}</label>
                <h:outputText   value="#{pmOrderRuleController.uploadedFile.fileName}"  rendered="#{not empty pmOrderRuleController.uploadedFile.fileName}"/>
                <p:fileUpload  fileUploadListener="#{pmOrderRuleController.uploadDataFile}" value="#{pmOrderRuleController.uploadedFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                               multiple="false" sizeLimit="10000000" update=":uploadEditDialogForm" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(docx)$/" label="#{msg.Add}" rendered="#{empty pmOrderRuleController.uploadedFile.fileName}" />
            </h:panelGroup>
            <h:panelGroup>
                <p>#{msg.Description}</p>
                <p>#{msg.UpFileImport}</p>
            </h:panelGroup>
        </p:panelGrid>
        <h:panelGroup>
            <p:commandButton immediate="false" validateClient="true" actionListener="#{pmOrderRuleController.finishUpload()}" disabled="#{empty pmOrderRuleController.uploadedFile}" value="#{msg.Confirm}"
                             update=":PmOrderRuleEditForm:importReportTemplate :uploadEditDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'uploadEditDialog');"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{pmOrderRuleController.cancelUpload()}" icon="ui-icon-cancel" onclick="PF('uploadEditDialog').hide()"/>
        </h:panelGroup>
    </h:panelGroup>
</h:form>
</p:dialog>
    </ui:composition>
