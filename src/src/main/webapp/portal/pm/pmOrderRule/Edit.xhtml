<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="PmOrderRuleEditDlg" widgetVar="PmOrderRuleEditDialog"  height="300" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{pmOrderRuleController.CRUDActionName} #{msg.PmOrderRule}">
            <h:form id="PmOrderRuleEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{pmOrderRuleController.selected != null}">
                        <h:panelGroup >
                            <label class ="label">#{msg.name}</label>
                            <p:inputText id="name" value="#{pmOrderRuleController.selected.name}" />
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.assetGroup}</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.assetGroup}" disabled="false">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                             </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.manufacture}</label>
                             <p:inputText id="manufacture" value="#{pmOrderRuleController.selected.manufacture}" />
                        </h:panelGroup>
                        <h:panelGroup >
                             <label class ="label">#{msg.functionType}</label>
                             <p:inputText id="functionType" value="#{pmOrderRuleController.selected.functionType}" />
                        </h:panelGroup>
                        <h:panelGroup >
                               <label class="label">审核人</label>
                               <p:selectOneMenu id="group" value="#{pmOrderRuleController.selected.approveUserId}" >
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                   <f:selectItems value="#{pmOrderRuleController.getApproveUserList(pmOrderRuleController.selected.tenantUID)}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                               </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label>#{msg.period}</label>
                            <p:inputText id="period" value="#{pmOrderRuleController.selected.period}" />
                        </h:panelGroup>
                    </p:panelGrid>
                     <br/>
                     <br/>
                     <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{pmOrderRuleController.getAllItems().size() >0}">
		                  <p:selectManyCheckbox id="grid2" value="#{pmOrderRuleController.ids}" layout="responsive" columns="5" rendered="#{pmOrderRuleController.getSelectedIds() != null}">
		                  	<f:selectItems value="#{pmOrderRuleController.getAllItems()}" var="i" itemLabel="#{i.name}(#{i.period}月)" itemValue="#{i.id}" />
					     </p:selectManyCheckbox>	
                     </p:panelGrid>
					<br/>
                    <p:commandButton validateClient="true" actionListener="#{pmOrderRuleController.applyChange()}" value="#{msg.Save}" update="display,:PmOrderRuleEditDlg, :PmOrderRuleListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'PmOrderRuleEditDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('PmOrderRuleEditDialog').hide()"/>
                      &nbsp;&nbsp;
                    <p:commandButton validateClient="true" actionListener="#{pmOrderRuleController.approve()}" value="审核" update="display,:PmOrderRuleEditDlg, :PmOrderRuleListForm:datalist, :growl" 
                    icon="ui-icon-check" oncomplete="handleSubmit(args, 'PmOrderRuleEditDialog');" rendered="#{userContextService.hasRole('AssetHead') and pmOrderRuleController.selected.id != null}"/> 
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
