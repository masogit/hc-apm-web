<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

		<style>
			table.checkboxGroup tr td:nth-child(2)  {
				text-align: left;
			}
		</style>

        <p:dialog id="PmOrderRuleEditDlg" widgetVar="PmOrderRuleEditDialog" width="1000" height="480" modal="true" resizable="true" draggable="true" appendTo="@this" header=" #{msg.PmOrderRule}">
            <h:form id="PmOrderRuleEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{pmOrderRuleController.selected != null}">
                        <h:panelGroup>
                            <label class="label">#{msg.orgId}*</label>
                            <p:inputText id="selectedUserOrgName" value="#{pmOrderRuleController.getOrgFullName(pmOrderRuleController.selectedUserOrg)}" readonly="true" required="true" requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
                            <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                            <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;" value="#{pmOrderRuleController.orgTree}" selection="#{pmOrderRuleController.selectedNode}" var="node" selectionMode="single">
                                        <p:ajax process="@this" event="select" update=":PmOrderRuleEditForm" listener="#{pmOrderRuleController.onSelectOrgForUser}" oncomplete="PF('varPanelOrg4User').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>

                        <h:panelGroup >
                            <label class ="label">#{msg.assetName} *</label>
                            <p:inputText id="assetName" value="#{pmOrderRuleController.selected.assetName}" required="true" requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.assetGroup}</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.assetGroup}" disabled="false" required="false" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}">
                               	<p:ajax update="report" />
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.manufacture}</label>
                            <p:autoComplete id="manufacture" value="#{pmOrderRuleController.selected.manufacture}" dropdown="true" scrollHeight="300"
                                            forceSelection="true" required="false" requiredMessage="" completeMethod="#{pmOrderRuleController.getSupplier}"
                                            var="t" itemLabel="#{t}" itemValue="#{t}">
                                <p:ajax process="@this" event="itemSelect" listener="#{pmOrderRuleController.setNothing()}"/>
                                <p:ajax process="@this" listener="#{pmOrderRuleController.setNothing()}"/>
                            </p:autoComplete>
                            <!--<p:selectOneMenu value="#{pmOrderRuleController.selected.manufacture}" style="max-width: 200px">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{generatePmOrdersController.getSupplier()}" var="item" itemLabel="#{item.name}" itemValue="#{item.name}"/>
                            </p:selectOneMenu>-->
                        </h:panelGroup>
                <!--        <h:panelGroup >
                            <label class ="label">#{msg.manufacture}</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.manufacture}" disabled="false" required="false" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}" style="max-width: 200px">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getSupplier()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.name}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>-->
                        <h:panelGroup >
                            <label class ="label">#{msg.functionType}</label>
                            <p:inputText id="functionType" value="#{pmOrderRuleController.selected.functionType}" required="false" requiredMessage="#{msg.functionType} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.period}(月)</label>
                            <p:inputNumber id="period" value="#{pmOrderRuleController.selected.period}" minValue="0" maxValue="120" decimalPlaces="0" 
                            required="false" requiredMessage="超出范围（只能是1到120）！"  />
                           <!--  <p: id="period"  value="#{pmOrderRuleController.selected.period}" required="false" requiredMessage="#{msg.period} #{msg.ValidationRequire}"/> -->
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.feedbackComment}</label>
                            <p:inputText id="remark" value="#{pmOrderRuleController.selected.remark}" required="false" requiredMessage="#{msg.manufacture} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.ruleLevel}*</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.level}" disabled="false" required="true" requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>
                    
                   <p:panelGrid id="report" columns="1"  styleClass="ui-panelgrid-blank form-group" layout="grid" rendered="#{pmOrderRuleController.selected != null}">
                    	<h:panelGroup>
	                    	 <label class ="label" >#{msg.safetyReport}</label>
		                   <p:selectOneMenu  value="#{pmOrderRuleController.selected.safetyReport}"  >
                               <p:ajax update="report" />
                               <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                               <f:selectItems value="#{pmOrderRuleController.getTableDefinitionForES()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.baseId}"/>
	                       </p:selectOneMenu>
                                 <h:outputText id="safetyReport"  value="#{pmOrderRuleController.getJsonValueById(pmOrderRuleController.selected.safetyReport)}"  style="display:none" />
	                        &nbsp;&nbsp;
	                   <p:commandButton  rendered="#{not empty pmOrderRuleController.selected.safetyReport}" immediate="true" value="预览" onclick="preparePreview(1,'PmOrderRuleEditForm');" oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                       </h:panelGroup>
	                   
	                  <h:panelGroup>
	                		<label class ="label">#{msg.performanceReport}</label>
	                     <p:selectOneMenu  value="#{pmOrderRuleController.selected.performanceReport}"  >
	                     		<p:ajax   update="report" />
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getTableDefinition()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.baseId}"/>
                       	</p:selectOneMenu>
                                        <h:outputText id="performanceReport" value="#{pmOrderRuleController.getJsonValueById(pmOrderRuleController.selected.performanceReport)}"  style="display:none"  />
                       	 &nbsp;&nbsp;
                     	<p:commandButton rendered="#{not empty pmOrderRuleController.selected.performanceReport}"  immediate="true" value="预览" onclick="preparePreview(2,'PmOrderRuleEditForm');"  oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                     </h:panelGroup>

                       <h:panelGroup rendered="#{(not empty pmOrderRuleController.selected.id) and userContextService.hasRole('AssetHead')}">
                           <!-- hide while creation -->
                           <label class="label">保养模版</label>
                           <p:commandLink value="下载模版示例" actionListener="#{pmOrderRuleController.generateReportTemplateFile()}" ajax="false">
                               <p:fileDownload value="#{pmOrderRuleController.reportTemplateFile}"/>
                           </p:commandLink><br/>
                           <h:panelGroup id="importReportTemplate">
                               <p:commandButton value="导入模版" process="@this" update="importReportTemplate" oncomplete="PF('uploadDialog').show()" rendered="#{empty pmOrderRuleController.selected.reportStorageId}"/>
                               <p:link href="#{fileDownloadService.getFileUrl(pmOrderRuleController.selected.reportStorageId)}" rendered="#{not empty pmOrderRuleController.selected.reportStorageId}">#{pmOrderRuleController.selected.reportTemplateName}</p:link>
                               <p:commandButton icon="ui-icon-close" class="btn btn-sm btn-gray" title="${msg.Delete}" update=":PmOrderRuleEditForm:importReportTemplate :uploadDialogForm :growl" process="@this" actionListener="#{pmOrderRuleController.removeReportTemplate}" rendered="#{not empty pmOrderRuleController.selected.reportStorageId}"/>
                           </h:panelGroup>
                       </h:panelGroup>
                   </p:panelGrid>
					 &nbsp;&nbsp;


                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">增加检查项</label>
                            <p:dataTable id="addCheckList" class="addCheckList" value="#{pmOrderRuleController.checkItemLists}" var="item" widgetVar="addCheckList" lazy="false" paginator="false"
                                         rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.name}">
                                    <h:outputText value="#{item.name}" />
                                </p:column>
                                <p:column headerText="#{msg.period}">
                                    <h:outputText value="#{item.period}" />
                                </p:column>
                                <!--<p:column headerText="注意事项">
                                    <h:outputText value="#{item.remark}"  style="word-wrap: break-word;"/>
                                </p:column>-->
                                <p:column headerText="项目内容">
                                    <h:outputText value="#{item.remark}"  style="word-wrap: break-word;"/>
                                </p:column>
                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{pmOrderRuleController.prepareEditItemDetail('new')}" update=":PmOrderRuleItemEditDlg" oncomplete="PF('PmOrderRuleItemEditDlg').show()" rendered="#{item.uid eq '000'}"/>
                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{pmOrderRuleController.prepareEditItemDetail(item.uid)}" update="@(.PmOrderRuleItemEditDlg)" oncomplete="PF('PmOrderRuleItemEditDlg').show()" rendered="#{item.uid ne '000'}" />
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{pmOrderRuleController.deleteItemDetail(item.uid)}" update="@(.addCheckList)" rendered="#{item.uid ne '000'}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{pmOrderRuleController.applyChange()}" value="#{msg.Save}"
                    rendered="#{pmOrderRuleController.selected.status != 1 or userContextService.hasRole('AssetHead')}"
                    update="display,:PmOrderRuleEditForm, :PmOrderRuleListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'PmOrderRuleEditDialog');"/>
                    &nbsp;&nbsp;

                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" 
                    onclick="PF('PmOrderRuleEditDialog').hide()" update = ":PmOrderRuleListForm" />
                    &nbsp;&nbsp;
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <ui:include src="ItemEdit.xhtml"/>


<p:dialog id="uploadDialog" widgetVar="uploadDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="上传模版文件">
<h:form id="uploadDialogForm" >
    <h:panelGroup id="display" >
        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
            <h:panelGroup>
                <label class="label">#{msg.choseFileToUpload}</label>
                <h:outputText   value="#{pmOrderRuleController.uploadedFile.fileName}"  rendered="#{not empty pmOrderRuleController.uploadedFile}"/>
                <p:fileUpload  fileUploadListener="#{pmOrderRuleController.uploadDataFile}" value="#{pmOrderRuleController.uploadedFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                               multiple="false" sizeLimit="10000000" update=":uploadDialogForm" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(docx)$/" label="#{msg.Add}" rendered="#{empty pmOrderRuleController.uploadedFile}" />
            </h:panelGroup>
            <h:panelGroup>
                <p>说明</p>
                <p>上传文件进行导入</p>
            </h:panelGroup>
        </p:panelGrid>
        <h:panelGroup>
            <p:commandButton immediate="false" validateClient="true" actionListener="#{pmOrderRuleController.finishUpload()}" disabled="#{empty pmOrderRuleController.uploadedFile}" value="#{msg.Confirm}"
                             update=":PmOrderRuleEditForm:importReportTemplate :uploadDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'uploadDialog');"/>
            <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{pmOrderRuleController.cancelUpload()}" icon="ui-icon-cancel" onclick="PF('uploadDialog').hide()"/>
        </h:panelGroup>
    </h:panelGroup>
</h:form>
</p:dialog>
    </ui:composition>
</html>
