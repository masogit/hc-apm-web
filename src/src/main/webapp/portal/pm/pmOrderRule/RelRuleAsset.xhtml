<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
       <div class="ui-g clearfix">
       <div class="ui-g-12 card cardTitle">
           <p:outputLabel class="pageTitle" value="#{msg.RelRuleAsset}"/>
       </div>
<script>
    function goBack() {
        window.history.back();
    }
</script>
       <div class="ui-g-12 card">
    
        <h:form id="BatchCreateForm" class="bcls">
<!--              <p:tabView>
                <p:tab > -->
                   <p:panelGrid id="queryCondition" columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                       <h:panelGroup>
                           <label class="label">#{userContextService.isYiMaiYangGuangTenant()?'所属机构':msg.hospitalId}</label>
                           <p:inputText id="selectedUserOrgName" value="#{relRuleAssetController.getOrgFullName(relRuleAssetController.selectedUserOrg)}" readonly="true" required="false" requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
                           <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                           <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                               <p:scrollPanel style="height:300px;border: 0" mode="native">
                                   <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;" value="#{relRuleAssetController.orgTree}" selection="#{relRuleAssetController.selectedNode}" var="node" selectionMode="#{userContextService.isYiMaiYangGuangTenant()?'checkbox':'single'}">
                                       <p:ajax process="@this" event="select" update="BatchCreateForm" listener="#{relRuleAssetController.onSelectOrgForUser}" oncomplete="PF('varPanelOrg4User').hide();"/>
                                       <p:ajax process="@this" event="unselect" update="BatchCreateForm" listener="#{relRuleAssetController.onUnSelectOrgForUser}" oncomplete="PF('varPanelOrg4User').hide();"/>
                                       <p:ajax process="@this" event="expand"/>
                                       <p:ajax process="@this" event="collapse"/>
                                       <p:treeNode type="org">
                                           <h:outputText value="#{node}"/>
                                       </p:treeNode>
									   <p:treeNode type="hidden" rendered="false"/>
                                   </p:tree>
                               </p:scrollPanel>
                           </p:overlayPanel>
                       </h:panelGroup>

                       <h:panelGroup >
                           <label class="label">启用日期开始</label>
                           <p:calendar  timeZone="GMT+8" id="startDate" pattern="yyyy/MM/dd" mask="true" value="#{relRuleAssetController.queryAsset.startInstallDate}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="false" requiredMessage="#{msg.recoveryTime} #{msg.ValidationRequire}">
                               <p:ajax event="dateSelect" process="@this" listener="#{relRuleAssetController.addFilter}" update="AssetsPickList" oncomplete="clinicalDeptNameComplete(xhr, status, args)"></p:ajax>

                           </p:calendar>
                       </h:panelGroup>
                       <h:panelGroup >
                           <label class="label">启用日期结束</label>
                           <p:calendar  timeZone="GMT+8" id="endDate" pattern="yyyy/MM/dd" mask="true" value="#{relRuleAssetController.queryAsset.endInstallDate}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="false" requiredMessage="#{msg.recoveryTime} #{msg.ValidationRequire}">
                               <p:ajax event="dateSelect" process="@this" listener="#{relRuleAssetController.addFilter}" update="AssetsPickList" oncomplete="clinicalDeptNameComplete(xhr, status, args)"></p:ajax>
                           </p:calendar>
                       </h:panelGroup>

                       <h:panelGroup >
                           <label class="label">采购日期开始</label>
                           <p:calendar  timeZone="GMT+8"  pattern="yyyy/MM/dd" mask="true" value="#{relRuleAssetController.queryAsset.purchaseDateStart}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="false" requiredMessage="#{msg.recoveryTime} #{msg.ValidationRequire}">
                               <p:ajax event="dateSelect" process="@this" listener="#{relRuleAssetController.addFilter}" update="AssetsPickList" oncomplete="clinicalDeptNameComplete(xhr, status, args)"></p:ajax>

                           </p:calendar>
                       </h:panelGroup>
                       <h:panelGroup >
                           <label class="label">采购日期结束</label>
                           <p:calendar  timeZone="GMT+8"  pattern="yyyy/MM/dd" mask="true" value="#{relRuleAssetController.queryAsset.purchaseDateEnd}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="false" requiredMessage="#{msg.recoveryTime} #{msg.ValidationRequire}">
                               <p:ajax event="dateSelect" process="@this" listener="#{relRuleAssetController.addFilter}" update="AssetsPickList" oncomplete="clinicalDeptNameComplete(xhr, status, args)"></p:ajax>
                           </p:calendar>
                       </h:panelGroup>



                       <h:panelGroup >
                           <label class ="label">#{msg.clinicalDeptName}</label>
                           <p:autoComplete id="clinicalDeptName" value="#{relRuleAssetController.clinicalOrgInfo}" dropdown="true" scrollHeight="300" style="max-width: 200px"
                                           forceSelection="true" completeMethod="#{relRuleAssetController.getClinicalDeptList}"
                                           var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" >
                               <p:ajax process="@this" event="itemSelect" listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
                               <p:ajax process="@this" listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList"/>
                           </p:autoComplete>

                       </h:panelGroup>

                       <h:panelGroup rendered="#{userContextService.enableDisplayByKey('relRuleAssetDeptFilter')}">
                           <label class ="label">#{msg.assetDeptName}</label>
                           <p:autoComplete id="assetDeptName" value="#{relRuleAssetController.assetDeptOrgInfo}" dropdown="true" scrollHeight="300" style="max-width: 200px"
                                           forceSelection="true" completeMethod="#{relRuleAssetController.getClinicalDeptList}"
                                           var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" >
                               <p:ajax process="@this" event="itemSelect" listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
                               <p:ajax process="@this" listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList"/>
                           </p:autoComplete>

                       </h:panelGroup>

                       <h:panelGroup >
		                     <label class ="label">#{msg.assetName}</label>
	                         <p:inputText  value="#{relRuleAssetController.queryAsset.name}"  required="false">
                                    <p:ajax listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" process="@this" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
                             </p:inputText>
                       </h:panelGroup>
                       <h:panelGroup >
		                     <label class ="label">#{msg.assetGroup}</label>
		                     <p:selectOneMenu value="#{relRuleAssetController.queryAsset.assetGroup}" disabled="false" >
		                              <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" process="@this" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
		                              <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
		                             <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
		                      </p:selectOneMenu>
		                 </h:panelGroup>
		                 <h:panelGroup >
		                     <label class ="label">#{msg.manufacture}</label>
                             <p:autoComplete id="manufacture" value="#{relRuleAssetController.queryAsset.manufacture}" dropdown="true" scrollHeight="300" style="max-width: 200px"
                                             forceSelection="true" required="false" requiredMessage="" completeMethod="#{relRuleAssetController.getSupplier}"
                                             var="t" itemLabel="#{t}" itemValue="#{t}">
                                 <p:ajax process="@this" event="itemSelect" listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
                                 <p:ajax process="@this" listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList"/>
                             </p:autoComplete>

		                 </h:panelGroup>
		                 <h:panelGroup >
		                      <label class ="label">#{msg.functionType}</label>
		                      <p:inputText  value="#{relRuleAssetController.queryAsset.functionType}"  required="false">
                                    <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" process="@this" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
	                          </p:inputText>
		                 </h:panelGroup>

                       <h:panelGroup >
                           <label class ="label">#{msg.brand}</label>
                           <p:inputText  value="#{relRuleAssetController.queryAsset.brand}"  disabled="false">
                               <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" process="@this" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
                           </p:inputText>
                       </h:panelGroup>

                       <h:panelGroup>
                           <label class="label">#{msg.riskGrade}</label>
                           <p:selectOneMenu id="riskGrade" value="#{relRuleAssetController.queryAsset.riskGrade}">
                               <p:ajax process="@this" event="itemSelect" listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
                               <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                               <f:selectItems value="#{fieldMsg.getFieldValueList('riskGrade')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                           </p:selectOneMenu>
                       </h:panelGroup>

                      <h:panelGroup >
                            <label class="label">#{msg.MaintenanceRuleCombine}</label>
                            <p:selectOneRadio id="deviceStatus" value="#{relRuleAssetController.queryAsset.ruleStatus}" >
                                <p:ajax listener="#{relRuleAssetController.addFilter()}" update="queryCondition AssetsPickList" process="@this" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ruleStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneRadio>
                      </h:panelGroup>

                       <h:panelGroup>
                           <label class="label">采购价格（最低）</label>
                           <p:inputNumber minValue="0" decimalPlaces="2" id="purchasePriceStart" value="#{relRuleAssetController.queryAsset.purchasePriceStart}" required="false" >
                               <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" process="@this" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
                           </p:inputNumber>
                       </h:panelGroup>
                       <h:panelGroup>
                           <label class="label">采购价格（最高）</label>
                           <p:inputNumber minValue="0" decimalPlaces="2" id="purchasePriceEnd" value="#{relRuleAssetController.queryAsset.purchasePriceEnd}" required="false" >
                               <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" process="@this" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
                           </p:inputNumber>
                       </h:panelGroup>
                       <h:panelGroup>
                           <label class="label">#{msg.emergencyEquipment}<span style="color:red">#{assetInfoEditController.customConfig.assetFields['emergencyEquipment'].required? '*':''}</span></label>
                           <p:selectOneMenu id="emergencyEquipment" value="#{relRuleAssetController.queryAsset.emergencyEquipment}" >
                               <p:ajax process="@this" event="itemSelect" listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>

                               <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                               <f:selectItems value="#{fieldMsg.getFieldValueList('emergencyEquipment')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                           </p:selectOneMenu>
                       </h:panelGroup>



                       <c:if test="#{userContextService.zkbAccount}" >
                           <h:panelGroup>
                               <label class="label">Modality</label>
                               <p:selectOneMenu id="fileMainDirectory" value="#{relRuleAssetController.queryAsset.mainDirectory}"   >
                                   <p:ajax process="@this" event="itemSelect" listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList fileSecondDirectory"/>
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                   <c:forEach items="#{relRuleAssetController.findMainDirectory()}" var="v">
                                       <f:selectItem itemLabel="#{v.name}" itemValue="#{v.name}"/>
                                   </c:forEach>
                               </p:selectOneMenu>
                           </h:panelGroup>
                           <h:panelGroup>
                               <label class="label">Product</label>
                               <p:selectOneMenu id="fileSecondDirectory" value="#{relRuleAssetController.queryAsset.secondDirectory}"  >
                                   <p:ajax process="@this" event="itemSelect" listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList"/>
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                   <c:forEach items="#{relRuleAssetController.subZkbFileDirectoryList}" var="v">
                                       <f:selectItem itemLabel="#{v.name}" itemValue="#{v.name}"/>
                                   </c:forEach>
                               </p:selectOneMenu>
                           </h:panelGroup>
                       </c:if>


                       <h:panelGroup id="queryLevel" rendered="#{relRuleAssetController.queryAsset.ruleStatus != null}">
                           <label class="label">#{msg.RuleGrade}</label>
                           <p:selectOneMenu value="#{relRuleAssetController.queryAsset.queryLevel}">
                               <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" process="@this" oncomplete="clinicalDeptNameComplete(xhr, status, args)"/>
                               <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                               <c:if test="#{relRuleAssetController.getPmRule()}">
                                   <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevelFour')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                               </c:if>
                               <c:if test="#{!relRuleAssetController.getPmRule()}">
                                   <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                               </c:if>
                           </p:selectOneMenu>
                       </h:panelGroup>
                       <h:panelGroup rendered="#{relRuleAssetController.enableWarrantyDateSearch}">
                           <label class ="label">#{msg.warrantyDate}</label>
                           <p:calendar  timeZone="GMT+8" id="warrantyDate" pattern="yyyy/MM/dd" mask="true" value="#{relRuleAssetController.queryAsset.warrantyDate}" showOn="button" showButtonPanel="true" >
                               <p:ajax event="dateSelect" listener="#{relRuleAssetController.addFilter}" update="AssetsPickList" process="@this"/>

                           </p:calendar>
                       </h:panelGroup>
                   </p:panelGrid>
                    <p:pickList id="AssetsPickList" widgetVar="varPickList" value="#{relRuleAssetController.availableAssets}" var="item"
                                itemValue="#{item}" itemLabel="#{item.name}-#{item.departNum}-#{item.serialNum}-#{item.clinicalDeptName}-#{item.assetDeptName}-#{item.functionType}" showCheckbox="false" responsive="true"
                                showSourceFilter="true" showTargetFilter="true" converter="assetInfoConverter"
                                requiredMessage="#{msg.SelectedEquipment} #{msg.ValidationRequire}"
                                filterMatchMode="contains">
                        <f:facet name="sourceCaption">
                            <p  style="padding-bottom:-200px">#{msg.EquipmentToBeSelected}
                                <br/> <br/>
                            <span style="width:18%;float: left">#{msg.name}</span>
                            <span style="width:20%;float: left">#{msg.departNum}</span>
                            <span style="width:15%;float: left">#{msg.serialNum}</span>
                            <span style="width:12%;float: left">#{msg.clinicalDeptName}</span>
                            <h:panelGroup rendered="#{userContextService.enableDisplayByKey('relRuleAssetDeptFilter')}">
                                <span style="width:12%;float: left">#{msg.assetDeptName}</span>
                            </h:panelGroup>
                            <span style="width:15%;float: left">#{msg.functionType}</span>
                                <br/>
                            </p>
                        </f:facet>
                        <f:facet name="targetCaption">

                            <p  style="padding-bottom:-200px">#{msg.SelectedEquipment}
                                <br/> <br/>
                                <span style="width:18%;float: left">#{msg.name}</span>
                                <span style="width:20%;float: left">#{msg.departNum}</span>
                                <span style="width:15%;float: left">#{msg.serialNum}</span>
                                <span style="width:12%;float: left">#{msg.clinicalDeptName}</span>
                                <h:panelGroup rendered="#{userContextService.enableDisplayByKey('relRuleAssetDeptFilter')}">
                                    <span style="width:12%;float: left">#{msg.assetDeptName}</span>
                                </h:panelGroup>
                                <span style="width:15%;float: left">#{msg.functionType}</span>
                                <br/>
                            </p>
                        </f:facet>
                        <p:ajax event="transfer" listener="#{relRuleAssetController.onAssetsTransfer}" />
                      <!--  <p:ajax event="filter" listener="#{relRuleAssetController.onFilter}" />
-->
                        <p:column style="width:20%;float: left ;">
                            <h:outputText value="#{item.name}" />
                        </p:column>
                        <p:column style="width:25%;float: left ;">
                            <h:outputText value="#{item.departNum}" />
                        </p:column>
                        <p:column style="width:20%;float: left ;">
                            <h:outputText value="#{item.serialNum}" />
                        </p:column>

<!--                        <p:column style="float: left;width:20%;">
                            <h:outputText value="#{relRuleAssetController.getStrDate(item.lastPmDate)}" />
                        </p:column> -->
                        <!--<p:column style="float: left;width:20%;">
                            <h:outputText value="#{relRuleAssetController.getOrgName(item.siteUID)}" />
                        </p:column>-->
                         <p:column style="width:12%;float: left ;">
                            <h:outputText value="#{item.clinicalDeptName}" />
                        </p:column>
                         <p:column style="width:12%;float: left ;" rendered="#{userContextService.enableDisplayByKey('relRuleAssetDeptFilter')}">
                            <h:outputText value="#{item.assetDeptName}" />
                        </p:column>
                        <p:column style="width:15%;float: left ;">
                            <h:outputText value="#{item.functionType}" />
                        </p:column>
                    </p:pickList>
                    <br/> <br/>
                    <p:commandButton id ="hidden1" value="hello1" style="display:none"/>
                    <p:panelGrid id ="PmOrderRule" columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                              <label class="label">#{msg.ruleLevel}*</label>
                              <p:selectOneMenu id="ruleLevel" value="#{relRuleAssetController.level}" disabled="false" required="true" requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}">
	                            	<p:ajax listener="#{relRuleAssetController.clearPmOrderRule()}" update="PmOrderRule"/>
	                             <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                  <c:if test="#{relRuleAssetController.getPmRule()}">
                                      <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevelFour')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                  </c:if>
                                  <c:if test="#{!relRuleAssetController.getPmRule()}">
                                      <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                  </c:if>
                              </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.PmOrderRule}*</label>
                            <p:autoComplete id="SelectedPmOrderRule" value="#{relRuleAssetController.pmOrderRule}" dropdown="true" scrollHeight="300" rendered="#{relRuleAssetController.level > 0}"
                                            forceSelection="true" required="true" requiredMessage="#{msg.PmOrderRule}#{msg.ValidationRequire}" completeMethod="#{relRuleAssetController.getRuleList}"
                                            var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="pmOrderRuleConverter">
                                    <p:ajax process="@this" event="itemSelect" listener="#{relRuleAssetController.setRuleId()}"/>
                                    <p:ajax process="@this" listener="#{relRuleAssetController.setRuleId()}"/>
                            </p:autoComplete>
                        </h:panelGroup>

                        <!-- <h:panelGroup >
                              <label class="label">#{msg.PmOrderRule}*</label>
                               <p:selectOneMenu id="pmOrderRule" value="#{relRuleAssetController.pmOrderRuleUID}"
                               required="true" requiredMessage="#{msg.PmOrderRule}#{msg.ValidationRequire}"  rendered="#{relRuleAssetController.level > 0}">
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                  &lt;!&ndash;  <f:selectItems value="#{fieldMsg.getFieldValueList('deviceType')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/> &ndash;&gt;
                                   <f:selectItems value="#{relRuleAssetController.getPmOrderRuleList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                               </p:selectOneMenu>
                        </h:panelGroup>-->

                    </p:panelGrid>
                    <br/> <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{relRuleAssetController.saveRel()}" value="#{msg.Save}" icon="ui-icon-check" update=":growl" />
                        <p:commandButton id="returnButton" value="#{msg.Return}" icon="ui-icon-arrow-back"  immediate="true" onclick="javascript:goBack();"/>
                    </h:panelGroup>
                    <!--<p:panelGrid id ="buttonGrid" columns="12" layout="grid" styleClass="ui-panelgrid-blank form-group">-->
                        <!---->
                        <!--<p:commandButton validateClient="true" actionListener="#{relRuleAssetController.saveRel()}" value="#{msg.Save}" icon="ui-icon-check" update=":growl" />-->
                        <!--<p:commandButton id="returnButton" value="#{msg.Return}" icon="ui-icon-arrow-back" action="/portal/pm/relRuleAsset/List.xhtml" immediate="true" />-->
                    <!--</p:panelGrid>-->
<!--                 </p:tab>
            </p:tabView> -->
               <br/>
             
             <!-- <p:commandButton validateClient="true" actionListener="#{relRuleAssetController.saveRel()}" value="#{msg.Save}" 
            icon="ui-icon-check" update="BatchCreateForm,:growl" action = "RelRuleAsset"/> -->
        </h:form>
        </div>
      </div>

        <script>

            afterPageLoad = function() {
                var obj=document.getElementById('BatchCreateForm:AssetsPickList_source_filter');
                obj.setAttribute('placeholder','名称/设备编号(院方)/制造商序列号/所属科室/型号');
                var obj2=document.getElementById('BatchCreateForm:AssetsPickList_target_filter');
                obj2.setAttribute('placeholder','名称/设备编号(院方)/制造商序列号/所属科室/型号');

            };

            function clinicalDeptNameComplete(xhr, status, args){
                var obj=document.getElementById('BatchCreateForm:AssetsPickList_source_filter');
                obj.setAttribute('placeholder','名称/设备编号(院方)/制造商序列号/所属科室/型号');
                var obj2=document.getElementById('BatchCreateForm:AssetsPickList_target_filter');
                obj2.setAttribute('placeholder','名称/设备编号(院方)/制造商序列号/所属科室/型号');
            }
        </script>

                <p:outputLabel value="#{msg.To}"/>
