<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
       <div class="ui-g clearfix">
       <div class="ui-g-12 card cardTitle">
           <p:outputLabel class="pageTitle" value="#{msg.RelRuleAsset}"/>
       </div>

       <div class="ui-g-12 card">
    
        <h:form id="BatchCreateForm">
<!--              <p:tabView>
                <p:tab > -->
                   <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                          <h:panelGroup >
		                     <label class ="label">#{msg.assetName}</label>
	                         <p:inputText  value="#{relRuleAssetController.queryAsset.name}"  required="false">
                                    <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList PmOrderRule" />
                             </p:inputText>
		                 </h:panelGroup>
		                 <h:panelGroup >
		                     <label class ="label">#{msg.assetGroup}</label>
		                     <p:selectOneMenu value="#{relRuleAssetController.queryAsset.assetGroup}" disabled="false" >
		                              <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList PmOrderRule" />
		                              <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
		                             <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
		                      </p:selectOneMenu>
		                 </h:panelGroup>
		                 <h:panelGroup >
		                     <label class ="label">#{msg.manufacture}</label>
		                      <p:inputText  value="#{relRuleAssetController.queryAsset.manufacture}"  required="false">
	                                    <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList PmOrderRule"  />
	                          </p:inputText>
		                 </h:panelGroup>
		                 <h:panelGroup >
		                      <label class ="label">#{msg.functionType}</label>
		                      <p:inputText  value="#{relRuleAssetController.queryAsset.functionType}"  required="false">
	                                    <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList PmOrderRule" />
	                          </p:inputText>
		                 </h:panelGroup>
		                 <h:panelGroup >
		                      <label class ="label">#{msg.clinicalDeptName}</label>
		                      <p:selectOneMenu value="#{relRuleAssetController.queryAsset.clinicalDeptId}" disabled="false" >
		                              <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList PmOrderRule" />
		                              <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
		                              <f:selectItems value="#{assetInfoService.getClinicalDeptList(relRuleAssetController.siteUid)}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
		                      </p:selectOneMenu>
		                 </h:panelGroup>
                       <h:panelGroup >
                           <label class ="label">#{msg.brand}</label>
                           <p:inputText  value="#{relRuleAssetController.queryAsset.brand}"  disabled="false">
                               <p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList PmOrderRule"  />
                           </p:inputText>
                       </h:panelGroup>

		                  <h:panelGroup >
                                <label class="label">保养规则(该过滤条件不会单独生效，需要配合以上条件)</label>
                                <p:selectOneRadio id="deviceStatus" value="#{relRuleAssetController.queryAsset.ruleStatus}" >
                                		<p:ajax  listener="#{relRuleAssetController.addFilter()}" update="AssetsPickList" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('ruleStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneRadio>
                            </h:panelGroup>
                    </p:panelGrid>
                    
                    <p:pickList id="AssetsPickList" value="#{relRuleAssetController.availableAssets}" var="item"
                                itemValue="#{item}" itemLabel="#{item.name}" showCheckbox="false" responsive="true"
                                showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter"
                                required="false" requiredMessage="已选设备 #{msg.ValidationRequire}">
                        <f:facet name="sourceCaption">待选设备</f:facet>
                        <f:facet name="targetCaption">已选设备</f:facet>
                        <p:ajax event="transfer" listener="#{relRuleAssetController.onAssetsTransfer}" />
                        <p:column style="float: left;width:25%;">
                            <h:outputText value="#{item.name}" />
                        </p:column>
                        <p:column style="float: left;width:30%;">
                            <h:outputText value="#{item.departNum}" />
                        </p:column>
<!--                        <p:column style="float: left;width:20%;">
                            <h:outputText value="#{relRuleAssetController.getStrDate(item.lastPmDate)}" />
                        </p:column> -->
                        <p:column style="float: left;width:20%;">
                            <h:outputText value="#{relRuleAssetController.getOrgName(item.siteUID)}" />
                        </p:column>
                         <p:column style="float: left;width:25%;">
                            <h:outputText value="#{item.clinicalDeptName}" />
                        </p:column> 
                    </p:pickList>
                    <br/> <br/>
                    <p:panelGrid id ="PmOrderRule" columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    		<h:panelGroup >
                              <label class="label">#{msg.ruleLevel}*</label>
                              <p:selectOneMenu id="ruleLevel" value="#{relRuleAssetController.level}" disabled="false" required="true" requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}">
	                            	<p:ajax  listener="#{relRuleAssetController.addFilter()}" update="PmOrderRule" />
	                             <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
	                             <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
		                      </p:selectOneMenu>
                          </h:panelGroup>
                            
                    		<h:panelGroup >
                       		<label class="label">#{msg.PmOrderRule}*</label>
                               <p:selectOneMenu id="pmOrderRule" value="#{relRuleAssetController.pmOrderRuleUID}"  
                               required="true" requiredMessage="#{msg.PmOrderRule}#{msg.ValidationRequire}"  rendered="#{relRuleAssetController.level > 0}">
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                  <!--  <f:selectItems value="#{fieldMsg.getFieldValueList('deviceType')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/> -->
                                   <f:selectItems value="#{relRuleAssetController.getPmOrderRuleList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                               </p:selectOneMenu>
                        </h:panelGroup>
                        
                        	<h:panelGroup >
			                   <p:commandButton validateClient="true" actionListener="#{relRuleAssetController.saveRel()}" value="#{msg.Save}" 
			            		icon="ui-icon-check" update=":growl" />
			            		<!-- action = "RelRuleAsset" -->
			             </h:panelGroup>
                        <center>

			           </center>
                    </p:panelGrid>
<!--                 </p:tab>
            </p:tabView> -->
               <br/>
             
             <!-- <p:commandButton validateClient="true" actionListener="#{relRuleAssetController.saveRel()}" value="#{msg.Save}" 
            icon="ui-icon-check" update="BatchCreateForm,:growl" action = "RelRuleAsset"/> -->
        </h:form>
        </div>
      </div>
        
    </ui:define>
</ui:composition>
