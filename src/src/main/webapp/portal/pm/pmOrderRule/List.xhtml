<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">
				<div class="ui-g-12 card cardTitle">
                	<p:outputLabel class="pageTitle" value="#{msg.PmOrderRule}"/>
            	</div>
            <h:form id="PmOrderRuleListForm">
                <p:dataTable id="datalist" value="#{pmOrderRuleController.lazyModel}" var="item" widgetVar="varDataList"
                    selectionMode="single" selection="#{pmOrderRuleController.selected}"
                    lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                    rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                    paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                    currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                    rows="20" emptyMessage="#{msg.noRecordFound}"
                    rowsPerPageTemplate="20,50,100,500">

                    <p:ajax event="rowSelect" update="createButton editButton deleteButton approveButton saveAsButton"/>
                    <p:ajax event="filter" listener="#{pmOrderRuleController.onFilter}" update="createButton editButton deleteButton"/>
                    <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />

                    <p:column width="36" id="checkBoxColumn">
                        <p:selectBooleanCheckbox value="#{pmOrderRuleController.selectedMap[item.uid]}"  class="selectCheckBox">
                            <p:ajax process="@this" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                        </p:selectBooleanCheckbox>
                        <f:facet name="header"  >
                            <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                <p:ajax listener="#{pmOrderRuleController.onSelectAllOfPage}" update="@(.selectCheckBox) :PmOrderRuleListForm:datalist:batchToBeTerminatedButton" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                        </f:facet>
                    </p:column>

                     <p:column headerText="#{msg.name}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column headerText="#{msg.assetName}" sortBy="#{item.assetName}" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetName}"/>
                    </p:column>
                    <p:column headerText="#{msg.assetGroup}" sortBy="#{item.assetGroup}" filterBy="#{item.assetGroup}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('assetGroup',item.assetGroup)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" height="200">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="#{msg.manufacture}" sortBy="#{item.manufacture}" filterBy="#{item.manufacture}" filterMatchMode="LIKE">
                   		<h:outputText value="#{item.manufacture}"/>
                    </p:column>
                    <p:column headerText="#{msg.functionType}" sortBy="#{item.functionType}" filterBy="#{item.functionType}" filterMatchMode="LIKE">
                       <h:outputText value="#{item.functionType}"/>
                    </p:column>
                    <p:column headerText="#{msg.approveUserId}" sortBy="#{item.approveUserId}" filterBy="#{item.approveUserId}" filterMatchMode="EQ">
                        <h:outputText value="#{pmOrderRuleController.getUserName(item.approveUserId)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getApproveUserList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="#{msg.ownerId}" sortBy="#{item.ownerId}" filterBy="#{item.ownerId}" filterMatchMode="EQ">
                        <h:outputText value="#{pmOrderRuleController.getUserName(item.ownerId)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getOwnerList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                     <p:column headerText="#{msg.createdDate}" >
                       	<h:outputText value="#{item.createdDate}">
                            <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                        </h:outputText>
                     </p:column>
                    <p:column headerText="#{msg.period}" sortBy="#{item.period}" filterBy="#{item.period}" filterMatchMode="EQ">
                        <h:outputText value="#{item.period}"/>
                    </p:column>
                    <p:column headerText="#{msg.cyclePeriodUnit}" sortBy="#{item.periodUnit}" filterBy="#{item.periodUnit}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('cyclePeriodUnit',item.periodUnit)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('varDataList').filter()"  autoWidth="false" style="max-width: 150px;" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
<!--                                <f:selectItem itemLabel="年" itemValue="y"/>-->
<!--                                <f:selectItem itemLabel="月" itemValue="m"/>-->
<!--                                <f:selectItem itemLabel="周" itemValue="w"/>-->
<!--                                <f:selectItem itemLabel="日" itemValue="d"/>-->
                                <f:selectItems value="#{fieldMsg.getFieldValueList('cyclePeriodUnit')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="#{msg.feedbackRating}" rendered="#{pmOrderRuleController.pmRuleShowScoreFlag eq 'true'}">
                        <h:outputText value="#{item.ruleScore}"/>
                    </p:column>
                    <p:column headerText="#{msg.status}" sortBy="#{msg.status}" filterBy="#{msg.status}" filterMatchMode="EQ">
                    	    <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{pmOrderRuleController.filterPmRuleStatus}" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('pmRuleStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{fieldMsg.fieldValue('pmRuleStatus',item.status)}"/>
	                 </p:column>
	                 <p:column headerText="#{msg.RuleLevel}" sortBy="#{msg.level}" filterBy="#{msg.level}" filterMatchMode="EQ">
                    	    <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" value="#{pmOrderRuleController.filterPmRuleLevel}" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <c:if test="#{pmOrderRuleController.getPmRule()}">
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevelFour')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </c:if>
                                    <c:if test="#{!pmOrderRuleController.getPmRule()}">
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </c:if>
                                </p:selectOneMenu>
                            </f:facet>
                             <h:outputText value="#{fieldMsg.fieldValue('ruleLevelFour',item.level)}"/>
	                 </p:column>
                    <f:facet name="{Toolbar}">
                        <p:commandButton id="createButton" title="#{msg.Create}"  icon="ui-icon-plus" class="btn btn-sm btn-gray"  actionListener="#{pmOrderRuleController.prepareCreate}" update=":PmOrderRuleEditForm" oncomplete="PF('PmOrderRuleEditDialog').show()" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_RULE_EDIT')}"/>
                        <p:commandButton id="editButton"  title="#{msg.Edit}"  icon="ui-icon-pencil" class="btn btn-sm btn-gray" actionListener="#{pmOrderRuleController.prepareEdit}" update=":PmOrderRuleEditForm" oncomplete="PF('PmOrderRuleEditDialog').show()" disabled="#{empty pmOrderRuleController.selected}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_RULE_EDIT')}"/>
                        <p:commandButton id="saveAsButton"  title="#{msg.SaveAs}"  icon="ui-icon-save" class="btn btn-sm btn-gray"  actionListener="#{pmOrderRuleController.initSaveAs()}" update=":PmOrderRuleSaveAsForm" oncomplete="PF('SaveAsDialog').show()" disabled="#{empty pmOrderRuleController.selected}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_RULE_EDIT')}"/>
                        <p:commandButton id="approveButton"  title="#{msg.Approval}"  icon="ui-icon-check" class="btn btn-sm btn-gray" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_RULE_APPROVE')}" actionListener="#{pmOrderRuleController.prepareEdit}" update=":PmOrderRuleApproveForm" oncomplete="PF('PmOrderRuleApproveDialog').show()" disabled="#{empty pmOrderRuleController.selected}"/>
                        <p:commandButton id="deleteButton" title="#{msg.Delete}"  icon="ui-icon-close" class="btn btn-sm btn-gray" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_RULE_EDIT')}"  actionListener="#{pmOrderRuleController.delete}"  update=":PmOrderRuleEditDlg,datalist"  disabled="#{empty pmOrderRuleController.selected}">
                        	<p:confirm header="#{msg.DeleteConformation}" message="#{msg.ConfirmDeleteRule}" icon="ui-icon-warning"/>
                        </p:commandButton>
                        <p:commandButton title="#{msg.exportToXLS}"  icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist" fileName="PmOrderRule_export"/>
                        </p:commandButton>
                        <p:commandButton  icon="fa fa-cogs" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchModify}评分"  update=":pmBatchModifyForm"   oncomplete="PF('pmBatchModifyDialog').show()"  rendered="#{pmOrderRuleController.pmRuleShowScoreFlag eq 'true'}">
                        </p:commandButton>
                        <ui:fragment >
                            <p:commandButton id="batchToBeTerminatedButton" icon="ui-icon-delete" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchDelete}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_RULE_EDIT')}"
                                             actionListener="#{pmOrderRuleController.batchDelete}" update=":PmOrderRuleListForm" disabled="#{not pmOrderRuleController.isChecked()}">
                                <p:confirm header="#{msg.BatchDeleRuleConfig}" message="#{msg.ConfirmDeleteRule}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </ui:fragment>
                    </f:facet>
                </p:dataTable>
            </h:form>

            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
            <ui:include src="Approve.xhtml"/>
            <ui:include src="SaveAs.xhtml"/>

            <p:dialog id="PmOrderPreviewDlg" widgetVar="PmOrderPreviewDlg" height="500" width="400" modal="true" resizable="false" draggable="true" appendTo="@(body)" header="#{msg.preview}">
                <h:form id="PmOrderPreviewForm" >
                    <iframe src="/wx/form/preview/"  width="100%"  height="490"/>
                </h:form>

            </p:dialog>

            <!--批量修改评分对话框-->
            <p:dialog id="pmBatchModifyDialog" widgetVar="pmBatchModifyDialog" modal="true" width="400" height="150" resizable="true" draggable="true" header="批量修改评分">
                <h:panelGroup>
                    <h:form id="pmBatchModifyForm"  >
                        <label class ="label">评分</label>
                        <p:inputNumber minValue="0" maxValue="100"  decimalPlaces="1" value="#{pmOrderRuleController.modifyScore}" >
                            <p:ajax />
                        </p:inputNumber>
                        <br></br><br></br>
                        <h:panelGroup>
                            <p:commandButton validateClient="true" update="PmOrderRuleListForm:datalist :growl" actionListener="#{pmOrderRuleController.batchModify()}" value="#{msg.Confirm}" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmBatchModifyDialog');"/>
                            <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('pmBatchModifyDialog').hide()"/>
                        </h:panelGroup>
                    </h:form>
                </h:panelGroup>
            </p:dialog >
            <script>
                function preparePreview(index,formName) {
                    var $jasonText;
                    if(index == '1'){
                        $jasonText = $("#"+formName+"\\:safetyReport")[0];
                    }else if(index == '2'){
                        $jasonText = $("#"+formName+"\\:performanceReport")[0];
                    }
                    if ('localStorage' in window) {
                        localStorage.setItem("hc-apm-form-preview", $jasonText.innerText || ''); // # for test/dev perpose
                        localStorage.setItem("hc-apm-token-expireAt", Date.now() + 8640000)
                    }
                  
                }

                //<![CDATA[
                function updateSelectAllCheckBox() {
                    var checkboxlist = $(".selectCheckBox");
                    var selectAllstatus = true;
                    checkboxlist.each(function () {
                        selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                    });
                    $("#PmOrderRuleListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                    if (selectAllstatus) {
                        $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                    } else {
                        $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                    }
                }
                //]]>

            </script>
            </div>
        </div>
        
    </ui:define>

</ui:composition>
