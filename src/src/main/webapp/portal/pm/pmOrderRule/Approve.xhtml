<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:composition>

		<style>
			table.checkboxGroup tr td:nth-child(2)  {
				text-align: left;
			}
		</style>
        <p:dialog id="PmOrderRuleApproveDlg" widgetVar="PmOrderRuleApproveDialog" width="1000" height="480" modal="true" resizable="true" draggable="true" appendTo="@this" header="#{msg.PmOrderRule} #{msg.Approval}">
            <h:form id="PmOrderRuleApproveForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{pmOrderRuleController.selected != null}">
                        <h:panelGroup>
                            <label class="label">#{msg.hospitalId}*</label>
                            <p:inputText id="selectedUserOrgName" value="#{pmOrderRuleController.getOrgFullName(pmOrderRuleController.selectedUserOrg)}" readonly="true" required="true" requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
                            <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                            <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;" value="#{pmOrderRuleController.orgTree}" selection="#{pmOrderRuleController.selectedNode}" var="node" selectionMode="single">
                                        <p:ajax process="@this" event="select" update=":PmOrderRuleApproveForm" listener="#{pmOrderRuleController.onSelectOrgForUser}" oncomplete="PF('varPanelOrg4User').hide();"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
										<p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.assetName} *</label>
                            <p:inputText id="assetName" value="#{pmOrderRuleController.selected.assetName}" required="true" requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.assetGroup}</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.assetGroup}" disabled="false" required="false" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}">
                                    <p:ajax  update="report" />
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                             </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.manufacture}</label>
                            <p:autoComplete id="manufacture" value="#{pmOrderRuleController.selected.manufacture}" dropdown="true" scrollHeight="300"
                                            forceSelection="true" required="false" requiredMessage="" completeMethod="#{pmOrderRuleController.getSupplier}"
                                            var="t" itemLabel="#{t}" itemValue="#{t}">
                                <p:ajax process="@this" event="itemSelect" listener="#{pmOrderRuleController.setNothing()}"/>
                                <p:ajax process="@this" listener="#{pmOrderRuleController.setNothing()}"/>
                            </p:autoComplete>
                            <!--<p:selectOneMenu value="#{pmOrderRuleController.selected.manufacture}" disabled="false" required="false" requiredMessage="#{msg.assetGroup} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getSupplier()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.name}"/>
                            </p:selectOneMenu>-->
                             <!--<p:inputText id="manufacture" value="#{pmOrderRuleController.selected.manufacture}" required="false" requiredMessage="#{msg.manufacture} #{msg.ValidationRequire}"/>-->
                        </h:panelGroup>
                        <h:panelGroup >
                             <label class ="label">#{msg.functionType}</label>
                             <p:inputText id="functionType" value="#{pmOrderRuleController.selected.functionType}" required="false" requiredMessage="#{msg.functionType} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.period}</label>
                            <p:inputNumber id="period" value="#{pmOrderRuleController.selected.period}" minValue="1" maxValue="120" decimalPlaces="0"
                            required="false" requiredMessage="#{msg.OutOfRange}"  />
                           <!--  <p:inputText id="period"  value="#{pmOrderRuleController.selected.period}" required="false" requiredMessage="#{msg.period} #{msg.ValidationRequire}"/> -->
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">循环周期单位</label>
                            <p:selectOneMenu  value="#{pmOrderRuleController.selected.periodUnit}" style="max-width: 150px;" >
                                <p:ajax update="scheduleConfigPanel" process="@this"/>
                                <f:selectItem itemLabel="年" itemValue="y"/>
                                <f:selectItem itemLabel="月" itemValue="m"/>
                                <f:selectItem itemLabel="周" itemValue="w"/>
                                <f:selectItem itemLabel="日" itemValue="d"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.feedbackComment}</label>
                            <p:inputText id="remark" value="#{pmOrderRuleController.selected.remark}" required="false" requiredMessage="#{msg.manufacture} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <!-- 定时周期配置 -->
                        <h:panelGroup>
                            <label class="label">定时周期</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.isScheduleType}">
                                <f:selectItem itemLabel="否" itemValue="0"/>
                                <f:selectItem itemLabel="是" itemValue="1"/>
                                <p:ajax update="scheduleConfigPanel" process="@this"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup/>
                    </p:panelGrid>
                    <!-- 定时周期详细配置 -->
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="scheduleConfigPanel">
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1}">
                            <label class="label">首次生成工单日期 *</label>
                            <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd" value="#{pmOrderRuleController.selected.firstGenerateDate}" 
                                        showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"
                                        required="#{pmOrderRuleController.selected.isScheduleType == 1}" requiredMessage="首次生成工单日期 #{msg.ValidationRequire}">
                            </p:calendar>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'w'}">
                            <label class="label">周几 *</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.scheduleDay}" required="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'w'}" requiredMessage="周几 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItem itemLabel="周一" itemValue="1"/>
                                <f:selectItem itemLabel="周二" itemValue="2"/>
                                <f:selectItem itemLabel="周三" itemValue="3"/>
                                <f:selectItem itemLabel="周四" itemValue="4"/>
                                <f:selectItem itemLabel="周五" itemValue="5"/>
                                <f:selectItem itemLabel="周六" itemValue="6"/>
                                <f:selectItem itemLabel="周日" itemValue="7"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'm'}">
                            <label class="label">每月几号 *</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.scheduleDay}" required="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'm'}" requiredMessage="每月几号 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getMonthDays()}" var="day" itemLabel="#{day}号" itemValue="#{day}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'y'}">
                            <label class="label">每年几月 *</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.scheduleMonth}" required="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'y'}" requiredMessage="每年几月 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getMonths()}" var="month" itemLabel="#{month}月" itemValue="#{month}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'y'}">
                            <label class="label">每月几号 *</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.scheduleDay}" required="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'y'}" requiredMessage="每月几号 #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getMonthDays()}" var="day" itemLabel="#{day}号" itemValue="#{day}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1}">
                            <label class="label">预计完成天数 *</label>
                            <p:inputNumber value="#{pmOrderRuleController.selected.completionDays}" minValue="1" maxValue="365" decimalPlaces="0" 
                                           required="#{pmOrderRuleController.selected.isScheduleType == 1}" requiredMessage="预计完成天数 #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{pmOrderRuleController.selected.isScheduleType == 1 and pmOrderRuleController.selected.periodUnit == 'd'}">
                            <p:outputLabel style="color: red;" value="日周期暂不支持定时周期配置"/>
                        </h:panelGroup>
                        <h:panelGroup >
                            <label class ="label">#{msg.ruleLevel}*</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.selected.level}" disabled="false" required="true" requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}">
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <c:if test="#{pmOrderRuleController.getPmRule()}">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevelFour')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </c:if>
                                <c:if test="#{!pmOrderRuleController.getPmRule()}">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </c:if>
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>

                     <p:panelGrid id="report" columns="1"  styleClass="ui-panelgrid-blank form-group" layout="grid" >
                    	<h:panelGroup>
	                    	 <label class ="label" >#{msg.safetyReport}</label>
		                   <p:selectOneMenu value="#{pmOrderRuleController.selected.safetyReport}"  >
		                   			<p:ajax update="report" />
	                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
	                                <f:selectItems value="#{pmOrderRuleController.getTableDefinitionForES()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.baseId}"/>
	                       </p:selectOneMenu>
	                        <h:outputText style="display:none" id="safetyReport" value="#{pmOrderRuleController.getJsonValueById(pmOrderRuleController.selected.safetyReport)}" />
	                        &nbsp;&nbsp;
	                   <p:commandButton rendered="#{not empty pmOrderRuleController.selected.safetyReport}"  immediate="true" value="#{msg.preview}" onclick="preparePreview(1,'PmOrderRuleApproveForm');" oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                       </h:panelGroup>

                       <h:panelGroup>
	                		<label class ="label">#{msg.performanceReport}</label>
	                     <p:selectOneMenu  value="#{pmOrderRuleController.selected.performanceReport}"  >
	                     		<p:ajax  update="report" />
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{pmOrderRuleController.getTableDefinition()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.baseId}"/>
                       	</p:selectOneMenu>
                                        <h:outputText style="display:none" id="performanceReport" value="#{pmOrderRuleController.getJsonValueById(pmOrderRuleController.selected.performanceReport)}"  />
                       	 &nbsp;&nbsp;
                     	<p:commandButton rendered="#{not empty pmOrderRuleController.selected.performanceReport}"  immediate="true" value="#{msg.preview}" onclick="preparePreview(2,'PmOrderRuleApproveForm');"  oncomplete="PF('PmOrderPreviewDlg').show();" update=":PmOrderPreviewForm"/>
                     </h:panelGroup>

                     <h:panelGroup rendered="#{userContextService.hasRole('AssetHead')}">
                         <label class="label">#{msg.MaintenanceTemplate}</label>
                         <p:commandLink value="#{msg.DownloadSampleTemplate}" actionListener="#{pmOrderRuleController.generateReportTemplateFile()}" ajax="false" immediate="true">
                             <p:fileDownload value="#{pmOrderRuleController.reportTemplateFile}"/>
                         </p:commandLink><br/>
                         <h:panelGroup id="importReportTemplate">
                             <p:commandButton value="#{msg.ImportTemplate}" process="@this" update="importReportTemplate" oncomplete="PF('uploadApproveDialog').show()" rendered="#{empty pmOrderRuleController.selected.reportStorageId}"/>
                             <p:commandLink value="#{pmOrderRuleController.selected.reportTemplateName}" ajax="false" actionListener="#{fileDownloadService.downloadFile(pmOrderRuleController.selected.reportStorageId)}" styleClass="p-mr-2" rendered="#{not empty pmOrderRuleController.selected.reportStorageId}"/>
<!--                             <p:link href="#{fileDownloadService.getFileUrl(pmOrderRuleController.selected.reportStorageId)}" rendered="#{not empty pmOrderRuleController.selected.reportStorageId}">#{pmOrderRuleController.selected.reportTemplateName}</p:link>-->
                             <p:commandButton icon="ui-icon-close" class="btn btn-sm btn-gray" title="${msg.Delete}" update=":PmOrderRuleApproveForm:importReportTemplate :uploadApproveDialogForm :growl" process="@this" actionListener="#{pmOrderRuleController.removeReportTemplate}" rendered="#{not empty pmOrderRuleController.selected.reportStorageId}"/>
                         </h:panelGroup>
                     </h:panelGroup>

                   </p:panelGrid>

                    &nbsp;&nbsp;
                     <!--<p:scrollPanel  style="height:150px">
                        <p:selectManyCheckbox id="grid2" value="#{pmOrderRuleController.ids}" layout="pageDirection" columns="1"   styleClass="checkboxGroup"
                        rendered="#{pmOrderRuleController.getSelectedIds() != null}">
                            <f:selectItems value="#{pmOrderRuleController.getAllItems()}" var="i"  itemLabel="#{i.name}(#{i.period}月)"  itemValue="#{i.id}"  />
                        </p:selectManyCheckbox>
                    </p:scrollPanel>-->

                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.AddCheckItem}</label>
                            <p:dataTable id="addCheckList" class="addCheckList" value="#{pmOrderRuleController.checkItemLists}" var="item" widgetVar="addCheckList" lazy="false" paginator="false"
                                         rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.name}">
                                    <h:outputText value="#{item.name}" />
                                </p:column>
                                <p:column headerText="#{msg.period}">
                                    <h:outputText value="#{item.period}" />
                                </p:column>
                                <!--<p:column headerText="注意事项">
                                    <h:outputText value="#{item.remark}"  style="word-wrap: break-word;"/>
                                </p:column>-->
                                <p:column headerText="#{msg.Items}">
                                    <h:outputText value="#{item.remark}"  style="word-wrap: break-word;"/>
                                </p:column>
                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{pmOrderRuleController.prepareEditItemDetail('new')}" update=":PmOrderRuleItemApproveDlg" oncomplete="PF('PmOrderRuleItemApproveDlg').show()" rendered="#{item.uid eq '000'}"/>
                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{pmOrderRuleController.prepareEditItemDetail(item.uid)}" update="@(.PmOrderRuleItemApproveDlg)" oncomplete="PF('PmOrderRuleItemApproveDlg').show()" rendered="#{item.uid ne '000'}" />
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{pmOrderRuleController.deleteItemDetail(item.uid)}" update="@(.addCheckList)" rendered="#{item.uid ne '000'}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </p:panelGrid>
					<br/>
                    <p:commandButton validateClient="true" actionListener="#{pmOrderRuleController.applyChange()}" value="#{msg.Save}"
                    update="display,:PmOrderRuleApproveDlg, :PmOrderRuleListForm:datalist, :growl" icon="ui-icon-check"
                    oncomplete="handleSubmit(args, 'PmOrderRuleApproveDialog');"/>
                    &nbsp;&nbsp;
                   <!--  immediate="true"  -->
                    <p:commandButton value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('PmOrderRuleApproveDialog').hide()"  update = ":PmOrderRuleListForm:datalist"/>
                      &nbsp;&nbsp;
                      <!-- and pmOrderRuleController.selected.id != null -->
                    <p:commandButton validateClient="true" actionListener="#{pmOrderRuleController.approve()}" value="#{msg.Approval}" update="display,:PmOrderRuleApproveDlg, :PmOrderRuleListForm:datalist, :growl"
                    icon="ui-icon-check" oncomplete="handleSubmit(args, 'PmOrderRuleApproveDialog');" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_RULE_APPROVE') and pmOrderRuleController.selected.status != 1}"/>
                </h:panelGroup>
            </h:form>

        </p:dialog>
        <ui:include src="ItemApprove.xhtml"/>
        <p:dialog id="uploadApproveDialog" widgetVar="uploadApproveDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.UploadTemplateFile}">
            <h:form id="uploadApproveDialogForm" >
                <h:panelGroup id="display1" >
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">#{msg.choseFileToUpload}</label>
                            <h:outputText   value="#{pmOrderRuleController.uploadedFile.fileName}"  rendered="#{not empty pmOrderRuleController.uploadedFile}"/>
                            <p:fileUpload  fileUploadListener="#{pmOrderRuleController.uploadDataFile}" value="#{pmOrderRuleController.uploadedFile}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                           multiple="false" sizeLimit="10000000" update=":uploadApproveDialogForm" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(docx)$/" label="#{msg.Add}" rendered="#{empty pmOrderRuleController.uploadedFile}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <p>#{msg.Description}</p>
                            <p>#{msg.UpFileImport}</p>
                        </h:panelGroup>
                    </p:panelGrid>
                    <h:panelGroup>
                        <p:commandButton immediate="false" validateClient="true" actionListener="#{pmOrderRuleController.finishUpload()}" disabled="#{empty pmOrderRuleController.uploadedFile}" value="#{msg.Confirm}"
                                         update=":PmOrderRuleApproveForm:importReportTemplate :uploadApproveDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'uploadApproveDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{pmOrderRuleController.cancelUpload()}" icon="ui-icon-cancel" onclick="PF('uploadApproveDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
