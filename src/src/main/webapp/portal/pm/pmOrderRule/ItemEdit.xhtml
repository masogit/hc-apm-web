<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"

      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="PmOrderRuleItemEditDlg" widgetVar="PmOrderRuleItemEditDlg" width="650" height="250" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.PmOrderRuleItem}">
            <h:form id="PmOrderRuleItemEditForm">
                <h:panelGroup id="display" class="PmOrderRuleItemEditDlg">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{pmOrderRuleController.pmRuleCheckItem != null}">
                        <h:panelGroup>
                            <label>#{msg.name} *：</label>
                            <p:inputText id="name" value="#{pmOrderRuleController.pmRuleCheckItem.name}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label>#{msg.period} (月) *：</label>
                            <p:inputText id="period" value="#{pmOrderRuleController.pmRuleCheckItem.period}" required="true" requiredMessage="#{msg.period} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label>项目内容 ：</label>
                            <p:inputTextarea id="remark" value="#{pmOrderRuleController.pmRuleCheckItem.remark}" cols="80"/>
                        </h:panelGroup>
                        <!--<h:panelGroup>
                            <label>项目类别 ：</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.pmRuleCheckItem.maintenanceType}" disabled="false" >
                                <f:selectItems value="#{fieldMsg.getFieldValueList('maintenanceType')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label>是否可执行 ：</label>
                            <p:selectOneMenu value="#{pmOrderRuleController.pmRuleCheckItem.executable}" disabled="false" >
                                <f:selectItems value="#{fieldMsg.getFieldValueList('executable')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>-->
                    </p:panelGrid>
                    <p:commandButton validateClient="true" actionListener="#{pmOrderRuleController.addCheckListItem}" update=":PmOrderRuleEditForm:addCheckList :growl" value="#{msg.Save}" icon="ui-icon-check" oncomplete="handleSubmit(args, 'PmOrderRuleItemEditDlg');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{pmOrderRuleController.cancelCheckListItem}" update=":growl" icon="ui-icon-cancel" onclick="PF('PmOrderRuleItemEditDlg').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
