<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"

                template="/WEB-INF/template.xhtml"

    <ui:define name="content">
       <div class="ui-g clearfix">
       <div class="ui-g-12 card cardTitle">
           <p:outputLabel class="pageTitle" value="批量生成保养工单"/>

       <div class="ui-g-12 card">
    
        <h:form id="GeneratePmOrderForm">
                   <p:panelGrid id="param" columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
					   <h:panelGroup>
						   <label class="label">#{msg.ruleLevel}*</label>
						   <p:selectOneMenu id="level" value="#{generatePmOrdersController.level}" required="true" requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}">
							   <p:ajax listener="#{generatePmOrdersController.addFilter()}" update="GeneratePmOrderForm" process="@this" />
							   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
							   <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
						   </p:selectOneMenu>
					   </h:panelGroup>
					   <h:panelGroup>
						   <label class="label">#{msg.orgId}</label>
						   <p:inputText id="selectedUserOrgName" value="#{generatePmOrdersController.getOrgFullName(generatePmOrdersController.selectedUserOrg)}" readonly="true" required="false" requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
						   <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
						   <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
							   <p:scrollPanel style="height:300px;border: 0" mode="native">
								   <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;" value="#{generatePmOrdersController.orgTree}" selection="#{generatePmOrdersController.selectedNode}" var="node" selectionMode="single">
									   <p:ajax process="@this" event="select" update="GeneratePmOrderForm" listener="#{generatePmOrdersController.onSelectOrgForUser}" oncomplete="PF('varPanelOrg4User').hide();"/>
									   <p:ajax process="@this" event="expand"/>
									   <p:ajax process="@this" event="collapse"/>
									   <p:treeNode type="org">
										   <h:outputText value="#{node}"/>
									   </p:treeNode>
								   </p:tree>
							   </p:scrollPanel>
						   </p:overlayPanel>
					   </h:panelGroup>
					   <h:panelGroup >
						   <label class ="label">#{msg.clinicalDeptName}</label>
						   <p:autoComplete id="clinicalDeptName" value="#{generatePmOrdersController.clinicalOrgInfo}" dropdown="true" scrollHeight="300" style="max-width: 200px"
										   forceSelection="true" completeMethod="#{generatePmOrdersController.getClinicalDeptList}"
										   var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" disabled="#{generatePmOrdersController.level == null}">
							   <p:ajax process="@this" event="itemSelect" listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList"/>
							   <p:ajax process="@this" listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList"/>
						   </p:autoComplete>
						   <!-- <p:selectOneMenu value="#{generatePmOrdersController.queryAsset.clinicalDeptId}" disabled="#{generatePmOrdersController.level == null}" >
                                    <p:ajax  listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList PmOrderRule" />
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{assetInfoService.getClinicalDeptList(generatePmOrdersController.siteUid)}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                            </p:selectOneMenu>-->
					   </h:panelGroup>

                          <h:panelGroup >
		                     <label class ="label">#{msg.assetName}</label>
	                         <p:inputText  value="#{generatePmOrdersController.queryAsset.name}"  disabled="#{generatePmOrdersController.level == null}">
                                    <p:ajax  listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList" />
                             </p:inputText>
		                 </h:panelGroup>
		                 <h:panelGroup >
		                     <label class ="label">#{msg.assetGroup}</label>
		                     <p:selectOneMenu value="#{generatePmOrdersController.queryAsset.assetGroup}" disabled="#{generatePmOrdersController.level == null}" >
		                              <p:ajax listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList PmOrderRule" />
		                              <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
		                             <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
		                      </p:selectOneMenu>
		                 </h:panelGroup>
		                 <h:panelGroup >
		                     <label class ="label">#{msg.manufacture}</label>
							 <p:autoComplete id="manufacture" value="#{generatePmOrdersController.queryAsset.manufacture}" dropdown="true" scrollHeight="300" style="max-width: 200px"
											 forceSelection="true" completeMethod="#{generatePmOrdersController.getSupplier}"
											 var="t" itemLabel="#{t}" itemValue="#{t}">
								 <p:ajax process="@this" event="itemSelect" listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList PmOrderRule"/>
								 <p:ajax process="@this" listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList PmOrderRule"/>
							 </p:autoComplete>
							 <!--<p:selectOneMenu value="#{generatePmOrdersController.queryAsset.manufactureId}" style="max-width: 200px">
								 <p:ajax listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList PmOrderRule"  />
								 <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
								 <f:selectItems value="#{generatePmOrdersController.getSupplier()}" var="item"  itemLabel="#{item.name}" itemValue="#{item.id}"/>
							 </p:selectOneMenu>-->
		                      <!--<p:inputText  value="#{generatePmOrdersController.queryAsset.manufacture}"  disabled="#{generatePmOrdersController.level == null}">
	                                    <p:ajax  listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList PmOrderRule"  />
	                          </p:inputText>-->
		                 </h:panelGroup>
		                 <h:panelGroup >
		                      <label class ="label">#{msg.functionType}</label>
		                      <p:inputText  value="#{generatePmOrdersController.queryAsset.functionType}"  disabled="#{generatePmOrdersController.level == null}">
	                                    <p:ajax  listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList PmOrderRule" />
	                          </p:inputText>
		                 </h:panelGroup>

						   <h:panelGroup >
							   <label class ="label">#{msg.brand}</label>
							   <p:inputText  value="#{generatePmOrdersController.queryAsset.brand}"  disabled="#{generatePmOrdersController.level == null}">
								   <p:ajax  listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList PmOrderRule"  />
							   </p:inputText>
						   </h:panelGroup>
		                 <h:panelGroup>
                                <label class="label">预计完成时间</label>
                                <p:calendar timeZone="GMT+8"  id="manufactDate" pattern="yyyy/MM/dd" value="#{generatePmOrdersController.planTime}" 
                                 showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"  />
                            </h:panelGroup>
						   <h:panelGroup>
							   <label class="label">工单类型 *</label>
							   <p:selectOneMenu value="#{generatePmOrdersController.pmType}" >
								   <!--<f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />-->
								   <f:selectItems value="#{fieldMsg.getFieldValueList('pmType')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
							   </p:selectOneMenu>
						   </h:panelGroup>
		                  <h:panelGroup >
				                <!-- <label class="label">是否已配置规则</label>
		                        <p:selectOneRadio id="ruleStatus"  label="#{msg.status}" value="#{generatePmOrdersController.queryAsset.ruleStatus}" disabled="true">
		                            <f:selectItems value="#{fieldMsg.getFieldValueList('ruleStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
		                        </p:selectOneRadio> -->
		                  
                               <!--  <label class="label">是否已配置规则</label>
                                <p:selectOneRadio id="deviceStatus" value="#{generatePmOrdersController.queryAsset.ruleStatus}" >
                                		<p:ajax  listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('ruleStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                                </p:selectOneRadio> -->
                            </h:panelGroup>
                    </p:panelGrid>
                    
                    <p:pickList id="AssetsPickList" value="#{generatePmOrdersController.availableAssets}" var="item"
                                itemValue="#{item}" itemLabel="#{item.name}" showCheckbox="false" responsive="true"
                                showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter"
                                required="false" requiredMessage="已选设备 #{msg.ValidationRequire}">
                        <f:facet name="sourceCaption">待选设备</f:facet>
                        <f:facet name="targetCaption">已选设备</f:facet>
                        <p:ajax event="transfer" listener="#{generatePmOrdersController.onAssetsTransfer}" />
                        <p:column style="float: left;width:25%;">
                            <h:outputText value="#{item.name}" />
                        </p:column>
                        <p:column style="float: left;width:30%;">
                            <h:outputText value="#{item.departNum}" />
                        </p:column>
<!--                        <p:column style="float: left;width:20%;">
                            <h:outputText value="#{generatePmOrdersController.getOrgName(item.siteUID)}" />
                        </p:column>-->
                         <p:column style="float: left;width:25%;">
                            <h:outputText value="#{item.clinicalDeptName}" />
                        </p:column>
						<p:column>
							<h:outputText value="#{item.functionType}" />
						</p:column>
                    </p:pickList>
                    <br/> <br/>
					<p:commandButton id ="hidden" value="hello" style="display:none"/>
					<h:panelGroup>
						<p:commandButton validateClient="true" action="#{generatePmOrdersController.generatePmOrders()}" value="生成" icon="ui-icon-check" update=":growl" />
						<p:commandButton id="returnButton" value="#{msg.Return}" icon="ui-icon-arrow-back" action="/portal/pm/relRuleAsset/List.xhtml" immediate="true" />
					</h:panelGroup>
                    <p:panelGrid id ="PmOrderRule" columns="12" layout="grid" styleClass="ui-panelgrid-blank form-group">

                       		<label class="label">#{msg.ruleLevel}*</label>
                               <p:selectOneMenu id="level" value="#{generatePmOrdersController.level}"  required="true"   requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}">
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                   <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}" /> 
                               </p:selectOneMenu>
                       </h:panelGroup>  -->

                       		<label class="label">#{msg.PmOrderRule}*</label>
                               <p:selectOneMenu id="pmOrderRule" value="#{generatePmOrdersController.pmOrderRuleUID}"  required="true" requiredMessage="#{msg.PmOrderRule}#{msg.ValidationRequire}" >
                                   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                   <f:selectItems value="#{fieldMsg.getFieldValueList('deviceType')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                   <f:selectItems value="#{generatePmOrdersController.getPmOrderRuleList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                               </p:selectOneMenu>
                      </h:panelGroup> -->

                    </p:panelGrid>
<!--                 </p:tab>
            </p:tabView> -->
               <br/>
             
             <!-- <p:commandButton validateClient="true" actionListener="#{generatePmOrdersController.saveRel()}" value="#{msg.Save}" 
            icon="ui-icon-check" update="BatchCreateForm,:growl" action = "RelRuleAsset"/> -->
        </h:form>
        </div>
      </div>
        
    </ui:define>
</ui:composition>
