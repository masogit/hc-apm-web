<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
		<style>
			.cellAlignLeft {
				text-align: left;
				width: 25%;
			}
		</style>
       <div class="ui-g clearfix">
       <div class="ui-g-12 card cardTitle">
           <p:outputLabel class="pageTitle" value="#{msg.GenerateMaintenanceWorkordersInBatch}"/>
       </div>
       <div class="ui-g-12 card">
    
        <h:form id="GeneratePmOrderForm">
				<p:fieldset id="pmOrder" legend="#{msg.SearchAssets}">
                   <p:panelGrid id="param" columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
					   <h:panelGroup>

						  	 <label class="label" >#{msg.ruleLevel}<c:if test="#{!generatePmOrdersController.findCustomTenant().equals('3')}">*</c:if></label>

						   <p:selectOneMenu id="level" value="#{generatePmOrdersController.level}" required="#{!generatePmOrdersController.findCustomTenant().equals('3')}" requiredMessage="#{msg.ruleLevel} #{msg.ValidationRequire}">
							   <p:ajax listener="#{generatePmOrdersController.addSelected()}" update="SelectedPmOrderRule" process="@this" />
							   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                               <c:if test="#{generatePmOrdersController.getPmRule()}">
                                   <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevelFour')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                               </c:if>
                               <c:if test="#{!generatePmOrdersController.getPmRule()}">
                                   <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                               </c:if>
						   </p:selectOneMenu>
					   </h:panelGroup>

					   <h:panelGroup id="SelectedPmOrderRule">
						   <label class="label">#{msg.PmOrderRule}</label>
						   <p:autoComplete value="#{generatePmOrdersController.pmOrderRule}" dropdown="true" scrollHeight="300" rendered="#{generatePmOrdersController.level > 0}"
										   forceSelection="true" completeMethod="#{generatePmOrdersController.getRuleList}"
										   var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="pmOrderRuleConverter">
							   <p:ajax process="@this" event="itemSelect" listener="#{generatePmOrdersController.setRuleId()}"/>
							   <p:ajax process="@this" listener="#{generatePmOrdersController.setRuleId()}"/>
						   </p:autoComplete>
					   </h:panelGroup>

					   <h:panelGroup>
						   <label class="label">#{userContextService.isYiMaiYangGuangTenant()?'所属机构':msg.hospitalId}</label>
						   <p:inputText id="selectedUserOrgName" value="#{generatePmOrdersController.getOrgFullName(generatePmOrdersController.selectedUserOrg)}" readonly="true" required="true" requiredMessage="#{msg.orgId} #{msg.ValidationRequire}"/>
						   <p:commandButton id="btnOrg4User" process="@this" icon="fa fa-angle-down" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
						   <p:overlayPanel id="panelOrg4User" widgetVar="varPanelOrg4User" for="btnOrg4User" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
							   <p:scrollPanel style="height:300px;border: 0" mode="native">
								   <p:tree id="orgTree4User" class="tree" style="width:98%;border:0;" value="#{generatePmOrdersController.orgTree}" selection="#{generatePmOrdersController.selectedNode}" var="node" selectionMode="#{userContextService.isYiMaiYangGuangTenant()?'checkbox':'single'}">
									   <p:ajax process="@this" event="select" update="GeneratePmOrderForm" listener="#{generatePmOrdersController.onSelectOrgForUser}" oncomplete="PF('varPanelOrg4User').hide();"/>
									   <p:ajax process="@this" event="unselect" update="GeneratePmOrderForm" listener="#{generatePmOrdersController.onUnSelectOrgForUser}" oncomplete="PF('varPanelOrg4User').hide();"/>
									   <p:ajax process="@this" event="expand"/>
									   <p:ajax process="@this" event="collapse"/>
									   <p:treeNode type="org">
										   <h:outputText value="#{node}"/>
									   </p:treeNode>
									   <p:treeNode type="hidden" rendered="false"/>
								   </p:tree>
							   </p:scrollPanel>
						   </p:overlayPanel>
					   </h:panelGroup>

					   <h:panelGroup >
						   <label class ="label">#{msg.clinicalDeptName}</label>
						   <p:autoComplete id="clinicalDeptName" value="#{generatePmOrdersController.clinicalOrgInfo}" dropdown="true" scrollHeight="300" style="max-width: 200px"
                                           forceSelection="true" completeMethod="#{generatePmOrdersController.getClinicalDeptList}"
                                           var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter">
						   </p:autoComplete>
					   </h:panelGroup>

					   <h:panelGroup rendered="#{userContextService.enableDisplayByKey('relRuleAssetDeptFilter')}">
						   <label class ="label">#{msg.assetDeptName}</label>
						   <p:autoComplete id="assetDeptName" value="#{generatePmOrdersController.assetDeptOrgInfo}" dropdown="true" scrollHeight="300" style="max-width: 200px"
                                           forceSelection="true" completeMethod="#{generatePmOrdersController.getClinicalDeptList}"
                                           var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter">
						   </p:autoComplete>
					   </h:panelGroup>

						  <h:panelGroup >
							 <label class ="label">#{msg.assetName}</label>
							 <p:inputText  value="#{generatePmOrdersController.queryAsset.name}">
							 </p:inputText>
						 </h:panelGroup>

					   <h:panelGroup>
						   <label class="label">#{msg.riskGrade}</label>
						   <p:selectOneMenu id="riskGrade" value="#{generatePmOrdersController.queryAsset.riskGrade}">
							   <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
							   <f:selectItems value="#{fieldMsg.getFieldValueList('riskGrade')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
						   </p:selectOneMenu>
					   </h:panelGroup>
		                 <h:panelGroup >
		                     <label class ="label">#{msg.assetGroup}</label>
		                     <p:selectOneMenu value="#{generatePmOrdersController.queryAsset.assetGroup}">
		                              <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
		                             <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
		                      </p:selectOneMenu>
		                 </h:panelGroup>

		                 <h:panelGroup >
		                     <label class ="label">#{msg.manufacture}</label>
							 <p:autoComplete id="manufacture" value="#{generatePmOrdersController.queryAsset.manufacture}" dropdown="true" scrollHeight="300" style="max-width: 200px"
                                             forceSelection="true" completeMethod="#{generatePmOrdersController.getSupplier}"
                                             var="t" itemLabel="#{t}" itemValue="#{t}">
								 <p:ajax process="@this" listener="#{generatePmOrdersController.addFilter()}" update="AssetsPickList PmOrderRule"/>-->
							 </p:autoComplete>
		                 </h:panelGroup>

		                 <h:panelGroup >
		                      <label class ="label">#{msg.functionType}</label>
		                      <p:inputText  value="#{generatePmOrdersController.queryAsset.functionType}">
	                          </p:inputText>
		                 </h:panelGroup>

						   <h:panelGroup >
							   <label class ="label">#{msg.brand}</label>
							   <p:inputText  value="#{generatePmOrdersController.queryAsset.brand}">
							   </p:inputText>
						   </h:panelGroup>
						   <h:panelGroup  >
<!--							  <c:if test="#{generatePmOrdersController.findCustomTenant().equals('3')}">-->
								   <label class="label">保养工单</label>
								   <p:selectOneRadio  value="#{generatePmOrdersController.queryAsset.generate}" >
									   <f:selectItem itemLabel="已生成过" itemValue="true"/>
									   <f:selectItem itemLabel="未生成过" itemValue="false"/>
									   <p:ajax update=":GeneratePmOrderForm:dataTable" process="@this"
											   listener="#{generatePmOrdersController.checkGenerate}"/>
								   </p:selectOneRadio>
<!--							  </c:if>-->
						   </h:panelGroup>
					   <h:panelGroup rendered="#{generatePmOrdersController.enableWarrantyDateSearch}">
						   <label class ="label">#{msg.warrantyDate}</label>
						   <p:calendar  timeZone="GMT+8" id="warrantyDate" pattern="yyyy/MM/dd" mask="true" value="#{generatePmOrdersController.queryAsset.warrantyDate}" showOn="button" showButtonPanel="true" >
						   </p:calendar>
					   </h:panelGroup>
                       <h:panelGroup></h:panelGroup>
                       <h:panelGroup></h:panelGroup>
                       <p:commandButton validateClient="true" actionListener="#{generatePmOrdersController.addFilter()}" value="#{msg.Search}" update=":GeneratePmOrderForm:dataTable GeneratePmOrderForm:dataTable1"/>
				   </p:panelGrid>
				</p:fieldset>
				<h:panelGroup id = "AssetsPickList"/>
			<p:fieldset id="dataTable" legend="#{msg.totalAsset}#{generatePmOrdersController.total}#{msg.SeeMoreAsset}">
				<p:dataTable id="dataScroller" var="item" value="#{generatePmOrdersController.assetInfoList}" scrollRows="20" scrollable="true" liveScroll="true" scrollHeight="150" emptyMessage="#{msg.noRecordFound}">
					<p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
					<p:column width="36"  id="checkBoxColumn">
						<p:selectBooleanCheckbox value="#{generatePmOrdersController.selectedMap[item.uid]}"  class="selectCheckBox">
							<p:ajax process="@this" listener="#{generatePmOrdersController.prepareAssetRuleList()}" update="@this @(.batch-terminated) GeneratePmOrderForm:dataTable1" oncomplete="updateSelectAllCheckBox();"/>
						</p:selectBooleanCheckbox>
						<f:facet name="header"  >
							<p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader" value="#{generatePmOrdersController.isAllAssetSelected}">
								<p:ajax listener="#{generatePmOrdersController.onSelectAllOfPage}" update="@(.selectCheckBox) :GeneratePmOrderForm:dataScroller GeneratePmOrderForm:dataTable1" oncomplete="updateSelectAllCheckBox();"/>
							</p:selectBooleanCheckbox>
						</f:facet>
					</p:column>
					<p:column headerText="#{msg.AssetName}">
						<h:outputText value="#{generatePmOrdersController.getName(item)}" />
					</p:column>
					<p:column headerText="#{msg.EquipmentID}" >
						<h:outputText value="#{generatePmOrdersController.getDepartNum(item)}" />
					</p:column>
					<p:column headerText="#{msg.Department}" >
						<h:outputText value="#{generatePmOrdersController.getClinicalDeptName(item)}" />
					</p:column>
					<p:column headerText="#{msg.assetDeptName}" rendered="#{userContextService.enableDisplayByKey('relRuleAssetDeptFilter')}">
						<h:outputText value="#{generatePmOrdersController.getOrgName(item.assetDeptUID)}" />
					</p:column>
					<p:column headerText="#{msg.EquipmentModel}" >
						<h:outputText value="#{generatePmOrdersController.getFunctionType(item)}" />
					</p:column>
					<p:column headerText="#{msg.ManufacturerSerialNumber}" >
						<h:outputText value="#{generatePmOrdersController.getSeriaNum(item)}" />
					</p:column>
				</p:dataTable>
			</p:fieldset>

			<p:fieldset id="dataTable1" legend="以下资产存在多个同等级保养规则,下拉可查看更多。总计: #{generatePmOrdersController.assetRuleModelTotal} 条"  style="#{generatePmOrdersController.mulitPmOrderList()}">
				<p:dataTable id="datalist" value="#{generatePmOrdersController.notOnlyOneModels}" var="item" widgetVar="varDataListgl" scrollRows="20" scrollable="true" liveScroll="true" scrollHeight="#{generatePmOrdersController.prepareGenPmOrders()?150:1}" emptyMessage="#{msg.noRecordFound}"
							 >
					<p:column width="36"  id="checkBoxRulesColumn">
						<f:facet name="header"  >
							<p:selectBooleanCheckbox class="selectRulesCheckBoxHeader" value="#{generatePmOrdersController.isAllRuleSelected}" >
								<p:ajax listener="#{generatePmOrdersController.onSelectRuleAllOfPage()}"  update="@this datalist " />
							</p:selectBooleanCheckbox>
						</f:facet>
						<p:selectBooleanCheckbox value="#{generatePmOrdersController.selectedRuleMap[item.uniqueUid]}"  class="checkBoxRulesBox">
							<p:ajax  listener="#{generatePmOrdersController.updateCheckBox()}" update="@this @(.selectRulesCheckBoxHeader)" />
						</p:selectBooleanCheckbox>
					</p:column>
					<p:column headerText="#{msg.assetName}">
						<h:outputText value="#{item.assetName}"/>
					</p:column>
					<p:column headerText="#{msg.ruleName}">
						<h:outputText value="#{item.pmRuleName}"/>
					</p:column>
					<p:column headerText="#{msg.MaintenanceLevel}">
						<h:outputText value="#{fieldMsg.fieldValue('ruleLevelFour', item.level)}"/>
					</p:column>
					<p:column headerText="#{msg.MaintenancePeriod}">
						<h:outputText value="#{item.period}"/>
					</p:column>
					<p:column headerText="#{msg.PlannedCompletionTime}">
						<h:outputText value="#{item.planTime}">
							<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{msg.MaintenanceType}">
						<h:outputText value="#{fieldMsg.fieldValue('pmType', item.pmType)}"/>
					</p:column>

				</p:dataTable>
			</p:fieldset>
                    <br/> <br/>
                    <p:fieldset id="config" legend="#{msg.ConfigureWorkorder}">
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.EstimatedCompletionTime}</label>
                                <p:calendar timeZone="GMT+8"  id="manufactDate" pattern="yyyy/MM/dd" value="#{generatePmOrdersController.planTime}"
											showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true">
									<p:ajax event="close" process="@this" listener="#{generatePmOrdersController.updatePMPlanTime()}" update="@this GeneratePmOrderForm:dataTable1"></p:ajax>
								</p:calendar>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.WorkorderType} *</label>
                                <p:selectOneMenu value="#{generatePmOrdersController.pmType}" >
									<p:ajax listener="#{generatePmOrdersController.updatePMType()}"></p:ajax>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('pmType').subList(0, 3)}" var="item"  itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>
                    <br/> <br/>
					<p:commandButton id ="hidden" value="hello" style="display:none"/>
					<h:panelGroup>
						<p:commandButton validateClient="true" action="#{generatePmOrdersController.generatePmOrders()}" value="#{msg.Generate}" icon="ui-icon-check" update=":growl " />
						<p:commandButton id="returnButton" value="#{msg.Return}" icon="ui-icon-arrow-back" onclick="javascript:goBack();" immediate="true" />
					</h:panelGroup>
                    <p:panelGrid id ="PmOrderRule" columns="12" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    </p:panelGrid>
               <br/>
        </h:form>
        </div>
      </div>

		<script type="text/javascript">
			function updateSelectAllCheckBox() {
				var checkboxlist = $(".selectCheckBox");
				var selectAllstatus = true;
				checkboxlist.each(function () {
					selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked ;
				});
				$("#GeneratePmOrderForm\\:dataTable\\:dataScroller\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
				if (selectAllstatus) {
					$(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
				} else {
					$(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
				}
			}

			function updateSelectRuleAllCheckBox() {
				var checkboxlist = $(".checkBoxRulesBox");
				var selectAllstatus = true;
				checkboxlist.each(function () {
					selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked ;
				});
				$("#GeneratePmOrderForm\\:dataTable\\:dataScroller\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
				if (selectAllstatus) {
					$(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
				} else {
					$(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
				}
			}


			function goBack() {
				window.history.back();
			}
		</script>
    </ui:define>
</ui:composition>
