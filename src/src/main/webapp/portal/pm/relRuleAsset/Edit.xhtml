<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="RelRuleAssetEditDlg" widgetVar="RelRuleAssetEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{relRuleAssetManagerController.CRUDActionName} #{msg.RelRuleAsset}">
            <h:form id="RelRuleAssetEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{relRuleAssetManagerController.selected != null}">
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="id" value="#{relRuleAssetManagerController.selected.id}" />
                            <label>#{msg.id}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="ruleUID" value="#{relRuleAssetManagerController.selected.ruleUID}" />
                            <label>#{msg.ruleUID}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="assetUID" value="#{relRuleAssetManagerController.selected.assetUID}" />
                            <label>#{msg.assetUID}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="assetInfo" value="#{relRuleAssetManagerController.selected.assetInfo}" />
                            <label>#{msg.assetInfo}</label>
                        </h:panelGroup>
                        <h:panelGroup styleClass="md-inputfield">
                            <p:inputText id="pmOrderRule" value="#{relRuleAssetManagerController.selected.pmOrderRule}" />
                            <label>#{msg.pmOrderRule}</label>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{relRuleAssetManagerController.save}" value="#{msg.Save}" update="display,:RelRuleAssetEditDlg, :RelRuleAssetListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'RelRuleAssetEditDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('RelRuleAssetEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
