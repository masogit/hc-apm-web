<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">
				<div class="ui-g-12 card cardTitle">
                	<p:outputLabel class="pageTitle" value="#{msg.assetRuleManager}"/>
            	</div>
            	
            <div class="ui-g-12 card">
         	<h:form id="searchForm">
                <h:panelGrid id="searchPanel" columns="2" >
                    <p:inputText id="searchText" value="#{relRuleAssetManagerController.queryCondition}" placeholder="#{msg.name}/#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}/#{msg.manufacture}" maxlength="100" style="width: 420px">
                        <p:ajax  update=":RelRuleAssetListForm :searchForm" />
                    </p:inputText>

                    <h:panelGroup id='searchButtons'>
                        <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":RelRuleAssetListForm :searchForm"  rendered="#{empty relRuleAssetManagerController.queryCondition}"/>
                        <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":RelRuleAssetListForm :searchForm" actionListener="#{relRuleAssetManagerController.setOneSearchStr()}" rendered="#{not empty relRuleAssetManagerController.queryCondition}"/>
                    </h:panelGroup>
                </h:panelGrid>
            </h:form>
            	
            <h:form id="RelRuleAssetListForm">
                <p:dataTable id="datalist" value="#{relRuleAssetManagerController.lazyModel}" var="item" widgetVar="varDataList"
                    selection="#{relRuleAssetManagerController.selected}"
                    lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                    rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                    paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                    currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                    rows="20" emptyMessage="#{msg.noRecordFound}"
                    rowsPerPageTemplate="20,50,100,500">

                     <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                    <p:ajax event="filter" listener="#{relRuleAssetManagerController.onFilter}"/>
                    <p:column width="36" id="checkBoxColumn">
                        <p:selectBooleanCheckbox value="#{relRuleAssetManagerController.selectedMap[item.assetUID]}"  class="selectCheckBox">
                            <p:ajax process="@this" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                        </p:selectBooleanCheckbox>
                        <f:facet name="header"  >
                            <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                <p:ajax listener="#{relRuleAssetManagerController.onSelectAllOfPage}" update="@(.selectCheckBox) :RelRuleAssetListForm:datalist:batchToBeTerminatedButton :RelRuleAssetListForm:datalist:editButton" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                        </f:facet>
                    </p:column>
                    <p:column headerText="#{msg.StartUsingDate}" width="6%" filterBy="#{item.assetInfo.installDate}" filterMatchMode="GTE">
                        <h:outputText value="#{item.assetInfo.installDate}">
                            <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                        </h:outputText>
                        <f:facet name="filter">
                            <p:inputText id="filterStartUsingDate" widgetVar="varFilterStartUsingDat" value="#{relRuleAssetManagerController.startUsingDateFormatTime}"/>
                        </f:facet>
                        <h:outputText  >
                            <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.PurchaseDate}" width="6%" filterBy="#{item.assetInfo.purchaseDate}" filterMatchMode="GTE">
                        <h:outputText value="#{item.assetInfo.purchaseDate}">
                            <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                        </h:outputText>
                        <f:facet name="filter">
                            <p:inputText id="filterPurchaseDate" widgetVar="varFilterPurchaseDateDat" value="#{relRuleAssetManagerController.startPurchaseDateFormatTime}"/>
                        </f:facet>
                        <h:outputText  >
                            <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.AssetName}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetInfo.name}"/>
                    </p:column>
                    <p:column headerText="#{msg.Level1RulePM}" rendered="#{relRuleAssetManagerController.pmLevelFour}">
                        <f:facet name="header">
                            <h:outputText value="#{msg.Level1RulePM}"/><br/>
                            <p:autoComplete dropdown="true" value="#{relRuleAssetManagerController.filterRuleUIDInspectionName}" appendTo="@(Body)"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{relRuleAssetManagerController.autoLevelRulePMName}" size="3">
                                <p:ajax event="itemSelect" listener="#{relRuleAssetManagerController.onLevelRulePMNameFilterChange}" process="@this"  update=":RelRuleAssetListForm:datalist "   />
                                <p:ajax process="@this" listener="#{relRuleAssetManagerController.onLevelRulePMNameFilterChange}" update=":RelRuleAssetListForm:datalist"   />
                                <f:attribute name="level" value="1" />
                            </p:autoComplete>
                        </f:facet>
                        <h:outputText value="#{relRuleAssetManagerController.getRuleName(item.ruleUIDInspection)}"/>
                    </p:column>
                    <p:column headerText="#{msg.Level2RulePM}"   >
                        <f:facet name="header">
                            <h:outputText value="#{msg.Level2RulePM}"/><br/>
                            <p:autoComplete dropdown="true" value="#{relRuleAssetManagerController.filterRuleUID2Name}" appendTo="@(Body)"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{relRuleAssetManagerController.autoLevelRulePMName}" size="3">
                                <p:ajax event="itemSelect" listener="#{relRuleAssetManagerController.onLevelRulePMNameFilterChange}" process="@this"  update=":RelRuleAssetListForm:datalist "   />
                                <p:ajax process="@this" listener="#{relRuleAssetManagerController.onLevelRulePMNameFilterChange}" update=":RelRuleAssetListForm:datalist"   />
                                <f:attribute name="level" value="2" />
                            </p:autoComplete>
                        </f:facet>
                        <h:outputText value="#{relRuleAssetManagerController.getRuleName(item.ruleUID2)}"/>
                    </p:column>
                    <p:column headerText="#{msg.Level3RulePM}"   >
                        <f:facet name="header">
                            <h:outputText value="#{msg.Level3RulePM}"/><br/>
                            <p:autoComplete dropdown="true" value="#{relRuleAssetManagerController.filterRuleUIDName}" appendTo="@(Body)"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{relRuleAssetManagerController.autoLevelRulePMName}" size="3">
                                <p:ajax event="itemSelect" listener="#{relRuleAssetManagerController.onLevelRulePMNameFilterChange}" process="@this"  update=":RelRuleAssetListForm:datalist "   />
                                <p:ajax process="@this" listener="#{relRuleAssetManagerController.onLevelRulePMNameFilterChange}" update=":RelRuleAssetListForm:datalist"   />
                                <f:attribute name="level" value="3" />
                            </p:autoComplete>
                        </f:facet>
                        <h:outputText value="#{relRuleAssetManagerController.getRuleName(item.ruleUID)}"/>
                    </p:column>
                    <p:column headerText="#{msg.Level4RulePM}" rendered="#{relRuleAssetManagerController.pmLevelFour}">
                        <f:facet name="header">
                            <h:outputText value="#{msg.Level4RulePM}"/><br/>
                            <p:autoComplete dropdown="true" value="#{relRuleAssetManagerController.filterRuleUID4Name}" appendTo="@(Body)"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{relRuleAssetManagerController.autoLevelRulePMName}" size="3">
                                <p:ajax event="itemSelect" listener="#{relRuleAssetManagerController.onLevelRulePMNameFilterChange}" process="@this"  update=":RelRuleAssetListForm:datalist "   />
                                <p:ajax process="@this" listener="#{relRuleAssetManagerController.onLevelRulePMNameFilterChange}" update=":RelRuleAssetListForm:datalist"   />
                                <f:attribute name="level" value="4" />
                            </p:autoComplete>
                        </f:facet>
                        <h:outputText value="#{relRuleAssetManagerController.getRuleName(item.ruleUID4)}"/>
                    </p:column>
                    <p:column headerText="#{msg.departNum}"  filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetInfo.departNum}"/>
                    </p:column>
                    <p:column headerText="#{msg.serialNum}"  filterBy="#{item.assetInfo.serialNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetInfo.serialNum}"/>
                    </p:column>
                    <p:column  headerText="#{msg.assetGroup}"  filterBy="#{item.assetInfo.assetGroup}" filterMatchMode="EQ">
                        <h:outputText value="#{fieldMsg.fieldValue('assetGroup', item.assetInfo.assetGroup)}"/>
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="handleAssetGroupChange()"  autoWidth="false" style="max-width: 150px;" height="300" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                    </p:column>
                    <p:column headerText="#{msg.hospitalId}" style="width: 100px" >
                        <f:facet name="header">
                            <h:outputText value="#{msg.hospitalId}"/><br/>
                            <p:autoComplete style="width: 90px" dropdown="true" value="#{relRuleAssetManagerController.filterSiteName}" appendTo="@(Body)"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{relRuleAssetManagerController.autoCompleteSiteName}" size="5">
                                <p:ajax event="itemSelect" listener="#{relRuleAssetManagerController.onSiteNameFilterChange}" process="@this"  update=":RelRuleAssetListForm:datalist" />
                                <p:ajax process="@this" listener="#{relRuleAssetManagerController.onSiteNameFilterChange}" update=":RelRuleAssetListForm:datalist" />
                            </p:autoComplete>

                        </f:facet>
                        <h:outputText value="#{relRuleAssetManagerController.getSiteOrgName(item.assetInfo.siteUID)}"/>
                    </p:column>
                    <p:column headerText="#{msg.clinicalDeptName}"   >
                        <f:facet name="header">
                            <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                            <p:autoComplete dropdown="true" value="#{relRuleAssetManagerController.filterClinicalDeptOrg}" appendTo="@(Body)"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{relRuleAssetManagerController.autoCompleteDeptName}" size="3">
                                <p:ajax event="itemSelect" listener="#{relRuleAssetManagerController.onClinicalDeptNameFilterChange}" process="@this"  update=":RelRuleAssetListForm:datalist "   />
                                <p:ajax process="@this" listener="#{relRuleAssetManagerController.onClinicalDeptNameFilterChange}" update=":RelRuleAssetListForm:datalist"   />
                            </p:autoComplete>
                        </f:facet>
                        <h:outputText value="#{item.assetInfo.clinicalDeptName}"/>
                    </p:column>
                    <p:column headerText="#{msg.assetDeptName}" rendered="#{userContextService.enableDisplayByKey('relRuleAssetDeptFilter')}">
                        <f:facet name="header">
                            <h:outputText value="#{msg.assetDeptName}"/><br/>
                            <p:autoComplete dropdown="true" value="#{relRuleAssetManagerController.filterAssetDeptOrg}" appendTo="@(Body)"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{relRuleAssetManagerController.autoCompleteDeptName}" size="3">
                                <p:ajax event="itemSelect" listener="#{relRuleAssetManagerController.onAssetDeptNameFilterChange}" process="@this"  update=":RelRuleAssetListForm:datalist "   />
                                <p:ajax process="@this" listener="#{relRuleAssetManagerController.onAssetDeptNameFilterChange}" update=":RelRuleAssetListForm:datalist"   />
                            </p:autoComplete>
                        </f:facet>
                        <h:outputText value="#{relRuleAssetManagerController.getOrgInfoByUid(item.assetInfo.assetDeptUID).name}"/>
                    </p:column>
                    <p:column headerText="#{msg.nationalStandardCode}"  filterBy="#{item.assetInfo.nationalStandardCode}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetInfo.nationalStandardCode}"/>
                    </p:column>
                    <p:column headerText="#{msg.makerShortName}"  filterBy="#{item.assetInfo.makerShortName}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetInfo.makerShortName}"/>
                    </p:column>
                    <p:column headerText="#{msg.manufacture}" filterBy="#{item.assetInfo.manufacture}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetInfo.manufacture}"/>
                    </p:column>

                    <p:column headerText="#{msg.ConfigurationDate}" width="6%" filterBy="#{item.createdDate}" filterMatchMode="GTE">
                        <h:outputText value="#{item.createdDate}">
                            <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                        </h:outputText>
                        <f:facet name="filter">
                            <p:inputText id="filterConfigurationDate" widgetVar="varFilterConfigurationDateDat" value="#{relRuleAssetManagerController.startConfigurationDateFormatTime}"/>
                        </f:facet>
                        <h:outputText  >
                            <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                        </h:outputText>
                    </p:column>
                     <p:column headerText="#{msg.QRCode}" exportable="true" width="150"  filterBy="#{item.assetInfo.qrCode}"  filterMatchMode="LIKE">
                     	<h:outputText value="#{item.assetInfo.qrCode}"/>
                    </p:column>
                    <f:facet name="{Toolbar}">
                        <p:commandButton id="zkbBatch" action="/portal/pm/pmOrderRule/ZKBRelRuleAsset.xhtml?faces-redirect=true &amp; zkbBatch=1" icon="fa fa-cogs" class="btn btn-sm btn-gray"  title="ZKB#{msg.SetRulesInBatch}" rendered="#{userContextService.zkbAccount}"/>
                        <p:commandButton id="batch" action="/portal/pm/pmOrderRule/RelRuleAsset.xhtml?faces-redirect=true" icon="ui-icon-settings" class="btn btn-sm btn-gray"  title="#{msg.SetRulesInBatch}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ASSET_SETTING')}"/>
                    	<p:commandButton id="generatePmOrders" action="/portal/pm/pmOrderRule/GeneratePmOrders.xhtml?faces-redirect=true" icon="ui-icon-collections" class="btn btn-sm btn-gray"  title="#{msg.GenerateMaintenanceWorkordersInBatch}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ASSET_CREATE')}"/>

                        <p:commandButton title="已配置规则设备导出" icon="ui-icon-arrow-1-s" class="btn btn-sm btn-gray" actionListener="#{relRuleAssetManagerController.exportRelRuleAssets}" update=":growl" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ASSET_VIEW')}"
                                         onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false" >
                            <p:fileDownload value="#{relRuleAssetManagerController.excelFile}" />
                        </p:commandButton>
                        <p:commandButton title="全量导出" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" actionListener="#{relRuleAssetManagerController.exportAllAssets}" update=":growl" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ASSET_VIEW')}"
                                         onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false" >
                            <p:fileDownload value="#{relRuleAssetManagerController.excelFile}" />
                        </p:commandButton>

                        <p:commandButton id="editButton" icon="ui-icon-close" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchDeleRuleConfig}" actionListener="#{relRuleAssetManagerController.prepareEditRule}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ASSET_SETTING')}"
                                         update=":RelRuleAssetEditDlg" oncomplete="handleSubmit(args, 'RelRuleAssetEditDialog')" disabled="#{not relRuleAssetManagerController.isChecked()}"/>
                        <ui:fragment >
                            <p:commandButton id="batchToBeTerminatedButton" icon="ui-icon-delete" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchDelete}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ASSET_DELETE')}"
                                             actionListener="#{relRuleAssetManagerController.batchDelete}" update=":RelRuleAssetListForm" disabled="#{not relRuleAssetManagerController.isChecked()}">
                                <p:confirm header="#{msg.BatchDeleRuleConfig}" message="#{msg.IsConfirmDeleRecord}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </ui:fragment>
                    </f:facet>
                </p:dataTable>
            </h:form>
                <p:overlayPanel id="idPanelFiltertartUsingDat" widgetVar="panelFiltertartUsingDat" for=":RelRuleAssetListForm:datalist:filterStartUsingDate" dismissable="false"  >
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="vartartUsingDatFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        <p:outputLabel value="#{msg.To}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="vartartUsingDatTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    </h:panelGrid>
                    <p:commandButton onclick="setDateFilter('varDataList', 'varFilterStartUsingDat', 'vartartUsingDatFrom', 'vartartUsingDatTo'); PF('panelFiltertartUsingDat').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFiltertartUsingDat').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                </p:overlayPanel>
                <p:overlayPanel id="idPanelFiltertartPurchaseDateDat" widgetVar="panelFiltertartPurchaseDateDat" for=":RelRuleAssetListForm:datalist:filterPurchaseDate" dismissable="false"  >
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="vartartPurchaseDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        <p:outputLabel value="#{msg.To}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="vartartPurchaseDateDatTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    </h:panelGrid>
                    <p:commandButton onclick="setDateFilter('varDataList', 'varFilterPurchaseDateDat', 'vartartPurchaseDateFrom', 'vartartPurchaseDateDatTo'); PF('panelFiltertartPurchaseDateDat').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFiltertartPurchaseDateDat').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                </p:overlayPanel>
                <p:overlayPanel id="idPanelFiltertartConfigurationDateDat" widgetVar="panelFiltertartConfigurationDateDat" for=":RelRuleAssetListForm:datalist:filterConfigurationDate" dismissable="false"  >
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="vartartConfigurationDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        <p:outputLabel value="#{msg.To}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="vartartConfigurationDateDatTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    </h:panelGrid>
                    <p:commandButton onclick="setDateFilter('varDataList', 'varFilterConfigurationDateDat', 'vartartConfigurationDateFrom', 'vartartConfigurationDateDatTo'); PF('panelFiltertartConfigurationDateDat').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFiltertartConfigurationDateDat').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                </p:overlayPanel>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
				</div>
            </div>
        </div>
        <script type="text/javascript">
            function handleAssetGroupChange(selection) {
                var ct = document.getElementById('RelRuleAssetListForm:datalist');
                if (ct) {
                    ct.value = '';
                }

                PF('varDataList').filter();
            }
        </script>
        <script>
            function afterLoadRender(){
                // $(".ui-datatable-tablewrapper").css('width', '100%');
                $("div table")[1].style.overflowX= "scroll";
                $("div table")[1].style.width = "auto";
                $("html")[0].style.overflowX= "hidden";
            }
            //<![CDATA[
            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#RelRuleAssetListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
            //]]>
        </script>

    </ui:define>

</ui:composition>
