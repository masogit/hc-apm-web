<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">
				<div class="ui-g-12 card cardTitle">
                	<p:outputLabel class="pageTitle" value="#{msg.assetRuleManager}"/>
            	</div>
            	
            <div class="ui-g-12 card">
         	<h:form id="searchForm">
                <h:panelGrid id="searchPanel" columns="2" >
                    <p:inputText id="searchText" value="#{relRuleAssetManagerController.queryCondition}" placeholder="#{msg.name}/#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}/#{msg.manufacture}" maxlength="100" style="width: 420px">
                        <p:ajax  update=":RelRuleAssetListForm :searchForm" />
                    </p:inputText>

                    <h:panelGroup id='searchButtons'>
                        <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":RelRuleAssetListForm :searchForm"  rendered="#{empty relRuleAssetManagerController.queryCondition}"/>
                        <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":RelRuleAssetListForm :searchForm" actionListener="#{relRuleAssetManagerController.setOneSearchStr()}" rendered="#{not empty relRuleAssetManagerController.queryCondition}"/>
                    </h:panelGroup>
                </h:panelGrid>
            </h:form>
            	
            <h:form id="RelRuleAssetListForm">
                <p:dataTable id="datalist" value="#{relRuleAssetManagerController.lazyModel}" var="item" widgetVar="varDataList"
                    selectionMode="single" selection="#{relRuleAssetManagerController.selected}"
                    lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                    rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                    paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                    currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                    rows="20" emptyMessage="#{msg.noRecordFound}"
                    rowsPerPageTemplate="20,50,100,500">

                     <p:ajax event="rowSelect" update="editButton"/>
                     <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />

                    <p:column width="36" id="checkBoxColumn">
                        <p:selectBooleanCheckbox value="#{relRuleAssetManagerController.selectedMap[item.assetUID]}"  class="selectCheckBox">
                            <p:ajax process="@this" update="@this @(.batch-terminated)" oncomplete="updateSelectAllCheckBox();"/>
                        </p:selectBooleanCheckbox>
                        <f:facet name="header"  >
                            <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                <p:ajax listener="#{relRuleAssetManagerController.onSelectAllOfPage}" update="@(.selectCheckBox) :RelRuleAssetListForm:datalist:batchToBeTerminatedButton" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                        </f:facet>
                    </p:column>
                    <p:column headerText="启用日期">
                        <h:outputText value="#{relRuleAssetManagerController.getInstallDate(item.assetUID)}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="采购日期">
                        <h:outputText value="#{relRuleAssetManagerController.getPurchaseDate(item.assetUID)}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.AssetName}"  filterMatchMode="LIKE">
                        <h:outputText value="#{relRuleAssetManagerController.getAssetName(item.assetUID)}"/>
                    </p:column>
                    <p:column headerText="#{msg.Level2RulePM}" sortBy="" filterBy="" filterMatchMode="LIKE">
                    		<h:outputText value="#{relRuleAssetManagerController.getRuleName(item.ruleUID2)}"/>
                    		<!-- <h:outputText value="#{fieldMsg.fieldValue('ruleLevel',relRuleAssetManagerController.getRuleName(item.ruleUID2))}"/> -->
                    </p:column>
                    <p:column headerText="#{msg.Level3RulePM}" sortBy="" filterBy="" filterMatchMode="LIKE">
                    		<h:outputText value="#{relRuleAssetManagerController.getRuleName(item.ruleUID)}"/>
                    		<!-- <h:outputText value="#{fieldMsg.fieldValue('ruleLevel',relRuleAssetManagerController.getRuleName(item.ruleUID))}"/> -->
                    </p:column>
                    <p:column headerText="#{msg.departNum}"  filterMatchMode="LIKE">
                        <h:outputText value="#{relRuleAssetManagerController.getDepartNum(item.assetUID)}"/>
                    </p:column>
                    <p:column headerText="#{msg.assetGroup}"  filterMatchMode="LIKE">
                    	<h:outputText value="#{fieldMsg.fieldValue('assetGroup',relRuleAssetManagerController.getAssetGroup(item.assetUID))}"/>
                    </p:column>
                    <p:column headerText="#{msg.clinicalDeptName}" filterMatchMode="EQ">
                        <h:outputText value="#{relRuleAssetManagerController.getClinicalDeptName(item.assetUID)}"/>
                    </p:column>
                    <p:column headerText="#{msg.nationalStandardCode}"  filterMatchMode="LIKE">
                        <h:outputText value="#{relRuleAssetManagerController.getNationalStandardCode(item.assetUID)}"/>
                    </p:column>
                    <p:column headerText="#{msg.makerShortName}"  filterMatchMode="LIKE">
                        <h:outputText value="#{relRuleAssetManagerController.getBrand(item.assetUID)}"/>
                    </p:column>
                    <p:column headerText="#{msg.manufacture}"  filterMatchMode="LIKE">
                        <h:outputText value="#{relRuleAssetManagerController.getManufacture(item.assetUID)}"/>
                    </p:column>
                    <p:column headerText="#{msg.ConfigurationDate}"  filterMatchMode="GTE">
                            <h:outputText value="#{item.createdDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                     </p:column>
                     <p:column headerText="#{msg.QRCode}" exportable="true" width="150"  filterMatchMode="LIKE">
                     	<h:outputText value="#{relRuleAssetManagerController.getQrCode(item.assetUID)}"/>
                    </p:column>
                    <f:facet name="{Toolbar}">
                    	<p:commandButton id="batch" action="/portal/pm/pmOrderRule/RelRuleAsset.xhtml?faces-redirect=true" icon="ui-icon-settings" class="btn btn-sm btn-gray"  title="#{msg.SetRulesInBatch}"/>
                    	<p:commandButton id="generatePmOrders" action="/portal/pm/pmOrderRule/GeneratePmOrders.xhtml?faces-redirect=true" icon="ui-icon-collections" class="btn btn-sm btn-gray"  title="#{msg.GenerateMaintenanceWorkordersInBatch}"/>
                        <p:commandButton  icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist" fileName="RelRuleAsset_export"/>
                        </p:commandButton>

                        <p:commandButton id="editButton" icon="ui-icon-close" class="btn btn-sm btn-gray"  actionListener="#{relRuleAssetManagerController.prepareEdit}"
                                         update=":RelRuleAssetEditDlg" oncomplete="PF('RelRuleAssetEditDialog').show()" disabled="#{empty relRuleAssetManagerController.selected}"/>
                        <ui:fragment >
                            <p:commandButton id="batchToBeTerminatedButton" icon="ui-icon-delete" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchDelete}"
                                             actionListener="#{relRuleAssetManagerController.batchDelete}" update=":RelRuleAssetListForm" disabled="#{not relRuleAssetManagerController.isChecked()}">
                                <p:confirm header="#{msg.BatchDeleRuleConfig}" message="#{msg.IsConfirmDeleRecord}" icon="ui-icon-warning"/>
                            </p:commandButton>
                        </ui:fragment>
                    </f:facet>
                </p:dataTable>
            </h:form>

            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
				</div>
            </div>
        </div>

        <script>
            //<![CDATA[
            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus && this.children[0].children[0].checked;
                });
                $("#RelRuleAssetListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
            //]]>
        </script>
    </ui:define>

</ui:composition>
