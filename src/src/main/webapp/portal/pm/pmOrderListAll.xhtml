<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
    	<h:outputScript name="js/commonUtils.js"/>
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.MaintenanceWorkorder}"/>
            </div>

            <div class="ui-g-12 ">
                <p:tabView class="ui-g-12" id="pmTab" dynamic="true" cache="false" activeIndex="#{pmOrderTabController.queryTab}" binding="#{pmOrderTabController.tabView}">
                    <p:ajax event="tabChange" listener="#{v2PmOrderController.onTabChange}" update = "pmTab"/>
                    <p:tab class="ui-g-12" title="#{msg.innerPm}" id="pmOrderList" rendered="#{not (userContextService.isIBTenant())}">
                        <ui:include src="pmOrderList.xhtml"/>
                    </p:tab>
                    <p:tab class="ui-g-12" title="MVS保养" id="mvsOrderList" rendered="#{userContextService.isYiMaiYangGuangTenant()}">
                        <ui:include src="mvs/pmMvsOrderList.xhtml"/>
                    </p:tab>

                    <p:tab class="ui-g-12" title="#{msg.outerPm}" id="pmOrderListOut" rendered="#{userContextService.enableDisplayExternalWorkOrder() and userContextService.accessContainsFunctionMenu('MAINTAIN_EXORDER_VIEW')}">
                        <ui:include src="pmOrderListOut.xhtml"/>
                    </p:tab>
                    <p:tab class="ui-g-12" title="#{msg.outerRemotePm}"  id="pmOrderListRemote" rendered="#{userContextService.enableDisplayRemoteWorkOrder() and userContextService.accessContainsFunctionMenu('MAINTAIN_REMOTE_ORDER_VIEW')}">
                        <ui:include src="pmOrderListRemote.xhtml"/>
                    </p:tab>
                    <p:tab class="ui-g-12" title="全部保养" id="unifiedOrderList" rendered="#{userContextService.isYiMaiYangGuangTenant()}">
                        <ui:include src="pmOrderUnifiedList.xhtml"/>
                    </p:tab>
                </p:tabView>
            </div>
        </div>
    </ui:define>
</ui:composition>
