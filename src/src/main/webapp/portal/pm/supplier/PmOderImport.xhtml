<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<div class="ui-g">
    <div class="ui-g-12 card">
        <h:form enctype="multipart/form-data">
            <p:fieldset legend="保养工单导入" id="uploaderContainer">
                <p:panelGrid columns="1" layout="grid"
                             styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.choseFileToUpload}</label>
                        <h:outputText   value="#{pmOrderImportController.file.fileName}" rendered="#{not empty pmOrderImportController.file}"/>
                        <p:fileUpload  id="fileUpload" fileUploadListener="#{pmOrderImportController.uploadDataFile}" update="failImportList" value="#{pmOrderImportController.file}" mode="advanced" dragDropSupport="false" style="width:100%" process="@this"
                                       multiple="false" sizeLimit="10000000" auto="true"  invalidSizeMessage="#{msg.invalidSizeMessage}10M"  allowTypes="/(\.|\/)(xls|xlsx)$/" label="#{msg.Add}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <p:commandButton value="#{msg.downloadTemplateFile}" title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm" actionListener="#{pmOrderImportController.exportExcelTemplate}" update=":growl"
                                         onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false"  style="background-color: #5180ce;">
                            <p:fileDownload value="#{pmOrderImportController.templateFile}" />
                        </p:commandButton>
                    </h:panelGroup>
                </p:panelGrid>
            </p:fieldset>
            <p:fieldset legend="未成功导入列表" id="failImportList">
                <h:form id="pmOrderListForm" >
                    <p:dataTable id="datalist" value="#{pmOrderImportController.failImportList}" var="item" widgetVar="varDataList"
                                 rendered="true"
                                 paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 sortMode="single" sortOrder="descending"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="3" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:column headerText="设备名称">
                            <h:outputText value="#{item.assetName}" />
                        </p:column>
                        <p:column headerText="资产编号">
                            <h:outputText value="#{item.financingNum}" />
                        </p:column>
                        <p:column headerText="卡片号">
                            <h:outputText value="#{item.departNum}" />
                        </p:column>
                        <p:column headerText="保养编号">
                            <h:outputText value="#{item.pmNum}" />
                        </p:column>
                    </p:dataTable>
                </h:form>
            </p:fieldset>
        </h:form>
    </div>
</div>
</html>
