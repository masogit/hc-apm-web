

<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui"
        xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
>

    <div class="ui-g-12 card"  >
        <h:form id="pmOrderListForm">
            <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                <!-- 创建  待接单  已计划   -->
                <p:commandButton value="#{msg.CreateMaintenance}" rendered="#{userContextService.hasRole('SupplierFE') or userContextService.hasRole('SupplierAdmin')}" actionListener="#{v2SupplierPmOrderController.createPMRequest()}" process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm pmTab:PmRequestCreateForm"  oncomplete="PF('createPMDialog').show()" />
                <p:commandButton value="#{msg.WorkorderToPickUp}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmSupplierOrderListAll.xhtml?faces-redirect=true&amp;query=3" disabled="#{v2SupplierPmOrderController.queryIndex ==3}"  rendered="#{userContextService.hasRole('SupplierFE') }"  />
                <p:commandButton value="#{msg.Planned}"  process="@this" update="datalist buttonSet :pmTab:pmOrderDetailForm" action="pmSupplierOrderListAll.xhtml?faces-redirect=true&amp;query=0" disabled="#{v2SupplierPmOrderController.queryIndex==0}"  rendered="#{userContextService.hasRole('SupplierFE') }"  />
                <p:commandButton value="#{msg.Finished}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmSupplierOrderListAll.xhtml?faces-redirect=true&amp;query=7" disabled="#{v2SupplierPmOrderController.queryIndex==7}"  rendered="#{(userContextService.hasRole('SupplierFE') or userContextService.hasRole('SupplierAdmin'))}"  />

            </h:panelGrid>

            <p:dataTable id="datalist" value="#{v2SupplierPmOrderController.lazyModel}" var="item" widgetVar="varDataListgl"
                         selectionMode="single" selection="#{v2SupplierPmOrderController.selected}"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.planTime}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500">

                <p:ajax event="rowSelect" listener="#{v2SupplierPmOrderController.onSelectPmOrder()}" update=":pmTab:pmOrderDetailForm @(.coworkcls) @(.btn-export-maintenance-report)"/>
                <p:ajax event="filter" listener="#{v2SupplierPmOrderController.onFilter}" update="datalist :pmTab:pmOrderDetailForm" oncomplete="updateSelectAllCheckBox();"/>
                <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                <p:column width="36" visible="#{v2SupplierPmOrderController.queryIndex==2 or v2SupplierPmOrderController.queryIndex==3 or v2SupplierPmOrderController.queryIndex==0 or v2SupplierPmOrderController.queryIndex==6 or v2SupplierPmOrderController.queryIndex == 31 or v2SupplierPmOrderController.queryIndex == 7 or v2SupplierPmOrderController.queryIndex == -1}" exportable="false">
                    <p:selectBooleanCheckbox  value="#{v2SupplierPmOrderController.selectedMap[item.id]}"  class="selectCheckBox">
                        <p:ajax process="@this" listener="#{v2SupplierPmOrderController.pick(item.id)}" update="@(.selectCheckBoxHeader) @(.batch-terminated) @(.exportExcelBtn) @(.finishButton) @(.completeButton) @(.competeButton) @(.takeOrderbutton) @(.dispatchOrderButton) @(.transButton) @(.closeButton) @(.maintainButton) @(.batch-piliangjiedan) @(.planedCompleteButton) @(.btn-export-maintenance-report) @(.downloadBtn)" oncomplete="updateSelectAllCheckBox();" />
                    </p:selectBooleanCheckbox>
                    <f:facet name="header">
                        <p:selectBooleanCheckbox id="selectCheckBoxHeader"  class="selectCheckBoxHeader">
                            <p:ajax  listener="#{v2SupplierPmOrderController.onSelectAllOfPage}" update="@(.selectCheckBox) @(.batch-terminated) @(.exportExcelBtn) @(.batch-piliangjiedan) @(.takeOrderbutton) @(.finishButton) @(.competeButton) @(.completeButton) @(.dispatchOrderButton) @(.transButton) @(.closeButton) @(.maintainButton) @(.planedCompleteButton) @(.btn-export-maintenance-report) @(.downloadBtn)" oncomplete="updateSelectAllCheckBox();"/>

                            <!-- <p:ajax  listener="#{v2SupplierPmOrderController.onSelectAllOfPage}" update="@(.selectCheckBox) @(.batch-terminated) @(.takeOrderbutton) @(.finishButton) @(.competeButton) @(.completeButton) @(.dispatchOrderButton) @(.transButton) @(.closeButton) @(.maintainButton) @(.planedCompleteButton)"/>-->

                        </p:selectBooleanCheckbox>
                    </f:facet>
                    <!-- <f:facet name="header">
                         <p:selectBooleanCheckbox id="selectCheckBoxHeader" value="#{v2SupplierPmOrderController.isSelectedCurrentPage}" class="selectCheckBoxHeader">
                             <p:ajax  listener="#{v2SupplierPmOrderController.onSelectAllOfPage}" update="@(.selectCheckBox) @(.batch-terminated) @(.takeOrderbutton) @(.finishButton) @(.competeButton) @(.completeButton) @(.dispatchOrderButton) @(.transButton) @(.closeButton) @(.maintainButton) @(.planedCompleteButton) @(.batch-piliangjiedan)"/>
                         </p:selectBooleanCheckbox>
                     </f:facet>-->
                </p:column>
                <p:column headerText="所属医院">
                    <h:outputText value="#{v2SupplierPmOrderController.getSiteOrgName(item.tenantUID)}"/>
                </p:column>
                <p:column headerText="#{msg.hospitalId}">
                    <h:outputText value="#{v2SupplierPmOrderController.getSiteOrgName(item.siteUID)}"/>
                    <!--<f:facet name="filter">
                        <p:inputText id="btnOrg2" class="btnOrg2clss" readonly="true" value="#{empty v2SupplierPmOrderController.selectSite? msg.AllHospitals:v2SupplierPmOrderController.selectSite.name}"/>
                    </f:facet>-->
                </p:column>

                <p:column headerText="#{msg.assetName}" sortBy="#{item.assetInfo.name}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE"> <h:outputText value="#{item.assetInfo.name}"/>
                </p:column>

                <p:column headerText="#{msg.ManufacturerSerialNumber}" sortBy="#{item.assetInfo.serialNum}" filterBy="#{item.assetInfo.serialNum}" filterMatchMode="LIKE"> <h:outputText value="#{item.assetInfo.serialNum}"/>
                </p:column>

                        <p:column headerText="#{msg.EquipmentIDHospital}" sortBy="#{item.assetInfo.departNum}" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.departNum}"/>
                        </p:column>
                <p:column headerText="#{msg.functionType}" sortBy="#{item.assetInfo.functionType}" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE"> <h:outputText value="#{item.assetInfo.functionType}"/>
                </p:column>
                        <p:column headerText="#{msg.MeasurementGrade2}" sortBy="#{item.ruleLevel}" filterBy="#{item.ruleLevel}" filterMatchMode="EQ">
                            <h:outputText value="#{item.ruleLevel}"/>
                        </p:column>
                        <p:column headerText="#{msg.MaintenanceType}"  sortBy="#{item.pmType}" filterBy="#{item.pmType}" filterMatchMode="EQ">
                            <f:facet name="filter" >
                                <p:selectOneMenu onchange="PF('varDataListgl').filter()" value="#{v2SupplierPmOrderController.repairTypeInt}">
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('pmType').subList(0,3)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{fieldMsg.fieldValue('pmType',item.pmType)}"/>
                        </p:column>
                        <!--所属科室-->
                        <p:column headerText="#{msg.clinicalDeptName}"  width="100">
                            <f:facet name="header">
                                <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                                <p:autoComplete dropdown="true" value="#{v2SupplierPmOrderController.fileterOrgName}" appendTo="@(Body)"
                                                scrollHeight="300"  forceSelection="true" completeMethod="#{v2SupplierPmOrderController.autoCompleteDeptName}" size="5">
                                    <p:ajax event="itemSelect" listener="#{v2SupplierPmOrderController.onClinicalDeptNameFilterChange}" process="@this"  update=":pmTab:pmOrderListForm:datalist"/>
                                    <p:ajax listener="#{v2SupplierPmOrderController.onClinicalDeptNameFilterChange}" process="@this"  update=":pmTab:pmOrderListForm:datalist"/>
                                </p:autoComplete>
                            </f:facet>
                            <h:outputText value="#{v2SupplierPmOrderController.getOrgInfoByUid(item.clinicalDeptId).name}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{msg.PmOrderRule}"/><br/>
                                <!--<p:autoComplete dropdown="true" value="#{v2SupplierPmOrderController.filterRule}" appendTo="@(Body)"
                                                scrollHeight="300" forceSelection="ture" completeMethod="#{v2SupplierPmOrderController.autoCompleteRuleName()}" size="5">
                                    <p:ajax event="itemSelect" listener="#{v2SupplierPmOrderController.onRuleFilterChange}" process="@this"  update=":pmOrderListForm:datalist" ></p:ajax>
                                    <p:ajax process="@this" listener="#{v2SupplierPmOrderController.onRuleFilterChange}"   update=":pmOrderListForm:datalist"/>
                                </p:autoComplete>-->
                            </f:facet>
                            <h:outputText value="#{item.name}"/>

                        </p:column>

                        <p:column headerText="保养周期">
                            <h:outputText value="#{item.period}"/>
                        </p:column>
                        <p:column headerText="保养周期单位">
                            <h:outputText value="#{v2SupplierPmOrderController.getPeriodUnit(item.periodUnit)}"/>
                        </p:column>

                <p:column headerText="#{msg.Creator}" sortBy="#{item.creatorName}" filterBy="#{item.creatorName}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.creatorName}"/>
                </p:column>

                <p:column headerText="#{msg.Owner}" sortBy="#{item.ownerName}" filterBy="#{item.ownerName}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.ownerName}"/>
                </p:column>


                <p:column headerText="保养编号" sortBy="#{item.pmNum}" filterBy="#{item.pmNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.pmNum}"/>
                </p:column>
                <p:column headerText="#{msg.CurrentProcessingStep}"  filterBy="#{item.currentStepName}" filterMatchMode="EQ">
                    <f:facet name="filter" >
                        <p:selectOneMenu onchange="PF('varDataListgl').filter()" value="#{v2SupplierPmOrderController.stepFileter}"  rendered="#{v2SupplierPmOrderController.queryIndex==-1}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{pmOrderGlobalController.stepsInTableFilter}" var="item" itemLabel="#{item}" itemValue="#{item}"/>
                        </p:selectOneMenu>
                    </f:facet>

                    <h:outputText value="#{item.currentStepName}"/>
                </p:column>
                <p:column headerText="#{msg.intExtType}" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{fieldMsg.fieldValue('intExtType',item.intExtType)}"/>
                </p:column>
                <p:column headerText="#{msg.PlannedCompletionTime}"  sortBy="#{item.planTime}" filterBy="#{item.planTime}" filterMatchMode="GTE" >
                    <f:facet name="filter">
                        <p:inputText id="filterPlannedCompletionTime" widgetVar="varFilterPlannedCompletionTime" value="#{v2SupplierPmOrderController.plannedCompletionTimeFormat}"/>
                    </f:facet>
                    <h:outputText value="#{item.planTime}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="#{msg.ActualCompletionTime}"  sortBy="#{item.endTime}" filterBy="#{item.endTime}" filterMatchMode="GTE" rendered="#{v2SupplierPmOrderController.queryIndex==7 or userContextService.hasCurrentTenantName('')}">
                    <f:facet name="filter">
                        <p:inputText id="filterActualCompletionTime" widgetVar="varFilterActualCompletionTime" value="#{v2SupplierPmOrderController.actualCompletionTimeFormat}"/>
                    </f:facet>
                    <h:outputText value="#{item.endTime}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                    </h:outputText>
                </p:column>

                <!--待派工 2-->
                <p:column headerText="#{msg.Operation}" style="width: 100px" rendered="#{v2SupplierPmOrderController.queryIndex==-1 and userContextService.hasRole('AssetHead')}" exportable="false">
                    <p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" disabled="#{item.currentStepId ne 'Assign' and item.currentStepId and 'Maintain' and item.currentStepId ne 'Accept'}" actionListener="#{v2SupplierPmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />
                </p:column>
                <p:column headerText="#{msg.Operation}" style="width: 100px" rendered="#{v2SupplierPmOrderController.queryIndex==2 and (userContextService.isPmDispatcher() or userContextService.hasRole('AssetHead'))}" exportable="false">
                    <p:commandButton class="dispatchOrderButton" value="#{msg.Dispatch}" disabled="#{v2SupplierPmOrderController.isChecked()}" actionListener="#{v2SupplierPmOrderController.prepareAct(item.id)}" update=":dispatchDialogForm" oncomplete="PF('dispatchDialog').show()"/>

                    <p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" actionListener="#{v2SupplierPmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />
                </p:column>
                <!--待接单 3-->
                <p:column headerText="#{msg.Operation}" style="width: 100px" rendered="#{v2SupplierPmOrderController.queryIndex==3}" exportable="false">

                    <p:commandButton  class="completeButton" value="#{msg.Complete}" disabled="#{v2SupplierPmOrderController.isChecked()}" rendered="#{item.simplify}" actionListener="#{v2SupplierPmOrderController.prepareCompleteOrder(item.id)}" update="@(.pmrepairCompleteDialogFormcls)" oncomplete="PF('pmrepairCompleteDialog').show()"/>
                    <!--v2SupplierPmOrderController.isChecked()加了后 一选中了checkbox 接单按钮就会灰掉 保证不能即批量又单个接单-->
                    <p:commandButton class="takeOrderbutton" disabled="#{item.currentPersonId!=userContextService.loginUserUid or v2SupplierPmOrderController.isChecked()}" rendered="#{item.simplify ne true}" value="#{msg.TakeOrder}" actionListener="#{v2SupplierPmOrderController.prepareActTakeGrap(item.id,msg.OrderDialog)}" update="@(.t1)" oncomplete="PF('takeOrderDialog').show()"/>

                    <!--医工主任：待办 状态为待派工、待接单、已计划的可操作【取消】按钮，其他步骤按钮为灰色-->
                    <!--TODO 暂时不做-->
                    <!--<p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" disabled="#{item.currentStepId ne 'Assign' and item.currentStepId and 'Maintain' and item.currentStepId ne 'Accept'}" actionListener="#{v2SupplierPmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />-->

                </p:column>

                <!--待抢单tab 31 qingtao-->
                <p:column style="width: 100px" headerText="#{msg.Operation}" rendered="#{v2SupplierPmOrderController.queryIndex==31}" exportable="false">
                    <p:commandButton  class="finishButton" value="#{msg.Complete}" disabled="#{v2SupplierPmOrderController.isChecked()}" rendered="#{item.simplify}" actionListener="#{v2SupplierPmOrderController.prepareCompleteOrder(item.id)}" update="@(.pmrepairCompleteDialogFormcls)" oncomplete="PF('pmrepairCompleteDialog').show()"/>

                    <p:commandButton  class="competeButton" disabled="#{v2SupplierPmOrderController.isChecked()}" value="#{userContextService.hasCurrentTenantName('')?msg.TakeOrder:msg.Compete }" rendered="#{item.simplify ne true}" actionListener="#{v2SupplierPmOrderController.prepareActTakeGrap(item.id,msg.OrderCompetitionDialog)}" update="@(.t1)" oncomplete="PF('takeOrderDialog').show()"/>
                    <p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" disabled="#{item.currentStepId ne 'Assign' and item.currentStepId and 'Maintain' and item.currentStepId ne 'Accept'}" actionListener="#{v2SupplierPmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />
                </p:column>

                <!--已计划 0-->
                <p:column headerText="#{msg.Operation}"  style="width: 100px" rendered="#{v2SupplierPmOrderController.queryIndex==0}" exportable="false">
                    <p:commandButton value="#{msg.Maintenance}" class="maintainButton" rendered="#{item.simplify ne true}" actionListener="#{v2SupplierPmOrderController.prepareCompleteOrder(item.id)}" disabled="#{item.approvalStatus==1 or item.approvalStatus==5 or item.currentPersonId!=userContextService.loginUserUid or v2SupplierPmOrderController.isChecked()}" update="@(.pmrepairCompleteDialogFormcls)" oncomplete="PF('pmrepairCompleteDialog').show()"/>


<!--
                    转单不做
                    <p:commandButton value="#{msg.Reassign}" class="transButton" rendered="#{item.simplify ne true}" actionListener="#{v2SupplierPmOrderController.prepareAct(item.id)}"  disabled="#{item.approvalStatus==1 or item.approvalStatus==5 or item.currentPersonId!=userContextService.loginUserUid or v2SupplierPmOrderController.isChecked()}" update="@(.transferOrderDialogClass)"   oncomplete="PF('transferOrderDialog').show()"/>

                    <p:commandButton  class="planedCompleteButton" value="#{msg.Complete}"  disabled="#{item.approvalStatus eq '1' or item.approvalStatus eq '5' or v2SupplierPmOrderController.isChecked()}"  rendered="#{item.simplify}" actionListener="#{v2SupplierPmOrderController.prepareCompleteOrder(item.id)}" update="@(.pmrepairCompleteDialogFormcls)" oncomplete="PF('pmrepairCompleteDialog').show()"/>
                    取消不做
                    <p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" disabled="#{!userContextService.hasRole('AssetHead')}" actionListener="#{v2SupplierPmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />
-->
                </p:column>


                <!--待审核 8-->
                <p:column headerText="#{msg.Operation}" style="width: 100px" rendered="#{v2SupplierPmOrderController.queryIndex==8}" exportable="false">
                    <p:commandButton value="#{msg.Approval}" actionListener="#{v2SupplierPmOrderController.prepareAproval(item.id)}" update="@(.pmapproveDialogCls)" oncomplete="PF('pmapproveDialog').show()"/>
                </p:column>
                <p:column headerText="#{msg.Operation}" style="width: 100px" rendered="#{v2SupplierPmOrderController.queryIndex==6}" exportable="false">
                    <p:commandButton value="#{msg.Close}" class="closeButton" disabled="#{item.currentPersonId!=userContextService.loginUserUid or v2SupplierPmOrderController.isChecked()}" rendered="#{item.simplify ne true}" actionListener="#{v2SupplierPmOrderController.prepareAct(item.id)}" update=":pmOrderListForm @(.closePmDialogClass)" oncomplete="PF('closePmDialog').show()" />
                </p:column>

                <!--待验收 11-->
                <p:column headerText="#{msg.Operation}"  style="width: 100px" rendered="#{v2SupplierPmOrderController.queryIndex==11}" exportable="false">
                    <p:commandButton  class="planedCompleteButton" value="验收"  disabled="#{v2SupplierPmOrderController.isChecked()}" actionListener="#{v2SupplierPmOrderController.prepareAct(item.id)}" update=":ackDialogForm" oncomplete="PF('ackDialog').show()"/>
                    <p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" disabled="#{!userContextService.hasRole('AssetHead')}" actionListener="#{v2SupplierPmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />
                </p:column>

                <f:facet name="{Toolbar}" >
                    <p:commandButton title="#{msg.exportToXLS}" class="exportExcelBtn" icon="ui-icon-arrowstop-1-s" actionListener="#{v2SupplierPmOrderController.exportExcel}" disabled="#{v2SupplierPmOrderController.exportButtonShow()}" onclick="PrimeFaces.monitorDownload(start, stop);">

                        <p:fileDownload value="#{v2SupplierPmOrderController.excelFile}"/>
                    </p:commandButton>

                    <ui:fragment rendered="true">

                        <p:commandButton  icon="ui-icon-assignment-ind" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchDispatch}"  update="@(.disClass)" rendered="#{v2SupplierPmOrderController.queryIndex==2}" disabled="#{not v2SupplierPmOrderController.isChecked()}" oncomplete="PF('dispatchDialog').show()">
                        </p:commandButton>

                        <p:commandButton  icon="ui-icon-assessment" class="btn btn-sm btn-gray batch-piliangjiedan" title="#{msg.BatchTake}"  update="@(.t1)" rendered="#{v2SupplierPmOrderController.queryIndex==3}" disabled="#{v2SupplierPmOrderController.isBatchTakePm()}" oncomplete="PF('takeOrderDialog').show()">
                        </p:commandButton>

                        <p:commandButton  icon="ui-icon-arrow-forward" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchReassign}"  update="@(.transferOrderClass)" rendered="#{v2SupplierPmOrderController.queryIndex==0}" disabled="#{not v2SupplierPmOrderController.isChecked()}"  actionListener="#{v2SupplierPmOrderController.forbidTransfer()}" oncomplete="forbidTransfer(xhr, status, args)">
                        </p:commandButton>

                        <p:commandButton  icon="ui-icon-aspect-ratio" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchComplete}"  update="@(.pmCompleteDialogBatch)" actionListener="#{v2SupplierPmOrderController.sameType()}" rendered="#{v2SupplierPmOrderController.isAllowBatchComplate()}" disabled="#{not v2SupplierPmOrderController.isChecked()}" oncomplete="forbidBatchComplete(xhr, status, args)">
                        </p:commandButton>

                        <!--<p:commandButton  icon="ui-icon-aspect-ratio" actionListener="#{v2SupplierPmOrderController.prepareBatchComplete()}" class="btn btn-sm btn-gray batch-terminated" title="批量完成"  update=":pmOrderListForm @(.pmCompleteDialogBatch)" rendered="#{v2SupplierPmOrderController.isBatchOp and (v2SupplierPmOrderController.queryIndex==31 or v2SupplierPmOrderController.queryIndex==3 or v2SupplierPmOrderController.queryIndex==0)}" disabled="#{not v2SupplierPmOrderController.isBatchComplete()}" oncomplete="PF('pmCompleteDialogBatch').show()">
                        </p:commandButton>-->
                        <p:commandButton  icon="ui-icon-assistant" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchCancel}"  update="@(.pmBatchCancelDialog) @(.pmCancelFormCls)" actionListener="#{v2SupplierPmOrderController.preBatchCancel()}"  rendered="#{ (v2SupplierPmOrderController.queryIndex==0 or v2SupplierPmOrderController.queryIndex==31 or v2SupplierPmOrderController.queryIndex==3 or v2SupplierPmOrderController.queryIndex==2 or v2SupplierPmOrderController.queryIndex==-1)}" disabled="#{v2SupplierPmOrderController.batchCancelShow() or not v2SupplierPmOrderController.isChecked()}" oncomplete="PF('pmBatchCancelDialog').show()">
                        </p:commandButton>

                        <p:commandButton  icon="ui-icon-art-track" actionListener="#{v2SupplierPmOrderController.prepareBatchComplete()}" class="btn btn-sm btn-gray batch-terminated" title="#{userContextService.hasCurrentTenantName('')?msg.BatchTake:msg.BatchGrap}"  rendered="#{v2SupplierPmOrderController.queryIndex==31}" disabled="#{not v2SupplierPmOrderController.isBatchRob()}" oncomplete="PF('robOrderDialog').show()">
                        </p:commandButton>

                        <p:commandButton  icon="ui-icon-assessment" actionListener="#{v2SupplierPmOrderController.prepareAct(item.id)}" class="btn btn-sm btn-gray batch-terminated" title="#{msg.BatchClose}"  rendered="#{v2SupplierPmOrderController.queryIndex==6}" update="@(.closePmDialogClassBatch)" disabled="#{not v2SupplierPmOrderController.isChecked()}" oncomplete="PF('closePmDialogBatch').show()">
                        </p:commandButton>

                        <p:commandButton  icon="ui-icon-arrow-1-s" actionListener="#{v2SupplierPmOrderController.doExportMaintenanceReport()}" class="btn btn-sm btn-gray btn-export-maintenance-report" title="#{msg.ExportMaintenanceWorkorder}" rendered="#{v2SupplierPmOrderController.queryIndex==7}" disabled="#{not v2SupplierPmOrderController.isTargetSelected()}" ajax="false">
                            <p:fileDownload value="#{v2SupplierPmOrderController.maintenanceReport}" />
                        </p:commandButton>
                    </ui:fragment>
                </f:facet>
            </p:dataTable>
        </h:form>
        <ui:include src="pmSupplierOrderView.xhtml"/>
        <ui:include src="pmSupplierRepairCompleteDlg.xhtml"/>
        <ui:include src="pmSupplierApproveDlg.xhtml"/>
        <ui:include src="pmSupplierMoreAccDialogPrice.xhtml"/>

    </div>
    <!-- </div>-->

    <!--取消对话框 -->
    <p:dialog id="pmCancelDialog" widgetVar="pmCancelDialog" modal="true" width="400"  resizable="true" draggable="true" header="#{msg.CancelDialog}">
        <h:panelGroup>
            <h:form id="pmCancelForm" class="pmCancelFormCls" >
                <p:selectOneRadio id="cancelRadio" value="#{v2SupplierPmOrderController.cancelInt}">
                    <f:selectItem itemDisabled="false" itemLabel="#{msg.CancelCurrentWorkorder}" itemValue="1"/>
                    <!--批量类型是2 和3 的话非周期性-->

    <!--转单-->
    <p:dialog class ="transferOrderClass" id="transferOrderDialog" widgetVar="transferOrderDialog" modal="true" width="300"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.ReassignDialog}"><!--转单对话框-->
        <h:form class ="transferOrderDialogClass" id="transferOrderDialogForm" >
            <h:panelGroup id="display2" rendered="#{not empty v2SupplierPmOrderController.selectedPmOrder or v2SupplierPmOrderController.isChecked()}">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup rendered="#{not empty v2SupplierPmOrderController.selectedPmOrder and  v2SupplierPmOrderController.isChecked() eq false}">
                        <label class="label">#{msg.MaintenanceProvider}</label>
                        <p:selectOneMenu  value="#{v2SupplierPmOrderController.selectedPmOrder.currentPersonId}" required="true" requiredMessage="#{msg.currentPersonId} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{v2SupplierPmOrderController.findRepairPerson()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <!--展现批量转单对话框的内容-->
                    <h:panelGroup rendered="#{v2SupplierPmOrderController.isChecked() eq true}">
                        <label class="label">#{msg.MaintenanceProvider}</label>
                        <p:selectOneMenu filter="true" filterMatchMode="contains" value="#{v2SupplierPmOrderController.currentPersonIdBatch}" required="true" requiredMessage="#{msg.currentPersonId} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{v2SupplierPmOrderController.findRepairPersonBatch()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.feedbackComment}</label>
                        <p:inputTextarea id="comment" placeholder="#{msg.WorkRequirements}" value="#{v2SupplierPmOrderController.comments}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4" maxlength="100"/>
                    </h:panelGroup>
                </p:panelGrid>

                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{v2SupplierPmOrderController.reassignWorkOrder()}" value="#{msg.TransferOrder}" update="@(.transferOrderDialogClass) :growl :pmTab:pmOrderListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'transferOrderDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{v2SupplierPmOrderController.cancel()}" icon="ui-icon-cancel" onclick="PF('transferOrderDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>


        </h:form>
