<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog id="pmMoreAccDialogPriceDlg" class="pmMoreAccDialogPriceDlg" widgetVar="pmMoreAccDialogPriceDlg" modal="true" width="1200"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.PartUpdate}" positionType="absolute">
        <h:form id="pmMoreAccDialogFormX" > <!--备件对话框 工单细节中 修改-->
            <h:panelGroup id="display42">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.PartName}*</label>
                        <p:inputText id="parts"  value="#{v2PmOrderController.itemDetail.parts}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.PartQuantity}*</label>
                        <p:inputNumber  maxValue="999999" decimalPlaces="0"  id="apartsQuantity" value="#{v2PmOrderController.itemDetail.apartsQuantity}" required="true" requiredMessage="#{msg.PartQuantity} #{msg.ValidationRequire}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedUnitPriceRMB}*</label>
                        <p:inputNumber disabled="#{v2PmOrderController.nochange}" decimalPlaces="0" maxValue="999999" id="partsPriceM"  value="#{v2PmOrderController.itemDetail.partsPrice}" required="true" requiredMessage="#{msg.EstimatedUnitPriceRMB} #{msg.ValidationRequire}">
                            <p:ajax listener="#{v2PmOrderController.partsPriceUpdate()}" update="@(.hetongjia)" >
                            </p:ajax>
                            <f:convertNumber pattern="0" type="number"/>

                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.PartType}</label>
                        <p:selectOneMenu value="#{v2PmOrderController.itemDetail.partsType}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <!--update-->
                    <h:panelGroup>
                        <label class="label">#{msg.InvoiceNumber}</label>
                        <p:inputText value="#{v2PmOrderController.itemDetail.invoiceNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.InvoicingTime}</label>
                        <p:calendar  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" label="#{msg.EstimatedArrivalTime}" value="#{v2PmOrderController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.InvoiceProvider}</label>
                        <p:autoComplete id="vendorM" dropdown="true" value="#{v2PmOrderController.supplierName}" scrollHeight="300"
                                        forceSelection="false"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}"
                                        completeMethod="#{v2PmOrderController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                            <p:ajax event="itemSelect" listener="#{v2PmOrderController.onSupplierChange()}"/>
                            <p:ajax listener="#{v2PmOrderController.onSupplierChange()}" />
                        </p:autoComplete>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.ContractPriceRMB}*</label>
                        <p:inputNumber  decimalPlaces="4" maxValue="99999999" id="partsPrice"  value="#{v2PmOrderController.itemDetail.closedPrice}" required="true" requiredMessage="#{msg.ActualPriceRMB} #{msg.ValidationRequire}" />
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.ContractNumber}</label>
                        <p:inputText value="#{v2PmOrderController.itemDetail.contractNum}"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.WarrantyDate}</label>
                        <p:calendar  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" label="#{msg.EquipmentTakingTime}"  value="#{v2PmOrderController.itemDetail.warrantyDate}" showOn="button"
                                    readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.SerialNumber}</label>
                        <p:inputText value="#{v2PmOrderController.itemDetail.serialNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedArrivalTime}</label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd HH:mm" value="#{v2PmOrderController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ApplyTime}</label>
                        <p:calendar disabled="#{v2PmOrderController.nochange}"   timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" label="#{msg.ApplyTime}" value="#{v2PmOrderController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.feedbackComment}</label>
                        <p:inputTextarea id="area" value="#{v2PmOrderController.itemDetail.comment}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:column headerText="#{msg.Arrival}">
                            <p:selectBooleanButton disabled="#{v2PmOrderController.selected.finished}" value="#{v2PmOrderController.itemDetail.arrived}" onLabel="#{msg.Arrived}" offLabel="#{msg.NonArrived}">
                                <p:ajax listener="#{v2PmOrderController.arrivalTimeSet}" event="change"></p:ajax>
                             </p:selectBooleanButton>
                            <p:selectBooleanButton   value="#{v2PmOrderController.itemDetail.closed}" onLabel="#{msg.ClosedFinish}" offLabel="#{msg.IsOpened}">
                                <p:ajax listener="#{v2PmOrderController.orderSet}" event="change"></p:ajax>
                            </p:selectBooleanButton>
                        </p:column>
                    </h:panelGroup>



<!--
                    <h:panelGroup>
                        <p:column headerText="结单">
                            <p:selectBooleanButton   value="#{v2PmOrderController.itemDetail.closed}" onLabel="已结单" offLabel="未结单">
                                <p:ajax listener="#{v2PmOrderController.orderSet}" event="change"></p:ajax>
                            </p:selectBooleanButton>
                        </p:column>
                    </h:panelGroup>-->

                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.updateAccessPrice()}" value="#{msg.Save}" update="@(.pmOrderDetailFormCls) @(.accessCls) :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmMoreAccDialogPriceDlg');"/>
                    <p:commandButton immediate="true" actionListener="#{v2PmOrderController.cancelWorkdetail}" value="#{msg.Cancel}" update=":growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmMoreAccDialogPriceDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

    <p:dialog id="pmmoreAccDialogViewDlg" class="pmmoreAccDialogViewDlg" widgetVar="pmmoreAccDialogViewDlg" modal="true" width="1200"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.PartView}">
        <h:form id="pmmoreAccDialogViewForm" ><!--备件对话框 查看-->
            <h:panelGroup>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.PartName}*</label>
                        <p:inputText id="parts_view" disabled="true" value="#{v2PmOrderController.itemDetail.parts}" readonly="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.PartQuantity}*</label>
                        <p:inputNumber  maxValue="999999" decimalPlaces="0" disabled="true" id="apartsQuantityView" value="#{v2PmOrderController.itemDetail.apartsQuantity}" readonly="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedUnitPriceRMB}*</label>
                        <p:inputNumber  decimalPlaces="0" maxValue="999999" id="partsPrice_view"  value="#{v2PmOrderController.itemDetail.partsPrice}" disabled="true" requiredMessage="#{msg.EstimatedUnitPriceRMB} #{msg.ValidationRequire}">
                            <f:convertNumber pattern="0" type="number"/>
                        </p:inputNumber>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.PartType}</label>
                        <p:selectOneMenu disabled="true" value="#{v2PmOrderController.itemDetail.partsType}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('partsType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.InvoiceNumber}</label>
                        <p:inputText disabled="true" value="#{v2PmOrderController.itemDetail.invoiceNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.InvoicingTime}</label>
                        <p:calendar disabled="true" timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}" pattern="yyyy/MM/dd" value="#{v2PmOrderController.itemDetail.invoiceTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.Vendor}</label>
                        <p:autoComplete id="vendor_view" disabled="true" dropdown="true" value="#{v2PmOrderController.supplierName}" scrollHeight="300" forceSelection="false"   requiredMessage="#{msg.vendor} #{msg.ValidationRequire}" completeMethod="#{v2PmOrderController.autoCompleteSupplier}" var="t" itemLabel="#{t}" itemValue="#{t}">
                        </p:autoComplete>
                    </h:panelGroup>


                    <h:panelGroup>
                        <label class="label">#{msg.ContractPriceRMB}*</label>
                        <p:inputNumber disabled="true" decimalPlaces="4" maxValue="99999999" id="closedPrice_view"  value="#{v2PmOrderController.itemDetail.closedPrice}" readonly="true" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ContractNumber}</label>
                        <p:inputText disabled="true" value="#{v2PmOrderController.itemDetail.contractNum}"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.WarrantyDate}</label>
                        <p:calendar disabled="true" timeZone="GMT+8" label="#{msg.EquipmentTakingTime}" pattern="yyyy/MM/dd" value="#{v2PmOrderController.itemDetail.warrantyDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.SerialNumber}</label>
                        <p:inputText disabled="true" value="#{v2PmOrderController.itemDetail.serialNum}"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EstimatedArrivalTime}</label>
                        <p:calendar disabled="true"   timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" label="#{msg.EstimatedArrivalTime}"  value="#{v2PmOrderController.itemDetail.estimatedArriveTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.ApplyTime}</label>
                        <p:calendar disabled="true"   timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" label="#{msg.ApplyTime}"  value="#{v2PmOrderController.itemDetail.applyTime}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <p:column headerText="#{msg.Arrival}">
                        <p:selectBooleanButton disabled="true"  value="#{v2PmOrderController.itemDetail.arrived}" onLabel="#{msg.Arrived}" offLabel="#{msg.NonArrived}">
                            <!--<p:ajax listener="#{v2PmOrderController.arrivalTimeSet}" event="change"></p:ajax>-->
                        </p:selectBooleanButton>
                        <p:selectBooleanButton  disabled="true" value="#{v2PmOrderController.itemDetail.closed}" onLabel="#{msg.ClosedFinish}" offLabel="#{msg.IsOpened}">
                           <!-- <p:ajax listener="#{v2PmOrderController.orderSet}" event="change"></p:ajax>-->
                        </p:selectBooleanButton>
                    </p:column>
                    <h:panelGroup>
                        <label class="label">#{msg.feedbackComment}</label>
                        <p:inputTextarea id="area_view" disabled="true" value="#{v2PmOrderController.itemDetail.comment}"/>
                    </h:panelGroup>
                </p:panelGrid>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
