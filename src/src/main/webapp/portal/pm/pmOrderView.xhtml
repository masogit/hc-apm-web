<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:composition>
        <div class="ui-g-12 card">

            <h:form id="pmOrderDetailForm">
                <p:fieldset legend="保养单" rendered="#{not empty v2PmOrderController.selected}">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
              <!--  <h:panelGroup>

                </h:panelGroup>-->
                        <h:panelGroup>
                            <label class="label">资产名</label>
                            <p:outputLabel value="#{v2PmOrderController.selected.assetName}"></p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">设备编号</label>
                            <p:outputLabel value="#{v2PmOrderController.selected.assetInfo.departNum}"></p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">保养等级</label>
                            <p:outputLabel value="#{v2PmOrderController.selected.ruleLevel}"></p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">使用科室</label>
                            <p:outputLabel value="#{v2PmOrderController.selected.assetInfo.clinicalDeptName}"></p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">保养编号</label>
                            <p:outputLabel value="#{v2PmOrderController.selected.pmNum}" ></p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">创建人</label>
                            <p:outputLabel value="#{v2PmOrderController.selected.creatorName}"></p:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">当前处理步骤</label>
                            <p:outputLabel value="#{v2PmOrderController.selected.currentStepName}"></p:outputLabel>
                        </h:panelGroup>
                    </p:panelGrid>

                  <!--  <p:fieldset >


                    </p:fieldset>
-->

                   <!-- <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.assetName}</label>
                            <p:outputLabel value="#{v2PmOrderController.selectedPmOrder.assetName}" />
                        </h:panelGroup>

                    </p:panelGrid>-->

                    <p:dataTable value="#{v2PmOrderController.aquirePmOrderStep()}" var="stepItem">
                        <p:column headerText="#{msg.stepName}">
                            <h:outputText value="#{stepItem.stepName}" />
                        </p:column>
                        <p:column headerText="#{msg.ownerName}">
                            <h:outputText value="#{stepItem.ownerName}" />
                        </p:column>
                        <p:column headerText="#{msg.startTime}">
                            <h:outputText value="#{stepItem.startTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.endTime}">
                            <h:outputText value="#{stepItem.endTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.description}">
                            <h:outputText value="#{stepItem.comments}" />
                        </p:column>

                    </p:dataTable>

                    <h:panelGroup>
                        <label class="label">备件信息</label><!--增加备件-->
                        <p:dataTable id="accessList" class="uiTransparent" value="#{v2PmOrderController.accessoryList}" var="item" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="#{msg.accessory}">
                                <h:outputText value="#{item.parts}"/>
                            </p:column>

                            <p:column headerText="#{msg.accessoryQuantity}">
                                <h:outputText value="#{item.apartsQuantity}"/>
                            </p:column>
                            <p:column headerText="#{msg.accessoryPrice}">
                                <h:outputText value="#{item.partsPrice}">
                                    <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="类型">
                                <h:outputText value="#{fieldMsg.fieldValue('partsType', item.partsType)}" />
                            </p:column>
                            <p:column headerText="序列号">
                                <h:outputText value="#{item.serialNum}" />
                            </p:column>
                            <p:column headerText="质保期">
                                <h:outputText value="#{item.warrantyDate}">
                                    <f:convertDateTime pattern="yyyy-MM-dd"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="预计到达时间">
                                <h:outputText value="#{item.estimatedArriveTime}">
                                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="到货">
                                <h:outputText value="#{item.arrived?'已到货':'未到货'}" rendered="#{item.id ne '000'}"/>
                            </p:column>

                        </p:dataTable>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">协作人信息</label>
                        <p:dataTable id="pmcoworkerList" class="uiTransparent" value="#{v2PmOrderController.coWorkerList}" var="item" widgetVar="pmcoworkerDataList" lazy="false" paginator="false"
                                     rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="#{msg.coworker}">
                                <h:outputText value="#{item.cowokerUserName}"/>
                            </p:column>
                            <p:column headerText="#{msg.manHours}">
                                <h:outputText value="#{item.manHours}" />
                            </p:column>
                        </p:dataTable>
                    </h:panelGroup>



                </p:fieldset>
            </h:form>

        </div>
    </ui:composition>
</html>
