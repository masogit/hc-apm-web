<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

<ui:composition>
    <div class="ui-g-12 card" >

        <h:form id="pmOrderDetailForm" class="pmOrderDetailFormCls">
            <p:fieldset legend="#{msg.MaintenanceWorkorder}" rendered="#{not empty v2PmOrderController.selected}">
                <div class="ui-g">
                    <div class="ui-g-10 ui-g-nopad">
                        <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.AssetName}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.assetName}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.EquipmentID}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.assetInfo.departNum}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.MeasurementGrade2}</label>
                                <p:outputLabel value="#{v2PmOrderController.getRuleLevelName(v2PmOrderController.selected.ruleLevel)}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.MaintenanceType}</label>
                                <p:outputLabel value="#{fieldMsg.fieldValue('pmType',v2PmOrderController.selected.pmType)}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{!userContextService.hasCurrentTenantName('') }">
                                <label class="label">#{msg.clinicalDeptName}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.assetInfo.clinicalDeptName}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{userContextService.hasCurrentTenantName('') }">
                                <label class="label">#{msg.clinicalDeptName}</label>
                                <p:outputLabel value="#{v2PmOrderController.getOrgInfoByUid(v2PmOrderController.selected.clinicalDeptId).name}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.MaintenanceNumber}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.pmNum}" ></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.Creator}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.creatorName}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.CurrentProcessingStep}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.currentStepName}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.ManhoursHours}</label>
                                <h:outputText value="#{v2PmOrderController.selected.manHours}">
                                    <f:convertNumber pattern="0.00" minFractionDigits="2"></f:convertNumber>
                                </h:outputText>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.PlannedCompletionTime}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.planTime}">
                                    <f:convertDateTime pattern="yyyy-MM-dd"/>
                                </p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.ActualCompletionTime}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.endTime}">
                                    <f:convertDateTime pattern="yyyy-MM-dd"/>
                                </p:outputLabel>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.MaintenanceResult}</label>
                                <p:outputLabel value="#{fieldMsg.fieldValue('qualityChecking',v2PmOrderController.selected.qualityChecking)}"></p:outputLabel>
                            </h:panelGroup>

                            <h:panelGroup>
                                <label class="label">#{msg.Cancelor}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.cancelPerson}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.CancellationReason}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.cancelReason}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">#{msg.pmComment}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.comments}"></p:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{v2PmOrderController.selected.pmType eq 4}">
                                <label class="label">#{msg.originalPmNum}</label>
                                <p:outputLabel value="#{v2PmOrderController.selected.originalPmNum}"></p:outputLabel>
                            </h:panelGroup>
                        </p:panelGrid>
                    </div>
                    <div class="ui-g-2">
                        <h:outputText value="#{msg.AcceptanceSignature}：" />
                        <div class="container-fluid" style="height: 200px; width: 200px;">
                            <p:graphicImage value="#{fileDownloadService.getFile(v2PmOrderController.selected.ackSignature)}" stream="false" style="max-width: 100%;height: auto"/>
                        </div>
                    </div>
                </div>
                <p:dataGrid id="pictureList" var="fileitem" value="#{v2PmOrderController.picList}" columns="5" layout="grid">
                    <p:panel  style="text-align:center">
                        <h:panelGrid columns="1" style="width:100%" >
                            <p:ajax  event="click" update="pmTab:previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(workOrderMgrController,fileitem.objectStorageId)}"/>
                            <img src="#{fileDownloadService.getImgBase64(fileitem.objectStorageId)}" style="width:100px; height:80px;margin: 0px 5px 0px 5px;"/>
                        </h:panelGrid>
                        <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.objectName}" action="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                    </p:panel>
                </p:dataGrid>
                <p:dataTable value="#{v2PmOrderController.aquirePmOrderStep()}" var="stepItem">
                    <p:column headerText="#{msg.stepName}">
                        <h:outputText value="#{stepItem.stepName}" />
                    </p:column>
                    <p:column headerText="#{msg.ownerName}">
                        <h:outputText value="#{stepItem.ownerName}" />
                    </p:column>
                    <p:column headerText="#{msg.startTime}">
                        <h:outputText value="#{stepItem.startTime}" >
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="#{msg.endTime}">
                        <h:outputText value="#{stepItem.endTime}" >
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd"/>
                        </h:outputText>
                    </p:column>
                </p:dataTable>
                <h:panelGroup rendered="#{not empty v2PmOrderController.selected.pmOrderManHoursDetails}">
                    <label class="label">#{msg.workTimePeriod}</label>
                    <p:dataTable id="x4" class="cl4" value="#{v2PmOrderController.selected.pmOrderManHoursDetails}" var="detailItem">
                        <p:column headerText="#{msg.startTime}">
                            <h:outputText value="#{detailItem.startTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.endTime}">
                            <h:outputText value="#{detailItem.endTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.hourslb}">
                            <h:outputText value="#{detailItem.hours}" />
                        </p:column>
                        <p:column headerText="#{msg.remark}">
                            <h:outputText value="#{detailItem.remark}"/>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>


                <h:panelGroup rendered="#{v2PmOrderController.maintenancePersonInformation != null}">
                    <label class="label">#{msg.maintenancePersonInformation}</label>
                    <p:dataTable styleClass="header1" id="qrCodeEditForm" var="person" value="#{v2PmOrderController.maintenancePersonInformation}" editable="true" rowKey="#{person.fieldName}">
                        <p:ajax event="rowEdit" listener="#{v2PmOrderController.onRowEditExternalTempUser}" update="qrCodeEditForm" />
                        <p:ajax event="rowEditCancel" listener="#{v2PmOrderController.onRowCancelExternalTempUser}" update="qrCodeEditForm" />
                        <p:column  >
                            <h:outputText value="#{person.key}" />
                        </p:column>
                        <p:column  >
                            <p:cellEditor>
                                <f:facet name="output"><h:outputText value="#{person.label}" /></f:facet>
                                <f:facet name="input"><p:inputText id="label" value="#{person.label}" style="width:100%"/></f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column >
                            <p:rowEditor editTitle="#{msg.Edit}" />
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>

                <h:panelGroup rendered="#{not empty v2PmOrderController.externalTempUser and not empty v2PmOrderController.externalTempUser.signature}">
                    <label class="label">#{msg.AcceptanceSignature}</label>
                    <p:panel  style="text-align:center">
                        <h:panelGrid columns="1" style="width:100%" >
                            <p:graphicImage value="#{fileDownloadService.getFile(v2PmOrderController.externalTempUser.signature)}" stream="false" height="80"  width="100"/>
                        </h:panelGrid>
                    </p:panel>
                </h:panelGroup>
                <h:panelGroup rendered="#{not empty v2PmOrderController.getWorkOrderDetailON()}">
                    <label class="label">#{msg.UsedPart}</label>
                    <p:dataTable id="accessList" class="uiTransparent" value="#{v2PmOrderController.getWorkOrderDetailON()}" var="detailItem" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{detailItem.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                        <p:column headerText="#{msg.PartName}">
                            <h:outputText value="#{detailItem.parts}"/>
                        </p:column>
                        <p:column headerText="#{msg.PartsItemCode}" rendered="#{userContextService.countyArea}">
                            <h:outputText value="#{v2PmOrderController.getPartsItemCode(detailItem)}"/>
                        </p:column>
                        <p:column headerText="#{msg.accessoryQuantity}">
                            <h:outputText value="#{detailItem.apartsQuantity}"/>
                        </p:column>
                        <p:column headerText="#{msg.EstimatedUnitPriceRMB}">
                            <h:outputText value="#{detailItem.partsPrice}">
                                <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.ContractPriceRMB}">
                            <h:outputText value="#{detailItem.closedPrice}">
                                <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                            </h:outputText>

                        </p:column>
                        <p:column headerText="#{msg.ApprovalStatus}">
                            <h:outputText value="#{empty detailItem.approved? msg.Unapproved: detailItem.approved? msg.Pass:msg.Fail}" />
                        </p:column>
                        <p:column headerText="#{msg.PartType}">
                            <h:outputText value="#{fieldMsg.fieldValue('partsType', detailItem.partsType)}" />
                        </p:column>
                        <p:column headerText="#{msg.InvoiceNumber}">
                            <h:outputText value="#{detailItem.invoiceNum}" />
                        </p:column>
                        <p:column headerText="#{msg.SerialNumber}">
                            <h:outputText value="#{detailItem.serialNum}" />
                        </p:column>
                        <p:column headerText="#{msg.WarrantyDate}">
                            <h:outputText value="#{detailItem.warrantyDate}">
                                <f:convertDateTime pattern="yyyy-MM-dd"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.ApplyTime}">
                            <h:outputText value="#{detailItem.applyTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.EstimatedArrivalTime}">
                            <h:outputText value="#{detailItem.estimatedArriveTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.ArrivalConfirmationTime}">
                            <h:outputText value="#{detailItem.arrivedTime}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.Arrival}">
                            <h:outputText value="#{detailItem.arrived?msg.Arrived:msg.NonArrived}" rendered="#{detailItem.id ne '000'}"/>
                        </p:column>
                        <p:column headerText="#{msg.partsDescription}" rendered="#{userContextService.countyArea}">
                            <h:outputText value="#{detailItem.partsDescription}" />
                        </p:column>
                        <p:column headerText="#{msg.Operation}">
                            <p:commandButton rendered="#{v2PmOrderController.allowChanged()}" process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" disabled="#{v2PmOrderController.allowChangedForDisable() or detailItem.approved==null?'false': not detailItem.approved}" actionListener="#{v2PmOrderController.prepareEditAccDetailonPrice(detailItem.id)}" update="@(.pmMoreAccDialogPriceDlg)" oncomplete="PF('pmMoreAccDialogPriceDlg').show()"/>

                            <p:commandButton process="@this" icon="ui-icon-search" style="zoom:0.8;" title="#{msg.View}"  actionListener="#{v2PmOrderController.prepareEditAccDetailonPrice(detailItem.id)}" update="@(.pmmoreAccDialogViewDlg)" oncomplete="PF('pmmoreAccDialogViewDlg').show()"/>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>

                <h:panelGroup rendered="#{not empty v2PmOrderController.getWorkOrderCoworkerON(null)}">
                    <label class="label">#{msg.CoworkerInformation}</label>
                    <p:dataTable id="pmcoworkerList" class="uiTransparent coworkcls" value="#{v2PmOrderController.getWorkOrderCoworkerON(null)}"  var="item" widgetVar="pmcoworkerList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                        <p:column headerText="#{msg.coworker}">
                            <h:outputText value="#{item.cowokerUserName}"/>
                        </p:column>

                        <p:column headerText="#{msg.startTime}" rendered="#{v2PmOrderController.selected.coworkerEntryType==1 || v2PmOrderController.selected.coworkerEntryType==3}">
                            <h:outputText value="#{item.startTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.endTime}" rendered="#{v2PmOrderController.selected.coworkerEntryType==1 || v2PmOrderController.selected.coworkerEntryType==3}">
                            <h:outputText value="#{item.endTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.manHours}">
                            <h:outputText value="#{item.manHours}"/>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>

                <p:dataGrid id="partPictureList" var="fileitem" value="#{v2PmOrderController.getPartPictures(v2PmOrderController.selected.id)}" columns="5" layout="grid" >
                    <p:panel  style="text-align:center">
                        <h:panelGrid columns="1" style="width:100%" >
                            <p:ajax  event="click" update="pmTab:previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(workOrderMgrController,fileitem.objectStorageId)}"/>
                            <img src="#{fileDownloadService.getImgBase64(fileitem.objectStorageId)}" style="width:100px; height:80px;margin: 0px 5px 0px 5px;"/>
                        </h:panelGrid>
                        <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.objectName}" action="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                    </p:panel>
                </p:dataGrid>
                <p:growl id="msgs" showDetail="true" />
                <p:fieldset legend="#{msg.MaintenanceList}">
                    <p:fieldset legend="#{msg.MaintenanceReport}">
                        <p:dataList class="rpClass"  value="#{v2PmOrderController.reportList}" var="reportItem" emptyMessage="#{msg.noRecordFound}">
                            #{v2PmOrderController.getTableDefName(reportItem.schemaId)}
                            <h:outputText id="installDate" value="#{reportItem.createdDate}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                            </h:outputText>
                            <p:link value="#{msg.View}" target="_blank" href="#{commonReportController.getViewLinkUrl(reportItem)}" />
                        </p:dataList>

                    </p:fieldset>
                    <p:fieldset legend="#{msg.CheckItem}" id="chkItem"   rendered="#{not empty v2PmOrderController.selected}">
                        <c:forEach  items="#{v2PmOrderController.pmCheckItemList}" var="item">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label" style="word-wrap: break-word">#{item.name}</label>
                                    <p:selectOneMenu disabled="true" value="#{item.value}">
                                        <p:ajax listener="#{v2PmOrderController.hmCheckSet(item.key)}"></p:ajax>
                                        <f:selectItem itemValue="#{'pass'}" itemLabel="#{fieldMsg.fieldValue('checkItem','pass')}"></f:selectItem>
                                        <f:selectItem itemValue="#{'n/a'}" itemLabel="#{fieldMsg.fieldValue('checkItem','n/a')}"></f:selectItem>
                                        <f:selectItem itemValue="#{'fail'}" itemLabel="#{fieldMsg.fieldValue('checkItem','fail')}"></f:selectItem>
                                    </p:selectOneMenu>
                                    <p:inputTextarea rows="3" style="width:100%;height:100px" readonly="true" value="#{item.remark}"></p:inputTextarea><br/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </c:forEach>
                    </p:fieldset>
                </p:fieldset>

                <h:panelGroup >
                    <label class="label">#{msg.MaintenanceWorkorderMessage}</label>
                    <p:dataList value="#{v2PmOrderController.getServiceRequestMessageList(v2PmOrderController.selected.id)}" var="msgItem" rendered="#{not empty v2PmOrderController.getServiceRequestMessageList(v2PmOrderController.selected.id)}">
                        <h:outputText value="#{msgItem.sendTime}" >
                            <f:convertDateTime pattern="MM/dd HH:mm:ss"/>
                        </h:outputText>
                        <h:outputText value="#{msgItem.senderUserName}"  style="padding-left: 10px"/>
                        <h:outputText value="#{msgItem.message}"  style="padding-left: 10px"/>
                    </p:dataList>
                </h:panelGroup>

            </p:fieldset>
        </h:form>
    </div>
</ui:composition>
</html>
