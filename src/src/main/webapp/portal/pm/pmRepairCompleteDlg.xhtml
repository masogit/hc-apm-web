<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
>

<ui:composition>

    <p:dialog class ="pmrepairCompleteDialog" id="pmrepairCompleteDialog" widgetVar="pmrepairCompleteDialog" modal="true" height="550" width="1000"  resizable="true" draggable="true" appendTo="@this" header="#{msg.MaintenanceComplete}">
        <h:form id="pmrepairCompleteDialogForm" class="pmrepairCompleteDialogFormcls" >
            <h:panelGroup  id="display5" style="height:500px" rendered="#{not empty v2PmOrderController.selectedPmOrder}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.PlannedCompletionTime}*</label>
                        <p:calendar   timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" id="fillDate"   value="#{v2PmOrderController.selectedPmOrder.planTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" required="true" requiredMessage="#{msg.PlannedCompletionTime}#{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.MaintenanceEndTime}*</label>
                        <p:calendar  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" id="fillDate1"   value="#{v2PmOrderController.endTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false"   requiredMessage="#{msg.MaintenanceEndTime} #{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                </p:panelGrid>

                <p:fieldset legend="#{msg.ExpenseDetails}" >
                    <!-- 工时类型填写-->
                    <p:panelGrid columns="2" styleClass="ui-panelgrid-blank form-group" id="entryTypeFlag">
                        <h:panelGroup>
                            <label class="label">#{msg.manHoursEntryType}*</label>
                            <p:selectOneRadio id="entryType" required="true" disabled="false" value="#{v2PmOrderController.selectedPmOrder.entryType}"  requiredMessage="#{msg.manHoursEntryType} #{msg.ValidationRequire}">
                                <p:ajax event="change" process="@this" update=":growl pmTab:pmrepairCompleteDialogForm:entryType pmTab:pmrepairCompleteDialogForm:workHourDetail pmTab:pmrepairCompleteDialogForm:entryTypeFlag"  listener="#{v2PmOrderController.updateEntryType(v2PmOrderController.selectedPmOrder.entryType)}" />
                                <c:if test="#{v2PmOrderController.selectedPmOrder.entryType==1 || v2PmOrderController.selectedPmOrder.entryType==0}">
                                <f:selectItem itemLabel="#{msg.addManHoursSection}" itemValue="1"/>
                                <f:selectItem itemLabel="#{msg.enterTotalManHours}" itemValue="0"/>
                                </c:if>

                                <c:if test="#{v2PmOrderController.selectedPmOrder.entryType==3}">
                                    <f:selectItem itemLabel="#{msg.addManHoursSection}" itemValue="3"/>
                                </c:if>
                                <c:if test="#{v2PmOrderController.selectedPmOrder.entryType==2}">
                                    <f:selectItem itemLabel="#{msg.enterTotalManHours}" itemValue="2"/>
                                </c:if>
                            </p:selectOneRadio>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{v2PmOrderController.selectedPmOrder.entryType==0 || v2PmOrderController.selectedPmOrder.entryType==2  ||  v2PmOrderController.selectedPmOrder.entryType==null}">
                            <label class="label">#{msg.Manhours}*</label>
                            <p:inputNumber id="manHoursId" validatorMessage="#{msg.ManhoursCannotL1}" value="#{v2PmOrderController.selectedPmOrder.manHours}"  required="true" requiredMessage="#{msg.Manhours} #{msg.ValidationRequire}">
                                <p:ajax />
                            </p:inputNumber>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{v2PmOrderController.selectedPmOrder.entryType==1 || v2PmOrderController.selectedPmOrder.entryType==3      }">
                            <label class="label">#{msg.Manhours}*</label>
                            <p:inputNumber id="manHours_input2" readonly="true" maxValue="999" value="#{v2PmOrderController.selectedPmOrder.manHours}"  required="false" requiredMessage="#{msg.manhours} #{msg.ValidationRequire}">
                                <p:ajax />
                            </p:inputNumber>
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:panelGrid id="workHourDetail" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup  rendered="#{v2PmOrderController.selectedPmOrder.entryType==1 || v2PmOrderController.selectedPmOrder.entryType==3  }">
                            <label class="label">#{msg.addManHoursSection}</label>
                            <p:dataTable id="pmHourDetailList" class="pmHourDetailList" value="#{v2PmOrderController.pmHoursList}" var="item" widgetVar="pmHourDetailList"
                                         lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.startTime}">
                                    <h:outputText value="#{item.startTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.endTime}">
                                    <h:outputText value="#{item.endTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.manHours}">
                                    <h:outputText value="#{item.hours}"/>
                                </p:column>
                                <p:column headerText="#{msg.Remark}">
                                    <h:outputText value="#{item.remark}"/>
                                </p:column>
                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{v2PmOrderController.prepareEditPmOrderManHoursDetail('new')}" update="@(.manHoursDetailDlg)" oncomplete="PF('manHoursDetailDlg').show()" rendered="#{item.id eq '000'}"/>
                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{v2PmOrderController.prepareEditPmOrderManHoursDetail(item.id)}" update="@(.manHoursDetailDlg)" oncomplete="PF('manHoursDetailDlg').show()" rendered="#{item.id ne '000'}" />
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{v2PmOrderController.deletePmOrderManHoursDetail(item.id)}" update="@(.pmHourDetailList) pmTab:pmrepairCompleteDialogForm:manHoursId pmTab:pmrepairCompleteDialogForm:manHours_input2" rendered="#{item.id ne '000'}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.AddParts}</label>
                            <p:dataTable id="accessList" class="uiTransparent accessCls" value="#{v2PmOrderController.accessoryList}" var="item" widgetVar="varAccessListList2" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.PartName}">
                                    <h:outputText value="#{item.parts}"/>
                                </p:column>
                                <p:column headerText="#{msg.PartsItemCode}" rendered="#{userContextService.countyArea}">
                                    <h:outputText value="#{v2PmOrderController.getPartsItemCode(item)}"/>
                                </p:column>
                                <p:column headerText="#{msg.accessoryQuantity}">
                                    <h:outputText value="#{item.apartsQuantity}"/>
                                </p:column>
                                <p:column headerText="#{msg.EstimatedUnitPriceRMB}">
                                    <h:outputText disabled="#{v2PmOrderController.nochange}" value="#{item.partsPrice}">
                                        <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.ContractPriceRMB}">
                                    <h:outputText value="#{v2PmOrderController.getClosePrice(item.apartsQuantity,item.partsPrice)}">
                                        <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.PartType}">
                                    <h:outputText value="#{fieldMsg.fieldValue('partsType', item.partsType)}" />
                                </p:column>
                                <p:column headerText="#{msg.SerialNumber}">
                                    <h:outputText value="#{item.serialNum}" />
                                </p:column>
                                <p:column headerText="#{msg.WarrantyDate}">
                                    <h:outputText value="#{item.warrantyDate}">
                                        <f:convertDateTime pattern="yyyy-MM-dd"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.ApplyTime}">
                                    <h:outputText value="#{item.applyTime}">
                                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.EstimatedArrivalTime}">
                                    <h:outputText value="#{item.estimatedArriveTime}">
                                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.ArrivalConfirmationTime}">
                                    <h:outputText value="#{item.arrivedTime}">
                                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.Arrival}">
                                    <h:outputText value="#{item.arrived?msg.Arrived:msg.NonArrived}" rendered="#{item.id ne '000'}" class="arrivalItem"/>
                                </p:column>

                                <p:column headerText="#{msg.InvoiceNumber}">
                                    <h:outputText value="#{item.invoiceNum}" />
                                </p:column>
                                <p:column headerText="#{msg.PartsDescription}" rendered="#{userContextService.countyArea}">
                                    <h:outputText value="#{item.partsDescription}" />
                                </p:column>
                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" actionListener="#{v2PmOrderController.prepareEditAccDetail('new')}"  oncomplete="PF('pmmoreAccDialogDlg').show()" update="@(.pmmoreAccDialogDlgCls)" rendered="#{item.id eq '000'}" />

                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{v2PmOrderController.prepareEditAccDetail(item.id)}" update="@(.pmmoreAccDialogFormCls)" oncomplete="PF('pmmoreAccDialogDlg').show()"  rendered="#{item.id ne '000' and (item.approved?false:true)}"/>
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" update="accessList @(.cmd1)" actionListener="#{v2PmOrderController.removeWoDetail(item.id,1)}"   rendered="#{item.id ne '000' and (item.approved?false:true)}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                    <h:outputText value="#{msg.Approved}" rendered="#{item.id ne '000' and (item.approved?true:false)}" />
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.coworkerManHoursEntryType}</label>
                            <p:selectOneRadio id="coworkerEntryType" required="true" value="#{v2PmOrderController.selectedPmOrder.coworkerEntryType}"  requiredMessage="#{msg.coworkerManHoursEntryType} #{msg.ValidationRequire}">
                                <p:ajax event="change" process="@this" update=":growl pmTab:pmrepairCompleteDialogForm:coworkerEntryType pmTab:pmrepairCompleteDialogForm:pmcoworkerList"  listener="#{v2PmOrderController.updateCoworkerEntryType(v2PmOrderController.selectedPmOrder.coworkerEntryType)}" />
                                <c:if test="#{v2PmOrderController.selectedPmOrder.coworkerEntryType==1 || v2PmOrderController.selectedPmOrder.coworkerEntryType==0}">
                                    <f:selectItem itemLabel="#{msg.addManHoursSection}" itemValue="1"/>
                                    <f:selectItem itemLabel="#{msg.enterTotalManHours}" itemValue="0"/>
                                </c:if>

                                <c:if test="#{v2PmOrderController.selectedPmOrder.coworkerEntryType==3}">
                                    <f:selectItem itemLabel="#{msg.addManHoursSection}" itemValue="3"/>
                                </c:if>
                                <c:if test="#{v2PmOrderController.selectedPmOrder.coworkerEntryType==2}">
                                    <f:selectItem itemLabel="#{msg.enterTotalManHours}" itemValue="2"/>
                                </c:if>
                            </p:selectOneRadio>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">#{msg.AddCoworker}</label>
                            <p:dataTable id="pmcoworkerList" class="uiTransparent" value="#{v2PmOrderController.coWorkerList}" var="item" widgetVar="pmcoworkerDataList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.coworker}">
                                    <h:outputText value="#{item.cowokerUserName}"/>
                                </p:column>
                                <p:column headerText="#{msg.startTime}" rendered="#{v2PmOrderController.selectedPmOrder.coworkerEntryType==1 || v2PmOrderController.selectedPmOrder.coworkerEntryType==3}">
                                    <h:outputText value="#{item.startTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.endTime}" rendered="#{v2PmOrderController.selectedPmOrder.coworkerEntryType==1 || v2PmOrderController.selectedPmOrder.coworkerEntryType==3}">
                                    <h:outputText value="#{item.endTime}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm" />
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="#{msg.manHours}">
                                    <h:outputText value="#{item.manHours}" />
                                </p:column>
                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}"  actionListener="#{v2PmOrderController.prepareEditCoWorkerDetail('new')}" update="@(.pmcoworkerDlgClass) pmTab:pmcoworkerDlgForm" oncomplete="PF('pmcoworkerDlg').show()" rendered="#{item.id eq '000'}"/>
                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{v2PmOrderController.prepareEditCoWorkerDetail(item.id)}" update="@(.pmcoworkerDlgClass)"  oncomplete="PF('pmcoworkerDlg').show()" rendered="#{item.id ne '000'}" />
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{v2PmOrderController.removeWoDetail(item.id,2)}" update="@(.pmcoworkerList) pmTab:pmrepairCompleteDialogForm:pmcoworkerList" rendered="#{item.id ne '000'}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{systemConfigItemController.getFieldColumn(v2PmOrderController.currentUserOrgInfo, 'pmOrderShowTravelTime').rendered}">
                            <label class="label">#{msg.travelTime}#{systemConfigItemController.getFieldColumn(v2PmOrderController.currentUserOrgInfo, 'pmOrderShowTravelTime').required ? '*' : ''}</label>
                            <p:inputNumber id="travel_time"  minValue="0" maxValue="999"  decimalPlaces="2" value="#{v2PmOrderController.selectedPmOrder.travelTime}"
                                           required="#{systemConfigItemController.getFieldColumn(v2PmOrderController.currentUserOrgInfo, 'pmOrderShowTravelTime').required}"
                                           requiredMessage="#{systemConfigItemController.getFieldColumn(v2PmOrderController.currentUserOrgInfo, 'pmOrderShowTravelTime').requiredMessage}">
                                <p:ajax />
                            </p:inputNumber>
                        </h:panelGroup>

                    </p:panelGrid>
                    <p:dataGrid id="pictureList" var="fileitem" value="#{v2PmOrderController.picList}" columns="5" layout="grid" emptyMessage="#{msg.noRecordFound}">
                        <f:facet name="header">#{msg.AttachmentUpload}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%" >

                                <h:panelGroup rendered="#{v2PmOrderController.verifyFileSuffixName(fileitem.objectType,'image')}">
                                    <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>
                                </h:panelGroup>
                                <p:commandLink    value="#{fileitem.objectName}"   actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}"    ajax="false"  styleClass="p-mr-2"/>

                                <p:commandButton actionListener="#{v2PmOrderController.removeAttachmentById(fileitem.id)}" update="pictureList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <p:panelGrid>

                        <p:commandButton validateClient="true"  value="#{msg.Add}"  icon="ui-icon-check"  update="addImag" oncomplete="PF('addImag').show()"/>
                        <p:dialog id="addImag" widgetVar="addImag" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.AddAttachment}" height="500" width="700">
                            <h:form id="auditConfigItemEditForm">
                                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup>
                                        <label class="label">#{msg.AttachmentType}</label>
                                        <p:selectOneMenu value="#{v2PmOrderController.fileTypeName}" required="true"  style="width: 95%;">
                                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                            <f:selectItems value="#{v2PmOrderController.typeList}" var="item" itemLabel="#{item}" itemValue="#{item}"/>
                                            <p:ajax  update="@this type1" />
                                        </p:selectOneMenu>
                                    </h:panelGroup>
                                    <h:panelGroup id="showPanel">
                                        <h:panelGroup>
                                            <p:fileUpload id="type1" allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/" fileUploadListener="#{v2PmOrderController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false"  sizeLimit="10000000"  update="pmTab:pmrepairCompleteDialogForm:pictureList"     disabled="#{v2PmOrderController.fileTypeName == null}"         auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"  oncomplete="PF('addImag').hide()"/>
                                        </h:panelGroup>
                                    </h:panelGroup>
                                </p:panelGrid>
                                <br/>
                            </h:form>
                        </p:dialog>


                    </p:panelGrid>
                </p:fieldset>

                <p:fieldset legend="#{msg.MaintenancePhotos}" >
                    <p:dataGrid id="pictureBeforeList" var="fileitem" value="#{v2PmOrderController.picBeforeList}" columns="5" layout="grid" emptyMessage="#{msg.noRecordFound}">
                        <f:facet name="header">#{msg.BeforeMaintenancePhotos}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%" >
                                <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>
                                <p:commandButton actionListener="#{v2PmOrderController.removeAttachmentByIdandType(fileitem.id, 'before')}" update="pictureBeforeList pmTab:pmrepairCompleteDialogForm:beforePic" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <p:fileUpload id="beforePic" disabled="#{v2PmOrderController.disableUploadButton('before')}" allowTypes="/(\.|\/)(jpeg|jpg|png|JPEG|JPG|PNG)$/" fileUploadListener="#{v2PmOrderController.handleFileUploadBefore}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false"  sizeLimit="10000000"  update="@this pictureBeforeList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>
                    <p:dataGrid id="pictureAfterList" var="fileitem" value="#{v2PmOrderController.picAfterList}" columns="5" layout="grid" emptyMessage="#{msg.noRecordFound}">
                        <f:facet name="header">#{msg.AfterMaintenancePhotos}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%" >
                                <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>
                                <p:commandButton actionListener="#{v2PmOrderController.removeAttachmentByIdandType(fileitem.id, 'after')}" update="pictureAfterList pmTab:pmrepairCompleteDialogForm:afterPic" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <p:fileUpload id="afterPic" disabled="#{v2PmOrderController.disableUploadButton('after')}" allowTypes="/(\.|\/)(jpeg|jpg|png|JPEG|JPG|PNG)$/" fileUploadListener="#{v2PmOrderController.handleFileUploadAfter}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false"  sizeLimit="10000000"  update="@this pictureAfterList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>
                </p:fieldset>

                <p:growl id="msgs" showDetail="true" />
                <p:fieldset legend="#{msg.MaintenanceList}"  toggleable="true" toggleSpeed="500">
                    <p:ajax event="toggle" listener="#{v2PmOrderController.handleToggle}" update="msgs" />
                    <p:fieldset legend="#{msg.MaintenanceReport}" >
                        <h:panelGroup id="addReport">
                            <p:selectOneMenu value="#{v2PmOrderController.reportUid}">
                                <p:ajax update="addReport" />
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{v2PmOrderController.getTablesName(v2PmOrderController.selectedPmOrder)}" var="item" itemLabel="#{item.name}" itemValue="#{item.baseId}"/>
                            </p:selectOneMenu>
                            <p:commandLink value="#{msg.AddReport}"  class="addLink" validateClient="false" process="addReport" actionListener="#{v2PmOrderController.addReporter(v2PmOrderController.selectedPmOrder.id)}"  update="@(.rpClass) @(.addLink)" disabled="#{empty v2PmOrderController.reportUid or v2PmOrderController.hasRepairReport() }"/>
                        </h:panelGroup>
                        <p:dataList class="rpClass" id="reportDatalist" value="#{v2PmOrderController.findByBoUuidNoPMCheckList(v2PmOrderController.selectedPmOrder.id)}" var="reportItem" emptyMessage="#{msg.noRecordFound}">
                            #{v2PmOrderController.getTableDefName(reportItem.schemaId)}
                            <h:outputText id="installDate" value="#{reportItem.createdDate}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                            </h:outputText>

                            <h:outputLabel> | </h:outputLabel>
                            <p:link value="#{msg.Edit}" target="_blank" href="#{request.contextPath}#{commonReportController.getEditLinkUrl(reportItem)}" disabled="#{reportItem.status eq 'Archived'}"/>
                            <h:outputLabel> | </h:outputLabel>
                            <p:link value="#{msg.View}" target="_blank" href="#{commonReportController.getViewLinkUrl(reportItem)}" />
                            <h:outputLabel> | </h:outputLabel>
                            <p:commandLink value="#{msg.Delete}" validateClient="false" process="@this" actionListener="#{v2PmOrderController.deleteReporter(reportItem.id)}" update="@(.rpClass) @(.addLink)" disabled="#{reportItem.status eq 'Archived'}"/>
                        </p:dataList>
                    </p:fieldset>
                    <p:fieldset  legend="#{msg.CheckItem}"  rendered="#{not empty v2PmOrderController.selectedPmOrder}">
                        <c:forEach  items="#{v2PmOrderController.pmCheckItemList}" var="item">
                            <h:panelGroup>
                                <label class="label" style="word-wrap: break-word">#{item.name}</label>
                            </h:panelGroup>
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <p:selectOneMenu value="#{item.value}">
                                        <p:ajax listener="#{v2PmOrderController.hmCheckSet(item.key)}"></p:ajax>
                                        <f:selectItem itemValue="#{'pass'}" itemLabel="#{fieldMsg.fieldValue('checkItem','pass')}"></f:selectItem>
                                        <f:selectItem itemValue="#{'n/a'}" itemLabel="#{fieldMsg.fieldValue('checkItem','n/a')}"></f:selectItem>
                                        <f:selectItem itemValue="#{'fail'}" itemLabel="#{fieldMsg.fieldValue('checkItem','fail')}"></f:selectItem>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup>

                                    <p:inputTextarea rows="3" style="width:100%;height:100px" readonly="true" value="#{item.remark}"></p:inputTextarea><br/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </c:forEach>
                    </p:fieldset>
                </p:fieldset>
                <p:selectOneRadio id="console"  value="#{v2PmOrderController.qaStatus}" >
                    <p:ajax process="console"  update="@(.rpb) @(.rpt) @(.x3) @(.buttonG)"></p:ajax>
                    <f:selectItems value="#{fieldMsg.getFieldValueList('qualityChecking')}"  var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"></f:selectItems>
                </p:selectOneRadio>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup rendered="#{!pmOrderGlobalController.isAutoAck(v2PmOrderController.selectedPmOrder)}">
                        <label class="label">#{msg.Acknowledger}*</label>
                        <p:selectOneMenu filter="true" filterMatchMode="contains" filterNormalize="true" value="#{v2PmOrderController.currentPersonIdBatch}" required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}">
                            <f:selectItems value="#{pmOrderGlobalController.getAckerList(v2PmOrderController.selectedPmOrder.id)}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.pmComment}</label>
                        <p:inputTextarea rows="3" style="width:60%;height:100px" value="#{v2PmOrderController.selectedPmOrder.comments}"></p:inputTextarea><br/>
                    </h:panelGroup>
                </p:panelGrid>

                <h:panelGroup class="buttonG">
                    <p:commandButton class="rpb" validateClient="true" disabled="#{v2PmOrderController.qaStatus eq '2'}" actionListener="#{v2PmOrderController.repairPmOrder()}" value="#{msg.MaintenanceComplete}" update="pmTab:pmOrderListForm:datalist :growl" icon="ui-icon-check" oncomplete="handleRepairComplete(xhr, status, args)"/>
                    <p:commandButton class="rpt" disabled="#{v2PmOrderController.qaStatus eq '1'}" actionListener="#{v2PmOrderController.createServiceRequest(v2PmOrderController.selectedPmOrder,1)}" value="#{msg.ToRepair}" update="pmTab:ServiceRequestCreateForm pmTab:pmOrderListForm pmTab:pmOrderDetailForm :growl" icon="ui-icon-check" oncomplete="handleToRepair(xhr, status, args)"/>

                    <p:commandButton validateClient="false"  actionListener="#{v2PmOrderController.stagingPmOrder()}" value="#{msg.TemporaryStorage}"  icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmrepairCompleteDialog');"/>
                    <c:if test="${not v2PmOrderController.hasConfigMultiLevelApproval}">
                        <p:commandButton id="cmd1" class="cmd1" validateClient="false" disabled="#{v2PmOrderController.selectedPmOrder.approvalStatus==1 or v2PmOrderController.accessoryListEmpty()}" immediate="true"  value= "#{msg.SubmitForApproval}" icon="ui-icon-check" update=":growl @(.approveDialogClass)" oncomplete="PF('approveDialog').show()"/>
                    </c:if>
                    <c:if test="${v2PmOrderController.hasConfigMultiLevelApproval}">
                        <p:commandButton id="cmd1" validateClient="true" immediate="false"  disabled="#{v2PmOrderController.selectedPmOrder.approvalStatus==5 or v2PmOrderController.approveFlag()}" actionListener="#{v2PmOrderController.submitForApproval()}"  update=":growl pmTab:pmOrderListForm:datalist"  value="#{msg.SubmitForApproval}" icon="ui-icon-check" oncomplete="PF('pmrepairCompleteDialog').hide()"/>
                    </c:if>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{v2PmOrderController.cancel()}" icon="ui-icon-cancel" onclick="PF('pmrepairCompleteDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

    <p:dialog class ="approveDialogClass" id="approveDialog" widgetVar="approveDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.SelectApprover}">
        <h:form id="approveDialogForm" >
            <h:panelGroup id="display2" rendered="#{v2PmOrderController.selectedPmOrder !=null}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.approveUserId}*</label>
                        <p:autoComplete id="approver" value="#{v2PmOrderController.approvaler}" dropdown="true" scrollHeight="300"
                                        forceSelection="true" required="true" requiredMessage="#{msg.approveUserId}#{msg.ValidationRequire}"
                                        completeMethod="#{v2PmOrderController.getApproveList}"
                                        var="t" itemLabel="#{t.name}" itemValue="#{t.uid}">
                            <p:ajax process="@this" event="itemSelect" listener="#{v2PmOrderController.setNothing()}"/>
                            <p:ajax process="@this" listener="#{v2PmOrderController.setNothing()}"/>
                        </p:autoComplete>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.ReasonForApprovalRequest}</label>
                        <p:inputTextarea  placeholder="#{msg.QuotationApproval}" value="#{v2PmOrderController.comments}" maxlength="256" />
                    </h:panelGroup>

                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.submitAppvalPmOrder}" value="#{msg.Confirm}"  icon="ui-icon-check" update=":growl pmTab:pmOrderListForm:datalist" oncomplete="PF('pmrepairCompleteDialog').hide();handleSubmit(args, 'approveDialog');"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('approveDialog').hide()"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>

        <script>
            function handleToRepair(xhr, status, args) {
                if(args.needManhours){
                    $('#pmTab\\:pmrepairCompleteDialogForm\\:manHoursId').addClass("ui-state-error");
                }
                else if(args.needendtime){
                    $('#pmTab\\:pmrepairCompleteDialogForm\\:fillDate1').addClass("ui-state-error");
                }else{
                    handleSubmit(args, 'pmrepairCompleteDialog');
                    PF('createSRDialog').show()
                }
            }
            function handleRepairComplete(xhr, status, args) {
                if(args.reports){
                    $('#pmTab\\:pmrepairCompleteDialogForm\\:reportDatalist').addClass("ui-state-error");
                }else if(args.needManhours){
                    $('#pmTab\\:pmrepairCompleteDialogForm\\:manHoursId').addClass("ui-state-error");
                }else if(args.needendtime){
                    $('#pmTab\\:pmrepairCompleteDialogForm\\:fillDate1').addClass("ui-state-error");
                }
                else if(args.needplanTime){
                    $('#pmTab\\:pmrepairCompleteDialogForm\\:fillDate').addClass("ui-state-error");
                }else{
                    handleSubmit(args, 'pmrepairCompleteDialog');
                }
            }
        </script>

        <style type="text/css">
            /* body{
                 color:red;
             }*/
            body .ui-fieldset .ui-fieldset-legend .ui-fieldset-toggler{
                color:black;
                box-shadow:none;
                background-color:white;
            }
            body .ui-fieldset .ui-fieldset-legend .ui-fieldset-toggler:hover{
                background-color:white;
            }
            /*body.layout-compact .ui-fieldset .ui-fieldset-legend{
                text-align: center;
                font-weight: 600;
            }*/
        </style>


    </p:dialog>

    <ui:include src="pmMoreAccDialog.xhtml"/>
    <ui:include src="pmCoWorkDialog.xhtml"/>
    <ui:include src="manHoursDetail.xhtml"/>

</ui:composition>
</html>
