<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
>

    <ui:composition>

        <p:dialog class ="pmrepairCompleteDialog" id="pmrepairCompleteDialog" widgetVar="pmrepairCompleteDialog" modal="true" height="550" width="1000"  resizable="true" draggable="true" appendTo="@this" header="保养完成">
            <h:form id="pmrepairCompleteDialogForm" class="pmrepairCompleteDialogFormcls" >
                <h:panelGroup  id="display5" style="height:500px" rendered="#{not empty v2PmOrderController.selectedPmOrder}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">计划完成时间*</label>
                            <p:calendar  timeZone="GMT+8" id="fillDate" pattern="yyyy/MM/dd"  value="#{v2PmOrderController.selectedPmOrder.planTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="计划完成时间#{msg.ValidationRequire}"></p:calendar>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">结束保养时间*</label>
                            <p:calendar timeZone="GMT+8" id="fillDate1" pattern="yyyy/MM/dd"  value="#{v2PmOrderController.endTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh"  requiredMessage="结束时间 #{msg.ValidationRequire}"></p:calendar>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:fieldset legend="#{msg.expensedetail}" ><!--费用明细-->
                        <p:panelGrid columns="2" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.manhours}*</label>
                                <p:inputNumber id="manHoursId" validatorMessage="工时不能小于0.01" value="#{v2PmOrderController.selectedPmOrder.manHours}"  required="true" requiredMessage="工时(小时) #{msg.ValidationRequire}">
                                </p:inputNumber>
                            </h:panelGroup>
                        </p:panelGrid>
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class="label">#{msg.addAcce}</label><!--增加备件-->
                                <p:dataTable id="accessList" class="uiTransparent" value="#{v2PmOrderController.accessoryList}" var="item" widgetVar="varAccessListList2" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.accessory}">
                                        <h:outputText value="#{item.parts}"/>
                                    </p:column>

                                    <p:column headerText="#{msg.accessoryQuantity}">
                                        <h:outputText value="#{item.apartsQuantity}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.accessoryPrice}">
                                        <h:outputText value="#{item.partsPrice}">
                                            <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="类型">
                                        <h:outputText value="#{fieldMsg.fieldValue('partsType', item.partsType)}" />
                                    </p:column>
                                    <p:column headerText="序列号">
                                        <h:outputText value="#{item.serialNum}" />
                                    </p:column>
                                    <p:column headerText="质保期">
                                        <h:outputText value="#{item.warrantyDate}">
                                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="申请时间">
                                        <h:outputText value="#{item.applyTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="预计到达时间">
                                        <h:outputText value="#{item.estimatedArriveTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="到货确认时间">
                                        <h:outputText value="#{item.arrivedTime}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="到货">
                                        <h:outputText value="#{item.arrived?'已到货':'未到货'}" rendered="#{item.id ne '000'}" class="arrivalItem"/>
                                    </p:column>

                                    <p:column headerText="发票号">
                                        <h:outputText value="#{item.invoiceNum}" />
                                    </p:column>

                                    <p:column headerText="#{msg.Actions}">
                                        <p:commandButton process="@this" icon="ui-icon-add" actionListener="#{v2PmOrderController.prepareEditAccDetail('new')}"  oncomplete="PF('pmmoreAccDialogDlg').show()" update="@(.pmmoreAccDialogDlgCls)" rendered="#{item.id eq '000'}" />

                                        <!--<p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{v2PmOrderController.prepareEditAccDetail(item.id)}" update="@(.pmmoreAccDialogFormCls)" oncomplete="PF('pmmoreAccDialogDlg').show()"  rendered="#{item.id ne '000' and (item.approved? false:true)}"/>-->
                                        <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{v2PmOrderController.prepareEditAccDetail(item.id)}" update="@(.pmmoreAccDialogFormCls)" oncomplete="PF('pmmoreAccDialogDlg').show()"  rendered="#{item.id ne '000'}"/>
                                         <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" update="accessList @(.cmd1)" actionListener="#{v2PmOrderController.removeWoDetail(item.id,1)}"   rendered="#{item.id ne '000' and (item.approved?false:true)}">
                                             <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                         </p:commandButton>
                                        <h:outputText value="已审核" rendered="#{item.id ne '000' and (item.approved?true:false)}" />
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">增加协作人</label>
                                <p:dataTable id="pmcoworkerList" class="uiTransparent" value="#{v2PmOrderController.coWorkerList}" var="item" widgetVar="pmcoworkerDataList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                    <p:column headerText="#{msg.coworker}">
                                        <h:outputText value="#{item.cowokerUserName}"/>
                                    </p:column>
                                    <p:column headerText="#{msg.manHours}">
                                        <h:outputText value="#{item.manHours}" />
                                    </p:column>
                                    <p:column headerText="#{msg.Actions}">
                                        <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}"  actionListener="#{v2PmOrderController.prepareEditCoWorkerDetail('new')}" update="@(.pmcoworkerDlgClass) pmTab:pmcoworkerDlgForm" oncomplete="PF('pmcoworkerDlg').show()" rendered="#{item.id eq '000'}"/>
                                        <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{v2PmOrderController.prepareEditCoWorkerDetail(item.id)}" update="@(.pmcoworkerDlgClass)"  oncomplete="PF('pmcoworkerDlg').show()" rendered="#{item.id ne '000'}" />
                                        <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{v2PmOrderController.removeWoDetail(item.id,2)}" update="@(.pmcoworkerList) pmTab:pmrepairCompleteDialogForm:pmcoworkerList" rendered="#{item.id ne '000'}">
                                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>
                            </h:panelGroup>

                        </p:panelGrid>
                        <p:dataGrid id="pictureList" var="fileitem" value="#{v2PmOrderController.picList}" columns="5" layout="grid">
                            <f:facet name="header">附件上传</f:facet>
                            <p:panel  style="text-align:center">
                                <h:panelGrid columns="1" style="width:100%" >
                                    <p:graphicImage url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/>
                                    <p:commandButton actionListener="#{v2PmOrderController.removeAttachmentById(fileitem.id)}" update="pictureList" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                    </p:commandButton>
                                </h:panelGrid>
                            </p:panel>
                        </p:dataGrid>
                        <p:fileUpload id="type1" fileUploadListener="#{v2PmOrderController.handleFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false"  sizeLimit="10000000"  update="pictureList" auto="true" invalidFileMessage="#{msg.InvalidPictureFileType}" invalidSizeMessage="#{msg.invalidSizeMessage}10M" label="#{msg.Add}"/>
                    </p:fieldset>

                    <p:growl id="msgs" showDetail="true" />
                    <p:fieldset legend="保养清单"  toggleable="true" toggleSpeed="500">
                        <p:ajax event="toggle" listener="#{v2PmOrderController.handleToggle}" update="msgs" />
                        <p:fieldset legend="保养报告" >
                            <h:panelGroup id="addReport">
                                <p:selectOneMenu value="#{v2PmOrderController.reportUid}">
                                    <p:ajax update="addReport" />
                                    <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                    <f:selectItems value="#{v2PmOrderController.getTablesName(v2PmOrderController.selectedPmOrder)}" var="item" itemLabel="#{item.name}" itemValue="#{item.baseId}"/>
                                </p:selectOneMenu>
                                <p:commandLink value="添加报告"  class="addLink" validateClient="false" process="addReport" actionListener="#{v2PmOrderController.addReporter(v2PmOrderController.selectedPmOrder.id)}"  update="@(.rpClass) @(.addLink)" disabled="#{empty v2PmOrderController.reportUid or v2PmOrderController.hasRepairReport() }"/>
                            </h:panelGroup>
                            <p:dataList class="rpClass"  value="#{v2PmOrderController.findByBoUuidNoPMCheckList(v2PmOrderController.selectedPmOrder.id)}" var="reportItem" emptyMessage="#{msg.noRecordFound}">
                                #{v2PmOrderController.getTableDefName(reportItem.schemaId)}
                                <h:outputText id="installDate" value="#{reportItem.createdDate}" >
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </h:outputText>
                                <p:link value="编辑" target="_blank" href="#{commonReportController.getEditLinkUrl(reportItem)}" disabled="#{reportItem.status eq 'Archived'}"/>
                                <h:outputLabel> | </h:outputLabel>
                                <p:link value="查看" target="_blank" href="#{commonReportController.getViewLinkUrl(reportItem)}" />
                                <h:outputLabel> | </h:outputLabel>
                                <p:commandLink value="删除" validateClient="false" process="@this" actionListener="#{commonReportController.deleteReporter(reportItem.id)}" update="@(.rpClass) @(.addLink)" disabled="#{reportItem.status eq 'Archived'}"/>
                            </p:dataList>
                        </p:fieldset>
                        <p:fieldset  legend="检查项"  rendered="#{not empty v2PmOrderController.selectedPmOrder}">
                            <c:forEach  items="#{v2PmOrderController.pmCheckItemList}" var="item">
                                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup>
                                        <label class="label" style="word-wrap: break-word">#{item.name}</label>
                                        <p:selectOneMenu  value="#{v2PmOrderController.hmCheck[item.uid].value}">
                                            <p:ajax listener="#{v2PmOrderController.hmCheckSet(item.uid)}"></p:ajax>
                                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                            <f:selectItem itemValue="#{'pass'}" itemLabel="#{fieldMsg.fieldValue('checkItem','pass')}"></f:selectItem>
                                            <f:selectItem itemValue="#{'n/a'}" itemLabel="#{fieldMsg.fieldValue('checkItem','n/a')}"></f:selectItem>
                                            <f:selectItem itemValue="#{'fail'}" itemLabel="#{fieldMsg.fieldValue('checkItem','fail')}"></f:selectItem>
                                        </p:selectOneMenu>
                                        <p:inputTextarea rows="3" style="width:100%;height:100px" readonly="true" value="#{item.remark}"></p:inputTextarea><br/>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </c:forEach>
                        </p:fieldset>
                    </p:fieldset>
                    <p:selectOneRadio id="console"  value="#{v2PmOrderController.qaStatus}" >
                        <p:ajax process="console"  update="@(.rpb) @(.rpt) @(.x3) @(.buttonG)"></p:ajax>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('qualityChecking')}"  var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"></f:selectItems>
                    </p:selectOneRadio>

                    <!--维修完成 转单 新建工单-->
                    <h:panelGroup class="buttonG">
                        <p:commandButton class="rpb" validateClient="true" disabled="#{v2PmOrderController.qaStatus eq '2'}" actionListener="#{v2PmOrderController.repairPmOrder()}" value="保养完成" update="pmTab:pmOrderListForm:datalist :growl" icon="ui-icon-check" oncomplete="handleRepairComplete(xhr, status, args)"/>
                        <p:commandButton class="rpt" disabled="#{v2PmOrderController.qaStatus eq '0'}" actionListener="#{v2PmOrderController.createServiceRequest(v2PmOrderController.selectedPmOrder,1)}" value="去报修" update="pmTab:ServiceRequestCreateForm pmTab:pmOrderListForm pmTab:pmOrderDetailForm :growl" icon="ui-icon-check" oncomplete="handleToRepair(xhr, status, args)"/>

                        <p:commandButton validateClient="false"  actionListener="#{v2PmOrderController.stagingPmOrder()}" value="暂存"  icon="ui-icon-check" oncomplete="handleSubmit(args, 'pmrepairCompleteDialog');"/>
                        <p:commandButton id="cmd1" class="cmd1" validateClient="false" disabled="#{v2PmOrderController.selectedPmOrder.approvalStatus==1 or v2PmOrderController.accessoryListEmpty()}" immediate="true"  value= "提交审核" icon="ui-icon-check" update=":growl @(.approveDialogClass)" oncomplete="PF('approveDialog').show()"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{v2PmOrderController.cancel()}" icon="ui-icon-cancel" onclick="PF('pmrepairCompleteDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <p:dialog class ="approveDialogClass" id="approveDialog" widgetVar="approveDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="选择审核人">
            <h:form id="approveDialogForm" >
                <h:panelGroup id="display2" rendered="#{v2PmOrderController.selectedPmOrder !=null}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">审核人</label>
                            <p:selectOneMenu value="#{v2PmOrderController.approvaler}"  required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}">
                                <f:selectItems value="#{v2PmOrderController.getApproveList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">申请审核原因</label>
                            <p:inputTextarea value="#{v2PmOrderController.comments}" maxlength="256" />
                        </h:panelGroup>

                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.submitAppvalPmOrder}" value="确认" icon="ui-icon-check" update="pmTab:pmOrderListForm:datalist" oncomplete="PF('pmrepairCompleteDialog').hide();handleSubmit(args, 'approveDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('approveDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>

            <script>
                function handleToRepair(xhr, status, args) {
                    if(args.needManhours){
                        $('#pmTab\\:pmrepairCompleteDialogForm\\:manHoursId').addClass("ui-state-error");
                    }
                    else if(args.needendtime){
                        $('#pmTab\\:pmrepairCompleteDialogForm\\:fillDate1').addClass("ui-state-error");
                    }else{
                        handleSubmit(args, 'pmrepairCompleteDialog');
                        PF('createSRDialog').show()
                    }
                }
                function handleRepairComplete(xhr, status, args) {
                    if(args.needManhours){
                        $('#pmTab\\:pmrepairCompleteDialogForm\\:manHoursId').addClass("ui-state-error");
                    }else if(args.needendtime){
                        $('#pmTab\\:pmrepairCompleteDialogForm\\:fillDate1').addClass("ui-state-error");
                    }
                    else if(args.needplanTime){
                        $('#pmTab\\:pmrepairCompleteDialogForm\\:fillDate').addClass("ui-state-error");
                    }else{
                        handleSubmit(args, 'pmrepairCompleteDialog');
                    }
                }
            </script>

            <style type="text/css">
               /* body{
                    color:red;
                }*/
                body .ui-fieldset .ui-fieldset-legend .ui-fieldset-toggler{
                    color:black;
                    box-shadow:none;
                    background-color:white;
                }
                body .ui-fieldset .ui-fieldset-legend .ui-fieldset-toggler:hover{
                    background-color:white;
                }
               /*body.layout-compact .ui-fieldset .ui-fieldset-legend{
                   text-align: center;
                   font-weight: 600;
               }*/
            </style>


        </p:dialog>

        <!--PF('pmrepairCompleteDialog').hide()
        -->
        <ui:include src="pmMoreAccDialog.xhtml"/>
        <ui:include src="pmCoWorkDialog.xhtml"/>

    </ui:composition>
</html>
