<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>

    <p:dialog class="manHoursDetailDlg" id="manHoursDetailDlg" widgetVar="manHoursDetailDlg" modal="true" width="600" height="320"  resizable="true" draggable="true" appendTo="@(body)" header="添加工时">
        <h:form id="manHoursDetailDlgForm" >
            <h:panelGroup  rendered="#{not empty v2PmOrderController.selectedPmOrderManHoursDetail}">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">开始时间*</label>
                        <p:calendar  timeZone="GMT+8" id="startDate2" pattern="yyyy-MM-dd HH:mm"  value="#{v2PmOrderController.selectedPmOrderManHoursDetail.startTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="开始时间#{msg.ValidationRequire}">
                            <p:ajax update="endDate2"/>
                        </p:calendar>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">结束时间*</label>
                       <p:calendar  timeZone="GMT+8" id="endDate2" maxdate="#{v2PmOrderController.getMaxDate()}" pattern="yyyy-MM-dd HH:mm"  value="#{v2PmOrderController.selectedPmOrderManHoursDetail.endTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="结束时间#{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">备注</label>
                        <p:inputTextarea id="comment" value="#{v2PmOrderController.selectedPmOrderManHoursDetail.remark}" rows="2"  cols="40"  queryDelay="750" minQueryLength="4" maxlength="100"/>
                    </h:panelGroup>

                </p:panelGrid>
                <br/>

               <h:panelGroup>
                   <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.addManHoursDetail(v2PmOrderController.selectedPmOrderManHoursDetail.startTime,v2PmOrderController.selectedPmOrderManHoursDetail.endTime)}" process="manHoursDetailDlgForm" value="#{msg.Save}" icon="ui-icon-check"  update=":pmTab:pmrepairCompleteDialogForm:pmHourDetailList :pmTab:pmrepairCompleteDialogForm:manHoursId :pmTab:pmrepairCompleteDialogForm:manHours_input2 :growl"  oncomplete="handleSubmit(args, 'manHoursDetailDlg');"  />
                    <p:commandButton immediate="true" actionListener="#{v2PmOrderController.cancelWorkdetail}" value="#{msg.Cancel}" update=":pmTab:pmrepairCompleteDialogForm:manHoursId :pmTab:pmrepairCompleteDialogForm:manHours_input2 :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'manHoursDetailDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
