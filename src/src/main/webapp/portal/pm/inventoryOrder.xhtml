<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui" xmlns:tie="http://tiefaces.org/tiefaces" template="/WEB-INF/template.xhtml"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">


	<ui:define name="content">
		<div class="ui-g">
			<div class="ui-g-12 card cardTitle">
				<p:outputLabel class="pageTitle" value="inventory order list" />
			</div>
			<div class="ui-g-12 card ">
				<h:form id="form">
					<h:head>
						<tie:websheet id="sheet" webSheetBean="#{inventoryOrderController}" maxRowsPerPage="50" readOnly="true" showLineNumber="false">
						</tie:websheet>
					</h:head>
				</h:form>
			</div>
		</div>
	</ui:define>
</ui:composition>
