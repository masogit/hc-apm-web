<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:composition>
        <script type="text/javascript" src="#{request.contextPath}/portal/js/viewer.min.js"></script>
        <link rel="stylesheet" href="#{request.contextPath}/portal/css/viewer.min.css"/>
        <div class="ui-g-12 card" >

            <h:form id="pmMvsOrderDetailForm" class="pmOrderDetailFormCls">
                <p:fieldset legend="#{msg.MaintenanceWorkorder}" rendered="#{not empty v2PmOrderMvsController.selected}">
                    <div class="ui-g">
                        <div class="ui-g-10 ui-g-nopad">
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">#{msg.AssetName}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.selected.assetInfo.name}"></p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.EquipmentID}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.selected.assetInfo.departNum}"></p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.MeasurementGrade2}</label>
                                    <p:outputLabel value="#{fieldMsg.fieldValue('ruleLevelFour',v2PmOrderMvsController.selected.ruleLevel)}"></p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.MaintenanceType}</label>
                                    <p:outputLabel value="#{fieldMsg.fieldValue('pmType',v2PmOrderMvsController.selected.pmType)}"></p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{!userContextService.hasCurrentTenantName('') }">
                                    <label class="label">#{msg.clinicalDeptName}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.selected.assetInfo.clinicalDeptName}"></p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{userContextService.hasCurrentTenantName('') }">
                                    <label class="label">#{msg.clinicalDeptName}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.getOrgInfoByUid(v2PmOrderMvsController.selected.clinicalDeptId).name}"></p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.MaintenanceNumber}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.selected.pmNum}" ></p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.Creator}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.selected.creatorName}"></p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.CurrentProcessingStep}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.selected.currentStepName}"></p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.ManhoursHours}</label>
                                    <h:outputText value="#{v2PmOrderMvsController.selected.manHours}">
                                        <f:convertNumber pattern="0.00" minFractionDigits="2"></f:convertNumber>
                                    </h:outputText>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.PlannedCompletionTime}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.selected.planTime}">
                                        <f:convertDateTime pattern="yyyy-MM-dd"/>
                                    </p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.ActualCompletionTime}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.selected.endTime}">
                                        <f:convertDateTime pattern="yyyy-MM-dd"/>
                                    </p:outputLabel>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">#{msg.MaintenanceResult}</label>
                                    <p:outputLabel value="#{fieldMsg.fieldValue('qualityChecking',v2PmOrderMvsController.selected.qualityChecking)}"></p:outputLabel>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">#{msg.Cancelor}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.selected.cancelPerson}"></p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.CancellationReason}</label>
                                    <p:outputLabel value="#{v2PmOrderMvsController.selected.cancelReason}"></p:outputLabel>
                                </h:panelGroup>
                            </p:panelGrid>
                        </div>
                        <div class="ui-g-2">
                            <h:outputText value="验收人签名：" />
                            <div class="container-fluid" style="height: 200px; width: 200px;">
                                <p:graphicImage value="#{fileDownloadService.getFile(v2PmOrderMvsController.selected.ackSignature)}" stream="false" style="max-width: 100%;height: auto"/>
                            </div>
                        </div>
                    </div>
                    <p:dataGrid id="pictureMvsList" var="fileitem" value="#{v2PmOrderMvsController.picList}" columns="5" layout="grid" rendered="#{ empty v2PmOrderMvsController.attachListEhome}"  emptyMessage="#{msg.noRecordFound}">
                        <f:facet name="header">#{msg.AttachmentUpload}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%" >
                                <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>
                                <p:commandLink value="#{msg.DownloadFile}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
<!--                                <p:graphicImage   url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/>-->
<!--                                <p:link  href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" > #{msg.DownloadFile}-->
<!--                                </p:link>-->
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <!--E 家图片附件显示-->
                    <!--e家图片附件显示-->
                    <p:dataGrid var="woAttachItemE" value="#{v2PmOrderMvsController.attachListEhome}" columns="4" layout="grid" rendered="#{not empty v2PmOrderMvsController.attachListEhome}" emptyMessage="#{msg.noRecordFound}">
                        <f:facet name="header">#{msg.AttachmentUpload}</f:facet>
                        <!-- 非 IMG 类型的面板 -->
                        <p:panel style="text-align:center"
                                 rendered="#{woAttachItemE.boType != 'IMG'}">
                            <h:panelGrid columns="1" style="width:100%">
                                #{woAttachItemE.objectName}
                                <p:commandLink validateClient="false" immediate="true" process="@this"
                                               value="下载文件"
                                               action="#{fileDownloadService.downloadFileForEhome(woAttachItemE.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                            </h:panelGrid>
                        </p:panel>
                        <!-- IMG 类型的面板 -->
                        <p:panel style="text-align:center"
                                 rendered="#{woAttachItemE.boType == 'IMG'}">
                            <h:panelGrid columns="1" style="width:100%">
                                <p:ajax  event="click" update="#{v2PmOrderMvsController.pageType eq 'current' ? 'pmTab:previewedDlgEhome' : ':previewedDlgEhome'}" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(v2PmOrderMvsController,woAttachItemE.objectStorageId)}"/>
                                <p:graphicImage value="#{fileDownloadService.getFile(woAttachItemE.objectStorageId)}"
                                                height="80" width="100" stream="false"/>
                                <p:commandLink validateClient="false" immediate="true" process="@this"
                                               value="#{woAttachItemE.objectName}"
                                               action="#{fileDownloadService.downloadFileForEhome(woAttachItemE.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <!--E 家图片附件显示-->
                    <p:dataTable value="#{v2PmOrderMvsController.aquirePmOrderStep()}" var="stepItem">
                        <p:column headerText="#{msg.stepName}">
                            <h:outputText value="#{stepItem.stepName}" />
                        </p:column>
                        <p:column headerText="#{msg.ownerName}">
                            <h:outputText value="#{stepItem.ownerName}" />
                        </p:column>
                        <p:column headerText="#{msg.startTime}">
                            <h:outputText value="#{stepItem.startTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.endTime}">
                            <h:outputText value="#{stepItem.endTime}" >
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                        <h:panelGroup rendered="#{not empty v2PmOrderMvsController.getWorkOrderDetailON()}">
                        <label class="label">#{msg.UsedPart}</label><!--增加备件-->
                        <p:dataTable id="accessList" class="uiTransparent" value="#{v2PmOrderMvsController.getWorkOrderDetailON()}" var="detailItem" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{detailItem.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="#{msg.PartName}">
                                <h:outputText value="#{detailItem.parts}"/>
                            </p:column>

                            <p:column headerText="#{msg.accessoryQuantity}">
                                <h:outputText value="#{detailItem.apartsQuantity}"/>
                            </p:column>
                            <p:column headerText="#{msg.EstimatedUnitPriceRMB}">
                                <h:outputText value="#{detailItem.partsPrice}">
                                    <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.ContractPriceRMB}">
                                <h:outputText value="#{detailItem.closedPrice}">
                                    <f:convertNumber  maxFractionDigits="4" maxIntegerDigits="10"/>
                                </h:outputText>

                            </p:column>
                            <p:column headerText="#{msg.ApprovalStatus}">
                                <h:outputText value="#{empty detailItem.approved? msg.Unapproved: detailItem.approved? msg.Pass:msg.Fail}" />
                            </p:column>
                            <p:column headerText="#{msg.PartType}">
                                <h:outputText value="#{fieldMsg.fieldValue('partsType', detailItem.partsType)}" />
                            </p:column>
                            <p:column headerText="#{msg.InvoiceNumber}">
                                <h:outputText value="#{detailItem.invoiceNum}" />
                            </p:column>
                            <p:column headerText="#{msg.SerialNumber}">
                                <h:outputText value="#{detailItem.serialNum}" />
                            </p:column>
                            <p:column headerText="#{msg.WarrantyDate}">
                                <h:outputText value="#{detailItem.warrantyDate}">
                                    <f:convertDateTime pattern="yyyy-MM-dd"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.ApplyTime}">
                                <h:outputText value="#{detailItem.applyTime}">
                                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.EstimatedArrivalTime}">
                                <h:outputText value="#{detailItem.estimatedArriveTime}">
                                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.ArrivalConfirmationTime}">
                                <h:outputText value="#{detailItem.arrivedTime}">
                                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{msg.Arrival}">
                                <h:outputText value="#{detailItem.arrived?msg.Arrived:msg.NonArrived}" rendered="#{detailItem.id ne '000'}"/>
                            </p:column>
                        </p:dataTable>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{not empty v2PmOrderMvsController.getWorkOrderCoworkerON(null)}">
                        <label class="label">#{msg.CoworkerInformation}</label>
                        <p:dataTable id="pmcoworkerList" class="uiTransparent coworkcls" value="#{v2PmOrderMvsController.getWorkOrderCoworkerON(null)}"  var="item" widgetVar="pmcoworkerList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                            <p:column headerText="#{msg.coworker}">
                                <h:outputText value="#{item.cowokerUserName}"/>
                            </p:column>
                            <p:column headerText="#{msg.manHours}">
                                <h:outputText value="#{item.manHours}"/>
                            </p:column>
                        </p:dataTable>
                    </h:panelGroup>


                    <p:dataGrid id="partMvsPictureList" var="fileitem" value="#{v2PmOrderMvsController.getPartPictures(v2PmOrderMvsController.selected.id)}" columns="5" layout="grid" emptyMessage="#{msg.noRecordFound}">
                        <f:facet name="header">#{msg.AttachmentUpload}</f:facet>
                        <p:panel  style="text-align:center">
                            <h:panelGrid columns="1" style="width:100%" >
                                <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectStorageId)}" height="80" width="100" stream="false"/>
                                <p:commandLink value="#{msg.DownloadFile}" ajax="false" actionListener="#{fileDownloadService.downloadFile(fileitem.objectStorageId)}" styleClass="p-mr-2"/>
<!--                                <p:graphicImage   url="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" height="80"  width="100"/>-->
<!--                                <p:link  href="#{fileDownloadService.getFileUrl(fileitem.objectStorageId)}" > #{msg.DownloadFile}-->
<!--                                </p:link>-->
                            </h:panelGrid>
                        </p:panel>
                    </p:dataGrid>
                    <p:growl id="msgsMvs" showDetail="true" />
                    <p:fieldset legend="#{msg.MaintenanceList}">
                        <p:fieldset legend="#{msg.MaintenanceReport}">
                            <p:dataList class="rpClass"  value="#{v2PmOrderMvsController.reportList}" var="reportItem" emptyMessage="#{msg.noRecordFound}">
                                #{v2PmOrderMvsController.getTableDefName(reportItem.schemaId)}
                                <h:outputText id="installDate" value="#{reportItem.createdDate}" >
                                    <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd " />
                                </h:outputText>
                                <p:link value="#{msg.View}" target="_blank" href="#{commonReportController.getViewLinkUrl(reportItem)}" />
                            </p:dataList>

                        </p:fieldset>
                        <p:fieldset legend="#{msg.CheckItem}" id="chkItem"   rendered="#{not empty v2PmOrderMvsController.selected}">
                            <c:forEach  items="#{v2PmOrderMvsController.pmCheckItemList}" var="item">
                                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup>
                                        <label class="label" style="word-wrap: break-word">#{item.name}</label>
                                        <p:selectOneMenu disabled="true" value="#{item.value}">
                                            <p:ajax listener="#{v2PmOrderMvsController.hmCheckSet(item.key)}"></p:ajax>
                                            <f:selectItem itemValue="#{'pass'}" itemLabel="#{fieldMsg.fieldValue('checkItem','pass')}"></f:selectItem>
                                            <f:selectItem itemValue="#{'n/a'}" itemLabel="#{fieldMsg.fieldValue('checkItem','n/a')}"></f:selectItem>
                                            <f:selectItem itemValue="#{'fail'}" itemLabel="#{fieldMsg.fieldValue('checkItem','fail')}"></f:selectItem>
                                        </p:selectOneMenu>
                                        <p:inputTextarea rows="3" style="width:100%;height:100px" readonly="true" value="#{item.remark}"></p:inputTextarea><br/>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </c:forEach>
                        </p:fieldset>
                    </p:fieldset>

                    <h:panelGroup >
                        <label class="label">#{msg.MaintenanceWorkorderMessage}</label>
                        <p:dataList value="#{v2PmOrderMvsController.getServiceRequestMessageList(v2PmOrderMvsController.selected.id)}" var="msgItem" rendered="#{not empty v2PmOrderMvsController.getServiceRequestMessageList(v2PmOrderMvsController.selected.id)}">
                            <h:outputText value="#{msgItem.sendTime}" >
                                <f:convertDateTime pattern="MM/dd HH:mm:ss"/>
                            </h:outputText>
                            <h:outputText value="#{msgItem.senderUserName}"  style="padding-left: 10px"/>
                            <h:outputText value="#{msgItem.message}"  style="padding-left: 10px"/>
                        </p:dataList>
                    </h:panelGroup>

                </p:fieldset>
            </h:form>
        </div>
    </ui:composition>
</html>
