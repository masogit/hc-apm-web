<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="pmMvsListForm">
            <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                <p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet pmTab:pmMvsOrderDetailForm pmTab:idMvsPanelFilterPlannedCompletionTime pmTab:idMvsPanelFilterActualCompletionTime" action="#{v2PmOrderMvsController.updateQueryIndex(10)}" disabled="#{v2PmOrderMvsController.queryIndex==10}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}"/>
                <p:commandButton value="#{msg.Planned}"  process="@this" update="datalist buttonSet pmTab:pmMvsOrderDetailForm pmTab:idMvsPanelFilterPlannedCompletionTime pmTab:idMvsPanelFilterActualCompletionTime" action="#{v2PmOrderMvsController.updateQueryIndex(0)}" disabled="#{v2PmOrderMvsController.queryIndex==0}"  rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_TAKE')}"  />
                <p:commandButton value="#{msg.Finished}"  process="@this" update="datalist buttonSet pmTab:pmMvsOrderDetailForm pmTab:idMvsPanelFilterPlannedCompletionTime pmTab:idMvsPanelFilterActualCompletionTime" action="#{v2PmOrderMvsController.updateQueryIndex(7)}" disabled="#{v2PmOrderMvsController.queryIndex==7}"  rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}"  />
                <p:commandButton value="#{msg.Canceled}"  process="@this" update="datalist buttonSet pmTab:pmMvsOrderDetailForm pmTab:idMvsPanelFilterPlannedCompletionTime pmTab:idMvsPanelFilterActualCompletionTime" action="#{v2PmOrderMvsController.updateQueryIndex(20)}" disabled="#{v2PmOrderMvsController.queryIndex==20}"  rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}"  />
            </h:panelGrid>
            <p:dataTable id="datalist" value="#{v2PmOrderMvsController.lazyModel}" var="item" widgetVar="varDataListgl"
                         selectionMode="single" selection="#{v2PmOrderMvsController.selected}"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="ascending"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500">
                <p:ajax event="rowSelect" listener="#{v2PmOrderMvsController.onSelectPmOrder()}" update="pmTab:pmMvsOrderDetailForm @(.coworkcls) @(.btn-export-maintenance-report)"/>
                <p:ajax event="filter" listener="#{v2PmOrderMvsController.onFilter}" update="datalist pmTab:pmOrderDetailForm  @(.pmOrderDetailFormCls)" oncomplete="updateSelectAllCheckBox();"/>
                <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                <p:column width="36" visible="#{v2PmOrderMvsController.queryIndex==2 or v2PmOrderMvsController.queryIndex==3 or v2PmOrderMvsController.queryIndex==0 or v2PmOrderMvsController.queryIndex==6 or v2PmOrderMvsController.queryIndex == 31 or v2PmOrderMvsController.queryIndex == 7 or v2PmOrderMvsController.queryIndex == -1}" exportable="false">
                    <p:selectBooleanCheckbox  value="#{v2PmOrderMvsController.selectedMap[item.id]}"  class="selectCheckBox">
                        <p:ajax process="@this" listener="#{v2PmOrderMvsController.pick(item.id)}" update="@(.selectCheckBoxHeader) @(.batch-terminated) @(.exportExcelBtn) @(.finishButton) @(.completeButton) @(.competeButton) @(.takeOrderbutton) @(.dispatchOrderButton) @(.transButton) @(.closeButton) @(.maintainButton) @(.batch-piliangjiedan) @(.planedCompleteButton) @(.btn-export-maintenance-report) @(.downloadBtn) @(.downloadConfirm)" oncomplete="updateSelectAllCheckBox();" />
                    </p:selectBooleanCheckbox>
                    <f:facet name="header">
                        <p:selectBooleanCheckbox id="selectCheckBoxHeader"  class="selectCheckBoxHeader">
                            <p:ajax  listener="#{v2PmOrderMvsController.onSelectAllOfPage}" update="@(.selectCheckBox) @(.batch-terminated) @(.exportExcelBtn) @(.batch-piliangjiedan) @(.takeOrderbutton) @(.finishButton) @(.competeButton) @(.completeButton) @(.dispatchOrderButton) @(.transButton) @(.closeButton) @(.maintainButton) @(.planedCompleteButton) @(.btn-export-maintenance-report) @(.downloadBtn) @(.downloadConfirm)" oncomplete="updateSelectAllCheckBox();"/>

                        </p:selectBooleanCheckbox>
                    </f:facet>
                </p:column>
                <p:column headerText="#{msg.assetName}"  filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE"> <h:outputText value="#{item.assetInfo.name}"/>
                </p:column>
                <p:column headerText="#{msg.ManufacturerSerialNumber}"  filterBy="#{item.assetInfo.serialNum}" filterMatchMode="LIKE"> <h:outputText value="#{item.assetInfo.serialNum}"/>
                </p:column>
                        <p:column headerText="#{msg.EquipmentIDHospital}"  filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.departNum}"/>
                        </p:column>
                <p:column headerText="#{msg.functionType}" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE"> <h:outputText value="#{item.assetInfo.functionType}"/>
                </p:column>
                <p:column headerText="#{msg.MeasurementGrade2}" filterBy="#{msg.ruleLevel}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataListgl').filter()" value="#{v2PmOrderMvsController.filterPmRuleLevel}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:if test="#{v2PmOrderMvsController.getPmRule()}">
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevelFour')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </c:if>
                            <c:if test="#{!v2PmOrderMvsController.getPmRule()}">
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </c:if>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{fieldMsg.fieldValue('ruleLevelFour',item.ruleLevel)}"/>
                </p:column>
                <p:column headerText="#{msg.MaintenanceType}"  filterBy="#{item.pmType}" filterMatchMode="EQ">
                    <f:facet name="filter" >
                        <p:selectOneMenu onchange="PF('varDataListgl').filter()" value="#{v2PmOrderMvsController.repairTypeInt}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('pmType').subList(0,3)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{fieldMsg.fieldValue('pmType',item.pmType)}"/>
                </p:column>
                <p:column headerText="#{msg.hospitalId}"  filterBy="#{item.assetInfo.siteUID}" filterMatchMode="EQ" rendered="#{userContextService.isYiMaiYangGuangTenant()}">
                    <f:facet name="filter" >
                        <p:selectOneMenu onchange="PF('varDataListgl').filter()" value="#{v2PmOrderMvsController.siteUidFilterMVS}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{v2PmOrderMvsController.LoadSiteNameListMVS()}" var="val" itemLabel="#{val.name}" itemValue="#{val.uid}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{v2PmOrderMvsController.getSiteOrgName(item.assetInfo.siteUID)}"/>
                </p:column>
                <!--所属科室-->
                <p:column headerText="#{msg.clinicalDeptName}"  width="100">
                    <f:facet name="header">
                        <h:outputText value="#{msg.clinicalDeptName}"/><br/>
                        <p:autoComplete dropdown="true" value="#{v2PmOrderMvsController.fileterOrgNameMVS}" appendTo="@(Body)"
                                        scrollHeight="300"  forceSelection="true" completeMethod="#{v2PmOrderMvsController.autoCompleteDeptNameMVS}" size="5">
                            <p:ajax event="itemSelect" listener="#{v2PmOrderMvsController.onClinicalDeptNameFilterChangeMVS}" process="@this"  update="pmTab:pmMvsListForm:datalist"/>
                            <p:ajax listener="#{v2PmOrderMvsController.onClinicalDeptNameFilterChangeMVS}" process="@this"  update="pmTab:pmMvsListForm:datalist"/>
                        </p:autoComplete>
                    </f:facet>
                    <h:outputText value="#{v2PmOrderMvsController.getOrgInfoByUid(item.assetInfo.clinicalDeptUID).name}"/>
                </p:column>
                <p:column headerText="#{msg.locationName}"  filterBy="#{item.assetInfo.locationName}" filterMatchMode="LIKE" rendered="#{v2PmOrderMvsController.showLocationName()}">
                    <h:outputText value="#{item.assetInfo.locationName}"/>
                </p:column>
                <p:column>
                    <f:facet name="header">
                        <h:outputText value="#{msg.PmOrderRule}"/><br/>
                    </f:facet>
                    <h:outputText value="#{item.ruleName}"/>
                </p:column>
                <p:column headerText="保养周期">
                    <h:outputText value="#{item.period}"/>
                </p:column>
                <p:column headerText="保养周期单位">
                    <h:outputText value="#{v2PmOrderMvsController.getPeriodUnit(item.periodUnit)}"/>
                </p:column>
                <p:column headerText="#{msg.Creator}" >
                    <h:outputText value="#{item.creatorName}"/>
                </p:column>
                <p:column headerText="#{msg.Owner}" >
                    <h:outputText value="#{item.ownerName}"/>
                </p:column>
                <p:column headerText="保养编号"  filterBy="#{item.pmNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.pmNum}"/>
                </p:column>
                <p:column headerText="#{msg.CurrentProcessingStep}"  filterBy="#{item.currentStepName}" filterMatchMode="EQ">
                    <f:facet name="filter" >
                        <p:selectOneMenu onchange="PF('varDataListgl').filter()" value="#{v2PmOrderMvsController.stepFileter}"  rendered="#{v2PmOrderMvsController.queryIndex==-1}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{pmOrderGlobalController.stepsInTableFilter}" var="item" itemLabel="#{item}" itemValue="#{item}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{item.currentStepName}"/>
                </p:column>
                <p:column headerText="#{msg.intExtType}" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{fieldMsg.fieldValue('intExtType',item.intExtType)}"/>
                </p:column>
                <p:column headerText="#{msg.PlannedCompletionTime}" filterBy="#{item.planTime}" filterMatchMode="GTE" >
                    <f:facet name="filter">
                        <p:inputText id="filterPlannedCompletionTime" widgetVar="varFilterPlannedCompletionTime" value="#{v2PmOrderMvsController.plannedCompletionTimeFormat}"/>
                    </f:facet>
                    <h:outputText value="#{item.planTime}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg.ActualCompletionTime}" filterBy="#{item.endTime}" filterMatchMode="GTE" rendered="#{v2PmOrderMvsController.queryIndex==7 or userContextService.hasCurrentTenantName('')}">
                    <f:facet name="filter">
                        <p:inputText id="filterActualCompletionTime" widgetVar="varFilterActualCompletionTime" value="#{v2PmOrderMvsController.actualCompletionTimeFormat}"/>
                    </f:facet>
                    <h:outputText value="#{item.endTime}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                    </h:outputText>
                </p:column>
                <p:column width="90" headerText="主子工单" rendered="#{!userContextService.isEnableBtnByKey('displayMainSubPmOrder')}"  filterBy="#{item.mainSub}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataListgl').filter()">
                            <f:selectItem itemLabel="#{msg.All}" itemValue="" />
                            <f:selectItem itemLabel="主工单" itemValue="main" />
                            <f:selectItem itemLabel="子工单" itemValue="sub" />
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{empty item.mainSub?'':'main'.equals(item.mainSub)?'主工单':'子工单'}" />
                </p:column>
                <f:facet name="{Toolbar}" >
                    <p:commandButton title="#{msg.exportToXLS}" class="exportExcelBtn" icon="ui-icon-arrowstop-1-s" actionListener="#{v2PmOrderMvsController.exportExcel1}" disabled="#{v2PmOrderMvsController.exportButtonShow()}" onclick="PrimeFaces.monitorDownload(start, stop);">
                        <p:fileDownload value="#{v2PmOrderMvsController.excelFile}"/>
                    </p:commandButton><!--
                     <p:commandButton  icon="ui-icon-arrow-1-s" actionListener="#{v2PmOrderMvsController.doExportMaintenanceReport()}" class=" btn-sm btn-gray btn-export-maintenance-report" title="#{msg.ExportMaintenanceWorkorder}" rendered="#{v2PmOrderMvsController.queryIndex==7}" disabled="#{not v2PmOrderMvsController.isTargetSelected()}" ajax="false">
                        <p:fileDownload value="#{v2PmOrderMvsController.maintenanceReport}" />
                    </p:commandButton>-->
                    <ui:fragment rendered="true">
                        <p:commandButton  icon="ui-icon ui-icon-arrow-downward" onclick="PF('downloadConfirm').show(); return false;" class="btn-export-maintenance-report" title="批量下载附件工单" rendered="#{v2PmOrderMvsController.queryIndex==7}" disabled="#{not v2PmOrderMvsController.isTargetSelected()}" ajax="false"/>
                    </ui:fragment>

                </f:facet>
            </p:dataTable>
        </h:form>

        <p:confirmDialog id="downloadConfirm" widgetVar="downloadConfirm"
                         message="#{v2PmOrderMvsController.messageTip}"
                         header="确认下载"
                         severity="warn" class="downloadConfirm" width="700px">
            <h:form>
                <p:commandButton value="确定" ajax="false"
                                 actionListener="#{v2PmOrderMvsController.doExportWorkOrderReport()}"
                                 onclick="PF('downloadConfirm').hide()" styleClass="ui-confirmdialog-yes uiButton"
                                 icon="ui-icon-check">
                    <p:fileDownload value="#{v2PmOrderMvsController.maintenanceWorkReport}"
                                    oncomplete="PF('downloadConfirm').hide()"/>
                </p:commandButton>
                <p:commandButton value="取消" type="button"
                                 onclick="PF('downloadConfirm').hide()" styleClass="ui-confirmdialog-no uiButton"
                                 icon="ui-icon-close"
                />
            </h:form>
        </p:confirmDialog>

        <p:overlayPanel id="idMvsPanelFilterPlannedCompletionTime" widgetVar="panelFilterPlannedCompletionTime" for="pmTab:pmMvsListForm:datalist:filterPlannedCompletionTime" dismissable="false" >
            <h:panelGrid columns="2">
                <p:outputLabel value="#{msg.From}"/>
                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varPlannedCompletionTimeFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                <p:outputLabel value="#{msg.To}"/>
                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varPlannedCompletionTimeTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
            </h:panelGrid>
            <p:commandButton onclick="setDateFilter('varDataListgl', 'varFilterPlannedCompletionTime', 'varPlannedCompletionTimeFrom', 'varPlannedCompletionTimeTo'); PF('panelFilterPlannedCompletionTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
            <p:commandButton onclick="PF('panelFilterPlannedCompletionTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
        </p:overlayPanel>
        <p:overlayPanel id="idMvsPanelFilterActualCompletionTime" widgetVar="panelFilterActualCompletionTime" for="pmTab:pmMvsListForm:datalist:filterActualCompletionTime" dismissable="false" >
            <h:panelGrid columns="2">
                <p:outputLabel value="#{msg.From}"/>
                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varActualCompletionTimeFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                <p:outputLabel value="#{msg.To}"/>
                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varActualCompletionTimeTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
            </h:panelGrid>
            <p:commandButton onclick="setDateFilter('varDataListgl', 'varFilterActualCompletionTime', 'varActualCompletionTimeFrom', 'varActualCompletionTimeTo'); PF('panelFilterActualCompletionTime').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
            <p:commandButton onclick="PF('panelFilterActualCompletionTime').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
        </p:overlayPanel>
        <p:dialog id="previewedDlgEhome" width="1000" height="800"  widgetVar="previewedDlg" modal="true" howEffect="fade"  maximizable="true" appendTo="@this">
            <c:choose>
                <c:when test="#{preViewerBean.type eq 0}">
                    <p:graphicImage value="#{fileDownloadService.getFile(preViewerBean.getObjectId())}" stream="false"   width="100%" height="780px" />
                </c:when>
                <c:when test="#{preViewerBean.type eq 1}">
                    <embed src="#{preViewerBean.pdfUrl}" type="application/pdf"  width="100%" height="780px" />
                </c:when>
                <c:otherwise>
                    <h:outputText value="预览失败！" />
                </c:otherwise>
            </c:choose>
        </p:dialog>
        <ui:include src="pmMvsOrderView.xhtml"/>
    </div>
</ui:composition>
</html>
