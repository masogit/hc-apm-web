<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition >
    <div class="ui-g clearfix">
        <div class="ui-g-12 card">
            <h:form id="pmOrderListFormRemote">
                <p:dataTable id="datalist" value="#{v2PmOrderRemController.lazyModel}" var="item" widgetVar="varDataList5" selectionMode="single" selection="#{v2PmOrderRemController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.scheduleDate}" paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                             rows="10" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="10,20,30,90">

                    <p:ajax event="rowSelect" listener="#{v2PmOrderRemController.onSelectPmOrder()}" update="pmTab:pmOrderDetailForm"/>
                    <p:ajax event="filter" listener="#{v2PmOrderRemController.onFilter}" update="datalist pmTab:pmOrderDetailForm"/>

                    <p:column headerText="工单编号" sortBy="#{item.srNum}" filterBy="#{item.srNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.srNum}"/>
                    </p:column>
                    <p:column headerText="设备编号(院方)" sortBy="#{item.assetInfo.departNum}" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetInfo.departNum}"/>
                    </p:column>
                    <p:column headerText="资产名称" sortBy="#{item.assetInfo.name}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetInfo.name}"/>
                    </p:column>
                    <p:column headerText="#{msg.clinicalDeptName}" sortBy="#{item.assetInfo.clinicalDeptName}" filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetInfo.clinicalDeptName}"/>
                    </p:column>


                    <p:column headerText="状态" sortBy="#{item.status}" filterBy="#{item.status}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.status}"/>
                    </p:column>
                    <p:column headerText="保养计划时间" sortBy="#{item.scheduleDate}">
                        <h:outputText value="#{item.scheduleDate}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                        </h:outputText>
                    </p:column>

                    <f:facet name="{Toolbar}">
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
                            <p:dataExporter type="xls" target="datalist" fileName="PmOrder_export"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>
            <!-- <ui:include src="pmOrderView.xhtml"/>-->

        </div>
    </div>




</ui:composition>
</html>
