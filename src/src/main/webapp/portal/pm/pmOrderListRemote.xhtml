<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
	<div class="ui-g-12 card">
		<!--<p:messages autoUpdate="true" closable="true" showDetail="false"/>-->

		<h:form id="pmOrderListFormRemote">

			<p:dataTable id="datalist" value="#{assetLifecycleEventController5.lazyModel}" var="item" widgetVar="varDataList"
				selection="#{assetLifecycleEventController5.selecteItems}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
				rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
				paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
				currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="#{msg.noRecordFound}"
				rowsPerPageTemplate="20,50,100,500">
				<p:column selectionMode="multiple" style="width:32px;text-align:center" />
				<p:ajax event="rowSelect" listener="#{assetLifecycleEventController5.onSelectAssetLifecycleEvent}" />
				<p:ajax event="filter" listener="#{assetLifecycleEventController5.onFilter}" />
				<p:column headerText="#{msg.assetName}" sortBy="#{item.assetName}" filterBy="#{item.assetName}"
                          filterMatchMode="LIKE">
                    <h:outputText value="#{item.assetName}"/>
                </p:column>

                <p:column headerText="外部工单号" sortBy="#{item.eventUid}" filterBy="#{item.eventUid}"
                          filterMatchMode="LIKE">
                    <h:outputText value="#{item.eventUid}"/>
                </p:column>
                <p:column headerText="更新时间" sortBy="#{item.createTime}" filterBy="#{item.createTime}"
                          filterMatchMode="LIKE">
                    <h:outputText value="#{item.createTime}"/>
                </p:column>
                <p:column headerText="System ID" sortBy="#{item.assetInfo.systemId}" filterBy="#{item.assetInfo.systemId}"
                          filterMatchMode="LIKE">
                    <h:outputText value="#{item.assetInfo.systemId}"/>
                </p:column>
                <p:column headerText="#{msg.clinicalDeptName}" sortBy="#{item.assetInfo.clinicalDeptName}" filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.assetInfo.clinicalDeptName}"/>
                </p:column>
                <p:column headerText="状态">
					<h:outputText value="#{assetLifecycleEventController.getStatusLabel(item)}"/>
                </p:column>
				<p:column headerText="保养计划时间" sortBy="#{item.scheduleDate}">
					<h:outputText value="#{item.scheduleDate}">
						<f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
					</h:outputText>
				</p:column>

				<p:column headerText="报告下载">
					<p:repeat value="#{item.reports}" var="report">
						<p:link href="#{fileDownloadService.getFileUrl(report.storageId)}">
							<h:outputText value="#{report.displayName}" />
						</p:link>
						<br />
					</p:repeat>
				</p:column>
				<f:facet name="{Toolbar}">
					<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
						<p:dataExporter type="xlsx" target="datalist" fileName="PmOrder_export" />
					</p:commandButton>
					<p:commandButton title="报告下载" icon="ui-icon-file-download" ajax="false" onclick="PrimeFaces.monitorDownload(start, stop);">
						<p:fileDownload value="#{assetLifecycleEventController5.downloadSelectedReport()}" />
					</p:commandButton>
				</f:facet>
			</p:dataTable>
		</h:form>

	</div>


	<script>
            afterPageLoad = function () {
                var requestAssetUid = "#{workOrderMgrController.requestAssetUid}";
                var isActive = "#{userContextService.isActive()}";
                if(isActive == '1'){
                    PF('ActiveDlg').show();
                }
            }


    </script>

</ui:composition>
</html>
