<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition >
        <div class="ui-g clearfix">
            <div class="ui-g-12 card">

                <h:form id="pmOrderListFormRemote">

                    <p:dataTable id="datalist" value="#{v2PmOrderRemController.lazyModel}" var="item" widgetVar="varDataList2" selectionMode="single" selection="#{v2PmOrderRemController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true" rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.createTime}" paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="10" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="10,20,30,90">

                        <p:ajax event="rowSelect" listener="#{v2PmOrderRemController.onSelectPmOrder()}" update="pmTab:pmOrderDetailForm"/>
                        <p:ajax event="filter" listener="#{v2PmOrderRemController.onFilter}" update="datalist pmTab:pmOrderDetailForm"/>
                        <p:column headerText="#{msg.assetName}" sortBy="#{item.assetName}" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>

                        <p:column headerText="保养单号" sortBy="#{item.eventUid}" filterBy="#{item.eventUid}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.eventUid}"/>
                        </p:column>
                        <p:column headerText="创建时间" sortBy="#{item.createTime}" filterBy="#{item.createTime}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.createTime}"/>
                        </p:column>
                        <p:column headerText="状态">
                            <h:outputText value="#{v2PmOrderRemController.getEvStatus(item.status)}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="远程保养单"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
             <!-- <ui:include src="pmOrderView.xhtml"/>-->

            </div>
        </div>




</ui:composition>
</html>
