<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

<ui:composition>
    <div class="ui-g-12 card">
        <h:form id="searchForm" class="searchForm">
            <h:panelGroup>
                <p:overlayPanel appendTo="searchForm" widgetVar="varPanelOrg" for="pmTab:pmOrderListForm:datalist:btnOrg" hideEffect="fade" dynamic="false" modal="false" >
                    <p:inputText id="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
                    <p:commandButton partialSubmit="true" icon="ui-icon-search" process="pmTab:searchForm:treeNodeNameFilter @this" update="pmTab:searchForm:orgTree" actionListener="#{orgTreeController.filterTreeNodeByNameType4()}" value="#{msg.Search}"/>
                    <p:commandButton partialSubmit="true" icon="ui-icon-search" process="pmTab:searchForm:treeNodeNameFilter @this" update="pmTab" value="确定"/>
                    <p:scrollPanel style="height:300px;border: 0" mode="native">
                        <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.siteOrgTree}" selection="#{v2PmOrderController.selectedAccessOrgNodes}" var="node" selectionMode="checkbox" dynamic="false"  cache="false" propagateSelectionUp="#{orgTreeController.propagateSelectionUp}">
                            <p:ajax process="@this" event="select" listener="#{v2PmOrderController.onSelectSiteTreeNode}"/>
                            <p:ajax process="@this" event="unselect" listener="#{v2PmOrderController.onUnSelectSiteTreeNode}"/>
                            <p:ajax process="@this" event="expand"/>
                            <p:ajax process="@this" event="collapse"/>
                            <p:treeNode type="org">
                                <h:outputText value="#{node.name}"/>
                            </p:treeNode>
                            <p:treeNode type="hidden" rendered="false"/>
                        </p:tree>
                    </p:scrollPanel>
                </p:overlayPanel>
            </h:panelGroup>
        </h:form>
        <h:form id="pmOrderListForm">
            <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                <c:choose>
                    <c:when test="#{!userContextService.hasCurrentTenantName('')}">
                        <p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=10" disabled="#{v2PmOrderController.queryIndex==10}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}"/>
                        <p:commandButton value="#{msg.ToBeDone}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=-1" disabled="#{v2PmOrderController.queryIndex==-1}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}"/>
                        <p:commandButton value="#{msg.CreateMaintenance}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_CREATE')}" actionListener="#{v2PmOrderController.createPMRequest()}" process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm pmTab:PmRequestCreateForm"  oncomplete="PF('createPMDialog').show()" />
                        <p:commandButton value="#{msg.WorkorderToBeAssigned}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=2" disabled="#{v2PmOrderController.queryIndex==2}" rendered="#{userContextService.isPmDispatcher() or userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}"/>
                        <p:commandButton value="#{msg.WorkorderToPickUp}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=3" disabled="#{v2PmOrderController.queryIndex==3}"  rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_TAKE')}"  />
                        <p:commandButton value="#{msg.OrderToCompete}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=31" disabled="#{v2PmOrderController.queryIndex==31}"  rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_TAKE')}"  />
                        <p:commandButton value="#{msg.Planned}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=0" disabled="#{v2PmOrderController.queryIndex==0}"  rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_TAKE')}"  />
                        <p:commandButton value="#{msg.pendingAcceptance}" process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=11" disabled="#{v2PmOrderController.queryIndex==11}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_ACCEPT')}"  />
                        <p:commandButton value="#{msg.ToBeApproved}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=8" disabled="#{v2PmOrderController.queryIndex==8}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_APPROVE')}"/>
                        <p:commandButton value="#{msg.Finished}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=7" disabled="#{v2PmOrderController.queryIndex==7}"  rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_CLOSED')}"  />
                        <p:commandButton value="#{msg.Canceled}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=20" disabled="#{v2PmOrderController.queryIndex==20}"  rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}"  />
                        <p:remoteCommand id="createPM" name="createPM" update="datalist buttonSet pmTab:pmOrderDetailForm pmTab:createPMDialog" actionListener="#{v2PmOrderController.createPMRequest()}" oncomplete="PF('createPMDialog').show()" />
                    </c:when>
                    <c:otherwise>
                        <!--云南阜外保养目录 创建保养，全部、待接单、保养中、已完成。-->
                        <p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=10" disabled="#{v2PmOrderController.queryIndex==10}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}"/>
                        <p:commandButton value="#{msg.CreateMaintenance}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}" actionListener="#{v2PmOrderController.createPMRequest()}" process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm pmTab:PmRequestCreateForm"  oncomplete="PF('createPMDialog').show()" />
                        <p:commandButton value="#{msg.BatchCreateMaintenance}" rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}" action="/portal/pm/pmOrderRule/GeneratePmOrders.xhtml" />
                        <p:commandButton value="#{msg.WorkorderToPickUp}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=31" disabled="#{v2PmOrderController.queryIndex==31}"  rendered="#{ userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_TAKE')}"  />
                        <p:commandButton value="#{msg.maintenance1}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=0" disabled="#{v2PmOrderController.queryIndex==0}"  rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_TAKE')}"  />
                        <p:commandButton value="#{msg.Completed1}"  process="@this" update="datalist buttonSet pmTab:pmOrderDetailForm" action="pmOrderListAll.xhtml?faces-redirect=true&amp;query=7" disabled="#{v2PmOrderController.queryIndex==7}"  rendered="#{userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_VIEW_ALL')}"  />
                    </c:otherwise>
                </c:choose>
            </h:panelGrid>

            <p:dataTable id="datalist" value="#{v2PmOrderController.lazyModel}" var="item" widgetVar="varDataListgl"
                         selectionMode="single" selection="#{v2PmOrderController.selected}"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{item.id}" sortMode="single" sortOrder="ascending" sortBy="#{item.planTime}"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                         rows="20" emptyMessage="#{msg.noRecordFound}"
                         rowsPerPageTemplate="20,50,100,500">
                <c:if test="#{v2PmOrderController.pageType eq 'new'}">
                    <p:ajax event="rowSelect" listener="#{v2PmOrderController.onSelectOrderRedirect()}" onstart="prepareOrderViewWindow();" oncomplete="openOrderViewWindow(xhr, status, args)" />
                </c:if>
                <c:if test="#{v2PmOrderController.pageType eq 'current'}">
                    <p:ajax event="rowSelect" listener="#{v2PmOrderController.onSelectPmOrder()}" update="pmTab:pmOrderDetailForm @(.coworkcls) @(.btn-export-maintenance-report)"/>
                </c:if>
                <p:ajax event="filter" listener="#{v2PmOrderController.onFilter}" update="datalist pmTab:pmOrderDetailForm" oncomplete="updateSelectAllCheckBox();"/>
                <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                <p:column width="36" visible="#{v2PmOrderController.queryIndex==2 or v2PmOrderController.queryIndex==3 or v2PmOrderController.queryIndex==0 or v2PmOrderController.queryIndex==6 or v2PmOrderController.queryIndex == 31 or v2PmOrderController.queryIndex == 7 or v2PmOrderController.queryIndex == -1 or  v2PmOrderController.queryIndex == 10}" exportable="false">
                    <p:selectBooleanCheckbox  value="#{v2PmOrderController.selectedMap[item.id]}"  class="selectCheckBox">
                        <p:ajax process="@this" listener="#{v2PmOrderController.pick(item.id)}" update="@(.selectCheckBoxHeader) @(.batch-terminated) @(.exportExcelBtn) @(.finishButton) @(.completeButton) @(.competeButton) @(.takeOrderbutton) @(.dispatchOrderButton) @(.transButton) @(.closeButton) @(.maintainButton) @(.batch-piliangjiedan) @(.planedCompleteButton) @(.btn-export-maintenance-report) @(.downloadBtn)" oncomplete="updateSelectAllCheckBox();" />
                    </p:selectBooleanCheckbox>
                    <f:facet name="header">
                        <p:selectBooleanCheckbox id="selectCheckBoxHeader"  class="selectCheckBoxHeader">
                            <p:ajax  listener="#{v2PmOrderController.onSelectAllOfPage}" update="@(.selectCheckBox) @(.batch-terminated) @(.exportExcelBtn) @(.batch-piliangjiedan) @(.takeOrderbutton) @(.finishButton) @(.competeButton) @(.completeButton) @(.dispatchOrderButton) @(.transButton) @(.closeButton) @(.maintainButton) @(.planedCompleteButton) @(.btn-export-maintenance-report) @(.downloadBtn)" oncomplete="updateSelectAllCheckBox();"/>
                        </p:selectBooleanCheckbox>
                    </f:facet>
                </p:column>

                <p:column headerText="#{msg.hospitalId}" sortBy="#{item.siteUID}" filterBy="#{item.siteUID}" filterMatchMode="EQ" >
                    <f:facet name="filter" >
                        <p:autoComplete id="btnOrg" value="请选择院区" type="button" icon="fa fa-angle-down" iconPos="right"/>
                    </f:facet>
                    <h:outputText value="#{v2PmOrderController.getSiteOrgName(item.siteUID)}"/>
                </p:column>

                <p:column headerText="#{msg.assetName}" sortBy="#{item.assetInfo.name}" filterBy="#{item.assetInfo.name}" filterMatchMode="LIKE"> <h:outputText value="#{item.assetInfo.name}"/>
                </p:column>

                <p:column headerText="#{msg.ManufacturerSerialNumber}" sortBy="#{item.assetInfo.serialNum}" filterBy="#{item.assetInfo.serialNum}" filterMatchMode="LIKE"> <h:outputText value="#{item.assetInfo.serialNum}"/>
                </p:column>
                <p:column headerText="System ID" sortBy="#{item.assetInfo.systemId}" filterBy="#{item.assetInfo.systemId}" filterMatchMode="LIKE" rendered="#{userContextService.isCountyArea()}">
                    <h:outputText value="#{item.assetInfo.systemId}"/>
                </p:column>

                        <p:column headerText="#{msg.EquipmentIDHospital}" sortBy="#{item.assetInfo.departNum}" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.departNum}"/>
                        </p:column>
                <p:column headerText="#{msg.functionType}" sortBy="#{item.assetInfo.functionType}" filterBy="#{item.assetInfo.functionType}" filterMatchMode="LIKE"> <h:outputText value="#{item.assetInfo.functionType}"/>
                </p:column>
                <p:column headerText="#{msg.MeasurementGrade2}" sortBy="#{msg.ruleLevel}" filterBy="#{msg.ruleLevel}" filterMatchMode="EQ">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataListgl').filter()" value="#{v2PmOrderController.filterPmRuleLevel}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <c:if test="#{v2PmOrderController.getPmRule()}">
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevelFour')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </c:if>
                            <c:if test="#{!v2PmOrderController.getPmRule()}">
                                <f:selectItems value="#{fieldMsg.getFieldValueList('ruleLevel')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </c:if>
                        </p:selectOneMenu>
                    </f:facet>
                        <h:outputText value="#{fieldMsg.fieldValue('ruleLevelFour',item.ruleLevel)}"/>
                </p:column>

                <p:column headerText="#{msg.MaintenanceType}"  sortBy="#{item.pmType}" filterBy="#{item.pmType}" filterMatchMode="EQ">
                    <f:facet name="filter" >
                        <p:selectOneMenu onchange="PF('varDataListgl').filter()" value="#{v2PmOrderController.repairTypeInt}">
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('pmType').subList(0,4)}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{fieldMsg.fieldValue('pmType',item.pmType)}"/>
                </p:column>
                <!--所属科室-->
                <p:column headerText="#{msg.clinicalDeptName}" filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="EQ" width="100">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('varDataListgl').filter()" value="#{v2PmOrderController.fileterOrgName}"  filter="true" filterMatchMode="contains" filterNormalize="true" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{v2PmOrderController.clinicalDeptList}" var="item" itemLabel="#{item}" itemValue="#{item}"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{v2PmOrderController.getOrgInfoByUid(item.clinicalDeptId).name}"/>
                </p:column>
                <!--使用科室-->
                <p:column headerText="#{msg.assetDeptName}" width="100" rendered="#{userContextService.enableDisplayByKey('pmOrderDeptFilter')}">
                    <f:facet name="filter">
                        <p:selectOneMenu value="#{v2PmOrderController.fileterAssetDeptOrgName}"  filter="true" filterMatchMode="contains" filterNormalize="true" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{v2PmOrderController.clinicalDeptList}" var="item" itemLabel="#{item}" itemValue="#{item}"/>
                            <p:ajax event="change" listener="#{v2PmOrderController.onAssetDeptNameFilterChange}" process="@this" update=":pmOrderListForm:datalist"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <h:outputText value="#{v2PmOrderController.getOrgInfoByUid(item.assetInfo.assetDeptUID).name}"/>
                </p:column>
                <p:column headerText="#{msg.locationName}" sortBy="#{item.assetInfo.locationName}" filterBy="#{item.assetInfo.locationName}" filterMatchMode="LIKE" rendered="#{v2PmOrderController.showLocationNameFlag}">
                    <h:outputText value="#{item.assetInfo.locationName}"/>
                </p:column>
                <p:column filterBy="#{item.ruleName}" filterMatchMode="LIKE">
                    <f:facet name="header">
                        <h:outputText value="#{msg.PmOrderRule}"/><br/>
                    </f:facet>
                    <h:outputText value="#{item.ruleName}"/>
                </p:column>
                <p:column headerText="#{msg.maintenancePeriod}" filterBy="#{item.period}" filterMatchMode="EQ">
                    <h:outputText value="#{item.period.toString().concat(v2PmOrderController.getPeriodUnit(item.periodUnit))}"/>
                </p:column>
<!--                <p:column headerText="保养周期单位">-->
<!--                    <h:outputText value="#{v2PmOrderController.getPeriodUnit(item.periodUnit)}"/>-->
<!--                </p:column>-->
                <p:column headerText="#{msg.Creator}" sortBy="#{item.creatorName}" filterBy="#{item.creatorName}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.creatorName}"/>
                </p:column>

                <p:column headerText="#{msg.Owner}" sortBy="#{item.ownerName}" filterBy="#{item.ownerName}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.ownerName}"/>
                </p:column>


                <p:column headerText="#{msg.MaintenanceNumber}" sortBy="#{item.pmNum}" filterBy="#{item.pmNum}" filterMatchMode="LIKE">
                    <h:outputText value="#{item.pmNum}"/>
                </p:column>
                <p:column headerText="#{msg.CurrentProcessingStep}" filterBy="#{item.currentStepName}" filterMatchMode="EQ" rendered="#{v2PmOrderController.queryIndex != 7}">
                    <f:facet name="filter" >
                        <p:selectOneMenu onchange="PF('varDataListgl').filter()" value="#{v2PmOrderController.stepFileter}" >
                            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>
<!--                            <f:selectItems value="#{pmOrderGlobalController.stepsInTableFilter}" var="item" itemLabel="#{item}" itemValue="#{item}"/>-->
                            <f:selectItems value="#{fieldMsg.getFieldValueList('pmCurrentSteps')}" var="item" itemLabel="#{item.value}" itemValue="#{item.valueZh}"/>
                        </p:selectOneMenu>
                    </f:facet>

                    <h:outputText value="#{item.currentStepName}"/>
                </p:column>
                <p:column headerText="#{msg.intExtType}" rendered="#{!userContextService.hasCurrentTenantName('')}">
                    <h:outputText value="#{fieldMsg.fieldValue('intExtType',item.intExtType)}"/>
                </p:column>
                <p:column headerText="#{msg.pmComment}" filterBy="#{item.comments}" filterMatchMode="LIKE" rendered="#{v2PmOrderController.queryIndex == 7}">
                    <h:outputText value="#{item.comments}"/>
                </p:column>
                <p:column headerText="#{msg.PlannedCompletionTime}"  sortBy="#{item.planTime}" filterBy="#{item.planTime}" filterMatchMode="GTE" >
                    <f:facet name="filter">
                        <p:inputText id="filterPlannedCompletionTime" widgetVar="varFilterPlannedCompletionTime" value="#{v2PmOrderController.plannedCompletionTimeFormat}"/>
                    </f:facet>
                    <h:outputText value="#{item.planTime}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="#{msg.ActualCompletionTime}"  sortBy="#{item.endTime}" filterBy="#{item.endTime}" filterMatchMode="GTE" rendered="#{v2PmOrderController.queryIndex==7 or userContextService.hasCurrentTenantName('')}">
                    <f:facet name="filter">
                        <p:inputText id="filterActualCompletionTime" widgetVar="varFilterActualCompletionTime" value="#{v2PmOrderController.actualCompletionTimeFormat}"/>
                    </f:facet>
                    <h:outputText value="#{item.endTime}">
                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                    </h:outputText>
                </p:column>
                <!--待派工 2-->
                <p:column headerText="#{msg.Operation}" style="width: 100px" rendered="#{v2PmOrderController.queryIndex==-1 and userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_CANCEL')}" exportable="false">
                    <p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" disabled="#{item.currentStepId ne 'Assign' and item.currentStepId and 'Maintain' and item.currentStepId ne 'Accept'}" actionListener="#{v2PmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />
                </p:column>
                <p:column headerText="#{msg.Operation}" style="width: 100px" rendered="#{v2PmOrderController.queryIndex==2 and (userContextService.isPmDispatcher() or userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_DISPATCH'))}" exportable="false">
                    <p:commandButton class="dispatchOrderButton" value="#{msg.Dispatch}" disabled="#{v2PmOrderController.isChecked()}" actionListener="#{v2PmOrderController.prepareAct(item.id)}" update="pmTab:dispatchDialogForm" oncomplete="PF('dispatchDialog').show()"/>
                    <p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" actionListener="#{v2PmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />
                </p:column>
                <!--待接单 3-->
                <p:column headerText="#{msg.Operation}" style="width: 100px" rendered="#{v2PmOrderController.queryIndex==3 ||v2PmOrderController.queryIndex==3}" exportable="false">
                    <p:commandButton  class="completeButton" value="#{msg.Complete}" disabled="#{v2PmOrderController.isChecked()}" rendered="#{item.simplify}" actionListener="#{v2PmOrderController.prepareCompleteOrder(item.id)}" update="@(.pmrepairCompleteDialogFormcls)" oncomplete="PF('pmrepairCompleteDialog').show()"/>
                    <!--v2PmOrderController.isChecked()加了后 一选中了checkbox 接单按钮就会灰掉 保证不能即批量又单个接单-->
                    <p:commandButton class="takeOrderbutton" disabled="#{item.currentPersonId!=userContextService.loginUserUid or v2PmOrderController.isChecked()}" rendered="#{item.simplify ne true}" value="#{msg.TakeOrder}" actionListener="#{v2PmOrderController.prepareActTakeGrap(item.id,msg.OrderDialog)}" update="@(.t1)" oncomplete="PF('takeOrderDialog').show()"/>
                    <!--医工主任：待办 状态为待派工、待接单、已计划的可操作【取消】按钮，其他步骤按钮为灰色-->
                    <p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" disabled="#{item.currentStepId ne 'Assign' and item.currentStepId and 'Maintain' and item.currentStepId ne 'Accept'}" actionListener="#{v2PmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />

                </p:column>

                <!--待抢单tab 31 qingtao-->
                <p:column style="width: 100px" headerText="#{msg.Operation}" rendered="#{v2PmOrderController.queryIndex==31}" exportable="false">
                    <p:commandButton  class="finishButton" value="#{msg.Complete}" disabled="#{v2PmOrderController.isChecked()}" rendered="#{item.simplify}" actionListener="#{v2PmOrderController.prepareCompleteOrder(item.id)}" update="@(.pmrepairCompleteDialogFormcls)" oncomplete="PF('pmrepairCompleteDialog').show()"/>
                    <p:commandButton  class="competeButton" disabled="#{v2PmOrderController.isChecked()}" value="#{userContextService.hasCurrentTenantName('')?msg.TakeOrder:msg.Compete }" rendered="#{item.simplify ne true}" actionListener="#{v2PmOrderController.prepareActTakeGrap(item.id,msg.OrderCompetitionDialog)}" update="@(.t1)" oncomplete="PF('takeOrderDialog').show()"/>
                    <p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" disabled="#{item.currentStepId ne 'Assign' and item.currentStepId and 'Maintain' and item.currentStepId ne 'Accept'}" actionListener="#{v2PmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />
                </p:column>

                <!--已计划 0-->
                <p:column headerText="#{msg.Operation}"  style="width: 100px" rendered="#{v2PmOrderController.queryIndex==0}" exportable="false">
                    <p:commandButton value="#{msg.Maintenance}" class="maintainButton" rendered="#{item.simplify ne true}" actionListener="#{v2PmOrderController.prepareCompleteOrder(item.id)}" disabled="#{item.approvalStatus==1 or item.approvalStatus==5 or item.currentPersonId!=userContextService.loginUserUid or v2PmOrderController.isChecked()}" update="@(.pmrepairCompleteDialogFormcls)" oncomplete="PF('pmrepairCompleteDialog').show()"/>
                    <p:commandButton value="#{msg.Reassign}" class="transButton" rendered="#{item.simplify ne true}" actionListener="#{v2PmOrderController.prepareAct(item.id)}"  disabled="#{item.approvalStatus==1 or item.approvalStatus==5 or item.currentPersonId!=userContextService.loginUserUid or v2PmOrderController.isChecked()}" update="@(.transferOrderDialogClass)"   oncomplete="PF('transferOrderDialog').show()"/>
                    <p:commandButton  class="planedCompleteButton" value="#{msg.Complete}"  disabled="#{item.approvalStatus eq '1' or item.approvalStatus eq '5' or v2PmOrderController.isChecked()}"  rendered="#{item.simplify}" actionListener="#{v2PmOrderController.prepareCompleteOrder(item.id)}" update="@(.pmrepairCompleteDialogFormcls)" oncomplete="PF('pmrepairCompleteDialog').show()"/>
                    <p:commandButton value="#{msg.Cancel}" update="pmTab:pmCancelForm" disabled="#{!userContextService.accessContainsFunctionMenu('MAINTAIN_ORDER_CANCEL')}" actionListener="#{v2PmOrderController.prepareCancel(item.id)}" oncomplete="PF('pmCancelDialog').show()" />
