<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">


    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="PM工作台"/>
            </div>
            <div class="ui-g-12 card">
                <!--<p:messages autoUpdate="true" closable="true" showDetail="false"/>-->

                <h:form id="pmOrderListForm">
                    <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                        <p:commandButton value="#{msg.All}"  process="@this" update="datalist buttonSet :pmOrderDetailForm" actionListener="#{v2PmOrderController.searchList(-1)}" disabled="#{v2PmOrderController.queryIndex==-1}" rendered="true"/>

                        <p:commandButton value="创建保养" actionListener="#{v2PmOrderController.createPMRequest()}" process="@this" update="datalist buttonSet :pmOrderDetailForm :PmRequestCreateForm"  oncomplete="PF('createPMDialog').show()" />

                        <p:commandButton value="待派工"  process="@this" update="datalist buttonSet :pmOrderDetailForm" actionListener="#{v2PmOrderController.searchList(2)}" disabled="#{v2PmOrderController.queryIndex==2}" rendered="#{userContextService.isDispatcher() or userContextService.hasRole('AssetHead')}"/>

                        <p:commandButton value="待接单"  process="@this" update="datalist buttonSet :pmOrderDetailForm" actionListener="#{v2PmOrderController.searchList(3)}" disabled="#{v2PmOrderController.queryIndex==3}" rendered="true"/>

                        <p:commandButton value="抢单"  process="@this" update="datalist buttonSet :pmOrderDetailForm" actionListener="#{v2PmOrderController.searchList(31)}" disabled="#{v2PmOrderController.queryIndex==31}" rendered="true"/>

                        <!--<p:commandButton value="待验收"  process="@this" update="datalist buttonSet :pmOrderDetailForm" actionListener="#{v2PmOrderController.searchList(5)}" disabled="#{v2PmOrderController.queryIndex==5}" rendered="true"/>-->
                        <p:commandButton value="保养中"  process="@this" update="datalist buttonSet :pmOrderDetailForm" actionListener="#{v2PmOrderController.searchList(0)}" disabled="#{v2PmOrderController.queryIndex==0}" rendered="true"/>


                        <p:commandButton value="待审核"  process="@this" update="datalist buttonSet :pmOrderDetailForm" actionListener="#{v2PmOrderController.searchList(8)}" disabled="#{v2PmOrderController.queryIndex==8}" rendered="true"/>

                        <p:commandButton value="待关单"  process="@this" update="datalist buttonSet :pmOrderDetailForm" actionListener="#{v2PmOrderController.searchList(6)}" disabled="#{v2PmOrderController.queryIndex==6}" rendered="true"/>


                        <p:commandButton value="已关单"  process="@this" update="datalist buttonSet :pmOrderDetailForm" actionListener="#{v2PmOrderController.searchList(7)}" disabled="#{v2PmOrderController.queryIndex==7}" rendered="true"/>

                    </h:panelGrid>
                    <p:dataTable id="datalist" value="#{v2PmOrderController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{v2PmOrderController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="10" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="10,20,30,90">

                        <p:ajax event="rowSelect" listener="#{v2PmOrderController.onSelectPmOrder()}" update=":pmOrderDetailForm"/>
                        <p:ajax event="filter" listener="#{v2PmOrderController.onFilter}" update="datalist :pmOrderDetailForm"/>

                        <p:column headerText="资产名称" sortBy="#{item.assetName}" filterBy="#{item.assetName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>

                        <p:column headerText="设备编号(院方)" sortBy="#{item.assetInfo.departNum}" filterBy="#{item.assetInfo.departNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.departNum}"/>
                        </p:column>

                        <p:column headerText="使用科室" sortBy="#{item.assetInfo.clinicalDeptName}" filterBy="#{item.assetInfo.clinicalDeptName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.clinicalDeptName}"/>
                        </p:column>

                        <p:column headerText="创建人" sortBy="#{item.creatorName}" filterBy="#{item.creatorName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.creatorName}"/>
                        </p:column>

                        <p:column headerText="负责人" sortBy="#{item.ownerName}" filterBy="#{item.ownerName}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.ownerName}"/>
                        </p:column>

                        <p:column headerText="保养编号" sortBy="#{item.pmNum}" filterBy="#{item.pmNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.pmNum}"/>
                        </p:column>
                        <p:column headerText="当前处理步骤"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.currentStepName}"/>
                        </p:column>
                        <p:column headerText="当前处理人"  filterMatchMode="LIKE" filterBy="#{item.currentPersonName}">
                            <h:outputText value="#{item.currentPersonName}"/>
                        </p:column>
                        <p:column headerText="计划完成时间"  sortBy="#{item.planTime}" filterMatchMode="LIKE" filterBy="#{item.planTime}">
                            <h:outputText value="#{item.planTime}">
                            <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                       <!-- <p:column headerText="价格"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.totalPrice}"/>
                        </p:column>-->
                        <p:column headerText="操作" rendered="#{v2PmOrderController.queryIndex==2 and (userContextService.isDispatcher() or userContextService.hasRole('AssetHead'))}">
                            <p:commandButton value="派工" actionListener="#{v2PmOrderController.prepareAct(item.id)}" update=":dispatchDialogForm" oncomplete="PF('dispatchDialog').show()"/>
                        </p:column>

                        <p:column headerText="操作" rendered="#{v2PmOrderController.queryIndex==3}">
                            <p:commandButton disabled="#{item.currentPersonId!=userContextService.loginUserUid}" value="接单" actionListener="#{v2PmOrderController.prepareAct(item.id)}" update=":takeOrderDialogForm" oncomplete="PF('takeOrderDialog').show()"/>
                        </p:column>

                        <p:column headerText="操作" rendered="#{v2PmOrderController.queryIndex==31}">
                            <p:commandButton  value="抢单" actionListener="#{v2PmOrderController.prepareAct(item.id)}" update=":takeOrderDialogForm" oncomplete="PF('takeOrderDialog').show()"/>
                        </p:column>

                        <p:column headerText="操作" rendered="#{v2PmOrderController.queryIndex==0}">
                            <p:commandButton value="保养"  actionListener="#{v2PmOrderController.prepareCompleteOrder(item.id)}" disabled="#{item.approvalStatus==1 or item.currentPersonId!=userContextService.loginUserUid}" update=":pmrepairCompleteDialogForm" oncomplete="PF('pmrepairCompleteDialog').show()"/>
                        </p:column>


                        <p:column headerText="操作" rendered="#{v2PmOrderController.queryIndex==8}">
                            <p:commandButton value="同意" disabled="#{item.approvalStatus!=1}" actionListener="#{v2PmOrderController.approvePMorder(item,'pass')}" update=":pmOrderListForm"/>
                            <p:commandButton value="不同意" disabled="#{item.approvalStatus!=1}" actionListener="#{v2PmOrderController.approvePMorder(item,'reject')}"  update=":pmOrderListForm"/>
                        </p:column>


                        <p:column headerText="操作" rendered="#{v2PmOrderController.queryIndex==6}">
                            <p:commandButton value="关单" actionListener="#{v2PmOrderController.prepareAct(item.id)}" update=":pmOrderListForm" oncomplete="PF('closePmDialog').show()" />
                            <!--actionListener="#{v2PmOrderController.closePM(item)}"-->

                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="PmOrder_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
              <ui:include src="pmOrderView.xhtml"/>
                <ui:include src="pmRepairCompleteDlg.xhtml"/>

            </div>
        </div>

        <p:dialog id="createPMDialog" widgetVar="createPMDialog" modal="true"  resizable="true" draggable="true" width="80%" height="450"   header="新增保养" >
            <h:form id="PmRequestCreateForm">
                <p:fieldset legend="#{msg.Create}保养">
                    <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">#{msg.assetName}*</label>
                            <p:inputText  id="assetName" readonly="true" value="#{v2PmOrderController.assetName}" placeholder="#{msg.noAssetSelected}" required="true" requiredMessage="#{msg.assetName} #{msg.ValidationRequire}"/>


                            <p:commandButton class="popupIconButton" actionListener="#{selectAssetController.prepareDialogCallback(v2PmOrderController, ':PmRequestCreateForm')}"  process="@this" icon="ui-icon-arrow-drop-down" update="selectAssetDlgPM dptName" oncomplete="PF('varSelectAssetDlgPM').show();"/>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class="label">资产使用科室</label>
                            <p:outputLabel id="dptName"  value="#{v2PmOrderController.dptName}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">计划完成时间*</label>
                            <p:calendar timeZone="GMT+8" id="fillDate" pattern="yyyy/MM/dd"  value="#{v2PmOrderController.planTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="计划完成时间 #{msg.ValidationRequire}"></p:calendar>
                        </h:panelGroup>
                    <h:panelGroup >
                        <p:commandButton value="#{msg.Save}" icon="ui-icon-check" actionListener="#{v2PmOrderController.createPM()}" validateClient="true" update=":pmOrderListForm :PmRequestCreateForm :growl" style="float:left" oncomplete="handleSubmit(args, 'createPMDialog');"/>
                        <p:commandButton value="#{msg.Return}" icon="ui-icon-arrow-back" actionListener="#{v2PmOrderController.cancel()}" immediate="true"  style="float:left" oncomplete="handleSubmit(args, 'createPMDialog');"/>
                    </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>
            </h:form>
            <ui:include src="/portal/asset/selectAssetDialogPM.xhtml"/>
        </p:dialog>

        <!--关单对话框-->
        <p:dialog id="closePmDialog" widgetVar="closePmDialog" modal="true" width="400"  resizable="true" draggable="true" appendTo="@(body)" header="关单">
            <h:form id="closePmDialogForm" >
                <h:panelGroup id="display3" >
                    <p:selectOneRadio id="console"  value="#{v2PmOrderController.selectedPmOrder.qualityChecking}">
                        <f:selectItem itemLabel="合格" itemValue="1" />
                        <f:selectItem itemLabel="不合格" itemValue="2" />
                    </p:selectOneRadio>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.closePM(v2PmOrderController.selectedPmOrder)}" value="确认关单" update=":takeOrderDialogForm :growl :pmOrderListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'closePmDialog');"/>

                        <p:commandButton immediate="true" value="去报修" actionListener="#{v2PmOrderController.createServiceRequest(v2PmOrderController.selectedPmOrder)}" update=":ServiceRequestCreateForm"  onclick="PF('createSRDialog').show();PF('closePmDialog').hide()"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{v2PmOrderController.cancel()}" icon="ui-icon-cancel" onclick="PF('closePmDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
          <!--  <ui:include src="/portal/woMgr/srCreate.xhtml"/>-->

            <ui:include src="srCreatePM.xhtml"/>
        </p:dialog>


        <p:dialog id="ackDialog" widgetVar="ackDialog" modal="true" width="550"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.Acknowledge}">
            <h:form id="ackDialogForm" >
                <h:panelGroup id="display" rendered="#{not empty v2PmOrderController.selectedPmOrder}">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup >
                            <label class="label">#{msg.comments}</label>
                            <p:inputTextarea value="#{v2PmOrderController.failReason}" maxlength="256"  required="true" requiredMessage="#{msg.comments}#{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup id="assetstatus">
                            <label class="label">#{msg.status}</label>
                            <p:selectOneRadio id="status" value="#{v2PmOrderController.currentStatus}" required="true" requiredMessage="#{msg.status} #{msg.ValidationRequire}">
                                <p:ajax  listener="#{v2PmOrderController.onStatusChange()}"  update="assetstatus" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetStatus')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneRadio>
                            <p:calendar timeZone="GMT+8" label="#{msg.confirmedDownTime}" rendered="#{v2PmOrderController.needConfirmTime}"  id="confirmedDownTime" pattern="yyyy/MM/dd HH:mm" value="#{v2PmOrderController.confirmedDownTime}" showOn="button"
                                        readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="#{msg.confirmedDownTime} #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton immediate="true" validateClient="false" actionListener="#{v2PmOrderController.ackWorkOrder()}" value="#{msg.AckPass}" update=":woMgrListForm ackDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'ackDialog');"/>
                        <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.rejectWorkOrder()}" value="#{msg.AckNoPass}" update=":woMgrListForm ackDialogForm :growl"  oncomplete="handleSubmit(args, 'ackDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{v2PmOrderController.cancel()}" icon="ui-icon-cancel" onclick="PF('ackDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
        <!--派工对话框-->
        <p:dialog id="dispatchDialog" widgetVar="dispatchDialog" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.dispatchWorkOrder}">
            <h:form id="dispatchDialogForm" >
                <h:panelGroup id="display8" >
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">保养人*</label>
                            <p:selectOneMenu  value="#{v2PmOrderController.selectedPmOrder.currentPersonId}" required="true" requiredMessage="#{msg.intExtType} #{msg.ValidationRequire}">
                                <f:selectItems value="#{v2PmOrderController.getWorkerList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">计划完成时间*</label>
                            <p:calendar timeZone="GMT+8" id="fillDate2" pattern="yyyy/MM/dd HH:mm:ss"  value="#{v2PmOrderController.selectedPmOrder.planTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="计划完成时间 #{msg.ValidationRequire}"></p:calendar>
                        </h:panelGroup>

                    </p:panelGrid>
                    <br/>
                    <h:panelGroup>
                      <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.dispatchWorkOrder()}" value="#{msg.dispatchWorkOrder}" update=":pmOrderListForm :pmOrderDetailForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'dispatchDialog');"/>
                       <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('dispatchDialog').hide()"/>
                   </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
<!--接单对话框-->
        <p:dialog id="takeOrderDialog" widgetVar="takeOrderDialog" modal="true" width="400"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.takeorder}">
            <h:form id="takeOrderDialogForm" >
                <h:panelGroup id="display1" rendered="#{not empty v2PmOrderController.selectedPmOrder}">
                    <h:panelGroup>
                        <label class="label">计划完成时间*</label>
                        <p:calendar timeZone="GMT+8" id="fillDate3" pattern="yyyy/MM/dd"  value="#{v2PmOrderController.selectedPmOrder.planTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="计划完成时间 #{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                    <br/>
                    <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{v2PmOrderController.acceptWorkOrder()}" value="接单" update=":takeOrderDialogForm :growl :pmOrderListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'takeOrderDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{v2PmOrderController.cancel()}" icon="ui-icon-cancel" onclick="PF('takeOrderDialog').hide()"/>
                    </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:define>

</ui:composition>
