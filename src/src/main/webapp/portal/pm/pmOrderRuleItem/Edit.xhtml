<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="PmOrderRuleItemEditDlg" widgetVar="PmOrderRuleItemEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{pmOrderRuleItemController.CRUDActionName} #{msg.PmOrderRuleItem}">
            <h:form id="PmOrderRuleItemEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{pmOrderRuleItemController.selected != null}">
                        <h:panelGroup>
                            <label>#{msg.name} ：</label>
                            <p:inputText id="name" value="#{pmOrderRuleItemController.selected.name}" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <label>#{msg.period} ：</label>
                            <p:inputText id="period" value="#{pmOrderRuleItemController.selected.period}" />
                        </h:panelGroup>
                    </p:panelGrid>
                    <p:commandButton validateClient="true" actionListener="#{pmOrderRuleItemController.save}" value="#{msg.Save}" update="display,:PmOrderRuleItemEditDlg, :PmOrderRuleItemListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'PmOrderRuleItemEditDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('PmOrderRuleItemEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
