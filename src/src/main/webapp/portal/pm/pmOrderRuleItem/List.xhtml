<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">
				<div class="ui-g-12 card cardTitle">
                	<p:outputLabel class="pageTitle" value="#{msg.PmOrderRuleItem}"/>
            	</div>
            <h:form id="PmOrderRuleItemListForm">
                <p:dataTable id="datalist" value="#{pmOrderRuleItemController.lazyModel}" var="item" widgetVar="varDataList"
                    selectionMode="single" selection="#{pmOrderRuleItemController.selected}"
                    lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                    rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                    paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                    currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                    rows="20" emptyMessage="#{msg.noRecordFound}"
                    rowsPerPageTemplate="20,50,100,500">

                    <p:ajax event="rowSelect" update="createButton editButton deleteButton"/>
                    <p:column headerText="#{msg.name}" sortBy="#{item.name}" >
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column headerText="#{msg.period}（单位：月）" sortBy="#{item.period}" >
                        <h:outputText value="#{item.period}"/>
                    </p:column>
					<p:column headerText="备注" sortBy="#{item.remark}" >
                        <h:outputText value="#{item.remark}"/>
                    </p:column>
                    <f:facet name="{Toolbar}">
                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{pmOrderRuleItemController.prepareCreate}" update=":PmOrderRuleItemEditDlg" oncomplete="PF('PmOrderRuleItemEditDialog').show()"/>
                        <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}" actionListener="#{pmOrderRuleItemController.prepareEdit}" update=":PmOrderRuleItemEditDlg" oncomplete="PF('PmOrderRuleItemEditDialog').show()" disabled="#{empty pmOrderRuleItemController.selected}"/>
                        <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray" title="#{msg.Delete}" actionListener="#{pmOrderRuleItemController.delete()}" update="datalist"  disabled="#{empty pmOrderRuleItemController.selected}">
                        	<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/> 
                        </p:commandButton>
                        <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist" fileName="PmOrderRuleItem_export"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>

            <ui:include src="Edit.xhtml"/>
           <!--  <ui:include src="View.xhtml"/> -->

            </div>
        </div>
        
    </ui:define>

</ui:composition>
