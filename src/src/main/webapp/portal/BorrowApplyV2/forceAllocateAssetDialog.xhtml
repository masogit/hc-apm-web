<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="forceAllocateAssetDialog" widgetVar="forceAllocateAssetDialog" modal="true" width="400"  resizable="true" draggable="true" appendTo="@(body)" header="强制调拨">
            <h:form id="forceAllocateAssetDialogForm" >
                <h:panelGroup id="display1">
                   <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class='label'>请求类型*</label>
                            <p:selectOneRadio id="chargingType" required="true"  value="#{assetInfoController.selected.sharedAssetReqDetail.leaseRequest.type}" requiredMessage="#{msg.ValidationRequire}">
                                <f:selectItem itemLabel="维修" itemValue="1" />
                                <f:selectItem itemLabel="补登记" itemValue="2" />
                            </p:selectOneRadio>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">借用科室*</label>
                            <p:autoComplete dropdown="true" value="#{assetInfoController.filterOrgName}"
                                            required="true" requiredMessage="借用科室 #{msg.ValidationRequire}"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{assetInfoController.autoCompleteDeptName}" size="8">
                                <p:ajax process="@this" listener="#{assetInfoController.onClinicalDeptNameFilterChange}" event="itemSelect"/>
                                <p:ajax process="@this" listener="#{assetInfoController.onClinicalDeptNameFilterChange}"/>
                            </p:autoComplete>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">计费开始时间*</label>
                            <p:calendar timeZone="GMT+8" id="chargingBeginTime" pattern="yyyy/MM/dd HH:mm:ss"  value="#{assetInfoController.selected.sharedAssetReqDetail.chargingBeginTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="计费开始时间 #{msg.ValidationRequire}"></p:calendar>
                        </h:panelGroup>
                        <h:panelGroup rendered="false">
                            <label class="label">计费结束时间</label>
                            <p:calendar timeZone="GMT+8" id="chargingEndTime" pattern="yyyy/MM/dd HH:mm:ss" value="#{assetInfoController.selected.sharedAssetReqDetail.chargingEndTime}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="false"></p:calendar>
                        </h:panelGroup>
                   </p:panelGrid>
                   <h:panelGroup>
                        <p:commandButton validateClient="true" actionListener="#{assetInfoController.forceAllocateAsset()}" value="确认" update="AssetInfoListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'forceAllocateAssetDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('forceAllocateAssetDialog').hide()"/>
                   </h:panelGroup>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
