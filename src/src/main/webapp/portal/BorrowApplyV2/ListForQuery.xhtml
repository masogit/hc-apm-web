<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"

    <ui:define name="preRenderView">
        <f:metadata>
            <f:viewParam name="assetStatus" value="#{assetInfoController.filterAssetStatus}"/>
            <f:viewParam name="model" value="#{assetInfoController.filterWarrantyDate}"/>
            <f:viewParam name="assetId" value="#{assetInfoController.assetId}"/>
        </f:metadata>
        <f:event type="preRenderView" listener="#{assetInfoController.setAssetStatusFilter()}"/>
    </ui:define>

    <ui:define name="content">
        <div class="ui-g">

                <p:outputLabel class="pageTitle" value="在借设备列表"/>

            <div class="ui-g-12 card">

                            <p:ajax event="keyup" update=":AssetInfoListForm searchButtons" />
                        </p:inputText>

                        <h:panelGroup id='searchButtons'>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm"  rendered="#{empty assetInfoController.oneSearchStr}"/>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm" actionListener="#{assetInfoController.setOneSearchStr('')}" rendered="#{not empty assetInfoController.oneSearchStr}"/>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
                <h:form id="AssetInfoListForm">

                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"

                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax  event="rowSelect" listener="#{assetInfoController.onSelectAsset}" onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)" update="editButton viewButton deleteButton "/>
                        <p:ajax event="filter" listener="#{assetInfoController.onFilter}" oncomplete="rc();"/>
                        <p:ajax event="page" oncomplete="rc2();"/>
                        <p:column headerText="借用详情">

                            oncomplete="openSwapTypeViewWindow(xhr, status, args)" />
                        </p:column>
                        <p:column rendered="false" exportable="false" width="#{userContextService.hasRole('AssetHead')?130:53}">
                            <!--<p:commandButton icon="ui-icon-remove-red-eye" class="btn btn-sm btn-gray" title="#{msg.View}" action="#{assetInfoController.getDetailPage(item.id,item.name)}" style="width:26px;height: 26px"/>-->

                                    <p:graphicImage name="icons/edit.png" style="width: 30px; height: 30px;"/>
                                </p:link>
                                <p:commandLink rendered="false" id="deleteButton" title="#{msg.Delete}"  actionListener="#{assetInfoController.deleteAsset(item)}" update="datalist">

                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-warning"/>
                                </p:commandLink>
                            </h:panelGroup>
                            <p:commandButton id="cancleWarranty" process="@this" title="取消保修提醒" actionListener="#{assetInfoController.cancleWarranty(item.id)}" update="datalist" rendered="#{!empty assetInfoController.filterWarrantyDate and item.warranty}" icon="ui-icon-notifications-off">
                                <p:confirm header="取消保修提醒" message="确定取消该设备保修提醒？" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </p:column>
                        <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>

                        </p:column>

                                </p:selectOneMenu>
                            </f:facet>

                            <h:outputText value="#{item.clinicalDeptName}"/>

                        <p:column headerText="#{msg.nationalStandardCode}"  visible="false" exportable="true">

                                </p:selectOneMenu>

                                <p:fileDownload value="#{assetInfoController.zipFile}" />
                            </p:commandButton>-->

                                <p:commandButton rendered="false" id="batchToBeTerminatedButton" icon="ui-icon-delete" class="btn btn-sm btn-gray" title="批量待报废" actionListener="#{assetInfoController.batchProcessToBeTerminated}" update=":AssetInfoListForm">

                                </p:commandButton>
                                <p:commandButton rendered="false" id="batchToTerminatedButton" icon="ui-icon-delete-forever" class="btn btn-sm btn-gray" title="批量报废" actionListener="#{assetInfoController.batchProcessToTerminated}" update=":AssetInfoListForm">
                                    <p:confirm header="批量报废确认" message="您确定要报废选定的记录么?" icon="ui-icon-warning"/>
                                </p:commandButton>
                            </ui:fragment>

                        </f:facet>
                    </p:dataTable>
