<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="preRenderView">
        <f:metadata>
            <f:viewParam name="assetStatus" value="#{assetInfoController.filterAssetStatus}"/>
            <f:viewParam name="model" value="#{assetInfoController.filterWarrantyDate}"/>
            <f:viewParam name="assetId" value="#{assetInfoController.assetId}"/>
        </f:metadata>
        <f:event type="preRenderView" listener="#{assetInfoController.setAssetStatusFilter()}"/>
    </ui:define>

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="设备库存情况"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <h:panelGrid id="searchPanel" columns="4">
                        <p:inputText id="searchText" value="#{assetInfoController.oneSearchStr}" placeholder="#{msg.name}/#{msg.departNum}/#{msg.financingNum}/#{msg.qrCode}/#{msg.serialNum}/#{msg.manufacture}/#{msg.clinicalDeptName}" maxlength="100" style="width: 500px">
                            <p:ajax event="keyup" update=":AssetInfoListForm searchButtons" />
                        </p:inputText>
                        <h:panelGroup id='searchButtons'>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-search" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm"  rendered="#{empty assetInfoController.oneSearchStr}"/>
                            <p:commandButton style="zoom:0.8" icon="ui-icon-close" class="btn btn-sm btn-gray" update=":AssetInfoListForm :searchForm" actionListener="#{assetInfoController.setOneSearchStr('')}" rendered="#{not empty assetInfoController.oneSearchStr}"/>
                        </h:panelGroup>
                        
                    </h:panelGrid>
                </h:form>
                <h:form id="AssetInfoListForm">
                    <h:panelGrid id="searchPanel2" columns="4">
                         <p:commandButton value="#{msg.All}"  process="@this" update="datalist searchPanel2" actionListener="#{assetInfoController.searchList(-1)}" rendered="true" disabled="#{assetInfoController.queryIndex == -1}"/>
                        <p:commandButton value="正常可借用"  process="@this" update="datalist searchPanel2" actionListener="#{assetInfoController.searchList(1)}"  rendered="true" disabled="#{assetInfoController.queryIndex == 1}"/>
                        <p:commandButton value="正常已借出"  process="@this" update="datalist searchPanel2" actionListener="#{assetInfoController.searchList(2)}"  rendered="true" disabled="#{assetInfoController.queryIndex == 2}"/>
                        <p:commandButton value="故障不可借用"  process="@this" update="datalist searchPanel2" actionListener="#{assetInfoController.searchList(3)}"  rendered="true" disabled="#{assetInfoController.queryIndex == 3}"/>
                       
                    </h:panelGrid>
                    
                    <p:dataTable id="datalist" value="#{assetInfoController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{assetInfoController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}" 
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500" >

                        <p:ajax event="rowSelect" listener="#{assetInfoController.onSelectAsset}" onstart="prepareAssetViewWindow();" oncomplete="openAssetViewWindow(xhr, status, args)" update="editButton viewButton"/>
                        <p:ajax event="filter" listener="#{assetInfoController.onFilter}" oncomplete="rc();"/>
                       
                        <p:column headerText="借用科室" sortBy="#{item.clinicalDeptUID}">
                            <h:outputText value="#{item.sharedAssetReqDetail.clinicalDept.name}"/>
                        </p:column>

                        <p:column headerText="设备名称" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column headerText="设备编号" sortBy="#{item.departNum}" filterBy="#{item.departNum}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.departNum}"/>
                        </p:column>
                        <p:column headerText="调剂设备名称">
                            <h:outputText value="#{item.sharedAssetType.swapName}"/>
                        </p:column>

                        <p:column headerText="计费开始时间">
                            <h:outputText value="#{item.sharedAssetReqDetail.chargingBeginTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="计费结束时间">
                            <h:outputText value="#{item.sharedAssetReqDetail.chargingEndTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd HH:mm" />
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="单价">
                            <h:outputText value="#{item.sharedAssetType.unitPrice}"/>
                        </p:column>
                        
                        <p:column headerText="计价方式">
                            <h:outputText value="#{fieldMsg.fieldValue('chargingType',item.sharedAssetType.chargingType)=='' ? '' : fieldMsg.fieldValue('chargingType',item.sharedAssetType.chargingType)}"/>
                        </p:column>
                        
                        <p:column headerText="使用时长">
                            <h:outputText value="#{item.sharedAssetReqDetail.rentalTime}"/>
                        </p:column>
                        
                        <p:column headerText="当前费用">
                            <h:outputText value="#{item.sharedAssetReqDetail.totalAmount}"/>
                        </p:column>
                        
                        <p:column headerText="#{msg.Actions}">
	                        <p:commandButton value="强制调拨" actionListener="#{assetInfoController.prepareForceAllocateAsset(item.uid)}" rendered="#{(item.status == 1 || item.status == 3) and (item.assetDeptUID.equals(item.clinicalDeptUID))}" update="forceAllocateAssetDialog" oncomplete="PF('forceAllocateAssetDialog').show()"/>
	                        <p:commandButton value="强制归还" actionListener="#{assetInfoController.prepareForceReturnAsset(item.uid)}" rendered="#{(item.status == 1 || item.status == 3) and (!item.assetDeptUID.equals(item.clinicalDeptUID))}" update="forceReturnAssetDialog" oncomplete="PF('forceReturnAssetDialog').show()"/>
	                    </p:column>
                        
                        <f:facet name="{Toolbar}">
                            <p:commandButton rendered="false" id="viewButton" icon="ui-icon-remove-red-eye" class="btn btn-sm btn-gray" title="#{msg.View}" actionListener="#{assetInfoController.getDetailPage()}"  action="#{urlEncryptController.encodeUrlParam(assetInfoController.operation)}"  disabled="#{empty assetInfoController.selected}" />
                            <p:commandButton rendered="false" id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" title="#{msg.Edit}"  actionListener="#{assetInfoController.getViewPage('Create','Edit')}"  action="#{urlEncryptController.encodeUrlParam(assetInfoController.operation)}"  disabled="#{empty assetInfoController.selected}" />
                            <!-- <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                                <p:dataExporter type="xls" target=":AssetInfoListForm:exportTable" fileName="AssetInfo_export"/>
                            </p:commandButton> -->
                        </f:facet>
                    </p:dataTable>

                    <p:remoteCommand name="rc" update="datalist:editButton datalist:viewButton" immediate="true"/>
                    <p:remoteCommand name="rc2" update=":AssetInfoListForm:datalist"/>
                   
                </h:form>
            </div>
        </div>
        
        <ui:include src="forceAllocateAssetDialog.xhtml"/>
        <ui:include src="forceReturnAssetDialog.xhtml"/>

        <script>
            afterPageLoad = function () {
                $("#searchForm\\:searchText").keypress(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                    }
                });
            }

            var newWin;
            function prepareAssetViewWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }

            function openAssetViewWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }

        </script>
    </ui:define>
</ui:composition>
