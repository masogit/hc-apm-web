<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <style type="text/css">
            .grid-radio td {
                padding: .5rem;
            }
            .grid-box td {
                padding: .5rem;
            }
            .legend {
                display: inline-block;
                width: 1.5rem;
                height: 1.5rem;
                border-radius: .25rem;
                vertical-align: sub;
            }
            .radiolabelPF {
                margin-left: 7px;
                margin-right: 40px;
            }
        </style>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="不良事件上报"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="AdverseEventSearchForm">
                    <p:accordionPanel id="accordion" multiple="false" rendered="#{adverseEventManagementController.renderedSearchForm}">
                        <p:tab title="设备筛选列表">
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <h:panelGroup>
                                    <label class="label">#{msg.hospitalId}<span style="color:red">*</span></label>
                                    <p:inputText id="selectedUserOrgName" value="#{adverseEventManagementController.selectSite}" required="true" readonly="true" class="SiteUIDChange"/>
                                    <p:commandButton id="btnOrg" type="button" icon="fa fa-angle-down" iconPos="right"/>
                                    <p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" modal="false">
                                        <p:inputText id="treeNodeNameFilter" value="#{orgTreeController.treeNodeNameFilter}"/>
                                        <p:commandButton partialSubmit="true" icon="ui-icon-search" process=":AdverseEventSearchForm:accordion:treeNodeNameFilter @this" update=":AdverseEventSearchForm:accordion:orgTree" actionListener="#{orgTreeController.filterNodeByName()}" value="#{msg.Search}"/>
                                        <p:scrollPanel style="height:300px;border: 0" mode="native">
                                            <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{orgTreeController.siteOrgTree}" selection="#{orgTreeController.selectedOrgNode}" var="node" selectionMode="single" dynamic="true">
                                                <p:ajax process="@this" event="select" listener="#{adverseEventManagementController.onSelectSiteTreeNode}" update="@(.SiteUIDChange) @(.siteFilterChange)" oncomplete="PF('varPanelOrg').hide();"/>
                                                <p:ajax process="@this" event="expand"/>
                                                <p:ajax process="@this" event="collapse"/>
                                                <p:treeNode type="org">
                                                    <h:outputText value="#{node.name}"/>
                                                </p:treeNode>
                                                <p:treeNode type="hidden" rendered="false"/>
                                            </p:tree>
                                        </p:scrollPanel>
                                    </p:overlayPanel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.clinicalDeptName}</label>
                                    <p:autoComplete dropdown="true" value="#{adverseEventManagementController.filterClinicalDeptOrg}"
                                                    scrollHeight="300"  forceSelection="true"  completeMethod="#{adverseEventManagementController.autoCompleteDeptName}"
                                                    var="t" itemLabel="#{t}" itemValue="#{t}" class="siteFilterChange">
                                        <p:ajax event="itemSelect" listener="#{adverseEventManagementController.onClinicalDeptNameFilterChange}" process="@this"   />
                                        <p:ajax process="@this" listener="#{adverseEventManagementController.onClinicalDeptNameFilterChange}"  />
                                    </p:autoComplete>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">#{msg.assetGroup}</label>
                                    <p:selectOneMenu id="assetGroup" value="#{adverseEventManagementController.assetGroup}">
                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" class="selectAssetGroup"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                        <p:ajax listener="#{adverseEventManagementController.assetGroupChangeListener}"  />
                                    </p:selectOneMenu>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">#{msg.functionType}</label>
                                    <p:inputText id="functionType" value="#{adverseEventManagementController.functionType}">
                                    </p:inputText>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">设备或者二维码名称模糊匹配</label>
                                    <p:inputText id="assetNameOrQrcode" value="#{adverseEventManagementController.assetName}">
                                    </p:inputText>
                                </h:panelGroup>
                            </p:panelGrid>
                            <h:panelGrid>
                                <p:commandButton value="搜索设备" action="#{adverseEventManagementController.assetList()}" update="dataList AdverseEventCreateForm" validateClient="true"  style="float:left" disabled="#{adverseEventManagementController.selected.adverseEventType eq '2'}" />
                            </h:panelGrid>
                            <p:panelGrid columns="1" >
                                <p:dataTable id="dataList" class="dataList" value="#{adverseEventManagementController.assets}" selectionMode="single" var="item"
                                             scrollHeight="200"
                                             scrollable="true"
                                             selection="#{adverseEventManagementController.assetSelected}"
                                             widgetVar="dataList" lazy="false" paginator="false"
                                             rowKey="#{item.id}" emptyMessage="#{msg.noRecordFound}" >
                                    <p:ajax event="rowSelect" listener="#{adverseEventManagementController.onSelect}" update="AdverseEventCreateForm"/>
                                    <p:column headerText="设备名称">
                                        <h:outputText value="#{item.name}" />
                                    </p:column>
                                    <p:column headerText="二维码">
                                        <h:outputText value="#{item.qrCode}" />
                                    </p:column>
                                    <p:column headerText="设备型号">
                                        <h:outputText value="#{item.functionType}" />
                                    </p:column>
                                    <p:column headerText="设备编号">
                                        <h:outputText value="#{item.departNum}" />
                                    </p:column>
                                    <p:column headerText="科室">
                                        <h:outputText value="#{item.clinicalDeptName}" />
                                    </p:column>
                                </p:dataTable>
                            </p:panelGrid>
                        </p:tab>
                    </p:accordionPanel>
                </h:form>
                <h:form id="AdverseEventCreateForm">
                    <p:accordionPanel id="accordionCreate" multiple="true" activeIndex="0,1,2,3,4,5,6,7">
                        <p:tab title="报告人基本情况" closable="false">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup style="margin-left: 30px;">
                                    <label class="label">不良事件工单类型<span style="color:red">*</span></label>
                                    <p:selectOneRadio value="#{adverseEventManagementController.selected.adverseEventType}" id="adverseEventType" layout="custom" required="true" requiredMessage="不良事件工单类型不能为空"  disabled="true">
                                        <p:ajax event="change" update=":AdverseEventCreateForm:accordionCreate:repairReportSendPlaceGroup" />
                                        <f:selectItem itemValue="1" />
                                        <f:selectItem itemValue="2" />
                                    </p:selectOneRadio>
                                    <h:panelGroup>
                                        <p:radioButton for="adverseEventType" itemIndex="0"/>
                                        <h:outputLabel value="医疗器械不良事件" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:radioButton for="adverseEventType" itemIndex="1"/>
                                        <h:outputLabel value="医疗器械不良事件哨点监测" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </p:panelGrid>
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup rendered="#{not empty adverseEventManagementController.selected.id}">
                                    <label class="label">工单编号</label>
                                    <p:inputText id="workOrderNum" value="#{adverseEventManagementController.selected.workOrderNum}"  readonly="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">报告人姓名<span style="color:red">*</span></label>
                                    <p:inputText id="serialNum" value="#{adverseEventManagementController.selected.reporterName}" required="false" requiredMessage="报告人姓名不能为空" readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">报告日期<span style="color:red">*</span></label>
                                    <c:if test="#{adverseEventManagementController.readOnlyCreateForm}">
                                        <p:outputLabel value="#{adverseEventManagementController.selected.reportDate}" >
                                            <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                                        </p:outputLabel>
                                    </c:if>
                                    <c:if test="#{!adverseEventManagementController.readOnlyCreateForm}">
                                        <p:calendar timeZone="GMT+8"  id="reportDate" pattern="yyyy/MM/dd HH:mm" value="#{adverseEventManagementController.selected.reportDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"  required="false" requiredMessage="报告日期不能为空" disabled="true"/>
                                    </c:if>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">科室<span style="color:red">*</span></label>
                                    <p:inputText id="department" value="#{adverseEventManagementController.selectAdverseSite.name}" required="true" requiredMessage="科室不能为空" readonly="true" class="department" />
                                    <p:commandButton id="btnDept" type="button" icon="fa fa-angle-down" iconPos="right"  disabled="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    <p:overlayPanel widgetVar="varPanelDepartOrg" for="btnDept" hideEffect="fade" dynamic="false" modal="false">
                                        <p:scrollPanel style="height:300px;border: 0" mode="native">
                                            <p:tree id="departTree" class="tree" style="width:98%;border:0;" value="#{adverseEventManagementController.deptOrgTree}" var="node" selectionMode="single" dynamic="true">
                                                <p:ajax process="@this" event="select" listener="#{adverseEventManagementController.onAdverseSelectSiteTreeNode}" update="@(.department)" oncomplete="PF('varPanelDepartOrg').hide();"/>
                                                <p:ajax process="@this" event="expand"/>
                                                <p:ajax process="@this" event="collapse"/>
                                                <p:treeNode type="org">
                                                    <h:outputText value="#{node.name}"/>
                                                </p:treeNode>
                                                <p:treeNode type="hidden" rendered="false"/>
                                            </p:tree>
                                        </p:scrollPanel>
                                    </p:overlayPanel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">发生地</label>
                                    <p:inputText id="occurredPlace" value="#{adverseEventManagementController.selected.occurredPlace}"  readonly="true"/>
                                </h:panelGroup>
                                <h:panelGroup id="repairReportSendPlaceGroup" rendered="#{adverseEventManagementController.selected.adverseEventType eq '2'}">
                                    <label class="label">设备报修发生场地<span style="color:red">#{adverseEventManagementController.selected.adverseEventType eq '2' ? '*' : ''}</span></label>
                                    <p:selectOneMenu value="#{adverseEventManagementController.selected.repairReportSendPlace}" required="#{adverseEventManagementController.selected.adverseEventType eq '2' ? true :false}" readonly="true">
                                        <f:selectItem itemLabel="请选择"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('repairReportSendPlace')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>

                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="医疗器械情况">
                            <p:fieldset legend="医疗器械名称">
                                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                    <h:panelGroup>
                                        <label class="label">资产名称<span style="color:red">*</span></label>
                                        <p:inputText id="assetName" value="#{adverseEventManagementController.selected.assetName}" required="false"  requiredMessage="资产名称不能为空"  readonly="#{adverseEventManagementController.readOnlyCreateForm or not empty adverseEventManagementController.selected.woId}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">设备编号<span style="color:red">*</span></label>
                                        <p:inputText id="deviceNum" value="#{adverseEventManagementController.selected.deviceNum}" required="false"  requiredMessage="设备编号不能为空"  readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>
                            <p:fieldset legend="产品信息">
                                <p:selectOneRadio value="#{adverseEventManagementController.assetType}" id="assetType" layout="custom" >
                                    <p:ajax event="change" update=":AdverseEventCreateForm:accordionCreate:productInfo" />
                                    <f:selectItem itemValue="1" />
                                    <f:selectItem itemValue="2" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="assetType" itemIndex="0" disabled="#{adverseEventManagementController.assetTypeDisabledCheck('1')}" />
                                    <h:outputLabel value="设备" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="assetType" itemIndex="1" disabled="#{adverseEventManagementController.assetTypeDisabledCheck('2')}" />
                                    <h:outputLabel value="耗材" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="productInfo">
                                    <h:panelGroup>
                                        <label class="label">注册证编号<span style="color:red">*</span></label>
                                        <p:autoComplete id="registrationNum" value="#{adverseEventManagementController.selected.registrationNum}"
                                                        completeMethod="#{adverseEventManagementController.completeUdidRegistryNum}"
                                                        scrollHeight="160" panelStyleClass="max-width-200"
                                                        var="t" itemLabel="#{t}" itemValue="#{t}"
                                                        readonly="#{adverseEventManagementController.readOnlyCreateForm}">
                                            <p:ajax event="itemSelect" process="@this" listener="#{adverseEventManagementController.onUdidRegistryNumSelect}"
                                                    update=":AdverseEventCreateForm:accordionCreate:productInfo"/>
                                        </p:autoComplete>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">产品名称<span style="color:red">*</span></label>
                                        <p:inputText id="productName" value="#{adverseEventManagementController.selected.productName}" required="false"  requiredMessage="产品名称不能为空"  readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="false">
                                        <label class="label">曾用注册证编号</label>
                                        <p:inputText id="previouslyRegistrationNum" value="#{adverseEventManagementController.selected.previouslyRegistrationNum}" readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="false">
                                        <label class="label">曾用注册证编号是否上报</label>
                                        <p:selectOneRadio value="#{adverseEventManagementController.selected.previouslyRegistrationReport}" id="previouslyRegistrationReport" layout="custom" readonly="#{adverseEventManagementController.readOnlyCreateForm}">
                                            <p:ajax event="change" update="@this"/>
                                            <f:selectItem itemValue="true"/>
                                            <f:selectItem itemValue="false" />
                                        </p:selectOneRadio>
                                        <h:panelGroup>
                                            <p:radioButton for="previouslyRegistrationReport" itemIndex="0"/>
                                            <h:outputLabel value="是" styleClass="radiolabelPF"/>
                                        </h:panelGroup>
                                        <h:panelGroup>
                                            <p:radioButton for="previouslyRegistrationReport" itemIndex="1"/>
                                            <h:outputLabel value="否" styleClass="radiolabelPF"/>
                                        </h:panelGroup>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="false">
                                        <label class="label">产品类别</label>
                                        <p:inputText id="productCategory" value="#{adverseEventManagementController.selected.productCategory}"  readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="true">
                                        <label class="label">型号<span style="color:red">*</span></label>
                                        <p:inputText id="model" value="#{adverseEventManagementController.selected.model}" required="false" requiredMessage="型号不能为空"  readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="true">
                                        <label class="label">规格<span style="color:red">#{adverseEventManagementController.assetType == 2?'*':''}</span></label>
                                        <p:inputText id="standard" value="#{adverseEventManagementController.selected.standard}" required="false" requiredMessage="规格不能为空" readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventManagementController.assetType == 2}">
                                        <label class="label">产地<span style="color:red">#{adverseEventManagementController.assetType == 2?'*':''}</span></label>
                                        <p:inputText id="originPlace" value="#{adverseEventManagementController.selected.originPlace}" required="false" readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventManagementController.assetType == 1}">
                                        <label class="label">产品批号</label>
                                        <p:inputText id="productLotNum" maxlength="100" value="#{adverseEventManagementController.selected.productLotNum}"  readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventManagementController.assetType == 1}">
                                        <label class="label">产品编号<span style="color:red">*</span></label>
                                        <p:inputText id="productNum" maxlength="100" value="#{adverseEventManagementController.selected.productNum}"  readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventManagementController.assetType == 2}">
                                        <label class="label">批号<span style="color:red">#{adverseEventManagementController.assetType == 2?'*':''}</span></label>
                                        <p:inputText  maxlength="100" value="#{adverseEventManagementController.selected.productLotNum}" required="false" readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventManagementController.assetType == 2}">
                                        <label class="label">编号</label>
                                        <p:inputText maxlength="100" value="#{adverseEventManagementController.selected.productNum}"  readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">UDI<span style="color:red">#{adverseEventManagementController.assetType == 2?'*':''}</span></label>
                                        <p:inputText id="udi" value="#{adverseEventManagementController.selected.udi}" required="false" readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">生产日期<span style="color:red">*</span><span style="color:red">#{adverseEventManagementController.assetType == 2?'*':''}</span></label>
                                        <c:if test="#{adverseEventManagementController.readOnlyCreateForm}">
                                            <p:outputLabel value="#{adverseEventManagementController.selected.productionDate}" >
                                                <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                            </p:outputLabel>
                                        </c:if>
                                        <c:if test="#{!adverseEventManagementController.readOnlyCreateForm}">
                                            <p:calendar timeZone="GMT+8"  id="productionDate" pattern="yyyy/MM/dd" value="#{adverseEventManagementController.selected.productionDate}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="false" disabled="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                        </c:if>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="true">
                                        <label class="label">有效期至<span style="color:red">#{adverseEventManagementController.assetType == 2?'*':''}</span></label>
                                        <c:if test="#{adverseEventManagementController.readOnlyCreateForm}">
                                            <p:outputLabel value="#{adverseEventManagementController.selected.validUntil}" >
                                                <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                            </p:outputLabel>
                                        </c:if>
                                        <c:if test="#{!adverseEventManagementController.readOnlyCreateForm}">
                                            <p:calendar timeZone="GMT+8"  id="validUntil" pattern="yyyy/MM/dd" value="#{adverseEventManagementController.selected.validUntil}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="false" requiredMessage="有效期至不能为空"  disabled="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                        </c:if>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventManagementController.assetType == 2}">
                                        <label class="label">停用日期</label>
                                        <c:if test="#{adverseEventManagementController.readOnlyCreateForm}">
                                            <p:outputLabel value="#{adverseEventManagementController.selected.retirementDate}" >
                                                <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                            </p:outputLabel>
                                        </c:if>
                                        <c:if test="#{!adverseEventManagementController.readOnlyCreateForm}">
                                            <p:calendar timeZone="GMT+8"  id="retirementDate" pattern="yyyy/MM/dd" value="#{adverseEventManagementController.selected.retirementDate}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" disabled="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                        </c:if>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventManagementController.assetType == 1}">
                                        <label class="label">上市许可证持有人名称</label>
                                        <p:inputText id="marketingAuthHolder" value="#{adverseEventManagementController.selected.marketingAuthHolder}" readonly="#{adverseEventManagementController.readOnlyCreateForm}" />
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>
                            <p:fieldset legend="操作人" rendered="false">
                                <p:selectOneRadio value="#{adverseEventManagementController.selected.operator}" id="operator" layout="custom" readonly="#{adverseEventManagementController.readOnlyCreateForm}">
                                    <p:ajax event="change" update=":AdverseEventCreateForm:accordionCreate:operatorDescHi" />
                                    <f:selectItem itemValue="1" />
                                    <f:selectItem itemValue="2" />
                                    <f:selectItem itemValue="3" />
                                    <f:selectItem itemValue="4" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="0"/>
                                    <h:outputLabel value="医生" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="1"/>
                                    <h:outputLabel value="护士" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="2"/>
                                    <h:outputLabel value="患者" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="3"/>
                                    <h:outputLabel value="其他" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <p:panelGrid id="operatorDescHi" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup rendered="#{adverseEventManagementController.selected.operator == 4}">
                                        <label class="label">操作人描述</label>
                                        <p:inputText id="operatorDesc" maxlength="50" value="#{adverseEventManagementController.selected.operatorDesc}"  readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>
                        </p:tab>
                        <p:tab title="不良事件情况">

                            <p:fieldset legend="事发事件信息">
                                <h:panelGroup>
                                    <label class="label">事件发生日期<span style="color:red">*</span></label>
                                    <c:if test="#{adverseEventManagementController.readOnlyCreateForm}">
                                        <p:outputLabel value="#{adverseEventManagementController.selected.eventOccurredDate}" >
                                            <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                        </p:outputLabel>
                                    </c:if>
                                    <c:if test="#{!adverseEventManagementController.readOnlyCreateForm}">
                                        <p:calendar timeZone="GMT+8"  id="eventOccurredDate" pattern="yyyy/MM/dd" value="#{adverseEventManagementController.selected.eventOccurredDate}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="false" requiredMessage="事件发生日期不能为空" disabled="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </c:if>
                                </h:panelGroup>

                                    <label class="label">设备启用日期<span style="color:red">*</span></label>
                                    <c:if test="#{adverseEventManagementController.readOnlyCreateForm}">
                                        <p:outputLabel value="#{adverseEventManagementController.selected.deviceStartDate}" >
                                            <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                        </p:outputLabel>
                                    </c:if>
                                    <c:if test="#{!adverseEventManagementController.readOnlyCreateForm}">
                                        <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd" value="#{adverseEventManagementController.selected.deviceStartDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"  readonly="#{adverseEventManagementController.readOnlyCreateForm}" required="false" requiredMessage="设备启用日期不能为空"/>
                                    </c:if>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">维修方案具体内容</label>
                                    <p:inputText value="#{adverseEventManagementController.selected.maintenancePlanInfo}" maxlength="2000" readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">有效维护保养措施具体内容</label>
                                    <p:inputText value="#{adverseEventManagementController.selected.maintenanceMeasuresInfo}" maxlength="2000" readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">设备报废（停用）日期</label>
                                    <c:if test="#{adverseEventManagementController.readOnlyCreateForm}">
                                        <p:outputLabel value="#{adverseEventManagementController.selected.deviceEndDate}" >
                                            <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                        </p:outputLabel>
                                    </c:if>
                                    <c:if test="#{!adverseEventManagementController.readOnlyCreateForm}">
                                        <p:calendar timeZone="GMT+8" pattern="yyyy/MM/dd" value="#{adverseEventManagementController.selected.deviceEndDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"  readonly="#{adverseEventManagementController.readOnlyCreateForm}"/>
                                    </c:if>
                                </h:panelGroup>
                                <h:panelGroup id="maintenanceOrganizationInfoGroup">
                                    <label class="label">维修机构<span style="color:red">*</span></label>
                                    <p:selectOneRadio value="#{adverseEventManagementController.selected.maintenanceOrganization}" id="maintenanceOrganization" layout="custom" readonly="#{adverseEventManagementController.readOnlyCreateForm}" required="false" requiredMessage="维修机构不能为空">
                                        <p:ajax event="change" update=":AdverseEventCreateForm:accordionCreate:maintenanceOrganizationInfoGroup" />
                                        <f:selectItem itemValue="1"/>
                                        <f:selectItem itemValue="2" />
                                        <f:selectItem itemValue="3" />
                                    </p:selectOneRadio>
                                    <h:panelGroup>
                                        <p:radioButton for="maintenanceOrganization" itemIndex="0"/>
                                        <h:outputLabel value="持有人" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:radioButton for="maintenanceOrganization" itemIndex="1"/>
                                        <h:outputLabel value="第三方（请输入机构名称）" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:radioButton for="maintenanceOrganization" itemIndex="2"/>
                                        <h:outputLabel value="其他（请描述）" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventManagementController.selected.maintenanceOrganization eq '2' or adverseEventManagementController.selected.maintenanceOrganization eq '3'}">
                                        <label class="label">机构名称或描述<span style="color:red">#{adverseEventManagementController.selected.maintenanceOrganization eq '2' or adverseEventManagementController.selected.maintenanceOrganization eq '3' ? '*' : ''}</span></label>
                                        <p:inputText value="#{adverseEventManagementController.selected.maintenanceOrganizationInfo}" readonly="#{adverseEventManagementController.readOnlyCreateForm}" required="false" requiredMessage="机构名称或描述不能为空"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                                <h:panelGroup id="processingModeInfoGroup">
                                    <label class="label">故障处理方式<span style="color:red">*</span></label>
                                    <p:selectOneRadio value="#{adverseEventManagementController.selected.processingMode}" id="processingMode" readonly="#{adverseEventManagementController.readOnlyCreateForm}" required="false" requiredMessage="故障处理方式不能为空" >
                                        <p:ajax event="change" update=":AdverseEventCreateForm:accordionCreate:processingModeInfoGroup" />
                                        <f:selectItem itemValue="1" itemLabel="硬件维修或更换"/>
                                        <f:selectItem itemValue="2" itemLabel="软件升级"/>
                                        <f:selectItem itemValue="3" itemLabel="其他（请描述）"/>
                                    </p:selectOneRadio>
                                    <h:panelGroup rendered="#{adverseEventManagementController.selected.processingMode.contains('3')}">
                                        <label class="label">故障处理方式描述<span style="color:red">#{adverseEventManagementController.selected.processingMode eq '3' ? '*' : ''}</span></label>
                                        <p:inputText value="#{adverseEventManagementController.selected.processingModeInfo}" maxlength="2000" readonly="#{adverseEventManagementController.readOnlyCreateForm}" required="false" requiredMessage="故障处理方式描述不能为空"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <label class="label">使用次数</label>
                                    <p:spinner id="useCnt" value="#{adverseEventManagementController.selected.useCnt}" min="0" max="10000000" readonly="#{adverseEventManagementController.readOnlyCreateForm}" />
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:tab>

                        <p:tab title="审批记录" rendered="#{adverseEventManagementController.selected.status ne 1}">
                            <p:dataTable id="accessList" class="accessList" value="#{adverseEventManagementController.multiLevelApprovals}" var="item" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="审批单号">
                                    <h:outputText value="#{item.approvalNumber}"/>
                                </p:column>
                                <p:column headerText="业务单号">
                                    <h:outputText value="#{item.businessNumber}"/>
                                </p:column>
                                <p:column headerText="业务类型" >
                                    <h:outputText value="#{multiLevelApprovalGlobalController.getBusinessType(item)}"/>
                                </p:column>
                                <p:column headerText="实际审批人">
                                    <h:outputText value="#{item.actualApproverName}"/>
                                </p:column>
                                <p:column headerText="审批级别">
                                    <h:outputText value="#{item.approvalLevel}级审批人"/>
                                </p:column>
                                <!--采购管理不用显示审批意见-->
                                <p:column headerText="审批意见" rendered="#{multiLevelApprovalController.selected.businessType ne 17}">
                                    <h:outputText value="#{item.approvalOpinion}"/>
                                </p:column>
                                <p:column headerText="审批状态">
                                    <h:outputText value="#{multiLevelApprovalGlobalController.getApprovalStatus(item.approvalStatus)}"/>
                                </p:column>
                                <p:column headerText="审批节点状态">
                                    <h:outputText value="#{multiLevelApprovalGlobalController.getApprovalNodeStatus(item.approvalNodeStatus)}"/>
                                </p:column>
                                <p:column headerText="审批时间"  >
                                    <h:outputText value="#{item.actualApproverDate}">
                                        <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss"/>
                                    </h:outputText>
                                </p:column>

                            </p:dataTable>
                        </p:tab>
                    </p:accordionPanel>

                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup id="buttonGroup">
                            <p:commandButton value="暂存" actionListener="#{adverseEventManagementController.tempSaveAdverseEventCreate(1)}" icon="ui-icon-check" style="float:left" rendered="#{adverseEventManagementController.selected.status eq null or adverseEventManagementController.selected.status == 0 or adverseEventManagementController.selected.status == 1 or adverseEventManagementController.selected.status == 4}" validateClient="true" update="AdverseEventCreateForm AdverseEventSearchForm"/>
                            <p:commandButton value="提交" actionListener="#{adverseEventManagementController.tempSaveAdverseEventCreate(2)}" icon="ui-icon-check" style="float:left" rendered="#{adverseEventManagementController.selected.status eq null or adverseEventManagementController.selected.status == 0 or adverseEventManagementController.selected.status == 1 or adverseEventManagementController.selected.status == 4}" validateClient="true" update="AdverseEventCreateForm AdverseEventSearchForm"/>
                            <p:commandButton value="作废" actionListener="#{adverseEventManagementController.tempSaveAdverseEventCreate(5)}"  icon="ui-icon-clear" style="float:left" rendered="#{adverseEventManagementController.selected.status ne null and adverseEventManagementController.selected.status == 1}" update="AdverseEventCreateForm AdverseEventSearchForm"/>
                            <p:commandButton value="重新提交" actionListener="#{adverseEventManagementController.tempSaveAdverseEventCreate(0)}" icon="ui-icon-check" style="float:left" rendered="#{adverseEventManagementController.selected.status == 5}" update="AdverseEventCreateForm AdverseEventSearchForm"/>
                            <p:commandButton value="返回" icon="ui-icon-cancel" action="adverseEventList.xhtml?faces-redirect=true" immediate="true" style="float:left"/>
                            <p:commandButton value="撤回" actionListener="#{adverseEventManagementController.adverseEventWithdrawn()}" icon="ui-icon-check" style="float:left" rendered="#{adverseEventManagementController.selected.status == 2  and adverseEventManagementController.isWithdrawnButton()  }" validateClient="true" update="AdverseEventCreateForm AdverseEventSearchForm"/>
                        </h:panelGroup>
                    </p:panelGrid>
                    <style>
                        /*.ui-selectmanycheckbox.ui-widget td, .ui-selectoneradio.ui-widget label, .ui-selectoneradio.ui-widget td {
                            color: red;
                        }*/
                        .ui-selectmanycheckbox .ui-chkbox {
                            width: 5%!important;
                            padding-right: 8px;
                        }
                    </style>
                </h:form>
            </div>
        </div>


    </ui:define>
</ui:composition>
