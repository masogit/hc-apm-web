<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <style type="text/css">
            .grid-radio td {
                padding: .5rem;
            }
            .grid-box td {
                padding: .5rem;
            }
            .legend {
                display: inline-block;
                width: 1.5rem;
                height: 1.5rem;
                border-radius: .25rem;
                vertical-align: sub;
            }
            .radiolabelPF {
                margin-left: 7px;
                margin-right: 40px;
            }
        </style>
        <script type="text/javascript">


        </script>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="不良事件上报"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="AdverseEventApproveEditForm">
                    <p:accordionPanel id="accordionCreate" multiple="true" activeIndex="0,1,2,3,4,5,6">
                        <p:tab title="报告人基本情况" closable="false">
                            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">不良事件工单类型<span style="color:red">*</span></label>
                                    <p:selectOneRadio value="#{adverseEventApproveController.selected.adverseEventType}" id="adverseEventType" layout="custom" required="true" requiredMessage="不良事件工单类型不能为空"  disabled="true">
                                        <p:ajax event="change" update=":AdverseEventApproveEditForm:accordionCreate:repairReportSendPlaceGroup" />
                                        <f:selectItem itemValue="1" />
                                        <f:selectItem itemValue="2" />
                                    </p:selectOneRadio>
                                    <h:panelGroup>
                                        <p:radioButton for="adverseEventType" itemIndex="0"/>
                                        <h:outputLabel value="医疗器械不良事件" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:radioButton for="adverseEventType" itemIndex="1"/>
                                        <h:outputLabel value="医疗器械不良事件哨点监测" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </p:panelGrid>
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">工单编号</label>
                                    <p:inputText id="workOrderNum" value="#{adverseEventApproveController.selected.workOrderNum}" readonly="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">报告人姓名<span style="color:red">*</span></label>
                                    <p:inputText id="serialNum" value="#{adverseEventApproveController.selected.reporterName}" required="true" requiredMessage="报告人姓名不能为空" readonly="true"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">报告日期<span style="color:red">*</span></label>
                                    <p:outputLabel value="#{adverseEventApproveController.selected.reportDate}" >
                                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat12()}" />
                                    </p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">科室<span style="color:red">*</span></label>
                                    <p:outputLabel id="department" value="#{adverseEventApproveController.reporterList(adverseEventApproveController.selected.department)}" required="true" requiredMessage="科室不能为空" readonly="true" class="department"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">发生地</label>
                                    <p:inputText id="occurredPlace" value="#{adverseEventApproveController.selected.occurredPlace}"  readonly="true"/>
                                </h:panelGroup>
                                <h:panelGroup id="repairReportSendPlaceGroup">
                                    <label class="label">设备报修发生场地<span style="color:red">#{adverseEventApproveController.selected.adverseEventType eq '2' ? '*' : ''}</span></label>
                                    <p:selectOneMenu value="#{adverseEventApproveController.selected.repairReportSendPlace}" required="#{adverseEventApproveController.selected.adverseEventType eq '2' ? true :false}" disabled="true">
                                        <f:selectItem itemLabel="请选择"/>
                                        <f:selectItems value="#{fieldMsg.getFieldValueList('repairReportSendPlace')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="医疗器械情况">
                            <p:fieldset legend="医疗器械名称">
                                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                    <h:panelGroup>
                                        <label class="label">资产名称<span style="color:red">*</span></label>
                                        <p:inputText id="assetName" value="#{adverseEventApproveController.selected.assetName}" required="true"  requiredMessage="资产名称不能为空"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">设备编号<span style="color:red">*</span></label>
                                        <p:inputText id="deviceNum" value="#{adverseEventApproveController.selected.deviceNum}" required="true"  requiredMessage="设备编号不能为空"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>
                            <p:fieldset legend="医疗器械名称">
                                <p:selectOneRadio value="#{adverseEventApproveController.assetType}" id="assetType" layout="custom" >
                                    <p:ajax event="change" update=":AdverseEventApproveEditForm:accordionCreate:productInfo" />
                                    <f:selectItem itemValue="1" />
                                    <f:selectItem itemValue="2" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="assetType" itemIndex="0"/>
                                    <h:outputLabel value="设备" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="assetType" itemIndex="1"/>
                                    <h:outputLabel value="耗材" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="productInfo">
                                    <h:panelGroup>
                                        <label class="label">产品名称<span style="color:red">*</span></label>
                                        <p:inputText id="productName" value="#{adverseEventApproveController.selected.productName}" required="true"  requiredMessage="产品名称不能为空"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">注册证编号<span style="color:red">*</span></label>
                                        <p:inputText id="registrationNum" value="#{adverseEventApproveController.selected.registrationNum}" required="true"  requiredMessage="注册证编号不能为空"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="false">
                                        <label class="label">曾用注册证编号</label>
                                        <p:inputText id="previouslyRegistrationNum" value="#{adverseEventApproveController.selected.previouslyRegistrationNum}" readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="false">
                                        <label class="label">曾用注册证编号是否上报</label>
                                        <p:selectOneRadio value="#{adverseEventApproveController.selected.previouslyRegistrationReport}" id="previouslyRegistrationReport" layout="custom" readonly="#{adverseEventApproveController.readOnlyCreateForm}">
                                            <p:ajax event="change" update="@this"/>
                                            <f:selectItem itemValue="true"/>
                                            <f:selectItem itemValue="false" />
                                        </p:selectOneRadio>
                                        <h:panelGroup>
                                            <p:radioButton for="previouslyRegistrationReport" itemIndex="0"/>
                                            <h:outputLabel value="是" styleClass="radiolabelPF"/>
                                        </h:panelGroup>
                                        <h:panelGroup>
                                            <p:radioButton for="previouslyRegistrationReport" itemIndex="1"/>
                                            <h:outputLabel value="否" styleClass="radiolabelPF"/>
                                        </h:panelGroup>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="false">
                                        <label class="label">产品类别</label>
                                        <p:inputText id="productCategory" value="#{adverseEventApproveController.selected.productCategory}"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="true">
                                        <label class="label">型号<span style="color:red">*</span></label>
                                        <p:inputText id="model" value="#{adverseEventApproveController.selected.model}" required="false" requiredMessage="型号不能为空"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="true">
                                        <label class="label">规格<span style="color:red">#{adverseEventApproveController.assetType == 2?'*':''}</span></label>
                                        <p:inputText id="standard" value="#{adverseEventApproveController.selected.standard}" required="false" requiredMessage="规格不能为空" readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 2}">
                                        <label class="label">产地<span style="color:red">#{adverseEventApproveController.assetType == 2?'*':''}</span></label>
                                        <p:inputText id="originPlace" value="#{adverseEventApproveController.selected.originPlace}" required="#{adverseEventApproveController.assetType == 2 ? 'true':'false'}" readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 1}">
                                        <label class="label">产品批号</label>
                                        <p:inputText maxlength="100" value="#{adverseEventApproveController.selected.productLotNum}"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 1}">
                                        <label class="label">产品编号<span style="color:red">*</span></label>
                                        <p:inputText maxlength="100" value="#{adverseEventApproveController.selected.productNum}"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 2}">
                                        <label class="label">批号<span style="color:red">*</span></label>
                                        <p:inputText id="productLotNum" maxlength="100" value="#{adverseEventApproveController.selected.productLotNum}"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 2}">
                                        <label class="label">编号</label>
                                        <p:inputText id="productNum" maxlength="100" value="#{adverseEventApproveController.selected.productNum}"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">UDI<span style="color:red">#{adverseEventApproveController.assetType == 2?'*':''}</span></label>
                                        <p:inputText id="udi" value="#{adverseEventApproveController.selected.udi}" required="#{adverseEventApproveController.assetType == 2 ? 'true':'false'}" readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">生产日期<span style="color:red">*</span></label>
                                        <p:outputLabel value="#{adverseEventApproveController.selected.productionDate}" >
                                            <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                        </p:outputLabel>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="true">
                                        <label class="label">有效期至<span style="color:red">#{adverseEventApproveController.assetType == 2?'*':''}</span></label>
                                        <p:outputLabel value="#{adverseEventApproveController.selected.validUntil}" >
                                            <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                        </p:outputLabel>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 2}">
                                        <label class="label">停用日期</label>
                                        <p:outputLabel value="#{adverseEventApproveController.selected.retirementDate}" >
                                            <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                        </p:outputLabel>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 1}">
                                        <label class="label">上市许可证持有人名称</label>
                                        <p:inputText id="marketingAuthHolder" value="#{adverseEventApproveController.selected.marketingAuthHolder}" readonly="#{adverseEventApproveController.readOnlyCreateForm}" />
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>
                            <p:fieldset legend="操作人" rendered="false">
                                <p:selectOneRadio value="#{adverseEventApproveController.selected.operator}" id="operator" layout="custom" disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                    <p:ajax event="change" update=":AdverseEventApproveEditForm:accordionCreate:operatorDescHi" />
                                    <f:selectItem itemValue="1" />
                                    <f:selectItem itemValue="2" />
                                    <f:selectItem itemValue="3" />
                                    <f:selectItem itemValue="4" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="0"/>
                                    <h:outputLabel value="医生" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="1"/>
                                    <h:outputLabel value="护士" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="2"/>
                                    <h:outputLabel value="患者" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="3"/>
                                    <h:outputLabel value="其他" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <p:panelGrid id="operatorDescHi" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup rendered="#{adverseEventApproveController.selected.operator == 4}">
                                        <label class="label">操作人描述</label>
                                        <p:inputText id="operatorDesc" maxlength="50" value="#{adverseEventApproveController.selected.operatorDesc}"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>
                        </p:tab>
                        <p:tab title="安全事件情况">
                            <p:fieldset legend="事发事件信息">
                                <h:panelGroup>
                                    <label class="label">事件发生日期<span style="color:red">*</span></label>
                                    <p:outputLabel value="#{adverseEventApproveController.selected.eventOccurredDate}" >
                                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                    </p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">发现或获知日期<span style="color:red">*</span></label>
                                    <p:outputLabel value="#{adverseEventApproveController.selected.eventDiscoverDate}" >
                                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                    </p:outputLabel>
                                </h:panelGroup>
                            </p:fieldset>
                            <p:fieldset legend="安全事件伤害信息" id="harmDegreeDecHi">
                                <label class="label">伤害程度<span style="color:red">*</span></label>
                                <p:selectOneRadio value="#{adverseEventApproveController.selected.harmDegree}" id="harmDegree" layout="custom" required="true" requiredMessage="伤害程度不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                    <p:ajax event="change" update=":AdverseEventApproveEditForm:accordionCreate:harmDegreeDecHi" />
                                    <f:selectItem itemValue="1" />
                                    <f:selectItem itemValue="2" />
                                    <f:selectItem itemValue="3" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="harmDegree" itemIndex="0"/>
                                    <h:outputLabel value="死亡" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="harmDegree" itemIndex="1"/>
                                    <h:outputLabel value="严重伤害" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="harmDegree" itemIndex="2"/>
                                    <h:outputLabel value="其他" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{adverseEventApproveController.selected.harmDegree == 3}">
                                    <label class="label">伤害描述</label>
                                    <p:inputText id="harmDegreeDesc" maxlength="100" value="#{adverseEventApproveController.selected.harmDegreeDesc}"  readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                            </p:fieldset>
                            <p:fieldset legend="事件主要表现">
                                <h:panelGroup>
                                    <label class="label">伤害表现</label>
                                    <p:inputTextarea id="harmPerform" maxlength="1000" value="#{adverseEventApproveController.selected.harmPerform}" readonly="#{adverseEventApproveController.readOnlyCreateForm}"></p:inputTextarea>
                                    <p:dataGrid id="harmPerformFile" var="fileitem" value="#{adverseEventApproveController.selected.harmPerformFile}" columns="5" layout="grid" rendered="#{adverseEventApproveController.selected.harmPerformFile ne null and !empty adverseEventApproveController.selected.harmPerformFile}">
                                        <p:panel  style="text-align:center">
                                            <h:panelGrid columns="1" style="width:100%" >
                                                <p:ajax  event="click" update="previewedDlg" oncomplete="handlePreview(args, 'previewedDlg');" listener="#{preViewerBean.onServerEvent(adverseEventApproveController,fileitem.objectId)}"/>
                                                <img src="#{fileDownloadService.getImgBase64(fileitem.objectId)}" style="width:100px; height:80px;margin: 0px 5px 0px 5px;"/>
<!--                                                <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectId)}" height="80" width="100" stream="false" >-->
<!--                                                </p:graphicImage>-->
                                            </h:panelGrid>
                                            <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.objectName}" action="#{fileDownloadService.downloadFile(fileitem.objectId)}" ajax="false"  styleClass="p-mr-2"/><br/>

                                        </p:panel>
                                    </p:dataGrid>
                                    <p:dataGrid id="injuryPerformance" var="fileitem" value="#{adverseEventApproveController.injuryPerformance}" columns="5" layout="grid">
                                        <p:panel  style="text-align:center">
                                            <h:panelGrid columns="1" style="width:100%" >
                                                <p:graphicImage value="#{fileitem.getStreamedContent()}" height="80" width="100" stream="false"/>
                                                <p:commandButton actionListener="#{adverseEventApproveController.removeTempHarmPerform(fileitem)}" update="injuryPerformance" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this" disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                                </p:commandButton>
                                            </h:panelGrid>
                                        </p:panel>
                                    </p:dataGrid>
                                    <p:fileUpload allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/" fileUploadListener="#{adverseEventApproveController.tempInjuryPerformanceFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false" sizeLimit="500000000" update="@this injuryPerformance" auto="true" invalidFileMessage="类型应该为xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps" invalidSizeMessage="#{msg.invalidSizeMessage}500M" label="#{msg.Add}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">器械故障表现<span style="color:red">*</span></label>
                                    <p:inputTextarea id="deviceFaultPerform" maxlength="1000" value="#{adverseEventApproveController.selected.deviceFaultPerform}" readonly="#{adverseEventApproveController.readOnlyCreateForm}"></p:inputTextarea>
                                    <p:dataGrid id="deviceFaultPerformFile" var="fileitem" value="#{adverseEventApproveController.selected.deviceFaultPerformFile}" columns="5" layout="grid" rendered="#{adverseEventApproveController.selected.deviceFaultPerformFile ne null and !empty adverseEventApproveController.selected.deviceFaultPerformFile }">
                                        <p:panel  style="text-align:center">
                                            <h:panelGrid columns="1" style="width:100%" >
                                                <h:panelGrid columns="1" style="width:100%" >
                                                    <p:ajax  event="click" update="previewedDlg" oncomplete="handlePreview(args, 'previewedDlg');" listener="#{preViewerBean.onServerEvent(adverseEventApproveController,fileitem.objectId)}"/>
                                                    <img src="#{fileDownloadService.getImgBase64(fileitem.objectId)}" style="width:100px; height:80px;margin: 0px 5px 0px 5px;"/>
<!--                                                    <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectId)}" height="80" width="100" stream="false" >-->
<!--                                                    </p:graphicImage>-->
                                                </h:panelGrid>
                                                <p:commandLink validateClient="false" immediate="true" process="@this" value="#{fileitem.objectName}" action="#{fileDownloadService.downloadFile(fileitem.objectId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                                            </h:panelGrid>
                                        </p:panel>
                                    </p:dataGrid>
                                    <p:dataGrid id="mechanicalFailure" var="fileitem" value="#{adverseEventApproveController.mechanicalFailure}" columns="5" layout="grid">
                                        <p:panel  style="text-align:center">
                                            <h:panelGrid columns="1" style="width:100%" >
                                                <p:graphicImage value="#{fileitem.getStreamedContent()}" height="80" width="100" stream="false"/>
                                                <p:commandButton actionListener="#{adverseEventApproveController.removeTempDeviceFaultPerform(fileitem)}" update="mechanicalFailure" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this" disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                                </p:commandButton>
                                            </h:panelGrid>
                                        </p:panel>
                                    </p:dataGrid>
                                    <p:fileUpload allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps|XLS|XLSX|DOC|DOCX|PDF|JPEG|JPG|PNG|TXT|PS)$/" fileUploadListener="#{adverseEventApproveController.tempMechanicalFailureFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false" sizeLimit="500000000" update="@this mechanicalFailure" auto="true" invalidFileMessage="类型应该为xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps" invalidSizeMessage="#{msg.invalidSizeMessage}500M" label="#{msg.Add}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                            </p:fieldset>
                        </p:tab>
                        <p:tab title="患者信息">
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <h:panelGroup>
                                    <label class="label">姓名</label>
                                    <p:inputText id="patientName" maxlength="50" value="#{adverseEventApproveController.selected.patientName}" readonly="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">出生日期</label>
                                    <p:outputLabel value="#{adverseEventApproveController.selected.patientBornDate}" >
                                        <f:convertDateTime  timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                                    </p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">年龄类型</label>
