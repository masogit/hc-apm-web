<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <style type="text/css">
            .grid-radio td {
                padding: .5rem;
            }
            .grid-box td {
                padding: .5rem;
            }
            .legend {
                display: inline-block;
                width: 1.5rem;
                height: 1.5rem;
                border-radius: .25rem;
                vertical-align: sub;
            }
            .radiolabelPF {
                margin-left: 7px;
                margin-right: 40px;
            }
        </style>
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="不良事件上报"/>
            </div>
            <div class="ui-g-12 card ">
                <h:form id="AdverseEventApproveEditForm">
                    <p:accordionPanel id="accordionCreate" multiple="true">
                        <p:tab title="报告人基本情况" closable="false">
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                <h:panelGroup>
                                    <label class="label">报告人姓名<span style="color:red">*</span></label>
                                    <p:inputText id="serialNum" value="#{adverseEventApproveController.selected.reporterName}" required="true" requiredMessage="报告人姓名不能为空" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">报告日期<span style="color:red">*</span></label>
                                    <p:calendar timeZone="GMT+8"  id="reportDate" pattern="yyyy/MM/dd" value="#{adverseEventApproveController.selected.reportDate}" showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true"  required="true" requiredMessage="报告日期不能为空" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">科室<span style="color:red">*</span></label>
                                    <p:outputLabel id="department" value="#{adverseEventApproveController.reporterList(adverseEventApproveController.selected.department)}" required="true" requiredMessage="科室不能为空" readonly="true" class="department"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">发生地</label>
                                    <p:inputText id="occurredPlace" value="#{adverseEventApproveController.selected.occurredPlace}"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="医疗器械情况">
                            <p:fieldset legend="医疗器械名称">
                                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                    <h:panelGroup>
                                        <label class="label">资产名称<span style="color:red">*</span></label>
                                        <p:inputText id="assetName" value="#{adverseEventApproveController.selected.assetName}" required="true"  requiredMessage="资产名称不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">设备编号<span style="color:red">*</span></label>
                                        <p:inputText id="deviceNum" value="#{adverseEventApproveController.selected.deviceNum}" required="true"  requiredMessage="设备编号不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>
                            <p:fieldset legend="医疗器械名称">
                                <p:selectOneRadio value="#{adverseEventApproveController.assetType}" id="assetType" layout="custom" >
                                    <p:ajax event="change" update=":AdverseEventApproveEditForm:accordionCreate:productInfo" />
                                    <f:selectItem itemValue="1" />
                                    <f:selectItem itemValue="2" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="assetType" itemIndex="0"/>
                                    <h:outputLabel value="设备" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="assetType" itemIndex="1"/>
                                    <h:outputLabel value="耗材" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="productInfo">
                                    <h:panelGroup>
                                        <label class="label">产品名称<span style="color:red">*</span></label>
                                        <p:inputText id="productName" value="#{adverseEventApproveController.selected.productName}" required="true"  requiredMessage="产品名称不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">注册证编号<span style="color:red">*</span></label>
                                        <p:inputText id="registrationNum" value="#{adverseEventApproveController.selected.registrationNum}" required="true"  requiredMessage="注册证编号不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="false">
                                        <label class="label">曾用注册证编号</label>
                                        <p:inputText id="previouslyRegistrationNum" value="#{adverseEventApproveController.selected.previouslyRegistrationNum}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="false">
                                        <label class="label">曾用注册证编号是否上报</label>
                                        <p:selectOneRadio value="#{adverseEventApproveController.selected.previouslyRegistrationReport}" id="previouslyRegistrationReport" layout="custom" disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                            <p:ajax event="change" update="@this"/>
                                            <f:selectItem itemValue="true"/>
                                            <f:selectItem itemValue="false" />
                                        </p:selectOneRadio>
                                        <h:panelGroup>
                                            <p:radioButton for="previouslyRegistrationReport" itemIndex="0"/>
                                            <h:outputLabel value="是" styleClass="radiolabelPF"/>
                                        </h:panelGroup>
                                        <h:panelGroup>
                                            <p:radioButton for="previouslyRegistrationReport" itemIndex="1"/>
                                            <h:outputLabel value="否" styleClass="radiolabelPF"/>
                                        </h:panelGroup>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="false">
                                        <label class="label">产品类别</label>
                                        <p:inputText id="productCategory" value="#{adverseEventApproveController.selected.productCategory}"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="true">
                                        <label class="label">型号<span style="color:red">#{adverseEventApproveController.assetType == 2?'*':''}</span></label>
                                        <p:inputText id="model" value="#{adverseEventApproveController.selected.model}" required="true" requiredMessage="型号不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="true">
                                        <label class="label">规格<span style="color:red">#{adverseEventApproveController.assetType == 2?'*':''}</span></label>
                                        <p:inputText id="standard" value="#{adverseEventApproveController.selected.standard}" required="true" requiredMessage="规格不能为空" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 2}">
                                        <label class="label">产地<span style="color:red">#{adverseEventApproveController.assetType == 2?'*':''}</span></label>
                                        <p:inputText id="originPlace" value="#{adverseEventApproveController.selected.originPlace}" required="#{adverseEventApproveController.assetType == 2 ? 'true':'false'}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 1}">
                                        <label class="label">产品批号</label>
                                        <p:inputText maxlength="100" value="#{adverseEventApproveController.selected.productLotNum}"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 1}">
                                        <label class="label">产品编号</label>
                                        <p:inputText maxlength="100" value="#{adverseEventApproveController.selected.productNum}"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 2}">
                                        <label class="label">批号<span style="color:red">*</span></label>
                                        <p:inputText id="productLotNum" maxlength="100" value="#{adverseEventApproveController.selected.productLotNum}"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 2}">
                                        <label class="label">编号</label>
                                        <p:inputText id="productNum" maxlength="100" value="#{adverseEventApproveController.selected.productNum}"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">UDI<span style="color:red">#{adverseEventApproveController.assetType == 2?'*':''}</span></label>
                                        <p:inputText id="udi" value="#{adverseEventApproveController.selected.udi}" required="#{adverseEventApproveController.assetType == 2 ? 'true':'false'}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">生产日期<span style="color:red">#{adverseEventApproveController.assetType == 2?'*':''}</span></label>
                                        <p:calendar timeZone="GMT+8"  id="productionDate" pattern="yyyy/MM/dd" value="#{adverseEventApproveController.selected.productionDate}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="#{adverseEventApproveController.assetType == 2 ? 'true':'false'}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="true">
                                        <label class="label">有效期至<span style="color:red">#{adverseEventApproveController.assetType == 2?'*':''}</span></label>
                                        <p:calendar timeZone="GMT+8"  id="validUntil" pattern="yyyy/MM/dd" value="#{adverseEventApproveController.selected.validUntil}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="有效期至不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 2}">
                                        <label class="label">停用日期</label>
                                        <p:calendar timeZone="GMT+8"  id="retirementDate" pattern="yyyy/MM/dd" value="#{adverseEventApproveController.selected.retirementDate}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{adverseEventApproveController.assetType == 1}">
                                        <label class="label">上市许可证持有人名称</label>
                                        <p:inputText id="marketingAuthHolder" value="#{adverseEventApproveController.selected.marketingAuthHolder}" disabled="#{adverseEventApproveController.readOnlyCreateForm}" />
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>
                            <p:fieldset legend="操作人" rendered="false">
                                <p:selectOneRadio value="#{adverseEventApproveController.selected.operator}" id="operator" layout="custom" disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                    <p:ajax event="change" update=":AdverseEventApproveEditForm:accordionCreate:operatorDescHi" />
                                    <f:selectItem itemValue="1" />
                                    <f:selectItem itemValue="2" />
                                    <f:selectItem itemValue="3" />
                                    <f:selectItem itemValue="4" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="0"/>
                                    <h:outputLabel value="医生" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="1"/>
                                    <h:outputLabel value="护士" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="2"/>
                                    <h:outputLabel value="患者" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="operator" itemIndex="3"/>
                                    <h:outputLabel value="其他" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <p:panelGrid id="operatorDescHi" columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                    <h:panelGroup rendered="#{adverseEventApproveController.selected.operator == 4}">
                                        <label class="label">操作人描述</label>
                                        <p:inputText id="operatorDesc" maxlength="50" value="#{adverseEventApproveController.selected.operatorDesc}"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </p:fieldset>
                        </p:tab>
                        <p:tab title="安全事件情况">
                            <p:fieldset legend="事发事件信息">
                                <h:panelGroup>
                                    <label class="label">事件发生日期<span style="color:red">*</span></label>
                                    <p:calendar timeZone="GMT+8"  id="eventOccurredDate" pattern="yyyy/MM/dd" value="#{adverseEventApproveController.selected.eventOccurredDate}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="事件发生日期不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">发现或获知日期<span style="color:red">*</span></label>
                                    <p:calendar timeZone="GMT+8"  id="eventDiscoverDate" pattern="yyyy/MM/dd" value="#{adverseEventApproveController.selected.eventDiscoverDate}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="事件发现或获知日期不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                            </p:fieldset>
                            <p:fieldset legend="安全事件伤害信息" id="harmDegreeDecHi">
                                <label class="label">伤害程度<span style="color:red">*</span></label>
                                <p:selectOneRadio value="#{adverseEventApproveController.selected.harmDegree}" id="harmDegree" layout="custom" required="true" requiredMessage="伤害程度不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                    <p:ajax event="change" update=":AdverseEventApproveEditForm:accordionCreate:harmDegreeDecHi" />
                                    <f:selectItem itemValue="1" />
                                    <f:selectItem itemValue="2" />
                                    <f:selectItem itemValue="3" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="harmDegree" itemIndex="0"/>
                                    <h:outputLabel value="死亡" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="harmDegree" itemIndex="1"/>
                                    <h:outputLabel value="严重伤害" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="harmDegree" itemIndex="2"/>
                                    <h:outputLabel value="其他" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{adverseEventApproveController.selected.harmDegree == 3}">
                                    <label class="label">伤害描述</label>
                                    <p:inputText id="harmDegreeDesc" maxlength="100" value="#{adverseEventApproveController.selected.harmDegreeDesc}"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                            </p:fieldset>
                            <p:fieldset legend="事件主要表现">
                                <h:panelGroup>
                                    <label class="label">伤害表现</label>
                                    <p:inputTextarea id="harmPerform" maxlength="1000" value="#{adverseEventApproveController.selected.harmPerform}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"></p:inputTextarea>
                                    <p:dataGrid id="harmPerformFile" var="fileitem" value="#{adverseEventApproveController.selected.harmPerformFile}" columns="5" layout="grid" rendered="#{adverseEventApproveController.selected.harmPerformFile ne null and !empty adverseEventApproveController.selected.harmPerformFile}">
                                        <p:panel  style="text-align:center">
                                            <h:panelGrid columns="1" style="width:100%" >
                                                <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectId)}" height="80" width="100" stream="false"/>
                                                <p:commandButton actionListener="#{adverseEventApproveController.removeHarmPerformFile(fileitem)}" update="harmPerformFile" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this" disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                                </p:commandButton>
                                            </h:panelGrid>
                                        </p:panel>
                                    </p:dataGrid>
                                    <p:dataGrid id="injuryPerformance" var="fileitem" value="#{adverseEventApproveController.injuryPerformance}" columns="5" layout="grid">
                                        <p:panel  style="text-align:center">
                                            <h:panelGrid columns="1" style="width:100%" >
                                                <p:graphicImage value="#{fileitem.getStreamedContent()}" height="80" width="100" stream="false"/>
                                                <p:commandButton actionListener="#{adverseEventApproveController.removeTempHarmPerform(fileitem)}" update="injuryPerformance" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this" disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                                </p:commandButton>
                                            </h:panelGrid>
                                        </p:panel>
                                    </p:dataGrid>
                                    <p:fileUpload allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{adverseEventApproveController.tempInjuryPerformanceFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false" sizeLimit="500000000" update="@this injuryPerformance" auto="true" invalidFileMessage="类型应该为xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps" invalidSizeMessage="#{msg.invalidSizeMessage}500M" label="#{msg.Add}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">器械故障表现</label>
                                    <p:inputTextarea id="deviceFaultPerform" maxlength="1000" value="#{adverseEventApproveController.selected.deviceFaultPerform}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"></p:inputTextarea>
                                    <p:dataGrid id="deviceFaultPerformFile" var="fileitem" value="#{adverseEventApproveController.selected.deviceFaultPerformFile}" columns="5" layout="grid" rendered="#{adverseEventApproveController.selected.deviceFaultPerformFile ne null and !empty adverseEventApproveController.selected.deviceFaultPerformFile }">
                                        <p:panel  style="text-align:center">
                                            <h:panelGrid columns="1" style="width:100%" >
                                                <p:graphicImage value="#{fileDownloadService.getFile(fileitem.objectId)}" height="80" width="100" stream="false"/>
                                                <p:commandButton actionListener="#{adverseEventApproveController.removeDeviceFaultPerformFile(fileitem)}" update="deviceFaultPerformFile" icon="ui-icon-clear" title="#{msg.Delete}" class="popupIconButton" process="@this" disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                                </p:commandButton>
                                            </h:panelGrid>
                                        </p:panel>
                                    </p:dataGrid>
                                    <p:dataGrid id="mechanicalFailure" var="fileitem" value="#{adverseEventApproveController.mechanicalFailure}" columns="5" layout="grid">
                                        <p:panel  style="text-align:center">
                                            <h:panelGrid columns="1" style="width:100%" >
                                                <p:graphicImage value="#{fileitem.getStreamedContent()}" height="80" width="100" stream="false"/>
                                                <p:commandButton actionListener="#{adverseEventApproveController.removeTempDeviceFaultPerform(fileitem)}" update="mechanicalFailure" icon="ui-icon-clear"  title="#{msg.Delete}" class="popupIconButton" process="@this" disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                                    <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteFileConformationMsg}" icon="ui-icon-warning"/>
                                                </p:commandButton>
                                            </h:panelGrid>
                                        </p:panel>
                                    </p:dataGrid>
                                    <p:fileUpload allowTypes="/(\.|\/)(xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps)$/" fileUploadListener="#{adverseEventApproveController.tempMechanicalFailureFileUpload}" mode="advanced" dragDropSupport="false" style="width:100%" multiple="false" sizeLimit="500000000" update="@this mechanicalFailure" auto="true" invalidFileMessage="类型应该为xls|xlsx|doc|docx|pdf|jpeg|jpg|png|txt|ps" invalidSizeMessage="#{msg.invalidSizeMessage}500M" label="#{msg.Add}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                            </p:fieldset>
                        </p:tab>
                        <p:tab title="患者信息">
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                                <h:panelGroup>
                                    <label class="label">姓名</label>
                                    <p:inputText id="patientName" maxlength="50" value="#{adverseEventApproveController.selected.patientName}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">出生日期</label>
                                    <p:calendar timeZone="GMT+8"  id="patientBornDate" pattern="yyyy/MM/dd" value="#{adverseEventApproveController.selected.patientBornDate}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">年龄类型</label>
                                    <p:selectOneRadio value="#{adverseEventApproveController.selected.patientAgeType}" id="patientAgeType" layout="custom"  disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                        <f:selectItem itemValue="1" />
                                        <f:selectItem itemValue="2" />
                                        <f:selectItem itemValue="3" />
                                    </p:selectOneRadio>
                                    <h:panelGroup>
                                        <p:radioButton for="patientAgeType" itemIndex="0"/>
                                        <h:outputLabel value="年" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:radioButton for="patientAgeType" itemIndex="1"/>
                                        <h:outputLabel value="月" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:radioButton for="patientAgeType" itemIndex="2"/>
                                        <h:outputLabel value="日" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">年龄</label>
                                        <p:inputText id="patientAge" value="#{adverseEventApproveController.selected.patientAge}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                    </h:panelGroup>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">性别</label>
                                    <p:selectOneRadio value="#{adverseEventApproveController.selected.patientSex}" id="patientSex" layout="custom"  disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                        <f:selectItem itemValue="1" />
                                        <f:selectItem itemValue="2" />
                                    </p:selectOneRadio>
                                    <h:panelGroup>
                                        <p:radioButton for="patientSex" itemIndex="0"/>
                                        <h:outputLabel value="男" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:radioButton for="patientSex" itemIndex="1"/>
                                        <h:outputLabel value="女" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">病历号</label>
                                    <p:inputText id="medicalCaseNum" maxlength="100" value="#{adverseEventApproveController.selected.medicalCaseNum}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">既往病史</label>
                                    <p:inputTextarea id="medicalHistory" maxlength="500" value="#{adverseEventApproveController.selected.medicalHistory}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="使用情况">
                            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" id="usePlaceDecHi">
                                <h:panelGroup>
                                    <label class="label">预期治疗疾病或者作用</label>
                                    <p:inputTextarea id="exceptAffect" maxlength="1000" value="#{adverseEventApproveController.selected.exceptAffect}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">器械使用日期<span style="color:red">*</span></label>
                                    <p:calendar timeZone="GMT+8"  id="deviceUsedDate" pattern="yyyy/MM/dd" value="#{adverseEventApproveController.selected.deviceUsedDate}"  showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true" mask="true" required="true" requiredMessage="器械使用日期不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">使用场所<span style="color:red">*</span></label>
                                    <p:selectOneRadio value="#{adverseEventApproveController.selected.usePlace}" id="usePlace" layout="custom" required="true" requiredMessage="使用场所不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}">
                                        <p:ajax event="change" update=":AdverseEventApproveEditForm:accordionCreate:usePlaceDecHi" />
                                        <f:selectItem itemValue="1" />
                                        <f:selectItem itemValue="2" />
                                        <f:selectItem itemValue="3" />
                                    </p:selectOneRadio>
                                    <h:panelGroup>
                                        <p:radioButton for="usePlace" itemIndex="0"/>
                                        <h:outputLabel value="医疗机构" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:radioButton for="usePlace" itemIndex="1"/>
                                        <h:outputLabel value="家庭" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:radioButton for="usePlace" itemIndex="2"/>
                                        <h:outputLabel value="其他" styleClass="radiolabelPF"/>
                                    </h:panelGroup>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">场所名称</label>
                                    <p:inputText id="placeName" maxlength="100" value="#{adverseEventApproveController.selected.placeName}"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">使用过程<span style="color:red">*</span></label>
                                    <p:inputTextarea id="useProcess" maxlength="500" value="#{adverseEventApproveController.selected.useProcess}" required="true" requiredMessage="使用过程不能为空"  disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <label class="label">合并用药/器械情况说明</label>
                                    <p:inputTextarea id="deviceDesc" maxlength="500" value="#{adverseEventApproveController.selected.deviceDesc}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                                </h:panelGroup>
                            </p:panelGrid>
                        </p:tab>
                        <p:tab title="事件原因初步分析与处置">
                            <h:panelGroup>
                                <label class="label">事件原因分析<span style="color:red">*</span></label>
                                <p:selectOneRadio value="#{adverseEventApproveController.selected.eventCauseAnalyze}" required="true" requiredMessage="事件原因分析必填" id="eventCauseAnalyze" layout="custom" disabled="#{adverseEventApproveController.readOnlyCreateForm}" >
                                    <f:selectItem itemValue="1"/>
                                    <f:selectItem itemValue="2" />
                                    <f:selectItem itemValue="3" />
                                    <f:selectItem itemValue="4" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="eventCauseAnalyze" itemIndex="0"/>
                                    <h:outputLabel value="产品原因（包括说明书）" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="eventCauseAnalyze" itemIndex="1"/>
                                    <h:outputLabel value="操作原因" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="eventCauseAnalyze" itemIndex="2"/>
                                    <h:outputLabel value="患者自身原因" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="eventCauseAnalyze" itemIndex="3"/>
                                    <h:outputLabel value="无法确定" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">事件原因分析描述</label>
                                <p:inputTextarea id="eventCauseDesc" maxlength="500" value="#{adverseEventApproveController.selected.eventCauseDesc}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">初步处置情况<span style="color:red">*</span></label>
                                <p:inputTextarea id="initDisposeSitu" maxlength="500" value="#{adverseEventApproveController.selected.initDisposeSitu}" disabled="#{adverseEventApproveController.readOnlyCreateForm}"/>
                            </h:panelGroup>
                        </p:tab>
                    </p:accordionPanel>
                    <p:accordionPanel id="accordionApprove" multiple="true" activeIndex="0,1,2,3,4,5">
                        <p:tab title="事件调查">
                            <h:panelGroup>
                                <label class="label">是否开展了调查</label>
                                <p:selectOneRadio value="#{adverseEventApproveController.selected.hasSurvey}" id="hasSurvey" layout="custom" disabled="#{adverseEventApproveController.readOnlyEditForm}" >
                                    <f:selectItem itemValue="true"/>
                                    <f:selectItem itemValue="false" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="hasSurvey" itemIndex="0"/>
                                    <h:outputLabel value="是" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="hasSurvey" itemIndex="1"/>
                                    <h:outputLabel value="否" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">调查情况</label>
                                <p:inputTextarea id="surveySitu" maxlength="500" value="#{adverseEventApproveController.selected.surveySitu}" disabled="#{adverseEventApproveController.readOnlyEditForm}"/>
                            </h:panelGroup>
                        </p:tab>
                        <p:tab title="评价结果">
                            <h:panelGroup>
                                <label class="label">关联性评价</label>
                                <p:inputTextarea id="relevanceEval" maxlength="500" value="#{adverseEventApproveController.selected.relevanceEval}" disabled="#{adverseEventApproveController.readOnlyEditForm}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">事件原因分析</label>
                                <p:inputTextarea id="evalCauseAnalyze" maxlength="500" value="#{adverseEventApproveController.selected.evalCauseAnalyze}" disabled="#{adverseEventApproveController.readOnlyEditForm}"/>
                            </h:panelGroup>
                        </p:tab>
                        <p:tab title="控制措施">
                            <h:panelGroup>
                                <label class="label">是否已采取控制措施</label>
                                <p:selectOneRadio value="#{adverseEventApproveController.selected.hasControlMeasure}" id="hasControlMeasure" layout="custom" disabled="#{adverseEventApproveController.readOnlyEditForm}" >
                                    <f:selectItem itemValue="true"/>
                                    <f:selectItem itemValue="false" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="hasControlMeasure" itemIndex="0"/>
                                    <h:outputLabel value="是" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="hasControlMeasure" itemIndex="1"/>
                                    <h:outputLabel value="否" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">具体采取控制措施</label>
                                <p:inputTextarea id="controlMeasureDesc" maxlength="500" value="#{adverseEventApproveController.selected.controlMeasureDesc}" disabled="#{adverseEventApproveController.readOnlyEditForm}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">未采取具体采取控制措施</label>
                                <p:inputTextarea id="notControlCause" maxlength="500" value="#{adverseEventApproveController.selected.notControlCause}" disabled="#{adverseEventApproveController.readOnlyEditForm}"/>
                            </h:panelGroup>
                        </p:tab>
                        <p:tab title="错报误报">
                            <h:panelGroup>
                                <label class="label">是否错报误报</label>
                                <p:selectOneRadio value="#{adverseEventApproveController.selected.hasFalseReport}" id="hasFalseReport" layout="custom" disabled="#{adverseEventApproveController.readOnlyEditForm}" >
                                    <f:selectItem itemValue="true"/>
                                    <f:selectItem itemValue="false" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="hasFalseReport" itemIndex="0"/>
                                    <h:outputLabel value="是" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="hasFalseReport" itemIndex="1"/>
                                    <h:outputLabel value="否" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">错报误报原因</label>
                                <p:inputTextarea id="falseReportCause" maxlength="500" value="#{adverseEventApproveController.selected.falseReportCause}" disabled="#{adverseEventApproveController.readOnlyEditForm}"/>
                            </h:panelGroup>
                        </p:tab>
                        <p:tab title="报告合并">
                            <h:panelGroup>
                                <label class="label">是否合并报告</label>
                                <p:selectOneRadio value="#{adverseEventApproveController.selected.reportMerge}" id="reportMerge" layout="custom" disabled="#{adverseEventApproveController.readOnlyEditForm}" >
                                    <f:selectItem itemValue="true"/>
                                    <f:selectItem itemValue="false" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="reportMerge" itemIndex="0"/>
                                    <h:outputLabel value="是" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="reportMerge" itemIndex="1"/>
                                    <h:outputLabel value="否" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">报告合并编码</label>
                                <p:inputText id="reportMergeCode" maxlength="100" value="#{adverseEventApproveController.selected.reportMergeCode}" disabled="#{adverseEventApproveController.readOnlyEditForm}"/>
                            </h:panelGroup>
                        </p:tab>
                        <p:tab title="报告审核情况">
                            <h:panelGroup>
                                <label class="label">审核结果<span style="color:red">*</span></label>
                                <p:selectOneRadio value="#{adverseEventApproveController.selected.approvalResult}" id="approvalResult" required="true" requiredMessage="审核结果必填" layout="custom" disabled="#{adverseEventApproveController.readOnlyEditForm}" >
                                    <f:selectItem itemValue="1"/>
                                    <f:selectItem itemValue="2" />
                                </p:selectOneRadio>
                                <h:panelGroup>
                                    <p:radioButton for="approvalResult" itemIndex="0"/>
                                    <h:outputLabel value="同意上报" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:radioButton for="approvalResult" itemIndex="1"/>
                                    <h:outputLabel value="不同意上报" styleClass="radiolabelPF"/>
                                </h:panelGroup>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class="label">审核意见</label>
                                <p:inputTextarea id="approvalOpinion" maxlength="500" value="#{adverseEventApproveController.selected.approvalOpinion}" disabled="#{adverseEventApproveController.readOnlyEditForm}"/>
                            </h:panelGroup>
                        </p:tab>
                    </p:accordionPanel>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup id="buttonGroup">
                            <p:commandButton value="暂存" actionListener="#{adverseEventApproveController.tempSaveAdverseEvent(3)}" icon="ui-icon-check" style="float:left" rendered="#{adverseEventApproveController.selected.status == 2 or adverseEventApproveController.selected.status == 3}" validateClient="true" update="AdverseEventApproveEditForm "/>
                            <p:commandButton value="提交" actionListener="#{adverseEventApproveController.tempSaveAdverseEvent(6)}" icon="ui-icon-check" style="float:left" rendered="#{adverseEventApproveController.selected.status == 2 or adverseEventApproveController.selected.status == 3 }" validateClient="true" update="AdverseEventApproveEditForm "/>
                            <p:commandButton value="退回" icon="ui-icon-check" style="float:left" validateClient="true" rendered="#{adverseEventApproveController.selected.status == 2 or adverseEventApproveController.selected.status == 3}" update="returnReasonDisable " oncomplete="PF('returnReasonDisable').show()"/>
                            <p:commandButton value="邮件上报" icon="ui-icon-check" style="float:left" immediate="true" rendered="#{adverseEventApproveController.selected.status == 7}" update="dlgSendMailDisable " oncomplete="PF('dlgSendMailDisable').show()"/>
                            <p:commandButton value="返回" icon="ui-icon-cancel" action="adverseEventApproveList.xhtml?faces-redirect=true" immediate="true" style="float:left"/>
                        </h:panelGroup>
                    </p:panelGrid>
                </h:form>
            </div>
            <p:dialog modal="true" id="returnReasonDisable" widgetVar="returnReasonDisable" header="退回" appendTo="@(body)">
                <h:form id="returnForm">
                    <h:panelGrid columns="1" cellpadding="5">
                        <h:panelGroup>
                            <label class="label">退回原因:</label>
                            <p:inputTextarea value="#{adverseEventApproveController.selected.returnReason}" required="true" requiredMessage="退回原因不能为空"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:commandButton action="#{adverseEventApproveController.tempSaveAdverseEvent(4)}" update="AdverseEventApproveEditForm" value="退回" icon="ui-icon-check" validateClient="true" oncomplete="PF('returnReasonDisable').hide()"/>
                            <p:commandButton immediate="true" value="#{msg.Canceled}" icon="ui-icon-cancel" onclick="PF('returnReasonDisable').hide()"/>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
            </p:dialog>
            <p:dialog modal="true" id="dlgSendMailDisable" widgetVar="dlgSendMailDisable" header="邮件发送" appendTo="@(body)">
                <h:form id="sendMailForm">
                    <h:panelGrid columns="1" cellpadding="5">
                        <h:panelGroup>
                            <label class="label">邮箱:</label>
                            <p:inputText value="#{adverseEventApproveController.emails}" required="true" requiredMessage="邮箱不能为空"/>
                            <label class="label"><span style="color: red">tips:多个邮箱请用,号隔开,例如xxx@xx.com,xxx@xx.com!</span></label>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:commandButton actionListener="#{adverseEventApproveController.sendSingleReportMail}" update="AdverseEventApproveEditForm" value="发送" icon="ui-icon-check" validateClient="true" oncomplete="PF('dlgSendMailDisable').hide()"/>
                            <p:commandButton immediate="true" value="#{msg.Canceled}" icon="ui-icon-cancel" onclick="PF('dlgSendMailDisable').hide()"/>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
            </p:dialog>
        </div>

    </ui:define>
</ui:composition>
