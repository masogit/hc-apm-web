<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            div.ui-panelgrid-cell > label + div.ui-selectonemenu {
                min-width: 75px !important;
                max-width: 90%;
            }
        </style>
        <style>
            .ui-chkbox{
                width: 18px !IMPORTANT;
            }
        </style>

        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="不良事件审核"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="searchForm">
                    <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                        <p:commandButton value="全部" disabled="#{adverseEventApproveController.eventStatusFilter eq null or adverseEventApproveController.eventStatusFilter eq '2,3,4,6,7,8,9'}" process="@this" update="buttonSet :adverseListForm:adverseEventsApproveList" actionListener="#{adverseEventApproveController.setEventStatus('2,3,4,6,7,8,9')}" />
                        <p:commandButton value="待审核" disabled="#{adverseEventApproveController.eventStatusFilter eq '2'}" process="@this" update="buttonSet :adverseListForm:adverseEventsApproveList" actionListener="#{adverseEventApproveController.setEventStatus('2')}" />
                        <p:commandButton value="审核中" disabled="#{adverseEventApproveController.eventStatusFilter eq '3'}" process="@this" update="buttonSet :adverseListForm:adverseEventsApproveList" actionListener="#{adverseEventApproveController.setEventStatus('3')}" />
                        <p:commandButton value="已退回" disabled="#{adverseEventApproveController.eventStatusFilter eq '4'}" process="@this" update="buttonSet :adverseListForm:adverseEventsApproveList" actionListener="#{adverseEventApproveController.setEventStatus('4')}" />
                        <p:commandButton value="不同意上报" disabled="#{adverseEventApproveController.eventStatusFilter eq '6'}" process="@this" update="buttonSet :adverseListForm:adverseEventsApproveList" actionListener="#{adverseEventApproveController.setEventStatus('6')}" />
                        <p:commandButton value="同意上报" disabled="#{adverseEventApproveController.eventStatusFilter eq '7'}" process="@this" update="buttonSet :adverseListForm:adverseEventsApproveList" actionListener="#{adverseEventApproveController.setEventStatus('7')}" />
                    </h:panelGrid>
                </h:form>
                <h:form id="adverseListForm">
                    <h:panelGrid id="searchStrSet" columns="2" cellpadding="5">
                        <label class="label">资产名称或科室名称筛选：</label>
                        <p:inputText id="queryStr" value="#{adverseEventApproveController.queryStr}">
                            <p:ajax event="blur" process="@this" update="adverseEventsApproveList" />
                        </p:inputText>
                    </h:panelGrid>
                    <p:dataTable id="adverseEventsApproveList" value="#{adverseEventApproveController.lazyModel}"
                                 var="item" widgetVar="varDataList" lazy="true"
                                 selectionMode="single" scrollable="false" selection="#{adverseEventApproveController.selected}"
                                 rowKey="#{item.id}"
                                 paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="10" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="10,,20,50,100">
                        <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                        <p:column width="36" id="checkBoxColumn" exportable="false">
                            <p:selectBooleanCheckbox value="#{adverseEventApproveController.selectedMap[item.workOrderNum]}"  class="selectCheckBox">
                                <p:ajax process="@this" update="@this adverseEventsApproveList" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header"  >
                                <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                    <p:ajax listener="#{adverseEventApproveController.onSelectAllOfPage}" update="@(.selectCheckBox) batchSendButton batchExportButton" oncomplete="updateSelectAllCheckBox();"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.workOrderNum}" >
                            <h:outputText value="#{item.workOrderNum}"/>
                        </p:column>
                        <p:column headerText="状态" >
                            <h:outputText
                                    value="#{item.status == 1?'暂存':
                                    item.status == 2?'待审核':
                                    item.status == 3?'审核中':
                                    item.status == 4?'已退回':
                                    item.status == 5?'已作废':
                                    item.status == 6?'不同意上报':
                                    item.status == 7?'同意上报':
                                    item.status == 8?'上报完成':
                                    item.status == 9?'买方填写':
                                    '未知'  }"/>
                        </p:column>
                        <p:column headerText="#{msg.reporterName}" >
                            <h:outputText value="#{item.reporterName}"/>
                        </p:column>
                        <p:column headerText="#{msg.reportDate}" >
                            <h:outputText value="#{item.reportDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.department}" >
                            <h:outputText value="#{adverseEventApproveController.reporterList(item.department)}"/>
                        </p:column>
                        <p:column headerText="#{msg.adverseEventType}" >
                            <h:outputText value="#{item.adverseEventType eq '2' ? '医疗器械不良事件哨点监测' : '医疗器械不良事件'}"/>
                        </p:column>
                        <p:column headerText="#{msg.repairReportSendPlace}" >
                            <h:outputText value="#{fieldMsg.fieldValue('repairReportSendPlace', item.repairReportSendPlace)}"/>
                        </p:column>
                        <p:column headerText="#{msg.occurredPlace}" >
                            <h:outputText value="#{item.occurredPlace}"/>
                        </p:column>

                        <p:column headerText="#{msg.assetName}" >
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                        <p:column headerText="#{msg.deviceNum}" >
                            <h:outputText value="#{item.deviceNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.productName}" >
                            <h:outputText value="#{item.productName}"/>
                        </p:column>
                        <p:column headerText="伤害程度">
                            <h:outputText value="#{item.harmDegree == 1 ?'死亡':item.harmDegree == 2?'严重伤害':'其他'}" class="#{item.harmDegree != 1?'':'priorityItem priorityItem1'}"/>
                        </p:column>
                        <p:column headerText="操作" exportable="false" style="width: 110px;">
                            <p:commandButton value="更多操作" action="#{adverseEventApproveController.onSelectAdverseEvent(item.id)}" onstart="prepareAdverseWindow();" oncomplete="openAdverseWindow(xhr, status, args)"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="batchSendButton" title="批量发送"  icon="ui-icon-check" disabled="#{adverseEventApproveController.canSendMail}" rendered="#{adverseEventApproveController.eventStatusFilter eq 6 or adverseEventApproveController.eventStatusFilter eq 7}" update="dlgSendMailDisable " oncomplete="PF('dlgSendMailDisable').show()"/>
                            <p:commandButton id="batchExportButton" ajax="false" title="批量导出PDF" actionListener="#{adverseEventApproveController.downLoadPdf()}" icon="ui-icon-file-download" disabled="#{adverseEventApproveController.canSendMail}" validateClient="true" update=":growl" >
                                <p:fileDownload value="#{adverseEventApproveController.exportPdf}"/>
                            </p:commandButton>
                            <p:commandButton id="exportButton" ajax="false" title="#{msg.exportToXLS}" actionListener="#{adverseEventApproveController.exportExcel}" icon="ui-icon-arrowstop-1-s">
                                <p:fileDownload value="#{adverseEventApproveController.excelFile}"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
            <p:dialog modal="true" id="dlgSendMailDisable" widgetVar="dlgSendMailDisable" header="邮件发送" appendTo="@(body)">
                <h:form id="sendMailForm">
                    <h:panelGrid columns="1" cellpadding="5">
                        <h:panelGroup>
                            <label class="label">邮箱:</label>
                            <p:inputText value="#{adverseEventApproveController.emails}" required="true" requiredMessage="邮箱不能为空"/>
                            <label class="label"><span style="color: red">tips:多个邮箱请用,号隔开,例如xxx@xx.com,xxx@xx.com!</span></label>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:commandButton actionListener="#{adverseEventApproveController.sendReportMail}" update=":adverseListForm:adverseEventsApproveList" value="发送" icon="ui-icon-check" validateClient="true" oncomplete="PF('dlgSendMailDisable').hide()"/>
                            <p:commandButton immediate="true" value="#{msg.Canceled}" icon="ui-icon-cancel" onclick="PF('dlgSendMailDisable').hide()"/>
                        </h:panelGroup>
                    </h:panelGrid>
                </h:form>
            </p:dialog>
        </div>
        <script>
            function prepareAdverseWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAdverseWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }
            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked;
                });
                $("#adverseListForm\\:adverseEventsApproveList\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
        </script>
    </ui:define>
</ui:composition>
