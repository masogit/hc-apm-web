<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <style>
            div.ui-panelgrid-cell > label + div.ui-selectonemenu {
                min-width: 75px !important;
                max-width: 90%;
            }
        </style>
        <style>
            .ui-chkbox{
                width: 18px !IMPORTANT;
            }
        </style>

        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="不良事件上报"/>
            </div>
            <div class="ui-g-12 card">
                <h:form id="adverseListForm">
                    <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                        <p:commandButton value="新增上报" process="@this" action="adverseEventCreate.xhtml?faces-redirect=true" />
                        <p:commandButton value="全部" disabled="#{empty adverseEventManagementController.eventStatusFilter or adverseEventManagementController.eventStatusFilter eq null}" process="@this" update="buttonSet adverseEventsList" actionListener="#{adverseEventManagementController.setEventStatus('')}" />
                        <p:commandButton value="暂存中" disabled="#{adverseEventManagementController.eventStatusFilter eq '1'}" process="@this" update="buttonSet adverseEventsList" actionListener="#{adverseEventManagementController.setEventStatus('1')}" />
                        <p:commandButton value="审核中" disabled="#{adverseEventManagementController.eventStatusFilter eq '2,3'}" process="@this" update="buttonSet adverseEventsList" actionListener="#{adverseEventManagementController.setEventStatus('2,3')}" />
                        <p:commandButton value="已退回" disabled="#{adverseEventManagementController.eventStatusFilter eq '4'}" process="@this" update="buttonSet adverseEventsList" actionListener="#{adverseEventManagementController.setEventStatus('4')}" />
                        <p:commandButton value="已作废" disabled="#{adverseEventManagementController.eventStatusFilter eq '5'}" process="@this" update="buttonSet adverseEventsList" actionListener="#{adverseEventManagementController.setEventStatus('5')}" />
                        <p:commandButton value="审核完成" disabled="#{adverseEventManagementController.eventStatusFilter eq '6,8'}" process="@this" update="buttonSet adverseEventsList" actionListener="#{adverseEventManagementController.setEventStatus('6,8')}" />
                    </h:panelGrid>
                    <h:panelGrid id="searchStrSet" columns="2" cellpadding="5">
                        <label class="label">资产名称或科室名称筛选：</label>
                        <p:inputText id="queryStr" value="#{adverseEventManagementController.queryStr}">
                            <p:ajax event="blur" process="@this" update="adverseEventsList" />
                        </p:inputText>
                    </h:panelGrid>
                    <p:dataTable id="adverseEventsList" value="#{adverseEventManagementController.lazyModel}"
                                 var="item" widgetVar="varDataList" lazy="true"
                                 selectionMode="single" scrollable="false" selection="#{adverseEventManagementController.selected}"
                                 rowKey="#{item.id}" sortOrder="descending" sortBy="#{item.workOrderNum}"
                                 paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="10" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="10,,20,50,100">
                        <p:ajax event="page" oncomplete="updateSelectAllCheckBox();" />
                        <p:ajax event="filter" listener="#{adverseEventManagementController.onFilter}" />

                        <p:column width="36" id="checkBoxColumn" exportable="false">
                            <p:selectBooleanCheckbox value="#{adverseEventManagementController.selectedMap[item.workOrderNum]}"  class="selectCheckBox">
                                <p:ajax process="@this" update="@this adverseEventsList" oncomplete="updateSelectAllCheckBox();"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header"  >
                                <p:selectBooleanCheckbox id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                    <p:ajax listener="#{adverseEventManagementController.onSelectAllOfPage}" update="@(.selectCheckBox) batchExportButton" oncomplete="updateSelectAllCheckBox();"/>
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.workOrderNum}" filterBy="#{item.workOrderNum}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.workOrderNum}"/>
                        </p:column>
                        <p:column headerText="状态"  filterBy="#{item.status}" filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}"  />
                                    <f:selectItem itemLabel="暂存" itemValue="1"  />
                                    <f:selectItem itemLabel="待审核" itemValue="2"  />
                                    <f:selectItem itemLabel="审核中" itemValue="3"  />
                                    <f:selectItem itemLabel="已退回" itemValue="4"  />
                                    <f:selectItem itemLabel="已作废" itemValue="5"  />
                                    <f:selectItem itemLabel="审核完成" itemValue="6"  />
                                    <f:selectItem itemLabel="待上报" itemValue="7"  />
                                    <f:selectItem itemLabel="上报完成" itemValue="8"  />
                                    <f:selectItem itemLabel="买方填写" itemValue="9"  />
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText
                                    value="#{item.status == 1?'暂存':
                                    item.status == 2?'待审核':
                                    item.status == 3?'审核中':
                                    item.status == 4?'已退回':
                                    item.status == 5?'已作废':
                                    item.status == 6?'审核完成':
                                    item.status == 7?'待上报':
                                    item.status == 8?'上报完成':
                                    item.status == 9?'买方填写':
                                    '未知'  }"/>
                        </p:column>
                        <p:column headerText="#{msg.reporterName}" filterBy="#{item.reporterName}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.reporterName}"/>
                        </p:column>
                        <p:column headerText="#{msg.reportDate}"  filterBy="#{item.reportDate}"  filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterReportDate" widgetVar="varFilterReportDate" />
                            </f:facet>
                            <h:outputText value="#{item.reportDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.adverseEventType}" filterBy="#{item.adverseEventType}"  filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}"  />
                                    <f:selectItem itemLabel="医疗器械不良事件" itemValue="1"  />
                                    <f:selectItem itemLabel="医疗器械不良事件哨点监测" itemValue="2"  />
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.adverseEventType eq '2' ? '医疗器械不良事件哨点监测' : '医疗器械不良事件'}"/>
                        </p:column>
                        <p:column headerText="#{msg.repairReportSendPlace}" filterBy="#{item.repairReportSendPlace}"  filterMatchMode="EQ" >
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('repairReportSendPlace')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{fieldMsg.fieldValue('repairReportSendPlace', item.repairReportSendPlace)}"/>
                        </p:column>
                        <p:column headerText="#{msg.department}" >
                            <f:facet name="header">
                                <h:outputText value="#{msg.department}"/><br/>
                                <p:autoComplete dropdown="true" value="#{adverseEventManagementController.filterClinicalDeptOrg}" appendTo="@(Body)"
                                                scrollHeight="300"  forceSelection="true" completeMethod="#{adverseEventManagementController.autoCompleteDeptName}" size="5">
                                    <p:ajax event="itemSelect" listener="#{adverseEventManagementController.onClinicalDeptNameFilterChange}" process="@this"  update="adverseListForm:adverseEventsList" oncomplete="updateSelectAllCheckBox();"/>
                                    <p:ajax process="@this" listener="#{adverseEventManagementController.onClinicalDeptNameFilterChange}" update="adverseListForm:adverseEventsList" oncomplete="updateSelectAllCheckBox();"/>
                                </p:autoComplete>
                            </f:facet>
                            <h:outputText value="#{adverseEventManagementController.reporterList(item.department)}"/>
                        </p:column>
                        <p:column headerText="#{msg.occurredPlace}" filterBy="#{item.occurredPlace}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.occurredPlace}"/>
                        </p:column>

                        <p:column headerText="#{msg.assetName}" filterBy="#{item.assetName}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>
                        <p:column headerText="#{msg.deviceNum}" filterBy="#{item.deviceNum}"  filterMatchMode="LIKE" >
                            <h:outputText value="#{item.deviceNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.productName}" filterBy="#{item.productName}"  filterMatchMode="LIKE">
                            <h:outputText value="#{item.productName}"/>
                        </p:column>
                        <p:column headerText="伤害程度" filterBy="#{item.harmDegree}"  filterMatchMode="EQ">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('varDataList').filter()" >
                                    <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}"  />
                                    <f:selectItem itemLabel="死亡" itemValue="1"  />
                                    <f:selectItem itemLabel="严重伤害" itemValue="2"  />
                                    <f:selectItem itemLabel="其他" itemValue="3"  />
                                </p:selectOneMenu>
                            </f:facet>
                            <h:outputText value="#{item.harmDegree == 1 ?'死亡':item.harmDegree == 2?'严重伤害':'其他'}" class="#{item.harmDegree != 1?'':'priorityItem priorityItem1'}"/>
                        </p:column>
                        <p:column headerText="操作" exportable="false" style="width: 110px;">
                            <p:commandButton value="更多操作" action="#{adverseEventManagementController.onSelectAdverseEvent(item.id)}" onstart="prepareAdverseWindow();" oncomplete="openAdverseWindow(xhr, status, args)"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton id="batchExportButton" ajax="false" title="批量导出PDF" actionListener="#{adverseEventManagementController.downLoadPdf()}" icon="ui-icon-file-download" disabled="#{adverseEventManagementController.canExport}" validateClient="true">
                                <p:fileDownload value="#{adverseEventManagementController.exportPdf}"/>
                            </p:commandButton>
                            <p:commandButton id="exportButton" ajax="false" title="#{msg.exportToXLS}" actionListener="#{adverseEventManagementController.exportExcel}" icon="ui-icon-arrowstop-1-s">
                                <p:fileDownload value="#{adverseEventManagementController.excelFile}"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
                <p:overlayPanel widgetVar="panelFilterReportDate" for=":adverseListForm:adverseEventsList:filterReportDate" dismissable="false">
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}"/>
                        <p:calendar timeZone="GMT+8"  widgetVar="varReportDateFrom" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                        <p:outputLabel value="#{msg.To}"/>
                        <p:calendar timeZone="GMT+8"  widgetVar="vaReportDateTo" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                    </h:panelGrid>
                    <p:commandButton onclick="setDateFilter('varDataList','varFilterReportDate','varReportDateFrom','vaReportDateTo'); PF('panelFilterReportDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFilterReportDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                </p:overlayPanel>
            </div>
        </div>
        <script>
            function prepareAdverseWindow() {
                newWin = window.open('about:blank', '_blank');
                newWin.document.body.innerHTML = '加载中...';
            }
            function openAdverseWindow(xhr, status, args) {
                newWin.location.href = args.url;
            }
            function updateSelectAllCheckBox() {
                var checkboxlist = $(".selectCheckBox");
                var selectAllstatus = true;
                checkboxlist.each(function () {
                    selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked;
                });
                $("#adverseListForm\\:adverseEventsList\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
                if (selectAllstatus) {
                    $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
                } else {
                    $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
                }
            }
        </script>
    </ui:define>
</ui:composition>
