<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<ui:composition>

	<p:dialog id="CustomRoleEditDlg" widgetVar="CustomRoleEditDialog" width="800" height="450" modal="true" resizable="true" draggable="true" appendTo="@(body)"
		header="#{customRoleController.CRUDActionName} #{msg.CustomRole}">
		<h:form id="CustomRoleEditForm">
			<h:panelGroup id="display">
				<p:fieldset id="title" legend="#{msg.roleDesc}">
					<p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
						<h:panelGroup>
							<label class="label">#{msg.name}*</label>
							<p:inputText id="name" value="#{customRoleController.selected.name}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}" />
						</h:panelGroup>
						<h:panelGroup>
							<label class="label">#{msg.roleDesc}</label>
							<p:inputText id="roleDesc" value="#{customRoleController.selected.roleDesc}" />
						</h:panelGroup>
						<h:panelGroup rendered="false">
							<label class="label">#{msg.Homepage}</label>
							<p:inputText id="homePage" value="#{customRoleController.selected.homePage}" disabled="true" />
						</h:panelGroup>
					</p:panelGrid>
				</p:fieldset>
				<p:fieldset id="menuConfig" legend="#{msg.WebMenuConfiguration}">
					<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
						<h:panelGroup>
							<p:selectManyCheckbox value="#{customRoleController.menus}" layout="responsive" columns="4">
								<f:selectItems value="#{customRoleController.listI18nMenus}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
							</p:selectManyCheckbox>
						</h:panelGroup>
					</p:panelGrid>
				</p:fieldset>
				<p:fieldset id="authConfig" legend="#{msg.WebAuthorityConfiguration}">
					<p:repeat var="domainAuth" value="#{customRoleController.authJSONArr}">
						<label class="label">#{domainAuth['v']}</label>
						<p:selectBooleanCheckbox value="#{domainAuth['s']}" label="#{fieldMsg.fieldValue(domainAuth['k'], 's')}" style="display:inline;" rendered="#{not empty fieldMsg.fieldValue(domainAuth['k'], 's')}">
						</p:selectBooleanCheckbox>
						<p:selectBooleanCheckbox value="#{domainAuth['a']}" label="#{fieldMsg.fieldValue(domainAuth['k'], 'a')}" style="display:inline;" rendered="#{not empty fieldMsg.fieldValue(domainAuth['k'], 'a')}">
						</p:selectBooleanCheckbox>
						<p:selectBooleanCheckbox value="#{domainAuth['m']}" label="#{fieldMsg.fieldValue(domainAuth['k'], 'm')}" style="display:inline;" rendered="#{not empty fieldMsg.fieldValue(domainAuth['k'], 'm')}">
						</p:selectBooleanCheckbox>
						<p:selectBooleanCheckbox value="#{domainAuth['d']}" label="#{fieldMsg.fieldValue(domainAuth['k'], 'd')}" style="display:inline;" rendered="#{not empty fieldMsg.fieldValue(domainAuth['k'], 'd')}">
						</p:selectBooleanCheckbox>
						<p:selectBooleanCheckbox value="#{domainAuth['i']}" label="#{fieldMsg.fieldValue(domainAuth['k'], 'i')}" style="display:inline;" rendered="#{not empty fieldMsg.fieldValue(domainAuth['k'], 'i')}">
						</p:selectBooleanCheckbox>
						<p:selectBooleanCheckbox value="#{domainAuth['o']}" label="#{fieldMsg.fieldValue(domainAuth['k'], 'o')}" style="display:inline;" rendered="#{not empty fieldMsg.fieldValue(domainAuth['k'], 'o')}">
						</p:selectBooleanCheckbox>
					</p:repeat>
				</p:fieldset>
				<p:fieldset id="cardConfig" legend="#{msg.WeChatCardConfiguration}">
					<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
						<h:panelGroup>
							<p:selectManyCheckbox value="#{customRoleController.cards}" layout="responsive" columns="4">
								<f:selectItems value="#{customRoleController.listI18nCards}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
							</p:selectManyCheckbox>
						</h:panelGroup>
					</p:panelGrid>
				</p:fieldset>
				<p:fieldset id="assetInventory" legend="#{msg.WeChatAuthorityConfiguration}">
					<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
						<h:panelGroup>
							<label class="label">#{msg.InventoryWorkorder}</label>
							<p:selectManyCheckbox value="#{customRoleController.mapAuthCard['assetInventory']}" layout="responsive" columns="4">
								<f:selectItems value="#{fieldMsg.getFieldValueList('assetInventoryAuthority')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
							</p:selectManyCheckbox>
						</h:panelGroup>
						<h:panelGroup>
							<label class="label">#{msg.ClinicalAssistant}</label>
							<p:selectManyCheckbox value="#{customRoleController.mapAuthCard['nurse']}" layout="responsive" columns="4">
								<f:selectItems value="#{fieldMsg.getFieldValueList('wechatCardNurse')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
							</p:selectManyCheckbox>
						</h:panelGroup>
					</p:panelGrid>

				</p:fieldset>

				<br />
				<p:commandButton validateClient="true" actionListener="#{customRoleController.save}" value="#{msg.Save}"
					update="display,:CustomRoleEditDlg, :CustomRoleListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'CustomRoleEditDialog');" />
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{customRoleController.clear}" icon="ui-icon-cancel"
					onclick="PF('CustomRoleEditDialog').hide()" />
			</h:panelGroup>
		</h:form>
	</p:dialog>

</ui:composition>
</html>
