<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="CustomRoleEditDlg" widgetVar="CustomRoleEditDialog" width="800" height="450" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{customRoleController.CRUDActionName} #{msg.CustomRole}">
            <h:form id="CustomRoleEditForm">
                <h:panelGroup id="display" >
                    <p:fieldset id = "title" legend="角色描述" >
                        <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class ="label">#{msg.name}*</label>
                                <p:inputText id="name" value="#{customRoleController.selected.name}" required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class ="label">角色描述</label>
                                <p:inputText id="roleDesc" value="#{customRoleController.selected.roleDesc}" />
                            </h:panelGroup>
                            <h:panelGroup rendered="false">
                                <label class ="label">主页</label>
                                <p:inputText id="homePage" value="#{customRoleController.selected.homePage}" disabled="true" />
                            </h:panelGroup>
                        </p:panelGrid>
                    </p:fieldset>

                    <p:fieldset id = "assetInventory" legend="盘点权限配置">
                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                            <h:panelGroup>
                                <label class ="label">权限</label>
                                <p:selectManyCheckbox value="#{customRoleController.authorities}" layout="responsive" columns="4">
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetInventoryAuthority')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                                </p:selectManyCheckbox>
                            </h:panelGroup>
                            <h:panelGroup>
                                <label class ="label">卡片</label>
                                <p:selectManyCheckbox value="#{customRoleController.cards}" layout="responsive" columns="4" >
                                    <f:selectItems value="#{fieldMsg.getFieldValueList('assetInventoryCard')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}" />
                                </p:selectManyCheckbox>
                            </h:panelGroup>
                        </p:panelGrid>

                    </p:fieldset>

                    <br/>
                    <p:commandButton validateClient="true" actionListener="#{customRoleController.save}" value="#{msg.Save}" update="display,:CustomRoleEditDlg, :CustomRoleListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'CustomRoleEditDialog');"/>
                    &nbsp;&nbsp;
                    <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('CustomRoleEditDialog').hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
