<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12">
                <div class="ui-g-12 card cardTitle">
                    <p:outputLabel class="pageTitle" value="#{msg.CustomRole}"/>
                </div>
            <h:form id="CustomRoleListForm">
                <p:dataTable id="datalist" value="#{customRoleController.lazyModel}" var="item" widgetVar="varDataList"
                    selectionMode="single" selection="#{customRoleController.selected}"
                    lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                    rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                    paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                    currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                    rows="20" emptyMessage="#{msg.noRecordFound}"
                    rowsPerPageTemplate="20,40,60,90">

                    <p:ajax event="rowSelect" update="createButton editButton deleteButton"/>
                    <p:ajax event="filter" listener="#{customRoleController.onFilter}" update="createButton editButton deleteButton"/>

                    <p:column headerText="#{msg.name}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column headerText="#{msg.roleDesc}" sortBy="#{item.roleDesc}" filterBy="#{item.roleDesc}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.roleDesc}"/>
                    </p:column>
<!--                    <p:column headerText="主页" sortBy="#{item.homePage}" filterBy="#{item.homePage}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.homePage}"/>
                    </p:column>-->
                    <p:column headerText="网页端菜单" sortBy="#{item.menusCH}" filterBy="#{item.menusCH}" filterMatchMode="LIKE" >
                        <h:outputText value="#{item.menusCH}"/>
                    </p:column>
                    <p:column headerText="网页端权限" sortBy="#{item.webAuthoritiesCH}" filterBy="#{item.webAuthoritiesCH}" filterMatchMode="LIKE" >
                        <h:outputText value="#{item.webAuthoritiesCH}"/>
                    </p:column>
                    <p:column headerText="微信端卡片" sortBy="#{item.cardsCH}" filterBy="#{item.cardsCH}" filterMatchMode="LIKE" >
                        <h:outputText value="#{item.cardsCH}"/>
                    </p:column>
                    <p:column headerText="微信端权限" sortBy="#{item.authoritiesCH}" filterBy="#{item.authoritiesCH}" filterMatchMode="LIKE" >
                        <h:outputText value="#{item.authoritiesCH}"/>
                    </p:column>
                    <f:facet name="{Toolbar}">
                       <!-- <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
                            <p:dataExporter type="xls" target="datalist" fileName="CustomRole_export"/>
                        </p:commandButton>-->
                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" actionListener="#{customRoleController.prepareCreate}" update=":CustomRoleEditDlg" oncomplete="PF('CustomRoleEditDialog').show()"/>
                        <!--<p:commandButton id="viewButton" icon="ui-icon-search" class="btn btn-sm btn-gray" title="#{msg.View}" actionListener="#{customRoleController.prepareView}" update=":CustomRoleViewDlg" oncomplete="PF('CustomRoleViewDialog').show()" disabled="#{empty customRoleController.selected}"/>-->
                        <p:commandButton id="editButton" icon="ui-icon-pencil" class="btn btn-sm btn-gray" actionListener="#{customRoleController.prepareEdit}" update=":CustomRoleEditDlg" oncomplete="PF('CustomRoleEditDialog').show()" disabled="#{empty customRoleController.selected}"/>
                        <p:commandButton id="deleteButton" icon="ui-icon-close" class="btn btn-sm btn-gray" actionListener="#{customRoleController.delete}" update=":CustomRoleEditDlg,datalist" disabled="#{empty customRoleController.selected}">
                            <p:confirm header="#{msg.DeleteConformation}" message="确定要删除这条记录吗？" icon="ui-icon-warning"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>
            </h:form>

            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>

            </div>
        </div>
        
    </ui:define>

</ui:composition>
