<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <script type="text/javascript">
        function deleteAfter() {
            var failureType=document.getElementById("tabview:orgEditForm:failureType");
            if(failureType != null  ){
                let vl = failureType.value;
                if(vl == null || vl==""){
                    return ;
                }else{
                    PF('failureModal').show();
                }
            }
        }
    </script>
            <div class="ui-g-12">

                <h:form id="orgEditForm">

                    <div class="ui-g-12 ui-lg-4">
                        <div class="card" style="height:400px;">
                            <h:panelGroup>
                                <p:inputText id="retrieval" value="#{orgInfoController.retrieval}" placeholder="名称/名称En">
                                    <!--<p:ajax listener="#{orgInfoController.filterNode()}" event="keyup" update="orgTree editPanel :growl"/>-->
                                </p:inputText>
                                <p:commandButton id = "portalMgrSearch" icon="ui-icon-location-searching" actionListener="#{orgInfoController.filterNode()}" update="orgTree editPanel :growl"/>
                                <p:commandButton id = "portalMgrExport" title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" actionListener="#{orgImportController.exportExcel}" update=":growl"
                                                 onclick="PrimeFaces.monitorDownload(start, stop);" ajax="false" >
                                    <p:fileDownload value="#{orgImportController.excelFile}" />
                                </p:commandButton>
                            </h:panelGroup>
                            <p:scrollPanel style="height:98%;border: 0" mode="native">
                                <p:tree id="orgTree"  class="tree" style="width:98%;border:0;" value="#{orgInfoController.orgTree}" var="node" selectionMode="single" selection="#{orgInfoController.selectedNode}" highlight="true"
                                        draggable="true" droppable="true" onDrop="#{orgInfoController.onDrop}">
                                    <p:ajax process="@this" event="select" listener="#{orgInfoController.onSelectTreeNode}" update="@form:editPanel"/>

                                    <p:treeNode type="org">
                                        <h:outputText value="#{node.shortName}"/>
                                    </p:treeNode>
                                    <p:treeNode type="hidden" rendered="false"/>
                                </p:tree>
                            </p:scrollPanel>
                        </div>
                    </div>

                    <div class="ui-g-12 ui-lg-8">
                        <div class="card" style="height:400px;">
                            <h:panelGroup id="editPanel">
                                <h:panelGrid columns="8">
                                    <p:commandButton id="createInstution" process="@this" icon="ui-icon-plus" value="#{msg.Create} #{msg.Institution}" actionListener="#{orgInfoController.prepareCreateInstitution}" update="@form:editPanel" disabled="#{orgInfoController.isCreateInstitutionDisabled}"/>
                                    <p:commandButton id="createHospital" process="@this" icon="ui-icon-plus" value="#{msg.Create} #{msg.Hospital}" actionListener="#{orgInfoController.prepareCreateHospital}" update="@form:editPanel" disabled="#{orgInfoController.isCreateHospitalDisabled}"/>
                                    <p:commandButton id="createSite" process="@this" icon="ui-icon-plus" value="#{msg.Create} #{msg.Site}" actionListener="#{orgInfoController.prepareCreateSite}" update="@form:editPanel" disabled="#{orgInfoController.isCreateSiteDisabled}"/>
                                    <p:commandButton id="createDept" process="@this" icon="ui-icon-plus" value="#{msg.Create} #{msg.Department}" actionListener="#{orgInfoController.prepareCreateDepartment}" update="@form:editPanel" disabled="#{orgInfoController.isCreateDepartmentDisabled}"/>
                                    <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" value="#{msg.Delete}" actionListener="#{orgInfoController.deleteSelectedOrg}" update="@form" oncomplete="deleteAfter();" disabled="#{empty orgInfoController.selected or empty orgInfoController.selected.id}">
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </h:panelGrid>
                                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" style="width: 70%" rendered="#{orgInfoController.selected ne null}">
                                    <h:panelGroup>
                                        <label class="label">#{msg.parentId}</label>
                                        <p:outputLabel value="#{orgInfoController.selected.parentOrg}" rendered="#{orgInfoController.selected.parentOrg ne null}"/>
                                        <p:outputLabel value="N/A" rendered="#{orgInfoController.selected.parentOrg eq null}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">#{msg.type}</label>
                                        <p:outputLabel value="#{orgInfoController.selected.orgTypeName}"/>
                                    </h:panelGroup>

                                    <h:panelGroup rendered="#{orgInfoController.acShow and false}">
                                        <label class="label">#{msg.EquipmentOwnerA}</label>
                                        <p:selectOneMenu value="#{orgInfoController.selected.assetOwnerId}" requiredMessage="#{msg.caseType} #{msg.ValidationRequire}">
                                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                            <f:selectItems value="#{orgInfoController.findPerson()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup>

                                    <h:panelGroup rendered="#{orgInfoController.acShow and false}">
                                        <label class="label">#{msg.EquipmentOwnerB}</label>
                                        <p:selectOneMenu value="#{orgInfoController.selected.assetOwnerId2}" requiredMessage="#{msg.caseType} #{msg.ValidationRequire}">
                                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                            <f:selectItems value="#{orgInfoController.findPerson()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup>

                                      <!-- </p:panelGrid>-->
                                        <!--gl end-->

                                    <h:panelGroup>
                                        <label class="label">#{msg.name}*</label>
                                        <p:inputText id="name" value="#{orgInfoController.orgName}"  required="#{param['tabview:orgEditForm:portalMgrSearch']==null and param['tabview:orgEditForm:portalMgrExport']==null}" requiredMessage="#{msg.name} #{msg.ValidationRequire}">
                                            <p:ajax listener="#{orgInfoController.checkName()}" process="@this" update=":growl"></p:ajax></p:inputText>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <label class="label">#{msg.nameEn}</label>
                                        <p:inputText id="nameEn" value="#{orgInfoController.orgNameEn}"/>
                                    </h:panelGroup>

                                    <c:if test="#{orgInfoController.selected.orgType eq 4}">
                                        <h:panelGroup>
                                            <p:inputText id="buildingNum" value="#{orgInfoController.selected.buildingNum}"/><h:outputLabel>#{msg.Building}</h:outputLabel>
                                        </h:panelGroup>

                                        <h:panelGroup>
                                            <p:inputText id="floorNum" value="#{orgInfoController.selected.floorNum}"/><h:outputLabel>#{msg.Floor}</h:outputLabel>
                                        </h:panelGroup>

                                        <h:panelGroup>
                                            <h:outputLabel>#{msg.Other002}</h:outputLabel><p:inputText id="other" value="#{orgInfoController.selected.other}"/>
                                        </h:panelGroup>

                                        <h:panelGroup rendered="#{orgInfoController.isShjyDept}" >
                                            <label class="label">#{msg.DeptStatus}</label>
                                            <p:selectOneMenu value="#{orgInfoController.status}" rendered="true">
                                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                                <f:selectItem itemLabel="#{msg.EnableDept}" itemValue="0" />
                                                <f:selectItem itemLabel="#{msg.DisableDept}" itemValue="1" />
                                            </p:selectOneMenu>
                                        </h:panelGroup>

                                    </c:if>
                                    <h:panelGroup rendered="#{orgInfoController.isShow}">
                                        <label class="label">#{msg.hospitalUcmid}</label>
                                        <p:inputText id="hospitalUcmid" value="#{orgInfoController.hospitalUcmid}" required="false" requiredMessage="#{msg.hospitalUcmid} #{msg.ValidationRequire}">
                                            <p:ajax listener="#{orgInfoController.checkHospitalUcmid()}" process="@this"  update=":growl" ></p:ajax>
                                        </p:inputText>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">#{msg.HospitalCode}</label>
                                        <p:inputText id="orgCode" value="#{orgInfoController.orgCode}" required="false" requiredMessage="#{msg.orgCode} #{msg.ValidationRequire}">
                                            <p:ajax listener="#{orgInfoController.checkOrgCode()}" process="@this"  update=":growl" ></p:ajax>
                                        </p:inputText>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{orgInfoController.countyArea}">
                                        <label class="label">#{msg.address}</label>
                                        <p:inputText id="address" value="#{orgInfoController.address}" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{orgInfoController.countyArea}">
                                        <label class="label">#{msg.contactPerson}</label>
                                        <p:inputText id="contactPerson" value="#{orgInfoController.contactPerson}" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{orgInfoController.countyArea}">
                                        <label class="label">#{msg.contactPhone}</label>
                                        <p:inputText id="contactPhone" value="#{orgInfoController.contactPhone}" validatorMessage="联系电话格式错误">
                                            <f:validateRegex pattern="(^(0|86|17951)?(13[0-9]|15[012356789]|166|17[3678]|18[0-9]|14[57])[0-9]{8}$)|(^0\d{2,3}-?\d{7,8}$)" />
                                        </p:inputText>
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{orgInfoController.selected.orgType ne 4}">
                                        <label class="label">等级性质</label>
                                        <p:inputText id="gradeNature" value="#{orgInfoController.gradeNature}" required="false" requiredMessage="#{msg.gradeNature} #{msg.ValidationRequire}" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{orgInfoController.selected.orgType ne 4}">
                                        <label class="label">所属区域</label>
                                        <p:inputText id="region" value="#{orgInfoController.region}" required="false" requiredMessage="#{msg.region} #{msg.ValidationRequire}" />
                                    </h:panelGroup>

                                    <p:commandButton style="width: 90px;" validateClient="true" icon="ui-icon-check" actionListener="#{orgInfoController.saveSelectedOrg}" value="#{msg.Save}" update="orgTree :growl"/>
                                    <h:inputHidden id="failureType" value="#{orgInfoController.failureType}"/>
                                </p:panelGrid>
                            </h:panelGroup>
                        </div>
                    </div>
                    <p:dialog id="Active" widgetVar="failureModal" width="350" height="100" modal="true" resizable="true" draggable="true" header="删除确认" closable="true">
                        <c:choose>
                            <c:when test="#{orgInfoController.failureType == 1}">
                                <p class="p-m-0" >该组织下有二维码存在,是否要先删除二维码?</p>
                            </c:when>
                            <c:when test="#{orgInfoController.failureType == 2}">
                                <p class="p-m-0" >该组织下有用户权限关联,是否要先解除关联?</p>
                            </c:when>
                            <c:otherwise>
                                <p class="p-m-0" >出错了！</p>
                            </c:otherwise>
                        </c:choose>
                        <h:panelGrid columns="3">
                            <p:commandButton process="@this" icon="ui-icon-close" value="#{orgInfoController.failureType == 1?'删除':'解除'}" actionListener="#{orgInfoController.deleteFailureCode}" update="@form" oncomplete="PF('failureModal').hide()" />
                            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('failureModal').hide()"/>
                        </h:panelGrid>
                    </p:dialog>
                </h:form>
            </div>

</ui:composition>
