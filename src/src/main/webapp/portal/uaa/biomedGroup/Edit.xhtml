<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <p:dialog id="BiomedGroupEditDlg" widgetVar="BiomedGroupEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{biomedGroupController.CRUDActionName} 维修工程师群组" width="60%">
        <h:form id="BiomedGroupEditForm">
            <br/>
            <h:panelGroup id="display">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{biomedGroupController.selected != null}">
                    <h:panelGroup styleClass="md-inputfield">
                        <p:inputText id="name" value="#{biomedGroupController.selected.groupName}"  required="true" requiredMessage="#{msg.name} #{msg.ValidationRequire}"/>
                        <label>维修工程师群组名称*</label>
                    </h:panelGroup>

                </p:panelGrid>
            </h:panelGroup>
            <br/>
            <p:fieldset legend="维修工程师选择" rendered="#{biomedGroupController.selected != null}">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <!--<h:panelGroup >
                        <label class="label">所属医院</label>
                        <p:selectOneMenu id="hospitalId" value="#{biomedGroupController.queryUserAccount.hospitalId}">
                            <p:ajax  listener="#{biomedGroupController.getQueryUserAccountList()}" update="UserAccountPickList" />
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{biomedGroupController.getHospitalListFilter()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>-->
                    <h:panelGroup>
                        <label class="label">#{msg.hospitalId}</label>
                        <p:inputText id="selectedOrgName" value="#{biomedGroupController.selectedOrg==null ? '': biomedGroupController.selectedOrg.name}" readonly="true"/>
                        <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                        <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{biomedGroupController.orgTree}" selection="#{biomedGroupController.selectedNode}" var="node" selectionMode="single">
                                    <p:ajax process="@this" event="select" update=":BiomedGroupEditForm:selectedOrgName, :BiomedGroupEditForm:UserAccountPickList" listener="#{biomedGroupController.onSelectTreeNode}" oncomplete="PF('varPanelOrg').hide();"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>

                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
									<p:treeNode type="hidden" rendered="false"/>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>
                </p:panelGrid>
                <p:pickList id="UserAccountPickList" value="#{biomedGroupController.availableUserAccount}" var="item"
                            itemValue="#{item}" itemLabel="#{item.name}" showCheckbox="false" responsive="true"
                            showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="userAccountConverter" >
                    <f:facet name="sourceCaption">待选维修工程师</f:facet>
                    <f:facet name="targetCaption">已选维修工程师</f:facet>
                    <p:ajax event="transfer" listener="#{biomedGroupController.onUserAccountTransfer}" />
                    <p:column style="width:60%">
                        <h:outputText value="#{item.name}" />
                    </p:column>
                    <p:column style="width:40%">
                        <h:outputText value="#{biomedGroupController.getSiteName(item.siteUID)}" />
                    </p:column>
                </p:pickList>
            </p:fieldset>
            <br/>
            <p:commandButton validateClient="true" actionListener="#{biomedGroupController.save}" value="#{msg.Save}" update="display,:BiomedGroupEditDlg, :BiomedGroupListForm:datalist, :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'BiomedGroupEditDialog');"/>
            &nbsp;&nbsp;
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('BiomedGroupEditDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
