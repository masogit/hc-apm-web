<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>

    <h:form>
        <p:fieldset id="DestroyPanel" legend="租户注销">
                <p>** 数据将被永久删除，且无副本保留</p>
                <p>** 数据均已迁出，且妥善备份，账户注销后不支持提供数据备份</p>
                <p>** 账户注销后将无法找回，此操作为不可逆操作，确保操作人员得到组织授权执行此操作</p>


        </p:fieldset>
        <p:panelGrid id="dddd" columns="1" layout="grid" styleClass="ui-panelgrid-blank">
            <p:selectBooleanButton id="confirm" value="#{userAccountController.confirmDestroy}"
                                   onLabel="再考虑考虑" offLabel="我已知晓相关后果并确认销毁租户">
                <p:ajax update="destroyButton"/>
            </p:selectBooleanButton>
        </p:panelGrid>

        <p:commandButton id="destroyButton" value="注销" actionListener="#{userAccountController.destroyTenant()}" icon="ui-icon-home"
                         disabled="#{!userAccountController.confirmDestroy}">
        <p:confirm header="注销租户" message="注销租户并退出？" icon="ui-icon-alert" />
        </p:commandButton>
    </h:form>

</ui:composition>
</html>
