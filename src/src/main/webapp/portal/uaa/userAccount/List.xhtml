<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<div>
	<h:form id="UserAccountListForm">
		<p:commandButton id="btnOrg" value="#{userAccountController.selectedOrg==null?msg.AllHospitals:userAccountController.selectedOrg.name}" type="button"
			icon="fa fa-angle-down" iconPos="right" />
		<p:overlayPanel widgetVar="varPanelOrg" for="btnOrg" hideEffect="fade" dynamic="false" style="width:300px" modal="false">
			<p:scrollPanel style="height:300px;border: 0" mode="native">
				<p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{userAccountController.orgTree}" selection="#{userAccountController.selectedNode}"
					var="node" selectionMode="single">
					<p:ajax process="@this" event="select" update=":userAccountTab:UserAccountListForm" listener="#{userAccountController.onSelectTreeNode}"
						oncomplete="PF('varPanelOrg').hide();" />
					<p:ajax process="@this" event="expand" />
					<p:ajax process="@this" event="collapse" />

					<p:treeNode type="org">
						<h:outputText value="#{node}" />
					</p:treeNode>
				</p:tree>
			</p:scrollPanel>
		</p:overlayPanel>


		<p:dataTable id="datalist" value="#{userAccountController.lazyModel}" var="item" widgetVar="varDataList" selectionMode="single"
			selection="#{userAccountController.selected}" lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true" rowKey="#{item.id}"
			sortMode="single" sortOrder="descending" sortBy="#{item.id}"
			paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
			currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">

			<p:ajax event="rowSelect" update="createButton editButton viewButton deleteButton roleButton resetPassButton lockButton unlockButton" />
			<p:ajax event="filter" listener="#{userAccountController.onFilter}"
				update="createButton editButton viewButton deleteButton roleButton resetPassButton lockButton unlockButton" />
			<p:column headerText="#{msg.orgId}" sortBy="#{item.orgInfoId}" exportable="false">
				<h:outputText value="#{item.orgFullName}" />
			</p:column>
			<p:column headerText="#{msg.Institution}" exportable="true" visible="false">
				<h:outputText value="#{item.institutionName}" />
			</p:column>
			<p:column headerText="#{msg.Hospital}" exportable="true" visible="false">
				<h:outputText value="#{item.hospitalName}" />
			</p:column>
			<p:column headerText="#{msg.Site}" exportable="true" visible="false">
				<h:outputText value="#{item.siteName}" />
			</p:column>
			<p:column headerText="#{msg.Department}" exportable="true" visible="false">
				<h:outputText value="#{item.departName}" />
			</p:column>
			<p:column headerText="#{msg.login_name}" sortBy="#{item.loginName}" filterBy="#{item.loginName}" filterMatchMode="LIKE">
				<h:outputText value="#{item.loginName}" />
			</p:column>
			<p:column headerText="#{msg.userName}" sortBy="#{item.name}" filterBy="#{item.name}" filterMatchMode="LIKE">
				<h:outputText value="#{item.name}" />
			</p:column>
			<p:column headerText="#{msg.email}" sortBy="#{item.email}">
				<h:outputText value="#{item.email}" />
			</p:column>
			<p:column headerText="#{msg.telephone}" sortBy="#{item.telephone}" filterBy="#{item.telephone}" filterMatchMode="LIKE">
				<h:outputText value="#{item.telephone}" />
			</p:column>
			<p:column rendered="false" headerText="#{msg.isSiteAdmin}" sortBy="#{item.isSiteAdmin}">
				<h:outputText value="#{item.isSiteAdmin? msg.True2Yes : msg.False2No }" />
			</p:column>
			<p:column headerText="#{msg.isActive}" sortBy="#{item.isActive}">
				<h:outputText value="#{item.isActive? msg.True2Yes : msg.False2No }" />
			</p:column>
			<p:column headerText="#{msg.Locked}?" sortBy="#{item.isLocked}">
				<h:outputText value="#{item.isLocked? msg.True2Yes : msg.False2No }" />
			</p:column>
			<p:column headerText="#{msg.roleId}">
				<h:outputText value="#{item.userRoleNames}" />
			</p:column>
			<p:column headerText="UUID" visible="false" exportable="true">
				<h:outputText value="#{item.uid}" />
			</p:column>
			<f:facet name="{Toolbar}">
				<p:commandButton id="createButton" icon="ui-icon-plus" title="#{msg.Create}" actionListener="#{userAccountController.prepareCreate}" process="@this"
					update=":userAccountTab:UserAccountEditDlg" oncomplete="PF('UserAccountEditDialog').show()" />
				<p:commandButton id="viewButton" rendered="false" icon="ui-icon-remove-red-eye" title="#{msg.View}" actionListener="#{userAccountController.prepareView}"
					update=":userAccountTab:UserAccountViewDlg" oncomplete="PF('UserAccountViewDialog').show()" disabled="#{empty userAccountController.selected}" />
				<p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" actionListener="#{userAccountController.prepareEdit}"
					update=":userAccountTab:UserAccountEditDlg" process="@this" oncomplete="PF('UserAccountEditDialog').show()"
					disabled="#{empty userAccountController.selected}" />
				<p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{userAccountController.deleteSelectedUser}"
					update="datalist" disabled="#{empty userAccountController.selected}">
					<p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert" />
				</p:commandButton>
				<p:commandButton id="roleButton" icon="ui-icon-people" process="@this" title="#{msg.AssignRole}" actionListener="#{userAccountController.prepareRoleData}"
					update=":userAccountTab:RoleEditDlg" oncomplete="PF('RoleEditDialog').show()" disabled="#{empty userAccountController.selected}" />
				<p:commandButton id="resetPassButton" icon="ui-icon-repeat" process="@this" title="#{msg.resetPassword}"
					actionListener="#{userAccountController.resetPassword}" update="datalist" disabled="#{empty userAccountController.selected}">
					<p:confirm header="#{msg.ResetConformation}" message="#{msg.ResetConformationMsg}" icon="ui-icon-alert" />
				</p:commandButton>
				<p:commandButton rendered="false" id="lockButton" icon="ui-icon-lock-outline" process="@this" title="#{msg.lockAccount}"
					actionListener="#{userAccountController.lockAccount}" update="datalist" disabled="#{empty userAccountController.selected}">
					<p:confirm header="#{msg.lockAccount}" message="#{msg.lockAccountConfirm}" icon="ui-icon-alert" />
				</p:commandButton>
				<p:commandButton rendered="false" id="unlockButton" icon="ui-icon-lock-open" process="@this" title="#{msg.unlockAccount}"
					actionListener="#{userAccountController.unlockAccount}" update="datalist" disabled="#{empty userAccountController.selected}">
					<p:confirm header="#{msg.unlockAccount}" message="#{msg.unlockAccountConfirm}" icon="ui-icon-alert" />
				</p:commandButton>
				<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
					<p:dataExporter type="xls" target="datalist" fileName="UserAccount_export" />
				</p:commandButton>
			</f:facet>
		</p:dataTable>
	</h:form>

	<ui:include src="Edit.xhtml" />
	<ui:include src="View.xhtml" />
	<ui:include src="Role.xhtml" />

</div>
</html>
