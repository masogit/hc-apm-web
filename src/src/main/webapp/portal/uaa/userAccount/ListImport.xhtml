<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<div class="ui-g">
	<div class="ui-g-12 card">
		<h:form enctype="multipart/form-data">
			<p:fieldset legend="批量导入 用户账号信息" id="uploaderContainer">
				<p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
					<p:fileUpload fileUploadListener="#{userAccountImportController.handleFileUpload}" mode="advanced" dragDropSupport="false" multiple="false" auto="true"
						invalidFileMessage="只支持xls或xlsx格式的文件" invalidSizeMessage="文件大小不得超过5M" update=":userAccountTab:dataListForm, :userAccountTab:UserAccountListForm"
						sizeLimit="5242880" allowTypes="/(\.|\/)(xls|xlsx)$/" label="从Excel导入" cancelLabel="取消" uploadLabel="确认上传" />
				</p:panelGrid>
				<h:panelGroup>
					<p>说明</p>
					<p>
						1. <a href="UserAccountImport_Template.xlsx" title="download">#{msg.downloadTemplateFile}</a>
					</p>
					<p>2. 文件中填入要导入的用户数据</p>
					<p>3. 上传文件进行导入</p>
				</h:panelGroup>
			</p:fieldset>
		</h:form>
	</div>

	<div class="ui-g-12 card">
		<h:form id="dataListForm">
			<p:messages id="messages" showDetail="true" closable="false" autoUpdate="false">
			</p:messages>
			<p:fieldset legend="导入失败的数据">
				<p:dataTable id="datalist2" rendered="#{not empty userAccountImportController.importFailedDataList}"
					value="#{userAccountImportController.importFailedDataList}" var="item" lazy="false" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
					paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
					currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5" rows="20" emptyMessage="#{msg.noRecordFound}" rowsPerPageTemplate="20,50,100,500">
					<p:column headerText="EXCEL行数">
						<h:outputText value="#{item.excelIdex}" />
					</p:column>
					<p:column headerText="所属集团*">
						<h:outputText value="#{item.institutionName}" />
					</p:column>
					<p:column headerText="所属医院">
						<h:outputText value="#{item.hospitalName}" />
					</p:column>
					<p:column headerText="所属院区">
						<h:outputText value="#{item.siteName}" />
					</p:column>
					<p:column headerText="科室1">
						<h:outputText value="#{item.departName}" />
					</p:column>
					<p:column headerText="科室2">
						<h:outputText value="#{item.departName2}" />
					</p:column>
					<p:column headerText="科室3">
						<h:outputText value="#{item.departName3}" />
					</p:column>
					<p:column headerText="登录用户名*">
						<h:outputText value="#{item.loginName}" />
					</p:column>
					<p:column headerText="姓名*">
						<h:outputText value="#{item.name}" />
					</p:column>
					<p:column headerText="Email">
						<h:outputText value="#{item.email}" />
					</p:column>
					<p:column headerText="电话">
						<h:outputText value="#{item.telephone}" />
					</p:column>
					<p:column rendered="false" headerText="#{msg.isSiteAdmin}">
						<h:outputText value="#{item.isSiteAdmin? msg.True2Yes : msg.False2No }" />
					</p:column>
					<p:column headerText="激活?*">
						<h:outputText value="#{item.isActive? msg.True2Yes : msg.False2No }" />
					</p:column>
					<p:column headerText="锁定?*">
						<h:outputText value="#{item.isLocked? msg.True2Yes : msg.False2No }" />
					</p:column>
					<p:column headerText="备注">
						<h:outputText value="#{item.statusDisplay}" />
					</p:column>
					<f:facet name="{Toolbar}">
						<p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" class="btn btn-sm btn-gray" ajax="false">
							<p:dataExporter type="xls" target="datalist2" fileName="UserAccountImportFailed_export" />
						</p:commandButton>
					</f:facet>
				</p:dataTable>
			</p:fieldset>
		</h:form>

	</div>
</div>
</html>
