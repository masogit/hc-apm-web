<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="preRenderView">
        <!--        <f:metadata>
                    <f:viewParam name="isClosed" value="#{workOrderController.filterIsClosed}"/>
                    <f:viewParam name="aid" value="#{workOrderController.filterAssetId}"/>
                </f:metadata>
                <f:event type="preRenderView" listener="#{workOrderController.setViewFilter()}"/>-->
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet name="css/wo_steps.css"/>
    </ui:define>

    <ui:define name="content">
        <div class="ui-g clearfix">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="SR报告未上传 #{msg.List}"/>
            </div>

            <div class="ui-g-12 card">
                <p:messages autoUpdate="true" closable="true" showDetail="false"/>

                <h:form id="dispatchListForm">
                    <p:dataTable id="datalist" value="#{opsSrReportController.lazyModel}" var="item"
                                 widgetVar="varDataList"
                                 selectionMode="single" selection="#{opsSrReportController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.srId}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}" pageLinks="5"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="filter" listener="#{opsSrReportController.onFilter}"/>

                        <p:column headerText="#{msg.assetName}" sortBy="#{item.assetName}" filterBy="#{item.assetName}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>

                        <p:column headerText="外部工单号" sortBy="#{item.srNumber}" filterBy="#{item.srNumber}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.srNumber}"/>
                        </p:column>
                        <p:column headerText="System ID" sortBy="#{item.systemId}"
                                  filterBy="#{item.systemId}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.systemId}"/>
                        </p:column>
                        <p:column headerText="设备类型"
                                  sortBy="#{item.modality}"
                                  filterBy="#{item.modality}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.modality}"/>
                        </p:column>
                        <p:column headerText="维修类型"
                                  sortBy="#{item.srType}"
                                  filterBy="#{item.srType}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.srType}"/>
                        </p:column>
                        <p:column headerText="更新时间" sortBy="#{item.updateTime}" filterBy="#{item.updateTime}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.updateTime}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy-MM-dd HH:mm:ss"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="开始时间"
                                  sortBy="#{item.srOpenDate}"
                                  filterBy="#{item.srOpenDate}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.srOpenDate}"/>
                        </p:column>
                        <p:column headerText="计划时间"
                                  sortBy="#{item.srOpenDate}"
                                  filterBy="#{item.srOpenDate}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.srOpenDate}"/>
                        </p:column>
                        <p:column headerText="FE SSO"
                                  sortBy="#{item.feSso}"
                                  filterBy="#{item.feSso}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.feSso}"/>
                        </p:column>
                        <f:facet name="{Toolbar}">
                            <p:commandButton title="#{msg.exportToXLS}" icon="ui-icon-arrowstop-1-s" ajax="false">
                                <p:dataExporter type="xls" target="datalist" fileName="sr_missing_report_export"/>
                            </p:commandButton>
                        </f:facet>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
