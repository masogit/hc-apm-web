    <ui:define name="content">

                <p:outputLabel class="pageTitle" value="SR报告未上传 #{msg.List}"/>

            <div class="ui-g-12 card">
                <p:messages autoUpdate="true" closable="true" showDetail="false"/>

                <h:form id="dispatchListForm">
                    <p:dataTable id="datalist" value="#{opsSrReportController.lazyModel}" var="item"
                                 widgetVar="varDataList"
                                 selectionMode="single" selection="#{opsSrReportController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"

                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="filter" listener="#{opsSrReportController.onFilter}"/>

                        <p:column headerText="#{msg.assetName}" sortBy="#{item.assetName}" filterBy="#{item.assetName}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetName}"/>
                        </p:column>

                        <p:column headerText="外部工单号" sortBy="#{item.eventUid}" filterBy="#{item.eventUid}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.eventUid}"/>
                        </p:column>
                        <p:column headerText="更新时间" sortBy="#{item.createTime}" filterBy="#{item.createTime}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.createTime}"/>
                        </p:column>
                        <p:column headerText="System ID" sortBy="#{item.assetInfo.systemId}"
                                  filterBy="#{item.assetInfo.systemId}"
                                  filterMatchMode="LIKE">
                            <h:outputText value="#{item.assetInfo.systemId}"/>
                        </p:column>

                    </p:dataTable>
                </h:form>
            </div>
        </div>
