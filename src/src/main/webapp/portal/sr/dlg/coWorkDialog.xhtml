<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>

    <p:dialog class="coworkerDlg" id="coworkerDlg" widgetVar="coworkerDlg" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="协作者">
        <h:form id="coworkerDlgForm" >
            <h:panelGroup id="display42">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">#{msg.coworker}</label>
                        <p:selectOneMenu id="selectEmployee" value="#{workOrderListController.coWorkerDetail.cowokerUserId}" required="true">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{workOrderListController.findRepairPerson()}" var="item1" itemLabel="#{item1.name}" itemValue="#{item1.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">内部工时(小时)</label>
                        <p:inputText id="manHours" value="#{workOrderListController.coWorkerDetail.manHours}" required="true"/>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderListController.addCoWorkerItem}" rendered="#{workOrderListController.renderAddUpdate()}" value="#{msg.Add}" update=":repairCompleteDialogForm:coworkerList :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'coworkerDlg');"/>

                    <p:commandButton validateClient="true" actionListener="#{workOrderListController.coWorkerEditDetailConfirm}" rendered="#{!workOrderListController.renderAddUpdate()}" value="#{msg.Edit}" update="repairCompleteDialogForm:coworkerList :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'coworkerDlg');"/>

                    <p:commandButton immediate="true" actionListener="#{workOrderListController.cancelNewCoWoker}" value="#{msg.Cancel}" update=":repairCompleteDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'coworkerDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
