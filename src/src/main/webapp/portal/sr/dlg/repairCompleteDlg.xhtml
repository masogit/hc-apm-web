<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="repairCompleteDialog" widgetVar="repairCompleteDialog" modal="true" height="400" width="1000"  resizable="false" draggable="true" appendTo="@(body)" header="#{msg.workcomplete}">
        <h:form id="repairCompleteDialogForm" >
            <h:panelGroup id="display5" rendered="#{not empty workOrderListController.selectedWorkOrder}">
                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">签到时间</label>
                        <h:inputText id="time"  value="#{workOrderListController.checkInDate}" />
                        <p:commandButton process="@this" title="签到"  actionListener="#{workOrderListController.checkIn}" update=":repairCompleteDialogForm:time" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.recoveryTime}</label>
                        <p:calendar timeZone="GMT+8" id="fillDate" pattern="yyyy/MM/dd"  value="#{workOrderListController.confirmedUpDate}" showOn="button" showButtonPanel="true" navigator="true" readonlyInput="false" locale= "zh" required="true" requiredMessage="恢复时间 #{msg.ValidationRequire}"></p:calendar>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.caseType}</label>
                        <p:selectOneMenu  value="#{workOrderListController.selectedWorkOrder.caseType}" required="true" requiredMessage="#{msg.caseType} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{workOrderListController.getAssetFaultType()}" var="item" itemLabel="#{item.faultName}" itemValue="#{item.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.patProblems}</label>
                        <p:inputTextarea value="#{workOrderListController.selectedWorkOrder.patProblems}" rows="3"  cols="40"  queryDelay="750" maxlength="100"  minQueryLength="4"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.patActions}</label>
                        <p:inputTextarea value="#{workOrderListController.selectedWorkOrder.patActions}" rows="3"  cols="40"  queryDelay="750" minQueryLength="4"/>
                    </h:panelGroup>
                    <h:panelGroup>

                        <label class="label">#{msg.patTests}</label>
                        <p:inputTextarea value="#{workOrderListController.selectedWorkOrder.patTests}" rows="3"  cols="40"  queryDelay="750" minQueryLength="4"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.comments}</label>
                        <p:inputTextarea value="#{workOrderListController.comments}" rows="3"  cols="40"  queryDelay="750" maxlength="100"  minQueryLength="4"/>
                    </h:panelGroup>

                </p:panelGrid>
                <!-- <label class="label">签到时间</label>
                 <h:inputText id="time1"  value="#{workOrderListController.checkInDate}" />
                 <p:commandButton process="@this" title="签到"  actionListener="#{workOrderListController.checkIn}" update=":repairCompleteDialogForm:time1" />-->
                <p:fieldset legend="费用明细" >
                    <h:panelGroup colum="2" >
                        <h:panelGroup>
                            <label class="label">工时(小时)</label>
                            <p:inputText value="#{workOrderListController.manHours}" required="true" requiredMessage="工时(小时) #{msg.ValidationRequire}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">其它费用</label>
                            <p:inputText value="#{workOrderListController.otherExpense}" />
                        </h:panelGroup>
                    </h:panelGroup>

                    <h:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">增加备件</label>
                            <p:dataTable id="accessList" class="uiTransparent" value="#{workOrderListController.accessList}" var="item" widgetVar="varAccessListList" lazy="false" paginator="false" rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.accessory}">
                                    <h:outputText value="#{item.parts}"/>
                                </p:column>

                                <p:column headerText="#{msg.accessoryQuantity}">
                                    <h:outputText value="#{item.apartsQuantity}"/>
                                </p:column>
                                <p:column headerText="#{msg.accessoryPrice}">
                                    <h:outputText value="#{item.partsPrice}"/>
                                </p:column>

                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{workOrderListController.prepareCreateDetail()}" update=":moreAccDialogDlg :moreAccDialogForm" oncomplete="PF('moreAccDialogDlg').show()" rendered="#{!workOrderListController.isAccessListEmpty()}"/>
                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{workOrderListController.accEditDetail(item)}" update=":moreAccDialogDlg :moreAccDialogForm" oncomplete="PF('moreAccDialogDlg').show()" rendered="#{!workOrderListController.isAccessListEmpty()}" />
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{workOrderListController.deleteItem(item.id,1)}" update=":repairCompleteDialogForm:accessList" >
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.addworker}"</label>
                            <p:dataTable id="coworkerList" class="uiTransparent" value="#{workOrderListController.coWorkerList}" var="item" widgetVar="coworkerDataList" lazy="false" paginator="false"
                                         rowKey="#{item.id}" rows="1000" emptyMessage="#{msg.noRecordFound}">
                                <p:column headerText="#{msg.manHours}">
                                    <h:outputText value="#{item.manHours}" />
                                </p:column>
                                <p:column headerText="#{msg.coworker}">
                                    <h:outputText value="#{item.cowokerUserName}"/>
                                </p:column>
                                <p:column headerText="#{msg.Actions}">
                                    <p:commandButton process="@this" icon="ui-icon-add" style="zoom:0.8;" title="#{msg.Create}" actionListener="#{workOrderListController.prepareCreateCoWorkerDetail()}" update=":coworkerDlg :coworkerDlgForm" oncomplete="PF('coworkerDlg').show()"/>
                                    <p:commandButton process="@this" icon="ui-icon-pencil" style="zoom:0.8;" title="#{msg.Edit}" actionListener="#{workOrderListController.coworkerEditDetail(item)}" update=":coworkerDlg" oncomplete="PF('coworkerDlg').show()"  />
                                    <p:commandButton process="@this" icon="ui-icon-close" style="zoom:0.8;" title="#{msg.Delete}" actionListener="#{workOrderListController.deleteItem(item.id,2)}" update=":repairCompleteDialogForm:coworkerList" >
                                        <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>

                    </h:panelGrid>
                </p:fieldset>
                <!--维修完成 转单 新建工单-->
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderListController.repairWorkOrder()}" value="#{msg.workcomplete}" update=":repairCompleteDialogForm :growl :processListForm:datalist " icon="ui-icon-check" oncomplete="handleSubmit(args, 'repairCompleteDialog');"/>
                    <p:commandButton value="#{msg.transfer}" immediate="true" update=":transferOrderDialogForm1" oncomplete="PF('transferOrderDialog1').show()"/>
                    <p:commandButton immediate="true"  value="#{msg.newWorkOrder}" update=":newWorkorderDlgForm :growl"  oncomplete="PF('newWorkorderDlg').show()"/>
                    <p:commandButton immediate="true" value="#{msg.Cancel}" actionListener="#{workOrderListController.initWorkOrderDetailList()}" icon="ui-icon-cancel" onclick="PF('repairCompleteDialog').hide()"/>
                </h:panelGroup>
                <br/>
            </h:panelGroup>
        </h:form>

    </p:dialog>
    <p:dialog id="transferOrderDialog1" immediate="true" widgetVar="transferOrderDialog1" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="#{msg.transfer}">
        <h:form id="transferOrderDialogForm1" >
            <h:panelGroup id="display2" rendered="#{not empty workOrderListController.selectedWorkOrder}">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.WorkOrderAssignee}</label>
                        <p:selectOneMenu  value="#{workOrderListController.selectedWorkOrder.currentPersonId}" required="true" requiredMessage="#{msg.currentPersonId} #{msg.ValidationRequire}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{workOrderListController.findRepairPerson()}" var="item" itemLabel="#{item.name}" itemValue="#{item.id}"/>

                        </p:selectOneMenu>
                    </h:panelGroup>
                </p:panelGrid>
                <br/>

            </h:panelGroup>
            <h:panelGroup>
                <p:commandButton validateClient="true" actionListener="#{workOrderListController.reassignWorkOrder(4)}" value="#{msg.transfer}" update=":transferOrderDialogForm1 :growl :processListForm:datalist" icon="ui-icon-check" oncomplete="handleSubmit(args, 'transferOrderDialog1')" onclick="PF('repairCompleteDialog').hide();('transferOrderDialog1').hide()"/>
                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('transferOrderDialog1').hide()"/>
            </h:panelGroup>
        </h:form>
    </p:dialog>

    <ui:include src="newOrderDialog.xhtml"/>
    <!--<ui:include src="expenseDialogforComplete.xhtml"/>-->
    <ui:include src="moreAccDialog.xhtml"/>
    <ui:include src="coWorkDialog.xhtml"/>

</ui:composition>
</html>
