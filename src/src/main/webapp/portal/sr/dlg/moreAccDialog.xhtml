<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<ui:composition>
    <p:dialog class="moreAccDialogDlg" id="moreAccDialogDlg"  widgetVar="moreAccDialogDlg" modal="true" width="500"  resizable="true" draggable="true" appendTo="@(body)" header="备件">
        <h:form id="moreAccDialogForm" >
            <h:panelGroup id="display42">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">备件名称</label>
                        <p:inputText id="parts" value="#{workOrderListController.itemDetail.parts}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备件(数量)</label>
                        <p:inputText id="apartsQuantity" value="#{workOrderListController.itemDetail.apartsQuantity}" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">备件单价(元)</label>
                        <p:inputText id="partsPrice" value="#{workOrderListController.itemDetail.partsPrice}" />
                    </h:panelGroup>
                </p:panelGrid>
                <br/>
                <h:panelGroup>
                    <p:commandButton validateClient="true" actionListener="#{workOrderListController.addAcessItem}" rendered="#{workOrderListController.renderAddUpdate()}" value="#{msg.Add}" update=":repairCompleteDialogForm:accessList :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogDlg');"/>

                    <p:commandButton validateClient="true" actionListener="#{workOrderListController.updateEditDetail}" rendered="#{!workOrderListController.renderAddUpdate()}" value="#{msg.Edit}" update=":repairCompleteDialogForm:accessList :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogDlg');"/>

                    <p:commandButton immediate="true" actionListener="#{workOrderListController.cancelNewWorkdetail}" value="#{msg.Cancel}" update=":repairCompleteDialogForm :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'moreAccDialogDlg');"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </p:dialog>

</ui:composition>
</html>
