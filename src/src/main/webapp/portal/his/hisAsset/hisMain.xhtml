
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:his="http://www.ge.com/tags/his">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.deviceMatching}"/>
            </div>

            <div class="ui-g-12 card ">
                <h:form id="HisOrgForm">
                    <div style="border: 0px solid;margin: 10px 10px 15px 0px">
                        <his:selectOrg update="@(form)"></his:selectOrg>
                    </div>
                </h:form>
                <p:tabView id="HisTab" class="tabs">
                    <p:tab title="数据匹配" id="showList">
                        <ui:include src="hisMatch.xhtml"/>
                    </p:tab>
                    <p:tab title="取消匹配" id="result">
                        <ui:include src="hisUnmatch.xhtml"/>
                    </p:tab>
                    <p:tab title="设备导入" id="import">
                        <ui:include src="hisAssetImport.xhtml"/>
                    </p:tab>
                    <p:tab title="运行中的任务" id="taskList">
                        <f:event type="preRenderComponent" listener="#{hisAdjustBusinessJobController.setTaskType(2)}"/>
                        <ui:include src="hisTaskList.xhtml"/>
                    </p:tab>
                </p:tabView>

                <p:dialog id="resetTaskDialog" widgetVar="resetTaskDialog" modal="true" resizable="true" draggable="true" header="确认重置" width="40%">
                    <h:form id="resetTaskForm">
                        <p:fieldset legend="重置任务状态">
                            <h:outputText value="确定将该任务状态重置为待执行吗？" style="font-size:14px;"/>
                        </p:fieldset>
                        <p:commandButton value="#{msg.Confirm}" icon="ui-icon-check"
                                         actionListener="#{hisAdjustBusinessJobController.resetFailedTask()}"
                                         update=":HisTab:TaskListForm :growl"
                                         oncomplete="handleSubmit(args, 'resetTaskDialog');"/>
                        <p:commandButton immediate="true" value="#{msg.Cancel}" type="button" icon="ui-icon-cancel" onclick="PF('resetTaskDialog').hide()"/>
                    </h:form>
                </p:dialog>

            </div>
        </div>
    </ui:define>
</ui:composition>
