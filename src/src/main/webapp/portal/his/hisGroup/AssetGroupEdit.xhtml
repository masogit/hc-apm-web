<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:apm="http://www.ge.com/tags/apm">

<ui:composition>

    <p:dialog id="hisTagEditDlg" widgetVar="hisTagEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="科室设备分组" width="70%" height="750">
        <h:form id="hisTagEditForm">

            <p:fieldset legend="选择分组" >
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">设备分组<span style="color:red">*</span></label>
                        <p:selectOneMenu id="assetGroup" value="#{hisAssetGroupEditController.selected.assetGroupUid}" required="true" disabled="#{hisAssetGroupEditController.editMode}"
                                         requiredMessage="请选择设备所属分组">
                            <p:ajax event="itemSelect"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{hisAssetGroupEditController.getHisAssetGroups()}" var="item" itemLabel="#{item.name}——#{fieldMsg.fieldValue('HisAssetGroupType',item.type)}" itemValue="#{item.uuid}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                </p:panelGrid>
            </p:fieldset>
            <p:fieldset legend="选择设备" >
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup rendered="#{!hisAssetGroupEditController.editMode}">
                        <label class="label">#{msg.hospitalId}<span style="color:red">*</span></label>
                        <apm:selectSiteOrgByOrgTree update="@(form)" oncomplete=";buttonComplete(xhr, status, args)" />

                    </h:panelGroup>

                    <h:panelGroup rendered="#{hisAssetGroupEditController.editMode}">
                        <label class="label">#{msg.hospitalId}<span style="color:red">*</span></label>
                        <p:inputText value="#{hisAssetGroupEditController.selectedOrg==null ? '': hisAssetGroupEditController.selectedOrg.name}" readonly="true" required="true" disabled="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.clinicalDeptName}<span style="color:red">*</span></label>
                        <p:selectOneMenu id="clinicalDeptName" class="SiteUIDChange"
                                         value="#{hisAssetGroupEditController.filterDeptOrg}"
                                         converter="orgInfoConverter" panelStyle="width:180px" style="width: 180px"
                                         filter="true" filterMatchMode="contains" filterNormalize="true"
                                         disabled="#{hisAssetGroupEditController.editMode and hisAssetGroupEditController.selected.hisAssetGroup.type eq 'Income'}">
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{hisAssetGroupEditController.autoCompleteDept('')}" var="item"
                                           itemLabel="#{item.name}" itemValue="#{item}"/>
                            <p:ajax process="@this" listener="#{hisAssetGroupEditController.onClinicalDeptChange()}"
                                    update="HisAssetsPickList selectAssetInfos"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.assetGroup}</label>
                        <p:selectOneMenu  id="assetTypeGroup" value="#{hisAssetGroupEditController.assetGroup}" >
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            <p:ajax/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class='label'>采购金额:(元)</label>
                        <p:inputNumber id="purchasePrice" value="#{hisAssetGroupEditController.purchasePrice}">
                            <p:ajax/>
                        </p:inputNumber>
                    </h:panelGroup>

                    <p:commandButton  validateClient="false" immediate="true" actionListener="#{hisAssetGroupEditController.getQueryAssetsList2()}"
                                     value="查询" update="HisAssetsPickList" oncomplete="buttonComplete(xhr, status, args)" process="@this"
                                     icon="ui-icon-check"
                    />

                    <h:panelGrid id="filterType" columns="2" >
                        <p:commandButton process="@this" update="HisAssetsPickList filterType" actionListener="#{hisAssetGroupEditController.setSubEquipment(false)}"  rendered="true" disabled="#{!hisAssetGroupEditController.selected.getIsSubEquipment()}" value="主设备"/>
                        <p:commandButton process="@this" update="HisAssetsPickList filterType" actionListener="#{hisAssetGroupEditController.setSubEquipment(true)}"  rendered="false" disabled="#{hisAssetGroupEditController.selected.getIsSubEquipment()}" value="子设备"/>
                    </h:panelGrid>

                </p:panelGrid>

                <p:pickList id="HisAssetsPickList" value="#{hisAssetGroupEditController.availableAssets}" var="item" widgetVar="item"
                            itemValue="#{item}" itemLabel="#{item.name}-#{item.departNum}-#{item.serialNum}-#{item.clinicalDeptName}-#{item.functionType}-#{item.qrCode}" showCheckbox="false" responsive="true"
                            showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="assetInfoConverter" immediate="true"  >
                    <f:facet name="sourceCaption">

                        <p  style="padding-bottom:-200px">#{msg.EquipmentToBeSelected}
                            <br/> <br/>
                            <span style="width:20%;float: left">#{msg.name}</span>
                            <span style="width:30%;float: left">#{msg.departNum}</span>
                            <span style="width:20%;float: left">#{msg.functionType}</span>
                            <span style="width:30%;float: left">#{msg.clinicalDeptName}</span>
                            <br/>
                        </p>
                    </f:facet>
                    <f:facet name="targetCaption">
                        <p  style="padding-bottom:-200px">#{msg.SelectedEquipment}
                            <br/> <br/>
                            <span style="width:20%;float: left">#{msg.name}</span>
                            <span style="width:30%;float: left">#{msg.departNum}</span>
                            <span style="width:20%;float: left">#{msg.functionType}</span>
                            <span style="width:30%;float: left">#{msg.clinicalDeptName}</span>
                            <br/>
                        </p>
                    </f:facet>
                    <p:ajax event="transfer" update="@(form)" listener="#{hisAssetGroupEditController.onAssetsTransfer}" oncomplete="buttonComplete(xhr, status, args)"/>
                    <p:column style="width:20%;">
                        <h:outputText value="#{item.name}" />
                    </p:column>
                    <p:column style="width:30%;">
                        <h:outputText value="#{item.departNum}" />
                    </p:column>
                    <p:column style="width:20%;">
                        <h:outputText value="#{item.functionType}" />
                    </p:column>
                    <p:column style="width:30%;">
                        <h:outputText value="#{item.clinicalDeptName}" />
                    </p:column>
                </p:pickList>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <p:commandButton validateClient="false"   immediate="true"  value="添加已勾选设备"
                                     update="@(form)" process="@this" oncomplete="buttonComplete(xhr, status, args)"
                                     action="#{hisAssetGroupEditController.addAssetInfo}" />

                    <p:commandButton validateClient="false"   immediate="true"  value="一键均摊"
                                     update="@(form)" process="@this" oncomplete="buttonComplete(xhr, status, args)"
                                     action="#{hisAssetGroupEditController.sharedEquallyProportion}" style="float:right;" />
                </p:panelGrid>

                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                    <p:dataTable id="selectAssetInfos" value="#{hisAssetGroupEditController.selectAssetInfos}" var="asset"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{asset.id}" sortMode="single" sortOrder="descending"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}" filterDelay="1200"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:column width="40" id="checkBoxCol">
                            <p:selectBooleanCheckbox value="#{hisAssetGroupEditController.selectedMap[asset.uid]}" class="selectCheckBox2">
                                <p:ajax event="change" listener="#{hisAssetGroupEditController.updateSelctedAssetList}"   update="@(.selectCheckBoxHeader)"/>
                                <f:attribute name="assetObj" value="#{asset}"/>
                            </p:selectBooleanCheckbox>
                            <f:facet name="header">
                                <p:selectBooleanCheckbox value="#{hisAssetGroupEditController.isAllSelected}" id="selectCheckBoxHeader" class="selectCheckBoxHeader">
                                    <p:ajax event="change" listener="#{hisAssetGroupEditController.addAssetsOfCurrentPage}" update="@(.selectCheckBox2)" />
                                </p:selectBooleanCheckbox>
                            </f:facet>
                        </p:column>
                        <p:column headerText="#{msg.preventiveMaintenanceAnalysis_deviceName}">
                            <h:outputText value="#{asset.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.departNum}">
                            <h:outputText value="#{asset.departNum}"/>
                        </p:column>
                        <p:column headerText="#{msg.serialNum}">
                            <h:outputText value="#{asset.serialNum}"/>
                        </p:column>
                        <p:column headerText="二维码编号">
                            <h:outputText value="#{asset.qrCode}"/>
                        </p:column>
                        <p:column headerText="分摊比例(%)">
                            <p:inputNumber    minValue="0" decimalPlaces="2"  roundMethod="ROUND_DOWN"	 value="#{asset.scaleAssessment}" inputStyle="text-align: center">
                                <p:ajax event="change"   update="@(form)"/>
                            </p:inputNumber>
                        </p:column>
                    </p:dataTable>
                </p:panelGrid>

                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <p:commandButton validateClient="false" immediate="true" value="删除已勾选设备"
                                     update="@(form)" process="@this" oncomplete="buttonComplete(xhr, status, args)"
                                     action="#{hisAssetGroupEditController.removeAssetInfo}" />
                    <p:commandButton  validateClient="false"   immediate="true"    value="清空"
                                      update="@(form)" process="@this" oncomplete="buttonComplete(xhr, status, args)"
                                     action="#{hisAssetGroupEditController.clearAssetInfo}" />
                </p:panelGrid>

            </p:fieldset>

            <p:fieldset legend="输入更新设备时间范围" rendered="#{hisAssetGroupEditController.editMode and hisAssetGroupEditController.assetsUpdated}" id="timeframe">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                    <h:panelGroup>
                        <label class="label">更新设备起始时间<span style="color:red">*</span></label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}"
                                    required="true"
                                    pattern="yyyy/MM/dd"
                                    value="#{hisAssetGroupEditController.updateStartDate}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true"
                                    navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">更新设备结束时间<span style="color:red">*</span></label>
                        <p:calendar timeZone="GMT+8" label="#{msg.EstimatedArrivalTime}"
                                    required="true"
                                    pattern="yyyy/MM/dd"
                                    value="#{hisAssetGroupEditController.updateEndDate}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true"
                                    navigator="true" mask="true"
                                 maxdate="#{hisAssetGroupEditController.today}"/>

                    </h:panelGroup>

                </p:panelGrid>
            </p:fieldset>

            <p:commandButton validateClient="true" actionListener="#{hisAssetGroupEditController.checkSaveGroup()}" value="#{msg.Save}" update=":tabGroup:hisTagEditDlg :tabGroup:hisListForm:datalist" icon="ui-icon-check"  oncomplete="handleComplete(xhr, status, args,'hisTagEditDialog');"/>
            &nbsp;&nbsp;
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('hisTagEditDialog').hide()"/>
        </h:form>
    </p:dialog>

    <p:dialog  widgetVar="checkScaleAssessment"  modal="true" class="checkScaleAssessment" draggable="false" closable="false" resizable="false" showHeader="false">
        <p:fieldset legend="分组中有设备分摊比列为空,确定保存吗？">
            <p:commandButton validateClient="true" actionListener="#{hisAssetGroupEditController.save()}" value="是" icon="ui-icon-check"
                       oncomplete="handleSubmit(args, 'hisTagEditDialog'); handleSubmit(args, 'checkScaleAssessment');" />
            <p:commandButton immediate="true" value="否" icon="ui-icon-arrow-back" oncomplete="PF('checkScaleAssessment').hide()"  update=":growl"/>
        </p:fieldset>
    </p:dialog>

    <script type="text/javascript">

        function updateSelectAllCheckBox() {
            var checkboxlist = $(".selectCheckBox");
            var selectAllstatus = true;
            checkboxlist.each(function () {
                selectAllstatus = selectAllstatus &amp;&amp; this.children[0].children[0].checked;
            });
            $("#AssetInfoListForm\\:datalist\\:selectCheckBoxHeader_input").attr('checked', selectAllstatus);
            if (selectAllstatus) {
                $(".selectCheckBoxHeader")[0].children[1].classList.add("ui-state-active");
            } else {
                $(".selectCheckBoxHeader")[0].children[1].classList.remove("ui-state-active");
            }
        }

        function handleComplete(xhr, status, args,dialog) {
            var isScaleNull = args.isScaleNull;
            var scaleTooBig = args.scaleTooBig;

            if(isScaleNull==true ) {
                PF(dialog).show();
                PF('checkScaleAssessment').show()
            }
            if(scaleTooBig==true ) {
                PF(dialog).show();
            }
        }
    </script>

</ui:composition>
</html>
