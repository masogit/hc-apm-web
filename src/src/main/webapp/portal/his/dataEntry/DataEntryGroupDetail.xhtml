<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core"
        xmlns:ui="http://java.sun.com/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"

        xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

<ui:composition>

    <p:dialog id="dataEntryGroupDetailDialog" widgetVar="dataEntryGroupDetailDialog" modal="true" resizable="true"
              draggable="true" appendTo="@(body)" header="分组数据录入详情" width="70%" height="650">
        <h:form id="dataEntryGroupCreateDetail">
            <p:fieldset>
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">选择分组<span style="color:red">*</span></label>
                            <p:autoComplete dropdown="true" value="#{dataEntryCreateController.selectHisAssetGroupAssetMatch}"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{dataEntryCreateController.hisAssetGroupsString}"
                                            class="groupNameChange" id="groupNameChange" var="item"  itemValue="#{item}"  itemLabel="#{item.groupNameOrgName}"  converter="hisAssetGroupConverter"  disabled="#{ not empty dataEntryCreateController.selected.uid}" >
                                <p:ajax event="itemSelect"  listener="#{dataEntryCreateController.getGroupMatchAsset}"/>
                            </p:autoComplete>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">录入类型<span style="color:red">*</span></label>
                        <p:selectOneMenu id="entryType"  value="#{dataEntryCreateController.selected.entryType}" disabled="#{ not empty dataEntryCreateController.selected.uid}"
                                         required="true"
                                         requiredMessage="请选择录入类型" collectionType="java.util.ArrayList">
                            <p:ajax event="itemSelect"/>
                            <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                            <f:selectItems value="#{dataEntryCreateController.costType}" var="item"
                                           itemLabel="#{item.get('key')}" itemValue="#{item.get('value')}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">录入金额(元)</label>
                        <p:inputNumber minValue="0" decimalPlaces="2" id="entryAmount"
                                       value="#{dataEntryCreateController.selected.entryAmount}" required="true"
                                       requiredMessage="录入金额必填">
                            <p:ajax event="change" listener="#{dataEntryCreateController.sharedEntryAmount}" update="dataEntryGroupCreateDetail:selectAssetInfos"  />
                            <p:ajax event="change"  listener="#{dataEntryCreateController.checkDataEntryUpdate}" update="dataEntryGroupCreateDetail:saveButtonId"  />

                        </p:inputNumber>
                    </h:panelGroup>


                    <h:panelGroup>
                        <label class="label">生效开始时间</label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                    locale="#{userContextService.getCalendarLocale()}" id="startDate"
                                    pattern="#{userContextService.timeFormat()}"
                                    value="#{dataEntryCreateController.selected.startDate}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true"
                                    mask="true" required="true" requiredMessage="生效开始时间必填">
                            <p:ajax event="dateSelect"   listener="#{dataEntryCreateController.checkDataEntryUpdate}" update="dataEntryGroupCreateDetail:saveButtonId" />
                        </p:calendar>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">生效结束时间</label>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}"
                                    locale="#{userContextService.getCalendarLocale()}" id="endDate"
                                    pattern="#{userContextService.timeFormat()}"
                                    value="#{dataEntryCreateController.selected.endDate}"
                                    showOn="button" readonlyInput="false" showButtonPanel="true" navigator="true"
                                    mask="true" required="true" requiredMessage="生效结束时间必填">
                            <p:ajax event="dateSelect"   listener="#{dataEntryCreateController.checkDataEntryUpdate}" update="dataEntryGroupCreateDetail:saveButtonId" />

                        </p:calendar>
                    </h:panelGroup>
                </p:panelGrid>

                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                    实时设备
                    <p:dataTable id="selectAssetInfos" value="#{dataEntryCreateController.selectAssetInfos}" var="asset"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{asset.uuid}" sortMode="single" sortOrder="descending"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}" filterDelay="1200"
                                 rowsPerPageTemplate="20,50,100,500">
                        <p:column headerText="分组名称">
                            <h:outputText value="#{asset.hisAssetGroup.name}"/>
                        </p:column>
                        <p:column headerText="设备名称">
                            <h:outputText value="#{asset.assetInfo.name}"/>
                        </p:column>
                        <p:column headerText="金额(元)">

                            <p:inputNumber    minValue="0" decimalPlaces="2"   readonly="true"  roundMethod="ROUND_DOWN"	 value="#{asset.amount}" inputStyle="text-align: center">
                            </p:inputNumber>
                        </p:column>
                        <p:column headerText="分摊比例">
                            <p:inputNumber    minValue="0" decimalPlaces="2"   readonly="true"  roundMethod="ROUND_DOWN"	 value="#{asset.scaleAssessment}" inputStyle="text-align: center">
                            </p:inputNumber>
                        </p:column>
                    </p:dataTable>
                </p:panelGrid>


                <c:forEach items="#{dataEntryCreateController.hisGroupDataEntryHistories}" var="dataentry">


                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">

                        历史记录 <br/> <br/>
                        #{dataentry.dataStartDate}-#{dataentry.dataEndDate}
                        <p:dataTable id="selectAssetInfos1" value="#{dataentry.assetGroupDetailList}" var="asset"
                                     lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                     rowKey="#{asset.uuid}" sortMode="single" sortOrder="descending"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="20" emptyMessage="#{msg.noRecordFound}" filterDelay="1200"
                                     rowsPerPageTemplate="20,50,100,500">
                            <p:column headerText="分组名称">
                                <h:outputText value="#{asset.groupName}"/>
                            </p:column>
                            <p:column headerText="设备名称">
                                <h:outputText value="#{asset.assetName}"/>
                            </p:column>
                            <p:column headerText="金额(元)">

                                <p:inputNumber    minValue="0" decimalPlaces="2"   readonly="true"  roundMethod="ROUND_DOWN"	 value="#{asset.amount}" inputStyle="text-align: center">
                                </p:inputNumber>
                            </p:column>
                            <p:column headerText="分摊比例">
                                <p:inputNumber    minValue="0" decimalPlaces="2"   readonly="true"  roundMethod="ROUND_DOWN"	 value="#{asset.scaleAssessment}" inputStyle="text-align: center">

                                </p:inputNumber>

                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>

                </c:forEach>

            </p:fieldset>


            <p:commandButton  id="saveButtonId"  actionListener="#{dataEntryCreateController.save}" value="#{msg.Save}" update=":tabDataEntry:DataEntryGroupForm:datalist" icon="ui-icon-check" oncomplete="handleSubmitDigital(args, 'dataEntryGroupDetailDialog');"  disabled="#{dataEntryCreateController.saveDisable}"/>
            &nbsp;&nbsp;
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('dataEntryGroupDetailDialog').hide()"/>


        </h:form>
    </p:dialog>
    <script type="text/javascript">
        function handleSubmitDigital(args, dialog) {
            if (args.validationFailed) {
                PF(dialog).show();
            } else {
                PF(dialog).hide();
            }
        }
    </script>
</ui:composition>
</html>
