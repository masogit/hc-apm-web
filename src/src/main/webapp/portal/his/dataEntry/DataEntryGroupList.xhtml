<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <div class="ui-g">


        <div class="ui-g-12 card">


            <h:form id="DataEntryGroupForm">
                <p:dataTable id="datalist" value="#{dataEntryController.lazyModel}"
                             var="item" widgetVar="datalist" sortField="lastModifiedDate" sortBy="lastModifiedDate"
                             lazy="true" paginator="true" paginatorPosition="both"
                             paginatorAlwaysVisible="true"
                             selectionMode="single" selection="#{dataEntryController.selected}"
                             rowKey="#{item.uid}" sortMode="single" sortOrder="descending"
                             paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                             currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                             rows="20" emptyMessage="#{msg.noRecordFound}"
                             rowsPerPageTemplate="20,50,100,500">
                    <p:ajax event="rowSelect" listener="#{dataEntryController.onSelectDataEntry}" update=" editButton deleteButton"/>
                    <p:ajax event="filter" listener="#{dataEntryController.onFilter}"/>
                    <p:column headerText="分组名称" sortBy="#{item.hisAssetGroup.name}"  filterBy="#{item.hisAssetGroup.name}" filterMatchMode="LIKE">
                        <h:outputText value="#{item.hisAssetGroup.name}" />
                    </p:column>

                    <p:column  headerText="录入类型" sortBy="#{item.entryType}" filterBy="#{item.entryType}" filterMatchMode="EQ">
                        <f:facet name="filter">
                            <p:selectOneMenu  onchange="PF('datalist').filter()"   value="#{dataEntryController.filterEntryType}" >
                                <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{fieldMsg.getFieldValueList('HisEntryType')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{fieldMsg.fieldValue('HisEntryType',item.entryType)}"/>

                    </p:column>

                    <p:column headerText="录入金额(元)" sortBy="#{item.entryAmount}"  filterBy="#{item.entryAmount}" filterMatchMode="GET" >
                        <h:outputText value="#{item.entryAmount}">
                            <f:convertNumber maxFractionDigits="2" minFractionDigits="2" />
                        </h:outputText>
                    </p:column>

                    <p:column  headerText="生效开始时间" sortBy="#{item.startDate}" filterBy="#{item.startDate}" filterMatchMode="GTE">
                        <f:facet name="filter">
                            <p:inputText id="filterStartDate" widgetVar="varFilterStartDate" value="#{dataEntryController.selectedObject['startDate']}"/>
                        </f:facet>
                        <h:outputText value="#{item.startDate}">
                            <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                        </h:outputText>
                    </p:column>
                    <p:column  headerText="生效结束时间" sortBy="#{item.endDate}" filterBy="#{item.endDate}" filterMatchMode="GTE">
                        <f:facet name="filter">
                            <p:inputText id="filterEndDate" widgetVar="varFilterEndDate" value="#{dataEntryController.selectedObject['endDate']}"/>
                        </f:facet>
                        <h:outputText value="#{item.endDate}">
                            <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="创建人"  filterBy="#{item.createdName}" filterMatchMode="LIKE" >
                        <h:outputText value="#{item.createdName}"/>
                    </p:column>
                    <p:column headerText="修改人"   filterBy="#{item.lastModifiedUserAccount.name}" filterMatchMode="LIKE" >
                        <h:outputText value="#{item.lastModifiedUserAccount.name}"/>
                    </p:column>

                    <p:column  headerText="修改时间" sortBy="#{item.lastModifiedDate}" filterBy="#{item.lastModifiedDate}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterCreatedDate" widgetVar="varFilterCreatedDate" value="#{dataEntryController.selectedObject['lastModifiedDate']}"/>
                            </f:facet>
                            <h:outputText value="#{item.lastModifiedDate}">
                                <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat14()}"  />
                            </h:outputText>
                    </p:column>
                    <f:facet name="{Toolbar}">
                        <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" update=":tabDataEntry:DataEntryGroupForm  :tabDataEntry:dataEntryGroupCreate" actionListener="#{dataEntryController.prepareCreate}" oncomplete="PF('dataEntryGroupCreateDialog').show()"/>
                        <p:commandButton id="editButton" icon="ui-icon-pencil" title="#{msg.Edit}" update=":tabDataEntry:DataEntryGroupForm :tabDataEntry:dataEntryGroupCreateDetail" actionListener="#{dataEntryController.prepareEdit}" oncomplete="PF('dataEntryGroupDetailDialog').show()" disabled="#{empty dataEntryController.selected}" />
                        <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}"
                                         actionListener="#{dataEntryController.delete}" update="datalist"
                                         disabled="#{empty dataEntryController.selected}">
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}"
                                       icon="ui-icon-alert"/>
                        </p:commandButton>
                    </f:facet>
                </p:dataTable>

                <p:overlayPanel widgetVar="panelFilterStartDate" for="tabDataEntry:DataEntryGroupForm:datalist:filterStartDate" dismissable="false">
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varStartDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        <p:outputLabel value="#{msg.To}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varStartDateTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    </h:panelGrid>
                    <p:commandButton onclick="setDateFilter('datalist', 'varFilterStartDate', 'varStartDateFrom', 'varStartDateTo'); PF('panelFilterStartDate').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFilterStartDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                </p:overlayPanel>


                <p:overlayPanel widgetVar="panelFilterEndDate" for="tabDataEntry:DataEntryGroupForm:datalist:filterEndDate" dismissable="false">
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varEndDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        <p:outputLabel value="#{msg.To}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varEndDateTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    </h:panelGrid>
                    <p:commandButton onclick="setDateFilter('datalist', 'varFilterEndDate', 'varEndDateFrom', 'varEndDateTo'); PF('panelFilterEndDate').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFilterEndDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                </p:overlayPanel>

                <p:overlayPanel widgetVar="panelFilterCreatedDate" for="tabDataEntry:DataEntryGroupForm:datalist:filterCreatedDate" dismissable="false">
                    <h:panelGrid columns="2">
                        <p:outputLabel value="#{msg.From}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varCreatedDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                        <p:outputLabel value="#{msg.To}"/>
                        <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varCreatedDateTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                    </h:panelGrid>
                    <p:commandButton onclick="setDateFilter('datalist', 'varFilterCreatedDate', 'varCreatedDateFrom', 'varCreatedDateTo'); PF('panelFilterCreatedDate').hide();" title="#{msg.Confirm}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
                    <p:commandButton onclick="PF('panelFilterCreatedDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
                </p:overlayPanel>
            </h:form>
            <ui:include src="DataEntryGroupCreate.xhtml"/>
            <ui:include src="DataEntryGroupDetail.xhtml"/>

        </div>
    </div>

</ui:composition>

</html>
