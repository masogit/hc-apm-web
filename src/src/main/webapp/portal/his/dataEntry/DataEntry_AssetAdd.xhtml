<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:apm="http://www.ge.com/tags/apm">
<ui:composition>

    <h:form id="AssetAddForm">
        <div style="border: 0px solid ">

            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">

                <h:panelGroup >
                    <label class="label">#{msg.hospitalId}</label>
                    <apm:selectSiteOrgByOrgTree update="@(form)"/>

                </h:panelGroup>


                <h:panelGroup>
                    <label class="label">#{msg.clinicalDeptName}</label>
                    <p:autoComplete id="clinicalDeptName" required="true" dropdown="true"
                                    value="#{dataEntryCreateController.filterDeptOrg}"
                                    scrollHeight="300" forceSelection="true"
                                    completeMethod="#{dataEntryCreateController.autoCompleteDept}"
                                    var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter"
                                    class="SiteUIDChange">
                        <p:ajax event="itemSelect"/>
                    </p:autoComplete>

                </h:panelGroup>
            </p:panelGrid>
            <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <h:panelGroup>
                    <label class="label">#{msg.assetGroup}</label>
                    <p:selectOneMenu id="assetGroup" value="#{dataEntryCreateController.assetGroup}">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item"
                                       itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                        <p:ajax event="change"></p:ajax>
                    </p:selectOneMenu>
                </h:panelGroup>

                <h:panelGroup>
                    <label class='label'>设备名称</label>
                    <p:inputText id="assetName" value="#{dataEntryCreateController.assetName}">
                        <p:ajax event="change"></p:ajax>

                    </p:inputText>
                </h:panelGroup>


                <h:panelGroup>
                    <label class='label'>设备二维码</label>
                    <p:inputText id="qrCode" value="#{dataEntryCreateController.qrCode}">
                        <p:ajax event="change"></p:ajax>

                    </p:inputText>
                </h:panelGroup>

                <h:panelGroup>
                    <label class='label'>设备序列号</label>
                    <p:inputText id="serialNum" value="#{dataEntryCreateController.serialNum}">
                        <p:ajax event="change"></p:ajax>

                    </p:inputText>
                </h:panelGroup>

                <h:panelGroup>
                    <p:commandButton validateClient="false" immediate="true"  process="@this"
                                     actionListener="#{dataEntryCreateController.getQueryAssetsList()}" value="检索"
                                     update="AssetAddForm:datalist" disabled="#{dataEntryCreateController.CRUDActionName.equals('修改')}"/>
                </h:panelGroup>


            </p:panelGrid>
        </div>

        <p:dataTable id="datalist" value="#{dataEntryCreateController.assetInfos}" var="item" widgetVar="varDataList"
                     selectionMode="single"
                     lazy="true" paginator="true" paginatorPosition="top" paginatorAlwaysVisible="true"
                     rowKey="#{item.uid}" sortMode="single" sortOrder="descending"
                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                     rows="20" emptyMessage="#{msg.noRecordFound}"
                     rowsPerPageTemplate="20,50,100,500">

            <p:column width="36" exportable="false">
                <p:selectBooleanCheckbox value="#{dataEntryCreateController.selectedMap[item.uid]}" disabled="#{dataEntryCreateController.CRUDActionName.equals('修改')}"
                                         class="selectCheckBox1">
                    <p:ajax event="change" listener="#{dataEntryCreateController.updateSelctedAssetList}" update="@(.selectCheckBoxHeader)"/>
                    <f:attribute name="assetObj" value="#{item}"/>
                </p:selectBooleanCheckbox>
<!--                <f:facet name="header">-->
<!--                    <p:selectBooleanCheckbox value="#{dataEntryCreateController.isAllSelected}"-->
<!--                                             id="selectCheckBoxHeader" class="selectCheckBoxHeader" disabled="#{dataEntryCreateController.CRUDActionName.equals('修改')}">-->
<!--                        <p:ajax event="change" listener="#{dataEntryCreateController.addAssetsOfCurrentPage}"-->
<!--                                update="@(.selectCheckBox1)"/>-->
<!--                    </p:selectBooleanCheckbox>-->
<!--                </f:facet>-->
            </p:column>

            <p:column headerText="设备名称">
                <h:outputText value="#{item.name}"/>
            </p:column>
            <p:column headerText="二维码">
                <h:outputText value="#{item.qrCode}"/>
            </p:column>
            <p:column headerText="序列号">
                <h:outputText value="#{item.serialNum}"/>
            </p:column>
            <p:column headerText="所属科室">
                <h:outputText value="#{item.clinicalDeptName}"/>
            </p:column>

        </p:dataTable>
        <br/>
        <h:panelGroup>
            <p:commandButton action="#{dataEntryCreateController.confirm}" value="选择选中设备" icon="ui-icon-check"
                             update="selectAssets" disabled="#{dataEntryCreateController.CRUDActionName.equals('修改')}"/>
        </h:panelGroup>

        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
            <p:dataTable id="selectAssets" value="#{dataEntryCreateController.selectAssets}" var="asset"
                         selectionMode="single"
                         lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                         rowKey="#{asset.uid}" sortMode="single" sortOrder="descending"
                         paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} 转到 {JumpToPageDropdown} 页 #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                         currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                         rows="20" emptyMessage="#{msg.noRecordFound}" filterDelay="1200"
                         rowsPerPageTemplate="20,50,100,500">
                <p:column width="40" id="checkBoxCol">
                    <p:selectBooleanCheckbox value="#{dataEntryCreateController.selectedMap2[asset.uid]}"
                                             class="selectCheckBox2">
                        <p:ajax event="change" listener="#{dataEntryCreateController.updateSelctedAssetList2}" update="@(.selectCheckBoxHeader2)"/>
                        <f:attribute name="assetObj" value="#{asset}"/>
                    </p:selectBooleanCheckbox>
                    <f:facet name="header">
                        <p:selectBooleanCheckbox value="#{dataEntryCreateController.isAllSelected2}"
                                                 id="selectCheckBoxHeader2" class="selectCheckBoxHeader2">
                            <p:ajax event="change" listener="#{dataEntryCreateController.addAssetsOfCurrentPage2}" update="@(.selectCheckBox2)"/>
                        </p:selectBooleanCheckbox>
                    </f:facet>
                </p:column>
                <p:column headerText="设备名称">
                    <h:outputText value="#{asset.name}"/>
                </p:column>
                <p:column headerText="二维码">
                    <h:outputText value="#{asset.qrCode}"/>
                </p:column>
                <p:column headerText="序列号">
                    <h:outputText value="#{asset.serialNum}"/>
                </p:column>
                <p:column headerText="所属科室">
                    <h:outputText value="#{asset.clinicalDeptName}"/>
                </p:column>
            </p:dataTable>
        </p:panelGrid>



    </h:form>

</ui:composition>

</html>
