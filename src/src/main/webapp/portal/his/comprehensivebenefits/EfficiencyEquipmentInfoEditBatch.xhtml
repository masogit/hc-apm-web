<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="efficiencyEquipmentInfoEditBatch" width="50%" height="300"
              widgetVar="efficiencyEquipmentInfoEditBatch" modal="true" resizable="true" draggable="true" appendTo="@(body)"
              header="批量修改">
        <div class="ui-g-12 card">
            <h:form id="efficiencyEquipmentEditBatchForm">


                <p:fieldset legend="效益设备信息" style="margin-bottom:20px"  >
                    <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank form-group" >
                        <h:panelGroup>
                            <label class="label">展示名称<span style="color:red">*</span></label>
                            <p:inputText minValue="0" required="true" decimalPlaces="1" id="displayName" value="#{efficiencyEquipmentInfoController.displayName}">
                                <p:ajax />
                            </p:inputText>
                        </h:panelGroup>


                        <h:panelGroup>
                        <label class="label">阳性率(%)<span style="color:red">*</span></label>
                        <p:inputNumber minValue="0" decimalPlaces="1" id="positiveRate" value="#{efficiencyEquipmentInfoController.positiveRate}"
                                     required="true"  requiredMessage="阳性率必填" >
                            <p:ajax />
                        </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">检查人次</label>
                            <p:inputNumber minValue="0" decimalPlaces="1" id="checkNumberPeople" value="#{efficiencyEquipmentInfoController.expectedCheckNumberPeople}"
                                          >
                                <p:ajax />
                            </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">预期年收入(元)</label>
                            <p:inputNumber minValue="0" decimalPlaces="1" id="expectedAnnualIncome" value="#{efficiencyEquipmentInfoController.expectedAnnualIncome}"
                            >
                                <p:ajax />
                            </p:inputNumber>
                        </h:panelGroup>
                    </p:panelGrid>
                </p:fieldset>

                <p:commandButton validateClient="true" actionListener="#{efficiencyEquipmentInfoController.editBatch}"
                                 value="保存" update=":EfficiencyEquipmentInfoListForm:datalist :growl :efficiencyEquipmentEditBatchForm"
                                 icon="ui-icon-check"
                                 oncomplete="handleSubmitDigital(args, 'efficiencyEquipmentInfoEditBatch')"/>

                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('efficiencyEquipmentInfoEditBatch').hide()"/>



            </h:form>

        </div>
    </p:dialog>

    <script type="text/javascript">
        function handleSubmitDigital(args, dialog) {
            if (args.validationFailed) {
                PF(dialog).show();
            } else {
                PF(dialog).hide();
            }
        }
    </script>

</ui:composition>
</html>
