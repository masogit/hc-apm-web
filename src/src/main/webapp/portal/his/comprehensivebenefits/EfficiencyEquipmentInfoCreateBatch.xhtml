<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="efficiencyEquipmentInfotSettingEditBatch" width="75%" height="600"
              widgetVar="efficiencyEquipmentInfotSettingEditBatch" modal="true" resizable="true" draggable="true" appendTo="@(body)"
              header="新增效益设备">
        <div class="ui-g-12 card">
            <h:form id="efficiencyEquipmentBatchForm">


                    <p:panelGrid columns="5" layout="grid" styleClass="ui-panelgrid-blank form-group">

                        <h:panelGroup>
                            <label class="label">#{msg.hospitalId}<span style="color:red">*</span></label>
<!--                            <apm:selectSiteOrgByOrgTree update="@(form)"/>-->

                            <p:inputText id="selectedOrgName" value="#{efficiencyEquipmentCreateBatchController.selectedOrg==null ? '': efficiencyEquipmentCreateBatchController.selectedOrg.name}" readonly="true" required="true"/>
                            <p:commandButton id="btnOrg" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                            <p:overlayPanel id="popupPanel" widgetVar="varPanelOrg1" for="btnOrg" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                                <p:scrollPanel style="height:300px;border: 0" mode="native">
                                    <p:tree id="orgTree1" class="tree" style="width:98%;border:0;" value="#{efficiencyEquipmentCreateBatchController.orgTree}" selection="#{efficiencyEquipmentCreateBatchController.selectedNode}" var="node" selectionMode="single">
                                        <p:ajax process="@this" event="select" update="efficiencyEquipmentBatchForm"  listener="#{efficiencyEquipmentCreateBatchController.onSelectTreeNode2}" oncomplete="PF('varPanelOrg1').hide()"/>
                                        <p:ajax process="@this" event="expand"/>
                                        <p:ajax process="@this" event="collapse"/>
                                        <p:treeNode type="org">
                                            <h:outputText value="#{node}"/>
                                        </p:treeNode>
                                        <p:treeNode type="hidden" rendered="false"/>
                                    </p:tree>
                                </p:scrollPanel>
                            </p:overlayPanel>

                        </h:panelGroup>


                        <h:panelGroup>
                            <label class="label">#{msg.clinicalDeptName}<span style="color:red">*</span></label>
                            <p:autoComplete id="clinicalDeptName" required="true" dropdown="true" value="#{efficiencyEquipmentCreateBatchController.filterDeptOrg}"
                                            scrollHeight="300"  forceSelection="true" completeMethod="#{efficiencyEquipmentCreateBatchController.autoCompleteDept}"
                                            var="t" itemLabel="#{t.name}" itemValue="#{t}" converter="orgInfoConverter" class="SiteUIDChange">
                                <p:ajax event="itemSelect" listener="#{efficiencyEquipmentCreateBatchController.onClinicalDeptChange()}"  update="datalist"/>

                            </p:autoComplete>
                        </h:panelGroup>
                        <h:panelGroup>
                            <label class="label">#{msg.assetGroup}</label>
                            <p:selectOneMenu  id="assetGroup" value="#{efficiencyEquipmentCreateBatchController.assetGroup}" >
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <label class='label'>采购金额下限(元)</label>
                            <p:inputNumber id="purchasePrice" value="#{efficiencyEquipmentCreateBatchController.purchasePrice}">
                                <p:ajax/>
                            </p:inputNumber>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:commandButton actionListener="#{efficiencyEquipmentCreateBatchController.getQueryAssetsList()}"
                                             value="查询" update="datalist" immediate="true" validateClient="false" process="@this"
                                             icon="ui-icon-check"
                            />
                        </h:panelGroup>
                    </p:panelGrid>


                <p:fieldset legend="设备" id="assetList" style="margin-bottom:20px">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:dataTable id="datalist" value="#{efficiencyEquipmentCreateBatchController.selectAssetInfos}"
                                     var="item"
                                     widgetVar="configEditList1"
                                     lazy="true" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="10" emptyMessage="#{msg.noRecordFound}"
                                     rowsPerPageTemplate="5,10,20,50">
                            <p:ajax event="filter" listener="#{efficiencyEquipmentCreateBatchController.onFilter}" update="datalist"/>
                            <p:ajax event="page" />
                            <p:column width="40" id="checkBoxCol">
                                <p:selectBooleanCheckbox value="#{efficiencyEquipmentCreateBatchController.selectedAssetUidTable1[item.uid]}" class="selectCheckBox1">
                                    <p:ajax event="change" listener="#{efficiencyEquipmentCreateBatchController.updateSelctedAssetList1}" update="@(.selectCheckBoxHeader1)"/>
                                    <f:attribute name="assetObj" value="#{item}"/>
                                </p:selectBooleanCheckbox>
                                <f:facet name="header">
                                    <p:selectBooleanCheckbox value="#{efficiencyEquipmentCreateBatchController.allSelected1}" id="selectCheckBoxHeader1" class="selectCheckBoxHeader1">
                                        <p:ajax event="change" listener="#{efficiencyEquipmentCreateBatchController.addAssetsOfCurrentPage1}" update="@(.selectCheckBox1)"/>
                                    </p:selectBooleanCheckbox>
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.assetName}">
                                <h:outputText value="#{item.name}" />
                            </p:column>
                            <p:column headerText="#{msg.functionType}" >
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}">
<!--                                <f:facet name="filter" >-->
<!--                                    <p:selectOneMenu onchange="PF('configEditList1').filter()" >-->
<!--                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>-->
<!--                                        <f:selectItems value="#{fieldMsg.getFieldValueList('assetGroup')}" var="item" itemLabel="#{item.value}" itemValue="#{item.msgKey}"/>-->
<!--                                    </p:selectOneMenu>-->
<!--                                </f:facet>-->
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}">
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.qrCode}" >
                                <h:outputText value="#{item.qrCode}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}">
<!--                                <f:facet name="filter" >-->
<!--                                    <p:selectOneMenu onchange="PF('configEditList1').filter()" >-->
<!--                                        <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true"/>-->
<!--                                        <f:selectItems value="#{specialAssetBatchController.cacheOrgList}" var="org" itemLabel="#{org.name}" itemValue="#{org.uid}"/>-->
<!--                                    </p:selectOneMenu>-->
<!--                                </f:facet>-->
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:commandButton validateClient="true" actionListener="#{efficiencyEquipmentCreateBatchController.addCheckedDevice}" value="添加已勾选设备" icon="fa fa-filter" process="@form" update="assetList assetList2 :growl"
                                       >
                        </p:commandButton>
                    </p:panelGrid>
                    <p:panelGrid columns="1" layout="grid" id="assetList2" styleClass="ui-panelgrid-blank form-group ">
                        <p:dataTable id="datalist1" value="#{efficiencyEquipmentCreateBatchController.selectAsset}"
                                     var="item"
                                     widgetVar="selectedTable"
                                     lazy="true" paginator="true" paginatorPosition="both"
                                     paginatorAlwaysVisible="true" sortOrder="descending" sortBy="#{item.id}"
                                     paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown} {Exporters}"
                                     currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                     rows="10" emptyMessage="#{msg.noRecordFound}" rowKey="#{item.id}"
                                     rowsPerPageTemplate="5,10,20,50">
                            <p:ajax event="page" />
                            <p:column width="40" id="checkBoxCol1">
                                <p:selectBooleanCheckbox value="#{efficiencyEquipmentCreateBatchController.selectedAssetUidTable2[item.uid]}" class="selectCheckBox2">
                                    <p:ajax event="change" listener="#{efficiencyEquipmentCreateBatchController.updateSelctedAssetList2}" update="@(.selectCheckBoxHeader2)"/>
                                    <f:attribute name="assetObj" value="#{item}"/>
                                </p:selectBooleanCheckbox>
                                <f:facet name="header">
                                    <p:selectBooleanCheckbox value="#{efficiencyEquipmentCreateBatchController.allSelected2}" id="selectCheckBoxHeader2" class="selectCheckBoxHeader2">
                                        <p:ajax event="change" listener="#{efficiencyEquipmentCreateBatchController.addAssetsOfCurrentPage2}" update="@(.selectCheckBox2)"/>
                                    </p:selectBooleanCheckbox>
                                </f:facet>
                            </p:column>
                            <p:column headerText="#{msg.assetName}" >
                                <h:outputText value="#{item.name}" />
                            </p:column>
                            <p:column headerText="#{msg.functionType}"  >
                                <h:outputText value="#{item.functionType}"/>
                            </p:column>
                            <p:column headerText="#{msg.assetGroup}" >
                                <h:outputText value="#{fieldMsg.doGetFieldValue('assetGroup',item.assetGroup)}"/>
                            </p:column>
                            <p:column headerText="#{msg.departNum}" >
                                <h:outputText value="#{item.departNum}"/>
                            </p:column>
                            <p:column headerText="#{msg.qrCode}" >
                                <h:outputText value="#{item.qrCode}"/>
                            </p:column>
                            <p:column headerText="#{msg.clinicalDeptName}" >
                                <h:outputText value="#{item.clinicalDeptName}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panelGrid>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group ">
                        <p:commandButton  validateClient="true" actionListener="#{efficiencyEquipmentCreateBatchController.deleteCheckedDevice}" value="删除已勾选设备" update="assetList assetList2 :growl" icon="ui-icon-check"/>
                        <p:commandButton  value="全部清空" actionListener="#{efficiencyEquipmentCreateBatchController.clearAll}"  icon="ui-icon-cancel" update="assetList assetList2 :growl" />
                    </p:panelGrid>
                </p:fieldset>




                <p:commandButton validateClient="true" actionListener="#{efficiencyEquipmentCreateBatchController.save}"
                                 value="#{msg.Save}" update=":EfficiencyEquipmentInfoListForm:datalist :growl"
                                 icon="ui-icon-check"
                                 oncomplete="handleSubmitDigital(args, 'efficiencyEquipmentInfotSettingEditBatch')"/>

                <p:commandButton immediate="true" value="#{msg.Cancel}" icon="ui-icon-cancel"
                                 onclick="PF('efficiencyEquipmentInfotSettingEditBatch').hide()"/>
<!--                update="#{efficiencyEquipmentCreateBatchController.cancel}"-->
            </h:form>

        </div>
    </p:dialog>

    <script type="text/javascript">
        function handleSubmitDigital(args, dialog) {
            if (args.validationFailed) {
                PF(dialog).show();
            } else {
                PF(dialog).hide();
            }
        }
    </script>

</ui:composition>
</html>
