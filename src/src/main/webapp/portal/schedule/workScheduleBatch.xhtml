<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <style>
            .grid3{
                border: 1px solid #bdbdbd;
                width: 160px;
                margin-left: 10px;
            }
            .grid3 label[for]{
                padding-left: 20px;
            }

        </style>
        <p:dialog id="workScheduleBatchDlg" widgetVar="workScheduleBatchDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.BatchWorkSchedule}">
            <h:form id="workScheduleBatchForm">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.StartTime}*</label>
                        <p:calendar id="StartTime" timeZone="#{userContextService.getTimeZone()}"  pattern="#{userContextService.timeFormat()}" locale = "#{userContextService.getCalendarLocale()}" value="#{workScheduleController.startBatchDate}" required="true" requiredMessage="#{msg.StartTime} #{msg.ValidationRequire}" showOn="button" disabled="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">#{msg.EndTime}*</label>
                        <p:calendar  timeZone="#{userContextService.getTimeZone()}"  pattern="#{userContextService.timeFormat()}" locale = "#{userContextService.getCalendarLocale()}" value="#{workScheduleController.endBatchDate}" required="true" requiredMessage="#{msg.EndTime} #{msg.ValidationRequire}" showOn="button" disabled="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">#{msg.Personnel}*</label>
                        <p:selectManyMenu value="#{workScheduleController.selectedUserList}" var="t" converter="userAccountConverter" required="true" filter="true" filterMatchMode="contains" showCheckbox="true" requiredMessage="#{msg.PersonnelCannotBeEmpty}">
                            <f:selectItems value="#{workScheduleController.userList}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
                            <p:column>
                                <h:outputText value="#{t.name}" />
                            </p:column>
                        </p:selectManyMenu>
                    </h:panelGroup>
                    <h:panelGroup >
                        <label class="label">#{msg.BatchWorkScheduleType}*</label>
                        <div style="border: 1px solid #bdbdbd">
                            <br/>
                            <p:selectManyCheckbox required="true"  id="grid3" value="#{workScheduleController.selectedOptions2}"  valueChangeListener="#{workScheduleController.valueChangeListener}"
                                                  layout="pageDirection" columns="1" styleClass="grid-checkbox grid3"   requiredMessage="#{msg.BatchWorkScheduleTypecannotbeEmpty}">
                                <p:ajax listener="#{workScheduleController.selectedOptions2Changed}" update="grid3" />
                                <f:selectItem itemLabel="全选" itemValue="0"/>
                                <f:selectItem itemLabel="星期一" itemValue="1"/>
                                <f:selectItem itemLabel="星期二" itemValue="2"/>
                                <f:selectItem itemLabel="星期三" itemValue="3"/>
                                <f:selectItem itemLabel="星期四" itemValue="4"/>
                                <f:selectItem itemLabel="星期五" itemValue="5"/>
                                <f:selectItem itemLabel="星期六" itemValue="6"/>
                                <f:selectItem itemLabel="星期日" itemValue="7"/>
                            </p:selectManyCheckbox>
                            <p:selectManyCheckbox style="width: 200px" value="#{workScheduleController.shiftType}" required="true" requiredMessage="#{msg.BatchWorkScheduleTypecannotbeEmpty}">
<!--                                <f:selectItem itemLabel="#{msg.WeekDay}" itemValue="WeekDay" />-->
<!--                                <f:selectItem itemLabel="#{msg.WeekEnd}" itemValue="WeekEnd" />-->
<!--                                <f:selectItem itemLabel="#{msg.WeekEnd}" itemValue="WeekEnd" />-->
                                <f:selectItem itemLabel="#{msg.MorningShift}" itemValue="AM" />
                                <f:selectItem itemLabel="#{msg.NightShift}" itemValue="PM" />
                                <f:selectItem itemLabel="#{msg.AllDay}" itemValue="ALL"  />
                            </p:selectManyCheckbox>
                        </div>
                    </h:panelGroup>
                </p:panelGrid>

                <br/>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" actionListener="#{workScheduleController.batchSaveWorkSchedule}" update=":workScheduleResultDlg :growl" icon="ui-icon-check" oncomplete="batchAfter(xhr, status, args)"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('workScheduleBatchDialog').hide()"/>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
