<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>
        <p:dialog id="workScheduleBatchDlg" widgetVar="workScheduleBatchDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="周末排班">
            <h:form id="workScheduleBatchForm">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">开始时间*</label>
                        <p:calendar timeZone="GMT+8" pattern="yyyy-MM-dd" value="#{workScheduleController.startBatchDate}" required="true" requiredMessage="开始时间 #{msg.ValidationRequire}" showOn="button" disabled="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">结束时间*</label>
                        <p:calendar timeZone="GMT+8" pattern="yyyy-MM-dd" value="#{workScheduleController.endBatchDate}" required="true" requiredMessage="结束时间 #{msg.ValidationRequire}" showOn="button" disabled="false" showButtonPanel="true" navigator="true" mask="true"/>
                    </h:panelGroup>

                    <h:panelGroup>
                        <label class="label">人员*</label>
                        <p:selectManyMenu value="#{workScheduleController.selectedUserList}" var="t" converter="userAccountConverter" required="true" filter="true" filterMatchMode="contains" showCheckbox="true">
                            <f:selectItems value="#{workScheduleController.userList}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
                            <p:column>
                                <h:outputText value="#{t.name}" />
                            </p:column>
                        </p:selectManyMenu>
                    </h:panelGroup>
                    <h:panelGroup>
                        <label class="label">批量排班类型*</label>
                        <p:selectOneRadio value="#{workScheduleController.batchType}" required="true" requiredMessage="批量排班类型不能为空">
                            <f:selectItem itemLabel="工作日" itemValue="WeekDay" />
                            <f:selectItem itemLabel="周末" itemValue="WeekEnd" />
                        </p:selectOneRadio>
                    </h:panelGroup>
                </p:panelGrid>

                <br/>
                <br/>
                <p:commandButton validateClient="true" value="#{msg.Save}" action="#{workScheduleController.batchSaveWorkSchedule}" update=":growl" icon="ui-icon-check"/>
                <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('workScheduleBatchDialog').hide()"/>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
