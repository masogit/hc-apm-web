<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="userWorkScheduleBatchCreateDlg" widgetVar="userWorkScheduleBatchCreateDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{userWorkScheduleController.CRUDActionName} 周末排班">
        <h:form id="userWorkScheduleEditForm_Batch">
            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{userWorkScheduleController.selected != null}">

                <h:panelGroup>
                    <label class="label">开始时间*</label>
                    <p:calendar timeZone="GMT+8"  id="startDate_Batch" pattern="yyyy/MM/dd" value="#{userWorkScheduleController.startDate}" required="true" requiredMessage="开始时间 #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">结束时间*</label>
                    <p:calendar timeZone="GMT+8"  id="endDate_Batch" pattern="yyyy/MM/dd" value="#{userWorkScheduleController.endDate}" required="true" requiredMessage="结束时间 #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>

            </p:panelGrid>
            <br/>

            <p:fieldset legend="维修工程师选择" rendered="#{userWorkScheduleController.selected != null}">
                <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                    <h:panelGroup>
                        <label class="label">#{msg.hospitalId}</label>
                        <p:inputText id="selectedOrgName_Batch" value="#{userWorkScheduleController.selectedOrg==null ? '': userWorkScheduleController.selectedOrg.name}" readonly="true"/>
                        <p:commandButton id="btnOrg_Batch" process="@this" icon="fa fa-angle-down" class="btn btn-sm popupIconButton" style="width: 22px;height: 22px; padding-right: 0px;float: next;"/>
                        <p:overlayPanel id="popupPanel_Batch" widgetVar="varPanelOrg_Batch" for="btnOrg_Batch" hideEffect="fade" dynamic="false" class="ui-selectonemenu-panel" style="width:300px;" modal="false">
                            <p:scrollPanel style="height:300px;border: 0" mode="native">
                                <p:tree id="orgTree" class="tree" style="width:98%;border:0;" value="#{userWorkScheduleController.orgTree}" selection="#{userWorkScheduleController.selectedNode}" var="node" selectionMode="single">
                                    <p:ajax process="@this" event="select" update=":userWorkScheduleEditForm_Batch:selectedOrgName_Batch, :userWorkScheduleEditForm:UserAccountPickList" listener="#{userWorkScheduleController.onSelectTreeNode}" oncomplete="PF('varPanelOrg_Batch').hide();"/>
                                    <p:ajax process="@this" event="expand"/>
                                    <p:ajax process="@this" event="collapse"/>

                                    <p:treeNode type="org">
                                        <h:outputText value="#{node}"/>
                                    </p:treeNode>
									<p:treeNode type="hidden" rendered="false"/>
                                </p:tree>
                            </p:scrollPanel>
                        </p:overlayPanel>
                    </h:panelGroup>
                </p:panelGrid>
                <p:pickList id="UserAccountPickList_Batch" value="#{userWorkScheduleController.availableUserAccount}" var="item"
                            itemValue="#{item}" itemLabel="#{item.name}" showCheckbox="false" responsive="true"
                            showSourceFilter="true" showTargetFilter="true" filterMatchMode="contains" converter="userAccountConverter" >
                    <f:facet name="sourceCaption">待选维修工程师</f:facet>
                    <f:facet name="targetCaption">已选维修工程师</f:facet>
                    <p:ajax event="transfer" listener="#{userWorkScheduleController.onUserAccountTransfer}" />
                    <p:column style="width:60%">
                        <h:outputText value="#{item.name}" />
                    </p:column>
                    <p:column style="width:40%">
                        <h:outputText value="#{userWorkScheduleController.getSiteName(item.siteUID)}" />
                    </p:column>
                </p:pickList>
            </p:fieldset>
            <p:commandButton validateClient="true" value="#{msg.Save}" action="#{userWorkScheduleController.saveWorkBatch}" update=":growl" icon="ui-icon-check"/>

            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('userWorkScheduleBatchCreateDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
