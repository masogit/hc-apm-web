<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="userVacationScheduleEditDlg" widgetVar="userVacationScheduleEditDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{userVacationScheduleController.CRUDActionName} 休假">
        <h:form id="userVacationScheduleEditForm">
            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{userVacationScheduleController.selected != null}">

                <h:panelGroup>
                    <label class="label">开始日期*</label>
                    <p:calendar timeZone="GMT+8"  id="startDate" pattern="yyyy/MM/dd" value="#{userVacationScheduleController.startDate}" required="true" requiredMessage="开始时间 #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">结束日期*</label>
                    <p:calendar timeZone="GMT+8"  id="endDate" pattern="yyyy/MM/dd" value="#{userVacationScheduleController.endDate}" required="true" requiredMessage="结束时间 #{msg.ValidationRequire}" showOn="button" disabled="false"  Input="false" showButtonPanel="true" navigator="true" mask="true"/>
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">日期类型*</label>
                    <p:selectOneMenu value="#{userVacationScheduleController.scheduleDateStage}" style="width:125px" required="true" requiredMessage="日期类型不能为空">
                        <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                        <f:selectItem itemLabel="全天" itemValue="ALL" />
                        <f:selectItem itemLabel="上午" itemValue="AM" />
                        <f:selectItem itemLabel="下午" itemValue="PM" />
                    </p:selectOneMenu>
                </h:panelGroup>

            </p:panelGrid>
            <br/>

            <p:commandButton validateClient="true" value="#{msg.Save}" action="#{userVacationScheduleController.saveVacation}" update=":growl" icon="ui-icon-check"/>

            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('userWorkScheduleEditDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
