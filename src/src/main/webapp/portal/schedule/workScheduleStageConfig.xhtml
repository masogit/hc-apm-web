<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="scheduleDateStageDlg" widgetVar="scheduleDateStageDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="班次时间设置">
        <h:form id="scheduleDateStageForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                <!--<h:panelGroup>
                    <label class="label">全天*</label>
                    <p:calendar value="#{workScheduleController.startTime_all}" required="true" pattern="HH:mm:ss" timeOnly="true" showOn="button" showButtonPanel="true" navigator="true" mask="true" />
                    -
                    <p:calendar value="#{workScheduleController.endTime_all}" required="true" pattern="HH:mm:ss" timeOnly="true" showOn="button" showButtonPanel="true" navigator="true" mask="true" />
                </h:panelGroup>-->
                <h:panelGroup>
                    <label class="label">早班*</label>
                    <p:calendar value="#{workScheduleController.startTime_am}" required="true" pattern="HH:mm:ss" timeOnly="true" showOn="button" showButtonPanel="true" navigator="true" mask="true" />
                    -
                    <p:calendar value="#{workScheduleController.endTime_am}" required="true" pattern="HH:mm:ss" timeOnly="true" showOn="button" showButtonPanel="true" navigator="true" mask="true" />
                </h:panelGroup>
                <h:panelGroup>
                    <label class="label">晚班*</label>
                    <p:calendar value="#{workScheduleController.startTime_pm}" required="true" pattern="HH:mm:ss" timeOnly="true" showOn="button" showButtonPanel="true" navigator="true" mask="true" />
                    -
                    <p:calendar value="#{workScheduleController.endTime_pm}" required="true" pattern="HH:mm:ss" timeOnly="true" showOn="button" showButtonPanel="true" navigator="true" mask="true" />
                </h:panelGroup>

            </p:panelGrid>

            <br/>
            <br/>
            <p:commandButton validateClient="true" value="#{msg.Save}" action="#{workScheduleController.saveStageConfig}" update=":growl" icon="ui-icon-check" oncomplete="PF('scheduleDateStageDialog').hide()"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('scheduleDateStageDialog').hide()"/>
        </h:form>
    </p:dialog>
</ui:composition>
</html>
