<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="排班管理"/>
            </div>

            <div class="ui-g-12 card">
                <h:form>
                    <p:commandButton id="batchCreateButton" icon="ui-icon-extlink" value="批量创建周末排班" title="批量创建周末排班" actionListener="#{userWorkScheduleController.prepareBatchCreate}" update=":userWorkScheduleBatchCreateDlg" oncomplete="PF('userWorkScheduleBatchCreateDialog').show()"/>
                </h:form>
                <h:form id="userWorkScheduleListForm">
                    <p:dataTable id="datalist" value="#{userWorkScheduleController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{userWorkScheduleController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.id}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="deleteButton"/>
                        <p:ajax event="filter" listener="#{userWorkScheduleController.onFilter}" />

                        <p:column headerText="排班日期" sortBy="#{item.scheduleDate}" filterBy="#{item.scheduleDate}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterScheduleDate" widgetVar="varFilterScheduleDate"/>
                            </f:facet>
                            <h:outputText value="#{item.scheduleDate}">
                                <f:convertDateTime timeZone="GMT+8" pattern="yyyy/MM/dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="责任人" sortBy="#{item.userAccount.name}" filterBy="#{item.userAccount.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.userAccount.name}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{userWorkScheduleController.prepareCreate}" update=":userWorkScheduleEditDlg" oncomplete="PF('userWorkScheduleEditDialog').show()" />
                            <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{userWorkScheduleController.delete}" update=":userWorkScheduleListForm:datalist" disabled="#{empty userWorkScheduleController.selected.id}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                        </f:facet>

                    </p:dataTable>

                </h:form>

                <ui:include src="userWorkEdit.xhtml"/>
                <ui:include src="userWorkBatchCreate.xhtml"/>
            </div>
        </div>

        <p:overlayPanel widgetVar="panelFilterScheduleDate" for=":userWorkScheduleListForm:datalist:filterScheduleDate" dismissable="false">
            <h:panelGrid columns="2">
                <p:outputLabel value="#{msg.From}"/>
                <p:calendar timeZone="GMT+8"  widgetVar="varScheduleDateFrom" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
                <p:outputLabel value="#{msg.To}"/>
                <p:calendar timeZone="GMT+8"  widgetVar="varScheduleDateTo" pattern="yyyy/MM/dd" showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" locale="zh"/>
            </h:panelGrid>
            <p:commandButton onclick="setDateFilter('varDataList', 'varFilterScheduleDate', 'varScheduleDateFrom', 'varScheduleDateTo'); PF('panelFilterScheduleDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
            <p:commandButton onclick="PF('panelFilterScheduleDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
        </p:overlayPanel>
    </ui:define>

</ui:composition>
