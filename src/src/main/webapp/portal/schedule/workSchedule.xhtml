<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.WorkScheduleManagement}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="IouListForm">
                    <p:commandButton id="basic" value="#{workScheduleController.selectSite.name}" type="button" icon="fa fa-angle-down" iconPos="right"/>
                    <p:overlayPanel widgetVar="varPanelOrg" for="basic" hideEffect="fade" style="width:350px">
                        <p:scrollPanel style="height:300px;border: 0" mode="native">
                            <p:tree id="docs"  class="tree" style="width:98%;border:0;" value="#{workScheduleController.hospitalTree}" var="node" selectionMode="single"
                                    selection="#{tenantTreeController.selectedTenantOrgNode}" dynamic="true">
                                <p:ajax process="@this" event="select" listener="#{workScheduleController.onSelectSiteTreeNode}" update="IouListForm workScheduleForm" oncomplete="PF('varPanelOrg').hide();"/>
                                <p:treeNode type="org">
                                    <h:outputText value="#{node.name}"/>
                                </p:treeNode>
                            </p:tree>
                        </p:scrollPanel>
                    </p:overlayPanel>
                    <p:commandButton id="batchCreateButton"  value="#{msg.CreateWorkScheduleInBatch}" title="#{msg.CreateWorkScheduleInBatch}" update=":workScheduleBatchDlg" oncomplete="PF('workScheduleBatchDialog').show()" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ARRANGE_CREATE')}"/>
                    <p:commandButton id="batchDeleteButton"  value="批量删除" title="批量删除" update=":workScheduleBatchDeleteDlg" oncomplete="PF('workScheduleBatchDeleteDlg').show()" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ARRANGE_CREATE')}"/>
                    <p:commandButton id="scheduleDateStageButton"  value="#{msg.SequenceTimeSettings}" title="#{msg.SequenceTimeSettings}" update=":scheduleDateStageDlg" oncomplete="PF('scheduleDateStageDialog').show()" rendered="#{userContextService.accessContainsFunctionMenu('REPAIR_ARRANGE_CREATE')}"/>
                </h:form>
                <h:form id="workScheduleForm">
                    <p:growl widgetVar="messages" id="messages" showDetail="true" />

                    <h:panelGrid columnClasses="value">
                        <h3>#{msg.WorkScheduleCalendar}</h3>
                        <p:schedule id="workSchedule" value="#{workScheduleController.eventModel}" widgetVar="workSchedule" timeZone="#{userContextService.getTimeZone()}"   pattern="#{userContextService.timeFormat()}" locale = "#{userContextService.getCalendarLocale()}" centerHeaderTemplate="title" rightHeaderTemplate="" tooltip="true">
                            <p:ajax event="dateSelect" listener="#{workScheduleController.onDateSelect}" update="workScheduleDialog" oncomplete="PF('workScheduleDialog').show();" />
                            <p:ajax event="eventSelect" listener="#{workScheduleController.onEventSelect}" update="workScheduleDialog" oncomplete="PF('workScheduleDialog').show();" />
                        </p:schedule>
                    </h:panelGrid>

                    <p:dialog id="workScheduleDialog" widgetVar="workScheduleDialog" header="#{msg.WorkScheduleDetails}" showEffect="clip" hideEffect="clip">
                        <h:panelGroup>
                            <label class="label">#{msg.Date}*</label>
                            <p:calendar id="date_new" rendered="#{!workScheduleController.disableScheduleDate}" value="#{workScheduleController.scheduleDate}" timeZone="#{userContextService.getTimeZone()}" pattern="#{userContextService.timeFormat()}" mode="inline" navigator="true" locale = "#{userContextService.getCalendarLocale()}">
                                <p:ajax event="dateSelect" listener="#{workScheduleController.onScheduleValidate}" update="workScheduleForm:addButton"></p:ajax>
                            </p:calendar>
                            <p:calendar id="date_edit" rendered="#{workScheduleController.disableScheduleDate}" value="#{workScheduleController.scheduleDate}" disabled="true"  timeZone="#{userContextService.getTimeZone()}"  pattern="#{userContextService.timeFormat()}" locale = "#{userContextService.getCalendarLocale()}" />
                        </h:panelGroup>
                        <br/>
                        <br/>
                        <h:panelGroup>
                            <label class="label">#{msg.Personnel}*</label>
                            <p:selectOneMenu value="#{workScheduleController.userUID}" style="width:125px" required="true" requiredMessage="#{msg.PersonnelCannotBeEmpty}">
                                <p:ajax listener="#{workScheduleController.onScheduleValidateNew}" update="workScheduleForm:addButton"></p:ajax>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <c:choose >
                                    <c:when test="#{workScheduleController.edited}">
                                        <f:selectItems value="#{workScheduleController.editUserList}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                    </c:when>
                                    <c:otherwise>
                                        <f:selectItems value="#{workScheduleController.loadUserList()}" var="item" itemLabel="#{item.name}" itemValue="#{item.uid}"/>
                                    </c:otherwise>
                                </c:choose>
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <br/>
                        <br/>
                        <h:panelGroup>
                            <label class="label">#{msg.Sequence}*</label>
                            <p:selectOneMenu value="#{workScheduleController.scheduleDateStage}" style="width:125px" required="true" disabled="#{workScheduleController.disableScheduleDateStage}" requiredMessage="#{msg.SequenceCannotBeEmpty}">
                                <p:ajax listener="#{workScheduleController.onScheduleValidateNew}" update="workScheduleForm:addButton"></p:ajax>
                                <f:selectItem itemLabel="#{msg.selectOneMessage}"/>
                                <f:selectItem itemLabel="#{msg.AllDay}" itemValue="ALL" />
                                <f:selectItem itemLabel="#{msg.MorningShift}" itemValue="AM" />
                                <f:selectItem itemLabel="#{msg.NightShift}" itemValue="PM" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                        <br/>
                        <br/>
                        <p:commandButton id="addButton" value="#{msg.Save}" validateClient="true" actionListener="#{workScheduleController.addSchedule}" update="messages" disabled="#{workScheduleController.disableSave}" oncomplete="PF('workSchedule').update();PF('workScheduleDialog').hide();" />
                        <p:commandButton id="deleteButton" value="#{msg.Delete}" actionListener="#{workScheduleController.deleteSchedule}" disabled="#{workScheduleController.disableDelete}" oncomplete="PF('workSchedule').update();PF('workScheduleDialog').hide();" >
                            <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                        </p:commandButton>

                    </p:dialog>
                </h:form>

                <p:dialog header="批量排班结果" id="workScheduleResultDlg" widgetVar="workScheduleResultDialog" minHeight="40" appendTo="@this" modal="true" closable="false">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.UncreatedWorkScheduleRecord}</label>
                            <h:outputText value="#{workScheduleController.resultInfo}" style="color: red"/>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:commandButton validateClient="true" value="确认" action="#{workScheduleController.resultConfig}" icon="ui-icon-check"/>
                </p:dialog>

                <ui:include src="workScheduleBatch.xhtml"/>
                <ui:include src="workScheduleStageConfig.xhtml"/>
                <ui:include src="sharedAssetConfig.xhtml"/>
                <ui:include src="workScheduleBatchDelete.xhtml"/>
            </div>
        </div>

        <script>
            function batchAfter(xhr, status, args){
                if(args.flag == "Success"){
                    location.href = "workSchedule.xhtml";
                }else if(args.flag == "PartialSuccess"){
                    PF("workScheduleBatchDialog").hide();
                    PF("workScheduleResultDialog").show();
                }
            }
        </script>
    </ui:define>

</ui:composition>
