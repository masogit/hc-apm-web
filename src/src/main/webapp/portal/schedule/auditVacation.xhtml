<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:dialog id="auditVacationDlg" widgetVar="auditVacationDialog" modal="true" resizable="true" draggable="true" appendTo="@(body)" header="#{msg.VacationApproval}">
        <h:form id="auditVacationForm">
            <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group" rendered="#{userVacationScheduleController.selected != null}">

                <h:panelGroup rendered="#{userVacationScheduleController.auditInfo != ''}">
                    <label class="label">#{msg.ApprovalNotes}</label>
                    <h:outputText value="#{userVacationScheduleController.auditInfo}" style="color: red"/>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">#{msg.Date}</label>
                    <p:calendar id="date_edit" value="#{userVacationScheduleController.selected.scheduleDate}" disabled="true" timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"/>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">#{msg.DateType}</label>
                    <h:outputText value="#{userVacationScheduleController.getScheduleDateStageTitle(userVacationScheduleController.selected.scheduleDateStage)}"/>
                </h:panelGroup>

                <h:panelGroup>
                    <label class="label">#{msg.VacationApplicant2}</label>
                    <h:outputText value="#{userVacationScheduleController.selected.userAccount.name}"/>
                </h:panelGroup>

            </p:panelGrid>
            <br/>

            <p:commandButton validateClient="true" value="#{msg.Pass}" action="#{userVacationScheduleController.approveVacation(true)}" update=":userVacationScheduleListForm:datalist :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'auditVacationDialog');"/>
            <p:commandButton validateClient="true" value="#{msg.Reject}" action="#{userVacationScheduleController.approveVacation(false)}" update=":userVacationScheduleListForm:datalist :growl" icon="ui-icon-check" oncomplete="handleSubmit(args, 'auditVacationDialog');"/>
            <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('auditVacationDialog').hide()"/>
        </h:form>
    </p:dialog>

</ui:composition>

</html>
