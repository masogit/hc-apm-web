<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">

        <div class="ui-g">
            <div class="ui-g-12 card cardTitle">
                <p:outputLabel class="pageTitle" value="#{msg.VacationManagement}"/>
            </div>

            <div class="ui-g-12 card">
                <h:form id="userVacationScheduleListForm">
                    <h:panelGrid id="buttonSet" columns="12" cellpadding="5">
                        <p:commandButton value="#{msg.tobeReview}"  process="@this" disabled="#{userVacationScheduleController.queryStr == 'PendingApproval'}" rendered="true" action="userVacationList.xhtml?faces-redirect=true&amp;queryStr=PendingApproval" />
                        <p:commandButton value="#{msg.Approved3}"  process="@this" disabled="#{userVacationScheduleController.queryStr == 'Approved'}" rendered="true" action="userVacationList.xhtml?faces-redirect=true&amp;queryStr=Approved" />
                        <p:commandButton value="#{msg.NotApproved}"  process="@this" disabled="#{userVacationScheduleController.queryStr == 'NotApproved'}" rendered="true" action="userVacationList.xhtml?faces-redirect=true&amp;queryStr=NotApproved" />
                        <p:commandButton value="#{msg.All}"  process="@this" disabled="#{userVacationScheduleController.queryStr == 'All'}" rendered="true" action="userVacationList.xhtml?faces-redirect=true&amp;queryStr=All" />
                    </h:panelGrid>

                    <p:dataTable id="datalist" value="#{userVacationScheduleController.lazyModel}" var="item" widgetVar="varDataList"
                                 selectionMode="single" selection="#{userVacationScheduleController.selected}"
                                 lazy="true" paginator="true" paginatorPosition="both" paginatorAlwaysVisible="true"
                                 rowKey="#{item.id}" sortMode="single" sortOrder="descending" sortBy="#{item.scheduleDate}"
                                 paginatorTemplate="{CurrentPageReport} {Toolbar} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} #{msg.RowsPerPage}: {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg.recordCount}: {totalRecords}"
                                 rows="20" emptyMessage="#{msg.noRecordFound}"
                                 rowsPerPageTemplate="20,50,100,500">

                        <p:ajax event="rowSelect" update="deleteButton approveButton"/>
                        <p:ajax event="filter" listener="#{userVacationScheduleController.onFilter}" />

                        <p:column headerText="#{msg.VacationDate}" sortBy="#{item.scheduleDate}" filterBy="#{item.scheduleDate}" filterMatchMode="GTE">
                            <f:facet name="filter">
                                <p:inputText id="filterScheduleDate" widgetVar="varFilterScheduleDate"/>
                            </f:facet>
                            <h:outputText value="#{item.scheduleDate}">
                                <f:convertDateTime timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{msg.DateType}">
                            <h:outputText value="#{userVacationScheduleController.getScheduleDateStageTitle(item.scheduleDateStage)}"/>
                        </p:column>
                        <p:column headerText="#{msg.VacationApplicant}" sortBy="#{item.userAccount.name}" filterBy="#{item.userAccount.name}" filterMatchMode="LIKE">
                            <h:outputText value="#{item.userAccount.name}"/>
                        </p:column>
                        <p:column headerText="#{msg.ApprovalStatus}">
                            <h:outputText value="#{userVacationScheduleController.getAuditStatusTitle(item.auditStatus)}"/>
                        </p:column>

                        <f:facet name="{Toolbar}">
                            <p:commandButton id="createButton" icon="ui-icon-plus" class="btn btn-sm btn-gray" title="#{msg.Create}" actionListener="#{userVacationScheduleController.prepareCreate}" update=":userVacationScheduleEditDlg" oncomplete="PF('userVacationScheduleEditDialog').show()" />
                            <p:commandButton id="deleteButton" process="@this" icon="ui-icon-close" title="#{msg.Delete}" actionListener="#{userVacationScheduleController.delete}" update=":userVacationScheduleListForm:datalist" disabled="#{empty userVacationScheduleController.selected.id || userVacationScheduleController.selected.auditStatus=='Approved'}">
                                <p:confirm header="#{msg.DeleteConformation}" message="#{msg.DeleteConformationMsg}" icon="ui-icon-alert"/>
                            </p:commandButton>
                            <p:commandButton id="approveButton" icon="ui-icon-check" class="btn btn-sm btn-gray" title="#{msg.audit}" actionListener="#{userVacationScheduleController.validateAudit}" disabled="#{empty userVacationScheduleController.selected.id || userVacationScheduleController.selected.auditStatus!='PendingApproval' || !userContextService.hasRole('AssetHead')}" update=":auditVacationDlg" oncomplete="PF('auditVacationDialog').show()"/>
                        </f:facet>

                    </p:dataTable>

                </h:form>

                <p:dialog header="#{msg.VacationNotes}" id="vacationResultDlg" widgetVar="vacationResultDialog" minHeight="40" appendTo="@this" modal="true" closable="false">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank form-group">
                        <h:panelGroup>
                            <label class="label">#{msg.VacationConflictingTip}：</label>
                            <h:outputText value="#{userVacationScheduleController.vacationInfo}" style="color: red"/>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:commandButton validateClient="true" value="#{msg.ConfirmConfirm}" action="#{userVacationScheduleController.saveVacation}" icon="ui-icon-check" update=":userVacationScheduleListForm:datalist" oncomplete="PF('vacationResultDialog').hide()"/>
                    <p:commandButton immediate="true" process="@this" value="#{msg.Cancel}" icon="ui-icon-cancel" onclick="PF('vacationResultDialog').hide()"/>
                </p:dialog>

                <ui:include src="userVacationEdit.xhtml"/>
                <ui:include src="auditVacation.xhtml"/>
            </div>
        </div>

        <p:overlayPanel widgetVar="panelFilterScheduleDate" for=":userVacationScheduleListForm:datalist:filterScheduleDate" dismissable="false">
            <h:panelGrid columns="2">
                <p:outputLabel value="#{msg.From}"/>
                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varScheduleDateFrom"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
                <p:outputLabel value="#{msg.To}"/>
                <p:calendar timeZone="#{userContextService.getTimeZone()}" locale = "#{userContextService.getCalendarLocale()}"  pattern="#{userContextService.timeFormat()}"  widgetVar="varScheduleDateTo"  showOn="button" showButtonPanel="false" navigator="true" mask="true" size="12" />
            </h:panelGrid>
            <p:commandButton onclick="setDateFilter('varDataList', 'varFilterScheduleDate', 'varScheduleDateFrom', 'varScheduleDateTo'); PF('panelFilterScheduleDate').hide();" title="#{msg.Save}" icon="ui-icon-check" immediate="true" style="zoom: 0.8;"/>
            <p:commandButton onclick="PF('panelFilterScheduleDate').hide()" title="#{msg.Close}" icon="ui-icon-close" immediate="true" type="button" style="zoom: 0.8;"/>
        </p:overlayPanel>

        <script>
            function saveVacationBefor(xhr, status, args){
                if(args.flag == "Success"){
                    //location.href = "workSchedule.xhtml";
                }else if(args.flag == "Failed"){
                    PF("userVacationScheduleEditDialog").hide();
                    PF("vacationResultDialog").show();
                }
            }
        </script>

    </ui:define>

</ui:composition>
