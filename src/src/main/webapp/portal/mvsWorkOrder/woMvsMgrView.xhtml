<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:composition>
        <script type="text/javascript" src="#{request.contextPath}/portal/js/viewer.min.js"></script>
        <link rel="stylesheet" href="#{request.contextPath}/portal/css/viewer.min.css"/>
        <div class="ui-g-12 card">
            <h:form id="woMvsMgrDetailForm">
                <p:fieldset legend="SR内容" rendered="#{not empty mvsTransactionWorkController.selected}">
                        <div class="ui-g">
                            <div class="ui-g-10 ui-g-nopad">
                                <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group">
                                     <h:panelGroup>
                                        <label class="label">SR编号</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.selected.maintenanceOrderDTO.srNum}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">WF#/IOU#</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.selected.maintenanceOrderDTO.crcWf}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">医院</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.selected.maintenanceOrderDTO.accountName}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">合同号</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.selected.maintenanceOrderDTO.contractNo}" />
                                    </h:panelGroup>
                                   <!-- <h:panelGroup>
                                        <label class="label">故障类别</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.getFaultTypeName(mvsTransactionWorkController.selected.maintenanceOrderDTO.faultType)}"/>
                                    </h:panelGroup>-->
                                    <h:panelGroup>
                                        <label class="label">销售姓名</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.selected.maintenanceOrderDTO.salesName}" />
                                    </h:panelGroup><h:panelGroup>
                                        <label class="label">Account开单类型</label>
                                        <h:outputLabel value="#{fieldMsg.fieldValues('reportTypeAcctEhome', mvsTransactionWorkController.selected.maintenanceOrderDTO.reportTypeAcct)}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <label class="label">工单描述</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.selected.maintenanceOrderDTO.faultDesc}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">客户姓名</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.selected.maintenanceOrderDTO.customerName}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">客户电话</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.selected.maintenanceOrderDTO.customerTel}" />
                                    </h:panelGroup>
                                    <h:panelGroup styleClass="field-group">
                                        <label class="label">开单时间</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.selected.workOrderDTO.creationTime}">
                                            <f:convertDateTime pattern="yyyy.MM.dd, HH:mm:ss" timeZone="GMT+8"/>
                                        </p:outputLabel>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <label class="label">接单时间</label>
                                        <h:outputText value="#{mvsTransactionWorkController.selected.maintenanceOrderDTO.acceptanceTime}">
                                            <f:convertDateTime pattern="yyyy.MM.dd, HH:mm:ss" timeZone="GMT+8"/>
                                        </h:outputText>
                                     </h:panelGroup>
                                    <h:panelGroup styleClass="field-group">
                                        <label class="label">关单时间</label>
                                        <p:outputLabel value="#{mvsTransactionWorkController.selected.workOrderDTO.closeTime}">
                                            <f:convertDateTime pattern="yyyy.MM.dd, HH:mm:ss" timeZone="GMT+8"/>
                                        </p:outputLabel>
                                    </h:panelGroup>
                                </p:panelGrid>
                            </div>
                            <div class="ui-g-2">
                                <h:outputText value="验收人签名：" />
                                <div class="container-fluid" style="height: 200px; width: 200px;">
                                    <p:graphicImage rendered="#{not empty mvsTransactionWorkController.ackSignature}" value="#{fileDownloadService.getFile(mvsTransactionWorkController.ackSignature)}" stream="false" style="max-width: 100%;height: auto"/>
                                </div>
                            </div>
                        </div>
                        <p:fieldset legend="工单内容" toggleable="false" >
                            <p:panelGrid columns="3" layout="grid" styleClass="ui-panelgrid-blank form-group" columnClasses="col-field,col-field,col-field">
                                <!-- 基础信息列 -->
                                <h:panelGroup styleClass="field-group">
                                    <label class="label">工单主类型</label>
                                     <h:outputText value="#{fieldMsg.fieldValues('workOrderEhomeMani', mvsTransactionWorkController.selected.parentKey)}"  styleClass="value"/>
                                </h:panelGroup>
                                <h:panelGroup styleClass="field-group">
                                    <label class="label">工单子类型</label>
                                    <c:set var="dynamicKey" value="#{mvsTransactionWorkController.selected.typeKey}"/>
                                    <h:outputText value="#{fieldMsg.fieldValues('workOrderEhome', dynamicKey)}"  styleClass="value"/>
                                 </h:panelGroup>
                                <h:panelGroup styleClass="field-group">
                                    <label class="label">工程师</label>
                                    <p:outputLabel value="#{mvsTransactionWorkController.selected.workOrderDTO.engineer}"
                                                   styleClass="value"/>
                                </h:panelGroup>
                                <!-- 编号状态列 -->
                                <h:panelGroup styleClass="field-group">
                                    <label class="label">工单编号</label>
                                    <p:outputLabel value="#{mvsTransactionWorkController.selected.workOrderDTO.workOrderNumber}"
                                                   styleClass="value highlight"/>
                                </h:panelGroup>
                                <h:panelGroup styleClass="field-group">
                                    <label class="label">工单状态</label>
                                    <h:outputText value="#{fieldMsg.fieldValues('woStatusEhome', mvsTransactionWorkController.selected.workOrderDTO.status)}"  styleClass="value"/>
                                </h:panelGroup>
                                <h:panelGroup styleClass="field-group">
                                    <label class="label">创建人</label>
                                    <p:outputLabel value="#{mvsTransactionWorkController.selected.workOrderDTO.ownerName}"
                                                   styleClass="value"/>
                                </h:panelGroup>
                                <h:panelGroup styleClass="field-group">
                                    <label class="label">到场时间</label>
                                    <p:outputLabel value="#{mvsTransactionWorkController.selected.workOrderDTO.signInTime}">
                                        <f:convertDateTime pattern="yyyy.MM.dd, HH:mm:ss" timeZone="GMT+8"/>
                                    </p:outputLabel>
                                </h:panelGroup>
                                <h:panelGroup styleClass="field-group">
                                    <label class="label">总工时(小时)</label>
                                    <p:outputLabel value="#{mvsTransactionWorkController.selected.totalManHour}"
                                                   styleClass="value"/>
                                </h:panelGroup>
                                <!-- 描述信息列（长文本特殊处理） -->
                                <h:panelGroup styleClass="field-group full-width">
                                    <label class="label">问题描述P</label>
                                    <p:outputLabel value="#{mvsTransactionWorkController.selected.workOrderDTO.problemDescription}"
                                                   styleClass="value long-text"/>
                                </h:panelGroup>
                                <h:panelGroup styleClass="field-group full-width">
                                    <label class="label">服务描述A</label>
                                    <p:outputLabel value="#{mvsTransactionWorkController.selected.workOrderDTO.serviceDescription}"
                                                   styleClass="value long-text"/>
                                </h:panelGroup>
                                <h:panelGroup styleClass="field-group full-width">
                                    <label class="label">检测结果T</label>
                                    <p:outputLabel value="#{mvsTransactionWorkController.selected.workOrderDTO.detectionResult}"
                                                   styleClass="value long-text"/>
                                </h:panelGroup>
                            </p:panelGrid>


                            <p:dataGrid var="woAttachItemE" value="#{mvsTransactionWorkController.attachListEhome}" columns="4" layout="grid" rendered="#{not empty mvsTransactionWorkController.attachListEhome}">
                                <f:facet name="header">#{msg.AttachmentUpload}</f:facet>
                                <!-- 非 IMG 类型的面板 -->
                                <p:panel style="text-align:center"
                                         rendered="#{woAttachItemE.boType != 'IMG'}">
                                    <h:panelGrid columns="1" style="width:100%">
                                        #{woAttachItemE.objectName}
                                        <p:commandLink validateClient="false" immediate="true" process="@this"
                                                       value="下载文件"
                                                       action="#{fileDownloadService.downloadFileForEhome(woAttachItemE.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/><br/>
                                    </h:panelGrid>
                                </p:panel>
                                <!-- IMG 类型的面板 -->
                                <p:panel style="text-align:center"
                                         rendered="#{woAttachItemE.boType == 'IMG'}">
                                    <h:panelGrid columns="1" style="width:100%">
<!--
                                        <p:ajax  event="click" update=":previewedDlg" oncomplete="PF('previewedDlg').show()" listener="#{preViewerBean.onServerEvent(mvsTransactionWorkController,woAttachItemE.objectStorageId)}"/>
-->
                                        <p:graphicImage value="#{fileDownloadService.getFile(woAttachItemE.objectStorageId)}"
                                                        height="80" width="100" stream="false"/>
                                    </h:panelGrid>
                                    <p:commandLink validateClient="false" immediate="true" process="@this" value="#{woAttachItemE.objectName}" action="#{fileDownloadService.downloadFileForEhome(woAttachItemE.objectStorageId)}" ajax="false"  styleClass="p-mr-2"/>
                                </p:panel>
                              </p:dataGrid>


                              <h:panelGroup rendered="#{not empty mvsTransactionWorkController.selected.partsContextData}">
                                <label class="label">#{msg.UsedPart}</label>
                                <p:dataTable id="x3" class="cl3" value="#{mvsTransactionWorkController.selected.partsContextData}" var="detailItem">
                                         <p:column headerText="备件名称">
                                            <h:outputText value="#{detailItem.partName}" />
                                        </p:column>
                                         <p:column headerText="备件描述">
                                            <h:outputText value="#{detailItem.partDescription}" />
                                        </p:column>
                                        <p:column headerText="数量">
                                            <h:outputText value="#{detailItem.quantity}" />
                                        </p:column>
                                        <p:column headerText="备件序列号">
                                            <h:outputText value="#{detailItem.partSerialNum}" />
                                        </p:column>

                                        <p:column headerText="备件号">
                                            <h:outputText value="#{detailItem.partNumber}" />
                                        </p:column>

                                        <p:column headerText="申请单号">
                                            <h:outputText value="#{detailItem.purchaseOrderNo}" />
                                        </p:column>

                                        <p:column headerText="审批状态">
                                            <h:outputText value="#{detailItem.stepStatus}" />
                                        </p:column>

                                        <p:column headerText="审批人">
                                            <h:outputText value="#{detailItem.operatorName}" />
                                        </p:column>

                                        <p:column headerText="审批意见">
                                            <h:outputText value="#{detailItem.comments}" />
                                        </p:column>

                                        <p:column headerText="当前节点">
                                            <h:outputText value="#{detailItem.stepName}" />
                                        </p:column>

                                        <p:column headerText="待审批人">
                                            <h:outputText value="#{detailItem.pendingUserSso}" />
                                        </p:column>
                                    </p:dataTable>
                             </h:panelGroup>
                             <h:panelGroup rendered="#{not empty mvsTransactionWorkController.selected.hoursContextData}">
                                <label class="label">工时信息</label>
                                <p:dataTable  value="#{mvsTransactionWorkController.selected.hoursContextData}" var="coWorkerItem" lazy="false" paginator="false"
                                              rowKey="#{coWorkerItem.recordId}"  rows="1000" emptyMessage="#{msg.noRecordFound}" >
                                    <p:column headerText="工时类型">
                                         <h:outputText value="#{fieldMsg.fieldValues('workOrderHoursTypeEhome', coWorkerItem.type)}"  styleClass="value"/>
                                    </p:column>
                                    <p:column headerText="开始时间">
                                        <h:outputText value="#{coWorkerItem.startTime}">
                                            <f:convertDateTime pattern="yyyy.MM.dd, HH:mm:ss" timeZone="GMT+8"/>
                                        </h:outputText>
                                    </p:column>
                                    <p:column headerText="结束时间">
                                        <h:outputText value="#{coWorkerItem.endTime}">
                                            <f:convertDateTime pattern="yyyy.MM.dd, HH:mm:ss" timeZone="GMT+8"/>
                                         </h:outputText>
                                    </p:column>
                                 <p:column headerText="工时(小时)">
                                     <h:outputText value="#{coWorkerItem.workingHours}">
                                         <f:convertNumber maxFractionDigits="2"/>
                                     </h:outputText>
                                 </p:column>
                                 <p:column headerText="备注">
                                     <h:outputText value="#{coWorkerItem.tag}"/>
                                 </p:column>
                                </p:dataTable>
                            </h:panelGroup>
                        </p:fieldset>
                </p:fieldset>

            </h:form>
            <p:dialog id="previewedDlg" width="1000" height="800"  widgetVar="previewedDlg" modal="true" howEffect="fade"  maximizable="true" appendTo="@this">
                <c:choose>
                    <c:when test="#{preViewerBean.type eq 0}">
                        <p:graphicImage value="#{fileDownloadService.getFile(preViewerBean.getObjectId())}" stream="false"   width="100%" height="780px" />
                    </c:when>
                    <c:when test="#{preViewerBean.type eq 1}">
                        <embed src="#{preViewerBean.pdfUrl}" type="application/pdf"  width="100%" height="780px" />
                    </c:when>
                    <c:otherwise>
                        <h:outputText value="预览失败！" />
                    </c:otherwise>
                </c:choose>
            </p:dialog>

        </div>
    </ui:composition>
</html>
