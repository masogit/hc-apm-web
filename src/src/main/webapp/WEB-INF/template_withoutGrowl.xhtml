<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:insert name="preRenderView"/>
<h:head>
    <f:facet name="first">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="theme-color" content="#{guestPreferences.themeColors[guestPreferences.theme]}" />
    </f:facet>
    <ui:include src="../commonHead.xhtml"/>
    <meta name="theme-color" content="#{guestPreferences.themeColors[guestPreferences.theme]}"/>
    <title>GE APM</title>
    <link rel="stylesheet" type="text/css" href="#{request.contextPath}/resources/css/shell.css" />
    <h:outputScript name="js/layout.js" library="ultima-layout"/>
    <h:outputScript name="js/ripple.js" library="ultima-layout"/>
    <h:outputScript name="js/swipe.js" library="ultima-layout"/>
    <h:outputScript name="js/primefaces-locale_zh.js"/>
    <script type="text/javascript">
        if(PrimeFaces.widget.SelectOneMenu.prototype.bindFilterEvents)
        {
            var oldEvent = PrimeFaces.widget.SelectOneMenu.prototype.bindFilterEvents;
            PrimeFaces.widget.SelectOneMenu.prototype.bindFilterEvents = function() {
                var widgetInstance = this;
                oldEvent.call(widgetInstance);
                if (widgetInstance.filterInput) {
                    widgetInstance.filterInput.on('input', function(e) {
                        widgetInstance.filter($(this).val());
                    });

                }
            };

        }
    </script>
    <h:outputStylesheet name="css/main.css"/>
    <h:outputScript name="js/main.js"/>
    <ui:insert name="head"/>
</h:head>

<h:body styleClass="main-body #{guestPreferences.compact ? 'layout-compact' : null}">
    <ui:include src="./google-analytics.xhtml"/>
    <div class="layout-wrapper #{guestPreferences.menuLayout}">
        <ui:include src="./menu.xhtml"/>
        <ui:include src="/authorization.xhtml"/>
        <div class="layout-main">
            <ui:insert name="elements"/>
            <ui:insert name="content"/>
        </div>
        <div class="layout-profile" style="font-size: 14px; text-align: right;">
            <div class="profile-name">
                #{userContextService.loginUserOrgInfo.orgFullName}
            </div>
            <div class="profile-name">
                #{userContextService.userName}
            </div>
        </div>

    </div>

    <p:dialog widgetVar="statusDialog" modal="false" class="ajaxStatusDialog" draggable="false" closable="false" resizable="false" showHeader="false">
        <i class="fa fa-circle-o-notch fa-spin ajax-loader" style="zoom: 1.5;color: orange;" aria-hidden="true"></i>
    </p:dialog>

    <p:ajaxStatus onstart="PF('statusDialog').show()" oncomplete="PF('statusDialog').hide()"/>

    <h:outputStylesheet name="css/nanoscroller.css" library="ultima-layout"/>
    <h:outputStylesheet name="css/animate.css" library="ultima-layout"/>
    <h:outputStylesheet name="css/ripple.css" library="ultima-layout"/>
    <h:outputStylesheet name="css/layout-#{guestPreferences.theme}.css" library="ultima-layout"/>
    <h:outputStylesheet name="css/icon.css"/>
    <p:confirmDialog global="true">
        <p:commandButton process="@this" value="#{msg.Confirm}" type="button" styleClass="ui-confirmdialog-yes uiButton" icon="ui-icon-check"/>
        <p:commandButton process="@this" value="#{msg.Cancel}" type="button" immediate="true" styleClass="ui-confirmdialog-no uiButton" icon="ui-icon-close"/>
    </p:confirmDialog>
</h:body>

</html>
