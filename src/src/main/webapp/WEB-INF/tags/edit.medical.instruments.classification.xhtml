<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core">

<ui:composition>

    <p:inputText value="#{medicalInstrumentsClassificationCompCtrl.selectedAuthGroupName}"  readonly="true" class="selectedFullAuthGroupNameComponent"/>
    <p:commandButton id="btnFullAuthGroupComponent" process="@this" icon="fa fa-angle-down"
                     class="btn btn-sm popupIconButton"
                     disabled="#{disabled}"/>
    <p:overlayPanel widgetVar="varPanelFullSysAuthGroupComponent" for="btnFullAuthGroupComponent" hideEffect="fade" dynamic="false"
                    style="width:300px" modal="false">
        <p:scrollPanel style="height:300px;border: 0" mode="native">
            <p:tree class="tree" style="width:98%;border:0;"
                    value="#{medicalInstrumentsClassificationCompCtrl.sysAuthGroupTree}" var="node" selectionMode="single">
                <p:ajax process="@this" event="select" update="@(.selectedFullAuthGroupNameComponent) #{update}"
                        listener="#{medicalInstrumentsClassificationCompCtrl.onSelectSysAuthGroupTreeNode}"
                        oncomplete="PF('varPanelFullSysAuthGroupComponent').hide();"/>
                <p:ajax process="@this" event="expand"/>
                <p:ajax process="@this" event="collapse"/>

                <p:treeNode type="sysAuthGroup">
                    <h:outputText value="#{node.name}"/>
                </p:treeNode>
            </p:tree>
        </p:scrollPanel>
    </p:overlayPanel>

</ui:composition>

</html>
