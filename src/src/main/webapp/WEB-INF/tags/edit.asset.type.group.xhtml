<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
    <p:inputText id="selectedAssetTypeGroupNameComponent" value="#{assetTypeGroupTreeComponentController.selectedAssetTypeGroupName}"
                 required="#{required}"
                 requiredMessage="#{msg.assetTypeGroup} #{msg.ValidationRequire}"
                 readonly="#{readonly}" class="selectedAssetTypeGroupNameComponent #{updateAfterClinicalDeptChange}"/>
    <p:commandButton id="btnAssetTypeGroupComponent" process="@this" icon="fa fa-angle-down"
                     class="btn btn-sm popupIconButton"
                     disabled="#{disabled}"/>
    <p:overlayPanel widgetVar="varPanelAssetTypeGroupComponent" for="btnAssetTypeGroupComponent" hideEffect="fade" dynamic="false"
                    style="width:300px" modal="false">
        <p:scrollPanel style="height:300px;border: 0" mode="native">
            <p:tree id="assetTypeGroupTreeComponent" class="tree #{updateAfterClinicalDeptChange}" style="width:98%;border:0;"
                    value="#{assetTypeGroupTreeComponentController.currentAssetTypeGroupTree}" var="node" selectionMode="single">
                <p:ajax process="@this" event="select" update="@(.selectedAssetTypeGroupNameComponent) #{update}"
                        listener="#{assetTypeGroupTreeComponentController.onSelectAssetTypeGroupTreeNode}"
                        oncomplete="PF('varPanelAssetTypeGroupComponent').hide();"/>
                <p:ajax process="@this" event="expand"/>
                <p:ajax process="@this" event="collapse"/>
                <p:treeNode type="assetTypeGroup">
                    <h:outputText value="#{node.name}"/>
                </p:treeNode>
            </p:tree>
        </p:scrollPanel>
    </p:overlayPanel>
</ui:composition>

</html>
