<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core">

<ui:composition>
    <p:commandButton id="btnOutSideOrg"
                     value="#{hisOrgComponentController.selectedOrg == null?'所有医院':hisOrgComponentController.selectedOrg.name}"
                     type="button" icon="fa fa-angle-down" iconPos="right"/>
    <p:overlayPanel widgetVar="varPanelOutSideOrg" for="btnOutSideOrg" hideEffect="fade" dynamic="false"
                    style="width:250px" modal="false" appendTo="@form">
        <p:selectOneMenu value="#{hisOrgComponentController.selectedOrg}"  converter="orgInfoConverter">
            <p:ajax process="@this" event="itemSelect" listener="#{hisOrgComponentController.onSelectOutSideTreeNode}"
                    update="#{update}"  oncomplete="PF('varPanelOutSideOrg').hide();"/>
            <f:selectItem itemLabel="#{msg.SelectOneMessage}" itemValue="#{null}" noSelectionOption="true" />
            <f:selectItems value="#{hisOrgComponentController.orgInfoList}" var="item" itemLabel="#{item.name}" itemValue="#{item}" />
        </p:selectOneMenu>
    </p:overlayPanel>
</ui:composition>

</html>
