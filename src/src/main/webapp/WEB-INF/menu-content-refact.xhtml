    <script>
        function davinciToken() {
            var token = "#{userContextService.getAccessToken()}";
            var davinciUrl = "#{userContextService.queryDavinciUrl()}";
            fetch('/geapm/web/davinci-access-token?token='+ encodeURIComponent(token))
                .then(response => response.json())
                .then(data => {
                    var token = data.davinciToken;
                    var loginUser = data.loginUser;
                    localStorage.setItem("TOKEN", token || '');
                    localStorage.setItem("TOKEN_EXPIRE", (Date.now() + 86400000).toString());
                    localStorage.setItem("loginUser", loginUser || '');
                    window.open(davinciUrl,'_blank');
                })
                .catch(error => {
                    console.error('Error fetching token:', error);
                });
        }
        // 等待页面完全加载
        window.addEventListener('load', function() {
            // 延迟执行，确保所有动态内容已加载
            setTimeout(function() {
                var hash = window.location.hash;
                if(hash) {
                    var targetId = hash.substring(1);
                    // 尝试匹配以 'um5027' 结尾的ID
                    if(targetId.includes('/')){
                        return;
                    }
                    var element = document.querySelector('[id$='+targetId+']');
                    if (element) {
                        element.scrollIntoView({ behavior: 'smooth',block: 'center' });
                    } else {
                        console.log("未找到ID包含 '"+targetId+"' 的元素");
                    }
                }
            }, 100); // 调整延迟时间以适应应用加载速度
        });
    </script>
